statut: Préparation locale à valider avant publication ; S01–S10 conservées.
duree: 50
derniere_seance_preparee: 50
reference_programme: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
reference_dnb: https://www.education.gouv.fr/bo/2026/Hebdo4/MENE2623228N
references_pix:
    - https://www.education.gouv.fr/bo/2026/Hebdo6/MENE2527173N
    - https://pix.fr/eleve/
sequences:
    - id: MC
      titre: Comprendre et commander un monte-charge
      seances:
          - numero: 11
            titre: À quoi sert notre monte-charge ?
            duree: 50
            objectif: Décrire un besoin, des utilisateurs et une règle d’usage.
            entrainement_dnb: true
            ressource: https://edubase.eduscol.education.fr/fiche/24732
          - numero: 12
            titre: Qu’est-ce qui agit, qu’est-ce qui informe ?
            duree: 50
            objectif: Associer une fonction à un constituant.
            entrainement_dnb: false
            ressource: https://edubase.eduscol.education.fr/fiche/24732
          - numero: 13
            titre: Comment un bouton déclenche-t-il une action ?
            duree: 50
            objectif: Modifier un programme événementiel simple dans le simulateur.
            entrainement_dnb: false
            ressource: https://makecode.microbit.org/reference
          - numero: 14
            titre: Comment mémoriser une position ?
            duree: 50
            objectif: Utiliser une variable pour représenter un état.
            entrainement_dnb: false
            ressource: https://makecode.microbit.org/reference
          - numero: 15
            titre: Comment arrêter une montée au bon moment ?
            duree: 50
            objectif: Lire et tester une condition simple.
            entrainement_dnb: false
            ressource: https://makecode.microbit.org/reference
          - numero: 16
            titre: Une simulation suffit-elle à valider la maquette ?
            duree: 50
            objectif: Distinguer modèle et observation réelle.
            entrainement_dnb: false
            ressource: https://edubase.eduscol.education.fr/fiche/24732
          - numero: 17
            titre: "Expliquer et tester un monte-charge : premier entraînement"
            duree: 50
            objectif: Croiser des documents et justifier une conclusion courte.
            entrainement_dnb: true
            ressource: https://edubase.eduscol.education.fr/fiche/24732
    - id: EN
      titre: Comparer des solutions d’énergie
      seances:
          - numero: 18
            titre: Comment le vent peut-il produire de l’électricité ?
            duree: 50
            objectif: Repérer une source et des conversions d’énergie.
            entrainement_dnb: false
            ressource: https://mtaterre.fr/wp-content/uploads/2024/01/2024-01-cles-energie-guide-version-nationale.pdf
          - numero: 19
            titre: Comment comparer deux essais d’éolienne ?
            duree: 50
            objectif: Suivre un protocole donné et comparer des résultats.
            entrainement_dnb: false
            ressource: https://mtaterre.fr/wp-content/uploads/2024/01/2024-01-cles-energie-guide-version-nationale.pdf
          - numero: 20
            titre: Quelles pales choisir pour notre besoin ?
            duree: 50
            objectif: Comparer des solutions selon plusieurs critères.
            entrainement_dnb: false
            ressource: https://mtaterre.fr/wp-content/uploads/2024/01/2024-01-cles-energie-guide-version-nationale.pdf
          - numero: 21
            titre: "Éolienne ou panneau : est-ce toujours le même choix ?"
            duree: 50
            objectif: Choisir une solution en tenant compte du milieu.
            entrainement_dnb: false
            ressource: https://mtaterre.fr/wp-content/uploads/2024/01/2024-01-cles-energie-guide-version-nationale.pdf
          - numero: 22
            titre: Pourquoi orienter un panneau vers la lumière ?
            duree: 50
            objectif: Comparer des orientations à partir de données.
            entrainement_dnb: false
            ressource: https://makecode.microbit.org/projects/light-level-meter
          - numero: 23
            titre: Comment une mesure peut-elle déclencher un affichage ?
            duree: 50
            objectif: Modifier une condition à partir d’un seuil fourni.
            entrainement_dnb: false
            ressource: https://makecode.microbit.org/projects/light-level-meter
          - numero: 24
            titre: "Choisir et justifier : dossier énergie"
            duree: 50
            objectif: Utiliser deux critères et une preuve chiffrée.
            entrainement_dnb: true
            ressource: https://mtaterre.fr/wp-content/uploads/2024/01/2024-01-cles-energie-guide-version-nationale.pdf
    - id: PIX
      titre: Rechercher, conserver et partager une information
      seances:
          - numero: 25
            titre: "PIX : retrouver mon parcours et ma méthode"
            duree: 50
            objectif: Suivre un parcours numérique et identifier une aide utile.
            entrainement_dnb: false
            ressource: https://pix.fr/eleve/
          - numero: 26
            titre: Comment retrouver une information et sa source ?
            duree: 50
            objectif: Mener une recherche ciblée et organiser une trace.
            entrainement_dnb: false
            ressource: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
          - numero: 27
            titre: Comment partager sans exposer les autres ?
            duree: 50
            objectif: Distinguer partage utile, données personnelles et droit d’usage.
            entrainement_dnb: false
            ressource: https://pix.fr/eleve/
    - id: JEU
      titre: Créer un jeu de collecte et expliquer ses règles
      seances:
          - numero: 28
            titre: "Arcade : créer une mission de collecte"
            duree: 50
            objectif: Réutiliser sprites et événements pour un objectif technique.
            entrainement_dnb: false
            ressource: https://arcade.makecode.com/reference
          - numero: 29
            titre: "Arcade : à quoi sert un compteur ?"
            duree: 50
            objectif: Utiliser une variable et vérifier sa mise à jour.
            entrainement_dnb: false
            ressource: https://arcade.makecode.com/reference
          - numero: 30
            titre: "Arcade : gagner seulement si les conditions sont réunies"
            duree: 50
            objectif: Lire et modifier une condition dans un programme existant.
            entrainement_dnb: false
            ressource: https://arcade.makecode.com/reference
          - numero: 31
            titre: "Arcade : un jeu compréhensible pour quelqu’un d’autre"
            duree: 50
            objectif: Tester l’usage et améliorer une consigne.
            entrainement_dnb: false
            ressource: https://arcade.makecode.com/reference
          - numero: 32
            titre: "Arcade : expliquer son programme et ses tests"
            duree: 50
            objectif: Rendre compte d’un programme avec une preuve.
            entrainement_dnb: true
            ressource: https://arcade.makecode.com/reference
    - id: EAU
      titre: Concevoir une cuve intelligente simulée
      seances:
          - numero: 33
            titre: "Une cuve intelligente : pour quel besoin ?"
            duree: 50
            objectif: Exprimer le besoin et les limites d’un projet.
            entrainement_dnb: false
            ressource: https://www.eaufrance.fr/
          - numero: 34
            titre: Quelles informations faut-il à la cuve ?
            duree: 50
            objectif: Distinguer une entrée, un traitement et une sortie.
            entrainement_dnb: false
            ressource: https://makecode.microbit.org/reference
          - numero: 35
            titre: Quand faut-il arrêter de remplir ?
            duree: 50
            objectif: Modifier une règle liée à une limite.
            entrainement_dnb: false
            ressource: https://makecode.microbit.org/reference
          - numero: 36
            titre: Une eau claire est-elle forcément utilisable ?
            duree: 50
            objectif: Identifier une limite d’observation et de mesure.
            entrainement_dnb: false
            ressource: https://www.eaufrance.fr/
          - numero: 37
            titre: Comment donner priorité à une alerte ?
            duree: 50
            objectif: Lire l’ordre de décisions d’un programme.
            entrainement_dnb: false
            ressource: https://makecode.microbit.org/reference
          - numero: 38
            titre: "Décanter et filtrer : que peut-on attendre ?"
            duree: 50
            objectif: Associer une technique à son effet et à sa limite.
            entrainement_dnb: false
            ressource: https://www.eaufrance.fr/
          - numero: 39
            titre: Que décider si une information manque ?
            duree: 50
            objectif: Tester une situation inhabituelle avec une règle fournie.
            entrainement_dnb: true
            ressource: https://makecode.microbit.org/reference
          - numero: 40
            titre: Comment suivre les volumes de la cuve ?
            duree: 50
            objectif: Organiser et exploiter des données avec une unité.
            entrainement_dnb: false
            ressource: https://www.eaufrance.fr/
          - numero: 41
            titre: Réparer la cuve plutôt que tout remplacer ?
            duree: 50
            objectif: Comparer des solutions sur leur cycle de vie.
            entrainement_dnb: false
            ressource: https://mtaterre.fr/wp-content/uploads/2024/01/2024-01-cles-energie-guide-version-nationale.pdf
          - numero: 42
            titre: Une notice claire pour une cuve non potable
            duree: 50
            objectif: Communiquer une consigne et les limites d’un prototype.
            entrainement_dnb: false
            ressource: https://www.eaufrance.fr/
          - numero: 43
            titre: "Cuve intelligente : peut-on valider notre modèle ?"
            duree: 50
            objectif: Confronter des essais à trois exigences.
            entrainement_dnb: true
            ressource: https://makecode.microbit.org/reference
    - id: PROJET
      titre: Améliorer, réaliser et valider une solution numérique
      seances:
          - numero: 44
            titre: Quel problème allons-nous améliorer ?
            duree: 50
            objectif: Choisir une amélioration réaliste et un critère de réussite.
            entrainement_dnb: false
            ressource: https://makecode.microbit.org/reference
          - numero: 45
            titre: Comment préparer un prototype testable ?
            duree: 50
            objectif: Organiser les tâches et prévoir un test avant de modifier.
            entrainement_dnb: false
            ressource: https://makecode.microbit.org/reference
          - numero: 46
            titre: Réaliser puis chercher un défaut
            duree: 50
            objectif: Modifier un programme ou document existant et conserver une preuve.
            entrainement_dnb: false
            ressource: https://makecode.microbit.org/reference
          - numero: 47
            titre: Présenter une amélioration avec des preuves
            duree: 50
            objectif: Comparer deux versions et expliquer une limite.
            entrainement_dnb: false
            ressource: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
    - id: BILAN
      titre: Réutiliser ses méthodes et préparer la suite
      seances:
          - numero: 48
            titre: "Entraînement DNB : un arrosage raisonné"
            duree: 50
            objectif: Traiter un dossier nouveau en réutilisant ses méthodes.
            entrainement_dnb: true
            ressource: https://www.eaufrance.fr/
          - numero: 49
            titre: Reprendre une difficulté avec une méthode précise
            duree: 50
            objectif: Choisir une reprise à partir d’une erreur réelle.
            entrainement_dnb: false
            ressource: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
          - numero: 50
            titre: "Mon bilan de l’année : expliquer, tester et progresser"
            duree: 50
            objectif: Relier ses apprentissages à des traces de travail.
            entrainement_dnb: true
            ressource: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
