statut: Proposition pédagogique, sans activation du calendrier du site
etablissement: college
matiere: techno
classe: 3e
duree_seance_minutes: 50
sequences:
    - id: SQ01
      titre: Prendre ses habitudes de travail
      objectif: Créer, conserver et expliquer les traces de ses essais.
      seances:
          - numero: 1
            titre: Comment travailler en technologie cette année ?
    - id: SQ02
      titre: Pourquoi les objets changent-ils ?
      objectif: Comparer les évolutions et justifier un choix technique.
      seances:
          - numero: 2
            titre: Pourquoi les objets techniques évoluent-ils ?
          - numero: 3
            titre: Comment les technologies transforment-elles la société ?
          - numero: 4
            titre: Comment choisir entre plusieurs solutions techniques ?
    - id: SQ03
      titre: "Éolienne : comment comparer sans se tromper ?"
      objectif: Mesurer, comparer et améliorer un protocole expérimental.
      seances:
          - numero: 5
            titre: Comment vérifier les performances d’une solution technique ?
          - numero: 6
            titre: Comment comparer expérimentalement plusieurs solutions ?
    - id: SQ04
      titre: "Données et réseaux : communiquer et se protéger"
      objectif: Comprendre les données, les échanges et la protection des accès.
      seances:
          - numero: 7
            titre: Comment une machine utilise-t-elle des données ?
          - numero: 8
            titre: Comment une information circule-t-elle dans un réseau ?
          - numero: 9
            titre: Comment faire communiquer plusieurs réseaux ?
          - numero: 10
            titre: Comment protéger ses données et ses comptes ?
    - id: SQ05
      titre: "Monte-charge : qui informe, qui décide, qui agit ?"
      objectif: Relier les composants aux fonctions et décrire un comportement.
      seances:
          - numero: 11
            titre: Comment circulent l’énergie et l’information dans le monte-charge ?
          - numero: 12
            titre: Quelles règles le monte-charge doit-il suivre ?
    - id: SQ06
      titre: "MakeCode Arcade : programmer un jeu et le déboguer"
      objectif: Utiliser événements, variables, conditions et répétitions dans un même petit jeu.
      seances:
          - numero: 14
            titre: Comment les événements font-ils fonctionner un jeu ?
          - numero: 15
            titre: Comment gérer le score et la victoire ?
          - numero: 16
            titre: Comment trouver et corriger une erreur dans le jeu ?
    - id: SQ07
      titre: "Monte-charge : prévoir, programmer, tester"
      objectif: Transférer les raisonnements d’Arcade au système réel et à son jumeau.
      seances:
          - numero: 17
            titre: Comment le programme du monte-charge commande-t-il les déplacements ?
          - numero: 18
            titre: Comment vérifier que ses réactions respectent les règles prévues ?
          - numero: 21
            titre: Comment comparer le monte-charge et son jumeau pour chercher un défaut ?
          - numero: 22
            titre: Quels choix de commande peuvent réduire l’énergie utilisée ?
    - id: SQ08
      titre: Concevoir un support utile en 3D
      objectif: Passer d’un besoin à un modèle numérique vérifié et expliqué.
      seances:
          - numero: 25
            titre: Quel support répondrait à un besoin précis ?
          - numero: 26
            titre: Comment rendre nos exigences vérifiables ?
          - numero: 27
            titre: Comment représenter notre solution ?
          - numero: 28
            titre: Comment construire un modèle 3D aux bonnes dimensions ?
          - numero: 29
            titre: Comment obtenir une première version complète ?
          - numero: 30
            titre: Comment vérifier le modèle sans l’imprimer ?
          - numero: 31
            titre: Comment l’adapter à un autre utilisateur ?
          - numero: 32
            titre: Comment expliquer notre solution dans une fiche technique ?
    - id: SQ09
      titre: "Mécanismes : guider, transmettre, éviter les blocages"
      objectif: Comprendre les mouvements et proposer une amélioration géométrique.
      seances:
          - numero: 33
            titre: Quels mouvements une liaison mécanique permet-elle ?
          - numero: 34
            titre: Comment représenter un mécanisme simple ?
          - numero: 35
            titre: Pourquoi un mécanisme peut-il se bloquer ?
    - id: SQ10
      titre: "Numérique et IA : vérifier avant de choisir"
      objectif: Examiner les données, les résultats et les impacts d’une solution.
      seances:
          - numero: 36
            titre: Comment les données influencent-elles une décision automatisée ?
          - numero: 37
            titre: Comment vérifier une réponse produite par une IA ?
          - numero: 38
            titre: Quelle amélioration réduit réellement l’impact environnemental ?
    - id: SQ11
      titre: Réussir un petit projet numérique
      objectif: Concevoir, programmer, tester et présenter avec une autonomie accompagnée.
      seances:
          - numero: 43
            titre: Comment définir un défi numérique réalisable ?
          - numero: 44
            titre: Comment organiser le programme ?
          - numero: 45
            titre: Comment obtenir une première version fonctionnelle ?
          - numero: 46
            titre: Comment tester et améliorer cette version ?
          - numero: 47
            titre: Comment présenter nos choix et nos limites ?
    - id: SQ12
      titre: Consolider et montrer ses progrès
      objectif: Reprendre les difficultés observées et rendre les progrès visibles.
      seances:
          - numero: 50
            titre: Que dois-je encore retravailler ?
          - numero: 51
            titre: Comment réutiliser mes acquis dans un petit défi ?
          - numero: 52
            titre: Comment montrer ma progression dans l’année ?
          - numero: 53
            titre: "Réserve : reprendre, terminer ou consolider selon les besoins"
    - id: PIX
      titre: Parcours transversal Pix
      objectif: Développer le profil et préparer la certification selon les besoins réels.
      seances:
          - numero: 13
            titre: Parcours de rentrée ou entraînement ciblé selon ce qui a déjà été fait
          - numero: 19
            titre: Vérifier sa préparation à la certification et renforcer son profil
          - numero: 41
            titre: Consolider les compétences repérées dans Pix Orga
          - numero: 42
            titre: Préparation finale ou reprise, selon le calendrier de l’établissement
    - id: DNB
      titre: Parcours transversal DNB 2027
      objectif: Mobiliser les acquis dans un dossier et expliquer son raisonnement.
      seances:
          - numero: 20
            titre: "Premier dossier : fonctionnement et algorithme, avec correction guidée"
          - numero: 23
            titre: "Entraînement : analyser un système et son programme"
          - numero: 24
            titre: Correction de S23 et amélioration des réponses
          - numero: 39
            titre: "Entraînement : conception, données et choix techniques"
          - numero: 40
            titre: Correction de S39 et reprise ciblée
          - numero: 48
            titre: Entraînement de synthèse avant les épreuves
          - numero: 49
            titre: Correction de S48 et priorités personnelles
