# Exemple entièrement fictif de structure à valider ; non chargé par le site.
# À compléter pour un vrai cours : reperes_officiels et ressources ciblées près des activités/questions.
# Règle et format : RESSOURCES-ET-RECHERCHE.md. Vérifier chaque lien avant intégration.
# Identité/version de la séance à porter dans le catalogue, séparément de ce contenu.
titre: "Préparer un petit achat"
theme: "Calculer et expliquer un prix"
pourquoi: "Anticiper une dépense permet de vérifier si son budget suffit."
application_quotidienne: "Préparer l’achat de quelques fournitures."
lien_precedent: "Nous avons réactivé la multiplication par un nombre entier."
prerequis:
    - "Comprendre qu’un prix unitaire est le prix d’un objet."
objectifs:
    connaissances:
        - "Le prix total dépend du prix unitaire et de la quantité."
    competences:
        - "Choisir un calcul et expliquer le résultat."
activites:
    - id: "a01"
      titre: "Prévoir la dépense"
      obligatoire: true
      pourquoi: "Choisir un calcul utile avant de payer."
      demarche:
          - "Repère le prix d’un objet et le nombre d’objets."
          - "Choisis le calcul, puis vérifie si le résultat semble plausible."
      consigne: "Un carnet coûte 2 euros. Tu souhaites en acheter 3."
      questions:
          - id: "q01"
            type: "nombre"
            enonce: "Quel est le prix total ?"
            unite: "€"
            aide: "Tu peux représenter les trois carnets et leur prix."
          - id: "q02"
            type: "qcm"
            enonce: "Quelle opération correspond à cette situation ?"
            choix:
                - id: "addition"
                  texte: "Additionner le prix et le nombre de carnets."
                - id: "multiplication"
                  texte: "Multiplier le prix d’un carnet par le nombre de carnets."
          - id: "q03"
            type: "texte"
            enonce: "Explique comment tu vérifierais que ton résultat est cohérent."
    - id: "a02"
      titre: "Pour aller plus loin"
      obligatoire: false
      pourquoi: "Essayer la même méthode dans une nouvelle situation."
      demarche:
          - "Choisis un autre nombre de carnets et explique ton calcul."
      consigne: "Cette activité est facultative et ne bloque pas la fin du travail obligatoire."
      questions:
          - id: "q01"
            type: "texte"
            enonce: "Propose ta nouvelle situation et sa méthode de résolution."
retenir:
    - "Je repère les données et je choisis une opération adaptée."
bilan:
    - "Quelle étape sais-tu expliquer ?"
    - "Pour quelle étape souhaiterais-tu de l’aide ?"
