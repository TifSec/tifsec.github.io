            <h3>3. Choix du mini-OAD Excel</h3>
            <p>
                On va se mettre dans la peau d’un gérant d’écurie / centre équestre (Fictif bien sûr, je n'ai aucune vraie idée du fonctionnement de ce genre de centre).
                <br>
                Vous avez plusieurs chevaux en pension ou en club.
                <br>
                Pour chacun, régulièrement vous vous demandez :
                <ul>
                    <li>Est-ce que je dois augmenter la ration ?</li>
                    <li>Est-ce que la ration est OK comme ça ?</li>
                    <li>Ou au contraire, est-ce que je dois un peu réduire ?</li>
                </ul>
                Ça, c’est typiquement une décision.
                <br>
                Aujourd’hui, on va essayer de fabriquer un mini Outil d’Aide à la Décision dans Excel qui, à partir de quelques informations sur un cheval, va vous proposer :
                <ul>
                    <li>Augmenter la ration</li>
                    <li>Ration OK</li>
                    <li>Réduire la ration</li>
                </ul>
                On ne va pas rentrer dans la ration hyper technique avec tous les nutriments, mais on va partir de quelques choses simples, qu’un soigneur peut observer tous les jours.
                <ul>
                    On va regarder 4 critères :
                    <li>Le type de cheval : est-ce que c’est un poney rustique, un cheval “normal”, ou un cheval sensible / de sport ?</li>
                    <li>Le niveau de travail : est-ce qu’il ne fait rien, un peu, moyen, ou beaucoup ?</li>
                    <li>La note d’état corporel : en gros, est-ce qu’il est trop maigre, correct, ou trop gras ?</li>
                    <li>L’évolution récente : est-ce qu’il perd, est-ce qu’il reste stable, ou est-ce qu’il prend du poids / de l’état ?</li>
                </ul>
                Imaginez un poney rustique, qui ne travaille presque pas, note 4 en état (bien rond), et qui prend encore du poids.
                <br>
                Intuitivement, vous ne vous dites pas ‘on augmente la ration’, hein ?
                <br>
                Maintenant, imaginez un cheval de sport sensible, qui travaille beaucoup, note 2 (un peu creux), et qui perd encore.
                <br>
                Là, on se dit plutôt : ‘Attention, il faut peut-être augmenter un peu la ration.’
                <br>
                Attention, ce qu’on va construire aujourd’hui dans Excel, ce n’est pas un logiciel de nutrition professionnelle, ce n’est pas un outil vétérinaire, c’est un mini-OAD <b>pédagogique</b>.
                <ul>
                    Le but, c’est de voir comment on passe :
                    <li>de critères observables sur le cheval</li>
                    <li>à des scores et des calculs dans Excel</li>
                    <li>puis à une décision simple : augmenter / OK / réduire</li>
                </ul>
                Donc, on ne va pas l’utiliser pour modifier vraiment les rations dans une écurie, mais pour comprendre comment raisonne un OAD.
                <br>
                Les vrais OAD de nutrition équine prennent en compte beaucoup plus de paramètres (types de fourrage, analyses, maladie, âge, etc.) et sont souvent validés par des nutritionnistes.
                <br>
                Nous, aujourd’hui, on fait une version simplifiée pour comprendre le principe.
            </p>

            <h3 style="margin-top: 20px; margin-bottom: 20px;">4. Travail Collaboratif et Partage de Projet (15 minutes)</h3>
            <p>La collaboration est un aspect essentiel de la gestion de projet. LibreOffice permet de partager des documents, de suivre les modifications et de travailler à plusieurs sur un même projet.</p>
        
            <h4 style="margin-top: 15px;">4.1. Partage de documents dans LibreOffice</h4>
            <ul>
                <li><strong>Partage via un réseau ou un service cloud :</strong> Stockez vos documents sur un serveur partagé ou une plateforme cloud pour permettre un accès simultané à plusieurs utilisateurs.</li>
                <li><strong>Suivi des modifications :</strong> Activez le suivi des modifications dans Writer pour voir qui a fait quels changements, et permettre d'accepter ou rejeter les modifications.</li>
                <li><strong>Versionnage :</strong> Enregistrez différentes versions de votre document pour suivre l'évolution du projet et pouvoir restaurer d'anciennes versions si nécessaire.</li>
            </ul>
        
            <h4 style="margin-top: 15px;">4.2. Communication efficace via LibreOffice</h4>
            <ul>
                <li><strong>Utilisation des commentaires :</strong> Ajoutez des commentaires dans les documents partagés pour poser des questions ou proposer des améliorations sans modifier directement le contenu.</li>
                <li><strong>Rédaction de comptes rendus :</strong> Utilisez Writer pour créer des comptes rendus de réunion et distribuer les décisions prises aux membres de l’équipe.</li>
            </ul>
