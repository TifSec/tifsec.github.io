- id: techno-cycle4-2024
  etablissement: college
  classes: [5e, 4e, 3e]
  matiere: techno
  titre: Technologie · cycle 4
  source: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
  source_annexe: https://www.education.gouv.fr/media/160782/download
  synthese: true
  description: Les neuf compétences de fin de cycle sont reformulées pour faciliter la lecture. Les attendus évoluent de la 5e à la 3e.
  themes:
    - titre: Usages, société et choix
      competences:
        - id: usages-evolution
          titre: Relier besoins, usages et changements techniques
        - id: interactions
          titre: Expliquer les relations entre objet, utilisateur et environnement
        - id: choix
          titre: Comparer des objets et justifier un choix
    - titre: Comprendre le fonctionnement
      competences:
        - id: fonctionnement
          titre: Expliquer composants, énergie et circulation des données
        - id: depannage
          titre: Trouver une panne et vérifier sa réparation
        - id: modifier-programme
          titre: Lire un programme et adapter son comportement
    - titre: Imaginer, réaliser et vérifier
      competences:
        - id: concevoir
          titre: Proposer puis fabriquer une solution adaptée
        - id: tester
          titre: Vérifier une solution par essais ou simulation
        - id: programmer
          titre: Construire un programme et le mettre au point
  seances:
    S02: [usages-evolution]
    S10: [usages-evolution]
    S10R: [usages-evolution]
    S11: [fonctionnement]
    S12: [fonctionnement, modifier-programme]

