version_papier:
    titre: Fiche papier — Reprendre les bons réflexes de calcul
    introduction: Le but n’est pas d’aller vite en devinant. Le but est de choisir une opération, de la poser clairement et de vérifier si le résultat a du sens.
    sections:
        - titre: 1. Décimaux et priorités
          blocs:
              - type: paragraphe
                texte: "Une calculatrice est comme un assistant : elle calcule ce qu’on lui demande, mais c’est à toi de choisir la bonne opération."
              - type: etapes
                elements:
                    - Pour 3,5 + 2 × 4, on fait d’abord la multiplication.
                    - 2 × 4 = 8.
                    - 3,5 + 8 = 11,5.
                    - Avec des parenthèses, (3,5 + 2) × 4 = 5,5 × 4 = 22.
        - titre: 2. Choisir l’opération
          blocs:
              - type: liste
                elements:
                    - "Ajouter des quantités : addition."
                    - "Chercher un écart ou ce qu’il reste : soustraction."
                    - "Répéter plusieurs fois le même prix : multiplication."
                    - "Partager en parts égales ou retrouver une valeur par part : division."
        - titre: 3. Vérifier avec la calculatrice
          blocs:
              - type: paragraphe
                texte: Avant de taper, estime le résultat. Après le calcul, demande-toi si la taille du résultat est plausible. Écris d’abord la formule, puis utilise la calculatrice pour vérifier.
          questions:
              - "Pour chaque situation du cours, écris : données → opération choisie → calcul → phrase réponse."
              - Explique pourquoi l’opération choisie convient.
        - titre: Je m’entraîne — même méthode que dans le cours
          blocs:
              - type: paragraphe
                texte: Reprends les étapes de l’exemple juste au-dessus. Écris une ligne par étape et garde les unités.
          questions:
              - Calcule 6,4 + 2 × 1,5 en respectant les priorités.
              - Calcule (6,4 + 2) × 1,5 et explique pourquoi le résultat change.
              - Vérifie le résultat à la calculatrice après l’avoir estimé.
        - titre: Je transfère — une situation nouvelle
          blocs:
              - type: paragraphe
                texte: Cette fois, les nombres ou le contexte changent. Commence par identifier ce que l’on cherche, puis choisis la méthode qui convient.
          questions:
              - Une structure achète 3 sacs à 18,75 € et paie 12 € de livraison. Écris le calcul dans le bon ordre.
              - Le budget est 70 €. Reste-t-il assez d’argent ? Montre le calcul et rédige une phrase.
