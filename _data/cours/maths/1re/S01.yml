titre: 'Séance 1 : Développer, résoudre ax + b = c, appliquer une formule'
themes:
- MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Comment transformer une expression, résoudre une équation simple et utiliser une formule de coût ?
competences_bo:
- MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
    - k(a + b) = ka + kb (développer) ; ka + kb = k(a + b) (factoriser).
    - 'ax + b = c : on enlève b, puis on divise par a.'
    - 'Appliquer une formule : remplacer les lettres par les nombres.'
    competences:
    - Développer et factoriser une expression simple.
    - Résoudre une équation ax + b = c.
    - Calculer avec une formule.
pourquoi:
- 'Aujourd’hui, trois notions : développer et factoriser, résoudre ax + b = c, appliquer une formule.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — Développer et factoriser
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: 'Développer, c’est transformer un produit en somme : 3(x + 4) devient 3x + 12.'
    -   type: paragraphe
        texte: 'Factoriser, c’est l’inverse : 5x + 10 devient 5(x + 2).'
    -   type: paragraphe
        texte: 'À retenir : k(a + b) = ka + kb.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - 'Développer : multiplie le nombre devant la parenthèse par chaque terme de la parenthèse.'
        - 'Factoriser : cherche le nombre qui divise tous les termes, et sors-le devant la parenthèse.'
        - 'Contrôle : en redéveloppant, tu dois retrouver l’expression de départ.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Avec une situation
    -   type: liste
        elements:
        - '3 chevaux reçoivent chacun x kg de foin et 4 kg de granulés : 3 × (x + 4).'
        - 'C’est aussi 3 fois x kg de foin plus 3 fois 4 kg : 3x + 12.'
    -   type: paragraphe
        texte: 2. Avec des nombres
    -   type: liste
        elements:
        - 3 × (10 + 4) = 3 × 14 = 42.
        - '3 × 10 + 3 × 4 = 30 + 12 = 42 : même résultat.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Pour une expression, donne le nombre demandé.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — 3(x + 4) = 3x + ? Que vaut le nombre ?
        aide: 3 × 4.
        calcul: true
    -   id: q02
        type: nombre
        enonce: 5(x + 6) = 5x + ? Que vaut le nombre ?
        aide: 5 × 6.
        calcul: true
    -   id: q03
        type: nombre
        enonce: 2(3x + 7) = 6x + ? Que vaut le nombre ?
        aide: 2 × 7.
        calcul: true
    -   id: q04
        type: nombre
        enonce: 4(x − 3) = 4x − ? Que vaut le nombre ?
        aide: 4 × 3.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Série B — 7x + 21 = 7(x + ?) Que vaut le nombre ?
        aide: 21 ÷ 7.
        calcul: true
    -   id: q06
        type: nombre
        enonce: 10x + 40 = ?(x + 4) Que vaut le facteur ?
        aide: Quel nombre divise 10 et 40 ?
        calcul: true
    -   id: q07
        type: nombre
        enonce: Pour x = 5, calcule 3(x + 4) pour vérifier qu’il vaut 3x + 12.
        aide: 3 × 9 (ou 15 + 12).
        calcul: true
-   id: a02
    titre: Partie 2 — Résoudre ax + b = c
    transition: 'Tu sais transformer une expression. Deuxième notion : trouver la valeur inconnue.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Résoudre une équation, c’est trouver la valeur de x qui rend l’égalité vraie.
    -   type: paragraphe
        texte: Pour ax + b = c, on défait les calculs dans l’ordre inverse.
    -   type: paragraphe
        texte: 'À retenir : ax + b = c → ax = c − b → x = (c − b) ÷ a.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Enlève b des deux côtés (ou ajoute-le s’il est négatif).
        - Divise les deux côtés par a.
        - Écris x = …
        - 'Contrôle : remplace x dans l’équation de départ.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. La balance
    -   type: liste
        elements:
        - Une égalité est comme une balance en équilibre.
        - Si on fait la même opération des deux côtés, elle reste en équilibre.
    -   type: paragraphe
        texte: 2. Défaire dans l’ordre inverse
    -   type: liste
        elements:
        - Pour fabriquer 3x + 5, on a fait × 3 puis + 5.
        - Pour retrouver x, on fait − 5 puis ÷ 3.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Donne la valeur de x.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — 2x + 3 = 11. x = ?
        aide: 2x = 8.
        calcul: true
    -   id: q02
        type: nombre
        enonce: 5x + 10 = 45. x = ?
        aide: 5x = 35.
        calcul: true
    -   id: q03
        type: nombre
        enonce: 4x − 6 = 18. x = ?
        aide: 4x = 24.
        calcul: true
    -   id: q04
        type: nombre
        enonce: 3x + 7 = 7. x = ?
        aide: 3x = 0.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Série B — 12x + 50 = 170. x = ?
        aide: 12x = 120.
        calcul: true
    -   id: q06
        type: nombre
        enonce: 0,5x + 2 = 9. x = ?
        aide: 0,5x = 7.
        calcul: true
    -   id: q07
        type: nombre
        enonce: Une pension coûte 50 € + 12 € par jour. Combien de jours pour 230 € ? (12x + 50 = 230)
        unite: jours
        aide: 12x = 180.
        calcul: true
-   id: a03
    titre: Partie 3 — Appliquer une formule
    transition: 'Dernière notion : utiliser une formule toute faite.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Une formule donne un résultat à partir de valeurs connues (prix, quantité, durée…).
    -   type: paragraphe
        texte: On remplace chaque lettre par sa valeur, puis on calcule.
    -   type: paragraphe
        texte: 'À retenir : Remplacer les lettres, puis calculer en respectant les priorités.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Recopie la formule.
        - Remplace chaque lettre par sa valeur (avec son unité dans ta tête).
        - 'Calcule : × et ÷ avant + et −.'
        - Écris le résultat avec son unité.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Ce qu’est une formule
    -   type: liste
        elements:
        - C’est un calcul qu’on refait souvent, écrit une fois pour toutes avec des lettres.
        - 'Coût = 50 + 12 × j veut dire : 50 € fixes plus 12 € par jour.'
    -   type: paragraphe
        texte: 2. Pourquoi les priorités
    -   type: liste
        elements:
        - 12 × j doit être fait avant d’ajouter 50.
        - 50 + 12 × 10 = 170, pas 620.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — C = 50 + 12 × j. Calcule C pour j = 10.
        unite: €
        aide: Remplace j.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Ration R = 0,02 × P (P en kg). Calcule R pour P = 550.
        unite: kg
        aide: 0,02 × 550.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Aire A = L × l. Calcule A pour L = 40 m et l = 25 m.
        unite: m²
        aide: 40 × 25.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Prix TTC = HT × 1,2. Calcule pour HT = 85 €.
        unite: €
        aide: 85 × 1,2.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Série B — Vitesse v = d ÷ t. Calcule v pour d = 36 km et t = 3 h.
        unite: km/h
        aide: 36 ÷ 3.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Coût C = 2,5 × q + 18. Calcule C pour q = 12.
        unite: €
        aide: 30 + 18.
        calcul: true
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: 6(x + 2) = 6x + ?
        calcul: true
    -   id: q02
        type: nombre
        enonce: 9x + 27 = 9(x + ?)
        calcul: true
    -   id: q03
        type: nombre
        enonce: 7x − 4 = 31. x = ?
        calcul: true
    -   id: q04
        type: nombre
        enonce: C = 2,5 × q + 18 = 68. q = ?
        calcul: true
retenir:
- 'Développer : k(a + b) = ka + kb.'
- 'Factoriser : ka + kb = k(a + b).'
- ax + b = c → x = (c − b) ÷ a.
- 'Formule : on remplace chaque lettre par sa valeur, puis on respecte les priorités.'
