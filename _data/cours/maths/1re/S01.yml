titre: 'Séance 1 : Reprendre les bons réflexes de calcul'
themes:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Quels automatismes de calcul dois-je maîtriser pour modéliser des situations professionnelles ?
competences_bo:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
        - 'Automatismes du référentiel : développer, factoriser, résoudre ax + b = c, appliquer une formule, lire un graphique, calculer une probabilité simple.'
        - Ces automatismes font gagner du temps dans tous les problèmes.
    competences:
        - Développer et factoriser simplement.
        - Résoudre une équation du premier degré.
pourquoi:
    - Tu entres en 1re Bac Pro CGEH.
    - Avant d’aborder les suites et la dérivation, on vérifie les bases.
activites:
    -   id: a01
        titre: Développer et factoriser
        consigne: Tu vas développer et factoriser trois expressions simples, comme celles des formules de coût. On attend les trois résultats écrits.
        contenu:
            -   type: titre
                texte: Exemple
            -   type: liste
                elements:
                    - 'Automatisme : calcule 7 × 8 et 0,5 × 240 de tête.'
            -   type: etapes
                elements:
                    - 'Exemple : 3(x + 4) = 3x + 12 ; 5x + 10 = 5(x + 2).'
                    - Applique.
            -   type: paragraphe
                texte: Pourquoi ? Les formules de coût s’écrivent souvent sous forme factorisée.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Développer k(a + b) donne …… + kb.
                        - ''
                    -   - Factoriser 5x + 10 donne 5( …… ).
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: texte
                enonce: Développe 4(2x + 5).
                aide: Une phrase complète qui reprend les mots de la question.
            -   id: q03
                type: texte
                enonce: Factorise 6x + 18.
                aide: Une phrase complète qui reprend les mots de la question.
            -   id: q04
                type: texte
                enonce: Développe (x + 2)(x + 3).
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a02
        titre: Résoudre ax + b = c
        transition: Les expressions sont maîtrisées. Résous une équation de la vie de l’écurie.
        consigne: Tu vas écrire et résoudre l’équation du nombre de jours d’une pension payée 435 €. On attend l’équation et la solution.
        contenu:
            -   type: etapes
                elements:
                    - Une pension coûte 25 € par jour + 60 € de frais. Le client a payé 435 €.
                    - Écris l’équation et résous-la.
            -   type: paragraphe
                texte: Pourquoi une équation ? On retrouve le nombre de jours sans essayer au hasard.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Pour résoudre ax + b = c, on soustrait d’abord …… des deux côtés.
                        - ''
                    -   - Puis on …… par a.
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: texte
                enonce: Écris l’équation.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
            -   id: q03
                type: nombre
                enonce: Combien de jours ?
                unite: jours
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a03
        titre: Appliquer une formule
        transition: Tu sais résoudre. Applique une formule dans les deux sens.
        consigne: Tu vas appliquer une formule d’estimation du poids dans les deux sens. On attend deux résultats.
        contenu:
            -   type: titre
                texte: Exemple
            -   type: paragraphe
                texte: Formule inventée pour l’exercice.
            -   type: etapes
                elements:
                    - 'Indice de masse simplifié (fictif pour l’exercice) : P = 2,5 × T − 30 où T est le tour de poitrine en cm et P le poids en kg.'
                    - Calcule.
            -   type: paragraphe
                texte: Pourquoi appliquer une formule ? Beaucoup d’outils professionnels sont des formules.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Appliquer une formule : on remplace la …… par sa valeur.'
                        - ''
                    -   - Dans l’autre sens, on …… une équation.
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: nombre
                enonce: Calcule P pour T = 190 cm.
                unite: kg
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q03
                type: nombre
                enonce: Quel tour de poitrine donne P = 470 kg ?
                unite: cm
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Résous 3(x − 2) = 2x + 7.
        questions:
            -   id: q01
                type: texte
                enonce: Montre les étapes.
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Les bases sont revues. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quels automatismes dois-tu maîtriser, et lequel dois-tu retravailler ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - k(a + b) = ka + kb.
    - ax + b = c → x = (c − b) ÷ a.
sources:
    -   type: lien
        titre: ChloroFil — Bac Pro, tronc commun rénové, document d’accompagnement du module MG1
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/bacpro/bacpro-tc-da-MG1.pdf
version_papier:
    surtitre: Cours à compléter puis exercices
    titre: Reprendre les bons réflexes de calcul
    introduction: Quels automatismes de calcul dois-je maîtriser pour modéliser des situations professionnelles ?
    sections:
        -   titre: I. Développer et factoriser
            blocs:
                -   type: liste
                    elements:
                        - 'Automatisme : calcule 7 × 8 et 0,5 × 240 de tête.'
                -   type: titre
                    texte: Points clés
                -   type: liste
                    elements:
                        - Développer k(a + b) donne …… + kb.
                        - Factoriser 5x + 10 donne 5( …… ).
                -   type: titre
                    texte: Exercice 1 — Développer et factoriser
            questions:
                - Développe 4(2x + 5).
                - Factorise 6x + 18.
                - Développe (x + 2)(x + 3).
        -   titre: II. Résoudre ax + b = c
            blocs:
                -   type: titre
                    texte: Points clés
                -   type: liste
                    elements:
                        - Pour résoudre ax + b = c, on soustrait d’abord …… des deux côtés.
                        - Puis on …… par a.
                -   type: titre
                    texte: Exercice 2 — Résoudre ax + b = c
            questions:
                - Écris l’équation.
                - Combien de jours ? (en jours)
        -   titre: III. Appliquer une formule
            blocs:
                -   type: titre
                    texte: Points clés
                -   type: liste
                    elements:
                        - 'Appliquer une formule : on remplace la …… par sa valeur.'
                        - Dans l’autre sens, on …… une équation.
                -   type: titre
                    texte: Exemple
                -   type: paragraphe
                    texte: Formule inventée pour l’exercice.
                -   type: titre
                    texte: Exercice 3 — Appliquer une formule
            questions:
                - Calcule P pour T = 190 cm. (en kg)
                - Quel tour de poitrine donne P = 470 kg ? (en cm)
        -   titre: Exercice 1 — Développer, factoriser
            blocs: []
            questions:
                - Développe 3(2x − 4).
                - Factorise 8x + 12.
            saut_page: true
            surtitre: Fiche d’exercices
        -   titre: Exercice 2 — Équations
            blocs: []
            questions:
                - Résous 4x + 7 = 31.
                - Un cours coûte 18 € + 12 € par séance ; facture 114 €. Nombre de séances ?
        -   titre: Exercice 3 — Formule
            blocs: []
            questions:
                - Avec P = 2,5T − 30, calcule P pour T = 180 cm.
