titre: 'Séance 1 : Reprendre les bons réflexes de calcul'
themes:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Quels automatismes de calcul dois-je maîtriser pour modéliser des situations professionnelles ?
competences_bo:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
        - 'Automatismes du référentiel : développer, factoriser, résoudre ax + b = c, appliquer une formule, lire un graphique, calculer une probabilité simple.'
        - Ces automatismes font gagner du temps dans tous les problèmes.
    competences:
        - Développer et factoriser simplement.
        - Résoudre une équation du premier degré.
pourquoi:
    - Tu entres en 1re Bac Pro CGEH.
    - Avant d’aborder les suites et la dérivation, on vérifie les bases.
activites:
    -   id: a01
        titre: Développer et factoriser
        consigne: Tu vas développer et factoriser trois expressions simples, comme celles des formules de coût. On attend les trois résultats écrits.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: 'Le coût d’une pension s’écrit parfois 3(x + 4) et parfois 3x + 12. Ce sont deux écritures du même calcul : il faut savoir passer de l’une à l’autre.'
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: 'Développer, c’est transformer un produit en somme : on « ouvre » la parenthèse. Factoriser, c’est le chemin inverse : on transforme une somme en produit en mettant en évidence un facteur commun.'
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Simplifier une formule de coût avant de l’utiliser.
                    - Faire apparaître ce qui est commun à plusieurs termes (le prix par jour, le nombre de chevaux).
                    - Préparer la résolution d’équations et l’étude de fonctions.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - 'Développer k(a + b) : on multiplie k par chaque terme de la parenthèse : k × a + k × b.'
                    - 'Développer (a + b)(c + d) : chaque terme de la 1re parenthèse multiplie chaque terme de la 2e (4 produits), puis on regroupe les termes semblables.'
                    - 'Factoriser : on cherche un facteur présent dans tous les termes, on l’écrit devant, et on met dans la parenthèse ce qui reste.'
                    - 'Vérifier une factorisation : on redéveloppe, on doit retrouver l’expression de départ.'
            -   type: paragraphe
                texte: 'À retenir : k(a + b) = ka + kb dans les deux sens : de gauche à droite on développe, de droite à gauche on factorise.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Développe 5(x + 3).
                    - Factorise 4x + 12.
                    - Développe (x + 1)(x + 5).
            -   type: liste
                elements:
                    - 'Automatisme : calcule 7 × 8 et 0,5 × 240 de tête.'
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : développe et factorise les expressions des questions.'
                    - Pourquoi ? Les formules de coût s’écrivent souvent sous forme factorisée.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Développer k(a + b) donne …… + kb.
                        - ''
                    -   - Factoriser 5x + 10 donne 5( …… ).
                        - ''
                aide: 'Relis l’exemple 3(x + 4) = 3x + 12 : le nombre devant la parenthèse multiplie chaque terme. Pour factoriser, cherche ce qui est commun à 5x et 10.'
            -   id: q02
                type: texte
                enonce: Développe 4(2x + 5).
                aide: Multiplie 4 par 2x, puis 4 par 5, et additionne.
            -   id: q03
                type: texte
                enonce: Factorise 6x + 18.
                aide: Cherche le plus grand nombre qui divise à la fois 6 et 18, puis mets-le devant la parenthèse.
            -   id: q04
                type: texte
                enonce: Développe (x + 2)(x + 3).
                aide: 'Comme dans l’exemple (x + 1)(x + 4) : chaque terme de la 1re parenthèse multiplie chaque terme de la 2e. Regroupe les x.'
    -   id: a02
        titre: Résoudre ax + b = c
        transition: Les expressions sont maîtrisées. Résous une équation de la vie de l’écurie.
        consigne: Tu vas écrire et résoudre l’équation du nombre de jours d’une pension payée 435 €. On attend l’équation et la solution.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Une pension coûte 25 € par jour plus 60 € de frais. Un client a payé 435 €. Combien de jours son cheval est-il resté ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Une équation du premier degré ax + b = c est une égalité avec une inconnue x. La résoudre, c’est trouver la valeur de x qui rend l’égalité vraie.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Retrouver une quantité inconnue (nombre de jours, de leçons, de sacs) à partir d’un montant payé.
                    - Éviter d’essayer des nombres au hasard.
                    - Vérifier une facture.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - On choisit l’inconnue et on écrit ce qu’elle représente (x = nombre de jours).
                    - 'On traduit l’énoncé en équation : prix par unité × x + frais fixes = montant payé.'
                    - 'On enlève la partie fixe b des deux côtés : ax = c − b.'
                    - 'On divise par a des deux côtés : x = (c − b) ÷ a. Puis on vérifie en remplaçant x dans l’équation.'
            -   type: paragraphe
                texte: 'À retenir : ax + b = c : on soustrait b, puis on divise par a. On fait toujours la même opération des deux côtés.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Résous 4x + 10 = 50.
                    - Une leçon coûte 18 € et la licence 30 €. Un cavalier a payé 210 €. Combien de leçons ?
                    - Résous 5x − 15 = 35.
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : une pension coûte 25 € par jour + 60 € de frais ; le client a payé 435 €. Écris l’équation et résous-la.'
                    - Pourquoi une équation ? On retrouve le nombre de jours sans essayer au hasard.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Pour résoudre ax + b = c, on soustrait d’abord …… des deux côtés.
                        - ''
                    -   - Puis on …… par a.
                        - ''
                aide: 'Relis l’exemple des leçons : qu’a-t-on enlevé en premier des deux côtés (15x + 20 = 140) ? Puis quelle opération pour trouver x ?'
            -   id: q02
                type: texte
                enonce: Écris l’équation.
                aide: Appelle x le nombre de jours. Prix par jour × x + frais fixes = montant payé (valeurs de « À toi »).
            -   id: q03
                type: nombre
                enonce: Combien de jours ?
                unite: jours
                aide: 'Résous ton équation comme l’exemple : enlève les frais fixes, puis divise par le prix par jour. Vérifie en remplaçant.'
    -   id: a03
        titre: Appliquer une formule
        transition: Tu sais résoudre. Applique une formule dans les deux sens.
        consigne: Tu vas appliquer une formule d’estimation du poids dans les deux sens. On attend deux résultats.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: 'Pour estimer le poids d’un cheval sans balance, on mesure son tour de poitrine T et on utilise une formule (inventée pour l’exercice) : P = 2,5 × T − 30.'
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: 'Une formule est une recette de calcul écrite avec des lettres : chaque lettre représente une grandeur. L’appliquer, c’est remplacer les lettres connues par leur valeur.'
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - 'Utiliser les outils professionnels : estimation du poids, ration, dose de vermifuge, coût.'
                    - Dans l’autre sens, retrouver une grandeur à partir du résultat.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - 'Sens direct : on remplace la lettre par sa valeur, puis on calcule en respectant les priorités (× avant −).'
                    - 'Sens inverse : on connaît le résultat ; on écrit l’équation et on la résout comme dans la partie précédente.'
                    - On n’oublie pas l’unité du résultat.
            -   type: paragraphe
                texte: 'À retenir : Appliquer une formule = remplacer, puis calculer. Dans l’autre sens = résoudre une équation.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Avec P = 2,5 × T − 30, calcule P pour T = 160 cm.
                    - Avec la même formule, quel tour de poitrine donne P = 345 kg ?
            -   type: paragraphe
                texte: Formule inventée pour l’exercice.
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : utilise la formule P = 2,5 × T − 30 (T : tour de poitrine en cm, P : poids en kg) pour les deux questions.'
                    - Pourquoi appliquer une formule ? Beaucoup d’outils professionnels sont des formules.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Appliquer une formule : on remplace la …… par sa valeur.'
                        - ''
                    -   - Dans l’autre sens, on …… une équation.
                        - ''
                aide: 'Appliquer une formule, c’est remplacer la… par un nombre. Dans l’autre sens, on connaît P : que faut-il résoudre ?'
            -   id: q02
                type: nombre
                enonce: Calcule P pour T = 190 cm.
                unite: kg
                aide: 'Remplace T par 190 dans P = 2,5 × T − 30 : fais d’abord la multiplication.'
            -   id: q03
                type: nombre
                enonce: Quel tour de poitrine donne P = 470 kg ?
                unite: cm
                aide: 'Écris 2,5 × T − 30 = 470, puis fais comme l’exemple : ajoute 30, divise par 2,5.'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Résous 3(x − 2) = 2x + 7.
        questions:
            -   id: q01
                type: texte
                enonce: Montre les étapes.
                aide: Développe 3(x − 2), puis regroupe les x d’un côté et les nombres de l’autre, étape par étape.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Les bases sont revues. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quels automatismes dois-tu maîtriser, et lequel dois-tu retravailler ?'
                aide: 'Dis ce que tu sais faire : développer, factoriser, résoudre ax + b = c, appliquer une formule dans les deux sens.'
retenir:
    - k(a + b) = ka + kb.
    - ax + b = c → x = (c − b) ÷ a.
