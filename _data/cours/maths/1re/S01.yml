titre: Reprendre les bons réflexes
theme: Mathématiques — Reprendre les bons réflexes
problematique: Reprendre les bons réflexes
pourquoi: "Objectif de cette séance : Retrouver des automatismes de calcul."
application: Une écurie possède 18 chevaux. 7 chevaux supplémentaires arrivent pour une compétition.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Retrouver des automatismes de calcul.
        - Décomposer un calcul pour le rendre plus simple.
        - Choisir une opération adaptée à une situation.
        - Présenter une démarche mathématique compréhensible.
    competences:
        - Calculer mentalement sans chercher immédiatement la calculatrice.
        - Expliquer comment vous avez obtenu un résultat.
        - Vérifier si un résultat semble cohérent.
        - Utiliser les unités dans une situation concrète.
activites:
    - id: a03
      titre: En mathématiques, le chemin compte plus que le résultat
      contenu:
          - type: paragraphe
            texte: Dans ce cours, écrire uniquement un résultat ne suffit pas.
          - type: paragraphe
            texte: Lorsque vous effectuez un calcul ou résolvez un problème, essayez de montrer comment vous avez réfléchi.
          - type: paragraphe
            texte: Une bonne démarche avec une petite erreur de calcul est plus intéressante qu'un résultat juste sans aucune explication.
          - type: paragraphe
            texte: Vous avez donc le droit de vous tromper. L'important est de pouvoir comprendre votre raisonnement.
      questions: []
    - id: a04
      titre: "1. Échauffement : calculer sans calculatrice"
      contenu:
          - type: paragraphe
            texte: Calculatrice interdite.
          - type: paragraphe
            texte: Essayez de calculer mentalement.
          - type: paragraphe
            texte: Lorsque vous utilisez une astuce ou une décomposition, écrivez-la.
      questions:
          - id: q01
            type: texte
            enonce: 7 + 8 = ..........
            suite: []
          - id: q02
            type: texte
            enonce: 18 + 27 = ..........
            suite: []
          - id: q03
            type: texte
            enonce: 52 - 19 = ..........
            suite: []
          - id: q04
            type: texte
            enonce: 125 - 70 = ..........
            suite: []
          - id: q05
            type: texte
            enonce: 6 × 8 = ..........
            suite: []
          - id: q06
            type: texte
            enonce: 14 × 7 = ..........
            suite: []
          - id: q07
            type: texte
            enonce: 60 ÷ 5 = ..........
            suite: []
          - id: q08
            type: texte
            enonce: 156 ÷ 12 = ..........
            suite: []
    - id: a05
      titre: 2. Des nombres décimaux
      contenu:
          - type: paragraphe
            texte: Calculatrice interdite.
          - type: paragraphe
            texte: Posez le calcul si vous ne pouvez pas le faire mentalement.
          - type: paragraphe
            texte: Gardez toutes vos étapes visibles.
      questions:
          - id: q01
            type: texte
            enonce: 2,5 + 3 = ..........
            suite: []
          - id: q02
            type: texte
            enonce: 7,5 + 2,5 = ..........
            suite: []
          - id: q03
            type: texte
            enonce: 12,5 - 2 = ..........
            suite: []
          - id: q04
            type: texte
            enonce: 20 - 3,5 = ..........
            suite: []
          - id: q05
            type: texte
            enonce: 2,5 × 4 = ..........
            suite: []
    - id: a06
      titre: 3. Choisir la bonne opération
      contenu:
          - type: paragraphe
            texte: Calculatrice interdite.
          - type: paragraphe
            texte: "Pour chaque situation :"
      questions:
          - id: q01
            type: texte
            enonce: écrivez le calcul que vous choisissez ;
            suite: []
          - id: q02
            type: texte
            enonce: effectuez le calcul ;
            suite: []
          - id: q03
            type: texte
            enonce: écrivez une phrase de réponse avec l'unité.
            suite: []
    - id: a07
      titre: Situation A
      contenu:
          - type: paragraphe
            texte: Une écurie possède 18 chevaux. 7 chevaux supplémentaires arrivent pour une compétition.
          - type: paragraphe
            texte: Combien de chevaux sont maintenant présents ?
      questions: []
    - id: a08
      titre: Situation B
      contenu:
          - type: paragraphe
            texte: Une réserve contient 50 kg d'aliment. On utilise 18 kg.
          - type: paragraphe
            texte: Quelle quantité reste-t-il ?
      questions: []
    - id: a09
      titre: Situation C
      contenu:
          - type: paragraphe
            texte: 8 chevaux reçoivent chacun 5 kg de foin dans une situation simplifiée.
          - type: paragraphe
            texte: Quelle masse totale de foin est distribuée ?
          - type: paragraphe
            texte: La quantité utilisée ici sert uniquement à l'exercice mathématique et ne constitue pas une recommandation alimentaire.
      questions: []
    - id: a10
      titre: Situation D
      contenu:
          - type: paragraphe
            texte: 48 kg d'aliment doivent être répartis équitablement entre 6 lots.
          - type: paragraphe
            texte: Quelle masse reçoit chaque lot ?
      questions: []
    - id: a11
      titre: 4. Utiliser la calculatrice sans lui confier le raisonnement
      contenu:
          - type: paragraphe
            texte: Calculatrice autorisée à partir de maintenant.
          - type: paragraphe
            texte: La calculatrice peut effectuer les opérations, mais elle ne peut pas décider à votre place quelle opération répond au problème.
          - type: paragraphe
            texte: Le calcul choisi et votre démarche doivent donc toujours apparaître.
          - type: paragraphe
            texte: Pour cet exercice, une écurie accueille 12 chevaux.
          - type: paragraphe
            texte: On utilise pour le problème une consommation simplifiée de 8 kg de foin par cheval et par jour.
          - type: paragraphe
            texte: Cette valeur est fictive et sert uniquement à travailler les mathématiques.
      questions:
          - id: q01
            type: texte
            enonce: Quelle masse de foin faut-il pour les 12 chevaux pendant une journée ?
            suite: []
          - id: q02
            type: texte
            enonce: Quelle masse faut-il prévoir pour 7 jours ?
            suite: []
          - id: q03
            type: texte
            enonce: Le stock contient 700 kg de foin. Est-ce suffisant pour 7 jours ? Justifiez.
            suite: []
          - id: q04
            type: texte
            enonce: Quelle quantité restera-t-il après les 7 jours ?
            suite: []
    - id: a12
      titre: "5. Défi : le résultat de la calculatrice suffit-il ?"
      contenu:
          - type: paragraphe
            texte: Calculatrice autorisée.
          - type: paragraphe
            texte: Le résultat affiché par la calculatrice n'est pas forcément la réponse au problème.
          - type: paragraphe
            texte: L'écurie a besoin de 672 kg de foin.
          - type: paragraphe
            texte: Le foin est conditionné, pour cet exercice, en ballots de 20 kg.
      questions:
          - id: q01
            type: texte
            enonce: Effectuez le calcul permettant de déterminer le nombre de ballots nécessaires.
            suite: []
          - id: q02
            type: texte
            enonce: Notez le résultat affiché par la calculatrice.
            suite: []
          - id: q03
            type: texte
            enonce: Peut-on réellement prendre ce nombre de ballots ?
            suite: []
          - id: q04
            type: texte
            enonce: Combien de ballots faut-il prévoir ?
            suite: []
          - id: q05
            type: texte
            enonce: Expliquez votre choix en une phrase.
            suite: []
    - id: a13
      titre: 6. Mon premier bilan
      contenu:
          - type: paragraphe
            texte: "Sans regarder les réponses des autres, complétez :"
          - type: liste
            elements:
                - "🟢 Je sais faire seul : ............................................................"
                - "🟠 Je dois encore réfléchir pour : ................................................."
                - "🔴 J'ai besoin que l'on reprenne : ................................................"
      questions: []
    - id: a14
      titre: À retenir
      contenu:
          - type: liste
            elements:
                - Avant de calculer, je cherche ce que je dois trouver.
                - Je choisis ensuite l'opération adaptée.
                - Quand un calcul est simple, j'essaie d'abord de le faire mentalement.
                - Je peux décomposer un calcul pour le rendre plus facile.
                - "J'écris mes étapes : ma démarche compte autant que mon résultat."
                - Avec une calculatrice, je vérifie toujours si le résultat est cohérent.
                - Je termine un problème par une réponse adaptée à la situation.
      questions: []
    - id: a15
      titre: Sources
      contenu:
          - type: liste
            elements:
                - "Ministère de l'Agriculture – ChloroFil : Bac professionnel – Conduite et gestion de l'entreprise hippique ."
                - "Ministère de l'Agriculture – ChloroFil : Tronc commun du baccalauréat professionnel agricole ."
          - type: lien
            titre: Bac professionnel – Conduite et gestion de l'entreprise hippique
            url: https://chlorofil.fr/diplomes/secondaire/bac-pro/1re-tle/cgeh
          - type: lien
            titre: Tronc commun du baccalauréat professionnel agricole
            url: https://chlorofil.fr/diplomes/secondaire/bac-pro/1re-tle/tronc-commun
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
