titre: 'Séance 20 : Combien a-t-on dépensé en tout ?'
themes:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Comment calculer la somme des termes d’une suite avec le tableur ?
competences_bo:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
        - La somme de termes = total cumulé sur plusieurs périodes (ex. coût total d’une pension sur 10 ans).
        - 'Au tableur : colonne des termes, puis SOMME, ou colonne de cumul.'
    competences:
        - Calculer une somme de termes au tableur.
        - Comparer deux contrats sur leur coût total.
pourquoi:
    - En S18, tu as comparé deux options de prix pour 2036.
    - 'Mais le client paie chaque année : quel est le coût total sur 10 ans ?'
activites:
    -   id: a01
        titre: Les termes au tableur
        consigne: Tu vas construire au tableur les coûts annuels des deux options de pension sur 10 ans. On attend deux coûts annuels.
        contenu:
            -   type: liste
                elements:
                    - 'Automatisme : 12 × 508 = ?'
            -   type: etapes
                elements:
                    - 'Colonne A : n de 0 à 9 ; colonne B : 12 × 400 × 1,03ⁿ (coût annuel option A) ; colonne C : 12 × (400 + 12n) (option B).'
            -   type: paragraphe
                texte: Pourquoi × 12 ? Le prix est mensuel, le coût annuel compte 12 mois.
        questions:
            -   id: q01
                type: nombre
                enonce: Coût annuel de l’option A pour n = 0 ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: nombre
                enonce: Coût annuel de l’option B pour n = 9 ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a02
        titre: Les sommes
        transition: Les coûts annuels sont prêts. Additionne-les.
        consigne: Tu vas calculer avec le tableur le coût total de chaque option de pension sur 10 ans. On attend les deux totaux.
        contenu:
            -   type: etapes
                elements:
                    - Calcule SOMME(B2:B11) et SOMME(C2:C11).
                    - Compare.
            -   type: paragraphe
                texte: Pourquoi la somme ? C’est ce que le client paie vraiment.
        questions:
            -   id: q01
                type: nombre
                enonce: Coût total option A sur 10 ans (à l’euro près) ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: nombre
                enonce: Coût total option B ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a03
        titre: Conseiller
        transition: Les totaux sont calculés. Que conseiller ?
        consigne: Tu vas conseiller le client sur l’option de pension la moins chère sur 10 ans. On attend un conseil chiffré.
        contenu:
            -   type: etapes
                elements:
                    - Rédige un conseil au client avec les chiffres.
            -   type: paragraphe
                texte: Pourquoi un conseil ? Le calcul sert la décision.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle option conseilles-tu ? Justifie avec les totaux.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: 'Formule de la somme d’une suite géométrique : u₀ × (1 − qⁿ) ÷ (1 − q).'
        questions:
            -   id: q01
                type: texte
                enonce: Vérifie le total A.
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais calculer une somme de termes. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment calculer la somme des termes d’une suite avec le tableur ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Somme de termes : coût cumulé.'
    - SOMME au tableur.
sources:
    -   type: lien
        titre: ChloroFil — Bac Pro, tronc commun rénové, document d’accompagnement du module MG1
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/bacpro/bacpro-tc-da-MG1.pdf
