titre: 'Séance 20 : Combien a-t-on dépensé en tout ? La somme des termes'
themes:
- MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Comment calculer rapidement le total de plusieurs termes d’une suite (dépenses de plusieurs années, plusieurs mois) ?
competences_bo:
- MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
    - 'Somme de termes d’une suite arithmétique : S = nombre de termes × (premier + dernier) ÷ 2.'
    - 'Somme de termes d’une suite géométrique : S = premier terme × (1 − qⁿ) ÷ (1 − q), avec n le nombre de termes.'
    competences:
    - Additionner les premiers termes d’une suite.
    - Utiliser la formule de la somme pour une suite arithmétique.
    - Utiliser la formule de la somme pour une suite géométrique.
pourquoi:
- 'Aujourd’hui, trois notions : additionner les termes, la somme d’une suite arithmétique, la somme d’une suite géométrique.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — Additionner les termes
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Le prix payé chaque année forme une suite ; ce qu’on a payé en tout est la somme de ses termes.
    -   type: paragraphe
        texte: Pour peu de termes, on les calcule et on les additionne.
    -   type: paragraphe
        texte: 'À retenir : Total = u₀ + u₁ + u₂ + … (autant de termes que de périodes).'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - 'Compte le nombre de périodes : c’est le nombre de termes.'
        - Calcule chaque terme.
        - Additionne-les.
        - 'Attention : de u₀ à u₃, il y a 4 termes.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi une somme
    -   type: liste
        elements:
        - Chaque année, on paie le terme de l’année.
        - 'Sur 4 ans, on paie les 4 termes : on les additionne.'
    -   type: paragraphe
        texte: 2. Pourquoi compter les termes
    -   type: liste
        elements:
        - 'De u₀ à u₃ : u₀, u₁, u₂, u₃ → 4 termes, pas 3.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Combien de termes de u₀ à u₉ ?
        aide: Compte de 0 à 9.
    -   id: q02
        type: nombre
        enonce: Combien de termes de u₀ à u₁₄ ?
        aide: De 0 à 14.
    -   id: q03
        type: nombre
        enonce: 'u₀ = 100, r = 10 : u₀ + u₁ + u₂ ?'
        aide: 100 + 110 + 120.
    -   id: q04
        type: nombre
        enonce: 'u₀ = 50, r = −5 : u₀ + u₁ + u₂ + u₃ ?'
        aide: 50 + 45 + 40 + 35.
    -   id: q05
        type: nombre
        enonce: 'Série B — u₀ = 200, q = 2 : u₀ + u₁ + u₂ ?'
        aide: 200 + 400 + 800.
    -   id: q06
        type: nombre
        enonce: 'Foin : 120 € le 1er mois, puis + 8 € par mois. Total sur 3 mois ?'
        unite: €
        aide: 120 + 128 + 136.
-   id: a02
    titre: Partie 2 — La somme d’une suite arithmétique
    transition: 'Additionner 3 termes, c’est facile ; 20 termes, c’est long. Deuxième notion : une formule.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Pour une suite arithmétique, le premier et le dernier terme, le deuxième et l’avant-dernier, etc., ont toujours la même somme.
    -   type: paragraphe
        texte: Cela donne une formule rapide.
    -   type: paragraphe
        texte: 'À retenir : S = nombre de termes × (premier terme + dernier terme) ÷ 2.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Compte le nombre de termes.
        - Calcule le dernier terme avec uₙ = u₀ + n × r.
        - Additionne premier et dernier.
        - Multiplie par le nombre de termes, puis divise par 2.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. L’astuce des paires
    -   type: liste
        elements:
        - '1 + 2 + … + 10 : on associe 1 + 10 = 11, 2 + 9 = 11, … : 5 paires de 11.'
        - 'Total : 5 × 11 = 55 = 10 × (1 + 10) ÷ 2.'
    -   type: paragraphe
        texte: 2. Pourquoi diviser par 2
    -   type: liste
        elements:
        - Avec n termes, on fait n ÷ 2 paires.
        - 'Chaque paire vaut premier + dernier : S = n × (premier + dernier) ÷ 2.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Somme 1 + 2 + … + 20 ?
        aide: 20 × (1 + 20) ÷ 2.
    -   id: q02
        type: nombre
        enonce: 'u₀ = 100, r = 10 : dernier terme u₉ ?'
        aide: 100 + 9 × 10.
    -   id: q03
        type: nombre
        enonce: Somme u₀ + … + u₉ ?
        aide: 10 × (100 + 190) ÷ 2.
    -   id: q04
        type: nombre
        enonce: 'u₀ = 50, r = 4 : somme des 15 premiers termes (u₀ à u₁₄) ?'
        aide: 'Dernier : 50 + 14 × 4 = 106 ; 15 × 156 ÷ 2.'
    -   id: q05
        type: nombre
        enonce: 'Série B — Pension : 350 € la 1re année, + 12 € par an. Total sur 10 ans ?'
        unite: €
        aide: 'Dernier : 350 + 9 × 12 = 458 ; 10 × 808 ÷ 2.'
    -   id: q06
        type: nombre
        enonce: 'Stock utilisé : 60 kg le 1er jour, puis 2 kg de moins chaque jour. Total sur 20 jours ?'
        unite: kg
        aide: 'Dernier : 60 − 19 × 2 = 22 ; 20 × 82 ÷ 2.'
    -   id: q07
        type: nombre
        enonce: Somme 5 + 10 + 15 + … + 100 ?
        aide: 20 termes ; 20 × 105 ÷ 2.
-   id: a03
    titre: Partie 3 — La somme d’une suite géométrique
    transition: 'Dernière notion : le total quand le prix augmente d’un même pourcentage.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Pour une suite géométrique, l’astuce des paires ne marche plus.
    -   type: paragraphe
        texte: On utilise une autre formule, avec la puissance qⁿ.
    -   type: paragraphe
        texte: 'À retenir : S = premier terme × (1 − qⁿ) ÷ (1 − q), avec n = nombre de termes.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Repère le premier terme, q et le nombre de termes n.
        - Calcule qⁿ (touche ^).
        - Calcule premier × (1 − qⁿ) ÷ (1 − q).
        - Contrôle sur 2 ou 3 termes en les additionnant.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. L’idée
    -   type: liste
        elements:
        - S = u₀ + u₀q + u₀q² ; q × S = u₀q + u₀q² + u₀q³.
        - 'En soustrayant, presque tout s’annule : S − qS = u₀ − u₀q³, d’où S = u₀(1 − q³) ÷ (1 − q).'
    -   type: paragraphe
        texte: 2. Vérification
    -   type: liste
        elements:
        - 'u₀ = 200, q = 2, 3 termes : 200 × (1 − 8) ÷ (1 − 2) = 200 × 7 = 1 400.'
        - C’est bien 200 + 400 + 800.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée. Arrondis au centime.
    questions:
    -   id: q01
        type: nombre
        enonce: 'Série A — u₀ = 100, q = 2, 4 termes : somme ?'
        aide: 100 × (1 − 2⁴) ÷ (1 − 2).
    -   id: q02
        type: nombre
        enonce: 'u₀ = 1 000, q = 0,5, 3 termes : somme ?'
        aide: 1 000 × (1 − 0,125) ÷ 0,5.
    -   id: q03
        type: nombre
        enonce: 'u₀ = 400, q = 1,03, 10 termes : somme (au centime) ?'
        unite: €
        aide: 400 × (1 − 1,03¹⁰) ÷ (1 − 1,03).
    -   id: q04
        type: nombre
        enonce: 'u₀ = 500, q = 1,1, 3 termes : somme ?'
        aide: 500 + 550 + 605.
    -   id: q05
        type: nombre
        enonce: Série B — Un club gagne 50 licences la 1re année, puis 10 % de plus chaque année. Total sur 5 ans (au dixième) ?
        unite: licences
        aide: 50 × (1 − 1,1⁵) ÷ (1 − 1,1).
    -   id: q06
        type: qcm
        enonce: 'Pension sur 10 ans : A (+12 € par an, départ 350 €) totalise 4 040 € ; B (+3 %, départ 400 €) ≈ 4 585,55 €. La moins chère sur 10 ans ?'
        choix:
        -   id: a
            texte: A
        -   id: b
            texte: B
        aide: Compare les totaux.
    -   id: q07
        type: nombre
        enonce: Différence entre les deux totaux (au centime) ?
        unite: €
        aide: 4 585,55 − 4 040.
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: Somme 1 + 2 + … + 50 ?
    -   id: q02
        type: nombre
        enonce: 'u₀ = 20, r = 3 : somme des 10 premiers termes ?'
    -   id: q03
        type: nombre
        enonce: 'u₀ = 3, q = 3, 4 termes : somme ?'
retenir:
- Total sur plusieurs périodes = somme des termes.
- 'Arithmétique : S = nombre de termes × (premier + dernier) ÷ 2.'
- 'Géométrique : S = premier × (1 − qⁿ) ÷ (1 − q), n = nombre de termes.'
- De u₀ à uₙ₋₁, il y a n termes.
