titre: 'Séance 18 : Le prix de la pension augmente de 3 % par an'
themes:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Comment modéliser une quantité qui augmente chaque année du même pourcentage ?
competences_bo:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
        - 'Suite géométrique : on multiplie toujours par la même raison q : uₙ₊₁ = q × uₙ ; terme général uₙ = u₀ × qⁿ.'
        - 'Hausse de 3 % : q = 1,03.'
    competences:
        - Reconnaître une suite géométrique.
        - Utiliser le terme général.
pourquoi:
    - En S03, tu as enchaîné des hausses.
    - Une hausse de 3 % chaque année donne une suite géométrique.
activites:
    -   id: a01
        titre: Les premiers termes
        consigne: Tu vas calculer les deux premières années de la suite du prix de la pension (+3 % par an). On attend u₁ et u₂.
        contenu:
            -   type: titre
                texte: Exemple
            -   type: liste
                elements:
                    - 'Automatisme : 3 % de 400 de tête.'
            -   type: etapes
                elements:
                    - u₀ = 400 € (2026) ; q = 1,03.
                    - Calcule u₁, u₂.
            -   type: paragraphe
                texte: Pourquoi multiplier ? Chaque hausse s’applique au prix de l’année précédente.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Suite géométrique : uₙ₊₁ = q × …… .'
                        - ''
                    -   - '+3 % par an : q = …… .'
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: nombre
                enonce: u₁ ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q03
                type: nombre
                enonce: u₂ ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a02
        titre: Le terme général
        transition: Les premiers termes sont calculés. Saute directement à 10 ans.
        consigne: Tu vas calculer avec le terme général le prix de la pension dans 10 ans et la hausse totale. On attend les deux résultats.
        contenu:
            -   type: etapes
                elements:
                    - Écris uₙ = 400 × 1,03ⁿ.
                    - Calcule le prix en 2036 (n = 10).
            -   type: paragraphe
                texte: Pourquoi la puissance ? 10 hausses successives = 10 multiplications par 1,03.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Terme général : uₙ = u₀ × q puissance …… .'
                        - ''
                    -   - 400 × 1,03¹⁰ ≈ …… €.
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: nombre
                enonce: Prix en 2036 (au centime) ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q03
                type: nombre
                enonce: Hausse totale en % sur 10 ans (au dixième) ?
                unite: '%'
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a03
        titre: Comparer avec une hausse fixe
        transition: Tu sais calculer une hausse en %. Compare-la à une hausse fixe.
        consigne: Tu vas comparer en 2036 une hausse de 3 % par an et une hausse de 12 € par an. On attend le prix de l’option B et la comparaison.
        contenu:
            -   type: etapes
                elements:
                    - 'Option B : + 12 € par an (suite arithmétique).'
                    - Compare les prix en 2036.
            -   type: paragraphe
                texte: Pourquoi comparer ? Le client choisit le contrat le moins cher sur la durée.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Une hausse fixe donne une suite …… .
                        - ''
                    -   - À long terme, la suite géométrique augmente de plus en plus …… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: nombre
                enonce: Prix en 2036 avec l’option B ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q03
                type: texte
                enonce: Quelle option est la plus favorable au client sur 10 ans ? Et sur le long terme ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Au bout de combien d’années le prix dépasse-t-il 500 € (option A) ?
        questions:
            -   id: q01
                type: texte
                enonce: Au tableur ou par essais.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais modéliser une hausse en %. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment modéliser une quantité qui augmente chaque année du même pourcentage ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Géométrique : uₙ₊₁ = q × uₙ ; uₙ = u₀ × qⁿ.'
    - '+t % : q = 1 + t/100.'
sources:
