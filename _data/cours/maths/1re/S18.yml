titre: 'Séance 18 : Les suites géométriques'
themes:
- MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Comment décrire une quantité qui augmente ou baisse du même pourcentage à chaque étape ?
competences_bo:
- MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
    - 'Suite géométrique : on multiplie toujours par la même raison q : uₙ₊₁ = uₙ × q.'
    - 'Hausse de t % : q = 1 + t/100 ; baisse de t % : q = 1 − t/100.'
    - uₙ = u₀ × qⁿ.
    competences:
    - Reconnaître une suite géométrique et trouver sa raison.
    - Passer d’un pourcentage à la raison q.
    - Calculer un terme avec la formule uₙ = u₀ × qⁿ.
pourquoi:
- 'Aujourd’hui, trois notions : la raison d’une suite géométrique, le lien avec les pourcentages, la formule directe.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — La raison d’une suite géométrique
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Une suite est géométrique quand on passe d’un terme au suivant en multipliant toujours par le même nombre.
    -   type: paragraphe
        texte: Ce nombre est la raison, notée q.
    -   type: paragraphe
        texte: 'À retenir : q = terme suivant ÷ terme. Géométrique si ce quotient est toujours le même.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Calcule u₁ ÷ u₀, u₂ ÷ u₁, u₃ ÷ u₂…
        - 'Tous égaux : géométrique de raison q.'
        - 'q > 1 : la suite augmente ; 0 < q < 1 : elle diminue.'
        - 'Un quotient différent : pas géométrique.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi diviser
    -   type: liste
        elements:
        - On cherche par combien on a multiplié.
        - Si 200 devient 210, on a multiplié par 210 ÷ 200 = 1,05.
    -   type: paragraphe
        texte: 2. Arithmétique ou géométrique
    -   type: liste
        elements:
        - 'Arithmétique : on ajoute la même chose (différences égales).'
        - 'Géométrique : on multiplie par la même chose (quotients égaux).'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée.
    questions:
    -   id: q01
        type: nombre
        enonce: 'Série A — Suite 3 ; 6 ; 12 ; 24 : raison ?'
        aide: 6 ÷ 3.
        calcul: true
    -   id: q02
        type: nombre
        enonce: 'Suite 200 ; 210 ; 220,5 : raison ?'
        aide: 210 ÷ 200.
        calcul: true
    -   id: q03
        type: nombre
        enonce: 'Suite 800 ; 400 ; 200 ; 100 : raison ?'
        aide: 400 ÷ 800.
        calcul: true
    -   id: q04
        type: nombre
        enonce: 'Suite 1 000 ; 900 ; 810 : raison ?'
        aide: 900 ÷ 1 000.
        calcul: true
    -   id: q05
        type: qcm
        enonce: La suite 2 ; 5 ; 8 ; 11 est-elle géométrique ?
        choix:
        -   id: a
            texte: Oui
        -   id: b
            texte: Non, elle est arithmétique
        aide: 'Quotients : 2,5 ; 1,6… Différences : 3, 3, 3.'
    -   id: q06
        type: nombre
        enonce: 'Série B — Suite 50 ; 150 ; 450 : terme suivant ?'
        aide: q = 3.
        calcul: true
    -   id: q07
        type: qcm
        enonce: 'Suite 400 ; 360 ; 324 : elle…'
        choix:
        -   id: a
            texte: augmente
        -   id: b
            texte: diminue
        aide: q = 0,9 < 1.
-   id: a02
    titre: Partie 2 — Pourcentages et raison
    transition: 'Tu sais trouver q. Deuxième notion : faire le lien avec les pourcentages.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Une hausse de 3 % chaque année revient à multiplier chaque année par 1,03.
    -   type: paragraphe
        texte: La suite des valeurs est donc géométrique de raison q = 1,03.
    -   type: paragraphe
        texte: 'À retenir : +t % par étape : q = 1 + t/100. −t % par étape : q = 1 − t/100.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Écris le pourcentage en décimal (3 % = 0,03).
        - 'Hausse : q = 1 + 0,03 = 1,03 ; baisse : q = 1 − 0,03 = 0,97.'
        - 'Terme suivant : uₙ₊₁ = uₙ × q.'
        - Arrondis au centime si ce sont des euros.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. En raisonnant avec les pourcentages
    -   type: liste
        elements:
        - Le prix de départ représente 100 % (soit 1).
        - Avec 3 % de plus, on paie 100 % + 3 % = 103 % = 1,03 fois le prix.
    -   type: paragraphe
        texte: 2. En regroupant
    -   type: liste
        elements:
        - Nouveau prix = prix + prix × 0,03 = prix × (1 + 0,03) = prix × 1,03.
        - Le 1 garde le prix, le 0,03 ajoute les 3 %.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée. Arrondis au centime.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Raison q pour +3 % par an ?
        aide: 1 + 0,03.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Raison q pour +10 % par an ?
        aide: 1 + 0,10.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Raison q pour −20 % par an ?
        aide: 1 − 0,20.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Raison q pour −5 % par an ?
        aide: 1 − 0,05.
        calcul: true
    -   id: q05
        type: nombre
        enonce: 'Série B — u₀ = 400 €, q = 1,03 : u₁ ?'
        unite: €
        aide: 400 × 1,03.
        calcul: true
    -   id: q06
        type: nombre
        enonce: u₂ ?
        unite: €
        aide: 412 × 1,03.
        calcul: true
    -   id: q07
        type: nombre
        enonce: Une selle de 1 500 € perd 20 % de sa valeur par an. Valeur après 1 an ?
        unite: €
        aide: 1 500 × 0,8.
        calcul: true
-   id: a03
    titre: Partie 3 — La formule directe uₙ = u₀ × qⁿ
    transition: 'Dernière notion : calculer directement un terme lointain.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Pour connaître le prix dans 10 ans, on ne multiplie pas 10 fois à la main.
    -   type: paragraphe
        texte: 'Après n étapes, on a multiplié n fois par q : c’est q puissance n.'
    -   type: paragraphe
        texte: 'À retenir : uₙ = u₀ × qⁿ. À la calculatrice : u₀ × q ^ n.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Repère u₀, q et n.
        - Tape u₀ × q ^ n (touche ^ ou xʸ).
        - Arrondis selon l’unité.
        - Contrôle avec u₁ et u₂ calculés pas à pas.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. En comptant les multiplications
    -   type: liste
        elements:
        - u₁ = u₀ × q ; u₂ = u₀ × q × q = u₀ × q² ; u₃ = u₀ × q³.
        - 'Au rang n, on a multiplié n fois par q : uₙ = u₀ × qⁿ.'
    -   type: paragraphe
        texte: 2. Pourquoi pas u₀ × q × n
    -   type: liste
        elements:
        - × n répéterait une addition, pas une multiplication.
        - '400 × 1,03 × 10 = 4 120 € : absurde pour 10 ans à +3 %.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée. Arrondis au centime.
    questions:
    -   id: q01
        type: nombre
        enonce: 'Série A — u₀ = 5, q = 2 : u₄ ?'
        aide: 5 × 2⁴.
        calcul: true
    -   id: q02
        type: nombre
        enonce: 'u₀ = 400, q = 1,03 : u₅ ?'
        unite: €
        aide: 400 × 1,03⁵.
        calcul: true
    -   id: q03
        type: nombre
        enonce: 'u₀ = 1 500, q = 0,8 : u₃ ?'
        unite: €
        aide: 1 500 × 0,8³.
        calcul: true
    -   id: q04
        type: nombre
        enonce: 'u₀ = 2 000, q = 1,1 : u₂ ?'
        unite: €
        aide: 2 000 × 1,1².
        calcul: true
    -   id: q05
        type: nombre
        enonce: Série B — Un troupeau de 40 chevaux augmente de 5 % par an. Effectif dans 4 ans (arrondi à l’unité) ?
        unite: chevaux
        aide: 40 × 1,05⁴.
        calcul: true
    -   id: q06
        type: qcm
        enonce: Un élève calcule u₁₀ = 400 × 1,03 × 10. Que dire ?
        choix:
        -   id: a
            texte: C’est juste
        -   id: b
            texte: 'Faux : c’est 400 × 1,03¹⁰'
        aide: On multiplie 10 fois par 1,03.
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: 'Suite 2 ; 6 ; 18 : raison ?'
        calcul: true
    -   id: q02
        type: nombre
        enonce: Raison q pour +2,5 % ?
        calcul: true
    -   id: q03
        type: nombre
        enonce: 'u₀ = 1 000, q = 0,9 : u₂ ?'
        calcul: true
    -   id: q04
        type: nombre
        enonce: 'u₀ = 300, q = 1,02 : u₃ (au centime) ?'
        calcul: true
retenir:
- 'Géométrique : le quotient de deux termes qui se suivent est toujours le même : la raison q.'
- uₙ₊₁ = uₙ × q.
- '+t % par étape : q = 1 + t/100 ; −t % : q = 1 − t/100.'
- 'uₙ = u₀ × qⁿ (puissance : touche ^ de la calculatrice).'
