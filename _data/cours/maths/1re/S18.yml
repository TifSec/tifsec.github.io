titre: 'Séance 18 : Le prix de la pension augmente de 3 % par an'
themes:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Comment modéliser une quantité qui augmente chaque année du même pourcentage ?
competences_bo:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
        - 'Suite géométrique : on multiplie toujours par la même raison q : uₙ₊₁ = q × uₙ ; terme général uₙ = u₀ × qⁿ.'
        - Une hausse de t % donne q = 1 + t/100.
    competences:
        - Reconnaître une suite géométrique.
        - Utiliser le terme général.
pourquoi:
    - En S03, tu as enchaîné des hausses.
    - Une hausse de 3 % chaque année donne une suite géométrique.
activites:
    -   id: a01
        titre: Les premiers termes
        consigne: Tu vas calculer les deux premières années de la suite du prix de la pension (+3 % par an). On attend u₁ et u₂.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: La pension coûte 400 € par mois en 2026 et augmente de 3 % chaque année. Combien coûtera-t-elle les années suivantes ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Une suite géométrique est une suite où l’on passe d’un terme au suivant en multipliant toujours par le même nombre q, appelé raison.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - 'Modéliser une hausse ou une baisse du même pourcentage chaque période : prix, population, valeur d’un matériel.'
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - 'On traduit le pourcentage en coefficient : +3 % → q = 1,03.'
                    - u₁ = u₀ × q ; u₂ = u₁ × q ; et ainsi de suite.
                    - Chaque hausse s’applique au prix de l’année précédente, pas au prix de départ.
            -   type: paragraphe
                texte: 'À retenir : uₙ₊₁ = q × uₙ.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - u₀ = 1 000 et q = 1,1. Calcule u₁ et u₂.
                    - Une valeur de 500 € baisse de 10 % par an. Quelle est la raison ? Calcule u₁.
            -   type: liste
                elements:
                    - 'Automatisme : 3 % de 400 de tête.'
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : u₀ = 400 € (2026), q = 1,03. Calcule u₁ et u₂.'
                    - Pourquoi multiplier ? Chaque hausse s’applique au prix de l’année précédente.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Suite géométrique : uₙ₊₁ = q × …… .'
                        - ''
                    -   - '+3 % par an : q = …… .'
                        - ''
                aide: 'Relis l’exemple de la cotisation : chaque terme = q × le précédent. +3 % par an : q = 1 + combien ?'
            -   id: q02
                type: nombre
                enonce: u₁ ?
                unite: €
                aide: u₁ = 400 × 1,03.
            -   id: q03
                type: nombre
                enonce: u₂ ?
                unite: €
                aide: u₂ = u₁ × 1,03 (ou 400 × 1,03²).
    -   id: a02
        titre: Le terme général
        transition: Les premiers termes sont calculés. Saute directement à 10 ans.
        consigne: Tu vas calculer avec le terme général le prix de la pension dans 10 ans et la hausse totale. On attend les deux résultats.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Combien coûtera la pension en 2036, dans 10 ans ? On ne veut pas faire 10 multiplications.
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: 'Le terme général d’une suite géométrique donne directement uₙ : uₙ = u₀ × qⁿ (q multiplié n fois par lui-même).'
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Prévoir un prix ou une valeur à long terme.
                    - Calculer une évolution totale sur plusieurs années.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - On écrit uₙ = u₀ × qⁿ.
                    - 'À la calculatrice : u₀ × q ^ n (touche puissance).'
                    - 'Hausse totale : (uₙ − u₀) ÷ u₀, en pourcentage.'
            -   type: paragraphe
                texte: 'À retenir : uₙ = u₀ × qⁿ.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - u₀ = 200 et q = 1,05. Calcule u₃ à la calculatrice.
                    - Avec u₀ = 1 000 et q = 1,1, calcule u₄.
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : écris uₙ = 400 × 1,03ⁿ et calcule le prix en 2036 (n = 10).'
                    - Pourquoi la puissance ? 10 hausses successives = 10 multiplications par 1,03.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Terme général : uₙ = u₀ × q puissance …… .'
                        - ''
                    -   - 400 × 1,03¹⁰ ≈ …… €.
                        - ''
                aide: 'Terme général : u₀ × q puissance… ? Puis calcule 400 × 1,03 ^ 10 avec la touche puissance.'
            -   id: q02
                type: nombre
                enonce: Prix en 2036 (au centime) ?
                unite: €
                aide: '2036 correspond à n = 10 : 400 × 1,03¹⁰, arrondi au centime.'
            -   id: q03
                type: nombre
                enonce: Hausse totale en % sur 10 ans (au dixième) ?
                unite: '%'
                aide: 'Comme l’exemple : (prix 2036 − 400) ÷ 400 × 100, arrondi au dixième.'
    -   id: a03
        titre: Comparer avec une hausse fixe
        transition: Tu sais calculer une hausse en %. Compare-la à une hausse fixe.
        consigne: Tu vas comparer en 2036 une hausse de 3 % par an et une hausse de 12 € par an. On attend le prix de l’option B et la comparaison.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: 'Le client hésite entre deux contrats : A, +3 % par an ; B, +12 € par an. Lequel coûtera le moins cher en 2036 ?'
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Comparer une suite arithmétique (on ajoute toujours la même quantité) et une suite géométrique (on multiplie toujours par le même nombre).
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Choisir le contrat le moins cher sur une durée donnée.
                    - Comprendre pourquoi une hausse en pourcentage finit par dépasser une hausse fixe.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - 'On écrit les deux suites : uₙ = u₀ × qⁿ et vₙ = v₀ + n × r.'
                    - On calcule les deux termes pour la même année.
                    - On compare, puis on regarde l’évolution à long terme.
            -   type: paragraphe
                texte: 'À retenir : Hausse fixe : suite arithmétique ; hausse en % : suite géométrique, de plus en plus rapide.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - v₀ = 200 et +10 € par an. Calcule v₃ et compare avec 200 × 1,05³ ≈ 231,53 €.
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : option B : + 12 € par an (suite arithmétique). Compare les prix en 2036.'
                    - Pourquoi comparer ? Le client choisit le contrat le moins cher sur la durée.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Une hausse fixe donne une suite …… .
                        - ''
                    -   - À long terme, la suite géométrique augmente de plus en plus …… .
                        - ''
                aide: Une hausse fixe (+12 € par an) donne une suite de quel type ? Et la géométrique augmente de plus en plus… ?
            -   id: q02
                type: nombre
                enonce: Prix en 2036 avec l’option B ?
                unite: €
                aide: 'Option B : vₙ = 400 + 12n. Remplace n par 10.'
            -   id: q03
                type: texte
                enonce: Quelle option est la plus favorable au client sur 10 ans ? Et sur le long terme ?
                aide: 'Compare les deux prix en 2036, puis imagine n = 30 : quelle suite finit par dépasser l’autre ?'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Au bout de combien d’années le prix dépasse-t-il 500 € (option A) ?
        questions:
            -   id: q01
                type: texte
                enonce: Au tableur ou par essais.
                aide: Au tableur, recopie 400 × 1,03ⁿ pour n = 1, 2, 3… et cherche la première année où le prix dépasse 500 €.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais modéliser une hausse en %. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment modéliser une quantité qui augmente chaque année du même pourcentage ?'
                aide: Dis ce qu’est une suite géométrique, sa raison, son terme général, et la comparaison avec une hausse fixe.
retenir:
    - 'Géométrique : uₙ₊₁ = q × uₙ ; uₙ = u₀ × qⁿ.'
    - '+t % : q = 1 + t/100.'
