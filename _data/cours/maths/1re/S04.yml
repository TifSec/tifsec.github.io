titre: 'Séance 4 : Prix HT, TVA, remise : la facture de la sellerie'
themes:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Comment calculer une facture complète avec remise et TVA ?
competences_bo:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
        - 'Ordre habituel : prix HT → remise sur HT → TVA sur le HT remisé → TTC.'
        - 'Retrouver un HT : TTC ÷ (1 + taux).'
    competences:
        - Calculer une facture complète.
        - Retrouver un prix HT et une remise.
pourquoi:
    - En 2de, tu as calculé une TVA.
    - 'La sellerie fait une remise aux clubs : il faut l’appliquer au bon moment.'
activites:
    -   id: a01
        titre: La facture
        consigne: Tu vas calculer la facture complète de la commande du club (document 1), avec remise et TVA. On attend chaque ligne de la facture.
        contenu:
            -   type: liste
                elements:
                    - 'Automatisme : 10 % de 1 000 ; 20 % de 900.'
            -   type: liste
                elements:
                    - 6 tapis à 50 € HT.
                    - 4 filets à 125 € HT.
                    - 'Remise club : 10 % sur le HT.'
                    - 'TVA : 20 %.'
            -   type: paragraphe
                texte: Données fictives créées pour l’exercice (ordres de grandeur réalistes).
            -   type: etapes
                elements:
                    - 'Lis l’exemple : 2 selles à 400 € HT ; remise 5 % ; TVA 20 %.'
                    - 'HT brut : 2 × 400 = 800 €.'
                    - 'Remise : 800 × 5 ÷ 100 = 40 € ; HT net : 800 − 40 = 760 €.'
                    - 'TVA : 760 × 20 ÷ 100 = 152 € ; TTC : 760 + 152 = 912 €.'
                    - 'À toi : lis la commande du club (document 1) et calcule HT, remise, HT net, TVA, TTC.'
                    - Pourquoi cet ordre ? La TVA se calcule sur le prix réellement facturé.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - La remise se calcule sur le prix …… .
                        - ''
                    -   - La TVA se calcule sur le HT …… .
                        - ''
                aide: 'Relis l’exemple des 2 selles : la remise est calculée sur quel prix ? Et la TVA, sur le HT avant ou après remise ?'
            -   id: q02
                type: tableau
                enonce: Complète la facture.
                colonnes:
                    - Ligne
                    - Montant (€)
                lignes:
                    -   - Total HT
                        - ''
                    -   - Remise 10 %
                        - ''
                    -   - HT net
                        - ''
                    -   - TVA 20 %
                        - ''
                    -   - TTC
                        - ''
                aide: 'Suis l’ordre de l’exemple avec les données : 6 tapis et 4 filets (HT brut), remise 10 %, HT net, TVA 20 %, TTC.'
    -   id: a02
        titre: Retrouver le HT
        transition: La facture est calculée. Fais le chemin inverse.
        consigne: Tu vas retrouver le prix hors taxes d’un article de sellerie payé 210 € TTC avec une TVA de 20 %. On attend le prix HT.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : 144 € TTC, TVA 20 %.'
                    - HT = TTC ÷ 1,2 = 144 ÷ 1,2 = 120 €.
                    - 'Vérification : 120 × 1,2 = 144 €.'
                    - 'À toi : un client a payé 210 € TTC (TVA 20 %). Retrouve le HT.'
                    - Pourquoi diviser ? Le TTC = HT × 1,2.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - HT = TTC ÷ …… (TVA 20 %).
                        - ''
                    -   - Retirer 20 % du TTC donne un résultat …… .
                        - ''
                aide: 'Relis l’exemple 144 € TTC : par quoi divise-t-on ? Et si on retire 20 % du TTC, le résultat est-il juste ?'
            -   id: q02
                type: nombre
                enonce: Prix HT ?
                unite: €
                aide: Divise les 210 € TTC par le coefficient de la TVA à 20 %. Vérifie en remultipliant.
    -   id: a03
        titre: Quelle remise ?
        transition: Tu sais retrouver un HT. Retrouve maintenant une remise.
        consigne: Tu vas calculer le taux de remise d’une selle passée de 1 500 € à 1 275 €. On attend le taux.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : un licol passe de 40 € à 34 €.'
                    - 'Remise : 40 − 34 = 6 €.'
                    - Taux = 6 ÷ 40 = 0,15, soit 15 %.
                    - 'Autre méthode : 34 ÷ 40 = 0,85 = 85 % : on a enlevé 15 %.'
                    - 'À toi : une selle passe de 1 500 € à 1 275 € ; calcule le taux de remise.'
                    - Pourquoi ce calcul ? Vérifier une promotion annoncée.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Taux de remise = 1 − nouveau prix ÷ …… prix.
                        - ''
                    -   - Un coefficient de 0,85 correspond à −…… %.
                        - ''
                aide: 'Relis l’exemple du licol 40 € → 34 € : 34 ÷ 40 = 0,85. Taux = 1 − nouveau ÷ quel prix ? Et 0,85, c’est combien de % en moins ?'
            -   id: q02
                type: nombre
                enonce: Taux de remise ?
                unite: '%'
                aide: Fais 1 275 ÷ 1 500, puis 1 moins ce résultat, en %.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La TVA sur la remise est-elle la même si on calcule TTC puis remise ?
        questions:
            -   id: q01
                type: texte
                enonce: Teste sur 1 000 € HT.
                aide: 'Calcule les deux chemins à partir de 1 000 € HT : remise puis TVA, et TVA puis remise. Compare les TTC.'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais calculer une facture complète. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment calculer une facture complète avec remise et TVA ?'
                aide: Dis l’ordre des calculs d’une facture, comment retrouver le HT et calculer un taux de remise.
retenir:
    - HT net × 1,2 = TTC.
    - Taux = 1 − nouveau ÷ ancien.
