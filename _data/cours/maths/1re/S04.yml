titre: 'Séance 4 : Prix HT, TVA, remise : la facture de la sellerie'
themes:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Comment calculer une facture complète avec remise et TVA ?
competences_bo:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
        - 'Ordre d’une facture : prix HT → remise sur le HT → TVA sur le HT remisé → TTC.'
        - 'Retrouver un HT : TTC ÷ (1 + taux de TVA).'
    competences:
        - Calculer une facture complète.
        - Retrouver un prix HT et une remise.
pourquoi:
    - En 2de, tu as calculé une TVA.
    - 'La sellerie fait une remise aux clubs : il faut l’appliquer au bon moment.'
activites:
    -   id: a01
        titre: La facture
        consigne: Tu vas calculer la facture complète de la commande du club (document 1), avec remise et TVA. On attend chaque ligne de la facture.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Le club commande des tapis et des filets à la sellerie. Il a droit à une remise, puis la TVA s’ajoute. Combien va-t-il payer ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Une facture part du prix hors taxes (HT). La remise est une réduction sur ce prix. La TVA est un impôt calculé en pourcentage du prix HT après remise ; le client paie le prix toutes taxes comprises (TTC).
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Calculer et vérifier une facture de matériel ou de pension.
                    - Comparer des devis.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - HT brut = quantité × prix unitaire HT, pour chaque ligne, puis on additionne.
                    - Remise = HT brut × taux ÷ 100 ; HT net = HT brut − remise.
                    - TVA = HT net × 20 ÷ 100 ; TTC = HT net + TVA.
            -   type: paragraphe
                texte: 'À retenir : Toujours dans cet ordre : remise sur le HT, puis TVA sur le HT net.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - 3 licols à 20 € HT, remise 10 %, TVA 20 %. Calcule le TTC.
                    - Une selle à 600 € HT, sans remise, TVA 20 %. Prix TTC ?
            -   type: liste
                elements:
                    - 'Automatisme : 10 % de 1 000 ; 20 % de 900.'
            -   type: liste
                elements:
                    - 6 tapis à 50 € HT.
                    - 4 filets à 175 € HT.
                    - 'Remise club : 10 % sur le HT.'
                    - 'TVA : 20 %.'
            -   type: paragraphe
                texte: Données fictives créées pour l’exercice (ordres de grandeur réalistes).
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : lis la commande du club (document 1) et calcule HT, remise, HT net, TVA, TTC.'
                    - Pourquoi cet ordre ? La TVA se calcule sur le prix réellement facturé.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - La remise se calcule sur le prix …… .
                        - ''
                    -   - La TVA se calcule sur le HT …… .
                        - ''
                aide: 'Relis l’exemple des 2 selles : la remise est calculée sur quel prix ? Et la TVA, sur le HT avant ou après remise ?'
            -   id: q02
                type: tableau
                enonce: Complète la facture.
                colonnes:
                    - Ligne
                    - Montant (€)
                lignes:
                    -   - Total HT
                        - ''
                    -   - Remise 10 %
                        - ''
                    -   - HT net
                        - ''
                    -   - TVA 20 %
                        - ''
                    -   - TTC
                        - ''
                aide: 'Suis l’ordre de l’exemple avec les données : 6 tapis et 4 filets (HT brut), remise 10 %, HT net, TVA 20 %, TTC.'
    -   id: a02
        titre: Retrouver le HT
        transition: La facture est calculée. Fais le chemin inverse.
        consigne: Tu vas retrouver le prix hors taxes d’un article de sellerie payé 210 € TTC avec une TVA de 20 %. On attend le prix HT.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Un client a payé un article 210 € TTC. Le comptable a besoin du prix hors taxes.
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Retrouver le HT, c’est faire le calcul de la TVA à l’envers.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Remplir la comptabilité, qui se fait en HT.
                    - Comparer des prix affichés TTC et HT.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - Le TTC est le HT multiplié par 1,2 (TVA à 20 %).
                    - 'Pour revenir au HT, on fait l’opération inverse : on divise le TTC par 1,2.'
                    - On vérifie en multipliant le HT trouvé par 1,2.
            -   type: paragraphe
                texte: 'À retenir : HT = TTC ÷ 1,2 (TVA 20 %). Enlever 20 % du TTC donne un résultat faux.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Un article coûte 96 € TTC (TVA 20 %). Prix HT ?
                    - Un article coûte 66 € TTC avec une TVA de 10 %. Prix HT ?
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : un client a payé 210 € TTC (TVA 20 %). Retrouve le HT.'
                    - Pourquoi diviser ? Le TTC = HT × 1,2.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - HT = TTC ÷ …… (TVA 20 %).
                        - ''
                    -   - Retirer 20 % du TTC donne un résultat …… .
                        - ''
                aide: 'Relis l’exemple 144 € TTC : par quoi divise-t-on ? Et si on retire 20 % du TTC, le résultat est-il juste ?'
            -   id: q02
                type: nombre
                enonce: Prix HT ?
                unite: €
                aide: Divise les 210 € TTC par le coefficient de la TVA à 20 %. Vérifie en remultipliant.
    -   id: a03
        titre: Quelle remise ?
        transition: Tu sais retrouver un HT. Retrouve maintenant une remise.
        consigne: Tu vas calculer le taux de remise d’une selle passée de 1 500 € à 1 275 €. On attend le taux.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Une selle passe de 1 500 € à 1 275 €. Quel est le taux de la remise ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Le taux de remise est la réduction exprimée en pourcentage du prix de départ.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Vérifier qu’une promotion annoncée est exacte.
                    - Comparer deux promotions.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - 'Méthode 1 : remise en euros = ancien prix − nouveau prix ; taux = remise ÷ ancien prix, puis × 100.'
                    - 'Méthode 2 : coefficient = nouveau ÷ ancien ; taux de remise = (1 − coefficient) × 100.'
            -   type: paragraphe
                texte: 'À retenir : Taux de remise = remise ÷ ancien prix.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Un tapis passe de 50 € à 40 €. Taux de remise ?
                    - Une couverture passe de 120 € à 102 €. Taux de remise ?
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : une selle passe de 1 500 € à 1 275 € ; calcule le taux de remise.'
                    - Pourquoi ce calcul ? Vérifier une promotion annoncée.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Taux de remise = 1 − nouveau prix ÷ …… prix.
                        - ''
                    -   - Un coefficient de 0,85 correspond à −…… %.
                        - ''
                aide: 'Relis l’exemple du licol 40 € → 34 € : 34 ÷ 40 = 0,85. Taux = 1 − nouveau ÷ quel prix ? Et 0,85, c’est combien de % en moins ?'
            -   id: q02
                type: nombre
                enonce: Taux de remise ?
                unite: '%'
                aide: Fais 1 275 ÷ 1 500, puis 1 moins ce résultat, en %.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La TVA sur la remise est-elle la même si on calcule TTC puis remise ?
        questions:
            -   id: q01
                type: texte
                enonce: Teste sur 1 000 € HT.
                aide: 'Calcule les deux chemins à partir de 1 000 € HT : remise puis TVA, et TVA puis remise. Compare les TTC.'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais calculer une facture complète. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment calculer une facture complète avec remise et TVA ?'
                aide: Dis l’ordre des calculs d’une facture, comment retrouver le HT et calculer un taux de remise.
retenir:
    - HT net × 1,2 = TTC.
    - Taux = 1 − nouveau ÷ ancien.
