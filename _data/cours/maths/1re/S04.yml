titre: 'Séance 4 : La facture : HT, remise, TVA et TTC'
themes:
- MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Comment calculer une facture avec remise et TVA, retrouver un prix HT et le taux d’une remise ?
competences_bo:
- MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
    - Total HT = somme des quantités × prix unitaires.
    - HT net = HT × (1 − remise) ; TTC = HT net × 1,2.
    - HT = TTC ÷ 1,2 ; taux de remise = 1 − nouveau ÷ ancien.
    competences:
    - Calculer une facture complète.
    - Retrouver un prix HT à partir du TTC.
    - Calculer le taux d’une remise.
pourquoi:
- 'Aujourd’hui, trois notions : la facture, retrouver le HT, calculer une remise.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — La facture
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Une facture liste les articles, calcule le total hors taxes (HT), applique une remise, puis ajoute la TVA.
    -   type: paragraphe
        texte: Le TTC est le montant que le client paie.
    -   type: paragraphe
        texte: 'À retenir : Total HT → HT net = HT × (1 − remise) → TTC = HT net × 1,2.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - 'Pour chaque ligne : quantité × prix unitaire.'
        - 'Additionne les lignes : total HT.'
        - 'Applique la remise : × 0,9 pour −10 %.'
        - 'Ajoute la TVA : × 1,2.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi cet ordre
    -   type: liste
        elements:
        - La remise est un geste du vendeur sur son prix HT.
        - La TVA est un impôt calculé sur le prix réellement vendu (HT net).
    -   type: paragraphe
        texte: 2. En regroupant
    -   type: liste
        elements:
        - HT × 0,9 × 1,2 = HT × 1,08.
        - Avec 10 % de remise et 20 % de TVA, le client paie 108 % du total HT.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Facture de la sellerie :'
    -   type: tableau
        colonnes:
        - Article
        - Quantité
        - Prix unitaire HT
        lignes:
        -   - Filet
            - '4'
            - 175,00 €
        -   - Licol
            - '6'
            - 22,50 €
        -   - Tapis
            - '5'
            - 38,00 €
    -   type: paragraphe
        texte: Facture fictive de la sellerie. Remise de 10 % sur le total HT, puis TVA 20 %.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Montant HT de la ligne Filet ?
        unite: €
        aide: 4 × 175.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Montant HT de la ligne Licol ?
        unite: €
        aide: 6 × 22,50.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Montant HT de la ligne Tapis ?
        unite: €
        aide: 5 × 38.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Total HT ?
        unite: €
        aide: Additionne les trois lignes.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Série B — HT net après la remise de 10 % ?
        unite: €
        aide: 1 025 × 0,9.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Montant de la TVA (20 % du HT net) ?
        unite: €
        aide: 922,50 × 0,2.
        calcul: true
    -   id: q07
        type: nombre
        enonce: Total TTC ?
        unite: €
        aide: 922,50 × 1,2.
        calcul: true
-   id: a02
    titre: Partie 2 — Retrouver le prix HT
    transition: 'Tu sais faire la facture. Deuxième notion : faire le chemin inverse.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Un prix affiché TTC contient la TVA. Pour retrouver le HT, on défait la multiplication par 1,2.
    -   type: paragraphe
        texte: On divise par 1,2 ; on ne retire jamais 20 % du TTC.
    -   type: paragraphe
        texte: 'À retenir : HT = TTC ÷ 1,2. TVA = TTC − HT.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Divise le TTC par 1,2.
        - Arrondis au centime.
        - 'Contrôle : HT × 1,2 = TTC.'
        - TVA = TTC − HT.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. En raisonnant avec les pourcentages
    -   type: liste
        elements:
        - Le TTC représente 120 % du HT.
        - Si 120 % = 60 €, alors 1 % = 0,50 € et 100 % = 50 €.
    -   type: paragraphe
        texte: 2. Pourquoi pas −20 %
    -   type: liste
        elements:
        - 60 − 20 % de 60 = 48 € ; mais 48 × 1,2 = 57,60 €, pas 60 €.
        - Les 20 % de TVA portent sur le HT, pas sur le TTC.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée. TVA 20 %.
    questions:
    -   id: q01
        type: nombre
        enonce: 'Série A — 90 € TTC : prix HT ?'
        unite: €
        aide: 90 ÷ 1,2.
        calcul: true
    -   id: q02
        type: nombre
        enonce: '210 € TTC : prix HT ?'
        unite: €
        aide: 210 ÷ 1,2.
        calcul: true
    -   id: q03
        type: nombre
        enonce: '1 440 € TTC : prix HT ?'
        unite: €
        aide: 1 440 ÷ 1,2.
        calcul: true
    -   id: q04
        type: nombre
        enonce: '54 € TTC : montant de TVA ?'
        unite: €
        aide: HT = 45 ; TVA = 54 − 45.
        calcul: true
    -   id: q05
        type: nombre
        enonce: 'Série B — 1 107 € TTC (la facture) : HT net ?'
        unite: €
        aide: 1 107 ÷ 1,2.
        calcul: true
    -   id: q06
        type: qcm
        enonce: Un élève enlève 20 % de 90 € TTC et trouve 72 € HT. A-t-il raison ?
        choix:
        -   id: a
            texte: Oui
        -   id: b
            texte: Non, le HT est 75 €
        aide: 'Contrôle : 72 × 1,2 = ?'
-   id: a03
    titre: Partie 3 — Quelle remise ?
    transition: 'Dernière notion : retrouver le pourcentage d’une remise.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Quand on connaît l’ancien et le nouveau prix, on peut retrouver le taux de la remise.
    -   type: paragraphe
        texte: On compare le nouveau prix à l’ancien.
    -   type: paragraphe
        texte: 'À retenir : Taux de remise = (1 − nouveau ÷ ancien) × 100.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - 'Divise le nouveau prix par l’ancien : c’est le coefficient.'
        - Calcule 1 − coefficient.
        - Multiplie par 100.
        - 'Contrôle : ancien × (1 − taux) = nouveau.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. En raisonnant avec les pourcentages
    -   type: liste
        elements:
        - 'Un filet passe de 175 € à 140 € : 140 ÷ 175 = 0,8 = 80 %.'
        - 'On paie 80 % : il manque 20 %, c’est la remise.'
    -   type: paragraphe
        texte: 2. Pourquoi diviser par l’ancien
    -   type: liste
        elements:
        - La remise est un pourcentage du prix de départ.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée.
    questions:
    -   id: q01
        type: nombre
        enonce: 'Série A — 50 € → 40 € : taux de remise en % ?'
        unite: '%'
        aide: 1 − 40 ÷ 50.
        calcul: true
    -   id: q02
        type: nombre
        enonce: '120 € → 90 € : taux de remise en % ?'
        unite: '%'
        aide: 1 − 90 ÷ 120.
        calcul: true
    -   id: q03
        type: nombre
        enonce: '1 025 € → 922,50 € : taux de remise en % ?'
        unite: '%'
        aide: 1 − 922,5 ÷ 1 025.
        calcul: true
    -   id: q04
        type: nombre
        enonce: '80 € → 68 € : taux de remise en % ?'
        unite: '%'
        aide: 1 − 68 ÷ 80.
        calcul: true
    -   id: q05
        type: nombre
        enonce: 'Série B — 350 € → 315 € : taux de remise en % ?'
        unite: '%'
        aide: 1 − 315 ÷ 350.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Un licol à 22,50 € est vendu 18 €. Remise en % ?
        unite: '%'
        aide: 1 − 18 ÷ 22,5.
        calcul: true
    -   id: q07
        type: nombre
        enonce: Après 15 % de remise, un tapis coûte 32,30 €. Prix avant remise ?
        unite: €
        aide: 32,30 ÷ 0,85.
        calcul: true
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: '2 couvertures à 64 € HT, remise 5 %, TVA 20 % : TTC ?'
        unite: €
        calcul: true
    -   id: q02
        type: nombre
        enonce: '300 € TTC : HT ?'
        unite: €
        calcul: true
    -   id: q03
        type: nombre
        enonce: '60 € → 45 € : remise en % ?'
        unite: '%'
        calcul: true
retenir:
- Total HT = somme des (quantité × prix unitaire HT).
- 'Remise de t % : HT net = HT × (1 − t/100).'
- TTC = HT net × 1,2 (TVA 20 %) ; HT = TTC ÷ 1,2.
- Taux de remise = (1 − nouveau prix ÷ ancien prix) × 100.
