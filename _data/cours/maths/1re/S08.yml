titre: 'Séance 8 : Résumer une série : position, dispersion, écart-type'
themes:
- MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
problematique: Comment résumer une série avec un indicateur de position et un indicateur de dispersion, dont l’écart-type ?
competences_bo:
- MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
objectifs:
    connaissances:
    - Moyenne, médiane ; étendue, quartiles, écart interquartile.
    - L’écart-type σ mesure l’écart moyen des valeurs à la moyenne.
    competences:
    - Calculer moyenne et médiane.
    - Calculer étendue, Q1, Q3.
    - Obtenir l’écart-type avec la calculatrice (ou le tableur) et l’interpréter.
pourquoi:
- 'Aujourd’hui, trois notions : la position, la dispersion avec les quartiles, l’écart-type.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — Moyenne et médiane
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Un indicateur de position dit autour de quelle valeur se trouve la série.
    -   type: paragraphe
        texte: 'Les deux principaux : la moyenne et la médiane.'
    -   type: paragraphe
        texte: 'À retenir : Moyenne = somme ÷ effectif. Médiane : valeur du milieu de la série rangée (effectif pair : moyenne des deux du milieu).'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Range la série.
        - 'Moyenne : additionne, divise par l’effectif.'
        - 'Médiane : rang (n + 1) ÷ 2 ; si n est pair, moyenne des valeurs de rangs n ÷ 2 et n ÷ 2 + 1.'
        - 'Contrôle : les deux sont entre le min et le max.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. La moyenne partage
    -   type: liste
        elements:
        - Si tous les chevaux avaient le même poids, avec le même total, chacun pèserait la moyenne.
    -   type: paragraphe
        texte: 2. La médiane coupe en deux
    -   type: liste
        elements:
        - Autant de chevaux pèsent moins que la médiane que plus.
        - Elle ne bouge pas si le plus lourd prend 100 kg.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Poids (kg) de 10 chevaux, rangés :'
    -   type: paragraphe
        texte: 480 ; 495 ; 500 ; 510 ; 515 ; 520 ; 530 ; 540 ; 555 ; 575.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Somme des poids ?
        unite: kg
        aide: Additionne les 10 valeurs.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Moyenne ?
        unite: kg
        aide: Somme ÷ 10.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Médiane ?
        unite: kg
        aide: '10 valeurs : (5e + 6e) ÷ 2.'
        calcul: true
    -   id: q04
        type: nombre
        enonce: Médiane de 7 ; 3 ; 9 ; 4 ; 12 ?
        aide: Range d’abord.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Moyenne de 7 ; 3 ; 9 ; 4 ; 12 ?
        aide: Somme ÷ 5.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Série B — Si le cheval de 575 kg pesait 675 kg, quelle serait la nouvelle moyenne ?
        unite: kg
        aide: La somme augmente de 100.
        calcul: true
    -   id: q07
        type: nombre
        enonce: Et la nouvelle médiane ?
        unite: kg
        aide: Les deux valeurs du milieu changent-elles ?
        calcul: true
-   id: a02
    titre: Partie 2 — Étendue et quartiles
    transition: 'Tu sais situer la série. Deuxième notion : mesurer si elle est serrée ou étalée.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Un indicateur de dispersion dit si les valeurs sont proches ou éloignées les unes des autres.
    -   type: paragraphe
        texte: Étendue = max − min ; écart interquartile = Q3 − Q1.
    -   type: paragraphe
        texte: 'À retenir : Q1 : rang n ÷ 4 ; Q3 : rang 3n ÷ 4 (arrondis à l’entier au-dessus) dans la série rangée.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Range la série et compte n.
        - Calcule les rangs de Q1 et Q3, arrondis au-dessus.
        - Lis Q1 et Q3.
        - Calcule Q3 − Q1 et max − min.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Ce que disent les quartiles
    -   type: liste
        elements:
        - Au moins 25 % des valeurs sont ≤ Q1, au moins 75 % sont ≤ Q3.
        - Entre Q1 et Q3 se trouve environ la moitié centrale des valeurs.
    -   type: paragraphe
        texte: 2. Pourquoi l’écart interquartile
    -   type: liste
        elements:
        - Il ne dépend pas des valeurs extrêmes.
        - Il mesure la largeur du « cœur » de la série.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Même série de 10 poids.
    -   type: paragraphe
        texte: 480 ; 495 ; 500 ; 510 ; 515 ; 520 ; 530 ; 540 ; 555 ; 575.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Étendue ?
        unite: kg
        aide: Max − min.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Rang de Q1 ?
        aide: 10 ÷ 4 = 2,5 → arrondi au-dessus.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Q1 ?
        unite: kg
        aide: La 3e valeur.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Rang de Q3 ?
        aide: 30 ÷ 4 = 7,5 → arrondi au-dessus.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Q3 ?
        unite: kg
        aide: La 8e valeur.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Série B — Écart interquartile ?
        unite: kg
        aide: Q3 − Q1.
        calcul: true
    -   id: q07
        type: nombre
        enonce: 'Série 3 ; 5 ; 6 ; 6 ; 8 ; 9 ; 9 ; 10 ; 14 ; 15 ; 18 ; 20 : écart interquartile ?'
        aide: 'n = 12 : rangs 3 et 9.'
        calcul: true
-   id: a03
    titre: Partie 3 — L’écart-type
    transition: 'Dernière notion : un indicateur de dispersion qui utilise toutes les valeurs.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: L’écart-type, noté σ (sigma), mesure de combien les valeurs s’écartent en moyenne de la moyenne.
    -   type: paragraphe
        texte: Plus σ est petit, plus les valeurs sont serrées autour de la moyenne. Il a la même unité que la série.
    -   type: paragraphe
        texte: 'À retenir : σ s’obtient à la calculatrice (mode statistique, σx) ou au tableur (=ECARTYPEP(plage)).'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - 'Calculatrice : mode STAT, saisis les valeurs dans une liste.'
        - Lance le calcul à une variable (1-Var) ; lis x̄ (moyenne) et σx (écart-type).
        - 'Tableur : =ECARTYPEP(B2:B11).'
        - Arrondis au centième et écris l’unité.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. L’idée
    -   type: liste
        elements:
        - Pour chaque valeur, on regarde son écart à la moyenne.
        - L’écart-type est une sorte de moyenne de ces écarts (on les met au carré pour ne pas avoir de négatifs, puis on prend la racine carrée).
    -   type: paragraphe
        texte: 2. Sur un petit exemple
    -   type: liste
        elements:
        - 'Série 4 ; 6 ; 8 ; 10 ; 12 : moyenne 8 ; écarts −4, −2, 0, 2, 4.'
        - 'Carrés : 16, 4, 0, 4, 16 ; moyenne 8 ; racine de 8 ≈ 2,83 = σ.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice en mode statistique (ou tableur). Arrondis au centième.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Écart-type de 10 ; 10 ; 10 ; 10 ?
        aide: Toutes les valeurs sont égales.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Écart-type de 4 ; 6 ; 8 ; 10 ; 12 ?
        aide: 'Calculatrice : σx.'
        calcul: true
    -   id: q03
        type: nombre
        enonce: Écart-type de 2 ; 4 ; 6 ; 8 ?
        aide: 'Calculatrice : σx.'
        calcul: true
    -   id: q04
        type: nombre
        enonce: Écart-type des 10 poids de chevaux ?
        unite: kg
        aide: Saisis les 10 valeurs ; lis σx.
        calcul: true
    -   id: q05
        type: qcm
        enonce: 'Série B — Lot A : σ = 3 kg. Lot B : σ = 12 kg. Lequel est le plus homogène ?'
        choix:
        -   id: a
            texte: Lot A
        -   id: b
            texte: Lot B
        aide: Le plus petit σ.
    -   id: q06
        type: qcm
        enonce: Sur la calculatrice, quelle valeur prendre ?
        choix:
        -   id: a
            texte: σx
        -   id: b
            texte: sx
        -   id: c
            texte: Σx
        aide: σ est la lettre sigma minuscule.
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: Moyenne de 15 ; 18 ; 20 ; 27 ?
        calcul: true
    -   id: q02
        type: nombre
        enonce: Médiane de 15 ; 18 ; 20 ; 27 ?
        calcul: true
    -   id: q03
        type: nombre
        enonce: Écart-type de 1 ; 3 ; 5 ; 7 ; 9 ?
        calcul: true
    -   id: q04
        type: nombre
        enonce: Écart-type de 50 ; 50 ; 60 ; 60 ?
        calcul: true
retenir:
- 'Moyenne = somme ÷ effectif ; médiane : valeur du milieu de la série rangée.'
- 'Q1 : rang n ÷ 4 ; Q3 : rang 3n ÷ 4 (arrondis au-dessus) ; écart interquartile = Q3 − Q1.'
- 'Écart-type σ : écart « moyen » à la moyenne ; petit σ = valeurs serrées autour de la moyenne.'
- 'Au tableur : =MOYENNE, =MEDIANE, =QUARTILE(;1), =ECARTYPEP.'
