titre: 'Séance 8 : Résumer une série au tableur'
themes:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
problematique: Comment résumer rapidement une série avec des indicateurs au tableur ?
competences_bo:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
objectifs:
    connaissances:
        - 'Indicateurs de position : moyenne, médiane ; de dispersion : étendue, quartiles, écart interquartile, écart-type.'
        - 'Fonctions : MOYENNE, MEDIANE, QUARTILE, ECARTYPEP, MIN, MAX.'
    competences:
        - Calculer des indicateurs au tableur.
        - Interpréter position et dispersion.
pourquoi:
    - En 2de, tu as calculé des indicateurs à la main.
    - 'En 1re, on travaille sur de vraies tailles de fichiers : les notes de 60 chevaux en concours de modèle et allures.'
activites:
    -   id: a01
        titre: Les indicateurs
        consigne: Tu vas calculer au tableur les indicateurs de position des 60 notes de concours. On attend trois résultats.
        contenu:
            -   type: fichier
                titre: notes de 60 chevaux en modèle et allures
                url: /assets/fichiers/maths/1re/modele_allures.ods
            -   type: titre
                texte: Exemple
            -   type: liste
                elements:
                    - 'Automatisme : moyenne de 12, 14, 16.'
            -   type: etapes
                elements:
                    - Ouvre le fichier modele_allures.ods (à télécharger ci-dessus) (60 notes sur 20).
                    - Calcule NB, MOYENNE, MEDIANE, MIN, MAX.
            -   type: paragraphe
                texte: Pourquoi NB ? Vérifier qu’aucune note ne manque.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - La moyenne et la médiane sont des indicateurs de …… .
                        - ''
                    -   - =NB(plage) compte les …… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: tableau
                enonce: Résultats.
                colonnes:
                    - Indicateur
                    - Valeur
                lignes:
                    -   - NB
                        - ''
                    -   - MOYENNE (au centième)
                        - ''
                    -   - MEDIANE
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: La dispersion
        transition: Tu as la position. Mesure la dispersion.
        consigne: Tu vas calculer les quartiles, l’écart interquartile et l’écart-type des notes. On attend les quatre valeurs.
        contenu:
            -   type: etapes
                elements:
                    - Calcule Q1, Q3, écart interquartile, ECARTYPEP.
            -   type: paragraphe
                texte: Pourquoi l’écart-type ? Il mesure l’écart moyen à la moyenne.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - L’écart-type mesure la dispersion autour de la …… .
                        - ''
                    -   - Écart interquartile = …… − Q1.
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: texte
                enonce: Écris Q1, Q3, l’écart interquartile et l’écart-type.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a03
        titre: Interpréter
        transition: Les indicateurs sont calculés. Que disent-ils ?
        consigne: Tu vas interpréter la position et la dispersion des notes en deux phrases. On attend les deux phrases.
        contenu:
            -   type: etapes
                elements:
                    - 'Rédige deux phrases : une sur la position, une sur la dispersion.'
            -   type: paragraphe
                texte: Pourquoi deux phrases ? Un juge veut savoir le niveau moyen et si les chevaux sont homogènes.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - On interprète avec une phrase sur la position et une sur la …… .
                        - ''
                    -   - La moitié des valeurs est au-dessus de la …… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: texte
                enonce: Rédige ton interprétation.
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une note de 4/20 (cheval boiteux) entre dans la série.
        questions:
            -   id: q01
                type: texte
                enonce: 'Quel indicateur bouge le plus : moyenne ou médiane ?'
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais résumer une série au tableur. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment résumer rapidement une série avec des indicateurs au tableur ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - MOYENNE, MEDIANE, QUARTILE, ECARTYPEP.
    - Position + dispersion.
sources:
    -   type: lien
        titre: ChloroFil — Bac Pro, tronc commun rénové, document d’accompagnement du module MG1
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/bacpro/bacpro-tc-da-MG1.pdf
