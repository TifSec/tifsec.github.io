titre: 'Séance 3 : Deux hausses de prix de suite : +10 % puis +5 %, est-ce +15 % ?'
themes:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Comment calculer l’effet de plusieurs évolutions successives ?
competences_bo:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
        - 'Évolutions successives : on multiplie les coefficients ; on n’additionne pas les pourcentages.'
        - 'Évolution réciproque : coefficient réciproque = 1 ÷ coefficient de départ.'
    competences:
        - Calculer un coefficient global.
        - Calculer une évolution réciproque.
pourquoi:
    - En 2de, tu as calculé une hausse.
    - 'Le prix du foin a augmenté deux années de suite : quelle hausse au total ?'
activites:
    -   id: a01
        titre: Le coefficient global
        consigne: Tu vas calculer le coefficient global de deux hausses successives du prix du foin. On attend le coefficient et la hausse totale.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: 'En janvier, le fournisseur augmente le foin de 10 %. En juin, il l’augmente encore de 5 %. Le gérant de l’écurie dit : « En tout, ça fait +15 %. » A-t-il raison ?'
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Le coefficient global est un seul nombre qui remplace plusieurs évolutions faites l’une après l’autre. Multiplier le prix de départ par ce nombre donne directement le prix final.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - 'Connaître l’évolution totale d’un prix qui a changé plusieurs fois : le foin sur l’année, une pension sur plusieurs années, un aliment après une hausse puis une promotion.'
                    - Comparer deux fournisseurs qui n’ont pas augmenté leurs prix de la même façon.
                    - Ne pas se faire piéger par une addition de pourcentages, qui donne un résultat faux.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - 'On traduit chaque évolution en coefficient multiplicateur : une hausse de t % donne × (1 + t/100) ; une baisse de t % donne × (1 − t/100).'
                    - La 2e évolution s’applique au prix déjà modifié, pas au prix de départ. On enchaîne donc les multiplications.
                    - 'On multiplie les coefficients entre eux : on obtient le coefficient global.'
                    - 'On retraduit en pourcentage : (coefficient global − 1) × 100. Un résultat positif est une hausse, un résultat négatif une baisse.'
            -   type: paragraphe
                texte: 'À retenir : Pour des évolutions successives, on multiplie les coefficients. On n’additionne jamais les pourcentages.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - 'Une hausse de 10 %, puis une autre hausse de 10 % : quelle évolution totale ?'
                    - 'Une hausse de 20 %, puis une baisse de 20 % : revient-on au prix de départ ?'
                    - 'Une baisse de 10 %, puis une hausse de 5 % : quelle évolution totale ?'
            -   type: liste
                elements:
                    - 'Automatisme : 1,1 × 1,05 = ?'
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : hausse de 10 % puis de 5 % : multiplie les coefficients.'
                    - Pourquoi multiplier ? La 2e hausse s’applique au prix déjà augmenté.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Évolutions successives : on …… les coefficients.'
                        - ''
                    -   - +10 % puis +5 % donnent un coefficient de …… .
                        - ''
                aide: 'Relis l’exemple +20 % puis +10 % : que fait-on avec 1,2 et 1,1 ? Fais la même chose avec 1,1 et 1,05.'
            -   id: q02
                type: nombre
                enonce: Quel est le coefficient global ?
                aide: Multiplie le coefficient d’une hausse de 10 % par celui d’une hausse de 5 %.
            -   id: q03
                type: nombre
                enonce: Quelle hausse totale en % ?
                unite: '%'
                aide: Ton coefficient global, écrit en %, moins 100 % donne la hausse totale.
    -   id: a02
        titre: Sur un prix réel
        transition: Tu as le coefficient. Applique-le.
        consigne: Tu vas appliquer les deux hausses à un prix de 140 € la tonne et comparer avec +15 %. On attend le prix final et la différence.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: La tonne de foin coûtait 140 €. Combien coûte-t-elle après les deux hausses (+10 % puis +5 %) ? Combien le gérant se trompe-t-il avec son « +15 % » ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: C’est le prix réellement payé après toutes les évolutions, calculé à partir du prix de départ.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - 'Établir un budget juste : achat du foin pour l’année, prix d’une pension, devis.'
                    - Vérifier une facture ou un tarif annoncé par un fournisseur.
                    - 'Mesurer en euros l’erreur faite quand on additionne les pourcentages : un écart en euros convainc mieux qu’un écart en pourcentage.'
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - 'Méthode 1, étape par étape : on applique la 1re évolution au prix de départ, puis la 2e au nouveau prix.'
                    - 'Méthode 2, en une seule fois : on multiplie le prix de départ par le coefficient global.'
                    - 'Les deux méthodes donnent le même résultat : l’une sert à vérifier l’autre.'
                    - On compare ensuite avec le calcul faux (en additionnant les pourcentages) pour voir l’écart en euros.
            -   type: paragraphe
                texte: 'À retenir : Prix final = prix de départ × coefficient global.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Une pension coûte 400 €. Elle augmente de 5 %, puis encore de 5 %. Quel est le nouveau prix ? Compare avec une hausse de 10 %.
                    - Un sac de granulés coûte 18 €. Il augmente de 10 %, puis baisse de 10 %. Quel est son prix final ?
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : le foin coûtait 140 € la tonne ; applique +10 % puis +5 %.'
                    - Pourquoi vérifier sur un prix ? On voit concrètement la différence avec +15 %.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Les pourcentages successifs ne s’…… pas.
                        - ''
                    -   - +10 % puis +5 % font +…… %.
                        - ''
                aide: Dans l’exemple, +20 % puis +10 % ne donnent pas +30 %. Que peut-on dire des pourcentages successifs ? Puis lis ton coefficient global.
            -   id: q02
                type: nombre
                enonce: Prix final ?
                unite: €
                aide: 140 € × 1,1, puis le résultat × 1,05 (ou 140 × coefficient global).
            -   id: q03
                type: texte
                enonce: Quelle différence avec une hausse de +15 % ?
                aide: Calcule 140 × 1,15 et compare avec ton prix final.
    -   id: a03
        titre: L’évolution réciproque
        transition: Les hausses s’enchaînent. Et pour revenir en arrière ?
        consigne: Tu vas calculer la baisse qui annule une hausse de 25 %. On attend la baisse en pourcentage.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Un aliment a augmenté de 25 %. Le fournisseur propose une remise pour « revenir au prix d’avant ». Faut-il une remise de 25 % ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: L’évolution réciproque est l’évolution qui annule une évolution déjà faite et ramène exactement à la valeur de départ.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Savoir quelle remise ramène un prix à son niveau d’avant une hausse.
                    - Retrouver un prix de départ quand on ne connaît que le prix final, par exemple le prix d’avant une augmentation.
                    - Comprendre pourquoi « +25 % puis −25 % » ne ramène pas au prix de départ.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - On écrit le coefficient de l’évolution de départ.
                    - 'Revenir en arrière, c’est faire l’opération inverse : on divise par ce coefficient. Diviser par un nombre revient à multiplier par 1 ÷ ce nombre : c’est le coefficient réciproque.'
                    - 'On retraduit le coefficient réciproque en pourcentage : (coefficient − 1) × 100.'
                    - 'La baisse qui annule une hausse est plus petite que la hausse : elle s’applique à un prix plus élevé.'
            -   type: paragraphe
                texte: 'À retenir : Coefficient réciproque = 1 ÷ coefficient de départ.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Un prix a augmenté de 100 %. Quelle évolution le ramène au prix de départ ?
                    - Un prix a baissé de 20 %. Quelle évolution le ramène au prix de départ ?
                    - Un prix a augmenté de 60 %. Quelle évolution le ramène au prix de départ ?
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : le prix d’un aliment a augmenté de 25 %. Quelle baisse le ramènerait au prix initial ?'
                    - Pourquoi pas −25 % ? La baisse s’applique au prix déjà augmenté, plus élevé.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Évolution réciproque : coefficient = 1 ÷ …… .'
                        - ''
                    -   - Pour annuler +25 %, il faut −…… %.
                        - ''
                aide: 'Relis l’exemple +50 % : pour revenir, on fait 1 ÷ quoi ? Applique à une hausse de 25 % (coefficient 1,25).'
            -   id: q02
                type: nombre
                enonce: Quelle baisse en % ?
                unite: '%'
                aide: Calcule 1 ÷ 1,25, puis 1 moins ce résultat, en %.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le prix d’une pension a augmenté de 3 % par an pendant 4 ans.
        questions:
            -   id: q01
                type: texte
                enonce: Hausse totale ?
                aide: 'Quatre hausses de 3 % : multiplie 1,03 par lui-même 4 fois (puissance 4), puis transforme en %.'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais enchaîner des évolutions. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment calculer l’effet de plusieurs évolutions successives ?'
                aide: Dis pourquoi on multiplie les coefficients et comment trouver l’évolution réciproque.
retenir:
    - 'Successives : produit des coefficients.'
    - 'Réciproque : 1 / coefficient.'
