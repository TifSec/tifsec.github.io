titre: 'Séance 3 : Évolutions successives et évolution réciproque'
themes:
- MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Deux hausses de suite, +10 % puis +5 %, est-ce +15 % ? Et comment revenir au prix de départ ?
competences_bo:
- MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
    - 'Évolutions successives : on multiplie les coefficients.'
    - Taux global = (coefficient global − 1) × 100.
    - 'Évolution réciproque : coefficient 1 ÷ c.'
    competences:
    - Calculer un coefficient global et le taux global.
    - Appliquer des évolutions successives à un prix.
    - Calculer l’évolution qui ramène au prix de départ.
pourquoi:
- 'Aujourd’hui, trois notions : le coefficient global, l’appliquer à un prix, l’évolution réciproque.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — Le coefficient global
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Quand un prix subit plusieurs évolutions de suite, chaque évolution s’applique au nouveau prix.
    -   type: paragraphe
        texte: Le coefficient de l’évolution totale est le produit des coefficients.
    -   type: paragraphe
        texte: 'À retenir : Coefficient global = c₁ × c₂. Taux global = (coefficient global − 1) × 100.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Écris chaque coefficient (+10 % → 1,1 ; −20 % → 0,8).
        - Multiplie-les.
        - 'Enlève 1, multiplie par 100 : c’est le taux global.'
        - 'Positif : hausse ; négatif : baisse.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. En raisonnant avec les pourcentages
    -   type: liste
        elements:
        - Le prix de départ, c’est 100 %. Après +10 %, on paie 110 %.
        - 'Les +5 % s’appliquent à ces 110 % : 5 % de 110 = 5,5. Total : 115,5 %, soit +15,5 %.'
    -   type: paragraphe
        texte: 2. En regroupant
    -   type: liste
        elements:
        - 'Prix × 1,1, puis × 1,05 : prix × (1,1 × 1,05) = prix × 1,155.'
        - 'On n’additionne pas : la 2e hausse porte sur un prix déjà augmenté.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée. Pour une baisse, écris le signe moins.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Coefficient global de +10 % puis +10 % ?
        aide: 1,1 × 1,1.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Taux global correspondant, en % ?
        unite: '%'
        aide: (1,21 − 1) × 100.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Coefficient global de +20 % puis −20 % ?
        aide: 1,2 × 0,8.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Taux global correspondant, en % ?
        unite: '%'
        aide: (0,96 − 1) × 100.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Série B — Coefficient global de −10 % puis −10 % ?
        aide: 0,9 × 0,9.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Taux global de +5 % puis +3 % (au dixième) ?
        unite: '%'
        aide: 1,05 × 1,03 = 1,0815.
        calcul: true
    -   id: q07
        type: qcm
        enonce: +30 % puis −30 %, c’est…
        choix:
        -   id: a
            texte: 0 %
        -   id: b
            texte: −9 %
        -   id: c
            texte: +9 %
        aide: 1,3 × 0,7.
-   id: a02
    titre: Partie 2 — Sur un prix réel
    transition: 'Tu sais calculer le coefficient global. Deuxième notion : l’appliquer à un prix.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Pour trouver le prix final, on multiplie le prix de départ par le coefficient global.
    -   type: paragraphe
        texte: 'On peut aussi appliquer les évolutions une par une : le résultat est le même.'
    -   type: paragraphe
        texte: 'À retenir : Prix final = prix de départ × c₁ × c₂.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Calcule le coefficient global.
        - Multiplie le prix de départ.
        - Arrondis au centime à la fin.
        - 'Contrôle : refais en deux étapes.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Deux étapes ou une
    -   type: liste
        elements:
        - 400 € × 1,1 = 440 € ; 440 × 1,05 = 462 €.
        - '400 × 1,155 = 462 € : même résultat.'
    -   type: paragraphe
        texte: 2. Pourquoi arrondir à la fin
    -   type: liste
        elements:
        - Chaque arrondi en route peut décaler le résultat d’un centime ou plus.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée. Arrondis au centime.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — 400 € avec +10 % puis +5 % ?
        unite: €
        aide: 400 × 1,155.
        calcul: true
    -   id: q02
        type: nombre
        enonce: 250 € avec +20 % puis −20 % ?
        unite: €
        aide: 250 × 0,96.
        calcul: true
    -   id: q03
        type: nombre
        enonce: 1 200 € avec −10 % puis −5 % ?
        unite: €
        aide: 1 200 × 0,9 × 0,95.
        calcul: true
    -   id: q04
        type: nombre
        enonce: 380 € avec +4 % puis +2 % ?
        unite: €
        aide: 380 × 1,0608.
        calcul: true
    -   id: q05
        type: nombre
        enonce: 'Série B — Une selle de 800 € : soldes −30 %, puis remise fidélité −10 % sur le prix soldé. Prix final ?'
        unite: €
        aide: 800 × 0,7 × 0,9.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Et la remise totale en % ?
        unite: '%'
        aide: 1 − 0,63.
        calcul: true
-   id: a03
    titre: Partie 3 — L’évolution réciproque
    transition: 'Dernière notion : revenir au prix de départ.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: L’évolution réciproque est celle qui ramène au prix de départ.
    -   type: paragraphe
        texte: Après une hausse de 20 %, il ne suffit pas de baisser de 20 % pour revenir au départ.
    -   type: paragraphe
        texte: 'À retenir : Coefficient réciproque = 1 ÷ c. Taux réciproque = (1 ÷ c − 1) × 100.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Écris le coefficient c de l’évolution.
        - Calcule 1 ÷ c.
        - Enlève 1, multiplie par 100.
        - 'Contrôle : c × (1 ÷ c) = 1.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Avec un prix
    -   type: liste
        elements:
        - 100 € + 20 % = 120 €. Pour revenir à 100 €, on enlève 20 € sur 120 €.
        - '20 sur 120, c’est environ 16,7 % : la baisse doit être de 16,7 %, pas de 20 %.'
    -   type: paragraphe
        texte: 2. Avec le coefficient
    -   type: liste
        elements:
        - '× 1,2 puis × (1 ÷ 1,2) = × 1 : on revient au départ.'
        - 1 ÷ 1,2 ≈ 0,833, soit une baisse d’environ 16,7 %.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée. Arrondis au dixième.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Coefficient réciproque de 0,8 ?
        aide: 1 ÷ 0,8.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Hausse nécessaire après −20 %, en % ?
        unite: '%'
        aide: (1,25 − 1) × 100.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Coefficient réciproque de 1,25 ?
        aide: 1 ÷ 1,25.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Baisse nécessaire après +25 %, en % ?
        unite: '%'
        aide: (0,8 − 1) × 100.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Série B — Baisse nécessaire après +20 %, en % (au dixième) ?
        unite: '%'
        aide: (1 ÷ 1,2 − 1) × 100.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Hausse nécessaire après −50 %, en % ?
        unite: '%'
        aide: 1 ÷ 0,5 = 2.
        calcul: true
    -   id: q07
        type: nombre
        enonce: Un prix soldé à 72 € après −20 %. Prix d’origine ?
        unite: €
        aide: 72 ÷ 0,8.
        calcul: true
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: Coefficient global de +15 % puis +10 % ?
        calcul: true
    -   id: q02
        type: nombre
        enonce: 500 € avec −10 % puis +10 % ?
        unite: €
        calcul: true
    -   id: q03
        type: nombre
        enonce: Hausse nécessaire après −40 % (au dixième) ?
        unite: '%'
        calcul: true
retenir:
- '+t % : × (1 + t/100) ; −t % : × (1 − t/100).'
- 'Évolutions successives : coefficient global = produit des coefficients ; on n’additionne pas les %.'
- Taux global = (coefficient global − 1) × 100.
- 'Pour revenir au départ : coefficient réciproque = 1 ÷ c.'
