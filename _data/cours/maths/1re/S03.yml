titre: 'Séance 3 : Deux hausses de prix de suite : +10 % puis +5 %, est-ce +15 % ?'
themes:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Comment calculer l’effet de plusieurs évolutions successives ?
competences_bo:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
        - 'Évolutions successives : on multiplie les coefficients : 1,10 × 1,05 = 1,155, soit +15,5 %.'
        - 'Évolution réciproque : pour annuler +25 %, il faut × 1/1,25 = 0,8, soit −20 %.'
    competences:
        - Calculer un coefficient global.
        - Calculer une évolution réciproque.
pourquoi:
    - En 2de, tu as calculé une hausse.
    - 'Le prix du foin a augmenté deux années de suite : quelle hausse au total ?'
activites:
    -   id: a01
        titre: Le coefficient global
        consigne: Tu vas calculer le coefficient global de deux hausses successives du prix du foin. On attend le coefficient et la hausse totale.
        contenu:
            -   type: titre
                texte: Exemple
            -   type: liste
                elements:
                    - 'Automatisme : 1,1 × 1,05 = ?'
            -   type: etapes
                elements:
                    - Hausse de 10 % puis de 5 %.
                    - Multiplie les coefficients.
            -   type: paragraphe
                texte: Pourquoi multiplier ? La 2e hausse s’applique au prix déjà augmenté.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Évolutions successives : on …… les coefficients.'
                        - ''
                    -   - +10 % puis +5 % donnent un coefficient de …… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: nombre
                enonce: Quel est le coefficient global ?
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q03
                type: nombre
                enonce: Quelle hausse totale en % ?
                unite: '%'
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a02
        titre: Sur un prix réel
        transition: Tu as le coefficient. Applique-le.
        consigne: Tu vas appliquer les deux hausses à un prix de 140 € la tonne et comparer avec +15 %. On attend le prix final et la différence.
        contenu:
            -   type: etapes
                elements:
                    - Le foin coûtait 140 € la tonne.
                    - Applique +10 % puis +5 %.
            -   type: paragraphe
                texte: Pourquoi vérifier sur un prix ? On voit concrètement la différence avec +15 %.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Les pourcentages successifs ne s’…… pas.
                        - ''
                    -   - +10 % puis +5 % font +…… %.
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: nombre
                enonce: Prix final ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q03
                type: texte
                enonce: Quelle différence avec une hausse de +15 % ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a03
        titre: L’évolution réciproque
        transition: Les hausses s’enchaînent. Et pour revenir en arrière ?
        consigne: Tu vas calculer la baisse qui annule une hausse de 25 %. On attend la baisse en pourcentage.
        contenu:
            -   type: etapes
                elements:
                    - Le prix d’un aliment a augmenté de 25 %.
                    - Quelle baisse le ramènerait au prix initial ?
            -   type: paragraphe
                texte: Pourquoi pas −25 % ? La baisse s’applique au prix déjà augmenté, plus élevé.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Évolution réciproque : coefficient = 1 ÷ …… .'
                        - ''
                    -   - Pour annuler +25 %, il faut −…… %.
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: nombre
                enonce: Quelle baisse en % ?
                unite: '%'
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le prix d’une pension a augmenté de 3 % par an pendant 4 ans.
        questions:
            -   id: q01
                type: texte
                enonce: Hausse totale ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais enchaîner des évolutions. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment calculer l’effet de plusieurs évolutions successives ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Successives : produit des coefficients.'
    - 'Réciproque : 1 / coefficient.'
