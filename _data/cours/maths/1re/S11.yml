titre: 'Séance 11 : L’écart-type : quand l’utiliser ?'
themes:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
problematique: Comment interpréter l’écart-type d’une série « en cloche » ?
competences_bo:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
objectifs:
    connaissances:
        - L’écart-type σ mesure la dispersion autour de la moyenne ; il s’utilise avec la moyenne.
        - 'Pour une série en cloche : environ 68 % des valeurs dans [x̄ − σ ; x̄ + σ], 95 % dans [x̄ − 2σ ; x̄ + 2σ], 99 % dans [x̄ − 3σ ; x̄ + 3σ].'
    competences:
        - Calculer un écart-type au tableur.
        - Utiliser les intervalles 68-95-99 %.
pourquoi:
    - En S08, tu as calculé un écart-type sans l’interpréter.
    - Les tailles au garrot d’une race suivent souvent une répartition en cloche.
activites:
    -   id: a01
        titre: Les intervalles
        consigne: Tu vas calculer les intervalles à un et deux écarts-types pour les tailles d’une race. On attend les deux intervalles.
        contenu:
            -   type: liste
                elements:
                    - 'Automatisme : 165 − 2 × 4 = ?'
            -   type: etapes
                elements:
                    - 'Lis l’exemple : moyenne 150 cm, écart-type 5 cm, répartition en cloche.'
                    - 'Intervalle à environ 68 % : [x̄ − σ ; x̄ + σ] = [150 − 5 ; 150 + 5] = [145 ; 155].'
                    - 'Intervalle à environ 95 % : [x̄ − 2σ ; x̄ + 2σ] = [150 − 10 ; 150 + 10] = [140 ; 160].'
                    - 'À toi : tailles d’une race : moyenne 165 cm, écart-type 4 cm, répartition en cloche. Calcule les deux intervalles.'
                    - Pourquoi ces intervalles ? Ils disent ce qui est « normal » et ce qui est exceptionnel.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Environ 68 % des valeurs sont dans [x̄ − σ ; x̄ + …… ].
                        - ''
                    -   - Environ …… % sont dans [x̄ − 2σ ; x̄ + 2σ].
                        - ''
                aide: 'Relis l’exemple 150 ± 5 : l’intervalle à 68 % va de x̄ − σ à x̄ + quoi ? Et avec 2σ, environ quel pourcentage ?'
            -   id: q02
                type: tableau
                enonce: Complète.
                colonnes:
                    - Intervalle
                    - Bornes (cm)
                lignes:
                    -   - x̄ ± σ (≈ 68 %)
                        - ''
                    -   - x̄ ± 2σ (≈ 95 %)
                        - ''
                aide: 'Avec moyenne 165 cm et écart-type 4 cm : calcule 165 − 4 et 165 + 4, puis 165 − 8 et 165 + 8.'
    -   id: a02
        titre: Un cheval exceptionnel ?
        transition: Tu as les intervalles. Situe un cheval.
        consigne: Tu vas dire si un cheval de 175 cm est exceptionnel pour sa race. On attend une réponse justifiée par l’intervalle.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : avec l’intervalle à 95 % [140 ; 160], un poney de 162 cm.'
                    - '162 > 160 : il est en dehors de l’intervalle.'
                    - 'Il fait donc partie des 5 % de valeurs les plus extrêmes : il est exceptionnel.'
                    - 'À toi : un cheval de la race mesure 175 cm. Est-il dans l’intervalle à 95 % ?'
                    - Pourquoi ? On repère les valeurs rares.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Une valeur hors de x̄ ± 2σ est …… .
                        - ''
                    -   - x̄ + 2σ = 165 + 2 × 4 = …… .
                        - ''
                aide: 'Relis l’exemple du poney de 162 cm : une valeur en dehors de x̄ ± 2σ est-elle courante ? Puis calcule 165 + 2 × 4.'
            -   id: q02
                type: texte
                enonce: Ce cheval est-il exceptionnel ? Justifie.
                aide: Compare 175 cm à la borne haute de l’intervalle à 95 % que tu as trouvée.
    -   id: a03
        titre: Au tableur
        transition: Le raisonnement est fait. Vérifie sur des données.
        consigne: Tu vas vérifier au tableur la règle des 68 % sur 200 tailles. On attend le pourcentage obtenu et ta conclusion.
        contenu:
            -   type: fichier
                titre: tailles au garrot de 200 chevaux d’une race
                url: /assets/fichiers/maths/1re/tailles_race.ods
            -   type: etapes
                elements:
                    - 'Lis l’exemple : moyenne en D1, écart-type en D2, valeurs en A2:A201.'
                    - 'Bornes : D3 =D1-D2 et D4 =D1+D2.'
                    - 'Nombre de valeurs entre les deux : =NB.SI.ENS(A2:A201;">="&D3;A2:A201;"<="&D4).'
                    - 'Pourcentage : résultat ÷ 200 × 100.'
                    - 'À toi : ouvre tailles_race.ods (200 valeurs), calcule moyenne et ECARTYPEP, puis compte les valeurs dans [x̄ − σ ; x̄ + σ].'
                    - Pourquoi vérifier ? Le 68 % n’est vrai que si la série est vraiment en cloche.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Ces règles valent pour une série en …… .
                        - ''
                    -   - Au tableur, l’écart-type se calcule avec …… .
                        - ''
                aide: Ces règles marchent pour une répartition en forme de… ? Et quelle fonction donne l’écart-type au tableur ?
            -   id: q02
                type: texte
                enonce: Quel pourcentage des valeurs est dans [x̄ − σ ; x̄ + σ] ? Est-ce proche de 68 % ?
                aide: 'Dans tailles_race.ods : compte avec NB.SI.ENS les valeurs entre les deux bornes, divise par 200, × 100. Compare à 68.'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Pour des prix de chevaux (très dissymétriques), la règle 68-95 % s’applique-t-elle ?
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi ?
                aide: Pour des prix de chevaux, quelques chevaux très chers étirent la série d’un côté. Est-ce encore une cloche symétrique ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais interpréter un écart-type. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment interpréter l’écart-type d’une série « en cloche » ?'
                aide: Dis ce que représentent les intervalles x̄ ± σ et x̄ ± 2σ, et quand ils s’appliquent.
retenir:
    - x̄ ± σ ≈ 68 % ; x̄ ± 2σ ≈ 95 %.
    - Seulement pour une série en cloche.
