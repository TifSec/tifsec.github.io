titre: 'Séance 11 : Moyenne et écart-type : les intervalles'
themes:
- MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
problematique: Comment utiliser la moyenne et l’écart-type pour savoir où se trouvent la plupart des valeurs, et repérer une valeur exceptionnelle ?
competences_bo:
- MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
objectifs:
    connaissances:
    - '[x̄ − σ ; x̄ + σ] contient environ 68 % des valeurs ; [x̄ − 2σ ; x̄ + 2σ] environ 95 %.'
    - Valable pour une série « en cloche » (symétrique, avec beaucoup de valeurs au centre).
    competences:
    - Calculer les bornes des intervalles x̄ ± σ et x̄ ± 2σ.
    - Estimer un nombre de valeurs dans un intervalle.
    - Dire si une valeur est exceptionnelle.
pourquoi:
- 'Aujourd’hui, trois notions : l’intervalle x̄ ± σ, l’intervalle x̄ ± 2σ, la valeur exceptionnelle.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — L’intervalle x̄ ± σ
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: 'Pour beaucoup de mesures (tailles, poids), les valeurs se répartissent « en cloche » : beaucoup au centre, peu aux extrémités.'
    -   type: paragraphe
        texte: Dans ce cas, environ 68 % des valeurs sont à moins d’un écart-type de la moyenne.
    -   type: paragraphe
        texte: 'À retenir : Intervalle [x̄ − σ ; x̄ + σ] : environ 68 % des valeurs.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Calcule x̄ − σ (borne basse).
        - Calcule x̄ + σ (borne haute).
        - Écris l’intervalle [borne basse ; borne haute].
        - Nombre de valeurs attendues ≈ 68 % de l’effectif.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi « à moins d’un écart-type »
    -   type: liste
        elements:
        - σ est l’écart typique à la moyenne.
        - La plupart des valeurs sont donc à moins de σ de la moyenne, de chaque côté.
    -   type: paragraphe
        texte: 2. Pourquoi 68 %
    -   type: liste
        elements:
        - C’est une propriété des séries en cloche, observée sur des milliers de mesures.
        - Environ 2 valeurs sur 3 sont dans cet intervalle.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Poids de 200 chevaux de selle : x̄ = 520 kg, σ = 30 kg (série en cloche).'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Borne basse de x̄ ± σ ?
        unite: kg
        aide: 520 − 30.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Borne haute de x̄ ± σ ?
        unite: kg
        aide: 520 + 30.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Environ combien de chevaux pèsent entre 490 et 550 kg ?
        aide: 68 % de 200.
        calcul: true
    -   id: q04
        type: nombre
        enonce: 'Tailles : x̄ = 158 cm, σ = 4 cm. Borne basse de x̄ ± σ ?'
        unite: cm
        aide: 158 − 4.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Borne haute ?
        unite: cm
        aide: 158 + 4.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Série B — x̄ = 12,5 kg de foin par jour, σ = 1,5 kg. Borne basse ?
        unite: kg
        aide: 12,5 − 1,5.
        calcul: true
    -   id: q07
        type: nombre
        enonce: Sur 50 chevaux, environ combien ont une consommation dans x̄ ± σ ?
        aide: 68 % de 50.
        calcul: true
-   id: a02
    titre: Partie 2 — L’intervalle x̄ ± 2σ
    transition: 'Tu connais l’intervalle à un écart-type. Deuxième notion : l’intervalle deux fois plus large.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: En élargissant à deux écarts-types de chaque côté, on attrape presque toutes les valeurs.
    -   type: paragraphe
        texte: Environ 95 % des valeurs d’une série en cloche sont dans [x̄ − 2σ ; x̄ + 2σ].
    -   type: paragraphe
        texte: 'À retenir : Intervalle [x̄ − 2σ ; x̄ + 2σ] : environ 95 % des valeurs.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Calcule 2σ.
        - Calcule x̄ − 2σ et x̄ + 2σ.
        - Écris l’intervalle.
        - 'Hors de cet intervalle : environ 5 % des valeurs (2,5 % de chaque côté).'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi 2σ attrape presque tout
    -   type: liste
        elements:
        - Dans une cloche, les valeurs se raréfient très vite en s’éloignant du centre.
        - À deux écarts-types, il n’en reste presque plus.
    -   type: paragraphe
        texte: 2. Pourquoi 2,5 % de chaque côté
    -   type: liste
        elements:
        - Il reste 5 % hors de l’intervalle.
        - 'La cloche est symétrique : la moitié en dessous, la moitié au-dessus.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Même série : x̄ = 520 kg, σ = 30 kg, 200 chevaux.'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Que vaut 2σ ?
        unite: kg
        aide: 2 × 30.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Borne basse de x̄ ± 2σ ?
        unite: kg
        aide: 520 − 60.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Borne haute de x̄ ± 2σ ?
        unite: kg
        aide: 520 + 60.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Environ combien de chevaux entre 460 et 580 kg ?
        aide: 95 % de 200.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Environ combien de chevaux pèsent plus de 580 kg ?
        aide: 2,5 % de 200.
        calcul: true
    -   id: q06
        type: nombre
        enonce: 'Série B — Tailles : x̄ = 158 cm, σ = 4 cm. Borne haute de x̄ ± 2σ ?'
        unite: cm
        aide: 158 + 8.
        calcul: true
    -   id: q07
        type: nombre
        enonce: x̄ = 12,5 kg, σ = 1,5 kg. Borne basse de x̄ ± 2σ ?
        unite: kg
        aide: 12,5 − 3.
        calcul: true
-   id: a03
    titre: Partie 3 — Une valeur exceptionnelle ?
    transition: 'Dernière notion : utiliser ces intervalles pour juger une valeur.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: 'Une valeur en dehors de [x̄ − 2σ ; x̄ + 2σ] est rare : moins de 5 % des cas.'
    -   type: paragraphe
        texte: On dit qu’elle est exceptionnelle. Cela ne veut pas dire qu’elle est fausse, mais qu’elle mérite une vérification.
    -   type: paragraphe
        texte: 'À retenir : Hors de [x̄ − 2σ ; x̄ + 2σ] : valeur exceptionnelle (pour une série en cloche).'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Calcule l’intervalle x̄ ± 2σ.
        - Regarde si la valeur est dedans ou dehors.
        - 'Dehors : exceptionnelle. Dedans : normale.'
        - Vérifie que la série est bien en cloche.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi 5 %
    -   type: liste
        elements:
        - Si 95 % des valeurs sont dedans, tomber dehors arrive moins d’une fois sur 20.
    -   type: paragraphe
        texte: 2. Pourquoi vérifier la forme
    -   type: liste
        elements:
        - Pour une série très dissymétrique, les pourcentages 68 % et 95 % ne sont plus vrais.
        - On ne peut alors pas conclure de la même façon.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Poids : x̄ = 520 kg, σ = 30 kg.'
    questions:
    -   id: q01
        type: qcm
        enonce: Série A — Un cheval de 600 kg est-il exceptionnel ?
        choix:
        -   id: a
            texte: Oui
        -   id: b
            texte: Non
        aide: Compare avec [460 ; 580].
    -   id: q02
        type: qcm
        enonce: Un cheval de 470 kg est-il exceptionnel ?
        choix:
        -   id: a
            texte: Oui
        -   id: b
            texte: Non
        aide: Compare avec [460 ; 580].
    -   id: q03
        type: qcm
        enonce: Un cheval de 455 kg est-il exceptionnel ?
        choix:
        -   id: a
            texte: Oui
        -   id: b
            texte: Non
        aide: Compare avec 460.
    -   id: q04
        type: qcm
        enonce: 'Tailles : x̄ = 158 cm, σ = 4 cm. Un cheval de 165 cm est-il exceptionnel ?'
        choix:
        -   id: a
            texte: Oui
        -   id: b
            texte: Non
        aide: Intervalle [150 ; 166].
    -   id: q05
        type: qcm
        enonce: Série B — On peut appliquer la règle des 95 % à…
        choix:
        -   id: a
            texte: une série en cloche
        -   id: b
            texte: n’importe quelle série
        aide: Relis la notion.
    -   id: q06
        type: nombre
        enonce: À partir de quel poids (au-dessus de la moyenne) un cheval est-il exceptionnel ?
        unite: kg
        aide: x̄ + 2σ.
        calcul: true
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: 'x̄ = 45 kg, σ = 5 kg : borne basse de x̄ ± σ ?'
        unite: kg
        calcul: true
    -   id: q02
        type: nombre
        enonce: 'x̄ = 45 kg, σ = 5 kg : borne haute de x̄ ± 2σ ?'
        unite: kg
        calcul: true
    -   id: q03
        type: nombre
        enonce: Sur 300 poulains, environ combien dans x̄ ± 2σ ?
        calcul: true
    -   id: q04
        type: qcm
        enonce: 'x̄ = 45 kg, σ = 5 kg : un poulain de 57 kg est-il exceptionnel ?'
        choix:
        -   id: a
            texte: Oui
        -   id: b
            texte: Non
retenir:
- 'x̄ ± σ : environ 68 % des valeurs (série en cloche).'
- 'x̄ ± 2σ : environ 95 % des valeurs.'
- Une valeur hors de [x̄ − 2σ ; x̄ + 2σ] est exceptionnelle (moins de 5 % des cas).
- Seulement pour une série en cloche.
