titre: 'Séance 10 : Les boîtes à moustaches'
themes:
- MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
problematique: Comment résumer une série par cinq valeurs, la dessiner en boîte à moustaches et comparer deux séries ?
competences_bo:
- MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
objectifs:
    connaissances:
    - 'Les cinq valeurs : min, Q1, médiane, Q3, max.'
    - La boîte va de Q1 à Q3, les moustaches du min au max.
    competences:
    - Trouver les cinq valeurs d’une série.
    - Lire une boîte à moustaches.
    - Comparer deux séries avec leurs boîtes.
pourquoi:
- 'Aujourd’hui, trois notions : les cinq valeurs, lire une boîte, comparer deux boîtes.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — Les cinq valeurs
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: 'Pour résumer une série, on peut donner cinq valeurs : le minimum, Q1, la médiane, Q3 et le maximum.'
    -   type: paragraphe
        texte: Elles découpent la série rangée en quatre parts d’environ 25 %.
    -   type: paragraphe
        texte: 'À retenir : Min, Q1 (rang n ÷ 4), médiane (milieu), Q3 (rang 3n ÷ 4), max — rangs arrondis au-dessus.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Range la série et compte n.
        - 'Min : première valeur ; max : dernière.'
        - 'Médiane : rang (n + 1) ÷ 2 si n est impair.'
        - 'Q1 et Q3 : rangs n ÷ 4 et 3n ÷ 4, arrondis au-dessus.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Quatre parts
    -   type: liste
        elements:
        - 'Entre min et Q1 : environ 25 % des valeurs ; entre Q1 et Me : 25 % ; etc.'
        - Les cinq valeurs disent où se trouvent les quarts de la série.
    -   type: paragraphe
        texte: 2. Pourquoi c’est utile
    -   type: liste
        elements:
        - Cinq nombres résument une série de 11 ou de 1 000 valeurs.
        - Ils montrent à la fois la position et la dispersion.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Poids à la naissance (kg) de 11 poulains de l’élevage A, rangés :'
    -   type: paragraphe
        texte: 42 ; 45 ; 46 ; 48 ; 50 ; 51 ; 53 ; 54 ; 56 ; 60 ; 63.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Minimum ?
        unite: kg
        aide: Première valeur.
    -   id: q02
        type: nombre
        enonce: Maximum ?
        unite: kg
        aide: Dernière valeur.
    -   id: q03
        type: nombre
        enonce: Médiane ?
        unite: kg
        aide: Rang (11 + 1) ÷ 2 = 6.
    -   id: q04
        type: nombre
        enonce: Q1 ?
        unite: kg
        aide: 11 ÷ 4 = 2,75 → rang 3.
    -   id: q05
        type: nombre
        enonce: Q3 ?
        unite: kg
        aide: 33 ÷ 4 = 8,25 → rang 9.
    -   id: q06
        type: nombre
        enonce: Série B — Écart interquartile ?
        unite: kg
        aide: Q3 − Q1.
    -   id: q07
        type: nombre
        enonce: Étendue ?
        unite: kg
        aide: Max − min.
-   id: a02
    titre: Partie 2 — Lire une boîte à moustaches
    transition: 'Tu as les cinq valeurs. Deuxième notion : les voir sur un graphique.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Une boîte à moustaches dessine les cinq valeurs sur un axe gradué.
    -   type: paragraphe
        texte: La boîte va de Q1 à Q3 avec un trait à la médiane ; les moustaches vont jusqu’au min et au max.
    -   type: paragraphe
        texte: 'À retenir : Bord gauche de la boîte : Q1 ; trait rouge : médiane ; bord droit : Q3 ; bouts des moustaches : min et max.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - 'Comment la faire : trace un axe gradué, place les cinq valeurs, dessine le rectangle de Q1 à Q3, le trait de la médiane, puis les moustaches.'
        - 'Comment la lire : descends de chaque trait vertical jusqu’à l’axe pour lire la valeur.'
        - 'Comment la comprendre : la boîte contient environ la moitié centrale des valeurs ; une boîte étroite = valeurs regroupées.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi une boîte
    -   type: liste
        elements:
        - Le rectangle montre d’un coup d’œil où est la moitié centrale de la série.
        - Sa longueur est l’écart interquartile.
    -   type: paragraphe
        texte: 2. Pourquoi des moustaches
    -   type: liste
        elements:
        - Elles montrent jusqu’où vont les valeurs extrêmes.
        - Une très longue moustache signale une valeur éloignée des autres.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Boîtes à moustaches des poids à la naissance dans deux élevages (graduation de 2 en 2 kg) :'
    -   type: image
        url: /assets/images/graphiques/maths-1re-s10-classique-boites.svg
        alternative: 'Boîtes à moustaches : élevage A (40 ; 47 ; 52 ; 55 ; 62) et élevage B (44 ; 50 ; 53 ; 56 ; 70).'
        legende: 'Boîtes à moustaches : élevage A (40 ; 47 ; 52 ; 55 ; 62) et élevage B (44 ; 50 ; 53 ; 56 ; 70).'
    questions:
    -   id: q01
        type: nombre
        enonce: 'Série A — Élevage B : minimum ?'
        unite: kg
        aide: Bout gauche de la moustache.
    -   id: q02
        type: nombre
        enonce: 'Élevage B : Q1 ?'
        unite: kg
        aide: Bord gauche de la boîte.
    -   id: q03
        type: nombre
        enonce: 'Élevage B : médiane ?'
        unite: kg
        aide: Trait rouge.
    -   id: q04
        type: nombre
        enonce: 'Élevage B : Q3 ?'
        unite: kg
        aide: Bord droit de la boîte.
    -   id: q05
        type: nombre
        enonce: 'Élevage B : maximum ?'
        unite: kg
        aide: Bout droit de la moustache.
    -   id: q06
        type: nombre
        enonce: 'Série B — Élevage B : écart interquartile ?'
        unite: kg
        aide: Q3 − Q1.
    -   id: q07
        type: nombre
        enonce: 'Élevage B : étendue ?'
        unite: kg
        aide: Max − min.
-   id: a03
    titre: Partie 3 — Comparer deux séries
    transition: 'Dernière notion : comparer les deux élevages.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Deux boîtes tracées sur le même axe se comparent facilement.
    -   type: paragraphe
        texte: On compare d’abord les médianes (position), puis les largeurs des boîtes (dispersion).
    -   type: paragraphe
        texte: 'À retenir : Médiane plus à droite = valeurs plus grandes. Boîte plus étroite = valeurs plus regroupées.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Compare les médianes.
        - Compare les écarts interquartiles (largeurs des boîtes).
        - Regarde les moustaches pour les valeurs extrêmes.
        - Écris une phrase de conclusion chiffrée.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi le même axe
    -   type: liste
        elements:
        - Sur des axes différents, une boîte peut paraître plus large juste à cause de l’échelle.
        - Sur le même axe, les longueurs se comparent directement.
    -   type: paragraphe
        texte: 2. Pourquoi la médiane
    -   type: liste
        elements:
        - Elle n’est pas tirée par une valeur extrême (ici 70 kg dans B).
        - Elle compare bien les poulains « ordinaires » des deux élevages.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Même graphique.
    -   type: image
        url: /assets/images/graphiques/maths-1re-s10-classique-boites.svg
        alternative: Boîtes à moustaches des deux élevages.
        legende: Boîtes à moustaches des deux élevages.
    questions:
    -   id: q01
        type: qcm
        enonce: Série A — Quel élevage a la médiane la plus élevée ?
        choix:
        -   id: a
            texte: A
        -   id: b
            texte: B
        aide: Compare 52 et 53.
    -   id: q02
        type: nombre
        enonce: Écart interquartile de l’élevage A ?
        unite: kg
        aide: 55 − 47.
    -   id: q03
        type: qcm
        enonce: Quel élevage a la moitié centrale la plus regroupée ?
        choix:
        -   id: a
            texte: A
        -   id: b
            texte: B
        aide: Compare 8 et 6.
    -   id: q04
        type: qcm
        enonce: Quel élevage a la plus grande étendue ?
        choix:
        -   id: a
            texte: A (22 kg)
        -   id: b
            texte: B (26 kg)
        aide: Compare les étendues.
    -   id: q05
        type: nombre
        enonce: Série B — Dans l’élevage A, environ quel pourcentage de poulains pèse plus de 55 kg ?
        unite: '%'
        aide: Au-dessus de Q3.
    -   id: q06
        type: qcm
        enonce: Quelle conclusion est la meilleure ?
        choix:
        -   id: a
            texte: B est meilleur car son maximum est 70 kg.
        -   id: b
            texte: A et B sont identiques.
        -   id: c
            texte: Médianes proches (52 et 53 kg) ; B plus régulier au centre (écart 6 kg contre 8 kg), avec une valeur extrême.
        aide: Position + dispersion.
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: 'Série 2 ; 4 ; 5 ; 7 ; 9 ; 10 ; 12 ; 15 : Q1 ?'
    -   id: q02
        type: nombre
        enonce: 'Même série : Q3 ?'
    -   id: q03
        type: nombre
        enonce: 'Même série : médiane ?'
    -   id: q04
        type: nombre
        enonce: 'Élevage A : environ combien de % des poulains entre 47 et 55 kg ?'
        unite: '%'
retenir:
- 'Cinq valeurs : min, Q1, Me, Q3, max.'
- 'Boîte : de Q1 à Q3, avec un trait à la médiane ; moustaches : jusqu’au min et au max.'
- Longueur de la boîte = écart interquartile ; des moustaches aux extrémités = étendue.
- 'Comparer : position (médianes) puis dispersion (largeur des boîtes), sur le même axe.'
