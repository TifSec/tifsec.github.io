titre: 'Séance 10 : Deux élevages, deux séries : les boîtes à moustaches'
themes:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
problematique: Comment comparer deux séries d’un coup d’œil ?
competences_bo:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
objectifs:
    connaissances:
        - Une boîte à moustaches représente min, Q1, médiane, Q3, max.
        - On compare les médianes (position) et les longueurs des boîtes (dispersion).
    competences:
        - Construire une boîte à moustaches.
        - Comparer deux séries graphiquement.
pourquoi:
    - Deux élevages comparent le poids de leurs poulains à 6 mois.
    - La boîte à moustaches montre la différence d’un coup d’œil.
activites:
    -   id: a01
        titre: Les cinq valeurs
        consigne: Tu vas calculer l’écart interquartile des poids des poulains de deux élevages (document 1). On attend les deux écarts.
        contenu:
            -   type: liste
                elements:
                    - 'Automatisme : 265 − 235 = ?'
            -   type: tableau
                titre: Document 1 — Poids des poulains à 6 mois (kg, fictifs)
                colonnes:
                    - ''
                    - Min
                    - Q1
                    - Médiane
                    - Q3
                    - Max
                lignes:
                    -   - Élevage A
                        - '210'
                        - '235'
                        - '250'
                        - '265'
                        - '290'
                    -   - Élevage B
                        - '190'
                        - '225'
                        - '255'
                        - '280'
                        - '320'
            -   type: etapes
                elements:
                    - Lis les résumés des deux élevages (document 1).
                    - Calcule l’écart interquartile de chacun.
            -   type: paragraphe
                texte: Pourquoi ces cinq valeurs ? Elles suffisent à dessiner la boîte.
        questions:
            -   id: q01
                type: nombre
                enonce: Écart interquartile de l’élevage A ?
                unite: kg
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: nombre
                enonce: Écart interquartile de l’élevage B ?
                unite: kg
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a02
        titre: Tracer
        transition: Tu as les valeurs. Dessine.
        consigne: Tu vas tracer les deux boîtes à moustaches sur un même axe et les décrire. On attend la comparaison.
        contenu:
            -   type: etapes
                elements:
                    - Trace les deux boîtes sur le même axe (papier ou tableur).
                    - Vérifie l’échelle.
            -   type: paragraphe
                texte: Pourquoi le même axe ? Sinon la comparaison est fausse.
        questions:
            -   id: q01
                type: texte
                enonce: Décris ce que montrent les deux boîtes côte à côte.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a03
        titre: Conclure pour l’éleveur
        transition: Les boîtes sont tracées. Que dire à l’éleveur ?
        consigne: Tu vas rédiger une conclusion chiffrée sur l’homogénéité des deux élevages. On attend une conclusion appuyée sur les indicateurs.
        contenu:
            -   type: etapes
                elements:
                    - 'Rédige une conclusion : quel élevage a la croissance la plus homogène ?'
            -   type: paragraphe
                texte: Pourquoi l’homogénéité ? Des poulains homogènes se vendent et se gèrent mieux.
        questions:
            -   id: q01
                type: texte
                enonce: Rédige ta conclusion chiffrée.
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: 25 % des poulains de B pèsent plus de… ?
        questions:
            -   id: q01
                type: texte
                enonce: Lis la boîte.
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais comparer avec des boîtes à moustaches. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment comparer deux séries d’un coup d’œil ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Boîte : min, Q1, Me, Q3, max.'
    - Même axe ; médiane et EIQ.
sources:
    -   type: lien
        titre: ChloroFil — Bac Pro, tronc commun rénové, document d’accompagnement du module MG1
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/bacpro/bacpro-tc-da-MG1.pdf
