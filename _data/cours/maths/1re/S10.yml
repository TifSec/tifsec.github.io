titre: 'Séance 10 : Deux élevages, deux séries : les boîtes à moustaches'
themes:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
problematique: Comment comparer deux séries d’un coup d’œil ?
competences_bo:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
objectifs:
    connaissances:
        - Une boîte à moustaches représente min, Q1, médiane, Q3, max.
        - On compare les médianes (position) et les longueurs des boîtes (dispersion).
    competences:
        - Construire une boîte à moustaches.
        - Comparer deux séries graphiquement.
pourquoi:
    - Deux élevages comparent le poids de leurs poulains à 6 mois.
    - La boîte à moustaches montre la différence d’un coup d’œil.
activites:
    -   id: a01
        titre: Les cinq valeurs
        consigne: Tu vas calculer l’écart interquartile des poids des poulains de deux élevages (document 1). On attend les deux écarts.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Deux élevages vendent des poulains. Lequel a des poulains au poids le plus régulier ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: 'Le résumé en cinq valeurs d’une série : minimum, Q1, médiane, Q3 et maximum. L’écart interquartile Q3 − Q1 mesure l’étalement de la moitié centrale des valeurs.'
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Résumer une série très simplement.
                    - Préparer le dessin d’une boîte à moustaches.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - On lit les cinq valeurs dans le résumé.
                    - 'On calcule l’écart interquartile : Q3 − Q1.'
                    - 'On peut aussi calculer l’étendue : max − min.'
            -   type: paragraphe
                texte: 'À retenir : Écart interquartile = Q3 − Q1.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Q1 = 48 et Q3 = 63. Écart interquartile ?
                    - Min 30, max 75. Étendue ?
            -   type: liste
                elements:
                    - 'Automatisme : 265 − 235 = ?'
            -   type: tableau
                titre: Document 1 — Poids des poulains à 6 mois (kg, fictifs)
                colonnes:
                    - ''
                    - Min
                    - Q1
                    - Médiane
                    - Q3
                    - Max
                lignes:
                    -   - Élevage A
                        - '210'
                        - '235'
                        - '250'
                        - '265'
                        - '290'
                    -   - Élevage B
                        - '190'
                        - '225'
                        - '255'
                        - '280'
                        - '320'
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : lis les résumés des deux élevages (document 1) et calcule l’écart interquartile de chacun.'
                    - Pourquoi ces cinq valeurs ? Elles suffisent à dessiner la boîte.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Une boîte à moustaches utilise min, Q1, …… , Q3, max.
                        - ''
                    -   - La longueur de la boîte est l’écart …… .
                        - ''
                aide: 'Les cinq valeurs : min, Q1, la valeur du milieu, Q3, max. Et la longueur de la boîte, c’est l’écart… ?'
            -   id: q02
                type: nombre
                enonce: Écart interquartile de l’élevage A ?
                unite: kg
                aide: 'Dans le document 1, ligne Élevage A : Q3 − Q1.'
            -   id: q03
                type: nombre
                enonce: Écart interquartile de l’élevage B ?
                unite: kg
                aide: Même calcul avec la ligne Élevage B.
    -   id: a02
        titre: Tracer
        transition: Tu as les valeurs. Dessine.
        consigne: Tu vas tracer les deux boîtes à moustaches sur un même axe et les décrire. On attend la comparaison.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Pour montrer la différence aux éleveurs, on veut un dessin qui se comprend d’un coup d’œil.
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: 'Une boîte à moustaches dessine les cinq valeurs : une boîte de Q1 à Q3 coupée par la médiane, et deux « moustaches » jusqu’au minimum et au maximum.'
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Comparer deux séries ou plus d’un seul regard.
                    - Voir à la fois la position et la dispersion.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - On trace un axe gradué commun aux deux séries, avec la même échelle.
                    - 'Pour chaque série : une boîte de Q1 à Q3, un trait dans la boîte à la médiane.'
                    - 'On trace les moustaches : de min à Q1 et de Q3 à max.'
                    - 'On compare : médianes (position), longueurs des boîtes (dispersion).'
            -   type: paragraphe
                texte: 'À retenir : Deux boîtes se comparent sur le même axe, avec la même échelle.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - 'Série C : min 5, Q1 8, médiane 10, Q3 13, max 20. Décris où tracer la boîte et les moustaches.'
            -   type: image
                url: /assets/images/graphiques/maths-1re-s10-boites.svg
                alternative: Boîtes à moustaches des deux élevages sur le même axe.
                legende: Boîtes à moustaches des deux élevages sur le même axe.
            -   type: titre
                texte: Comment faire ce graphique
            -   type: etapes
                elements:
                    - Trace un axe gradué commun.
                    - 'Pour chaque série : un trait au minimum et au maximum, une boîte de Q1 à Q3, un trait dans la boîte à la médiane.'
                    - Relie la boîte au minimum et au maximum (les « moustaches »).
            -   type: titre
                texte: Comment le lire
            -   type: liste
                elements:
                    - Le trait dans la boîte = médiane ; la longueur de la boîte = écart interquartile ; les moustaches vont du minimum au maximum.
            -   type: titre
                texte: Comment le comprendre
            -   type: liste
                elements:
                    - 'Médianes proches : position semblable.'
                    - 'Boîte plus longue : la moitié centrale des valeurs est plus dispersée (série moins homogène).'
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : trace les deux boîtes du document 1 sur le même axe, avec la même échelle.'
                    - Pourquoi le même axe ? Sinon la comparaison est fausse.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Deux boîtes se comparent sur le même …… .
                        - ''
                    -   - Une boîte plus longue indique une série plus …… .
                        - ''
                aide: 'Pour comparer deux boîtes, elles doivent être sur le même… ? Et une boîte plus longue : série plus serrée ou plus… ?'
            -   id: q02
                type: texte
                enonce: Décris ce que montrent les deux boîtes côte à côte.
                aide: 'Compare les deux boîtes tracées sur le même axe : où sont les médianes ? quelle boîte est la plus longue ? les moustaches ?'
    -   id: a03
        titre: Conclure pour l’éleveur
        transition: Les boîtes sont tracées. Que dire à l’éleveur ?
        consigne: Tu vas rédiger une conclusion chiffrée sur l’homogénéité des deux élevages. On attend une conclusion appuyée sur les indicateurs.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: 'L’éleveur veut une phrase claire : quel élevage a la croissance la plus homogène ?'
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Une conclusion chiffrée répond à la question posée en s’appuyant sur les indicateurs, pas sur une impression.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Convaincre un client ou un responsable.
                    - Justifier une décision d’élevage.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - 'Une phrase sur la position : on compare les médianes.'
                    - 'Une phrase sur la dispersion : on compare les écarts interquartiles (et les étendues).'
                    - Une phrase de conclusion qui répond à la question.
            -   type: paragraphe
                texte: 'À retenir : On compare d’abord les médianes, puis les longueurs des boîtes, toujours avec les chiffres.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Médianes 40 et 41 ; EIQ 6 et 15. Rédige la conclusion.
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : rédige une conclusion chiffrée : quel élevage a la croissance la plus homogène ?'
                    - Pourquoi l’homogénéité ? Des poulains homogènes se vendent et se gèrent mieux.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - On compare d’abord les …… (position).
                        - ''
                    -   - Puis les longueurs des …… (dispersion).
                        - ''
                aide: 'Relis l’exemple : on compare d’abord les… (position), puis les longueurs des… (dispersion).'
            -   id: q02
                type: texte
                enonce: Rédige ta conclusion chiffrée.
                aide: 'Comme l’exemple : une phrase sur les médianes de A et B, une sur leurs écarts interquartiles, puis ton conseil.'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: 25 % des poulains de B pèsent plus de… ?
        questions:
            -   id: q01
                type: texte
                enonce: Lis la boîte.
                aide: 25 % des valeurs sont au-dessus de quel quartile ? Lis sa valeur sur la boîte de B.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais comparer avec des boîtes à moustaches. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment comparer deux séries d’un coup d’œil ?'
                aide: Dis les cinq valeurs, comment tracer la boîte et comment comparer deux séries.
retenir:
    - 'Boîte : min, Q1, Me, Q3, max.'
    - Même axe ; médiane et EIQ.
