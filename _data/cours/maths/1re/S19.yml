titre: 'Séance 19 : Arithmétique ou géométrique ?'
themes:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Comment reconnaître le type de suite qui modélise une situation ?
competences_bo:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
        - 'Arithmétique : différences constantes (uₙ₊₁ − uₙ = r) ; points alignés sur un nuage (n ; uₙ).'
        - 'Géométrique : quotients constants (uₙ₊₁ ÷ uₙ = q) ; courbe qui s’incurve.'
    competences:
        - Tester différences et quotients.
        - Choisir un modèle.
pourquoi:
    - En S16-S18, tu as vu deux types de suites.
    - Face à des données, laquelle choisir ?
activites:
    -   id: a01
        titre: Tester les différences
        consigne: Tu vas tester les différences successives de la série A (document 1). On attend les différences et ta conclusion.
        contenu:
            -   type: titre
                texte: Exemple
            -   type: liste
                elements:
                    - 'Automatisme : 1 080 ÷ 1 200 = ?'
            -   type: tableau
                titre: Document 1 — Deux séries (fictives)
                colonnes:
                    - n
                    - '0'
                    - '1'
                    - '2'
                    - '3'
                lignes:
                    -   - Série A
                        - 2 000
                        - 1 850
                        - 1 700
                        - 1 550
                    -   - Série B
                        - 1 200
                        - 1 080
                        - '972'
                        - '874,8'
            -   type: etapes
                elements:
                    - Lis les deux séries (document 1).
                    - Calcule les différences successives.
            -   type: paragraphe
                texte: Pourquoi les différences ? Si elles sont constantes, la suite est arithmétique.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Différences constantes : suite …… .'
                        - ''
                    -   - Différence = uₙ₊₁ − …… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: texte
                enonce: Calcule les différences de la série A. Est-elle arithmétique ?
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a02
        titre: Tester les quotients
        transition: A est arithmétique. Et B ?
        consigne: Tu vas tester les quotients successifs de la série B. On attend les quotients, ta conclusion et une interprétation.
        contenu:
            -   type: etapes
                elements:
                    - Calcule les quotients successifs de la série B.
            -   type: paragraphe
                texte: Pourquoi les quotients ? S’ils sont constants, la suite est géométrique.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Quotients constants : suite …… .'
                        - ''
                    -   - Une baisse de 10 % donne q = …… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: texte
                enonce: Calcule les quotients de la série B. Est-elle géométrique ?
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
            -   id: q03
                type: texte
                enonce: Que pourrait représenter la série B ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a03
        titre: Le nuage (n ; uₙ)
        transition: Les calculs sont faits. Vérifie graphiquement.
        consigne: Tu vas tracer les nuages (n ; uₙ) des deux séries et décrire leur forme. On attend la description des deux formes.
        contenu:
            -   type: etapes
                elements:
                    - Trace les deux nuages au tableur.
                    - Compare leur forme.
            -   type: paragraphe
                texte: Pourquoi le graphique ? Il permet de deviner le type avant de calculer.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Nuage d’une suite arithmétique : points …… .'
                        - ''
                    -   - 'Nuage d’une suite géométrique : une …… .'
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: texte
                enonce: Décris la forme des deux nuages.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: 'Une série : 100, 110, 121, 133,1.'
        questions:
            -   id: q01
                type: texte
                enonce: Type et raison ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais reconnaître une suite. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment reconnaître le type de suite qui modélise une situation ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Différences constantes : arithmétique.'
    - 'Quotients constants : géométrique.'
