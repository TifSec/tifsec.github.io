titre: 'Séance 19 : Arithmétique ou géométrique ?'
themes:
- MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Comment savoir si une situation se modélise par une suite arithmétique ou géométrique, et comparer deux évolutions ?
competences_bo:
- MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
    - 'Même quantité ajoutée : arithmétique (uₙ = u₀ + n r).'
    - 'Même pourcentage : géométrique (uₙ = u₀ × qⁿ).'
    competences:
    - Reconnaître le type d’une suite à partir de ses termes.
    - Modéliser une situation par la bonne suite.
    - Comparer deux évolutions et dire quand l’une dépasse l’autre.
pourquoi:
- 'Aujourd’hui, trois notions : reconnaître le type de suite, modéliser une situation, comparer deux offres.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — Reconnaître le type de suite
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: 'Devant une liste de termes, on teste les deux possibilités : les différences, puis les quotients.'
    -   type: paragraphe
        texte: 'Si les différences sont égales : arithmétique. Si les quotients sont égaux : géométrique.'
    -   type: paragraphe
        texte: 'À retenir : Différences égales → arithmétique ; quotients égaux → géométrique ; aucun des deux → ni l’une ni l’autre.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Calcule u₁ − u₀ et u₂ − u₁.
        - Égales ? Arithmétique.
        - Sinon, calcule u₁ ÷ u₀ et u₂ ÷ u₁.
        - 'Égaux ? Géométrique. Sinon : ni l’une ni l’autre.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi tester deux fois
    -   type: liste
        elements:
        - 'Une seule différence ne prouve rien : il faut qu’elle se répète.'
    -   type: paragraphe
        texte: 2. Pourquoi pas les deux à la fois
    -   type: liste
        elements:
        - Sauf si tous les termes sont égaux, une suite ne peut pas ajouter et multiplier par la même chose à chaque fois.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée.
    questions:
    -   id: q01
        type: qcm
        enonce: 'Série A — 4 ; 7 ; 10 ; 13 :'
        choix:
        -   id: a
            texte: arithmétique
        -   id: b
            texte: géométrique
        -   id: c
            texte: ni l’une ni l’autre
        aide: Différences ?
    -   id: q02
        type: qcm
        enonce: '3 ; 6 ; 12 ; 24 :'
        choix:
        -   id: a
            texte: arithmétique
        -   id: b
            texte: géométrique
        -   id: c
            texte: ni l’une ni l’autre
        aide: Quotients ?
    -   id: q03
        type: qcm
        enonce: '1 ; 4 ; 9 ; 16 :'
        choix:
        -   id: a
            texte: arithmétique
        -   id: b
            texte: géométrique
        -   id: c
            texte: ni l’une ni l’autre
        aide: Différences 3, 5, 7 ; quotients 4 ; 2,25…
    -   id: q04
        type: qcm
        enonce: '500 ; 450 ; 405 :'
        choix:
        -   id: a
            texte: arithmétique
        -   id: b
            texte: géométrique
        -   id: c
            texte: ni l’une ni l’autre
        aide: Quotients ?
    -   id: q05
        type: qcm
        enonce: '80 ; 72 ; 64 ; 56 :'
        choix:
        -   id: a
            texte: arithmétique
        -   id: b
            texte: géométrique
        -   id: c
            texte: ni l’une ni l’autre
        aide: Différences ?
    -   id: q06
        type: nombre
        enonce: Série B — Raison de 100 ; 110 ; 121 ?
        aide: Quotient.
        calcul: true
    -   id: q07
        type: nombre
        enonce: Raison de 80 ; 72 ; 64 ?
        aide: Différence.
        calcul: true
-   id: a02
    titre: Partie 2 — Modéliser une situation
    transition: 'Tu sais reconnaître une liste. Deuxième notion : choisir la suite à partir d’une phrase.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Dans un énoncé, le type d’évolution se lit dans les mots.
    -   type: paragraphe
        texte: '« De 15 € par an » : on ajoute toujours 15 € → arithmétique. « De 3 % par an » : on multiplie toujours par 1,03 → géométrique.'
    -   type: paragraphe
        texte: 'À retenir : Quantité fixe (€, kg, t) → arithmétique, r = cette quantité. Pourcentage fixe → géométrique, q = 1 ± t/100.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - 'Cherche dans l’énoncé : une quantité ou un pourcentage ?'
        - Écris u₀ (la valeur de départ).
        - Écris r ou q (avec le bon signe ou le bon coefficient).
        - Écris la formule de uₙ.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi une quantité fixe donne une suite arithmétique
    -   type: liste
        elements:
        - 'Chaque année on ajoute 15 € : la différence entre deux années est toujours 15.'
    -   type: paragraphe
        texte: 2. Pourquoi un pourcentage fixe donne une suite géométrique
    -   type: liste
        elements:
        - '3 % de plus, c’est × 1,03 : le quotient entre deux années est toujours 1,03.'
        - L’augmentation en euros grandit chaque année (12 €, puis 12,36 €…).
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée.
    questions:
    -   id: q01
        type: qcm
        enonce: 'Série A — Une pension augmente de 20 € par an :'
        choix:
        -   id: a
            texte: arithmétique
        -   id: b
            texte: géométrique
        aide: Quantité ou pourcentage ?
    -   id: q02
        type: qcm
        enonce: 'Un tracteur perd 15 % de sa valeur par an :'
        choix:
        -   id: a
            texte: arithmétique
        -   id: b
            texte: géométrique
        aide: Quantité ou pourcentage ?
    -   id: q03
        type: nombre
        enonce: Raison q de ce tracteur ?
        aide: 1 − 0,15.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Un stock de 3 000 kg baisse de 40 kg par jour. Raison r ?
        unite: kg
        aide: Le stock baisse.
        calcul: true
    -   id: q05
        type: nombre
        enonce: 'Série B — Tracteur de 40 000 € : valeur dans 2 ans ?'
        unite: €
        aide: 40 000 × 0,85².
        calcul: true
    -   id: q06
        type: nombre
        enonce: 'Stock de 3 000 kg : stock dans 25 jours ?'
        unite: kg
        aide: 3 000 − 25 × 40.
        calcul: true
    -   id: q07
        type: nombre
        enonce: Un club de 120 licenciés gagne 5 % par an. Licenciés dans 3 ans (arrondi) ?
        aide: 120 × 1,05³.
        calcul: true
-   id: a03
    titre: Partie 3 — Comparer deux évolutions
    transition: 'Dernière notion : comparer une hausse fixe et une hausse en pourcentage.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Une hausse fixe ajoute toujours la même somme ; une hausse en % ajoute une somme de plus en plus grande.
    -   type: paragraphe
        texte: Au début, la hausse fixe peut être plus forte ; à long terme, la hausse en % la dépasse.
    -   type: paragraphe
        texte: 'À retenir : Pour comparer, on calcule les deux suites au même rang, ou on fait un tableau.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Écris les deux formules.
        - Calcule les deux valeurs au rang demandé.
        - Compare.
        - Pour savoir quand l’une dépasse l’autre, avance de rang en rang (tableau ou tableur).
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi la hausse en % finit par gagner
    -   type: liste
        elements:
        - 'Offre A : + 15 € chaque année, toujours.'
        - 'Offre B : + 3 % d’un prix qui grandit : 12 €, puis 12,36 €, 12,73 €… la hausse elle-même augmente.'
    -   type: paragraphe
        texte: 2. Ce que montre le tableau
    -   type: liste
        elements:
        - À 10 ans, A vaut 550 € et B environ 537,57 €.
        - 'À 15 ans, A vaut 625 € et B environ 623,19 € : presque égaux. Ensuite, B devient la plus chère.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Prix annuel d’une pension selon deux offres (€) :'
    -   type: tableau
        colonnes:
        - Année n
        - '0'
        - '1'
        - '2'
        - '5'
        - '10'
        - '15'
        lignes:
        -   - 'Offre A : uₙ = 400 + 15n'
            - 400,00
            - 415,00
            - 430,00
            - 475,00
            - 550,00
            - 625,00
        -   - 'Offre B : vₙ = 400 × 1,03ⁿ'
            - 400,00
            - 412,00
            - 424,36
            - 463,71
            - 537,57
            - 623,19
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Offre A au rang 10 ?
        unite: €
        aide: 400 + 15 × 10.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Offre B au rang 10 (au centime) ?
        unite: €
        aide: 400 × 1,03¹⁰.
        calcul: true
    -   id: q03
        type: qcm
        enonce: Au rang 10, quelle offre est la moins chère ?
        choix:
        -   id: a
            texte: A
        -   id: b
            texte: B
        aide: Compare 550 et 537,57.
    -   id: q04
        type: nombre
        enonce: Offre A au rang 20 ?
        unite: €
        aide: 400 + 300.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Série B — Offre B au rang 20 (au centime) ?
        unite: €
        aide: 400 × 1,03²⁰.
        calcul: true
    -   id: q06
        type: qcm
        enonce: Au rang 20, quelle offre est la moins chère ?
        choix:
        -   id: a
            texte: A
        -   id: b
            texte: B
        aide: Compare 700 et 722,44.
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: qcm
        enonce: '10 ; 15 ; 22,5 :'
        choix:
