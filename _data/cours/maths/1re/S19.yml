            texte: arithmétique
        -   id: b
            texte: géométrique
    -   id: q02
        type: nombre
        enonce: Raison de 9 ; 6,5 ; 4 ?
        calcul: true
    -   id: q03
        type: nombre
        enonce: Offre A au rang 15 ?
        unite: €
        calcul: true
    -   id: q04
        type: nombre
        enonce: Offre B au rang 15 (au centime) ?
        unite: €
        calcul: true
retenir:
- 'Différences égales : arithmétique (raison r = différence).'
- 'Quotients égaux : géométrique (raison q = quotient).'
- '« + 15 € par an » : arithmétique ; « + 3 % par an » : géométrique.'
- À long terme, une hausse en % finit par dépasser une hausse fixe.
