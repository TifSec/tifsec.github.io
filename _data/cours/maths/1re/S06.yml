titre: 'Séance 6 : Des doses en mg par kg : unités et puissances de 10'
themes:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Comment manipuler des unités et des puissances de 10 dans un calcul de dose ?
competences_bo:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
        - 1 g = 1 000 mg = 10³ mg ; 1 mg = 10⁻³ g ; 1 µg = 10⁻⁶ g.
        - 'Écriture scientifique : a × 10ⁿ avec 1 ≤ a < 10.'
    competences:
        - Convertir des masses et des volumes.
        - Utiliser l’écriture scientifique.
pourquoi:
    - Les notices vétérinaires donnent des doses en mg/kg.
    - Il faut convertir sans erreur (calcul fictif, jamais une vraie prescription).
activites:
    -   id: a01
        titre: Les conversions
        consigne: Tu vas convertir trois quantités (masses, volumes) avec les puissances de 10. On attend les trois conversions.
        contenu:
            -   type: liste
                elements:
                    - 'Automatisme : 10³ = ? ; 10⁻² = ?'
            -   type: tableau
                titre: Préfixes
                colonnes:
                    - Préfixe
                    - Valeur
                lignes:
                    -   - kilo (k)
                        - 10³
                    -   - milli (m)
                        - 10⁻³
                    -   - micro (µ)
                        - 10⁻⁶
            -   type: etapes
                elements:
                    - Lis le tableau des préfixes.
                    - Convertis.
            -   type: paragraphe
                texte: Pourquoi ? Une erreur d’un facteur 1 000 peut être grave.
        questions:
            -   id: q01
                type: tableau
                enonce: Convertis.
                colonnes:
                    - Quantité
                    - Conversion
                lignes:
                    -   - 2,5 g en mg
                        - ''
                    -   - 750 mg en g
                        - ''
                    -   - 0,02 L en mL
                        - ''
                aide: Source → constituant qui transforme → forme d’énergie en sortie.
    -   id: a02
        titre: Une dose fictive
        transition: Tu sais convertir. Calcule une dose.
        consigne: Tu vas calculer la masse et le volume d’un produit fictif pour un cheval de 500 kg. On attend la masse et le volume.
        contenu:
            -   type: paragraphe
                texte: Notice inventée pour l’exercice ; seul le vétérinaire prescrit.
            -   type: etapes
                elements:
                    - 'Notice fictive : 2 mg par kg ; produit à 50 mg/mL.'
                    - Cheval de 500 kg.
            -   type: paragraphe
                texte: Pourquoi deux étapes ? On calcule la masse de produit, puis le volume.
        questions:
            -   id: q01
                type: nombre
                enonce: Masse de principe actif ?
                unite: mg
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: nombre
                enonce: Volume à prélever ?
                unite: mL
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a03
        titre: L’écriture scientifique
        transition: Les doses sont calculées. Et les très petites quantités ?
        consigne: Tu vas écrire une quantité de résidu en écriture scientifique et la convertir en microgrammes. On attend l’écriture et la conversion.
        contenu:
            -   type: etapes
                elements:
                    - Une analyse donne 0,000 35 g de résidu par kg.
                    - Écris en écriture scientifique ; convertis en µg.
            -   type: paragraphe
                texte: Pourquoi l’écriture scientifique ? Les très petits nombres sont lisibles.
        questions:
            -   id: q01
                type: texte
                enonce: Écris 0,000 35 en écriture scientifique.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
            -   id: q02
                type: nombre
                enonce: Combien de µg par kg ?
                unite: µg
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un poney de 250 kg avec la même notice.
        questions:
            -   id: q01
                type: texte
                enonce: Volume ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais manipuler unités et puissances de 10. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment manipuler des unités et des puissances de 10 dans un calcul de dose ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - k = 10³ ; m = 10⁻³ ; µ = 10⁻⁶.
    - a × 10ⁿ, 1 ≤ a < 10.
sources:
    -   type: lien
        titre: ChloroFil — Bac Pro, tronc commun rénové, document d’accompagnement du module MG1
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/bacpro/bacpro-tc-da-MG1.pdf
