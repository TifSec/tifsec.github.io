titre: 'Séance 6 : Unités, doses et puissances de 10'
themes:
- MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Comment convertir des unités avec les préfixes, calculer une dose en mg/kg et écrire un très grand ou très petit nombre ?
competences_bo:
- MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
    - k = 10³ = 1 000 ; m = 10⁻³ = 0,001 ; µ = 10⁻⁶.
    - Dose = dose par kg × poids.
    - 'Écriture scientifique : a × 10ⁿ avec 1 ≤ a < 10.'
    competences:
    - Convertir g, mg, kg et L, mL.
    - Calculer une dose de médicament à partir d’une posologie en mg/kg.
    - Écrire un nombre en écriture scientifique.
pourquoi:
- 'Aujourd’hui, trois notions : les préfixes et conversions, les doses en mg/kg, l’écriture scientifique.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — Préfixes et conversions
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Les préfixes kilo (k), milli (m) et micro (µ) disent par combien on multiplie l’unité.
    -   type: paragraphe
        texte: 1 kg = 1 000 g ; 1 mg = 0,001 g ; 1 µg = 0,000 001 g.
    -   type: paragraphe
        texte: 'À retenir : k = 10³ ; m = 10⁻³ ; µ = 10⁻⁶. Vers une unité plus petite : × ; vers une plus grande : ÷.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Repère l’unité de départ et l’unité d’arrivée.
        - Cherche le facteur entre les deux (1 000 entre g et mg).
        - Vers une unité plus petite, multiplie ; vers une plus grande, divise.
        - 'Contrôle : plus l’unité est petite, plus le nombre est grand.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi 1 000 entre g et mg
    -   type: liste
        elements:
        - '« milli » veut dire « millième » : 1 mg est un millième de gramme.'
        - Il faut donc 1 000 mg pour faire 1 g.
    -   type: paragraphe
        texte: 2. Pourquoi les puissances de 10
    -   type: liste
        elements:
        - '10³ = 10 × 10 × 10 = 1 000 : trois zéros, trois rangs.'
        - '10⁻³ = 1 ÷ 1 000 = 0,001 : trois rangs dans l’autre sens.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Sans calculatrice.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Convertis 4 g en mg.
        unite: mg
        aide: × 1 000.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Convertis 0,6 g en mg.
        unite: mg
        aide: × 1 000.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Convertis 2 500 mg en g.
        unite: g
        aide: ÷ 1 000.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Convertis 1,2 kg en g.
        unite: g
        aide: × 1 000.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Série B — Convertis 2 mg en µg.
        unite: µg
        aide: × 1 000.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Convertis 0,5 L en mL.
        unite: mL
        aide: × 1 000.
        calcul: true
    -   id: q07
        type: nombre
        enonce: Convertis 0,25 kg en mg.
        unite: mg
        aide: kg → g (× 1 000), puis g → mg (× 1 000).
        calcul: true
-   id: a02
    titre: Partie 2 — Une dose en mg par kg
    transition: 'Tu sais convertir. Deuxième notion : calculer une dose qui dépend du poids.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Une posologie en mg/kg dit combien de milligrammes donner pour chaque kilogramme de l’animal.
    -   type: paragraphe
        texte: 'Un cheval plus lourd reçoit donc une dose plus grande : c’est de la proportionnalité.'
    -   type: paragraphe
        texte: 'À retenir : Dose totale (mg) = posologie (mg/kg) × poids (kg).'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Lis la posologie (mg/kg) et le poids (kg).
        - 'Multiplie les deux : la dose est en mg.'
        - 'Convertis si besoin (mg → g : ÷ 1 000).'
        - 'Pour un volume : dose (mg) ÷ concentration (mg/mL) = volume en mL.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. En raisonnant kg par kg
    -   type: liste
        elements:
        - À 2 mg/kg, chaque kilogramme demande 2 mg.
        - 'Pour 500 kg : 500 fois 2 mg = 1 000 mg = 1 g.'
    -   type: paragraphe
        texte: 2. Pourquoi diviser par la concentration
    -   type: liste
        elements:
        - Un produit à 50 mg/mL contient 50 mg dans chaque millilitre.
        - Pour 1 000 mg, il faut 1 000 ÷ 50 = 20 mL.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Doses fictives, pour le calcul seulement. Calculatrice autorisée.
    questions:
    -   id: q01
        type: nombre
        enonce: 'Série A — 2 mg/kg pour un cheval de 500 kg : dose en mg ?'
        unite: mg
        aide: 2 × 500.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Convertis cette dose en g.
        unite: g
        aide: ÷ 1 000.
        calcul: true
    -   id: q03
        type: nombre
        enonce: '5 mg/kg pour un poney de 280 kg : dose en mg ?'
        unite: mg
        aide: 5 × 280.
        calcul: true
    -   id: q04
        type: nombre
        enonce: '0,5 mg/kg pour un cheval de 620 kg : dose en mg ?'
        unite: mg
        aide: 0,5 × 620.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Série B — Un produit contient 50 mg/mL. Volume pour 1 000 mg ?
        unite: mL
        aide: 1 000 ÷ 50.
        calcul: true
    -   id: q06
        type: nombre
        enonce: 'Dose 1 400 mg, produit à 100 mg/mL : volume ?'
        unite: mL
        aide: 1 400 ÷ 100.
        calcul: true
    -   id: q07
        type: nombre
        enonce: '3 mg/kg, cheval de 450 kg, produit à 90 mg/mL : volume ?'
        unite: mL
        aide: Dose 1 350 mg, puis ÷ 90.
        calcul: true
-   id: a03
    titre: Partie 3 — L’écriture scientifique
    transition: 'Dernière notion : écrire simplement les nombres très grands ou très petits.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Les très grands nombres (1 020 000 équidés en France) et les très petits (0,000 8 g) sont difficiles à lire.
    -   type: paragraphe
        texte: L’écriture scientifique les écrit sous la forme a × 10ⁿ, avec un seul chiffre non nul avant la virgule.
    -   type: paragraphe
        texte: 'À retenir : Écriture scientifique : a × 10ⁿ avec 1 ≤ a < 10. n positif pour un grand nombre, négatif pour un petit.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - 'Place la virgule après le premier chiffre non nul : c’est a.'
        - 'Compte de combien de rangs tu as décalé la virgule : c’est n.'
        - 'Virgule décalée vers la gauche (grand nombre) : n positif. Vers la droite (petit nombre) : n négatif.'
        - 'Contrôle : 1 ≤ a < 10.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pour un grand nombre
    -   type: liste
        elements:
        - 1 020 000 = 1,02 × 1 000 000.
        - '1 000 000 = 10⁶ (six zéros) : 1 020 000 = 1,02 × 10⁶.'
    -   type: paragraphe
        texte: 2. Pour un petit nombre
    -   type: liste
        elements:
        - 0,000 8 = 8 × 0,000 1.
        - '0,000 1 = 10⁻⁴ (quatre rangs) : 0,000 8 = 8 × 10⁻⁴.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Pour n, tape le nombre entier (avec le signe moins s’il est négatif).
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — 3 000 = 3 × 10ⁿ. Que vaut n ?
        aide: Combien de zéros ?
        calcul: true
    -   id: q02
        type: nombre
        enonce: 52 000 = 5,2 × 10ⁿ. Que vaut n ?
        aide: Virgule décalée de combien de rangs ?
        calcul: true
    -   id: q03
        type: nombre
        enonce: 1 020 000 = 1,02 × 10ⁿ. Que vaut n ?
        aide: Compte les rangs.
        calcul: true
    -   id: q04
        type: nombre
        enonce: 0,004 = 4 × 10ⁿ. Que vaut n ?
        aide: 'Petit nombre : n négatif.'
        calcul: true
    -   id: q05
        type: nombre
        enonce: Série B — 0,000 25 = 2,5 × 10ⁿ. Que vaut n ?
        aide: Compte les rangs vers la droite.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Écris 7,3 × 10³ en écriture décimale.
        aide: Avance la virgule de 3 rangs.
        calcul: true
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: Convertis 3,5 g en mg.
        unite: mg
        calcul: true
    -   id: q02
        type: nombre
        enonce: Convertis 800 mg en g.
        unite: g
        calcul: true
    -   id: q03
        type: nombre
        enonce: '4 mg/kg pour 350 kg : dose en mg ?'
        unite: mg
        calcul: true
    -   id: q04
        type: nombre
        enonce: 'Dose 600 mg, produit à 40 mg/mL : volume ?'
        unite: mL
        calcul: true
    -   id: q05
        type: nombre
        enonce: Écris 6 × 10⁻² en écriture décimale.
        calcul: true
retenir:
- k (kilo) = 1 000 ; m (milli) = 0,001 ; µ (micro) = 0,000 001.
- 1 g = 1 000 mg ; 1 kg = 1 000 g ; 1 L = 1 000 mL.
- Dose totale = posologie (mg/kg) × poids (kg).
- 'Écriture scientifique : a × 10ⁿ avec 1 ≤ a < 10 ; n = nombre de rangs dont on décale la virgule.'
