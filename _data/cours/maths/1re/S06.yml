titre: 'Séance 6 : Des doses en mg par kg : unités et puissances de 10'
themes:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Comment manipuler des unités et des puissances de 10 dans un calcul de dose ?
competences_bo:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
        - 1 g = 1 000 mg = 10³ mg ; 1 mg = 10⁻³ g ; 1 µg = 10⁻⁶ g.
        - 'Écriture scientifique : a × 10ⁿ avec 1 ≤ a < 10.'
    competences:
        - Convertir des masses et des volumes.
        - Utiliser l’écriture scientifique.
pourquoi:
    - Les notices vétérinaires donnent des doses en mg/kg.
    - Il faut convertir sans erreur (calcul fictif, jamais une vraie prescription).
activites:
    -   id: a01
        titre: Les conversions
        consigne: Tu vas convertir trois quantités (masses, volumes) avec les puissances de 10. On attend les trois conversions.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Une notice parle en mg, la balance en g, la seringue en mL. Il faut passer d’une unité à l’autre sans erreur.
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: 'Les préfixes indiquent une puissance de 10 : kilo = 10³ = 1 000, milli = 10⁻³ = un millième, micro = 10⁻⁶ = un millionième.'
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Passer d’une unité à l’autre sur une notice, une étiquette, une balance.
                    - Éviter les erreurs de dosage.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - On cherche combien de petites unités il y a dans une grande (1 g = 1 000 mg).
                    - 'Grande unité → petite unité : on multiplie (× 1 000).'
                    - 'Petite unité → grande unité : on divise (÷ 1 000).'
                    - 'On vérifie l’ordre de grandeur : en petites unités, le nombre doit être plus grand.'
            -   type: paragraphe
                texte: 'À retenir : 1 g = 1 000 mg = 10³ mg ; 1 L = 1 000 mL.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Convertis 4 g en mg.
                    - Convertis 250 mg en g.
                    - Convertis 1,5 L en mL.
            -   type: liste
                elements:
                    - 'Automatisme : 10³ = ? ; 10⁻² = ?'
            -   type: tableau
                titre: Préfixes
                colonnes:
                    - Préfixe
                    - Valeur
                lignes:
                    -   - kilo (k)
                        - 10³
                    -   - milli (m)
                        - 10⁻³
                    -   - micro (µ)
                        - 10⁻⁶
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : lis le tableau des préfixes et convertis.'
                    - Pourquoi ? Une erreur d’un facteur 1 000 peut être grave.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 1 g = …… mg.
                        - ''
                    -   - Le préfixe milli correspond à 10 puissance …… .
                        - ''
                aide: 'Lis le tableau des préfixes : milli = 10 puissance quoi ? Donc combien de mg dans 1 g ?'
            -   id: q02
                type: tableau
                enonce: Convertis.
                colonnes:
                    - Quantité
                    - Conversion
                lignes:
                    -   - 2,5 g en mg
                        - ''
                    -   - 750 mg en g
                        - ''
                    -   - 0,02 L en mL
                        - ''
                aide: 'Des g vers les mg : × 1 000. Des mg vers les g : ÷ 1 000. Des L vers les mL : × 1 000.'
    -   id: a02
        titre: Une dose fictive
        transition: Tu sais convertir. Calcule une dose.
        consigne: Tu vas calculer la masse et le volume d’un produit fictif pour un cheval de 500 kg. On attend la masse et le volume.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Une notice (fictive) indique 2 mg de produit par kg de cheval. Le produit contient 50 mg par mL. Quel volume pour un cheval de 500 kg ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Une dose en mg/kg dit combien de milligrammes donner pour chaque kilo du cheval. La concentration en mg/mL dit combien de milligrammes il y a dans chaque millilitre de produit.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Préparer un traitement adapté au poids du cheval.
                    - Comprendre une notice vétérinaire (seul le vétérinaire prescrit).
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - 'Étape 1, la masse : dose (mg/kg) × poids (kg) = masse en mg.'
                    - 'Étape 2, le volume : masse (mg) ÷ concentration (mg/mL) = volume en mL.'
                    - 'Les unités guident : mg/kg × kg = mg ; mg ÷ (mg/mL) = mL.'
            -   type: paragraphe
                texte: 'À retenir : Masse = dose × poids ; volume = masse ÷ concentration.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - 'Notice fictive : 3 mg/kg, produit à 60 mg/mL, cheval de 400 kg. Masse et volume ?'
                    - Même produit pour un poney de 200 kg ?
            -   type: paragraphe
                texte: Notice inventée pour l’exercice ; seul le vétérinaire prescrit.
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : notice fictive 2 mg par kg, produit à 50 mg/mL, cheval de 500 kg.'
                    - Pourquoi deux étapes ? On calcule la masse de produit, puis le volume.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Masse de produit = dose en mg/kg × …… .
                        - ''
                    -   - Volume = masse ÷ …… .
                        - ''
                aide: 'Relis l’exemple du poney : mg/kg × kg donne des mg. Puis on divise la masse par quoi pour obtenir des mL ?'
            -   id: q02
                type: nombre
                enonce: Masse de principe actif ?
                unite: mg
                aide: Dose de la notice (mg par kg) × poids du cheval de « À toi ».
            -   id: q03
                type: nombre
                enonce: Volume à prélever ?
                unite: mL
                aide: Divise la masse trouvée par la concentration du produit (mg par mL).
    -   id: a03
        titre: L’écriture scientifique
        transition: Les doses sont calculées. Et les très petites quantités ?
        consigne: Tu vas écrire une quantité de résidu en écriture scientifique et la convertir en microgrammes. On attend l’écriture et la conversion.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: 'Une analyse indique 0,000 35 g de résidu par kg. Ce nombre est difficile à lire : comment l’écrire plus simplement ?'
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: L’écriture scientifique écrit un nombre sous la forme a × 10ⁿ, avec un seul chiffre non nul avant la virgule (1 ≤ a < 10).
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Lire et comparer facilement de très petits ou très grands nombres.
                    - Utiliser la calculatrice (touche ×10ˣ ou EE).
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - On déplace la virgule pour n’avoir qu’un chiffre non nul devant elle.
                    - 'On compte de combien de rangs on l’a déplacée : c’est la puissance de 10.'
                    - 'Virgule déplacée vers la droite (petit nombre) : puissance négative ; vers la gauche (grand nombre) : puissance positive.'
            -   type: paragraphe
                texte: 'À retenir : a × 10ⁿ avec 1 ≤ a < 10.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Écris 0,006 en écriture scientifique.
                    - Écris 45 000 en écriture scientifique.
                    - Convertis 0,002 g en µg.
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : une analyse donne 0,000 35 g de résidu par kg ; écris-le en écriture scientifique et convertis en µg.'
                    - Pourquoi l’écriture scientifique ? Les très petits nombres sont lisibles.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Écriture scientifique : a × 10ⁿ avec 1 ≤ a < …… .'
                        - ''
                    -   - 0,000 35 = 3,5 × 10 puissance …… .
                        - ''
                aide: Dans a × 10ⁿ, a est entre 1 et… ? Et pour 0,000 35, de combien de rangs déplace-t-on la virgule vers la droite ?
            -   id: q02
                type: texte
                enonce: Écris 0,000 35 en écriture scientifique.
                aide: 'Comme l’exemple 0,000 8 = 8 × 10⁻⁴ : déplace la virgule pour avoir un seul chiffre non nul devant, compte les rangs.'
            -   id: q03
                type: nombre
                enonce: Combien de µg par kg ?
                unite: µg
                aide: '1 g = 1 000 000 µg : multiplie 0,000 35 par 1 000 000.'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un poney de 250 kg avec la même notice.
        questions:
            -   id: q01
                type: texte
                enonce: Volume ?
                aide: Refais les deux étapes (masse puis volume) avec 250 kg et la même notice.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais manipuler unités et puissances de 10. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment manipuler des unités et des puissances de 10 dans un calcul de dose ?'
                aide: Dis comment convertir avec les préfixes, calculer une dose et écrire un nombre en écriture scientifique.
retenir:
    - k = 10³ ; m = 10⁻³ ; µ = 10⁻⁶.
    - a × 10ⁿ, 1 ≤ a < 10.
