titre: 'Séance 6 : Des doses en mg par kg : unités et puissances de 10'
themes:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Comment manipuler des unités et des puissances de 10 dans un calcul de dose ?
competences_bo:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
        - 1 g = 1 000 mg = 10³ mg ; 1 mg = 10⁻³ g ; 1 µg = 10⁻⁶ g.
        - 'Écriture scientifique : a × 10ⁿ avec 1 ≤ a < 10.'
    competences:
        - Convertir des masses et des volumes.
        - Utiliser l’écriture scientifique.
pourquoi:
    - Les notices vétérinaires donnent des doses en mg/kg.
    - Il faut convertir sans erreur (calcul fictif, jamais une vraie prescription).
activites:
    -   id: a01
        titre: Les conversions
        consigne: Tu vas convertir trois quantités (masses, volumes) avec les puissances de 10. On attend les trois conversions.
        contenu:
            -   type: liste
                elements:
                    - 'Automatisme : 10³ = ? ; 10⁻² = ?'
            -   type: tableau
                titre: Préfixes
                colonnes:
                    - Préfixe
                    - Valeur
                lignes:
                    -   - kilo (k)
                        - 10³
                    -   - milli (m)
                        - 10⁻³
                    -   - micro (µ)
                        - 10⁻⁶
            -   type: etapes
                elements:
                    - 'Lis l’exemple : 3 g en mg.'
                    - 1 g = 1 000 mg (milli = 10⁻³).
                    - 3 g = 3 × 1 000 = 3 000 mg.
                    - 'Dans l’autre sens : 450 mg = 450 ÷ 1 000 = 0,45 g.'
                    - 'À toi : lis le tableau des préfixes et convertis.'
                    - Pourquoi ? Une erreur d’un facteur 1 000 peut être grave.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 1 g = …… mg.
                        - ''
                    -   - Le préfixe milli correspond à 10 puissance …… .
                        - ''
                aide: 'Lis le tableau des préfixes : milli = 10 puissance quoi ? Donc combien de mg dans 1 g ?'
            -   id: q02
                type: tableau
                enonce: Convertis.
                colonnes:
                    - Quantité
                    - Conversion
                lignes:
                    -   - 2,5 g en mg
                        - ''
                    -   - 750 mg en g
                        - ''
                    -   - 0,02 L en mL
                        - ''
                aide: 'Des g vers les mg : × 1 000. Des mg vers les g : ÷ 1 000. Des L vers les mL : × 1 000.'
    -   id: a02
        titre: Une dose fictive
        transition: Tu sais convertir. Calcule une dose.
        consigne: Tu vas calculer la masse et le volume d’un produit fictif pour un cheval de 500 kg. On attend la masse et le volume.
        contenu:
            -   type: paragraphe
                texte: Notice inventée pour l’exercice ; seul le vétérinaire prescrit.
            -   type: etapes
                elements:
                    - 'Lis l’exemple : notice fictive 4 mg/kg, produit à 100 mg/mL, poney de 250 kg.'
                    - 'Masse : 4 × 250 = 1 000 mg.'
                    - 'Volume : 1 000 ÷ 100 = 10 mL.'
                    - 'Les unités guident : mg/kg × kg = mg ; mg ÷ (mg/mL) = mL.'
                    - 'À toi : notice fictive 2 mg par kg, produit à 50 mg/mL, cheval de 500 kg.'
                    - Pourquoi deux étapes ? On calcule la masse de produit, puis le volume.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Masse de produit = dose en mg/kg × …… .
                        - ''
                    -   - Volume = masse ÷ …… .
                        - ''
                aide: 'Relis l’exemple du poney : mg/kg × kg donne des mg. Puis on divise la masse par quoi pour obtenir des mL ?'
            -   id: q02
                type: nombre
                enonce: Masse de principe actif ?
                unite: mg
                aide: Dose de la notice (mg par kg) × poids du cheval de « À toi ».
            -   id: q03
                type: nombre
                enonce: Volume à prélever ?
                unite: mL
                aide: Divise la masse trouvée par la concentration du produit (mg par mL).
    -   id: a03
        titre: L’écriture scientifique
        transition: Les doses sont calculées. Et les très petites quantités ?
        consigne: Tu vas écrire une quantité de résidu en écriture scientifique et la convertir en microgrammes. On attend l’écriture et la conversion.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : 0,000 8.'
                    - 'On déplace la virgule pour avoir un seul chiffre non nul devant : 8.'
                    - 'On l’a déplacée de 4 rangs vers la droite : 0,000 8 = 8 × 10⁻⁴.'
                    - 'En µg : 0,000 8 g = 0,000 8 × 1 000 000 µg = 800 µg.'
                    - 'À toi : une analyse donne 0,000 35 g de résidu par kg ; écris-le en écriture scientifique et convertis en µg.'
                    - Pourquoi l’écriture scientifique ? Les très petits nombres sont lisibles.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Écriture scientifique : a × 10ⁿ avec 1 ≤ a < …… .'
                        - ''
                    -   - 0,000 35 = 3,5 × 10 puissance …… .
                        - ''
                aide: Dans a × 10ⁿ, a est entre 1 et… ? Et pour 0,000 35, de combien de rangs déplace-t-on la virgule vers la droite ?
            -   id: q02
                type: texte
                enonce: Écris 0,000 35 en écriture scientifique.
                aide: 'Comme l’exemple 0,000 8 = 8 × 10⁻⁴ : déplace la virgule pour avoir un seul chiffre non nul devant, compte les rangs.'
            -   id: q03
                type: nombre
                enonce: Combien de µg par kg ?
                unite: µg
                aide: '1 g = 1 000 000 µg : multiplie 0,000 35 par 1 000 000.'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un poney de 250 kg avec la même notice.
        questions:
            -   id: q01
                type: texte
                enonce: Volume ?
                aide: Refais les deux étapes (masse puis volume) avec 250 kg et la même notice.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais manipuler unités et puissances de 10. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment manipuler des unités et des puissances de 10 dans un calcul de dose ?'
                aide: Dis comment convertir avec les préfixes, calculer une dose et écrire un nombre en écriture scientifique.
retenir:
    - k = 10³ ; m = 10⁻³ ; µ = 10⁻⁶.
    - a × 10ⁿ, 1 ≤ a < 10.
