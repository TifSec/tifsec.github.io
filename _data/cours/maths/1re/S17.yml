titre: 'Séance 17 : Calculer directement le stock au 60e jour'
themes:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Comment calculer n’importe quel terme d’une suite arithmétique sans calculer tous les précédents ?
competences_bo:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
        - 'Terme général : uₙ = u₀ + n × r.'
        - On peut résoudre uₙ = valeur pour trouver n.
    competences:
        - Utiliser le terme général.
        - Résoudre une équation pour trouver un rang.
pourquoi:
    - En S16, le tableur calculait chaque jour.
    - Avec une formule, on obtient directement n’importe quel jour.
activites:
    -   id: a01
        titre: Le terme général
        consigne: Tu vas utiliser le terme général de la suite du stock pour calculer u₃ et u₂₅. On attend les deux valeurs.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Combien restera-t-il de foin au jour 25 ? Calculer les 25 jours un par un serait long.
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Le terme général est une formule qui donne directement n’importe quel terme uₙ à partir de u₀, de la raison r et du rang n.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Calculer un terme lointain sans calculer tous les précédents.
                    - 'Faire des prévisions rapides : stock, poids, économies.'
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - Pour aller de u₀ à uₙ, on ajoute n fois la raison r.
                    - Donc uₙ = u₀ + n × r.
                    - On remplace n par le rang voulu et on calcule (× avant +).
            -   type: paragraphe
                texte: 'À retenir : uₙ = u₀ + n × r.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - u₀ = 300 et r = 15. Calcule u₁₀.
                    - u₀ = 2 500 et r = −40. Calcule u₂₀.
            -   type: liste
                elements:
                    - 'Automatisme : 180 × 25 = ?'
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : utilise uₙ = 6 000 − 180n pour calculer u₃ et u₂₅.'
                    - Pourquoi une formule directe ? Plus besoin de calculer les 59 jours précédents.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Terme général : uₙ = u₀ + n × …… .'
                        - ''
                    -   - u₂₅ = 6 000 − 180 × …… .
                        - ''
                aide: 'Relis l’exemple uₙ = 500 − 20n : on part de u₀ et on ajoute n fois la… ? Pour u₂₅, n vaut combien ?'
            -   id: q02
                type: nombre
                enonce: Calcule u₃ avec la formule.
                unite: kg
                aide: Remplace n par 3 dans 6 000 − 180n. Compare avec la valeur trouvée en S16.
            -   id: q03
                type: nombre
                enonce: Calcule u₂₅.
                unite: kg
                aide: 'Remplace n par 25 : fais d’abord 180 × 25.'
    -   id: a02
        titre: Trouver le rang
        transition: Tu calcules un terme. Fais le chemin inverse.
        consigne: Tu vas trouver le jour où il reste 1 860 kg et celui où le stock passe sous le seuil d’alerte. On attend les deux jours.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: À quel jour restera-t-il 1 860 kg ? Quand le stock passera-t-il sous le seuil d’alerte de 1 000 kg ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: 'Trouver le rang, c’est chercher n quand on connaît la valeur du terme : on résout une équation (ou une inéquation).'
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Prévoir le jour où il faut commander, où un objectif est atteint.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - On écrit u₀ + n × r = k.
                    - On enlève u₀ des deux côtés, puis on divise par r.
                    - 'Le rang est un nombre entier : pour un seuil, on arrondit au rang suivant.'
            -   type: paragraphe
                texte: 'À retenir : Pour trouver n, on résout uₙ = k.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - u₀ = 500 et r = −20. À quel rang le terme vaut-il 260 ?
                    - u₀ = 100 et r = 25. À partir de quel rang le terme dépasse-t-il 400 ?
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : résous 6 000 − 180n = 1 860, puis cherche quand le stock passe sous 1 000 kg.'
                    - Pourquoi une équation ? On cherche le jour, pas le stock.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Pour trouver n, on …… l’équation uₙ = k.
                        - ''
                    -   - Le rang est un nombre …… .
                        - ''
                aide: Pour trouver le jour, on… l’équation uₙ = k. Et un numéro de jour est un nombre entier ou décimal ?
            -   id: q02
                type: nombre
                enonce: Quel jour reste-t-il 1 860 kg ?
                unite: jour
                aide: 'Comme l’exemple 500 − 20n = 260 : écris 6 000 − 180n = 1 860, enlève 6 000, divise par −180.'
            -   id: q03
                type: texte
                enonce: Le stock passe sous 1 000 kg (seuil d’alerte) quel jour ?
                aide: Résous 6 000 − 180n = 1 000 ; si le résultat n’est pas entier, quel jour le stock passe-t-il vraiment sous 1 000 ?
    -   id: a03
        titre: Un autre contexte
        transition: Tu maîtrises la formule. Applique-la à la croissance.
        consigne: Tu vas écrire le terme général de la croissance d’un poulain et calculer son poids au jour 30. On attend la formule et la valeur.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Un poulain pèse 55 kg à la naissance et prend environ 1,2 kg par jour pendant les premières semaines. Combien pèsera-t-il au jour 30 ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: 'Le même outil s’applique à une suite croissante : ici, le poids augmente chaque jour de la même quantité (r > 0).'
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Suivre la croissance d’un poulain et repérer un retard.
                    - Comprendre qu’un modèle a un domaine de validité.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - On identifie u₀ (poids à la naissance) et r (gain par jour).
                    - On écrit le terme général vₙ = v₀ + n × r.
                    - On calcule le terme demandé et on se demande si le modèle reste réaliste.
            -   type: paragraphe
                texte: 'À retenir : Un modèle n’est valable que sur un domaine limité.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Un poney pèse 20 kg à la naissance et prend 0,5 kg par jour. Écris vₙ et calcule v₂₀.
            -   type: paragraphe
                texte: Modèle simplifié, valable seulement sur les premières semaines.
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : un poulain pèse 55 kg à la naissance et prend environ 1,2 kg par jour (modèle simplifié). Écris le terme général.'
                    - Pourquoi un autre contexte ? Une suite arithmétique croissante, cette fois.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Croissance : vₙ = 55 + …… n.'
                        - ''
                    -   - Un modèle a un domaine de …… .
                        - ''
                aide: Le poulain prend environ combien de kg par jour (voir « À toi ») ? Et un modèle est valable sur un domaine de… ?
            -   id: q02
                type: texte
                enonce: Écris vₙ (poids au jour n) et calcule v₃₀.
                aide: Premier terme = poids à la naissance ; raison = gain par jour. Écris vₙ, puis remplace n par 30.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le modèle prévoit 493 kg au bout d’un an (n = 365).
        questions:
            -   id: q01
                type: texte
                enonce: Est-ce réaliste ?
                aide: Compare 493 kg au poids d’un cheval adulte et à celui d’un poulain d’un an. La croissance reste-t-elle la même toute l’année ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais utiliser le terme général. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment calculer n’importe quel terme d’une suite arithmétique ?'
                aide: Dis la formule du terme général, comment trouver un rang, et la limite du modèle.
retenir:
    - uₙ = u₀ + n × r.
    - Résoudre pour trouver n.
