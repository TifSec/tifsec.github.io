titre: 'Séance 17 : Calculer directement le stock au 60e jour'
themes:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Comment calculer n’importe quel terme d’une suite arithmétique sans calculer tous les précédents ?
competences_bo:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
        - 'Terme général : uₙ = u₀ + n × r.'
        - On peut résoudre uₙ = valeur pour trouver n.
    competences:
        - Utiliser le terme général.
        - Résoudre une équation pour trouver un rang.
pourquoi:
    - En S16, le tableur calculait chaque jour.
    - Avec une formule, on obtient directement n’importe quel jour.
activites:
    -   id: a01
        titre: Le terme général
        consigne: Tu vas utiliser le terme général de la suite du stock pour calculer u₃ et u₂₅. On attend les deux valeurs.
        contenu:
            -   type: titre
                texte: Exemple
            -   type: liste
                elements:
                    - 'Automatisme : 180 × 25 = ?'
            -   type: etapes
                elements:
                    - 'Lis : uₙ = 6 000 − 180n.'
                    - Vérifie avec u₃ de S16.
            -   type: paragraphe
                texte: Pourquoi une formule directe ? Plus besoin de calculer les 59 jours précédents.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Terme général : uₙ = u₀ + n × …… .'
                        - ''
                    -   - u₂₅ = 6 000 − 180 × …… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: nombre
                enonce: Calcule u₃ avec la formule.
                unite: kg
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q03
                type: nombre
                enonce: Calcule u₂₅.
                unite: kg
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a02
        titre: Trouver le rang
        transition: Tu calcules un terme. Fais le chemin inverse.
        consigne: Tu vas trouver le jour où il reste 1 860 kg et celui où le stock passe sous le seuil d’alerte. On attend les deux jours.
        contenu:
            -   type: etapes
                elements:
                    - Quand reste-t-il 1 860 kg ?
                    - Résous 6 000 − 180n = 1 860.
            -   type: paragraphe
                texte: Pourquoi une équation ? On cherche le jour, pas le stock.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Pour trouver n, on …… l’équation uₙ = k.
                        - ''
                    -   - Le rang est un nombre …… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: nombre
                enonce: Quel jour reste-t-il 1 860 kg ?
                unite: jour
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q03
                type: texte
                enonce: Le stock passe sous 1 000 kg (seuil d’alerte) quel jour ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a03
        titre: Un autre contexte
        transition: Tu maîtrises la formule. Applique-la à la croissance.
        consigne: Tu vas écrire le terme général de la croissance d’un poulain et calculer son poids au jour 30. On attend la formule et la valeur.
        contenu:
            -   type: titre
                texte: Exemple
            -   type: paragraphe
                texte: Modèle simplifié, valable seulement sur les premières semaines.
            -   type: etapes
                elements:
                    - Un poulain pèse 55 kg à la naissance et prend environ 1,2 kg par jour pendant les premières semaines (modèle simplifié).
                    - Écris le terme général.
            -   type: paragraphe
                texte: Pourquoi un autre contexte ? Une suite arithmétique croissante, cette fois.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Croissance : vₙ = 55 + …… n.'
                        - ''
                    -   - Un modèle a un domaine de …… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: texte
                enonce: Écris vₙ (poids au jour n) et calcule v₃₀.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le modèle prévoit 493 kg au bout d’un an (n = 365).
        questions:
            -   id: q01
                type: texte
                enonce: Est-ce réaliste ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais utiliser le terme général. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment calculer n’importe quel terme d’une suite arithmétique ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - uₙ = u₀ + n × r.
    - Résoudre pour trouver n.
sources:
    -   type: lien
        titre: ChloroFil — Bac Pro, tronc commun rénové, document d’accompagnement du module MG1
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/bacpro/bacpro-tc-da-MG1.pdf
