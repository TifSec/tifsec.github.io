titre: 'Séance 17 : Calculer directement un terme d’une suite arithmétique'
themes:
- MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Comment calculer directement le 60e terme d’une suite arithmétique, et savoir quand elle atteint une valeur ?
competences_bo:
- MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
    - uₙ = u₀ + n × r.
    - 'Pour trouver n : résoudre u₀ + n × r = valeur.'
    competences:
    - Calculer un terme de rang n directement.
    - Trouver le rang où la suite atteint ou dépasse une valeur.
    - Résoudre un problème avec une suite arithmétique.
pourquoi:
- 'Aujourd’hui, trois notions : la formule directe, retrouver le rang, résoudre un problème.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — La formule directe
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Plutôt que d’ajouter r soixante fois, on peut calculer directement u₆₀.
    -   type: paragraphe
        texte: Après n étapes, on a ajouté n fois la raison au terme de départ.
    -   type: paragraphe
        texte: 'À retenir : uₙ = u₀ + n × r.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Repère u₀ et r.
        - Remplace n par le rang demandé.
        - Calcule n × r d’abord, puis ajoute u₀.
        - Contrôle avec les premiers termes (n = 1, n = 2).
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. En comptant les ajouts
    -   type: liste
        elements:
        - u₁ = u₀ + r ; u₂ = u₀ + r + r = u₀ + 2r ; u₃ = u₀ + 3r.
        - 'Pour aller jusqu’au rang n, on ajoute r exactement n fois : uₙ = u₀ + n × r.'
    -   type: paragraphe
        texte: 2. Pourquoi × avant +
    -   type: liste
        elements:
        - On calcule d’abord tout ce qu’on a ajouté (n × r), puis on l’ajoute au départ.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — u₀ = 10, r = 3. Calcule u₅.
        aide: 10 + 5 × 3.
    -   id: q02
        type: nombre
        enonce: u₀ = 10, r = 3. Calcule u₂₀.
        aide: 10 + 20 × 3.
    -   id: q03
        type: nombre
        enonce: u₀ = 500, r = −12. Calcule u₁₀.
        aide: 500 + 10 × (−12).
    -   id: q04
        type: nombre
        enonce: u₀ = 2 000 kg, r = −25 kg par jour. Stock u₆₀ ?
        unite: kg
        aide: 2 000 − 60 × 25.
    -   id: q05
        type: nombre
        enonce: Série B — u₀ = 320 €, r = 15 €. Prix u₈ ?
        unite: €
        aide: 320 + 8 × 15.
    -   id: q06
        type: nombre
        enonce: u₀ = 1,5, r = 0,4. Calcule u₁₀.
        aide: 1,5 + 10 × 0,4.
    -   id: q07
        type: nombre
        enonce: u₀ = 80, r = −2,5. Calcule u₁₂.
        aide: 80 − 12 × 2,5.
-   id: a02
    titre: Partie 2 — Retrouver le rang
    transition: 'Tu sais calculer un terme. Deuxième notion : chercher quand la suite atteint une valeur.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: On connaît la valeur visée (par exemple un stock de 500 kg) et on cherche à quel rang elle est atteinte.
    -   type: paragraphe
        texte: On écrit l’équation u₀ + n × r = valeur et on cherche n.
    -   type: paragraphe
        texte: 'À retenir : n = (valeur − u₀) ÷ r.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Écris u₀ + n × r = valeur.
        - 'Enlève u₀ des deux côtés : n × r = valeur − u₀.'
        - 'Divise par r : n = (valeur − u₀) ÷ r.'
        - Si n n’est pas entier, arrondis à l’entier au-dessus pour « atteindre » ou « passer sous ».
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. On défait les calculs
    -   type: liste
        elements:
        - 'La formule fait : × r, puis + u₀.'
        - 'Pour revenir à n, on défait dans l’ordre inverse : − u₀, puis ÷ r.'
    -   type: paragraphe
        texte: 2. Pourquoi arrondir au-dessus
    -   type: liste
        elements:
        - 'n = 13,3 veut dire : au rang 13, pas encore ; au rang 14, c’est fait.'
        - Le premier rang qui convient est 14.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — u₀ = 10, r = 3. Pour quel n a-t-on uₙ = 40 ?
        aide: (40 − 10) ÷ 3.
    -   id: q02
        type: nombre
        enonce: u₀ = 500, r = −12. Pour quel n a-t-on uₙ = 260 ?
        aide: (260 − 500) ÷ (−12).
    -   id: q03
        type: nombre
        enonce: u₀ = 2 000, r = −25. Pour quel n reste-t-il 500 kg ?
        aide: (500 − 2 000) ÷ (−25).
    -   id: q04
        type: nombre
        enonce: u₀ = 320, r = 15. Pour quel n le prix vaut-il 425 € ?
        aide: (425 − 320) ÷ 15.
    -   id: q05
        type: nombre
        enonce: Série B — u₀ = 100, r = 7. Premier rang où uₙ dépasse 150 ?
        aide: (150 − 100) ÷ 7 ≈ 7,1 → arrondi au-dessus.
    -   id: q06
        type: nombre
        enonce: u₀ = 24, r = −2,5. Premier rang où le stock passe sous 5 t ?
        aide: (5 − 24) ÷ (−2,5) = 7,6 → arrondi au-dessus.
    -   id: q07
        type: qcm
        enonce: Un élève trouve n = 13,2 pour « dépasser 200 ». Quelle réponse donner ?
        choix:
        -   id: a
            texte: n = 13
        -   id: b
            texte: n = 14
        -   id: c
            texte: n = 13,2
        aide: Un rang est entier ; au rang 13 on n’a pas encore dépassé.
-   id: a03
    titre: Partie 3 — Résoudre un problème
    transition: 'Dernière notion : utiliser tout cela dans une situation.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: 'Dans un problème, il faut d’abord reconnaître la suite : valeur de départ, et quantité ajoutée ou retirée à chaque étape.'
    -   type: paragraphe
        texte: Ensuite, on utilise la formule ou on cherche le rang.
    -   type: paragraphe
        texte: 'À retenir : Identifier u₀ et r ; écrire uₙ = u₀ + n × r ; calculer ou résoudre.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Écris u₀ (la valeur de départ) et r (le changement à chaque étape, avec son signe).
        - Écris uₙ = u₀ + n × r.
        - Calcule un terme ou cherche n selon la question.
        - Réponds par une phrase avec l’unité.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi le modèle marche
    -   type: liste
        elements:
        - 'Une écurie qui utilise 30 kg de foin par jour fait baisser le stock de 30 chaque jour : c’est une suite arithmétique.'
    -   type: paragraphe
        texte: 2. Ses limites
    -   type: liste
        elements:
        - 'Si la consommation change (plus de chevaux, été au pré), la raison change : il faut un nouveau modèle.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — 4 500 kg de foin, 45 kg par jour. Stock après 30 jours ?
        unite: kg
        aide: 4 500 − 30 × 45.
    -   id: q02
        type: nombre
        enonce: 'Même écurie : au bout de combien de jours le stock est-il vide ?'
        unite: jours
        aide: 4 500 ÷ 45.
    -   id: q03
        type: nombre
        enonce: Une pension coûte 350 € et augmente de 12 € par an. Prix dans 10 ans ?
        unite: €
        aide: 350 + 10 × 12.
    -   id: q04
        type: nombre
        enonce: Dans combien d’années dépassera-t-elle 450 € ?
        unite: ans
        aide: (450 − 350) ÷ 12 ≈ 8,3 → arrondi au-dessus.
    -   id: q05
        type: nombre
        enonce: Série B — Un poulain pèse 50 kg et prend 1,2 kg par jour. Poids au jour 100 ?
        unite: kg
        aide: 50 + 100 × 1,2.
    -   id: q06
        type: qcm
        enonce: Pour le stock de foin, la raison est…
        choix:
        -   id: a
            texte: '45'
        -   id: b
            texte: −45
        -   id: c
            texte: 4 500
        aide: Le stock baisse.
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: 'u₀ = 7, r = 4 : u₁₀₀ ?'
    -   id: q02
        type: nombre
        enonce: 'u₀ = 90, r = −6 : rang où uₙ = 0 ?'
    -   id: q03
        type: nombre
        enonce: 'u₀ = 12, r = 0,5 : premier rang où uₙ dépasse 20 ?'
retenir:
- uₙ = u₀ + n × r (si la suite commence à u₀).
- 'Pour trouver n : n = (valeur − u₀) ÷ r.'
- Si n n’est pas entier, on arrondit à l’entier au-dessus pour « atteindre » ou « dépasser ».
