titre: 'Séance 7 : Évaluation 1 — Calculs professionnels'
themes:
- MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Sais-tu refaire seul les calculs professionnels vus depuis le début de l’année ?
competences_bo:
- MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
    - Fractions et pourcentages ; évolutions successives.
    - HT, TVA, remise.
    - Taux et rendements ; unités et doses.
    competences:
    - Refaire seul, sans aide, les calculs des séances 1 à 6.
pourquoi:
- 'Évaluation : 20 exercices, 1 point chacun. Calculatrice autorisée, pas d’aide.'
- Écris tes calculs sur ta feuille.
