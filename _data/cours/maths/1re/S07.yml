titre: 'Séance 7 : Évaluation 1 : calculs professionnels'
themes:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Saurai-je réaliser seul les calculs commerciaux et techniques de l’écurie ?
competences_bo:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
        - 'On réutilise : automatismes, proportions, évolutions successives, facture, taux, conversions.'
    competences:
        - Résoudre des calculs professionnels en autonomie.
pourquoi:
    - De S01 à S06, tu as revu et approfondi les calculs.
    - 'Évaluation : trois situations.'
activites:
    -   id: a01
        titre: Évolutions
        consigne: Tu vas calculer seul deux hausses successives d’une pension et leur effet global. On attend trois résultats.
        contenu:
            -   type: etapes
                elements:
                    - La pension passe de 400 € à 420 €, puis augmente encore de 5 %.
            -   type: paragraphe
                texte: Pourquoi ? Enchaîner des évolutions est très fréquent.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Taux d’une hausse = nouveau ÷ ancien − …… .
                        - ''
                    -   - 'Hausse totale de deux hausses : produit des …… .'
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: nombre
                enonce: Taux de la première hausse ?
                unite: '%'
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q03
                type: nombre
                enonce: Prix après la 2e hausse ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q04
                type: nombre
                enonce: Hausse totale en % ?
                unite: '%'
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a02
        titre: Facture
        transition: Les évolutions sont faites. Passe à la facture.
        consigne: Tu vas calculer seul le total TTC d’une commande de 8 seaux avec une remise de 5 % et la TVA. On attend le total TTC.
        contenu:
            -   type: etapes
                elements:
                    - 'Commande : 8 seaux à 12,50 € HT ; remise 5 % ; TVA 20 %.'
            -   type: paragraphe
                texte: Pourquoi l’ordre ? Remise sur le HT, puis TVA.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Remise sur le HT, puis …… .
                        - ''
                    -   - '5 % de remise : coefficient …… .'
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: nombre
                enonce: Total TTC ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a03
        titre: Dose et unités
        transition: La facture est faite. Dernière situation.
        consigne: Tu vas calculer seul le volume d’un produit fictif et convertir la masse. On attend le volume et la conversion.
        contenu:
            -   type: titre
                texte: Exemple
            -   type: paragraphe
                texte: Notice inventée.
            -   type: etapes
                elements:
                    - 'Notice fictive : 5 mg/kg, produit à 100 mg/mL, cheval de 480 kg.'
            -   type: paragraphe
                texte: Pourquoi les unités ? Elles guident le calcul.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Volume = dose × poids ÷ …… .
                        - ''
                    -   - 1 000 mg = …… g.
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: nombre
                enonce: Volume à prélever ?
                unite: mL
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q03
                type: texte
                enonce: Écris 2 400 mg en g puis en écriture scientifique (g).
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un taux de réussite passe de 60 % à 72 %.
        questions:
            -   id: q01
                type: texte
                enonce: Évolution en points ? en % ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: L’évaluation est terminée. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : saurais-tu réaliser seul ces calculs ? Fais ton bilan.'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Évolutions, facture, dose.
sources:
    -   type: lien
        titre: ChloroFil — Bac Pro, tronc commun rénové, document d’accompagnement du module MG1
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/bacpro/bacpro-tc-da-MG1.pdf
