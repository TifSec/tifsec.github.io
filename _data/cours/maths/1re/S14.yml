titre: 'Séance 14 : Le nuage de points et le point moyen'
themes:
- MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
- MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Comment représenter deux variables à la fois, calculer le point moyen et faire une prévision ?
competences_bo:
- MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
- MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
    - 'Nuage de points : un point (x ; y) par individu.'
    - Point moyen G(x̄ ; ȳ).
    - Prévision avec une droite d’ajustement, seulement dans le domaine des mesures.
    competences:
    - Lire et placer les points d’un nuage.
    - Calculer les coordonnées du point moyen.
    - Faire une prévision avec une droite donnée.
pourquoi:
- 'Aujourd’hui, trois notions : le nuage de points, le point moyen, la prévision.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — Le nuage de points
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Quand on mesure deux choses sur chaque individu (l’âge et le poids d’un poulain), on obtient des couples (x ; y).
    -   type: paragraphe
        texte: 'Chaque couple devient un point : l’ensemble est un nuage de points.'
    -   type: paragraphe
        texte: 'À retenir : Point (x ; y) : x se lit sur l’axe horizontal, y sur l’axe vertical.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - 'Comment le faire : trace les deux axes gradués, puis place chaque point (x ; y).'
        - 'Comment le lire : pour un point, descends lire x, va à gauche lire y.'
        - 'Comment le comprendre : si les points montent de gauche à droite, y augmente quand x augmente.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi deux variables à la fois
    -   type: liste
        elements:
        - Un tableau donne les nombres ; le nuage montre d’un coup d’œil le lien entre l’âge et le poids.
    -   type: paragraphe
        texte: 2. Pourquoi les points sont presque alignés
    -   type: liste
        elements:
        - Ici, le poulain prend environ le même poids chaque mois.
        - 'Les points forment presque une droite : on pourra faire des prévisions.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Âge et poids de 6 poulains :'
    -   type: tableau
        colonnes:
        - Âge x (mois)
        - '2'
        - '4'
        - '6'
        - '8'
        - '10'
        - '12'
        lignes:
        -   - Poids y (kg)
            - '120'
            - '170'
            - '230'
            - '280'
            - '330'
            - '370'
    -   type: image
        url: /assets/images/graphiques/maths-1re-s14-classique-nuage.svg
        alternative: Nuage de points âge-poids des 6 poulains ; la croix rouge est le point moyen G.
        legende: Nuage de points âge-poids des 6 poulains ; la croix rouge est le point moyen G.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Ordonnée du point d’abscisse 4 ?
        unite: kg
        aide: Lis y pour x = 4.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Ordonnée du point d’abscisse 10 ?
        unite: kg
        aide: Lis y pour x = 10.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Abscisse du point d’ordonnée 280 ?
        unite: mois
        aide: Cherche 280 dans les y.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Combien de points dans le nuage ?
        aide: Un par poulain.
        calcul: true
    -   id: q05
        type: qcm
        enonce: Le point (230 ; 6) est-il dans le nuage ?
        choix:
        -   id: a
            texte: Oui
        -   id: b
            texte: Non, x et y sont inversés
        aide: x est l’âge.
    -   id: q06
        type: qcm
        enonce: Série B — Quand l’âge augmente, le poids…
        choix:
        -   id: a
            texte: augmente
        -   id: b
            texte: diminue
        -   id: c
            texte: ne change pas
        aide: Les points montent-ils ?
    -   id: q07
        type: nombre
        enonce: Prise de poids entre 2 et 12 mois ?
        unite: kg
        aide: 370 − 120.
        calcul: true
-   id: a02
    titre: Partie 2 — Le point moyen
    transition: 'Tu sais lire le nuage. Deuxième notion : son point « central ».'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Le point moyen G a pour coordonnées la moyenne des x et la moyenne des y.
    -   type: paragraphe
        texte: Il se trouve au « centre » du nuage.
    -   type: paragraphe
        texte: 'À retenir : G(x̄ ; ȳ) avec x̄ = somme des x ÷ n et ȳ = somme des y ÷ n.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - 'Additionne tous les x, divise par le nombre de points : x̄.'
        - 'Additionne tous les y, divise par le nombre de points : ȳ.'
        - Écris G(x̄ ; ȳ).
        - 'Place G : il doit être au milieu du nuage.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi des moyennes
    -   type: liste
        elements:
        - La moyenne résume une série par une valeur centrale.
        - G résume le nuage par un point central, une moyenne dans chaque direction.
    -   type: paragraphe
        texte: 2. À quoi il sert
    -   type: liste
        elements:
        - Une bonne droite d’ajustement passe par G.
        - C’est un point de repère pour tracer la droite.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Mêmes données (6 poulains).
    -   type: tableau
        colonnes:
        - Âge x (mois)
        - '2'
        - '4'
        - '6'
        - '8'
        - '10'
        - '12'
        lignes:
        -   - Poids y (kg)
            - '120'
            - '170'
            - '230'
            - '280'
            - '330'
            - '370'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Somme des x ?
        aide: 2 + 4 + 6 + 8 + 10 + 12.
        calcul: true
    -   id: q02
        type: nombre
        enonce: x̄ ?
        unite: mois
        aide: 42 ÷ 6.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Somme des y ?
        aide: Additionne les poids.
        calcul: true
    -   id: q04
        type: nombre
        enonce: ȳ ?
        unite: kg
        aide: 1 500 ÷ 6.
        calcul: true
    -   id: q05
        type: qcm
        enonce: Le point moyen est…
        choix:
        -   id: a
            texte: G(250 ; 7)
        -   id: b
            texte: G(7 ; 250)
        -   id: c
            texte: G(42 ; 1 500)
        aide: x d’abord, puis y.
    -   id: q06
        type: nombre
        enonce: 'Série B — Points (2 ; 5), (4 ; 9), (6 ; 13), (8 ; 17) : x̄ ?'
        aide: 20 ÷ 4.
        calcul: true
    -   id: q07
        type: nombre
        enonce: 'Même nuage : ȳ ?'
        aide: 44 ÷ 4.
        calcul: true
-   id: a03
    titre: Partie 3 — Faire une prévision
    transition: 'Dernière notion : utiliser une droite pour prévoir.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: 'Quand les points sont presque alignés, on trace une droite qui passe près d’eux : une droite d’ajustement.'
    -   type: paragraphe
        texte: Son équation permet de prévoir y pour un x donné.
    -   type: paragraphe
        texte: 'À retenir : Prévision : remplacer x dans l’équation y = ax + b. Seulement dans le domaine des mesures (ou juste à côté).'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - 'Vérifie que la droite passe par G : remplace x par x̄, tu dois trouver ȳ.'
        - Pour prévoir, remplace x par la valeur voulue.
        - Calcule y.
        - 'Ne prévois pas trop loin des mesures : le poulain ne grossit pas indéfiniment.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi la droite
    -   type: liste
        elements:
        - 'Elle résume la tendance : environ 25 kg de plus par mois.'
        - En la prolongeant un peu, on estime un poids non mesuré.
    -   type: paragraphe
        texte: 2. Pourquoi pas trop loin
    -   type: liste
        elements:
        - 'À 5 ans (60 mois), la droite donnerait 1 575 kg : impossible.'
        - 'La croissance ralentit : la droite n’est valable que sur la période mesurée.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Droite d’ajustement proposée : y = 25x + 75.'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Que donne la droite pour x = 7 ?
        unite: kg
        aide: 25 × 7 + 75.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Prévision du poids à 5 mois ?
        unite: kg
        aide: 25 × 5 + 75.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Prévision du poids à 11 mois ?
        unite: kg
        aide: 25 × 11 + 75.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Prévision du poids à 3 mois ?
        unite: kg
        aide: 25 × 3 + 75.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Série B — À quel âge la droite prévoit-elle 325 kg ?
        unite: mois
        aide: 25x + 75 = 325 → 25x = 250.
        calcul: true
    -   id: q06
        type: qcm
        enonce: Peut-on prévoir le poids à 60 mois avec cette droite ?
        choix:
        -   id: a
            texte: 'Oui : 1 575 kg'
        -   id: b
            texte: Non, c’est trop loin des mesures
        aide: Est-ce réaliste ?
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: Avec y = 25x + 75, prévision pour x = 13 ?
        unite: kg
        calcul: true
    -   id: q02
        type: nombre
        enonce: 'Points (10 ; 40), (20 ; 60), (30 ; 80) : ȳ ?'
        calcul: true
    -   id: q03
        type: nombre
        enonce: Avec y = 2x + 20, x pour y = 80 ?
        calcul: true
retenir:
- 'Nuage : un point (x ; y) par individu ; x sur l’axe horizontal, y sur l’axe vertical.'
- 'Point moyen G : x̄ = moyenne des x ; ȳ = moyenne des y.'
- Une droite d’ajustement passe près des points (et par G) ; on remplace x dans son équation pour prévoir y.
- On ne prévoit pas trop loin hors des mesures.
