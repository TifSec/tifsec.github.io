titre: 'Séance 14 : Deux variables à la fois : le nuage de points'
themes:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Comment voir si deux grandeurs sont liées ?
competences_bo:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
        - Un nuage de points représente deux variables quantitatives (x ; y).
        - Si les points s’alignent à peu près, on parle de lien linéaire ; le point moyen G(x̄ ; ȳ).
    competences:
        - Construire un nuage de points.
        - Calculer le point moyen et décrire une tendance.
pourquoi:
    - En S12, tu as croisé deux caractères qualitatifs.
    - 'Ici : le tour de poitrine et le poids de 8 chevaux.'
activites:
    -   id: a01
        titre: Le nuage
        consigne: Tu vas construire le nuage de points tour de poitrine / poids de 8 chevaux (document 1). On attend la description du nuage.
        contenu:
            -   type: liste
                elements:
                    - 'Automatisme : moyenne de 170 et 190.'
            -   type: tableau
                titre: Document 1 — Mesures de 8 chevaux (fictives)
                colonnes:
                    - Tour de poitrine x (cm)
                    - '170'
                    - '175'
                    - '180'
                    - '182'
                    - '185'
                    - '190'
                    - '195'
                    - '203'
                lignes:
                    -   - Poids y (kg)
                        - '410'
                        - '440'
                        - '465'
                        - '478'
                        - '495'
                        - '530'
                        - '560'
                        - '614'
            -   type: image
                url: /assets/images/graphiques/maths-1re-s14-nuage.svg
                alternative: Nuage de points des 8 chevaux et point moyen G.
                legende: Nuage de points des 8 chevaux et point moyen G.
            -   type: titre
                texte: Comment faire ce graphique
            -   type: etapes
                elements:
                    - 'Au tableur : sélectionne les deux lignes, Insertion > Diagramme > XY (dispersion) > Points seuls.'
                    - Ajoute titre et axes avec unités ; place G (x̄ ; ȳ) en ajoutant une deuxième série.
            -   type: titre
                texte: Comment le lire
            -   type: liste
                elements:
                    - Chaque point = un cheval (tour de poitrine ; poids).
                    - G est le centre du nuage.
            -   type: titre
                texte: Comment le comprendre
            -   type: liste
                elements:
                    - 'Demande-toi : quand x augmente, y augmente-t-il ou diminue-t-il ? Les points sont-ils proches d’une droite ?'
                    - Une droite d’ajustement passe près de G et au milieu des points.
            -   type: etapes
                elements:
                    - 'Lis l’exemple : 3 poneys (120 cm ; 250 kg), (130 cm ; 300 kg), (140 cm ; 350 kg).'
                    - 'Au tableur : ligne 1 les tours de poitrine, ligne 2 les poids ; sélectionne, Insertion > Diagramme > XY (dispersion) > Points seuls.'
                    - 'Chaque point est un poney. Ici, les points montent ensemble : quand x augmente, y augmente.'
                    - 'À toi : saisis le document 1 au tableur, trace le nuage et décris sa forme.'
                    - Pourquoi un nuage ? On voit si y augmente avec x.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Un nuage de points représente …… variables quantitatives.
                        - ''
                    -   - Si les points s’alignent, le lien est …… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: texte
                enonce: 'Décris le nuage : tendance, forme.'
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a02
        titre: Le point moyen
        transition: Le nuage est tracé. Trouve son centre.
        consigne: Tu vas calculer les coordonnées du point moyen G du nuage des 8 chevaux (tour de poitrine, poids). On attend x̄ et ȳ.
        contenu:
            -   type: etapes
                elements:
                    - Lis l’exemple des 3 poneys.
                    - x̄ = (120 + 130 + 140) ÷ 3 = 130 ; ȳ = (250 + 300 + 350) ÷ 3 = 300.
                    - Le point moyen est G (130 ; 300).
                    - 'À toi : calcule x̄ et ȳ pour les 8 chevaux, puis place G sur le nuage.'
                    - Pourquoi G ? Toute droite d’ajustement raisonnable passe près de lui.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Point moyen G(x̄ ; …… ).
                        - ''
                    -   - x̄ est la moyenne des …… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: nombre
                enonce: x̄ ?
                unite: cm
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q03
                type: nombre
                enonce: ȳ ?
                unite: kg
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a03
        titre: Une première prévision
        transition: G est placé. Prévois.
        consigne: Tu vas tracer une droite au jugé et prévoir le poids d’un cheval de 200 cm. On attend la lecture et une limite.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : une droite passe par G (130 ; 300) et près des points.'
                    - 'Pour lire une prévision en x = 135 : monte depuis 135 jusqu’à la droite, puis lis y ≈ 325.'
                    - 'Lire hors du nuage (par exemple x = 200 pour des poneys) s’appelle extrapoler : c’est risqué.'
                    - 'À toi : trace à la règle une droite qui passe près des points et par G, puis lis le poids pour 200 cm.'
                    - Pourquoi une droite ? Elle modélise le lien et permet de prévoir (séquence 4).
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Une droite d’ajustement passe près de …… .
                        - ''
                    -   - Prévoir hors des mesures s’appelle …… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: nombre
                enonce: Poids lu pour 200 cm ?
                unite: kg
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q03
                type: texte
                enonce: Cette prévision est-elle fiable pour 230 cm ? Pourquoi ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Lien ne veut pas dire cause.
        questions:
            -   id: q01
                type: texte
                enonce: Le tour de poitrine « cause »-t-il le poids ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais repérer un lien. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment voir si deux grandeurs sont liées ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Nuage (x ; y) ; G(x̄ ; ȳ).
    - Prévoir dans le domaine des mesures.
