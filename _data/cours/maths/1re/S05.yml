titre: 'Séance 5 : Taux de réussite en concours et rendements'
themes:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Comment comparer des réussites quand les effectifs sont différents ?
competences_bo:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
        - Taux = effectif favorable ÷ effectif total ; on compare des taux, pas des effectifs.
        - Rendement d’une prairie = production ÷ surface (en t/ha).
    competences:
        - Calculer et comparer des fréquences.
        - Calculer un rendement.
pourquoi:
    - Deux moniteurs comparent les résultats de leurs élèves aux examens fédéraux (Galops).
    - Qui a le meilleur taux de réussite ?
activites:
    -   id: a01
        titre: Comparer des taux
        consigne: Tu vas comparer les taux de réussite aux Galops de deux moniteurs (document 1). On attend les deux taux et la comparaison.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Le moniteur A a présenté 30 cavaliers aux Galops, le moniteur B 15. A a eu 18 réussites, B 12. Qui prépare le mieux ses cavaliers ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Un taux de réussite (ou fréquence) est la part des réussites parmi tous les candidats. On l’exprime souvent en pourcentage.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Comparer des groupes qui n’ont pas le même nombre de personnes.
                    - Suivre les progrès d’une année sur l’autre.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - On divise le nombre de réussites par le nombre de candidats.
                    - On multiplie par 100 pour avoir un pourcentage.
                    - On compare les taux, pas les nombres de réussites.
            -   type: paragraphe
                texte: 'À retenir : Taux de réussite = réussites ÷ candidats.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Un club a 14 réussites sur 20 candidats. Quel taux ?
                    - 'Club C : 21 réussites sur 35. Club D : 16 sur 20. Quel club a le meilleur taux ?'
            -   type: liste
                elements:
                    - 'Automatisme : 12 ÷ 15 = ? (en %)'
            -   type: tableau
                titre: Document 1 — Résultats aux Galops (fictifs)
                colonnes:
                    - Moniteur
                    - Candidats
                    - Réussites
                lignes:
                    -   - A
                        - '30'
                        - '18'
                    -   - B
                        - '15'
                        - '12'
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : lis les résultats (document 1) et calcule le taux de chaque moniteur.'
                    - Pourquoi un taux ? 18 réussites sur 30 n’est pas mieux que 12 sur 15.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Taux de réussite = réussites ÷ …… .
                        - ''
                    -   - On compare des …… et pas des effectifs.
                        - ''
                aide: 'Relis l’exemple 9 réussites sur 12 : on divise par quoi ? Et pour comparer des groupes de tailles différentes, compare-t-on les effectifs ou les… ?'
            -   id: q02
                type: nombre
                enonce: Taux de réussite du moniteur A ?
                unite: '%'
                aide: 'Dans le document 1 : réussites du moniteur A ÷ ses candidats × 100.'
            -   id: q03
                type: nombre
                enonce: Taux du moniteur B ?
                unite: '%'
                aide: Même calcul avec la ligne du moniteur B.
            -   id: q04
                type: texte
                enonce: Qui a le meilleur taux ? Le plus de réussites ?
                aide: 'Compare les deux taux, puis les deux nombres de réussites : est-ce le même moniteur qui gagne ?'
    -   id: a02
        titre: Le rendement des prairies
        transition: Tu sais comparer des réussites. Applique à la production.
        consigne: Tu vas calculer et comparer le rendement en foin de deux prés. On attend les deux rendements.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Le pré A (4,5 ha) a donné 27 t de foin, le pré B (3 ha) 21 t. Quel pré produit le mieux ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Le rendement est la quantité produite par unité de surface. Pour une prairie, on l’exprime en tonnes par hectare (t/ha).
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Comparer des prés de tailles différentes.
                    - Prévoir la quantité de foin à récolter et à acheter.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - On repère la production (en t) et la surface (en ha).
                    - On divise la production par la surface.
                    - 'On écrit l’unité : t/ha.'
            -   type: paragraphe
                texte: 'À retenir : Rendement = production ÷ surface.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Un pré de 2 ha a produit 13 t de foin. Quel rendement ?
                    - Avec un rendement de 5 t/ha, combien de foin donne un pré de 3,5 ha ?
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : le pré A (4,5 ha) a produit 27 t de foin ; le pré B (3 ha), 21 t. Calcule les rendements.'
                    - Pourquoi par hectare ? On compare des prés de tailles différentes.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Rendement = production ÷ …… .
                        - ''
                    -   - Le rendement d’une prairie s’exprime en t/…… .
                        - ''
                aide: 'Relis l’exemple du pré de 2,5 ha : production ÷ quoi ? Et l’unité, des tonnes par… ?'
            -   id: q02
                type: nombre
                enonce: Rendement du pré A ?
                unite: t/ha
                aide: Production du pré A ÷ sa surface (données de « À toi »).
            -   id: q03
                type: nombre
                enonce: Rendement du pré B ?
                unite: t/ha
                aide: Production du pré B ÷ sa surface.
    -   id: a03
        titre: Interpréter
        transition: Les rendements sont calculés. Pourquoi diffèrent-ils ?
        consigne: Tu vas proposer deux explications au meilleur rendement du pré B. On attend deux explications.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Le pré B a un meilleur rendement que le pré A. Pourquoi ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Interpréter un résultat, c’est chercher ce qui peut expliquer une différence entre deux chiffres.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - 'Prendre de bonnes décisions : fertiliser, changer la date de fauche, faire tourner les chevaux.'
                    - Ne pas tirer de conclusions hâtives d’un seul chiffre.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - On liste ce qui est différent entre les deux situations (sol, exposition, entretien, météo…).
                    - On propose des explications possibles, sans affirmer sans preuve.
                    - On dit comment on pourrait vérifier.
            -   type: paragraphe
                texte: 'À retenir : Un chiffre pose une question ; il ne donne pas l’explication tout seul.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Deux chevaux reçoivent la même ration, mais l’un grossit plus. Propose deux explications.
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : le pré B a un meilleur rendement ; propose deux explications possibles.'
                    - Pourquoi des explications ? Un chiffre pose une question, il ne répond pas tout seul.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Un écart de rendement peut s’expliquer par le …… , la fertilisation…
                        - ''
                    -   - Un chiffre pose une question, il faut une …… .
                        - ''
                aide: Quelles différences entre deux prés peuvent changer le rendement ? Et un chiffre seul suffit-il, ou faut-il chercher une… ?
            -   id: q02
                type: texte
                enonce: Propose deux explications au meilleur rendement du pré B.
                aide: 'Pense à ce qui change d’un pré à l’autre : sol, exposition, eau, fertilisation, espèces semées, pâturage.'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le moniteur B n’a eu que 15 candidats.
        questions:
            -   id: q01
                type: texte
                enonce: Son taux est-il aussi fiable que celui de A ?
                aide: 15 candidats, c’est peu. Si un seul candidat de plus avait échoué, de combien le taux changerait-il ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais comparer des réussites. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment comparer des réussites quand les effectifs sont différents ?'
                aide: Dis comment calculer un taux et un rendement, et pourquoi on les compare plutôt que les nombres bruts.
retenir:
    - Taux = favorable ÷ total.
    - Rendement = production ÷ surface.
sources:
