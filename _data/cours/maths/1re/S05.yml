titre: 'Séance 5 : Taux de réussite et rendements'
themes:
- MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
- MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Comment calculer un taux et un rendement, et s’en servir pour comparer ?
competences_bo:
- MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
- MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
    - Taux = partie ÷ total (× 100 pour un pourcentage).
    - Rendement = production ÷ surface (en t/ha).
    competences:
    - Calculer un taux en %, et retrouver une partie à partir d’un taux.
    - Calculer un rendement, une production ou une surface.
    - Comparer deux groupes ou deux prés.
pourquoi:
- 'Aujourd’hui, deux notions seulement : le taux, puis le rendement.'
- 'Pour chacune : la notion, la méthode, un exemple au tableau, puis beaucoup d’exercices pour s’entraîner.'
activites:
-   id: a01
    titre: Partie 1 — Le taux (pourcentage)
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: 'Un taux (on dit aussi une fréquence) indique quelle part d’un groupe a une caractéristique : les candidats qui ont réussi, les chevaux vaccinés…'
    -   type: paragraphe
        texte: On l’écrit le plus souvent en pourcentage (%).
    -   type: paragraphe
        texte: 'À retenir : Taux = partie ÷ total. Pour l’avoir en %, on multiplie par 100.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Repère la partie (par exemple les réussites) et le total (par exemple les candidats).
        - 'Divise la partie par le total : tu obtiens un nombre entre 0 et 1.'
        - 'Multiplie par 100 : tu obtiens le taux en %.'
        - Pour comparer deux groupes de tailles différentes, compare leurs taux, jamais les nombres bruts.
        - 'Dans l’autre sens : si tu connais le taux, partie = total × taux (40 % s’écrit 0,40).'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. En raisonnant avec « sur 100 »
    -   type: liste
        elements:
        - 'Un pourcentage répond à la question : « combien sur 100 ? ». 75 %, c’est 75 sur 100.'
        - 'Exemple : 6 réussites sur 8 candidats. Chaque candidat compte pour 1 ÷ 8 du groupe ; 6 candidats comptent pour 6 ÷ 8 = 0,75 du groupe.'
        - '0,75, c’est 75 centièmes : 0,75 = 75/100. « Sur 100 » s’écrit %, donc 0,75 = 75 %.'
        - 'C’est pour cela qu’on multiplie par 100 : on passe de « 0,75 du groupe » à « 75 sur 100 ».'
    -   type: paragraphe
        texte: '2. Dans l’autre sens : retrouver la partie'
    -   type: liste
        elements:
        - '40 % des candidats ont réussi : cela veut dire 40 sur 100, soit 40/100 = 0,40 du groupe.'
        - 'Sur 50 candidats, on prend 0,40 fois le groupe : partie = 50 × 0,40.'
        - 'Partie = total × taux, c’est la formule du taux « retournée » : taux = partie ÷ total, donc partie = total × taux.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée. Donne les taux en % (par exemple 75, pas 0,75).
    questions:
    -   id: q01
        type: nombre
        enonce: 'Série A — Calcule le taux de réussite : 9 réussites sur 10 candidats.'
        unite: '%'
        aide: Taux = réussites ÷ candidats, puis × 100.
    -   id: q02
        type: nombre
        enonce: 'Calcule le taux : 15 réussites sur 20 candidats.'
        unite: '%'
        aide: Divise 15 par 20, puis multiplie par 100.
    -   id: q03
        type: nombre
        enonce: 'Calcule le taux : 12 réussites sur 15 candidats.'
        unite: '%'
        aide: Divise 12 par 15, puis multiplie par 100.
    -   id: q04
        type: nombre
        enonce: 'Calcule le taux : 14 réussites sur 40 candidats.'
        unite: '%'
        aide: Divise 14 par 40, puis multiplie par 100.
    -   id: q05
        type: nombre
        enonce: 'Calcule le taux : 21 réussites sur 35 candidats.'
        unite: '%'
        aide: Divise 21 par 35, puis multiplie par 100.
    -   id: q06
        type: nombre
        enonce: 'Calcule le taux : 27 réussites sur 36 candidats.'
        unite: '%'
        aide: Divise 27 par 36, puis multiplie par 100.
    -   id: q07
        type: nombre
        enonce: 'Calcule le taux : 13 réussites sur 52 candidats.'
        unite: '%'
        aide: Divise 13 par 52, puis multiplie par 100.
    -   id: q08
        type: qcm
        enonce: 'Série B — Club A : 18 réussites sur 30. Club B : 12 réussites sur 15. Quel club a le meilleur taux de réussite ?'
        choix:
        -   id: a
            texte: Le club A
        -   id: b
            texte: Le club B
        -   id: c
            texte: Les deux ont le même taux
        aide: Calcule les deux taux, puis compare-les. Ne compare pas les nombres de réussites.
    -   id: q09
        type: qcm
        enonce: 'Classe 1 : 16 réussites sur 20. Classe 2 : 21 réussites sur 25. Quelle classe a le meilleur taux ?'
        choix:
        -   id: a
            texte: La classe 1
        -   id: b
            texte: La classe 2
        -   id: c
            texte: Les deux ont le même taux
        aide: Calcule les deux taux en %, puis compare-les.
    -   id: q10
        type: nombre
        enonce: Série C — 40 % des 25 candidats ont réussi. Combien de candidats ont réussi ?
        unite: candidats
        aide: Réussites = total × taux. 40 % s’écrit 0,40.
    -   id: q11
        type: nombre
        enonce: 75 % des 60 chevaux du centre sont vaccinés. Combien de chevaux sont vaccinés ?
        unite: chevaux
        aide: Nombre = total × taux. 75 % s’écrit 0,75.
-   id: a02
    titre: Partie 2 — Le rendement
    transition: 'Tu sais calculer un taux. Deuxième notion : le rendement d’un pré.'
    consigne: Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre.
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Le rendement d’un pré est la quantité de foin produite sur 1 hectare (ha).
    -   type: paragraphe
        texte: 'Il s’écrit en tonnes par hectare : t/ha.'
    -   type: paragraphe
        texte: 'À retenir : Rendement = production ÷ surface.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Repère la production (en t) et la surface (en ha).
        - 'Divise la production par la surface. Écris l’unité : t/ha.'
        - Pour comparer deux prés de tailles différentes, compare leurs rendements.
        - 'Si tu connais le rendement : production = rendement × surface.'
        - 'Si tu connais la production et le rendement : surface = production ÷ rendement.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. En raisonnant avec « pour 1 hectare »
    -   type: liste
        elements:
        - 'Le rendement répond à la question : « combien de foin sur 1 hectare ? ».'
        - 'Exemple : 15 t de foin sur 3 ha. On partage les 15 t entre les 3 hectares : chaque hectare a donné 15 ÷ 3 = 5 t.'
        - 'C’est pour cela qu’on divise : production ÷ surface = ce que donne 1 hectare, en t/ha.'
    -   type: paragraphe
        texte: '2. Dans l’autre sens : production et surface'
    -   type: liste
        elements:
        - 'Si 1 ha donne 5 t, alors 4 ha donnent 4 fois plus : production = 5 × 4 = rendement × surface.'
        - 'Pour récolter 20 t avec 5 t par hectare, il faut autant d’hectares que de fois 5 t dans 20 t : surface = 20 ÷ 5 = production ÷ rendement.'
        - 'Ces trois formules disent la même chose : production = rendement × surface.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Calculatrice autorisée. N’oublie pas l’unité dans ta tête : t/ha, t ou ha.'
    questions:
    -   id: q01
        type: nombre
        enonce: 'Série A — Calcule le rendement : 20 t de foin sur 4 ha.'
        unite: t/ha
        aide: Rendement = production ÷ surface.
    -   id: q02
        type: nombre
        enonce: 'Calcule le rendement : 13 t de foin sur 2 ha.'
        unite: t/ha
        aide: Divise la production par la surface.
    -   id: q03
        type: nombre
        enonce: 'Calcule le rendement : 27 t de foin sur 4,5 ha.'
        unite: t/ha
        aide: Divise 27 par 4,5.
    -   id: q04
        type: nombre
        enonce: 'Calcule le rendement : 9 t de foin sur 1,5 ha.'
        unite: t/ha
        aide: Divise 9 par 1,5.
    -   id: q05
        type: nombre
        enonce: 'Calcule le rendement : 36 t de foin sur 8 ha.'
        unite: t/ha
        aide: Divise 36 par 8.
    -   id: q06
        type: qcm
        enonce: 'Série B — Pré A : 27 t sur 4,5 ha. Pré B : 21 t sur 3 ha. Quel pré a le meilleur rendement ?'
        choix:
        -   id: a
            texte: Le pré A
        -   id: b
            texte: Le pré B
        -   id: c
            texte: Les deux ont le même rendement
        aide: Calcule les deux rendements en t/ha, puis compare-les.
    -   id: q07
        type: nombre
        enonce: Série C — Un pré de 3,5 ha a un rendement de 5 t/ha. Combien de tonnes de foin produit-il ?
        unite: t
        aide: Production = rendement × surface.
    -   id: q08
        type: nombre
        enonce: Un pré de 2,5 ha a un rendement de 6 t/ha. Combien de tonnes de foin produit-il ?
        unite: t
        aide: Production = rendement × surface.
    -   id: q09
        type: nombre
        enonce: Série D — Il faut 24 t de foin. Le rendement est de 6 t/ha. Quelle surface faut-il faucher ?
        unite: ha
        aide: Surface = production ÷ rendement.
-   id: a03
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini les deux parties ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: 'Calcule le taux : 33 réussites sur 44 candidats.'
        unite: '%'
    -   id: q02
        type: nombre
        enonce: 'Calcule le taux : 8 réussites sur 32 candidats.'
        unite: '%'
    -   id: q03
        type: nombre
        enonce: 20 % des 45 cavaliers ont eu le Galop 4. Combien de cavaliers ?
        unite: cavaliers
    -   id: q04
        type: nombre
        enonce: 15 % des 200 chevaux d’un élevage sont des poulains. Combien de poulains ?
        unite: poulains
    -   id: q05
        type: nombre
        enonce: 'Calcule le rendement : 18 t de foin sur 4 ha.'
        unite: t/ha
    -   id: q06
        type: nombre
        enonce: Un pré de 1,5 ha a un rendement de 7 t/ha. Combien de tonnes de foin ?
        unite: t
    -   id: q07
        type: nombre
        enonce: Il faut 30 t de foin avec un rendement de 7,5 t/ha. Quelle surface faucher ?
        unite: ha
    -   id: q08
        type: texte
        enonce: 'Pré C : 22 t sur 4 ha. Pré D : 17 t sur 3 ha. Quel pré a le meilleur rendement ? Donne les deux rendements.'
retenir:
- Taux = partie ÷ total ; × 100 pour l’avoir en %.
- Partie = total × taux.
- Rendement = production ÷ surface (t/ha).
- Production = rendement × surface ; surface = production ÷ rendement.
- Pour comparer des groupes ou des prés de tailles différentes, on compare les taux ou les rendements.
