titre: 'Séance 5 : Taux de réussite en concours et rendements'
themes:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Comment comparer des réussites quand les effectifs sont différents ?
competences_bo:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
        - Fréquence = effectif favorable ÷ effectif total ; on compare des fréquences, pas des effectifs.
        - Rendement (prairie) = production ÷ surface (t/ha).
    competences:
        - Calculer et comparer des fréquences.
        - Calculer un rendement.
pourquoi:
    - Deux moniteurs comparent les résultats de leurs élèves aux examens fédéraux (Galops).
    - Qui a le meilleur taux de réussite ?
activites:
    -   id: a01
        titre: Comparer des taux
        consigne: Tu vas comparer les taux de réussite aux Galops de deux moniteurs (document 1). On attend les deux taux et la comparaison.
        contenu:
            -   type: liste
                elements:
                    - 'Automatisme : 12 ÷ 15 = ? (en %)'
            -   type: tableau
                titre: Document 1 — Résultats aux Galops (fictifs)
                colonnes:
                    - Moniteur
                    - Candidats
                    - Réussites
                lignes:
                    -   - A
                        - '30'
                        - '18'
                    -   - B
                        - '15'
                        - '12'
            -   type: etapes
                elements:
                    - 'Lis l’exemple : 9 réussites sur 12 candidats.'
                    - Taux = réussites ÷ candidats = 9 ÷ 12 = 0,75, soit 75 %.
                    - Un taux permet de comparer des groupes de tailles différentes.
                    - 'À toi : lis les résultats (document 1) et calcule le taux de chaque moniteur.'
                    - Pourquoi un taux ? 18 réussites sur 30 n’est pas mieux que 12 sur 15.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Taux de réussite = réussites ÷ …… .
                        - ''
                    -   - On compare des …… et pas des effectifs.
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: nombre
                enonce: Taux de réussite du moniteur A ?
                unite: '%'
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q03
                type: nombre
                enonce: Taux du moniteur B ?
                unite: '%'
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q04
                type: texte
                enonce: Qui a le meilleur taux ? Le plus de réussites ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a02
        titre: Le rendement des prairies
        transition: Tu sais comparer des réussites. Applique à la production.
        consigne: Tu vas calculer et comparer le rendement en foin de deux prés. On attend les deux rendements.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : un pré de 2,5 ha a produit 15 t de foin.'
                    - Rendement = production ÷ surface = 15 ÷ 2,5 = 6 t/ha.
                    - 'À toi : le pré A (4,5 ha) a produit 27 t de foin ; le pré B (3 ha), 21 t. Calcule les rendements.'
                    - Pourquoi par hectare ? On compare des prés de tailles différentes.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Rendement = production ÷ …… .
                        - ''
                    -   - Le rendement d’une prairie s’exprime en t/…… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: nombre
                enonce: Rendement du pré A ?
                unite: t/ha
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q03
                type: nombre
                enonce: Rendement du pré B ?
                unite: t/ha
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a03
        titre: Interpréter
        transition: Les rendements sont calculés. Pourquoi diffèrent-ils ?
        consigne: Tu vas proposer deux explications au meilleur rendement du pré B. On attend deux explications.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : deux élèves, même temps d’entraînement, l’un réussit mieux.'
                    - 'Pour expliquer un écart, on cherche ce qui est différent entre les deux : matériel, conditions, méthode…'
                    - 'À toi : le pré B a un meilleur rendement ; propose deux explications possibles.'
                    - Pourquoi des explications ? Un chiffre pose une question, il ne répond pas tout seul.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Un écart de rendement peut s’expliquer par le …… , la fertilisation…
                        - ''
                    -   - Un chiffre pose une question, il faut une …… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: texte
                enonce: Propose deux explications au meilleur rendement du pré B.
                aide: Une idée réaliste + « Cela permet de… ».
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le moniteur B n’a eu que 15 candidats.
        questions:
            -   id: q01
                type: texte
                enonce: Son taux est-il aussi fiable que celui de A ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais comparer des réussites. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment comparer des réussites quand les effectifs sont différents ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Taux = favorable ÷ total.
    - Rendement = production ÷ surface.
sources:
