titre: 'Séance 13 : Lire un graphique avec un œil critique'
themes:
- MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
problematique: Comment repérer qu’un graphique exagère ou cache quelque chose ?
competences_bo:
- MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
objectifs:
    connaissances:
    - 'Pièges : axe qui ne part pas de 0, période choisie, aires, 3D, source absente.'
    - On revient toujours aux nombres.
    competences:
    - Calculer le vrai écart et la vraie évolution derrière un graphique.
    - Repérer un choix de période trompeur.
    - Appliquer une grille critique.
pourquoi:
- 'Aujourd’hui, trois notions : l’axe tronqué, la période choisie, la grille critique.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — L’axe qui ne commence pas à 0
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Sur un diagramme en barres, si l’axe vertical commence à 94 au lieu de 0, une petite différence paraît énorme.
    -   type: paragraphe
        texte: Il faut lire les nombres, pas la hauteur apparente des barres.
    -   type: paragraphe
        texte: 'À retenir : Lis la valeur de départ de l’axe, puis calcule l’écart réel (et l’écart en %).'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Regarde le plus petit nombre de l’axe vertical.
        - Lis les deux valeurs.
        - 'Calcule l’écart réel : grande − petite.'
        - 'Calcule l’écart en % : écart ÷ petite valeur × 100.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi l’œil se trompe
    -   type: liste
        elements:
        - Avec un axe à partir de 94, la barre A dépasse de 2 et la barre B de 6.
        - B paraît 3 fois plus haute, alors qu’elle n’a que 4 licenciés de plus sur environ 100.
    -   type: paragraphe
        texte: 2. Pourquoi calculer en %
    -   type: liste
        elements:
        - 4 de plus sur 96, c’est environ 4 % de plus.
        - Le pourcentage donne la vraie taille de la différence.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Licenciés de deux clubs :'
    -   type: image
        url: /assets/images/graphiques/maths-1re-s13-classique-tronque.svg
        alternative: 'Diagramme en barres : club A 96 licenciés, club B 100 licenciés ; l’axe vertical commence à 94.'
        legende: 'Diagramme en barres : club A 96 licenciés, club B 100 licenciés ; l’axe vertical commence à 94.'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — À quelle valeur commence l’axe vertical ?
        aide: Le plus petit nombre de l’axe.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Combien de licenciés dans le club A ?
        aide: Hauteur de la barre A.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Écart réel entre les deux clubs ?
        aide: 100 − 96.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Écart en % par rapport au club A (au dixième) ?
        unite: '%'
        aide: 4 ÷ 96 × 100.
        calcul: true
    -   id: q05
        type: qcm
        enonce: À l’œil, la barre B paraît environ combien de fois plus haute que A (au-dessus de 94) ?
        choix:
        -   id: a
            texte: 1 fois
        -   id: b
            texte: 2 fois
        -   id: c
            texte: 3 fois
        aide: 'Mesure ce qui dépasse de 94 : 2 et 6.'
    -   id: q06
        type: qcm
        enonce: Série B — Que faut-il faire pour un graphique honnête ?
        choix:
        -   id: a
            texte: Faire partir l’axe de 0
        -   id: b
            texte: Mettre des barres en 3D
        aide: Quand l’axe part de 0, les hauteurs sont proportionnelles.
    -   id: q07
        type: qcm
        enonce: Le titre dit « Le club B écrase le club A ». Est-ce juste ?
        choix:
        -   id: a
            texte: Oui
        -   id: b
            texte: Non, l’écart n’est que d’environ 4 %
        aide: Reviens au calcul en %.
-   id: a02
    titre: Partie 2 — La période choisie
    transition: 'Tu sais déjouer un axe tronqué. Deuxième notion : le choix des dates.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: En choisissant le début et la fin d’une courbe, on peut faire croire à une hausse ou à une baisse.
    -   type: paragraphe
        texte: Il faut regarder toute la période disponible.
    -   type: paragraphe
        texte: 'À retenir : Compare l’évolution sur plusieurs périodes ; méfie-toi d’un début ou d’une fin sur un creux ou un pic.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Repère les années de début et de fin.
        - Calcule l’évolution sur cette période.
        - Calcule l’évolution sur toute la période.
        - Compare et conclus.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi le début compte
    -   type: liste
        elements:
        - 'Partir d’un creux (2021 : 280) fait croire à une forte hausse.'
        - 'Partir d’un pic (2019 : 330) fait croire à une baisse.'
    -   type: paragraphe
        texte: 2. Pourquoi toute la période
    -   type: liste
        elements:
        - 'De 2016 à 2024, on passe de 300 à 320 : une hausse modérée.'
        - C’est l’image la plus juste.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Naissances de poulains dans une région (données fictives) :'
    -   type: image
        url: /assets/images/graphiques/maths-1re-s13-classique-periode.svg
        alternative: Courbe des naissances de 2016 à 2024.
        legende: Courbe des naissances de 2016 à 2024.
    -   type: paragraphe
        texte: 'Comment le lire : l’année est en bas, le nombre de naissances à gauche (graduations de 10 en 10, l’axe commence à 260).'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Naissances en 2019 ?
        aide: Lis le point de 2019.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Naissances en 2021 ?
        aide: Lis le point de 2021.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Évolution de 2021 à 2024, en % (au dixième) ?
        unite: '%'
        aide: (320 ÷ 280 − 1) × 100.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Évolution de 2019 à 2024, en % (au dixième) ?
        unite: '%'
        aide: (320 ÷ 330 − 1) × 100.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Évolution de 2016 à 2024, en % (au dixième) ?
        unite: '%'
        aide: (320 ÷ 300 − 1) × 100.
        calcul: true
    -   id: q06
        type: qcm
        enonce: 'Série B — Un article titre « Les naissances explosent : +14 % ! ». Quelle période a-t-il choisie ?'
        choix:
        -   id: a
            texte: 2016-2024
        -   id: b
            texte: 2021-2024
        -   id: c
            texte: 2019-2024
        aide: Laquelle donne +14 % ?
    -   id: q07
        type: qcm
        enonce: Quelle phrase est la plus honnête ?
        choix:
        -   id: a
            texte: Les naissances explosent.
        -   id: b
            texte: Les naissances baissent.
        -   id: c
            texte: Sur 2016-2024, les naissances augmentent un peu (+6,7 %), avec des hauts et des bas.
        aide: Toute la période.
-   id: a03
    titre: Partie 3 — La grille critique
    transition: 'Dernière notion : une liste de questions à poser à chaque graphique.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Pour juger un graphique, on se pose toujours les mêmes questions.
    -   type: paragraphe
        texte: Un graphique sans source, sans date ou sans unité ne permet pas de conclure.
    -   type: paragraphe
        texte: 'À retenir : Grille : source, date, unité, axe (départ à 0 ?), période, effets visuels (3D, dessins d’aires différentes).'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - 'Source et date : qui a produit les chiffres, et quand ?'
        - 'Unité : de quoi parle-t-on (nombres, %, € ) ?'
        - 'Axe et période : départ à 0 ? dates choisies ?'
        - 'Effets : 3D, images de tailles différentes ?'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi les dessins trompent
    -   type: liste
        elements:
        - Si on double la hauteur ET la largeur d’un dessin de cheval, son aire est multipliée par 4.
        - L’œil voit 4 fois plus, alors que la valeur n’a fait que doubler.
    -   type: paragraphe
        texte: 2. Pourquoi la source
    -   type: liste
        elements:
        - Sans source, on ne peut pas vérifier les chiffres.
        - Une source officielle (IFCE, Agreste) est plus fiable qu’une publicité.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Réponds en appliquant la grille.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Un dessin est agrandi 3 fois en hauteur et 3 fois en largeur. Son aire est multipliée par…
        aide: 3 × 3.
        calcul: true
    -   id: q02
        type: qcm
        enonce: Pour représenter une valeur 3 fois plus grande, ce dessin…
        choix:
        -   id: a
            texte: 'exagère : il paraît 9 fois plus grand'
        -   id: b
            texte: est juste
        aide: Compare 9 et 3.
    -   id: q03
        type: qcm
        enonce: Un graphique n’a ni source ni date. Peut-on s’y fier ?
        choix:
        -   id: a
            texte: Oui
        -   id: b
            texte: Non, on ne peut pas vérifier
        aide: Relis la grille.
    -   id: q04
        type: qcm
        enonce: Un camembert en 3D penché…
        choix:
        -   id: a
            texte: peut faire paraître plus grande la part au premier plan
        -   id: b
            texte: est plus précis
        aide: L’effet de perspective agrandit l’avant.
    -   id: q05
        type: qcm
        enonce: Série B — Lequel est le plus fiable ?
        choix:
        -   id: a
            texte: Un graphique publicitaire sans source
        -   id: b
            texte: Un graphique sur un réseau social
        -   id: c
            texte: Un graphique de l’IFCE avec date et unité
        aide: Source et date.
    -   id: q06
        type: qcm
        enonce: Dans la grille, que vérifie-t-on en premier sur l’axe vertical ?
        choix:
        -   id: a
            texte: S’il commence à 0
        -   id: b
            texte: Sa couleur
        aide: Partie 1.
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: Axe de 48 à 52 ; valeurs 49 et 51. Écart réel ?
        calcul: true
    -   id: q02
        type: nombre
        enonce: Écart en % par rapport à 49 (au dixième) ?
        unite: '%'
        calcul: true
    -   id: q03
        type: nombre
        enonce: 'Dessin agrandi 2 fois en hauteur et 2 fois en largeur : aire × ?'
        calcul: true
retenir:
- 'Vérifie où commence l’axe vertical : s’il ne part pas de 0, les écarts paraissent plus grands.'
- 'Vérifie la période : un choix de dates peut faire croire à une hausse ou à une baisse.'
- 'Grille : source ? date ? axe ? unité ? période ? 3D ou dessins ?'
- 'On revient toujours aux nombres : écart réel, évolution en %.'
