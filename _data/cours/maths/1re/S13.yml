titre: 'Séance 13 : Ce graphique est-il honnête ?'
themes:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
problematique: Comment repérer un graphique qui déforme les données ?
competences_bo:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
objectifs:
    connaissances:
        - 'Pièges : axe qui ne commence pas à 0, échelle non régulière, aires trompeuses (images agrandies), absence de source, période choisie.'
        - 'Lire un graphique : titre, unités, échelle, source, intérêt de l’auteur.'
    competences:
        - Analyser un graphique de façon critique.
        - Corriger un graphique.
pourquoi:
    - En 2de, tu as vu l’axe tronqué.
    - Aujourd’hui, d’autres pièges, plus subtils.
activites:
    -   id: a01
        titre: L’aire trompeuse
        consigne: Tu vas calculer comment une image agrandie déforme une évolution de chiffre d’affaires. On attend le rapport des aires et l’impression donnée.
        contenu:
            -   type: liste
                elements:
                    - 'Automatisme : 2² = ? ; 3² = ?'
            -   type: etapes
                elements:
                    - 'Lis l’exemple : un carré de 1 cm de côté devient un carré de 3 cm de côté.'
                    - 'Aire avant : 1 × 1 = 1 cm² ; après : 3 × 3 = 9 cm².'
                    - La longueur est multipliée par 3, l’aire par 3² = 9.
                    - 'À toi : un dessin de cheval est 2 fois plus grand (hauteur et largeur). Calcule le rapport des aires.'
                    - Pourquoi l’aire ? L’œil compare les surfaces, pas les hauteurs.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Quand une image double en hauteur et en largeur, son aire est multipliée par …… .
                        - ''
                    -   - L’œil compare les …… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: nombre
                enonce: Par combien l’aire du dessin est-elle multipliée ?
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q03
                type: texte
                enonce: Quelle impression donne le dessin ?
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a02
        titre: La période choisie
        transition: Les dessins peuvent tromper. Les périodes aussi.
        consigne: Tu vas expliquer pourquoi deux graphiques sur les licences d’un club semblent se contredire (document 1). On attend l’explication.
        contenu:
            -   type: liste
                elements:
                    - 'Graphique A (club concurrent) : licences 2021-2024, courbe en hausse : « Le club est en plein essor ! »'
                    - 'Graphique B (presse) : licences 2018-2024, courbe en baisse : « Le club perd des cavaliers. »'
            -   type: image
                url: /assets/images/graphiques/maths-1re-s13-periodes.svg
                alternative: Les mêmes données de licences, sur deux périodes différentes.
                legende: Les mêmes données de licences, sur deux périodes différentes.
            -   type: titre
                texte: Comment faire ce graphique
            -   type: etapes
                elements:
                    - 'Pour être honnête : montrer toute la période disponible et indiquer la source.'
            -   type: titre
                texte: Comment le lire
            -   type: liste
                elements:
                    - Regarde l’année de début de chaque graphique.
            -   type: titre
                texte: Comment le comprendre
            -   type: liste
                elements:
                    - En partant du point le plus bas (2021), on fait croire à un essor ; sur toute la période, les licences ont baissé.
                    - Toujours vérifier la période choisie avant de conclure.
            -   type: etapes
                elements:
                    - 'Lis l’exemple : une courbe de températures de mai à juillet monte ; de juillet à septembre, elle descend.'
                    - 'Les deux sont vraies : seule la période choisie change le message.'
                    - 'À toi : lis les deux graphiques décrits (document 1) et explique la contradiction.'
                    - Pourquoi la période ? En choisissant le début et la fin, on peut faire dire le contraire.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Choisir la …… peut faire dire le contraire.
                        - ''
                    -   - On vérifie toujours les dates de …… et de fin.
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: texte
                enonce: D’après le document 1, pourquoi les deux graphiques semblent-ils se contredire ?
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a03
        titre: La grille critique
        transition: Tu connais plusieurs pièges. Analyse un vrai graphique.
        consigne: Tu vas appliquer la grille de lecture critique à un graphique de la presse équestre. On attend trois réponses.
        contenu:
            -   type: etapes
                elements:
                    - 'Rappel de la grille : titre, axes et unités, axe à 0, échelle régulière, période, source, auteur et but.'
                    - 'À toi : applique la grille à un graphique trouvé dans la presse équestre ou fourni, et remplis-la.'
                    - Pourquoi une grille ? On ne laisse passer aucun piège.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - On vérifie la …… et la date.
                        - ''
                    -   - On se demande qui a …… à ce graphique.
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: tableau
                enonce: Applique la grille.
                colonnes:
                    - Question
                    - Réponse
                lignes:
                    -   - Source et date ?
                        - ''
                    -   - Axe à 0 ? échelle régulière ?
                        - ''
                    -   - Qui a intérêt à ce graphique ?
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un graphique en 3D incliné.
        questions:
            -   id: q01
                type: texte
                enonce: Quel piège ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais repérer un graphique déformant. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment repérer un graphique qui déforme les données ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Pièges : axe, aire, période, 3D, source.'
    - Grille critique.
sources:
