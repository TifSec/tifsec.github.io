titre: 'Séance 2 : Fractions, nombres décimaux et pourcentages'
themes:
- MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Comment passer d’une fraction à un nombre décimal et à un pourcentage, et calculer une proportion d’une proportion ?
competences_bo:
- MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
    - a/b = a ÷ b ; décimal × 100 = pourcentage.
    - Proportion = partie ÷ total.
    - 'Proportion d’une proportion : on multiplie les deux proportions.'
    competences:
    - Convertir fraction, décimal et pourcentage.
    - Calculer une proportion.
    - Calculer une proportion de proportion.
pourquoi:
- 'Aujourd’hui, trois notions : convertir, calculer une proportion, la proportion d’une proportion.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — Fraction, décimal, pourcentage
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: 'Une même part peut s’écrire de trois façons : 3/4, 0,75 ou 75 %.'
    -   type: paragraphe
        texte: On passe de l’une à l’autre par une division ou une multiplication par 100.
    -   type: paragraphe
        texte: 'À retenir : a/b = a ÷ b (décimal) ; décimal × 100 = pourcentage ; pourcentage ÷ 100 = décimal.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - 'Fraction → décimal : divise le haut par le bas.'
        - 'Décimal → pourcentage : multiplie par 100.'
        - 'Pourcentage → décimal : divise par 100 (40 % = 0,40).'
        - 'Repères : 1/2 = 0,5 = 50 % ; 1/4 = 0,25 = 25 % ; 1/5 = 0,2 = 20 %.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi a ÷ b
    -   type: liste
        elements:
        - '3/4, c’est 3 unités partagées en 4 parts : 3 ÷ 4 = 0,75.'
    -   type: paragraphe
        texte: 2. Pourquoi × 100
    -   type: liste
        elements:
        - 0,75 = 75 centièmes = 75 sur 100 = 75 %.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Écris 1/4 en décimal.
        aide: 1 ÷ 4.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Écris 3/5 en décimal.
        aide: 3 ÷ 5.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Écris 0,35 en pourcentage.
        unite: '%'
        aide: × 100.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Écris 7/20 en pourcentage.
        unite: '%'
        aide: 7 ÷ 20 × 100.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Série B — Écris 8 % en décimal.
        aide: ÷ 100.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Écris 9/12 en pourcentage.
        unite: '%'
        aide: 9 ÷ 12 = 0,75.
        calcul: true
    -   id: q07
        type: nombre
        enonce: Écris 3/8 en pourcentage.
        unite: '%'
        aide: 3 ÷ 8 × 100.
        calcul: true
-   id: a02
    titre: Partie 2 — Une proportion
    transition: 'Tu sais convertir. Deuxième notion : calculer la part d’un groupe.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Une proportion est la part d’un groupe qui a une caractéristique.
    -   type: paragraphe
        texte: On l’écrit en décimal ou en pourcentage.
    -   type: paragraphe
        texte: 'À retenir : Proportion = partie ÷ total. Partie = total × proportion.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Repère la partie et le total.
        - Divise la partie par le total.
        - Écris en % si demandé (× 100).
        - 'Dans l’autre sens : partie = total × proportion.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Ce que dit une proportion
    -   type: liste
        elements:
        - '12 juments sur 30 chevaux : 12 ÷ 30 = 0,4.'
        - Cela veut dire 40 juments pour 100 chevaux.
    -   type: paragraphe
        texte: 2. Dans l’autre sens
    -   type: liste
        elements:
        - 'Si 40 % des 50 chevaux sont des juments : 50 × 0,4 = 20 juments.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée.
    questions:
    -   id: q01
        type: nombre
        enonce: 'Série A — 12 juments sur 30 chevaux : proportion en % ?'
        unite: '%'
        aide: 12 ÷ 30 × 100.
        calcul: true
    -   id: q02
        type: nombre
        enonce: '9 poneys sur 36 équidés : proportion en % ?'
        unite: '%'
        aide: 9 ÷ 36 × 100.
        calcul: true
    -   id: q03
        type: nombre
        enonce: '21 réussites sur 28 : proportion en % ?'
        unite: '%'
        aide: 21 ÷ 28 × 100.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Série B — 40 % de 50 chevaux sont des juments. Combien ?
        aide: 50 × 0,4.
        calcul: true
    -   id: q05
        type: nombre
        enonce: 15 % des 60 boxes sont libres. Combien ?
        aide: 60 × 0,15.
        calcul: true
    -   id: q06
        type: nombre
        enonce: 2/3 des 45 chevaux sortent au pré. Combien ?
        aide: 45 ÷ 3 × 2.
        calcul: true
-   id: a03
    titre: Partie 3 — La proportion d’une proportion
    transition: 'Dernière notion : une part à l’intérieur d’une part.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: 'Parfois, on prend une part d’un groupe qui est déjà une part : « la moitié des juments sont pleines ».'
    -   type: paragraphe
        texte: Pour avoir la part du total, on multiplie les deux proportions.
    -   type: paragraphe
        texte: 'À retenir : Proportion d’une proportion = produit des proportions.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Écris les deux proportions en décimal.
        - Multiplie-les.
        - Écris le résultat en %.
        - 'Pour un nombre : total × le produit.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Avec des nombres
    -   type: liste
        elements:
        - 'Écurie de 100 chevaux, 40 % de juments : 40 juments.'
        - 'La moitié des juments sont pleines : 20, soit 20 % de l’écurie.'
    -   type: paragraphe
        texte: 2. Pourquoi multiplier
    -   type: liste
        elements:
        - '0,4 × 0,5 = 0,2 : on prend la moitié de 40 %.'
        - 'Additionner (0,4 + 0,5) donnerait 90 % : absurde.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — 40 % de juments, et la moitié sont pleines. % de l’écurie ?
        unite: '%'
        aide: 0,4 × 0,5.
        calcul: true
    -   id: q02
        type: nombre
        enonce: 50 % de chevaux de selle, dont 30 % de juments. % de l’écurie ?
        unite: '%'
        aide: 0,5 × 0,3.
        calcul: true
    -   id: q03
        type: nombre
        enonce: 80 % des élèves montent, dont 25 % en compétition. % du total ?
        unite: '%'
        aide: 0,8 × 0,25.
        calcul: true
    -   id: q04
        type: nombre
        enonce: 3/4 des chevaux sont ferrés, dont 2/3 des quatre pieds. % du total (au dixième) ?
        unite: '%'
        aide: 0,75 × 2/3.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Série B — Écurie de 60 chevaux, 40 % de juments, la moitié pleines. Combien de juments pleines ?
        aide: 60 × 0,2.
        calcul: true
    -   id: q06
        type: nombre
        enonce: 'Club de 120 cavaliers : 75 % de filles, dont 40 % font du CSO. Combien de filles en CSO ?'
        aide: 120 × 0,75 × 0,4.
        calcul: true
    -   id: q07
        type: qcm
        enonce: Un élève additionne 40 % + 50 % = 90 %. A-t-il raison ?
        choix:
        -   id: a
            texte: Oui
        -   id: b
            texte: 'Non, il faut multiplier : 20 %'
        aide: On prend la moitié de 40 %.
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: Écris 2/5 en %.
        unite: '%'
        calcul: true
    -   id: q02
        type: nombre
        enonce: Écris 0,045 en %.
        unite: '%'
        calcul: true
    -   id: q03
        type: nombre
        enonce: '27 sur 45 : proportion en % ?'
        unite: '%'
        calcul: true
    -   id: q04
        type: nombre
        enonce: '20 % des 30 % : % du total ?'
        unite: '%'
        calcul: true
retenir:
- 'Fraction → décimal : a ÷ b. Décimal → % : × 100.'
- Proportion = partie ÷ total.
- Proportion de proportion = produit des deux proportions (0,5 × 0,4 = 0,2 = 20 %).
