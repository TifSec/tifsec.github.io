titre: 'Séance 2 : Fractions et pourcentages au service de l’écurie'
themes:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Comment passer entre fraction, nombre décimal et pourcentage pour calculer une proportion ?
competences_bo:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
        - 3/4 = 0,75 = 75 % ; une proportion = partie ÷ tout.
        - 'Appliquer un pourcentage : × t/100 ; proportion d’une proportion : produit.'
    competences:
        - Convertir fraction, décimal, pourcentage.
        - Calculer une proportion de proportion.
pourquoi:
    - En S01, tu as revu les automatismes.
    - 'Les proportions sont partout : chevaux vaccinés, part du budget, taux de réussite.'
activites:
    -   id: a01
        titre: Convertir
        consigne: Tu vas convertir trois fractions en nombres décimaux et en pourcentages. On attend les conversions.
        contenu:
            -   type: liste
                elements:
                    - 'Automatisme : 1/4 = … % ; 1/5 = … %.'
            -   type: etapes
                elements:
                    - 'Lis l’exemple : 3/4.'
                    - 'Écriture décimale : 3 ÷ 4 = 0,75.'
                    - 'Pourcentage : 0,75 × 100 = 75 %.'
                    - 'Dans l’autre sens : 40 % = 40 ÷ 100 = 0,4.'
                    - 'À toi : complète le tableau de conversions.'
                    - 'Pourquoi convertir ? Une fiche donne 3/5, une autre 60 % : il faut comparer.'
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 3/5 = 0,6 = …… %.
                        - ''
                    -   - Pour passer d’un décimal à un pourcentage, on multiplie par …… .
                        - ''
                aide: 'Relis l’exemple 3/4 = 0,75 = 75 % : 3/5 se calcule de la même façon. Pour passer d’un décimal à un pourcentage, par combien multiplie-t-on ?'
            -   id: q02
                type: tableau
                enonce: Complète.
                colonnes:
                    - Fraction
                    - Décimal / %
                lignes:
                    -   - 3/5
                        - ''
                    -   - 7/20
                        - ''
                    -   - 1/8
                        - ''
                aide: 'Pour chaque fraction : numérateur ÷ dénominateur à la calculatrice, puis × 100 pour le pourcentage.'
    -   id: a02
        titre: Une proportion
        transition: Tu sais convertir. Calcule une proportion réelle.
        consigne: Tu vas calculer et comparer la proportion de juments pleines de deux élevages. On attend le taux et la comparaison.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : 9 poulains sur 12 sont des femelles.'
                    - Proportion = partie ÷ total = 9 ÷ 12 = 0,75.
                    - 0,75 = 75 %.
                    - 'À toi : dans un élevage de 40 juments, 28 sont pleines. Calcule la proportion en %.'
                    - Pourquoi un % ? On compare avec un autre élevage de taille différente.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Une proportion = partie ÷ …… .
                        - ''
                    -   - On compare des proportions plutôt que des …… .
                        - ''
                aide: Proportion = partie ÷ quoi ? Et pour comparer deux élevages de tailles différentes, compare-t-on les nombres ou les… ?
            -   id: q02
                type: nombre
                enonce: Proportion de juments pleines ?
                unite: '%'
                aide: 'Comme l’exemple des 9 poulains sur 12 : juments pleines ÷ total des juments, puis × 100.'
            -   id: q03
                type: texte
                enonce: Un autre élevage a 18 juments pleines sur 24. Lequel a le meilleur taux ?
                aide: Calcule le pourcentage de l’autre élevage (18 ÷ 24) et compare-le au tien.
    -   id: a03
        titre: Proportion de proportion
        transition: Tu sais calculer une proportion. Et une proportion d’une partie ?
        consigne: Tu vas calculer la proportion de juments ayant un poulain vivant, à partir de deux taux. On attend la proportion et le nombre de poulains.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : 50 % des chevaux sortent au pré, et parmi eux 60 % portent une couverture.'
                    - 'On multiplie les proportions : 0,5 × 0,6 = 0,3.'
                    - Donc 30 % de tous les chevaux sont au pré avec une couverture.
                    - 'Sur 20 chevaux : 20 × 0,3 = 6 chevaux.'
                    - 'À toi : parmi les 70 % de juments pleines, 80 % donnent un poulain vivant. Calcule la proportion de juments qui ont un poulain vivant.'
                    - Pourquoi multiplier ? On prend 80 % d’une partie qui est déjà 70 % du tout.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Proportion d’une proportion : on …… les deux proportions.'
                        - ''
                    -   - 70 % de 80 % = …… %.
                        - ''
                aide: 'Relis l’exemple : 50 % puis 60 % de ceux-là donnent 0,5 × 0,6. Quelle opération ? Applique-la à 0,7 et 0,8.'
            -   id: q02
                type: nombre
                enonce: Quelle proportion des juments a un poulain vivant ?
                unite: '%'
                aide: Multiplie les deux proportions de « À toi » écrites en décimaux, puis écris le résultat en %.
            -   id: q03
                type: nombre
                enonce: Combien de poulains vivants pour 40 juments ?
                unite: poulains
                aide: 'Applique la proportion trouvée aux 40 juments : 40 × la proportion décimale.'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: 40 % des chevaux sortent au pré, dont la moitié la nuit.
        questions:
            -   id: q01
                type: texte
                enonce: Quel % sort la nuit ?
                aide: '« Dont la moitié » : prends la moitié des 40 %, c’est-à-dire multiplie 0,4 par 0,5.'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu maîtrises les proportions. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment passer entre fraction, décimal et pourcentage pour calculer une proportion ?'
                aide: Dis comment convertir, calculer une proportion et une proportion de proportion.
retenir:
    - Fraction = décimal = %.
    - Proportion de proportion = produit.
sources:
