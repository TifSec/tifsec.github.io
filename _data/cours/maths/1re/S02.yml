titre: Comprendre les fractions et les pourcentages
theme: Mathématiques — Comprendre les fractions et les pourcentages
problematique: Comprendre les fractions et les pourcentages
pourquoi: "Objectif de cette séance : Comprendre ce que représente une fraction simple."
application: Pour cet exercice, une entreprise hippique commande du matériel pour un montant total de 260 €.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Comprendre ce que représente une fraction simple.
        - Comprendre le lien entre fraction, proportion et pourcentage.
        - Calculer des pourcentages simples mentalement.
        - Calculer un pourcentage d'une quantité.
        - Interpréter un pourcentage dans une situation concrète.
    competences:
        - Reconnaître rapidement 1/2, 1/4 et 3/4 d'une quantité.
        - Calculer facilement 10 %, 50 % et 25 %.
        - Déterminer la proportion représentée par une partie d'un ensemble.
        - Utiliser la calculatrice lorsque le calcul devient moins simple.
        - Présenter les étapes de votre raisonnement.
activites:
    - id: a03
      titre: Le réflexe à conserver
      contenu:
          - type: paragraphe
            texte: Ne cherchez pas immédiatement une touche sur la calculatrice.
          - type: paragraphe
            texte: Commencez par vous demander si vous connaissez une manière simple de faire le calcul.
          - type: paragraphe
            texte: "Et n'oubliez pas : une démarche expliquée est plus importante qu'un résultat donné seul."
      questions: []
    - id: a04
      titre: "1. Échauffement : retrouver les bons réflexes"
      contenu:
          - type: paragraphe
            texte: Calculatrice interdite.
          - type: paragraphe
            texte: Effectuez mentalement les calculs suivants.
          - type: paragraphe
            texte: Lorsque vous utilisez une astuce, notez-la.
      questions:
          - id: q01
            type: texte
            enonce: 19 + 8 = ..........
            suite: []
          - id: q02
            type: texte
            enonce: 42 - 19 = ..........
            suite: []
          - id: q03
            type: texte
            enonce: 15 × 6 = ..........
            suite: []
          - id: q04
            type: texte
            enonce: 84 ÷ 7 = ..........
            suite: []
          - id: q05
            type: texte
            enonce: 25 + 25 = ..........
            suite: []
          - id: q06
            type: texte
            enonce: 50 ÷ 2 = ..........
            suite: []
    - id: a05
      titre: 2. Une fraction, qu'est-ce que cela représente ?
      contenu:
          - type: paragraphe
            texte: Une fraction permet de représenter une ou plusieurs parts d'un ensemble.
          - type: paragraphe
            texte: "Par exemple :"
          - type: liste
            elements:
                - "1/2 signifie une part sur deux parts égales : c'est la moitié ;"
                - "1/4 signifie une part sur quatre parts égales : c'est le quart ;"
                - 3/4 signifie trois parts sur quatre parts égales.
          - type: paragraphe
            texte: Calculatrice interdite.
          - type: paragraphe
            texte: Essayez d'utiliser des divisions simples plutôt qu'une formule.
      questions:
          - id: q01
            type: texte
            enonce: Quelle est la moitié de 20 ?
            suite: []
          - id: q02
            type: texte
            enonce: Quelle est la moitié de 50 ?
            suite: []
          - id: q03
            type: texte
            enonce: Quel est le quart de 20 ?
            suite: []
          - id: q04
            type: texte
            enonce: Quel est le quart de 100 ?
            suite: []
          - id: q05
            type: texte
            enonce: Quels sont les trois quarts de 20 ?
            suite: []
          - id: q06
            type: texte
            enonce: Quels sont les trois quarts de 100 ?
            suite: []
    - id: a06
      titre: 3. Des fractions aux pourcentages
      contenu:
          - type: paragraphe
            texte: Le mot pourcentage signifie « pour 100 ».
          - type: paragraphe
            texte: "Ainsi :"
          - type: liste
            elements:
                - 50 % signifie 50 sur 100 ;
                - 25 % signifie 25 sur 100 ;
                - 10 % signifie 10 sur 100.
          - type: paragraphe
            texte: "Certaines fractions correspondent à des pourcentages faciles à retenir :"
          - type: tableau
            colonnes:
                - Fraction
                - Signification
                - Pourcentage
            lignes:
                - - 1/2
                  - la moitié
                  - 50 %
                - - 1/4
                  - le quart
                  - 25 %
                - - 3/4
                  - trois quarts
                  - 75 %
      questions: []
    - id: a07
      titre: 4. Calculer des pourcentages sans calculatrice
      contenu:
          - type: paragraphe
            texte: Calculatrice interdite.
          - type: paragraphe
            texte: Utilisez les astuces données avant de chercher une formule.
      questions: []
    - id: a08
      titre: Trois astuces à retenir
      contenu:
          - type: liste
            elements:
                - 50 % = prendre la moitié.
                - 25 % = prendre le quart.
                - 10 % = diviser par 10.
          - type: etapes
            elements:
                - 50 % de 80 = ..........
                - 50 % de 120 = ..........
                - 25 % de 80 = ..........
                - 25 % de 200 = ..........
                - 10 % de 70 = ..........
                - 10 % de 350 = ..........
      questions: []
    - id: a09
      titre: 5. Combiner les astuces
      contenu:
          - type: paragraphe
            texte: Calculatrice interdite.
          - type: paragraphe
            texte: Les pourcentages suivants peuvent être obtenus en combinant les méthodes précédentes.
          - type: paragraphe
            texte: Montrez votre raisonnement.
      questions:
          - id: q01
            type: texte
            enonce: 20 % de 60 = ..........
            suite: []
          - id: q02
            type: texte
            enonce: 30 % de 50 = ..........
            suite: []
          - id: q03
            type: texte
            enonce: 75 % de 40 = ..........
            suite: []
          - id: q04
            type: texte
            enonce: 5 % de 200 = ..........
            suite: []
    - id: a10
      titre: 6. Quelle proportion représentent-ils ?
      contenu:
          - type: paragraphe
            texte: "Une structure accueille 20 équidés :"
          - type: liste
            elements:
                - 12 chevaux ;
                - 5 poneys ;
                - 3 ânes.
          - type: paragraphe
            texte: Calculatrice autorisée.
          - type: paragraphe
            texte: Pour chaque question, écrivez le calcul avant le résultat.
          - type: paragraphe
            texte: On souhaite connaître la proportion de chevaux dans l'effectif.
      questions:
          - id: q01
            type: texte
            enonce: Combien y a-t-il de chevaux ?
            suite: []
          - id: q02
            type: texte
            enonce: Combien y a-t-il d'équidés au total ?
            suite: []
          - id: q03
            type: texte
            enonce: Effectuez le calcul 12 ÷ 20. Quel résultat obtenez-vous ?
            suite: []
          - id: q04
            type: texte
            enonce: Multipliez ce résultat par 100.
            suite: []
          - id: q05
            type: texte
            enonce: Quel pourcentage de l'effectif représentent donc les chevaux ?
            suite: []
    - id: a11
      titre: Calculer une proportion
      contenu:
          - type: paragraphe
            texte: "Pour connaître la proportion représentée par une partie d'un ensemble :"
          - type: paragraphe
            texte: proportion = partie ÷ total
          - type: paragraphe
            texte: "Pour l'exprimer en pourcentage :"
          - type: paragraphe
            texte: pourcentage = proportion × 100
      questions: []
    - id: a12
      titre: 7. À vous de faire
      contenu:
          - type: paragraphe
            texte: Calculatrice autorisée.
          - type: paragraphe
            texte: Montrez les étapes de votre calcul.
          - type: paragraphe
            texte: Reprenez les 20 équidés de l'exercice précédent.
      questions:
          - id: q01
            type: texte
            enonce: Quelle proportion de l'effectif représentent les 5 poneys ?
            suite: []
          - id: q02
            type: texte
            enonce: Exprimez la proportion de poneys en pourcentage.
            suite: []
          - id: q03
            type: texte
            enonce: Quelle proportion représentent les 3 ânes ?
            suite: []
          - id: q04
            type: texte
            enonce: Exprimez la proportion d'ânes en pourcentage.
            suite: []
          - id: q05
            type: texte
            enonce: Additionnez les pourcentages de chevaux, poneys et ânes. Que constatez-vous ?
            suite: []
    - id: a13
      titre: 8. Situation professionnelle – Une remise
      contenu:
          - type: paragraphe
            texte: Pour cet exercice, une entreprise hippique commande du matériel pour un montant total de 260 €.
          - type: paragraphe
            texte: Le fournisseur accorde une remise de 10 %.
          - type: paragraphe
            texte: Calculatrice autorisée, mais elle n'est pas nécessaire.
          - type: paragraphe
            texte: Essayez d'abord de déterminer mentalement 10 % de 260 €.
          - type: paragraphe
            texte: Écrivez ensuite votre démarche complète.
      questions:
          - id: q01
            type: texte
            enonce: Quel est le montant de la remise ?
            suite: []
          - id: q02
            type: texte
            enonce: Quel montant l'entreprise devra-t-elle finalement payer ?
            suite: []
          - id: q03
            type: texte
            enonce: Expliquez pourquoi il faut soustraire la remise au prix initial.
            suite: []
    - id: a14
      titre: 9. Petit défi
      contenu:
          - type: paragraphe
            texte: Le prix d'une prestation est de 80 €.
          - type: paragraphe
            texte: Ce prix augmente de 15 %.
          - type: paragraphe
            texte: Calculatrice autorisée, mais essayez d'abord mentalement.
          - type: paragraphe
            texte: Vous pouvez décomposer 15 % en pourcentages plus faciles.
      questions:
          - id: q01
            type: texte
            enonce: Calculez 10 % de 80 €.
            suite: []
          - id: q02
            type: texte
            enonce: Calculez 5 % de 80 €.
            suite: []
          - id: q03
            type: texte
            enonce: Déduisez-en 15 % de 80 €.
            suite: []
          - id: q04
            type: texte
            enonce: Quel est le montant de l'augmentation ?
            suite: []
          - id: q05
            type: texte
            enonce: Quel est le nouveau prix ?
            suite: []
    - id: a15
      titre: 10. Bilan
      contenu:
          - type: paragraphe
            texte: "Complétez sans regarder les exercices précédents :"
      questions:
          - id: q01
            type: texte
            enonce: 50 % d'une quantité correspond à ................................
            suite: []
          - id: q02
            type: texte
            enonce: 25 % d'une quantité correspond à ................................
            suite: []
          - id: q03
            type: texte
            enonce: 10 % d'une quantité peut être obtenu en ................................
            suite: []
          - id: q04
            type: texte
            enonce: Pour calculer une proportion, je ................................
            suite: []
          - id: q05
            type: texte
            enonce: Une remise fait ................................ le prix.
            suite: []
          - id: q06
            type: texte
            enonce: Une augmentation fait ................................ le prix.
            suite: []
    - id: a16
      titre: À retenir
      contenu:
          - type: liste
            elements:
                - 50 % = 1/2 = la moitié.
                - 25 % = 1/4 = le quart.
                - 75 % = 3/4 = trois quarts.
                - 10 % d'une quantité = cette quantité ÷ 10.
                - On peut souvent combiner des pourcentages simples pour calculer mentalement.
                - Proportion = partie ÷ total.
                - Pourcentage = proportion × 100.
                - Une remise diminue une valeur ; une augmentation augmente une valeur.
                - Le calcul donne un résultat ; c'est à vous de l'interpréter pour répondre au problème.
      questions: []
    - id: a17
      titre: Sources
      contenu:
          - type: liste
            elements:
                - "Ministère de l'Agriculture – ChloroFil : Bac professionnel – Conduite et gestion de l'entreprise hippique ."
                - "Ministère de l'Agriculture – ChloroFil : Tronc commun du baccalauréat professionnel agricole ."
          - type: lien
