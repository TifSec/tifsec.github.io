version_papier:
    titre: Fiche papier — Comprendre fractions et pourcentages
    introduction: Une fraction et un pourcentage décrivent une part d’un tout. Comme une recette, il faut savoir quelle quantité représente le tout avant de calculer une part.
    sections:
        - titre: 1. Lire une fraction
          blocs:
              - type: paragraphe
                texte: Dans 3/4, le 4 partage le tout en quatre parts égales. Le 3 indique qu’on prend trois de ces parts. Pour parler en pourcentage, on compare la part à 100.
        - titre: 2. Transformer une fraction en pourcentage
          blocs:
              - type: paragraphe
                texte: Pour transformer une fraction en nombre décimal, on divise le numérateur par le dénominateur. Puis on multiplie par 100 pour obtenir un pourcentage.
              - type: etapes
                elements:
                    - 1/2 = 1 ÷ 2 = 0,5 = 50 %.
                    - 1/4 = 1 ÷ 4 = 0,25 = 25 %.
                    - 3/4 = 3 ÷ 4 = 0,75 = 75 %.
        - titre: 3. Calculer un pourcentage
          blocs:
              - type: paragraphe
                texte: Pour trouver 15 % d’une quantité, on peut calculer 10 % puis 5 %. C’est souvent plus simple qu’une seule opération.
              - type: etapes
                elements:
                    - 10 % de 240 = 240 ÷ 10 = 24.
                    - 5 % de 240 = la moitié de 24 = 12.
                    - 15 % de 240 = 24 + 12 = 36.
                    - "Vérification : 0,15 × 240 = 36."
        - titre: 4. Une remise et le prix final
          blocs:
              - type: paragraphe
                texte: Une remise enlève une partie du prix. Après une remise de 15 %, il reste 85 % du prix de départ.
          questions:
              - Calcule la réduction de la situation du cours.
              - Calcule le prix final en retirant la réduction.
              - Refais le calcul avec le coefficient multiplicateur et compare.
        - titre: Je m’entraîne — même méthode que dans le cours
          blocs:
              - type: paragraphe
                texte: Reprends les étapes de l’exemple juste au-dessus. Écris une ligne par étape et garde les unités.
          questions:
              - Calcule 10 %, 5 % et 15 % de 240 €.
              - Écris 3/4 en décimal puis en pourcentage.
              - Une remise est de 15 %. Quel pourcentage du prix reste à payer ?
        - titre: Je transfère — une situation nouvelle
          blocs:
              - type: paragraphe
                texte: Cette fois, les nombres ou le contexte changent. Commence par identifier ce que l’on cherche, puis choisis la méthode qui convient.
          questions:
              - Un produit coûte 86 €. Il baisse de 20 %, puis le nouveau prix augmente de 10 %. Calcule les deux évolutions dans l’ordre.
              - Explique pourquoi +10 % après −20 % ne ramène pas automatiquement au prix initial.
