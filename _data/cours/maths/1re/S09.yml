titre: 'Séance 9 : Regrouper en classes et lire un histogramme'
themes:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
problematique: Comment regrouper une série continue et estimer ses indicateurs ?
competences_bo:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
objectifs:
    connaissances:
        - Regrouper en classes [a ; b[ ; centre de classe = (a + b) ÷ 2.
        - Moyenne estimée = Σ (centre × effectif) ÷ effectif total.
    competences:
        - Construire un tableau par classes.
        - Estimer une moyenne à partir des classes.
pourquoi:
    - En S08, tu avais toutes les valeurs.
    - 'Souvent, une publication ne donne que des classes : il faut estimer.'
activites:
    -   id: a01
        titre: Les centres de classes
        consigne: Tu vas calculer le centre de chaque classe de poids (document 1). On attend les quatre centres.
        contenu:
            -   type: titre
                texte: Exemple
            -   type: liste
                elements:
                    - 'Automatisme : (400 + 450) ÷ 2.'
            -   type: tableau
                titre: Document 1 — Poids de 50 chevaux (fictif)
                colonnes:
                    - Classe (kg)
                    - '[400 ; 450['
                    - '[450 ; 500['
                    - '[500 ; 550['
                    - '[550 ; 600['
                lignes:
                    -   - Effectif
                        - '8'
                        - '17'
                        - '15'
                        - '10'
            -   type: etapes
                elements:
                    - Lis le tableau des poids de 50 chevaux (document 1).
                    - Calcule chaque centre.
            -   type: paragraphe
                texte: Pourquoi le centre ? On remplace toutes les valeurs d’une classe par sa valeur du milieu.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Centre d’une classe [a ; b[ = (a + b) ÷ …… .
                        - ''
                    -   - On remplace les valeurs d’une classe par son …… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: tableau
                enonce: Centres de classes.
                colonnes:
                    - Classe (kg)
                    - Centre
                lignes:
                    -   - '[400 ; 450['
                        - ''
                    -   - '[450 ; 500['
                        - ''
                    -   - '[500 ; 550['
                        - ''
                    -   - '[550 ; 600['
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: La moyenne estimée
        transition: Les centres sont prêts. Estime la moyenne.
        consigne: Tu vas estimer la moyenne des poids à partir des classes. On attend la somme des produits et la moyenne.
        contenu:
            -   type: etapes
                elements:
                    - Calcule Σ centre × effectif.
                    - Divise par 50.
            -   type: paragraphe
                texte: Pourquoi « estimée » ? On ne connaît pas les vraies valeurs dans chaque classe.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Moyenne estimée = Σ (centre × effectif) ÷ effectif …… .
                        - ''
                    -   - Elle est dite « estimée » car on ne connaît pas les vraies …… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: nombre
                enonce: Somme des produits centre × effectif ?
                unite: kg
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q03
                type: nombre
                enonce: Moyenne estimée ?
                unite: kg
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a03
        titre: L’histogramme et la classe modale
        transition: Tu as une moyenne estimée. Regarde la forme.
        consigne: Tu vas tracer l’histogramme des poids et repérer la classe modale. On attend la classe et la forme.
        contenu:
            -   type: etapes
                elements:
                    - Trace l’histogramme au tableur.
                    - Repère la classe modale.
            -   type: paragraphe
                texte: Pourquoi l’histogramme ? Il montre la forme de la répartition.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - La classe de plus grand effectif est la classe …… .
                        - ''
                    -   - L’histogramme montre la …… de la répartition.
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: texte
                enonce: Quelle est la classe modale ? Décris la forme de l’histogramme.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La vraie moyenne est 498 kg.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi l’estimation diffère-t-elle ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais exploiter des classes. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment regrouper une série continue et estimer ses indicateurs ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Centre = (a + b) ÷ 2.
    - Moyenne estimée.
