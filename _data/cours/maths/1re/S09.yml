titre: 'Séance 9 : Regrouper en classes et lire un histogramme'
themes:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
problematique: Comment regrouper une série continue et estimer ses indicateurs ?
competences_bo:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
objectifs:
    connaissances:
        - Regrouper en classes [a ; b[ ; centre de classe = (a + b) ÷ 2.
        - Moyenne estimée = Σ (centre × effectif) ÷ effectif total.
    competences:
        - Construire un tableau par classes.
        - Estimer une moyenne à partir des classes.
pourquoi:
    - En S08, tu avais toutes les valeurs.
    - 'Souvent, une publication ne donne que des classes : il faut estimer.'
activites:
    -   id: a01
        titre: Les centres de classes
        consigne: Tu vas calculer le centre de chaque classe de poids (document 1). On attend les quatre centres.
        contenu:
            -   type: liste
                elements:
                    - 'Automatisme : (400 + 450) ÷ 2.'
            -   type: tableau
                titre: Document 1 — Poids de 50 chevaux (fictif)
                colonnes:
                    - Classe (kg)
                    - '[400 ; 450['
                    - '[450 ; 500['
                    - '[500 ; 550['
                    - '[550 ; 600['
                lignes:
                    -   - Effectif
                        - '8'
                        - '17'
                        - '15'
                        - '10'
            -   type: etapes
                elements:
                    - 'Lis l’exemple : classe [300 ; 350[.'
                    - Centre = (300 + 350) ÷ 2 = 650 ÷ 2 = 325.
                    - 'À toi : lis le tableau des poids de 50 chevaux (document 1) et calcule le centre de chaque classe.'
                    - Pourquoi le centre ? On remplace toutes les valeurs d’une classe par sa valeur du milieu.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Centre d’une classe [a ; b[ = (a + b) ÷ …… .
                        - ''
                    -   - On remplace les valeurs d’une classe par son …… .
                        - ''
                aide: 'Relis l’exemple [300 ; 350[ : on additionne les bornes puis on divise par… ? Et ensuite, par quoi remplace-t-on les valeurs de la classe ?'
            -   id: q02
                type: tableau
                enonce: Centres de classes.
                colonnes:
                    - Classe (kg)
                    - Centre
                lignes:
                    -   - '[400 ; 450['
                        - ''
                    -   - '[450 ; 500['
                        - ''
                    -   - '[500 ; 550['
                        - ''
                    -   - '[550 ; 600['
                        - ''
                aide: 'Pour chaque classe du document 1 : (borne gauche + borne droite) ÷ 2.'
    -   id: a02
        titre: La moyenne estimée
        transition: Les centres sont prêts. Estime la moyenne.
        consigne: Tu vas estimer la moyenne des poids à partir des classes. On attend la somme des produits et la moyenne.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : classes de centres 325 et 375, effectifs 4 et 6.'
                    - 'Somme des produits : 325 × 4 + 375 × 6 = 1 300 + 2 250 = 3 550.'
                    - 'Effectif total : 4 + 6 = 10.'
                    - 'Moyenne estimée : 3 550 ÷ 10 = 355 kg.'
                    - 'À toi : calcule Σ centre × effectif pour les 50 chevaux, puis divise par 50.'
                    - Pourquoi « estimée » ? On ne connaît pas les vraies valeurs dans chaque classe.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Moyenne estimée = Σ (centre × effectif) ÷ effectif …… .
                        - ''
                    -   - Elle est dite « estimée » car on ne connaît pas les vraies …… .
                        - ''
                aide: 'Moyenne estimée = somme des centre × effectif ÷ effectif… ? Et pourquoi « estimée » : que ne connaît-on pas ?'
            -   id: q02
                type: nombre
                enonce: Somme des produits centre × effectif ?
                unite: kg
                aide: Pour chaque classe, multiplie son centre par son effectif (document 1), puis additionne les 4 produits.
            -   id: q03
                type: nombre
                enonce: Moyenne estimée ?
                unite: kg
                aide: Divise la somme trouvée par l’effectif total (50 chevaux).
    -   id: a03
        titre: L’histogramme et la classe modale
        transition: Tu as une moyenne estimée. Regarde la forme.
        consigne: Tu vas tracer l’histogramme des poids et repérer la classe modale. On attend la classe et la forme.
        contenu:
            -   type: image
                url: /assets/images/graphiques/maths-1re-s09-histogramme.svg
                alternative: Histogramme des poids de 50 chevaux.
                legende: Histogramme des poids de 50 chevaux.
            -   type: titre
                texte: Comment faire ce graphique
            -   type: etapes
                elements:
                    - 'Au tableur : saisis les centres des classes et les effectifs, Insertion > Diagramme > Colonne, puis mets l’espacement entre colonnes à 0 %.'
            -   type: titre
                texte: Comment le lire
            -   type: liste
                elements:
                    - Chaque rectangle est une classe de 50 kg ; sa hauteur est l’effectif.
            -   type: titre
                texte: Comment le comprendre
            -   type: liste
                elements:
                    - La classe modale est la plus haute ; la forme montre si la répartition est centrée ou dissymétrique.
            -   type: etapes
                elements:
                    - 'Lis l’exemple : effectifs 4, 6, 3.'
                    - 'La classe modale est celle de plus grand effectif : la 2e (6).'
                    - 'Au tableur : saisis les classes et les effectifs, Insertion > Diagramme > Colonne, puis mets l’espacement entre colonnes à 0 %.'
                    - 'À toi : trace l’histogramme au tableur et repère la classe modale.'
                    - Pourquoi l’histogramme ? Il montre la forme de la répartition.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - La classe de plus grand effectif est la classe …… .
                        - ''
                    -   - L’histogramme montre la …… de la répartition.
                        - ''
                aide: La classe la plus haute a un nom (comme le mode). Et l’histogramme montre la… de la répartition.
            -   id: q02
                type: texte
                enonce: Quelle est la classe modale ? Décris la forme de l’histogramme.
                aide: 'Cherche le plus grand effectif du document 1, puis décris l’histogramme : où est le sommet, est-il symétrique ?'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La vraie moyenne est 498 kg.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi l’estimation diffère-t-elle ?
                aide: Dans une classe, les chevaux ne pèsent pas tous la valeur du centre. Où sont-ils peut-être placés ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais exploiter des classes. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment regrouper une série continue et estimer ses indicateurs ?'
                aide: Dis comment calculer les centres, la moyenne estimée et lire l’histogramme.
retenir:
    - Centre = (a + b) ÷ 2.
    - Moyenne estimée.
