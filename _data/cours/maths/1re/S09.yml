titre: 'Séance 9 : Séries en classes : centres, moyenne estimée, histogramme'
themes:
- MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
problematique: Comment calculer une moyenne quand les valeurs sont regroupées en classes, et lire un histogramme ?
competences_bo:
- MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
objectifs:
    connaissances:
    - Centre de [a ; b[ = (a + b) ÷ 2.
    - Moyenne estimée = somme (centre × effectif) ÷ effectif total.
    - 'Classe modale : celle du plus grand effectif.'
    competences:
    - Calculer les centres des classes.
    - Calculer une moyenne estimée.
    - Lire un histogramme et trouver la classe modale.
pourquoi:
- 'Aujourd’hui, trois notions : les centres de classes, la moyenne estimée, l’histogramme.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — Le centre d’une classe
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Quand une série est donnée en classes, on ne connaît plus les valeurs exactes.
    -   type: paragraphe
        texte: 'Pour calculer, on remplace chaque classe par sa valeur du milieu : son centre.'
    -   type: paragraphe
        texte: 'À retenir : Centre de [a ; b[ = (a + b) ÷ 2.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Repère les deux bornes de la classe.
        - Additionne-les.
        - Divise par 2.
        - 'Contrôle : le centre est pile au milieu de la classe.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi le milieu
    -   type: liste
        elements:
        - Dans [300 ; 350[, les valeurs sont quelque part entre 300 et 350.
        - Le milieu, 325, est la meilleure valeur « moyenne » quand on ne sait pas où elles sont.
    -   type: paragraphe
        texte: 2. Pourquoi (a + b) ÷ 2
    -   type: liste
        elements:
        - C’est la moyenne des deux bornes.
        - '300 + 25 = 325 : on ajoute la moitié de l’amplitude (50 ÷ 2).'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Consommation mensuelle de foin de 20 chevaux :'
    -   type: tableau
        colonnes:
        - Consommation (kg/mois)
        - '[300 ; 350['
        - '[350 ; 400['
        - '[400 ; 450['
        - '[450 ; 500['
        lignes:
        -   - Effectif
            - '4'
            - '6'
            - '8'
            - '2'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Centre de [300 ; 350[ ?
        unite: kg
        aide: (300 + 350) ÷ 2.
    -   id: q02
        type: nombre
        enonce: Centre de [350 ; 400[ ?
        unite: kg
        aide: (350 + 400) ÷ 2.
    -   id: q03
        type: nombre
        enonce: Centre de [400 ; 450[ ?
        unite: kg
        aide: (400 + 450) ÷ 2.
    -   id: q04
        type: nombre
        enonce: Centre de [450 ; 500[ ?
        unite: kg
        aide: (450 + 500) ÷ 2.
    -   id: q05
        type: nombre
        enonce: Série B — Centre de [0 ; 15[ ?
        aide: (0 + 15) ÷ 2.
    -   id: q06
        type: nombre
        enonce: Centre de [1,2 ; 1,6[ ?
        aide: (1,2 + 1,6) ÷ 2.
-   id: a02
    titre: Partie 2 — La moyenne estimée
    transition: 'Tu as les centres. Deuxième notion : calculer la moyenne avec eux.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: On fait comme si toutes les valeurs d’une classe étaient égales au centre.
    -   type: paragraphe
        texte: On obtient une estimation de la moyenne, pas la valeur exacte.
    -   type: paragraphe
        texte: 'À retenir : Moyenne estimée = somme des (centre × effectif) ÷ effectif total.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Pour chaque classe, multiplie le centre par l’effectif.
        - Additionne tous ces produits.
        - Divise par l’effectif total (pas par le nombre de classes).
        - 'Contrôle : le résultat est entre le plus petit et le plus grand centre.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi centre × effectif
    -   type: liste
        elements:
        - '4 chevaux dans [300 ; 350[ : on compte chacun pour 325 kg.'
        - Ensemble, ils comptent 4 × 325 = 1 300 kg.
    -   type: paragraphe
        texte: 2. Pourquoi diviser par 20
    -   type: liste
        elements:
        - On partage le total entre les 20 chevaux, pas entre les 4 classes.
        - 'Diviser par 4 donnerait une « moyenne » de 2 000 kg : absurde.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Même tableau (20 chevaux).
    -   type: tableau
        colonnes:
        - Consommation (kg/mois)
        - '[300 ; 350['
        - '[350 ; 400['
        - '[400 ; 450['
        - '[450 ; 500['
        lignes:
        -   - Effectif
            - '4'
            - '6'
            - '8'
            - '2'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Centre × effectif pour [300 ; 350[ ?
        aide: 325 × 4.
    -   id: q02
        type: nombre
        enonce: Centre × effectif pour [350 ; 400[ ?
        aide: 375 × 6.
    -   id: q03
        type: nombre
        enonce: Centre × effectif pour [400 ; 450[ ?
        aide: 425 × 8.
    -   id: q04
        type: nombre
        enonce: Centre × effectif pour [450 ; 500[ ?
        aide: 475 × 2.
    -   id: q05
        type: nombre
        enonce: Somme des quatre produits ?
        aide: Additionne.
    -   id: q06
        type: nombre
        enonce: Série B — Moyenne estimée de la consommation ?
        unite: kg
        aide: 7 900 ÷ 20.
    -   id: q07
        type: qcm
        enonce: Pourquoi dit-on « estimée » ?
        choix:
        -   id: a
            texte: Parce qu’on a arrondi
        -   id: b
            texte: Parce qu’on a remplacé chaque valeur par le centre de sa classe
        aide: Connaît-on les vraies valeurs ?
-   id: a03
    titre: Partie 3 — L’histogramme et la classe modale
    transition: 'Dernière notion : lire une série en classes sur un graphique.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: 'Un histogramme représente une série en classes par des rectangles accolés : la base est la classe, la hauteur l’effectif.'
    -   type: paragraphe
        texte: La classe modale est la classe qui a le plus grand effectif.
    -   type: paragraphe
        texte: 'À retenir : Effectif d’une classe = hauteur de son rectangle. Classe modale = le plus haut rectangle.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - 'Comment le lire : repère la classe sur l’axe horizontal, monte au haut du rectangle, lis la hauteur à gauche.'
        - 'Classe modale : cherche le plus haut rectangle.'
        - 'Effectif total : additionne toutes les hauteurs.'
        - 'Fréquence : effectif ÷ total × 100.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Comment il est fait
    -   type: liste
        elements:
        - Un rectangle par classe, de la borne a à la borne b, de hauteur l’effectif.
        - Les rectangles se touchent car les classes se suivent.
    -   type: paragraphe
        texte: 2. Comment le comprendre
    -   type: liste
        elements:
        - La forme montre où se concentrent les valeurs.
        - Ici, la plupart des poneys sont entre 12 et 16 dm.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Hauteur au garrot des poneys du club :'
    -   type: image
        url: /assets/images/graphiques/maths-1re-s09-classique-poneys.svg
        alternative: 'Histogramme des hauteurs des poneys : [10 ; 12[ 3, [12 ; 14[ 7, [14 ; 16[ 9, [16 ; 18[ 4, [18 ; 20[ 2.'
        legende: 'Histogramme des hauteurs des poneys : [10 ; 12[ 3, [12 ; 14[ 7, [14 ; 16[ 9, [16 ; 18[ 4, [18 ; 20[ 2.'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Effectif de [12 ; 14[ ?
        aide: Hauteur du 2e rectangle.
    -   id: q02
        type: nombre
        enonce: Effectif de [18 ; 20[ ?
        aide: Hauteur du dernier rectangle.
    -   id: q03
        type: nombre
        enonce: Borne de gauche de la classe modale ?
        unite: dm
        aide: Plus haut rectangle.
    -   id: q04
        type: nombre
        enonce: Effectif total ?
        aide: Additionne les hauteurs.
    -   id: q05
        type: nombre
        enonce: Série B — Fréquence de la classe modale, en % ?
        unite: '%'
        aide: 9 ÷ 25 × 100.
    -   id: q06
        type: nombre
        enonce: Moyenne estimée des hauteurs ?
        unite: dm
        aide: Centres 11, 13, 15, 17, 19.
    -   id: q07
        type: nombre
        enonce: Combien de poneys mesurent 16 dm ou plus ?
        aide: Additionne les deux derniers rectangles.
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: Centre de [20 ; 30[ ?
    -   id: q02
        type: nombre
        enonce: 'Classes [0 ; 10[ : 2 ; [10 ; 20[ : 6 ; [20 ; 30[ : 2. Moyenne estimée ?'
    -   id: q03
        type: nombre
        enonce: 'Classes [100 ; 200[ : 5 ; [200 ; 300[ : 15. Moyenne estimée ?'
    -   id: q04
        type: nombre
        enonce: 'Poneys : fréquence de [10 ; 12[, en % ?'
        unite: '%'
retenir:
- Centre d’une classe [a ; b[ = (a + b) ÷ 2.
- Moyenne estimée = (c₁ × n₁ + c₂ × n₂ + …) ÷ effectif total.
- 'C’est une estimation : on fait comme si toutes les valeurs d’une classe valaient le centre.'
- 'Histogramme : hauteur = effectif ; classe modale = le plus haut rectangle.'
