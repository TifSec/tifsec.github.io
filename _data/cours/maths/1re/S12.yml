titre: 'Séance 12 : Tableau croisé : discipline et âge des cavaliers'
themes:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Comment lire et exploiter un tableau croisé d’effectifs ?
competences_bo:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
        - Un tableau croisé répartit une population selon deux caractères.
        - 'Fréquence conditionnelle : effectif d’une case ÷ total de sa ligne (ou de sa colonne).'
    competences:
        - Calculer des fréquences marginales et conditionnelles.
        - Interpréter un tableau croisé.
pourquoi:
    - Un centre équestre compte 200 licenciés.
    - Il veut savoir quelles disciplines attirent quelles tranches d’âge.
activites:
    -   id: a01
        titre: Lire le tableau
        consigne: Tu vas lire le tableau croisé des licenciés par âge et discipline (document 1). On attend un effectif et une fréquence.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: 'Le centre équestre veut connaître ses licenciés : leur âge et leur discipline. Un seul tableau donne les deux informations.'
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: 'Un tableau croisé (ou tableau à double entrée) répartit une population selon deux caractères : un en lignes, un en colonnes. Chaque case donne l’effectif qui a les deux caractères à la fois ; les totaux sont en marge.'
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Voir ensemble deux informations sur une même population.
                    - Calculer des fréquences pour comparer.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - On repère la ligne et la colonne qui correspondent à la question.
                    - La case à leur intersection donne l’effectif.
                    - 'Fréquence d’un groupe : total de sa ligne (ou colonne) ÷ total général.'
            -   type: paragraphe
                texte: 'À retenir : Fréquence = effectif ÷ effectif total.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Avec le document 1, combien d’adultes pratiquent le dressage ?
                    - Quelle fréquence des licenciés pratique le loisir ?
            -   type: liste
                elements:
                    - 'Automatisme : 50 ÷ 120 en % (arrondi).'
            -   type: tableau
                titre: Document 1 — Licenciés par âge et discipline (fictif)
                colonnes:
                    - ''
                    - CSO
                    - Dressage
                    - Loisir
                    - Total
                lignes:
                    -   - Moins de 18 ans
                        - '50'
                        - '20'
                        - '50'
                        - '120'
                    -   - 18 ans et plus
                        - '20'
                        - '20'
                        - '40'
                        - '80'
                    -   - Total
                        - '70'
                        - '40'
                        - '90'
                        - '200'
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : lis le tableau croisé (document 1) et réponds.'
                    - Pourquoi croiser ? On voit ensemble deux informations.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Un tableau croisé répartit une population selon …… caractères.
                        - ''
                    -   - Fréquence = effectif ÷ effectif …… .
                        - ''
                aide: Un tableau croisé classe les cavaliers selon combien de caractères (ici l’âge et la discipline) ? Et une fréquence se divise par l’effectif… ?
            -   id: q02
                type: nombre
                enonce: Combien de cavaliers de moins de 18 ans pratiquent le CSO ?
                unite: cavaliers
                aide: Cherche dans le document 1 la case au croisement de la ligne « Moins de 18 ans » et de la colonne « CSO ».
            -   id: q03
                type: nombre
                enonce: Quelle fréquence des licenciés a moins de 18 ans ?
                unite: '%'
                aide: Total de la ligne « Moins de 18 ans » ÷ total général.
    -   id: a02
        titre: Fréquences conditionnelles
        transition: Tu sais lire le tableau. Calcule « parmi ».
        consigne: Tu vas calculer deux fréquences conditionnelles à partir du tableau croisé. On attend les deux pourcentages.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Les jeunes font-ils plus de CSO que les adultes ? Et les cavaliers de CSO sont-ils surtout des jeunes ? Ce ne sont pas les mêmes questions.
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Une fréquence conditionnelle est une fréquence calculée à l’intérieur d’un sous-groupe (« parmi les… »).
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Comparer deux sous-groupes de tailles différentes.
                    - Répondre précisément à une question qui contient « parmi ».
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - 'On repère le sous-groupe après « parmi » : c’est le total de référence.'
                    - Si c’est une ligne, on divise par le total de la ligne ; si c’est une colonne, par le total de la colonne.
                    - On convertit en pourcentage.
            -   type: paragraphe
                texte: 'À retenir : Fréquence conditionnelle = case ÷ total du sous-groupe (ligne ou colonne).'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Parmi les adultes, quelle part fait du dressage ?
                    - Parmi les cavaliers de dressage, quelle part est adulte ?
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : calcule les deux parts demandées pour le CSO.'
                    - 'Pourquoi « parmi » ? Le total de référence change : ce n’est pas la même question.'
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - « Parmi » change le total de …… .
                        - ''
                    -   - Fréquence conditionnelle = case ÷ total de la …… .
                        - ''
                aide: 'Relis l’exemple : « parmi les adultes » change le total de… ? On divise la case par le total de la ligne ou de la colonne concernée.'
            -   id: q02
                type: nombre
                enonce: Parmi les moins de 18 ans, part en CSO (au dixième) ?
                unite: '%'
                aide: '« Parmi les moins de 18 ans » : la référence est le total de cette ligne. Case CSO ÷ total de la ligne.'
            -   id: q03
                type: nombre
                enonce: Parmi les cavaliers de CSO, part des moins de 18 ans (au dixième) ?
                unite: '%'
                aide: '« Parmi les cavaliers de CSO » : la référence est le total de la colonne CSO.'
    -   id: a03
        titre: Décider
        transition: Les fréquences sont calculées. Aide le centre à décider.
        consigne: Tu vas utiliser le tableau croisé pour conseiller le centre sur un cours de dressage adulte. On attend un calcul et un conseil.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Le centre hésite à ouvrir un cours de dressage pour adultes. Les données l’y encouragent-elles ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Décider avec des données, c’est comparer les bonnes fréquences pour appuyer un choix.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Justifier une décision qui coûte (moniteur, chevaux, horaires).
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - On choisit les fréquences conditionnelles qui répondent à la question.
                    - On compare les sous-groupes.
                    - On rédige un conseil appuyé sur les chiffres.
            -   type: paragraphe
                texte: 'À retenir : On décide avec des fréquences, pas avec des effectifs bruts.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Le centre veut un cours de CSO pour adultes. Calcule la part de CSO parmi les adultes et conclus.
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : le centre veut lancer un cours de dressage pour adultes. Les données l’y encouragent-elles ?'
                    - Pourquoi les données ? Un nouveau cours coûte un moniteur et des chevaux.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - On utilise les fréquences pour …… .
                        - ''
                    -   - 20 ÷ 80 = …… %.
                        - ''
                aide: Les fréquences servent à… (prendre une décision, comparer) ? Puis calcule 20 ÷ 80 en %.
            -   id: q02
                type: texte
                enonce: Que montrent les données sur le dressage chez les adultes ? Conseille le centre.
                aide: 'Comme l’exemple du loisir : part du dressage chez les adultes, puis chez les jeunes. Compare et conseille.'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: On tire un licencié au hasard.
        questions:
            -   id: q01
                type: texte
                enonce: Probabilité qu’il fasse du loisir ?
                aide: Probabilité = nombre de cavaliers de loisir ÷ nombre total de licenciés.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais exploiter un tableau croisé. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment lire et exploiter un tableau croisé d’effectifs ?'
                aide: Dis comment lire un tableau croisé et calculer une fréquence conditionnelle.
retenir:
    - 'Conditionnelle : case ÷ total de la ligne (ou colonne).'
    - « Parmi » change la référence.
