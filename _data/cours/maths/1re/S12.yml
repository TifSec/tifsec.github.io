titre: 'Séance 12 : Tableau croisé : discipline et âge des cavaliers'
themes:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Comment lire et exploiter un tableau croisé d’effectifs ?
competences_bo:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
        - Un tableau croisé répartit une population selon deux caractères.
        - 'Fréquence conditionnelle : effectif d’une case ÷ total de sa ligne (ou de sa colonne).'
    competences:
        - Calculer des fréquences marginales et conditionnelles.
        - Interpréter un tableau croisé.
pourquoi:
    - Un centre équestre compte 200 licenciés.
    - Il veut savoir quelles disciplines attirent quelles tranches d’âge.
activites:
    -   id: a01
        titre: Lire le tableau
        consigne: Tu vas lire le tableau croisé des licenciés par âge et discipline (document 1). On attend un effectif et une fréquence.
        contenu:
            -   type: liste
                elements:
                    - 'Automatisme : 50 ÷ 120 en % (arrondi).'
            -   type: tableau
                titre: Document 1 — Licenciés par âge et discipline (fictif)
                colonnes:
                    - ''
                    - CSO
                    - Dressage
                    - Loisir
                    - Total
                lignes:
                    -   - Moins de 18 ans
                        - '50'
                        - '20'
                        - '50'
                        - '120'
                    -   - 18 ans et plus
                        - '20'
                        - '20'
                        - '40'
                        - '80'
                    -   - Total
                        - '70'
                        - '40'
                        - '90'
                        - '200'
            -   type: etapes
                elements:
                    - 'Lis l’exemple : dans le document 1, la case à l’intersection de « 18 ans et plus » et « Loisir » contient 40.'
                    - 40 adultes pratiquent le loisir.
                    - 'Fréquence des adultes : total de la ligne ÷ total général = 80 ÷ 200 = 0,4 = 40 %.'
                    - 'À toi : lis le tableau croisé (document 1) et réponds.'
                    - Pourquoi croiser ? On voit ensemble deux informations.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Un tableau croisé répartit une population selon …… caractères.
                        - ''
                    -   - Fréquence = effectif ÷ effectif …… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: nombre
                enonce: Combien de cavaliers de moins de 18 ans pratiquent le CSO ?
                unite: cavaliers
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q03
                type: nombre
                enonce: Quelle fréquence des licenciés a moins de 18 ans ?
                unite: '%'
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a02
        titre: Fréquences conditionnelles
        transition: Tu sais lire le tableau. Calcule « parmi ».
        consigne: Tu vas calculer deux fréquences conditionnelles à partir du tableau croisé. On attend les deux pourcentages.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : parmi les adultes, part en loisir ?'
                    - '« Parmi les adultes » : le total de référence est 80 (total de la ligne).'
                    - 40 ÷ 80 = 0,5 = 50 %.
                    - 'Parmi les cavaliers de loisir, part des adultes : référence 90 (total de la colonne) : 40 ÷ 90 ≈ 44,4 %.'
                    - 'À toi : calcule les deux parts demandées pour le CSO.'
                    - 'Pourquoi « parmi » ? Le total de référence change : ce n’est pas la même question.'
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - « Parmi » change le total de …… .
                        - ''
                    -   - Fréquence conditionnelle = case ÷ total de la …… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: nombre
                enonce: Parmi les moins de 18 ans, part en CSO (au dixième) ?
                unite: '%'
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q03
                type: nombre
                enonce: Parmi les cavaliers de CSO, part des moins de 18 ans (au dixième) ?
                unite: '%'
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a03
        titre: Décider
        transition: Les fréquences sont calculées. Aide le centre à décider.
        consigne: Tu vas utiliser le tableau croisé pour conseiller le centre sur un cours de dressage adulte. On attend un calcul et un conseil.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : un club veut ouvrir un cours de loisir pour adultes ; 50 % des adultes font déjà du loisir.'
                    - 'On compare avec les jeunes : 50 ÷ 120 ≈ 41,7 %.'
                    - 'La demande est plus forte chez les adultes : les données encouragent le projet.'
                    - 'À toi : le centre veut lancer un cours de dressage pour adultes. Les données l’y encouragent-elles ?'
                    - Pourquoi les données ? Un nouveau cours coûte un moniteur et des chevaux.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - On utilise les fréquences pour …… .
                        - ''
                    -   - 20 ÷ 80 = …… %.
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: texte
                enonce: Que montrent les données sur le dressage chez les adultes ? Conseille le centre.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: On tire un licencié au hasard.
        questions:
            -   id: q01
                type: texte
                enonce: Probabilité qu’il fasse du loisir ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais exploiter un tableau croisé. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment lire et exploiter un tableau croisé d’effectifs ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Conditionnelle : case ÷ total de la ligne (ou colonne).'
    - « Parmi » change la référence.
sources:
