titre: 'Séance 12 : Tableau croisé et fréquences conditionnelles'
themes:
- MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
- MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Comment lire un tableau à deux caractères et calculer une fréquence « parmi » un groupe ?
competences_bo:
- MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
- MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
    - 'Tableau croisé : deux caractères, des totaux de lignes et de colonnes.'
    - 'Fréquence conditionnelle : case ÷ total de la ligne (ou de la colonne) du groupe.'
    competences:
    - Compléter les totaux d’un tableau croisé.
    - Calculer une fréquence sur l’effectif total.
    - Calculer une fréquence conditionnelle et comparer.
pourquoi:
- 'Aujourd’hui, trois notions : lire et compléter un tableau croisé, les fréquences sur le total, les fréquences conditionnelles.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — Lire et compléter un tableau croisé
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Un tableau croisé répartit une population selon deux caractères à la fois (ici la discipline et l’âge).
    -   type: paragraphe
        texte: La dernière colonne et la dernière ligne donnent les totaux.
    -   type: paragraphe
        texte: 'À retenir : Total d’une ligne = somme de ses cases ; total d’une colonne = somme de ses cases ; la case en bas à droite = effectif total.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Une case = croisement d’une ligne et d’une colonne.
        - 'Total de ligne : additionne la ligne.'
        - 'Total de colonne : additionne la colonne.'
        - 'Contrôle : les totaux de lignes et de colonnes donnent le même effectif total.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Ce que veut dire une case
    -   type: liste
        elements:
        - 'La case CSO / moins de 18 ans vaut 30 : 30 cavaliers sont à la fois en CSO et mineurs.'
    -   type: paragraphe
        texte: 2. Pourquoi le double contrôle
    -   type: liste
        elements:
        - On compte les mêmes 100 cavaliers, rangés par discipline ou par âge.
        - Les deux façons d’additionner doivent donc donner 100.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Cavaliers du club :'
    -   type: tableau
        colonnes:
        - Discipline
        - Moins de 18 ans
        - 18 ans et plus
        - Total
        lignes:
        -   - CSO
            - '30'
            - '20'
            - ''
        -   - Dressage
            - '10'
            - '15'
            - ''
        -   - Randonnée
            - '5'
            - '20'
            - ''
        -   - Total
            - ''
            - ''
            - ''
    -   type: paragraphe
        texte: Tableau croisé des 100 cavaliers licenciés du club (données fictives). Les cases vides sont à calculer.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Combien de cavaliers de dressage ont 18 ans et plus ?
        aide: Ligne Dressage, colonne 18 ans et plus.
    -   id: q02
        type: nombre
        enonce: Total de la ligne CSO ?
        aide: 30 + 20.
    -   id: q03
        type: nombre
        enonce: Total de la ligne Dressage ?
        aide: 10 + 15.
    -   id: q04
        type: nombre
        enonce: Total de la ligne Randonnée ?
        aide: 5 + 20.
    -   id: q05
        type: nombre
        enonce: Total de la colonne « moins de 18 ans » ?
        aide: 30 + 10 + 5.
    -   id: q06
        type: nombre
        enonce: Total de la colonne « 18 ans et plus » ?
        aide: 20 + 15 + 20.
    -   id: q07
        type: nombre
        enonce: Série B — Effectif total ?
        aide: 45 + 55 (ou 50 + 25 + 25).
-   id: a02
    titre: Partie 2 — Fréquences sur l’effectif total
    transition: 'Le tableau est complet. Deuxième notion : calculer des parts de tout le club.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Une fréquence sur le total compare une case à tous les individus.
    -   type: paragraphe
        texte: 'Elle répond à : « quelle part de tout le club ? ».'
    -   type: paragraphe
        texte: 'À retenir : Fréquence = case ÷ effectif total (× 100 pour un %).'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Repère la case (ou le total) demandé.
        - Divise par l’effectif total, ici 100.
        - Multiplie par 100 pour un pourcentage.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi l’effectif total
    -   type: liste
        elements:
        - 'La question porte sur tout le club : on compare à tout le monde.'
    -   type: paragraphe
        texte: 2. Avec 100 cavaliers
    -   type: liste
        elements:
        - 'Sur 100, le nombre de la case est directement le pourcentage : 30 cavaliers = 30 %.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Tableau complet :'
    -   type: tableau
        colonnes:
        - Discipline
        - Moins de 18 ans
        - 18 ans et plus
        - Total
        lignes:
        -   - CSO
            - '30'
            - '20'
            - '50'
        -   - Dressage
            - '10'
            - '15'
            - '25'
        -   - Randonnée
            - '5'
            - '20'
            - '25'
        -   - Total
            - '45'
            - '55'
            - '100'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Part du club qui fait du dressage, en % ?
        unite: '%'
        aide: 25 ÷ 100.
    -   id: q02
        type: nombre
        enonce: Part du club qui a moins de 18 ans, en % ?
        unite: '%'
        aide: 45 ÷ 100.
    -   id: q03
        type: nombre
        enonce: 'Part du club : randonneurs de 18 ans et plus, en % ?'
        unite: '%'
        aide: 20 ÷ 100.
    -   id: q04
        type: nombre
        enonce: 'Part du club : cavaliers de dressage mineurs, en % ?'
        unite: '%'
        aide: 10 ÷ 100.
    -   id: q05
        type: nombre
        enonce: 'Série B — Autre club : 12 cavaliers de CSO sur 60 licenciés. Part du CSO, en % ?'
        unite: '%'
        aide: 12 ÷ 60 × 100.
    -   id: q06
        type: nombre
        enonce: 'Autre club : 27 mineurs sur 60. Part, en % ?'
        unite: '%'
        aide: 27 ÷ 60 × 100.
-   id: a03
    titre: Partie 3 — Fréquences conditionnelles
    transition: 'Dernière notion : calculer une part à l’intérieur d’un groupe seulement.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: 'Une fréquence conditionnelle calcule une part à l’intérieur d’un groupe : « parmi les mineurs », « parmi les cavaliers de CSO ».'
    -   type: paragraphe
        texte: On ne divise plus par l’effectif total, mais par le total du groupe.
    -   type: paragraphe
        texte: 'À retenir : « Parmi les … » : case ÷ total de la ligne ou de la colonne de ce groupe.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - 'Repère le groupe après « parmi » : c’est une ligne ou une colonne.'
        - Lis le total de ce groupe.
        - Divise la case par ce total, × 100.
        - Arrondis au dixième si besoin.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi changer de total
    -   type: liste
        elements:
        - '« Parmi les mineurs, quelle part fait du CSO ? » : on ne regarde que les 45 mineurs.'
        - 30 sur 45 ≈ 66,7 %, alors que sur tout le club c’était 30 %.
    -   type: paragraphe
        texte: 2. Pourquoi c’est utile
    -   type: liste
        elements:
        - Pour comparer deux groupes de tailles différentes (45 mineurs, 55 majeurs).
        - On compare des parts à l’intérieur de chaque groupe.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Tableau complet. Arrondis au dixième.
    -   type: tableau
        colonnes:
        - Discipline
        - Moins de 18 ans
        - 18 ans et plus
        - Total
        lignes:
        -   - CSO
            - '30'
            - '20'
            - '50'
        -   - Dressage
            - '10'
            - '15'
            - '25'
        -   - Randonnée
            - '5'
            - '20'
            - '25'
        -   - Total
            - '45'
            - '55'
            - '100'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Parmi les cavaliers de CSO, part des mineurs, en % ?
        unite: '%'
        aide: 30 ÷ 50 × 100.
    -   id: q02
        type: nombre
        enonce: Parmi les randonneurs, part des majeurs, en % ?
        unite: '%'
        aide: 20 ÷ 25 × 100.
    -   id: q03
        type: nombre
        enonce: Parmi les mineurs, part qui fait du CSO, en % ?
        unite: '%'
        aide: 30 ÷ 45 × 100.
    -   id: q04
        type: nombre
        enonce: Parmi les majeurs, part qui fait du CSO, en % ?
        unite: '%'
        aide: 20 ÷ 55 × 100.
    -   id: q05
        type: qcm
        enonce: Série B — Le CSO attire-t-il plus les mineurs ou les majeurs ?
        choix:
        -   id: a
            texte: Les mineurs
        -   id: b
            texte: Les majeurs
        aide: Compare 66,7 % et 36,4 %.
    -   id: q06
        type: qcm
        enonce: '« Parmi les cavaliers de dressage, part des mineurs » : par quoi divise-t-on ?'
        choix:
        -   id: a
            texte: '45'
        -   id: b
            texte: '25'
        -   id: c
            texte: '100'
        aide: Le groupe est la ligne Dressage.
    -   id: q07
        type: nombre
        enonce: Parmi les mineurs, part qui fait de la randonnée, en % ?
        unite: '%'
        aide: 5 ÷ 45 × 100.
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: Parmi les cavaliers de dressage, part des mineurs, en % ?
        unite: '%'
    -   id: q02
        type: nombre
        enonce: Parmi les majeurs, part qui fait de la randonnée, en % (au dixième) ?
        unite: '%'
    -   id: q03
        type: nombre
        enonce: 'Part du club : mineurs en CSO, en % ?'
        unite: '%'
retenir:
- 'Tableau croisé : chaque case compte les individus qui ont les deux caractères.'
- 'Fréquence sur le total : case ÷ effectif total.'
- 'Fréquence conditionnelle « parmi les … » : case ÷ total de la ligne ou de la colonne de ce groupe.'
- Le mot « parmi » dit par quoi on divise.
