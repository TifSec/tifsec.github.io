titre: 'Séance 15 : Évaluation 2 : statistiques'
themes:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
problematique: Saurai-je analyser et comparer des données statistiques en autonomie ?
competences_bo:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
objectifs:
    connaissances:
        - 'On réutilise : indicateurs, classes, boîtes, écart-type, tableau croisé, nuage, lecture critique.'
    competences:
        - Analyser des données en autonomie.
pourquoi:
    - De S08 à S14, tu as travaillé les statistiques.
    - 'Évaluation : données d’un concours d’endurance.'
activites:
    -   id: a01
        titre: Indicateurs
        consigne: Tu vas calculer la moyenne, la médiane et l’étendue des vitesses de 10 chevaux d’endurance (document 1). On attend les trois indicateurs.
        contenu:
            -   type: paragraphe
                texte: 'Document 1 — Vitesses (km/h) : 14, 16, 12, 15, 18, 13, 17, 15, 14, 16.'
            -   type: paragraphe
                texte: Données fictives créées pour l’exercice (ordres de grandeur réalistes).
            -   type: etapes
                elements:
                    - 'Rappel : moyenne = somme ÷ effectif ; médiane : série rangée, valeur(s) du milieu ; étendue = max − min.'
                    - 'À toi : lis les vitesses moyennes de 10 chevaux (document 1) et calcule moyenne, médiane, étendue.'
                    - Pourquoi ? Résumer la série.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Médiane d’une série paire : moyenne des deux valeurs du …… .'
                        - ''
                    -   - Étendue = max − …… .
                        - ''
                aide: 'Avec 10 valeurs, il y a deux valeurs au milieu : on prend leur… ? Et l’étendue : max moins… ?'
            -   id: q02
                type: nombre
                enonce: Moyenne ?
                unite: km/h
                aide: Additionne les 10 vitesses du document 1 et divise par 10.
            -   id: q03
                type: nombre
                enonce: Médiane ?
                unite: km/h
                aide: Range les 10 vitesses dans l’ordre et fais la moyenne de la 5e et de la 6e.
            -   id: q04
                type: nombre
                enonce: Étendue ?
                unite: km/h
                aide: Plus grande vitesse moins plus petite vitesse.
    -   id: a02
        titre: Tableau croisé
        transition: La série est résumée. Croise maintenant deux caractères.
        consigne: Tu vas calculer le taux de réussite des chevaux arabes et des autres. On attend les deux taux.
        contenu:
            -   type: etapes
                elements:
                    - 'Rappel : taux conditionnel = effectif du sous-groupe ÷ total du sous-groupe.'
                    - 'Exemple : 6 réussites sur 8 juments → 6 ÷ 8 = 75 %.'
                    - 'À toi : parmi 40 chevaux, 30 ont fini l’épreuve ; 18 des 24 arabes ont fini. Calcule les deux taux.'
                    - Pourquoi conditionnel ? Les arabes réussissent-ils mieux ?
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Taux de réussite = réussites ÷ …… .
                        - ''
                    -   - 18 ÷ 24 = …… %.
                        - ''
                aide: Taux de réussite = réussites ÷ quoi ? Puis calcule 18 ÷ 24 en %.
            -   id: q02
                type: nombre
                enonce: Taux de réussite des arabes ?
                unite: '%'
                aide: Arabes qui ont fini ÷ nombre d’arabes, en %.
            -   id: q03
                type: nombre
                enonce: Taux de réussite des autres ?
                unite: '%'
                aide: 'Les autres : (finisseurs au total − arabes finisseurs) ÷ (chevaux au total − arabes).'
    -   id: a03
        titre: Conclure
        transition: Les taux sont calculés. Une publicité les interprète.
        consigne: Tu vas répondre à une publicité sur la réussite des chevaux arabes avec les données. On attend une réponse argumentée.
        contenu:
            -   type: etapes
                elements:
                    - 'Rappel : on répond avec les chiffres, en comparant les taux et pas les effectifs.'
                    - 'À toi : une publicité dit « Les arabes réussissent mieux l’endurance ! ». Que réponds-tu avec les données ?'
                    - Pourquoi critiquer ? Les données disent autre chose que la publicité.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Une publicité doit être confrontée aux …… .
                        - ''
                    -   - Plus nombreux ne veut pas dire plus …… .
                        - ''
                aide: Une publicité se compare aux… ? Et avoir plus de finisseurs, est-ce réussir plus souvent ?
            -   id: q02
                type: texte
                enonce: Que réponds-tu à la publicité ?
                aide: 'Compare tes deux taux : sont-ils vraiment différents ? Réponds à la publicité avec ces deux chiffres.'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Écart-type des vitesses ?
        questions:
            -   id: q01
                type: texte
                enonce: Au tableur.
                aide: Saisis les 10 vitesses dans une colonne et utilise =ECARTYPEP(plage).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: L’évaluation est terminée. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : saurais-tu analyser des données en autonomie ? Fais ton bilan.'
                aide: Fais ton bilan sur les indicateurs, les taux conditionnels et la critique de la publicité.
retenir:
    - Indicateurs, conditionnel, critique.
sources:
