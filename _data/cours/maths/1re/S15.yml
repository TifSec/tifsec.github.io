        calcul: true
retenir:
- 'Position : moyenne, médiane. Dispersion : Q1, Q3, écart-type.'
- Moyenne estimée avec les centres de classes.
- 'x̄ ± 2σ : environ 95 % des valeurs.'
- 'Fréquence conditionnelle : on divise par le total du groupe.'
