titre: 'Séance 15 : Évaluation 2 — Statistiques'
themes:
- MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
problematique: Sais-tu résumer, représenter et comparer des séries statistiques sans aide ?
competences_bo:
- MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
objectifs:
    connaissances:
    - Moyenne, médiane, quartiles, écart-type.
    - Classes et moyenne estimée ; boîtes ; tableau croisé ; nuage de points.
    competences:
    - Refaire seul, sans aide, les calculs des séances 8 à 14.
pourquoi:
- 'Évaluation : 20 exercices, 1 point chacun. Calculatrice autorisée, pas d’aide.'
- Écris tes calculs sur ta feuille.
