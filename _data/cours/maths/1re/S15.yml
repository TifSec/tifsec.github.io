titre: 'Séance 15 : Évaluation 2 : statistiques'
themes:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
problematique: Saurai-je analyser et comparer des données statistiques en autonomie ?
competences_bo:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
objectifs:
    connaissances:
        - 'On réutilise : indicateurs, classes, boîtes, écart-type, tableau croisé, nuage, lecture critique.'
    competences:
        - Analyser des données en autonomie.
pourquoi:
    - De S08 à S14, tu as travaillé les statistiques.
    - 'Évaluation : données d’un concours d’endurance.'
activites:
    -   id: a01
        titre: Indicateurs
        consigne: Tu vas calculer la moyenne, la médiane et l’étendue des vitesses de 10 chevaux d’endurance (document 1). On attend les trois indicateurs.
        contenu:
            -   type: titre
                texte: Exemple
            -   type: paragraphe
                texte: 'Document 1 — Vitesses (km/h) : 14, 16, 12, 15, 18, 13, 17, 15, 14, 16.'
            -   type: paragraphe
                texte: Données fictives créées pour l’exercice (ordres de grandeur réalistes).
            -   type: etapes
                elements:
                    - Lis les vitesses moyennes (km/h) de 10 chevaux (document 1).
                    - Calcule moyenne, médiane, étendue.
            -   type: paragraphe
                texte: Pourquoi ? Résumer la série.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Médiane d’une série paire : moyenne des deux valeurs du …… .'
                        - ''
                    -   - Étendue = max − …… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: nombre
                enonce: Moyenne ?
                unite: km/h
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q03
                type: nombre
                enonce: Médiane ?
                unite: km/h
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q04
                type: nombre
                enonce: Étendue ?
                unite: km/h
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a02
        titre: Tableau croisé
        transition: La série est résumée. Croise maintenant deux caractères.
        consigne: Tu vas calculer le taux de réussite des chevaux arabes et des autres. On attend les deux taux.
        contenu:
            -   type: etapes
                elements:
                    - Parmi 40 chevaux, 30 ont fini l’épreuve ; 18 des 24 arabes ont fini.
                    - Calcule.
            -   type: paragraphe
                texte: Pourquoi conditionnel ? Les arabes réussissent-ils mieux ?
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Taux de réussite = réussites ÷ …… .
                        - ''
                    -   - 18 ÷ 24 = …… %.
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: nombre
                enonce: Taux de réussite des arabes ?
                unite: '%'
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q03
                type: nombre
                enonce: Taux de réussite des autres ?
                unite: '%'
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a03
        titre: Conclure
        transition: Les taux sont calculés. Une publicité les interprète.
        consigne: Tu vas répondre à une publicité sur la réussite des chevaux arabes avec les données. On attend une réponse argumentée.
        contenu:
            -   type: etapes
                elements:
                    - 'Une publicité dit : « Les arabes réussissent mieux l’endurance ! »'
                    - Que réponds-tu avec les données ?
            -   type: paragraphe
                texte: Pourquoi critiquer ? Les données disent autre chose que la publicité.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Une publicité doit être confrontée aux …… .
                        - ''
                    -   - Plus nombreux ne veut pas dire plus …… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: texte
                enonce: Que réponds-tu à la publicité ?
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Écart-type des vitesses ?
        questions:
            -   id: q01
                type: texte
                enonce: Au tableur.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: L’évaluation est terminée. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : saurais-tu analyser des données en autonomie ? Fais ton bilan.'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Indicateurs, conditionnel, critique.
sources:
    -   type: lien
        titre: ChloroFil — Bac Pro, tronc commun rénové, document d’accompagnement du module MG1
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/bacpro/bacpro-tc-da-MG1.pdf
