titre: 'Séance 16 : Le stock de foin baisse chaque jour de la même quantité'
themes:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Comment modéliser une quantité qui diminue chaque jour de la même valeur ?
competences_bo:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
        - 'Suite arithmétique : on passe d’un terme au suivant en ajoutant toujours la même raison r : uₙ₊₁ = uₙ + r.'
        - u₀ est le terme initial ; ici r est négative.
    competences:
        - Reconnaître une suite arithmétique.
        - Calculer les premiers termes.
pourquoi:
    - L’écurie a 6 000 kg de foin au 1er décembre et en consomme 180 kg par jour.
    - Combien en restera-t-il au fil des jours ?
activites:
    -   id: a01
        titre: Les premiers termes
        consigne: Tu vas calculer les trois premiers termes de la suite du stock de foin. On attend u₁, u₂, u₃.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: L’écurie a 6 000 kg de foin au jour 0 et en utilise 180 kg chaque jour. Combien en restera-t-il les jours suivants ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: 'Une suite est une liste de nombres numérotés u₀, u₁, u₂… : le terme uₙ est la valeur au rang n (ici le stock au jour n). Dans une suite arithmétique, on passe d’un terme au suivant en ajoutant toujours le même nombre.'
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - 'Suivre une quantité jour après jour, mois après mois : stock, économies, nombre d’adhérents.'
                    - Prévoir à quel moment une quantité atteint un seuil.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - u₀ est la valeur de départ (jour 0).
                    - Pour obtenir le terme suivant, on ajoute la même quantité r (ici on enlève 180, donc on ajoute −180).
                    - 'On calcule les termes un par un : u₁, puis u₂ à partir de u₁, etc.'
            -   type: paragraphe
                texte: 'À retenir : Suite arithmétique : uₙ₊₁ = uₙ + r ; u₀ est le terme initial.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - u₀ = 100 et chaque terme augmente de 15. Calcule u₁, u₂, u₃.
                    - u₀ = 2 000 et chaque jour −250. Calcule u₁ et u₂.
            -   type: liste
                elements:
                    - 'Automatisme : 6 000 − 180 = ?'
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : u₀ = 6 000 kg (jour 0), chaque jour −180 kg. Calcule u₁, u₂, u₃.'
                    - Pourquoi une suite ? On suit la valeur jour après jour.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Suite arithmétique : uₙ₊₁ = uₙ + …… .'
                        - ''
                    -   - u₀ est le terme …… .
                        - ''
                aide: 'Relis l’exemple des granulés : chaque terme = le précédent + quoi (ici négatif) ? Et u₀, c’est le terme de quel jour ?'
            -   id: q02
                type: tableau
                enonce: Calcule.
                colonnes:
                    - Terme
                    - Valeur (kg)
                lignes:
                    -   - u₁
                        - ''
                    -   - u₂
                        - ''
                    -   - u₃
                        - ''
                aide: 'Pars de u₀ = 6 000 kg et enlève 180 kg à chaque jour : u₁, puis u₂, puis u₃.'
    -   id: a02
        titre: La relation de récurrence
        transition: Les termes sont calculés. Écris la règle.
        consigne: Tu vas écrire la relation de récurrence de la suite du stock et donner sa raison. On attend la relation, la raison et le sens de variation.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Plutôt que d’écrire « on enlève 180 » à chaque fois, on veut une écriture mathématique courte.
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: La relation de récurrence dit comment calculer un terme à partir du précédent. Le nombre ajouté à chaque étape s’appelle la raison r.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Décrire la suite en une ligne.
                    - Savoir tout de suite si la quantité augmente ou diminue.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - On écrit uₙ₊₁ = uₙ + r, en remplaçant r par sa valeur.
                    - Si r est positif, la suite est croissante ; si r est négatif, elle est décroissante.
            -   type: paragraphe
                texte: 'À retenir : r > 0 : suite croissante ; r < 0 : suite décroissante.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Écris la relation de récurrence d’une suite qui commence à 50 et augmente de 12 à chaque étape.
                    - 'uₙ₊₁ = uₙ − 7 : la suite est-elle croissante ou décroissante ?'
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : écris la relation de récurrence du stock de foin et donne la raison.'
                    - Pourquoi « récurrence » ? Chaque terme se calcule à partir du précédent.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - r s’appelle la …… de la suite.
                        - ''
                    -   - Si r < 0, la suite est …… .
                        - ''
                aide: Le nombre ajouté à chaque étape s’appelle la… ? Et si ce nombre est négatif, la suite monte ou descend ?
            -   id: q02
                type: texte
                enonce: Écris la relation de récurrence et donne la raison.
                aide: Écris comme l’exemple uₙ₊₁ = uₙ − 20, avec le nombre de kg du foin.
            -   id: q03
                type: qcm
                enonce: Cette suite est-elle croissante ou décroissante ?
                choix:
                    -   id: a
                        texte: Décroissante (r < 0)
                    -   id: b
                        texte: Croissante
                    -   id: c
                        texte: Constante
                aide: Regarde le signe de la raison.
    -   id: a03
        titre: Au tableur
        transition: La règle est écrite. Fais calculer le tableur.
        consigne: Tu vas faire calculer au tableur le stock de foin jour après jour. On attend le stock au jour 30 et le jour où il s’épuise.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Combien restera-t-il au jour 30 ? À quel jour le foin sera-t-il épuisé ? Calculer 40 termes à la main serait long.
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: 'Au tableur, une formule recopiée vers le bas calcule chaque terme à partir du précédent : c’est la relation de récurrence.'
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Calculer beaucoup de termes d’un coup.
                    - Repérer le jour où un seuil est atteint (stock épuisé, il faut commander).
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - 'Colonne A : le jour (A2 : 0, puis =A2+1).'
                    - 'Colonne B : le stock (B2 : u₀, puis =B2 + r).'
                    - On sélectionne la 2e ligne de formules et on tire vers le bas.
                    - On lit le terme voulu ; un stock négatif signifie que le modèle n’est plus valable.
            -   type: paragraphe
                texte: 'À retenir : Un terme impossible (stock négatif) montre la limite du modèle.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - u₀ = 1 000, r = −120. Quel est le terme u₅ ?
                    - Avec cette suite, à partir de quel rang le terme devient-il négatif ?
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : A2 : 0 ; B2 : 6 000 ; A3 : =A2+1 ; B3 : =B2-180 ; recopie jusqu’au jour 40, puis lis le stock au jour 30.'
                    - Pourquoi le tableur ? 40 calculs en une recopie.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Au tableur : =B2 − 180 puis on …… .'
                        - ''
                    -   - Un stock négatif signifie que le modèle n’est plus …… .
                        - ''
                aide: Au tableur, après =B2−180, que fait-on avec la poignée ? Et un stock négatif est-il possible dans la réalité ?
            -   id: q02
                type: nombre
                enonce: Stock au jour 30 ?
                unite: kg
                aide: Recopie les formules jusqu’au jour 40 et lis la cellule du jour 30.
            -   id: q03
                type: texte
                enonce: À quel jour le stock devient-il négatif (impossible) ? Que signifie-t-il ?
                aide: Descends dans ta colonne jusqu’à la première valeur négative. Que se passe-t-il vraiment à l’écurie avant ce jour ?
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le fournisseur livre 2 000 kg le jour 20.
        questions:
            -   id: q01
                type: texte
                enonce: Le modèle reste-t-il une suite arithmétique ?
                aide: Au jour 20, on ajoute 2 000 kg une fois. La différence entre deux jours reste-t-elle toujours la même ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais modéliser une baisse régulière. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment modéliser une quantité qui diminue chaque jour de la même valeur ?'
                aide: Dis ce qu’est une suite arithmétique, sa raison, et comment la calculer au tableur.
retenir:
    - 'Arithmétique : uₙ₊₁ = uₙ + r.'
    - 'r < 0 : décroissante.'
