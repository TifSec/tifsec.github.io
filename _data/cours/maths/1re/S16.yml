titre: 'Séance 16 : Les suites arithmétiques'
themes:
- MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Comment décrire une quantité qui augmente ou diminue de la même valeur à chaque étape ?
competences_bo:
- MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
    - 'Une suite est une liste de nombres numérotés : u₀, u₁, u₂…'
    - 'Suite arithmétique : on ajoute toujours la même raison r : uₙ₊₁ = uₙ + r.'
    competences:
    - Lire un terme et son rang.
    - Reconnaître une suite arithmétique et trouver sa raison.
    - Calculer les termes suivants.
pourquoi:
- 'Aujourd’hui, trois notions : la suite et ses termes, la raison d’une suite arithmétique, calculer terme après terme.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — Une suite, ses termes et leurs rangs
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: 'Une suite est une liste de nombres rangés dans un ordre : le stock de foin jour après jour, le prix année après année…'
    -   type: paragraphe
        texte: Chaque nombre est un terme ; sa place est son rang. u₀ est le terme de rang 0, u₁ celui de rang 1, etc.
    -   type: paragraphe
        texte: 'À retenir : uₙ se lit « u indice n » : c’est le terme de rang n.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Repère le premier rang (souvent 0).
        - 'Compte les rangs dans l’ordre : 0, 1, 2…'
        - uₙ est le nombre écrit à la place n.
        - Ne confonds pas le rang (la place) et le terme (la valeur).
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi numéroter
    -   type: liste
        elements:
        - « Le stock au jour 3 » s’écrit simplement u₃.
        - Le numéro dit de quel jour on parle.
    -   type: paragraphe
        texte: 2. Pourquoi commencer à 0
    -   type: liste
        elements:
        - u₀ est souvent la valeur de départ, avant toute évolution.
        - Ainsi uₙ est la valeur après n jours (ou n années).
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Stock de foin (tonnes) au début de chaque semaine :'
    -   type: tableau
        colonnes:
        - Rang n
        - '0'
        - '1'
        - '2'
        - '3'
        - '4'
        lignes:
        -   - Stock uₙ (t)
            - '24'
            - 21,5
            - '19'
            - 16,5
            - '14'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Que vaut u₀ ?
        unite: t
        aide: Colonne n = 0.
    -   id: q02
        type: nombre
        enonce: Que vaut u₃ ?
        unite: t
        aide: Colonne n = 3.
    -   id: q03
        type: nombre
        enonce: Quel est le rang du terme 19 ?
        aide: Cherche 19, remonte au rang.
    -   id: q04
        type: nombre
        enonce: Que vaut u₄ ?
        unite: t
        aide: Colonne n = 4.
    -   id: q05
        type: nombre
        enonce: Série B — Combien de termes dans ce tableau ?
        aide: Rangs 0 à 4.
    -   id: q06
        type: nombre
        enonce: De combien le stock baisse-t-il entre u₀ et u₄ ?
        unite: t
        aide: u₀ − u₄.
-   id: a02
    titre: Partie 2 — La raison d’une suite arithmétique
    transition: 'Tu sais lire une suite. Deuxième notion : reconnaître celles qui changent toujours de la même quantité.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Une suite est arithmétique quand on passe d’un terme au suivant en ajoutant toujours le même nombre.
    -   type: paragraphe
        texte: Ce nombre s’appelle la raison, notée r. Elle peut être négative (le stock baisse).
    -   type: paragraphe
        texte: 'À retenir : r = terme suivant − terme. Arithmétique si cette différence est toujours la même.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Calcule u₁ − u₀, u₂ − u₁, u₃ − u₂…
        - 'Si toutes les différences sont égales : arithmétique, et r est cette différence.'
        - 'Garde le signe : une baisse donne r négatif.'
        - 'Une seule différence différente : pas arithmétique.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi « suivant − précédent »
    -   type: liste
        elements:
        - On cherche ce qu’on ajoute pour passer au suivant.
        - '21,5 − 24 = −2,5 : on « ajoute » −2,5, c’est-à-dire qu’on enlève 2,5 t chaque semaine.'
    -   type: paragraphe
        texte: 2. Un contre-exemple
    -   type: liste
        elements:
        - 'Suite 2 ; 4 ; 8 ; 16 : différences 2, 4, 8.'
        - 'Pas la même : ce n’est pas une suite arithmétique (on multiplie par 2).'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Pour une baisse, écris la raison avec le signe moins.
    questions:
    -   id: q01
        type: nombre
        enonce: 'Série A — Stock du tableau : raison r ?'
        unite: t
        aide: u₁ − u₀.
    -   id: q02
        type: nombre
        enonce: 'Suite 10 ; 14 ; 18 ; 22 : raison ?'
        aide: Différence entre deux termes.
    -   id: q03
        type: nombre
        enonce: 'Suite 100 ; 95 ; 90 ; 85 : raison ?'
        aide: Différence.
    -   id: q04
        type: nombre
        enonce: 'Suite 1,2 ; 1,5 ; 1,8 ; 2,1 : raison ?'
        aide: Différence.
    -   id: q05
        type: qcm
        enonce: La suite 3 ; 6 ; 12 ; 24 est-elle arithmétique ?
        choix:
        -   id: a
            texte: Oui
        -   id: b
            texte: Non
        aide: 'Calcule les différences : 3, 6, 12.'
    -   id: q06
        type: qcm
        enonce: Série B — La suite 7 ; 7 ; 7 ; 7 est-elle arithmétique ?
        choix:
        -   id: a
            texte: Oui, de raison 0
        -   id: b
            texte: Non
        aide: Différences ?
    -   id: q07
        type: qcm
        enonce: Le prix d’une pension augmente de 15 € par an. La suite des prix est…
        choix:
        -   id: a
            texte: arithmétique de raison 15
        -   id: b
            texte: arithmétique de raison −15
        -   id: c
            texte: pas arithmétique
        aide: Même ajout chaque année.
-   id: a03
    titre: Partie 3 — Calculer terme après terme
    transition: 'Dernière notion : prolonger une suite arithmétique.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Si on connaît un terme et la raison, on obtient le suivant en ajoutant r.
    -   type: paragraphe
        texte: 'On l’écrit uₙ₊₁ = uₙ + r : c’est une relation de récurrence.'
    -   type: paragraphe
        texte: 'À retenir : uₙ₊₁ = uₙ + r.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Pars du terme connu.
        - Ajoute r pour obtenir le terme suivant.
        - Recommence autant de fois que nécessaire.
        - Avec r négatif, chaque terme est plus petit que le précédent.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Ce que dit la formule
    -   type: liste
        elements:
        - « Le stock de la semaine suivante = le stock de cette semaine − 2,5 t ».
        - uₙ₊₁ = uₙ + r dit exactement cela, avec r = −2,5.
    -   type: paragraphe
        texte: 2. Sa limite
    -   type: liste
        elements:
        - Pour u₅₀, il faudrait 50 additions.
        - La séance suivante donne une formule directe.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée.
    questions:
    -   id: q01
        type: nombre
        enonce: 'Série A — Stock du tableau : u₅ ?'
        unite: t
        aide: u₄ + r = 14 − 2,5.
    -   id: q02
        type: nombre
        enonce: u₆ ?
        unite: t
        aide: u₅ − 2,5.
    -   id: q03
        type: nombre
        enonce: u₀ = 300 € et r = 15. u₁ ?
        unite: €
        aide: 300 + 15.
    -   id: q04
        type: nombre
        enonce: Avec u₀ = 300 et r = 15, u₃ ?
        unite: €
        aide: Trois fois + 15.
    -   id: q05
        type: nombre
        enonce: Série B — u₀ = 50, r = −4. u₂ ?
        aide: 50 − 4 − 4.
    -   id: q06
        type: nombre
        enonce: u₃ = 18 et r = 2,5. u₄ ?
        aide: 18 + 2,5.
    -   id: q07
        type: nombre
        enonce: u₅ = 30 et r = 3. Que vaut u₄ (le terme d’avant) ?
        aide: On enlève r pour revenir en arrière.
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: 'Suite 2 ; 9 ; 16 ; 23 : raison ?'
    -   id: q02
        type: nombre
        enonce: 'Suite 2 ; 9 ; 16 ; 23 : terme suivant ?'
    -   id: q03
        type: nombre
        enonce: 'u₀ = 12, r = −0,5 : u₄ ?'
    -   id: q04
        type: nombre
        enonce: 'u₂ = 40, r = 5 : u₀ ?'
retenir:
- 'uₙ : le terme de rang n (n = 0 pour le premier, si la suite commence à u₀).'
- 'Arithmétique : la différence entre deux termes qui se suivent est toujours la même : la raison r.'
- 'uₙ₊₁ = uₙ + r. r > 0 : la suite augmente ; r < 0 : elle diminue.'
