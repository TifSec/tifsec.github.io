titre: 'Séance 16 : Le stock de foin baisse chaque jour de la même quantité'
themes:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
problematique: Comment modéliser une quantité qui diminue chaque jour de la même valeur ?
competences_bo:
    - MG1, C1.3 — Exploiter la modélisation d’un phénomène
objectifs:
    connaissances:
        - 'Suite arithmétique : on passe d’un terme au suivant en ajoutant toujours la même raison r : uₙ₊₁ = uₙ + r.'
        - u₀ est le terme initial ; ici r est négative.
    competences:
        - Reconnaître une suite arithmétique.
        - Calculer les premiers termes.
pourquoi:
    - L’écurie a 6 000 kg de foin au 1er décembre et en consomme 180 kg par jour.
    - Combien en restera-t-il au fil des jours ?
activites:
    -   id: a01
        titre: Les premiers termes
        consigne: Tu vas calculer les trois premiers termes de la suite du stock de foin. On attend u₁, u₂, u₃.
        contenu:
            -   type: titre
                texte: Exemple
            -   type: liste
                elements:
                    - 'Automatisme : 6 000 − 180 = ?'
            -   type: etapes
                elements:
                    - u₀ = 6 000 (jour 0).
                    - 'Chaque jour : − 180.'
                    - Calcule u₁, u₂, u₃.
            -   type: paragraphe
                texte: Pourquoi une suite ? On suit la valeur jour après jour.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Suite arithmétique : uₙ₊₁ = uₙ + …… .'
                        - ''
                    -   - u₀ est le terme …… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: tableau
                enonce: Calcule.
                colonnes:
                    - Terme
                    - Valeur (kg)
                lignes:
                    -   - u₁
                        - ''
                    -   - u₂
                        - ''
                    -   - u₃
                        - ''
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a02
        titre: La relation de récurrence
        transition: Les termes sont calculés. Écris la règle.
        consigne: Tu vas écrire la relation de récurrence de la suite du stock et donner sa raison. On attend la relation, la raison et le sens de variation.
        contenu:
            -   type: etapes
                elements:
                    - Écris la relation entre uₙ₊₁ et uₙ.
                    - Identifie la raison.
            -   type: paragraphe
                texte: Pourquoi « récurrence » ? Chaque terme se calcule à partir du précédent.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - r s’appelle la …… de la suite.
                        - ''
                    -   - Si r < 0, la suite est …… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: texte
                enonce: Écris la relation de récurrence et donne la raison.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
            -   id: q03
                type: qcm
                enonce: Cette suite est-elle croissante ou décroissante ?
                choix:
                    -   id: a
                        texte: Décroissante (r < 0)
                    -   id: b
                        texte: Croissante
                    -   id: c
                        texte: Constante
                aide: Élimine d’abord les réponses impossibles.
    -   id: a03
        titre: Au tableur
        transition: La règle est écrite. Fais calculer le tableur.
        consigne: Tu vas faire calculer au tableur le stock de foin jour après jour. On attend le stock au jour 30 et le jour où il s’épuise.
        contenu:
            -   type: etapes
                elements:
                    - 'A2 : 0 ; B2 : 6 000 ; A3 : =A2+1 ; B3 : =B2-180 ; recopie jusqu’au jour 40.'
                    - Lis le stock au jour 30.
            -   type: paragraphe
                texte: Pourquoi le tableur ? 40 calculs en une recopie.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Au tableur : =B2 − 180 puis on …… .'
                        - ''
                    -   - Un stock négatif signifie que le modèle n’est plus …… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: nombre
                enonce: Stock au jour 30 ?
                unite: kg
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q03
                type: texte
                enonce: À quel jour le stock devient-il négatif (impossible) ? Que signifie-t-il ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le fournisseur livre 2 000 kg le jour 20.
        questions:
            -   id: q01
                type: texte
                enonce: Le modèle reste-t-il une suite arithmétique ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais modéliser une baisse régulière. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment modéliser une quantité qui diminue chaque jour de la même valeur ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Arithmétique : uₙ₊₁ = uₙ + r.'
    - 'r < 0 : décroissante.'
sources:
