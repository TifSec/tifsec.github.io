titre: 'Renforcement 1 : Le foin, les seaux et les demi-rations'
themes:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment calculer vite et sans erreur les rations de l’écurie, même avec des fractions ?
competences_bo:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
        - × et ÷ avant + et − ; les parenthèses d’abord.
        - × 5, c’est × 10 puis ÷ 2 ; × 4, c’est le double du double.
        - 'a/b d’une quantité : diviser par b, puis multiplier par a.'
        - 1/2 = 0,5 ; 1/4 = 0,25 ; 3/4 = 0,75.
    competences:
        - Calculer de tête avec des astuces simples.
        - Écrire un calcul de l’écurie en une seule ligne et le résoudre.
        - Calculer une fraction d’une quantité.
        - Passer d’une fraction simple à un nombre décimal.
pourquoi:
    - 'En S01, tu as fait le diagnostic : priorités de calcul et fractions. Cette heure reprend ces bases, pas à pas.'
    - 'À l’écurie, on calcule tous les jours : foin, eau, demi-rations. Un calcul juste évite le gaspillage.'
activites:
    -   id: a01
        titre: Automatismes
        consigne: Tu vas faire 5 calculs de tête, sans calculatrice. On attend 5 résultats.
        contenu:
            -   type: paragraphe
                texte: 'Range ta calculatrice : ces calculs se font de tête. Prends ton temps, la vitesse viendra avec l’entraînement.'
        questions:
            -   id: q01
                type: nombre
                enonce: 'Calcule de tête : 7 × 8.'
                aide: 'Récite la table de 7 ou de 8. Vérifie : 7 × 10 moins 7 × 2.'
            -   id: q02
                type: nombre
                enonce: 'Calcule de tête : 120 ÷ 4.'
                aide: 'Divise par 2, puis encore par 2 : 120 → 60 → 30.'
            -   id: q03
                type: nombre
                enonce: 'Calcule de tête : la moitié de 18.'
                aide: La moitié, c’est diviser par 2.
    -   id: a02
        titre: Calculer de tête avec des astuces
        consigne: Tu vas utiliser deux astuces pour multiplier par 5 et par 4 sans calculatrice. On attend les points clés et un résultat.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : calcule 12 × 5 sans calculatrice.'
                    - × 5, c’est × 10 puis ÷ 2.
                    - 12 × 10 = 120
                    - 120 ÷ 2 = 60. Donc 12 × 5 = 60.
                    - 'Autre exemple : 16 × 4, c’est le double du double. 16 × 2 = 32, puis 32 × 2 = 64.'
                    - 'À toi : calcule 18 × 5.'
                    - Pourquoi des astuces ? Un calcul plus court, c’est moins d’erreurs, même sans calculatrice.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Multiplier par 5, c’est multiplier par 10 puis diviser par …… .
                        - ''
                    -   - Multiplier par 4, c’est prendre le …… du double.
                        - ''
                aide: 'Relis l’exemple 12 × 5 : par quoi a-t-on divisé 120 ? Et pour 16 × 4, combien de fois a-t-on doublé ?'
            -   id: q02
                type: nombre
                enonce: 'Palier 1 : calcule 18 × 5 avec l’astuce.'
                aide: 18 × 10 = 180. Que dois-tu faire ensuite ?
    -   id: a03
        titre: Écrire tout le calcul en une ligne
        transition: Tu sais calculer de tête. Maintenant, écris tout un problème en un seul calcul.
        consigne: Tu vas écrire puis résoudre des calculs de foin en une seule ligne, en respectant les priorités. On attend les points clés et deux résultats.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : 2 chevaux mangent chacun 9 kg de foin par jour, et un poney mange 5 kg. Combien de foin par jour en tout ?'
                    - 'Le calcul en une ligne : 2 × 9 + 5'
                    - 'On fait d’abord la multiplication : 2 × 9 = 18'
                    - 'Puis l’addition : 18 + 5 = 23. Il faut 23 kg de foin par jour.'
                    - 'Autre exemple : 3 chevaux mangent chacun 8 kg par jour, pendant 2 jours : (3 × 8) × 2 = 24 × 2 = 48 kg.'
                    - 'À toi : calcule 40 − 3 × 8, puis le foin de 3 chevaux pendant 4 jours.'
                    - Pourquoi une seule ligne ? On voit tout le raisonnement d’un coup d’œil, et on peut le vérifier.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Dans 2 × 9 + 5, on calcule d’abord la …… .
                        - ''
                    -   - Les calculs entre …… sont faits en premier.
                        - ''
                aide: 'Relis l’exemple : quelle opération a été faite avant l’addition ? Quel signe oblige à commencer par l’intérieur ?'
            -   id: q02
                type: nombre
                enonce: 'Palier 2 : calcule 40 − 3 × 8.'
                aide: 'Ne calcule pas de gauche à droite : commence par 3 × 8.'
            -   id: q03
                type: nombre
                enonce: 'Palier 3 : 3 chevaux mangent chacun 10 kg de foin par jour. Combien de kg pour 4 jours ? Quel calcul vas-tu poser ? Résous-le.'
                unite: kg
                aide: Combien mangent les 3 chevaux en 1 jour ? Puis multiplie par le nombre de jours.
    -   id: a04
        titre: Prendre une fraction d’une quantité
        transition: 'Tu maîtrises les calculs entiers. Passons aux fractions : une demi-ration, trois quarts de seau.'
        consigne: Tu vas calculer une fraction d’une quantité. On attend les points clés et un résultat avec son unité.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : calcule 3/4 de 12 kg de granulés.'
                    - 'Le 4 (en bas) : on partage 12 kg en 4 parts égales. 12 ÷ 4 = 3 kg.'
                    - 'Le 3 (en haut) : on prend 3 parts. 3 × 3 = 9 kg.'
                    - Donc 3/4 de 12 kg = 9 kg.
                    - 'À toi : calcule ce que contient un seau rempli aux 3/4.'
                    - Pourquoi diviser d’abord ? On cherche la taille d’une part, puis on prend le bon nombre de parts.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Dans 3/4, le 4 dit en combien de …… on partage.
                        - ''
                    -   - Dans 3/4, le 3 dit combien de parts on …… .
                        - ''
                aide: 'Relis l’exemple : par quoi a-t-on divisé 12 kg ? Combien de parts a-t-on gardées ensuite ?'
            -   id: q02
                type: nombre
                enonce: 'Palier 2 : un seau contient 16 L quand il est plein. Il est rempli aux 3/4. Combien de litres contient-il ? Quel calcul vas-tu poser ? Résous-le.'
                unite: L
                aide: Partage 16 L en 4 parts égales, puis prends 3 parts.
    -   id: a05
        titre: Fraction ou nombre décimal ?
        transition: Tu sais prendre une fraction. Voyons comment la calculatrice l’écrit.
        consigne: Tu vas écrire deux fractions en nombres décimaux, puis calculer la ration d’un poulain. On attend un tableau complété et un résultat.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : une fraction est une division. 1/2 = 1 ÷ 2 = 0,5.'
                    - Donc 1/2 de 20 kg = 0,5 × 20 = 10 kg. C’est le même résultat que 20 ÷ 2.
                    - 'À toi : complète le tableau, puis calcule la ration du poulain.'
                    - Pourquoi le nombre décimal ? Les étiquettes et la calculatrice écrivent souvent 0,5 ou 0,75 au lieu de 1/2 ou 3/4.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Palier 1 : écris chaque fraction en nombre décimal.'
                colonnes:
                    - Fraction
                    - Nombre décimal
                lignes:
                    -   - 1/4
                        - ''
                    -   - 3/4
                        - ''
                aide: 'Une fraction est une division : le nombre du haut divisé par le nombre du bas. Tu peux vérifier à la calculatrice.'
            -   id: q02
                type: nombre
                enonce: 'Palier 3 : une jument mange 9 kg de foin par jour. Son poulain reçoit 1/3 de cette ration. Combien de kg de foin le poulain mange-t-il en une semaine (7 jours) ? Quel calcul vas-tu poser ? Résous-le.'
                unite: kg
                aide: Cherche d’abord la ration du poulain pour 1 jour (1/3 de 9 kg), puis multiplie par 7.
    -   id: a06
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une botte de foin pèse 20 kg. 3 chevaux mangent chacun 10 kg de foin par jour, et un poney mange la moitié de la ration d’un cheval.
        questions:
            -   id: q01
                type: texte
                enonce: Combien de bottes faut-il acheter pour une semaine (7 jours) ?
                aide: Calcule le foin d’une journée pour tout le monde, puis pour 7 jours, puis le nombre de bottes. Peut-on acheter une demi-botte ?
    -   id: a07
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tes missions sont faites. Il reste à répondre au problème de départ et à faire ton bilan.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quel calcul poses-tu pour le foin de 3 chevaux pendant 4 jours, et comment calcules-tu les 3/4 d’un seau ? Écris aussi une chose que tu sais faire maintenant et une chose à retravailler.'
                aide: 'Reprends tes réponses des paliers 3 et 2. Pour le bilan, relis tes réponses : où as-tu réussi seul ? où as-tu hésité ?'
retenir:
    - × et ÷ avant + et − ; les parenthèses d’abord.
    - × 5 = × 10 puis ÷ 2 ; × 4 = le double du double.
    - 'a/b d’une quantité : diviser par b, puis multiplier par a.'
    - 1/2 = 0,5 ; 1/4 = 0,25 ; 3/4 = 0,75.
