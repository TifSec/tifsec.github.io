titre: 'Renforcement 1 : Priorités, calcul de tête et fractions'
themes:
- EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment calculer juste, de tête ou en une ligne, et prendre une fraction d’une quantité ?
competences_bo:
- EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
    - × et ÷ avant + et − ; les parenthèses d’abord.
    - 'a/b d’une quantité : ÷ b puis × a ; a/b = a ÷ b.'
    competences:
    - Calculer en respectant les priorités.
    - Utiliser des astuces de calcul de tête.
    - Prendre une fraction d’une quantité.
pourquoi:
- 'Aujourd’hui, trois notions : les priorités de calcul, les astuces de calcul de tête, les fractions.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — Les priorités de calcul
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Dans un calcul avec plusieurs opérations, on ne calcule pas forcément de gauche à droite.
    -   type: paragraphe
        texte: 'Il y a un ordre à respecter : ce sont les priorités.'
    -   type: paragraphe
        texte: 'À retenir : D’abord les parenthèses, puis × et ÷, enfin + et −.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - 'Repère les parenthèses : calcule ce qu’il y a dedans.'
        - Fais les multiplications et les divisions.
        - Termine par les additions et les soustractions.
        - Récris le calcul à chaque étape, en remplaçant ce que tu as calculé.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Avec une situation
    -   type: liste
        elements:
        - '3 seaux d’eau, puis 2 sacs de 5 kg de granulés : 3 + 2 × 5.'
        - 'Les 2 sacs font 2 × 5 = 10 kg ; on ajoute ensuite : 3 + 10 = 13.'
    -   type: paragraphe
        texte: 2. Pourquoi tout le monde suit la même règle
    -   type: liste
        elements:
        - Sans règle, 3 + 2 × 5 pourrait donner 25 ou 13.
        - La règle garantit que tout le monde, et la calculatrice, trouve 13.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Sans calculatrice, puis vérifie avec.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Calcule 3 + 2 × 5.
        aide: La multiplication d’abord.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Calcule 10 − 4 × 2.
        aide: La multiplication d’abord.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Calcule 18 ÷ 3 + 4.
        aide: La division d’abord.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Calcule (3 + 2) × 5.
        aide: Les parenthèses d’abord.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Calcule 4 × 5 + 3 × 2.
        aide: Les deux multiplications, puis l’addition.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Série B — Calcule 50 − (12 + 8).
        aide: Les parenthèses d’abord.
        calcul: true
    -   id: q07
        type: nombre
        enonce: Calcule 2 × (15 − 5) + 7.
        aide: Parenthèses, puis ×, puis +.
        calcul: true
-   id: a02
    titre: Partie 2 — Les astuces de calcul de tête
    transition: 'Tu connais l’ordre des calculs. Deuxième notion : calculer plus vite de tête.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Certaines multiplications deviennent faciles quand on les découpe.
    -   type: paragraphe
        texte: Ces astuces évitent la calculatrice pour les calculs simples et permettent de vérifier un résultat.
    -   type: paragraphe
        texte: 'À retenir : × 10 : on décale d’un rang. × 5 = × 10 puis ÷ 2. × 4 = le double du double. × 9 = × 10 puis − une fois.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - '× 10 : ajoute un zéro (ou décale la virgule d’un rang vers la droite).'
        - '× 5 : multiplie par 10, puis prends la moitié.'
        - '× 4 : double, puis double encore.'
        - '× 9 : multiplie par 10, puis enlève le nombre une fois.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi × 5 = × 10 puis ÷ 2
    -   type: liste
        elements:
        - 5, c’est la moitié de 10.
        - 'Donc 5 fois un nombre, c’est la moitié de 10 fois ce nombre : 14 × 5 = 140 ÷ 2 = 70.'
    -   type: paragraphe
        texte: 2. Pourquoi × 9 = × 10 − 1 fois
    -   type: liste
        elements:
        - 9 fois, c’est 10 fois moins 1 fois.
        - 12 × 9 = 12 × 10 − 12 = 120 − 12 = 108.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Sans calculatrice.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Calcule 23 × 10.
        aide: Ajoute un zéro.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Calcule 4,5 × 10.
        aide: Décale la virgule d’un rang.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Calcule 18 × 5.
        aide: × 10 puis ÷ 2.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Calcule 25 × 4.
        aide: Double, puis double encore.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Série B — Calcule 14 × 9.
        aide: × 10 puis − 14.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Calcule 32 × 5.
        aide: × 10 puis ÷ 2.
        calcul: true
    -   id: q07
        type: nombre
        enonce: Un cheval mange 12 kg de foin par jour. Combien en 5 jours ?
        unite: kg
        aide: 12 × 5 = 12 × 10 ÷ 2.
        calcul: true
-   id: a03
    titre: Partie 3 — Les fractions
    transition: 'Dernière notion : prendre une partie d’une quantité.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: 'Une fraction a/b d’une quantité, c’est : partager en b parts égales, et en prendre a.'
    -   type: paragraphe
        texte: 'Une fraction est aussi une division : a/b = a ÷ b.'
    -   type: paragraphe
        texte: 'À retenir : a/b d’une quantité = quantité ÷ b × a.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Divise la quantité par le nombre du bas (b).
        - Multiplie le résultat par le nombre du haut (a).
        - Pour écrire une fraction en nombre décimal, fais a ÷ b.
        - 'Repères : 1/2 = 0,5 ; 1/4 = 0,25 ; 3/4 = 0,75.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. En partageant
    -   type: liste
        elements:
        - '3/4 d’une botte de 20 kg : on partage en 4 parts de 20 ÷ 4 = 5 kg.'
        - 'On prend 3 parts : 3 × 5 = 15 kg.'
    -   type: paragraphe
        texte: 2. Pourquoi a/b = a ÷ b
    -   type: liste
        elements:
        - 3/4, c’est 3 parts d’une unité partagée en 4.
        - 'Partager 3 unités en 4, c’est 3 ÷ 4 = 0,75 : le même nombre.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Sans calculatrice, puis vérifie avec.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Calcule 1/2 de 40 kg.
        unite: kg
        aide: 40 ÷ 2.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Calcule 1/4 de 24 kg.
        unite: kg
        aide: 24 ÷ 4.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Calcule 3/4 de 24 kg.
        unite: kg
        aide: 24 ÷ 4 puis × 3.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Calcule 2/5 de 50 €.
        unite: €
        aide: 50 ÷ 5 puis × 2.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Série B — Écris 1/4 en nombre décimal.
        aide: 1 ÷ 4.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Écris 3/5 en nombre décimal.
        aide: 3 ÷ 5.
        calcul: true
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: Calcule 7 + 3 × 6.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Calcule (7 + 3) × 6.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Calcule 26 × 5.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Calcule 3/4 de 36.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Écris 3/4 en nombre décimal.
        calcul: true
retenir:
- 'Ordre : parenthèses, puis × et ÷, puis + et −.'
- '× 10 : un zéro ou la virgule d’un rang ; × 5 = × 10 puis ÷ 2 ; × 4 = le double du double.'
- 'a/b d’une quantité : diviser par b, puis multiplier par a.'
- 'Une fraction est une division : 3/4 = 3 ÷ 4 = 0,75.'
