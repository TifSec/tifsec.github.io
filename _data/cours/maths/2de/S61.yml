titre: 'Renforcement 1 : Combien de foin pour 3 chevaux pendant 4 jours ?'
themes:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment calculer vite et sans erreur les quantités de foin de l’écurie ?
competences_bo:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
        - × et ÷ avant + et − ; les parenthèses d’abord.
        - × 5, c’est × 10 puis ÷ 2 ; × 4, c’est le double du double.
    competences:
        - Calculer de tête avec des astuces simples.
        - Écrire un calcul de l’écurie en une seule ligne et le résoudre.
pourquoi:
    - Cette heure de renforcement reprend les calculs de base, à ton rythme, sans piège.
    - 'À l’écurie, on calcule tous les jours : foin, eau, granulés. Un calcul rapide et juste évite le gaspillage.'
activites:
    -   id: a01
        titre: Automatismes
        consigne: Tu vas faire 5 calculs de tête, sans calculatrice. On attend 5 résultats.
        contenu:
            -   type: paragraphe
                texte: 'Range ta calculatrice : ces calculs se font de tête. Prends ton temps, la vitesse viendra avec l’entraînement.'
        questions:
            -   id: q01
                type: nombre
                enonce: 'Calcule de tête : 7 × 8.'
                aide: 'Récite la table de 7 ou de 8. Vérifie : 7 × 8, c’est 7 × 10 moins 7 × 2.'
            -   id: q02
                type: nombre
                enonce: 'Calcule de tête : 6 × 9.'
                aide: 'Astuce : 6 × 10 = 60, puis enlève une fois 6.'
            -   id: q03
                type: nombre
                enonce: 'Calcule de tête : 120 ÷ 4.'
                aide: 'Divise par 2, puis encore par 2 : 120 → 60 → 30.'
            -   id: q04
                type: nombre
                enonce: 'Calcule de tête : 25 × 4.'
                aide: Quatre billets de 25 €, combien d’euros en tout ?
            -   id: q05
                type: nombre
                enonce: 'Calcule de tête : 15 × 10.'
                aide: Multiplier par 10, c’est ajouter un 0 à la fin d’un nombre entier.
    -   id: a02
        titre: Calculer de tête avec des astuces
        consigne: Tu vas utiliser deux astuces pour multiplier par 5 et par 4 sans calculatrice. On attend deux résultats.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : calcule 12 × 5 sans calculatrice.'
                    - × 5, c’est × 10 puis ÷ 2.
                    - 12 × 10 = 120
                    - 120 ÷ 2 = 60
                    - Donc 12 × 5 = 60.
                    - 'Autre exemple : 16 × 4, c’est le double du double.'
                    - 16 × 2 = 32, puis 32 × 2 = 64. Donc 16 × 4 = 64.
                    - 'À toi : calcule 18 × 5, puis la quantité de foin d’un cheval pendant 4 jours.'
                    - Pourquoi des astuces ? Un calcul plus court, c’est moins d’erreurs, même sans calculatrice.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Multiplier par 5, c’est multiplier par 10 puis diviser par …… .
                        - ''
                    -   - Multiplier par 4, c’est prendre le …… du double.
                        - ''
                aide: 'Relis l’exemple 12 × 5 : par quoi a-t-on divisé 120 ? Et pour 16 × 4, combien de fois a-t-on doublé ?'
            -   id: q02
                type: nombre
                enonce: 'Palier 1 : calcule 18 × 5 avec l’astuce.'
                aide: 18 × 10 = 180. Que dois-tu faire ensuite ?
            -   id: q03
                type: nombre
                enonce: 'Palier 2 : un cheval mange 9 kg de foin par jour. Combien en 4 jours ? Quel calcul vas-tu poser ? Résous-le.'
                unite: kg
                aide: Pose 9 × 4. Le double de 9, puis encore le double.
    -   id: a03
        titre: Écrire tout le calcul en une ligne
        transition: Tu sais calculer de tête. Maintenant, écris tout un problème en un seul calcul.
        consigne: Tu vas écrire puis résoudre des calculs de foin en une seule ligne, en respectant les priorités. On attend deux résultats.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : 2 chevaux mangent chacun 9 kg de foin par jour, et un poney mange 5 kg. Combien de foin par jour en tout ?'
                    - 'Le calcul en une ligne : 2 × 9 + 5'
                    - 'On fait d’abord la multiplication : 2 × 9 = 18'
                    - 'Puis l’addition : 18 + 5 = 23. Il faut 23 kg de foin par jour.'
                    - 'Autre exemple : 3 chevaux mangent chacun 8 kg par jour, pendant 2 jours : (3 × 8) × 2 = 24 × 2 = 48 kg.'
                    - 'À toi : calcule 40 − 3 × 8, puis le foin de 3 chevaux pendant 4 jours.'
                    - Pourquoi une seule ligne ? On voit tout le raisonnement d’un coup d’œil, et on peut le vérifier.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Dans 2 × 9 + 5, on calcule d’abord la …… .
                        - ''
                    -   - Les calculs entre …… sont faits en premier.
                        - ''
                aide: 'Relis l’exemple : quelle opération a été faite avant l’addition ? Quel signe oblige à commencer par l’intérieur ?'
            -   id: q02
                type: nombre
                enonce: 'Palier 2 : calcule 40 − 3 × 8.'
                aide: 'Ne calcule pas de gauche à droite : commence par 3 × 8.'
            -   id: q03
                type: nombre
                enonce: 'Palier 3 : 3 chevaux mangent chacun 10 kg de foin par jour. Combien de kg pour 4 jours ? Quel calcul vas-tu poser ? Résous-le.'
                unite: kg
                aide: Combien mangent les 3 chevaux en 1 jour ? Puis multiplie par le nombre de jours.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une botte de foin pèse 20 kg. 3 chevaux mangent chacun 10 kg de foin par jour.
        questions:
            -   id: q01
                type: texte
                enonce: Combien de bottes faut-il acheter pour une semaine (7 jours) ?
                aide: Calcule d’abord le foin pour 7 jours, puis combien de bottes de 20 kg. Peut-on acheter une demi-botte ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tes missions sont faites. Il reste à répondre au problème de départ et à faire ton bilan.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : combien de foin faut-il pour 3 chevaux pendant 4 jours, et quel calcul as-tu posé ? Écris aussi une chose que tu sais faire maintenant et une chose à retravailler.'
                aide: 'Reprends ta réponse du palier 3. Pour le bilan, relis tes réponses : où as-tu réussi seul ? où as-tu hésité ?'
retenir:
    - × et ÷ avant + et − ; les parenthèses d’abord.
    - × 5 = × 10 puis ÷ 2 ; × 4 = le double du double.
