titre: 'Renforcement 5 : Des grammes aux kilos, des minutes aux heures'
themes:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment changer d’unité sans se tromper, pour les masses, les volumes et les durées ?
competences_bo:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
        - 1 kg = 1 000 g ; 1 L = 1 000 mL ; 1 km = 1 000 m.
        - '1 h = 60 min : 30 min = 0,5 h ; 15 min = 0,25 h ; 45 min = 0,75 h.'
    competences:
        - Convertir des masses, des volumes et des longueurs.
        - Passer des heures et minutes aux heures décimales, et calculer une durée.
pourquoi:
    - En S08 et S09, tu as converti des vitesses et des durées. Cette heure reprend les conversions de base.
    - 'Les compléments se dosent en grammes ou en millilitres, les rations en kilos : une erreur d’unité peut rendre un cheval malade.'
activites:
    -   id: a01
        titre: Automatismes
        consigne: Tu vas faire 5 calculs de tête, sans calculatrice. On attend 5 résultats.
        contenu:
            -   type: paragraphe
                texte: 'Range ta calculatrice : ces calculs se font de tête. Prends ton temps, la vitesse viendra avec l’entraînement.'
        questions:
            -   id: q01
                type: nombre
                enonce: Combien de grammes dans 1 kg ?
                unite: g
                aide: Kilo veut dire mille.
            -   id: q02
                type: nombre
                enonce: Convertis 2,5 kg en grammes.
                unite: g
                aide: '× 1 000 : la virgule se décale de 3 rangs vers la droite.'
            -   id: q03
                type: nombre
                enonce: Combien de minutes dans 1 h ?
                unite: min
                aide: Regarde le tour complet de la grande aiguille.
            -   id: q04
                type: nombre
                enonce: Combien de millilitres dans 1 L ?
                unite: mL
                aide: Milli veut dire un millième.
            -   id: q05
                type: nombre
                enonce: Convertis 3 km en mètres.
                unite: m
                aide: 1 km = 1 000 m.
    -   id: a02
        titre: Masses, volumes et longueurs
        consigne: Tu vas convertir une masse, un volume et une longueur. On attend un tableau complété.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : 1,2 kg en grammes.'
                    - '1 kg = 1 000 g, donc on multiplie par 1 000 : 1,2 × 1 000 = 1 200 g.'
                    - 'Dans l’autre sens, on divise : 750 g = 750 ÷ 1 000 = 0,75 kg.'
                    - C’est pareil pour les litres (1 L = 1 000 mL) et les kilomètres (1 km = 1 000 m).
                    - 'À toi : complète le tableau.'
                    - 'Pourquoi c’est important ? Le complément se dose en g, le foin en kg : il faut la même unité pour comparer.'
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Pour passer des kg aux g, on multiplie par …… .
                        - ''
                    -   - Pour passer des g aux kg, on …… par 1 000.
                        - ''
                aide: 'Relis l’exemple : 1,2 kg est devenu 1 200 g, on a multiplié par combien ? Et pour 750 g → 0,75 kg ?'
            -   id: q02
                type: tableau
                enonce: 'Palier 1 : complète chaque conversion.'
                colonnes:
                    - Conversion
                    - Résultat
                lignes:
                    -   - 3,5 kg = …… g
                        - ''
                    -   - 250 mL = …… L
                        - ''
                    -   - 1,8 km = …… m
                        - ''
                aide: 'Grande unité vers petite : × 1 000. Petite unité vers grande : ÷ 1 000.'
    -   id: a03
        titre: 'Les durées : attention, 1 h = 60 min'
        transition: Les masses suivent la règle des 1 000. Les durées, elles, comptent par 60 !
        consigne: Tu vas passer d’heures et minutes à des heures décimales, calculer la durée d’une balade et une quantité de complément. On attend des durées et une masse.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : 1 h 30 min, c’est 1 h et une demi-heure. 30 min = 0,5 h, donc 1 h 30 min = 1,5 h.'
                    - 'De même : 15 min = 0,25 h (un quart d’heure) et 45 min = 0,75 h (trois quarts d’heure).'
                    - 'Attention au piège : 1,30 h n’est pas 1 h 30 min ! 1,30 h = 1 h + 0,3 × 60 min = 1 h 18 min.'
                    - 'Pour une durée : de 9 h 40 à 11 h 10, on compte 20 min jusqu’à 10 h, puis 1 h 10 min. Total : 1 h 30 min = 90 min.'
                    - 'À toi : complète le tableau, puis calcule la durée de la balade et la quantité de complément.'
                    - Pourquoi les heures décimales ? Pour calculer une vitesse ou un temps de travail, la calculatrice a besoin d’heures décimales.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Palier 1 : complète.'
                colonnes:
                    - Durée
                    - Résultat
                lignes:
                    -   - 1 h 45 min = …… h
                        - ''
                    -   - 0,5 h = …… min
                        - ''
                aide: 45 min, ce sont trois quarts d’heure. 0,5 h, c’est une demi-heure.
            -   id: q02
                type: nombre
                enonce: 'Palier 2 : un cavalier part en balade à 14 h 20 et rentre à 16 h 05. Combien de minutes a duré la balade ?'
                unite: min
                aide: Compte de 14 h 20 à 15 h, puis de 15 h à 16 h, puis de 16 h à 16 h 05. Additionne.
            -   id: q03
                type: nombre
                enonce: 'Palier 3 : un cheval reçoit 30 g de complément par jour pendant 30 jours. Combien de kg de complément faut-il acheter ?'
                unite: kg
                aide: Calcule d’abord en grammes pour 30 jours, puis convertis en kg (÷ 1 000).
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un cheval parcourt 6 km au trot en 30 min.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle est sa vitesse en km/h ? Explique.
                aide: 30 min, c’est une demi-heure. Combien de km ferait-il en une heure entière ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tes missions sont faites. Il reste à répondre au problème de départ et à faire ton bilan.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment évites-tu les erreurs d’unité pour les masses et pour les durées ? Écris aussi une chose que tu sais faire maintenant et une chose à retravailler.'
                aide: Rappelle la règle des 1 000 pour les masses, et la règle des 60 pour les durées. Donne un exemple de la séance.
retenir:
    - 'kg → g, L → mL, km → m : × 1 000 ; dans l’autre sens : ÷ 1 000.'
    - 1 h = 60 min ; 30 min = 0,5 h ; 15 min = 0,25 h ; 45 min = 0,75 h.
