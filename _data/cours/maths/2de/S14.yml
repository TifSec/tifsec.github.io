titre: 'Séance 14 : Étendue et quartiles'
themes:
- EG4, 1-1 — Organiser et traiter des données statistiques à une variable
problematique: Comment savoir si des valeurs sont regroupées ou dispersées ?
competences_bo:
- EG4, 1-1 — Organiser et traiter des données statistiques à une variable
objectifs:
    connaissances:
    - Étendue = valeur max − valeur min.
    - 'Q1 et Q3 : quartiles ; écart interquartile = Q3 − Q1.'
    competences:
    - Calculer une étendue.
    - Trouver Q1 et Q3 d’une série rangée.
    - Comparer la dispersion de deux séries.
pourquoi:
- 'Aujourd’hui, trois notions : l’étendue, les quartiles, puis comparer la dispersion de deux séries.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — L’étendue
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: L’étendue mesure l’écart entre la plus petite et la plus grande valeur.
    -   type: paragraphe
        texte: Une petite étendue veut dire des valeurs proches ; une grande, des valeurs éloignées.
    -   type: paragraphe
        texte: 'À retenir : Étendue = valeur maximale − valeur minimale.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Repère la plus grande valeur (le max).
        - Repère la plus petite valeur (le min).
        - Calcule max − min.
        - Écris l’unité de la série.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. En regardant sur une droite
    -   type: liste
        elements:
        - Place toutes les valeurs sur une droite graduée.
        - L’étendue est la longueur du morceau de droite qui va de la plus petite à la plus grande.
    -   type: paragraphe
        texte: 2. Sa limite
    -   type: liste
        elements:
        - 'Elle n’utilise que deux valeurs : une seule valeur exceptionnelle suffit à la rendre très grande.'
        - C’est pour cela qu’on utilise aussi les quartiles.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Temps de préparation d’un cheval (min), pour 12 élèves, déjà rangés : 8 ; 9 ; 10 ; 10 ; 11 ; 12 ; 12 ; 13 ; 14 ; 15 ; 18 ; 20.'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Quelle est la plus grande valeur ?
        unite: min
        aide: Dernière valeur de la série rangée.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Quelle est la plus petite valeur ?
        unite: min
        aide: Première valeur de la série rangée.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Quelle est l’étendue ?
        unite: min
        aide: Max − min.
        calcul: true
    -   id: q04
        type: nombre
        enonce: 'Série B — Étendue de : 450 ; 520 ; 480 ; 610 ; 500 (kg) ?'
        unite: kg
        aide: Max − min.
        calcul: true
    -   id: q05
        type: nombre
        enonce: 'Étendue de : 1,45 ; 1,52 ; 1,38 ; 1,60 (m) ?'
        unite: m
        aide: Max − min.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Une série a pour min 35 et pour étendue 20. Quel est son max ?
        aide: Étendue = max − min, donc max = min + étendue.
        calcul: true
-   id: a02
    titre: Partie 2 — Les quartiles
    transition: 'L’étendue dépend de deux valeurs seulement. Deuxième notion : les quartiles, plus solides.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Les quartiles partagent la série rangée en quatre parts d’environ 25 % des valeurs.
    -   type: paragraphe
        texte: 'Q1 (premier quartile) : au moins 25 % des valeurs sont inférieures ou égales. Q3 (troisième quartile) : au moins 75 %.'
    -   type: paragraphe
        texte: 'À retenir : Série rangée de n valeurs : Q1 est au rang n ÷ 4, Q3 au rang 3n ÷ 4 (arrondis à l’entier au-dessus).'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Range la série et compte n.
        - 'Calcule n ÷ 4 ; si ce n’est pas un entier, prends l’entier juste au-dessus : c’est le rang de Q1.'
        - 'Calcule 3n ÷ 4 ; arrondis au-dessus si besoin : c’est le rang de Q3.'
        - Lis les valeurs à ces rangs.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi n ÷ 4
    -   type: liste
        elements:
        - Un quart des valeurs, c’est n ÷ 4 valeurs.
        - 'Pour 12 valeurs : 12 ÷ 4 = 3. La 3e valeur a 3 valeurs sur 12 (25 %) inférieures ou égales à elle.'
    -   type: paragraphe
        texte: 2. Pourquoi arrondir au-dessus
    -   type: liste
        elements:
        - 'Pour 10 valeurs : 10 ÷ 4 = 2,5. La 2e valeur n’a que 20 % des valeurs avant elle, pas assez.'
        - 'La 3e en a 30 % : c’est la première qui atteint 25 %. On arrondit donc au-dessus.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Même série de 12 temps de préparation : 8 ; 9 ; 10 ; 10 ; 11 ; 12 ; 12 ; 13 ; 14 ; 15 ; 18 ; 20.'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Rang de Q1 pour 12 valeurs ?
        aide: 12 ÷ 4.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Valeur de Q1 ?
        unite: min
        aide: Lis la 3e valeur.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Rang de Q3 pour 12 valeurs ?
        aide: 3 × 12 ÷ 4.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Valeur de Q3 ?
        unite: min
        aide: Lis la 9e valeur.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Écart interquartile Q3 − Q1 ?
        unite: min
        aide: Q3 − Q1.
        calcul: true
    -   id: q06
        type: nombre
        enonce: 'Série B — Série de 10 valeurs : rang de Q1 ?'
        aide: 10 ÷ 4 = 2,5, arrondis au-dessus.
        calcul: true
    -   id: q07
        type: nombre
        enonce: 'Série : 2 ; 4 ; 4 ; 5 ; 7 ; 8 ; 9 ; 11. Valeur de Q3 ?'
        aide: n = 8 ; rang 3 × 8 ÷ 4 = 6.
        calcul: true
-   id: a03
    titre: Partie 3 — Comparer la dispersion
    transition: 'Dernière notion : utiliser ces nombres pour comparer deux groupes.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Deux séries peuvent avoir la même médiane mais des valeurs plus ou moins regroupées.
    -   type: paragraphe
        texte: L’écart interquartile dit si la moitié centrale des valeurs est serrée ou étalée.
    -   type: paragraphe
        texte: 'À retenir : La série la plus regroupée (la plus régulière) a le plus petit écart interquartile.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Calcule Q1 et Q3 de chaque série.
        - Calcule Q3 − Q1 pour chacune.
        - 'Compare : le plus petit écart = la série la plus régulière.'
        - Écris une phrase de conclusion avec les nombres.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Ce que mesure Q3 − Q1
    -   type: liste
        elements:
        - Entre Q1 et Q3, il y a environ la moitié des valeurs, celles du milieu.
        - Si Q3 − Q1 est petit, ces valeurs sont serrées les unes contre les autres.
    -   type: paragraphe
        texte: 2. Pourquoi pas seulement l’étendue
    -   type: liste
        elements:
        - Une seule valeur bizarre change l’étendue.
        - 'Elle ne change presque pas Q1 et Q3 : la comparaison est plus juste.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Temps de préparation : groupe A : Q1 = 10 min, Q3 = 14 min, étendue 12 min. Groupe B : Q1 = 9 min, Q3 = 17 min, étendue 10 min.'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Écart interquartile du groupe B ?
        unite: min
        aide: Q3 − Q1.
        calcul: true
    -   id: q02
        type: qcm
        enonce: Quel groupe a la moitié centrale la plus regroupée ?
        choix:
        -   id: a
            texte: Le groupe A
        -   id: b
            texte: Le groupe B
        -   id: c
            texte: Pareil
        aide: Compare les écarts interquartiles (4 et 8).
    -   id: q03
        type: qcm
        enonce: Quel groupe a la plus grande étendue ?
        choix:
        -   id: a
            texte: Le groupe A
        -   id: b
            texte: Le groupe B
        aide: Compare 12 et 10.
    -   id: q04
        type: qcm
        enonce: Le groupe A a une grande étendue mais un petit écart interquartile. Que peut-on dire ?
        choix:
        -   id: a
            texte: Toutes ses valeurs sont dispersées
        -   id: b
            texte: La plupart des valeurs sont proches, avec une ou deux valeurs extrêmes
        -   id: c
            texte: Ses valeurs sont toutes égales
        aide: L’étendue regarde les extrêmes, l’écart interquartile le milieu.
    -   id: q05
        type: nombre
        enonce: 'Série B — Lot C : Q1 = 48 kg, Q3 = 56 kg. Lot D : Q1 = 50 kg, Q3 = 54 kg. Écart interquartile du lot le plus régulier ?'
        unite: kg
        aide: Calcule les deux écarts, garde le plus petit.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Une série a Q1 = 120 et un écart interquartile de 15. Que vaut Q3 ?
        aide: Q3 = Q1 + écart.
        calcul: true
    -   id: q07
        type: nombre
        enonce: 'Série : 5 ; 6 ; 6 ; 7 ; 8 ; 8 ; 9 ; 30. Étendue ?'
        aide: Max − min.
        calcul: true
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: Étendue de 14 ; 22 ; 9 ; 17 ?
        calcul: true
    -   id: q02
        type: nombre
        enonce: 'Série de 20 valeurs : rang de Q3 ?'
        calcul: true
    -   id: q03
        type: nombre
        enonce: 'Série 1 ; 3 ; 3 ; 4 ; 6 ; 7 ; 8 ; 9 ; 10 : Q1 ?'
        calcul: true
    -   id: q04
        type: nombre
        enonce: 'Même série : Q3 ?'
        calcul: true
    -   id: q05
        type: nombre
        enonce: 'Même série : écart interquartile ?'
        calcul: true
retenir:
- 'Étendue = max − min : l’écart entre les deux valeurs extrêmes.'
- 'Q1 : rang = n ÷ 4 arrondi à l’entier au-dessus ; Q3 : rang = 3n ÷ 4 arrondi au-dessus (série rangée).'
- 'Écart interquartile = Q3 − Q1 : la largeur de la moitié centrale des valeurs.'
- Plus l’étendue ou l’écart interquartile est petit, plus les valeurs sont regroupées.
