titre: 'Séance 14 : Les données sont-elles regroupées ou dispersées ?'
themes:
    - EG4, 1-1 — Organiser et traiter des données statistiques à une variable
problematique: Comment mesurer la dispersion d’une série ?
competences_bo:
    - EG4, 1-1 — Organiser et traiter des données statistiques à une variable
objectifs:
    connaissances:
        - 'Étendue = max − min. Quartiles Q1, Q3 : au moins 25 % et 75 % des valeurs sont inférieures ou égales.'
        - 'Écart interquartile = Q3 − Q1 : dispersion de la moitié centrale.'
    competences:
        - Calculer étendue et quartiles.
        - Interpréter l’écart interquartile.
pourquoi:
    - En S13, tu as résumé une série par sa médiane.
    - Deux séries peuvent avoir la même médiane et être très différentes.
activites:
    -   id: a01
        titre: L’étendue
        consigne: Tu vas calculer l’étendue des durées de pansage de 12 élèves (document 1). On attend l’étendue.
        contenu:
            -   type: titre
                texte: Exemple
            -   type: liste
                elements:
                    - 'Automatisme : range 25, 12, 18 dans l’ordre croissant.'
            -   type: paragraphe
                texte: 'Document 1 — Durées (min), rangées : 12, 14, 15, 15, 16, 18, 18, 20, 21, 22, 25, 30.'
            -   type: paragraphe
                texte: Données fictives créées pour l’exercice (ordres de grandeur réalistes).
            -   type: etapes
                elements:
                    - Lis les durées de pansage de 12 élèves (document 1).
                    - Calcule l’étendue.
            -   type: paragraphe
                texte: Pourquoi l’étendue ? Elle montre l’écart entre le plus rapide et le plus lent.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Étendue = valeur maximale − valeur …… .
                        - ''
                    -   - L’étendue dépend seulement des valeurs …… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: nombre
                enonce: Quelle est l’étendue ?
                unite: min
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a02
        titre: Les quartiles
        transition: L’étendue dépend des extrêmes. Regarde le centre de la série.
        consigne: Tu vas déterminer les quartiles et l’écart interquartile des durées de pansage. On attend Q1, Q3 et l’écart.
        contenu:
            -   type: etapes
                elements:
                    - 'Effectif 12 : Q1 = 3e valeur (12 × 0,25 = 3), Q3 = 9e valeur (12 × 0,75 = 9).'
                    - Lis Q1 et Q3.
            -   type: paragraphe
                texte: Pourquoi les quartiles ? Ils coupent la série en quatre parts.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Q1 : au moins …… % des valeurs sont inférieures ou égales.'
                        - ''
                    -   - Écart interquartile = Q3 − …… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: nombre
                enonce: Q1 ?
                unite: min
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q03
                type: nombre
                enonce: Q3 ?
                unite: min
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q04
                type: nombre
                enonce: Écart interquartile ?
                unite: min
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a03
        titre: Interpréter
        transition: Tu as les indicateurs. Compare deux groupes.
        consigne: Tu vas comparer la dispersion de deux groupes d’élèves de même médiane. On attend le groupe le plus homogène justifié.
        contenu:
            -   type: etapes
                elements:
                    - Le groupe B a la même médiane (18 min) et un écart interquartile de 12 min.
                    - Compare les deux groupes.
            -   type: paragraphe
                texte: Pourquoi comparer la dispersion ? Le moniteur organise différemment un groupe homogène et un groupe hétérogène.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Plus l’écart interquartile est petit, plus la série est …… .
                        - ''
                    -   - On compare deux séries de même …… par leur dispersion.
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: texte
                enonce: Quel groupe est le plus homogène ? Justifie.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Si l’élève à 30 min passe à 50 min, quels indicateurs changent ?
        questions:
            -   id: q01
                type: texte
                enonce: Étendue, quartiles ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais mesurer la dispersion. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment mesurer la dispersion d’une série ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Étendue = max − min.
    - Écart interquartile = Q3 − Q1.
