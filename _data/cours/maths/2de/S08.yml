titre: 'Séance 8 : À quelle vitesse trotte mon cheval ?'
themes:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment calculer une vitesse à partir d’une distance et d’une durée ?
competences_bo:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
        - Vitesse = distance ÷ durée ; v = d / t.
        - 'Unités : m/s, m/min, km/h ; on garde des unités cohérentes.'
    competences:
        - Calculer une vitesse moyenne.
        - Calculer une distance ou une durée.
pourquoi:
    - En 2de pro hippique, tu dois savoir calculer une vitesse (allures, entraînement).
    - 'Aujourd’hui : chronométrer le trot sur une piste de 400 m.'
activites:
    -   id: a01
        titre: La vitesse moyenne
        consigne: Tu vas calculer la vitesse d’un cheval qui trotte 400 m en 1 min 20 s, en m/s et en m/min. On attend les deux vitesses.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Un cheval trotte 400 m en 1 min 20 s. À quelle vitesse va-t-il ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: La vitesse moyenne est la distance parcourue pendant une unité de temps (en 1 seconde, en 1 minute, en 1 heure).
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Suivre l’entraînement d’un cheval, doser l’effort.
                    - Préparer une balade ou un concours.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - On convertit la durée dans une seule unité (secondes ou minutes).
                    - On divise la distance par la durée.
                    - 'L’unité de la vitesse vient des unités utilisées : m ÷ s = m/s ; m ÷ min = m/min.'
            -   type: paragraphe
                texte: 'À retenir : v = d / t, avec des unités cohérentes.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Un cheval parcourt 600 m en 2 min. Vitesse en m/min ?
                    - Un poney parcourt 120 m en 1 min 30 s. Vitesse en m/s ?
            -   type: liste
                elements:
                    - 'Automatisme : convertis 1 min 20 s en secondes.'
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : un cheval trotte 400 m en 1 min 20 s (80 s). Calcule sa vitesse en m/s, puis en m/min.'
                    - Pourquoi deux unités ? Les fiches d’entraînement utilisent souvent m/min.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Vitesse = distance ÷ …… .
                        - ''
                    -   - v = d / t ; d s’exprime ici en mètres et t en …… .
                        - ''
                aide: 'Relis l’exemple : la vitesse se calcule avec la distance et quoi ? Si on veut des m/s, le temps est en quelle unité ?'
            -   id: q02
                type: nombre
                enonce: Vitesse en m/s ?
                unite: m/s
                aide: Divise la distance (en m) par la durée (en s) de l’énoncé.
            -   id: q03
                type: nombre
                enonce: Vitesse en m/min ?
                unite: m/min
                aide: 'Une minute = 60 s : en une minute, le cheval parcourt 60 fois plus qu’en une seconde.'
    -   id: a02
        titre: Distance et durée
        transition: Tu sais calculer une vitesse. Calcule maintenant une distance et une durée.
        consigne: Tu vas calculer une distance et une durée à partir d’une vitesse donnée. On attend deux résultats avec leur unité.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: 'On prépare une séance : quelle distance fera le cheval en 10 min de trot ? Combien de temps pour faire 1 800 m au galop ?'
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: La formule v = d / t se transforme pour calculer une distance (d = v × t) ou une durée (t = d ÷ v).
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Construire une séance d’entraînement.
                    - Prévoir la durée d’une balade.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - 'Distance : on multiplie la vitesse par la durée.'
                    - 'Durée : on divise la distance par la vitesse.'
                    - On vérifie que les unités vont ensemble (m/min avec des min et des m).
            -   type: paragraphe
                texte: 'À retenir : d = v × t ; t = d ÷ v.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - 'Au pas à 110 m/min pendant 20 min : quelle distance ?'
                    - '900 m à 300 m/min : combien de minutes ?'
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : utilise d = v × t et t = d ÷ v pour les deux questions.'
                    - 'Pourquoi ces formules ? On prépare une séance : quelle distance en 10 min de trot ?'
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Distance = vitesse × …… .
                        - ''
                    -   - Durée = distance ÷ …… .
                        - ''
                aide: Si v = d ÷ t, comment retrouver d ? Et t ?
            -   id: q02
                type: nombre
                enonce: À 300 m/min, quelle distance en 10 min ?
                unite: m
                aide: Distance = vitesse × durée, avec la durée en minutes.
            -   id: q03
                type: nombre
                enonce: Au galop de travail à 450 m/min, combien de minutes pour 1 800 m ?
                unite: min
                aide: 'Durée = distance ÷ vitesse : 1 800 m ÷ 450 m/min.'
    -   id: a03
        titre: Comparer des allures
        transition: Tu as des vitesses. Que signifient-elles ?
        consigne: Tu vas situer la vitesse calculée parmi les repères d’allures (document 1). On attend l’allure correspondante.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: 'Le cheval de la mission 1 va à 300 m/min : est-ce du pas, du trot ou du galop ?'
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Des repères de vitesse (ordres de grandeur) associent une plage de vitesses à chaque allure.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Vérifier qu’un cheval travaille à la bonne allure.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - On exprime la vitesse dans la même unité que le tableau de repères.
                    - On cherche la ligne dont la plage contient la vitesse.
            -   type: paragraphe
                texte: 'À retenir : On compare des vitesses dans la même unité.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - À quelle allure correspond 420 m/min ?
                    - Et 5 m/s ? (convertis d’abord en m/min)
            -   type: tableau
                titre: Document 1 — Repères de vitesse (ordres de grandeur)
                colonnes:
                    - Allure
                    - Vitesse (ordre de grandeur, m/min)
                lignes:
                    -   - Pas
                        - 100 à 120
                    -   - Trot de travail
                        - 250 à 350
                    -   - Galop de travail
                        - 350 à 500
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : lis les repères (document 1) et classe ton cheval de la mission 1.'
                    - Pourquoi des repères ? Ils aident à doser l’effort.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Le trot de travail est d’environ 250 à …… m/min.
                        - ''
                    -   - On compare des vitesses dans la même …… .
                        - ''
                aide: 'Regarde le document 1 : quelle vitesse haute pour le trot de travail ? Et peut-on comparer des km/h avec des m/min ?'
            -   id: q02
                type: texte
                enonce: D’après le document 1, à quelle allure correspond 300 m/min ?
                aide: Cherche dans le document 1 la fourchette de vitesse qui contient 300 m/min.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un chronomètre a une erreur de ±1 s.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle vitesse si le temps vaut 81 s au lieu de 80 s ?
                aide: Refais distance ÷ temps avec 81 s au lieu de 80 s et compare les deux vitesses.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais calculer une vitesse. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment calculer une vitesse à partir d’une distance et d’une durée ?'
                aide: Donne les trois formules (vitesse, distance, durée) et la règle sur les unités.
retenir:
    - v = d / t ; d = v × t ; t = d / v.
    - Unités cohérentes.
