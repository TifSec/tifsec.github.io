titre: 'Séance 8 : Vitesse, distance et durée'
themes:
- EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment calculer une vitesse moyenne, une distance ou une durée ?
competences_bo:
- EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
    - v = d ÷ t ; d = v × t ; t = d ÷ v.
    - 'Les unités doivent aller ensemble : km et h donnent des km/h.'
    competences:
    - Calculer une vitesse moyenne.
    - Calculer une distance parcourue.
    - Calculer une durée de trajet.
pourquoi:
- 'Aujourd’hui, trois notions : la vitesse moyenne, la distance parcourue, la durée d’un trajet.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — La vitesse moyenne
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: 'La vitesse moyenne dit quelle distance on parcourt, en moyenne, en une unité de temps : en 1 heure, en 1 minute…'
    -   type: paragraphe
        texte: Un cheval au trot à 15 km/h parcourt 15 km en 1 heure.
    -   type: paragraphe
        texte: 'À retenir : Vitesse moyenne = distance ÷ durée. Distance en km et durée en h → vitesse en km/h.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Repère la distance et la durée.
        - Vérifie les unités (km et h, ou m et min).
        - Divise la distance par la durée.
        - 'Écris l’unité : km/h (ou m/min).'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. En raisonnant avec « en 1 heure »
    -   type: liste
        elements:
        - Une jument fait 30 km en 2 h, à allure régulière.
        - 'En 1 h, elle fait la moitié : 30 ÷ 2 = 15 km. Sa vitesse est 15 km/h.'
    -   type: paragraphe
        texte: 2. Pourquoi « moyenne »
    -   type: liste
        elements:
        - Le cheval ne va pas toujours à la même allure (pas, trot, galop).
        - La vitesse moyenne, c’est la vitesse régulière qui ferait le même trajet dans le même temps.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée. Donne les vitesses en km/h, sauf si l’énoncé dit autre chose.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Un cheval parcourt 20 km en 2 h. Vitesse moyenne ?
        unite: km/h
        aide: v = d ÷ t = 20 ÷ 2.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Une randonnée de 36 km dure 4 h. Vitesse moyenne ?
        unite: km/h
        aide: v = 36 ÷ 4.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Un trotteur fait 45 km en 3 h. Vitesse moyenne ?
        unite: km/h
        aide: v = 45 ÷ 3.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Un cheval au pas fait 3 km en 0,5 h. Vitesse moyenne ?
        unite: km/h
        aide: v = 3 ÷ 0,5.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Un cheval galope 1 000 m en 2 min. Vitesse en m/min ?
        unite: m/min
        aide: 'Ici, d en m et t en min : v en m/min.'
        calcul: true
    -   id: q06
        type: nombre
        enonce: Une randonnée de 27 km dure 1,5 h. Vitesse moyenne ?
        unite: km/h
        aide: v = 27 ÷ 1,5.
        calcul: true
    -   id: q07
        type: qcm
        enonce: 'Série B — Cheval A : 30 km en 3 h. Cheval B : 22 km en 2 h. Lequel est le plus rapide ?'
        choix:
        -   id: a
            texte: Le cheval A
        -   id: b
            texte: Le cheval B
        -   id: c
            texte: Ils vont aussi vite
        aide: Calcule les deux vitesses, puis compare.
-   id: a02
    titre: Partie 2 — Calculer une distance
    transition: 'Tu sais calculer une vitesse. Deuxième notion : trouver la distance quand on connaît la vitesse et la durée.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Si on connaît la vitesse et la durée, on peut calculer la distance parcourue.
    -   type: paragraphe
        texte: À 12 km/h pendant 2 h, on fait 12 km la première heure et 12 km la deuxième.
    -   type: paragraphe
        texte: 'À retenir : Distance = vitesse × durée (d = v × t).'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Repère la vitesse et la durée.
        - Vérifie que les unités vont ensemble (km/h avec des heures).
        - Multiplie la vitesse par la durée.
        - 'Écris l’unité : km.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. En raisonnant heure par heure
    -   type: liste
        elements:
        - À 12 km/h, chaque heure ajoute 12 km.
        - 'En 3 h : 12 + 12 + 12 = 3 × 12 = 36 km.'
    -   type: paragraphe
        texte: 2. Pourquoi c’est la même formule « retournée »
    -   type: liste
        elements:
        - 'v = d ÷ t veut dire : d partagé en t parts égales donne v.'
        - 'Donc t parts de v redonnent d : d = v × t.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée. Donne les distances en km.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Un cheval va à 10 km/h pendant 3 h. Distance ?
        unite: km
        aide: d = v × t.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Un cheval va à 6 km/h pendant 2 h. Distance ?
        unite: km
        aide: d = 6 × 2.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Un trotteur va à 15 km/h pendant 4 h. Distance ?
        unite: km
        aide: d = 15 × 4.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Un cheval va à 8 km/h pendant 0,5 h. Distance ?
        unite: km
        aide: d = 8 × 0,5.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Un cheval va à 12 km/h pendant 2,5 h. Distance ?
        unite: km
        aide: d = 12 × 2,5.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Un cheval galope à 600 m/min pendant 3 min. Distance en m ?
        unite: m
        aide: d = v × t, en m.
        calcul: true
    -   id: q07
        type: nombre
        enonce: 'Série B — Une randonnée : 2 h à 6 km/h, puis 1 h à 12 km/h. Distance totale ?'
        unite: km
        aide: Calcule les deux distances, puis additionne.
        calcul: true
-   id: a03
    titre: Partie 3 — Calculer une durée
    transition: 'Dernière notion : trouver le temps de trajet quand on connaît la distance et la vitesse.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Si on connaît la distance et la vitesse, on peut calculer la durée du trajet.
    -   type: paragraphe
        texte: 'On se demande : combien de fois la distance d’une heure tient-elle dans la distance totale ?'
    -   type: paragraphe
        texte: 'À retenir : Durée = distance ÷ vitesse (t = d ÷ v). km et km/h → durée en h.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Repère la distance et la vitesse.
        - Divise la distance par la vitesse.
        - Le résultat est en heures (si v est en km/h).
        - 'Contrôle : vitesse × durée doit redonner la distance.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. En raisonnant avec « en 1 heure »
    -   type: liste
        elements:
        - À 10 km/h, on fait 10 km en 1 heure.
        - 'Pour 30 km, il faut 3 fois 10 km, donc 3 heures : 30 ÷ 10 = 3 h.'
    -   type: paragraphe
        texte: 2. Le triangle des trois formules
    -   type: liste
        elements:
        - d = v × t est la formule de départ.
        - 'Pour trouver t, on « défait » la multiplication par v : t = d ÷ v.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée. Donne les durées en heures (nombre décimal).
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — 40 km à 10 km/h. Durée ?
        unite: h
        aide: t = d ÷ v.
        calcul: true
    -   id: q02
        type: nombre
        enonce: 18 km à 6 km/h. Durée ?
        unite: h
        aide: t = 18 ÷ 6.
        calcul: true
    -   id: q03
        type: nombre
        enonce: 30 km à 12 km/h. Durée ?
        unite: h
        aide: t = 30 ÷ 12.
        calcul: true
    -   id: q04
        type: nombre
        enonce: 9 km à 6 km/h. Durée ?
        unite: h
        aide: t = 9 ÷ 6.
        calcul: true
    -   id: q05
        type: nombre
        enonce: 2 400 m au galop à 600 m/min. Durée en min ?
        unite: min
        aide: 'Ici, m et m/min : la durée est en minutes.'
        calcul: true
    -   id: q06
        type: qcm
        enonce: Série B — Un élève trouve 2,5 h et écrit « 2 h 50 min ». A-t-il raison ?
        choix:
        -   id: a
            texte: Oui
        -   id: b
            texte: Non, 2,5 h = 2 h 30 min
        -   id: c
            texte: Non, 2,5 h = 2 h 05 min
        aide: 0,5 h, c’est une demi-heure. Combien de minutes dans une demi-heure ?
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: 48 km en 4 h. Vitesse ?
        unite: km/h
        calcul: true
    -   id: q02
        type: nombre
        enonce: 9 km/h pendant 3 h. Distance ?
        unite: km
        calcul: true
    -   id: q03
        type: nombre
        enonce: 25 km à 10 km/h. Durée en h ?
        unite: h
        calcul: true
    -   id: q04
        type: nombre
        enonce: 16 km/h pendant 0,25 h. Distance ?
        unite: km
        calcul: true
    -   id: q05
        type: nombre
        enonce: Un cheval fait 3 600 m en 6 min. Vitesse en m/min ?
        unite: m/min
        calcul: true
    -   id: q06
        type: nombre
        enonce: 'A : 40 km en 5 h ; B : 27 km en 3 h. Vitesse du plus rapide en km/h ?'
        unite: km/h
        calcul: true
retenir:
- Vitesse = distance ÷ durée (v = d ÷ t).
- Distance = vitesse × durée (d = v × t).
- Durée = distance ÷ vitesse (t = d ÷ v).
- 'Unités qui vont ensemble : km, h et km/h ; m, s et m/s ; m, min et m/min.'
