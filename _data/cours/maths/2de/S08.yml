titre: 'Séance 8 : À quelle vitesse trotte mon cheval ?'
themes:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment calculer une vitesse à partir d’une distance et d’une durée ?
competences_bo:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
        - Vitesse = distance ÷ durée ; v = d / t.
        - 'Unités : m/s, m/min, km/h ; on garde des unités cohérentes.'
    competences:
        - Calculer une vitesse moyenne.
        - Calculer une distance ou une durée.
pourquoi:
    - En 2de pro hippique, tu dois savoir calculer une vitesse (allures, entraînement).
    - 'Aujourd’hui : chronométrer le trot sur une piste de 400 m.'
activites:
    -   id: a01
        titre: La vitesse moyenne
        consigne: Tu vas calculer la vitesse d’un cheval qui trotte 400 m en 1 min 20 s, en m/s et en m/min. On attend les deux vitesses.
        contenu:
            -   type: liste
                elements:
                    - 'Automatisme : convertis 1 min 20 s en secondes.'
            -   type: etapes
                elements:
                    - Un cheval trotte 400 m en 1 min 20 s (80 s).
                    - Calcule en m/s, puis en m/min.
            -   type: paragraphe
                texte: Pourquoi deux unités ? Les fiches d’entraînement utilisent souvent m/min.
        questions:
            -   id: q01
                type: nombre
                enonce: Vitesse en m/s ?
                unite: m/s
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: nombre
                enonce: Vitesse en m/min ?
                unite: m/min
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a02
        titre: Distance et durée
        transition: Tu sais calculer une vitesse. Calcule maintenant une distance et une durée.
        consigne: Tu vas calculer une distance et une durée à partir d’une vitesse donnée. On attend deux résultats avec leur unité.
        contenu:
            -   type: etapes
                elements:
                    - Utilise d = v × t et t = d ÷ v.
                    - Calcule.
            -   type: paragraphe
                texte: 'Pourquoi ces formules ? On prépare une séance : quelle distance en 10 min de trot ?'
        questions:
            -   id: q01
                type: nombre
                enonce: À 300 m/min, quelle distance en 10 min ?
                unite: m
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: nombre
                enonce: Au galop de travail à 450 m/min, combien de minutes pour 1 800 m ?
                unite: min
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a03
        titre: Comparer des allures
        transition: Tu as des vitesses. Que signifient-elles ?
        consigne: Tu vas situer la vitesse calculée parmi les repères d’allures (document 1). On attend l’allure correspondante.
        contenu:
            -   type: tableau
                titre: Document 1 — Repères de vitesse (ordres de grandeur)
                colonnes:
                    - Allure
                    - Vitesse (ordre de grandeur, m/min)
                lignes:
                    -   - Pas
                        - 100 à 120
                    -   - Trot de travail
                        - 250 à 350
                    -   - Galop de travail
                        - 350 à 500
            -   type: etapes
                elements:
                    - Lis les repères (document 1).
                    - Classe ton cheval de la mission 1.
            -   type: paragraphe
                texte: Pourquoi des repères ? Ils aident à doser l’effort.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, à quelle allure correspond 300 m/min ?
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un chronomètre a une erreur de ±1 s.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle vitesse si le temps vaut 81 s au lieu de 80 s ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais calculer une vitesse. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment calculer une vitesse à partir d’une distance et d’une durée ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - v = d / t ; d = v × t ; t = d / v.
    - Unités cohérentes.
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
