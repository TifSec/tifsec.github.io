titre: 'Séance 6 : La facture du maréchal-ferrant : HT, TVA, TTC'
themes:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment passer d’un prix hors taxes à un prix toutes taxes comprises ?
competences_bo:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
        - TTC = HT × (1 + taux de TVA) ; HT = TTC ÷ (1 + taux).
        - 'Les taux de TVA varient selon les activités équestres : on lit toujours celui indiqué sur la facture.'
    competences:
        - Calculer un prix TTC et un prix HT.
        - Vérifier une facture.
pourquoi:
    - En S05, tu as utilisé des coefficients.
    - 'La TVA est une augmentation en pourcentage : tu sais déjà la calculer.'
activites:
    -   id: a01
        titre: Du HT au TTC
        consigne: Tu vas calculer le total HT puis TTC de la facture du maréchal-ferrant (document 1). On attend les deux totaux.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Le maréchal-ferrant envoie sa facture hors taxes. Combien le propriétaire va-t-il vraiment payer ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Le prix HT (hors taxes) est le prix sans la TVA. La TVA est une taxe en pourcentage du HT. Le prix TTC (toutes taxes comprises) est ce que paie le client.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Calculer et comprendre une facture de soins, de matériel, de pension.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - 'On fait le total HT de la facture (chaque ligne : quantité × prix).'
                    - 'On multiplie le HT par (1 + taux) : × 1,2 pour une TVA de 20 %.'
                    - 'Vérification : TVA = HT × 20 ÷ 100, puis HT + TVA.'
            -   type: paragraphe
                texte: 'À retenir : TTC = HT × (1 + taux) ; TVA 20 % → × 1,2.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Une prestation coûte 70 € HT, TVA 20 %. Prix TTC ?
                    - 'Une facture : 3 × 25 € HT + 15 € HT de déplacement, TVA 20 %. Total TTC ?'
            -   type: liste
                elements:
                    - 'Automatisme : calcule 20 % de 150 de tête.'
            -   type: liste
                elements:
                    - 'Parage : 4 × 30 € HT.'
                    - 'Déplacement : 30 € HT.'
                    - 'TVA : 20 % (taux indiqué sur la facture fictive).'
            -   type: paragraphe
                texte: Données fictives créées pour l’exercice (ordres de grandeur réalistes).
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : lis la facture (document 1), fais le total HT, puis calcule le TTC.'
                    - Pourquoi × 1,2 ? La TVA ajoute 20 % au prix hors taxes.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - TTC = HT × (1 + …… ).
                        - ''
                    -   - Avec une TVA de 20 %, TTC = HT × …… .
                        - ''
                aide: 'Relis l’exemple : HT × (1 + quoi) ? Et 1 + 20 %, ça fait quel coefficient ?'
            -   id: q02
                type: nombre
                enonce: D’après le document 1, quel est le total HT ?
                unite: €
                aide: Additionne les lignes HT de la facture du document 1 (quantité × prix unitaire pour chaque ligne).
            -   id: q03
                type: nombre
                enonce: Quel est le total TTC ?
                unite: €
                aide: Multiplie le total HT par le coefficient de la TVA à 20 %.
    -   id: a02
        titre: Du TTC au HT
        transition: Tu sais ajouter la TVA. Peux-tu l’enlever ?
        consigne: Tu vas retrouver le prix HT d’un ferrage payé 96 € TTC. On attend le prix HT et l’erreur à éviter.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Un client a payé 96 € TTC pour un ferrage. Pour sa comptabilité, le maréchal a besoin du prix HT.
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Retrouver le HT, c’est faire le chemin inverse du calcul du TTC.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Tenir une comptabilité en HT.
                    - Comparer des prix affichés TTC.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - Le TTC a été obtenu en multipliant le HT par 1,2.
                    - Pour revenir au HT, on divise le TTC par 1,2.
                    - 'On vérifie : HT × 1,2 doit redonner le TTC.'
            -   type: paragraphe
                texte: 'À retenir : HT = TTC ÷ (1 + taux) ; on ne retire pas 20 % du TTC.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Un client paie 60 € TTC (TVA 20 %). Prix HT ?
                    - Un client paie 132 € TTC (TVA 10 %). Prix HT ?
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : un client paie 96 € TTC pour un ferrage (TVA 20 %). Calcule le prix HT.'
                    - Pourquoi diviser ? On fait le chemin inverse de la multiplication.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Pour retrouver le HT, on …… le TTC par 1,2.
                        - ''
                    -   - On ne retire pas 20 % du …… .
                        - ''
                aide: Pour revenir en arrière, on fait l’opération inverse de « × 1,2 ». Et sur quel prix se calcule la TVA ?
            -   id: q02
                type: nombre
                enonce: Quel est le prix HT ?
                unite: €
                aide: 'Le prix TTC est 96 € : fais l’opération inverse de × 1,2.'
            -   id: q03
                type: texte
                enonce: Pourquoi ne faut-il pas enlever 20 % de 96 ?
                aide: 'Les 20 % de TVA ont été calculés sur quel prix ? Vérifie : 76,80 × 1,2 donne-t-il 96 ?'
    -   id: a03
        titre: Vérifier une facture
        transition: Tu maîtrises les deux sens. Vérifie une vraie facture.
        consigne: Tu vas vérifier la facture de Lucas (document 2) et trouver l’erreur. On attend l’erreur et le bon total.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Lucas a reçu une facture qui lui semble trop chère. Y a-t-il une erreur ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Vérifier une facture, c’est refaire chaque calcul pour contrôler les montants.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Ne pas payer trop, ne pas perdre de client par une erreur.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - On refait le total HT.
                    - On recalcule la TVA sur le HT.
                    - On refait HT + TVA et on compare au TTC annoncé.
            -   type: paragraphe
                texte: 'À retenir : La TVA se calcule sur le prix HT.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - 'Facture : HT 300 €, TVA 20 % : 66 €, TTC 366 €. Où est l’erreur ?'
            -   type: liste
                elements:
                    - 'Total HT : 200 €.'
                    - 'TVA 20 % : 42 €.'
                    - 'Total TTC : 242 €.'
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : lis la facture de Lucas (document 2), refais chaque calcul et trouve l’erreur.'
                    - Pourquoi vérifier ? Une erreur de facture fait perdre de l’argent ou un client.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Pour vérifier une facture, on …… chaque calcul.
                        - ''
                    -   - La TVA se calcule sur le prix …… .
                        - ''
                aide: Vérifier une facture, c’est faire quoi avec chaque ligne ? Et la TVA se calcule sur HT ou TTC ?
            -   id: q02
                type: texte
                enonce: D’après le document 2, quelle est l’erreur, et quel est le bon total TTC ?
                aide: Dans le document 2, refais le total HT, puis la TVA à 20 % de ce total. Compare avec la facture.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une remise de 10 % est faite sur le HT avant TVA.
        questions:
            -   id: q01
                type: texte
                enonce: Quel TTC pour 150 € HT ?
                aide: La remise vient d’abord (× 0,9 sur le HT), puis la TVA (× 1,2).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais calculer HT et TTC. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment passer d’un prix hors taxes à un prix toutes taxes comprises ?'
                aide: Donne les deux formules (HT vers TTC, TTC vers HT) et la méthode pour vérifier une facture.
retenir:
    - TTC = HT × 1,2 (TVA 20 %).
    - HT = TTC ÷ 1,2.
