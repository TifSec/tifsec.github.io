titre: 'Séance 6 : Prix HT, TVA et prix TTC'
themes:
- EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment passer d’un prix hors taxes à un prix toutes taxes comprises, et inversement ?
competences_bo:
- EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
    - TVA = HT × taux ; TTC = HT + TVA.
    - TTC = HT × (1 + taux) ; HT = TTC ÷ (1 + taux).
    competences:
    - Calculer une TVA et un prix TTC.
    - Retrouver un prix HT à partir d’un prix TTC.
    - Vérifier une facture.
pourquoi:
- 'Aujourd’hui, trois notions : la TVA et le prix TTC, le calcul en un seul coup avec le coefficient, puis le retour au prix HT.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — La TVA et le prix TTC
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Le prix HT (hors taxes) est le prix sans la taxe. La TVA est une taxe en pourcentage du prix HT.
    -   type: paragraphe
        texte: 'Le prix TTC (toutes taxes comprises) est ce que le client paie vraiment : le HT plus la TVA.'
    -   type: paragraphe
        texte: 'À retenir : TVA = HT × taux ; TTC = HT + TVA.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Écris le taux de TVA en nombre décimal (20 % = 0,20 ; 10 % = 0,10 ; 5,5 % = 0,055).
        - Calcule la TVA = HT × taux.
        - Calcule le TTC = HT + TVA.
        - 'Contrôle : le TTC est toujours plus grand que le HT.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. En raisonnant avec « sur 100 »
    -   type: liste
        elements:
        - TVA de 20 % veut dire 20 € de taxe pour 100 € de prix HT.
        - 'Pour 50 € HT, c’est la moitié de 100 € : la TVA est la moitié de 20 €, soit 10 €.'
        - 'Le client paie le prix et la taxe : 50 + 10 = 60 €.'
    -   type: paragraphe
        texte: 2. Pourquoi on multiplie par 0,20
    -   type: liste
        elements:
        - 20 % = 20/100 = 0,20.
        - 'Prendre 20 % d’un prix, c’est le multiplier par 0,20 : 50 × 0,20 = 10 €.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée. Les prix sont en euros.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Un parage coûte 40 € HT. TVA 20 %. Calcule la TVA.
        unite: €
        aide: TVA = HT × 0,20.
    -   id: q02
        type: nombre
        enonce: Un vermifuge coûte 15 € HT. TVA 20 %. Calcule la TVA.
        unite: €
        aide: TVA = HT × 0,20.
    -   id: q03
        type: nombre
        enonce: Une selle coûte 650 € HT. TVA 20 %. Calcule la TVA.
        unite: €
        aide: TVA = HT × 0,20.
    -   id: q04
        type: nombre
        enonce: Série B — Un parage coûte 40 € HT. TVA 20 %. Calcule le prix TTC.
        unite: €
        aide: Calcule la TVA, puis ajoute-la au HT.
    -   id: q05
        type: nombre
        enonce: Une selle coûte 650 € HT. TVA 20 %. Calcule le prix TTC.
        unite: €
        aide: TTC = HT + TVA.
    -   id: q06
        type: nombre
        enonce: Un cours d’équitation coûte 30 € HT. TVA 5,5 %. Calcule la TVA.
        unite: €
        aide: 5,5 % s’écrit 0,055. TVA = 30 × 0,055.
    -   id: q07
        type: nombre
        enonce: Une pension coûte 300 € HT. TVA 10 %. Calcule le prix TTC.
        unite: €
        aide: TVA = 300 × 0,10, puis TTC = HT + TVA.
-   id: a02
    titre: Partie 2 — Le prix TTC en un seul calcul
    transition: 'Tu sais calculer le TTC en deux étapes. Deuxième notion : le faire en un seul calcul.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: On peut passer du HT au TTC en une seule multiplication, avec un coefficient.
    -   type: paragraphe
        texte: 'Pour une TVA de 20 %, le coefficient est 1,2 : on garde le prix HT (1) et on ajoute 20 % (0,2).'
    -   type: paragraphe
        texte: 'À retenir : TTC = HT × (1 + taux). TVA 20 % → × 1,2 ; 10 % → × 1,1 ; 5,5 % → × 1,055.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Écris le taux en nombre décimal.
        - Ajoute 1 au taux pour obtenir le coefficient (1 + 0,20 = 1,2).
        - Multiplie le HT par ce coefficient.
        - 'Contrôle : tu dois trouver le même résultat qu’en deux étapes.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. En raisonnant avec les pourcentages
    -   type: liste
        elements:
        - Le prix HT représente 100 % (soit 1).
        - Avec 20 % de TVA, le client paie 100 % + 20 % = 120 % du HT.
        - « 120 % de quelque chose » s’écrit 120/100, ce qui est égal à 1,2.
    -   type: paragraphe
        texte: 2. En regroupant les deux étapes en une seule
    -   type: liste
        elements:
        - 'En deux étapes, pour 50 € HT : TTC = 50 (1 fois le prix) + 50 × 0,2 (0,2 fois le prix).'
        - 'Si tu regroupes le nombre 50 (on appelle cela factoriser) : TTC = 50 × (1 + 0,2) = 50 × 1,2.'
        - Le 1 garde le prix HT, et le 0,2 ajoute directement la TVA.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Calculatrice autorisée. Utilise le coefficient : un seul calcul.'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Quel est le coefficient pour passer du HT au TTC avec une TVA de 20 % ?
        aide: 1 + 0,20.
    -   id: q02
        type: nombre
        enonce: Quel est le coefficient avec une TVA de 10 % ?
        aide: 1 + 0,10.
    -   id: q03
        type: nombre
        enonce: Quel est le coefficient avec une TVA de 5,5 % ?
        aide: 1 + 0,055.
    -   id: q04
        type: nombre
        enonce: Série B — Un licol coûte 25 € HT. TVA 20 %. Calcule le TTC avec le coefficient.
        unite: €
        aide: TTC = 25 × 1,2.
    -   id: q05
        type: nombre
        enonce: Une couverture coûte 120 € HT. TVA 20 %. Calcule le TTC.
        unite: €
        aide: TTC = 120 × 1,2.
    -   id: q06
        type: nombre
        enonce: Une visite du vétérinaire coûte 75 € HT. TVA 20 %. Calcule le TTC.
        unite: €
        aide: TTC = 75 × 1,2.
    -   id: q07
        type: nombre
        enonce: Une pension coûte 420 € HT. TVA 10 %. Calcule le TTC.
        unite: €
        aide: TTC = 420 × 1,1.
-   id: a03
    titre: Partie 3 — Retrouver le prix HT
    transition: 'Tu sais aller du HT au TTC. Dernière notion : faire le chemin dans l’autre sens.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Sur un ticket, on voit souvent seulement le prix TTC. Pour retrouver le prix HT, on fait l’opération inverse.
    -   type: paragraphe
        texte: L’inverse de « multiplier par 1,2 », c’est « diviser par 1,2 ».
    -   type: paragraphe
        texte: 'À retenir : HT = TTC ÷ (1 + taux). TVA 20 % → ÷ 1,2.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Trouve le coefficient (1,2 pour 20 %).
        - Divise le TTC par ce coefficient.
        - 'Contrôle : multiplie ton HT par 1,2, tu dois retrouver le TTC.'
        - 'Piège : on n’enlève jamais 20 % du TTC.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. En raisonnant avec les pourcentages
    -   type: liste
        elements:
        - Le TTC représente 120 % du HT. On cherche les 100 %.
        - Si 120 % = 60 €, alors 1 % = 60 ÷ 120 = 0,50 €, et 100 % = 50 €.
        - C’est la même chose que 60 ÷ 1,2 = 50 €.
    -   type: paragraphe
        texte: 2. Pourquoi on n’enlève pas 20 % du TTC
    -   type: liste
        elements:
        - 20 % de TVA, c’est 20 % du HT, pas du TTC.
        - 'Si on enlève 20 % de 60 €, on enlève 12 € et on trouve 48 € : faux, car 48 × 1,2 = 57,60 €, pas 60 €.'
        - 'Diviser par 1,2 défait exactement la multiplication par 1,2 : 50 × 1,2 = 60, donc 60 ÷ 1,2 = 50.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée. Divise par le coefficient.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Un filet coûte 36 € TTC, TVA 20 %. Calcule le prix HT.
        unite: €
        aide: HT = TTC ÷ 1,2.
    -   id: q02
        type: nombre
        enonce: Une couverture coûte 96 € TTC, TVA 20 %. Calcule le prix HT.
        unite: €
        aide: HT = TTC ÷ 1,2.
    -   id: q03
        type: nombre
        enonce: Une selle coûte 1 200 € TTC, TVA 20 %. Calcule le prix HT.
        unite: €
        aide: HT = TTC ÷ 1,2.
    -   id: q04
        type: nombre
        enonce: Une pension coûte 385 € TTC, TVA 10 %. Calcule le prix HT.
        unite: €
        aide: HT = TTC ÷ 1,1.
    -   id: q05
        type: nombre
        enonce: Série B — Une selle coûte 1 200 € TTC, TVA 20 %. Combien de TVA contient ce prix ?
        unite: €
        aide: Calcule d’abord le HT, puis TVA = TTC − HT.
    -   id: q06
        type: qcm
        enonce: 'Un élève dit : « 60 € TTC, j’enlève 20 %, donc le HT est 48 €. » A-t-il raison ?'
        choix:
        -   id: a
            texte: Oui, le HT est 48 €.
        -   id: b
            texte: Non, le HT est 50 €.
        -   id: c
            texte: Non, le HT est 72 €.
        aide: 'Fais le contrôle : multiplie 48 par 1,2. Retrouves-tu 60 ?'
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: Un ferrage coûte 90 € HT. TVA 20 %. Prix TTC ?
        unite: €
    -   id: q02
        type: nombre
        enonce: Un cours coûte 20 € HT. TVA 5,5 %. Prix TTC ?
        unite: €
    -   id: q03
        type: nombre
        enonce: Un tapis coûte 42 € TTC. TVA 20 %. Prix HT ?
        unite: €
    -   id: q04
        type: nombre
        enonce: Une pension coûte 495 € TTC. TVA 10 %. Prix HT ?
        unite: €
    -   id: q05
        type: nombre
        enonce: Un produit coûte 150 € HT et 180 € TTC. Quel est le taux de TVA en % ?
        unite: '%'
    -   id: q06
        type: nombre
        enonce: 'Facture : 3 fers à 24 € HT pièce, TVA 20 %. Total TTC ?'
        unite: €
retenir:
- 'HT : prix sans la taxe. TVA : la taxe. TTC : ce que paie le client.'
- TVA = HT × taux ; TTC = HT + TVA.
- 'TTC = HT × (1 + taux) : × 1,2 pour 20 % ; × 1,1 pour 10 % ; × 1,055 pour 5,5 %.'
- HT = TTC ÷ (1 + taux). On ne retire jamais 20 % du TTC.
