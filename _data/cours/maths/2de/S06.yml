titre: 'Séance 6 : La facture du maréchal-ferrant : HT, TVA, TTC'
themes:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment passer d’un prix hors taxes à un prix toutes taxes comprises ?
competences_bo:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
        - TTC = HT × (1 + taux de TVA) ; HT = TTC ÷ (1 + taux).
        - 'Les taux de TVA varient selon les activités équestres : on lit toujours celui indiqué sur la facture.'
    competences:
        - Calculer un prix TTC et un prix HT.
        - Vérifier une facture.
pourquoi:
    - En S05, tu as utilisé des coefficients.
    - 'La TVA est une augmentation en pourcentage : tu sais déjà la calculer.'
activites:
    -   id: a01
        titre: Du HT au TTC
        consigne: Tu vas calculer le total HT puis TTC de la facture du maréchal-ferrant (document 1). On attend les deux totaux.
        contenu:
            -   type: liste
                elements:
                    - 'Automatisme : calcule 20 % de 150 de tête.'
            -   type: liste
                elements:
                    - 'Parage : 4 × 30 € HT.'
                    - 'Déplacement : 30 € HT.'
                    - 'TVA : 20 % (taux indiqué sur la facture fictive).'
            -   type: paragraphe
                texte: Données fictives créées pour l’exercice (ordres de grandeur réalistes).
            -   type: etapes
                elements:
                    - 'Lis la facture (document 1) : taux de TVA 20 %.'
                    - TTC = HT × 1,2.
            -   type: paragraphe
                texte: Pourquoi × 1,2 ? La TVA ajoute 20 % au prix hors taxes.
        questions:
            -   id: q01
                type: nombre
                enonce: D’après le document 1, quel est le total HT ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: nombre
                enonce: Quel est le total TTC ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a02
        titre: Du TTC au HT
        transition: Tu sais ajouter la TVA. Peux-tu l’enlever ?
        consigne: Tu vas retrouver le prix HT d’un ferrage payé 96 € TTC. On attend le prix HT et l’erreur à éviter.
        contenu:
            -   type: etapes
                elements:
                    - Un client paie 96 € TTC pour un ferrage (TVA 20 %).
                    - HT = 96 ÷ 1,2.
            -   type: paragraphe
                texte: Pourquoi diviser ? On fait le chemin inverse de la multiplication.
        questions:
            -   id: q01
                type: nombre
                enonce: Quel est le prix HT ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: texte
                enonce: Pourquoi ne faut-il pas enlever 20 % de 96 ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a03
        titre: Vérifier une facture
        transition: Tu maîtrises les deux sens. Vérifie une vraie facture.
        consigne: Tu vas vérifier la facture de Lucas (document 2) et trouver l’erreur. On attend l’erreur et le bon total.
        contenu:
            -   type: liste
                elements:
                    - 'Total HT : 200 €.'
                    - 'TVA 20 % : 42 €.'
                    - 'Total TTC : 242 €.'
            -   type: etapes
                elements:
                    - Lis la facture de Lucas (document 2).
                    - Refais les calculs ; trouve l’erreur.
            -   type: paragraphe
                texte: Pourquoi vérifier ? Une erreur de facture fait perdre de l’argent ou un client.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 2, quelle est l’erreur, et quel est le bon total TTC ?
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une remise de 10 % est faite sur le HT avant TVA.
        questions:
            -   id: q01
                type: texte
                enonce: Quel TTC pour 150 € HT ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais calculer HT et TTC. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment passer d’un prix hors taxes à un prix toutes taxes comprises ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - TTC = HT × 1,2 (TVA 20 %).
    - HT = TTC ÷ 1,2.
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
