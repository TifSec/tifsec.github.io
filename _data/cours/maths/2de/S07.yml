titre: 'Séance 7 : Lire le plan de l’écurie'
themes:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
    - EG4, 1-6 — Utiliser des outils et des raisonnements en géométrie
problematique: Comment utiliser une échelle pour passer du plan à la réalité ?
competences_bo:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
    - EG4, 1-6 — Utiliser des outils et des raisonnements en géométrie
objectifs:
    connaissances:
        - 'Une échelle 1/200 signifie : 1 cm sur le plan = 200 cm (2 m) dans la réalité.'
        - Longueur réelle = longueur plan × 200 (en cm), puis conversion.
    competences:
        - Calculer une longueur réelle.
        - Calculer une longueur sur le plan.
pourquoi:
    - 'L’écurie veut agrandir ses boxes : le plan est à l’échelle 1/200.'
    - Tu vas lire les vraies dimensions.
activites:
    -   id: a01
        titre: Du plan au réel
        consigne: Tu vas calculer les dimensions réelles d’un box à partir du plan à l’échelle 1/200. On attend la largeur et la longueur en mètres.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Sur le plan de l’écurie, un box mesure 1,5 cm sur 2 cm. Quelles sont ses vraies dimensions ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Une échelle indique le rapport entre les longueurs du plan et les longueurs réelles. 1/200 veut dire que 1 cm sur le plan représente 200 cm dans la réalité.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Lire un plan d’écurie, de carrière, une carte.
                    - Prévoir un aménagement avant de construire.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - On mesure la longueur sur le plan (en cm).
                    - 'On la multiplie par le dénominateur de l’échelle (200) : on obtient des cm réels.'
                    - On convertit en mètres (÷ 100).
            -   type: paragraphe
                texte: 'À retenir : Longueur réelle = longueur sur le plan × 200.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Sur un plan à 1/200, une allée mesure 5 cm. Longueur réelle ?
                    - Sur un plan à 1/100, une porte mesure 1,2 cm. Largeur réelle ?
            -   type: liste
                elements:
                    - 'Automatisme : convertis 300 cm en m.'
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : sur le plan, un box mesure 1,5 cm × 2 cm. Multiplie par 200, puis convertis en mètres.'
                    - Pourquoi convertir ? Les dimensions d’un box se donnent en mètres.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Échelle 1/200 : 1 cm sur le plan représente …… cm en réalité.'
                        - ''
                    -   - Longueur réelle = longueur sur le plan × …… .
                        - ''
                aide: 'Échelle 1/200 : 1 cm sur le plan représente combien de cm en vrai ? Donc par quoi multiplier ?'
            -   id: q02
                type: nombre
                enonce: Quelle est la largeur réelle du box (1,5 cm sur le plan) ?
                unite: m
                aide: '1,5 cm × 200 donne des cm : convertis ensuite en mètres (÷ 100).'
            -   id: q03
                type: nombre
                enonce: Quelle est la longueur réelle (2 cm sur le plan) ?
                unite: m
                aide: 'Même méthode : 2 cm × 200, puis convertis en mètres.'
    -   id: a02
        titre: La surface du box
        transition: Tu as les dimensions. Le box est-il assez grand ?
        consigne: Tu vas calculer la surface du box et la comparer au repère de bien-être (document 1). On attend la surface et ta conclusion.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Le box est-il assez grand pour le bien-être d’un cheval de 1,65 m au garrot ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: La surface (ou aire) mesure la place au sol. Pour un rectangle, c’est longueur × largeur, en mètres carrés (m²).
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Vérifier qu’un box respecte un repère de bien-être.
                    - Calculer une quantité de litière, de sol à refaire.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - On utilise les dimensions réelles, en mètres.
                    - On multiplie longueur × largeur.
                    - 'On compare au repère : surface ≈ (2 × hauteur au garrot)².'
            -   type: paragraphe
                texte: 'À retenir : Surface d’un rectangle = longueur × largeur (en m²).'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Surface d’un box de 3,5 m × 3 m ?
                    - Repère pour un poney de 1,40 m au garrot ?
            -   type: paragraphe
                texte: 'Document 1 — Repère souvent cité : surface du box ≈ (2 × hauteur au garrot)² ; côté minimal ≈ 1,5 × hauteur au garrot.'
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : calcule la surface réelle de ton box, puis compare-la à la recommandation (document 1).'
                    - Pourquoi comparer ? Un box trop petit nuit au bien-être du cheval.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Surface d’un rectangle = longueur × …… .
                        - ''
                    -   - Une surface s’exprime en …… carrés.
                        - ''
                aide: 'Pense à un box rectangulaire : on multiplie la longueur par quoi ? Et une surface en mètres s’écrit avec quelle unité ?'
            -   id: q02
                type: nombre
                enonce: Quelle est la surface du box ?
                unite: m²
                aide: Multiplie la largeur réelle par la longueur réelle trouvées à la mission 1.
            -   id: q03
                type: texte
                enonce: D’après le document 1, ce box convient-il à un cheval de 1,65 m au garrot ?
                aide: 'Applique la règle du document 1 : (2 × hauteur au garrot)². Compare le résultat à la surface du box.'
    -   id: a03
        titre: Du réel au plan
        transition: Tu sais lire un plan. Dessine maintenant un élément nouveau.
        consigne: Tu vas calculer les dimensions sur le plan d’un paddock de 30 m × 20 m. On attend les deux longueurs en cm.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: On veut dessiner le nouveau paddock de 30 m × 20 m sur le plan à 1/200. Quelles dimensions tracer ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: 'Passer du réel au plan, c’est faire le chemin inverse : on divise par le dénominateur de l’échelle.'
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Dessiner un projet d’aménagement à l’échelle.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - On convertit la longueur réelle en cm (× 100).
                    - On divise par 200.
                    - On trace la longueur obtenue sur le plan.
            -   type: paragraphe
                texte: 'À retenir : Longueur sur le plan = longueur réelle (en cm) ÷ 200.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - 'Une carrière de 40 m : longueur sur le plan à 1/200 ?'
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : le nouveau paddock mesure 30 m × 20 m. Calcule ses dimensions sur le plan à 1/200.'
                    - Pourquoi diviser ? On fait le chemin inverse.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Du réel au plan, on …… par 200.
                        - ''
                    -   - On convertit d’abord les longueurs dans la même …… .
                        - ''
                aide: Du réel vers le plan, on fait l’inverse de × 200. Et avant de calculer, les longueurs doivent être dans quelle même… ?
            -   id: q02
                type: tableau
                enonce: Calcule les dimensions sur le plan.
                colonnes:
                    - Réel
                    - Plan (cm)
                lignes:
                    -   - 30 m
                        - ''
                    -   - 20 m
                        - ''
                aide: Convertis chaque longueur en cm, puis divise par 200.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une carte est au 1/25 000.
        questions:
            -   id: q01
                type: texte
                enonce: Combien de km représentent 4 cm ?
                aide: '4 cm × 25 000 donne des cm. Convertis : 100 cm = 1 m, 1 000 m = 1 km.'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais utiliser une échelle. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment utiliser une échelle pour passer du plan à la réalité ?'
                aide: Dis la règle du plan vers le réel, et celle du réel vers le plan, avec les conversions.
retenir:
    - 'Échelle 1/200 : × 200.'
    - Convertir les unités.
