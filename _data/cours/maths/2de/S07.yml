titre: 'Séance 7 : Lire le plan de l’écurie'
themes:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
    - EG4, 1-6 — Utiliser des outils et des raisonnements en géométrie
problematique: Comment utiliser une échelle pour passer du plan à la réalité ?
competences_bo:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
    - EG4, 1-6 — Utiliser des outils et des raisonnements en géométrie
objectifs:
    connaissances:
        - 'Une échelle 1/200 signifie : 1 cm sur le plan = 200 cm (2 m) dans la réalité.'
        - Longueur réelle = longueur plan × 200 (en cm), puis conversion.
    competences:
        - Calculer une longueur réelle.
        - Calculer une longueur sur le plan.
pourquoi:
    - 'L’écurie veut agrandir ses boxes : le plan est à l’échelle 1/200.'
    - Tu vas lire les vraies dimensions.
activites:
    -   id: a01
        titre: Du plan au réel
        consigne: Tu vas calculer les dimensions réelles d’un box à partir du plan à l’échelle 1/200. On attend la largeur et la longueur en mètres.
        contenu:
            -   type: liste
                elements:
                    - 'Automatisme : convertis 300 cm en m.'
            -   type: etapes
                elements:
                    - Sur le plan, un box mesure 1,5 cm × 2 cm.
                    - Multiplie par 200, puis convertis en mètres.
            -   type: paragraphe
                texte: Pourquoi convertir ? Les dimensions d’un box se donnent en mètres.
        questions:
            -   id: q01
                type: nombre
                enonce: Quelle est la largeur réelle du box (1,5 cm sur le plan) ?
                unite: m
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: nombre
                enonce: Quelle est la longueur réelle (2 cm sur le plan) ?
                unite: m
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a02
        titre: La surface du box
        transition: Tu as les dimensions. Le box est-il assez grand ?
        consigne: Tu vas calculer la surface du box et la comparer au repère de bien-être (document 1). On attend la surface et ta conclusion.
        contenu:
            -   type: paragraphe
                texte: 'Document 1 — Repère souvent cité : surface du box ≈ (2 × hauteur au garrot)² ; côté minimal ≈ 1,5 × hauteur au garrot.'
            -   type: etapes
                elements:
                    - Calcule la surface réelle du box.
                    - Compare à la recommandation (document 1).
            -   type: paragraphe
                texte: Pourquoi comparer ? Un box trop petit nuit au bien-être du cheval.
        questions:
            -   id: q01
                type: nombre
                enonce: Quelle est la surface du box ?
                unite: m²
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: texte
                enonce: D’après le document 1, ce box convient-il à un cheval de 1,65 m au garrot ?
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
    -   id: a03
        titre: Du réel au plan
        transition: Tu sais lire un plan. Dessine maintenant un élément nouveau.
        consigne: Tu vas calculer les dimensions sur le plan d’un paddock de 30 m × 20 m. On attend les deux longueurs en cm.
        contenu:
            -   type: etapes
                elements:
                    - Le nouveau paddock mesure 30 m × 20 m.
                    - Combien de cm sur le plan à 1/200 ?
            -   type: paragraphe
                texte: Pourquoi diviser ? On fait le chemin inverse.
        questions:
            -   id: q01
                type: tableau
                enonce: Calcule les dimensions sur le plan.
                colonnes:
                    - Réel
                    - Plan (cm)
                lignes:
                    -   - 30 m
                        - ''
                    -   - 20 m
                        - ''
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une carte est au 1/25 000.
        questions:
            -   id: q01
                type: texte
                enonce: Combien de km représentent 4 cm ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais utiliser une échelle. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment utiliser une échelle pour passer du plan à la réalité ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Échelle 1/200 : × 200.'
    - Convertir les unités.
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
