titre: 'Séance 7 : Échelles, longueurs et aires sur un plan'
themes:
- EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
- EG4, 1-6 — Utiliser des outils et des raisonnements en géométrie
problematique: Comment passer d’une mesure sur un plan à la vraie mesure, et calculer une surface ?
competences_bo:
- EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
- EG4, 1-6 — Utiliser des outils et des raisonnements en géométrie
objectifs:
    connaissances:
    - 'Échelle 1/200 : 1 cm sur le plan = 200 cm en vrai.'
    - 1 m = 100 cm ; aire d’un rectangle = longueur × largeur (en m²).
    competences:
    - Calculer une longueur réelle à partir du plan.
    - Calculer une aire en m².
    - Calculer une longueur sur le plan à partir de la vraie mesure.
pourquoi:
- 'Aujourd’hui, trois notions : passer du plan au réel, calculer une aire, passer du réel au plan.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — Du plan à la vraie longueur
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Un plan est un dessin réduit. L’échelle dit combien de fois le dessin est plus petit que la réalité.
    -   type: paragraphe
        texte: 'Échelle 1/200 : 1 cm sur le plan représente 200 cm, c’est-à-dire 2 m, en vrai.'
    -   type: paragraphe
        texte: 'À retenir : Longueur réelle = longueur sur le plan × 200 (pour une échelle 1/200).'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Mesure (ou lis) la longueur sur le plan, en cm.
        - 'Multiplie par 200 : tu obtiens la vraie longueur en cm.'
        - Divise par 100 pour l’avoir en mètres.
        - 'Contrôle : la vraie longueur est toujours plus grande que sur le plan.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. En raisonnant avec 1 cm
    -   type: liste
        elements:
        - À l’échelle 1/200, chaque centimètre du plan vaut 200 cm en vrai.
        - '3 cm sur le plan, c’est 3 fois 200 cm : 600 cm.'
    -   type: paragraphe
        texte: 2. Pourquoi on divise ensuite par 100
    -   type: liste
        elements:
        - 1 m = 100 cm. Dans 600 cm, il y a 600 ÷ 100 = 6 paquets de 100 cm, donc 6 m.
        - 'Astuce : 1 cm sur le plan = 2 m en vrai. Donc 3 cm = 3 × 2 = 6 m.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Toutes les longueurs du plan sont à l’échelle 1/200. Donne les réponses en mètres.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Sur le plan, un box mesure 2 cm. Quelle est sa vraie longueur en cm ?
        unite: cm
        aide: Multiplie par 200.
    -   id: q02
        type: nombre
        enonce: Convertis 400 cm en mètres.
        unite: m
        aide: '1 m = 100 cm : divise par 100.'
    -   id: q03
        type: nombre
        enonce: Série B — Sur le plan, la sellerie mesure 3,5 cm. Vraie longueur en m ?
        unite: m
        aide: '× 200, puis ÷ 100 (ou : 1 cm = 2 m).'
    -   id: q04
        type: nombre
        enonce: Sur le plan, le manège mesure 20 cm. Vraie longueur en m ?
        unite: m
        aide: × 200, puis ÷ 100.
    -   id: q05
        type: nombre
        enonce: Sur le plan, l’allée mesure 12,5 cm. Vraie longueur en m ?
        unite: m
        aide: × 200, puis ÷ 100.
    -   id: q06
        type: nombre
        enonce: Sur le plan, une porte mesure 1,6 cm. Vraie largeur en m ?
        unite: m
        aide: × 200, puis ÷ 100.
    -   id: q07
        type: nombre
        enonce: Sur un autre plan à l’échelle 1/100, le paddock mesure 15 cm. Vraie longueur en m ?
        unite: m
        aide: 'À l’échelle 1/100 : × 100.'
-   id: a02
    titre: Partie 2 — L’aire d’un rectangle
    transition: 'Tu sais trouver les vraies longueurs. Deuxième notion : calculer une surface.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: L’aire est la surface occupée au sol, par exemple la place qu’a un cheval dans son box.
    -   type: paragraphe
        texte: 'Elle se mesure en mètres carrés (m²) : 1 m² est un carré de 1 m de côté.'
    -   type: paragraphe
        texte: 'À retenir : Aire d’un rectangle = longueur × largeur. Longueurs en m → aire en m².'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Trouve les vraies longueurs (en m), pas celles du plan.
        - Multiplie la longueur par la largeur.
        - 'Écris l’unité : m².'
        - Pour plusieurs boxes identiques, multiplie l’aire d’un box par le nombre de boxes.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. En comptant les carrés
    -   type: liste
        elements:
        - 'Un box de 4 m sur 3 m : on peut poser 4 carrés de 1 m sur la longueur, et 3 rangées.'
        - 3 rangées de 4 carrés = 12 carrés de 1 m², donc 12 m².
    -   type: paragraphe
        texte: 2. Pourquoi on prend les vraies longueurs
    -   type: liste
        elements:
        - 'Sur le plan, 2 cm × 1,5 cm = 3 cm² : c’est l’aire du dessin, pas du box.'
        - On convertit d’abord chaque longueur en vrai (4 m et 3 m), puis on multiplie.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée. Donne les aires en m².
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Un box mesure 4 m sur 3 m. Quelle est son aire ?
        unite: m²
        aide: Aire = longueur × largeur.
    -   id: q02
        type: nombre
        enonce: Un box mesure 3,5 m sur 3,5 m. Quelle est son aire ?
        unite: m²
        aide: Aire = 3,5 × 3,5.
    -   id: q03
        type: nombre
        enonce: Un paddock mesure 40 m sur 25 m. Quelle est son aire ?
        unite: m²
        aide: Aire = longueur × largeur.
    -   id: q04
        type: nombre
        enonce: Une carrière mesure 60 m sur 20 m. Quelle est son aire ?
        unite: m²
        aide: Aire = longueur × largeur.
    -   id: q05
        type: nombre
        enonce: Série B — 8 boxes de 4 m sur 3 m. Aire totale ?
        unite: m²
        aide: Aire d’un box × 8.
    -   id: q06
        type: nombre
        enonce: Sur le plan (1/200), un box mesure 2 cm sur 1,5 cm. Quelle est sa vraie aire ?
        unite: m²
        aide: Convertis d’abord les deux longueurs en m (× 2), puis multiplie.
    -   id: q07
        type: nombre
        enonce: Sur le plan (1/200), la sellerie mesure 3 cm sur 2,5 cm. Quelle est sa vraie aire ?
        unite: m²
        aide: Convertis les longueurs en m, puis multiplie.
-   id: a03
    titre: Partie 3 — Du réel au plan
    transition: 'Dernière notion : dessiner un nouveau bâtiment sur le plan, donc faire le chemin inverse.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Pour dessiner sur le plan, on part de la vraie longueur et on la réduit.
    -   type: paragraphe
        texte: 'C’est l’opération inverse : au lieu de multiplier par 200, on divise par 200.'
    -   type: paragraphe
        texte: 'À retenir : Longueur sur le plan = longueur réelle ÷ 200, les deux dans la même unité (cm).'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Convertis la vraie longueur en cm (× 100).
        - Divise par 200.
        - 'Contrôle : multiplie ton résultat par 200, tu dois retrouver la vraie longueur.'
        - 'Astuce : à l’échelle 1/200, 2 m en vrai = 1 cm sur le plan, donc on peut diviser les mètres par 2.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. En raisonnant avec 1 cm
    -   type: liste
        elements:
        - 1 cm sur le plan représente 2 m en vrai.
        - 'Un mur de 8 m contient 8 ÷ 2 = 4 fois 2 m : il fait 4 cm sur le plan.'
    -   type: paragraphe
        texte: 2. Pourquoi il faut la même unité
    -   type: liste
        elements:
        - 'L’échelle compare des cm à des cm : 1 cm pour 200 cm.'
        - 'Si on divise 8 (m) par 200, on trouve 0,04 : ce sont des mètres, soit 4 cm. Convertir d’abord évite l’erreur.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Échelle 1/200. Donne les réponses en cm sur le plan.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Convertis 6 m en cm.
        unite: cm
        aide: '1 m = 100 cm : multiplie par 100.'
    -   id: q02
        type: nombre
        enonce: Un mur mesure 6 m. Combien mesure-t-il sur le plan ?
        unite: cm
        aide: 600 cm ÷ 200.
    -   id: q03
        type: nombre
        enonce: Un manège mesure 40 m. Combien sur le plan ?
        unite: cm
        aide: 4 000 cm ÷ 200.
    -   id: q04
        type: nombre
        enonce: Un box mesure 3,5 m. Combien sur le plan ?
        unite: cm
        aide: 350 cm ÷ 200.
    -   id: q05
        type: nombre
        enonce: Un hangar mesure 25 m. Combien sur le plan ?
        unite: cm
        aide: 2 500 cm ÷ 200.
    -   id: q06
        type: qcm
        enonce: Série B — Un élève dessine un mur de 10 m en traçant 10 ÷ 200 = 0,05 cm. Qu’a-t-il oublié ?
        choix:
        -   id: a
            texte: 'De convertir les 10 m en 1 000 cm : le bon tracé fait 5 cm.'
        -   id: b
            texte: Rien, 0,05 cm est juste.
        -   id: c
            texte: 'De multiplier par 200 : le bon tracé fait 2 000 cm.'
        aide: L’échelle compare des cm à des cm. Combien de cm dans 10 m ?
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: Échelle 1/200. Sur le plan, la cour mesure 15 cm. Vraie longueur en m ?
        unite: m
    -   id: q02
        type: nombre
        enonce: Un box mesure 3 m sur 3 m. Aire ?
        unite: m²
    -   id: q03
        type: nombre
        enonce: 10 boxes de 3,5 m sur 3 m. Aire totale ?
        unite: m²
    -   id: q04
        type: nombre
        enonce: Échelle 1/200. Une allée de 30 m. Longueur sur le plan en cm ?
        unite: cm
    -   id: q05
        type: nombre
        enonce: Échelle 1/100. Un box de 4 m. Longueur sur le plan en cm ?
        unite: cm
    -   id: q06
        type: nombre
        enonce: Échelle 1/200. Sur le plan, un paddock mesure 10 cm sur 6 cm. Vraie aire en m² ?
        unite: m²
retenir:
- 'Échelle 1/200 : longueur réelle = longueur sur le plan × 200.'
- Longueur sur le plan = longueur réelle ÷ 200 (dans la même unité).
- '1 m = 100 cm : cm → m, on divise par 100.'
- Aire d’un rectangle = longueur × largeur ; en m² si les longueurs sont en m.
