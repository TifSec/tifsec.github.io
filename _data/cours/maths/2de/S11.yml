titre: 'Séance 11 : Les tailles au garrot des poneys du club'
themes:
    - EG4, 1-1 — Organiser et traiter des données statistiques à une variable
problematique: Comment organiser une série de données pour la décrire ?
competences_bo:
    - EG4, 1-1 — Organiser et traiter des données statistiques à une variable
objectifs:
    connaissances:
        - 'Une série statistique : une population (les poneys), un caractère (la taille), des valeurs.'
        - Effectif d’une valeur ; effectif total ; fréquence = effectif ÷ effectif total.
    competences:
        - Construire un tableau d’effectifs et de fréquences.
        - Calculer une fréquence en pourcentage.
pourquoi:
    - Le club classe ses poneys en catégories A, B, C, D selon leur taille (règlement FFE).
    - Tu organises les mesures des 20 poneys du club.
activites:
    -   id: a01
        titre: Population et caractère
        consigne: Tu vas identifier la population, le caractère et son type dans l’étude des poneys du club. On attend les trois éléments.
        contenu:
            -   type: titre
                texte: Exemple
            -   type: liste
                elements:
                    - 'Automatisme : calcule 5 ÷ 20 en pourcentage.'
            -   type: etapes
                elements:
                    - Lis la situation.
                    - Identifie la population, le caractère et son type.
            -   type: paragraphe
                texte: Pourquoi ce vocabulaire ? Il évite de mélanger ce qu’on étudie et ce qu’on mesure.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - La population étudiée est l’ensemble des …… observés.
                        - ''
                    -   - Le caractère est ce que l’on …… sur chaque individu.
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: tableau
                enonce: Complète.
                colonnes:
                    - Élément
                    - Réponse
                lignes:
                    -   - Population
                        - ''
                    -   - Caractère
                        - ''
                    -   - Type de caractère
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: Le tableau d’effectifs
        transition: Tu sais ce qu’on étudie. Organise les données.
        consigne: Tu vas compter les poneys de chaque catégorie à partir de la liste du document 1. On attend les quatre effectifs.
        contenu:
            -   type: titre
                texte: Exemple
            -   type: paragraphe
                texte: 'Document 1 — Catégories des 20 poneys : A, C, B, D, C, A, D, C, B, A, C, D, B, A, C, D, A, C, B, D.'
            -   type: paragraphe
                texte: Données fictives créées pour l’exercice (ordres de grandeur réalistes).
            -   type: etapes
                elements:
                    - Lis les catégories des 20 poneys (document 1).
                    - Compte l’effectif de chaque catégorie.
                    - Vérifie que le total fait 20.
            -   type: paragraphe
                texte: Pourquoi vérifier le total ? Un poney oublié fausse toutes les fréquences.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - L’effectif d’une valeur est le …… d’individus qui ont cette valeur.
                        - ''
                    -   - La somme des effectifs est l’effectif …… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: tableau
                enonce: Complète les effectifs.
                colonnes:
                    - Catégorie
                    - Effectif
                lignes:
                    -   - A
                        - ''
                    -   - B
                        - ''
                    -   - C
                        - ''
                    -   - D
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a03
        titre: Les fréquences
        transition: Les effectifs sont prêts. Compare-les avec des fréquences.
        consigne: Tu vas calculer les fréquences de deux catégories et vérifier leur somme. On attend deux fréquences et la somme.
        contenu:
            -   type: etapes
                elements:
                    - Fréquence = effectif ÷ 20.
                    - Écris-la en pourcentage.
            -   type: paragraphe
                texte: Pourquoi les fréquences ? On peut comparer avec un autre club qui n’a pas 20 poneys.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Fréquence = effectif ÷ effectif …… .
                        - ''
                    -   - La somme des fréquences vaut …… %.
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: tableau
                enonce: Calcule les fréquences en %.
                colonnes:
                    - Catégorie
                    - Fréquence (%)
                lignes:
                    -   - A
                        - ''
                    -   - C
                        - ''
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
            -   id: q03
                type: texte
                enonce: Que vaut la somme des fréquences ? Pourquoi ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un autre club a 12 poneys C sur 40.
        questions:
            -   id: q01
                type: texte
                enonce: Quel club a la plus forte proportion de poneys C ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ta série est organisée. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment organiser une série de données pour la décrire ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Population, caractère, effectif, fréquence.
    - Fréquence = effectif ÷ total.
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
