titre: 'Séance 11 : Population, effectifs et fréquences'
themes:
- EG4, 1-1 — Organiser et traiter des données statistiques à une variable
problematique: Comment décrire un ensemble de données avec des effectifs et des fréquences ?
competences_bo:
- EG4, 1-1 — Organiser et traiter des données statistiques à une variable
objectifs:
    connaissances:
    - Population, individu, caractère.
    - Effectif ; effectif total ; fréquence = effectif ÷ effectif total.
    competences:
    - Reconnaître la population et le caractère étudiés.
    - Compter des effectifs.
    - Calculer des fréquences en décimal et en %.
pourquoi:
- 'Aujourd’hui, trois notions : population et caractère, les effectifs, les fréquences.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — Population, individu, caractère
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: 'En statistique, on étudie un groupe : c’est la population. Chaque élément du groupe est un individu.'
    -   type: paragraphe
        texte: Ce qu’on observe sur chaque individu (sa taille, sa race, sa couleur…) s’appelle le caractère.
    -   type: paragraphe
        texte: 'À retenir : Population = qui on étudie ; caractère = ce qu’on mesure ou observe.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - 'Demande-toi : « sur qui porte l’étude ? » → la population.'
        - 'Demande-toi : « qu’est-ce qu’on note pour chacun ? » → le caractère.'
        - Un caractère est quantitatif s’il se mesure avec un nombre (taille, poids), qualitatif sinon (race, robe).
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi des mots précis
    -   type: liste
        elements:
        - « Les poneys du club » ne dit pas ce qu’on étudie chez eux.
        - En précisant le caractère (la taille au garrot), on sait quel nombre noter pour chaque poney.
    -   type: paragraphe
        texte: 2. Quantitatif ou qualitatif
    -   type: liste
        elements:
        - Avec un nombre, on peut calculer (une moyenne de tailles).
        - Avec une robe (bai, alezan), on ne peut que compter.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    questions:
    -   id: q01
        type: qcm
        enonce: Série A — On mesure la taille au garrot des 20 poneys du club. Quelle est la population ?
        choix:
        -   id: a
            texte: Les 20 poneys du club
        -   id: b
            texte: La taille au garrot
        -   id: c
            texte: Le club
        aide: Sur qui porte l’étude ?
    -   id: q02
        type: qcm
        enonce: Dans la même étude, quel est le caractère ?
        choix:
        -   id: a
            texte: Les 20 poneys
        -   id: b
            texte: La taille au garrot
        -   id: c
            texte: Le nombre 20
        aide: Qu’est-ce qu’on note pour chaque poney ?
    -   id: q03
        type: qcm
        enonce: La taille au garrot est un caractère…
        choix:
        -   id: a
            texte: quantitatif
        -   id: b
            texte: qualitatif
        aide: Se mesure-t-elle avec un nombre ?
    -   id: q04
        type: qcm
        enonce: On note la robe (bai, alezan, gris…) de chaque cheval. Ce caractère est…
        choix:
        -   id: a
            texte: quantitatif
        -   id: b
            texte: qualitatif
        aide: Peut-on faire une moyenne de robes ?
    -   id: q05
        type: qcm
        enonce: Série B — On note le poids des 12 poulains nés en 2026 à l’élevage. Quel est un individu ?
        choix:
        -   id: a
            texte: Le poids
        -   id: b
            texte: Les 12 poulains
        -   id: c
            texte: Un poulain
        aide: Un individu est UN élément de la population.
    -   id: q06
        type: nombre
        enonce: Dans cette étude, combien y a-t-il d’individus ?
        aide: Compte les éléments de la population.
        calcul: true
-   id: a02
    titre: Partie 2 — Les effectifs
    transition: 'Tu sais ce qu’on étudie. Deuxième notion : compter.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: L’effectif d’une valeur est le nombre d’individus qui ont cette valeur.
    -   type: paragraphe
        texte: 'L’effectif total est le nombre de tous les individus : la somme des effectifs.'
    -   type: paragraphe
        texte: 'À retenir : Effectif total = somme de tous les effectifs.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Lis le tableau ligne par ligne.
        - 'Pour l’effectif d’une valeur : lis le nombre en face.'
        - 'Pour l’effectif total : additionne tous les effectifs.'
        - 'Pour « au moins » ou « moins de » : additionne les effectifs concernés.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. En comptant
    -   type: liste
        elements:
        - Si 5 poneys mesurent 120 cm, l’effectif de 120 cm est 5.
        - Chaque poney est compté une seule fois, dans une seule ligne.
    -   type: paragraphe
        texte: 2. Pourquoi additionner
    -   type: liste
        elements:
        - Tous les poneys sont répartis entre les lignes.
        - En additionnant toutes les lignes, on retrouve donc tout le club.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Tailles au garrot des poneys du club (en cm) :'
    -   type: tableau
        colonnes:
        - Taille (cm)
        - Effectif
        lignes:
        -   - '115'
            - '3'
        -   - '120'
            - '5'
        -   - '125'
            - '6'
        -   - '130'
            - '4'
        -   - '135'
            - '2'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Combien de poneys mesurent 125 cm ?
        unite: poneys
        aide: Lis la ligne 125.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Combien de poneys mesurent 135 cm ?
        unite: poneys
        aide: Lis la ligne 135.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Quel est l’effectif total ?
        unite: poneys
        aide: Additionne tous les effectifs.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Série B — Combien de poneys mesurent 130 cm ou plus ?
        unite: poneys
        aide: Additionne les lignes 130 et 135.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Combien de poneys mesurent moins de 125 cm ?
        unite: poneys
        aide: Additionne les lignes 115 et 120.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Quelle taille a le plus grand effectif ? (écris la taille en cm)
        unite: cm
        aide: Cherche le plus grand nombre dans la colonne Effectif.
        calcul: true
    -   id: q07
        type: nombre
        enonce: Combien de poneys mesurent entre 120 et 130 cm (120 et 130 compris) ?
        unite: poneys
        aide: Additionne les lignes 120, 125 et 130.
        calcul: true
-   id: a03
    titre: Partie 3 — Les fréquences
    transition: 'Dernière notion : comparer des groupes de tailles différentes, avec les fréquences.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: La fréquence d’une valeur est la part des individus qui ont cette valeur.
    -   type: paragraphe
        texte: Elle s’écrit en nombre décimal (entre 0 et 1) ou en pourcentage.
    -   type: paragraphe
        texte: 'À retenir : Fréquence = effectif ÷ effectif total. En % : × 100.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Trouve l’effectif de la valeur.
        - Trouve l’effectif total.
        - 'Divise : effectif ÷ effectif total.'
        - Multiplie par 100 pour avoir un pourcentage.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. En raisonnant avec « sur 100 »
    -   type: liste
        elements:
        - 6 poneys sur 20, c’est comme 30 poneys sur 100 (on multiplie haut et bas par 5).
        - Donc 6 sur 20 = 30 sur 100 = 30 %.
    -   type: paragraphe
        texte: 2. Pourquoi les fréquences totalisent 100 %
    -   type: liste
        elements:
        - Chaque poney est dans une seule ligne.
        - 'Les parts de toutes les lignes, mises ensemble, forment le club entier : 100 %.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: On utilise le même tableau des tailles (20 poneys).
    -   type: tableau
        colonnes:
        - Taille (cm)
        - Effectif
        lignes:
        -   - '115'
            - '3'
        -   - '120'
            - '5'
        -   - '125'
            - '6'
        -   - '130'
            - '4'
        -   - '135'
            - '2'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Fréquence de 125 cm, en nombre décimal ?
        aide: 6 ÷ 20.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Fréquence de 125 cm, en % ?
        unite: '%'
        aide: 0,3 × 100.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Fréquence de 120 cm, en % ?
        unite: '%'
        aide: 5 ÷ 20 × 100.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Fréquence de 135 cm, en % ?
        unite: '%'
        aide: 2 ÷ 20 × 100.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Série B — Quel pourcentage de poneys mesure 130 cm ou plus ?
        unite: '%'
        aide: (4 + 2) ÷ 20 × 100.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Combien font toutes les fréquences additionnées, en % ?
        unite: '%'
        aide: Additionne les fréquences des 5 tailles.
        calcul: true
    -   id: q07
        type: qcm
        enonce: 'Club A : 6 poneys de 125 cm sur 20. Club B : 9 sur 36. Où la part de poneys de 125 cm est-elle la plus grande ?'
        choix:
        -   id: a
            texte: Club A
        -   id: b
            texte: Club B
        -   id: c
            texte: Pareil
        aide: Calcule les deux fréquences en %.
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: 'Robes : bai 12, alezan 6, gris 2. Effectif total ?'
        calcul: true
    -   id: q02
        type: nombre
        enonce: Fréquence des bais, en % ?
        unite: '%'
        calcul: true
    -   id: q03
        type: nombre
        enonce: Fréquence des gris, en % ?
        unite: '%'
        calcul: true
    -   id: q04
        type: nombre
        enonce: Dans un club de 40 chevaux, 30 % sont des juments. Combien de juments ?
        calcul: true
    -   id: q05
        type: nombre
        enonce: 25 % des 32 poneys sont gris. Combien de gris ?
        calcul: true
    -   id: q06
        type: qcm
        enonce: On note le nombre de sorties par semaine de chaque cheval. Ce caractère est…
        choix:
        -   id: a
            texte: quantitatif
        -   id: b
            texte: qualitatif
retenir:
- 'Population : l’ensemble étudié ; individu : un élément ; caractère : ce qu’on observe.'
- 'Effectif : nombre d’individus qui ont une valeur ; effectif total : tous les individus.'
- Fréquence = effectif ÷ effectif total (× 100 pour un %).
- La somme des fréquences fait 1 (ou 100 %).
