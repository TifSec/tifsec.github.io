titre: 'Séance 11 : Les tailles au garrot des poneys du club'
themes:
    - EG4, 1-1 — Organiser et traiter des données statistiques à une variable
problematique: Comment organiser une série de données pour la décrire ?
competences_bo:
    - EG4, 1-1 — Organiser et traiter des données statistiques à une variable
objectifs:
    connaissances:
        - 'Une série statistique : une population (les poneys), un caractère (la taille), des valeurs.'
        - Effectif d’une valeur ; effectif total ; fréquence = effectif ÷ effectif total.
    competences:
        - Construire un tableau d’effectifs et de fréquences.
        - Calculer une fréquence en pourcentage.
pourquoi:
    - Le club classe ses poneys en catégories A, B, C, D selon leur taille (règlement FFE).
    - Tu organises les mesures des 20 poneys du club.
activites:
    -   id: a01
        titre: Population et caractère
        consigne: Tu vas identifier la population, le caractère et son type dans l’étude des poneys du club. On attend les trois éléments.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Le club veut décrire les tailles au garrot de ses 20 poneys. Avant de compter, il faut savoir ce qu’on étudie.
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: La population est l’ensemble des individus étudiés. Le caractère est ce qu’on observe ou mesure sur chaque individu. Il est qualitatif (une couleur, une race) ou quantitatif (un nombre) ; quantitatif discret (on compte) ou continu (on mesure).
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Savoir de quoi on parle avant de calculer.
                    - Choisir le bon tableau et le bon graphique.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - 'On se demande : qui étudie-t-on ? (population)'
                    - Qu’est-ce qu’on observe sur chacun ? (caractère)
                    - Est-ce un mot ou un nombre ? Un nombre qu’on compte ou qu’on mesure ? (type)
            -   type: paragraphe
                texte: 'À retenir : Population = qui ; caractère = quoi.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - On note la robe des 15 chevaux d’une écurie. Population, caractère, type ?
                    - On compte le nombre de poulains de chaque jument d’un élevage. Type de caractère ?
            -   type: liste
                elements:
                    - 'Automatisme : calcule 5 ÷ 20 en pourcentage.'
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : lis la situation et identifie la population, le caractère et son type.'
                    - Pourquoi ce vocabulaire ? Il évite de mélanger ce qu’on étudie et ce qu’on mesure.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - La population étudiée est l’ensemble des …… observés.
                        - ''
                    -   - Le caractère est ce que l’on …… sur chaque individu.
                        - ''
                aide: 'Qui observe-t-on ici : les poneys ou leur taille ? Et la taille, est-ce ce qu’on étudie ou ce qu’on compte ?'
            -   id: q02
                type: tableau
                enonce: Complète.
                colonnes:
                    - Élément
                    - Réponse
                lignes:
                    -   - Population
                        - ''
                    -   - Caractère
                        - ''
                    -   - Type de caractère
                        - ''
                aide: 'La population : qui sont les individus observés ? Le caractère : ce qu’on relève sur chacun. Est-il un nombre ou une catégorie ?'
    -   id: a02
        titre: Le tableau d’effectifs
        transition: Tu sais ce qu’on étudie. Organise les données.
        consigne: Tu vas compter les poneys de chaque catégorie à partir de la liste du document 1. On attend les quatre effectifs.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: La liste des catégories des 20 poneys est désordonnée. Comment la résumer ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: L’effectif d’une valeur est le nombre d’individus qui ont cette valeur. Le tableau d’effectifs les range ; leur somme est l’effectif total.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Passer d’une liste illisible à un résumé clair.
                    - Préparer les fréquences et les graphiques.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - On compte chaque valeur en barrant au fur et à mesure.
                    - On écrit les effectifs dans un tableau.
                    - On vérifie que la somme des effectifs est égale à l’effectif total.
            -   type: paragraphe
                texte: 'À retenir : Somme des effectifs = effectif total.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - 'Robes : bai, gris, bai, alezan, bai, gris. Tableau d’effectifs ?'
            -   type: paragraphe
                texte: 'Document 1 — Catégories des 20 poneys : A, C, B, D, C, A, D, C, B, A, C, D, B, A, C, D, A, C, B, D.'
            -   type: paragraphe
                texte: Données fictives créées pour l’exercice (ordres de grandeur réalistes).
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : compte l’effectif de chaque catégorie des 20 poneys (document 1), puis vérifie que le total fait 20.'
                    - Pourquoi vérifier le total ? Un poney oublié fausse toutes les fréquences.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - L’effectif d’une valeur est le …… d’individus qui ont cette valeur.
                        - ''
                    -   - La somme des effectifs est l’effectif …… .
                        - ''
                aide: L’effectif d’une catégorie, c’est combien de poneys l’ont. Et quand on additionne tous les effectifs ?
            -   id: q02
                type: tableau
                enonce: Complète les effectifs.
                colonnes:
                    - Catégorie
                    - Effectif
                lignes:
                    -   - A
                        - ''
                    -   - B
                        - ''
                    -   - C
                        - ''
                    -   - D
                        - ''
                aide: Compte dans la liste de l’énoncé les poneys de chaque catégorie (A, B, C, D). Barre au fur et à mesure.
    -   id: a03
        titre: Les fréquences
        transition: Les effectifs sont prêts. Compare-les avec des fréquences.
        consigne: Tu vas calculer les fréquences de deux catégories et vérifier leur somme. On attend deux fréquences et la somme.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Un autre club a 40 poneys. Comment comparer nos catégories avec les siennes ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: La fréquence d’une valeur est sa part dans l’effectif total, souvent en pourcentage.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Comparer des groupes de tailles différentes.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - On divise l’effectif par l’effectif total.
                    - On multiplie par 100 pour avoir un pourcentage.
                    - On vérifie que la somme des fréquences vaut 100 %.
            -   type: paragraphe
                texte: 'À retenir : Fréquence = effectif ÷ effectif total ; somme = 100 %.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Fréquence de B (4 sur 20) et de D (5 sur 20) ?
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : calcule la fréquence de chaque catégorie (effectif ÷ 20), puis écris-la en pourcentage.'
                    - Pourquoi les fréquences ? On peut comparer avec un autre club qui n’a pas 20 poneys.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Fréquence = effectif ÷ effectif …… .
                        - ''
                    -   - La somme des fréquences vaut …… %.
                        - ''
                aide: Une fréquence compare l’effectif d’une catégorie à quoi ? Et toutes les fréquences ensemble font combien de pour cent ?
            -   id: q02
                type: tableau
                enonce: Calcule les fréquences en %.
                colonnes:
                    - Catégorie
                    - Fréquence (%)
                lignes:
                    -   - A
                        - ''
                    -   - C
                        - ''
                aide: Fréquence = effectif de la catégorie ÷ effectif total × 100.
            -   id: q03
                type: texte
                enonce: Que vaut la somme des fréquences ? Pourquoi ?
                aide: 'Additionne toutes tes fréquences : que représente l’ensemble des catégories ?'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un autre club a 12 poneys C sur 40.
        questions:
            -   id: q01
                type: texte
                enonce: Quel club a la plus forte proportion de poneys C ?
                aide: Calcule la fréquence des poneys C dans l’autre club (12 ÷ 40 × 100) et compare-la à celle de ton club.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ta série est organisée. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment organiser une série de données pour la décrire ?'
                aide: Dis les mots du vocabulaire (population, caractère, effectif, fréquence) et comment on calcule une fréquence.
retenir:
    - Population, caractère, effectif, fréquence.
    - Fréquence = effectif ÷ total.
