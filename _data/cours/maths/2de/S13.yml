titre: 'Séance 13 : Moyenne, médiane et mode'
themes:
- EG4, 1-1 — Organiser et traiter des données statistiques à une variable
problematique: Comment résumer une série de valeurs par un seul nombre, et lequel choisir ?
competences_bo:
- EG4, 1-1 — Organiser et traiter des données statistiques à une variable
objectifs:
    connaissances:
    - Moyenne = somme des valeurs ÷ effectif total.
    - 'Médiane : valeur du milieu de la série rangée.'
    - 'Mode : valeur la plus fréquente.'
    competences:
    - Calculer une moyenne.
    - Trouver une médiane (effectif impair ou pair).
    - Trouver le mode et choisir l’indicateur adapté.
pourquoi:
- 'Aujourd’hui, trois notions : la moyenne, la médiane, puis le mode et le choix du bon indicateur.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — La moyenne
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: La moyenne est la valeur que chacun aurait si on partageait le total en parts égales.
    -   type: paragraphe
        texte: Elle se calcule avec toutes les valeurs de la série.
    -   type: paragraphe
        texte: 'À retenir : Moyenne = somme des valeurs ÷ nombre de valeurs.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Additionne toutes les valeurs.
        - Compte le nombre de valeurs (l’effectif total).
        - Divise la somme par ce nombre.
        - 'Contrôle : la moyenne est entre la plus petite et la plus grande valeur.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. En partageant
    -   type: liste
        elements:
        - 'Trois chevaux mangent 4, 6 et 8 kg de foin : 18 kg en tout.'
        - 'Si on partage les 18 kg en 3 parts égales, chacun a 18 ÷ 3 = 6 kg : c’est la moyenne.'
    -   type: paragraphe
        texte: 2. Pourquoi diviser par le nombre de valeurs
    -   type: liste
        elements:
        - On partage entre tous les individus, donc autant de parts que de valeurs.
        - 'Diviser par la plus grande valeur n’a pas de sens : ce n’est pas un nombre de parts.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée.
    -   type: paragraphe
        texte: 'Série A : durées de pansage (min) de 7 élèves : 8 ; 10 ; 12 ; 12 ; 15 ; 17 ; 24.'
    -   type: paragraphe
        texte: 'Série B : poids (kg) de 6 chevaux : 480 ; 500 ; 520 ; 540 ; 560 ; 600.'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Quelle est la somme des 7 durées de pansage ?
        unite: min
        aide: Additionne les 7 valeurs.
    -   id: q02
        type: nombre
        enonce: Quelle est la durée moyenne de pansage ?
        unite: min
        aide: Somme ÷ 7.
    -   id: q03
        type: nombre
        enonce: Quel est le poids moyen des 6 chevaux ?
        unite: kg
        aide: Somme ÷ 6, arrondi au centième.
    -   id: q04
        type: nombre
        enonce: Moyenne de 3, 5 et 10 ?
        aide: Somme ÷ 3.
    -   id: q05
        type: nombre
        enonce: Moyenne de 120, 130, 140 et 150 ?
        aide: Somme ÷ 4.
    -   id: q06
        type: nombre
        enonce: 'Série B — Quatre notes : 10, 12, 14 et une 4e. La moyenne est 13. Quelle est la 4e note ?'
        aide: La somme doit faire 13 × 4 = 52.
    -   id: q07
        type: nombre
        enonce: Un cheval a mangé 7 kg, 8 kg, 9 kg, 6 kg et 10 kg en 5 jours. Moyenne par jour ?
        unite: kg
        aide: Somme ÷ 5.
-   id: a02
    titre: Partie 2 — La médiane
    transition: 'Tu sais calculer une moyenne. Deuxième notion : la valeur du milieu.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: La médiane est la valeur qui partage la série rangée en deux groupes de même effectif.
    -   type: paragraphe
        texte: Au moins la moitié des valeurs sont en dessous (ou égales), au moins la moitié au-dessus (ou égales).
    -   type: paragraphe
        texte: 'À retenir : On range la série. Effectif impair : la valeur du milieu. Effectif pair : la moyenne des deux valeurs du milieu.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Range les valeurs dans l’ordre croissant.
        - Compte l’effectif n.
        - Si n est impair, la médiane est la valeur de rang (n + 1) ÷ 2.
        - Si n est pair, prends les valeurs de rang n ÷ 2 et n ÷ 2 + 1, et fais leur moyenne.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi il faut ranger
    -   type: liste
        elements:
        - La médiane est « au milieu » des valeurs, pas au milieu de la liste écrite au hasard.
        - Sans ranger, on peut tomber sur une petite ou une grande valeur.
    -   type: paragraphe
        texte: 2. Pourquoi (n + 1) ÷ 2
    -   type: liste
        elements:
        - 'Pour 7 valeurs, la 4e a 3 valeurs avant et 3 après : (7 + 1) ÷ 2 = 4.'
        - 'Pour 6 valeurs, il n’y a pas de valeur pile au milieu : on prend entre la 3e et la 4e.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: On reprend les séries A et B.
    -   type: paragraphe
        texte: 'Série A : 8 ; 10 ; 12 ; 12 ; 15 ; 17 ; 24 (déjà rangée).'
    -   type: paragraphe
        texte: 'Série B : 480 ; 500 ; 520 ; 540 ; 560 ; 600 (déjà rangée).'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Combien de valeurs dans la série A ?
        aide: Compte-les.
    -   id: q02
        type: nombre
        enonce: Quel est le rang de la médiane de la série A ?
        aide: (n + 1) ÷ 2.
    -   id: q03
        type: nombre
        enonce: Quelle est la médiane de la série A ?
        unite: min
        aide: Lis la 4e valeur.
    -   id: q04
        type: nombre
        enonce: Médiane de la série B (6 valeurs) ?
        unite: kg
        aide: Moyenne de la 3e et de la 4e valeur.
    -   id: q05
        type: nombre
        enonce: 'Série B — Médiane de : 15 ; 3 ; 9 ; 7 ; 11 ?'
        aide: Range d’abord.
    -   id: q06
        type: nombre
        enonce: 'Médiane de : 6 ; 2 ; 10 ; 4 ?'
        aide: Range, puis moyenne des 2 du milieu.
    -   id: q07
        type: nombre
        enonce: 'Médiane de : 130 ; 125 ; 140 ; 135 ; 120 ; 145 ; 128 ?'
        aide: Range les 7 valeurs.
-   id: a03
    titre: Partie 3 — Le mode, et quel indicateur choisir
    transition: 'Dernière notion : la valeur la plus fréquente, puis choisir le bon résumé.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Le mode est la valeur qui revient le plus souvent dans la série.
    -   type: paragraphe
        texte: Moyenne, médiane et mode résument la série chacun à leur façon ; on choisit celui qui la représente le mieux.
    -   type: paragraphe
        texte: 'À retenir : Mode = valeur la plus fréquente. Avec une valeur extrême, on préfère la médiane à la moyenne.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - 'Mode : cherche la valeur qui apparaît le plus de fois.'
        - Compare moyenne et médiane.
        - Si une valeur est très éloignée des autres, la moyenne est « tirée » vers elle.
        - Dans ce cas, la médiane représente mieux la majorité.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi la moyenne bouge
    -   type: liste
        elements:
        - 'La moyenne utilise toutes les valeurs : une valeur énorme augmente beaucoup la somme.'
        - 'La médiane regarde seulement le rang : la plus grande valeur peut grandir, le milieu reste le même.'
    -   type: paragraphe
        texte: 2. Un exemple
    -   type: liste
        elements:
        - 'Salaires : 600, 600, 700, 800, 1 500 € → moyenne 840 €, médiane 700 €.'
        - 'Quatre personnes sur cinq gagnent moins que la moyenne : 700 € décrit mieux la situation.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Salaires mensuels (€) de 5 saisonniers : 600 ; 600 ; 700 ; 800 ; 1 500.'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Quel est le mode de la série A (durées de pansage) ?
        unite: min
        aide: Quelle valeur apparaît deux fois ?
    -   id: q02
        type: nombre
        enonce: Quel est le mode des salaires ?
        unite: €
        aide: Quelle valeur apparaît le plus ?
    -   id: q03
        type: nombre
        enonce: Quelle est la moyenne des salaires ?
        unite: €
        aide: Somme ÷ 5.
    -   id: q04
        type: nombre
        enonce: Quelle est la médiane des salaires ?
        unite: €
        aide: Valeur du milieu (3e).
    -   id: q05
        type: qcm
        enonce: Série B — Quel indicateur représente le mieux les salaires ?
        choix:
        -   id: a
            texte: La moyenne, 840 €
        -   id: b
            texte: La médiane, 700 €
        -   id: c
            texte: Aucun
        aide: Combien de saisonniers gagnent moins que 840 € ?
    -   id: q06
        type: qcm
        enonce: Si le salaire de 1 500 € devenait 3 000 €, que se passerait-il ?
        choix:
        -   id: a
            texte: La moyenne augmenterait, la médiane ne changerait pas
        -   id: b
            texte: Les deux augmenteraient
        -   id: c
            texte: Aucune ne changerait
        aide: La médiane dépend-elle de la valeur de la plus grande ?
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: Moyenne de 4 ; 8 ; 9 ; 11 ?
    -   id: q02
        type: nombre
        enonce: Médiane de 4 ; 8 ; 9 ; 11 ?
    -   id: q03
        type: nombre
        enonce: Mode de 5 ; 7 ; 7 ; 8 ; 9 ; 9 ; 9 ?
    -   id: q04
        type: nombre
        enonce: Médiane de 52 ; 47 ; 60 ; 55 ; 49 ?
    -   id: q05
        type: nombre
        enonce: Moyenne de 52 ; 47 ; 60 ; 55 ; 49 ? (arrondi au dixième)
retenir:
- Moyenne = somme ÷ effectif total.
- 'Médiane : on range la série ; c’est la valeur du milieu (effectif pair : moyenne des deux valeurs du milieu).'
- 'Mode : la valeur qui revient le plus souvent.'
- Une valeur extrême (très grande ou très petite) tire la moyenne, pas la médiane.
