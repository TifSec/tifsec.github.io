titre: 'Séance 13 : Moyenne, médiane, mode : lequel choisir ?'
themes:
    - EG4, 1-1 — Organiser et traiter des données statistiques à une variable
problematique: Quel indicateur choisir pour résumer une série ?
competences_bo:
    - EG4, 1-1 — Organiser et traiter des données statistiques à une variable
objectifs:
    connaissances:
        - 'Moyenne : somme ÷ effectif. Médiane : valeur du milieu de la série rangée. Mode : valeur la plus fréquente.'
        - La moyenne est sensible aux valeurs extrêmes, la médiane non.
    competences:
        - Calculer moyenne, médiane, mode.
        - Choisir l’indicateur adapté.
pourquoi:
    - En S12, tu as représenté des tailles.
    - 'Pour résumer en un nombre, plusieurs indicateurs existent : ils ne disent pas la même chose.'
activites:
    -   id: a01
        titre: Calculer les trois
        consigne: Tu vas calculer la moyenne, la médiane et le mode des prix de vente de 7 chevaux (document 1). On attend les trois indicateurs.
        contenu:
            -   type: liste
                elements:
                    - 'Automatisme : calcule 42 000 ÷ 7.'
            -   type: paragraphe
                texte: 'Document 1 — Prix de vente (€) : 3 000 ; 2 500 ; 20 000 ; 3 500 ; 4 000 ; 3 000 ; 6 000.'
            -   type: paragraphe
                texte: Données fictives créées pour l’exercice (ordres de grandeur réalistes).
            -   type: etapes
                elements:
                    - 'Lis l’exemple : prix de 5 selles : 800 ; 600 ; 600 ; 1 500 ; 700 €.'
                    - 'Rangées : 600 ; 600 ; 700 ; 800 ; 1 500.'
                    - 'Moyenne : (600 + 600 + 700 + 800 + 1 500) ÷ 5 = 4 200 ÷ 5 = 840 €.'
                    - 'Médiane : valeur du milieu de la série rangée, la 3e : 700 €.'
                    - 'Mode : valeur la plus fréquente : 600 €.'
                    - 'À toi : range les 7 prix de vente (document 1), puis calcule la moyenne, la médiane et le mode.'
                    - Pourquoi ranger ? La médiane est la valeur du milieu de la série rangée.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - La moyenne est la somme des valeurs divisée par l’…… total.
                        - ''
                    -   - La médiane partage la série rangée en deux parties de même …… .
                        - ''
                aide: 'La moyenne : somme des valeurs ÷ quoi ? La médiane coupe la série rangée en deux parties de même… ?'
            -   id: q02
                type: nombre
                enonce: Quelle est la moyenne des prix ?
                unite: €
                aide: Additionne tous les prix de l’énoncé et divise par le nombre de prix.
            -   id: q03
                type: nombre
                enonce: Quelle est la médiane ?
                unite: €
                aide: Range les prix du plus petit au plus grand, puis prends la valeur du milieu.
            -   id: q04
                type: nombre
                enonce: Quel est le mode ?
                unite: €
                aide: Le mode est la valeur qui revient le plus souvent dans la liste.
    -   id: a02
        titre: Lequel représente le mieux ?
        transition: Les trois indicateurs sont calculés. Lequel choisir ?
        consigne: Tu vas choisir l’indicateur qui représente le mieux le prix habituel d’un cheval. On attend ton choix justifié.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple des selles : moyenne 840 €, médiane 700 €.'
                    - 'La selle à 1 500 € tire la moyenne vers le haut : 4 selles sur 5 coûtent moins de 840 €.'
                    - La médiane (700 €) décrit mieux le prix d’une selle « habituelle ».
                    - 'À toi : un cheval de sport vendu 20 000 € tire la moyenne vers le haut. Choisis l’indicateur qui représente le prix habituel.'
                    - Pourquoi la médiane ici ? Une seule valeur extrême ne la déplace pas.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - La moyenne est sensible aux valeurs …… .
                        - ''
                    -   - Avec une valeur extrême, on préfère la …… .
                        - ''
                aide: Une valeur très grande tire la moyenne vers le haut. Quel indicateur ne bouge presque pas ?
            -   id: q02
                type: texte
                enonce: Quel indicateur représente le mieux le prix habituel ? Justifie.
                aide: 'Regarde la liste : une valeur est-elle très différente des autres ? Compare alors moyenne et médiane au prix « habituel ».'
    -   id: a03
        titre: Série paire
        transition: Tu sais choisir. Et si l’effectif est pair ?
        consigne: Tu vas calculer la médiane des prix de vente quand un huitième cheval s’ajoute à la série. On attend la nouvelle médiane.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : 4 valeurs rangées : 600 ; 700 ; 800 ; 1 500.'
                    - 'Il n’y a pas une seule valeur au milieu : on prend les deux du milieu, 700 et 800.'
                    - Médiane = (700 + 800) ÷ 2 = 750.
                    - 'À toi : on ajoute un 8e cheval à 2 000 €. Range les 8 prix et calcule la nouvelle médiane.'
                    - Pourquoi deux valeurs ? Avec 8 valeurs, il n’y a pas une seule valeur au milieu.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Pour un effectif pair, la médiane est la moyenne des deux valeurs du …… .
                        - ''
                    -   - On range toujours la série dans l’ordre …… avant.
                        - ''
                aide: 'Avec un nombre pair de valeurs, il n’y a pas une seule valeur au milieu : il y en a deux. Et que faut-il faire à la série d’abord ?'
            -   id: q02
                type: nombre
                enonce: Quelle est la nouvelle médiane ?
                unite: €
                aide: Range la nouvelle série, repère les deux valeurs du milieu et fais leur moyenne.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le mode a-t-il un sens pour des tailles au cm près ?
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi ?
                aide: Avec des tailles au cm près, combien de poneys ont exactement la même taille ? Le mode veut-il encore dire quelque chose ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais choisir un indicateur. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quel indicateur choisir pour résumer une série ?'
                aide: Dis comment calculer les trois indicateurs et quand préférer la médiane.
retenir:
    - Moyenne, médiane, mode.
    - Valeur extrême → médiane.
