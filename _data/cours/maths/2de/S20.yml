titre: 'Séance 20 : Image, antécédent et variations'
themes:
- EG4, 1-3 — S’approprier des notions de base sur les fonctions
problematique: Comment lire sur une courbe l’image d’un nombre, ses antécédents, le maximum et le sens de variation ?
competences_bo:
- EG4, 1-3 — S’approprier des notions de base sur les fonctions
objectifs:
    connaissances:
    - 'Image de x : f(x), lue sur l’axe vertical.'
    - 'Antécédent de y : les x tels que f(x) = y (0, 1 ou plusieurs).'
    - Maximum, croissante, décroissante.
    competences:
    - Lire une image sur une courbe.
    - Lire un ou plusieurs antécédents.
    - Lire le maximum et décrire le sens de variation.
pourquoi:
- 'Aujourd’hui, trois notions : lire une image, lire des antécédents, lire le maximum et les variations.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — Lire une image
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: L’image de x par la fonction f est le nombre f(x).
    -   type: paragraphe
        texte: Sur la courbe, on part de x sur l’axe horizontal et on lit f(x) sur l’axe vertical.
    -   type: paragraphe
        texte: 'À retenir : Image de x : x en bas → monter à la courbe → lire à gauche.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Place ton doigt sur x, sur l’axe horizontal.
        - Monte tout droit jusqu’à la courbe.
        - Va tout droit vers la gauche jusqu’à l’axe vertical.
        - 'Lis la valeur : c’est f(x).'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi ce chemin
    -   type: liste
        elements:
        - Un point de la courbe a pour coordonnées (x ; f(x)).
        - En montant depuis x, on trouve le seul point de la courbe qui a cette abscisse.
    -   type: paragraphe
        texte: 2. Une seule image
    -   type: liste
        elements:
        - 'Chaque jour a une seule température : un x n’a qu’une image.'
        - C’est la définition d’une fonction.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Température f(x) (°C) du tas de fumier au jour x :'
    -   type: image
        url: /assets/images/graphiques/maths-2de-s20-classique-fumier.svg
        alternative: Courbe de la température du tas de fumier du jour 0 au jour 10 ; la ligne pointillée orange marque 50 °C.
        legende: Courbe de la température du tas de fumier du jour 0 au jour 10 ; la ligne pointillée orange marque 50 °C.
    -   type: paragraphe
        texte: 'Comment le lire : le jour est en bas, la température à gauche ; chaque carreau vertical vaut 5 °C. La ligne pointillée marque 50 °C.'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Image de 0 ?
        unite: °C
        aide: Jour 0, lis à gauche.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Image de 2 ?
        unite: °C
        aide: Jour 2.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Image de 5 ?
        unite: °C
        aide: Jour 5.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Image de 8 ?
        unite: °C
        aide: Jour 8.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Image de 10 ?
        unite: °C
        aide: Jour 10.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Série B — De combien la température monte-t-elle entre le jour 0 et le jour 4 ?
        unite: °C
        aide: f(4) − f(0).
        calcul: true
    -   id: q07
        type: nombre
        enonce: De combien baisse-t-elle entre le jour 5 et le jour 10 ?
        unite: °C
        aide: f(5) − f(10).
        calcul: true
-   id: a02
    titre: Partie 2 — Lire des antécédents
    transition: 'Tu sais lire une image. Deuxième notion : faire le chemin inverse.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: 'Un antécédent de y est un nombre x dont l’image est y : f(x) = y.'
    -   type: paragraphe
        texte: Un nombre peut avoir 0, 1 ou plusieurs antécédents.
    -   type: paragraphe
        texte: 'À retenir : Antécédent de y : y à gauche → aller à la courbe (dans les deux sens) → descendre lire x.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Place ton doigt sur y, sur l’axe vertical.
        - 'Va horizontalement : note tous les points où tu croises la courbe.'
        - De chaque point, descends lire x sur l’axe horizontal.
        - 'Si tu ne croises jamais la courbe : pas d’antécédent.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi plusieurs antécédents
    -   type: liste
        elements:
        - La température passe par 45 °C en montant (jour 2) et en redescendant (jour 8).
        - 'Les deux jours ont la même image : 45 a deux antécédents.'
    -   type: paragraphe
        texte: 2. Pourquoi parfois aucun
    -   type: liste
        elements:
        - La température ne dépasse jamais 65 °C.
        - 'La ligne horizontale de 70 °C ne croise pas la courbe : 70 n’a pas d’antécédent.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Même courbe de température.
    -   type: image
        url: /assets/images/graphiques/maths-2de-s20-classique-fumier.svg
        alternative: Courbe de la température du tas de fumier du jour 0 au jour 10 ; la ligne pointillée orange marque 50 °C.
        legende: Courbe de la température du tas de fumier du jour 0 au jour 10 ; la ligne pointillée orange marque 50 °C.
    -   type: paragraphe
        texte: 'Comment le lire : le jour est en bas, la température à gauche ; chaque carreau vertical vaut 5 °C. La ligne pointillée marque 50 °C.'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Plus petit antécédent de 45 ?
        unite: jour
        aide: 'Ligne de 45 °C : premier croisement.'
        calcul: true
    -   id: q02
        type: nombre
        enonce: Plus grand antécédent de 45 ?
        unite: jour
        aide: 'Ligne de 45 °C : deuxième croisement.'
        calcul: true
    -   id: q03
        type: nombre
        enonce: Combien d’antécédents a 62 ?
        aide: Combien de croisements avec la ligne de 62 °C ?
        calcul: true
    -   id: q04
        type: nombre
        enonce: Combien d’antécédents a 65 ?
        aide: La ligne touche le sommet.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Combien d’antécédents a 80 ?
        aide: La courbe monte-t-elle jusqu’à 80 °C ?
        calcul: true
    -   id: q06
        type: nombre
        enonce: Série B — Antécédent de 15 ?
        unite: jour
        aide: Ligne de 15 °C.
        calcul: true
    -   id: q07
        type: qcm
        enonce: Quelle phrase est juste ?
        choix:
        -   id: a
            texte: L’antécédent de 3 est 55.
        -   id: b
            texte: L’image de 3 est 55.
        -   id: c
            texte: 3 est l’image de 55.
        aide: L’image se lit sur l’axe vertical.
-   id: a03
    titre: Partie 3 — Maximum et sens de variation
    transition: 'Dernière notion : décrire l’allure générale de la courbe.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Le maximum est la plus grande valeur prise par f(x) ; on le lit au sommet de la courbe.
    -   type: paragraphe
        texte: La fonction est croissante quand la courbe monte, décroissante quand elle descend.
    -   type: paragraphe
        texte: 'À retenir : Maximum : la plus haute ordonnée. Croissante : monte ; décroissante : descend (en lisant de gauche à droite).'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - 'Cherche le point le plus haut : son ordonnée est le maximum, son abscisse dit quand il est atteint.'
        - Lis la courbe de gauche à droite.
        - Note sur quels intervalles elle monte, puis descend.
        - 'Écris : croissante de … à …, décroissante de … à ….'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi de gauche à droite
    -   type: liste
        elements:
        - 'On lit le temps qui avance : jour 0, puis jour 1…'
        - Une courbe qui monte dans ce sens veut dire que la température augmente avec les jours.
    -   type: paragraphe
        texte: 2. Le sens concret
    -   type: liste
        elements:
        - Le compost chauffe pendant la fermentation, atteint un maximum, puis refroidit.
        - Au-dessus de 50 °C (ligne pointillée), les graines de mauvaises herbes sont détruites.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Même courbe de température.
    -   type: image
        url: /assets/images/graphiques/maths-2de-s20-classique-fumier.svg
        alternative: Courbe de la température du tas de fumier du jour 0 au jour 10 ; la ligne pointillée orange marque 50 °C.
        legende: Courbe de la température du tas de fumier du jour 0 au jour 10 ; la ligne pointillée orange marque 50 °C.
    -   type: paragraphe
        texte: 'Comment le lire : le jour est en bas, la température à gauche ; chaque carreau vertical vaut 5 °C. La ligne pointillée marque 50 °C.'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Quel est le maximum de la température ?
        unite: °C
        aide: Point le plus haut.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Quel jour est-il atteint ?
        unite: jour
        aide: Abscisse du sommet.
        calcul: true
    -   id: q03
        type: qcm
        enonce: Entre le jour 0 et le jour 5, la fonction est…
        choix:
        -   id: a
            texte: croissante
        -   id: b
            texte: décroissante
        aide: La courbe monte ou descend ?
    -   id: q04
        type: qcm
        enonce: Entre le jour 5 et le jour 10, la fonction est…
        choix:
        -   id: a
            texte: croissante
        -   id: b
            texte: décroissante
        aide: La courbe monte ou descend ?
    -   id: q05
        type: nombre
        enonce: Série B — Parmi les jours 0 à 10, combien ont une température au-dessus de 50 °C (au-dessus de la ligne pointillée) ?
        unite: jours
        aide: Lis l’image de chaque jour et compte celles qui dépassent 50.
        calcul: true
    -   id: q06
        type: qcm
        enonce: Quel est le minimum sur le graphique ?
        choix:
        -   id: a
            texte: 15 °C au jour 0
        -   id: b
            texte: 25 °C au jour 10
        -   id: c
            texte: 0 °C
        aide: Le point le plus bas.
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
