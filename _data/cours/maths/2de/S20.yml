titre: 'Séance 20 : Lire un graphique : image et antécédent'
themes:
    - EG4, 1-3 — S’approprier des notions de base sur les fonctions
problematique: Comment lire une image et un antécédent sur la courbe d’une fonction ?
competences_bo:
    - EG4, 1-3 — S’approprier des notions de base sur les fonctions
objectifs:
    connaissances:
        - 'L’image de a par f est f(a) : on part de l’axe des abscisses, on monte à la courbe, on lit l’ordonnée.'
        - 'Un antécédent de b : on part de b sur l’axe des ordonnées, on va à la courbe, on lit l’abscisse ; il peut y en avoir plusieurs.'
    competences:
        - Lire une image et des antécédents.
        - Utiliser le vocabulaire des fonctions.
pourquoi:
    - En S19, tu as tracé une courbe croissante.
    - 'Aujourd’hui : la température d’un tas de fumier qui composte, qui monte puis redescend.'
activites:
    -   id: a01
        titre: Lire une image
        consigne: Tu vas lire des images dans le tableau de la température d’un tas de fumier (document 1). On attend deux images.
        contenu:
            -   type: liste
                elements:
                    - 'Automatisme : lis f(20) dans le tableau.'
            -   type: tableau
                titre: Document 1 — Température d’un tas de fumier en compostage (fictive)
                colonnes:
                    - Jours x
                    - '0'
                    - '5'
                    - '10'
                    - '15'
                    - '20'
                    - '30'
                    - '40'
                lignes:
                    -   - Température f(x) (°C)
                        - '15'
                        - '50'
                        - '65'
                        - '60'
                        - '52'
                        - '40'
                        - '30'
            -   type: etapes
                elements:
                    - 'Lis l’exemple : dans le document 1, l’image de 5.'
                    - On cherche 5 dans la ligne « Jours x ».
                    - 'Juste en dessous, on lit 50 : f(5) = 50.'
                    - '« L’image de 5 par f est 50 » : au jour 5, le tas est à 50 °C.'
                    - 'À toi : trouve l’image de 10 et l’image de 30.'
                    - Pourquoi « image » ? f transforme 10 jours en une température.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - f(a) est l’…… de a par f.
                        - ''
                    -   - Pour lire une image, on part de l’axe des …… .
                        - ''
                aide: 'f(a) : comment appelle-t-on ce nombre ? Pour le lire, part-on de l’axe horizontal ou vertical ?'
            -   id: q02
                type: nombre
                enonce: Quelle est l’image de 10 par f ?
                unite: °C
                aide: Pars de 10 sur l’axe horizontal, monte jusqu’à la courbe, lis la valeur sur l’axe vertical.
            -   id: q03
                type: nombre
                enonce: Quelle est l’image de 30 ?
                unite: °C
                aide: Même méthode en partant de 30 sur l’axe horizontal.
    -   id: a02
        titre: Les antécédents
        transition: Tu sais lire une image. Fais le chemin inverse.
        consigne: Tu vas chercher sur la courbe les antécédents de 50 °C et de 70 °C. On attend les antécédents trouvés.
        contenu:
            -   type: image
                url: /assets/images/graphiques/maths-2de-s20-compost.svg
                alternative: Courbe de la température du tas de fumier ; la droite orange marque 50 °C.
                legende: Courbe de la température du tas de fumier ; la droite orange marque 50 °C.
            -   type: titre
                texte: Comment faire ce graphique
            -   type: etapes
                elements:
                    - 'Sur une feuille (papier millimétré si possible), trace un repère orthogonal : deux axes qui se croisent à angle droit (90°). L’unité peut être différente d’un axe à l’autre.'
                    - Sur l’axe des abscisses (axe horizontal, x, qui se lit de gauche à droite), gradue régulièrement les jours x, de 0 à 40 (par exemple 1 cm pour 5 jours).
                    - Sur l’axe des ordonnées (axe vertical, y, qui se lit de bas en haut), gradue régulièrement la température f(x), de 0 à 70 °C (par exemple 1 cm pour 10 °C).
                    - Place chaque point (x ; f(x)) du document 1, en respectant les écarts entre les jours (de 20 à 30, il y a 10 jours).
                    - Relie les points par une courbe régulière.
                    - 'Écris le titre : « Température du tas de fumier ».'
            -   type: titre
                texte: Comment le lire
            -   type: liste
                elements:
                    - 'Image de a : pars de a sur l’axe horizontal, monte à la courbe, lis l’ordonnée.'
                    - 'Antécédents de b : pars de b sur l’axe vertical, trace l’horizontale, repère tous les points où elle coupe la courbe, lis leurs abscisses.'
            -   type: titre
                texte: Comment le comprendre
            -   type: liste
                elements:
                    - 'La droite y = 50 coupe la courbe deux fois : 50 °C a deux antécédents (en montant, puis en redescendant).'
                    - Le sommet de la courbe est le maximum de la fonction.
            -   type: etapes
                elements:
                    - 'Lis l’exemple : quels sont les antécédents de 60 °C ?'
                    - Sur la courbe, trace la droite horizontale y = 60.
                    - 'Elle coupe la courbe en deux points : on lit leurs abscisses, environ 8 jours et 15 jours.'
                    - 60 a donc deux antécédents. Une valeur peut avoir 0, 1 ou plusieurs antécédents.
                    - 'À toi : trace la courbe sur papier, puis cherche les jours où la température vaut 50 °C et ceux où elle vaut 70 °C.'
                    - Pourquoi deux antécédents ? La température passe par 50 °C en montant, puis en redescendant.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - x tel que f(x) = b est un …… de b.
                        - ''
                    -   - Un nombre peut avoir plusieurs …… ou aucun.
                        - ''
                aide: 'On cherche les x qui donnent la valeur b : comment les appelle-t-on ? Une ligne horizontale peut-elle couper la courbe plusieurs fois ?'
            -   id: q02
                type: texte
                enonce: Quels sont les antécédents de 50 par f ?
                aide: Trace une ligne horizontale à 50 sur l’axe vertical. Pour chaque point où elle coupe la courbe, descends lire x.
            -   id: q03
                type: qcm
                enonce: Combien d’antécédents a 70 °C ?
                choix:
                    -   id: a
                        texte: 'Aucun : la température ne dépasse pas 65 °C.'
                    -   id: b
                        texte: Un.
                    -   id: c
                        texte: Deux.
                aide: 'Trace la ligne horizontale à 70 °C : combien de fois coupe-t-elle la courbe ?'
    -   id: a03
        titre: Maximum et sens de variation
        transition: Tu sais lire dans les deux sens. Résume la courbe.
        consigne: Tu vas décrire les variations de la température et donner son maximum. On attend les variations et le maximum.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : une température qui passe de 20 à 40 °C, puis redescend à 25 °C.'
                    - Elle est croissante tant qu’elle monte, décroissante quand elle descend.
                    - Le maximum est la plus grande valeur, atteinte au sommet de la courbe.
                    - 'À toi : repère le maximum de f et quand il est atteint, puis décris les variations.'
                    - 'Pourquoi ? Le compostage hygiénise le fumier quand la température reste haute : on suit la courbe pour décider quand retourner le tas.'
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Une fonction qui monte est …… .
                        - ''
                    -   - La plus grande valeur atteinte est le …… .
                        - ''
                aide: Quand la courbe monte, comment dit-on que la fonction est ? Et la plus haute valeur s’appelle… ?
            -   id: q02
                type: texte
                enonce: Décris les variations de f et donne son maximum.
                aide: 'Repère le point le plus haut : jusqu’où la courbe monte-t-elle, à partir de quand descend-elle ? Donne le maximum avec son unité.'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: On retourne le tas quand la température descend sous 55 °C.
        questions:
            -   id: q01
                type: texte
                enonce: Vers quel jour ?
                aide: Trace la ligne horizontale à 55 °C et regarde où elle coupe la partie qui descend de la courbe.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais lire une courbe. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment lire une image et un antécédent sur la courbe d’une fonction ?'
                aide: Dis comment lire une image, un antécédent, les variations et le maximum.
retenir:
    - 'Image : x → f(x).'
    - 'Antécédent : y → x (0, 1 ou plusieurs).'
sources:
