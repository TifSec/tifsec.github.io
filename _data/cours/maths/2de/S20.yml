        type: nombre
        enonce: Image de 7 ?
        unite: °C
        calcul: true
    -   id: q02
        type: nombre
        enonce: Image de 9 ?
        unite: °C
        calcul: true
    -   id: q03
        type: nombre
        enonce: Plus grand antécédent de 30 ?
        unite: jour
        calcul: true
