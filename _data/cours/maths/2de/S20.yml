        type: nombre
        enonce: Combien d’antécédents a 25 ?
        calcul: true
retenir:
- 'Image : on part de x (axe horizontal), on monte à la courbe, on lit f(x) à gauche.'
- 'Antécédent : on part de y (axe vertical), on va à la courbe, on descend lire x ; il peut y en avoir 0, 1 ou plusieurs.'
- 'Maximum : la plus grande valeur de f(x), au sommet de la courbe.'
- 'Croissante : la courbe monte ; décroissante : elle descend.'
