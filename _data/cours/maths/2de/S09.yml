titre: 'Séance 9 : km/h ou m/min ? Convertir des vitesses et des durées'
themes:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment convertir une vitesse ou une durée d’une unité à une autre ?
competences_bo:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
        - 1 h = 60 min = 3 600 s ; 1 km = 1 000 m.
        - Pour convertir une vitesse, on convertit la distance et la durée séparément.
    competences:
        - Convertir des durées (h, min, s, décimal).
        - Convertir des vitesses (m/min ↔ km/h).
pourquoi:
    - En S08, tu as calculé en m/min.
    - Les applications GPS et les règlements de concours donnent des km/h.
activites:
    -   id: a01
        titre: Les durées
        consigne: Tu vas convertir trois durées entre heures décimales, heures-minutes et secondes. On attend les trois conversions.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Le GPS affiche 1,25 h de balade. Combien de minutes cela fait-il vraiment ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: 'Une durée peut s’écrire en heures et minutes (1 h 15 min) ou en heures décimales (1,25 h). On compte en base 60 : 1 h = 60 min, 1 min = 60 s.'
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Lire un GPS, un chronomètre, un planning.
                    - Faire des calculs de vitesse, qui demandent des heures décimales.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - 'Heures décimales → h min : on garde les heures entières et on multiplie la partie décimale par 60.'
                    - 'h min → heures décimales : on divise les minutes par 60.'
                    - 'min s → s : minutes × 60 + secondes.'
            -   type: paragraphe
                texte: 'À retenir : 1 h = 60 min ; 0,5 h = 30 min ; 0,25 h = 15 min ; 0,75 h = 45 min.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Convertis 2,5 h en h min.
                    - Convertis 1 h 45 min en heures décimales.
                    - Convertis 4 min 15 s en secondes.
            -   type: liste
                elements:
                    - 'Automatisme : calcule 0,25 × 60 de tête.'
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : convertis les durées de la question.'
                    - Pourquoi ce piège ? 1,5 h n’est pas 1 h 50.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 1 h = …… min.
                        - ''
                    -   - 1,5 h = 1 h …… min.
                        - ''
                aide: 'Combien de minutes dans une heure ? Puis 0,5 h, c’est la moitié d’une heure : combien de minutes ?'
            -   id: q02
                type: tableau
                enonce: Convertis.
                colonnes:
                    - Durée
                    - Conversion
                lignes:
                    -   - 1,25 h en h min
                        - ''
                    -   - 2 h 45 min en h décimales
                        - ''
                    -   - 3 min 30 s en s
                        - ''
                aide: 0,25 h = un quart d’heure ; 45 min = combien d’heure en décimal (÷ 60) ; 3 min = combien de secondes ?
    -   id: a02
        titre: m/min → km/h
        transition: Les durées sont maîtrisées. Passe aux vitesses.
        consigne: Tu vas convertir des vitesses de chevaux entre m/min et km/h, en convertissant distance et durée. On attend deux conversions.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Le règlement d’un concours parle en m/min, le GPS en km/h. Comment passer de l’un à l’autre ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Convertir une vitesse, c’est l’exprimer dans d’autres unités sans changer la vitesse réelle.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Comparer des informations données dans des unités différentes.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - 'm/min → km/h : on calcule la distance en 60 min (× 60), puis on passe en km (÷ 1 000).'
                    - 'km/h → m/min : on passe en m (× 1 000), puis on calcule la distance en 1 min (÷ 60).'
                    - 'On vérifie l’ordre de grandeur (un trot : environ 15 à 20 km/h).'
            -   type: paragraphe
                texte: 'À retenir : m/min → km/h : × 60 puis ÷ 1 000.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Convertis 300 m/min en km/h.
                    - Convertis 6 km/h en m/min.
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : convertis les vitesses des questions.'
                    - Pourquoi × 60 ÷ 1 000 ? On passe à l’heure, puis aux kilomètres.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Pour passer de m/min à km/h : × 60 puis ÷ …… .'
                        - ''
                    -   - 1 km = …… m.
                        - ''
                aide: 'En une heure il y a 60 minutes : on multiplie par 60. Puis on passe des m aux km : combien de m dans 1 km ?'
            -   id: q02
                type: nombre
                enonce: Convertis 450 m/min en km/h.
                unite: km/h
                aide: 450 × 60 donne des m par heure ; divise ensuite par 1 000 pour des km/h.
            -   id: q03
                type: nombre
                enonce: Convertis 12 km/h en m/min.
                unite: m/min
                aide: 'Fais le chemin inverse : 12 km = combien de m ? puis divise par 60 minutes.'
    -   id: a03
        titre: Le parcours de CSO
        transition: Tu sais convertir. Applique en concours.
        consigne: Tu vas calculer le temps accordé d’un parcours de saut d’obstacles de 450 m à 350 m/min. On attend le temps arrondi.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Un parcours de CSO de 450 m doit être fait à 350 m/min. Quel est le temps accordé au cavalier ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: 'Le temps accordé est la durée maximale pour faire le parcours : distance ÷ vitesse imposée.'
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Préparer un concours, éviter les pénalités de temps.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - 'On divise la distance par la vitesse : on obtient des minutes.'
                    - On convertit en secondes (× 60).
                    - On arrondit à la seconde supérieure.
            -   type: paragraphe
                texte: 'À retenir : Temps accordé = distance ÷ vitesse, arrondi à la seconde supérieure.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - 'Un parcours de 300 m à 400 m/min : temps accordé en secondes ?'
                    - Un parcours de 500 m à 350 m/min ?
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : un parcours de 450 m doit être fait à 350 m/min. Calcule le temps accordé en secondes, arrondi à la seconde supérieure.'
                    - Pourquoi ce calcul ? Au concours, dépasser le temps accordé coûte des pénalités.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Temps accordé = distance ÷ …… .
                        - ''
                    -   - On arrondit un temps accordé à la seconde …… .
                        - ''
                aide: 'Le temps accordé se calcule comme une durée : distance ÷ quoi ? Et en concours, arrondit-on vers le haut ou le bas ?'
            -   id: q02
                type: nombre
                enonce: Quel est le temps accordé, arrondi à la seconde supérieure ?
                unite: s
                aide: Convertis la vitesse imposée en m/s (ou la distance dans la bonne unité), divise, puis arrondis à la seconde au-dessus.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un cheval d’endurance fait 40 km en 2 h 30.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle vitesse moyenne en km/h ?
                aide: 2 h 30 = combien d’heures en décimal ? Puis vitesse = 40 km ÷ cette durée.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais convertir. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment convertir une vitesse ou une durée d’une unité à une autre ?'
                aide: Dis comment convertir une durée (h, min, s) et une vitesse (m/min ↔ km/h).
retenir:
    - 1 h = 60 min = 3 600 s ; 1,5 h = 1 h 30.
    - m/min × 60 ÷ 1 000 = km/h.
