titre: 'Séance 9 : Convertir des durées et des vitesses'
themes:
- EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment écrire une durée en heures décimales, et passer d’une vitesse en m/min à une vitesse en km/h ?
competences_bo:
- EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
    - 1 h = 60 min ; 1 min = 60 s ; 1 h = 3 600 s.
    - 'm/min → km/h : × 60 puis ÷ 1 000.'
    competences:
    - Convertir des minutes en heures décimales, et inversement.
    - Convertir une vitesse de m/min en km/h, et inversement.
pourquoi:
- 'Aujourd’hui, trois notions : les durées en heures décimales, les heures décimales en minutes, les vitesses en m/min et km/h.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — Des minutes aux heures décimales
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: 'Pour calculer avec une durée (vitesse, distance), il faut l’écrire en heures, avec une virgule : c’est une durée en heures décimales.'
    -   type: paragraphe
        texte: 'Exemple : 30 min, c’est une demi-heure, donc 0,5 h.'
    -   type: paragraphe
        texte: 'À retenir : Durée en h = nombre de minutes ÷ 60.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Sépare les heures entières et les minutes (2 h 15 min → 2 h et 15 min).
        - Divise les minutes par 60.
        - Ajoute aux heures entières (2 + 0,25 = 2,25 h).
        - 'Repères : 15 min = 0,25 h ; 30 min = 0,5 h ; 45 min = 0,75 h ; 6 min = 0,1 h.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. En raisonnant avec les morceaux d’heure
    -   type: liste
        elements:
        - Une heure, c’est 60 minutes.
        - '15 min, c’est un quart de 60 min : un quart d’heure = 0,25 h.'
        - '1 min, c’est 1/60 d’heure : on divise donc les minutes par 60.'
    -   type: paragraphe
        texte: 2. Pourquoi 1,30 h n’est pas 1 h 30
    -   type: liste
        elements:
        - Dans 1,30 h, le « ,30 » veut dire 30 centièmes d’heure, pas 30 minutes.
        - 0,30 h = 0,30 × 60 = 18 min. Donc 1,30 h = 1 h 18 min.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée. Donne les durées en heures décimales.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Écris 30 min en heures.
        unite: h
        aide: 30 ÷ 60.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Écris 15 min en heures.
        unite: h
        aide: 15 ÷ 60.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Écris 45 min en heures.
        unite: h
        aide: 45 ÷ 60.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Écris 12 min en heures.
        unite: h
        aide: 12 ÷ 60.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Série B — Écris 2 h 30 min en heures.
        unite: h
        aide: 2 + 30 ÷ 60.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Écris 1 h 15 min en heures.
        unite: h
        aide: 1 + 15 ÷ 60.
        calcul: true
    -   id: q07
        type: nombre
        enonce: Écris 90 min en heures.
        unite: h
        aide: 90 ÷ 60.
        calcul: true
-   id: a02
    titre: Partie 2 — Des heures décimales aux minutes
    transition: 'Tu sais passer des minutes aux heures. Deuxième notion : le chemin inverse, pour lire un résultat.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Quand un calcul donne une durée comme 2,4 h, il faut la traduire en heures et minutes pour qu’elle parle.
    -   type: paragraphe
        texte: On garde les heures entières, et on transforme la partie après la virgule en minutes.
    -   type: paragraphe
        texte: 'À retenir : Minutes = partie décimale × 60.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Sépare la partie entière (les heures) et la partie après la virgule.
        - Multiplie la partie après la virgule par 60.
        - Écris le résultat en h et min (2,4 h → 2 h et 0,4 × 60 = 24 min).
        - 'Pour une durée en minutes seulement : heures × 60.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. En raisonnant avec une heure
    -   type: liste
        elements:
        - '0,5 h, c’est la moitié d’une heure : la moitié de 60 min = 30 min.'
        - '0,1 h, c’est un dixième d’heure : 60 ÷ 10 = 6 min. Donc 0,4 h = 4 × 6 = 24 min.'
    -   type: paragraphe
        texte: 2. Pourquoi on multiplie par 60
    -   type: liste
        elements:
        - 1 h = 60 min, donc une fraction d’heure vaut la même fraction de 60 min.
        - 'Partie 1 : on divisait par 60. Ici on fait l’inverse : on multiplie par 60.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée. Donne les réponses en minutes.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — 0,5 h, c’est combien de minutes ?
        unite: min
        aide: 0,5 × 60.
        calcul: true
    -   id: q02
        type: nombre
        enonce: 0,25 h, c’est combien de minutes ?
        unite: min
        aide: 0,25 × 60.
        calcul: true
    -   id: q03
        type: nombre
        enonce: 0,4 h, c’est combien de minutes ?
        unite: min
        aide: 0,4 × 60.
        calcul: true
    -   id: q04
        type: nombre
        enonce: 0,3 h, c’est combien de minutes ?
        unite: min
        aide: 0,3 × 60.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Série B — 2,5 h, c’est combien de minutes en tout ?
        unite: min
        aide: 2,5 × 60.
        calcul: true
    -   id: q06
        type: nombre
        enonce: 1,2 h = 1 h et combien de minutes ?
        unite: min
        aide: 0,2 × 60.
        calcul: true
    -   id: q07
        type: qcm
        enonce: Un trajet dure 1,75 h. Comment l’écrire en heures et minutes ?
        choix:
        -   id: a
            texte: 1 h 75 min
        -   id: b
            texte: 1 h 07 min
        -   id: c
            texte: 1 h 45 min
        aide: 0,75 × 60 = ?
-   id: a03
    titre: Partie 3 — Les vitesses en m/min et en km/h
    transition: 'Dernière notion : comparer des vitesses données dans des unités différentes.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Au club, on mesure souvent les allures en mètres par minute (m/min). Sur la route, on parle en kilomètres par heure (km/h).
    -   type: paragraphe
        texte: Pour comparer, il faut les mettre dans la même unité.
    -   type: paragraphe
        texte: 'À retenir : m/min → km/h : × 60 puis ÷ 1 000. km/h → m/min : × 1 000 puis ÷ 60.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - 'Pour passer de m/min à m/h : multiplie par 60 (il y a 60 minutes dans une heure).'
        - 'Pour passer de m/h à km/h : divise par 1 000 (1 km = 1 000 m).'
        - 'Dans l’autre sens : × 1 000 puis ÷ 60.'
        - 'Contrôle : une vitesse en km/h est un nombre plus petit que la même en m/min.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. En raisonnant pas à pas
    -   type: liste
        elements:
        - À 250 m/min, le cheval fait 250 m chaque minute.
        - 'En 1 heure (60 minutes), il fait 60 fois plus : 250 × 60 = 15 000 m.'
        - '15 000 m = 15 km. Il fait donc 15 km en 1 heure : 15 km/h.'
    -   type: paragraphe
        texte: 2. Pourquoi deux opérations
    -   type: liste
        elements:
        - 'On change deux unités à la fois : les minutes deviennent des heures (× 60), et les mètres des kilomètres (÷ 1 000).'
        - 'Raccourci : × 60 ÷ 1 000 = × 0,06.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — 100 m/min, c’est combien de m/h ?
        unite: m/h
        aide: Multiplie par 60.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Convertis 6 000 m/h en km/h.
        unite: km/h
        aide: Divise par 1 000.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Convertis 250 m/min en km/h.
        unite: km/h
        aide: × 60, puis ÷ 1 000.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Convertis 350 m/min en km/h.
        unite: km/h
        aide: × 60, puis ÷ 1 000.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Série B — Convertis 12 km/h en m/min.
        unite: m/min
        aide: × 1 000, puis ÷ 60.
        calcul: true
    -   id: q06
        type: qcm
        enonce: Un parcours de CSO impose 350 m/min. Un cheval va à 20 km/h. Va-t-il assez vite ?
        choix:
        -   id: a
            texte: Oui, 20 km/h est plus que 350 m/min
        -   id: b
            texte: Non, 350 m/min = 21 km/h, il va trop lentement
        -   id: c
            texte: On ne peut pas comparer
        aide: Convertis 350 m/min en km/h, puis compare avec 20.
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: Écris 3 h 45 min en heures.
        unite: h
        calcul: true
    -   id: q02
        type: nombre
        enonce: Écris 6 min en heures.
        unite: h
        calcul: true
    -   id: q03
        type: nombre
        enonce: 2,2 h = 2 h et combien de minutes ?
        unite: min
        calcul: true
    -   id: q04
        type: nombre
        enonce: Convertis 200 m/min en km/h.
        unite: km/h
        calcul: true
    -   id: q05
        type: nombre
        enonce: Convertis 18 km/h en m/min.
        unite: m/min
        calcul: true
    -   id: q06
        type: nombre
        enonce: Un cheval fait 12 km en 1 h 30 min. Vitesse en km/h ?
        unite: km/h
        calcul: true
retenir:
- '1 h = 60 min. Minutes → heures : ÷ 60. Heures → minutes : × 60.'
- '30 min = 0,5 h ; 15 min = 0,25 h ; 45 min = 0,75 h. Attention : 1,5 h = 1 h 30 min, pas 1 h 50.'
- 'm/min → km/h : × 60 (pour avoir des m/h) puis ÷ 1 000 (pour avoir des km/h).'
- 'km/h → m/min : × 1 000 puis ÷ 60.'
