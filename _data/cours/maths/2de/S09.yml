titre: 'Séance 9 : km/h ou m/min ? Convertir des vitesses et des durées'
themes:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment convertir une vitesse ou une durée d’une unité à une autre ?
competences_bo:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
        - 1 h = 60 min = 3 600 s ; 1 km = 1 000 m.
        - Pour convertir une vitesse, on convertit la distance et la durée séparément.
    competences:
        - Convertir des durées (h, min, s, décimal).
        - Convertir des vitesses (m/min ↔ km/h).
pourquoi:
    - En S08, tu as calculé en m/min.
    - Les applications GPS et les règlements de concours donnent des km/h.
activites:
    -   id: a01
        titre: Les durées
        consigne: Tu vas convertir trois durées entre heures décimales, heures-minutes et secondes. On attend les trois conversions.
        contenu:
            -   type: liste
                elements:
                    - 'Automatisme : calcule 0,25 × 60 de tête.'
            -   type: etapes
                elements:
                    - 'Lis l’exemple : 1,5 h.'
                    - 1,5 h = 1 h + 0,5 h.
                    - 0,5 h = 0,5 × 60 min = 30 min.
                    - Donc 1,5 h = 1 h 30 min (et non 1 h 50).
                    - 'Dans l’autre sens : 45 min = 45 ÷ 60 h = 0,75 h.'
                    - 'À toi : convertis les durées de la question.'
                    - Pourquoi ce piège ? 1,5 h n’est pas 1 h 50.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 1 h = …… min.
                        - ''
                    -   - 1,5 h = 1 h …… min.
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: tableau
                enonce: Convertis.
                colonnes:
                    - Durée
                    - Conversion
                lignes:
                    -   - 1,25 h en h min
                        - ''
                    -   - 2 h 45 min en h décimales
                        - ''
                    -   - 3 min 30 s en s
                        - ''
                aide: 'Méthode : suis le chemin de l’énergie : 1) d’où vient-elle (source) ? 2) quel constituant la transforme (moteur, panneau, génératrice) ? 3) sous quelle forme sort-elle (lumière, mouvement, chaleur, électricité) ?'
    -   id: a02
        titre: m/min → km/h
        transition: Les durées sont maîtrisées. Passe aux vitesses.
        consigne: Tu vas convertir des vitesses de chevaux entre m/min et km/h, en convertissant distance et durée. On attend deux conversions.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : 300 m/min en km/h.'
                    - 'En 60 min : 300 × 60 = 18 000 m.'
                    - 18 000 m = 18 km (on divise par 1 000).
                    - Donc 300 m/min = 18 km/h.
                    - 'Dans l’autre sens : 6 km/h = 6 000 m en 60 min ; 6 000 ÷ 60 = 100 m/min.'
                    - 'À toi : convertis les vitesses des questions.'
                    - Pourquoi × 60 ÷ 1 000 ? On passe à l’heure, puis aux kilomètres.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Pour passer de m/min à km/h : × 60 puis ÷ …… .'
                        - ''
                    -   - 1 km = …… m.
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: nombre
                enonce: Convertis 450 m/min en km/h.
                unite: km/h
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q03
                type: nombre
                enonce: Convertis 12 km/h en m/min.
                unite: m/min
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a03
        titre: Le parcours de CSO
        transition: Tu sais convertir. Applique en concours.
        consigne: Tu vas calculer le temps accordé d’un parcours de saut d’obstacles de 450 m à 350 m/min. On attend le temps arrondi.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : un parcours de 300 m à faire à 400 m/min.'
                    - t = d ÷ v = 300 ÷ 400 = 0,75 min.
                    - 0,75 min = 0,75 × 60 = 45 s.
                    - 'À toi : un parcours de 450 m doit être fait à 350 m/min. Calcule le temps accordé en secondes, arrondi à la seconde supérieure.'
                    - Pourquoi ce calcul ? Au concours, dépasser le temps accordé coûte des pénalités.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Temps accordé = distance ÷ …… .
                        - ''
                    -   - On arrondit un temps accordé à la seconde …… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: nombre
                enonce: Quel est le temps accordé, arrondi à la seconde supérieure ?
                unite: s
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un cheval d’endurance fait 40 km en 2 h 30.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle vitesse moyenne en km/h ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais convertir. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment convertir une vitesse ou une durée d’une unité à une autre ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 1 h = 60 min = 3 600 s ; 1,5 h = 1 h 30.
    - m/min × 60 ÷ 1 000 = km/h.
sources:
