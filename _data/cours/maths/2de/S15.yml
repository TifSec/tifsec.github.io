titre: 'Séance 15 : Comparer deux séries'
themes:
- EG4, 1-1 — Organiser et traiter des données statistiques à une variable
problematique: Comment comparer deux groupes avec un indicateur de position et un indicateur de dispersion ?
competences_bo:
- EG4, 1-1 — Organiser et traiter des données statistiques à une variable
objectifs:
    connaissances:
    - 'Position : moyenne, médiane. Dispersion : étendue, écart interquartile.'
    - Pour comparer, on utilise un indicateur de chaque sorte.
    competences:
    - Calculer tous les indicateurs d’une série.
    - Comparer deux séries et conclure avec des nombres.
pourquoi:
- 'Aujourd’hui, deux notions : résumer une série avec ses indicateurs, puis comparer deux séries.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — Résumer une série
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Pour résumer une série, on donne où se trouvent les valeurs (position) et si elles sont serrées ou étalées (dispersion).
    -   type: paragraphe
        texte: 'Position : moyenne, médiane. Dispersion : étendue, écart interquartile (Q3 − Q1).'
    -   type: paragraphe
        texte: 'À retenir : Résumé d’une série = un indicateur de position + un indicateur de dispersion.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Range la série et compte n.
        - Calcule la moyenne (somme ÷ n) et la médiane.
        - Calcule Q1, Q3 et l’écart interquartile.
        - Calcule l’étendue (max − min).
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi deux sortes d’indicateurs
    -   type: liste
        elements:
        - La moyenne dit « autour de combien » sont les valeurs.
        - Elle ne dit pas si toutes sont proches de ce nombre ou très éloignées.
    -   type: paragraphe
        texte: 2. Une image
    -   type: liste
        elements:
        - 'Deux classes ont 12 de moyenne : l’une a toutes ses notes entre 10 et 14, l’autre entre 2 et 20.'
        - Seul un indicateur de dispersion montre la différence.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Lot A : gain de poids (kg par mois) de 10 poulains, déjà rangé.'
    -   type: paragraphe
        texte: 'Lot A : 28 ; 30 ; 31 ; 32 ; 33 ; 33 ; 34 ; 35 ; 36 ; 38.'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Somme des gains du lot A ?
        unite: kg
        aide: Additionne les 10 valeurs.
    -   id: q02
        type: nombre
        enonce: Moyenne du lot A ?
        unite: kg
        aide: Somme ÷ 10.
    -   id: q03
        type: nombre
        enonce: Médiane du lot A ?
        unite: kg
        aide: '10 valeurs : moyenne de la 5e et de la 6e.'
    -   id: q04
        type: nombre
        enonce: Q1 du lot A ?
        unite: kg
        aide: 10 ÷ 4 = 2,5 → rang 3.
    -   id: q05
        type: nombre
        enonce: Q3 du lot A ?
        unite: kg
        aide: 30 ÷ 4 = 7,5 → rang 8.
    -   id: q06
        type: nombre
        enonce: Série B — Écart interquartile du lot A ?
        unite: kg
        aide: Q3 − Q1.
    -   id: q07
        type: nombre
        enonce: Étendue du lot A ?
        unite: kg
        aide: Max − min.
-   id: a02
    titre: Partie 2 — Comparer deux séries
    transition: 'Tu sais résumer une série. Deuxième notion : en comparer deux.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Pour comparer deux groupes, on calcule les mêmes indicateurs pour les deux.
    -   type: paragraphe
        texte: On compare d’abord la position (qui a les plus grandes valeurs ?), puis la dispersion (qui est le plus régulier ?).
    -   type: paragraphe
        texte: 'À retenir : Comparer = même indicateur de position + même indicateur de dispersion pour les deux séries, puis une phrase chiffrée.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Calcule moyenne (ou médiane) des deux séries.
        - Calcule l’écart interquartile (ou l’étendue) des deux séries.
        - Compare les positions, puis les dispersions.
        - Conclus en une phrase avec les nombres et l’unité.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi les mêmes indicateurs
    -   type: liste
        elements:
        - 'On ne compare pas une moyenne avec une médiane : ce ne sont pas les mêmes mesures.'
        - Avec les mêmes calculs des deux côtés, la comparaison est juste.
    -   type: paragraphe
        texte: 2. Quand les moyennes sont égales
    -   type: liste
        elements:
        - Si les deux lots ont la même moyenne, la position ne les départage pas.
        - C’est alors la dispersion qui dit lequel est le plus régulier.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Lot B : gain de poids (kg par mois) de 10 autres poulains, déjà rangé.'
    -   type: paragraphe
        texte: 'Lot B : 20 ; 25 ; 28 ; 31 ; 33 ; 34 ; 36 ; 39 ; 42 ; 42.'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Moyenne du lot B ?
        unite: kg
        aide: Somme ÷ 10.
    -   id: q02
        type: nombre
        enonce: Médiane du lot B ?
        unite: kg
        aide: Moyenne de la 5e et de la 6e valeur.
    -   id: q03
        type: nombre
        enonce: Q1 du lot B ?
        unite: kg
        aide: Rang 3.
    -   id: q04
        type: nombre
        enonce: Q3 du lot B ?
        unite: kg
        aide: Rang 8.
    -   id: q05
        type: nombre
        enonce: Écart interquartile du lot B ?
        unite: kg
        aide: Q3 − Q1.
    -   id: q06
        type: nombre
        enonce: Étendue du lot B ?
        unite: kg
        aide: Max − min.
    -   id: q07
        type: qcm
        enonce: Série B — Les deux lots ont-ils la même moyenne ?
        choix:
        -   id: a
            texte: Oui, 33 kg
        -   id: b
            texte: Non
        aide: Compare tes deux moyennes.
    -   id: q08
        type: qcm
        enonce: Quel lot a la croissance la plus régulière ?
        choix:
        -   id: a
            texte: Le lot A
        -   id: b
            texte: Le lot B
        -   id: c
            texte: Pareil
        aide: Compare les écarts interquartiles (4 kg et 11 kg).
    -   id: q09
        type: nombre
        enonce: Combien de kg de différence entre les deux étendues ?
        unite: kg
        aide: 22 − 10.
    -   id: q10
        type: qcm
        enonce: Quelle conclusion est correcte ?
        choix:
        -   id: a
            texte: Le lot B grossit plus, car sa médiane est 33,5 kg.
        -   id: b
            texte: Les lots sont identiques, car la moyenne est la même.
        -   id: c
            texte: Même moyenne (33 kg), mais le lot A est plus régulier (écart interquartile 4 kg contre 11 kg).
        aide: Une bonne conclusion utilise la position ET la dispersion.
    -   id: q11
        type: nombre
        enonce: Dans le lot B, combien de poulains gagnent moins de 30 kg par mois ?
        aide: Compte les valeurs inférieures à 30.
    -   id: q12
        type: nombre
        enonce: Dans le lot A, combien de poulains gagnent moins de 30 kg par mois ?
        aide: Compte les valeurs inférieures à 30.
    -   id: q13
        type: nombre
        enonce: Quelle part du lot B gagne moins de 30 kg, en % ?
        unite: '%'
        aide: 3 ÷ 10 × 100.
-   id: a03
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: Moyenne de 30 ; 35 ; 40 ?
    -   id: q02
        type: nombre
        enonce: Écart interquartile si Q1 = 42 et Q3 = 51 ?
    -   id: q03
        type: qcm
        enonce: 'Série X : moyenne 50, écart interquartile 2. Série Y : moyenne 50, écart 9. La plus régulière ?'
        choix:
        -   id: a
            texte: X
        -   id: b
            texte: Y
    -   id: q04
        type: nombre
        enonce: Médiane de 12 ; 15 ; 15 ; 18 ; 20 ; 21 ?
retenir:
- 'Indicateurs de position : moyenne, médiane (où se situent les valeurs).'
- 'Indicateurs de dispersion : étendue, écart interquartile (si elles sont serrées ou étalées).'
- 'Pour comparer deux séries : un indicateur de position ET un indicateur de dispersion.'
- 'Conclusion : une phrase avec les nombres.'
