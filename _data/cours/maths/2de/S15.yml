titre: 'Séance 15 : Quel lot de poulains a la croissance la plus régulière ?'
themes:
    - EG4, 1-1 — Organiser et traiter des données statistiques à une variable
problematique: Comment comparer deux séries avec des indicateurs ?
competences_bo:
    - EG4, 1-1 — Organiser et traiter des données statistiques à une variable
objectifs:
    connaissances:
        - 'Comparer deux séries : un indicateur de position (moyenne ou médiane) et un de dispersion (étendue, écart interquartile).'
        - On conclut avec des phrases chiffrées.
    competences:
        - Calculer et comparer des indicateurs.
        - Rédiger une comparaison chiffrée.
pourquoi:
    - Un éleveur a deux lots de poulains nourris différemment.
    - Les gains de poids sur un mois sont-ils meilleurs et plus réguliers dans un lot ?
activites:
    -   id: a01
        titre: Les indicateurs du lot A
        consigne: Tu vas calculer la moyenne et l’étendue des gains de poids du lot A (document 1). On attend les deux indicateurs.
        contenu:
            -   type: liste
                elements:
                    - 'Automatisme : calcule 180 ÷ 6.'
            -   type: paragraphe
                texte: 'Document 1 — Gains mensuels (kg). Lot A : 26, 28, 30, 30, 32, 34. Lot B : 18, 24, 30, 31, 36, 41.'
            -   type: paragraphe
                texte: Données fictives créées pour l’exercice (ordres de grandeur réalistes).
            -   type: etapes
                elements:
                    - 'Lis l’exemple : gains d’un lot C : 20, 25, 30, 35 kg.'
                    - 'Moyenne : (20 + 25 + 30 + 35) ÷ 4 = 110 ÷ 4 = 27,5 kg.'
                    - 'Médiane : 4 valeurs → (25 + 30) ÷ 2 = 27,5 kg.'
                    - 'Étendue : 35 − 20 = 15 kg.'
                    - 'À toi : calcule la moyenne, la médiane et l’étendue du lot A (document 1).'
                    - Pourquoi plusieurs indicateurs ? Un seul ne suffit pas pour juger la régularité.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Pour comparer deux séries, on utilise un indicateur de …… .
                        - ''
                    -   - … et un indicateur de …… .
                        - ''
                aide: Pour comparer deux séries, il faut un indicateur qui dit « où se trouvent les valeurs », et un autre qui dit « si elles sont serrées ». Leurs noms ?
            -   id: q02
                type: nombre
                enonce: Moyenne du lot A ?
                unite: kg
                aide: Additionne les gains de poids du lot A et divise par le nombre de poulains.
            -   id: q03
                type: nombre
                enonce: Étendue du lot A ?
                unite: kg
                aide: Gain le plus grand du lot A moins gain le plus petit.
    -   id: a02
        titre: Le lot B
        transition: Le lot A est résumé. Fais pareil pour le lot B.
        consigne: Tu vas calculer la moyenne et l’étendue des gains du lot B. On attend les deux indicateurs.
        contenu:
            -   type: etapes
                elements:
                    - 'Rappel : moyenne = somme ÷ nombre de valeurs ; étendue = max − min.'
                    - Utilise exactement la même méthode que pour le lot A.
                    - 'À toi : calcule les mêmes indicateurs pour le lot B.'
                    - Pourquoi les mêmes ? On ne compare que ce qui est comparable.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - On calcule les …… indicateurs pour les deux séries.
                        - ''
                    -   - Une étendue plus grande signifie une série plus …… .
                        - ''
                aide: 'Peut-on comparer si on ne calcule pas les mêmes indicateurs ? Et une grande étendue : série serrée ou étalée ?'
            -   id: q02
                type: nombre
                enonce: Moyenne du lot B ?
                unite: kg
                aide: Même calcul que pour le lot A, avec les valeurs du lot B.
            -   id: q03
                type: nombre
                enonce: Étendue du lot B ?
                unite: kg
                aide: Plus grand gain moins plus petit gain du lot B.
    -   id: a03
        titre: Conclure
        transition: Les deux lots sont résumés. Que conclure ?
        consigne: Tu vas rédiger une conclusion chiffrée comparant les deux lots de poulains. On attend une conclusion sur la position et la dispersion.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : lots C et D, même moyenne 27,5 kg ; étendue 15 kg et 4 kg.'
                    - 'Phrase 1 (position) : « Les deux lots ont le même gain moyen, 27,5 kg par mois. »'
                    - 'Phrase 2 (dispersion) : « Le lot D est plus régulier : étendue de 4 kg contre 15 kg. »'
                    - 'À toi : compare les lots A et B et rédige deux phrases chiffrées.'
                    - Pourquoi deux phrases ? Une pour la position, une pour la dispersion.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - On conclut avec des phrases …… .
                        - ''
                    -   - Même moyenne ne veut pas dire même …… .
                        - ''
                aide: Une conclusion se fait avec des phrases qui contiennent des chiffres. Et deux lots de même moyenne ont-ils forcément la même régularité ?
            -   id: q02
                type: texte
                enonce: Rédige ta conclusion pour l’éleveur.
                aide: Compare d’abord les moyennes, puis les étendues, avec les chiffres. Dis quel lot est le plus régulier.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un poulain du lot B à 18 kg est peut-être malade.
        questions:
            -   id: q01
                type: texte
                enonce: Si on l’enlève, que devient la moyenne du lot B ?
                aide: Enlève 18 kg de la somme du lot B et divise par un poulain de moins.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais comparer deux séries. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment comparer deux séries avec des indicateurs ?'
                aide: 'Dis la méthode : mêmes indicateurs pour les deux lots, puis comparaison de la position et de la dispersion.'
retenir:
    - Position + dispersion.
    - Conclusion chiffrée.
