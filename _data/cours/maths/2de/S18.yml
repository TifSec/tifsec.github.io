titre: 'Séance 18 : Évaluation 2 — Statistiques'
themes:
- EG4, 1-1 — Organiser et traiter des données statistiques à une variable
problematique: Sais-tu décrire et comparer des séries statistiques sans aide ?
competences_bo:
- EG4, 1-1 — Organiser et traiter des données statistiques à une variable
objectifs:
    connaissances:
    - Effectifs, fréquences, classes, histogramme.
    - Moyenne, médiane, mode, étendue, quartiles.
    competences:
    - Refaire seul, sans aide, les calculs des séances 11 à 17.
pourquoi:
- 'Évaluation : 20 exercices, 1 point chacun. Calculatrice autorisée, pas d’aide.'
- Écris tes calculs sur ta feuille.
activites:
-   id: a01
    titre: Partie 1 — Effectifs et fréquences
    consigne: Fais les exercices dans l’ordre. Écris tes calculs sur ta feuille.
    contenu:
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Robes des 25 chevaux d’une écurie :'
    -   type: tableau
        colonnes:
        - Robe
        - Effectif
        lignes:
        -   - Bai
            - '10'
        -   - Alezan
            - '7'
        -   - Gris
            - '5'
        -   - Noir
            - '3'
    questions:
    -   id: q01
        type: nombre
        enonce: Exercice 1 — Effectif total ?
    -   id: q02
        type: nombre
        enonce: Exercice 2 — Fréquence des bais, en % ?
        unite: '%'
    -   id: q03
        type: nombre
        enonce: Exercice 3 — Fréquence des noirs, en % ?
        unite: '%'
    -   id: q04
        type: qcm
        enonce: Exercice 4 — La robe est un caractère…
        choix:
        -   id: a
            texte: quantitatif
        -   id: b
            texte: qualitatif
-   id: a02
    titre: Partie 2 — Histogramme
    consigne: Fais les exercices dans l’ordre. Écris tes calculs sur ta feuille.
    contenu:
    -   type: titre
        texte: Exercices
    -   type: image
        url: /assets/images/graphiques/maths-2de-s18-classique-temps.svg
        alternative: 'Histogramme des durées de travail : [20 ; 30[ 4, [30 ; 40[ 9, [40 ; 50[ 5, [50 ; 60[ 2.'
        legende: 'Histogramme des durées de travail : [20 ; 30[ 4, [30 ; 40[ 9, [40 ; 50[ 5, [50 ; 60[ 2.'
    questions:
    -   id: q01
        type: nombre
        enonce: Exercice 5 — Combien de chevaux dans la classe [30 ; 40[ ?
    -   id: q02
        type: nombre
        enonce: Exercice 6 — Combien de chevaux en tout ?
    -   id: q03
        type: nombre
        enonce: Exercice 7 — Combien de chevaux travaillent 40 min ou plus ?
    -   id: q04
        type: nombre
        enonce: Exercice 8 — Fréquence de la classe modale, en % ?
        unite: '%'
-   id: a03
    titre: Partie 3 — Indicateurs
    consigne: Fais les exercices dans l’ordre. Écris tes calculs sur ta feuille.
    contenu:
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Durées de pansage (min) de 10 élèves, rangées : 35 ; 38 ; 40 ; 41 ; 42 ; 44 ; 45 ; 47 ; 50 ; 58.'
    questions:
    -   id: q01
        type: nombre
        enonce: Exercice 9 — Moyenne ?
        unite: min
    -   id: q02
        type: nombre
        enonce: Exercice 10 — Médiane ?
        unite: min
    -   id: q03
        type: nombre
        enonce: Exercice 11 — Étendue ?
        unite: min
    -   id: q04
        type: nombre
        enonce: Exercice 12 — Q1 ?
        unite: min
    -   id: q05
        type: nombre
        enonce: Exercice 13 — Q3 ?
        unite: min
    -   id: q06
        type: nombre
        enonce: Exercice 14 — Écart interquartile ?
        unite: min
    -   id: q07
        type: nombre
        enonce: Exercice 15 — Mode de la série 3 ; 5 ; 5 ; 6 ; 8 ; 8 ; 8 ; 9 ?
-   id: a04
    titre: Partie 4 — Comparer et évoluer
    consigne: Fais les exercices dans l’ordre. Écris tes calculs sur ta feuille.
    contenu:
    -   type: titre
        texte: Exercices
    questions:
    -   id: q01
        type: qcm
        enonce: 'Exercice 16 — Lot A : moyenne 45 kg, écart interquartile 3 kg. Lot B : moyenne 45 kg, écart 9 kg. Le plus régulier ?'
        choix:
        -   id: a
            texte: Lot A
        -   id: b
            texte: Lot B
        -   id: c
            texte: Pareil
    -   id: q02
        type: qcm
        enonce: Exercice 17 — Salaires 900 ; 950 ; 1 000 ; 1 050 ; 3 000 €. Quel indicateur résume le mieux ?
        choix:
        -   id: a
            texte: La moyenne
        -   id: b
            texte: La médiane
    -   id: q03
        type: nombre
        enonce: Exercice 18 — Moyenne de ces salaires ?
        unite: €
    -   id: q04
        type: nombre
        enonce: Exercice 19 — Des naissances passent de 1 200 à 1 500. Taux d’évolution en % ?
        unite: '%'
    -   id: q05
        type: nombre
        enonce: Exercice 20 — Elles passent de 800 à 720. Taux d’évolution en % ?
        unite: '%'
retenir:
- Fréquence = effectif ÷ total.
- 'Moyenne = somme ÷ effectif ; médiane : valeur du milieu de la série rangée.'
- 'Q1 : rang n ÷ 4 ; Q3 : rang 3n ÷ 4 (arrondis au-dessus).'
- 'Comparer : position + dispersion.'
