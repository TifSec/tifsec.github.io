titre: 'Séance 18 : Évaluation 2 : statistiques'
themes:
    - EG4, 1-1 — Organiser et traiter des données statistiques à une variable
problematique: Saurai-je décrire et comparer des séries statistiques en autonomie ?
competences_bo:
    - EG4, 1-1 — Organiser et traiter des données statistiques à une variable
objectifs:
    connaissances:
        - 'On réutilise : effectifs, fréquences, classes, moyenne, médiane, quartiles, étendue, comparaison.'
    competences:
        - Décrire et comparer des séries en autonomie.
pourquoi:
    - De S11 à S17, tu as travaillé les statistiques.
    - 'Évaluation : les temps de travail de deux palefreniers.'
activites:
    -   id: a01
        titre: Décrire une série
        consigne: Tu vas calculer la moyenne, la médiane et l’étendue des temps du palefrenier A (document 1). On attend les trois indicateurs.
        contenu:
            -   type: paragraphe
                texte: 'Document 1 — Temps (min) pour curer 4 boxes. A : 40, 42, 45, 46, 52. B : 30, 38, 45, 55, 57.'
            -   type: paragraphe
                texte: Données fictives créées pour l’exercice (ordres de grandeur réalistes).
            -   type: etapes
                elements:
                    - Lis les temps (document 1) du palefrenier A.
                    - Calcule moyenne, médiane, étendue.
            -   type: paragraphe
                texte: Pourquoi ces indicateurs ? Position et dispersion.
        questions:
            -   id: q01
                type: nombre
                enonce: Moyenne de A ?
                unite: min
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: nombre
                enonce: Médiane de A ?
                unite: min
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q03
                type: nombre
                enonce: Étendue de A ?
                unite: min
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a02
        titre: Comparer
        transition: A est décrit. Passe à B.
        consigne: Tu vas calculer la moyenne et l’étendue des temps du palefrenier B. On attend les deux indicateurs.
        contenu:
            -   type: etapes
                elements:
                    - Calcule les mêmes indicateurs pour B.
                    - Compare.
            -   type: paragraphe
                texte: Pourquoi comparer ? Pour organiser le planning de l’écurie.
        questions:
            -   id: q01
                type: nombre
                enonce: Moyenne de B ?
                unite: min
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: nombre
                enonce: Étendue de B ?
                unite: min
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a03
        titre: Conclure
        transition: Les deux séries sont décrites. Que dire au responsable ?
        consigne: Tu vas rédiger une conclusion chiffrée comparant les deux palefreniers. On attend une conclusion sur position et dispersion.
        contenu:
            -   type: etapes
                elements:
                    - Rédige une conclusion chiffrée pour le responsable.
            -   type: paragraphe
                texte: Pourquoi une conclusion ? Les chiffres doivent servir une décision.
        questions:
            -   id: q01
                type: texte
                enonce: Rédige ta conclusion.
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Construis le tableau des effectifs par classe [30 ; 40[, [40 ; 50[, [50 ; 60[ pour les 10 temps.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle est la classe modale ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: L’évaluation est terminée. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : saurais-tu décrire et comparer des séries en autonomie ? Fais ton bilan.'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Position et dispersion ; conclusion chiffrée.
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
