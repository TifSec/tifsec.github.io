titre: 'Séance 4 : La quatrième proportionnelle : dose de vermifuge et poids du cheval'
themes:
- EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment calculer une dose proportionnelle au poids, et estimer un poids quand on n’a pas de balance ?
competences_bo:
- EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
    - 'Passage à l’unité : valeur pour 1, puis × la quantité voulue.'
    - 'Produit en croix : a → b ; c → x donne x = b × c ÷ a.'
    - 'Estimer : lire entre deux valeurs d’un tableau.'
    competences:
    - Calculer une dose par le passage à l’unité.
    - Calculer une dose par le produit en croix et l’arrondir comme la notice le demande.
    - Estimer un poids avec un tableau.
pourquoi:
- 'Aujourd’hui, trois notions : le passage à l’unité, le produit en croix, l’estimation.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — Le passage à l’unité
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Pour trouver une valeur proportionnelle, on peut d’abord calculer la valeur pour 1 (1 kg, 1 cheval…).
    -   type: paragraphe
        texte: Ensuite, on multiplie par la quantité voulue.
    -   type: paragraphe
        texte: 'À retenir : Valeur pour 1 = valeur connue ÷ quantité connue ; puis × la quantité voulue.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Écris la correspondance connue (100 kg → 1 graduation).
        - 'Calcule pour 1 kg : 1 ÷ 100 = 0,01 graduation.'
        - Multiplie par le poids voulu.
        - 'Contrôle : un cheval plus lourd reçoit plus.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi passer par 1
    -   type: liste
        elements:
        - « Pour 1 kg » est la plus petite part commune.
        - Une fois connue, on peut l’utiliser pour n’importe quel poids.
    -   type: paragraphe
        texte: 2. Une autre façon
    -   type: liste
        elements:
        - 520 kg, c’est 5,2 fois 100 kg.
        - 'Donc 5,2 fois 1 graduation : 5,2 graduations.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Notice fictive : 1 graduation de seringue pour 100 kg de poids.'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Graduations pour un cheval de 500 kg ?
        unite: graduations
        aide: 500 ÷ 100.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Graduations pour un cheval de 520 kg ?
        unite: graduations
        aide: 520 × 0,01.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Graduations pour un poney de 250 kg ?
        unite: graduations
        aide: 250 × 0,01.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Graduations pour un cheval de 640 kg ?
        unite: graduations
        aide: 640 × 0,01.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Série B — 3 sacs coûtent 42 €. Prix d’un sac ?
        unite: €
        aide: 42 ÷ 3.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Prix de 7 sacs ?
        unite: €
        aide: 14 × 7.
        calcul: true
    -   id: q07
        type: nombre
        enonce: 5 L de shampooing pour 20 chevaux. Combien pour 12 chevaux ?
        unite: L
        aide: 'Pour 1 cheval : 0,25 L.'
        calcul: true
-   id: a02
    titre: Partie 2 — Le produit en croix
    transition: 'Tu sais passer par l’unité. Deuxième notion : une méthode directe.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Le produit en croix donne directement la valeur manquante dans un tableau de proportionnalité à 4 cases.
    -   type: paragraphe
        texte: Pour un médicament, on arrondit ensuite comme la notice le demande.
    -   type: paragraphe
        texte: 'À retenir : a → b ; c → x : x = b × c ÷ a. Notice : arrondir à la demi-graduation supérieure.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Place les 3 nombres connus dans un tableau à 4 cases.
        - Multiplie les deux nombres de la diagonale complète.
        - Divise par le nombre en face de x.
        - 'Arrondis : pour une dose, à la demi-graduation au-dessus (5,2 → 5,5).'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. D’où vient la formule
    -   type: liste
        elements:
        - 'Coefficient : k = b ÷ a. Donc x = c × (b ÷ a) = b × c ÷ a.'
        - On a juste changé l’ordre des calculs.
    -   type: paragraphe
        texte: 2. Pourquoi arrondir au-dessus
    -   type: liste
        elements:
        - Une dose trop faible peut ne pas être efficace.
        - La notice demande donc d’arrondir à la demi-graduation supérieure.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Notice fictive : 2 graduations pour 200 kg ; arrondir à la demi-graduation supérieure.'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Dose calculée pour 520 kg (avant arrondi) ?
        unite: graduations
        aide: 2 × 520 ÷ 200.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Dose arrondie pour 520 kg ?
        unite: graduations
        aide: Demi-graduation au-dessus.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Dose calculée pour 680 kg ?
        unite: graduations
        aide: 2 × 680 ÷ 200.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Dose arrondie pour 680 kg ?
        unite: graduations
        aide: Demi-graduation au-dessus.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Dose arrondie pour 310 kg ?
        unite: graduations
        aide: 3,1 → au-dessus.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Série B — 4 kg de granulés pour 500 kg de cheval ; combien pour 450 kg ?
        unite: kg
        aide: 4 × 450 ÷ 500.
        calcul: true
    -   id: q07
        type: nombre
        enonce: Une seringue = 6 graduations. Combien de seringues pour un cheval de trait de 900 kg (2 graduations pour 200 kg) ?
        unite: seringues
        aide: 9 graduations ÷ 6.
        calcul: true
-   id: a03
    titre: Partie 3 — Estimer le poids
    transition: 'Dernière notion : sans balance, comment connaître le poids pour calculer la dose ?'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Estimer, c’est trouver une valeur approchée.
    -   type: paragraphe
        texte: Un tableau donne le poids approximatif d’un cheval selon son tour de poitrine, mesuré au ruban.
    -   type: paragraphe
        texte: 'À retenir : Entre deux lignes du tableau, on estime avec la valeur du milieu.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Mesure le tour de poitrine.
        - Cherche-le dans le tableau.
        - S’il est entre deux colonnes, prends le milieu des deux poids.
        - Utilise ce poids pour calculer la dose.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi le milieu
    -   type: liste
        elements:
        - 185 cm est pile entre 180 et 190.
        - 'Le poids est donc à peu près entre 470 et 530 kg, au milieu : 500 kg.'
    -   type: paragraphe
        texte: 2. Est-ce proportionnel ?
    -   type: liste
        elements:
        - '410 ÷ 170 ≈ 2,41 ; 600 ÷ 200 = 3 : les quotients changent.'
        - 'Ce n’est pas proportionnel : on ne peut pas utiliser un coefficient, seulement lire le tableau.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Tableau d’estimation du poids :'
    -   type: tableau
        colonnes:
        - Tour de poitrine (cm)
        - '170'
        - '180'
        - '190'
        - '200'
        lignes:
        -   - Poids estimé (kg)
            - '410'
            - '470'
            - '530'
            - '600'
    -   type: paragraphe
        texte: Document — Estimation du poids d’un cheval de selle (ordre de grandeur, données indicatives).
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Poids estimé pour 190 cm ?
        unite: kg
        aide: Lis la colonne 190.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Poids estimé pour 185 cm ?
        unite: kg
        aide: Milieu entre 470 et 530.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Poids estimé pour 195 cm ?
        unite: kg
        aide: Milieu entre 530 et 600.
        calcul: true
    -   id: q04
        type: qcm
        enonce: Le poids est-il proportionnel au tour de poitrine ?
        choix:
        -   id: a
            texte: Oui
        -   id: b
            texte: Non
        aide: Calcule 410 ÷ 170 et 600 ÷ 200.
    -   id: q05
        type: nombre
        enonce: Série B — Dose arrondie (2 graduations pour 200 kg) pour un cheval de 185 cm de tour de poitrine ?
        unite: graduations
        aide: Poids 500 kg ; 2 × 500 ÷ 200.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Dose arrondie pour 195 cm de tour de poitrine ?
        unite: graduations
        aide: Poids 565 kg ; 5,65 → demi-graduation au-dessus.
        calcul: true
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: '1 graduation pour 100 kg : dose pour 470 kg ?'
        unite: graduations
        calcul: true
    -   id: q02
        type: nombre
        enonce: Arrondie à la demi-graduation supérieure ?
        unite: graduations
        calcul: true
    -   id: q03
        type: nombre
        enonce: 6 kg pour 400 kg ; combien pour 560 kg ?
        unite: kg
        calcul: true
    -   id: q04
        type: nombre
        enonce: Poids estimé pour 175 cm ?
        unite: kg
        calcul: true
retenir:
- 'Passage à l’unité : on calcule pour 1, puis on multiplie.'
- 'Produit en croix : x = b × c ÷ a.'
- 'Une dose de médicament s’arrondit comme la notice le dit (ici : à la demi-graduation supérieure).'
- 'Estimer : prendre la valeur du milieu entre deux lignes du tableau.'
