titre: 'Séance 4 : Quelle dose de vermifuge pour un cheval de 520 kg ?'
themes:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment calculer une quantité proportionnelle à partir d’une valeur connue ?
competences_bo:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
        - 'Quatrième proportionnelle : si 100 kg → 1 graduation, alors 520 kg → 5,2 graduations.'
        - 'Méthodes : passage à l’unité, coefficient, produit en croix.'
    competences:
        - Calculer une quatrième proportionnelle.
        - Choisir une méthode adaptée.
pourquoi:
    - En S03, tu as reconnu la proportionnalité.
    - 'Une notice de vermifuge (fictive) donne la dose selon le poids : il faut calculer la bonne dose.'
activites:
    -   id: a01
        titre: Le passage à l’unité
        consigne: Tu vas calculer avec la notice fictive (document 1) la dose de vermifuge pour un cheval de 520 kg et un poney de 250 kg. On attend les deux doses.
        contenu:
            -   type: liste
                elements:
                    - 'Automatisme : calcule 520 ÷ 100 de tête.'
            -   type: citation
                texte: 'Document 1 — Notice fictive : « 1 graduation de seringue pour 100 kg de poids vif. Arrondir à la demi-graduation supérieure. Une seringue = 6 graduations. »'
            -   type: paragraphe
                texte: Notice inventée pour l’exercice ; ne pas utiliser pour un vrai traitement.
            -   type: etapes
                elements:
                    - 'Lis l’exemple : une notice donne 1 graduation pour 100 kg. Dose pour un cheval de 430 kg ?'
                    - 'Pour 1 kg : 1 ÷ 100 = 0,01 graduation.'
                    - 'Pour 430 kg : 430 × 0,01 = 4,3 graduations.'
                    - 'Raccourci : 430 ÷ 100 = 4,3.'
                    - 'À toi : lis la notice (document 1) et calcule la dose pour chaque animal des questions.'
                    - Pourquoi passer par 1 kg ? On trouve d’abord la dose pour une unité, puis on multiplie.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Passage à l’unité : on calcule d’abord la valeur pour …… unité.'
                        - ''
                    -   - Puis on …… par la quantité voulue.
                        - ''
                aide: 'Relis l’exemple : on calcule d’abord pour combien d’unités (1 kg ? 1 graduation ?) avant de passer à la quantité voulue, et avec quelle opération ?'
            -   id: q02
                type: nombre
                enonce: Combien de graduations pour un cheval de 520 kg ?
                unite: graduations
                aide: 'D’après la notice du document 1 : 1 graduation pour 100 kg. Combien de fois 100 kg dans 520 kg ?'
            -   id: q03
                type: nombre
                enonce: Combien de graduations pour un poney de 250 kg ?
                unite: graduations
                aide: 'Même règle que pour le cheval : combien de « 100 kg » dans 250 kg ?'
    -   id: a02
        titre: Le produit en croix
        transition: Tu sais passer par l’unité. Essaie le produit en croix.
        consigne: Tu vas calculer la dose pour un cheval de trait de 680 kg avec le produit en croix et le nombre de seringues. On attend la dose et la justification.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : 100 kg → 1 graduation ; 360 kg → x.'
                    - 'Produit en croix : x = 360 × 1 ÷ 100.'
                    - x = 3,6 graduations.
                    - 'La notice dit d’arrondir à la graduation supérieure : 3,6 → 4 graduations.'
                    - 'À toi : fais le même calcul pour le cheval de trait de 680 kg.'
                    - Pourquoi l’arrondi supérieur ? Une dose trop faible est inefficace et favorise les résistances.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Produit en croix : x = (b × c) ÷ …… .'
                        - ''
                    -   - Pour une dose, on arrondit au …… quand la notice le demande.
                        - ''
                aide: Dans le produit en croix, par quel nombre divise-t-on (celui qui est en face de x) ? Et pour un médicament, faut-il arrondir vers le haut ou le bas ?
            -   id: q02
                type: nombre
                enonce: Dose calculée pour un cheval de trait de 680 kg ?
                unite: graduations
                aide: Applique la même règle à 680 kg (ou fais le produit en croix avec 100 kg → 1 graduation).
            -   id: q03
                type: texte
                enonce: Combien de seringues faut-il, et pourquoi ?
                aide: Arrondis la dose comme la notice le demande, puis compare au nombre de graduations d’une seringue.
    -   id: a03
        titre: Estimer le poids
        transition: La dose dépend du poids. Comment connaître le poids sans balance ?
        consigne: Tu vas estimer le poids d’un cheval à partir de son tour de poitrine avec le document 2. On attend le poids estimé.
        contenu:
            -   type: tableau
                titre: Document 2 — Estimation du poids (ordre de grandeur, cheval de selle)
                colonnes:
                    - Tour de poitrine (cm)
                    - '170'
                    - '180'
                    - '190'
                    - '200'
                lignes:
                    -   - Poids estimé (kg)
                        - '410'
                        - '470'
                        - '530'
                        - '600'
            -   type: etapes
                elements:
                    - 'Lis l’exemple : dans le document 2, on veut le poids pour 175 cm.'
                    - 175 est au milieu entre 170 et 180.
                    - 'On prend le milieu des poids : (410 + 470) ÷ 2.'
                    - (410 + 470) ÷ 2 = 880 ÷ 2 = 440 kg.
                    - 'À toi : estime de la même façon le poids pour 185 cm de tour de poitrine.'
                    - 'Pourquoi estimer ? Peu d’écuries ont une balance : une erreur de poids donne une erreur de dose.'
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Sans balance, on peut …… le poids avec le tour de poitrine.
                        - ''
                    -   - Une erreur de poids donne une erreur de …… .
                        - ''
                aide: Sans balance, quelle mesure du corps du cheval utilise-t-on ? Et si le poids est faux, quelle quantité calculée sera fausse ?
            -   id: q02
                type: nombre
                enonce: D’après le document 2, quel poids estimes-tu pour 185 cm (milieu entre 180 et 190) ?
                unite: kg
                aide: Dans le document 2, lis les poids pour 180 cm et pour 190 cm, puis prends la valeur au milieu.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Ce tableau barymétrique est-il proportionnel ?
        questions:
            -   id: q01
                type: texte
                enonce: Vérifie avec deux quotients.
                aide: 'Calcule poids ÷ tour de poitrine pour deux lignes du tableau barymétrique : les quotients sont-ils égaux ?'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais calculer une dose proportionnelle. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment calculer une quantité proportionnelle à partir d’une valeur connue ?'
                aide: Cite les méthodes vues (passage à l’unité, produit en croix) et la règle d’arrondi pour une dose.
retenir:
    - '4e proportionnelle : unité, coefficient, produit en croix.'
    - Arrondir selon la notice.
