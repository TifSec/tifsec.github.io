titre: 'Séance 3 : La ration est-elle proportionnelle au poids du cheval ?'
themes:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment savoir si deux grandeurs sont proportionnelles ?
competences_bo:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
        - Deux grandeurs sont proportionnelles si on passe de l’une à l’autre en multipliant toujours par le même nombre (coefficient).
        - On le vérifie avec les quotients d’un tableau, ou avec un graphique.
    competences:
        - Reconnaître un tableau de proportionnalité.
        - Calculer un coefficient de proportionnalité.
pourquoi:
    - 'À l’écurie, on dit souvent : « Le foin, c’est environ 1,5 à 2 % du poids. »'
    - Est-ce une situation de proportionnalité ?
activites:
    -   id: a01
        titre: Le tableau du foin
        consigne: Tu vas vérifier si le tableau du foin selon le poids (tableau 1) est un tableau de proportionnalité. On attend les quotients et ta conclusion.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: On dit qu’un cheval mange environ 2 % de son poids en foin par jour. Le tableau du foin selon le poids est-il un tableau de proportionnalité ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Deux grandeurs sont proportionnelles quand on passe de l’une à l’autre en multipliant toujours par le même nombre, appelé coefficient de proportionnalité.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Calculer une ration, une dose, un prix à partir d’un seul exemple.
                    - Reconnaître les situations où le produit en croix est permis.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - Dans le tableau, on divise la 2e ligne par la 1re, colonne par colonne.
                    - 'Si tous les quotients sont égaux, le tableau est de proportionnalité : ce quotient est le coefficient.'
                    - Si un seul quotient est différent, ce n’est pas proportionnel.
            -   type: paragraphe
                texte: 'À retenir : Proportionnel = quotients y ÷ x tous égaux.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - 2 chevaux → 10 L ; 5 chevaux → 25 L ; 8 chevaux → 40 L. Est-ce proportionnel ?
                    - 1 sac → 12 € ; 2 sacs → 22 €. Est-ce proportionnel ?
            -   type: liste
                elements:
                    - 'Automatisme : calcule 0,02 × 500 de tête.'
            -   type: tableau
                titre: Tableau 1 — Foin selon le poids (règle simplifiée)
                colonnes:
                    - Poids (kg)
                    - '300'
                    - '450'
                    - '600'
                lignes:
                    -   - Foin (kg/jour)
                        - '6'
                        - '9'
                        - '12'
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : dans le tableau 1, calcule foin ÷ poids pour chaque colonne.'
                    - Pourquoi diviser ? Si le quotient est toujours le même, c’est proportionnel.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Deux grandeurs sont proportionnelles si on multiplie toujours par le même …… .
                        - ''
                    -   - Dans un tableau de proportionnalité, les …… y ÷ x sont égaux.
                        - ''
                aide: 'Relis l’exemple : 300 kg → 6 kg, 450 kg → 9 kg. Par quoi multiplie-t-on à chaque fois ? Et que calcule-t-on pour le vérifier ?'
            -   id: q02
                type: tableau
                enonce: Calcule foin ÷ poids.
                colonnes:
                    - Poids (kg)
                    - Foin ÷ poids
                lignes:
                    -   - 300 (6 kg)
                        - ''
                    -   - 450 (9 kg)
                        - ''
                    -   - 600 (12 kg)
                        - ''
                aide: 'Pour chaque colonne du tableau 1 : kg de foin ÷ poids du cheval.'
            -   id: q03
                type: qcm
                enonce: Ce tableau est-il de proportionnalité ?
                choix:
                    -   id: a
                        texte: Oui, le coefficient est toujours 0,02.
                    -   id: b
                        texte: Non.
                    -   id: c
                        texte: On ne peut pas savoir.
                aide: 'Regarde tes trois quotients : sont-ils tous égaux ?'
    -   id: a02
        titre: 'Un contre-exemple : le prix de la pension'
        transition: Le foin est proportionnel. Tout est-il proportionnel ?
        consigne: Tu vas tester si le prix d’une pension temporaire (tableau 2) est proportionnel au nombre de jours. On attend les quotients et ta conclusion justifiée.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Une pension temporaire coûte 110 € pour 5 jours et 170 € pour 10 jours. Le prix double-t-il quand le nombre de jours double ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Un contre-exemple est une situation qui ressemble à de la proportionnalité mais n’en est pas, souvent à cause de frais fixes.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Ne pas utiliser à tort un coefficient ou un produit en croix.
                    - Lire correctement un tarif avec frais fixes.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - On calcule les quotients prix ÷ jours.
                    - S’ils sont différents, ce n’est pas proportionnel.
                    - 'On cherche la cause : une partie fixe qui ne dépend pas du nombre de jours.'
            -   type: paragraphe
                texte: 'À retenir : Des frais fixes rendent une situation non proportionnelle.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Une leçon coûte 15 € plus 20 € d’adhésion. Calcule le prix pour 1 et 2 leçons. Proportionnel ?
            -   type: tableau
                titre: Tableau 2 — Pension temporaire (fictive)
                colonnes:
                    - Jours
                    - '5'
                    - '10'
                lignes:
                    -   - Prix (€)
                        - '110'
                        - '170'
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : le tableau 2 suit la règle « pension = 50 € de frais fixes + 12 € par jour ». Calcule prix ÷ jours pour chaque colonne.'
                    - Pourquoi un contre-exemple ? Beaucoup de situations ressemblent à de la proportionnalité sans en être.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Des frais fixes rendent une situation …… proportionnelle.
                        - ''
                    -   - Si les quotients sont différents, la situation n’est …… proportionnelle.
                        - ''
                aide: La pension compte 50 € fixes en plus des jours. Avec ce montant fixe, peut-on encore multiplier toujours par le même nombre ?
            -   id: q02
                type: tableau
                enonce: Calcule prix ÷ jours (arrondi au centime).
                colonnes:
                    - Jours
                    - Prix ÷ jours
                lignes:
                    -   - 5 (110 €)
                        - ''
                    -   - 10 (170 €)
                        - ''
                aide: 'Pour chaque colonne du tableau 2 : prix ÷ nombre de jours, arrondi au centime.'
            -   id: q03
                type: texte
                enonce: Ce tableau est-il de proportionnalité ? Justifie.
                aide: Compare les deux quotients de la question précédente et trouve ce qui les rend différents dans le tarif.
    -   id: a03
        titre: Sur un graphique
        transition: Tu sais tester avec un tableau. Vérifie avec un graphique.
        consigne: Tu vas représenter le tableau du foin sur un graphique et vérifier l’alignement avec l’origine. On attend la description et la conclusion.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Peut-on voir la proportionnalité d’un coup d’œil, sur un graphique ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Le graphique d’une situation de proportionnalité est une droite qui passe par l’origine du repère (0 ; 0).
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Reconnaître la proportionnalité sans calcul.
                    - Lire des valeurs sur le graphique.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - On place un point pour chaque colonne du tableau, et le point (0 ; 0).
                    - On regarde si tous les points sont sur une même droite.
                    - Si cette droite passe par l’origine, la situation est proportionnelle.
            -   type: paragraphe
                texte: 'À retenir : Proportionnalité : points alignés sur une droite qui passe par l’origine.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Les points (5 ; 110) et (10 ; 170) de la pension sont-ils alignés avec l’origine ?
            -   type: image
                url: /assets/images/graphiques/maths-2de-s03-proportion.svg
                alternative: Points du tableau 1 et droite qui les relie.
                legende: Points du tableau 1 et droite qui les relie.
            -   type: titre
                texte: Comment faire ce graphique
            -   type: etapes
                elements:
                    - 'Sur une feuille (papier millimétré si possible), trace un repère orthogonal : deux axes qui se croisent à angle droit (90°). L’unité peut être différente d’un axe à l’autre.'
                    - Sur l’axe des abscisses (axe horizontal, x, qui se lit de gauche à droite), gradue régulièrement le poids du cheval, de 0 à 600 kg (par exemple 1 cm pour 100 kg).
                    - Sur l’axe des ordonnées (axe vertical, y, qui se lit de bas en haut), gradue régulièrement le foin par jour, de 0 à 12 kg (par exemple 1 cm pour 2 kg).
                    - Place un point par colonne du tableau 1, plus le point (0 ; 0), puis trace à la règle la droite qui passe par ces points.
                    - 'Écris le titre : « Foin selon le poids ».'
            -   type: titre
                texte: Comment le lire
            -   type: liste
                elements:
                    - Chaque point correspond à une colonne du tableau 1.
                    - Vérifie si la droite passe par l’origine (0 ; 0).
            -   type: titre
                texte: Comment le comprendre
            -   type: liste
                elements:
                    - Points alignés + droite passant par l’origine = situation de proportionnalité.
                    - 'Le coefficient (0,02) est la pente de la droite : 1 kg de poids en plus donne 0,02 kg de foin en plus.'
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : place les points du tableau 1 (poids en abscisse, foin en ordonnée), puis regarde s’ils sont alignés avec l’origine.'
                    - 'Pourquoi l’origine ? 0 kg de cheval → 0 kg de foin : la droite passe par (0 ; 0).'
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Le graphique d’une situation de proportionnalité est une …… .
                        - ''
                    -   - Cette droite passe par l’…… du repère.
                        - ''
                aide: 'Place les points (poids ; foin) : quelle forme forment-ils ? Par quel point particulier passe la ligne ?'
            -   id: q02
                type: texte
                enonce: Décris le graphique obtenu et ce qu’il prouve.
                aide: Décris l’alignement des points et regarde où arrive la droite quand le poids vaut 0.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La règle des 2 % n’est qu’un ordre de grandeur.
        questions:
            -   id: q01
                type: texte
                enonce: Donne une raison pour laquelle la ration réelle peut s’en écarter.
                aide: Deux chevaux de même poids mangent-ils pareil ? Pense au travail, à l’âge, à la gestation, à la qualité du foin.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais reconnaître la proportionnalité. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment savoir si deux grandeurs sont proportionnelles ?'
                aide: 'Donne les deux méthodes de la séance : le calcul dans le tableau, et la forme du graphique.'
retenir:
    - 'Proportionnel : y = k × x ; quotients égaux.'
    - 'Graphique : droite passant par l’origine.'
