titre: 'Séance 3 : La proportionnalité : tableau, coefficient et graphique'
themes:
- EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment savoir si deux grandeurs sont proportionnelles, avec un tableau ou un graphique ?
competences_bo:
- EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
    - 'Proportionnel : y = k × x ; tous les quotients y ÷ x sont égaux à k.'
    - 'Graphique d’une situation proportionnelle : une droite qui passe par l’origine.'
    competences:
    - Tester la proportionnalité avec les quotients.
    - Trouver et utiliser le coefficient k.
    - Reconnaître la proportionnalité sur un graphique.
pourquoi:
- 'Aujourd’hui, trois notions : le tableau et le coefficient, un contre-exemple, le graphique.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — Le tableau et le coefficient
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Deux grandeurs sont proportionnelles quand on passe de l’une à l’autre en multipliant toujours par le même nombre.
    -   type: paragraphe
        texte: Ce nombre s’appelle le coefficient de proportionnalité, noté k.
    -   type: paragraphe
        texte: 'À retenir : y = k × x. On teste en calculant y ÷ x dans chaque colonne : tous égaux = proportionnel.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Pour chaque colonne, divise le nombre du bas par celui du haut.
        - Compare les quotients.
        - 'Tous égaux : proportionnel, et ce quotient est k.'
        - 'Pour compléter : multiplie par k.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Avec la ration
    -   type: liste
        elements:
        - Un cheval mange environ 2 kg de foin par 100 kg de poids.
        - 'Donc chaque kg de cheval « demande » 0,02 kg de foin : foin = 0,02 × poids.'
    -   type: paragraphe
        texte: 2. Pourquoi les quotients
    -   type: liste
        elements:
        - Si foin = k × poids, alors foin ÷ poids = k, pour toutes les colonnes.
        - Un seul quotient différent suffit à dire « non ».
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Ration de foin selon le poids :'
    -   type: tableau
        colonnes:
        - Poids (kg)
        - '300'
        - '400'
        - '500'
        - '600'
        lignes:
        -   - Foin (kg/jour)
            - '6'
            - '8'
            - '10'
            - '12'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Quotient 6 ÷ 300 ?
        aide: Foin ÷ poids, 1re colonne.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Quotient 10 ÷ 500 ?
        aide: Foin ÷ poids.
        calcul: true
    -   id: q03
        type: qcm
        enonce: Le tableau est-il proportionnel ?
        choix:
        -   id: a
            texte: Oui
        -   id: b
            texte: Non
        aide: Les quotients sont-ils tous égaux ?
    -   id: q04
        type: nombre
        enonce: Foin pour un cheval de 550 kg ?
        unite: kg
        aide: 550 × 0,02.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Série B — Foin pour un poney de 250 kg ?
        unite: kg
        aide: 250 × 0,02.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Poids d’un cheval qui mange 13 kg ?
        unite: kg
        aide: 13 ÷ 0,02.
        calcul: true
    -   id: q07
        type: nombre
        enonce: Tableau 4 → 10 ; 6 → 15. Coefficient k ?
        aide: 10 ÷ 4.
        calcul: true
-   id: a02
    titre: Partie 2 — Un contre-exemple
    transition: 'Tu sais reconnaître un tableau proportionnel. Deuxième notion : repérer quand ce n’est pas le cas.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Deux grandeurs peuvent augmenter ensemble sans être proportionnelles.
    -   type: paragraphe
        texte: C’est souvent le cas quand il y a une somme fixe au départ (frais d’inscription, abonnement).
    -   type: paragraphe
        texte: 'À retenir : S’il y a une somme fixe, ce n’est pas proportionnel : les quotients ne sont pas égaux.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Calcule les quotients de chaque colonne.
        - 'S’ils sont différents : pas proportionnel.'
        - 'Cherche la cause : une somme fixe ?'
        - 'Contrôle : pour 0, une situation proportionnelle donne 0.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Avec la pension
    -   type: liste
        elements:
        - 'Pension : 50 € de frais d’entrée + 12 € par jour.'
        - '1 jour : 62 € ; 2 jours : 74 €. 62 ÷ 1 = 62 et 74 ÷ 2 = 37 : pas égal.'
    -   type: paragraphe
        texte: 2. Le test du zéro
    -   type: liste
        elements:
        - 'Pour 0 jour, on paie déjà 50 € : ce n’est pas 0.'
        - Dans une situation proportionnelle, 0 donne toujours 0.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Pension : 50 € de frais d’entrée + 12 € par jour.'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Prix pour 1 jour ?
        unite: €
        aide: 50 + 12.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Prix pour 5 jours ?
        unite: €
        aide: 50 + 5 × 12.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Prix pour 10 jours ?
        unite: €
        aide: 50 + 10 × 12.
        calcul: true
    -   id: q04
        type: qcm
        enonce: Le prix est-il proportionnel au nombre de jours ?
        choix:
        -   id: a
            texte: Oui
        -   id: b
            texte: Non
        aide: 110 ÷ 5 et 170 ÷ 10 ?
    -   id: q05
        type: nombre
        enonce: Série B — Prix pour 0 jour ?
        unite: €
        aide: Seulement les frais.
        calcul: true
    -   id: q06
        type: qcm
        enonce: Tableau 3 → 12 ; 5 → 20 ; 8 → 32. Proportionnel ?
        choix:
        -   id: a
            texte: Oui
        -   id: b
            texte: Non
        aide: Quotients ?
    -   id: q07
        type: qcm
        enonce: Tableau 2 → 9 ; 4 → 13. Proportionnel ?
        choix:
        -   id: a
            texte: Oui
        -   id: b
            texte: Non
        aide: Quotients ?
-   id: a03
    titre: Partie 3 — Sur un graphique
    transition: 'Dernière notion : reconnaître la proportionnalité d’un coup d’œil, sur un graphique.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Si on place les points d’une situation proportionnelle, ils sont alignés sur une droite qui passe par l’origine (0 ; 0).
    -   type: paragraphe
        texte: Une droite qui ne passe pas par l’origine, ou une courbe, n’est pas proportionnelle.
    -   type: paragraphe
        texte: 'À retenir : Proportionnel ⇔ points alignés sur une droite passant par l’origine.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - 'Comment le faire : place chaque couple (x ; y) du tableau, puis le point (0 ; 0).'
        - 'Comment le lire : pars d’un poids en bas, monte à la droite, lis le foin à gauche.'
        - 'Comment le comprendre : droite + origine = proportionnel.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi une droite
    -   type: liste
        elements:
        - 'y = k × x : quand x augmente de 100, y augmente toujours de la même quantité (2 kg).'
        - Des montées régulières donnent une droite.
    -   type: paragraphe
        texte: 2. Pourquoi l’origine
    -   type: liste
        elements:
        - Pour 0 kg de cheval, 0 kg de foin.
        - 'La pension (50 € pour 0 jour) donnerait une droite qui part de 50 : pas proportionnel.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Graphique de la ration de foin :'
    -   type: image
        url: /assets/images/graphiques/maths-2de-s03-classique-ration.svg
        alternative: 'Droite passant par l’origine : foin par jour selon le poids du cheval, de 0 à 600 kg.'
        legende: 'Droite passant par l’origine : foin par jour selon le poids du cheval, de 0 à 600 kg.'
    -   type: paragraphe
        texte: 'Comment le lire : le poids est en bas (graduations de 100 kg), le foin à gauche (graduations de 2 kg).'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Lis le foin pour 600 kg.
        unite: kg
        aide: Monte de 600 jusqu’à la droite.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Lis le foin pour 300 kg.
        unite: kg
        aide: Monte de 300.
        calcul: true
    -   id: q03
        type: qcm
        enonce: La droite passe-t-elle par l’origine ?
        choix:
        -   id: a
            texte: Oui
        -   id: b
            texte: Non
        aide: Regarde le point (0 ; 0).
    -   id: q04
        type: qcm
        enonce: Le graphique de la pension (50 € + 12 € par jour) serait…
        choix:
        -   id: a
            texte: une droite par l’origine
        -   id: b
            texte: une droite qui part de 50 €
        -   id: c
            texte: une courbe
        aide: Pour 0 jour, combien paie-t-on ?
    -   id: q05
        type: qcm
        enonce: Série B — Une courbe qui passe par l’origine mais n’est pas droite représente…
        choix:
        -   id: a
            texte: une situation proportionnelle
        -   id: b
            texte: une situation non proportionnelle
        aide: Il faut une droite ET l’origine.
    -   id: q06
        type: nombre
        enonce: Avec cette droite, quel poids correspond à 9 kg de foin ?
        unite: kg
        aide: 9 ÷ 0,02.
        calcul: true
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: Tableau 5 → 35 ; 8 → 56. Coefficient ?
        calcul: true
    -   id: q02
        type: nombre
        enonce: Avec k = 7, combien pour 12 ?
        calcul: true
    -   id: q03
        type: qcm
        enonce: Tableau 10 → 25 ; 20 → 45. Proportionnel ?
        choix:
        -   id: a
            texte: Oui
        -   id: b
            texte: Non
    -   id: q04
        type: nombre
        enonce: Foin pour un cheval de 720 kg (0,02 kg par kg) ?
        unite: kg
        calcul: true
retenir:
- 'Proportionnel : on passe d’une ligne à l’autre en multipliant toujours par le même nombre k.'
- 'Test : tous les quotients (2e ligne ÷ 1re ligne) sont égaux.'
- Des frais fixes (une somme de départ) empêchent la proportionnalité.
- 'Graphique : droite passant par l’origine (0 ; 0).'
