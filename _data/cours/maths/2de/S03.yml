titre: 'Séance 3 : La ration est-elle proportionnelle au poids du cheval ?'
themes:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment savoir si deux grandeurs sont proportionnelles ?
competences_bo:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
        - Deux grandeurs sont proportionnelles si on passe de l’une à l’autre en multipliant toujours par le même nombre (coefficient).
        - Dans un tableau de proportionnalité, les quotients sont égaux ; sur un graphique, les points sont alignés avec l’origine.
    competences:
        - Reconnaître un tableau de proportionnalité.
        - Calculer un coefficient de proportionnalité.
pourquoi:
    - 'À l’écurie, on dit souvent : « Le foin, c’est environ 1,5 à 2 % du poids. »'
    - Est-ce une situation de proportionnalité ?
activites:
    -   id: a01
        titre: Le tableau du foin
        consigne: Tu vas vérifier si le tableau du foin selon le poids (tableau 1) est un tableau de proportionnalité. On attend les quotients et ta conclusion.
        contenu:
            -   type: liste
                elements:
                    - 'Automatisme : calcule 0,02 × 500 de tête.'
            -   type: tableau
                titre: Tableau 1 — Foin selon le poids (règle simplifiée)
                colonnes:
                    - Poids (kg)
                    - '300'
                    - '450'
                    - '600'
                lignes:
                    -   - Foin (kg/jour)
                        - '6'
                        - '9'
                        - '12'
            -   type: etapes
                elements:
                    - 'Lis le tableau 1 (règle : foin = 2 % du poids, soit × 0,02).'
                    - Calcule foin ÷ poids pour chaque colonne.
            -   type: paragraphe
                texte: Pourquoi diviser ? Si le quotient est toujours le même, c’est proportionnel.
        questions:
            -   id: q01
                type: tableau
                enonce: Calcule foin ÷ poids.
                colonnes:
                    - Poids (kg)
                    - Foin ÷ poids
                lignes:
                    -   - 300 (6 kg)
                        - ''
                    -   - 450 (9 kg)
                        - ''
                    -   - 600 (12 kg)
                        - ''
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
            -   id: q02
                type: qcm
                enonce: Ce tableau est-il de proportionnalité ?
                choix:
                    -   id: a
                        texte: Oui, le coefficient est toujours 0,02.
                    -   id: b
                        texte: Non.
                    -   id: c
                        texte: On ne peut pas savoir.
                aide: 'Méthode : 1) lis toutes les réponses avant de choisir ; 2) élimine celles qui sont impossibles ; 3) vérifie ton choix avec le document ou l’exemple expliqué de la mission.'
    -   id: a02
        titre: 'Un contre-exemple : le prix de la pension'
        transition: Le foin est proportionnel. Tout est-il proportionnel ?
        consigne: Tu vas tester si le prix d’une pension temporaire (tableau 2) est proportionnel au nombre de jours. On attend les quotients et ta conclusion justifiée.
        contenu:
            -   type: tableau
                titre: Tableau 2 — Pension temporaire (fictive)
                colonnes:
                    - Jours
                    - '5'
                    - '10'
                lignes:
                    -   - Prix (€)
                        - '110'
                        - '170'
            -   type: etapes
                elements:
                    - 'Lis le tableau 2 : pension = 50 € de frais fixes + 12 € par jour.'
                    - Calcule prix ÷ jours.
            -   type: paragraphe
                texte: Pourquoi un contre-exemple ? Beaucoup de situations ressemblent à de la proportionnalité sans en être.
        questions:
            -   id: q01
                type: tableau
                enonce: Calcule prix ÷ jours (arrondi au centime).
                colonnes:
                    - Jours
                    - Prix ÷ jours
                lignes:
                    -   - 5 (110 €)
                        - ''
                    -   - 10 (170 €)
                        - ''
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
            -   id: q02
                type: texte
                enonce: Ce tableau est-il de proportionnalité ? Justifie.
                aide: 'Méthode : 1) écris ton idée en une phrase ; 2) ajoute la raison avec « car » ou « parce que » ; 3) appuie-toi sur un fait vu dans la séance ou un document. Exemple de début : « … car … ».'
    -   id: a03
        titre: Sur un graphique
        transition: Tu sais tester avec un tableau. Vérifie avec un graphique.
        consigne: Tu vas représenter le tableau du foin sur un graphique et vérifier l’alignement avec l’origine. On attend la description et la conclusion.
        contenu:
            -   type: etapes
                elements:
                    - Place les points du tableau 1 (poids en abscisse, foin en ordonnée) sur papier ou au tableur.
                    - Les points sont-ils alignés avec l’origine ?
            -   type: paragraphe
                texte: 'Pourquoi l’origine ? 0 kg de cheval → 0 kg de foin : la droite passe par (0 ; 0).'
        questions:
            -   id: q01
                type: texte
                enonce: Décris le graphique obtenu et ce qu’il prouve.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La règle des 2 % n’est qu’un ordre de grandeur.
        questions:
            -   id: q01
                type: texte
                enonce: Donne une raison pour laquelle la ration réelle peut s’en écarter.
                aide: 'Méthode : 1) relis la question et compte combien d’éléments sont demandés ; 2) cherche-les dans les documents ou dans « Ce que je retiens » ; 3) écris-les en phrase, un par un.'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais reconnaître la proportionnalité. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment savoir si deux grandeurs sont proportionnelles ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Proportionnel : y = k × x ; quotients égaux.'
    - 'Graphique : droite passant par l’origine.'
sources:
