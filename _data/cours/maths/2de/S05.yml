titre: 'Séance 5 : Le prix de la pension augmente de 5 %'
themes:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment calculer une augmentation ou une réduction en pourcentage ?
competences_bo:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
        - 'Augmenter de t % : multiplier par (1 + t/100) ; diminuer de t % : multiplier par (1 − t/100).'
        - Le coefficient multiplicateur évite deux étapes.
    competences:
        - Calculer une évolution en pourcentage.
        - Utiliser un coefficient multiplicateur.
pourquoi:
    - En S04, tu as utilisé la proportionnalité.
    - 'Le centre équestre annonce : « Hausse de 5 % des pensions au 1er janvier. »'
activites:
    -   id: a01
        titre: En deux étapes
        consigne: Tu vas calculer en deux étapes la hausse de 5 % d’une pension de 380 €. On attend la hausse et le nouveau prix.
        contenu:
            -   type: liste
                elements:
                    - 'Automatisme : calcule 10 % puis 5 % de 380 de tête.'
            -   type: etapes
                elements:
                    - 'Lis l’exemple : une leçon coûte 20 € et augmente de 5 %.'
                    - 5 % de 20 = 20 × 5 ÷ 100
                    - 20 × 5 = 100 ; 100 ÷ 100 = 1 €.
                    - 'Nouveau prix : 20 + 1 = 21 €.'
                    - 'À toi : la pension actuelle est de 380 €. Calcule 5 % de 380, puis ajoute-le.'
                    - Pourquoi d’abord en deux étapes ? On comprend d’où vient le coefficient.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Augmenter de t % : on ajoute t % de la valeur …… .'
                        - ''
                    -   - 5 % de 380 = 380 × 5 ÷ …… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: nombre
                enonce: De combien la pension augmente-t-elle ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q03
                type: nombre
                enonce: Quel est le nouveau prix ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a02
        titre: Le coefficient multiplicateur
        transition: Tu as compris le calcul. Va plus vite avec un coefficient.
        consigne: Tu vas écrire les coefficients multiplicateurs de trois évolutions et calculer un prix soldé. On attend les coefficients et le prix.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : augmenter de 5 %, c’est garder 100 % et ajouter 5 % : 105 % = 1,05.'
                    - '20 € × 1,05 = 21 € : on retrouve le résultat en un seul calcul.'
                    - 'Baisser de 30 % : il reste 70 % = 0,7. Un tapis à 50 € soldé −30 % : 50 × 0,7 = 35 €.'
                    - 'À toi : écris les coefficients demandés, puis calcule le prix soldé de la selle.'
                    - 'Pourquoi × 1,05 ? On garde 100 % et on ajoute 5 % : 105 % = 1,05.'
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Augmenter de 5 % revient à multiplier par …… .
                        - ''
                    -   - Baisser de 20 % revient à multiplier par …… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: tableau
                enonce: Écris le coefficient multiplicateur.
                colonnes:
                    - Évolution
                    - Coefficient
                lignes:
                    -   - +5 %
                        - ''
                    -   - +12 %
                        - ''
                    -   - −20 %
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q03
                type: nombre
                enonce: Une selle à 1 250 € est soldée −20 %. Prix soldé ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a03
        titre: Retrouver un pourcentage
        transition: Tu sais appliquer un pourcentage. Et si on cherche le pourcentage ?
        consigne: Tu vas retrouver le pourcentage d’augmentation du prix du foin. On attend le pourcentage et la vérification de l’annonce.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : un sac de granulés passe de 20 € à 23 €.'
                    - 'Coefficient : 23 ÷ 20 = 1,15.'
                    - '1,15 = 115 % : on a ajouté 15 %.'
                    - Donc le prix a augmenté de 15 %.
                    - 'À toi : le prix du foin passe de 160 € à 184 € la tonne. Calcule le coefficient (184 ÷ 160), puis le pourcentage.'
                    - Pourquoi ce calcul ? Pour savoir si une hausse annoncée est vraie.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Taux d’évolution = nouvelle valeur ÷ ancienne valeur − …… .
                        - ''
                    -   - Un coefficient de 1,15 correspond à une hausse de …… %.
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: nombre
                enonce: Quel est le pourcentage d’augmentation ?
                unite: '%'
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q03
                type: texte
                enonce: Un fournisseur dit « +10 % ». Est-ce vrai ? Justifie.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: '+10 % puis −10 % : revient-on au prix de départ ?'
        questions:
            -   id: q01
                type: texte
                enonce: Teste sur 100 €.
                aide: 'Méthode : 1) écris ce que tu fais (l’action) ; 2) écris ce qui doit se passer (résultat attendu) ; 3) compare avec ce qui se passe vraiment (résultat observé). Ne change qu’une seule chose à la fois.'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais calculer une évolution. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment calculer une augmentation ou une réduction en pourcentage ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - '+t % : × (1 + t/100) ; −t % : × (1 − t/100).'
    - Taux = (nouveau ÷ ancien) − 1.
