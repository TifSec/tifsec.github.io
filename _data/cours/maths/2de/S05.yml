titre: 'Séance 5 : Le prix de la pension augmente de 5 %'
themes:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment calculer une augmentation ou une réduction en pourcentage ?
competences_bo:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
        - 'Augmenter de t % : multiplier par (1 + t/100) ; diminuer de t % : multiplier par (1 − t/100).'
        - Le coefficient multiplicateur évite deux étapes.
    competences:
        - Calculer une évolution en pourcentage.
        - Utiliser un coefficient multiplicateur.
pourquoi:
    - En S04, tu as utilisé la proportionnalité.
    - 'Le centre équestre annonce : « Hausse de 5 % des pensions au 1er janvier. »'
activites:
    -   id: a01
        titre: En deux étapes
        consigne: Tu vas calculer en deux étapes la hausse de 5 % d’une pension de 380 €. On attend la hausse et le nouveau prix.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: La pension coûte 380 € par mois. Elle augmente de 5 %. Combien coûtera-t-elle ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Augmenter une valeur de t %, c’est lui ajouter t % d’elle-même.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - 'Calculer un nouveau prix après une hausse : pension, foin, licence.'
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - 'Étape 1 : on calcule t % de la valeur de départ : valeur × t ÷ 100.'
                    - 'Étape 2 : on ajoute ce montant à la valeur de départ (on l’enlève pour une baisse).'
            -   type: paragraphe
                texte: 'À retenir : Nouvelle valeur = valeur initiale + t % de la valeur initiale.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Une licence de 40 € augmente de 10 %. Nouveau prix ?
                    - Un tapis de 60 € baisse de 5 %. Nouveau prix ?
            -   type: liste
                elements:
                    - 'Automatisme : calcule 10 % puis 5 % de 380 de tête.'
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : la pension actuelle est de 380 €. Calcule 5 % de 380, puis ajoute-le.'
                    - Pourquoi d’abord en deux étapes ? On comprend d’où vient le coefficient.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Augmenter de t % : on ajoute t % de la valeur …… .'
                        - ''
                    -   - 5 % de 380 = 380 × 5 ÷ …… .
                        - ''
                aide: 'Relis l’exemple : sur quelle valeur calcule-t-on les 5 % ? Et « pour cent » veut dire diviser par combien ?'
            -   id: q02
                type: nombre
                enonce: De combien la pension augmente-t-elle ?
                unite: €
                aide: 'Calcule 5 % du prix actuel de la pension (380 €) : 380 × 5 ÷ 100.'
            -   id: q03
                type: nombre
                enonce: Quel est le nouveau prix ?
                unite: €
                aide: Ajoute l’augmentation trouvée au prix de départ.
    -   id: a02
        titre: Le coefficient multiplicateur
        transition: Tu as compris le calcul. Va plus vite avec un coefficient.
        consigne: Tu vas écrire les coefficients multiplicateurs de trois évolutions et calculer un prix soldé. On attend les coefficients et le prix.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: 'On doit calculer beaucoup de prix soldés : faire deux étapes à chaque fois est long. Existe-t-il un raccourci ?'
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Le coefficient multiplicateur est le nombre par lequel on multiplie la valeur de départ pour obtenir directement la nouvelle valeur.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Calculer une évolution en un seul calcul.
                    - Enchaîner plusieurs évolutions (2de puis Bac Pro).
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - 'Hausse de t % : on garde 100 % et on ajoute t % : coefficient 1 + t/100.'
                    - 'Baisse de t % : il reste 100 % − t % : coefficient 1 − t/100.'
                    - Nouvelle valeur = valeur de départ × coefficient.
            -   type: paragraphe
                texte: 'À retenir : +t % → × (1 + t/100) ; −t % → × (1 − t/100).'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Coefficient pour +8 % ? pour −15 % ?
                    - Un filet à 40 € soldé −25 %. Prix soldé avec le coefficient ?
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : écris les coefficients demandés, puis calcule le prix soldé de la selle.'
                    - 'Pourquoi × 1,05 ? On garde 100 % et on ajoute 5 % : 105 % = 1,05.'
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Augmenter de 5 % revient à multiplier par …… .
                        - ''
                    -   - Baisser de 20 % revient à multiplier par …… .
                        - ''
                aide: Garder 100 % et ajouter 5 %, c’est garder combien en tout ? Et enlever 20 %, il reste combien ?
            -   id: q02
                type: tableau
                enonce: Écris le coefficient multiplicateur.
                colonnes:
                    - Évolution
                    - Coefficient
                lignes:
                    -   - +5 %
                        - ''
                    -   - +12 %
                        - ''
                    -   - −20 %
                        - ''
                aide: 'Pour une hausse : 1 + taux ÷ 100. Pour une baisse : 1 − taux ÷ 100.'
            -   id: q03
                type: nombre
                enonce: Une selle à 1 250 € est soldée −20 %. Prix soldé ?
                unite: €
                aide: Multiplie 1 250 € par le coefficient d’une baisse de 20 %.
    -   id: a03
        titre: Retrouver un pourcentage
        transition: Tu sais appliquer un pourcentage. Et si on cherche le pourcentage ?
        consigne: Tu vas retrouver le pourcentage d’augmentation du prix du foin. On attend le pourcentage et la vérification de l’annonce.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Le foin passe de 160 € à 184 € la tonne. Le fournisseur annonce « +10 % ». Dit-il vrai ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Le taux d’évolution est le pourcentage de hausse ou de baisse entre deux valeurs.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Vérifier une hausse annoncée.
                    - Comparer des évolutions.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - 'On calcule le coefficient : nouvelle valeur ÷ ancienne valeur.'
                    - 'On enlève 1 : coefficient − 1.'
                    - 'On multiplie par 100 : positif = hausse, négatif = baisse.'
            -   type: paragraphe
                texte: 'À retenir : Taux d’évolution = nouvelle ÷ ancienne − 1.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Un sac passe de 20 € à 23 €. Taux d’évolution ?
                    - Une selle passe de 800 € à 600 €. Taux d’évolution ?
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : le prix du foin passe de 160 € à 184 € la tonne. Calcule le coefficient (184 ÷ 160), puis le pourcentage.'
                    - Pourquoi ce calcul ? Pour savoir si une hausse annoncée est vraie.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Taux d’évolution = nouvelle valeur ÷ ancienne valeur − …… .
                        - ''
                    -   - Un coefficient de 1,15 correspond à une hausse de …… %.
                        - ''
                aide: 'Taux = nouvelle ÷ ancienne − quelque chose. Puis un coefficient de 1,15 : combien au-dessus de 1 ?'
            -   id: q02
                type: nombre
                enonce: Quel est le pourcentage d’augmentation ?
                unite: '%'
                aide: Divise le nouveau prix par l’ancien, enlève 1, puis multiplie par 100.
            -   id: q03
                type: texte
                enonce: Un fournisseur dit « +10 % ». Est-ce vrai ? Justifie.
                aide: Compare le pourcentage que tu viens de calculer à celui annoncé par le fournisseur.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: '+10 % puis −10 % : revient-on au prix de départ ?'
        questions:
            -   id: q01
                type: texte
                enonce: Teste sur 100 €.
                aide: Pars de 100 €, multiplie par 1,1, puis le résultat par 0,9. Retombes-tu sur 100 € ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais calculer une évolution. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment calculer une augmentation ou une réduction en pourcentage ?'
                aide: Explique les deux méthodes (en deux étapes, avec le coefficient) et comment retrouver un pourcentage.
retenir:
    - '+t % : × (1 + t/100) ; −t % : × (1 − t/100).'
    - Taux = (nouveau ÷ ancien) − 1.
