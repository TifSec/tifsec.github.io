titre: 'Séance 2 : Bien utiliser sa calculatrice'
themes:
- EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment taper un calcul juste sur la calculatrice et arrondir correctement le résultat ?
competences_bo:
- EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
    - 'Les parenthèses pour un quotient : (a + b) ÷ c.'
    - 'Arrondir : regarder le chiffre suivant (5 ou plus : on monte).'
    - Arrondir seulement à la fin.
    competences:
    - Taper un calcul avec des parenthèses.
    - Arrondir à l’unité, au dixième, au centième.
    - Faire un calcul en plusieurs étapes sans arrondir en route.
pourquoi:
- 'Aujourd’hui, trois notions : les parenthèses sur la calculatrice, arrondir, un calcul complet.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — Les parenthèses sur la calculatrice
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: 'La calculatrice applique les priorités : elle fait × et ÷ avant + et −.'
    -   type: paragraphe
        texte: Pour diviser une somme, il faut la mettre entre parenthèses.
    -   type: paragraphe
        texte: 'À retenir : Moyenne ou partage d’une somme : (a + b) ÷ c, avec les parenthèses.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Écris le calcul sur papier avant de le taper.
        - Mets entre parenthèses tout ce qui doit être calculé ensemble.
        - Tape le calcul en une fois.
        - Contrôle avec un ordre de grandeur.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Ce que fait la calculatrice
    -   type: liste
        elements:
        - '120 + 80 ÷ 4 : elle calcule 80 ÷ 4 = 20, puis 120 + 20 = 140.'
        - Pour partager 200 kg entre 4 chevaux, il fallait (120 + 80) ÷ 4 = 50.
    -   type: paragraphe
        texte: 2. Le contrôle
    -   type: liste
        elements:
        - 200 kg pour 4 chevaux, c’est environ 50 kg chacun.
        - '140 est beaucoup trop : il manquait les parenthèses.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice. Tape le calcul en une fois.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Calcule (120 + 80) ÷ 4.
        aide: Parenthèses d’abord.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Que donne 120 + 80 ÷ 4 (sans parenthèses) ?
        aide: La division d’abord.
        calcul: true
    -   id: q03
        type: nombre
        enonce: 'Moyenne de 14 et 20 : calcule (14 + 20) ÷ 2.'
        aide: Parenthèses.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Calcule (45 − 9) ÷ 6.
        aide: Parenthèses.
        calcul: true
    -   id: q05
        type: nombre
        enonce: 'Série B — 3 sacs de 25 kg et 2 sacs de 20 kg partagés entre 5 chevaux : (3 × 25 + 2 × 20) ÷ 5 ?'
        unite: kg
        aide: Parenthèses autour du total.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Calcule 150 ÷ (2 + 3).
        aide: Parenthèses au dénominateur.
        calcul: true
    -   id: q07
        type: qcm
        enonce: Pour partager 90 + 60 entre 3, on tape…
        choix:
        -   id: a
            texte: 90 + 60 ÷ 3
        -   id: b
            texte: (90 + 60) ÷ 3
        aide: On divise toute la somme.
-   id: a02
    titre: Partie 2 — Arrondir
    transition: 'Tu sais taper le calcul. Deuxième notion : écrire un résultat raisonnable.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: La calculatrice donne souvent beaucoup de chiffres après la virgule.
    -   type: paragraphe
        texte: Arrondir, c’est garder un nombre de chiffres utile (unité, dixième, centième) en restant le plus proche possible.
    -   type: paragraphe
        texte: 'À retenir : On regarde le chiffre juste après le dernier gardé : de 0 à 4, on garde ; de 5 à 9, on augmente de 1.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Repère jusqu’où tu gardes (unité, dixième = 1 chiffre après la virgule, centième = 2).
        - Regarde le chiffre suivant.
        - '0 à 4 : on coupe. 5 à 9 : on ajoute 1 au dernier chiffre gardé.'
        - 'Pour des euros : au centième (centimes).'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Le plus proche
    -   type: liste
        elements:
        - 3,46 est entre 3,4 et 3,5 ; il est plus près de 3,5.
        - Le chiffre suivant (6) dit de quel côté on est.
    -   type: paragraphe
        texte: 2. Pourquoi pas deux fois
    -   type: liste
        elements:
        - 3,46 arrondi au dixième = 3,5. Si on arrondit 3,5 à l’unité, on trouve 4.
        - 'Mais 3,46 arrondi directement à l’unité donne 3 : on arrondit une seule fois.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Écris le nombre arrondi.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Arrondis 7,6 à l’unité.
        aide: 'Chiffre après la virgule : 6.'
        calcul: true
    -   id: q02
        type: nombre
        enonce: Arrondis 12,4 à l’unité.
        aide: 'Chiffre suivant : 4.'
        calcul: true
    -   id: q03
        type: nombre
        enonce: Arrondis 3,46 au dixième.
        aide: 'Chiffre des centièmes : 6.'
        calcul: true
    -   id: q04
        type: nombre
        enonce: Arrondis 15,7249 au centième.
        aide: 'Chiffre des millièmes : 4.'
        calcul: true
    -   id: q05
        type: nombre
        enonce: Série B — Arrondis 2,995 au centième.
        aide: 2,99 + 0,01.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Calcule 100 ÷ 3 et arrondis au dixième.
        aide: 33,333…
        calcul: true
    -   id: q07
        type: nombre
        enonce: Un sac de 25 kg coûte 17,99 €. Prix du kg, au centime ?
        unite: €
        aide: 17,99 ÷ 25.
        calcul: true
-   id: a03
    titre: Partie 3 — Un calcul complet
    transition: 'Dernière notion : enchaîner plusieurs calculs sans perdre de précision.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Un problème demande souvent plusieurs calculs à la suite.
    -   type: paragraphe
        texte: On garde tous les chiffres pendant les calculs et on arrondit seulement le résultat final.
    -   type: paragraphe
        texte: 'À retenir : Arrondir seulement à la fin. Écrire chaque étape.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Écris les étapes du calcul.
        - Utilise la touche Rép (ou Ans) pour reprendre le résultat précédent sans le recopier arrondi.
        - Arrondis le résultat final.
        - Contrôle avec un ordre de grandeur.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi ne pas arrondir en route
    -   type: liste
        elements:
        - Chaque arrondi ajoute une petite erreur.
        - Plusieurs petites erreurs, multipliées, en font une grande.
    -   type: paragraphe
        texte: 2. Un exemple
    -   type: liste
        elements:
        - 'Prix du kg : 17,99 ÷ 25 = 0,7196 €. Pour 600 kg : 0,7196 × 600 = 431,76 €.'
        - 'Si on arrondit d’abord à 0,72 € : 0,72 × 600 = 432 € : 24 centimes d’écart.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice. Arrondis seulement le résultat final.
    questions:
    -   id: q01
        type: nombre
        enonce: 'Série A — 4 chevaux × 10,5 kg × 7 jours : foin en kg ?'
        unite: kg
        aide: 4 × 10,5 × 7.
        calcul: true
    -   id: q02
        type: nombre
        enonce: '294 kg à 0,20 € le kg : coût ?'
        unite: €
        aide: 294 × 0,20.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Un sac de granulés de 20 kg coûte 15,90 €. Prix de 140 kg ?
        unite: €
        aide: 15,90 ÷ 20 × 140 (ou 7 sacs).
        calcul: true
    -   id: q04
        type: nombre
        enonce: Moyenne de 7,5 ; 8,25 et 9 (au centième) ?
        aide: (7,5 + 8,25 + 9) ÷ 3.
        calcul: true
    -   id: q05
        type: nombre
        enonce: 'Série B — 17,99 € les 25 kg : prix de 600 kg, au centime (sans arrondir en route) ?'
        unite: €
        aide: 17,99 ÷ 25 × 600.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Et si on arrondit d’abord le prix du kg à 0,72 € ?
        unite: €
        aide: 0,72 × 600.
        calcul: true
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: Calcule (35 + 25) ÷ 4.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Arrondis 9,85 au dixième.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Calcule 50 ÷ 7 au centième.
        calcul: true
    -   id: q04
        type: nombre
        enonce: 2 chevaux × 12 kg × 15 jours ?
        unite: kg
        calcul: true
retenir:
- 'La calculatrice respecte les priorités : pour diviser une somme, il faut des parenthèses.'
- 'Arrondir : on regarde le chiffre juste après ; 0 à 4 on garde, 5 à 9 on monte.'
- On arrondit seulement le résultat final.
