titre: 'Séance 2 : Bien utiliser sa calculatrice'
themes:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment utiliser la calculatrice sans faire d’erreur ?
competences_bo:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
        - La calculatrice respecte les priorités ; on ajoute des parenthèses pour les fractions et les quotients.
        - On arrondit seulement à la fin, à la précision demandée.
    competences:
        - Taper un calcul avec parenthèses.
        - Arrondir correctement.
pourquoi:
    - En S01, tu as calculé de tête.
    - Pour des calculs plus longs (ration, facture), la calculatrice est indispensable… si on l’utilise bien.
activites:
    -   id: a01
        titre: Les parenthèses
        consigne: Tu vas comparer un calcul tapé avec et sans parenthèses à la calculatrice. On attend les deux résultats.
        contenu:
            -   type: liste
                elements:
                    - 'Automatisme : calcule 3 × 25 de tête.'
            -   type: etapes
                elements:
                    - 'Lis l’exemple : (120 + 80) ÷ 4.'
                    - 'Les parenthèses disent : « fais d’abord l’addition ».'
                    - (120 + 80) ÷ 4 = 200 ÷ 4
                    - 200 ÷ 4 = 50
                    - 'Sur la calculatrice, tape les parenthèses : ( 1 2 0 + 8 0 ) ÷ 4 =.'
                    - 'Sans parenthèses, la machine calcule 120 + 80 ÷ 4 = 120 + 20 = 140 : ce n’est pas le même résultat.'
                    - 'À toi : calcule (360 + 240) ÷ 4, puis tape-le sans parenthèses et compare.'
                    - Pourquoi les parenthèses ? Sans elles, la machine divise seulement 240.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Pour diviser une somme, on la met entre …… .
                        - ''
                    -   - La calculatrice respecte les …… de calcul.
                        - ''
                aide: 'Relis l’exemple : pour diviser 360 + 240 par 4, qu’a-t-on mis autour de la somme ? Et que respecte toujours la calculatrice ?'
            -   id: q02
                type: nombre
                enonce: Combien vaut (360 + 240) ÷ 4 ?
                aide: 'Tape exactement les parenthèses : la somme est calculée d’abord, puis divisée par 4.'
            -   id: q03
                type: nombre
                enonce: Que donne 360 + 240 ÷ 4 tapé sans parenthèses ?
                aide: Sans parenthèses, la calculatrice fait d’abord la division 240 ÷ 4, puis ajoute 360.
    -   id: a02
        titre: Arrondir
        transition: La calculatrice est bien utilisée. Reste à donner un résultat lisible.
        consigne: Tu vas calculer un prix au kg et une ration, puis les arrondir à la précision demandée. On attend deux résultats arrondis.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : un sac de 20 kg coûte 13 €. Prix au kg, arrondi au centime ?'
                    - '13 ÷ 20 = 0,65 € : c’est déjà au centime.'
                    - 'Autre exemple : 10 ÷ 3 = 3,333… Arrondi au dixième : on regarde le chiffre des centièmes (3).'
                    - '3 est plus petit que 5 : on garde 3,3.'
                    - 'Avec 2 ÷ 3 = 0,666… : le chiffre suivant est 6, plus grand que 5, on monte : 0,7.'
                    - 'À toi : calcule, puis arrondis comme demandé dans chaque question.'
                    - Pourquoi arrondir ? Un prix se donne au centime, une ration au dixième de kg.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - On arrondit seulement à la …… du calcul.
                        - ''
                    -   - Si le chiffre suivant est 5 ou plus, on arrondit au-…… .
                        - ''
                aide: Si on arrondit au milieu d’un calcul, l’erreur grandit. Quand faut-il arrondir ? Et que fait-on si le chiffre suivant est 5 ou plus ?
            -   id: q02
                type: nombre
                enonce: Un sac de 25 kg coûte 17 €. Prix au kg, arrondi au centime ?
                unite: €
                aide: Prix au kg = prix du sac ÷ nombre de kg. Regarde le 3e chiffre après la virgule pour arrondir au centime.
            -   id: q03
                type: nombre
                enonce: La ration de 9 chevaux est 50 kg. Ration par cheval, au dixième ?
                unite: kg
                aide: 'Ration par cheval = ration totale ÷ nombre de chevaux. Au dixième : un chiffre après la virgule ; regarde le suivant.'
    -   id: a03
        titre: Un calcul complet
        transition: Tu sais taper et arrondir. Fais un calcul complet.
        consigne: Tu vas écrire en une ligne le calcul d’une facture de sellerie (document 1) et donner le total. On attend le calcul et le total.
        contenu:
            -   type: liste
                elements:
                    - 3 licols à 45 €.
                    - 2 brosses à 12,50 €.
                    - 1 cure-pied à 18 €.
            -   type: etapes
                elements:
                    - 'Lis l’exemple : 2 tapis à 30 € et 1 bombe à crins à 9 €.'
                    - 'On écrit tout le calcul en une seule ligne : 2 × 30 + 9.'
                    - 'Priorités : la multiplication d’abord : 2 × 30 = 60.'
                    - 'Puis l’addition : 60 + 9 = 69 €.'
                    - 'À toi : lis la facture (document 1), écris le calcul en une seule ligne, puis tape-le à la calculatrice.'
                    - Pourquoi une seule ligne ? Moins de recopies, moins d’erreurs.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - On écrit le calcul en une seule …… pour éviter les recopies.
                        - ''
                    -   - Un prix se donne au …… près.
                        - ''
                aide: Pourquoi éviter de recopier des résultats intermédiaires ? Et un prix en euros a combien de chiffres après la virgule ?
            -   id: q02
                type: texte
                enonce: Écris le calcul en une ligne et donne le total.
                aide: Écris chaque achat comme quantité × prix, relie-les par des +, puis calcule tout d’un coup à la calculatrice.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La touche « Ans » réutilise le dernier résultat.
        questions:
            -   id: q01
                type: texte
                enonce: À quoi sert-elle dans un calcul en plusieurs étapes ?
                aide: 'Imagine un calcul en deux étapes : sans « Ans », que dois-tu faire avec le premier résultat ? Et s’il était arrondi ?'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais utiliser ta calculatrice. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment utiliser la calculatrice sans faire d’erreur ?'
                aide: 'Cite les trois réflexes vus : parenthèses, une ligne, et le moment de l’arrondi.'
retenir:
    - Parenthèses pour les quotients.
    - Arrondir à la fin.
sources:
