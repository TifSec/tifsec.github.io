titre: 'Séance 2 : Bien utiliser sa calculatrice'
themes:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment utiliser la calculatrice sans faire d’erreur ?
competences_bo:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
        - La calculatrice respecte les priorités ; on ajoute des parenthèses pour les fractions et les quotients.
        - On arrondit seulement à la fin, à la précision demandée.
    competences:
        - Taper un calcul avec parenthèses.
        - Arrondir correctement.
pourquoi:
    - En S01, tu as calculé de tête.
    - Pour des calculs plus longs (ration, facture), la calculatrice est indispensable… si on l’utilise bien.
activites:
    -   id: a01
        titre: Les parenthèses
        consigne: Tu vas comparer un calcul tapé avec et sans parenthèses à la calculatrice. On attend les deux résultats.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: On partage le prix de 360 € de foin et de 240 € de paille entre 4 propriétaires. Deux élèves tapent le calcul et ne trouvent pas la même chose.
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: 'Les parenthèses obligent la calculatrice à faire un calcul en premier. Sans elles, elle applique les priorités : × et ÷ avant + et −.'
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Diviser ou multiplier une somme entière.
                    - Éviter des erreurs graves sur une facture ou une ration.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - On repère ce qui doit être calculé en premier (une somme à diviser, par exemple).
                    - On l’entoure de parenthèses sur la calculatrice.
                    - On vérifie l’ordre de grandeur du résultat.
            -   type: paragraphe
                texte: 'À retenir : Pour diviser une somme, on la met entre parenthèses.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Calcule (50 + 30) ÷ 2, puis 50 + 30 ÷ 2.
                    - Quel calcul taper pour partager 120 € de vermifuge et 80 € de maréchal entre 5 propriétaires ?
            -   type: liste
                elements:
                    - 'Automatisme : calcule 3 × 25 de tête.'
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : calcule (360 + 240) ÷ 4, puis tape-le sans parenthèses et compare.'
                    - Pourquoi les parenthèses ? Sans elles, la machine divise seulement 240.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Pour diviser une somme, on la met entre …… .
                        - ''
                    -   - La calculatrice respecte les …… de calcul.
                        - ''
                aide: 'Relis l’exemple : pour diviser 360 + 240 par 4, qu’a-t-on mis autour de la somme ? Et que respecte toujours la calculatrice ?'
            -   id: q02
                type: nombre
                enonce: Combien vaut (360 + 240) ÷ 4 ?
                aide: 'Tape exactement les parenthèses : la somme est calculée d’abord, puis divisée par 4.'
            -   id: q03
                type: nombre
                enonce: Que donne 360 + 240 ÷ 4 tapé sans parenthèses ?
                aide: Sans parenthèses, la calculatrice fait d’abord la division 240 ÷ 4, puis ajoute 360.
    -   id: a02
        titre: Arrondir
        transition: La calculatrice est bien utilisée. Reste à donner un résultat lisible.
        consigne: Tu vas calculer un prix au kg et une ration, puis les arrondir à la précision demandée. On attend deux résultats arrondis.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: 'La calculatrice affiche 0,68 ou 5,5555… : que faut-il écrire ?'
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Arrondir, c’est remplacer un nombre par une valeur proche, plus simple, à une précision donnée (unité, dixième, centime).
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Donner un prix au centime, une ration au dixième de kg.
                    - Garder un résultat lisible et utile.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - On repère le chiffre de la précision demandée (dixièmes, centièmes…).
                    - 'On regarde le chiffre juste après : s’il est 5 ou plus, on augmente d’une unité ; sinon on garde.'
                    - On n’arrondit qu’à la fin du calcul.
            -   type: paragraphe
                texte: 'À retenir : Chiffre suivant de 5 à 9 : on arrondit au-dessus ; de 0 à 4 : on garde.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Arrondis 7,46 au dixième.
                    - Arrondis 12,349 au centième.
                    - Un sac de 15 kg coûte 11 €. Prix au kg, au centime ?
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : calcule, puis arrondis comme demandé dans chaque question.'
                    - Pourquoi arrondir ? Un prix se donne au centime, une ration au dixième de kg.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - On arrondit seulement à la …… du calcul.
                        - ''
                    -   - Si le chiffre suivant est 5 ou plus, on arrondit au-…… .
                        - ''
                aide: Si on arrondit au milieu d’un calcul, l’erreur grandit. Quand faut-il arrondir ? Et que fait-on si le chiffre suivant est 5 ou plus ?
            -   id: q02
                type: nombre
                enonce: Un sac de 25 kg coûte 17 €. Prix au kg, arrondi au centime ?
                unite: €
                aide: Prix au kg = prix du sac ÷ nombre de kg. Regarde le 3e chiffre après la virgule pour arrondir au centime.
            -   id: q03
                type: nombre
                enonce: La ration de 9 chevaux est 50 kg. Ration par cheval, au dixième ?
                unite: kg
                aide: 'Ration par cheval = ration totale ÷ nombre de chevaux. Au dixième : un chiffre après la virgule ; regarde le suivant.'
    -   id: a03
        titre: Un calcul complet
        transition: Tu sais taper et arrondir. Fais un calcul complet.
        consigne: Tu vas écrire en une ligne le calcul d’une facture de sellerie (document 1) et donner le total. On attend le calcul et le total.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Une facture de sellerie comporte plusieurs lignes. Comment éviter les erreurs de recopie ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Écrire le calcul en une ligne, c’est traduire toute la facture en une seule expression, puis la taper d’un coup.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Moins de recopies, donc moins d’erreurs.
                    - Garder une trace claire de son raisonnement.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - Chaque ligne de facture devient quantité × prix.
                    - On relie les lignes par des +.
                    - On tape l’expression entière ; les priorités font le reste.
            -   type: paragraphe
                texte: 'À retenir : Un calcul, une ligne ; un prix au centime près.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - 4 tapis à 25 € et 3 bandes à 7,50 €. Écris le calcul en une ligne et le total.
            -   type: liste
                elements:
                    - 3 licols à 45 €.
                    - 2 brosses à 12,50 €.
                    - 1 cure-pied à 18 €.
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : lis la facture (document 1), écris le calcul en une seule ligne, puis tape-le à la calculatrice.'
                    - Pourquoi une seule ligne ? Moins de recopies, moins d’erreurs.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - On écrit le calcul en une seule …… pour éviter les recopies.
                        - ''
                    -   - Un prix se donne au …… près.
                        - ''
                aide: Pourquoi éviter de recopier des résultats intermédiaires ? Et un prix en euros a combien de chiffres après la virgule ?
            -   id: q02
                type: texte
                enonce: Écris le calcul en une ligne et donne le total.
                aide: Écris chaque achat comme quantité × prix, relie-les par des +, puis calcule tout d’un coup à la calculatrice.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La touche « Ans » réutilise le dernier résultat.
        questions:
            -   id: q01
                type: texte
                enonce: À quoi sert-elle dans un calcul en plusieurs étapes ?
                aide: 'Imagine un calcul en deux étapes : sans « Ans », que dois-tu faire avec le premier résultat ? Et s’il était arrondi ?'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais utiliser ta calculatrice. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment utiliser la calculatrice sans faire d’erreur ?'
                aide: 'Cite les trois réflexes vus : parenthèses, une ligne, et le moment de l’arrondi.'
retenir:
    - Parenthèses pour les quotients.
    - Arrondir à la fin.
