titre: 'Séance 10 : Évaluation 1 — Proportionnalité, pourcentages, échelles, vitesses'
themes:
- EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Sais-tu refaire seul les calculs vus depuis le début de l’année ?
competences_bo:
- EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
    - Proportionnalité et produit en croix.
    - Pourcentages, coefficient, TVA.
    - Échelles et aires.
    - Vitesse, distance, durée ; conversions.
    competences:
    - Refaire seul, sans aide, les calculs des séances 3 à 9.
pourquoi:
- 'Évaluation : 20 exercices, 1 point chacun. Calculatrice autorisée, pas d’aide.'
- 'Écris tes calculs sur ta feuille : ils servent si une réponse est fausse.'
activites:
-   id: a01
    titre: Partie 1 — Proportionnalité
    consigne: Fais les exercices dans l’ordre. Écris tes calculs sur ta feuille.
    contenu:
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Une ration est proportionnelle au poids du cheval : 6 kg de foin pour 400 kg de cheval.'
    questions:
    -   id: q01
        type: nombre
        enonce: Exercice 1 — Combien de kg de foin pour un cheval de 200 kg ?
        unite: kg
        calcul: true
    -   id: q02
        type: nombre
        enonce: Exercice 2 — Combien de kg de foin pour un cheval de 600 kg ?
        unite: kg
        calcul: true
    -   id: q03
        type: nombre
        enonce: Exercice 3 — Combien de kg de foin pour un cheval de 520 kg ? (arrondi au dixième)
        unite: kg
        calcul: true
    -   id: q04
        type: nombre
        enonce: 'Exercice 4 — Un vermifuge : 1 dose pour 100 kg. Combien de doses pour 550 kg ?'
        unite: doses
        calcul: true
    -   id: q05
        type: qcm
        enonce: 'Exercice 5 — Tableau : 2 sacs → 30 € ; 5 sacs → 70 €. Est-ce proportionnel ?'
        choix:
        -   id: a
            texte: Oui
        -   id: b
            texte: Non
-   id: a02
    titre: Partie 2 — Pourcentages et TVA
    consigne: Fais les exercices dans l’ordre. Écris tes calculs sur ta feuille.
    contenu:
    -   type: titre
        texte: Exercices
    questions:
