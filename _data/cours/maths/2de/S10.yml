        enonce: Exercice 11 — Une couverture coûte 66 € TTC, TVA 20 %. Prix HT ?
        unite: €
        calcul: true
-   id: a03
    titre: Partie 3 — Échelles et aires
    consigne: Fais les exercices dans l’ordre. Écris tes calculs sur ta feuille.
    contenu:
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Le plan de l’écurie est à l’échelle 1/200.
    questions:
    -   id: q01
        type: nombre
