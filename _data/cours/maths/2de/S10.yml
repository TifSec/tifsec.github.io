retenir:
- 'Proportionnalité : coefficient ou produit en croix.'
- '+t % : × (1 + t/100) ; −t % : × (1 − t/100) ; TTC = HT × 1,2 ; HT = TTC ÷ 1,2.'
- 'Échelle 1/200 : × 200 vers le réel, ÷ 200 vers le plan.'
- v = d ÷ t ; d = v × t ; t = d ÷ v ; minutes ÷ 60 = heures.
