titre: 'Séance 10 : Évaluation 1 : proportionnalité à l’écurie'
themes:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Saurai-je résoudre seul des problèmes de proportionnalité de l’écurie ?
competences_bo:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
        - 'On réutilise : proportionnalité, quatrième proportionnelle, pourcentages, TVA, échelles, vitesses.'
    competences:
        - Résoudre des problèmes de proportionnalité en autonomie.
pourquoi:
    - De S03 à S09, tu as travaillé la proportionnalité.
    - 'Évaluation : trois situations de l’écurie.'
activites:
    -   id: a01
        titre: La ration et la dose
        consigne: Tu vas calculer seul la ration de foin et la dose de vermifuge d’une jument de 540 kg (document 1). On attend les deux résultats.
        contenu:
            -   type: titre
                texte: Exemple
            -   type: paragraphe
                texte: 'Document 1 — Jument de 540 kg. Règle simplifiée : foin = 2 % du poids. Notice fictive : 1 graduation pour 100 kg, arrondi à la demi-graduation supérieure.'
            -   type: etapes
                elements:
                    - Lis la situation (document 1).
                    - Réponds.
            -   type: paragraphe
                texte: Pourquoi commencer par là ? Ce sont les calculs les plus fréquents en stage.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Ration simplifiée : foin = 2 % du …… .'
                        - ''
                    -   - 2 % s’écrit aussi × …… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: nombre
                enonce: D’après le document 1, quelle quantité de foin par jour pour une jument de 540 kg (2 % du poids) ?
                unite: kg
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q03
                type: nombre
                enonce: Combien de graduations de vermifuge (1 pour 100 kg, arrondi à la demi-graduation supérieure) ?
                unite: graduations
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a02
        titre: La facture
        transition: La ration est calculée. Passe à la facture.
        consigne: Tu vas calculer le nouveau prix TTC d’une pension après une hausse de 4 %. On attend le prix TTC.
        contenu:
            -   type: etapes
                elements:
                    - Pension 380 € HT, hausse de 4 %, TVA 20 %.
                    - Calcule le nouveau prix TTC.
            -   type: paragraphe
                texte: Pourquoi deux coefficients ? Hausse puis TVA s’enchaînent.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Hausse puis TVA : on multiplie les deux …… .'
                        - ''
                    -   - Une hausse de 4 % correspond au coefficient …… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: nombre
                enonce: Quel est le nouveau prix TTC ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a03
        titre: La vitesse
        transition: 'La facture est faite. Dernière situation : une vitesse.'
        consigne: Tu vas calculer la vitesse d’un cheval qui parcourt 1,2 km en 4 min, dans deux unités. On attend les deux vitesses.
        contenu:
            -   type: etapes
                elements:
                    - Un cheval parcourt 1,2 km en 4 min.
                    - Calcule en m/min et en km/h.
            -   type: paragraphe
                texte: Pourquoi deux unités ? Le règlement est en m/min, le GPS en km/h.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 1,2 km = …… m.
                        - ''
                    -   - 300 m/min = …… km/h.
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: nombre
                enonce: Vitesse en m/min ?
                unite: m/min
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q03
                type: nombre
                enonce: Vitesse en km/h ?
                unite: km/h
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le cheval fait 10 % plus vite la semaine suivante.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle vitesse en m/min ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: L’évaluation est terminée. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : saurais-tu résoudre seul des problèmes de proportionnalité ? Indique ce qui était facile et ce qui reste à travailler.'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Proportionnalité, %, TVA, vitesses.
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
