titre: 'Séance 17 : Des données réelles de la filière cheval'
themes:
- EG4, 1-1 — Organiser et traiter des données statistiques à une variable
problematique: Comment lire un tableau de données publiées, calculer des parts et des évolutions ?
competences_bo:
- EG4, 1-1 — Organiser et traiter des données statistiques à une variable
objectifs:
    connaissances:
    - On cite toujours la source et l’année des données.
    - Part = effectif ÷ total ; taux d’évolution = (nouvelle ÷ ancienne − 1) × 100.
    competences:
    - Lire un tableau de données réelles.
    - Calculer la part d’une catégorie en %.
    - Calculer et interpréter une évolution en %.
pourquoi:
- 'Aujourd’hui, trois notions : lire un tableau de données, calculer des parts, calculer des évolutions.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — Lire un tableau de données
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: 'Des organismes publics publient des chiffres sur la filière cheval : l’IFCE (Institut français du cheval et de l’équitation) en fait partie.'
    -   type: paragraphe
        texte: Un tableau de données a des lignes (les catégories), des colonnes (les années) et une source.
    -   type: paragraphe
        texte: 'À retenir : Lire une donnée = croiser une ligne et une colonne. Toujours noter la source et l’année.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Lis le titre et la source sous le tableau.
        - Repère la ligne de la catégorie demandée.
        - Repère la colonne de l’année demandée.
        - Lis le nombre à leur croisement.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi la source
    -   type: liste
        elements:
        - Un chiffre peut venir d’une enquête, d’un registre ou d’une simple estimation.
        - Avec la source et l’année, on sait d’où il vient et s’il est récent.
    -   type: paragraphe
        texte: 2. Pourquoi « provisoire »
    -   type: liste
        elements:
        - Les chiffres de 2023 marqués (p) peuvent encore un peu changer.
        - Ils sont publiés tôt pour être utiles, puis corrigés.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Naissances de poulains en France :'
    -   type: tableau
        colonnes:
        - Type d’équidé
        - '2018'
        - '2023'
        lignes:
        -   - Galop (courses)
            - 6 769
            - 6 476
        -   - Trot (courses)
            - 10 141
            - 8 960
        -   - Sport-loisir
            - 13 159
            - 16 577
        -   - Ânes
            - '352'
            - '417'
    -   type: paragraphe
        texte: 'Source : IFCE-SIRE, dépliant « Chiffres clés 2024 » (naissances de poulains immatriculés ; 2023 : chiffres provisoires). Extrait : les chevaux de trait ne figurent pas dans ce tableau.'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Combien de naissances de trotteurs en 2023 ?
        aide: Ligne Trot, colonne 2023.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Combien de naissances en sport-loisir en 2018 ?
        aide: Ligne Sport-loisir, colonne 2018.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Combien de naissances d’ânes en 2023 ?
        aide: Ligne Ânes, colonne 2023.
        calcul: true
    -   id: q04
        type: qcm
        enonce: Quelle est la source de ces données ?
        choix:
        -   id: a
            texte: Un site de petites annonces
        -   id: b
            texte: L’IFCE (fichier SIRE)
        -   id: c
            texte: Aucune
        aide: Lis sous le tableau.
    -   id: q05
        type: qcm
        enonce: Série B — En 2023, quel type a le plus de naissances ?
        choix:
        -   id: a
            texte: Galop
        -   id: b
            texte: Trot
        -   id: c
            texte: Sport-loisir
        aide: Compare la colonne 2023.
    -   id: q06
        type: nombre
        enonce: Combien de naissances en tout en 2023, pour ces 4 types ?
        aide: Additionne la colonne 2023.
        calcul: true
-   id: a02
    titre: Partie 2 — Calculer des parts
    transition: 'Tu sais lire le tableau. Deuxième notion : calculer la part de chaque type.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: La part d’une catégorie dit quelle fraction du total elle représente.
    -   type: paragraphe
        texte: C’est une fréquence, qu’on écrit en pourcentage.
    -   type: paragraphe
        texte: 'À retenir : Part = effectif de la catégorie ÷ total × 100.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Calcule le total de la colonne (une seule année).
        - Divise l’effectif de la catégorie par ce total.
        - Multiplie par 100 et arrondis à l’unité.
        - 'Contrôle : la somme des parts fait environ 100 %.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi diviser par le total
    -   type: liste
        elements:
        - La part répond à « combien sur 100 naissances ? ».
        - On ramène le nombre de la catégorie au nombre total, puis à 100.
    -   type: paragraphe
        texte: 2. Pourquoi c’est utile
    -   type: liste
        elements:
        - 16 577 ne dit pas si c’est beaucoup.
        - Dire « environ une naissance sur deux » (51 %) parle tout de suite.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Total des naissances 2023 (4 types) : 32 430. Arrondis les parts à l’unité.'
    -   type: tableau
        colonnes:
        - Type d’équidé
        - '2018'
        - '2023'
        lignes:
        -   - Galop (courses)
            - 6 769
            - 6 476
        -   - Trot (courses)
            - 10 141
            - 8 960
        -   - Sport-loisir
            - 13 159
            - 16 577
        -   - Ânes
            - '352'
            - '417'
    -   type: paragraphe
        texte: 'Source : IFCE-SIRE, dépliant « Chiffres clés 2024 » (naissances de poulains immatriculés ; 2023 : chiffres provisoires). Extrait : les chevaux de trait ne figurent pas dans ce tableau.'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Part du sport-loisir en 2023, en % ?
        unite: '%'
        aide: 16 577 ÷ 32 430 × 100.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Part du trot en 2023, en % ?
        unite: '%'
        aide: 8 960 ÷ 32 430 × 100.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Part du galop en 2023, en % ?
        unite: '%'
        aide: 6 476 ÷ 32 430 × 100.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Part des ânes en 2023, en % ?
        unite: '%'
        aide: 417 ÷ 32 430 × 100.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Série B — Part des courses (galop + trot) en 2023, en % ?
        unite: '%'
        aide: (6 476 + 8 960) ÷ 32 430 × 100.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Total des naissances en 2018 (4 types) ?
        aide: Additionne la colonne 2018.
        calcul: true
    -   id: q07
        type: nombre
        enonce: Part du sport-loisir en 2018, en % ?
        unite: '%'
        aide: 13 159 ÷ 30 421 × 100.
        calcul: true
-   id: a03
    titre: Partie 3 — Calculer une évolution
    transition: 'Dernière notion : comment chaque type a évolué entre 2018 et 2023.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: L’évolution compare la même catégorie à deux dates.
    -   type: paragraphe
        texte: On l’exprime en pourcentage avec le taux d’évolution (vu en séance 5).
    -   type: paragraphe
        texte: 'À retenir : Taux d’évolution = (valeur 2023 ÷ valeur 2018 − 1) × 100.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Repère l’ancienne valeur (2018) et la nouvelle (2023).
        - Divise la nouvelle par l’ancienne.
        - Enlève 1, multiplie par 100, arrondis à l’unité.
        - 'Positif : hausse ; négatif : baisse.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi diviser par l’ancienne valeur
    -   type: liste
        elements:
        - 'On compare au point de départ : 2018 représente 100 %.'
        - Si 2023 vaut 126 % de 2018, il y a eu 26 % de plus.
    -   type: paragraphe
        texte: 2. Évolution en nombre ou en %
    -   type: liste
        elements:
        - Les ânes gagnent 65 naissances, le sport-loisir 3 418.
        - 'Mais pour les ânes, 65 sur 352 c’est une hausse de 18 % : le % permet de comparer.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Arrondis les taux à l’unité. Pour une baisse, écris le signe moins.
    -   type: tableau
        colonnes:
        - Type d’équidé
        - '2018'
        - '2023'
        lignes:
        -   - Galop (courses)
            - 6 769
            - 6 476
        -   - Trot (courses)
            - 10 141
            - 8 960
        -   - Sport-loisir
            - 13 159
            - 16 577
        -   - Ânes
            - '352'
            - '417'
    -   type: paragraphe
        texte: 'Source : IFCE-SIRE, dépliant « Chiffres clés 2024 » (naissances de poulains immatriculés ; 2023 : chiffres provisoires). Extrait : les chevaux de trait ne figurent pas dans ce tableau.'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Combien de naissances en plus en sport-loisir entre 2018 et 2023 ?
        aide: 16 577 − 13 159.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Taux d’évolution du sport-loisir, en % ?
        unite: '%'
        aide: (16 577 ÷ 13 159 − 1) × 100.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Taux d’évolution du trot, en % ?
        unite: '%'
        aide: (8 960 ÷ 10 141 − 1) × 100.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Taux d’évolution des ânes, en % ?
        unite: '%'
        aide: (417 ÷ 352 − 1) × 100.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Série B — Taux d’évolution du total (4 types), en % ?
        unite: '%'
        aide: (32 430 ÷ 30 421 − 1) × 100.
        calcul: true
    -   id: q06
        type: qcm
        enonce: Quelle phrase est juste ?
        choix:
        -   id: a
            texte: Tous les types ont augmenté.
        -   id: b
            texte: Le sport-loisir a augmenté, les courses (galop et trot) ont baissé.
        -   id: c
            texte: Tous les types ont baissé.
        aide: Regarde le signe de chaque évolution.
    -   id: q07
        type: qcm
        enonce: Quelle catégorie a la plus forte hausse en % ?
        choix:
        -   id: a
            texte: Sport-loisir
        -   id: b
            texte: Ânes
        -   id: c
            texte: Trot
        aide: Compare +26 % et +18 %.
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: Combien de naissances de trotteurs en moins entre 2018 et 2023 ?
        calcul: true
    -   id: q02
        type: nombre
        enonce: Part du trot en 2018, en % (arrondi) ?
        unite: '%'
        calcul: true
    -   id: q03
        type: nombre
        enonce: Si le sport-loisir augmentait encore de 26 % après 2023, combien de naissances environ (arrondi à la centaine) ?
        calcul: true
retenir:
- 'Un chiffre sans source ni année n’est pas fiable : on les cite toujours.'
- Part d’une catégorie = effectif de la catégorie ÷ total × 100.
- Taux d’évolution = (nouvelle valeur ÷ ancienne valeur − 1) × 100.
- 'Taux positif : hausse ; taux négatif : baisse.'
