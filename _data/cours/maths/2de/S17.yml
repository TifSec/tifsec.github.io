titre: 'Séance 17 : Des données réelles de la filière cheval'
themes:
    - EG4, 1-1 — Organiser et traiter des données statistiques à une variable
problematique: Que nous apprennent les chiffres réels de la filière cheval ?
competences_bo:
    - EG4, 1-1 — Organiser et traiter des données statistiques à une variable
objectifs:
    connaissances:
        - Les données ouvertes de l’IFCE (Observatoire économique et social du cheval) et d’Agreste décrivent la filière.
        - On cite toujours la source et l’année.
    competences:
        - Lire un tableau de données réelles.
        - Calculer des fréquences et des évolutions.
pourquoi:
    - Jusqu’ici, les données étaient fictives.
    - Aujourd’hui, tu travailles sur des chiffres publiés (extraits arrondis préparés par le professeur).
activites:
    -   id: a01
        titre: Lire le tableau
        consigne: Tu vas lire un extrait des chiffres de naissances d’équidés publiés par l’IFCE (document 1). On attend la source, l’année et le type le plus représenté.
        contenu:
            -   type: liste
                elements:
                    - 'Automatisme : arrondis 12 486 à la centaine.'
            -   type: paragraphe
                texte: Document 1 — Extrait des naissances d’équidés par type en France (chiffres arrondis), à distribuer par le professeur depuis la publication IFCE la plus récente.
            -   type: lien
                titre: IFCE — Statistiques et données de la filière
                url: https://www.ifce.fr/ifce/connaissances/statistiques-et-donnees/
            -   type: etapes
                elements:
                    - 'Lis l’exemple : sous un tableau, on lit « Source : IFCE, 2024 ».'
                    - La source dit qui a produit les chiffres ; l’année dit quand.
                    - Pour trouver la plus grande valeur, on parcourt la colonne et on garde le plus grand nombre.
                    - 'À toi : lis l’extrait (document 1, préparé par le professeur à partir des publications de l’IFCE) ; repère la source, l’année et le type le plus nombreux.'
                    - Pourquoi la source ? Sans elle, un chiffre ne peut pas être vérifié.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - On cite toujours la …… et l’année des données.
                        - ''
                    -   - L’IFCE publie des données sur la filière …… .
                        - ''
                aide: Sous un tableau de données, on écrit toujours d’où il vient et… ? Et l’IFCE publie des données sur quelle filière ?
            -   id: q02
                type: texte
                enonce: Quelle est la source et l’année des données du document 1 ?
                aide: La source et l’année sont écrites sous le tableau du document 1.
            -   id: q03
                type: texte
                enonce: Quelle race ou quel type a le plus de naissances ?
                aide: Cherche la plus grande valeur de la colonne des naissances du document 1.
    -   id: a02
        titre: Calculer des fréquences
        transition: Tu as lu le tableau. Calcule la structure de la filière.
        consigne: Tu vas calculer la part des principaux types dans les naissances. On attend deux parts en pourcentage.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : 300 naissances d’un type sur un total de 1 200.'
                    - Part = 300 ÷ 1 200 = 0,25.
                    - 'En pourcentage : 0,25 × 100 = 25 %.'
                    - Les parts de tous les types doivent faire environ 100 % (les arrondis peuvent donner 99 % ou 101 %).
                    - 'À toi : calcule la part de chaque type dans le total.'
                    - Pourquoi des parts ? Elles montrent la structure de la filière.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Part d’un type = effectif du type ÷ …… .
                        - ''
                    -   - On écrit une part en …… .
                        - ''
                aide: Part = effectif du type ÷ effectif… ? Et on l’écrit en quelle unité ?
            -   id: q02
                type: texte
                enonce: Écris la part (en %) des deux types les plus nombreux.
                aide: 'Pour les deux types les plus nombreux : naissances du type ÷ total des naissances × 100.'
    -   id: a03
        titre: Une évolution
        transition: Tu connais la structure. Comment évolue-t-elle ?
        consigne: Tu vas calculer le taux d’évolution des naissances d’un type entre deux années. On attend le calcul et son interprétation.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : 400 naissances une année, 360 l’année suivante.'
                    - Taux d’évolution = (nouvelle − ancienne) ÷ ancienne = (360 − 400) ÷ 400.
                    - −40 ÷ 400 = −0,1, soit −10 %.
                    - 'Le signe − veut dire une baisse : les naissances ont baissé de 10 %.'
                    - 'À toi : compare avec l’année précédente (deuxième colonne de l’extrait) et calcule le taux d’évolution d’un type.'
                    - Pourquoi une évolution ? Elle montre si la filière grandit ou recule.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Taux d’évolution = (nouvelle − ancienne) ÷ …… .
                        - ''
                    -   - Un taux négatif signifie une …… .
                        - ''
                aide: Taux d’évolution = (nouvelle − ancienne) ÷ quelle valeur ? Et si le résultat est négatif, il y a eu une hausse ou une… ?
            -   id: q02
                type: texte
                enonce: Calcule le taux d’évolution des naissances d’un type entre les deux années et interprète.
                aide: Choisis un type, prends ses naissances des deux années du document 1, applique la formule, puis dis si c’est une hausse ou une baisse.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Les naissances baissent dans certaines races depuis des années.
        questions:
            -   id: q01
                type: texte
                enonce: Propose une explication à vérifier.
                aide: 'Pense au prix d’un poulain, au coût de l’élevage, aux usages du cheval (sport, loisir, travail) : propose une piste à vérifier.'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as exploité des données réelles. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : que nous apprennent les chiffres réels de la filière cheval ?'
                aide: Dis comment lire un tableau de données réelles, calculer une part et un taux d’évolution, et citer la source.
retenir:
    - Citer source et année.
    - Parts et évolutions.
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
