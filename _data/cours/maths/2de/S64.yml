titre: 'Renforcement 4 : Des grammes aux kilos, des minutes aux heures'
themes:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment changer d’unité sans se tromper, et calculer avec des durées ?
competences_bo:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
        - 1 t = 1 000 kg ; 1 kg = 1 000 g ; 1 L = 1 000 mL ; 1 km = 1 000 m.
        - 'Pour les durées, on compte par 60 : 1 h = 60 min.'
        - Pour calculer avec une durée (salaire, distance), on l’écrit en heures décimales.
    competences:
        - Convertir des masses, des volumes et des longueurs.
        - Passer des heures et minutes aux heures décimales, et calculer une durée.
        - Calculer un salaire ou une distance à partir d’une durée.
pourquoi:
    - En S08 et S09, tu as converti des vitesses et des durées. Cette heure reprend les conversions et les utilise dans des calculs.
    - 'Les compléments se dosent en grammes, les rations en kilos, le foin s’achète à la tonne : une erreur d’unité coûte cher, ou rend un cheval malade.'
activites:
    -   id: a01
        titre: Automatismes
        consigne: Tu vas faire 5 calculs de tête, sans calculatrice. On attend 5 résultats.
        contenu:
            -   type: paragraphe
                texte: 'Range ta calculatrice : ces calculs se font de tête. Prends ton temps, la vitesse viendra avec l’entraînement.'
        questions:
            -   id: q01
                type: nombre
                enonce: Convertis 2,5 kg en grammes.
                unite: g
                aide: '× 1 000 : la virgule se décale de 3 rangs vers la droite.'
            -   id: q02
                type: nombre
                enonce: Combien de minutes dans 1 h ?
                unite: min
                aide: Regarde le tour complet de la grande aiguille.
            -   id: q03
                type: nombre
                enonce: Combien de millilitres dans 1 L ?
                unite: mL
                aide: Milli veut dire un millième.
            -   id: q04
                type: nombre
                enonce: Convertis 3 km en mètres.
                unite: m
                aide: 1 km = 1 000 m.
    -   id: a02
        titre: Masses, volumes et longueurs
        consigne: Tu vas convertir des masses, un volume, puis calculer une quantité de complément. On attend les points clés, un tableau complété et un résultat.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Le complément se dose en grammes, le foin s’achète en tonnes, l’eau se mesure en litres. Comment passer de l’un à l’autre ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Convertir, c’est exprimer une même quantité dans une autre unité. Pour les masses, les volumes et les longueurs, on passe d’une unité à l’autre par 1 000.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Comparer des quantités, doser un complément, acheter la bonne quantité.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - 'Grande unité → petite unité : on multiplie par 1 000.'
                    - 'Petite unité → grande unité : on divise par 1 000.'
                    - 'On vérifie : en petites unités, le nombre est plus grand.'
            -   type: paragraphe
                texte: 'À retenir : × 1 000 vers la petite unité ; ÷ 1 000 vers la grande.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Convertis 4,2 kg en g.
                    - Convertis 600 mL en L.
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : complète le tableau, puis calcule le complément à acheter.'
                    - 'Pourquoi c’est important ? Le complément se dose en g, le foin en kg : il faut la même unité pour comparer.'
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Pour passer des kg aux g, on multiplie par …… .
                        - ''
                    -   - Pour passer des g aux kg, on …… par 1 000.
                        - ''
                aide: 'Relis l’exemple : 1,2 kg est devenu 1 200 g, on a multiplié par combien ? Et pour 750 g → 0,75 kg ?'
            -   id: q02
                type: tableau
                enonce: 'Palier 1 : complète chaque conversion.'
                colonnes:
                    - Conversion
                    - Résultat
                lignes:
                    -   - 3,5 kg = …… g
                        - ''
                    -   - 250 mL = …… L
                        - ''
                    -   - 1,2 t = …… kg
                        - ''
                aide: 'Grande unité vers petite : × 1 000. Petite unité vers grande : ÷ 1 000.'
            -   id: q03
                type: nombre
                enonce: 'Palier 3 : un cheval reçoit 30 g de complément par jour pendant 30 jours. Combien de kg de complément faut-il acheter ?'
                unite: kg
                aide: Calcule d’abord en grammes pour 30 jours, puis convertis en kg (÷ 1 000).
    -   id: a03
        titre: 'Les durées : attention, 1 h = 60 min'
        transition: Les masses suivent la règle des 1 000. Les durées, elles, comptent par 60 !
        consigne: Tu vas passer d’heures et minutes à des heures décimales, puis calculer la durée d’une balade. On attend un tableau et une durée.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Le GPS indique 1,75 h de balade. Combien de minutes ? Et combien de temps a duré la balade de 14 h 20 à 16 h 05 ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: 'Les durées se comptent par 60 : 1 h = 60 min. Une durée peut s’écrire en heures et minutes ou en heures décimales.'
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Lire un GPS, un planning, calculer une durée.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - 'Minutes → heures décimales : on divise les minutes par 60 (30 min = 0,5 h).'
                    - 'Heures décimales → minutes : on multiplie la partie décimale par 60.'
                    - 'Pour une durée : on compte jusqu’à l’heure pile, puis les heures, puis les minutes restantes.'
            -   type: paragraphe
                texte: 'À retenir : 1 h = 60 min ; attention, 1,30 h n’est pas 1 h 30 min.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Convertis 2 h 15 min en heures décimales.
                    - Une leçon de 17 h 45 à 18 h 30 dure combien de minutes ?
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : complète le tableau, puis calcule la durée de la balade.'
                    - Pourquoi les heures décimales ? Pour calculer un salaire ou une vitesse, la calculatrice a besoin d’heures décimales.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Palier 1 : complète.'
                colonnes:
                    - Durée
                    - Résultat
                lignes:
                    -   - 1 h 45 min = …… h
                        - ''
                    -   - 0,5 h = …… min
                        - ''
                aide: 45 min, ce sont trois quarts d’heure. 0,5 h, c’est une demi-heure.
            -   id: q02
                type: nombre
                enonce: 'Palier 2 : un cavalier part en balade à 14 h 20 et rentre à 16 h 05. Combien de minutes a duré la balade ?'
                unite: min
                aide: Compte de 14 h 20 à 15 h, puis de 15 h à 16 h, puis de 16 h à 16 h 05. Additionne.
    -   id: a04
        titre: Calculer avec une durée
        transition: Tu sais écrire une durée en heures décimales. Utilise-la pour un salaire et une distance.
        consigne: Tu vas calculer le prix d’un cours et la distance d’une randonnée à partir d’une durée. On attend deux résultats avec leur unité.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Un moniteur fait 1 h 30 min de cours payé 24 € de l’heure. Combien gagne-t-il ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Calculer avec une durée, c’est multiplier une vitesse ou un tarif horaire par une durée écrite en heures décimales.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Calculer un salaire, une distance parcourue.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - On écrit la durée en heures décimales.
                    - On multiplie par le tarif horaire (ou la vitesse).
            -   type: paragraphe
                texte: 'À retenir : On écrit la durée en heures décimales avant de calculer.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - 3 h 45 min à 12 € de l’heure ?
                    - Au pas à 6 km/h pendant 1 h 30 ?
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : calcule le prix du cours, puis la distance de la randonnée.'
                    - 'Pourquoi convertir d’abord ? 2 h 15 min n’est pas 2,15 h : avec 2,15 × 12, on trouverait 25,80 €, et c’est faux.'
        questions:
            -   id: q01
                type: nombre
                enonce: 'Palier 2 : un moniteur fait 1 h 30 min de cours à 24 € de l’heure. Combien gagne-t-il ? Quel calcul vas-tu poser ? Résous-le.'
                unite: €
                aide: Écris 1 h 30 min en heures décimales, puis multiplie par 24.
            -   id: q02
                type: nombre
                enonce: 'Palier 3 : en randonnée, un cheval avance au pas à 6 km/h pendant 2 h 30 min. Quelle distance parcourt-il ? Quel calcul vas-tu poser ? Résous-le.'
                unite: km
                aide: Écris 2 h 30 min en heures décimales, puis multiplie par la vitesse.
    -   id: a05
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un cheval parcourt 9 km au trot en 45 min.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle est sa vitesse en km/h ? Explique.
                aide: '45 min, ce sont trois quarts d’heure : 0,75 h. Divise la distance par la durée en heures.'
    -   id: a06
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tes missions sont faites. Il reste à répondre au problème de départ et à faire ton bilan.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment évites-tu les erreurs d’unité pour les masses et pour les durées ? Donne un exemple de calcul avec une durée. Écris aussi une chose que tu sais faire maintenant et une chose à retravailler.'
                aide: Rappelle la règle des 1 000 pour les masses, la règle des 60 pour les durées, et l’exemple du moniteur ou du palefrenier.
retenir:
    - 't → kg, kg → g, L → mL, km → m : × 1 000 ; dans l’autre sens : ÷ 1 000.'
    - 1 h = 60 min ; on convertit les minutes en heures en divisant par 60.
    - Pour calculer avec une durée, on l’écrit d’abord en heures décimales.
