titre: 'Renforcement 4 : Soldes à la sellerie'
themes:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment vérifier un prix soldé ou augmenté sans se tromper ?
competences_bo:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
        - 10 %, c’est diviser par 10 ; 5 %, c’est la moitié de 10 % ; 20 %, c’est le double de 10 %.
        - Prix soldé = prix de départ − remise ; nouveau prix = prix de départ + hausse.
    competences:
        - Calculer un pourcentage simple de tête.
        - Calculer un prix après une remise ou une hausse.
pourquoi:
    - En S05 et S06, tu as calculé des hausses et la TVA. Cette heure reprend les pourcentages de base.
    - En sellerie ou pour la pension, savoir vérifier un prix évite de payer trop cher.
activites:
    -   id: a01
        titre: Automatismes
        consigne: Tu vas faire 5 calculs de tête, sans calculatrice. On attend 5 résultats.
        contenu:
            -   type: paragraphe
                texte: 'Range ta calculatrice : ces calculs se font de tête. Prends ton temps, la vitesse viendra avec l’entraînement.'
        questions:
            -   id: q01
                type: nombre
                enonce: 'Calcule de tête : 10 % de 50.'
                aide: 10 %, c’est diviser par 10.
            -   id: q02
                type: nombre
                enonce: 'Calcule de tête : 10 % de 230.'
                aide: Divise 230 par 10.
            -   id: q03
                type: nombre
                enonce: 'Calcule de tête : 50 % de 84.'
                aide: 50 %, c’est la moitié.
            -   id: q04
                type: nombre
                enonce: 'Calcule de tête : 25 % de 40.'
                aide: '25 %, c’est un quart : divise par 4.'
            -   id: q05
                type: nombre
                enonce: 'Calcule de tête : 1 % de 300.'
                aide: 1 %, c’est diviser par 100.
    -   id: a02
        titre: Prendre un pourcentage de tête
        consigne: Tu vas calculer 10 %, 5 % et 20 % d’un prix de 120 € sans calculatrice. On attend un tableau complété.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : un licol coûte 80 €.'
                    - '10 % de 80 € : on divise par 10. 80 ÷ 10 = 8 €.'
                    - '5 % de 80 € : c’est la moitié de 10 %. 8 ÷ 2 = 4 €.'
                    - '20 % de 80 € : c’est le double de 10 %. 8 × 2 = 16 €.'
                    - 'À toi : fais la même chose avec un prix de 120 €.'
                    - Pourquoi partir de 10 % ? C’est le plus facile à calculer de tête, et les autres s’en déduisent.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Pour prendre 10 % d’un prix, on le divise par …… .
                        - ''
                    -   - 5 %, c’est la …… de 10 %.
                        - ''
                aide: 'Relis l’exemple du licol : 80 € est devenu 8 €, on a divisé par combien ? Et de 8 € à 4 €, qu’a-t-on fait ?'
            -   id: q02
                type: tableau
                enonce: 'Palier 1 : calcule de tête pour un prix de 120 €.'
                colonnes:
                    - Pourcentage
                    - Montant (€)
                lignes:
                    -   - 10 % de 120 €
                        - ''
                    -   - 5 % de 120 €
                        - ''
                    -   - 20 % de 120 €
                        - ''
                aide: Commence par 10 % (divise par 10). Puis prends la moitié pour 5 % et le double pour 20 %.
    -   id: a03
        titre: Le prix après une remise ou une hausse
        transition: Tu sais calculer un pourcentage. Calcule maintenant le prix à payer.
        consigne: Tu vas calculer deux prix soldés et une pension augmentée, en deux étapes. On attend trois prix en euros.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : une couverture coûte 80 €. Elle est soldée à −25 %.'
                    - 'Étape 1, la remise : 25 % de 80 € = 80 ÷ 4 = 20 €.'
                    - 'Étape 2, le prix soldé : 80 − 20 = 60 €.'
                    - 'Pour une hausse, on ajoute : une pension de 300 € augmente de 10 %. 10 % de 300 € = 30 € ; 300 + 30 = 330 €.'
                    - 'À toi : calcule les prix demandés.'
                    - Pourquoi deux étapes ? On sait d’abord combien on enlève ou on ajoute, puis on trouve le prix à payer.
        questions:
            -   id: q01
                type: nombre
                enonce: 'Palier 2 : un tapis à 60 € est soldé à −10 %. Quel est son prix soldé ?'
                unite: €
                aide: 'Étape 1 : 10 % de 60 €. Étape 2 : enlève-le au prix de départ.'
            -   id: q02
                type: nombre
                enonce: 'Palier 3 : une selle coûte 900 €. Pendant les soldes, elle est à −20 %. Quel calcul vas-tu poser ? Quel est le prix soldé ?'
                unite: €
                aide: 20 %, c’est le double de 10 %. Calcule la remise, puis enlève-la.
            -   id: q03
                type: nombre
                enonce: 'Palier 3 : la pension de 350 € par mois augmente de 10 %. Quel est le nouveau prix ?'
                unite: €
                aide: 'C’est une hausse : calcule 10 % de 350 €, puis ajoute-le.'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un magasin annonce −20 %, puis une remise de −10 % en plus sur le prix soldé.
        questions:
            -   id: q01
                type: texte
                enonce: Est-ce la même chose que −30 % ? Teste avec un article à 100 €.
                aide: Calcule d’abord le prix après −20 %, puis enlève 10 % de ce nouveau prix. Compare avec 100 € − 30 %.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tes missions sont faites. Il reste à répondre au problème de départ et à faire ton bilan.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment vérifies-tu le prix d’une selle soldée ? Écris aussi une chose que tu sais faire maintenant et une chose à retravailler.'
                aide: 'Explique les deux étapes avec l’exemple de la selle : la remise, puis le prix soldé.'
retenir:
    - '10 % : ÷ 10 ; 5 % : la moitié de 10 % ; 20 % : le double de 10 % ; 25 % : ÷ 4 ; 50 % : ÷ 2.'
    - Prix soldé = prix − remise ; nouveau prix = prix + hausse.
