titre: 'Renforcement 4 : Convertir des masses, des volumes et des durées'
themes:
- EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment passer d’une unité à une autre sans se tromper, et calculer avec une durée ?
competences_bo:
- EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
    - 't → kg, kg → g, L → mL, km → m : × 1 000 ; dans l’autre sens : ÷ 1 000.'
    - '1 h = 60 min ; minutes → heures : ÷ 60.'
    competences:
    - Convertir des masses, volumes et longueurs.
    - Convertir des durées.
    - Calculer avec une durée en heures décimales.
pourquoi:
- 'Aujourd’hui, trois notions : masses, volumes et longueurs ; les durées ; calculer avec une durée.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — Masses, volumes et longueurs
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: 'Les unités d’une même grandeur vont de 1 000 en 1 000 : tonne, kilogramme, gramme ; litre, millilitre ; kilomètre, mètre.'
    -   type: paragraphe
        texte: Convertir, c’est écrire la même quantité avec une autre unité.
    -   type: paragraphe
        texte: 'À retenir : Grande → petite unité : × 1 000. Petite → grande : ÷ 1 000.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Repère si tu vas vers une unité plus petite ou plus grande.
        - 'Plus petite : le nombre devient plus grand, × 1 000.'
        - 'Plus grande : le nombre devient plus petit, ÷ 1 000.'
        - '× 1 000 : la virgule avance de 3 rangs ; ÷ 1 000 : elle recule de 3 rangs.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi le nombre grandit
    -   type: liste
        elements:
        - '1 kg = 1 000 g : il faut 1 000 petits grammes pour faire 1 kg.'
        - 'Avec une unité plus petite, il en faut plus : le nombre grandit.'
    -   type: paragraphe
        texte: 2. Pourquoi 3 rangs
    -   type: liste
        elements:
        - '× 10 décale d’un rang ; × 1 000 = × 10 × 10 × 10 : trois rangs.'
        - 2,5 kg → 2 500 g.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Sans calculatrice.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Convertis 3 kg en g.
        unite: g
        aide: × 1 000.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Convertis 2,5 t en kg.
        unite: kg
        aide: × 1 000.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Convertis 1,5 L en mL.
        unite: mL
        aide: × 1 000.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Convertis 4,2 km en m.
        unite: m
        aide: × 1 000.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Série B — Convertis 500 g en kg.
        unite: kg
        aide: ÷ 1 000.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Convertis 250 mL en L.
        unite: L
        aide: ÷ 1 000.
        calcul: true
    -   id: q07
        type: nombre
        enonce: Convertis 800 kg en t.
        unite: t
        aide: ÷ 1 000.
        calcul: true
-   id: a02
    titre: Partie 2 — Les durées
    transition: 'Tu sais convertir les masses. Deuxième notion : les durées, qui ne vont pas de 1 000 en 1 000.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: 'Les durées comptent en 60 : 1 h = 60 min et 1 min = 60 s.'
    -   type: paragraphe
        texte: On ne peut donc pas simplement décaler la virgule.
    -   type: paragraphe
        texte: 'À retenir : Minutes → heures : ÷ 60. Heures → minutes : × 60.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - 'Heures → minutes : multiplie par 60.'
        - 'Minutes → heures : divise par 60.'
        - 'Repères : 30 min = 0,5 h ; 15 min = 0,25 h ; 45 min = 0,75 h.'
        - 'Attention : 1,5 h = 1 h 30 min, pas 1 h 50.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi 60
    -   type: liste
        elements:
        - Une heure est découpée en 60 minutes, pas en 100.
        - Une demi-heure, c’est donc 30 min, et un quart d’heure 15 min.
    -   type: paragraphe
        texte: 2. Pourquoi 1,5 h = 1 h 30
    -   type: liste
        elements:
        - '0,5 h, c’est la moitié d’une heure, donc la moitié de 60 min : 30 min.'
        - 1,5 h = 1 h + 30 min.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Convertis 3 h en minutes.
        unite: min
        aide: × 60.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Convertis 0,5 h en minutes.
        unite: min
        aide: × 60.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Convertis 1,25 h en minutes.
        unite: min
        aide: × 60.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Convertis 45 min en heures.
        unite: h
        aide: ÷ 60.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Série B — Convertis 120 min en heures.
        unite: h
        aide: ÷ 60.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Convertis 150 min en heures.
        unite: h
        aide: ÷ 60.
        calcul: true
    -   id: q07
        type: qcm
        enonce: 1,5 h, c’est…
        choix:
        -   id: a
            texte: 1 h 50 min
        -   id: b
            texte: 1 h 30 min
        -   id: c
            texte: 1 h 15 min
        aide: 0,5 h = la moitié de 60 min.
-   id: a03
    titre: Partie 3 — Calculer avec une durée
    transition: 'Dernière notion : utiliser une durée dans un calcul.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Pour calculer avec une durée (un salaire à l’heure, une vitesse), on l’écrit en heures décimales.
    -   type: paragraphe
        texte: 1 h 30 min devient 1,5 h, puis on fait le calcul.
    -   type: paragraphe
        texte: 'À retenir : Durée en h et min → heures décimales → calcul.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Écris la durée en heures décimales (minutes ÷ 60).
        - Fais le calcul demandé (× un prix horaire, ÷ pour une vitesse…).
        - Vérifie que le résultat est raisonnable.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi pas 1,30
    -   type: liste
        elements:
        - Un salarié payé 12 € de l’heure travaille 1 h 30.
        - '1,5 × 12 = 18 € (juste) ; 1,30 × 12 = 15,60 € (faux : il perd de l’argent).'
    -   type: paragraphe
        texte: 2. Le contrôle
    -   type: liste
        elements:
        - '1 h 30, c’est entre 1 h et 2 h : le prix doit être entre 12 € et 24 €.'
        - 18 € est bien entre les deux.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Écris 1 h 30 min en heures décimales.
        unite: h
        aide: 30 ÷ 60.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Un palefrenier travaille 1 h 30 à 12 € de l’heure. Combien gagne-t-il ?
        unite: €
        aide: 1,5 × 12.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Une monitrice donne 2 h 45 de cours à 20 € de l’heure. Combien ?
        unite: €
        aide: 2,75 × 20.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Un cheval marche 3 h 30 à 6 km/h. Distance ?
        unite: km
        aide: 3,5 × 6.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Série B — Un trajet de 15 km dure 1 h 15. Vitesse en km/h ?
        unite: km/h
        aide: 15 ÷ 1,25.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Un trajet de 9 km dure 45 min. Vitesse en km/h ?
        unite: km/h
        aide: 45 min = 0,75 h ; 9 ÷ 0,75.
        calcul: true
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: Convertis 0,3 kg en g.
        unite: g
        calcul: true
    -   id: q02
        type: nombre
        enonce: Convertis 1 200 m en km.
        unite: km
        calcul: true
    -   id: q03
        type: nombre
        enonce: Convertis 2 h 30 en minutes.
        unite: min
        calcul: true
    -   id: q04
        type: nombre
        enonce: 3 h 15 de travail à 16 € de l’heure ?
        unite: €
        calcul: true
retenir:
- 'Vers une unité plus petite (kg → g) : × 1 000. Vers une plus grande (g → kg) : ÷ 1 000.'
- 1 t = 1 000 kg ; 1 kg = 1 000 g ; 1 L = 1 000 mL ; 1 km = 1 000 m.
- '1 h = 60 min : minutes → heures, ÷ 60 ; heures → minutes, × 60.'
- Pour calculer avec une durée, on l’écrit en heures décimales (1 h 30 = 1,5 h).
