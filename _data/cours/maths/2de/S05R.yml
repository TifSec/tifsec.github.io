titre: 'Séance 5 : Augmenter ou baisser un prix en pourcentage'
themes:
- EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment calculer une hausse ou une baisse en pourcentage, et retrouver le pourcentage d’une évolution ?
competences_bo:
- EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
    - t % d’une valeur = valeur × t ÷ 100.
    - 'Coefficient multiplicateur : 1 + t/100 (hausse) ; 1 − t/100 (baisse).'
    - Taux d’évolution = (nouvelle ÷ ancienne − 1) × 100.
    competences:
    - Calculer un pourcentage d’une valeur.
    - Calculer un nouveau prix après une hausse ou une baisse.
    - Retrouver le pourcentage d’une évolution.
pourquoi:
- 'Aujourd’hui, trois notions : appliquer un pourcentage, le coefficient multiplicateur, puis retrouver un pourcentage.'
- 'Pour chacune : la notion, la méthode, un exemple au tableau, puis beaucoup d’exercices pour s’entraîner.'
activites:
-   id: a01
    titre: Partie 1 — Calculer un pourcentage, augmenter, diminuer
    consigne: Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre.
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: 'Un pourcentage est une part sur 100 : 5 % de 380, c’est 5 parts sur 100 de 380.'
    -   type: paragraphe
        texte: Augmenter une valeur de t %, c’est lui ajouter t % d’elle-même ; la diminuer de t %, c’est lui enlever t % d’elle-même.
    -   type: paragraphe
        texte: 'À retenir : t % d’une valeur = valeur × t ÷ 100. Nouvelle valeur = valeur ± ce montant.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - 'Étape 1 : calcule t % de la valeur de départ : valeur × t ÷ 100.'
        - 'Étape 2 : pour une hausse, ajoute ce montant à la valeur de départ.'
        - Pour une baisse, enlève ce montant à la valeur de départ.
        - 'Astuce de tête : 10 % = diviser par 10 ; 5 % = la moitié de 10 % ; 25 % = un quart ; 50 % = la moitié.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée. Fais les deux étapes à chaque fois.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Calcule 10 % de 40 €.
        unite: €
        aide: 10 % de 40 = 40 × 10 ÷ 100.
    -   id: q02
        type: nombre
        enonce: Calcule 5 % de 380 €.
        unite: €
        aide: 5 % de 380 = 380 × 5 ÷ 100.
    -   id: q03
        type: nombre
        enonce: Calcule 20 % de 150 €.
        unite: €
        aide: 20 % de 150 = 150 × 20 ÷ 100.
    -   id: q04
        type: nombre
        enonce: Série B — Une licence de 40 € augmente de 10 %. Quel est le nouveau prix ?
        unite: €
        aide: 'Étape 1 : calcule 10 % de 40. Étape 2 : ajoute-le à 40.'
    -   id: q05
        type: nombre
        enonce: Une pension de 380 € augmente de 5 %. Quel est le nouveau prix ?
        unite: €
        aide: 'Étape 1 : 5 % de 380. Étape 2 : ajoute-le à 380.'
    -   id: q06
        type: nombre
        enonce: Un tapis de 60 € baisse de 5 %. Quel est le nouveau prix ?
        unite: €
        aide: 'Étape 1 : 5 % de 60. Étape 2 : enlève-le à 60.'
    -   id: q07
        type: nombre
        enonce: Une selle de 800 € baisse de 25 %. Quel est le nouveau prix ?
        unite: €
        aide: 'Étape 1 : 25 % de 800. Étape 2 : enlève-le à 800.'
-   id: a02
    titre: Partie 2 — Le coefficient multiplicateur
    transition: 'Tu sais faire une hausse en deux étapes. Deuxième notion : le faire en un seul calcul.'
    consigne: Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre.
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Le coefficient multiplicateur permet de faire une hausse ou une baisse en un seul calcul.
    -   type: paragraphe
        texte: 'Hausse de 5 % : on garde 100 % et on ajoute 5 %, donc 105 % = 1,05. Baisse de 20 % : il reste 80 % = 0,8.'
    -   type: paragraphe
        texte: 'À retenir : Hausse de t % : × (1 + t/100). Baisse de t % : × (1 − t/100).'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - 'Écris le pourcentage en nombre décimal : 5 % = 0,05 ; 20 % = 0,20.'
        - 'Hausse : ajoute-le à 1 (1 + 0,05 = 1,05).'
        - 'Baisse : enlève-le à 1 (1 − 0,20 = 0,8).'
        - Nouvelle valeur = valeur de départ × coefficient.
        - 'Vérifie : une hausse donne un coefficient plus grand que 1, une baisse un coefficient plus petit que 1.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Calculatrice autorisée. Pour la série B, utilise le coefficient : un seul calcul.'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Quel est le coefficient multiplicateur pour une hausse de 5 % ?
        aide: 'Hausse : 1 + 5 ÷ 100.'
    -   id: q02
        type: nombre
        enonce: Quel est le coefficient pour une hausse de 12 % ?
        aide: 'Hausse : 1 + 12 ÷ 100.'
    -   id: q03
        type: nombre
        enonce: Quel est le coefficient pour une baisse de 20 % ?
        aide: 'Baisse : 1 − 20 ÷ 100.'
    -   id: q04
        type: nombre
        enonce: Quel est le coefficient pour une baisse de 15 % ?
        aide: 'Baisse : 1 − 15 ÷ 100.'
    -   id: q05
        type: nombre
        enonce: Série B — Un sac de granulés à 250 € augmente de 8 %. Calcule le nouveau prix avec le coefficient.
        unite: €
        aide: 'Coefficient de +8 % : 1,08. Nouveau prix = 250 × 1,08.'
    -   id: q06
        type: nombre
        enonce: Une selle à 1 250 € est soldée −20 %. Calcule le prix soldé avec le coefficient.
        unite: €
        aide: 'Coefficient de −20 % : 0,8. Prix soldé = 1 250 × 0,8.'
    -   id: q07
        type: nombre
        enonce: Un filet à 40 € est soldé −25 %. Calcule le prix soldé avec le coefficient.
        unite: €
        aide: 'Coefficient de −25 % : 0,75. Prix soldé = 40 × 0,75.'
-   id: a03
    titre: Partie 3 — Retrouver le pourcentage d’évolution
    transition: 'Tu sais appliquer un pourcentage. Dernière notion : retrouver le pourcentage quand on connaît l’ancien et le nouveau prix.'
    consigne: Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre.
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Le taux d’évolution dit de combien de pourcents une valeur a changé.
    -   type: paragraphe
        texte: On part de l’ancienne et de la nouvelle valeur, et on retrouve le pourcentage.
    -   type: paragraphe
        texte: 'À retenir : Coefficient = nouvelle valeur ÷ ancienne valeur. Taux = (coefficient − 1) × 100.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - 'Divise la nouvelle valeur par l’ancienne : c’est le coefficient.'
        - Enlève 1 au coefficient.
        - 'Multiplie par 100 : tu obtiens le taux en %.'
        - Résultat positif = hausse ; résultat négatif = baisse.
        - 'Attention : on divise toujours par l’ancienne valeur (celle de départ).'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée. Pour une baisse, écris le signe moins (par exemple −25).
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Un sac passe de 20 € à 23 €. Quel est le coefficient multiplicateur ?
        aide: Coefficient = nouvelle valeur ÷ ancienne valeur.
    -   id: q02
        type: nombre
        enonce: Un sac passe de 20 € à 23 €. Quel est le taux d’évolution en % ?
        unite: '%'
        aide: Coefficient − 1, puis × 100.
    -   id: q03
        type: nombre
        enonce: Le foin passe de 160 € à 184 € la tonne. Quel est le taux d’évolution en % ?
        unite: '%'
        aide: Calcule 184 ÷ 160, enlève 1, multiplie par 100.
    -   id: q04
        type: nombre
        enonce: 'Une selle passe de 800 € à 600 €. Quel est le taux d’évolution en % ? (Pour une baisse, écris le signe moins : −…)'
        unite: '%'
        aide: 'Calcule 600 ÷ 800, enlève 1, multiplie par 100. Le résultat est négatif : c’est une baisse.'
    -   id: q05
        type: nombre
        enonce: Une leçon passe de 50 € à 60 €. Quel est le taux d’évolution en % ?
        unite: '%'
        aide: Calcule 60 ÷ 50, enlève 1, multiplie par 100.
    -   id: q06
        type: qcm
        enonce: 'Série B — Le fournisseur annonce : « Le foin augmente de 10 % » (de 160 € à 184 € la tonne). A-t-il raison ?'
        choix:
        -   id: a
            texte: Oui, la hausse est bien de 10 %.
        -   id: b
            texte: Non, la hausse est de 15 %.
        -   id: c
            texte: Non, la hausse est de 24 %.
        aide: Calcule le vrai taux d’évolution, puis compare avec 10 %.
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini les trois parties ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: Calcule 30 % de 70 €.
        unite: €
    -   id: q02
        type: nombre
        enonce: Une couverture de 45 € augmente de 20 %. Nouveau prix ?
        unite: €
    -   id: q03
        type: nombre
        enonce: Un licol de 120 € est soldé −30 %. Prix soldé ?
        unite: €
    -   id: q04
        type: nombre
        enonce: Quel est le coefficient pour une baisse de 8 % ?
    -   id: q05
        type: nombre
        enonce: Un prix passe de 400 € à 460 €. Taux d’évolution en % ?
        unite: '%'
    -   id: q06
        type: nombre
        enonce: Un prix passe de 75 € à 60 €. Taux d’évolution en % ?
        unite: '%'
retenir:
- t % d’une valeur = valeur × t ÷ 100.
- 'Hausse de t % : × (1 + t/100) ; baisse de t % : × (1 − t/100).'
- Coefficient = nouvelle valeur ÷ ancienne valeur ; taux = (coefficient − 1) × 100.
- Taux positif = hausse ; taux négatif = baisse.
