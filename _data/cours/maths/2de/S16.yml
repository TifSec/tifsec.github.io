titre: 'Séance 16 : Les fonctions du tableur pour les indicateurs'
themes:
- EG4, 1-1 — Organiser et traiter des données statistiques à une variable
problematique: Comment faire calculer moyenne, médiane, quartiles et étendue par le tableur, et contrôler le résultat ?
competences_bo:
- EG4, 1-1 — Organiser et traiter des données statistiques à une variable
objectifs:
    connaissances:
    - =MOYENNE(plage) ; =MEDIANE(plage) ; =MIN(plage) ; =MAX(plage).
    - =QUARTILE(plage;1) et =QUARTILE(plage;3).
    competences:
    - Écrire la bonne formule pour un indicateur.
    - Contrôler un résultat du tableur par un ordre de grandeur.
pourquoi:
- 'Aujourd’hui, trois notions : les fonctions de position, les fonctions de dispersion, contrôler le tableur.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — Les fonctions de position
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: 'Le tableur a des fonctions toutes prêtes : on écrit leur nom et la plage de cellules, il fait le calcul.'
    -   type: paragraphe
        texte: Une plage comme B2:B11 désigne toutes les cellules de B2 à B11.
    -   type: paragraphe
        texte: 'À retenir : =MOYENNE(B2:B11) ; =MEDIANE(B2:B11) ; =MIN(B2:B11) ; =MAX(B2:B11).'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Clique dans une cellule vide.
        - Tape = puis le nom de la fonction.
        - Ouvre la parenthèse, écris la plage (ou sélectionne les cellules), ferme la parenthèse.
        - Valide avec Entrée.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Ce que fait le tableur
    -   type: liste
        elements:
        - =MOYENNE(B2:B11) additionne les 10 cellules et divise par 10, comme toi à la main.
        - =MEDIANE range les valeurs et prend celle du milieu.
    -   type: paragraphe
        texte: 2. Pourquoi la plage est importante
    -   type: liste
        elements:
        - Si tu écris B2:B10, le tableur oublie la cellule B11.
        - Le calcul est juste… mais sur la mauvaise série.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Poids de 10 poulains (kg), dans les cellules B2 à B11 : 42 ; 45 ; 47 ; 48 ; 50 ; 51 ; 53 ; 55 ; 58 ; 61.'
    questions:
    -   id: q01
        type: qcm
        enonce: Série A — Quelle formule donne la moyenne des poids ?
        choix:
        -   id: a
            texte: MOYENNE(B2:B11)
        -   id: b
            texte: =MOYENNE(B2:B11)
        -   id: c
            texte: =MOYENNE(B2:B10)
        aide: Une formule commence par = et la plage va jusqu’à B11.
    -   id: q02
        type: qcm
        enonce: Quelle formule donne la médiane ?
        choix:
        -   id: a
            texte: =MEDIANE(B2:B11)
        -   id: b
            texte: =MILIEU(B2:B11)
        -   id: c
            texte: =MEDIANE(B2;B11)
        aide: 'La plage s’écrit avec « : ».'
    -   id: q03
        type: qcm
        enonce: Quelle formule donne le plus grand poids ?
        choix:
        -   id: a
            texte: =GRAND(B2:B11)
        -   id: b
            texte: =MIN(B2:B11)
        -   id: c
            texte: =MAX(B2:B11)
        aide: 'Le plus grand : maximum.'
    -   id: q04
        type: nombre
        enonce: Combien de cellules contient la plage B2:B11 ?
        aide: De 2 à 11.
    -   id: q05
        type: nombre
        enonce: Série B — Quel résultat affiche =MOYENNE(B2:B11) ?
        unite: kg
        aide: Calcule la moyenne à la main.
    -   id: q06
        type: nombre
        enonce: Quel résultat affiche =MEDIANE(B2:B11) ?
        unite: kg
        aide: Moyenne de la 5e et de la 6e valeur.
    -   id: q07
        type: nombre
        enonce: Quel résultat affiche =MIN(B2:B11) ?
        unite: kg
        aide: La plus petite valeur.
-   id: a02
    titre: Partie 2 — Les fonctions de dispersion
    transition: 'Tu sais faire calculer la position. Deuxième notion : la dispersion.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: 'Pour l’étendue, on combine deux fonctions : MAX − MIN.'
    -   type: paragraphe
        texte: Pour les quartiles, la fonction QUARTILE prend la plage et le numéro du quartile.
    -   type: paragraphe
        texte: 'À retenir : Étendue : =MAX(B2:B11)-MIN(B2:B11). Q1 : =QUARTILE(B2:B11;1). Q3 : =QUARTILE(B2:B11;3).'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - 'Étendue : écris =MAX(plage)-MIN(plage) dans une seule cellule.'
        - 'Q1 : =QUARTILE(plage;1). Q3 : =QUARTILE(plage;3).'
        - 'Écart interquartile : soustrais la cellule de Q1 de celle de Q3.'
        - Le point-virgule sépare la plage et le numéro du quartile.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Une formule peut contenir un calcul
    -   type: liste
        elements:
        - =MAX(B2:B11)-MIN(B2:B11) calcule le max, le min, puis la soustraction.
        - C’est exactement « max − min » écrit pour le tableur.
    -   type: paragraphe
        texte: 2. Pourquoi un numéro dans QUARTILE
    -   type: liste
        elements:
        - La même fonction donne Q1 (1), la médiane (2) ou Q3 (3).
        - Le numéro dit au tableur lequel tu veux.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Même série de 10 poids en B2:B11.
    questions:
    -   id: q01
        type: qcm
        enonce: Série A — Quelle formule donne l’étendue ?
        choix:
        -   id: a
            texte: =MAX(B2:B11)-MIN(B2:B11)
        -   id: b
            texte: =ETENDUE(B2:B11)
        -   id: c
            texte: =MAX(B2:B11)+MIN(B2:B11)
        aide: Étendue = max − min.
    -   id: q02
        type: qcm
        enonce: Quelle formule donne Q1 ?
        choix:
        -   id: a
            texte: =QUARTILE(B2:B11)
        -   id: b
            texte: =QUARTILE(B2:B11;1)
        -   id: c
            texte: =QUARTILE(1)
        aide: Il faut la plage et le numéro.
    -   id: q03
        type: qcm
        enonce: Quelle formule donne Q3 ?
        choix:
        -   id: a
            texte: =QUARTILE(B2:B11;2)
        -   id: b
            texte: =QUARTILE3(B2:B11)
        -   id: c
            texte: =QUARTILE(B2:B11;3)
        aide: Numéro 3.
    -   id: q04
        type: nombre
        enonce: Série B — Quel résultat affiche la formule de l’étendue ?
        unite: kg
        aide: Max − min, à la main.
    -   id: q05
        type: nombre
        enonce: Calcule Q1 à la main (méthode du cours).
        unite: kg
        aide: 10 ÷ 4 = 2,5 → rang 3.
    -   id: q06
        type: nombre
        enonce: Calcule Q3 à la main (méthode du cours).
        unite: kg
        aide: 30 ÷ 4 = 7,5 → rang 8.
    -   id: q07
        type: nombre
        enonce: Écart interquartile (avec tes Q1 et Q3) ?
        unite: kg
        aide: Q3 − Q1.
-   id: a03
    titre: Partie 3 — Contrôler le résultat du tableur
    transition: 'Dernière notion : ne pas croire le tableur les yeux fermés.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Le tableur calcule toujours ce qu’on lui demande, même si la formule est fausse.
    -   type: paragraphe
        texte: Il faut donc contrôler le résultat avec un ordre de grandeur.
    -   type: paragraphe
        texte: 'À retenir : Une moyenne ou une médiane est entre le min et le max ; une étendue est positive ; Q1 ≤ médiane ≤ Q3.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Regarde le min et le max de la série.
        - Vérifie que la moyenne et la médiane sont entre les deux.
        - Vérifie que Q1 ≤ médiane ≤ Q3.
        - Si ce n’est pas le cas, relis la formule et la plage.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi la moyenne est entre min et max
    -   type: liste
        elements:
        - Si on partage le total en parts égales, chaque part ne peut pas dépasser la plus grande valeur.
        - Ni être plus petite que la plus petite.
    -   type: paragraphe
        texte: 2. D’où viennent les erreurs
    -   type: liste
        elements:
        - Une mauvaise plage, une cellule vide, une valeur mal tapée (450 au lieu de 45).
        - Le contrôle repère ces erreurs en quelques secondes.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Poids entre 42 et 61 kg (même série).
    questions:
    -   id: q01
        type: qcm
        enonce: Série A — Le tableur affiche une moyenne de 92 kg. Est-ce possible ?
        choix:
        -   id: a
            texte: Oui
        -   id: b
            texte: Non, la moyenne doit être entre 42 et 61 kg
        aide: Compare avec le min et le max.
    -   id: q02
        type: qcm
        enonce: Le tableur affiche une médiane de 50,5 kg. Est-ce possible ?
        choix:
        -   id: a
            texte: Oui
        -   id: b
            texte: Non
        aide: Est-ce entre 42 et 61 ?
    -   id: q03
        type: qcm
        enonce: Le tableur affiche Q1 = 56 kg et Q3 = 48 kg. Est-ce possible ?
        choix:
        -   id: a
            texte: Oui
        -   id: b
            texte: Non, Q1 doit être plus petit que Q3
        aide: Q1 ≤ Q3.
    -   id: q04
        type: qcm
        enonce: Le tableur affiche une étendue de −19. Que s’est-il passé ?
        choix:
        -   id: a
            texte: La formule fait MIN − MAX au lieu de MAX − MIN
        -   id: b
            texte: Rien, c’est juste
        aide: Une étendue est toujours positive.
    -   id: q05
        type: nombre
        enonce: Série B — Un poids de 45 kg a été tapé 450. De combien la somme a-t-elle augmenté ?
        unite: kg
        aide: 450 − 45.
    -   id: q06
        type: nombre
        enonce: De combien la moyenne des 10 poids a-t-elle augmenté ?
        unite: kg
        aide: Écart de la somme ÷ 10.
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: qcm
        enonce: Formule du plus petit poids en C2:C21 ?
        choix:
        -   id: a
            texte: =PETIT(C2:C21)
        -   id: b
            texte: =MIN(C2:C21)
    -   id: q02
        type: nombre
        enonce: Combien de cellules dans C2:C21 ?
    -   id: q03
        type: qcm
        enonce: Formule de la moyenne en D3:D15 ?
        choix:
        -   id: a
            texte: =MOYENNE(D3:D15)
        -   id: b
            texte: =MOYENNE(D3;D15)
    -   id: q04
        type: qcm
        enonce: Valeurs entre 10 et 20 ; le tableur donne une médiane de 25. Possible ?
        choix:
        -   id: a
            texte: Oui
        -   id: b
            texte: Non
retenir:
- Une formule commence par = ; la plage B2:B11 veut dire « de B2 à B11 ».
- =MOYENNE(B2:B11) ; =MEDIANE(B2:B11) ; =MIN(…) ; =MAX(…).
- '=QUARTILE(B2:B11;1) pour Q1, ;3 pour Q3. Étendue : =MAX(…)−MIN(…).'
- 'Le tableur peut calculer les quartiles autrement qu’à la main : on vérifie l’ordre de grandeur.'
