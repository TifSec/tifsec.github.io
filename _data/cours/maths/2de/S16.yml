titre: 'Séance 16 : Laisser le tableur calculer les indicateurs'
themes:
    - EG4, 1-1 — Organiser et traiter des données statistiques à une variable
problematique: Comment obtenir rapidement les indicateurs d’une grande série avec le tableur ?
competences_bo:
    - EG4, 1-1 — Organiser et traiter des données statistiques à une variable
objectifs:
    connaissances:
        - 'Fonctions : MOYENNE, MEDIANE, MIN, MAX, QUARTILE(plage;1) et QUARTILE(plage;3), NB.'
        - Le tableur traite des centaines de valeurs sans erreur de calcul.
    competences:
        - Utiliser les fonctions statistiques du tableur.
        - Contrôler un résultat.
pourquoi:
    - De S11 à S15, tu as calculé à la main sur de petites séries.
    - 'Le fichier des pesées de l’élevage compte 120 valeurs : le tableur est indispensable.'
activites:
    -   id: a01
        titre: Les fonctions
        consigne: Tu vas calculer avec les fonctions du tableur les indicateurs principaux des 120 pesées de poulains. On attend trois résultats.
        contenu:
            -   type: liste
                elements:
                    - 'Automatisme : calcule 250 − 248,6.'
            -   type: etapes
                elements:
                    - Ouvre le fichier fourni pesees.ods (120 poids de poulains à 6 mois).
                    - 'Calcule : NB, MOYENNE, MEDIANE, MIN, MAX.'
            -   type: paragraphe
                texte: Pourquoi NB d’abord ? On vérifie qu’on a bien les 120 valeurs.
        questions:
            -   id: q01
                type: tableau
                enonce: Écris les résultats.
                colonnes:
                    - Indicateur
                    - Valeur
                lignes:
                    -   - NB
                        - ''
                    -   - MOYENNE (kg, au dixième)
                        - ''
                    -   - MEDIANE (kg)
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: Les quartiles
        transition: Tu as la position. Mesure la dispersion.
        consigne: Tu vas calculer les quartiles et l’écart interquartile des pesées avec le tableur. On attend les valeurs et une formule.
        contenu:
            -   type: etapes
                elements:
                    - Calcule QUARTILE(plage;1) et QUARTILE(plage;3).
                    - Calcule l’écart interquartile.
            -   type: paragraphe
                texte: Pourquoi cette fonction ? Elle évite de ranger 120 valeurs à la main.
        questions:
            -   id: q01
                type: texte
                enonce: Écris Q1, Q3 et l’écart interquartile.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
            -   id: q02
                type: texte
                enonce: Écris la formule de Q1 (valeurs en B2:B121).
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a03
        titre: Contrôler
        transition: Les calculs sont faits. Sont-ils plausibles ?
        consigne: Tu vas contrôler la plausibilité des indicateurs et repérer une valeur suspecte. On attend la valeur et ton action.
        contenu:
            -   type: etapes
                elements:
                    - 'Vérifie l’ordre de grandeur : la moyenne est-elle entre MIN et MAX ?'
                    - Repère une valeur suspecte (erreur de saisie).
            -   type: paragraphe
                texte: Pourquoi contrôler ? Un poids de 2 480 kg tapé à la place de 248 fausse la moyenne.
        questions:
            -   id: q01
                type: texte
                enonce: As-tu trouvé une valeur suspecte ? Que fais-tu ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le tableur peut tracer une boîte à moustaches (selon la version).
        questions:
            -   id: q01
                type: texte
                enonce: Que montre-t-elle ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Le tableur calcule tes indicateurs. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment obtenir rapidement les indicateurs d’une grande série avec le tableur ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - =MOYENNE, =MEDIANE, =QUARTILE(plage;1).
    - Contrôler l’ordre de grandeur.
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
