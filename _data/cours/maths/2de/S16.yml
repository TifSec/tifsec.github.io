titre: 'Séance 16 : Laisser le tableur calculer les indicateurs'
themes:
    - EG4, 1-1 — Organiser et traiter des données statistiques à une variable
problematique: Comment obtenir rapidement les indicateurs d’une grande série avec le tableur ?
competences_bo:
    - EG4, 1-1 — Organiser et traiter des données statistiques à une variable
objectifs:
    connaissances:
        - 'Fonctions : MOYENNE, MEDIANE, MIN, MAX, QUARTILE(plage;1) et QUARTILE(plage;3), NB.'
        - Le tableur traite des centaines de valeurs sans erreur de calcul.
    competences:
        - Utiliser les fonctions statistiques du tableur.
        - Contrôler un résultat.
pourquoi:
    - De S11 à S15, tu as calculé à la main sur de petites séries.
    - 'Le fichier des pesées de l’élevage compte 120 valeurs : le tableur est indispensable.'
activites:
    -   id: a01
        titre: Les fonctions
        consigne: Tu vas calculer avec les fonctions du tableur les indicateurs principaux des 120 pesées de poulains. On attend trois résultats.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: On a 120 pesées de poulains. Calculer la moyenne à la main prendrait longtemps, avec des risques d’erreur.
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Une fonction du tableur est une formule toute prête qui calcule un indicateur sur une plage de cellules (par exemple B2:B121, « de B2 à B121 »).
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Traiter des centaines de valeurs en quelques secondes.
                    - Refaire le calcul automatiquement si une donnée change.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - Dans une cellule vide, on tape = puis le nom de la fonction et la plage entre parenthèses.
                    - =NB(plage) d’abord, pour vérifier le nombre de valeurs.
                    - =MOYENNE, =MEDIANE, =MIN, =MAX donnent les autres indicateurs.
            -   type: paragraphe
                texte: 'À retenir : Une formule commence toujours par = ; la plage s’écrit B2:B121.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Quelle formule pour la valeur maximale des cellules C2 à C50 ?
                    - Quelle formule pour compter les nombres de D2 à D30 ?
            -   type: fichier
                titre: pesées de 120 poulains à 6 mois
                url: /assets/fichiers/maths/2de/pesees.ods
            -   type: liste
                elements:
                    - 'Automatisme : calcule 251 − 250,4.'
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : ouvre le fichier pesees.ods (à télécharger ci-dessus, 120 poids de poulains à 6 mois) et calcule NB, MOYENNE, MEDIANE, MIN, MAX.'
                    - Pourquoi NB d’abord ? On vérifie qu’on a bien les 120 valeurs.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - =MOYENNE(plage) calcule la …… .
                        - ''
                    -   - =NB(plage) compte les cellules qui contiennent un …… .
                        - ''
                aide: 'Le nom de la fonction le dit : MOYENNE calcule… ? Et NB compte les cellules qui contiennent quoi ?'
            -   id: q02
                type: tableau
                enonce: Écris les résultats.
                colonnes:
                    - Indicateur
                    - Valeur
                lignes:
                    -   - NB
                        - ''
                    -   - MOYENNE (kg, au dixième)
                        - ''
                    -   - MEDIANE (kg)
                        - ''
                aide: Tape =NB(…), =MOYENNE(…) et =MEDIANE(…) sur la plage des poids, puis recopie ce qu’affiche le tableur.
    -   id: a02
        titre: Les quartiles
        transition: Tu as la position. Mesure la dispersion.
        consigne: Tu vas calculer les quartiles et l’écart interquartile des pesées avec le tableur. On attend les valeurs et une formule.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Ranger 120 valeurs à la main pour trouver les quartiles serait très long.
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: 'La fonction QUARTILE donne directement Q1 ou Q3 : le 2e nombre indique lequel (1 ou 3).'
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Mesurer la dispersion d’une grande série sans la ranger.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - =QUARTILE(plage;1) donne Q1 ; =QUARTILE(plage;3) donne Q3.
                    - 'Dans une autre cellule : = (cellule de Q3) − (cellule de Q1) donne l’écart interquartile.'
            -   type: paragraphe
                texte: 'À retenir : QUARTILE(plage;1) → Q1 ; QUARTILE(plage;3) → Q3.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Écris la formule de Q3 pour les cellules A2 à A41.
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : calcule Q1, Q3 et l’écart interquartile des 120 poids.'
                    - Pourquoi cette fonction ? Elle évite de ranger 120 valeurs à la main.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - =QUARTILE(plage;1) donne le …… quartile.
                        - ''
                    -   - =QUARTILE(plage;3) donne le …… quartile.
                        - ''
                aide: 'Le deuxième argument de QUARTILE dit quel quartile : 1 donne le… ? 3 donne le… ?'
            -   id: q02
                type: texte
                enonce: Écris Q1, Q3 et l’écart interquartile.
                aide: Utilise QUARTILE avec 1 puis 3, et fais la différence pour l’écart interquartile.
            -   id: q03
                type: texte
                enonce: Écris la formule de Q1 (valeurs en B2:B121).
                aide: La fonction s’écrit avec la plage des poids, un point-virgule, puis le numéro du quartile.
    -   id: a03
        titre: Contrôler
        transition: Les calculs sont faits. Sont-ils plausibles ?
        consigne: Tu vas contrôler la plausibilité des indicateurs et repérer une valeur suspecte. On attend la valeur et ton action.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Le tableur ne se trompe pas dans ses calculs… mais si une donnée est mal tapée, le résultat est faux. Comment le repérer ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Contrôler la plausibilité, c’est vérifier qu’un résultat a un ordre de grandeur réaliste.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Repérer une erreur de saisie avant de prendre une décision.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - On compare MIN et MAX aux valeurs possibles (un poulain de 6 mois pèse environ 200 à 300 kg).
                    - On vérifie que la moyenne est entre MIN et MAX et proche de la médiane.
                    - On cherche la valeur suspecte et on la vérifie auprès de la source.
            -   type: paragraphe
                texte: 'À retenir : Une erreur de saisie fausse surtout la moyenne ; la médiane bouge peu.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - MIN = 1,2 kg pour des chevaux adultes. Que penses-tu ?
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : vérifie que la moyenne est entre MIN et MAX, puis repère la valeur suspecte.'
                    - Pourquoi contrôler ? Un poids de 2 480 kg tapé à la place de 248 fausse la moyenne.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - On vérifie qu’un résultat est …… (ordre de grandeur).
                        - ''
                    -   - Une erreur de saisie fausse surtout la …… .
                        - ''
                aide: Un poids de poulain de 2 000 kg est-il possible ? On vérifie l’ordre de… Et quel indicateur une valeur fausse déplace-t-elle le plus ?
            -   id: q02
                type: texte
                enonce: As-tu trouvé une valeur suspecte ? Que fais-tu ?
                aide: Trie la colonne des poids et regarde le début et la fin de la liste. Si une valeur est impossible, qui peut la corriger ?
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le tableur peut tracer une boîte à moustaches (selon la version).
        questions:
            -   id: q01
                type: texte
                enonce: Que montre-t-elle ?
                aide: La boîte à moustaches dessine la médiane, Q1, Q3, le minimum et le maximum. Qu’est-ce qu’elle permet de voir d’un coup d’œil ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Le tableur calcule tes indicateurs. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment obtenir rapidement les indicateurs d’une grande série avec le tableur ?'
                aide: Cite les fonctions du tableur utilisées et les contrôles à faire sur les résultats.
retenir:
    - =MOYENNE, =MEDIANE, =QUARTILE(plage;1).
    - Contrôler l’ordre de grandeur.
