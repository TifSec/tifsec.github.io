titre: 'Séance 19 : Le poids d’un poulain au fil des mois'
themes:
    - EG4, 1-3 — S’approprier des notions de base sur les fonctions
problematique: Comment représenter une grandeur qui dépend d’une autre ?
competences_bo:
    - EG4, 1-3 — S’approprier des notions de base sur les fonctions
objectifs:
    connaissances:
        - Une fonction associe à chaque valeur de x (l’âge) une seule valeur f(x) (le poids).
        - Tableau de valeurs → points → courbe ; x en abscisse, f(x) en ordonnée.
    competences:
        - Passer d’une situation à un tableau de valeurs et à une courbe.
        - Lire une valeur sur une courbe.
pourquoi:
    - En statistiques, tu as décrit des séries.
    - 'Ici, on étudie comment le poids dépend de l’âge : c’est la notion de fonction.'
activites:
    -   id: a01
        titre: Le tableau de valeurs
        consigne: Tu vas identifier la variable et la grandeur qui en dépend dans les pesées d’un poulain (document 1). On attend x, f(x) et f(3).
        contenu:
            -   type: liste
                elements:
                    - 'Automatisme : place le point (3 ; 175) dans un repère.'
            -   type: tableau
                titre: Document 1 — Pesées d’un poulain (fictives)
                colonnes:
                    - Âge x (mois)
                    - '0'
                    - '1'
                    - '2'
                    - '3'
                    - '4'
                    - '6'
                lignes:
                    -   - Poids f(x) (kg)
                        - '55'
                        - '100'
                        - '140'
                        - '175'
                        - '205'
                        - '260'
            -   type: etapes
                elements:
                    - 'Lis l’exemple : un tableau donne la hauteur d’un poulain selon son âge.'
                    - 'x, c’est ce qui varie librement : l’âge (en mois).'
                    - 'f(x), c’est ce qui dépend de x : la hauteur (en cm).'
                    - 'Si le tableau indique 120 sous l’âge 4, on écrit f(4) = 120 : « l’image de 4 est 120 ».'
                    - 'À toi : lis les pesées (document 1) et identifie x et f(x).'
                    - Pourquoi x et f(x) ? On note ce qui varie (l’âge) et ce qui en dépend (le poids).
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Une fonction associe à chaque x une …… valeur f(x).
                        - ''
                    -   - f(x) se lit « f …… x ».
                        - ''
                aide: À un âge donné, le poulain a-t-il un poids ou plusieurs ? Et f(x), comment le lit-on à voix haute ?
            -   id: q02
                type: tableau
                enonce: Complète.
                colonnes:
                    - Élément
                    - Réponse
                lignes:
                    -   - Variable x
                        - ''
                    -   - f(x)
                        - ''
                    -   - f(3)
                        - ''
                aide: 'La variable est ce qu’on choisit (l’âge) ; f(x) est ce qu’on obtient (le poids). f(3) : cherche la colonne 3 mois dans le tableau.'
    -   id: a02
        titre: La courbe
        transition: Le tableau est prêt. Trace la courbe.
        consigne: Tu vas tracer la courbe du poids du poulain en fonction de l’âge. On attend la description de la courbe.
        contenu:
            -   type: image
                url: /assets/images/graphiques/maths-2de-s19-poulain.svg
                alternative: Courbe du poids f(x) en fonction de l’âge x.
                legende: Courbe du poids f(x) en fonction de l’âge x.
            -   type: titre
                texte: Comment faire ce graphique
            -   type: etapes
                elements:
                    - 'Sur une feuille (papier millimétré si possible), trace un repère orthogonal : deux axes qui se croisent à angle droit (90°). L’unité peut être différente d’un axe à l’autre.'
                    - Sur l’axe des abscisses (axe horizontal, x, qui se lit de gauche à droite), gradue régulièrement l’âge x, de 0 à 6 mois (par exemple 2 cm par mois).
                    - Sur l’axe des ordonnées (axe vertical, y, qui se lit de bas en haut), gradue régulièrement le poids f(x), de 0 à 280 kg (par exemple 1 cm pour 20 kg).
                    - 'Place chaque point (x ; f(x)) du document 1. Attention : il n’y a pas de mesure à 5 mois, laisse la place vide entre 4 et 6.'
                    - Relie les points par une courbe régulière, à main levée.
                    - 'Écris le titre : « Poids d’un poulain selon son âge ».'
            -   type: titre
                texte: Comment le lire
            -   type: liste
                elements:
                    - L’axe horizontal porte le temps, l’axe vertical la grandeur mesurée (avec son unité).
                    - 'Pour lire une valeur : pars de l’axe horizontal, monte jusqu’à la courbe, puis va horizontalement jusqu’à l’axe vertical.'
                    - Une courbe qui monte = la grandeur augmente ; qui descend = elle diminue ; plus la pente est forte, plus le changement est rapide.
            -   type: titre
                texte: Comment le comprendre
            -   type: liste
                elements:
                    - Entre deux mesures, la courbe donne une estimation (lecture graphique).
                    - Prolonger la courbe très loin des mesures (extrapoler) est risqué.
            -   type: etapes
                elements:
                    - 'Lis l’exemple : les points (0 ; 50) et (2 ; 90).'
                    - Le premier point est sur l’axe vertical (x = 0), à la hauteur 50.
                    - 'Le second : on avance de 2 sur l’axe horizontal, on monte à 90.'
                    - 'On relie les points par une courbe régulière, sans angles : le poulain grandit sans sauts.'
                    - 'À toi : place tous les points du document 1 sur papier millimétré, puis relie-les.'
                    - Pourquoi relier ? Le poulain grandit continûment, pas par sauts.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Sur le graphique, x est sur l’axe …… .
                        - ''
                    -   - f(x) est sur l’axe …… .
                        - ''
                aide: Dans un repère, la variable x est sur l’axe horizontal ou vertical ? Et f(x) ?
            -   id: q02
                type: texte
                enonce: 'Décris ta courbe : croissante ou décroissante ? régulière ?'
                aide: 'Suis ta courbe de gauche à droite : monte-t-elle ? Monte-t-elle à la même vitesse partout ?'
    -   id: a03
        titre: Lire la courbe
        transition: La courbe est tracée. Exploite-la.
        consigne: Tu vas lire sur la courbe un poids à 5 mois et l’âge correspondant à 150 kg. On attend les deux lectures.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : quel poids à 0,5 mois ?'
                    - 'Pars de 0,5 sur l’axe horizontal, monte jusqu’à la courbe, puis va horizontalement jusqu’à l’axe vertical : on lit environ 78 kg.'
                    - 'Dans l’autre sens : à quel âge 120 kg ? Pars de 120 sur l’axe vertical, va jusqu’à la courbe, descends sur l’axe horizontal : environ 1,5 mois.'
                    - 'Une lecture graphique est une valeur approchée : on écrit « environ ».'
                    - 'À toi : lis le poids à 5 mois, puis l’âge où le poulain pèse 150 kg.'
                    - Pourquoi lire ? La courbe donne des valeurs entre les mesures.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - On lit une valeur entre deux points grâce à la …… .
                        - ''
                    -   - Prévoir loin des mesures s’appelle …… .
                        - ''
                aide: Pour une valeur entre deux mesures, on s’aide du tracé qui relie les points. Et prévoir loin après les mesures, comment s’appelle-t-on ?
            -   id: q02
                type: nombre
                enonce: Poids estimé à 5 mois ?
                unite: kg
                aide: Pars de 5 mois sur l’axe horizontal, monte jusqu’à la courbe, lis le poids à gauche.
            -   id: q03
                type: nombre
                enonce: À quel âge le poulain pèse-t-il 150 kg environ ?
                unite: mois
                aide: Pars de 150 kg sur l’axe vertical, va jusqu’à la courbe, descends lire l’âge.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Prolonge la courbe jusqu’à 12 mois.
        questions:
            -   id: q01
                type: texte
                enonce: Est-ce fiable ?
                aide: Après la dernière mesure, la croissance continue-t-elle forcément de la même façon ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as découvert la notion de fonction. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment représenter une grandeur qui dépend d’une autre ?'
                aide: Dis ce qu’est une fonction, comment on la représente et comment on lit la courbe.
retenir:
    - 'Fonction : x → f(x).'
    - Tableau → courbe → lecture.
sources:
