titre: 'Séance 19 : Fonctions, tableau de valeurs et courbe'
themes:
- EG4, 1-3 — S’approprier des notions de base sur les fonctions
problematique: Comment décrire une grandeur qui dépend d’une autre, avec un tableau, une formule ou une courbe ?
competences_bo:
- EG4, 1-3 — S’approprier des notions de base sur les fonctions
objectifs:
    connaissances:
    - Une fonction associe à chaque nombre x un seul nombre f(x).
    - 'f(x) se lit « f de x » : c’est l’image de x.'
    competences:
    - Lire un tableau de valeurs.
    - Calculer une image avec une formule.
    - Placer des points et lire une courbe.
pourquoi:
- 'Aujourd’hui, trois notions : la fonction et son tableau de valeurs, la formule, la courbe.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — La fonction et son tableau de valeurs
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Une fonction associe à chaque nombre x (par exemple un âge) un seul nombre f(x) (par exemple un poids).
    -   type: paragraphe
        texte: f(x) s’appelle l’image de x. On écrit f(2) = 130 et on lit « f de 2 égale 130 ».
    -   type: paragraphe
        texte: 'À retenir : Tableau de valeurs : en haut x, en bas l’image f(x).'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Cherche x dans la 1re ligne.
        - 'Descends dans la 2e ligne : c’est f(x).'
        - 'Pour une variation : f(fin) − f(début).'
        - Ne confonds pas x (en haut) et f(x) (en bas).
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi « un seul » nombre
    -   type: liste
        elements:
        - À un âge donné, un poulain n’a qu’un poids.
        - C’est ce qui fait que le poids est une fonction de l’âge.
    -   type: paragraphe
        texte: 2. Pourquoi une notation
    -   type: liste
        elements:
        - f(3) = 165 est plus court que « à 3 mois, le poulain pèse 165 kg ».
        - La lettre f désigne la règle qui transforme l’âge en poids.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Poids d’un poulain (kg) selon son âge x (mois) :'
    -   type: tableau
        colonnes:
        - Âge x (mois)
        - '0'
        - '1'
        - '2'
        - '3'
        - '4'
        - '5'
        - '6'
        lignes:
        -   - Poids f(x) (kg)
            - '50'
            - '90'
            - '130'
            - '165'
            - '195'
            - '220'
            - '240'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Que vaut f(0) ?
        unite: kg
        aide: Colonne x = 0.
    -   id: q02
        type: nombre
        enonce: Que vaut f(3) ?
        unite: kg
        aide: Colonne x = 3.
    -   id: q03
        type: nombre
        enonce: Que vaut f(6) ?
        unite: kg
        aide: Colonne x = 6.
    -   id: q04
        type: nombre
        enonce: Pour quel âge le poids est-il 220 kg ?
        unite: mois
        aide: Cherche 220 dans la 2e ligne, remonte à x.
    -   id: q05
        type: nombre
        enonce: Série B — Prise de poids entre 0 et 1 mois ?
        unite: kg
        aide: f(1) − f(0).
    -   id: q06
        type: nombre
        enonce: Prise de poids entre 3 et 6 mois ?
        unite: kg
        aide: f(6) − f(3).
    -   id: q07
        type: qcm
        enonce: La prise de poids mensuelle…
        choix:
        -   id: a
            texte: augmente avec l’âge
        -   id: b
            texte: diminue avec l’âge
        -   id: c
            texte: est toujours la même
        aide: Calcule les écarts entre deux mois qui se suivent.
-   id: a02
    titre: Partie 2 — Une fonction donnée par une formule
    transition: 'Tu sais lire un tableau. Deuxième notion : calculer les images avec une formule.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Parfois, la fonction est donnée par une formule, par exemple f(x) = 12x + 50.
    -   type: paragraphe
        texte: Pour trouver f(x), on remplace x par le nombre et on calcule.
    -   type: paragraphe
        texte: 'À retenir : f(x) = 12x + 50 : 12x veut dire 12 × x. On fait la multiplication avant l’addition.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Recopie la formule.
        - Remplace x par le nombre (entre parenthèses si besoin).
        - Fais la multiplication, puis l’addition.
        - Écris f(…) = résultat.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Ce que dit la formule
    -   type: liste
        elements:
        - 'Le coût de pension d’un poney : 50 € de frais fixes, plus 12 € par jour.'
        - 'Pour x jours : 12 × x + 50. C’est f(x).'
    -   type: paragraphe
        texte: 2. Pourquoi × avant +
    -   type: liste
        elements:
        - On paie d’abord 12 € par jour (12 × 5 = 60 € pour 5 jours), puis on ajoute les 50 €.
        - 'Faire 12 × (5 + 50) donnerait 660 € : absurde.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Coût de pension d’un poney : f(x) = 12x + 50, en euros, pour x jours.'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Calcule f(1).
        unite: €
        aide: 12 × 1 + 50.
    -   id: q02
        type: nombre
        enonce: Calcule f(10).
        unite: €
        aide: 12 × 10 + 50.
    -   id: q03
        type: nombre
        enonce: Calcule f(0).
        unite: €
        aide: 12 × 0 + 50.
    -   id: q04
        type: nombre
        enonce: Calcule f(30).
        unite: €
        aide: 12 × 30 + 50.
    -   id: q05
        type: nombre
        enonce: Calcule f(7).
        unite: €
        aide: 12 × 7 + 50.
    -   id: q06
        type: nombre
        enonce: 'Série B — Autre fonction : g(x) = 3x − 4. Calcule g(5).'
        aide: 3 × 5 − 4.
    -   id: q07
        type: nombre
        enonce: Avec g(x) = 3x − 4, calcule g(0).
        aide: 3 × 0 − 4.
-   id: a03
    titre: Partie 3 — La courbe
    transition: 'Dernière notion : dessiner la fonction et la lire sur un graphique.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: La courbe d’une fonction est formée de tous les points de coordonnées (x ; f(x)).
    -   type: paragraphe
        texte: On lit x sur l’axe horizontal et f(x) sur l’axe vertical.
    -   type: paragraphe
        texte: 'À retenir : Point de la courbe : (x ; f(x)). Lire f(x) : partir de x en bas, monter jusqu’à la courbe, lire à gauche.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - 'Comment faire ce graphique : pour chaque colonne du tableau, place le point (x ; f(x)), puis relie les points.'
        - 'Comment le lire : pars de x sur l’axe horizontal, monte verticalement jusqu’à la courbe, puis va horizontalement jusqu’à l’axe vertical.'
        - 'Comment le comprendre : si la courbe monte, f(x) augmente quand x augmente.'
        - Entre deux points, la courbe donne une valeur approchée.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi des points (x ; f(x))
    -   type: liste
        elements:
        - 'Chaque colonne du tableau donne un couple : l’âge et le poids.'
        - Le point est placé à l’abscisse x (horizontal) et à l’ordonnée f(x) (vertical).
    -   type: paragraphe
        texte: 2. Pourquoi relier les points
    -   type: liste
        elements:
        - Le poulain grossit aussi entre deux pesées.
        - La courbe permet d’estimer son poids à 2 mois et demi, par exemple.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Courbe du poids du poulain (mêmes données que la partie 1) :'
    -   type: image
        url: /assets/images/graphiques/maths-2de-s19-classique-poulain.svg
        alternative: Courbe du poids du poulain selon l’âge, de 0 à 6 mois.
        legende: Courbe du poids du poulain selon l’âge, de 0 à 6 mois.
    -   type: paragraphe
        texte: 'Comment le lire : l’âge est en bas (mois), le poids à gauche (kg). Chaque carreau vertical vaut 20 kg.'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Quelle est l’ordonnée du point d’abscisse 4 ?
        unite: kg
        aide: Pars de 4 en bas, monte, lis à gauche.
    -   id: q02
        type: qcm
        enonce: Le point (1 ; 90) est-il sur la courbe ?
        choix:
        -   id: a
            texte: Oui
        -   id: b
            texte: Non
        aide: À 1 mois, le poids est-il 90 kg ?
    -   id: q03
        type: qcm
        enonce: Le point (90 ; 1) est-il sur la courbe ?
        choix:
        -   id: a
            texte: Oui
        -   id: b
            texte: Non
        aide: Dans (x ; y), x est l’âge.
    -   id: q04
        type: nombre
        enonce: Estime le poids à 3,5 mois (à 5 kg près).
        unite: kg
        aide: Milieu entre f(3) = 165 et f(4) = 195.
    -   id: q05
        type: qcm
        enonce: Série B — Sur ce graphique, la courbe…
        choix:
        -   id: a
            texte: monte de 0 à 6 mois
        -   id: b
            texte: descend
        -   id: c
            texte: monte puis descend
        aide: Regarde de gauche à droite.
    -   id: q06
        type: qcm
        enonce: Où la courbe monte-t-elle le plus vite ?
        choix:
        -   id: a
            texte: Entre 0 et 2 mois
        -   id: b
            texte: Entre 4 et 6 mois
        aide: Là où elle est la plus raide.
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: Avec f(x) = 12x + 50, calcule f(15).
        unite: €
    -   id: q02
        type: nombre
        enonce: Avec h(x) = 5x + 2, calcule h(4).
    -   id: q03
        type: nombre
        enonce: Avec h(x) = 5x + 2, calcule h(0,5).
    -   id: q04
        type: nombre
        enonce: 'Tableau du poulain : prise de poids entre 1 et 5 mois ?'
        unite: kg
retenir:
- 'Fonction : à chaque x, on associe un seul nombre f(x), son image.'
- 'Tableau de valeurs : 1re ligne x, 2e ligne f(x).'
- 'Formule : on remplace x par le nombre et on calcule (× avant +).'
- 'Courbe : les points (x ; f(x)) ; pour lire f(x), on part de x sur l’axe horizontal.'
