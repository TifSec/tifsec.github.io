titre: 'Séance 19 : Le poids d’un poulain au fil des mois'
themes:
    - EG4, 1-3 — S’approprier des notions de base sur les fonctions
problematique: Comment représenter une grandeur qui dépend d’une autre ?
competences_bo:
    - EG4, 1-3 — S’approprier des notions de base sur les fonctions
objectifs:
    connaissances:
        - Une fonction associe à chaque valeur de x (l’âge) une seule valeur f(x) (le poids).
        - Tableau de valeurs → points → courbe ; x en abscisse, f(x) en ordonnée.
    competences:
        - Passer d’une situation à un tableau de valeurs et à une courbe.
        - Lire une valeur sur une courbe.
pourquoi:
    - En statistiques, tu as décrit des séries.
    - 'Ici, on étudie comment le poids dépend de l’âge : c’est la notion de fonction.'
activites:
    -   id: a01
        titre: Le tableau de valeurs
        consigne: Tu vas identifier la variable et la grandeur qui en dépend dans les pesées d’un poulain (document 1). On attend x, f(x) et f(3).
        contenu:
            -   type: liste
                elements:
                    - 'Automatisme : place le point (3 ; 175) dans un repère.'
            -   type: tableau
                titre: Document 1 — Pesées d’un poulain (fictives)
                colonnes:
                    - Âge x (mois)
                    - '0'
                    - '1'
                    - '2'
                    - '3'
                    - '4'
                    - '6'
                lignes:
                    -   - Poids f(x) (kg)
                        - '55'
                        - '100'
                        - '140'
                        - '175'
                        - '205'
                        - '260'
            -   type: etapes
                elements:
                    - Lis les pesées (document 1).
                    - Identifie la variable x et la grandeur f(x).
            -   type: paragraphe
                texte: Pourquoi x et f(x) ? On note ce qui varie (l’âge) et ce qui en dépend (le poids).
        questions:
            -   id: q01
                type: tableau
                enonce: Complète.
                colonnes:
                    - Élément
                    - Réponse
                lignes:
                    -   - Variable x
                        - ''
                    -   - f(x)
                        - ''
                    -   - f(3)
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: La courbe
        transition: Le tableau est prêt. Trace la courbe.
        consigne: Tu vas tracer la courbe du poids du poulain en fonction de l’âge. On attend la description de la courbe.
        contenu:
            -   type: etapes
                elements:
                    - Trace la courbe (papier millimétré ou tableur, graphique XY).
                    - Relie les points par une courbe régulière.
            -   type: paragraphe
                texte: Pourquoi relier ? Le poulain grandit continûment, pas par sauts.
        questions:
            -   id: q01
                type: texte
                enonce: 'Décris ta courbe : croissante ou décroissante ? régulière ?'
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a03
        titre: Lire la courbe
        transition: La courbe est tracée. Exploite-la.
        consigne: Tu vas lire sur la courbe un poids à 5 mois et l’âge correspondant à 150 kg. On attend les deux lectures.
        contenu:
            -   type: etapes
                elements:
                    - Lis sur la courbe le poids à 5 mois (non mesuré).
                    - Lis à quel âge le poulain atteint 150 kg.
            -   type: paragraphe
                texte: Pourquoi lire ? La courbe donne des valeurs entre les mesures.
        questions:
            -   id: q01
                type: nombre
                enonce: Poids estimé à 5 mois ?
                unite: kg
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: nombre
                enonce: À quel âge le poulain pèse-t-il 150 kg environ ?
                unite: mois
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Prolonge la courbe jusqu’à 12 mois.
        questions:
            -   id: q01
                type: texte
                enonce: Est-ce fiable ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as découvert la notion de fonction. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment représenter une grandeur qui dépend d’une autre ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Fonction : x → f(x).'
    - Tableau → courbe → lecture.
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
