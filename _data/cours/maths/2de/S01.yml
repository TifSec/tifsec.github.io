titre: 'Séance 1 : Priorités, fractions, pourcentages et lecture de graphique'
themes:
- EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment faire un calcul dans le bon ordre, prendre une fraction ou un pourcentage d’une quantité, et lire un graphique ?
competences_bo:
- EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
    - Parenthèses, puis × et ÷, puis + et −.
    - 'a/b d’une quantité : ÷ b puis × a ; t % d’une quantité : × t ÷ 100.'
    - Un diagramme en barres se lit sur l’axe vertical.
    competences:
    - Calculer en respectant les priorités.
    - Prendre une fraction ou un pourcentage d’une quantité.
    - Lire des valeurs et des écarts sur un graphique.
pourquoi:
- 'Aujourd’hui, trois notions : les priorités de calcul, fractions et pourcentages, lire un graphique.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — Les priorités de calcul
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Dans un calcul avec plusieurs opérations, on ne calcule pas forcément de gauche à droite.
    -   type: paragraphe
        texte: 'Il y a un ordre à respecter : les priorités.'
    -   type: paragraphe
        texte: 'À retenir : D’abord les parenthèses, puis × et ÷, enfin + et −.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Calcule ce qu’il y a dans les parenthèses.
        - Fais les multiplications et les divisions.
        - Termine par les additions et les soustractions.
        - Récris le calcul à chaque étape.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Avec une situation
    -   type: liste
        elements:
        - '3 kg de carottes, puis 2 sacs de 5 kg de granulés : 3 + 2 × 5.'
        - Les 2 sacs font 2 × 5 = 10 kg ; ensuite 3 + 10 = 13 kg.
    -   type: paragraphe
        texte: 2. Pourquoi une règle commune
    -   type: liste
        elements:
        - Sans règle, 3 + 2 × 5 pourrait donner 25 ou 13.
        - Avec la règle, tout le monde (et la calculatrice) trouve 13.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Sans calculatrice, puis vérifie avec.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Calcule 4 + 3 × 2.
        aide: La multiplication d’abord.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Calcule 15 − 2 × 5.
        aide: La multiplication d’abord.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Calcule 24 ÷ 4 + 2.
        aide: La division d’abord.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Calcule (4 + 3) × 2.
        aide: Les parenthèses d’abord.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Série B — Calcule 5 × 4 − 3 × 2.
        aide: Les deux multiplications, puis la soustraction.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Calcule 100 − (30 + 20) × 2.
        aide: Parenthèses, puis ×, puis −.
        calcul: true
    -   id: q07
        type: nombre
        enonce: Un cavalier achète 3 bouchons à 4 € et un licol à 15 €. Calcule 3 × 4 + 15.
        unite: €
        aide: × avant +.
        calcul: true
-   id: a02
    titre: Partie 2 — Fractions et pourcentages d’une quantité
    transition: 'Tu sais l’ordre des calculs. Deuxième notion : prendre une partie d’une quantité.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: 'Une fraction a/b d’une quantité, c’est : partager en b parts égales, et en prendre a.'
    -   type: paragraphe
        texte: Un pourcentage t %, c’est t parts sur 100.
    -   type: paragraphe
        texte: 'À retenir : a/b d’une quantité = quantité ÷ b × a. t % d’une quantité = quantité × t ÷ 100.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - 'Fraction : divise par le nombre du bas, puis multiplie par celui du haut.'
        - 'Pourcentage : multiplie par t, puis divise par 100.'
        - 'De tête : 10 % = ÷ 10 ; 50 % = la moitié ; 25 % = le quart.'
        - 'Contrôle : une partie est plus petite que le tout (si a < b ou t < 100).'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. En partageant
    -   type: liste
        elements:
        - '3/4 d’une botte de 20 kg : 4 parts de 20 ÷ 4 = 5 kg ; on en prend 3 : 15 kg.'
    -   type: paragraphe
        texte: 2. Pourquoi « sur 100 »
    -   type: liste
        elements:
        - '20 % de 50 € : on partage 50 € en 100 parts de 0,50 € et on en prend 20 : 10 €.'
        - C’est 50 × 20 ÷ 100 = 10 €.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Calcule 1/2 de 30 kg.
        unite: kg
        aide: 30 ÷ 2.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Calcule 3/4 de 40 kg.
        unite: kg
        aide: 40 ÷ 4 × 3.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Calcule 2/3 de 18 kg.
        unite: kg
        aide: 18 ÷ 3 × 2.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Calcule 10 % de 250 €.
        unite: €
        aide: 250 ÷ 10.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Série B — Calcule 20 % de 45 €.
        unite: €
        aide: 45 × 20 ÷ 100.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Calcule 25 % de 64 €.
        unite: €
        aide: 64 ÷ 4.
        calcul: true
    -   id: q07
        type: nombre
        enonce: Un club a 40 licenciés ; 35 % ont un Galop 3. Combien de licenciés ?
        aide: 40 × 35 ÷ 100.
        calcul: true
-   id: a03
    titre: Partie 3 — Lire un graphique
    transition: 'Dernière notion : lire des valeurs sur un graphique.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: 'Un diagramme en barres représente une valeur par une barre : plus la barre est haute, plus la valeur est grande.'
    -   type: paragraphe
        texte: On lit la valeur sur l’axe vertical, en face du haut de la barre.
    -   type: paragraphe
        texte: 'À retenir : Valeur = hauteur de la barre lue sur l’axe vertical. Écart = grande valeur − petite valeur.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - 'Comment le lire : repère la barre du mois demandé (en bas).'
        - Va du haut de la barre vers la gauche jusqu’à l’axe vertical.
        - Lis la valeur (une graduation = 20 kg).
        - 'Comment le comprendre : compare les hauteurs pour dire quand on consomme le plus.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Comment il est fait
    -   type: liste
        elements:
        - Chaque barre a une hauteur égale au foin consommé ce mois-là.
        - Les graduations régulières permettent de mesurer cette hauteur.
    -   type: paragraphe
        texte: 2. Pourquoi c’est utile
    -   type: liste
        elements:
        - On voit d’un coup d’œil que la consommation augmente en hiver.
        - On peut prévoir les achats de foin.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Foin consommé par l’écurie chaque mois :'
    -   type: image
        url: /assets/images/graphiques/maths-2de-s01-classique-foin.svg
        alternative: 'Diagramme en barres du foin consommé : septembre 120 kg, octobre 160 kg, novembre 220 kg, décembre 260 kg, janvier 240 kg.'
        legende: 'Diagramme en barres du foin consommé : septembre 120 kg, octobre 160 kg, novembre 220 kg, décembre 260 kg, janvier 240 kg.'
    -   type: paragraphe
        texte: 'Comment le lire : le mois est en bas, la quantité de foin à gauche ; chaque graduation vaut 20 kg.'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Foin consommé en octobre ?
        unite: kg
        aide: Hauteur de la barre d’octobre.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Foin consommé en décembre ?
        unite: kg
        aide: Hauteur de la barre de décembre.
        calcul: true
    -   id: q03
        type: qcm
        enonce: Quel mois a la plus grande consommation ?
        choix:
        -   id: a
            texte: Novembre
        -   id: b
            texte: Décembre
        -   id: c
            texte: Janvier
        aide: La plus haute barre.
    -   id: q04
        type: nombre
        enonce: Série B — Écart entre décembre et septembre ?
        unite: kg
        aide: 260 − 120.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Total consommé de septembre à janvier ?
        unite: kg
        aide: Additionne les 5 barres.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Consommation moyenne par mois ?
        unite: kg
        aide: Total ÷ 5.
        calcul: true
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: Calcule 6 + 4 × 5.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Calcule (6 + 4) × 5.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Calcule 3/5 de 25 kg.
        unite: kg
        calcul: true
    -   id: q04
        type: nombre
        enonce: Calcule 30 % de 90 €.
        unite: €
        calcul: true
    -   id: q05
        type: nombre
        enonce: Écart entre décembre et janvier ?
        unite: kg
        calcul: true
retenir:
- 'Ordre : parenthèses, puis × et ÷, puis + et −.'
- a/b d’une quantité = quantité ÷ b × a.
- t % d’une quantité = quantité × t ÷ 100.
- 'Graphique : on lit la hauteur d’une barre sur l’axe vertical ; un écart = grande valeur − petite valeur.'
