titre: 'Séance 1 : Diagnostic : où en suis-je en calcul ?'
themes:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Quels outils de calcul est-ce que je maîtrise déjà pour les situations de l’écurie ?
competences_bo:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
        - 'Priorités de calcul : × et ÷ avant + et − ; les parenthèses d’abord.'
        - 'Fraction, pourcentage, lecture de graphique : outils utilisés tous les jours au travail.'
    competences:
        - Calculer en respectant les priorités.
        - Utiliser fractions et pourcentages simples.
pourquoi:
    - Tu arrives en 2de professionnelle, filière cheval.
    - 'Ce diagnostic montre ce que tu sais déjà : il n’y a pas de piège.'
activites:
    -   id: a01
        titre: Les priorités
        consigne: Tu vas calculer trois expressions en respectant les priorités de calcul, dont une situation d’abreuvement. On attend trois résultats.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Deux palefreniers calculent la quantité d’eau à donner et ne trouvent pas le même résultat. Qui a raison ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Les priorités de calcul sont des règles communes qui disent dans quel ordre faire les opérations d’un calcul.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Trouver tous le même résultat pour un même calcul.
                    - Écrire un problème en une seule ligne et le taper à la calculatrice.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - On fait d’abord les calculs entre parenthèses.
                    - Puis les multiplications et les divisions.
                    - Puis les additions et les soustractions, de gauche à droite.
            -   type: paragraphe
                texte: 'À retenir : Parenthèses, puis × et ÷, puis + et −.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Calcule 10 − 2 × 4.
                    - Calcule (10 − 2) × 4.
                    - 3 chevaux boivent chacun 30 L, et on ajoute 10 L pour le poney. Écris le calcul et résous-le.
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - Pourquoi les priorités ? Sans règle commune, deux personnes trouveraient deux résultats différents.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - On effectue d’abord les …… et les divisions, puis les additions et soustractions.
                        - ''
                    -   - Les calculs entre …… sont faits en premier.
                        - ''
                aide: 'Relis l’exemple résolu : dans 5 + 3 × 6, quelle opération a été faite avant l’addition ? Et quel signe oblige à commencer par l’intérieur ?'
            -   id: q02
                type: nombre
                enonce: Calcule 5 + 3 × 6.
                aide: 'Ne calcule pas de gauche à droite : commence par l’opération prioritaire, puis ajoute 5.'
            -   id: q03
                type: nombre
                enonce: Calcule (5 + 3) × 6.
                aide: 'Ici les parenthèses changent l’ordre : calcule d’abord ce qu’il y a dedans.'
            -   id: q04
                type: nombre
                enonce: Un palefrenier donne 2 seaux de 8 L, puis 3 L de plus. Quel calcul vas-tu poser ? Résous-le.
                unite: L
                aide: Écris d’abord ce que contiennent les 2 seaux (une multiplication), puis ajoute les 3 L. Pose tout en une ligne.
    -   id: a02
        titre: Fractions et pourcentages
        transition: Les priorités sont revues. Passe aux fractions et pourcentages.
        consigne: Tu vas calculer une fraction d’un effectif et une réduction en pourcentage, sur des exemples d’écurie. On attend deux résultats avec leur unité.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Combien de poneys dans l’écurie si un tiers des 24 chevaux sont des poneys ? Combien économise-t-on sur une selle soldée à −20 % ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Prendre une fraction d’une quantité, c’est la partager en parts égales et en prendre quelques-unes. Prendre un pourcentage, c’est prendre une part « sur 100 ».
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Calculer des rations, des parts d’un groupe, des réductions, la TVA.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - 'a/b d’une quantité : on divise la quantité par b, puis on multiplie par a.'
                    - 'a % d’une quantité : quantité × a ÷ 100.'
                    - 'Astuces : 10 % = ÷ 10 ; 50 % = la moitié ; 25 % = le quart.'
            -   type: paragraphe
                texte: 'À retenir : a % de b = b × a ÷ 100 ; 1/4 d’une quantité = quantité ÷ 4.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Calcule 1/4 de 36 chevaux.
                    - Calcule 10 % de 250 €.
                    - Calcule 2/3 de 30 kg.
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'Pourquoi ces outils ? Rations, réductions, TVA : tu les rencontres partout.'
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - a % de b se calcule par b × a ÷ ……
                        - ''
                    -   - 1/4 d’une quantité, c’est cette quantité divisée par ……
                        - ''
                aide: 'Pense à « pour cent » : sur combien est un pourcentage ? Et 1/4, c’est partager en combien de parts ?'
            -   id: q02
                type: nombre
                enonce: 'Une écurie de 24 chevaux : 1/3 sont des poneys. Combien de poneys ?'
                unite: poneys
                aide: '1/3 des chevaux : partage les 24 chevaux en 3 parts égales.'
            -   id: q03
                type: nombre
                enonce: Une selle à 600 € est soldée à −20 %. De combien est la réduction ?
                unite: €
                aide: 'La réduction, c’est 20 % de 600 € : 600 × 20 ÷ 100. On demande la réduction, pas le nouveau prix.'
    -   id: a03
        titre: Lire un graphique
        transition: Tu sais calculer. Sais-tu lire des chiffres sur un graphique ?
        consigne: Tu vas lire les valeurs d’un graphique de consommation de foin (document 1). On attend une valeur lue et le sens d’évolution.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Le gérant a noté le foin consommé chaque mois sur un graphique. Combien a-t-on utilisé en janvier ? Et la consommation baisse-t-elle au printemps ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Un graphique représente une grandeur en fonction d’une autre (ici le foin selon le mois). On y lit des valeurs et des évolutions.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Lire rapidement une information sans tableau.
                    - Voir si une grandeur augmente ou diminue.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - 'On lit les axes : ce qui est en abscisse (horizontal), en ordonnée (vertical), avec les unités.'
                    - 'Pour lire une valeur : on part de l’axe horizontal, on monte jusqu’à la courbe, puis on va horizontalement jusqu’à l’axe vertical.'
                    - 'Une courbe qui monte : la grandeur augmente ; qui descend : elle diminue.'
            -   type: paragraphe
                texte: 'À retenir : On lit une valeur en partant de l’axe horizontal, et on écrit toujours l’unité.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Avec le document 1, combien de foin en mai ?
                    - De combien la consommation a-t-elle baissé entre janvier et juin ?
            -   type: tableau
                titre: Document 1 — Foin consommé (données du graphique, fictives)
                colonnes:
                    - Mois
                    - Janv.
                    - Mars
                    - Mai
                    - Juin
                lignes:
                    -   - Foin (kg)
                        - '1600'
                        - '1300'
                        - '500'
                        - '400'
            -   type: image
                url: /assets/images/graphiques/maths-2de-s01-foin.svg
                alternative: Les valeurs du document 1 représentées par une courbe.
                legende: Les valeurs du document 1 représentées par une courbe.
            -   type: titre
                texte: Comment faire ce graphique
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'Sur une feuille, trace un repère orthogonal : deux axes qui se croisent à angle droit (90°). L’unité peut être différente d’un axe à l’autre (par exemple 1 cm pour un mois sur l’axe horizontal, 1 cm pour 200 kg sur l’axe vertical).'
                    - Sur l’axe des abscisses (axe horizontal, x, qui se lit de gauche à droite), note les mois du tableau.
                    - Sur l’axe des ordonnées (axe vertical, y, qui se lit de bas en haut), note les valeurs de foin en kg du tableau.
                    - Place un point pour chaque mois, à la hauteur de sa valeur, puis relie les points.
                    - 'Le titre du graphique est le titre du tableau : « Foin consommé ».'
            -   type: titre
                texte: Comment le lire
            -   type: liste
                elements:
                    - L’axe horizontal porte le temps, l’axe vertical la grandeur mesurée (avec son unité).
                    - 'Pour lire une valeur : pars de l’axe horizontal, monte jusqu’à la courbe, puis va horizontalement jusqu’à l’axe vertical.'
                    - Une courbe qui monte = la grandeur augmente ; qui descend = elle diminue ; plus la pente est forte, plus le changement est rapide.
            -   type: titre
                texte: Comment le comprendre
            -   type: liste
                elements:
                    - Une courbe qui descend de gauche à droite montre une grandeur qui diminue avec le temps ; si au contraire elle monte, la grandeur augmente avec le temps.
                    - Pour expliquer une variation, on se demande ce qui a changé pendant cette période.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Sur un graphique, on lit une valeur en partant de l’axe …… .
                        - ''
                    -   - On écrit toujours l’…… du résultat lu.
                        - ''
                aide: 'Sur le graphique du document 1, d’où pars-tu pour trouver janvier : de l’axe des mois ou de l’axe des kg ? Et que faut-il écrire après le nombre lu ?'
            -   id: q02
                type: nombre
                enonce: D’après le document 1, combien de kg de foin ont été consommés en janvier ?
                unite: kg
                aide: Pars de « janvier » sur l’axe horizontal, monte jusqu’au point, puis va à gauche lire la valeur en kg.
            -   id: q03
                type: texte
                enonce: D’après le document 1, la consommation augmente-t-elle ou diminue-t-elle de janvier à juin ?
                aide: 'Compare la hauteur des points de janvier et de juin. Pense à ce qui se passe au printemps : où mangent les chevaux ?'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: 'Calcule de tête : 25 % de 480 kg.'
        questions:
            -   id: q01
                type: texte
                enonce: 'Astuce : 25 % = 1/4.'
                aide: '25 % = 1/4 : prendre un quart de 480 kg, c’est diviser 480 par 4 (ou deux fois par 2).'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton diagnostic est fait. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quels outils de calcul maîtrises-tu déjà, et lequel dois-tu travailler ?'
                aide: 'Reprends chaque mission (priorités, fractions et pourcentages, graphique) : où as-tu réussi seul ? où as-tu hésité ?'
retenir:
    - × et ÷ avant + et − ; parenthèses d’abord.
    - a % de b = b × a ÷ 100.
