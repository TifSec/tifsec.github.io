titre: 'Séance 1 : Diagnostic : où en suis-je en calcul ?'
themes:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Quels outils de calcul est-ce que je maîtrise déjà pour les situations de l’écurie ?
competences_bo:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
        - 'Priorités de calcul : × et ÷ avant + et − ; les parenthèses d’abord.'
        - 'Fraction, pourcentage, lecture de graphique : outils utilisés tous les jours au travail.'
    competences:
        - Calculer en respectant les priorités.
        - Utiliser fractions et pourcentages simples.
pourquoi:
    - Tu arrives en 2de professionnelle, filière cheval.
    - 'Ce diagnostic montre ce que tu sais déjà : il n’y a pas de piège.'
activites:
    -   id: a01
        titre: Les priorités
        consigne: Tu vas calculer trois expressions en respectant les priorités de calcul, dont une situation d’abreuvement. On attend trois résultats.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : 3 + 2 × 4 = 3 + 8 = 11 (on fait × d’abord).'
                    - Calcule chaque expression étape par étape.
            -   type: paragraphe
                texte: Pourquoi les priorités ? Sans règle commune, deux personnes trouveraient deux résultats différents.
        questions:
            -   id: q01
                type: nombre
                enonce: Calcule 5 + 3 × 6.
                aide: 'Méthode : 1) écris l’opération avec les nombres de l’énoncé ; 2) calcule (calculatrice autorisée) ; 3) vérifie que le résultat est vraisemblable et que l’unité est la bonne.'
            -   id: q02
                type: nombre
                enonce: Calcule (5 + 3) × 6.
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q03
                type: nombre
                enonce: Un palefrenier donne 2 seaux de 8 L puis 3 L de plus. Calcule 2 × 8 + 3.
                unite: L
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a02
        titre: Fractions et pourcentages
        transition: Les priorités sont revues. Passe aux fractions et pourcentages.
        consigne: Tu vas calculer une fraction d’un effectif et une réduction en pourcentage, sur des exemples d’écurie. On attend deux résultats avec leur unité.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis les exemples : 1/4 de 20 = 20 ÷ 4 = 5 ; 10 % de 50 = 50 × 10 ÷ 100 = 5.'
                    - Calcule.
            -   type: paragraphe
                texte: 'Pourquoi ces outils ? Rations, réductions, TVA : tu les rencontres partout.'
        questions:
            -   id: q01
                type: nombre
                enonce: 'Une écurie de 24 chevaux : 1/3 sont des poneys. Combien de poneys ?'
                unite: poneys
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: nombre
                enonce: Une selle à 600 € est soldée à −20 %. De combien est la réduction ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a03
        titre: Lire un graphique
        transition: Tu sais calculer. Sais-tu lire des chiffres sur un graphique ?
        consigne: Tu vas lire les valeurs d’un graphique de consommation de foin (document 1). On attend une valeur lue et le sens d’évolution.
        contenu:
            -   type: tableau
                titre: Document 1 — Foin consommé (données du graphique, fictives)
                colonnes:
                    - Mois
                    - Janv.
                    - Mars
                    - Mai
                    - Juin
                lignes:
                    -   - Foin (kg)
                        - '1600'
                        - '1300'
                        - '500'
                        - '400'
            -   type: etapes
                elements:
                    - Lis le graphique décrit (document 1).
                    - Réponds.
            -   type: paragraphe
                texte: Pourquoi lire un graphique ? Les fiches techniques et les factures d’énergie en contiennent.
        questions:
            -   id: q01
                type: nombre
                enonce: D’après le document 1, combien de kg de foin ont été consommés en janvier ?
                unite: kg
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: texte
                enonce: D’après le document 1, la consommation augmente-t-elle ou diminue-t-elle de janvier à juin ?
                aide: 'Méthode : 1) repère le document cité dans la question ; 2) relis-le et souligne dans ta tête la phrase ou la ligne qui répond ; 3) écris ta réponse en citant ce que dit le document. Tu peux commencer par : « D’après le document…, … »'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: 'Calcule de tête : 25 % de 480 kg.'
        questions:
            -   id: q01
                type: texte
                enonce: 'Astuce : 25 % = 1/4.'
                aide: 'Méthode : 1) repère le verbe de la question (cite, explique, décris…) ; 2) cherche la réponse dans la mission ; 3) écris une phrase complète qui reprend les mots de la question.'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton diagnostic est fait. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quels outils de calcul maîtrises-tu déjà, et lequel dois-tu travailler ?'
                aide: 'Méthode : 1) recopie le début de la question du problème ; 2) réponds avec les mots de « Ce que je retiens » ; 3) ajoute un exemple vu aujourd’hui. Trois ou quatre phrases suffisent.'
retenir:
    - × et ÷ avant + et − ; parenthèses d’abord.
    - a % de b = b × a ÷ 100.
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
