titre: 'Séance 12 : Regrouper en classes et lire un histogramme'
themes:
- EG4, 1-1 — Organiser et traiter des données statistiques à une variable
problematique: Comment résumer beaucoup de valeurs différentes, et les lire sur un histogramme ?
competences_bo:
- EG4, 1-1 — Organiser et traiter des données statistiques à une variable
objectifs:
    connaissances:
    - Une classe [a ; b[ va de a (compris) à b (non compris).
    - 'Histogramme : rectangles accolés, hauteur = effectif de la classe.'
    competences:
    - Ranger des valeurs dans des classes et compter les effectifs.
    - 'Lire un histogramme : effectifs, classe la plus fréquente, fréquences.'
pourquoi:
- 'Aujourd’hui, deux notions : regrouper en classes, puis lire un histogramme.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — Regrouper en classes
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Quand il y a beaucoup de valeurs différentes, un tableau valeur par valeur devient illisible.
    -   type: paragraphe
        texte: 'On regroupe alors les valeurs dans des intervalles de même largeur : les classes, notées [a ; b[.'
    -   type: paragraphe
        texte: 'À retenir : [a ; b[ contient a mais pas b. Amplitude de la classe = b − a.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Choisis des classes de même amplitude qui couvrent toutes les valeurs (ici de 10 cm, à partir de 100).
        - Prends les valeurs une par une et range chacune dans sa classe.
        - 'Attention aux bornes : 120 va dans [120 ; 130[, pas dans [110 ; 120[.'
        - Compte l’effectif de chaque classe, puis vérifie que le total est bien le nombre de valeurs.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi le crochet tourné vers l’extérieur
    -   type: liste
        elements:
        - Le crochet [120 du côté gauche « attrape » 120 ; le crochet 130[ du côté droit le « laisse dehors ».
        - 'Ainsi chaque valeur va dans une seule classe : 130 n’est compté qu’une fois, dans [130 ; 140[.'
    -   type: paragraphe
        texte: 2. Pourquoi la même amplitude
    -   type: liste
        elements:
        - Avec des classes de même largeur, on peut comparer les effectifs directement.
        - Une classe deux fois plus large attraperait plus de valeurs sans que ce soit « plus fréquent ».
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Tailles au garrot (cm) des 20 poneys du club :'
    -   type: paragraphe
        texte: 108 ; 112 ; 115 ; 117 ; 119 ; 121 ; 122 ; 124 ; 125 ; 126 ; 127 ; 128 ; 131 ; 133 ; 134 ; 136 ; 138 ; 141 ; 143 ; 147.
    questions:
    -   id: q01
        type: qcm
        enonce: Série A — Dans quelle classe va 120 cm ?
        choix:
        -   id: a
            texte: '[110 ; 120['
        -   id: b
            texte: '[120 ; 130['
        -   id: c
            texte: Dans les deux
        aide: Le crochet de droite de [110 ; 120[ laisse 120 dehors.
    -   id: q02
        type: qcm
        enonce: Dans quelle classe va 139,5 cm ?
        choix:
        -   id: a
            texte: '[130 ; 140['
        -   id: b
            texte: '[140 ; 150['
        -   id: c
            texte: Aucune
        aide: 139,5 est plus petit que 140.
    -   id: q03
        type: nombre
        enonce: Quelle est l’amplitude de la classe [120 ; 130[ ?
        unite: cm
        aide: b − a.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Série B — Effectif de la classe [100 ; 110[ ?
        aide: Compte les tailles de 100 à 109.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Effectif de la classe [110 ; 120[ ?
        aide: Compte les tailles de 110 à 119.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Effectif de la classe [120 ; 130[ ?
        aide: Compte les tailles de 120 à 129.
        calcul: true
    -   id: q07
        type: nombre
        enonce: Effectif de la classe [130 ; 140[ ?
        aide: Compte les tailles de 130 à 139.
        calcul: true
    -   id: q08
        type: nombre
        enonce: Effectif de la classe [140 ; 150[ ?
        aide: Compte les tailles de 140 à 149.
        calcul: true
    -   id: q09
        type: nombre
        enonce: 'Série C — Vérifie : quelle est la somme des effectifs des 5 classes ?'
        aide: Additionne tes 5 effectifs.
        calcul: true
    -   id: q10
        type: nombre
        enonce: Quelle est la fréquence de la classe [120 ; 130[, en % ?
        unite: '%'
        aide: Effectif ÷ 20 × 100.
        calcul: true
-   id: a02
    titre: Partie 2 — Lire un histogramme
    transition: 'Tu sais faire les classes. Deuxième notion : les voir sur un graphique.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Un histogramme représente une série regroupée en classes par des rectangles accolés.
    -   type: paragraphe
        texte: La base d’un rectangle est la classe ; sa hauteur est l’effectif de la classe.
    -   type: paragraphe
        texte: 'À retenir : Effectif d’une classe = hauteur de son rectangle. Classe modale = le plus haut rectangle.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Repère sur l’axe horizontal la classe demandée (ses deux bornes).
        - Monte jusqu’au haut du rectangle, puis va à gauche lire la hauteur sur l’axe vertical.
        - 'Pour un total : additionne les hauteurs des rectangles concernés.'
        - 'Pour une fréquence : effectif ÷ effectif total × 100.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Comment le graphique est fait
    -   type: liste
        elements:
        - 'On a tracé un rectangle par classe : de la borne a à la borne b, de hauteur égale à l’effectif.'
        - 'Les rectangles se touchent parce que les classes se suivent sans trou : 45 finit une classe et commence la suivante.'
    -   type: paragraphe
        texte: 2. Comment le comprendre
    -   type: liste
        elements:
        - Plus un rectangle est haut, plus il y a de poulains dans cette classe de poids.
        - 'La forme montre la répartition : ici beaucoup de poulains au milieu, peu aux extrémités.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Poids à la naissance des poulains de l’élevage :'
    -   type: image
        url: /assets/images/graphiques/maths-2de-s12-classique-poulains.svg
        alternative: 'Histogramme du poids des poulains à la naissance : [40 ; 45[ 3, [45 ; 50[ 7, [50 ; 55[ 11, [55 ; 60[ 6, [60 ; 65[ 3.'
        legende: 'Histogramme du poids des poulains à la naissance : [40 ; 45[ 3, [45 ; 50[ 7, [50 ; 55[ 11, [55 ; 60[ 6, [60 ; 65[ 3.'
    -   type: paragraphe
        texte: 'Comment le lire : chaque rectangle correspond à une classe de 5 kg ; on lit sa hauteur sur l’axe de gauche (nombre de poulains).'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Combien de poulains pèsent entre 45 et 50 kg ([45 ; 50[) ?
        aide: Lis la hauteur du 2e rectangle.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Combien de poulains dans la classe [55 ; 60[ ?
        aide: Lis la hauteur du 4e rectangle.
        calcul: true
    -   id: q03
        type: nombre
        enonce: Combien de poulains dans la classe [40 ; 45[ ?
        aide: Lis la hauteur du 1er rectangle.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Quelle est la borne de gauche de la classe modale ?
        unite: kg
        aide: Cherche le plus haut rectangle.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Quelle est l’amplitude des classes ?
        unite: kg
        aide: b − a pour une classe.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Série B — Combien y a-t-il de poulains en tout ?
        aide: Additionne toutes les hauteurs.
        calcul: true
    -   id: q07
        type: nombre
        enonce: Combien de poulains pèsent 55 kg ou plus ?
        aide: Additionne les deux derniers rectangles.
        calcul: true
    -   id: q08
        type: nombre
        enonce: Combien de poulains pèsent moins de 50 kg ?
        aide: Additionne les deux premiers rectangles.
        calcul: true
    -   id: q09
        type: nombre
        enonce: Quelle fréquence de poulains dans la classe modale, en % ? (arrondi à l’unité)
        unite: '%'
        aide: 11 ÷ 30 × 100.
        calcul: true
    -   id: q10
        type: nombre
        enonce: Quelle fréquence de poulains pèse moins de 50 kg, en % ? (arrondi à l’unité)
        unite: '%'
        aide: 10 ÷ 30 × 100.
        calcul: true
-   id: a03
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: qcm
        enonce: Dans quelle classe va 150 cm ?
        choix:
        -   id: a
            texte: '[140 ; 150['
        -   id: b
            texte: '[150 ; 160['
        -   id: c
            texte: Aucune
    -   id: q02
        type: nombre
        enonce: 'Valeurs 52, 57, 61, 63, 68, 69, 70 : effectif de [60 ; 70[ ?'
        calcul: true
    -   id: q03
        type: nombre
        enonce: Fréquence de [130 ; 140[ chez les poneys, en % ?
        unite: '%'
        calcul: true
    -   id: q04
        type: nombre
        enonce: 'Poulains : combien pèsent entre 45 et 60 kg ?'
        calcul: true
    -   id: q05
        type: nombre
        enonce: 'Poulains : fréquence de [60 ; 65[, en % ?'
        unite: '%'
        calcul: true
retenir:
- 'Classe [a ; b[ : a est dedans, b n’est pas dedans (b va dans la classe suivante).'
- Toutes les classes ont la même amplitude (b − a).
- 'Histogramme : la largeur d’un rectangle = la classe ; sa hauteur = l’effectif.'
- 'Classe modale : celle qui a le plus grand effectif (le plus haut rectangle).'
