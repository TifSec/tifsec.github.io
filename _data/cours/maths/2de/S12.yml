titre: 'Séance 12 : Regrouper en classes et tracer un histogramme'
themes:
    - EG4, 1-1 — Organiser et traiter des données statistiques à une variable
problematique: Comment représenter une série de mesures nombreuses ?
competences_bo:
    - EG4, 1-1 — Organiser et traiter des données statistiques à une variable
objectifs:
    connaissances:
        - 'Pour beaucoup de valeurs différentes, on regroupe en classes de même amplitude : [120 ; 130[.'
        - Un histogramme représente les effectifs des classes par des rectangles accolés.
    competences:
        - Regrouper des données en classes.
        - Tracer et lire un histogramme.
pourquoi:
    - En S11, tu as compté des catégories.
    - 'Les tailles exactes (en cm) sont toutes différentes : il faut les regrouper.'
activites:
    -   id: a01
        titre: Les classes
        consigne: Tu vas regrouper les tailles des 20 poneys (document 1) en classes de 10 cm. On attend l’effectif de chaque classe.
        contenu:
            -   type: liste
                elements:
                    - 'Automatisme : dans quelle classe va 130 cm ?'
            -   type: paragraphe
                texte: 'Document 1 — Tailles (cm) : 104, 108, 109, 112, 115, 118, 119, 121, 124, 125, 128, 129, 130, 133, 136, 139, 141, 144, 147, 148.'
            -   type: paragraphe
                texte: Données fictives créées pour l’exercice (ordres de grandeur réalistes).
            -   type: etapes
                elements:
                    - 'Lis l’exemple : des tailles 102, 110, 118, 120 cm et les classes [100 ; 110[, [110 ; 120[, [120 ; 130[.'
                    - '102 est entre 100 et 110 : classe [100 ; 110[.'
                    - '110 n’est pas dans [100 ; 110[ (le crochet est ouvert) : il va dans [110 ; 120[, comme 118.'
                    - 120 va dans [120 ; 130[.
                    - 'Effectifs : 1 ; 2 ; 1.'
                    - 'À toi : range les 20 tailles du document 1 dans les classes, puis compte.'
                    - 'Pourquoi [a ; b[ ? La borne b appartient à la classe suivante : aucune valeur n’est comptée deux fois.'
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - On regroupe les valeurs en …… de même amplitude.
                        - ''
                    -   - Dans [110 ; 120[, la valeur 120 est …… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: tableau
                enonce: Complète.
                colonnes:
                    - Classe (cm)
                    - Effectif
                lignes:
                    -   - '[100 ; 110['
                        - ''
                    -   - '[110 ; 120['
                        - ''
                    -   - '[120 ; 130['
                        - ''
                    -   - '[130 ; 140['
                        - ''
                    -   - '[140 ; 150['
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: L’histogramme
        transition: Les classes sont prêtes. Représente-les.
        consigne: Tu vas tracer l’histogramme des tailles des poneys. On attend la description des axes et la classe la plus haute.
        contenu:
            -   type: image
                url: /assets/images/graphiques/maths-2de-s12-histogramme.svg
                alternative: 'Histogramme des tailles : un rectangle par classe de 10 cm.'
                legende: 'Histogramme des tailles : un rectangle par classe de 10 cm.'
            -   type: titre
                texte: Comment faire ce graphique
            -   type: etapes
                elements:
                    - Trace l’axe horizontal gradué de 100 à 150 cm, l’axe vertical gradué en effectifs.
                    - Pour chaque classe [a ; b[, dessine un rectangle de largeur [a ; b] et de hauteur égale à l’effectif.
                    - Les rectangles sont accolés (pas d’espace).
            -   type: titre
                texte: Comment le lire
            -   type: liste
                elements:
                    - Chaque rectangle correspond à une classe ; sa hauteur est l’effectif.
                    - La classe modale est celle du plus haut rectangle.
            -   type: titre
                texte: Comment le comprendre
            -   type: liste
                elements:
                    - 'La forme de l’histogramme montre comment les tailles sont réparties : regroupées au centre ou étalées.'
            -   type: etapes
                elements:
                    - 'Lis l’exemple : classe [100 ; 110[, effectif 3.'
                    - On dessine un rectangle qui va de 100 à 110 sur l’axe horizontal et monte jusqu’à 3 sur l’axe vertical.
                    - 'Le rectangle suivant commence à 110 : il touche le premier, sans espace.'
                    - 'À toi : trace l’histogramme sur papier : classes en abscisse, effectifs en ordonnée, rectangles accolés.'
                    - Pourquoi accolés ? Les classes se suivent sans trou.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Un histogramme est formé de rectangles …… .
                        - ''
                    -   - La hauteur d’un rectangle représente l’…… de la classe.
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: texte
                enonce: 'Décris ton histogramme : axes, classe la plus haute.'
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a03
        titre: Lire et interpréter
        transition: L’histogramme est tracé. Que dit-il ?
        consigne: Tu vas lire l’histogramme pour répondre à deux questions du club. On attend une fréquence et un effectif.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : sur 20 poneys, 5 mesurent 130 cm ou plus.'
                    - 'Fréquence : 5 ÷ 20 = 0,25, soit 25 %.'
                    - '« 130 cm ou plus » : on additionne toutes les classes à partir de 130.'
                    - 'Rappel : au-delà de 148 cm environ, ce ne sont plus des poneys mais des chevaux.'
                    - 'À toi : calcule la fréquence des poneys de 140 cm et plus, puis compte ceux de moins de 120 cm.'
                    - Pourquoi cette lecture ? Le club adapte ses cours selon la taille des montures.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - La classe qui a le plus grand effectif est la classe …… .
                        - ''
                    -   - On lit une fréquence en divisant l’effectif par l’effectif …… .
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: nombre
                enonce: Quelle fréquence des poneys mesure 140 cm ou plus ?
                unite: '%'
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q03
                type: nombre
                enonce: Combien de poneys mesurent moins de 120 cm ?
                unite: poneys
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Avec des classes de 25 cm, que se passerait-il ?
        questions:
            -   id: q01
                type: texte
                enonce: Avantage et inconvénient ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais représenter une série de mesures. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment représenter une série de mesures nombreuses ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Classes [a ; b[ de même amplitude.
    - 'Histogramme : rectangles accolés.'
