titre: 'Séance 12 : Regrouper en classes et tracer un histogramme'
themes:
    - EG4, 1-1 — Organiser et traiter des données statistiques à une variable
problematique: Comment représenter une série de mesures nombreuses ?
competences_bo:
    - EG4, 1-1 — Organiser et traiter des données statistiques à une variable
objectifs:
    connaissances:
        - 'Pour beaucoup de valeurs différentes, on regroupe en classes de même amplitude : [120 ; 130[.'
        - Un histogramme représente les effectifs des classes par des rectangles accolés.
    competences:
        - Regrouper des données en classes.
        - Tracer et lire un histogramme.
pourquoi:
    - En S11, tu as compté des catégories.
    - 'Les tailles exactes (en cm) sont toutes différentes : il faut les regrouper.'
activites:
    -   id: a01
        titre: Les classes
        consigne: Tu vas regrouper les tailles des 20 poneys (document 1) en classes de 10 cm. On attend l’effectif de chaque classe.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Les 20 poneys ont presque tous des tailles différentes. Un tableau valeur par valeur serait illisible.
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: 'Regrouper en classes, c’est ranger les valeurs dans des intervalles de même amplitude, notés [a ; b[ : de a (compris) à b (non compris).'
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Résumer une série de mesures nombreuses et variées.
                    - Préparer un histogramme.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - On choisit des classes de même amplitude (ici 10 cm) qui couvrent toutes les valeurs.
                    - On range chaque valeur dans sa classe ; une valeur égale à la borne b va dans la classe suivante.
                    - On compte l’effectif de chaque classe et on vérifie le total.
            -   type: paragraphe
                texte: 'À retenir : Dans [a ; b[, a est compris, b est exclu.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - 'Dans quelle classe va 120 cm : [110 ; 120[ ou [120 ; 130[ ?'
                    - Range 101, 109, 110, 117, 123 dans des classes de 10 cm à partir de 100.
            -   type: liste
                elements:
                    - 'Automatisme : dans quelle classe va 130 cm ?'
            -   type: paragraphe
                texte: 'Document 1 — Tailles (cm) : 104, 108, 109, 112, 115, 118, 119, 121, 124, 125, 128, 129, 130, 133, 136, 139, 141, 144, 147, 148.'
            -   type: paragraphe
                texte: Données fictives créées pour l’exercice (ordres de grandeur réalistes).
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : range les 20 tailles du document 1 dans les classes, puis compte.'
                    - 'Pourquoi [a ; b[ ? La borne b appartient à la classe suivante : aucune valeur n’est comptée deux fois.'
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - On regroupe les valeurs en …… de même amplitude.
                        - ''
                    -   - Dans [110 ; 120[, la valeur 120 est …… .
                        - ''
                aide: 'Les classes ont toutes la même largeur. Et dans [110 ; 120[, le crochet est tourné vers l’extérieur côté 120 : 120 est-il dedans ?'
            -   id: q02
                type: tableau
                enonce: Complète.
                colonnes:
                    - Classe (cm)
                    - Effectif
                lignes:
                    -   - '[100 ; 110['
                        - ''
                    -   - '[110 ; 120['
                        - ''
                    -   - '[120 ; 130['
                        - ''
                    -   - '[130 ; 140['
                        - ''
                    -   - '[140 ; 150['
                        - ''
                aide: Range chaque taille de la liste dans sa classe. Une taille pile sur la borne de droite va dans la classe suivante.
    -   id: a02
        titre: L’histogramme
        transition: Les classes sont prêtes. Représente-les.
        consigne: Tu vas tracer l’histogramme des tailles des poneys. On attend la description des axes et la classe la plus haute.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Le club veut afficher la répartition des tailles de ses poneys sur un graphique clair.
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: 'Un histogramme représente une série regroupée en classes par des rectangles accolés : la base est la classe, la hauteur l’effectif.'
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Voir d’un coup d’œil comment les valeurs sont réparties.
                    - Repérer la classe la plus fréquente (classe modale).
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - 'Axe horizontal : les classes, gradué régulièrement ; axe vertical : les effectifs.'
                    - Pour chaque classe, un rectangle de la largeur de la classe et de la hauteur de son effectif.
                    - Les rectangles se touchent, sans espace, car les classes se suivent.
            -   type: paragraphe
                texte: 'À retenir : Histogramme : rectangles accolés, hauteur = effectif.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Une classe [130 ; 140[ a un effectif de 6. Décris son rectangle.
            -   type: image
                url: /assets/images/graphiques/maths-2de-s12-histogramme.svg
                alternative: 'Histogramme des tailles : un rectangle par classe de 10 cm.'
                legende: 'Histogramme des tailles : un rectangle par classe de 10 cm.'
            -   type: titre
                texte: Comment faire ce graphique
            -   type: etapes
                elements:
                    - Trace l’axe horizontal gradué de 100 à 150 cm, l’axe vertical gradué en effectifs.
                    - Pour chaque classe [a ; b[, dessine un rectangle de largeur [a ; b] et de hauteur égale à l’effectif.
                    - Les rectangles sont accolés (pas d’espace).
            -   type: titre
                texte: Comment le lire
            -   type: liste
                elements:
                    - Chaque rectangle correspond à une classe ; sa hauteur est l’effectif.
                    - La classe modale est celle du plus haut rectangle.
            -   type: titre
                texte: Comment le comprendre
            -   type: liste
                elements:
                    - 'La forme de l’histogramme montre comment les tailles sont réparties : regroupées au centre ou étalées.'
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : trace l’histogramme sur papier : classes en abscisse, effectifs en ordonnée, rectangles accolés.'
                    - Pourquoi accolés ? Les classes se suivent sans trou.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Un histogramme est formé de rectangles …… .
                        - ''
                    -   - La hauteur d’un rectangle représente l’…… de la classe.
                        - ''
                aide: Dans un histogramme, les rectangles se touchent-ils ? Et que représente leur hauteur ?
            -   id: q02
                type: texte
                enonce: 'Décris ton histogramme : axes, classe la plus haute.'
                aide: Décris l’axe horizontal (classes de tailles), l’axe vertical (effectifs) et la classe qui a le rectangle le plus haut.
    -   id: a03
        titre: Lire et interpréter
        transition: L’histogramme est tracé. Que dit-il ?
        consigne: Tu vas lire l’histogramme pour répondre à deux questions du club. On attend une fréquence et un effectif.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Le club veut savoir quelle part des poneys mesure 140 cm ou plus, et combien mesurent moins de 120 cm.
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Lire un histogramme, c’est retrouver les effectifs des classes et les additionner ou les comparer pour répondre à une question.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Adapter les cours selon la taille des montures.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - On repère les classes concernées par la question (« 140 ou plus », « moins de 120 »).
                    - On additionne leurs effectifs.
                    - Pour une fréquence, on divise par l’effectif total.
            -   type: paragraphe
                texte: 'À retenir : Fréquence = effectif ÷ effectif total ; classe modale = la plus haute.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Combien de poneys mesurent entre 120 et 140 cm (exclu) ?
                    - Quelle fréquence cela représente-t-il ?
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : calcule la fréquence des poneys de 140 cm et plus, puis compte ceux de moins de 120 cm.'
                    - Pourquoi cette lecture ? Le club adapte ses cours selon la taille des montures.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - La classe qui a le plus grand effectif est la classe …… .
                        - ''
                    -   - On lit une fréquence en divisant l’effectif par l’effectif …… .
                        - ''
                aide: La classe la plus fréquente a un nom particulier (comme le mode). Et une fréquence se calcule par rapport à quel effectif ?
            -   id: q02
                type: nombre
                enonce: Quelle fréquence des poneys mesure 140 cm ou plus ?
                unite: '%'
                aide: Prends l’effectif de la classe [140 ; 150[ et divise par l’effectif total.
            -   id: q03
                type: nombre
                enonce: Combien de poneys mesurent moins de 120 cm ?
                unite: poneys
                aide: Additionne les effectifs des classes qui sont entièrement sous 120 cm.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Avec des classes de 25 cm, que se passerait-il ?
        questions:
            -   id: q01
                type: texte
                enonce: Avantage et inconvénient ?
                aide: Avec des classes plus larges, il y a moins de rectangles. Le graphique devient-il plus simple ? Que perd-on comme détail ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais représenter une série de mesures. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment représenter une série de mesures nombreuses ?'
                aide: Dis comment faire les classes, tracer l’histogramme et le lire.
retenir:
    - Classes [a ; b[ de même amplitude.
    - 'Histogramme : rectangles accolés.'
