titre: 'Renforcement 2 : Le tableau de la ration'
themes:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment savoir si un tableau de ration est proportionnel, et comment le compléter ?
competences_bo:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
        - 'Un tableau est de proportionnalité si les quotients (2e ligne ÷ 1re ligne) sont tous égaux : c’est le coefficient.'
        - On multiplie par le coefficient pour aller de la 1re ligne à la 2e ; on divise pour revenir.
        - Le produit en croix permet de trouver une valeur qui manque.
    competences:
        - Reconnaître un tableau de proportionnalité.
        - Trouver le coefficient et compléter un tableau dans les deux sens.
        - Calculer une valeur manquante avec le produit en croix.
pourquoi:
    - En S03 et S04, tu as vu la proportionnalité. Cette heure la reprend, du plus simple au plus difficile.
    - 'Eau, granulés, vermifuge, prix des sacs : à l’écurie, beaucoup de quantités sont proportionnelles… mais pas toutes !'
activites:
    -   id: a01
        titre: Automatismes
        consigne: Tu vas faire 5 calculs de tête, sans calculatrice. On attend 5 résultats.
        contenu:
            -   type: paragraphe
                texte: 'Range ta calculatrice : ces calculs se font de tête. Prends ton temps, la vitesse viendra avec l’entraînement.'
        questions:
            -   id: q01
                type: nombre
                enonce: 'Calcule de tête : 4 × 25.'
                aide: Quatre fois 25 €, combien d’euros ?
            -   id: q02
                type: nombre
                enonce: 'Calcule de tête : 600 ÷ 3.'
                aide: 6 ÷ 3 = 2, donc 600 ÷ 3 = …
            -   id: q03
                type: nombre
                enonce: 'Calcule de tête : 10 × 1,5.'
                aide: 'Multiplier par 10 : la virgule se décale d’un rang vers la droite.'
            -   id: q04
                type: nombre
                enonce: 'Calcule de tête : 48 ÷ 6.'
                aide: Dans la table de 6, quel nombre donne 48 ?
    -   id: a02
        titre: Est-ce proportionnel ?
        consigne: Tu vas tester deux tableaux de l’écurie pour savoir s’ils sont de proportionnalité. On attend les points clés et deux réponses.
        contenu:
            -   type: tableau
                titre: Document 1 — Eau bue par jour (données fictives)
                colonnes:
                    - Nombre de chevaux
                    - '2'
                    - '4'
                    - '6'
                lignes:
                    -   - Eau (L)
                        - '70'
                        - '140'
                        - '210'
            -   type: tableau
                titre: Document 2 — Poids d’un poulain (données fictives)
                colonnes:
                    - Âge (mois)
                    - '2'
                    - '4'
                    - '6'
                lignes:
                    -   - Poids (kg)
                        - '120'
                        - '200'
                        - '260'
            -   type: etapes
                elements:
                    - 'Lis l’exemple : 2 bottes de foin coûtent 70 € livraison comprise ; 4 bottes coûtent 90 €.'
                    - 'On calcule les quotients (prix ÷ nombre de bottes) : 70 ÷ 2 = 35 et 90 ÷ 4 = 22,5.'
                    - 'Les quotients ne sont pas égaux : ce n’est pas proportionnel (à cause de la livraison).'
                    - 'Contre-exemple : un cheval de 400 kg mange 8 kg de foin, un cheval de 500 kg en mange 10 kg. 8 ÷ 400 = 0,02 et 10 ÷ 500 = 0,02 : c’est proportionnel.'
                    - 'À toi : calcule les quotients des documents 1 et 2.'
                    - Pourquoi vérifier ? Si ce n’est pas proportionnel, les méthodes de la suite donnent un résultat faux.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - 'Pour tester un tableau, on calcule les …… : 2e ligne ÷ 1re ligne.'
                        - ''
                    -   - Si les quotients sont tous ……, le tableau est de proportionnalité.
                        - ''
                aide: 'Relis l’exemple : quelle opération a-t-on faite avec 70 et 2 ? Qu’a-t-on comparé ensuite ?'
            -   id: q02
                type: qcm
                enonce: 'Palier 1 : le document 1 (eau bue) est-il un tableau de proportionnalité ?'
                choix:
                    -   id: a
                        texte: Oui, le coefficient est 35.
                    -   id: b
                        texte: Non, les quotients sont différents.
                    -   id: c
                        texte: On ne peut pas savoir.
                aide: Calcule 70 ÷ 2, 140 ÷ 4 et 210 ÷ 6. Trouves-tu toujours le même nombre ?
            -   id: q03
                type: qcm
                enonce: 'Palier 2 : le document 2 (poids du poulain) est-il un tableau de proportionnalité ?'
                choix:
                    -   id: a
                        texte: Oui, le coefficient est 60.
                    -   id: b
                        texte: Non, les quotients sont différents.
                    -   id: c
                        texte: On ne peut pas savoir.
                aide: Calcule 120 ÷ 2, 200 ÷ 4 et 260 ÷ 6 (arrondis si besoin). Trouves-tu toujours le même nombre ?
    -   id: a03
        titre: Trouver le coefficient et compléter
        transition: Le tableau est proportionnel ? Alors un seul nombre suffit pour le compléter.
        consigne: Tu vas trouver le coefficient du tableau des granulés et le compléter dans les deux sens. On attend trois résultats.
        contenu:
            -   type: tableau
                titre: Document 3 — Granulés distribués par jour (données fictives)
                colonnes:
                    - Nombre de chevaux
                    - '2'
                    - '5'
                    - '7'
                    - '?'
                lignes:
                    -   - Granulés (kg)
                        - '6'
                        - '15'
                        - '?'
                        - '36'
            -   type: etapes
                elements:
                    - 'Lis l’exemple : coefficient 0,02 entre le poids du cheval et le foin (vu dans la mission 1).'
                    - 'Pour aller de la 1re ligne à la 2e, on multiplie : un cheval de 600 kg mange 600 × 0,02 = 12 kg de foin.'
                    - 'Pour revenir de la 2e ligne à la 1re, on divise : 14 kg de foin correspondent à un cheval de 14 ÷ 0,02 = 700 kg.'
                    - 'À toi : trouve le coefficient du document 3, puis les deux cases « ? ».'
                    - Pourquoi deux sens ? Parfois on connaît le nombre de chevaux, parfois la quantité de granulés disponible.
        questions:
            -   id: q01
                type: nombre
                enonce: 'Palier 1 : quel est le coefficient du document 3 ?'
                aide: 'Divise la 2e ligne par la 1re : 6 ÷ 2, puis 15 ÷ 5.'
            -   id: q02
                type: nombre
                enonce: 'Palier 2 : combien de kg de granulés faut-il pour 7 chevaux ? Quel calcul vas-tu poser ? Résous-le.'
                unite: kg
                aide: Multiplie le nombre de chevaux par le coefficient.
            -   id: q03
                type: nombre
                enonce: 'Palier 3 : avec 36 kg de granulés par jour, combien de chevaux peut-on nourrir ? Quel calcul vas-tu poser ? Résous-le.'
                aide: 'On revient de la 2e ligne à la 1re : on divise par le coefficient.'
    -   id: a04
        titre: Le produit en croix
        transition: Le coefficient n’est pas toujours facile à trouver. Le produit en croix marche à tous les coups.
        consigne: Tu vas utiliser le produit en croix pour un prix de sacs, puis pour des doses de vermifuge. On attend trois résultats avec leur unité.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : 4 sacs de granulés coûtent 60 €. Combien coûtent 7 sacs ?'
                    - 'On range les nombres dans un tableau : 4 sacs → 60 € ; 7 sacs → ? €.'
                    - 'Produit en croix : on multiplie les deux nombres en diagonale, puis on divise par le 3e. 7 × 60 ÷ 4.'
                    - 7 × 60 = 420
                    - 420 ÷ 4 = 105. Donc 7 sacs coûtent 105 €.
                    - 'À toi : calcule le prix de 3 sacs, puis les doses de vermifuge.'
                    - Pourquoi le produit en croix ? Il marche même quand le coefficient n’est pas un nombre simple.
        questions:
            -   id: q01
                type: nombre
                enonce: 'Palier 1 : 5 sacs de granulés coûtent 90 €. Combien coûtent 3 sacs ? Quel calcul vas-tu poser ? Résous-le.'
                unite: €
                aide: 'Range les nombres : 5 sacs → 90 € ; 3 sacs → ? €. Puis calcule 3 × 90 ÷ 5.'
            -   id: q02
                type: nombre
                enonce: 'Palier 2 : la dose de vermifuge est de 30 mL pour un cheval de 500 kg. Quelle dose pour un cheval de 400 kg ? Quel calcul vas-tu poser ? Résous-le.'
                unite: mL
                aide: 'Range les nombres : 500 kg → 30 mL ; 400 kg → ? mL. Multiplie en diagonale, puis divise par le 3e nombre.'
            -   id: q03
                type: nombre
                enonce: 'Palier 3 : avec le même vermifuge, quelle dose pour une jument de 450 kg ?'
                unite: mL
                aide: 'Même méthode : 450 × 30 ÷ 500.'
    -   id: a05
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un cheval de 500 kg mange chaque jour du foin à hauteur de 2 % de son poids. Le foin coûte 0,15 € le kg.
        questions:
            -   id: q01
                type: texte
                enonce: Combien coûte le foin de ce cheval pour 30 jours ? Explique tes calculs.
                aide: 2 % de 500 kg, c’est 500 × 0,02. Calcule ensuite pour 30 jours, puis le prix.
    -   id: a06
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tes missions sont faites. Il reste à répondre au problème de départ et à faire ton bilan.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment sais-tu si un tableau de ration est proportionnel, et comment le complètes-tu ? Écris aussi une chose que tu sais faire maintenant et une chose à retravailler.'
                aide: Cite les quotients égaux pour tester, puis le coefficient ou le produit en croix pour compléter. Donne un exemple de la séance.
retenir:
    - 'Proportionnel si les quotients (2e ligne ÷ 1re ligne) sont tous égaux : c’est le coefficient.'
    - '1re ligne → 2e ligne : × coefficient ; 2e ligne → 1re ligne : ÷ coefficient.'
    - 'Produit en croix : on multiplie en diagonale, puis on divise par le 3e nombre.'
