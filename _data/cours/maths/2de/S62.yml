titre: 'Renforcement 2 : Le tableau de proportionnalité'
themes:
- EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment savoir si un tableau est proportionnel, et le compléter ?
competences_bo:
- EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
    - 'Proportionnel : tous les quotients 2e ligne ÷ 1re ligne sont égaux (le coefficient).'
    - 'Produit en croix : on multiplie en diagonale, puis on divise par le 3e nombre.'
    competences:
    - Reconnaître un tableau de proportionnalité.
    - Trouver le coefficient et compléter.
    - Utiliser le produit en croix.
pourquoi:
- 'Aujourd’hui, trois notions : reconnaître la proportionnalité, utiliser le coefficient, utiliser le produit en croix.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — Est-ce proportionnel ?
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Deux grandeurs sont proportionnelles quand on passe de l’une à l’autre en multipliant toujours par le même nombre.
    -   type: paragraphe
        texte: Ce nombre s’appelle le coefficient de proportionnalité.
    -   type: paragraphe
        texte: 'À retenir : Proportionnel si 2e ligne ÷ 1re ligne donne le même résultat dans toutes les colonnes.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Pour chaque colonne, divise le nombre du bas par celui du haut.
        - Compare les résultats.
        - 'Tous égaux : proportionnel. Un seul différent : pas proportionnel.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Avec une situation
    -   type: liste
        elements:
        - 1 sac coûte 15 €, 2 sacs 30 €, 4 sacs 60 €.
        - 'Chaque sac ajoute le même prix : le prix est toujours 15 fois le nombre de sacs.'
    -   type: paragraphe
        texte: 2. Un contre-exemple
    -   type: liste
        elements:
        - 'Une pension : 50 € de frais + 12 € par jour. 1 jour : 62 € ; 2 jours : 74 €.'
        - '62 ÷ 1 = 62 et 74 ÷ 2 = 37 : pas le même quotient, pas proportionnel (à cause des frais fixes).'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée.
    questions:
    -   id: q01
        type: nombre
        enonce: 'Série A — Sacs : 1 → 15 € ; 3 → 45 €. Quotient de la 1re colonne ?'
        aide: 15 ÷ 1.
        calcul: true
    -   id: q02
        type: nombre
        enonce: Quotient de la 2e colonne ?
        aide: 45 ÷ 3.
        calcul: true
    -   id: q03
        type: qcm
        enonce: Ce tableau est-il proportionnel ?
        choix:
        -   id: a
            texte: Oui
        -   id: b
            texte: Non
        aide: Les deux quotients sont-ils égaux ?
    -   id: q04
        type: qcm
        enonce: 'Tableau : 2 → 10 ; 5 → 20. Proportionnel ?'
        choix:
        -   id: a
            texte: Oui
        -   id: b
            texte: Non
        aide: 10 ÷ 2 et 20 ÷ 5.
    -   id: q05
        type: qcm
        enonce: 'Tableau : 4 → 6 ; 10 → 15 ; 20 → 30. Proportionnel ?'
        choix:
        -   id: a
            texte: Oui
        -   id: b
            texte: Non
        aide: Calcule les trois quotients.
    -   id: q06
        type: qcm
        enonce: 'Série B — Âge d’un cheval (ans) : 2 → taille 150 cm ; 4 → 160 cm. Proportionnel ?'
        choix:
        -   id: a
            texte: Oui
        -   id: b
            texte: Non
        aide: 150 ÷ 2 et 160 ÷ 4.
    -   id: q07
        type: nombre
        enonce: Dans le tableau 4 → 6 ; 10 → 15 ; 20 → 30, quel est le coefficient ?
        aide: 6 ÷ 4.
        calcul: true
-   id: a02
    titre: Partie 2 — Compléter avec le coefficient
    transition: 'Tu sais reconnaître un tableau proportionnel. Deuxième notion : le compléter.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Dans un tableau proportionnel, le coefficient permet de passer d’une ligne à l’autre.
    -   type: paragraphe
        texte: On multiplie pour descendre, on divise pour monter.
    -   type: paragraphe
        texte: 'À retenir : Ligne du bas = ligne du haut × coefficient. Ligne du haut = ligne du bas ÷ coefficient.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Trouve le coefficient avec une colonne complète (bas ÷ haut).
        - 'Case vide en bas : multiplie le haut par le coefficient.'
        - 'Case vide en haut : divise le bas par le coefficient.'
        - 'Contrôle : refais la division.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi multiplier
    -   type: liste
        elements:
        - Le coefficient dit « combien pour 1 ».
        - À 2,5 kg de granulés par cheval, 6 chevaux mangent 6 × 2,5 = 15 kg.
    -   type: paragraphe
        texte: 2. Pourquoi diviser dans l’autre sens
    -   type: liste
        elements:
        - Si 20 kg nourrissent des chevaux à 2,5 kg chacun, il y a 20 ÷ 2,5 = 8 chevaux.
        - Diviser défait la multiplication.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: 'Ration de granulés : 2 chevaux → 5 kg. Coefficient : 2,5 kg par cheval.'
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — 4 chevaux → combien de kg ?
        unite: kg
        aide: 4 × 2,5.
        calcul: true
    -   id: q02
        type: nombre
        enonce: 10 chevaux → combien de kg ?
        unite: kg
        aide: 10 × 2,5.
        calcul: true
    -   id: q03
        type: nombre
        enonce: 7 chevaux → combien de kg ?
        unite: kg
        aide: 7 × 2,5.
        calcul: true
    -   id: q04
        type: nombre
        enonce: Combien de chevaux pour 30 kg ?
        aide: 30 ÷ 2,5.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Série B — Tableau 3 → 12 ; 5 → ? Complète.
        aide: Coefficient 12 ÷ 3 = 4.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Tableau 4 → 10 ; ? → 25. Complète.
        aide: Coefficient 10 ÷ 4 = 2,5 ; 25 ÷ 2,5.
        calcul: true
    -   id: q07
        type: nombre
        enonce: Tableau 8 → 6 ; 12 → ? Complète.
        aide: Coefficient 6 ÷ 8 = 0,75.
        calcul: true
-   id: a03
    titre: Partie 3 — Le produit en croix
    transition: 'Dernière notion : une méthode qui marche même quand le coefficient n’est pas simple.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Le produit en croix permet de trouver une case manquante dans un tableau proportionnel à 4 cases.
    -   type: paragraphe
        texte: On n’a pas besoin de calculer le coefficient.
    -   type: paragraphe
        texte: 'À retenir : Tableau a → b ; c → ? : ? = b × c ÷ a (on multiplie en diagonale, on divise par le 3e nombre).'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Repère la case vide et le nombre en diagonale de la case vide.
        - Multiplie les deux nombres de l’autre diagonale.
        - Divise par le nombre en diagonale de la case vide.
        - 'Contrôle : les quotients doivent être égaux.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Avec le coefficient
    -   type: liste
        elements:
        - Coefficient = b ÷ a. Donc ? = c × (b ÷ a).
        - 'C’est la même chose que b × c ÷ a : on a juste changé l’ordre des calculs.'
    -   type: paragraphe
        texte: 2. Pourquoi c’est pratique
    -   type: liste
        elements:
        - Quand b ÷ a ne tombe pas juste (7 ÷ 3), le coefficient est difficile à écrire.
        - Avec le produit en croix, on ne divise qu’une fois, à la fin.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — 5 kg de foin pour 400 kg de cheval ; combien pour 480 kg ?
        unite: kg
        aide: 5 × 480 ÷ 400.
        calcul: true
    -   id: q02
        type: nombre
        enonce: 3 sacs pour 42 € ; combien pour 7 sacs ?
        unite: €
        aide: 42 × 7 ÷ 3.
        calcul: true
    -   id: q03
        type: nombre
        enonce: 2 doses pour 250 kg ; combien pour 625 kg ?
        unite: doses
        aide: 2 × 625 ÷ 250.
        calcul: true
    -   id: q04
        type: nombre
        enonce: 6 L pour 15 chevaux ; combien pour 25 chevaux ?
        unite: L
        aide: 6 × 25 ÷ 15.
        calcul: true
    -   id: q05
        type: nombre
        enonce: Série B — 9 m de clôture coûtent 63 € ; combien pour 14 m ?
        unite: €
        aide: 63 × 14 ÷ 9.
        calcul: true
    -   id: q06
        type: nombre
        enonce: Pour 12 € on a 8 kg ; combien de kg pour 21 € ?
        unite: kg
        aide: 8 × 21 ÷ 12.
        calcul: true
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: qcm
        enonce: Tableau 3 → 9 ; 7 → 21. Proportionnel ?
        choix:
        -   id: a
            texte: Oui
        -   id: b
            texte: Non
    -   id: q02
        type: nombre
        enonce: Tableau 5 → 8 ; 15 → ? Complète.
        calcul: true
    -   id: q03
        type: nombre
        enonce: 4 kg pour 360 kg de cheval ; combien pour 450 kg ?
        unite: kg
        calcul: true
    -   id: q04
        type: nombre
        enonce: Coefficient du tableau 8 → 2 ; 20 → 5 ?
        calcul: true
retenir:
- 'Proportionnel si tous les quotients (2e ligne ÷ 1re ligne) sont égaux : c’est le coefficient.'
- '1re ligne → 2e ligne : × coefficient ; 2e → 1re : ÷ coefficient.'
- 'Produit en croix : a/b = c/? → ? = b × c ÷ a.'
