titre: 'Renforcement 2 : Une demi-ration, trois quarts de seau'
themes:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment calculer une fraction d’une ration ou d’un seau ?
competences_bo:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
        - Dans 3/4, le 4 dit en combien de parts on partage, le 3 combien de parts on prend.
        - 1/2 = 0,5 ; 1/4 = 0,25 ; 3/4 = 0,75.
    competences:
        - Calculer une fraction d’une quantité.
        - Passer d’une fraction simple à un nombre décimal.
pourquoi:
    - En S01, tu as calculé 1/4 de 20 et 1/3 de 24. Cette heure reprend les fractions pas à pas.
    - 'On parle souvent en fractions à l’écurie : une demi-ration pour un poney, un seau rempli aux trois quarts.'
activites:
    -   id: a01
        titre: Automatismes
        consigne: Tu vas faire 5 calculs de tête, sans calculatrice. On attend 5 résultats.
        contenu:
            -   type: paragraphe
                texte: 'Range ta calculatrice : ces calculs se font de tête. Prends ton temps, la vitesse viendra avec l’entraînement.'
        questions:
            -   id: q01
                type: nombre
                enonce: 'Calcule de tête : la moitié de 18.'
                aide: La moitié, c’est diviser par 2.
            -   id: q02
                type: nombre
                enonce: 'Calcule de tête : le double de 35.'
                aide: Le double de 30, plus le double de 5.
            -   id: q03
                type: nombre
                enonce: 'Calcule de tête : 100 ÷ 4.'
                aide: Combien de pièces de 25 centimes dans 1 € ?
            -   id: q04
                type: nombre
                enonce: 'Calcule de tête : 60 ÷ 3.'
                aide: 6 ÷ 3 = 2, donc 60 ÷ 3 = …
            -   id: q05
                type: nombre
                enonce: 'Calcule de tête : 0,5 × 30.'
                aide: × 0,5, c’est prendre la moitié.
    -   id: a02
        titre: Prendre une fraction d’une quantité
        consigne: Tu vas calculer une fraction d’une ration de granulés, puis d’un seau d’eau. On attend deux résultats avec leur unité.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : calcule 3/4 de 12 kg.'
                    - 'Le 4 (en bas) : on partage 12 kg en 4 parts égales. 12 ÷ 4 = 3 kg.'
                    - 'Le 3 (en haut) : on prend 3 parts. 3 × 3 = 9 kg.'
                    - Donc 3/4 de 12 kg = 9 kg.
                    - 'À toi : calcule 2/3 de 30 kg de granulés, puis les 3/4 d’un seau de 12 L.'
                    - Pourquoi diviser d’abord ? On cherche la taille d’une part, puis on prend le bon nombre de parts.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Dans 3/4, le 4 dit en combien de …… on partage.
                        - ''
                    -   - Dans 3/4, le 3 dit combien de parts on …… .
                        - ''
                aide: 'Relis l’exemple : par quoi a-t-on divisé 12 kg ? Combien de parts a-t-on gardées ensuite ?'
            -   id: q02
                type: nombre
                enonce: 'Palier 1 : calcule 2/3 de 30 kg de granulés.'
                unite: kg
                aide: Partage 30 kg en 3 parts égales, puis prends 2 parts.
            -   id: q03
                type: nombre
                enonce: 'Palier 2 : un seau contient 12 L quand il est plein. Il est rempli aux 3/4. Combien de litres contient-il ? Quel calcul vas-tu poser ? Résous-le.'
                unite: L
                aide: 'C’est le même calcul que l’exemple, avec des litres : 12 ÷ 4, puis × 3.'
    -   id: a03
        titre: Fraction ou nombre décimal ?
        transition: Tu sais prendre une fraction. Voyons comment la calculatrice l’écrit.
        consigne: Tu vas écrire trois fractions en nombres décimaux, puis calculer la ration d’un poulain. On attend un tableau complété et un résultat.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : une fraction est une division. 1/2 = 1 ÷ 2 = 0,5.'
                    - De même, 1/4 = 1 ÷ 4 = 0,25 et 3/4 = 3 ÷ 4 = 0,75.
                    - Donc 3/4 de 20 kg = 0,75 × 20 = 15 kg. C’est le même résultat que 20 ÷ 4 × 3.
                    - 'À toi : complète le tableau, puis calcule la ration du poulain.'
                    - Pourquoi le nombre décimal ? Les étiquettes et la calculatrice écrivent souvent 0,5 ou 0,75 au lieu de 1/2 ou 3/4.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Palier 1 : écris chaque fraction en nombre décimal.'
                colonnes:
                    - Fraction
                    - Nombre décimal
                lignes:
                    -   - 1/2
                        - ''
                    -   - 1/4
                        - ''
                    -   - 3/4
                        - ''
                aide: 'Une fraction est une division : le nombre du haut divisé par le nombre du bas. Tu peux vérifier à la calculatrice.'
            -   id: q02
                type: nombre
                enonce: 'Palier 3 : une jument mange 9 kg de foin par jour. Son poulain reçoit 1/3 de cette ration. Combien de kg de foin le poulain mange-t-il en une semaine (7 jours) ? Quel calcul vas-tu poser ? Résous-le.'
                unite: kg
                aide: Cherche d’abord la ration du poulain pour 1 jour (1/3 de 9 kg), puis multiplie par 7.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une botte de foin pèse 20 kg.
        questions:
            -   id: q01
                type: texte
                enonce: 'Qu’est-ce qui est le plus lourd : 2/5 de la botte ou 0,3 de la botte ? Explique.'
                aide: 'Calcule les deux : 20 ÷ 5 × 2, et 0,3 × 20. Compare.'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tes missions sont faites. Il reste à répondre au problème de départ et à faire ton bilan.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment calcules-tu les 3/4 d’un seau de 12 L ? Écris aussi une chose que tu sais faire maintenant et une chose à retravailler.'
                aide: 'Explique avec tes mots : on partage en combien de parts, puis on en prend combien ? Pense aussi à l’écriture 0,75.'
retenir:
    - 'a/b d’une quantité : diviser par b, puis multiplier par a.'
    - 1/2 = 0,5 ; 1/4 = 0,25 ; 3/4 = 0,75.
