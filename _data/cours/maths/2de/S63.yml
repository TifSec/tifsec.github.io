titre: 'Renforcement 3 : Pourcentages, remises et hausses'
themes:
- EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment calculer un pourcentage de tête ou à la calculatrice, et trouver un prix soldé ?
competences_bo:
- EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
    - '10 % : ÷ 10 ; 5 % : la moitié de 10 % ; 20 % : le double ; 25 % : ÷ 4 ; 50 % : ÷ 2.'
    - t % d’une quantité = quantité × t ÷ 100.
    competences:
    - Calculer un pourcentage de tête.
    - Calculer n’importe quel pourcentage à la calculatrice.
    - Calculer un prix après une remise ou une hausse ; retrouver le pourcentage.
pourquoi:
- 'Aujourd’hui, trois notions : les pourcentages de tête, à la calculatrice, puis les remises et hausses.'
- 'Pour chacune : la notion, la méthode, pourquoi ça marche, un exemple au tableau, puis beaucoup d’exercices.'
activites:
-   id: a01
    titre: Partie 1 — Un pourcentage de tête
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: 'Un pourcentage est une part sur 100 : 10 %, c’est 10 sur 100, donc un dixième.'
    -   type: paragraphe
        texte: Quelques pourcentages se calculent très vite de tête.
    -   type: paragraphe
        texte: 'À retenir : 10 % : ÷ 10. 5 % : la moitié de 10 %. 20 % : le double de 10 %. 25 % : ÷ 4. 50 % : ÷ 2.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Cherche d’abord 10 % (divise par 10).
        - 'Pour 5 % : prends la moitié de 10 %.'
        - 'Pour 20 % ou 30 % : 2 ou 3 fois 10 %.'
        - 'Pour 25 % : divise par 4 ; pour 50 % : divise par 2.'
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi 10 % = ÷ 10
    -   type: liste
        elements:
        - '10 sur 100, c’est 1 sur 10 : un dixième.'
        - Prendre un dixième, c’est diviser par 10.
    -   type: paragraphe
        texte: 2. Pourquoi 25 % = ÷ 4
    -   type: liste
        elements:
        - '25 sur 100, c’est 1 sur 4 : un quart.'
        - '4 × 25 = 100 : il y a 4 fois 25 % dans 100 %.'
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Sans calculatrice.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — 10 % de 80 € ?
        unite: €
        aide: 80 ÷ 10.
    -   id: q02
        type: nombre
        enonce: 5 % de 80 € ?
        unite: €
        aide: La moitié de 10 %.
    -   id: q03
        type: nombre
        enonce: 20 % de 45 € ?
        unite: €
        aide: 10 % = 4,50, doublé.
    -   id: q04
        type: nombre
        enonce: 25 % de 120 € ?
        unite: €
        aide: 120 ÷ 4.
    -   id: q05
        type: nombre
        enonce: 50 % de 86 € ?
        unite: €
        aide: 86 ÷ 2.
    -   id: q06
        type: nombre
        enonce: Série B — 30 % de 70 € ?
        unite: €
        aide: 3 fois 10 %.
    -   id: q07
        type: nombre
        enonce: 15 % de 200 € ?
        unite: €
        aide: 10 % + 5 %.
-   id: a02
    titre: Partie 2 — N’importe quel pourcentage à la calculatrice
    transition: 'Tu sais faire les pourcentages simples de tête. Deuxième notion : tous les autres.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Pour un pourcentage qui ne se fait pas de tête (12 %, 7 %…), on utilise la calculatrice.
    -   type: paragraphe
        texte: 'La règle marche aussi pour 10 % ou 25 % : elle sert de vérification.'
    -   type: paragraphe
        texte: 'À retenir : t % d’une quantité = quantité × t ÷ 100.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Tape la quantité.
        - Multiplie par le pourcentage t.
        - Divise par 100.
        - Contrôle avec un ordre de grandeur (10 % de la quantité).
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Avec « sur 100 »
    -   type: liste
        elements:
        - '12 % de 250 : on partage 250 en 100 parts (2,5 chacune), on en prend 12.'
        - 12 × 2,5 = 30. C’est 250 × 12 ÷ 100.
    -   type: paragraphe
        texte: 2. Le contrôle
    -   type: liste
        elements:
        - '10 % de 250 = 25. 12 %, c’est un peu plus : 30 est vraisemblable.'
        - Si on trouve 300, on a oublié de diviser par 100.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — 12 % de 350 € ?
        unite: €
        aide: 350 × 12 ÷ 100.
    -   id: q02
        type: nombre
        enonce: 7 % de 600 € ?
        unite: €
        aide: 600 × 7 ÷ 100.
    -   id: q03
        type: nombre
        enonce: 35 % de 80 € ?
        unite: €
        aide: 80 × 35 ÷ 100.
    -   id: q04
        type: nombre
        enonce: 8 % de 1 250 € ?
        unite: €
        aide: 1 250 × 8 ÷ 100.
    -   id: q05
        type: nombre
        enonce: Série B — 3 % de 450 € ?
        unite: €
        aide: 450 × 3 ÷ 100.
    -   id: q06
        type: nombre
        enonce: 65 % de 40 élèves ?
        unite: élèves
        aide: 40 × 65 ÷ 100.
    -   id: q07
        type: qcm
        enonce: Un élève trouve 12 % de 350 = 4 200. Que s’est-il passé ?
        choix:
        -   id: a
            texte: Il a oublié de diviser par 100
        -   id: b
            texte: C’est juste
        aide: '10 % de 350 = 35 : 4 200 est-il vraisemblable ?'
-   id: a03
    titre: Partie 3 — Remises, hausses et pourcentage retrouvé
    transition: 'Dernière notion : calculer un prix soldé, et retrouver le pourcentage d’une remise.'
    consigne: 'Lis la notion et la méthode. On fait l’exemple ensemble au tableau. Ensuite, fais les exercices dans l’ordre : ils sont de plus en plus difficiles.'
    contenu:
    -   type: titre
        texte: La notion
    -   type: paragraphe
        texte: Une remise fait baisser le prix ; une hausse le fait monter.
    -   type: paragraphe
        texte: On peut aussi retrouver le pourcentage d’une remise à partir des prix.
    -   type: paragraphe
        texte: 'À retenir : Prix soldé = prix − remise. Nouveau prix = prix + hausse. % de remise = remise ÷ prix de départ × 100.'
    -   type: titre
        texte: Comment ça fonctionne
    -   type: etapes
        elements:
        - Calcule le montant de la remise (ou de la hausse).
        - Enlève-le (ou ajoute-le) au prix de départ.
        - 'Pour retrouver le % : remise = prix de départ − prix soldé, puis ÷ prix de départ × 100.'
        - On divise toujours par le prix de départ.
    -   type: titre
        texte: Pourquoi ça marche
    -   type: paragraphe
        texte: 1. Pourquoi deux étapes
    -   type: liste
        elements:
        - La remise est une somme d’argent (8 €), le prix soldé est ce qui reste à payer.
        - On calcule d’abord ce qu’on enlève, puis ce qui reste.
    -   type: paragraphe
        texte: 2. Pourquoi diviser par le prix de départ
    -   type: liste
        elements:
        - « 20 % de remise » veut dire 20 % du prix de départ.
        - Pour retrouver le %, on compare donc la remise au prix de départ.
    -   type: titre
        texte: Exemple fait ensemble en classe
    -   type: paragraphe
        texte: Ton professeur fait l’exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
    -   type: titre
        texte: Exercices
    -   type: paragraphe
        texte: Calculatrice autorisée.
    questions:
    -   id: q01
        type: nombre
        enonce: Série A — Une selle à 600 € est soldée −10 %. Prix soldé ?
        unite: €
        aide: 'Remise : 60 €.'
    -   id: q02
        type: nombre
        enonce: Un licol à 30 € est soldé −20 %. Prix soldé ?
        unite: €
        aide: 'Remise : 6 €.'
    -   id: q03
        type: nombre
        enonce: Une pension à 300 € augmente de 5 %. Nouveau prix ?
        unite: €
        aide: 'Hausse : 15 €.'
    -   id: q04
        type: nombre
        enonce: Série B — Un filet passe de 50 € à 40 €. Montant de la remise ?
        unite: €
        aide: 50 − 40.
    -   id: q05
        type: nombre
        enonce: Pourcentage de cette remise ?
        unite: '%'
        aide: 10 ÷ 50 × 100.
    -   id: q06
        type: nombre
        enonce: Une couverture passe de 80 € à 60 €. Pourcentage de remise ?
        unite: '%'
        aide: Remise 20 € ; 20 ÷ 80 × 100.
-   id: a04
    titre: Encore des exercices (si tu as fini)
    defi: true
    facultatif: true
    contenu:
    -   type: paragraphe
        texte: Tu as fini ? Entraîne-toi encore. Ces exercices ne comptent pas dans la note.
    questions:
    -   id: q01
        type: nombre
        enonce: 10 % de 95 € ?
        unite: €
    -   id: q02
        type: nombre
        enonce: 25 % de 64 € ?
        unite: €
    -   id: q03
        type: nombre
        enonce: 6 % de 250 € ?
        unite: €
    -   id: q04
        type: nombre
        enonce: Un casque à 120 € soldé −25 %. Prix soldé ?
        unite: €
    -   id: q05
        type: nombre
        enonce: Un prix passe de 200 € à 170 €. Pourcentage de remise ?
        unite: '%'
retenir:
- '10 % : ÷ 10 ; 5 % : la moitié de 10 % ; 20 % : le double de 10 % ; 25 % : ÷ 4 ; 50 % : ÷ 2.'
- t % d’une quantité = quantité × t ÷ 100.
- Prix soldé = prix − remise ; nouveau prix = prix + hausse.
- Pourcentage de remise = remise ÷ prix de départ × 100.
