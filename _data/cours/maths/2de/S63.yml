titre: 'Renforcement 3 : Soldes à la sellerie'
themes:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment calculer et vérifier une remise ou une hausse, de tête ou à la calculatrice ?
competences_bo:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
        - 10 %, c’est diviser par 10 ; 5 %, la moitié de 10 % ; 20 %, le double de 10 %.
        - t % d’une quantité = quantité × t ÷ 100.
        - Prix soldé = prix − remise ; nouveau prix = prix + hausse.
        - Pourcentage de remise = remise ÷ prix de départ × 100.
    competences:
        - Calculer un pourcentage simple de tête, et n’importe quel pourcentage à la calculatrice.
        - Calculer un prix après une remise ou une hausse.
        - Retrouver le pourcentage d’une remise.
pourquoi:
    - En S05 et S06, tu as calculé des hausses et la TVA. Cette heure reprend les pourcentages, du calcul de tête au calcul inverse.
    - En sellerie ou pour la pension, savoir vérifier un prix évite de payer trop cher.
activites:
    -   id: a01
        titre: Automatismes
        consigne: Tu vas faire 5 calculs de tête, sans calculatrice. On attend 5 résultats.
        contenu:
            -   type: paragraphe
                texte: 'Range ta calculatrice : ces calculs se font de tête. Prends ton temps, la vitesse viendra avec l’entraînement.'
        questions:
            -   id: q01
                type: nombre
                enonce: 'Calcule de tête : 10 % de 230.'
                aide: Divise 230 par 10.
            -   id: q02
                type: nombre
                enonce: 'Calcule de tête : 50 % de 84.'
                aide: 50 %, c’est la moitié.
            -   id: q03
                type: nombre
                enonce: 'Calcule de tête : 25 % de 40.'
                aide: '25 %, c’est un quart : divise par 4.'
            -   id: q04
                type: nombre
                enonce: 'Calcule de tête : 1 % de 300.'
                aide: 1 %, c’est diviser par 100.
    -   id: a02
        titre: Un pourcentage de tête
        consigne: Tu vas calculer 5 % et 20 % d’un prix de 120 € sans calculatrice. On attend les points clés et un tableau complété.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: À la sellerie, une étiquette annonce −5 % ou −20 %. Combien économise-t-on, sans calculatrice ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Calculer un pourcentage de tête, c’est partir de 10 % (facile) pour en déduire les autres.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Vérifier une remise en magasin.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - '10 % : on divise par 10.'
                    - '5 % : la moitié de 10 % ; 20 % : le double de 10 %.'
                    - '25 % : le quart ; 50 % : la moitié.'
            -   type: paragraphe
                texte: 'À retenir : 10 % = ÷ 10 ; 5 % = moitié de 10 % ; 20 % = double de 10 %.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - 5 % de 80 € ?
                    - 20 % de 45 € ?
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : fais la même chose avec un prix de 120 €.'
                    - Pourquoi partir de 10 % ? C’est le plus facile à calculer de tête, et les autres s’en déduisent.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Pour prendre 10 % d’un prix, on le divise par …… .
                        - ''
                    -   - 5 %, c’est la …… de 10 %.
                        - ''
                aide: 'Relis l’exemple du licol : 80 € est devenu 8 €, on a divisé par combien ? Et de 8 € à 4 €, qu’a-t-on fait ?'
            -   id: q02
                type: tableau
                enonce: 'Palier 1 : calcule de tête pour un prix de 120 €.'
                colonnes:
                    - Pourcentage
                    - Montant (€)
                lignes:
                    -   - 5 % de 120 €
                        - ''
                    -   - 20 % de 120 €
                        - ''
                aide: Commence par 10 % (120 ÷ 10). Puis prends la moitié pour 5 % et le double pour 20 %.
    -   id: a03
        titre: N’importe quel pourcentage à la calculatrice
        transition: '15 %, 8 %, 12 % : ceux-là ne se font pas facilement de tête. La calculatrice va t’aider.'
        consigne: Tu vas calculer des pourcentages avec la formule × t ÷ 100. On attend deux montants en euros.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: 'Le maréchal accorde 8 % de remise. 8 %, ce n’est pas facile de tête : comment faire ?'
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Prendre t % d’une quantité, c’est la multiplier par t puis diviser par 100.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Calculer n’importe quel pourcentage à la calculatrice.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - On tape quantité × t ÷ 100.
                    - On vérifie l’ordre de grandeur de tête (avec 10 %).
            -   type: paragraphe
                texte: 'À retenir : t % d’une quantité = quantité × t ÷ 100.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - 15 % de 80 € ?
                    - 12 % de 250 € ?
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : calcule les deux pourcentages demandés.'
                    - Pourquoi cette formule ? Elle marche pour tous les pourcentages, même ceux qu’on ne sait pas calculer de tête.
        questions:
            -   id: q01
                type: nombre
                enonce: 'Palier 2 : calcule 15 % de 340 €.'
                unite: €
                aide: 'Pose 340 × 15 ÷ 100. Vérifie : 10 % = 34 et 5 % = 17.'
            -   id: q02
                type: nombre
                enonce: 'Palier 3 : le maréchal-ferrant facture 85 €. La MFR obtient 8 % de remise. Quel est le montant de la remise ? Quel calcul vas-tu poser ? Résous-le.'
                unite: €
                aide: Pose 85 × 8 ÷ 100.
    -   id: a04
        titre: Le prix après une remise ou une hausse
        transition: Tu sais calculer un pourcentage. Calcule maintenant le prix à payer.
        consigne: Tu vas calculer deux prix soldés et une pension augmentée, en deux étapes. On attend trois prix en euros.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Une selle à 900 € est soldée −20 %. La pension de 350 € augmente de 6 %. Que paie-t-on ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: 'Le prix après une remise (ou une hausse) se calcule en deux étapes : le montant de la remise, puis le nouveau prix.'
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Connaître le prix réellement payé.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - 'Étape 1 : on calcule la remise (ou la hausse) en euros.'
                    - 'Étape 2 : on l’enlève (ou on l’ajoute) au prix de départ.'
            -   type: paragraphe
                texte: 'À retenir : Prix soldé = prix − remise ; nouveau prix = prix + hausse.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Un bonnet à 30 € soldé −20 %. Prix soldé ?
                    - Une licence de 40 € augmente de 5 %. Nouveau prix ?
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : calcule les prix demandés.'
                    - Pourquoi deux étapes ? On sait d’abord combien on enlève ou on ajoute, puis on trouve le prix à payer.
        questions:
            -   id: q01
                type: nombre
                enonce: 'Palier 1 : un tapis à 60 € est soldé à −10 %. Quel est son prix soldé ?'
                unite: €
                aide: 'Étape 1 : 10 % de 60 €. Étape 2 : enlève-le au prix de départ.'
            -   id: q02
                type: nombre
                enonce: 'Palier 2 : une selle coûte 900 €. Pendant les soldes, elle est à −20 %. Quel calcul vas-tu poser ? Quel est le prix soldé ?'
                unite: €
                aide: 20 %, c’est le double de 10 %. Calcule la remise, puis enlève-la.
            -   id: q03
                type: nombre
                enonce: 'Palier 3 : la pension de 350 € par mois augmente de 6 %. Quel est le nouveau prix ?'
                unite: €
                aide: 'C’est une hausse : calcule 350 × 6 ÷ 100, puis ajoute-le.'
    -   id: a05
        titre: Retrouver le pourcentage
        transition: 'Dernier défi de calcul : le magasin affiche deux prix, mais pas le pourcentage. Retrouve-le.'
        consigne: Tu vas retrouver le pourcentage d’une remise à partir du prix de départ et du prix soldé. On attend un pourcentage.
        contenu:
            -   type: titre
                texte: La situation
            -   type: paragraphe
                texte: Une bombe anti-mouches passe de 20 € à 17 €. Quel est le pourcentage de remise ?
            -   type: titre
                texte: Ce que c’est
            -   type: paragraphe
                texte: Retrouver le pourcentage, c’est comparer la remise au prix de départ.
            -   type: titre
                texte: À quoi ça sert
            -   type: liste
                elements:
                    - Vérifier une promotion annoncée.
            -   type: titre
                texte: Comment ça marche
            -   type: etapes
                elements:
                    - 'On calcule la remise en euros : prix de départ − prix soldé.'
                    - On divise par le prix de départ, puis on multiplie par 100.
            -   type: paragraphe
                texte: 'À retenir : Pourcentage de remise = remise ÷ prix de départ × 100.'
            -   type: titre
                texte: Exemple fait ensemble en classe
            -   type: paragraphe
                texte: Ton professeur résout un exemple au tableau avec toi. Recopie-le dans ton cahier ou sur ta fiche papier.
            -   type: titre
                texte: Exercices d’entraînement (cherche, puis on corrige ensemble)
            -   type: etapes
                elements:
                    - Une bride passe de 80 € à 68 €. Pourcentage de remise ?
                    - Une couverture passe de 75 € à 60 €. Pourcentage ?
            -   type: titre
                texte: Ta mission
            -   type: etapes
                elements:
                    - 'À toi : retrouve le pourcentage de remise de la bombe anti-mouches.'
                    - Pourquoi diviser par le prix de départ ? Le pourcentage compare la remise au prix d’avant les soldes.
        questions:
            -   id: q01
                type: nombre
                enonce: 'Palier 3 : une bombe anti-mouches passe de 20 € à 17 €. Quel est le pourcentage de remise ? Quel calcul vas-tu poser ? Résous-le.'
                unite: '%'
                aide: Calcule d’abord la remise en euros, puis remise ÷ 20 × 100.
    -   id: a06
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un magasin annonce −20 %, puis une remise de −10 % en plus sur le prix soldé.
        questions:
            -   id: q01
                type: texte
                enonce: Est-ce la même chose que −30 % ? Teste avec un article à 100 €, puis donne le vrai pourcentage de remise.
                aide: Calcule d’abord le prix après −20 %, puis enlève 10 % de ce nouveau prix. Compare avec 100 € − 30 %.
    -   id: a07
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tes missions sont faites. Il reste à répondre au problème de départ et à faire ton bilan.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment calcules-tu le prix soldé d’une selle, et comment retrouves-tu le pourcentage d’une remise ? Écris aussi une chose que tu sais faire maintenant et une chose à retravailler.'
                aide: Explique les deux étapes du prix soldé avec la selle, puis la formule remise ÷ prix de départ × 100.
retenir:
    - '10 % : ÷ 10 ; 5 % : la moitié de 10 % ; 20 % : le double ; 25 % : ÷ 4 ; 50 % : ÷ 2.'
    - t % d’une quantité = quantité × t ÷ 100.
    - Prix soldé = prix − remise ; nouveau prix = prix + hausse.
    - Pourcentage de remise = remise ÷ prix de départ × 100.
