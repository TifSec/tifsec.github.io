titre: 'Renforcement 3 : Le tableau de la ration'
themes:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
problematique: Comment compléter un tableau de ration quand il est proportionnel ?
competences_bo:
    - EG4, 1-4 — Identifier des situations de proportionnalité et résoudre les problèmes associés
objectifs:
    connaissances:
        - 'Un tableau est de proportionnalité si on multiplie toujours par le même nombre : le coefficient.'
        - Le produit en croix permet de trouver une valeur qui manque.
    competences:
        - Trouver le coefficient de proportionnalité d’un tableau.
        - Calculer une valeur manquante avec le coefficient ou le produit en croix.
pourquoi:
    - En S03 et S04, tu as vu la proportionnalité. Cette heure la reprend avec des exemples plus simples.
    - 'Granulés, vermifuge, prix des sacs : à l’écurie, beaucoup de quantités sont proportionnelles.'
activites:
    -   id: a01
        titre: Automatismes
        consigne: Tu vas faire 5 calculs de tête, sans calculatrice. On attend 5 résultats.
        contenu:
            -   type: paragraphe
                texte: 'Range ta calculatrice : ces calculs se font de tête. Prends ton temps, la vitesse viendra avec l’entraînement.'
        questions:
            -   id: q01
                type: nombre
                enonce: 'Calcule de tête : 4 × 25.'
                aide: Quatre fois 25 €, combien d’euros ?
            -   id: q02
                type: nombre
                enonce: 'Calcule de tête : 2,5 × 2.'
                aide: Le double de 2,5.
            -   id: q03
                type: nombre
                enonce: 'Calcule de tête : 600 ÷ 3.'
                aide: 6 ÷ 3 = 2, donc 600 ÷ 3 = …
            -   id: q04
                type: nombre
                enonce: 'Calcule de tête : 10 × 1,5.'
                aide: 'Multiplier par 10 : la virgule se décale d’un rang vers la droite.'
            -   id: q05
                type: nombre
                enonce: 'Calcule de tête : 48 ÷ 6.'
                aide: Dans la table de 6, quel nombre donne 48 ?
    -   id: a02
        titre: Trouver le coefficient
        consigne: Tu vas trouver le coefficient d’un tableau de granulés, puis compléter ce tableau. On attend le coefficient et une quantité.
        contenu:
            -   type: tableau
                titre: Document 1 — Granulés distribués par jour (données fictives)
                colonnes:
                    - Nombre de chevaux
                    - '2'
                    - '5'
                    - '7'
                lignes:
                    -   - Granulés (kg)
                        - '6'
                        - '15'
                        - '?'
            -   type: etapes
                elements:
                    - 'Lis l’exemple : un cheval de 400 kg mange 8 kg de foin par jour ; un cheval de 500 kg en mange 10 kg.'
                    - 'On divise la 2e ligne par la 1re : 8 ÷ 400 = 0,02 et 10 ÷ 500 = 0,02.'
                    - 'On trouve le même nombre : le tableau est de proportionnalité, de coefficient 0,02.'
                    - 'Pour un cheval de 600 kg : 600 × 0,02 = 12 kg de foin par jour.'
                    - 'À toi : dans le tableau du document 1, trouve le coefficient, puis la quantité pour 7 chevaux.'
                    - Pourquoi chercher le coefficient ? Avec un seul nombre, on peut compléter tout le tableau.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Points clés du cours : complète chaque phrase avec le ou les mots qui manquent.'
                colonnes:
                    - Point clé
                    - Mot(s) manquant(s)
                lignes:
                    -   - Un tableau est de proportionnalité si on multiplie toujours par le même …… .
                        - ''
                    -   - Ce nombre s’appelle le …… de proportionnalité.
                        - ''
                aide: 'Relis l’exemple : par quoi passe-t-on de 400 à 8, et de 500 à 10 ? Comment appelle-t-on ce nombre ?'
            -   id: q02
                type: nombre
                enonce: 'Palier 1 : quel est le coefficient du tableau du document 1 ?'
                aide: 'Divise la 2e ligne par la 1re : 6 ÷ 2, puis 15 ÷ 5. Trouves-tu le même nombre ?'
            -   id: q03
                type: nombre
                enonce: 'Palier 2 : combien de kg de granulés faut-il pour 7 chevaux ? Quel calcul vas-tu poser ? Résous-le.'
                unite: kg
                aide: Multiplie le nombre de chevaux par le coefficient trouvé.
    -   id: a03
        titre: Le produit en croix
        transition: Le coefficient n’est pas toujours facile à trouver. Le produit en croix marche à tous les coups.
        consigne: Tu vas utiliser le produit en croix pour un prix de sacs, puis pour une dose de vermifuge. On attend deux résultats avec leur unité.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : 4 sacs de granulés coûtent 60 €. Combien coûtent 7 sacs ?'
                    - 'On range les nombres dans un tableau : 4 sacs → 60 € ; 7 sacs → ? €.'
                    - 'Produit en croix : on multiplie les deux nombres en diagonale, puis on divise par le 3e. 7 × 60 ÷ 4.'
                    - 7 × 60 = 420
                    - 420 ÷ 4 = 105. Donc 7 sacs coûtent 105 €.
                    - 'À toi : calcule le prix de 3 sacs, puis la dose de vermifuge.'
                    - Pourquoi le produit en croix ? Il marche même quand le coefficient n’est pas un nombre simple.
        questions:
            -   id: q01
                type: nombre
                enonce: 'Palier 2 : 5 sacs de granulés coûtent 90 €. Combien coûtent 3 sacs ? Quel calcul vas-tu poser ? Résous-le.'
                unite: €
                aide: 'Range les nombres : 5 sacs → 90 € ; 3 sacs → ? €. Puis calcule 3 × 90 ÷ 5.'
            -   id: q02
                type: nombre
                enonce: 'Palier 3 : la dose de vermifuge est de 30 mL pour un cheval de 500 kg. Quelle dose pour un cheval de 400 kg ? Quel calcul vas-tu poser ? Résous-le.'
                unite: mL
                aide: 'Range les nombres : 500 kg → 30 mL ; 400 kg → ? mL. Multiplie en diagonale, puis divise par le 3e nombre.'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le foin coûte 10 € la botte, et l’écurie paie toujours 50 € de livraison en plus.
        questions:
            -   id: q01
                type: texte
                enonce: Le prix total est-il proportionnel au nombre de bottes ? Explique avec 2 bottes et 4 bottes.
                aide: Calcule le prix total pour 2 bottes, puis pour 4 bottes. Si c’était proportionnel, le prix doublerait-il ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tes missions sont faites. Il reste à répondre au problème de départ et à faire ton bilan.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment complètes-tu un tableau de ration proportionnel ? Écris aussi une chose que tu sais faire maintenant et une chose à retravailler.'
                aide: 'Cite les deux méthodes vues : le coefficient et le produit en croix. Donne un exemple de la séance.'
retenir:
    - Coefficient = une valeur de la 2e ligne ÷ la valeur de la 1re ligne.
    - 'Produit en croix : on multiplie en diagonale, puis on divise par le 3e nombre.'
