version_papier:
    titre: Fiche papier — Reconnaître la proportionnalité
    introduction: "Dans une situation proportionnelle, quand une quantité est multipliée par un nombre, l’autre l’est par le même nombre. Comme une recette : doubler le nombre de personnes double chaque ingrédient. Au brevet, montre ta méthode et vérifie tes réponses."
    sections:
        - titre: 1. Vérifier avec le coefficient
          blocs:
              - type: paragraphe
                texte: On divise la deuxième ligne par la première. Si on retrouve toujours le même nombre, le tableau est proportionnel.
              - type: etapes
                elements:
                    - "Exemple : 4 kg coûtent 10 €."
                    - "Coefficient : 10 ÷ 4 = 2,5 € par kg."
                    - "Pour 6 kg : 6 × 2,5 = 15 €."
        - titre: 2. Passer par l’unité
          blocs:
              - type: paragraphe
                texte: Quand c’est plus facile, trouve la valeur pour une unité, puis multiplie par le nombre voulu.
              - type: etapes
                elements:
                    - Prix de 1 objet = prix total ÷ nombre d’objets.
                    - Prix de n objets = prix d’un objet × n.
                    - Vérifie que les unités accompagnent le calcul.
        - titre: 3. Distinguer proportionnel et non proportionnel
          blocs:
              - type: paragraphe
                texte: "Si un coût comprend des frais fixes, il ne part pas de zéro : doubler la quantité ne double donc pas forcément le prix. Il faut tester plusieurs lignes ou vérifier si le rapport reste constant."
          questions:
              - Repère les deux grandeurs.
              - Teste le même calcul sur plusieurs lignes.
              - Conclue et justifie avec les nombres du tableau.
        - titre: Je m’entraîne — même méthode que dans le cours
          blocs:
              - type: paragraphe
                texte: Reprends les étapes de l’exemple juste au-dessus. Écris une ligne par étape et garde les unités.
          questions:
              - Un article coûte 4 € l’unité. Complète le prix de 2, 3 et 5 articles.
              - Vérifie si le tableau du cours garde le même coefficient.
              - Explique comment tu passes à l’unité.
        - titre: Je transfère — une situation nouvelle
          blocs:
              - type: paragraphe
                texte: Cette fois, les nombres ou le contexte changent. Commence par identifier ce que l’on cherche, puis choisis la méthode qui convient.
          questions:
              - Une voiture parcourt 90 km en 1 h à vitesse constante. Quelle distance parcourt-elle en 2,5 h ?
              - Un taxi facture 5 € de prise en charge puis 2 € par kilomètre. Le prix est-il proportionnel à la distance ? Explique.
