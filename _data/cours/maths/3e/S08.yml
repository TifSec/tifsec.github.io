titre: Découvrir et reconnaître la proportionnalité
theme: relation de proportionnalité.
problematique: Découvrir et reconnaître la proportionnalité
pourquoi: Dans un exercice mathématique simplifié, chaque cheval reçoit 3 kg d'un produit.
application: Pourquoi cet exercice ? Avant d'apprendre une règle, nous allons observer ce qui se passe réellement entre deux séries de nombres.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances: []
    competences: []
activites:
    - id: a02
      titre: Qu'est-ce que la proportionnalité ?
      contenu:
          - type: paragraphe
            texte: Deux grandeurs sont proportionnelles lorsqu'on peut toujours passer de l'une à l'autre en multipliant par le même nombre.
      questions: []
    - id: a03
      titre: À quoi cela sert ?
      contenu:
          - type: paragraphe
            texte: "La proportionnalité permet de prévoir :"
          - type: liste
            elements:
                - une quantité nécessaire ;
                - un prix ;
                - une consommation ;
                - une production ;
                - une distance ou une durée.
          - type: titre
            texte: 🐴 Situation équine
          - type: paragraphe
            texte: Dans un exercice mathématique simplifié, chaque cheval reçoit 3 kg d'un produit.
          - type: paragraphe
            texte: Si le nombre de chevaux double, que devient la quantité totale ?
          - type: titre
            texte: 🌾 Situation agricole
          - type: paragraphe
            texte: Dans un exercice mathématique, chaque hectare nécessite 3 sacs d'un produit.
          - type: paragraphe
            texte: Si la surface double, que devient le nombre de sacs ?
      questions: []
    - id: a04
      titre: "1. Automatismes : multiplier et diviser rapidement"
      contenu:
          - type: paragraphe
            texte: Pourquoi commencer par cet exercice ? En proportionnalité, nous allons souvent multiplier ou diviser une quantité.
          - type: paragraphe
            texte: "Ce que cela vous apporte : effectuer rapidement les calculs simples pour pouvoir ensuite vous concentrer sur le raisonnement."
          - type: paragraphe
            texte: Calculatrice interdite.
      questions:
          - id: q01
            type: nombre
            enonce: 1. 7 × 6 =
            suite: []
          - id: q02
            type: nombre
            enonce: 2. 48 ÷ 6 =
            suite: []
          - id: q03
            type: nombre
            enonce: 3. Le double de 35 =
            suite: []
          - id: q04
            type: nombre
            enonce: 4. Le triple de 12 =
            suite: []
          - id: q05
            type: nombre
            enonce: 5. 90 ÷ 3 =
            suite:
                - type: paragraphe
                  texte: Réflexe DNB
                - type: paragraphe
                  texte: Cherchez d'abord si un double, un triple, une moitié ou une division simple permet de calculer mentalement.
    - id: a05
      titre: 2. Observer deux grandeurs
      contenu:
          - type: paragraphe
            texte: "Notion : relation de proportionnalité."
          - type: paragraphe
            texte: Pourquoi cet exercice ? Avant d'apprendre une règle, nous allons observer ce qui se passe réellement entre deux séries de nombres.
          - type: paragraphe
            texte: Calculatrice interdite.
          - type: titre
            texte: 🐴 Situation équine
          - type: paragraphe
            texte: Chaque cheval correspond à 3 kg dans ce modèle mathématique.
          - type: titre
            texte: 🌾 Situation agricole
          - type: paragraphe
            texte: Chaque hectare correspond à 3 sacs dans ce modèle.
          - type: tableau
            colonnes:
                - Nombre d'unités
                - Quantité correspondante
            lignes:
                - - "1"
                  - "3"
                - - "2"
                  - "?"
                - - "4"
                  - "?"
                - - "7"
                  - "?"
      questions:
          - id: q01
            type: nombre
            enonce: 1. Quantité correspondant à 2 unités =
            suite: []
          - id: q02
            type: nombre
            enonce: 2. Quantité correspondant à 4 unités =
            suite: []
          - id: q03
            type: nombre
            enonce: 3. Quantité correspondant à 7 unités =
            suite: []
          - id: q04
            type: texte
            enonce: Quel même calcul avez-vous utilisé pour toutes les lignes ?
            suite:
                - type: paragraphe
                  texte: Ce que l'on vient de découvrir
                - type: paragraphe
                  texte: On passe toujours de la première grandeur à la deuxième en multipliant par 3.
                - type: paragraphe
                  texte: On dit que les deux grandeurs sont proportionnelles.
                - type: paragraphe
                  texte: Le nombre 3 est le coefficient de proportionnalité.
    - id: a06
      titre: 3. Reconnaître un tableau de proportionnalité
      contenu:
          - type: paragraphe
            texte: "Notion : coefficient constant."
          - type: paragraphe
            texte: Pourquoi cet exercice ? Deux séries de nombres peuvent toutes les deux augmenter sans être proportionnelles.
          - type: paragraphe
            texte: "Ce que cela vous apporte : apprendre à vérifier plutôt qu'à deviner."
          - type: paragraphe
            texte: Calculatrice autorisée.
      questions: []
    - id: a07
      titre: Tableau A
      contenu:
          - type: tableau
            colonnes:
                - "2"
                - "8"
            lignes:
                - - "3"
                  - "12"
                - - "5"
                  - "20"
      questions:
          - id: q01
            type: texte
            enonce: Le tableau A est-il proportionnel ? Justifiez.
            suite: []
    - id: a08
      titre: Tableau B
      contenu:
          - type: tableau
            colonnes:
                - "2"
                - "7"
            lignes:
                - - "3"
                  - "10"
                - - "5"
                  - "16"
      questions:
          - id: q01
            type: texte
            enonce: Le tableau B est-il proportionnel ? Justifiez.
            suite: []
    - id: a09
      titre: Tableau C
      contenu:
          - type: tableau
            colonnes:
                - "4"
                - "10"
            lignes:
                - - "6"
                  - "15"
                - - "8"
                  - "20"
      questions:
          - id: q01
            type: texte
            enonce: "Le tableau C est-il proportionnel ? Justifiez et donnez son coefficient. Indice 1 Calculez : deuxième nombre ÷ premier nombre. Indice 2 Commencez par 10 ÷ 4. Indice 3 10 ÷ 4 = 2,5. Vérifiez avec 15 ÷ 6 et 20 ÷ 8."
            aide: "Indice 1 Calculez : deuxième nombre ÷ premier nombre. Indice 2 Commencez par 10 ÷ 4. Indice 3 10 ÷ 4 = 2,5. Vérifiez avec 15 ÷ 6 et 20 ÷ 8."
            suite:
                - type: paragraphe
                  texte: Méthode de vérification
                - type: paragraphe
                  texte: "Pour vérifier un tableau, on peut calculer :"
                - type: paragraphe
                  texte: valeur de la deuxième grandeur ÷ valeur de la première grandeur
                - type: paragraphe
                  texte: Si le résultat est toujours le même, la situation est proportionnelle.
    - id: a10
      titre: 4. Le passage à l'unité
      contenu:
          - type: paragraphe
            texte: "Notion : passage à l'unité."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? On cherche d'abord la valeur correspondant à 1 unité.
          - type: paragraphe
            texte: À quoi cela sert ? Une fois cette valeur connue, on peut calculer n'importe quelle autre valeur.
          - type: paragraphe
            texte: Calculatrice autorisée.
          - type: paragraphe
            texte: 4 objets coûtent 18 €.
          - type: paragraphe
            texte: Le prix est proportionnel au nombre d'objets.
      questions:
          - id: q01
            type: nombre
            enonce: 1. Prix d'un objet =
            aide: Indice 1 Cherchez la valeur correspondant à 1 objet. Indice 2 Les 18 € correspondent à 4 objets. Indice 3 Calculez 18 ÷ 4.
            suite: []
          - id: q02
            type: nombre
            enonce: 2. Prix de 7 objets =
            suite: []
          - id: q03
            type: texte
            enonce: 3. Expliquez votre méthode en deux étapes.
            suite:
                - type: paragraphe
                  texte: À retenir
                - type: paragraphe
                  texte: Chercher d'abord la valeur correspondant à 1 s'appelle le passage à l'unité.
    - id: a11
      titre: "5. Situation professionnelle : prévoir une quantité"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Pour utiliser la proportionnalité dans une situation proche d'un contexte professionnel.
          - type: paragraphe
            texte: "Ce que cela vous apporte : savoir passer d'une donnée connue à une nouvelle quantité sans utiliser une formule apprise par cœur."
          - type: paragraphe
            texte: Calculatrice autorisée.
          - type: titre
            texte: 🐴 Situation équine
          - type: paragraphe
            texte: Dans un modèle mathématique simplifié, 5 chevaux correspondent à 17,5 kg d'un produit pendant une même période.
          - type: paragraphe
            texte: On souhaite prévoir la quantité pour 8 chevaux.
          - type: titre
            texte: 🌾 Situation agricole
          - type: paragraphe
            texte: Une exploitation utilise 17,5 kg d'un produit pour 5 hectares.
          - type: paragraphe
            texte: On souhaite prévoir la quantité pour 8 hectares.
      questions:
          - id: q01
            type: nombre
            enonce: 1. Quantité correspondant à une unité =
            suite: []
          - id: q02
            type: nombre
            enonce: 2. Quantité correspondant à 8 unités =
            aide: Indice 1 Utilisez la quantité correspondant à 1 unité. Indice 2 Une unité correspond à 3,5 kg. Indice 3 Calculez 3,5 × 8.
            suite: []
          - id: q03
            type: texte
            enonce: 3. Pourquoi peut-on utiliser la proportionnalité dans cette situation ?
            suite: []
          - id: q04
            type: texte
            enonce: 4. Rédigez une phrase répondant à la situation choisie.
            suite: []
    - id: a12
      titre: "6. Défi DNB : remplir des bouteilles"
      contenu:
          - type: paragraphe
            texte: Calculatrice autorisée.
          - type: paragraphe
            texte: Une machine remplit 24 bouteilles en 3 minutes.
          - type: paragraphe
            texte: On suppose que son rythme reste constant.
      questions:
          - id: q01
            type: nombre
            enonce: 1. Nombre de bouteilles remplies en 1 minute =
            suite: []
          - id: q02
            type: nombre
            enonce: 2. Nombre de bouteilles remplies en 10 minutes =
            suite: []
          - id: q03
            type: nombre
            enonce: 3. Temps nécessaire pour remplir 120 bouteilles =
            aide: Indice 1 Utilisez le nombre de bouteilles remplies en une minute. Indice 2 La machine remplit 8 bouteilles par minute. Indice 3 Calculez 120 ÷ 8.
            suite: []
          - id: q04
            type: texte
            enonce: 4. Pourquoi peut-on utiliser la proportionnalité dans ce problème ?
            suite:
                - type: paragraphe
                  texte: Réflexe DNB
                - type: paragraphe
                  texte: Avant d'utiliser la proportionnalité, cherchez ce qui reste constant. Une méthode de calcul ne remplace pas une justification.
    - id: a13
      titre: 7. Mon bilan
      contenu:
          - type: paragraphe
            texte: Pourquoi cette dernière étape ? Pour vérifier que vous avez compris ce qu'est une situation proportionnelle, et pas seulement comment effectuer les calculs.
      questions:
          - id: q01
            type: texte
            enonce: Expliquez avec vos mots comment reconnaître une situation de proportionnalité.
            suite: []
          - id: q02
            type: texte
            enonce: À quoi sert le coefficient de proportionnalité ?
            suite: []
          - id: q03
            type: texte
            enonce: Expliquez ce qu'est le passage à l'unité.
            suite: []
    - id: a14
      titre: À retenir
      contenu:
          - type: liste
            elements:
                - Deux grandeurs sont proportionnelles lorsqu'on passe de l'une à l'autre en multipliant toujours par le même nombre.
                - Ce nombre est le coefficient de proportionnalité.
                - Le coefficient peut être entier ou décimal.
                - Si le multiplicateur change, la situation n'est pas proportionnelle.
                - Deux grandeurs qui augmentent ensemble ne sont pas forcément proportionnelles.
                - Le passage à l'unité consiste à chercher d'abord la valeur correspondant à 1.
                - Une méthode de calcul ne suffit pas à prouver qu'une situation est proportionnelle.
      questions: []
    - id: a15
      titre: Finir la séance
      contenu:
          - type: paragraphe
            texte: Vérifiez vos calculs, vos unités et vos justifications.
      questions: []
    - id: a16
      titre: Références générales
      contenu:
          - type: liste
            elements:
                - Chlorofil – Classes de 4e et 3e de l'enseignement agricole
                - Éduscol – Les épreuves du DNB
          - type: lien
            titre: Chlorofil – Classes de 4e et 3e de l'enseignement agricole
            url: https://chlorofil.fr/diplomes/secondaire/4e-3e
          - type: lien
            titre: Éduscol – Les épreuves du DNB
            url: https://eduscol.education.gouv.fr/5607/les-epreuves-du-dnb
      questions: []
