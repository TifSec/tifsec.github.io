titre: Additionner et soustraire des fractions
theme: addition de parts de même taille.
problematique: Additionner et soustraire des fractions
pourquoi: Cela permet par exemple de réunir plusieurs proportions, calculer une surface totale, déterminer ce qu'il reste ou comparer une quantité utilisée à une quantité disponible.
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances: []
    competences: []
activites:
    - id: a02
      titre: Qu'est-ce que cela signifie ?
      contenu:
          - type: paragraphe
            texte: Additionner des fractions, c'est réunir plusieurs parts d'une même quantité.
          - type: paragraphe
            texte: Soustraire des fractions, c'est retirer une partie ou calculer ce qu'il reste.
      questions: []
    - id: a03
      titre: À quoi ça sert ?
      contenu:
          - type: paragraphe
            texte: Cela permet par exemple de réunir plusieurs proportions, calculer une surface totale, déterminer ce qu'il reste ou comparer une quantité utilisée à une quantité disponible.
          - type: titre
            texte: 🐴 Situation équine
          - type: paragraphe
            texte: "Dans un exercice mathématique simplifié, une ration contient :"
          - type: liste
            elements:
                - 2/8 d'un premier groupe d'aliments ;
                - 3/8 d'un deuxième groupe.
          - type: paragraphe
            texte: Quelle fraction de la ration représentent-ils ensemble ?
          - type: titre
            texte: 🌾 Situation agricole
          - type: paragraphe
            texte: "Une parcelle est répartie ainsi :"
          - type: liste
            elements:
                - 2/8 pour une première culture ;
                - 3/8 pour une deuxième culture.
          - type: paragraphe
            texte: Quelle fraction de la parcelle est utilisée au total ?
      questions: []
    - id: a04
      titre: "1. Automatismes : réactiver les fractions équivalentes"
      contenu:
          - type: paragraphe
            texte: "Notions : simplification, fractions équivalentes et comparaison."
          - type: paragraphe
            texte: Pourquoi commencer par là ? Pour additionner des fractions ayant des dénominateurs différents, il faudra savoir les transformer sans changer leur valeur.
          - type: paragraphe
            texte: "Ce que cela vous apporte : retrouver les outils de S04 dont nous allons avoir besoin aujourd'hui."
          - type: paragraphe
            texte: Calculatrice interdite.
      questions:
          - id: q01
            type: texte
            enonce: Simplifiez 8/12.
            suite: []
          - id: q02
            type: texte
            enonce: "Complétez : 1/2 = .../8"
            suite: []
          - id: q03
            type: texte
            enonce: Comparez 2/3 et 3/4.
            suite:
                - type: paragraphe
                  texte: Réflexe DNB
                - type: paragraphe
                  texte: Avant de calculer avec des fractions, observez si une écriture équivalente peut rendre le problème plus simple.
    - id: a05
      titre: 2. Additionner des fractions de même dénominateur
      contenu:
          - type: paragraphe
            texte: "Notion : addition de parts de même taille."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? Si deux fractions ont le même dénominateur, elles utilisent des parts de même taille.
          - type: paragraphe
            texte: À quoi cela sert ? À réunir plusieurs portions d'un même ensemble.
          - type: paragraphe
            texte: Calculatrice interdite.
          - type: paragraphe
            texte: "On considère :"
          - type: paragraphe
            texte: 2/8 + 3/8
      questions:
          - id: q01
            type: texte
            enonce: Les parts ont-elles la même taille ? Combien de huitièmes obtient-on au total ?
            suite:
                - type: paragraphe
                  texte: Ce que l'on découvre
                - type: paragraphe
                  texte: Lorsque les dénominateurs sont identiques, on additionne les numérateurs et on conserve le dénominateur.
                - type: paragraphe
                  texte: 2/8 + 3/8 = 5/8
    - id: a06
      titre: "Exercice : appliquer la méthode"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Il faut maintenant vérifier que la règle fonctionne avec plusieurs exemples.
      questions:
          - id: q01
            type: texte
            enonce: "Calculez puis simplifiez si possible : 3/7 + 2/7 ; 4/9 + 2/9 ; 5/12 + 3/12."
            suite: []
    - id: a07
      titre: 3. Soustraire des fractions de même dénominateur
      contenu:
          - type: paragraphe
            texte: "Notion : soustraction de parts de même taille."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? On possède une certaine quantité de parts et on en retire quelques-unes.
          - type: paragraphe
            texte: À quoi cela sert ? À calculer une quantité restante.
          - type: paragraphe
            texte: Calculatrice interdite.
      questions:
          - id: q01
            type: texte
            enonce: "Calculez : 7/10 - 3/10"
            suite: []
          - id: q02
            type: texte
            enonce: "Calculez puis simplifiez si possible : 8/11 - 3/11 ; 9/10 - 4/10 ; 11/15 - 6/15."
            suite:
                - type: paragraphe
                  texte: Règle commune
                - type: paragraphe
                  texte: "Si les dénominateurs sont identiques :"
                - type: liste
                  elements:
                      - on additionne ou on soustrait les numérateurs ;
                      - on conserve le dénominateur ;
                      - on simplifie ensuite si possible.
    - id: a08
      titre: 4. Que faire lorsque les dénominateurs sont différents ?
      contenu:
          - type: paragraphe
            texte: "Notion : dénominateur commun."
          - type: paragraphe
            texte: Concrètement, quel est le problème ? Une moitié et un quart ne représentent pas des parts de même taille.
          - type: paragraphe
            texte: À quoi sert le dénominateur commun ? À transformer les fractions pour obtenir des parts de même taille avant de les additionner ou de les soustraire.
          - type: paragraphe
            texte: Calculatrice interdite.
          - type: paragraphe
            texte: "On considère :"
          - type: paragraphe
            texte: 1/2 + 1/4
      questions:
          - id: q01
            type: texte
            enonce: Peut-on écrire 1/2 + 1/4 = 2/6 ? Expliquez.
            suite: []
          - id: q02
            type: texte
            enonce: Transformez 1/2 en quarts, puis calculez 1/2 + 1/4. Indice 1 Pour passer de 2 à 4, multipliez par 2. Indice 2 Faites la même opération au numérateur. Indice 3 1/2 = 2/4.
            aide: Indice 1 Pour passer de 2 à 4, multipliez par 2. Indice 2 Faites la même opération au numérateur. Indice 3 1/2 = 2/4.
            suite:
                - type: paragraphe
                  texte: Ce que l'on découvre
                - type: paragraphe
                  texte: Lorsque les dénominateurs sont différents, il faut d'abord transformer les fractions pour qu'elles aient le même dénominateur.
    - id: a09
      titre: 5. Trouver un dénominateur commun
      contenu:
          - type: paragraphe
            texte: "Notion : multiple commun."
          - type: paragraphe
            texte: Pourquoi cet exercice ? Lorsque les dénominateurs ne sont pas multiples l'un de l'autre, il faut chercher un nombre qui soit multiple des deux.
          - type: paragraphe
            texte: "Ce que cela vous apporte : réutiliser directement les multiples étudiés en S02."
          - type: paragraphe
            texte: Calculatrice interdite.
          - type: paragraphe
            texte: "Calculons :"
          - type: paragraphe
            texte: 2/3 + 1/4
      questions:
          - id: q01
            type: nombre
            enonce: Un multiple commun simple de 3 et 4 =
            suite: []
          - id: q02
            type: texte
            enonce: Transformez 2/3 et 1/4 avec le dénominateur 12, puis effectuez l'addition. Indice 1 Pour passer de 3 à 12, multipliez par 4. Indice 2 Pour passer de 4 à 12, multipliez par 3. Indice 3 2/3 = 8/12 1/4 = 3/12
            aide: Indice 1 Pour passer de 3 à 12, multipliez par 4. Indice 2 Pour passer de 4 à 12, multipliez par 3. Indice 3 2/3 = 8/12 1/4 = 3/12
            suite:
                - type: paragraphe
                  texte: Méthode complète
          - id: q03
            type: texte
            enonce: chercher un dénominateur commun ;
            suite: []
          - id: q04
            type: texte
            enonce: transformer les fractions ;
            suite: []
          - id: q05
            type: texte
            enonce: additionner ou soustraire les numérateurs ;
            suite: []
          - id: q06
            type: texte
            enonce: conserver le dénominateur ;
            suite: []
          - id: q07
            type: texte
            enonce: simplifier si possible.
            suite: []
    - id: a10
      titre: 6. Choisir la méthode
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Dans un problème, la méthode n'est pas indiquée.
          - type: paragraphe
            texte: "Ce que cela vous apporte : reconnaître rapidement si un dénominateur est déjà un multiple de l'autre."
          - type: paragraphe
            texte: Calculatrice interdite.
      questions:
          - id: q01
            type: texte
            enonce: "Calculez et simplifiez si possible : 1/3 + 1/6 ; 3/4 + 1/8 ; 5/6 - 1/3 ; 5/8 - 1/4."
            suite:
                - type: paragraphe
                  texte: Réflexe DNB
                - type: paragraphe
                  texte: Avant de chercher un nouveau dénominateur, vérifiez si l'un des deux est déjà un multiple de l'autre.
    - id: a11
      titre: "7. Situation professionnelle : calculer ce qui est utilisé et ce qui reste"
      contenu:
          - type: paragraphe
            texte: Calculatrice autorisée.
          - type: titre
            texte: 🐴 Situation équine
          - type: paragraphe
            texte: "Dans un exercice mathématique simplifié, une ration contient :"
          - type: liste
            elements:
                - 1/2 d'un premier groupe ;
                - 1/4 d'un deuxième groupe.
          - type: paragraphe
            texte: Quelle fraction de la ration représentent les deux groupes ensemble ?
          - type: paragraphe
            texte: Quelle fraction reste-t-il pour les autres éléments ?
          - type: titre
            texte: 🌾 Situation agricole
          - type: paragraphe
            texte: "Une parcelle est utilisée ainsi :"
          - type: liste
            elements:
                - 1/2 pour une première culture ;
                - 1/4 pour une deuxième culture.
          - type: paragraphe
            texte: Quelle fraction de la parcelle est utilisée au total ?
          - type: paragraphe
            texte: Quelle fraction reste-t-il disponible ?
      questions:
          - id: q01
            type: texte
            enonce: Calculez la fraction utilisée au total, puis la fraction restante. Terminez par une phrase de conclusion. Indice 1 Commencez par calculer 1/2 + 1/4. Indice 2 1/2 = 2/4. Indice 3 Une unité entière peut s'écrire 4/4.
            aide: Indice 1 Commencez par calculer 1/2 + 1/4. Indice 2 1/2 = 2/4. Indice 3 Une unité entière peut s'écrire 4/4.
            suite: []
    - id: a12
      titre: "8. Défi DNB : une randonnée en plusieurs étapes"
      contenu:
          - type: paragraphe
            texte: Calculatrice interdite.
          - type: paragraphe
            texte: "Lors d'une randonnée, un groupe parcourt :"
          - type: liste
            elements:
                - 3/8 du trajet le matin ;
                - 1/4 du trajet l'après-midi.
      questions:
          - id: q01
            type: texte
            enonce: Quelle fraction du trajet a été parcourue au total ?
            suite: []
          - id: q02
            type: texte
            enonce: Quelle fraction du trajet reste-t-il à parcourir ?
            suite: []
          - id: q03
            type: texte
            enonce: "Un élève affirme : « Le groupe a déjà parcouru plus de la moitié du trajet. » A-t-il raison ? Justifiez. Indice 1 Comparez 5/8 à 1/2. Indice 2 Transformez 1/2 en huitièmes. Indice 3 1/2 = 4/8."
            aide: Indice 1 Comparez 5/8 à 1/2. Indice 2 Transformez 1/2 en huitièmes. Indice 3 1/2 = 4/8.
            suite:
                - type: paragraphe
                  texte: Réflexe DNB
                - type: paragraphe
                  texte: Pour vérifier une affirmation, transformez-la en calcul ou en comparaison puis justifiez votre conclusion.
    - id: a13
      titre: 9. Mon bilan
      contenu:
          - type: paragraphe
            texte: Pourquoi cette dernière étape ? Pour vérifier que vous savez expliquer la méthode, pas seulement recopier une règle.
      questions:
          - id: q01
            type: texte
            enonce: "Expliquez avec vos mots pourquoi on ne peut pas écrire : 1/2 + 1/4 = 2/6."
            suite: []
          - id: q02
            type: texte
            enonce: Donnez les grandes étapes pour calculer 2/3 + 1/4.
            suite: []
    - id: a14
      titre: À retenir
      contenu:
          - type: liste
            elements:
                - Pour additionner ou soustraire des fractions, les parts doivent avoir la même taille.
                - Si les dénominateurs sont identiques, on additionne ou soustrait les numérateurs et on conserve le dénominateur.
                - Si les dénominateurs sont différents, on transforme d'abord les fractions en fractions équivalentes.
                - Un dénominateur commun peut être trouvé grâce aux multiples.
                - On simplifie le résultat lorsque c'est possible.
                - On n'additionne jamais directement les dénominateurs.
      questions: []
    - id: a15
      titre: Finir la séance
      contenu:
          - type: paragraphe
            texte: Vérifiez vos transformations, vos calculs et vos simplifications.
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
