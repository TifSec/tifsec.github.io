version_papier:
    titre: Fiche papier — Additionner et soustraire des fractions
    introduction: On ne peut additionner que des parts de même taille. On ne peut pas additionner des pommes et des quarts de pomme sans d’abord les exprimer dans la même unité. Au brevet, montre ta méthode et vérifie tes réponses.
    sections:
        - titre: 1. Même dénominateur
          blocs:
              - type: paragraphe
                texte: Le dénominateur indique la taille des parts. Si cette taille est déjà la même, on garde le dénominateur et on additionne seulement le nombre de parts.
              - type: etapes
                elements:
                    - 3/7 + 2/7 = 5/7.
                    - 7/10 − 3/10 = 4/10 = 2/5.
        - titre: 2. Dénominateurs différents
          blocs:
              - type: paragraphe
                texte: Avant de calculer, transforme les fractions pour avoir la même taille de part. Le dénominateur commun est comme une unité commune.
              - type: etapes
                elements:
                    - 1/2 + 1/4.
                    - "Un demi = deux quarts : 1/2 = 2/4."
                    - Donc 1/2 + 1/4 = 2/4 + 1/4 = 3/4.
                    - "On ne fait pas 1/2 + 1/4 = 2/6 : les parts n’ont pas la même taille."
        - titre: 3. Méthode à recopier
          blocs:
              - type: liste
                elements:
                    - Trouver un dénominateur commun.
                    - Transformer chaque fraction en multipliant en haut et en bas par le même nombre.
                    - Additionner ou soustraire les numérateurs.
                    - Garder le dénominateur commun.
                    - Simplifier si possible.
          questions:
              - Fais les calculs du cours en laissant visibles toutes les transformations.
        - titre: Je m’entraîne — même méthode que dans le cours
          blocs:
              - type: paragraphe
                texte: Reprends les étapes de l’exemple juste au-dessus. Écris une ligne par étape et garde les unités.
          questions:
              - Calcule 3/7 + 2/7 puis 7/10 − 3/10.
              - Calcule 1/2 + 1/4 en transformant le demi en quarts.
              - Explique pourquoi on garde le dénominateur commun.
        - titre: Je transfère — une situation nouvelle
          blocs:
              - type: paragraphe
                texte: Cette fois, les nombres ou le contexte changent. Commence par identifier ce que l’on cherche, puis choisis la méthode qui convient.
          questions:
              - "Calcule 2/3 + 1/4 : trouve un dénominateur commun, transforme, puis additionne."
              - Un bidon est rempli à 5/6. On utilise 1/4 du bidon. Quelle fraction reste-t-il ? Écris toutes les étapes.
