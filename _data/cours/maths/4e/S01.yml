titre: Remise en route et diagnostic
theme: calcul mental, opérations et priorités opératoires.
problematique: Remise en route et diagnostic
pourquoi: "Objectif de cette séance : Effectuer et expliquer des calculs simples."
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances: []
    competences:
        - Effectuer et expliquer des calculs simples.
        - Choisir une méthode adaptée à une situation.
        - Calculer une fraction ou un pourcentage d'une quantité.
        - Utiliser la proportionnalité dans un problème professionnel.
        - Convertir correctement des grandeurs.
        - Retrouver le périmètre et l'aire d'un rectangle.
        - Vérifier si un résultat est cohérent.
activites:
    - id: a03
      titre: "1. Automatismes : remettre la machine en route"
      contenu:
          - type: paragraphe
            texte: "Notion : calcul mental, opérations et priorités opératoires."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? Le calcul mental consiste à utiliser les nombres que l'on connaît pour transformer un calcul en une opération plus simple.
          - type: paragraphe
            texte: À quoi ça sert ? À vérifier rapidement une quantité, repérer une erreur ou estimer un résultat avant même de prendre une calculatrice.
          - type: paragraphe
            texte: Pourquoi commencer par cet exercice ?
          - type: paragraphe
            texte: Les calculs de base vont servir dans toutes les activités suivantes. Les retrouver maintenant permettra ensuite de réfléchir davantage au problème lui-même.
          - type: paragraphe
            texte: Calculatrice interdite.
      questions:
          - id: q01
            type: nombre
            enonce: 1. 7 × 8 =
            suite: []
          - id: q02
            type: nombre
            enonce: 2. 84 ÷ 7 =
            suite: []
          - id: q03
            type: nombre
            enonce: 3. 20 - 3 × 4 =
            aide: Indice 1 Repérez l'opération prioritaire. Indice 2 La multiplication doit être effectuée avant la soustraction. Indice 3 Calculez d'abord 3 × 4.
            suite: []
          - id: q04
            type: nombre
            enonce: 4. La moitié de 70 =
            suite: []
          - id: q05
            type: nombre
            enonce: 5. Le quart de 80 =
            suite: []
          - id: q06
            type: nombre
            enonce: 6. 10 % de 250 € =
            suite:
                - type: paragraphe
                  texte: Réflexe DNB
                - type: paragraphe
                  texte: Avant d'utiliser une calculatrice, demandez-vous si une décomposition simple permet de vérifier mentalement le résultat.
    - id: a04
      titre: "2. Proportionnalité : prévoir une quantité"
      contenu:
          - type: paragraphe
            texte: "Notion : proportionnalité et passage à l'unité."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? Deux quantités sont proportionnelles lorsqu'elles évoluent toujours de la même façon. Si l'une double, l'autre double également.
          - type: paragraphe
            texte: À quoi ça sert ? À prévoir une quantité pour davantage d'animaux, davantage d'hectares ou davantage de jours.
          - type: paragraphe
            texte: Pourquoi passons-nous à cet exercice ?
          - type: paragraphe
            texte: Nous avons retrouvé les divisions et les multiplications. Nous allons maintenant les enchaîner pour résoudre une situation professionnelle.
          - type: paragraphe
            texte: "Ce que cela vous apporte : apprendre à trouver d'abord la quantité correspondant à 1, puis à l'utiliser pour une autre quantité."
          - type: titre
            texte: 🐴 Situation équine
          - type: paragraphe
            texte: Pour cet exercice mathématique simplifié, 5 chevaux consomment ensemble 20 kg d'un aliment par jour.
          - type: paragraphe
            texte: On suppose que chaque cheval reçoit exactement la même quantité.
          - type: titre
            texte: 🌾 Situation agricole
          - type: paragraphe
            texte: Une exploitation utilise 20 kg d'un produit pour 5 hectares.
          - type: paragraphe
            texte: On suppose que la quantité utilisée par hectare reste identique.
          - type: paragraphe
            texte: Calculatrice autorisée.
      questions: []
    - id: a05
      titre: "Exercice 1 : retrouver la quantité pour une unité"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Avant de prévoir une nouvelle quantité, il est souvent plus simple de savoir ce qui correspond à une seule unité.
      questions:
          - id: q01
            type: nombre
            enonce: 1. Quantité correspondant à une unité =
            aide: Indice 1 Cherchez la quantité correspondant à 1. Indice 2 Il faut partager 20 kg entre 5 unités. Indice 3 Calculez 20 ÷ 5.
            suite: []
    - id: a06
      titre: "Exercice 2 : prévoir pour 8 unités"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Il faut maintenant utiliser la valeur pour 1 pour construire la valeur correspondant à 8.
      questions:
          - id: q01
            type: nombre
            enonce: 2. Quantité correspondant à 8 unités =
            suite: []
          - id: q02
            type: texte
            enonce: 3. Expliquez votre méthode en deux étapes.
            suite:
                - type: paragraphe
                  texte: Méthode découverte
                - type: paragraphe
                  texte: Le passage à l'unité consiste à déterminer d'abord la valeur correspondant à 1.
    - id: a07
      titre: "3. Fractions : comprendre une partie d'une quantité"
      contenu:
          - type: paragraphe
            texte: "Notion : fraction d'une quantité."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? Une fraction permet de représenter une partie d'un ensemble partagé en parts égales.
          - type: paragraphe
            texte: À quoi ça sert ? À exprimer une proportion, une part d'une ration, une surface ou une quantité.
          - type: paragraphe
            texte: Pourquoi changeons-nous de représentation ?
          - type: paragraphe
            texte: Dans la proportionnalité, nous avons utilisé des divisions et des multiplications. Les fractions permettent également de représenter ces partages de façon compacte.
          - type: paragraphe
            texte: Un sac contient 24 kg.
          - type: paragraphe
            texte: Calculatrice interdite.
      questions:
          - id: q01
            type: nombre
            enonce: 1. La moitié de 24 kg =
            suite: []
          - id: q02
            type: nombre
            enonce: 2. Le quart de 24 kg =
            suite: []
          - id: q03
            type: nombre
            enonce: 3. Les trois quarts de 24 kg =
            aide: Indice 1 Commencez par chercher un quart de 24. Indice 2 Un quart de 24 vaut 6 kg. Indice 3 Multipliez 6 par 3.
            suite:
                - type: paragraphe
                  texte: Méthode à retenir
                - type: paragraphe
                  texte: Pour calculer une fraction d'une quantité, on peut d'abord diviser par le dénominateur, puis multiplier par le numérateur.
    - id: a08
      titre: "4. Pourcentages : vérifier une réduction"
      contenu:
          - type: paragraphe
            texte: "Notion : pourcentage."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? Un pourcentage représente une proportion sur 100. Ainsi, 25 % signifie 25 parts sur 100.
          - type: paragraphe
            texte: À quoi ça sert ? À calculer une remise, une augmentation ou une proportion exprimée de manière facile à comparer.
          - type: paragraphe
            texte: Pourquoi cet exercice ?
          - type: paragraphe
            texte: Nous venons de calculer un quart d'une quantité. Or 25 % correspond justement à un quart. Nous allons vérifier que ces deux méthodes donnent bien le même résultat.
          - type: paragraphe
            texte: Un équipement coûte 80 €. Une remise de 25 % est accordée.
          - type: paragraphe
            texte: Calculatrice autorisée.
      questions:
          - id: q01
            type: nombre
            enonce: 1. Montant de la remise =
            suite: []
          - id: q02
            type: nombre
            enonce: 2. Prix réellement payé =
            suite: []
          - id: q03
            type: texte
            enonce: 3. Expliquez comment vous pouvez vérifier mentalement le résultat.
            suite: []
    - id: a09
      titre: "5. Grandeurs : utiliser la bonne unité"
      contenu:
          - type: paragraphe
            texte: "Notion : conversion d'unités."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? Convertir consiste à exprimer une même grandeur avec une autre unité, sans modifier la quantité réelle.
          - type: paragraphe
            texte: À quoi ça sert ? À comparer correctement des mesures et à éviter des erreurs dans les calculs professionnels.
          - type: paragraphe
            texte: Pourquoi cette activité maintenant ?
          - type: paragraphe
            texte: Dans les activités précédentes, nous avons manipulé des kilogrammes et des euros. Nous allons vérifier que nous savons passer correctement d'une unité à une autre.
          - type: paragraphe
            texte: Calculatrice interdite.
      questions:
          - id: q01
            type: nombre
            enonce: 1. 2,5 m =
            suite: []
          - id: q02
            type: nombre
            enonce: 2. 3 500 g =
            suite: []
          - id: q03
            type: nombre
            enonce: 3. 1,5 L =
            suite: []
          - id: q04
            type: nombre
            enonce: 4. 2 h 30 min =
            suite: []
    - id: a10
      titre: "6. Géométrie : distinguer contour et surface"
      contenu:
          - type: paragraphe
            texte: "Notions : périmètre et aire."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? Le périmètre mesure la longueur du contour. L'aire mesure la surface occupée.
          - type: paragraphe
            texte: À quoi ça sert ? Le périmètre peut servir à prévoir une clôture. L'aire permet de connaître la surface d'un terrain, d'une parcelle ou d'une zone de travail.
          - type: paragraphe
            texte: Pourquoi cet exercice ?
          - type: paragraphe
            texte: Deux problèmes peuvent utiliser les mêmes dimensions tout en demandant des calculs totalement différents. Il faut donc comprendre la grandeur recherchée avant de choisir une formule.
          - type: paragraphe
            texte: Un terrain rectangulaire mesure 12 m de longueur et 5 m de largeur.
          - type: paragraphe
            texte: Calculatrice interdite.
      questions:
          - id: q01
            type: nombre
            enonce: 1. Périmètre du terrain =
            aide: Indice 1 Le périmètre correspond au contour. Indice 2 Un rectangle possède deux longueurs et deux largeurs. Indice 3 P = 2 × (L + l).
            suite: []
          - id: q02
            type: nombre
            enonce: 2. Aire du terrain =
            aide: Indice 1 L'aire mesure la surface occupée. Indice 2 Utilisez la longueur et la largeur. Indice 3 A = L × l.
            suite: []
          - id: q03
            type: texte
            enonce: 3. Expliquez la différence entre périmètre et aire.
            suite: []
    - id: a11
      titre: "7. Défi DNB : organiser un enclos"
      contenu:
          - type: paragraphe
            texte: Calculatrice autorisée.
          - type: paragraphe
            texte: Un enclos rectangulaire mesure 18 m de long et 12 m de large.
          - type: paragraphe
            texte: Une ouverture de 3 m est laissée sans clôture pour installer un portail.
      questions:
          - id: q01
            type: nombre
            enonce: 1. Périmètre total de l'enclos =
            suite: []
          - id: q02
            type: nombre
            enonce: 2. Longueur réelle de clôture nécessaire =
            aide: Indice 1 Les 3 m du portail ne doivent pas être clôturés. Indice 2 Partez du périmètre total. Indice 3 Calculez 60 - 3.
            suite: []
          - id: q03
            type: texte
            enonce: 3. Un rouleau contient 25 m de clôture. Deux rouleaux suffisent-ils ? Justifiez votre réponse.
            suite:
                - type: paragraphe
                  texte: Réflexe DNB
                - type: paragraphe
                  texte: Toutes les données ne conduisent pas directement à la réponse. Identifiez d'abord ce que vous cherchez, choisissez les calculs, puis rédigez une conclusion.
    - id: a12
      titre: 8. Mon premier bilan
      contenu:
          - type: paragraphe
            texte: Pourquoi cette dernière étape ? Elle permet de distinguer ce que vous maîtrisez déjà de ce que nous devrons retravailler.
          - type: paragraphe
            texte: Aucun calcul n'est nécessaire.
      questions:
          - id: q01
            type: texte
            enonce: "Une notion avec laquelle je me sens plutôt à l'aise :"
            suite: []
          - id: q02
            type: texte
            enonce: "Une notion que j'ai besoin de retravailler :"
            suite: []
          - id: q03
            type: texte
            enonce: "Une méthode que je peux réutiliser dans un autre problème :"
            suite: []
    - id: a13
      titre: À retenir
      contenu:
          - type: liste
            elements:
                - Un calcul peut souvent être transformé en un calcul plus simple.
                - Plusieurs méthodes différentes peuvent mener à un même résultat.
                - Le passage à l'unité permet de retrouver une valeur correspondant à 1.
                - Une fraction représente une partie d'une quantité ou une division.
                - 25 % correspond à un quart.
                - Une conversion change l'unité, pas la grandeur réelle.
                - Le périmètre mesure un contour ; l'aire mesure une surface.
                - Un résultat doit être accompagné de la bonne unité.
                - Une démarche expliquée permet de comprendre le raisonnement.
      questions: []
    - id: a14
      titre: Finir la séance
      contenu:
          - type: paragraphe
            texte: Vérifiez que vous avez répondu à toutes les questions que vous pouviez faire.
          - type: paragraphe
            texte: "Une question difficile peut rester incomplète : cette séance sert aussi à identifier ce que nous devons retravailler."
      questions: []
    - id: a15
      titre: Sources et ressources
      contenu:
          - type: liste
            elements:
                - Chlorofil – Classes de 4e et 3e de l'enseignement agricole
                - Éduscol – Les épreuves du DNB
          - type: lien
            titre: Chlorofil – Classes de 4e et 3e de l'enseignement agricole
            url: https://chlorofil.fr/diplomes/secondaire/4e-3e
          - type: lien
            titre: Éduscol – Les épreuves du DNB
            url: https://eduscol.education.gouv.fr/5607/les-epreuves-du-dnb
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
introduction:
    - type: titre
      texte: Ce que vous allez apprendre
    - type: paragraphe
      texte: "Aujourd'hui, nous allons reprendre plusieurs outils mathématiques que vous avez déjà rencontrés : le calcul mental, les nombres relatifs, les fractions, la proportionnalité, les pourcentages, les conversions et quelques notions de géométrie."
    - type: titre
      texte: Ce que vous allez apprendre à faire
    - type: liste
      elements:
          - Effectuer et expliquer des calculs simples.
          - Choisir une méthode adaptée à une situation.
          - Calculer une fraction ou un pourcentage d'une quantité.
          - Utiliser la proportionnalité dans un problème professionnel.
          - Convertir correctement des grandeurs.
          - Retrouver le périmètre et l'aire d'un rectangle.
          - Vérifier si un résultat est cohérent.
    - type: paragraphe
      texte: Pourquoi travailler toutes ces notions ?
    - type: paragraphe
      texte: Dans une exploitation agricole, une écurie ou une entreprise, les mathématiques servent à vérifier une quantité, prévoir un besoin, comparer des valeurs, contrôler un prix ou mesurer une surface.
    - type: paragraphe
      texte: Cette première séance n'est pas une évaluation notée. Elle permet de retrouver vos connaissances et de repérer ce que nous devrons retravailler.
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://chlorofil.fr/diplomes/secondaire/4e-3e

version_papier:
    titre: Fiche papier — Proportionnalité et premiers calculs
    introduction: "Le passage à l’unité ressemble au prix affiché en magasin : on trouve d’abord le prix d’un article, puis on multiplie par le nombre voulu. Tu construis ici les méthodes qui te serviront ensuite au brevet."
    sections:
        - titre: 1. Passer par une unité
          blocs:
              - type: paragraphe
                texte: Si 4 objets coûtent 10 €, on cherche d’abord le prix d’un seul objet.
              - type: etapes
                elements:
                    - "Prix d’un objet : 10 ÷ 4 = 2,50 €."
                    - "Prix de 7 objets : 2,50 × 7 = 17,50 €."
                    - Vérifie que le prix augmente quand le nombre d’objets augmente.
        - titre: 2. Fractions, pourcentages et unités
          blocs:
              - type: paragraphe
                texte: Une fraction d’une quantité peut se calculer en divisant par le dénominateur puis en multipliant par le numérateur.
              - type: etapes
                elements:
                    - 3/4 de 20 = 20 ÷ 4 × 3.
                    - = 5 × 3 = 15.
                    - Pour 20 % d’une quantité, calcule 0,20 × quantité.
        - titre: 3. Géométrie et problème
          blocs:
              - type: paragraphe
                texte: "Le périmètre mesure le tour ; l’aire mesure la surface à couvrir. Comme une clôture et un tapis : la clôture suit le bord, le tapis recouvre le sol."
          questions:
              - Note les données et les unités.
              - Choisis la formule adaptée.
              - Vérifie que ta réponse est une longueur, une aire ou une quantité, selon la question.
        - titre: Je m’entraîne — même méthode que dans le cours
          blocs:
              - type: paragraphe
                texte: Reprends les étapes de l’exemple juste au-dessus. Écris une ligne par étape et garde les unités.
          questions:
              - Si 4 objets coûtent 10 €, calcule le prix d’un objet puis de 7 objets.
              - Calcule 3/4 de 20 et 15 % de 80.
              - Explique avec tes mots ce que mesure un périmètre.
        - titre: Je transfère — une situation nouvelle
          blocs:
              - type: paragraphe
                texte: Cette fois, les nombres ou le contexte changent. Commence par identifier ce que l’on cherche, puis choisis la méthode qui convient.
          questions:
              - Une clôture entoure un rectangle de 12 m sur 8 m. Calcule la longueur de clôture.
              - Un tapis couvre le sol de cette pièce. Calcule la surface à couvrir et donne l’unité.
