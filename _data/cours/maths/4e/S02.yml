titre: Multiples, diviseurs et critères de divisibilité
theme: multiple d'un nombre.
problematique: Multiples, diviseurs et critères de divisibilité
pourquoi: Elles permettent par exemple de préparer des lots identiques, répartir du matériel, organiser des quantités ou vérifier rapidement si un partage exact est possible.
application: Concrètement, qu'est-ce que c'est ? Pour fabriquer plusieurs lots identiques avec deux quantités différentes, le nombre de lots doit diviser exactement les deux quantités.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances: []
    competences: []
activites:
    - id: a02
      titre: Qu'est-ce que c'est ?
      contenu:
          - type: paragraphe
            texte: Ces notions permettent de savoir si une quantité peut être partagée en groupes identiques sans aucun reste.
      questions: []
    - id: a03
      titre: À quoi ça sert ?
      contenu:
          - type: paragraphe
            texte: Elles permettent par exemple de préparer des lots identiques, répartir du matériel, organiser des quantités ou vérifier rapidement si un partage exact est possible.
          - type: titre
            texte: 🐴 Situation équine
          - type: paragraphe
            texte: Une structure équestre possède 24 protections.
          - type: paragraphe
            texte: Elle souhaite préparer des lots identiques sans laisser de protection.
          - type: paragraphe
            texte: Peut-elle préparer 2 lots ? 3 lots ? 4 lots ? 5 lots ? 6 lots ?
          - type: titre
            texte: 🌾 Situation agricole
          - type: paragraphe
            texte: Une exploitation possède 24 sacs.
          - type: paragraphe
            texte: Elle souhaite les répartir entre plusieurs parcelles de façon identique, sans laisser de sac.
          - type: paragraphe
            texte: Peut-elle utiliser 2 parcelles ? 3 parcelles ? 4 parcelles ? 5 parcelles ? 6 parcelles ?
      questions: []
    - id: a04
      titre: "1. Automatismes : préparer les outils"
      contenu:
          - type: paragraphe
            texte: "Notions : multiplication, division et calcul mental."
          - type: paragraphe
            texte: Pourquoi commencer par là ? Les multiples et les diviseurs sont directement liés aux tables de multiplication.
          - type: paragraphe
            texte: "Ce que cet exercice apporte : retrouver rapidement des produits et des divisions exactes avant de travailler sur des nombres plus grands."
          - type: paragraphe
            texte: Calculatrice interdite.
      questions:
          - id: q01
            type: nombre
            enonce: 1. 6 × 8 =
            suite: []
          - id: q02
            type: nombre
            enonce: 2. 72 ÷ 9 =
            suite: []
          - id: q03
            type: nombre
            enonce: 3. 45 ÷ 5 =
            suite: []
          - id: q04
            type: nombre
            enonce: 4. Le quart de 60 =
            suite:
                - type: paragraphe
                  texte: Réflexe DNB
                - type: paragraphe
                  texte: "Lorsqu'une division tombe juste, pensez à l'opération inverse : une multiplication permet souvent de vérifier immédiatement le résultat."
    - id: a05
      titre: 2. Faire apparaître les multiples
      contenu:
          - type: paragraphe
            texte: "Notion : multiple d'un nombre."
          - type: paragraphe
            texte: Concrètement, qu'allons-nous faire ? Nous allons répéter une même quantité plusieurs fois et observer les nombres obtenus.
          - type: paragraphe
            texte: À quoi cela sert ? À reconnaître rapidement les quantités qui peuvent être construites avec des groupes de même taille.
          - type: paragraphe
            texte: Calculatrice interdite.
          - type: titre
            texte: 🐴 Situation équine
          - type: paragraphe
            texte: Chaque cheval reçoit 3 mesures dans cet exercice.
      questions:
          - id: q01
            type: texte
            enonce: 1 cheval → 3 mesures
          - id: q02
            type: texte
            enonce: 2 chevaux → ?
          - id: q03
            type: texte
            enonce: 3 chevaux → ?
          - id: q04
            type: texte
            enonce: 4 chevaux → ?
          - id: q05
            type: texte
            enonce: 5 chevaux → ?
            suite:
                - type: titre
                  texte: 🌾 Situation agricole
                - type: paragraphe
                  texte: Chaque parcelle nécessite 3 sacs dans cet exercice.
          - id: q06
            type: texte
            enonce: 1 parcelle → 3 sacs
          - id: q07
            type: texte
            enonce: 2 parcelles → ?
          - id: q08
            type: texte
            enonce: 3 parcelles → ?
          - id: q09
            type: texte
            enonce: 4 parcelles → ?
          - id: q10
            type: texte
            enonce: 5 parcelles → ?
          - id: q11
            type: texte
            enonce: "Complétez la suite des quantités :"
            suite: []
          - id: q12
            type: texte
            enonce: Que remarquez-vous dans les nombres obtenus ?
            suite:
                - type: paragraphe
                  texte: Ce que l'on vient de découvrir
                - type: paragraphe
                  texte: "Un multiple de 3 est un nombre que l'on peut écrire :"
                - type: paragraphe
                  texte: 3 × un nombre entier.
                - type: paragraphe
                  texte: "Par exemple : 21 = 3 × 7. Donc 21 est un multiple de 3."
    - id: a06
      titre: "Exercice : reconnaître un multiple"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous venons de construire des multiples. Il faut maintenant apprendre à les reconnaître sans refaire toute une liste.
      questions:
          - id: q01
            type: qcm
            enonce: 21 est-il un multiple de 3 ?
            contenu:
                - type: paragraphe
                  texte: "Choix proposés : Oui / Non"
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question.
            choix:
                - id: c1
                  texte: Oui
                - id: c2
                  texte: Non
            suite: []
          - id: q02
            type: qcm
            enonce: 32 est-il un multiple de 5 ?
            contenu:
                - type: paragraphe
                  texte: "Choix proposés : Oui / Non"
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question.
            choix:
                - id: c1
                  texte: Oui
                - id: c2
                  texte: Non
            suite: []
    - id: a07
      titre: "3. Diviseur : regarder la relation dans l'autre sens"
      contenu:
          - type: paragraphe
            texte: "Notions : diviseur et divisibilité."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? Un nombre est un diviseur d'un autre lorsqu'il permet une division exacte, sans reste.
          - type: paragraphe
            texte: À quoi ça sert ? À déterminer quels nombres de groupes identiques sont possibles.
          - type: paragraphe
            texte: Pourquoi changeons-nous de point de vue ?
          - type: paragraphe
            texte: Dire que 24 est un multiple de 6 et dire que 6 divise exactement 24 décrivent en réalité la même relation.
          - type: paragraphe
            texte: Calculatrice interdite.
          - type: paragraphe
            texte: "On sait que :"
          - type: paragraphe
            texte: 24 = 6 × 4
      questions:
          - id: q01
            type: nombre
            enonce: 1. 24 ÷ 6 =
            suite: []
          - id: q02
            type: qcm
            enonce: 6 est-il un diviseur de 24 ?
            contenu:
                - type: paragraphe
                  texte: "Choix proposés : Oui / Non"
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question.
            choix:
                - id: c1
                  texte: Oui
                - id: c2
                  texte: Non
            suite:
                - type: paragraphe
                  texte: Trois phrases pour une même relation
                - type: liste
                  elements:
                      - 24 est un multiple de 6.
                      - 6 est un diviseur de 24.
                      - 24 est divisible par 6.
    - id: a08
      titre: 4. Reconnaître rapidement les divisions par 2, 5 et 10
      contenu:
          - type: paragraphe
            texte: "Notion : critères de divisibilité."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? Un critère de divisibilité est un raccourci permettant de savoir si une division sera exacte sans effectuer cette division.
          - type: paragraphe
            texte: À quoi ça sert ? À contrôler rapidement de grandes quantités.
          - type: paragraphe
            texte: Calculatrice interdite.
          - type: paragraphe
            texte: "Observez :"
          - type: paragraphe
            texte: 42 ; 75 ; 120 ; 243 ; 1 350
      questions:
          - id: q01
            type: texte
            enonce: Quels nombres semblent divisibles par 2 ? Qu'ont-ils en commun ?
            suite: []
          - id: q02
            type: texte
            enonce: Quels nombres semblent divisibles par 5 ? Qu'ont-ils en commun ?
            suite: []
          - id: q03
            type: texte
            enonce: Quels nombres semblent divisibles par 10 ? Qu'ont-ils en commun ?
            suite:
                - type: paragraphe
                  texte: À retenir
                - type: liste
                  elements:
                      - "Divisible par 2 : fin par 0, 2, 4, 6 ou 8."
                      - "Divisible par 5 : fin par 0 ou 5."
                      - "Divisible par 10 : fin par 0."
    - id: a09
      titre: 5. Découvrir les critères de 3 et de 9
      contenu:
          - type: paragraphe
            texte: "Notion : somme des chiffres."
          - type: paragraphe
            texte: Pourquoi changeons-nous de méthode ? Pour 3 et 9, le chiffre des unités ne suffit pas. Il faut observer l'ensemble des chiffres.
          - type: paragraphe
            texte: Calculatrice interdite.
          - type: paragraphe
            texte: "Observons le nombre : 234."
      questions:
          - id: q01
            type: nombre
            enonce: 1. Somme des chiffres de 234 =
            suite: []
          - id: q02
            type: qcm
            enonce: 345 est-il divisible par 3 ?
            contenu:
                - type: paragraphe
                  texte: "Choix proposés : Oui / Non"
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question.
            choix:
                - id: c1
                  texte: Oui
                - id: c2
                  texte: Non
            suite: []
          - id: q03
            type: qcm
            enonce: 2 026 est-il divisible par 9 ?
            contenu:
                - type: paragraphe
                  texte: "Choix proposés : Oui / Non"
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question. Indice 1 Additionnez les chiffres. Indice 2 2 + 0 + 2 + 6 = 10. Indice 3 10 n'est pas divisible par 9.
            choix:
                - id: c1
                  texte: Oui
                - id: c2
                  texte: Non
            suite:
                - type: paragraphe
                  texte: À retenir
                - type: paragraphe
                  texte: Un nombre est divisible par 3 si la somme de ses chiffres est divisible par 3.
                - type: paragraphe
                  texte: Un nombre est divisible par 9 si la somme de ses chiffres est divisible par 9.
    - id: a10
      titre: 6. Choisir le bon critère
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Dans un vrai problème, personne ne vous indique quelle règle utiliser.
          - type: paragraphe
            texte: "Ce que cela vous apporte : apprendre à reconnaître rapidement l'outil adapté à la question."
          - type: paragraphe
            texte: Calculatrice interdite.
      questions:
          - id: q01
            type: texte
            enonce: Pour 450, indiquez s'il est divisible par 2, 3, 5, 9 et 10. Justifiez brièvement.
            suite: []
          - id: q02
            type: texte
            enonce: Pour 1 008, indiquez s'il est divisible par 2, 3 et 9. Justifiez.
            suite: []
    - id: a11
      titre: "7. Situation professionnelle : préparer des lots identiques"
      contenu:
          - type: paragraphe
            texte: "Notion : diviseurs communs."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? Pour fabriquer plusieurs lots identiques avec deux quantités différentes, le nombre de lots doit diviser exactement les deux quantités.
          - type: paragraphe
            texte: À quoi ça sert ? À organiser du matériel ou des produits sans reste et avec des lots identiques.
          - type: paragraphe
            texte: Calculatrice autorisée.
          - type: titre
            texte: 🐴 Situation équine
          - type: paragraphe
            texte: "Une structure dispose de :"
          - type: liste
            elements:
                - 48 bandes ;
                - 36 protections.
          - type: paragraphe
            texte: Elle veut préparer des lots strictement identiques sans laisser de matériel.
          - type: titre
            texte: 🌾 Situation agricole
          - type: paragraphe
            texte: "Une exploitation dispose de :"
          - type: liste
            elements:
                - 48 sacs d'un premier produit ;
                - 36 sacs d'un second produit.
          - type: paragraphe
            texte: Elle veut préparer des lots strictement identiques sans laisser de sac.
      questions:
          - id: q01
            type: texte
            enonce: Parmi 2, 3, 4, 5 et 6, quels nombres de lots sont possibles ? Justifiez.
            suite: []
          - id: q02
            type: nombre
            enonce: Plus grand nombre de lots identiques possible =
            aide: Indice 1 Cherchez les diviseurs de 48 et de 36. Indice 2 Cherchez les nombres présents dans les deux listes. Indice 3 12 divise exactement 48 et 36.
            suite:
                - type: paragraphe
                  texte: Ce que l'on découvre
                - type: paragraphe
                  texte: Un diviseur commun est un nombre qui divise exactement plusieurs nombres.
    - id: a12
      titre: "8. Défi DNB : un code à trois chiffres"
      contenu:
          - type: paragraphe
            texte: Calculatrice interdite.
          - type: paragraphe
            texte: Un code est un nombre à trois chiffres.
          - type: paragraphe
            texte: "On sait que :"
          - type: liste
            elements:
                - il est compris entre 300 et 400 ;
                - il est divisible par 5 ;
                - il est divisible par 9 ;
                - son chiffre des dizaines est 1.
      questions:
          - id: q01
            type: nombre
            enonce: Quel est le code ?
            aide: Indice 1 Le code commence par 3 et son chiffre des dizaines est 1. Indice 2 Comme il est divisible par 5, son dernier chiffre vaut 0 ou 5. Indice 3 Testez 310 et 315 avec le critère de divisibilité par 9.
            suite: []
          - id: q02
            type: texte
            enonce: Expliquez comment vous avez éliminé les autres possibilités.
            suite:
                - type: paragraphe
                  texte: Réflexe DNB
                - type: paragraphe
                  texte: Dans un problème contenant plusieurs informations, utilisez-les une par une pour éliminer progressivement les réponses impossibles.
    - id: a13
      titre: 9. Mon bilan
      contenu:
          - type: paragraphe
            texte: Pourquoi cette dernière étape ? Elle permet de vérifier que vous ne connaissez pas seulement des règles par cœur, mais que vous savez aussi choisir celle qui convient.
      questions:
          - id: q01
            type: texte
            enonce: Expliquez avec vos mots la différence entre un multiple et un diviseur.
            suite: []
          - id: q02
            type: texte
            enonce: Parmi les critères de 2, 3, 5, 9 et 10, lequel vous semble le plus facile à reconnaître ? Expliquez pourquoi.
            suite: []
    - id: a14
      titre: À retenir
      contenu:
          - type: liste
            elements:
                - Si A = B × un entier, alors A est un multiple de B.
                - Si A ÷ B est exacte, alors B est un diviseur de A.
                - A est alors divisible par B.
                - "Divisible par 2 : dernier chiffre 0, 2, 4, 6 ou 8."
                - "Divisible par 5 : dernier chiffre 0 ou 5."
                - "Divisible par 10 : dernier chiffre 0."
                - "Divisible par 3 : somme des chiffres divisible par 3."
                - "Divisible par 9 : somme des chiffres divisible par 9."
                - Un diviseur commun divise exactement plusieurs nombres.
      questions: []
    - id: a15
      titre: Finir la séance
      contenu:
          - type: paragraphe
            texte: Vérifiez vos réponses et les justifications demandées.
      questions: []
    - id: a16
      titre: Références générales
      contenu:
          - type: liste
            elements:
                - Chlorofil – Classes de 4e et 3e de l'enseignement agricole
                - Éduscol – Les épreuves du DNB
          - type: lien
            titre: Chlorofil – Classes de 4e et 3e de l'enseignement agricole
            url: https://chlorofil.fr/diplomes/secondaire/4e-3e
