version_papier:
    titre: Fiche papier — Multiples, diviseurs et divisibilité
    introduction: Un multiple, c’est un résultat de table de multiplication. Un diviseur, c’est un nombre qui partage exactement une quantité, sans reste. Tu construis ici les méthodes qui te serviront ensuite au brevet.
    sections:
        - titre: 1. Multiple et diviseur
          blocs:
              - type: paragraphe
                texte: Dans 24 = 6 × 4, 24 est un multiple de 6 et de 4. En même temps, 6 et 4 sont des diviseurs de 24.
              - type: etapes
                elements:
                    - Pour savoir si 42 est multiple de 6, je cherche 6 × un nombre.
                    - "6 × 7 = 42 : oui, 42 est un multiple de 6."
                    - Donc 6 est un diviseur de 42.
        - titre: 2. Critères rapides
          blocs:
              - type: liste
                elements:
                    - "Divisible par 2 : le chiffre des unités est 0, 2, 4, 6 ou 8."
                    - "Divisible par 5 : le chiffre des unités est 0 ou 5."
                    - "Divisible par 10 : le chiffre des unités est 0."
                    - "Divisible par 3 : la somme des chiffres est un multiple de 3."
                    - "Divisible par 9 : la somme des chiffres est un multiple de 9."
        - titre: 3. Faire des lots identiques
          blocs:
              - type: paragraphe
                texte: Pour faire le plus grand nombre de lots identiques sans reste, cherche un diviseur commun aux quantités.
              - type: etapes
                elements:
                    - Écris chaque quantité sous forme de produit ou liste ses diviseurs.
                    - Repère les diviseurs communs.
                    - Choisis le plus grand si l’énoncé demande le maximum.
                    - Vérifie qu’il ne reste rien.
        - titre: Je m’entraîne — même méthode que dans le cours
          blocs:
              - type: paragraphe
                texte: Reprends les étapes de l’exemple juste au-dessus. Écris une ligne par étape et garde les unités.
          questions:
              - Vérifie si 450 est divisible par 2, 3, 5, 9 et 10 en justifiant chaque critère.
              - Donne les diviseurs positifs de 18.
              - Explique pourquoi 24 est multiple de 6 et pourquoi 6 divise 24.
        - titre: Je transfère — une situation nouvelle
          blocs:
              - type: paragraphe
                texte: Cette fois, les nombres ou le contexte changent. Commence par identifier ce que l’on cherche, puis choisis la méthode qui convient.
          questions:
              - On veut répartir 42 pommes dans des lots identiques, sans reste. Donne plusieurs tailles possibles de lot.
              - Un code est divisible par 9 si la somme de ses chiffres vérifie quel critère ? Explique avec un exemple.
