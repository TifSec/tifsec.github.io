titre: Multiplier et diviser des fractions
theme: produit d'une fraction par un nombre.
problematique: Multiplier et diviser des fractions
pourquoi: Dans un exercice mathématique simplifié, un stock contient 24 kg d'un aliment.
application: Dans un exercice mathématique simplifié, une structure dispose de 24 kg d'un produit.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances: []
    competences: []
activites:
    - id: a02
      titre: Qu'est-ce que cela signifie ?
      contenu:
          - type: paragraphe
            texte: Multiplier par une fraction permet notamment de prendre une partie d'une autre quantité.
          - type: paragraphe
            texte: Diviser par une fraction permet notamment de chercher combien de fois une certaine fraction est contenue dans une quantité.
      questions: []
    - id: a03
      titre: À quoi ça sert ?
      contenu:
          - type: paragraphe
            texte: "Ces opérations permettent par exemple :"
          - type: liste
            elements:
                - de calculer une fraction d'une quantité ;
                - de calculer une fraction d'une autre fraction ;
                - de déterminer combien de portions peuvent être préparées ;
                - de résoudre certains problèmes de partage ou de proportion.
          - type: titre
            texte: 🐴 Situation équine
          - type: paragraphe
            texte: Dans un exercice mathématique simplifié, un stock contient 24 kg d'un aliment.
          - type: paragraphe
            texte: On utilise 3/4 de ce stock.
          - type: paragraphe
            texte: Quelle quantité cela représente-t-il ?
          - type: titre
            texte: 🌾 Situation agricole
          - type: paragraphe
            texte: Une réserve contient 24 kg d'un produit.
          - type: paragraphe
            texte: On utilise 3/4 de cette réserve.
          - type: paragraphe
            texte: Quelle quantité cela représente-t-il ?
      questions: []
    - id: a04
      titre: "1. Automatismes : retrouver une fraction d'une quantité"
      contenu:
          - type: paragraphe
            texte: Pourquoi commencer par cet exercice ? Vous savez déjà calculer une moitié, un quart ou quelques fractions simples d'une quantité.
          - type: paragraphe
            texte: "Ce que cela vous apporte : retrouver le sens de « prendre une fraction de » avant d'écrire une nouvelle règle."
          - type: paragraphe
            texte: Calculatrice interdite.
      questions:
          - id: q01
            type: nombre
            enonce: 1. La moitié de 18 =
            suite: []
          - id: q02
            type: nombre
            enonce: 2. Le quart de 28 =
            suite: []
          - id: q03
            type: nombre
            enonce: 3. Les 3/4 de 20 =
            suite: []
          - id: q04
            type: nombre
            enonce: 4. Les 2/3 de 18 =
            suite:
                - type: paragraphe
                  texte: Réflexe DNB
                - type: paragraphe
                  texte: Pour calculer une fraction simple d'une quantité, vous pouvez souvent diviser d'abord par le dénominateur, puis multiplier par le numérateur.
    - id: a05
      titre: 2. Multiplier une fraction par un nombre
      contenu:
          - type: paragraphe
            texte: "Notion : produit d'une fraction par un nombre."
          - type: paragraphe
            texte: "Concrètement, qu'est-ce que c'est ? Calculer 3/4 de 20 revient à écrire :"
          - type: paragraphe
            texte: 3/4 × 20
          - type: paragraphe
            texte: À quoi cela sert ? À transformer une phrase « une fraction de... » en calcul mathématique.
          - type: paragraphe
            texte: Calculatrice interdite.
      questions:
          - id: q01
            type: texte
            enonce: "Écrivez puis calculez : 3/5 de 25."
            suite: []
          - id: q02
            type: texte
            enonce: "Calculez : 5/6 × 18."
            suite:
                - type: paragraphe
                  texte: À comprendre
                - type: paragraphe
                  texte: "L'expression « 3/5 de 25 » peut s'écrire :"
                - type: paragraphe
                  texte: 3/5 × 25
    - id: a06
      titre: 3. Multiplier deux fractions
      contenu:
          - type: paragraphe
            texte: "Notion : produit de deux fractions."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? Nous allons calculer une fraction d'une autre fraction.
          - type: paragraphe
            texte: "Exemple : prendre la moitié des 3/4 d'une quantité."
          - type: paragraphe
            texte: "Cela s'écrit :"
          - type: paragraphe
            texte: 1/2 × 3/4
          - type: paragraphe
            texte: Calculatrice interdite.
      questions:
          - id: q01
            type: texte
            enonce: "Calculez : 1/2 × 3/4. Indice 1 Multipliez les nombres du haut ensemble puis les nombres du bas ensemble. Indice 2 Numérateur : 1 × 3. Indice 3 Dénominateur : 2 × 4."
            aide: "Indice 1 Multipliez les nombres du haut ensemble puis les nombres du bas ensemble. Indice 2 Numérateur : 1 × 3. Indice 3 Dénominateur : 2 × 4."
            suite:
                - type: paragraphe
                  texte: Règle
                - type: paragraphe
                  texte: "Pour multiplier deux fractions :"
                - type: paragraphe
                  texte: a/b × c/d = (a × c)/(b × d)
                - type: paragraphe
                  texte: On multiplie les numérateurs entre eux et les dénominateurs entre eux.
    - id: a07
      titre: "Exercice : appliquer la méthode"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Il faut maintenant vérifier que vous savez appliquer la règle et simplifier le résultat.
      questions:
          - id: q01
            type: texte
            enonce: "Calculez et simplifiez : 2/3 × 3/5 ; 4/7 × 1/2 ; 3/4 × 2/9."
            suite: []
    - id: a08
      titre: 4. Comprendre ce que signifie diviser par une fraction
      contenu:
          - type: paragraphe
            texte: "Notion : division par une fraction."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? Diviser par une fraction peut revenir à chercher combien de fois cette fraction est contenue dans une quantité.
          - type: paragraphe
            texte: À quoi cela sert ? À déterminer un nombre de portions ou de groupes de même taille.
          - type: paragraphe
            texte: Calculatrice interdite.
      questions:
          - id: q01
            type: texte
            enonce: "Combien de quarts y a-t-il dans 1 unité entière ? Écrivez ensuite le calcul : 1 ÷ 1/4."
            suite: []
          - id: q02
            type: texte
            enonce: "Combien de moitiés y a-t-il dans 3 unités ? Écrivez ensuite : 3 ÷ 1/2."
            suite:
                - type: paragraphe
                  texte: Observation
                - type: paragraphe
                  texte: Diviser par 1/2 revient ici à multiplier par 2.
                - type: paragraphe
                  texte: Diviser par 1/4 revient ici à multiplier par 4.
    - id: a09
      titre: 5. L'inverse d'un nombre
      contenu:
          - type: paragraphe
            texte: "Notion : inverse."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? Deux nombres sont inverses lorsque leur produit vaut 1.
          - type: paragraphe
            texte: "Par exemple :"
          - type: paragraphe
            texte: 2/3 × 3/2 = 1
          - type: paragraphe
            texte: Donc l'inverse de 2/3 est 3/2.
          - type: paragraphe
            texte: Calculatrice interdite.
      questions:
          - id: q01
            type: texte
            enonce: "Donnez l'inverse de : 3/5 ; 7/2 ; 4."
            suite: []
          - id: q02
            type: texte
            enonce: Vérifiez que 5/3 est bien l'inverse de 3/5.
            suite:
                - type: paragraphe
                  texte: À retenir
                - type: paragraphe
                  texte: L'inverse de a/b est b/a, avec a et b non nuls.
    - id: a10
      titre: 6. Diviser deux fractions
      contenu:
          - type: paragraphe
            texte: "Notion : quotient de fractions."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? Diviser par une fraction revient à multiplier par son inverse.
          - type: paragraphe
            texte: À quoi cela sert ? À transformer une division de fractions en multiplication, que nous savons maintenant effectuer.
          - type: paragraphe
            texte: Calculatrice interdite.
          - type: paragraphe
            texte: Règle
          - type: paragraphe
            texte: a/b ÷ c/d = a/b × d/c
          - type: paragraphe
            texte: On conserve la première fraction et on multiplie par l'inverse de la deuxième.
      questions:
          - id: q01
            type: texte
            enonce: "Calculez : 3/4 ÷ 1/2. Indice 1 Cherchez l'inverse de 1/2. Indice 2 L'inverse de 1/2 est 2/1. Indice 3 Calculez : 3/4 × 2/1."
            aide: "Indice 1 Cherchez l'inverse de 1/2. Indice 2 L'inverse de 1/2 est 2/1. Indice 3 Calculez : 3/4 × 2/1."
            suite: []
          - id: q02
            type: texte
            enonce: "Calculez et simplifiez : 2/3 ÷ 4/5 ; 5/6 ÷ 5/12."
            suite: []
    - id: a11
      titre: "7. Situation professionnelle : utiliser un stock"
      contenu:
          - type: paragraphe
            texte: Calculatrice autorisée.
          - type: titre
            texte: 🐴 Situation équine
          - type: paragraphe
            texte: Dans un exercice mathématique simplifié, une structure dispose de 24 kg d'un produit.
          - type: paragraphe
            texte: Elle utilise 3/4 du stock.
          - type: paragraphe
            texte: La quantité utilisée est ensuite répartie en portions de 3/2 kg.
          - type: titre
            texte: 🌾 Situation agricole
          - type: paragraphe
            texte: Une exploitation dispose de 24 kg d'un produit.
          - type: paragraphe
            texte: Elle utilise 3/4 du stock.
          - type: paragraphe
            texte: Cette quantité est ensuite répartie en portions de 3/2 kg.
      questions:
          - id: q01
            type: texte
            enonce: 1. Quelle masse représente 3/4 de 24 kg ?
            suite: []
          - id: q02
            type: texte
            enonce: 2. Combien de portions de 3/2 kg peut-on préparer avec les 18 kg utilisés ? Indice 1 Écrivez 18 sous la forme 18/1. Indice 2 L'inverse de 3/2 est 2/3. Indice 3 18/1 × 2/3.
            aide: Indice 1 Écrivez 18 sous la forme 18/1. Indice 2 L'inverse de 3/2 est 2/3. Indice 3 18/1 × 2/3.
            suite: []
          - id: q03
            type: texte
            enonce: 3. Expliquez pourquoi la première question utilise une multiplication alors que la deuxième utilise une division.
            suite: []
    - id: a12
      titre: "8. Défi DNB : une réserve d'eau"
      contenu:
          - type: paragraphe
            texte: Calculatrice autorisée.
          - type: paragraphe
            texte: Un réservoir contient 30 L d'eau.
          - type: paragraphe
            texte: On utilise d'abord 2/5 du contenu.
          - type: paragraphe
            texte: L'eau utilisée est répartie dans des récipients contenant chacun 3/4 L.
      questions:
          - id: q01
            type: texte
            enonce: 1. Quelle quantité d'eau est utilisée ?
            suite: []
          - id: q02
            type: texte
            enonce: 2. Combien de récipients de 3/4 L peut-on remplir complètement ? Indice 1 Écrivez la division correspondant au nombre de récipients. Indice 2 Diviser par 3/4 revient à multiplier par 4/3. Indice 3 12 × 4/3.
            aide: Indice 1 Écrivez la division correspondant au nombre de récipients. Indice 2 Diviser par 3/4 revient à multiplier par 4/3. Indice 3 12 × 4/3.
            suite: []
          - id: q03
            type: texte
            enonce: 3. Combien de litres restent dans le réservoir ?
            suite: []
          - id: q04
            type: texte
            enonce: 4. Vérifiez votre résultat de la question 2 par un calcul différent.
            suite:
                - type: paragraphe
                  texte: Réflexe DNB
                - type: paragraphe
                  texte: "Dans un problème en plusieurs étapes, identifiez d'abord ce que chaque question demande : prendre une fraction, partager, soustraire ou vérifier."
    - id: a13
      titre: 9. Mon bilan
      contenu:
          - type: paragraphe
            texte: Pourquoi cette dernière étape ? Pour vérifier que vous savez distinguer les deux nouvelles opérations et expliquer les règles.
      questions:
          - id: q01
            type: texte
            enonce: Expliquez comment multiplier deux fractions.
            suite: []
          - id: q02
            type: texte
            enonce: Expliquez comment diviser par une fraction.
            suite: []
          - id: q03
            type: texte
            enonce: Quelle différence faites-vous entre l'opposé et l'inverse d'un nombre ?
            suite: []
    - id: a14
      titre: À retenir
      contenu:
          - type: liste
            elements:
                - Calculer une fraction d'une quantité peut s'écrire comme une multiplication.
                - Pour multiplier deux fractions, on multiplie les numérateurs entre eux et les dénominateurs entre eux.
                - On simplifie le résultat lorsque c'est possible.
                - Deux nombres inverses ont un produit égal à 1.
                - L'inverse de a/b est b/a, lorsque a et b sont non nuls.
                - Diviser par une fraction revient à multiplier par son inverse.
                - L'inverse et l'opposé sont deux notions différentes.
                - Avant de calculer, il faut déterminer si la situation demande une multiplication ou une division.
      questions: []
    - id: a15
      titre: Finir la séance
      contenu:
          - type: paragraphe
            texte: Vérifiez vos calculs, vos simplifications et les inverses utilisés.
      questions: []
