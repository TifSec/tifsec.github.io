version_papier:
    titre: Fiche papier — Multiplier et diviser des fractions
    introduction: Multiplier une fraction par une quantité permet de prendre une part. Diviser par une fraction permet de compter combien de parts de cette taille tiennent dans la quantité. Tu construis ici les méthodes qui te serviront ensuite au brevet.
    sections:
        - titre: 1. Prendre une fraction d’une quantité
          blocs:
              - type: paragraphe
                texte: Pour calculer 3/5 de 25, partage d’abord 25 en 5 parts, puis prends-en 3.
              - type: etapes
                elements:
                    - 25 ÷ 5 = 5.
                    - 5 × 3 = 15.
                    - Donc 3/5 de 25 = 15.
        - titre: 2. Multiplier deux fractions
          blocs:
              - type: paragraphe
                texte: Multiplie les numérateurs entre eux et les dénominateurs entre eux, puis simplifie.
              - type: etapes
                elements:
                    - 1/2 × 3/4 = (1 × 3)/(2 × 4).
                    - = 3/8.
        - titre: 3. Diviser par une fraction
          blocs:
              - type: paragraphe
                texte: Diviser par 1/2 revient à compter combien de moitiés entrent dans le nombre. On multiplie donc par l’inverse de la deuxième fraction.
              - type: etapes
                elements:
                    - 3/4 ÷ 1/2.
                    - L’inverse de 1/2 est 2/1.
                    - 3/4 × 2/1 = 6/4 = 3/2.
        - titre: 4. Ne pas confondre
          blocs:
              - type: paragraphe
                texte: "L’opposé change le signe : l’opposé de 3/5 est −3/5. L’inverse échange haut et bas : l’inverse de 3/5 est 5/3. Leur produit vaut 1."
          questions:
              - Indique si chaque situation demande une multiplication ou une division.
              - Écris la ligne de calcul puis simplifie le résultat.
        - titre: Je m’entraîne — même méthode que dans le cours
          blocs:
              - type: paragraphe
                texte: Reprends les étapes de l’exemple juste au-dessus. Écris une ligne par étape et garde les unités.
          questions:
              - Calcule 3/5 de 25 en partageant d’abord en 5 parts.
              - Calcule 1/2 × 3/4.
              - Calcule 3/4 ÷ 1/2 en écrivant l’inverse.
        - titre: Je transfère — une situation nouvelle
          blocs:
              - type: paragraphe
                texte: Cette fois, les nombres ou le contexte changent. Commence par identifier ce que l’on cherche, puis choisis la méthode qui convient.
          questions:
              - Une réserve de 24 L est répartie dans des bouteilles de 3/4 L. Combien de bouteilles complètes peut-on remplir ?
              - Donne l’opposé puis l’inverse de 3/5 et explique la différence.
