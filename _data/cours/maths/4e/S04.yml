version_papier:
    titre: Fiche papier — Simplifier et comparer des fractions
    introduction: Une fraction est une division et une part d’un tout. Pour comparer deux parts, il faut les exprimer avec des parts de même taille. Tu construis ici les méthodes qui te serviront ensuite au brevet.
    sections:
        - titre: 1. Simplifier une fraction
          blocs:
              - type: paragraphe
                texte: "On divise le numérateur et le dénominateur par le même nombre. La valeur ne change pas : on coupe chaque part en plus gros morceaux."
              - type: etapes
                elements:
                    - "12/18 : le haut et le bas sont divisibles par 6."
                    - 12 ÷ 6 = 2 et 18 ÷ 6 = 3.
                    - Donc 12/18 = 2/3.
        - titre: 2. Comparer
          blocs:
              - type: paragraphe
                texte: "Même dénominateur : compare les numérateurs. Même numérateur : la fraction avec le plus petit dénominateur est la plus grande. Si tout est différent, cherche un dénominateur commun."
        - titre: 3. Exemple avec deux dénominateurs différents
          blocs:
              - type: paragraphe
                texte: Pour comparer 2/3 et 3/4, on transforme les deux fractions en douzièmes.
              - type: etapes
                elements:
                    - 3 et 4 ont 12 comme multiple commun.
                    - 2/3 = 2 × 4 / 3 × 4 = 8/12.
                    - 3/4 = 3 × 3 / 4 × 3 = 9/12.
                    - 9/12 > 8/12, donc 3/4 > 2/3.
        - titre: Je m’entraîne — même méthode que dans le cours
          blocs:
              - type: paragraphe
                texte: Reprends les étapes de l’exemple juste au-dessus. Écris une ligne par étape et garde les unités.
          questions:
              - Simplifie 18/24 et écris le diviseur utilisé.
              - Compare 3/4 et 5/8 en les transformant en huitièmes.
              - Explique ce que représentent le numérateur et le dénominateur.
        - titre: Je transfère — une situation nouvelle
          blocs:
              - type: paragraphe
                texte: Cette fois, les nombres ou le contexte changent. Commence par identifier ce que l’on cherche, puis choisis la méthode qui convient.
          questions:
              - Compare 5/6 et 7/9 avec un dénominateur commun.
              - Deux réservoirs sont remplis à 7/10 et 2/3. Lequel contient la plus grande proportion ? Justifie.
