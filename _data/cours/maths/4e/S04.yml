titre: Comprendre, simplifier et comparer des fractions
theme: numérateur et dénominateur.
problematique: Comprendre, simplifier et comparer des fractions
pourquoi: Les fractions permettent de décrire une proportion, comparer des quantités, répartir une surface ou exprimer une partie d'un ensemble.
application: Dans un exercice mathématique simplifié, on compare la proportion d'un même élément dans deux rations.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances: []
    competences: []
activites:
    - id: a02
      titre: Qu'est-ce qu'une fraction ?
      contenu:
          - type: paragraphe
            texte: Une fraction permet de représenter une partie d'une quantité, mais aussi un nombre ou une division.
          - type: paragraphe
            texte: "Par exemple, 3/5 peut se lire : « trois cinquièmes » ou « 3 divisé par 5 »."
      questions: []
    - id: a03
      titre: À quoi ça sert ?
      contenu:
          - type: paragraphe
            texte: Les fractions permettent de décrire une proportion, comparer des quantités, répartir une surface ou exprimer une partie d'un ensemble.
          - type: paragraphe
            texte: Elles sont aussi très utilisées dans les calculs de pourcentages, les proportions et les problèmes du DNB.
          - type: titre
            texte: 🐴 Situation équine
          - type: paragraphe
            texte: Dans un exercice mathématique simplifié, une ration est divisée en 5 parts égales.
          - type: paragraphe
            texte: Un aliment représente 3 de ces 5 parts.
          - type: paragraphe
            texte: "Cette proportion peut s'écrire : 3/5."
          - type: titre
            texte: 🌾 Situation agricole
          - type: paragraphe
            texte: Une parcelle est divisée en 5 zones de même surface.
          - type: paragraphe
            texte: 3 zones sont consacrées à une même culture.
          - type: paragraphe
            texte: "Cette proportion peut s'écrire : 3/5."
      questions: []
    - id: a04
      titre: "1. Automatismes : réactiver les outils utiles"
      contenu:
          - type: paragraphe
            texte: "Notions : division, divisibilité et facteurs communs."
          - type: paragraphe
            texte: Pourquoi commencer par là ? Pour simplifier une fraction, il faut être capable de repérer un nombre qui divise le numérateur et le dénominateur.
          - type: paragraphe
            texte: Calculatrice interdite.
      questions:
          - id: q01
            type: nombre
            enonce: 1. 72 ÷ 8 =
            suite: []
          - id: q02
            type: qcm
            enonce: 54 est-il divisible par 3 ?
            contenu:
                - type: paragraphe
                  texte: "Choix proposés : Oui / Non"
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question.
            choix:
                - id: c1
                  texte: Oui
                - id: c2
                  texte: Non
            suite: []
          - id: q03
            type: texte
            enonce: Simplifiez 12/18 en divisant le numérateur et le dénominateur par 6.
            suite:
                - type: paragraphe
                  texte: Réflexe DNB
                - type: paragraphe
                  texte: Avant de calculer avec une fraction, observez si le numérateur et le dénominateur ont un diviseur commun.
    - id: a05
      titre: 2. Comprendre ce que représente une fraction
      contenu:
          - type: paragraphe
            texte: "Notion : numérateur et dénominateur."
          - type: paragraphe
            texte: Concrètement, qu'allons-nous faire ? Nous allons partir d'un ensemble partagé en parts égales.
          - type: paragraphe
            texte: À quoi cela sert ? À comprendre le sens des deux nombres d'une fraction avant de commencer à calculer avec.
          - type: paragraphe
            texte: Calculatrice interdite.
          - type: paragraphe
            texte: Une quantité entière est partagée en 8 parts égales.
          - type: paragraphe
            texte: On en prend 3.
      questions:
          - id: q01
            type: nombre
            enonce: Nombre total de parts =
            suite: []
          - id: q02
            type: nombre
            enonce: Nombre de parts prises =
            suite: []
          - id: q03
            type: texte
            enonce: Écrivez la fraction correspondant à la partie prise et celle correspondant à la partie restante.
            suite:
                - type: paragraphe
                  texte: Ce que l'on vient de découvrir
                - type: paragraphe
                  texte: "Dans 3/8 :"
                - type: liste
                  elements:
                      - "3 est le numérateur : nombre de parts considérées ;"
                      - "8 est le dénominateur : nombre total de parts égales."
    - id: a06
      titre: 3. Une fraction est aussi une division
      contenu:
          - type: paragraphe
            texte: "Notion : fraction-quotient."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? La barre de fraction peut être remplacée par le signe de division.
          - type: paragraphe
            texte: À quoi cela sert ? À relier fractions et nombres décimaux et à comparer certaines valeurs plus facilement.
          - type: paragraphe
            texte: Calculatrice interdite.
      questions:
          - id: q01
            type: nombre
            enonce: 1/2 = 1 ÷ 2 =
            suite: []
          - id: q02
            type: nombre
            enonce: 3/4 = 3 ÷ 4 =
            suite: []
          - id: q03
            type: nombre
            enonce: 5/2 = 5 ÷ 2 =
            suite:
                - type: paragraphe
                  texte: À comprendre
                - type: paragraphe
                  texte: Une fraction est un nombre.
                - type: paragraphe
                  texte: Elle peut être inférieure à 1, égale à 1 ou supérieure à 1.
    - id: a07
      titre: 4. Découvrir les fractions équivalentes
      contenu:
          - type: paragraphe
            texte: "Notion : fractions équivalentes."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? Deux fractions sont équivalentes lorsqu'elles ont des écritures différentes mais représentent le même nombre.
          - type: paragraphe
            texte: À quoi ça sert ? À simplifier des fractions ou à les transformer pour pouvoir les comparer et calculer.
          - type: paragraphe
            texte: Calculatrice interdite.
          - type: paragraphe
            texte: "Observez :"
          - type: paragraphe
            texte: 1/2 ; 2/4 ; 3/6 ; 4/8
      questions:
          - id: q01
            type: texte
            enonce: Que remarquez-vous si vous calculez la valeur de ces quatre fractions ?
            suite: []
          - id: q02
            type: texte
            enonce: "Complétez : 1/2 = 2/... ; 1/2 = .../10 ; 3/4 = 6/... Indice 1 Regardez par combien le numérateur a été multiplié. Indice 2 Il faut effectuer la même multiplication au numérateur et au dénominateur. Indice 3 1/2 = 2/4 1/2 = 5/10 3/4 = 6/8"
            aide: Indice 1 Regardez par combien le numérateur a été multiplié. Indice 2 Il faut effectuer la même multiplication au numérateur et au dénominateur. Indice 3 1/2 = 2/4 1/2 = 5/10 3/4 = 6/8
            suite:
                - type: paragraphe
                  texte: Règle
                - type: paragraphe
                  texte: On obtient une fraction équivalente en multipliant le numérateur et le dénominateur par le même nombre non nul.
    - id: a08
      titre: 5. Simplifier une fraction
      contenu:
          - type: paragraphe
            texte: "Notion : simplification et fraction irréductible."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? Simplifier une fraction, c'est l'écrire avec des nombres plus petits sans changer sa valeur.
          - type: paragraphe
            texte: À quoi ça sert ? À obtenir une écriture plus simple et à faciliter les calculs suivants.
          - type: paragraphe
            texte: Pourquoi cet exercice ?
          - type: paragraphe
            texte: "À la séance précédente, nous avons trouvé :"
          - type: paragraphe
            texte: 18/24 = 3/4.
          - type: paragraphe
            texte: Nous allons maintenant généraliser cette méthode.
          - type: paragraphe
            texte: Calculatrice interdite.
      questions:
          - id: q01
            type: texte
            enonce: "Simplifiez : 8/12 ; 10/15 ; 12/16 ; 15/25. Indice 1 Cherchez un diviseur commun au numérateur et au dénominateur. Indice 2 Testez 2, 3, 4 ou 5. Indice 3 8/12 : diviser par 4. 10/15 : diviser par 5. 12/16 : diviser par 4. 15/25 : diviser par 5."
            aide: "Indice 1 Cherchez un diviseur commun au numérateur et au dénominateur. Indice 2 Testez 2, 3, 4 ou 5. Indice 3 8/12 : diviser par 4. 10/15 : diviser par 5. 12/16 : diviser par 4. 15/25 : diviser par 5."
            suite: []
          - id: q02
            type: texte
            enonce: Parmi 2/3, 4/6, 5/7 et 15/20, quelles fractions sont déjà irréductibles ?
            suite:
                - type: paragraphe
                  texte: À retenir
                - type: paragraphe
                  texte: Pour simplifier une fraction, on divise le numérateur et le dénominateur par le même diviseur commun.
                - type: paragraphe
                  texte: Lorsqu'on ne peut plus simplifier, la fraction est irréductible.
    - id: a09
      titre: 6. Comparer des fractions
      contenu:
          - type: paragraphe
            texte: "Notion : ordre et comparaison de fractions."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? Comparer deux fractions, c'est déterminer laquelle représente la plus grande quantité.
          - type: paragraphe
            texte: À quoi ça sert ? À comparer deux proportions, deux surfaces ou deux répartitions.
          - type: paragraphe
            texte: Calculatrice interdite.
      questions: []
    - id: a10
      titre: "Cas 1 : même dénominateur"
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: "Comparez : 3/8 et 5/8 ; 7/10 et 4/10."
            suite: []
    - id: a11
      titre: "Cas 2 : même numérateur"
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: "Comparez : 1/2 et 1/4 ; 3/5 et 3/8."
            suite: []
    - id: a12
      titre: "Cas 3 : tout est différent"
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Comparez 2/3 et 3/4 en les écrivant avec le même dénominateur. Indice 1 Cherchez un multiple commun de 3 et de 4. Indice 2 12 est un multiple commun. Indice 3 2/3 = 8/12 3/4 = 9/12
            aide: Indice 1 Cherchez un multiple commun de 3 et de 4. Indice 2 12 est un multiple commun. Indice 3 2/3 = 8/12 3/4 = 9/12
            suite:
                - type: paragraphe
                  texte: Choisir la méthode la plus simple
                - type: liste
                  elements:
                      - Même dénominateur → comparer les numérateurs.
                      - Même numérateur positif → comparer la taille des parts.
                      - Tout est différent → utiliser des fractions équivalentes.
    - id: a13
      titre: "7. Situation professionnelle : comparer deux proportions"
      contenu:
          - type: paragraphe
            texte: Calculatrice autorisée.
          - type: titre
            texte: 🐴 Situation équine
          - type: paragraphe
            texte: Dans un exercice mathématique simplifié, on compare la proportion d'un même élément dans deux rations.
          - type: liste
            elements:
                - "Ration A : 3/5"
                - "Ration B : 7/10"
          - type: titre
            texte: 🌾 Situation agricole
          - type: paragraphe
            texte: On compare la proportion d'une même culture sur deux parcelles.
          - type: liste
            elements:
                - "Parcelle A : 3/5"
                - "Parcelle B : 7/10"
      questions:
          - id: q01
            type: texte
            enonce: Transformez 3/5 en une fraction de dénominateur 10, comparez les deux fractions puis rédigez une phrase de conclusion.
            suite:
                - type: paragraphe
                  texte: Réflexe DNB
                - type: paragraphe
                  texte: "Dans un problème, un calcul seul ne suffit pas : terminez par une phrase répondant à la question posée."
    - id: a14
      titre: "8. Défi DNB : choisir le meilleur parcours"
      contenu:
          - type: paragraphe
            texte: Calculatrice interdite.
          - type: paragraphe
            texte: "Lors d'un parcours, deux élèves ont déjà effectué :"
          - type: liste
            elements:
                - "Élève A : 5/8 du parcours ;"
                - "Élève B : 2/3 du parcours."
      questions:
          - id: q01
            type: texte
            enonce: Qui a parcouru la plus grande proportion ? Justifiez avec des fractions ayant le même dénominateur. Indice 1 Cherchez un multiple commun de 8 et de 3. Indice 2 24 convient. Indice 3 5/8 = 15/24 2/3 = 16/24
            aide: Indice 1 Cherchez un multiple commun de 8 et de 3. Indice 2 24 convient. Indice 3 5/8 = 15/24 2/3 = 16/24
            suite: []
          - id: q02
            type: texte
            enonce: Quelle fraction du parcours reste à effectuer à l'élève B ?
            suite:
                - type: paragraphe
                  texte: Réflexe DNB
                - type: paragraphe
                  texte: "Pour comparer deux fractions, ne choisissez pas une méthode au hasard : cherchez d'abord ce qui permettra de comparer des parts de même taille."
    - id: a15
      titre: 9. Mon bilan
      contenu:
          - type: paragraphe
            texte: Pourquoi cette dernière étape ? Pour vérifier que vous savez expliquer les méthodes, pas seulement les appliquer.
      questions:
          - id: q01
            type: texte
            enonce: Expliquez avec vos mots comment simplifier une fraction.
            suite: []
          - id: q02
            type: texte
            enonce: Que pouvez-vous faire lorsque deux fractions sont difficiles à comparer directement ?
            suite: []
    - id: a16
      titre: À retenir
      contenu:
          - type: liste
            elements:
                - Une fraction représente une partie, mais aussi un nombre ou une division.
                - Dans a/b, a est le numérateur et b le dénominateur.
                - Des fractions équivalentes représentent le même nombre.
                - Pour obtenir une fraction équivalente, on multiplie ou divise le numérateur et le dénominateur par le même nombre non nul.
                - Une fraction irréductible ne peut plus être simplifiée.
                - À dénominateurs égaux, on compare les numérateurs.
                - À numérateurs positifs égaux, le plus petit dénominateur correspond à la plus grande fraction.
                - Si tout est différent, on peut utiliser des fractions équivalentes ayant le même dénominateur.
      questions: []
    - id: a17
      titre: Finir la séance
      contenu:
          - type: paragraphe
            texte: Vérifiez vos simplifications, vos signes de comparaison et les justifications demandées.
      questions: []
    - id: a18
      titre: Références générales
      contenu:
          - type: liste
            elements:
                - Chlorofil – Classes de 4e et 3e de l'enseignement agricole
                - Éduscol – Les épreuves du DNB
          - type: lien
            titre: Chlorofil – Classes de 4e et 3e de l'enseignement agricole
            url: https://chlorofil.fr/diplomes/secondaire/4e-3e
          - type: lien
            titre: Éduscol – Les épreuves du DNB
            url: https://eduscol.education.gouv.fr/5607/les-epreuves-du-dnb
      questions: []
