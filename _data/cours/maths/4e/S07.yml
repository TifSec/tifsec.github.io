titre: "Évaluation 1 : Nombres et fractions"
theme: "Mathématiques — Évaluation 1 : Nombres et fractions"
problematique: "Évaluation 1 : Nombres et fractions"
pourquoi: Les objectifs et le lien avec les situations concrètes sont présentés au début du cours ci-dessous.
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances: []
    competences: []
activites:
    - id: a01
      titre: Ce qui est évalué
      contenu:
          - type: paragraphe
            texte: Cette évaluation reprend les notions travaillées depuis le début de la période.
          - type: liste
            elements:
                - calcul mental et priorités opératoires ;
                - multiples, diviseurs et critères de divisibilité ;
                - nombres premiers et décomposition en facteurs premiers ;
                - comprendre, simplifier et comparer des fractions ;
                - additionner et soustraire des fractions ;
                - multiplier et diviser des fractions ;
                - résoudre un problème en plusieurs étapes.
      questions: []
    - id: a02
      titre: Consignes
      contenu:
          - type: liste
            elements:
                - Lisez entièrement chaque question avant de commencer.
                - Laissez apparaître vos calculs et vos raisonnements.
                - Une réponse seule ne suffit pas lorsqu'une justification est demandée.
                - Simplifiez les fractions lorsque c'est possible.
                - Respectez les unités lorsqu'elles sont nécessaires.
                - Vous pouvez vérifier vos résultats avant de rendre.
          - type: paragraphe
            texte: Important
          - type: paragraphe
            texte: Une démarche correcte avec une petite erreur de calcul peut rapporter davantage qu'un résultat juste donné sans aucune explication.
      questions: []
    - id: a03
      titre: 1. Automatismes — 3 points
      contenu:
          - type: paragraphe
            texte: Calculatrice interdite.
          - type: paragraphe
            texte: Effectuez les calculs suivants.
      questions:
          - id: q01
            type: texte
            enonce: 1. 8 × 7
            suite: []
          - id: q02
            type: texte
            enonce: 2. 84 ÷ 7
            suite: []
          - id: q03
            type: texte
            enonce: 3. 30 - 4 × 6
            suite: []
          - id: q04
            type: texte
            enonce: 4. Le quart de 72.
            suite: []
          - id: q05
            type: texte
            enonce: 5. Écriture décimale de 3/4.
            suite: []
          - id: q06
            type: texte
            enonce: 6. Calculez 3/5 de 20.
            suite: []
    - id: a04
      titre: 2. Divisibilité — 3 points
      contenu:
          - type: paragraphe
            texte: Calculatrice interdite.
      questions:
          - id: q01
            type: texte
            enonce: 1. Le nombre 450 est-il divisible par 2, 3, 5, 9 et 10 ? Justifiez chaque réponse.
            suite: []
          - id: q02
            type: texte
            enonce: 2. Donnez tous les diviseurs positifs de 18.
            suite: []
          - id: q03
            type: texte
            enonce: "3. Expliquez la différence entre un multiple et un diviseur en utilisant l'exemple : 24 = 6 × 4."
            suite: []
    - id: a05
      titre: 3. Nombres premiers — 3 points
      contenu:
          - type: paragraphe
            texte: Calculatrice interdite.
      questions:
          - id: q01
            type: texte
            enonce: 1. Parmi 17, 21, 29 et 33, quels nombres sont premiers ? Justifiez les nombres qui ne le sont pas.
            suite: []
          - id: q02
            type: texte
            enonce: 2. Décomposez 36 en facteurs premiers.
            suite: []
          - id: q03
            type: texte
            enonce: 3. Expliquez ce qu'est un nombre premier. Le nombre 1 est-il premier ?
            suite: []
    - id: a06
      titre: 4. Comprendre et simplifier les fractions — 3 points
      contenu:
          - type: paragraphe
            texte: Calculatrice interdite.
      questions:
          - id: q01
            type: texte
            enonce: 1. Simplifiez complètement 18/24.
            suite: []
          - id: q02
            type: texte
            enonce: 2. La fraction 7/12 est-elle irréductible ? Justifiez.
            suite: []
          - id: q03
            type: texte
            enonce: 3. Comparez 3/4 et 5/8. Montrez votre méthode.
            suite: []
          - id: q04
            type: texte
            enonce: 4. Expliquez ce que représentent le numérateur et le dénominateur dans la fraction 3/8.
            suite: []
    - id: a07
      titre: 5. Calculer avec des fractions — 5 points
      contenu:
          - type: paragraphe
            texte: Calculatrice interdite.
          - type: paragraphe
            texte: Laissez apparaître les transformations et simplifiez les résultats.
