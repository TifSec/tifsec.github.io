            suite: []
    - id: a08
      titre: 6. Problème bilan — 3 points
      contenu:
          - type: paragraphe
            texte: Calculatrice autorisée.
          - type: paragraphe
            texte: Une réserve contient 30 kg d'un produit.
          - type: paragraphe
            texte: On utilise 2/5 de cette réserve.
          - type: paragraphe
            texte: La quantité utilisée est ensuite répartie en portions de 3/4 kg.
      questions:
          - id: q01
            type: texte
            enonce: 1. Quelle masse représente 2/5 de 30 kg ?
            suite: []
          - id: q02
            type: texte
            enonce: 2. Combien de portions de 3/4 kg peut-on préparer avec cette quantité ?
            suite: []
          - id: q03
            type: texte
            enonce: 3. Quelle masse reste-t-il dans la réserve ?
            suite: []
          - id: q04
            type: texte
            enonce: 4. Expliquez pourquoi vous avez utilisé une multiplication à la question 1 et une division à la question 2.
            suite:
                - type: paragraphe
                  texte: Réflexe DNB
                - type: paragraphe
                  texte: Dans un problème en plusieurs étapes, identifiez d'abord ce que chaque question demande avant de choisir l'opération.
