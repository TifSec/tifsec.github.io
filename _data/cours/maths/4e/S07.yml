            suite: []
          - id: q04
            type: texte
            enonce: "4. Calculez et simplifiez : 2/3 × 3/5."
            suite: []
          - id: q05
            type: texte
            enonce: "5. Calculez et simplifiez : 3/4 × 2/9."
            suite: []
