version_papier:
    titre: Fiche papier — Nombres premiers et décomposition
    introduction: Un nombre premier est un nombre qui ne se partage exactement que par 1 et par lui-même. Décomposer en facteurs premiers, c’est démonter un nombre en petites briques premières. Tu construis ici les méthodes qui te serviront ensuite au brevet.
    sections:
        - titre: 1. Reconnaître un nombre premier
          blocs:
              - type: paragraphe
                texte: Teste les petits diviseurs. Si aucun nombre premier inférieur ou égal à sa racine ne le divise, il est premier.
              - type: etapes
                elements:
                    - 21 est divisible par 3 car 2 + 1 = 3.
                    - "21 = 3 × 7 : il n’est donc pas premier."
                    - 2 est le seul nombre premier pair. 1 n’est pas premier.
        - titre: 2. Décomposer en facteurs premiers
          blocs:
              - type: paragraphe
                texte: "Divise autant que possible par les petits nombres premiers : 2, 3, 5, 7…"
              - type: etapes
                elements:
                    - "Exemple avec 36 : 36 = 2 × 18."
                    - = 2 × 2 × 9.
                    - = 2 × 2 × 3 × 3.
                    - Donc 36 = 2² × 3².
        - titre: 3. Vérifier
          blocs:
              - type: paragraphe
                texte: Multiplie les facteurs trouvés. Si tu retrouves le nombre de départ, ta décomposition est correcte.
          questions:
              - Décompose les nombres demandés dans le cours.
              - Réécris les facteurs identiques avec une puissance.
        - titre: Je m’entraîne — même méthode que dans le cours
          blocs:
              - type: paragraphe
                texte: Reprends les étapes de l’exemple juste au-dessus. Écris une ligne par étape et garde les unités.
          questions:
              - Décompose 36 en facteurs premiers par divisions successives.
              - Vérifie en multipliant les facteurs retrouvés.
              - Écris le résultat avec des puissances.
        - titre: Je transfère — une situation nouvelle
          blocs:
              - type: paragraphe
                texte: Cette fois, les nombres ou le contexte changent. Commence par identifier ce que l’on cherche, puis choisis la méthode qui convient.
          questions:
              - Décompose 90 en facteurs premiers et montre chaque division.
              - Explique comment vérifier qu’un nombre proposé est premier.
