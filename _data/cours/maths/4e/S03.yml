titre: Nombres premiers et décomposition en facteurs premiers
theme: nombre premier.
problematique: Nombres premiers et décomposition en facteurs premiers
pourquoi: Les nombres premiers permettent de « démonter » un nombre en éléments plus simples.
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances: []
    competences: []
activites:
    - id: a02
      titre: Qu'est-ce que c'est ?
      contenu:
          - type: paragraphe
            texte: Certains nombres peuvent être obtenus par beaucoup de multiplications différentes. D'autres ne peuvent être partagés exactement que par 1 et par eux-mêmes.
          - type: paragraphe
            texte: Ces nombres particuliers sont appelés des nombres premiers.
      questions: []
    - id: a03
      titre: À quoi ça sert ?
      contenu:
          - type: paragraphe
            texte: Les nombres premiers permettent de « démonter » un nombre en éléments plus simples.
          - type: paragraphe
            texte: Cette méthode sera ensuite utile pour simplifier des fractions, rechercher des diviseurs communs et effectuer certains calculs plus facilement.
          - type: titre
            texte: 🐴 Situation équine
          - type: paragraphe
            texte: Une structure équestre reçoit 12 sacs.
          - type: paragraphe
            texte: "Elle peut former : 2 lots de 6, 3 lots de 4 ou 4 lots de 3."
          - type: paragraphe
            texte: Elle reçoit ensuite 13 sacs.
          - type: paragraphe
            texte: Peut-on encore former plusieurs lots identiques sans reste ?
          - type: titre
            texte: 🌾 Situation agricole
          - type: paragraphe
            texte: Une exploitation reçoit 12 sacs de semences.
          - type: paragraphe
            texte: Elle peut les répartir de plusieurs façons identiques.
          - type: paragraphe
            texte: Elle reçoit ensuite 13 sacs.
          - type: paragraphe
            texte: Peut-on encore former plusieurs lots identiques sans reste ?
      questions: []
    - id: a04
      titre: "1. Automatismes : réutiliser la divisibilité"
      contenu:
          - type: paragraphe
            texte: "Notions : critères de divisibilité et calcul mental."
          - type: paragraphe
            texte: Pourquoi commencer par cet exercice ? Pour savoir si un nombre est premier, il faudra souvent vérifier rapidement s'il possède des diviseurs.
          - type: paragraphe
            texte: "Ce que cela vous apporte : éliminer rapidement certains nombres sans tester toutes les divisions."
          - type: paragraphe
            texte: Calculatrice interdite.
      questions:
          - id: q01
            type: qcm
            enonce: 246 est-il divisible par 2 ?
            contenu:
                - type: paragraphe
                  texte: "Choix proposés : Oui / Non"
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question.
            choix:
                - id: c1
                  texte: Oui
                - id: c2
                  texte: Non
            suite: []
          - id: q02
            type: qcm
            enonce: 315 est-il divisible par 5 ?
            contenu:
                - type: paragraphe
                  texte: "Choix proposés : Oui / Non"
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question.
            choix:
                - id: c1
                  texte: Oui
                - id: c2
                  texte: Non
            suite: []
          - id: q03
            type: qcm
            enonce: 123 est-il divisible par 3 ?
            contenu:
                - type: paragraphe
                  texte: "Choix proposés : Oui / Non"
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question.
            choix:
                - id: c1
                  texte: Oui
                - id: c2
                  texte: Non
            suite: []
          - id: q04
            type: qcm
            enonce: 2 026 est-il divisible par 9 ?
            contenu:
                - type: paragraphe
                  texte: "Choix proposés : Oui / Non"
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question.
            choix:
                - id: c1
                  texte: Oui
                - id: c2
                  texte: Non
            suite:
                - type: paragraphe
                  texte: Réflexe DNB
                - type: paragraphe
                  texte: Pour montrer rapidement qu'un nombre possède un diviseur, utilisez d'abord les critères de divisibilité connus.
    - id: a05
      titre: 2. Découvrir les nombres premiers
      contenu:
          - type: paragraphe
            texte: "Notion : nombre premier."
          - type: paragraphe
            texte: Concrètement, qu'allons-nous faire ? Nous allons chercher les diviseurs de plusieurs nombres et comparer les résultats.
          - type: paragraphe
            texte: À quoi cela sert ? À reconnaître les nombres qui ne peuvent plus être décomposés en facteurs entiers plus petits.
          - type: paragraphe
            texte: Calculatrice interdite.
          - type: paragraphe
            texte: "Cherchez les diviseurs positifs de :"
          - type: paragraphe
            texte: 2 ; 3 ; 4 ; 5 ; 6 ; 7 ; 8 ; 11
      questions:
          - id: q01
            type: texte
            enonce: Quels nombres possèdent exactement deux diviseurs ?
            suite: []
          - id: q02
            type: texte
            enonce: Quels sont toujours les deux diviseurs de ces nombres ?
            suite: []
          - id: q03
            type: nombre
            enonce: Combien de diviseurs positifs possède le nombre 1 ?
            suite:
                - type: paragraphe
                  texte: Ce que l'on vient de découvrir
                - type: paragraphe
                  texte: "Un nombre premier possède exactement deux diviseurs positifs : 1 et lui-même."
                - type: paragraphe
                  texte: 1 n'est pas premier.
                - type: paragraphe
                  texte: 2 est le seul nombre premier pair.
    - id: a06
      titre: 3. Premier ou non premier ?
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Pour montrer qu'un nombre n'est pas premier, il n'est pas nécessaire de trouver tous ses diviseurs.
          - type: paragraphe
            texte: "Ce que cela vous apporte : apprendre à chercher une justification courte et efficace."
          - type: paragraphe
            texte: Calculatrice interdite.
      questions:
          - id: q01
            type: texte
            enonce: Parmi 13, 15, 17, 21, 23, 27, 29 et 33, indiquez les nombres premiers. Justifiez les nombres qui ne le sont pas avec une multiplication. Indice 1 Commencez par tester la divisibilité par 2, 3 et 5. Indice 2 Pour montrer qu'un nombre n'est pas premier, un seul diviseur supplémentaire suffit. Indice 3 15 = 3 × 5 21 = 3 × 7 27 = 3 × 9 33 = 3 × 11
            aide: Indice 1 Commencez par tester la divisibilité par 2, 3 et 5. Indice 2 Pour montrer qu'un nombre n'est pas premier, un seul diviseur supplémentaire suffit. Indice 3 15 = 3 × 5 21 = 3 × 7 27 = 3 × 9 33 = 3 × 11
            suite:
                - type: paragraphe
                  texte: Méthode
                - type: paragraphe
                  texte: Pour prouver qu'un nombre n'est pas premier, il suffit de trouver un diviseur différent de 1 et de lui-même.
    - id: a07
      titre: 4. Décomposer un nombre en facteurs premiers
      contenu:
          - type: paragraphe
            texte: "Notion : décomposition en facteurs premiers."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? Décomposer un nombre, c'est l'écrire comme une multiplication composée uniquement de nombres premiers.
          - type: paragraphe
            texte: À quoi ça sert ? À voir la « structure » d'un nombre et à repérer plus facilement ses facteurs communs avec d'autres nombres.
          - type: paragraphe
            texte: Pourquoi passons-nous à cet exercice ?
          - type: paragraphe
            texte: Nous savons reconnaître les nombres premiers. Nous allons maintenant les utiliser comme des briques pour fabriquer d'autres nombres.
          - type: paragraphe
            texte: Calculatrice interdite.
          - type: paragraphe
            texte: "Prenons : 24."
          - type: paragraphe
            texte: "On peut écrire : 24 = 6 × 4."
      questions:
          - id: q01
            type: texte
            enonce: Continuez la décomposition jusqu'à n'utiliser que des nombres premiers. Indice 1 Décomposez 6 et 4. Indice 2 6 = 2 × 3 et 4 = 2 × 2. Indice 3 24 = 2 × 3 × 2 × 2.
            aide: Indice 1 Décomposez 6 et 4. Indice 2 6 = 2 × 3 et 4 = 2 × 2. Indice 3 24 = 2 × 3 × 2 × 2.
            suite:
                - type: paragraphe
                  texte: Ce que l'on vient de faire
                - type: paragraphe
                  texte: 24 = 2 × 2 × 2 × 3
                - type: paragraphe
                  texte: Tous les facteurs sont premiers. C'est une décomposition en facteurs premiers.
    - id: a08
      titre: "Exercice : décomposer"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Il faut maintenant être capable de refaire la méthode sans que la première décomposition soit donnée.
      questions:
          - id: q01
            type: texte
            enonce: Décomposez 18, 20, 30 et 36 en facteurs premiers.
            suite: []
    - id: a09
      titre: 5. Écrire plus simplement avec les puissances
      contenu:
          - type: paragraphe
            texte: "Notion : puissance."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? Une puissance permet d'écrire plus rapidement une multiplication répétée.
          - type: paragraphe
            texte: À quoi ça sert ici ? À rendre les décompositions plus courtes et plus lisibles.
          - type: paragraphe
            texte: Calculatrice interdite.
      questions:
          - id: q01
            type: texte
            enonce: "Réécrivez avec des puissances : 24 = 2 × 2 × 2 × 3 et 36 = 2 × 2 × 3 × 3."
            suite: []
          - id: q02
            type: texte
            enonce: "Écrivez avec des puissances : 18, 20 et 75."
            suite: []
    - id: a10
      titre: 6. Repérer des facteurs communs
      contenu:
          - type: paragraphe
            texte: "Notion : facteurs communs."
          - type: paragraphe
            texte: Pourquoi cet exercice ? La décomposition permet de voir rapidement quels facteurs sont présents dans deux nombres.
          - type: paragraphe
            texte: "Ce que cela vous apporte : préparer une méthode qui servira bientôt à simplifier des fractions."
          - type: paragraphe
            texte: Calculatrice interdite.
          - type: paragraphe
            texte: "On donne :"
          - type: paragraphe
            texte: 18 = 2 × 3 × 3 24 = 2 × 2 × 2 × 3
      questions:
          - id: q01
            type: texte
            enonce: Quels facteurs premiers apparaissent dans les deux décompositions ?
            suite: []
          - id: q02
            type: nombre
            enonce: Produit de ces facteurs communs =
            suite: []
          - id: q03
            type: texte
            enonce: Que devient la fraction 18/24 si l'on divise le numérateur et le dénominateur par 6 ?
            suite:
                - type: paragraphe
                  texte: Ce que l'on découvre
                - type: paragraphe
                  texte: La décomposition en facteurs premiers permet de repérer des facteurs communs entre plusieurs nombres.
    - id: a11
      titre: "7. Défi DNB : retrouver un nombre mystérieux"
      contenu:
          - type: paragraphe
            texte: Calculatrice interdite.
          - type: paragraphe
            texte: "Un nombre entier possède la décomposition :"
          - type: paragraphe
            texte: 2² × 3 × 5
      questions:
          - id: q01
            type: nombre
            enonce: 1. Quel est ce nombre ?
            suite: []
          - id: q02
            type: texte
            enonce: 2. Sans effectuer toutes les divisions, citez au moins quatre diviseurs de ce nombre et expliquez comment vous les repérez.
            suite: []
          - id: q03
            type: texte
            enonce: 3. Ce nombre est-il premier ? Justifiez en une phrase.
            suite:
                - type: paragraphe
                  texte: Réflexe DNB
                - type: paragraphe
                  texte: "Une décomposition en facteurs premiers contient beaucoup d'informations : elle permet de retrouver le nombre, certains de ses diviseurs et de savoir immédiatement s'il est premier ou non."
    - id: a12
      titre: 8. Mon bilan
      contenu:
          - type: paragraphe
            texte: Pourquoi cette dernière étape ? Il faut vérifier que vous comprenez la méthode et pas seulement les exemples utilisés aujourd'hui.
      questions:
          - id: q01
            type: texte
            enonce: Expliquez avec vos mots ce qu'est un nombre premier.
            suite: []
          - id: q02
            type: texte
            enonce: À quoi peut servir une décomposition en facteurs premiers ?
            suite: []
    - id: a13
      titre: À retenir
      contenu:
          - type: liste
            elements:
                - "Un nombre premier possède exactement deux diviseurs positifs : 1 et lui-même."
                - 1 n'est pas un nombre premier.
                - 2 est le seul nombre premier pair.
                - Pour montrer qu'un nombre n'est pas premier, un seul diviseur supplémentaire suffit.
                - Décomposer en facteurs premiers consiste à écrire un nombre comme un produit de nombres premiers.
                - Une puissance permet d'écrire plus simplement une multiplication répétée.
                - La décomposition permet de repérer des facteurs communs.
      questions: []
    - id: a14
      titre: "Pour aller plus loin : le crible d'Ératosthène"
      contenu:
          - type: paragraphe
            texte: À faire uniquement si vous avez terminé.
          - type: paragraphe
            texte: "Parmi les nombres de 2 à 30 :"
          - type: etapes
            elements:
                - gardez 2 et éliminez ses multiples supérieurs à 2 ;
                - gardez 3 et éliminez ses multiples supérieurs à 3 ;
                - continuez avec le prochain nombre non éliminé ;
                - notez les nombres restants.
      questions: []
      facultatif: true
    - id: a15
      titre: Finir la séance
      contenu:
          - type: paragraphe
            texte: Vérifiez vos réponses, vos décompositions et les justifications demandées.
      questions: []
    - id: a16
      titre: Références générales
      contenu:
          - type: liste
            elements:
                - Chlorofil – Classes de 4e et 3e de l'enseignement agricole
                - Éduscol – Les épreuves du DNB
          - type: lien
            titre: Chlorofil – Classes de 4e et 3e de l'enseignement agricole
            url: https://chlorofil.fr/diplomes/secondaire/4e-3e
          - type: lien
            titre: Éduscol – Les épreuves du DNB
            url: https://eduscol.education.gouv.fr/5607/les-epreuves-du-dnb
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
