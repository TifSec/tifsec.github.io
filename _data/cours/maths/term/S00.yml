version_papier:
    titre: Fiche papier — Prévoir le stock de foin
    introduction: Garde cette fiche à côté de toi. Lis une étape, fais le calcul, puis compare avec la ligne suivante. Le but est de prévoir si le stock restera suffisant.
    sections:
        - titre: 1. Calculer un pourcentage
          blocs:
              - type: paragraphe
                texte: Un pourcentage, c’est une part sur 100. Pour diminuer une quantité de 12 %, il en reste 100 % − 12 % = 88 %.
              - type: etapes
                elements:
                    - 88 % = 0,88.
                    - "Après la consommation : stock × 0,88."
                    - "Exemple avec 50 tonnes : 50 × 0,88 = 44 tonnes."
        - titre: 2. Ajouter une livraison chaque mois
          blocs:
              - type: paragraphe
                texte: "Le stock baisse d’abord avec la consommation, puis on ajoute les 2 tonnes livrées. L’ordre compte : on ne consomme pas les tonnes qui ne sont pas encore livrées."
              - type: etapes
                elements:
                    - Stock du mois suivant = stock actuel × 0,88 + 2.
                    - "Départ : u₀ = 50 tonnes."
                    - "Après un mois : u₁ = 50 × 0,88 + 2 = 46 tonnes."
                    - "Après deux mois : u₂ = 46 × 0,88 + 2 = 42,48 tonnes."
        - titre: 3. Reproduire la suite dans Calc ou Excel
          blocs:
              - type: paragraphe
                texte: Un tableur recopie les mêmes étapes sans refaire les calculs à la main. La première cellule contient le stock de départ ; la cellule suivante contient la formule.
              - type: liste
                elements:
                    - "A1 : Mois ; B1 : Stock (t)."
                    - "A2 : 0 ; B2 : 50."
                    - "A3 : 1 ; B3 : =B2*0,88+2. Recopie la formule vers le bas."
                    - Ajoute une colonne « Seuil de sécurité » avec 25 sur chaque ligne. Compare le stock à ce seuil.
          questions:
              - Explique ce que représente une ligne du tableau.
              - À partir de quel mois faut-il réagir si le stock passe sous le seuil ?
        - titre: 4. Comprendre le stock d’équilibre
          blocs:
              - type: paragraphe
                texte: Le stock d’équilibre est la valeur vers laquelle le stock se rapproche si on répète toujours la même règle. À l’équilibre, le stock du mois suivant est égal au stock actuel.
              - type: etapes
                elements:
                    - On pose x = 0,88x + 2.
                    - "On retire 0,88x des deux côtés : 0,12x = 2."
                    - "On divise par 0,12 : x = 2 ÷ 0,12 ≈ 16,67 tonnes."
                    - "Ce niveau est inférieur au seuil de 25 tonnes : les livraisons prévues ne suffisent pas à maintenir le stock de sécurité."
        - titre: 5. La conclusion professionnelle
          blocs:
              - type: paragraphe
                texte: Les calculs aident à décider, mais ils ne remplacent pas le responsable. Il faut aussi vérifier les dates de livraison, la météo, le nombre d’animaux et la consommation réelle.
          questions:
              - "Écris une recommandation au responsable : que doit-il surveiller et que peut-il changer ?"
        - titre: Je m’entraîne — même méthode que dans le cours
          blocs:
              - type: paragraphe
                texte: Reprends les étapes de l’exemple juste au-dessus. Écris une ligne par étape et garde les unités.
          questions:
              - Un stock commence à 40 t. Il diminue de 10 %, puis on livre 3 t. Calcule le stock du mois suivant.
              - Recommence le calcul pour le mois d’après.
              - Explique pourquoi il faut multiplier par 0,90 avant d’ajouter les 3 t.
        - titre: Je transfère — une situation nouvelle
          blocs:
              - type: paragraphe
                texte: Cette fois, les nombres ou le contexte changent. Commence par identifier ce que l’on cherche, puis choisis la méthode qui convient.
          questions:
              - Une réserve d’eau contient 1 200 L. Elle perd 8 % par semaine et reçoit 50 L chaque semaine. Écris la formule de calcul du volume suivant.
              - Dans un tableur, quelle formule entrer si le volume est en B2 ?
              - Le seuil d’alerte est 400 L. Explique comment le tableur peut aider à repérer le mois d’alerte.
