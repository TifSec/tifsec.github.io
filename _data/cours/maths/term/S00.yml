titre: Gérer le stock de foin d'une écurie avec les suites
theme: Mathématiques — Gérer le stock de foin d'une écurie avec les suites
problematique: Gérer le stock de foin d'une écurie avec les suites
pourquoi: "Objectif de cette séance : Comprendre comment les pourcentages permettent de décrire une évolution."
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Comprendre comment les pourcentages permettent de décrire une évolution.
        - Reconnaître une suite numérique et son mode de calcul.
        - Comprendre la différence entre une suite géométrique et une suite arithmético-géométrique.
        - Déterminer vers quelle valeur un stock semble se stabiliser.
        - Comprendre les limites d'un modèle mathématique appliqué à une entreprise.
    competences:
        - Calculer une augmentation ou une diminution en pourcentage.
        - Traduire une situation professionnelle par une relation mathématique.
        - Calculer et interpréter les termes d'une suite.
        - Utiliser une calculatrice et un tableur pour effectuer une simulation.
        - Comparer des résultats à un seuil de sécurité.
        - Justifier une décision de gestion.
activites:
    - id: a03
      titre: Préparation — Votre document de travail
      contenu:
          - type: paragraphe
            texte: Travaillez en binôme. Chacun doit être capable d'expliquer les calculs réalisés.
          - type: paragraphe
            texte: Vos réponses doivent être enregistrées dans votre espace de travail habituel.
          - type: paragraphe
            texte: Lorsque vous calculez un résultat, indiquez autant que possible le calcul utilisé, et pas seulement le nombre obtenu.
      questions: []
    - id: a04
      titre: 1. Automatismes — Pourcentages et calcul mental 15 min
      contenu:
          - type: paragraphe
            texte: "Calculatrice : interdite."
          - type: paragraphe
            texte: Répondez en utilisant vos connaissances et des calculs simples.
      questions:
          - id: q01
            type: texte
            enonce: 1. Une tonne de granulés coûte 450 €. Son prix augmente de 4 %. Quel est son nouveau prix ?
            contenu:
                - type: paragraphe
                  texte: "Calcul :"
                - type: paragraphe
                  texte: "Nouveau prix : €"
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question. Indice 1 Commencez par chercher combien représentent 4 % de 450 €. Indice 2 1 % de 450 € représente 4,50 €. Donc 4 % représente quatre fois cette somme. Indice 3 Une hausse de 4 % correspond également à multiplier le prix par 1,04.
            suite: []
          - id: q02
            type: texte
            enonce: 2. Une quantité est multipliée par 0,92 chaque mois. Quel est son pourcentage d'évolution ?
            contenu:
                - type: paragraphe
                  texte: "Évolution : %"
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question. Indice 1 Multiplier par 1 signifie conserver 100 % de la quantité. Indice 2 0,92 correspond à 92 %. Indice 3 Comparez 92 % aux 100 % de départ.
            suite: []
          - id: q03
            type: texte
            enonce: 3. Un stock de 50 tonnes diminue de 12 %. Quelle quantité reste-t-il ?
            contenu:
                - type: paragraphe
                  texte: "Calcul :"
                - type: paragraphe
                  texte: "Stock restant : tonnes"
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question. Indice 1 Calculez d'abord 10 % puis 2 % de 50 tonnes. Indice 2 10 % de 50 = 5 et 2 % de 50 = 1. Indice 3 Il reste 100 % - 12 % = 88 % du stock.
            suite: []
          - id: q04
            type: texte
            enonce: 4. Quel coefficient multiplicateur correspond à une diminution de 12 % ?
            contenu:
                - type: paragraphe
                  texte: "Coefficient :"
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question.
            suite: []
    - id: a05
      titre: 2. Retour de stage — Comment gérer le foin ? 20 min
      contenu:
          - type: paragraphe
            texte: "Calculatrice : non nécessaire."
          - type: paragraphe
            texte: Discutez avec votre binôme de la gestion du foin dans les structures où vous avez effectué vos stages.
      questions:
          - id: q01
            type: texte
            enonce: 1. Comment le responsable de votre structure surveille-t-il les quantités de foin disponibles ?
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question.
            suite: []
          - id: q02
            type: texte
            enonce: 2. Les achats se font-ils à dates fixes, en une grande livraison, ou seulement lorsque le stock diminue ?
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question.
            suite: []
          - id: q03
            type: texte
            enonce: 3. Quels problèmes peut provoquer un stock de foin trop faible ? Et un stock beaucoup trop important ?
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question.
            suite: []
          - id: q04
            type: texte
            enonce: 4. Quels éléments peuvent modifier la consommation de foin ?
            contenu:
                - type: paragraphe
                  texte: "Choix proposés : Le nombre de chevaux / La météo / L'accès au pâturage / La ration distribuée / Les pertes lors de la distribution"
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question.
            suite: []
    - id: a06
      titre: Le problème à résoudre
      contenu:
          - type: paragraphe
            texte: Une écurie héberge 20 chevaux. Au 1er novembre, elle possède 60 tonnes de foin.
          - type: paragraphe
            texte: "Pour étudier une stratégie simplifiée, on suppose qu'à chaque période d'un mois :"
          - type: liste
            elements:
                - l'écurie utilise 12 % du stock présent au début du mois ;
                - après cette consommation, elle achète 2 tonnes de foin ;
                - le stock disponible est mesuré à nouveau au début du mois suivant.
          - type: paragraphe
            texte: Le responsable considère qu'un stock inférieur à 25 tonnes constitue un signal d'alerte.
          - type: paragraphe
            texte: "Notre mission : prévoir l'évolution du stock et déterminer si cette stratégie est suffisante."
      questions: []
    - id: a07
      titre: 3. Recherche — Prévoir l'évolution du stock 40 min
      contenu:
          - type: paragraphe
            texte: Travail en binôme.
          - type: paragraphe
            texte: "Calculatrice : interdite pour la première étape, puis autorisée."
          - type: paragraphe
            texte: On appelle un la quantité de foin, en tonnes, au début du mois numéro n.
          - type: paragraphe
            texte: Le mois numéro 0 correspond au 1er novembre de départ.
          - type: paragraphe
            texte: u₀ = 60
      questions: []
    - id: a08
      titre: A. Traduire la situation en calcul
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: 1. Après une consommation de 12 %, quel pourcentage du stock reste-t-il ?
            contenu:
                - type: paragraphe
                  texte: "Réponse : %"
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question.
            suite: []
          - id: q02
            type: texte
            enonce: "2. Complétez le calcul du stock restant après consommation :"
            contenu:
                - type: paragraphe
                  texte: Stock restant = un ×
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question.
            suite: []
          - id: q03
            type: texte
            enonce: "3. Le responsable achète ensuite 2 tonnes. Complétez la relation :"
            contenu:
                - type: paragraphe
                  texte: un+₁ = × un +
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question. Indice 1 Le stock suivant est égal au stock restant après consommation, auquel on ajoute les achats. Indice 2 Le stock restant vaut 0,88 fois le stock précédent. Indice 3 La relation attendue est un+₁ = 0,88un + 2.
            suite: []
    - id: a09
      titre: B. Calculer les trois premiers mois
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: 4. Calculez u₁, le stock disponible après un mois.
            contenu:
                - type: paragraphe
                  texte: "Calcul :"
                - type: paragraphe
                  texte: u₁ = tonnes
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question. Indice 1 Dans la formule, remplacez u₀ par 60. Indice 2 Calculez 60 × 0,88, puis ajoutez 2. Indice 3 60 × 0,88 = 52,8 tonnes avant livraison.
            suite: []
          - id: q02
            type: texte
            enonce: 5. Calculez u₂, le stock disponible après deux mois.
            contenu:
                - type: paragraphe
                  texte: "Calcul :"
                - type: paragraphe
                  texte: u₂ = tonnes
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question.
            suite: []
          - id: q03
            type: texte
            enonce: 6. Calculez u₃, le stock disponible après trois mois.
            contenu:
                - type: paragraphe
                  texte: "Calcul :"
                - type: paragraphe
                  texte: u₃ ≈ tonnes
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question.
            suite: []
    - id: a10
      titre: C. Quand le stock devient-il insuffisant ?
      contenu:
          - type: paragraphe
            texte: Le responsable souhaite conserver au moins 25 tonnes de foin.
      questions:
          - id: q01
            type: texte
            enonce: 7. Poursuivez les calculs à l'aide de la calculatrice. Complétez le tableau jusqu'au mois où le stock passe sous 25 tonnes.
            contenu:
                - type: paragraphe
                  texte: "Premier mois où le stock devient inférieur à 25 tonnes :"
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question. Indice 1 Calculez chaque nouvelle valeur à partir de la précédente. Indice 2 Pour chaque ligne, multipliez par 0,88 puis ajoutez 2. Indice 3 Examinez particulièrement les résultats des mois 12 et 13.
            suite: []
          - id: q02
            type: texte
            enonce: 8. Le responsable peut-il conserver durablement un stock supérieur à 25 tonnes en achetant seulement 2 tonnes par mois ? Justifiez avec vos résultats.
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question.
            suite: []
    - id: a11
      titre: 4. Comprendre la suite — Vers quel stock se dirige-t-on ? 20 min
      contenu:
          - type: paragraphe
            texte: "Calculatrice : autorisée."
          - type: paragraphe
            texte: Le stock diminue. Mais cela signifie-t-il qu'il va nécessairement atteindre zéro ?
      questions: []
    - id: a12
      titre: A. Trouver le stock d'équilibre
      contenu:
          - type: paragraphe
            texte: On cherche une quantité L qui resterait identique d'un mois à l'autre dans notre modèle.
          - type: paragraphe
            texte: "Si le stock ne change plus :"
          - type: paragraphe
            texte: L = 0,88L + 2
      questions:
          - id: q01
            type: texte
            enonce: 1. Résolvez cette équation.
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question. Indice 1 Regroupez les termes contenant L d'un seul côté de l'égalité. Indice 2 Soustrayez 0,88L des deux côtés. Indice 3 Vous devez obtenir 0,12L = 2, puis isoler L.
            suite: []
          - id: q02
            type: texte
            enonce: 2. Quelle est la valeur du stock d'équilibre, arrondie au centième ?
            contenu:
                - type: paragraphe
                  texte: L ≈ tonnes
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question.
            suite: []
          - id: q03
            type: texte
            enonce: 3. Ce stock d'équilibre est-il supérieur ou inférieur au seuil de 25 tonnes ? Que peut-on en conclure ?
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question.
            suite: []
    - id: a13
      titre: B. Comprendre ce qu'est une suite géométrique
      contenu:
          - type: paragraphe
            texte: Une suite géométrique est une suite dans laquelle chaque terme s'obtient en multipliant le précédent par un même nombre, appelé raison.
          - type: paragraphe
            texte: vn+₁ = q × vn
          - type: paragraphe
            texte: "Pour connaître directement le terme numéro n :"
          - type: paragraphe
            texte: vn = v₀ × qn
      questions:
          - id: q01
            type: texte
            enonce: 4. Notre suite un+₁ = 0,88un + 2 est-elle directement géométrique ?
            contenu:
                - type: paragraphe
                  texte: Pourquoi ?
                - type: paragraphe
                  texte: "Choix proposés : Oui / Non"
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question.
            suite: []
    - id: a14
      titre: C. Faire apparaître une véritable suite géométrique
      contenu:
          - type: paragraphe
            texte: On décide d'étudier l'écart entre le stock du mois n et le stock d'équilibre.
          - type: paragraphe
            texte: "On définit :"
          - type: paragraphe
            texte: vn = un - 50/3
          - type: paragraphe
            texte: "On peut démontrer que :"
          - type: paragraphe
            texte: vn+₁ = 0,88vn
      questions:
          - id: q01
            type: texte
            enonce: 5. La suite v est-elle géométrique ? Si oui, quelle est sa raison ?
            contenu:
                - type: paragraphe
                  texte: "Réponse :"
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question.
            suite: []
    - id: a15
      titre: À retenir
      contenu:
          - type: paragraphe
            texte: "Une suite géométrique de premier terme v₀ et de raison q vérifie :"
          - type: paragraphe
            texte: vn = v₀ × qn
          - type: paragraphe
            texte: "Dans notre situation :"
          - type: paragraphe
            texte: un = 50/3 + (130/3) × 0,88n
          - type: paragraphe
            texte: Le stock se rapproche progressivement de 16,67 tonnes, une valeur inférieure au seuil d'alerte.
          - type: paragraphe
            texte: Cette conclusion est valable dans le modèle étudié.
      questions: []
    - id: a16
      titre: 5. Application numérique — Simuler les stocks avec un tableur 20 min
      contenu:
          - type: paragraphe
            texte: "Calculatrice et ordinateur : autorisés."
          - type: paragraphe
            texte: Nous allons maintenant utiliser Excel ou LibreOffice Calc pour simuler la gestion du stock sur 24 mois.
      questions: []
    - id: a17
      titre: A. Construire le tableau
      contenu:
          - type: paragraphe
            texte: Ouvrez un nouveau classeur.
          - type: paragraphe
            texte: Dans la cellule A1, écrivez Mois.
          - type: paragraphe
            texte: Dans la cellule B1, écrivez Stock de foin (t).
          - type: paragraphe
            texte: Dans la cellule A2, saisissez 0.
          - type: paragraphe
            texte: Dans la cellule A3, saisissez 1.
          - type: paragraphe
            texte: Sélectionnez A2 et A3, puis étirez la série jusqu'au mois 24, en ligne 26.
          - type: paragraphe
            texte: Dans B2, saisissez 60.
          - type: paragraphe
            texte: Dans B3, saisissez la formule =B2*0,88+2.
          - type: paragraphe
            texte: Validez puis recopiez la formule jusqu'en B26.
      questions:
          - id: q01
            type: texte
            enonce: 1. Quel stock obtient-on au mois 24 ? Arrondissez au centième.
            contenu:
                - type: paragraphe
                  texte: "Stock : tonnes"
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question. Indice 1 Repérez la ligne correspondant au mois 24. Indice 2 Le mois 24 se trouve sur la ligne 26. Indice 3 La valeur recherchée est contenue dans la cellule B26.
            suite: []
    - id: a18
      titre: B. Représenter graphiquement l'évolution
      contenu:
          - type: paragraphe
            texte: Sélectionnez les cellules A1 à B26.
          - type: paragraphe
            texte: Dans le menu Insertion, choisissez un graphique.
          - type: paragraphe
            texte: Choisissez un graphique de type XY (dispersion) avec points reliés par des lignes.
      questions:
          - id: q01
            type: texte
            enonce: Vérifiez que les mois sont sur l'axe horizontal et le stock sur l'axe vertical.
            suite:
                - type: paragraphe
                  texte: "Ajoutez le titre : Évolution du stock de foin sur 24 mois."
          - id: q02
            type: texte
            enonce: Indiquez les unités des deux axes.
            suite: []
          - id: q03
            type: texte
            enonce: 2. Comment évolue le stock ? Sa diminution semble-t-elle ralentir, accélérer ou rester identique chaque mois ?
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question.
            suite: []
          - id: q04
            type: texte
            enonce: 3. La courbe paraît se rapprocher d'une valeur. Laquelle ? Retrouvez-vous le résultat calculé précédemment ?
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question.
            suite: []
    - id: a19
      titre: C. Prendre en compte l'inflation
      contenu:
          - type: paragraphe
            texte: Le stock n'est pas la seule donnée qui intéresse le responsable. Le coût d'achat peut également évoluer.
          - type: paragraphe
            texte: On suppose, pour un deuxième modèle simplifié, que le prix du foin augmente de 3 % par an.
      questions:
          - id: q01
            type: texte
            enonce: 4. Quel coefficient multiplicateur représente cette hausse annuelle de 3 % ?
            contenu:
                - type: paragraphe
                  texte: "Coefficient :"
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question.
            suite: []
          - id: q02
            type: texte
            enonce: 5. Si P₀ représente le prix initial d'une tonne de foin, écrivez le prix Pa après a années.
            contenu:
                - type: paragraphe
                  texte: Pa = P₀ × a
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question.
            suite: []
          - id: q03
            type: texte
            enonce: 6. Expliquez pourquoi attendre le dernier moment pour acheter du foin peut être risqué lorsque les prix augmentent.
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question.
            suite: []
    - id: a20
      titre: 6. Bilan — Conseiller le responsable de l'écurie 5 min
      contenu:
          - type: paragraphe
            texte: "Calculatrice : non nécessaire."
      questions:
          - id: q01
            type: texte
            enonce: "Rédigez votre conclusion :"
            contenu:
                - type: paragraphe
                  texte: La stratégie « consommer 12 % du stock puis acheter 2 tonnes chaque mois » est-elle suffisante pour conserver durablement au moins 25 tonnes ? Justifiez en utilisant deux résultats de la séance.
            aide: Écris ici les calculs, la réponse et la justification demandés dans cette question.
            suite: []
    - id: a21
      titre: Pour le prochain retour de stage
      contenu:
          - type: paragraphe
            texte: "Recherchez, si ces informations sont accessibles dans votre structure :"
          - type: liste
            elements:
                - le prix d'une botte ou d'une balle de foin ;
                - sa masse approximative ;
                - la consommation moyenne de foin par cheval et par jour ;
                - le nombre de chevaux de la structure ;
                - la quantité de foin achetée ou produite pour l'hiver.
          - type: paragraphe
            texte: Des estimations suffisent. Ne communiquez aucune information confidentielle.
      questions: []
    - id: a22
      titre: À retenir
      contenu:
          - type: liste
            elements:
                - Une baisse de 12 % correspond à multiplier par 0,88.
                - Une suite permet de représenter l'évolution d'une quantité au cours du temps.
                - "Dans notre modèle : un+₁ = 0,88un + 2."
                - Cette suite est arithmético-géométrique, et non directement géométrique.
                - Une suite géométrique vérifie vn+₁ = q × vn.
                - Son terme général est vn = v₀ × qn.
                - Le stock étudié tend vers 16,67 tonnes.
                - Le seuil des 25 tonnes est franchi au mois 13.
                - Une simulation doit toujours être interprétée à partir des contraintes réelles de l'entreprise.
      questions: []
