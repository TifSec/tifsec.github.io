      texte: Notre situation professionnelle
    - type: paragraphe
      texte: Un centre équestre souhaite confier l'entretien mensuel de sa carrière à une entreprise extérieure.
    - type: paragraphe
      texte: Deux prestataires proposent des tarifs différents. Le responsable doit comparer les offres pour choisir celle qui correspond le mieux à ses besoins.
    - type: paragraphe
      texte: "Problème : quelle entreprise choisir selon le nombre d'interventions nécessaires ?"
    - type: paragraphe
      texte: Les modèles de coûts sont fictifs. Les prestations sont supposées équivalentes pour permettre une comparaison mathématique.
    - type: paragraphe
      texte: Le lien avec les séances précédentes
    - type: paragraphe
      texte: "Séance 4 : une fonction affine permet de représenter une évolution régulière."
    - type: paragraphe
      texte: "Séance 5 : une fonction du second degré peut posséder un minimum."
    - type: paragraphe
      texte: "Séance 6 : les équations, les inéquations et les contraintes permettent de rechercher des solutions admissibles."
    - type: paragraphe
