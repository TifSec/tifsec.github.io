titre: Comparer deux prestations et justifier une décision
theme: modèle mathématique.
problematique: Comparer deux prestations et justifier une décision
pourquoi: "Objectif de cette séance : Comprendre pourquoi le prestataire le moins cher peut changer selon les besoins."
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Comprendre pourquoi le prestataire le moins cher peut changer selon les besoins.
        - Comparer une fonction affine et une fonction du second degré.
        - Comprendre ce que signifie l'égalité entre deux fonctions.
        - Prendre une décision professionnelle en respectant un budget.
    competences:
        - Calculer les coûts de deux entreprises pour une même fréquence.
        - Compléter et interpréter un tableau comparatif.
        - Retrouver les valeurs pour lesquelles deux coûts sont identiques.
        - Vérifier plusieurs contraintes simultanément.
        - Rédiger une recommandation argumentée.
activites:
    - id: a03
      titre: "1. Automatismes : retrouver les méthodes"
      contenu:
          - type: paragraphe
            texte: "Notions : calcul mental, images de fonctions et carrés."
          - type: paragraphe
            texte: Qu'est-ce que c'est ? Calculer l'image d'un nombre consiste à remplacer x par ce nombre dans une formule.
          - type: paragraphe
            texte: À quoi ça sert ? Nous pouvons ainsi connaître le coût d'une prestation pour un nombre précis d'interventions.
          - type: paragraphe
            texte: Pourquoi ces exercices ? Nous allons retrouver les méthodes indispensables avant de comparer les deux entreprises.
          - type: paragraphe
            texte: "Durée indicative : 6 minutes. Calculatrice interdite."
      questions:
          - id: q01
            type: texte
            enonce: Calculer 10 % puis 15 % de 200 €.
            suite: []
          - id: q02
            type: texte
            enonce: Calculer f(4) pour f(x) = 20x + 100.
            suite: []
          - id: q03
            type: texte
            enonce: Calculer g(4) pour g(x) = 5(x - 4)² + 180.
            suite: []
          - id: q04
            type: texte
            enonce: Résoudre (x - 4)² = 9.
            suite: []
    - id: a04
      titre: 2. Comprendre les deux offres
      contenu:
          - type: paragraphe
            texte: "Notion : modèle mathématique."
          - type: paragraphe
            texte: Qu'est-ce que c'est ? Un modèle mathématique est une formule qui représente une situation de manière simplifiée.
          - type: paragraphe
            texte: À quoi ça sert ? Il permet de prévoir et de comparer des coûts sans avoir à réaliser toutes les prestations.
          - type: paragraphe
            texte: "Deux entreprises proposent les modèles suivants :"
          - type: tableau
            colonnes:
                - Entreprise
                - Coût mensuel
                - Type de fonction
            lignes:
                - - A
                  - A(x) = 20x + 100
                  - Affine
                - - B
                  - B(x) = 5(x - 4)² + 180
                  - Second degré
          - type: paragraphe
            texte: x représente le nombre d'interventions mensuelles, entier compris entre 1 et 8. Les coûts sont exprimés en euros.
          - type: paragraphe
            texte: "Entreprise A : le modèle comprend 100 € de coût fixe et 20 € supplémentaires par intervention."
          - type: paragraphe
            texte: "Entreprise B : le modèle possède un minimum de 180 € pour quatre interventions. Il s'agit d'un forfait fictif dont le coût varie selon l'écart à quatre interventions."
      questions: []
    - id: a05
      titre: "Exercice : Comprendre avant de calculer"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous devons savoir ce que représentent les formules avant de les comparer.
          - type: paragraphe
            texte: "Durée indicative : 6 minutes. Calculatrice autorisée."
      questions:
          - id: q01
            type: texte
            enonce: Pourquoi A(x) est-elle une fonction affine ?
            suite: []
          - id: q02
            type: texte
            enonce: Pourquoi B(x) est-elle une fonction du second degré ?
            suite: []
          - id: q03
            type: texte
            enonce: Quel est le coût minimal de B et pour combien d'interventions ?
            suite: []
          - id: q04
            type: texte
            enonce: Peut-on déjà affirmer que B est toujours moins chère que A ? Expliquer.
            suite: []
    - id: a06
      titre: 3. Comparer les coûts avec un tableau
      contenu:
          - type: paragraphe
            texte: "Notion : tableau comparatif de fonctions."
          - type: paragraphe
            texte: Qu'est-ce que c'est ? Un tableau permet de regrouper les résultats de plusieurs fonctions pour les mêmes valeurs de x.
          - type: paragraphe
            texte: À quoi ça sert ? Il permet de comparer des offres rapidement et de repérer les fréquences où elles deviennent équivalentes.
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous allons passer des formules à des montants concrets.
          - type: paragraphe
            texte: "Durée indicative : 10 minutes. Calculatrice autorisée."
      questions:
          - id: q01
            type: texte
            enonce: Compléter les coûts manquants dans le tableau.
            suite: []
          - id: q02
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Interventions
                - "2"
                - "3"
                - "4"
                - "5"
                - "6"
                - "8"
            lignes:
                - - A(x) en €
                  - "140"
                  - ""
                  - "180"
                  - ""
                  - "220"
                  - ""
                - - B(x) en €
                  - ""
                  - "185"
                  - ""
                  - "185"
                  - ""
                  - "260"
    - id: a07
      titre: "Exercice : Interpréter les résultats"
      contenu:
          - type: paragraphe
            texte: "Pourquoi cet exercice ? Les nombres seuls ne suffisent pas : nous devons les utiliser pour comparer les entreprises."
      questions:
          - id: q01
            type: texte
            enonce: Quelle entreprise est la moins chère pour trois interventions ? Calculer l'écart.
            suite: []
          - id: q02
            type: texte
            enonce: Quelle entreprise est la moins chère pour six interventions ? Calculer l'écart.
            suite: []
          - id: q03
            type: texte
            enonce: Pour quelles fréquences du tableau les entreprises proposent-elles le même coût ?
            suite: []
          - id: q04
            type: texte
            enonce: Peut-on choisir une entreprise sans connaître le nombre d'interventions nécessaires ? Justifier.
            suite: []
    - id: a08
      titre: 4. Comprendre les points d'égalité
      contenu:
          - type: paragraphe
            texte: "Notion : équation et produit nul."
          - type: paragraphe
            texte: Qu'est-ce que c'est ? Pour savoir quand deux entreprises facturent le même montant, nous recherchons les valeurs pour lesquelles A(x) = B(x).
          - type: paragraphe
            texte: À quoi ça sert ? Cela permet de déterminer précisément quand deux modèles sont équivalents.
          - type: paragraphe
            texte: "Une analogie : sur un graphique, les deux courbes se rencontrent aux endroits où elles ont la même hauteur pour la même valeur de x."
          - type: paragraphe
            texte: Pourquoi cette activité ? Nous allons comprendre le raisonnement algébrique qui permet de retrouver les égalités du tableau.
          - type: paragraphe
            texte: "Durée indicative : 12 minutes. Calculatrice autorisée."
      questions: []
    - id: a09
      titre: "Étape 1 : Écrire l'égalité des deux coûts"
      contenu:
          - type: paragraphe
            texte: "Nous cherchons :"
          - type: paragraphe
            texte: A(x) = B(x)
          - type: paragraphe
            texte: "Donc :"
          - type: paragraphe
            texte: 20x + 100 = 5(x - 4)² + 180
      questions: []
    - id: a10
      titre: "Étape 2 : Développer le carré"
      contenu:
          - type: paragraphe
            texte: "Nous savons que :"
          - type: paragraphe
            texte: (x - 4)² = x² - 8x + 16
          - type: paragraphe
            texte: "Donc :"
          - type: paragraphe
            texte: 5(x - 4)² + 180 = 5x² - 40x + 80 + 180
          - type: paragraphe
            texte: "Ce qui donne :"
          - type: paragraphe
            texte: 20x + 100 = 5x² - 40x + 260
      questions: []
    - id: a11
      titre: "Étape 3 : Regrouper les termes"
      contenu:
          - type: paragraphe
            texte: Nous voulons obtenir zéro d'un côté de l'égalité.
          - type: paragraphe
            texte: "Nous retirons 20x et 100 des deux côtés :"
          - type: paragraphe
            texte: 0 = 5x² - 60x + 160
          - type: paragraphe
            texte: "Nous divisons par 5 :"
          - type: paragraphe
            texte: 0 = x² - 12x + 32
      questions: []
    - id: a12
      titre: "Étape 4 : Factoriser"
      contenu:
          - type: paragraphe
            texte: "Nous pouvons écrire :"
          - type: paragraphe
            texte: x² - 12x + 32 = (x - 4)(x - 8)
          - type: paragraphe
            texte: "Pourquoi ? Vérifions en développant :"
          - type: paragraphe
            texte: (x - 4)(x - 8) = x² - 8x - 4x + 32
          - type: paragraphe
            texte: "Nous retrouvons bien :"
          - type: paragraphe
            texte: x² - 12x + 32
      questions: []
    - id: a13
      titre: "Étape 5 : Utiliser la règle du produit nul"
      contenu:
          - type: paragraphe
            texte: "Nous obtenons :"
          - type: paragraphe
            texte: (x - 4)(x - 8) = 0
          - type: paragraphe
            texte: Un produit est nul si au moins un de ses facteurs est nul.
          - type: paragraphe
            texte: "Nous cherchons donc :"
          - type: paragraphe
            texte: x - 4 = 0 ou x - 8 = 0
          - type: paragraphe
            texte: "Les solutions sont :"
          - type: paragraphe
            texte: x = 4 ou x = 8
      questions: []
    - id: a14
      titre: "Exercice : Vérifier et interpréter"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Une solution algébrique doit être vérifiée et reliée au problème professionnel.
      questions:
          - id: q01
            type: texte
            enonce: Vérifier les deux solutions dans les formules A(x) et B(x).
            suite: []
          - id: q02
            type: texte
            enonce: Expliquer ce que représentent ces deux solutions pour le responsable.
            suite:
                - type: paragraphe
                  texte: "Réflexe Bac : comparer deux fonctions"
                - type: paragraphe
                  texte: Pour rechercher leurs points d'égalité, écrire A(x) = B(x), résoudre l'équation, puis vérifier les solutions dans les deux expressions de départ.
    - id: a15
      titre: 5. Choisir une prestation avec des contraintes
      contenu:
          - type: paragraphe
            texte: "Notion : solution admissible."
          - type: paragraphe
            texte: Qu'est-ce que c'est ? Une solution admissible respecte toutes les conditions du problème.
          - type: paragraphe
            texte: À quoi ça sert ? Elle permet de distinguer une solution intéressante sur le papier d'une décision réellement applicable.
          - type: paragraphe
            texte: "Le responsable impose maintenant :"
          - type: liste
            elements:
                - Un budget mensuel maximal de 210 €.
                - Au moins cinq interventions.
                - Pas plus de sept interventions.
      questions: []
    - id: a16
      titre: "Exercice : Comparer les solutions admissibles"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous allons croiser les besoins d'entretien et le budget pour choisir une entreprise.
          - type: paragraphe
            texte: "Durée indicative : 9 minutes. Calculatrice autorisée."
      questions:
          - id: q01
            type: texte
            enonce: Quelles fréquences respectent les contraintes d'organisation ?
            suite: []
          - id: q02
            type: texte
            enonce: Compléter les coûts des deux entreprises pour ces trois fréquences.
            suite: []
          - id: q03
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Interventions
                - A
                - B
            lignes:
                - - "5"
                  - ""
                  - ""
                - - "6"
                  - ""
                  - ""
                - - "7"
                  - ""
                  - ""
          - id: q04
            type: texte
            enonce: Quelles propositions respectent le budget de 210 € ?
            suite: []
          - id: q05
            type: texte
            enonce: Quelle solution permet de minimiser les dépenses ? Justifier.
            suite: []
          - id: q06
            type: texte
            enonce: Si le responsable impose six interventions, quelle entreprise faut-il conseiller ?
            suite: []
    - id: a17
      titre: "6. Bilan : rédiger une recommandation"
      contenu:
          - type: paragraphe
            texte: Pourquoi ce bilan ? Dans une situation professionnelle, un calcul doit déboucher sur une conclusion compréhensible et justifiée.
          - type: paragraphe
            texte: "Durée indicative : 5 minutes. Calculatrice interdite."
      questions:
          - id: q01
            type: texte
            enonce: Rédiger une recommandation de quatre à cinq lignes pour le responsable.
            suite: []
          - id: q02
            type: texte
            enonce: Pourquoi le coût ne suffit-il pas toujours pour choisir un prestataire ?
            suite: []
    - id: a19
      titre: À retenir
      contenu:
          - type: liste
            elements:
                - Pour comparer deux offres, calculer leurs coûts pour le même nombre d'interventions.
                - L'égalité A(x) = B(x) permet de rechercher les fréquences où les deux offres coûtent autant.
                - Un produit est nul si au moins un de ses facteurs est nul.
                - Une solution admissible respecte toutes les contraintes du problème.
                - Le choix le moins coûteux dépend du besoin et des conditions imposées.
      questions: []
    - id: a20
      titre: "Pour aller plus loin : défi facultatif"
      contenu:
          - type: paragraphe
            texte: Pourquoi ce défi ? Nous allons déterminer précisément quand B devient moins chère que A et voir comment une remise peut modifier le classement.
          - type: paragraphe
            texte: Calculatrice autorisée.
          - type: paragraphe
            texte: Écrire l'inéquation traduisant « B est strictement moins chère que A ».
          - type: paragraphe
            texte: Montrer que cette inéquation revient à (x - 4)(x - 8) < 0.
      questions:
          - id: q01
            type: texte
            enonce: Pour quelles fréquences entières B est-elle moins chère que A ?
            suite:
                - type: paragraphe
                  texte: Pour six interventions, A propose une remise de 15 %. Calculer son nouveau coût et le comparer à B.
          - id: q02
            type: texte
            enonce: Rédiger une nouvelle recommandation si la remise est confirmée.
            suite: []
      facultatif: true
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
