version_papier:
    titre: Fiche papier — Comparer deux offres et résoudre une égalité
    introduction: Cette fiche t’aide à suivre une méthode sans donner les réponses de la séance. Une ligne de calcul = une transformation expliquée.
    sections:
        - titre: 1. Avant de calculer
          blocs:
              - type: paragraphe
                texte: Repère ce que signifie x, les deux formules, leurs unités et les contraintes du problème. Comme deux tarifs, les offres doivent être comparées pour le même nombre d’interventions.
          questions:
              - Écris ce que représente x.
              - Repère les frais fixes et les frais qui dépendent de x.
              - Note les valeurs autorisées par l’énoncé.
        - titre: 2. Calculer puis comparer
          blocs:
              - type: paragraphe
                texte: Pour un nombre précis, remplace x dans les deux formules. Écris les opérations dans l’ordre et garde l’unité en euros.
              - type: etapes
                elements:
                    - "Exemple de méthode : A(3) = 20 × 3 + 100."
                    - = 60 + 100.
                    - = 160 €.
                    - Calcule ensuite B(3) séparément. Ne compare pas une offre calculée pour x = 3 à une autre calculée pour x = 4.
        - titre: 3. Trouver les nombres pour lesquels les offres sont égales
          blocs:
              - type: paragraphe
                texte: Avec A(x) = 20x + 100 et B(x) = 5(x − 4)² + 180, écrire A(x) = B(x) signifie que l’on cherche les points de rencontre.
              - type: etapes
                elements:
                    - 20x + 100 = 5(x − 4)² + 180.
                    - "Développer le carré : (x − 4)² = x² − 8x + 16."
                    - "Distribuer 5 : 5x² − 40x + 80."
                    - "Ajouter 180 : B(x) = 5x² − 40x + 260."
                    - "Regrouper dans une même expression : 0 = 5x² − 60x + 160."
                    - "Mettre 5 en facteur : 0 = 5(x² − 12x + 32)."
                    - "Factoriser : 0 = 5(x − 4)(x − 8)."
        - titre: 4. Utiliser la règle du produit nul
          blocs:
              - type: paragraphe
                texte: "Si deux facteurs multipliés donnent zéro, au moins l’un des facteurs vaut zéro. C’est comme deux interrupteurs en série : le produit est nul si l’un est coupé."
          questions:
              - Résous (x − 4)(x − 8) = 0 en séparant les deux possibilités.
              - Vérifie chaque solution en la remplaçant dans les deux offres.
              - Garde seulement les solutions qui respectent les contraintes du problème.
        - titre: 5. Rédiger le conseil
          blocs:
              - type: paragraphe
                texte: La bonne offre dépend du nombre d’activités et des contraintes. Une solution d’équation est un point d’égalité, pas automatiquement la meilleure décision.
          questions:
              - Indique les effectifs où les prix sont égaux.
              - Compare les coûts de part et d’autre.
              - Rédige une recommandation avec une justification.
        - titre: Je m’entraîne — même méthode que dans le cours
          blocs:
              - type: paragraphe
                texte: Reprends les étapes de l’exemple juste au-dessus. Écris une ligne par étape et garde les unités.
          questions:
              - Avec les offres A(x) = 20x + 100 et B(x) = 5(x − 4)² + 180, calcule séparément A(3) et B(3).
              - Développe B(x) en écrivant la transformation de (x − 4)² puis la distribution de 5.
              - Résous 5(x − 4)(x − 8) = 0 en séparant les deux facteurs.
        - titre: Je transfère — une situation nouvelle
          blocs:
              - type: paragraphe
                texte: Cette fois, les nombres ou le contexte changent. Commence par identifier ce que l’on cherche, puis choisis la méthode qui convient.
          questions:
              - Deux offres sont U(x) = 15x + 80 et V(x) = 3(x − 5)² + 120. Écris l’égalité U(x) = V(x).
              - Développe, regroupe, puis cherche si une factorisation est possible.
              - Vérifie les solutions dans le contexte et rédige un conseil.
