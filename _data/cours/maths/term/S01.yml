version_papier:
    titre: Fiche papier — Pourcentages, quantités et fonctions
    introduction: "Trois outils servent souvent dans un même problème : calculer une part, retrouver une quantité entière et remplacer une lettre par un nombre."
    sections:
        - titre: 1. Calculer une réduction
          blocs:
              - type: paragraphe
                texte: Une réduction de 15 % signifie que 15 parts sur 100 sont retirées du prix. On peut calculer la remise, puis l’enlever.
              - type: etapes
                elements:
                    - "10 % de 240 € : 240 ÷ 10 = 24 €."
                    - "5 % est la moitié de 10 % : 24 ÷ 2 = 12 €."
                    - "15 % = 10 % + 5 % : 24 + 12 = 36 € de remise."
                    - "Prix payé : 240 − 36 = 204 €."
        - titre: 2. Utiliser le coefficient multiplicateur
          blocs:
              - type: paragraphe
                texte: Après −15 %, il reste 100 % − 15 % = 85 % du prix. Le coefficient est donc 0,85.
              - type: etapes
                elements:
                    - 85 % = 85 ÷ 100 = 0,85.
                    - Prix payé = 240 × 0,85 = 204 €.
                    - Les deux méthodes donnent le même prix.
        - titre: 3. Comprendre une matière sèche
          blocs:
              - type: paragraphe
                texte: Si le foin contient 85 % de matière sèche, cela veut dire que 85 kg sur 100 kg sont de la matière sèche.
              - type: etapes
                elements:
                    - "Dans 7,5 kg de foin : 7,5 × 0,85 = 6,375 kg de matière sèche."
                    - "Pour obtenir 7,5 kg de matière sèche, on cherche la masse de foin x : 0,85x = 7,5."
                    - "On divise les deux côtés par 0,85 : x = 7,5 ÷ 0,85 ≈ 8,82 kg."
                    - Il faut plus de 7,5 kg de foin, car une partie de sa masse n’est pas de la matière sèche.
        - titre: 4. Résoudre une équation
          blocs:
              - type: paragraphe
                texte: "Une équation est une balance : pour garder l’équilibre, on fait la même opération à gauche et à droite."
              - type: etapes
                elements:
                    - 2x + 5 = 17.
                    - "On retire 5 des deux côtés : 2x = 12."
                    - "On divise les deux côtés par 2 : x = 6."
                    - "Vérification : 2 × 6 + 5 = 17."
        - titre: 5. Image et antécédent
          blocs:
              - type: paragraphe
                texte: Pour calculer l’image, on connaît x et on calcule le résultat. Pour chercher un antécédent, on connaît le résultat et on cherche le x qui le produit.
              - type: code
                texte: |-
                    Si f(x) = 2x + 5 :
                    Image de 4 : f(4) = 2 × 4 + 5 = 8 + 5 = 13.
                    Antécédent de 17 : 2x + 5 = 17, donc x = 6.
          questions:
              - Calcule l’image de 10.
              - Cherche l’antécédent de 25.
        - titre: Je m’entraîne — même méthode que dans le cours
          blocs:
              - type: paragraphe
                texte: Reprends les étapes de l’exemple juste au-dessus. Écris une ligne par étape et garde les unités.
          questions:
              - Calcule 10 %, puis 5 %, puis 15 % de 320 €.
              - Un aliment contient 80 % de matière sèche. Quelle masse sèche trouve-t-on dans 6 kg ?
              - Résous 3x + 4 = 19 et vérifie en remplaçant x.
        - titre: Je transfère — une situation nouvelle
          blocs:
              - type: paragraphe
                texte: Cette fois, les nombres ou le contexte changent. Commence par identifier ce que l’on cherche, puis choisis la méthode qui convient.
          questions:
              - Un article à 320 € subit une remise de 12 %. Calcule le prix payé de deux façons.
              - On veut obtenir 9 kg de matière sèche avec un foin à 80 %. Quelle masse de foin faut-il ?
              - Une fonction est g(x) = 3x + 4. Cherche l’antécédent de 25 et explique ta vérification.
