titre: Remise en route et diagnostic
theme: calcul mental et opérations.
problematique: Remise en route et diagnostic
pourquoi: "Objectif de cette séance : Effectuer et expliquer des calculs simples."
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances: []
    competences:
        - Effectuer et expliquer des calculs simples.
        - Calculer une réduction et vérifier un prix.
        - Utiliser des pourcentages dans une situation professionnelle.
        - Retrouver une valeur inconnue à partir d'une relation mathématique.
        - Vérifier un résultat et expliquer notre raisonnement.
activites:
    - id: a03
      titre: "1. Automatismes : remettre la machine en route"
      contenu:
          - type: paragraphe
            texte: "Notion : calcul mental et opérations."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? Le calcul mental consiste à effectuer des opérations en utilisant les tables, les propriétés des nombres et des décompositions simples.
          - type: paragraphe
            texte: À quoi ça sert ? À estimer un prix, vérifier une quantité, partager une commande ou repérer une erreur de calcul.
          - type: paragraphe
            texte: Pourquoi commencer par cet exercice ?
          - type: paragraphe
            texte: Avant de résoudre des problèmes professionnels, nous devons retrouver quelques automatismes. Cela nous permettra ensuite de nous concentrer sur les situations plutôt que sur chaque opération.
          - type: paragraphe
            texte: Calculatrice interdite. Effectuez les calculs suivants. Écrivez une étape lorsque vous utilisez une astuce.
          - type: liste
            elements:
                - 7 × 8
                - 84 ÷ 7
                - 20 - 3 × 4
                - 2,5 × 4
                - La moitié de 70
                - Le quart de 80
                - 10 % de 250
                - 25 % de 80
                - "Compléter : 3/4 = ............ / 20"
                - "Résoudre : x + 7 = 19"
          - type: paragraphe
            texte: "Réflexe Bac :"
          - type: paragraphe
            texte: Avant de prendre une calculatrice, demandez-vous si une décomposition simple permet de calculer mentalement. Une démarche expliquée est aussi importante que le résultat.
      questions: []
    - id: a04
      titre: "2. Pourcentages : comprendre une réduction"
      contenu:
          - type: paragraphe
            texte: "Notion : pourcentage et coefficient multiplicateur."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? Un pourcentage représente une proportion sur 100. Par exemple, 15 % signifie 15 parts sur 100 parts égales.
          - type: paragraphe
            texte: À quoi ça sert ? À calculer une réduction, une augmentation de prix, une remise commerciale ou une variation de consommation.
          - type: paragraphe
            texte: Pourquoi passons-nous à cette activité ?
          - type: paragraphe
            texte: Nous savons calculer des pourcentages simples. Nous allons maintenant les utiliser pour déterminer combien coûte réellement un équipement après une réduction.
          - type: paragraphe
            texte: "Ce que cela vous apporte : savoir vérifier une remise annoncée et préparer un budget d'achat."
          - type: paragraphe
            texte: "Situation professionnelle : une entreprise souhaite acheter un équipement coûtant 240 €. Le fournisseur propose une réduction de 15 %."
          - type: paragraphe
            texte: Calculatrice autorisée.
      questions: []
    - id: a05
      titre: "Exercice 1 : Retrouver le montant de la réduction"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Avant de calculer le prix final, nous devons comprendre combien représente réellement une réduction de 15 %.
      questions:
          - id: q01
            type: texte
            enonce: Calculer 10 % de 240 €.
            suite: []
          - id: q02
            type: texte
            enonce: Calculer 5 % de 240 € en utilisant le résultat précédent.
            suite: []
          - id: q03
            type: texte
            enonce: En déduire 15 % de 240 €.
            suite: []
          - id: q04
            type: texte
            enonce: Quel est le montant de la réduction proposée ?
            suite: []
    - id: a06
      titre: "Exercice 2 : Calculer le prix réellement payé"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Connaître une réduction ne suffit pas pour préparer un budget. Il faut déterminer le prix final.
      questions:
          - id: q01
            type: texte
            enonce: Calculer le prix de l'équipement après réduction.
            suite: []
          - id: q02
            type: texte
            enonce: Expliquer pourquoi ce résultat est cohérent.
            suite: []
    - id: a07
      titre: "Exercice 3 : Retrouver directement le prix final"
      contenu:
          - type: paragraphe
            texte: Pourquoi changer de méthode ? Lorsque l'on doit calculer de nombreux prix, une méthode directe permet de gagner du temps sans changer le résultat.
      questions:
          - id: q01
            type: texte
            enonce: Quel pourcentage du prix initial reste-t-il après une réduction de 15 % ?
            suite: []
          - id: q02
            type: texte
            enonce: Écrire ce pourcentage sous forme décimale.
            suite: []
          - id: q03
            type: texte
            enonce: Multiplier 240 par ce nombre. Que constatez-vous ?
            suite:
                - type: paragraphe
                  texte: "Méthode à retenir :"
                - type: paragraphe
                  texte: Pour calculer une diminution de t %, on peut multiplier la valeur initiale par 1 - t/100.
                - type: paragraphe
                  texte: Pour une diminution de 15 %, le coefficient multiplicateur est 0,85.
    - id: a08
      titre: "3. Pourcentages et fourrage : comprendre une quantité"
      contenu:
          - type: paragraphe
            texte: "Notion : proportion, pourcentage et conversion entre matière sèche et foin brut."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? Un aliment contient différentes matières, notamment de l'eau. La matière sèche correspond à ce qui reste lorsque l'on retire cette eau.
          - type: paragraphe
            texte: À quoi ça sert ? À comprendre une donnée alimentaire, calculer une quantité de fourrage et éviter de confondre la masse distribuée avec la quantité de matière sèche apportée.
          - type: paragraphe
            texte: Pourquoi changeons-nous de situation ?
          - type: paragraphe
            texte: Nous venons d'utiliser un pourcentage pour calculer un prix. Nous allons maintenant utiliser la même méthode pour comprendre une quantité de fourrage.
          - type: paragraphe
            texte: "Ce que cela vous apporte : savoir réutiliser une méthode mathématique dans une situation professionnelle différente."
          - type: paragraphe
            texte: "Parallèle TIM et mathématiques :"
          - type: paragraphe
            texte: En TIM, nous pouvons organiser les données dans un tableau et automatiser les calculs. En mathématiques, nous cherchons à comprendre les opérations, les unités et la cohérence des résultats.
          - type: paragraphe
            texte: Même situation professionnelle, compétences différentes.
          - type: paragraphe
            texte: Dans un exemple présenté par l'IFCE, un cheval de 500 kg reçoit une quantité de matière sèche en fourrages correspondant à 1,5 % de son poids vif.
          - type: paragraphe
            texte: Le foin utilisé contient 85 % de matière sèche.
          - type: paragraphe
            texte: "Source : IFCE – équipédia – Les besoins alimentaires du cheval."
          - type: lien
            titre: IFCE – équipédia – Les besoins alimentaires du cheval
            url: https://equipedia.ifce.fr/elevage-et-entretien/alimentation/nutrition-et-ration/les-besoins-alimentaires-du-cheval
          - type: paragraphe
            texte: Calculatrice autorisée.
      questions: []
    - id: a09
      titre: "Exercice 1 : Calculer la quantité de matière sèche"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous allons utiliser un pourcentage pour retrouver une quantité en kilogrammes, et non plus une somme en euros.
      questions:
          - id: q01
            type: texte
            enonce: Écrire 1,5 % sous forme décimale.
            suite: []
          - id: q02
            type: texte
            enonce: Calculer 1,5 % de 500 kg.
            suite: []
          - id: q03
            type: texte
            enonce: Expliquer ce que représente le résultat obtenu.
            suite: []
    - id: a10
      titre: "Exercice 2 : Comprendre la composition du foin"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous devons vérifier qu'une quantité de foin brut apporte réellement la quantité de matière sèche recherchée.
      questions:
          - id: q01
            type: texte
            enonce: Que signifie « un foin contenant 85 % de matière sèche » ?
            suite: []
          - id: q02
            type: texte
            enonce: Calculer la masse de matière sèche présente dans 7,5 kg de ce foin.
            suite: []
          - id: q03
            type: texte
            enonce: Expliquer pourquoi 7,5 kg de foin brut ne suffisent pas pour apporter 7,5 kg de matière sèche.
            suite: []
    - id: a11
      titre: "Exercice 3 : Déterminer la masse de foin nécessaire"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Dans une situation professionnelle, nous connaissons parfois le besoin à satisfaire, mais pas encore la quantité de produit à utiliser. Il faut alors retrouver cette quantité.
      questions:
          - id: q01
            type: texte
            enonce: Calculer 7,5 ÷ 0,85.
            suite: []
          - id: q02
            type: texte
            enonce: Arrondir le résultat au dixième de kilogramme.
            suite: []
          - id: q03
            type: texte
            enonce: Comparer votre résultat avec la valeur de 8,82 kg donnée dans l'exemple de l'IFCE.
            suite: []
          - id: q04
            type: texte
            enonce: Expliquer pourquoi le résultat doit être supérieur à 7,5 kg.
            suite:
                - type: paragraphe
                  texte: "Réflexe Bac :"
                - type: paragraphe
                  texte: Avant de valider un résultat, vérifiez ce qu'il représente, son unité et sa cohérence avec la situation.
    - id: a12
      titre: "4. Équations et fonctions : retrouver une valeur inconnue"
      contenu:
          - type: paragraphe
            texte: "Notions : équation, fonction, image et antécédent."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? Une équation est une égalité contenant une valeur inconnue. Une fonction est une règle qui associe une valeur de sortie à une valeur d'entrée.
          - type: paragraphe
            texte: À quoi ça sert ? À retrouver une quantité inconnue, calculer un coût à partir d'une formule ou déterminer quelle valeur de départ permet d'obtenir un résultat donné.
          - type: paragraphe
            texte: Pourquoi passons-nous aux équations ?
          - type: paragraphe
            texte: Dans l'activité précédente, nous avons recherché une masse de foin inconnue. Nous allons maintenant apprendre à retrouver une valeur inconnue à l'aide d'une égalité.
          - type: paragraphe
            texte: "Ce que cela vous apporte : savoir résoudre un problème même lorsque la valeur recherchée n'est pas directement donnée."
          - type: paragraphe
            texte: "On considère la relation suivante : f(x) = 2x + 5."
          - type: paragraphe
            texte: Elle peut, par exemple, représenter un coût en euros comprenant 5 € de frais fixes et 2 € par unité achetée.
      questions: []
    - id: a13
      titre: "Exercice 1 : Retrouver une quantité inconnue"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous allons apprendre à retrouver une valeur de départ lorsque nous connaissons le résultat final.
          - type: paragraphe
            texte: Calculatrice interdite.
      questions:
          - id: q01
            type: texte
            enonce: "Résoudre l'équation : 2x + 5 = 17."
            suite: []
          - id: q02
            type: texte
            enonce: Vérifier la solution obtenue en remplaçant x par sa valeur.
            suite: []
    - id: a14
      titre: "Exercice 2 : Calculer une image"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous allons utiliser une formule pour calculer un résultat à partir d'une valeur connue.
          - type: paragraphe
            texte: Calculatrice autorisée.
      questions:
          - id: q01
            type: texte
            enonce: Calculer f(4).
            suite: []
          - id: q02
            type: texte
            enonce: Calculer f(10).
            suite:
                - type: paragraphe
                  texte: "Vocabulaire :"
                - type: paragraphe
                  texte: Dans f(4) = 13, le nombre 13 est l'image de 4 par la fonction f. Le nombre 4 est un antécédent de 13.
    - id: a15
      titre: "Exercice 3 : Retrouver un antécédent"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous allons relier les fonctions aux équations pour retrouver une valeur de départ à partir du résultat souhaité.
          - type: paragraphe
            texte: Calculatrice autorisée.
      questions:
          - id: q01
            type: texte
            enonce: Quel nombre possède 17 comme image par la fonction f ? Justifier votre réponse.
            suite: []
    - id: a16
      titre: 5. Mon premier bilan
      contenu:
          - type: paragraphe
            texte: Pourquoi ce bilan ? Il permet de savoir ce que vous maîtrisez déjà et les notions que nous devrons retravailler pendant l'année.
          - type: paragraphe
            texte: Calculatrice interdite. Aucun calcul n'est nécessaire.
          - type: paragraphe
            texte: Pour chaque ligne, cochez la case qui vous correspond le mieux.
          - type: tableau
            colonnes:
                - Je sais...
                - Oui
                - À revoir
                - Je ne sais plus
            lignes:
                - - Effectuer des calculs simples mentalement
                  - ☐
                  - ☐
                  - ☐
                - - Calculer un pourcentage
                  - ☐
                  - ☐
                  - ☐
                - - Utiliser un coefficient multiplicateur
                  - ☐
                  - ☐
                  - ☐
                - - Expliquer un calcul de proportion
                  - ☐
                  - ☐
                  - ☐
                - - Résoudre une équation simple
                  - ☐
                  - ☐
                  - ☐
                - - Calculer l'image d'un nombre
                  - ☐
                  - ☐
                  - ☐
                - - Comprendre ce qu'est un antécédent
                  - ☐
                  - ☐
                  - ☐
          - type: paragraphe
            texte: "Une notion que je maîtrise plutôt bien : ........................................................"
          - type: paragraphe
            texte: "Une notion que je dois retravailler : ........................................................"
      questions: []
    - id: a17
      titre: 6. Ce que je dois savoir faire
      contenu:
          - type: paragraphe
            texte: Pourquoi cette dernière étape ? Elle permet de distinguer les méthodes importantes des exemples utilisés pendant la séance.
          - type: liste
            elements:
                - Effectuer un calcul simple en respectant les priorités opératoires.
                - Utiliser une stratégie de calcul mental.
                - Calculer un pourcentage et interpréter son résultat.
                - Passer d'un pourcentage à son écriture décimale.
                - Utiliser un coefficient multiplicateur pour calculer une réduction.
                - Comprendre une proportion dans une situation professionnelle.
                - Vérifier les unités et la cohérence d'un résultat.
                - Résoudre une équation simple et vérifier sa solution.
                - Calculer une image et rechercher un antécédent.
                - Expliquer une démarche et conserver les traces de calcul.
      questions: []
    - id: a18
      titre: À retenir
      contenu:
          - type: liste
            elements:
                - Un pourcentage représente une proportion exprimée sur 100.
                - 15 % correspond à 0,15 sous forme décimale.
                - Une diminution de 15 % correspond à un coefficient multiplicateur de 0,85.
                - Un résultat doit toujours être interprété avec son unité et vérifié.
                - Une équation permet de rechercher une valeur inconnue.
                - Une fonction associe une valeur de sortie à chaque valeur d'entrée de son domaine.
                - Une même situation professionnelle peut être étudiée en TIM et en mathématiques avec des objectifs différents.
                - Une démarche expliquée est aussi importante que le résultat final.
      questions: []
    - id: a19
      titre: Sources et ressources
      contenu:
          - type: liste
            elements:
                - "Chlorofil – Baccalauréat professionnel : tronc commun – référentiel et documents d'accompagnement."
                - Chlorofil – Document d'accompagnement MG1 – attendus et automatismes mathématiques.
                - IFCE – équipédia – Les besoins alimentaires du cheval – exemple professionnel utilisé pour le calcul du fourrage.
          - type: lien
            titre: "Chlorofil – Baccalauréat professionnel : tronc commun"
            url: https://chlorofil.fr/diplomes/secondaire/bac-pro/1re-tle/tronc-commun
          - type: lien
            titre: Chlorofil – Document d'accompagnement MG1
            url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/bacpro/bacpro-tc-da-MG1.pdf
          - type: lien
            titre: IFCE – équipédia – Les besoins alimentaires du cheval
            url: https://equipedia.ifce.fr/elevage-et-entretien/alimentation/nutrition-et-ration/les-besoins-alimentaires-du-cheval
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
introduction:
    - type: titre
      texte: Ce que nous allons apprendre
    - type: paragraphe
      texte: "Aujourd'hui, nous allons retrouver plusieurs outils mathématiques : le calcul mental, les pourcentages, les proportions, les équations et les fonctions."
    - type: titre
      texte: Ce que nous allons apprendre à faire
    - type: liste
      elements:
          - Effectuer et expliquer des calculs simples.
          - Calculer une réduction et vérifier un prix.
          - Utiliser des pourcentages dans une situation professionnelle.
          - Retrouver une valeur inconnue à partir d'une relation mathématique.
          - Vérifier un résultat et expliquer notre raisonnement.
    - type: paragraphe
      texte: Pourquoi travailler ces notions ?
    - type: paragraphe
      texte: En entreprise, dans une exploitation agricole ou dans une écurie, les mathématiques permettent de vérifier un prix, prévoir une quantité, comprendre une consommation et prendre des décisions.
    - type: paragraphe
      texte: Nous commencerons par des calculs simples, puis nous les utiliserons dans des situations professionnelles. Enfin, nous apprendrons à retrouver une valeur inconnue.
    - type: paragraphe
      texte: "Important : cette première séance n'est pas une évaluation notée. Elle permet de retrouver nos connaissances et d'identifier ce que nous devrons retravailler."
reperes_officiels:
