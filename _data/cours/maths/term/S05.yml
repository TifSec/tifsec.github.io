retenir:
    - Une fonction du second degré s'écrit f(x) = ax² + bx + c, avec a différent de 0.
    - Sa représentation graphique est une parabole.
    - La forme canonique est f(x) = a(x - α)² + β.
    - Le sommet a pour coordonnées S(α ; β).
    - Si a est positif, la parabole possède un minimum égal à β.
    - Si a est négatif, elle possède un maximum égal à β.
    - Une solution mathématique doit respecter les contraintes du problème.
bilan: "Retrouver les méthodes et les notions de la séance : carrés, calcul d’images, tableau, forme canonique, sommet, minimum et décision sous contraintes."
