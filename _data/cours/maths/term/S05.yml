titre: Fonction du second degré – Rechercher un coût minimal
theme: Mathématiques — Fonctions du second degré
problematique: Combien d’interventions faut-il prévoir chaque mois pour obtenir le coût estimé le plus faible ?
pourquoi: Certaines situations ne suivent pas la règle des fonctions affines. Un coût peut diminuer, atteindre un minimum, puis augmenter.
application: Un centre équestre cherche à organiser l’entretien mensuel de sa carrière. Les coûts utilisés dans cette séance sont fictifs.
lien_precedent: "En séance 4, nous avons travaillé avec des fonctions affines : lorsque x augmente de 1, le résultat change toujours de la même quantité."
objectifs:
    connaissances:
        - Comprendre pourquoi un coût peut diminuer puis augmenter.
        - Reconnaître une fonction du second degré.
        - Comprendre ce qu'est une parabole et où se trouve son minimum.
        - Comprendre d'où vient la forme canonique et à quoi elle sert.
        - Choisir une solution adaptée à des contraintes professionnelles.
    competences:
        - Calculer le carré d'un nombre et remplacer une lettre par une valeur.
        - Calculer et comparer les coûts de plusieurs organisations.
        - Lire un tableau de valeurs et décrire les variations d'une fonction.
        - Développer une expression contenant un carré.
        - Utiliser une forme canonique pour déterminer un minimum.
        - Justifier une décision avec des calculs et des arguments professionnels.
activites:
    - id: a01
      titre: "Retrouver les bases : carrés et calculs"
      contenu:
          - type: titre
            texte: Notre situation professionnelle
          - type: paragraphe
            texte: Un centre équestre cherche à organiser l'entretien mensuel de sa carrière.
          - type: paragraphe
            texte: Un entretien trop rare peut entraîner des interventions correctives coûteuses. Un entretien trop fréquent peut augmenter les dépenses de main-d'œuvre et de matériel.
          - type: paragraphe
            texte: "Problème : combien d'interventions faut-il prévoir chaque mois pour obtenir le coût estimé le plus faible ?"
          - type: paragraphe
            texte: Les coûts utilisés dans cette séance sont fictifs. Ils servent à apprendre à utiliser un modèle mathématique.
          - type: titre
            texte: Pourquoi ce nouveau chapitre ?
          - type: paragraphe
            texte: "En séance 4, nous avons travaillé avec des fonctions affines : lorsque x augmente de 1, le résultat change toujours de la même quantité."
          - type: paragraphe
            texte: Mais certaines situations ne suivent pas cette règle. Un coût peut diminuer, atteindre un minimum, puis augmenter.
          - type: paragraphe
            texte: "Nous allons donc découvrir une autre famille de fonctions : les fonctions du second degré."
          - type: paragraphe
            texte: "Notion : le carré d'un nombre."
          - type: paragraphe
            texte: Qu'est-ce que c'est ? Calculer le carré d'un nombre signifie multiplier ce nombre par lui-même.
          - type: paragraphe
            texte: "Par exemple : 4² = 4 × 4 = 16."
          - type: paragraphe
            texte: À quoi ça sert ? Les fonctions du second degré contiennent un terme en x². Il faut donc comprendre les carrés avant d'utiliser ces fonctions.
          - type: paragraphe
            texte: "Une image pour comprendre : un carré de quatre cases de côté contient 4 × 4 = 16 cases. C'est l'origine géométrique de l'expression « au carré »."
          - type: paragraphe
            texte: Pourquoi ces exercices ? Nous allons vérifier les calculs indispensables pour la suite.
          - type: paragraphe
            texte: Calculatrice interdite.
      questions:
          - id: q01
            type: texte
            enonce: Calculer 7² et expliquer ce que signifie le petit 2.
            libelle: Question 1
          - id: q02
            type: texte
            enonce: Calculer (-4)² puis -4². Expliquer la différence.
            libelle: Question 2
          - id: q03
            type: texte
            enonce: Résoudre x² = 25. Combien existe-t-il de solutions ?
            libelle: Question 3
          - id: q04
            type: nombre
            enonce: Calculer 2 × 5² - 3 × 5 en respectant les priorités.
            libelle: Question 4
          - id: q05
            type: texte
            enonce: Développer (x - 3)².
            libelle: Question 5
            suite:
                - type: titre
                  texte: Réflexe Bac
                - type: paragraphe
                  texte: "Lorsque vous développez (a - b)², n'oubliez jamais le terme du milieu :"
                - type: paragraphe
                  texte: (a - b)² = a² - 2ab + b²
    - id: a02
      titre: Comprendre une fonction du second degré
      contenu:
          - type: paragraphe
            texte: "Notion : fonction et fonction du second degré."
          - type: paragraphe
            texte: "Qu'est-ce qu'une fonction ? Une fonction est une règle de calcul : on choisit une valeur de x, puis la formule donne un résultat."
          - type: paragraphe
            texte: "Une analogie : imaginez une machine. Vous entrez un nombre, elle effectue des calculs et affiche un résultat."
          - type: paragraphe
            texte: Dans notre problème, nous entrons un nombre d'interventions et la fonction affiche un coût estimé.
          - type: paragraphe
            texte: "Une fonction du second degré peut s'écrire :"
          - type: paragraphe
            texte: f(x) = ax² + bx + c, avec a différent de 0.
          - type: paragraphe
            texte: Les lettres a, b et c représentent des nombres fixes. La lettre x représente la valeur que nous faisons varier.
          - type: paragraphe
            texte: À quoi ça sert ? Cette famille de fonctions peut notamment modéliser des situations où une grandeur diminue puis augmente, ou augmente puis diminue.
          - type: titre
            texte: Le modèle du centre équestre
          - type: paragraphe
            texte: "Le responsable utilise la formule :"
          - type: paragraphe
            texte: C(x) = 5x² - 40x + 260
          - type: liste
            elements:
                - "x : le nombre d'interventions d'entretien réalisées dans le mois."
                - "5x² : représente des coûts qui augmentent de plus en plus rapidement lorsque le nombre d'interventions devient important."
                - "-40x : représente l'effet des économies réalisées grâce à une meilleure organisation des interventions."
                - "+260 : représente le coût théorique de départ, pour zéro intervention."
                - "C(x) : le coût total estimé, en euros."
          - type: paragraphe
            texte: "Dans cette formule : a = 5, b = -40 et c = 260."
          - type: titre
            texte: "Exercice 1 : Comprendre les lettres"
          - type: paragraphe
            texte: Pourquoi cet exercice ? Une formule n'est utile que si nous savons ce que représentent ses lettres et ses résultats.
          - type: paragraphe
            texte: Calculatrice autorisée.
      questions:
          - id: q01
            type: texte
            enonce: Expliquer ce que représente x dans notre problème.
            libelle: "Exercice 1 : Comprendre les lettres · Question 1"
          - id: q02
            type: texte
            enonce: Expliquer ce que signifie C(3).
            libelle: "Exercice 1 : Comprendre les lettres · Question 2"
          - id: q03
            type: texte
            enonce: Pourquoi cette fonction est-elle du second degré ?
            libelle: "Exercice 1 : Comprendre les lettres · Question 3"
          - id: q04
            type: texte
            enonce: Calculer C(3) en remplaçant x par 3 partout dans la formule.
            libelle: "Exercice 1 : Comprendre les lettres · Question 4"
            suite:
                - type: titre
                  texte: "Exercice 2 : Comparer deux organisations"
                - type: paragraphe
                  texte: Pourquoi cet exercice ? Nous allons vérifier si deux fréquences d'entretien différentes peuvent entraîner le même coût.
          - id: q05
            type: texte
            enonce: Calculer C(2) et C(6), puis comparer les résultats.
            libelle: "Exercice 2 : Comparer deux organisations · Question 5"
          - id: q06
            type: texte
            enonce: Comment expliquer que deux fréquences différentes puissent donner le même coût ?
            libelle: "Exercice 2 : Comparer deux organisations · Question 6"
      ressources:
          - type: paragraphe
            texte: Pour vérifier la saisie d’un carré, testez 4^2 et 4*4 dans la calculatrice. Respectez l’interdiction de calculatrice dans les parties 1 et 7.
          - type: lien
            titre: GeoGebra — calculatrice
            url: https://www.geogebra.org/calculator
    - id: a03
      titre: Observer les variations et trouver le minimum
      contenu:
          - type: paragraphe
            texte: "Notions : tableau de valeurs, fonction croissante, fonction décroissante et minimum."
          - type: paragraphe
            texte: Qu'est-ce qu'une variation ? C'est la manière dont le résultat évolue lorsque x augmente.
          - type: paragraphe
            texte: Si le résultat augmente, la fonction est croissante. S'il diminue, elle est décroissante.
          - type: paragraphe
            texte: À quoi ça sert ? Cela permet de comprendre à partir de quel moment une décision devient moins avantageuse.
          - type: paragraphe
            texte: "Une analogie : sur une route, vous pouvez descendre vers le fond d'une vallée puis remonter. La descente correspond à une fonction décroissante, la montée à une fonction croissante."
          - type: titre
            texte: "Exercice 1 : Compléter un tableau de valeurs"
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous allons comparer les huit fréquences autorisées pour observer l'évolution complète du coût.
          - type: paragraphe
            texte: Calculatrice autorisée.
      questions:
          - id: q01
            type: tableau
            enonce: Compléter le tableau de valeurs de C(x) pour x allant de 1 à 8.
            libelle: "Exercice 1 : Compléter un tableau de valeurs · Question 1"
            colonnes:
                - x
                - "1"
                - "2"
                - "3"
                - "4"
                - "5"
                - "6"
                - "7"
                - "8"
            lignes:
                - - C(x) en €
                  - ""
                  - "200"
                  - ""
                  - ""
                  - ""
                  - "200"
                  - ""
                  - ""
            suite:
                - type: titre
                  texte: "Exercice 2 : Comprendre les variations"
                - type: paragraphe
                  texte: "Pourquoi cet exercice ? Nous ne voulons pas seulement trouver un nombre : nous voulons comprendre comment les coûts évoluent."
          - id: q02
            type: texte
            enonce: Décrire l'évolution du coût lorsque x passe de 1 à 4.
            libelle: "Exercice 2 : Comprendre les variations · Question 2"
          - id: q03
            type: texte
            enonce: Décrire l'évolution du coût lorsque x passe de 4 à 8.
            libelle: "Exercice 2 : Comprendre les variations · Question 3"
          - id: q04
            type: texte
            enonce: Quelle fréquence donne le coût le plus faible ? Préciser le coût correspondant.
            libelle: "Exercice 2 : Comprendre les variations · Question 4"
          - id: q05
            type: texte
            enonce: Calculer les écarts C(2) - C(1), C(3) - C(2) et C(4) - C(3). Que remarquez-vous ?
            libelle: "Exercice 2 : Comprendre les variations · Question 5"
            suite:
                - type: titre
                  texte: La parabole
                - type: paragraphe
                  texte: La représentation graphique d'une fonction du second degré est une courbe appelée parabole.
                - type: paragraphe
                  texte: Lorsque le coefficient de x² est positif, elle est tournée vers le haut et possède un minimum.
                - type: paragraphe
                  texte: Lorsque ce coefficient est négatif, elle est tournée vers le bas et possède un maximum.
                - type: paragraphe
                  texte: "Dans notre modèle, le coefficient de x² vaut 5 : la parabole est donc tournée vers le haut."
    - id: a04
      titre: Comprendre et construire la forme canonique
      contenu:
          - type: paragraphe
            texte: "Notion : forme canonique."
          - type: paragraphe
            texte: Qu'est-ce que c'est ? C'est une autre écriture de la même fonction du second degré. Elle permet de lire directement la position du sommet et la valeur du minimum ou du maximum.
          - type: paragraphe
            texte: À quoi ça sert ? Elle évite de devoir tester toutes les valeurs pour comprendre où se trouve le point le plus bas ou le plus haut de la parabole.
          - type: paragraphe
            texte: "Une analogie : le tableau donne plusieurs mesures d'altitude dans une vallée. La forme canonique indique directement où se trouve le fond de la vallée et quelle est son altitude."
          - type: titre
            texte: Deux écritures pour une même fonction
          - type: paragraphe
            texte: "Forme développée : C(x) = 5x² - 40x + 260"
          - type: paragraphe
            texte: "Forme canonique : C(x) = 5(x - 4)² + 180"
          - type: paragraphe
            texte: Les deux formules donnent exactement les mêmes résultats pour une même valeur de x.
          - type: paragraphe
            texte: Nous allons maintenant comprendre comment passer de la première à la seconde.
          - type: titre
            texte: "Étape 1 : Mettre le coefficient du carré en facteur"
          - type: paragraphe
            texte: "Nous partons de :"
          - type: paragraphe
            texte: C(x) = 5x² - 40x + 260
          - type: paragraphe
            texte: "Dans les deux premiers termes, nous pouvons mettre 5 en facteur :"
          - type: paragraphe
            texte: C(x) = 5(x² - 8x) + 260
          - type: paragraphe
            texte: Pourquoi -8x ? Parce que -40x ÷ 5 = -8x.
          - type: titre
            texte: "Étape 2 : Faire apparaître un carré"
          - type: paragraphe
            texte: Nous voulons transformer x² - 8x en une expression contenant un carré.
          - type: paragraphe
            texte: "Nous savons que :"
          - type: paragraphe
            texte: (x - 4)² = x² - 8x + 16
          - type: paragraphe
            texte: Pourquoi choisir 4 ? Parce que dans le développement de (x - 4)², le terme du milieu vaut -2 × 4 × x = -8x.
          - type: paragraphe
            texte: "Mais notre expression de départ ne contient pas +16. Nous devons donc le retirer :"
          - type: paragraphe
            texte: x² - 8x = (x - 4)² - 16
          - type: paragraphe
            texte: "Analogie : ajouter 16 €, puis retirer 16 €, ne change pas la somme de départ."
          - type: titre
            texte: "Étape 3 : Remplacer et simplifier"
          - type: paragraphe
            texte: "Nous remplaçons x² - 8x dans la formule :"
          - type: paragraphe
            texte: C(x) = 5[(x - 4)² - 16] + 260
          - type: paragraphe
            texte: "Nous distribuons le 5 :"
          - type: paragraphe
            texte: C(x) = 5(x - 4)² - 80 + 260
          - type: paragraphe
            texte: "Nous calculons -80 + 260 :"
          - type: paragraphe
            texte: C(x) = 5(x - 4)² + 180
          - type: titre
            texte: "Exercice 1 : Vérifier les deux écritures"
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous allons vérifier que la nouvelle formule représente bien la même situation.
          - type: paragraphe
            texte: Calculatrice autorisée.
      questions:
          - id: q01
            type: texte
            enonce: Développer 5(x - 4)² + 180 et retrouver la formule initiale.
            libelle: "Exercice 1 : Vérifier les deux écritures · Question 1"
          - id: q02
            type: texte
            enonce: Calculer C(3) avec la forme canonique. Retrouve-t-on le même résultat ?
            libelle: "Exercice 1 : Vérifier les deux écritures · Question 2"
      ressources:
          - type: paragraphe
            texte: Dans cette ressource, cherchez comment lire le sommet et les deux écritures d’une même fonction. Reprenez ensuite les étapes de votre cours.
          - type: lien
            titre: Chlorofil — Document d’accompagnement MG1
            url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/bacpro/bacpro-tc-da-MG1.pdf
    - id: a05
      titre: Comprendre le minimum et le sommet
      contenu:
          - type: paragraphe
            texte: "Notions : minimum, sommet et forme canonique."
          - type: paragraphe
            texte: "Reprenons notre formule :"
          - type: paragraphe
            texte: C(x) = 180 + 5(x - 4)²
          - type: paragraphe
            texte: "Elle contient deux parties :"
          - type: liste
            elements:
                - "180 : une valeur de départ."
                - "5(x - 4)² : un supplément qui dépend de l'écart entre x et 4."
          - type: paragraphe
            texte: Un carré est toujours positif ou nul. Le supplément ne peut donc jamais être négatif.
          - type: paragraphe
            texte: "Conclusion : nous ajoutons toujours zéro ou une quantité positive à 180. Le résultat ne peut donc jamais être inférieur à 180."
          - type: paragraphe
            texte: "Une analogie : imaginez que 180 € soit le fond d'une vallée. Le terme 5(x - 4)² mesure la hauteur supplémentaire lorsque nous nous éloignons du fond."
          - type: titre
            texte: "Exercice 1 : Pourquoi le minimum vaut-il 180 € ?"
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous allons justifier le minimum par un raisonnement, et non uniquement par un tableau.
          - type: paragraphe
            texte: Calculatrice autorisée.
      questions:
          - id: q01
            type: texte
            enonce: Expliquer pourquoi (x - 4)² ne peut pas être négatif.
            libelle: "Exercice 1 : Pourquoi le minimum vaut-il 180 € ? · Question 1"
          - id: q02
            type: nombre
            enonce: Pour quelle valeur de x le carré (x - 4)² vaut-il zéro ?
            libelle: "Exercice 1 : Pourquoi le minimum vaut-il 180 € ? · Question 2"
          - id: q03
            type: texte
            enonce: En déduire le coût minimal et la fréquence correspondante.
            libelle: "Exercice 1 : Pourquoi le minimum vaut-il 180 € ? · Question 3"
          - id: q04
            type: texte
            enonce: Calculer C(3) et C(5) avec la forme canonique. Que remarquez-vous ?
            libelle: "Exercice 1 : Pourquoi le minimum vaut-il 180 € ? · Question 4"
            suite:
                - type: titre
                  texte: "Exercice 2 : Comprendre le sommet"
                - type: paragraphe
                  texte: Pourquoi cet exercice ? Nous allons apprendre à décrire précisément le point le plus bas de la parabole.
                - type: titre
                  texte: Le sommet d'une parabole
                - type: paragraphe
                  texte: "Une fonction du second degré peut s'écrire :"
                - type: paragraphe
                  texte: f(x) = a(x - α)² + β
                - type: paragraphe
                  texte: Lorsque a est positif, le sommet est le point le plus bas de la parabole.
                - type: paragraphe
                  texte: Ses coordonnées sont S(α ; β).
                - type: paragraphe
                  texte: α indique où se trouve le minimum sur l'axe horizontal ; β indique la valeur du minimum sur l'axe vertical.
          - id: q05
            type: texte
            enonce: Donner les coordonnées du sommet de la parabole représentant C(x).
            libelle: "Exercice 2 : Comprendre le sommet · Question 5"
          - id: q06
            type: texte
            enonce: Pourquoi le sommet est-il appelé minimum dans notre situation ?
            libelle: "Exercice 2 : Comprendre le sommet · Question 6"
          - id: q07
            type: texte
            enonce: Vérifier que la fréquence optimale respecte les contraintes du modèle.
            libelle: "Exercice 2 : Comprendre le sommet · Question 7"
            suite:
                - type: titre
                  texte: "Réflexe Bac : trouver un minimum"
                - type: etapes
                  elements:
                      - Repérer la forme a(x - α)² + β.
                      - Vérifier que a est positif.
                      - Identifier la valeur α qui annule le carré.
                      - Lire le minimum β.
                      - Vérifier les contraintes du problème.
    - id: a06
      titre: Prendre une décision professionnelle
      contenu:
          - type: paragraphe
            texte: "Notion : optimisation sous contraintes."
          - type: paragraphe
            texte: Qu'est-ce que c'est ? Optimiser sous contraintes consiste à chercher la meilleure solution parmi celles qui sont réellement possibles.
          - type: paragraphe
            texte: À quoi ça sert ? Dans une entreprise, un calcul doit toujours être confronté au planning, au budget, aux moyens disponibles et aux besoins techniques.
          - type: paragraphe
            texte: "Une analogie : le trajet le plus court n'est pas toujours utilisable si une route est fermée. Il faut alors choisir le meilleur trajet parmi ceux qui restent accessibles."
          - type: paragraphe
            texte: Le responsable apprend qu'il ne pourra organiser que 2, 3 ou 5 interventions par mois.
          - type: titre
            texte: "Exercice 1 : Comparer les possibilités"
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous allons rechercher le coût minimal parmi les fréquences autorisées.
          - type: paragraphe
            texte: Calculatrice autorisée.
      questions:
          - id: q01
            type: texte
            enonce: Calculer les coûts pour deux, trois et cinq interventions.
            libelle: "Exercice 1 : Comparer les possibilités · Question 1"
          - id: q02
            type: texte
            enonce: Quelle fréquence minimise le coût parmi les solutions autorisées ?
            libelle: "Exercice 1 : Comparer les possibilités · Question 2"
          - id: q03
            type: nombre
            enonce: Calculer le surcoût mensuel par rapport au minimum théorique de 180 €.
            libelle: "Exercice 1 : Comparer les possibilités · Question 3"
            suite:
                - type: titre
                  texte: "Exercice 2 : Justifier un conseil professionnel"
                - type: paragraphe
                  texte: Pourquoi cet exercice ? Nous allons apprendre à utiliser les résultats mathématiques sans oublier les contraintes réelles.
            unite: € par mois
          - id: q04
            type: texte
            enonce: Pourquoi ne peut-on plus recommander automatiquement quatre interventions ?
            libelle: "Exercice 2 : Justifier un conseil professionnel · Question 4"
          - id: q05
            type: texte
            enonce: Rédiger un conseil argumenté au responsable du centre équestre.
            libelle: "Exercice 2 : Justifier un conseil professionnel · Question 5"
    - id: a07
      titre: "Bilan : vérifier sa compréhension"
      contenu:
          - type: paragraphe
            texte: Pourquoi ce bilan ? Nous allons vérifier que vous savez expliquer les notions essentielles avec vos propres mots.
          - type: paragraphe
            texte: Calculatrice interdite.
      questions:
          - id: q01
            type: texte
            enonce: Quelle est la différence entre une fonction affine et une fonction du second degré ?
            libelle: Question 1
          - id: q02
            type: texte
            enonce: Pourquoi la forme canonique est-elle utile ?
            libelle: Question 2
          - id: q03
            type: texte
            enonce: Dans C(x) = 5(x - 4)² + 180, que représentent 4 et 180 ?
            libelle: Question 3
          - id: q04
            type: texte
            enonce: Pourquoi faut-il vérifier les contraintes avant de proposer une solution ?
            libelle: Question 4
            suite:
                - type: titre
                  texte: Ce que je dois savoir faire
                - type: liste
                  elements:
                      - Calculer correctement des carrés.
                      - Reconnaître une fonction du second degré.
                      - Calculer une image d'une fonction.
                      - Compléter un tableau et décrire les variations.
                      - Comprendre la forme canonique et vérifier son développement.
                      - Identifier le sommet et le minimum d'une parabole.
                      - Justifier une décision en tenant compte des contraintes.
    - id: a08
      titre: "Pour aller plus loin : défi facultatif"
      contenu:
          - type: paragraphe
            texte: Pourquoi ce défi ? Nous allons comparer deux entreprises dont les coûts suivent des fonctions du second degré. Le but est de découvrir que le meilleur choix dépend des contraintes.
          - type: paragraphe
            texte: Calculatrice autorisée. À réaliser uniquement si le parcours principal est terminé, ou en prolongement.
          - type: paragraphe
            texte: "Le responsable compare deux entreprises :"
          - type: paragraphe
            texte: "Entreprise A : CA(x) = 5(x - 4)² + 180"
          - type: paragraphe
            texte: "Entreprise B : CB(x) = 3(x - 6)² + 190"
          - type: paragraphe
            texte: Les deux entreprises peuvent effectuer entre une et huit interventions mensuelles. Le responsable impose au moins cinq interventions par mois.
      questions:
          - id: q01
            type: texte
