version_papier:
    titre: Fiche papier — Trouver le coût minimal avec la forme canonique
    introduction: La forme canonique sert à lire rapidement le minimum d’une parabole. On va d’abord la construire, puis vérifier qu’elle raconte la même chose que la formule de départ.
    sections:
        - titre: 1. Comprendre ce que l’on cherche
          blocs:
              - type: paragraphe
                texte: "On étudie C(x) = 5x² − 40x + 260. On veut connaître le plus petit coût et le nombre x qui permet de l’obtenir. La forme canonique a la forme a(x − α)² + β : elle fait apparaître le sommet S(α ; β), c’est-à-dire le point le plus bas ou le plus haut de la parabole."
        - titre: 2. Préparer le carré
          blocs:
              - type: paragraphe
                texte: On veut transformer x² − 8x en un carré. Un carré de la forme (x − a)² donne x² − 2ax + a². Le nombre placé devant x est donc le double du nombre a.
              - type: etapes
                elements:
                    - "Ici, le coefficient de x est −8. Sa moitié est −4 : on choisit donc (x − 4)²."
                    - "Je vérifie en développant : (x − 4)(x − 4)."
                    - "Je multiplie chaque terme : x × x = x² ; x × (−4) = −4x ; (−4) × x = −4x ; (−4) × (−4) = +16."
                    - "Je regroupe : x² − 4x − 4x + 16 = x² − 8x + 16."
                    - "Mais je cherchais x² − 8x, sans le +16. J’enlève donc 16 : x² − 8x = (x − 4)² − 16."
              - type: paragraphe
                texte: "On ajoute le +16 pour fabriquer le carré, puis on retire exactement ce même 16 pour conserver la valeur de départ. C’est comme déplacer un objet de 16 cm puis le ramener : le résultat final n’a pas bougé."
              - type: paragraphe
                texte: "Dans 5(x² − 8x), le 5 multiplie tout ce qui est dans la parenthèse. Le −16 est donc lui aussi multiplié par 5 : 5 × (−16) = −80."
              - type: etapes
                elements:
                    - 5x² − 40x + 260 = 5(x² − 8x) + 260.
                    - = 5((x − 4)² − 16) + 260.
                    - "Je distribue 5 aux deux termes : 5(x − 4)² − 80 + 260."
                    - "Je calcule les nombres seuls : −80 + 260 = 180."
                    - Donc C(x) = 5(x − 4)² + 180.
        - titre: 3. Transformer la formule entière
          blocs:
              - type: paragraphe
                texte: On remplace seulement x² − 8x par le carré équivalent. Le 260 reste à l’extérieur.
              - type: etapes
                elements:
                    - C(x) = 5(x² − 8x) + 260.
                    - = 5((x − 4)² − 16) + 260.
                    - "On distribue 5 : = 5(x − 4)² − 80 + 260."
                    - On calcule −80 + 260 = 180.
                    - Donc C(x) = 5(x − 4)² + 180.
        - titre: 4. Lire le minimum et le sommet
          blocs:
              - type: paragraphe
                texte: Un carré ne peut jamais être négatif. Le plus petit carré vaut 0 ; il est obtenu quand x − 4 = 0, donc x = 4.
              - type: etapes
                elements:
                    - "À x = 4 : C(4) = 5(4 − 4)² + 180."
                    - = 5 × 0² + 180.
                    - = 180.
                    - "Le coût minimal est 180 €. Le sommet est S(4 ; 180) : 4 est le nombre d’interventions, 180 est le coût minimal."
        - titre: 5. Vérifier en développant
          blocs:
              - type: paragraphe
                texte: On vérifie la transformation dans l’autre sens. Si on retrouve la formule du départ, les deux écritures sont bien équivalentes.
          questions:
              - Développe 5(x − 4)² + 180 ligne par ligne.
              - Explique le rôle du nombre 16 ajouté puis retiré.
        - titre: Je m’entraîne — même méthode que dans le cours
          blocs:
              - type: paragraphe
                texte: Reprends les étapes de l’exemple juste au-dessus. Écris une ligne par étape et garde les unités.
          questions:
              - "Développe (x − 3)² sans sauter d’étape : écris (x − 3)(x − 3), les quatre produits, puis réduis."
              - Dans 5x² − 40x + 260, explique pourquoi on met 5 en facteur devant x² et −40x.
              - Explique pourquoi on ajoute puis retire 16 pour créer (x − 4)².
        - titre: Je transfère — une situation nouvelle
          blocs:
              - type: paragraphe
                texte: Cette fois, les nombres ou le contexte changent. Commence par identifier ce que l’on cherche, puis choisis la méthode qui convient.
          questions:
              - Transforme x² − 10x en carré diminué d’un nombre. Écris le carré développé pour contrôler.
              - Pour D(x) = 2(x − 5)² + 70, indique le x qui rend le carré égal à zéro et le coût minimal.
              - Explique ce que signifie le sommet dans une situation de coût.
