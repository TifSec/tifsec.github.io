titre: Second degré — Résoudre une équation et respecter un budget
theme: Mathématiques — Fonctions du second degré, équations et inéquations
problematique: Quelles fréquences d’entretien permettent de ne pas dépasser un budget de 200 € ?
pourquoi: Après avoir trouvé le coût minimal en S05, nous cherchons maintenant toutes les solutions qui respectent un budget.
application: "Un centre équestre organise l’entretien de sa carrière. Les coûts sont fictifs : le modèle sert à apprendre à calculer et à décider."
lien_precedent: En S05, nous avons étudié C(x) = 5x² − 40x + 260 = 5(x − 4)² + 180. Son minimum vaut 180 €, pour quatre interventions par mois.
objectifs:
    connaissances:
        - Distinguer image et antécédent.
        - Distinguer une équation et une inéquation.
        - Relier un carré, une parabole et les solutions d’un problème.
    competences:
        - Calculer une image et lire un graphique.
        - Résoudre une équation simple à partir de la forme canonique.
        - Interpréter les solutions en tenant compte des contraintes.
introduction:
    - type: paragraphe
      texte: "Séance de 55 minutes. Papier, crayon et calculatrice : les essais peuvent être faits au brouillon ; les réponses finales et les démarches sont saisies ici."
    - type: paragraphe
      texte: "Dans toute la première partie, x est un entier de 1 à 8 : le nombre d’interventions mensuelles. C(x) est le coût mensuel estimé, en euros. La courbe représente aussi les valeurs intermédiaires du modèle mathématique."
activites:
    - id: a01
      titre: Automatismes — Les carrés
      pourquoi: Réactiver les calculs utiles pour la suite.
      demarche:
          - Sans calculatrice, effectuer les calculs.
          - Pour l’équation, vérifier chaque solution par remplacement.
      contenu:
          - type: paragraphe
            texte: Un carré signifie multiplier un nombre par lui-même. Les parenthèses précisent le nombre concerné par le carré.
      questions:
          - id: q01
            type: nombre
            enonce: Calculer (−3)².
            aide: Réécris le carré sous la forme d’un produit.
          - id: q02
            type: nombre
            enonce: Calculer −3², sans parenthèses.
            aide: Le carré porte sur 3, puis on prend l’opposé.
          - id: q03
            type: texte
            enonce: Résoudre x² = 16 dans les nombres réels. Vérifier les solutions.
            aide: Un nombre positif et un nombre négatif peuvent avoir le même carré.
    - id: a02
      titre: Rappel de cours — Image, minimum et symétrie
      pourquoi: Retrouver le modèle étudié en S05.
      demarche:
          - Utiliser C(x) = 5(x − 4)² + 180.
          - Remplacer x par le nombre demandé, puis respecter les priorités.
      contenu:
          - type: paragraphe
            texte: "Le sommet est le point le plus bas de la courbe qui représente le coût C. Dans une formule comme C(x) = 5(x − 4)² + 180, si x = 4, alors x − 4 = 0 : le carré vaut 0 et le coût vaut 180. Le point S(4 ; 180) est donc le sommet de cette courbe. Comme 5 est positif et qu’un carré ne peut pas être négatif, 180 € est le coût minimal."
          - type: paragraphe
            texte: "Nous ne changeons ni le modèle ni les coûts calculés. Nous réécrivons la même formule, étape par étape, pour faire apparaître le minimum plus facilement. Chaque nouvelle ligne est égale à la précédente."
          - type: paragraphe
            texte: On choisit de sortir le coefficient 5 des deux premiers termes. 5x² ÷ 5 = x² et −40x ÷ 5 = −8x. Le nombre 260 reste à l’extérieur.
          - type: code
            texte: |-
                C(x) = 5x² − 40x + 260
                     = 5(x² − 8x) + 260
          - type: paragraphe
            texte: "Pourquoi chercher un carré ? Parce qu’un carré est toujours positif ou nul. Une formule écrite avec un carré permet donc de repérer facilement le coût minimal : il est atteint quand le carré vaut 0. Pour transformer x² − 8x, je partage le terme −8x en deux parts égales : −4x et −4x. Les deux produits croisés de (x − 4)² donneront justement −4x − 4x. Le nombre 4 est la moitié de 8."
          - type: paragraphe
            texte: "Un carré signifie que l’on multiplie l’expression par elle-même : (x − 4)² = (x − 4) × (x − 4). Nous allons multiplier chaque terme de la première parenthèse par chaque terme de la deuxième."
          - type: etapes
            elements:
                - "Je commence par x : x × x = x², puis x × (−4) = −4x."
                - "Je continue avec −4 : (−4) × x = −4x, puis (−4) × (−4) = +16. Deux signes négatifs donnent un résultat positif."
                - "Je rassemble les quatre résultats : x² − 4x − 4x + 16."
                - "Je regroupe les deux termes en x : −4x − 4x = −8x."
          - type: code
            texte: |-
                (x − 4)² = x² − 8x + 16
                x² − 8x = (x − 4)² − 16
          - type: paragraphe
            texte: "Pourquoi retirer 16 ? En développant le carré, nous avons obtenu x² − 8x + 16. Le +16 a été ajouté quand nous avons fabriqué le carré. Pour revenir exactement à x² − 8x, je retire ce même 16 : +16 − 16 = 0."
          - type: code
            texte: |-
                (x − 4)² − 16
                = x² − 8x + 16 − 16
                = x² − 8x
          - type: code
            texte: |-
                C(x) = 5[(x − 4)² − 16] + 260
                     = 5(x − 4)² − 80 + 260
                     = 5(x − 4)² + 180
          - type: paragraphe
            texte: "Attention : le 5 multiplie tout ce qui est entre crochets. Ainsi 5 × (−16) = −80. Puis −80 + 260 = 180."
          - type: paragraphe
            texte: "Nous retrouvons les deux nombres attendus : x = 4 annule le carré ; comme 5 est positif, le coût ne peut pas être inférieur à 180 €. Le sommet est S(4 ; 180)."
          - type: paragraphe
            texte: "Vérification pour x = 3 : la forme développée donne 185 ; la forme canonique donne 5 × (−1)² + 180 = 185. Cet exemple vérifie un calcul ; c’est la transformation par égalités qui justifie l’équivalence pour tout x."
          - type: paragraphe
            texte: "L’image de x est le nombre C(x). Pour calculer C(3), on remplace chaque x par 3 :"
          - type: code
            texte: |-
                C(3) = 5 × (3 − 4)² + 180
                     = 5 × 1 + 180 = 185.
          - type: paragraphe
            texte: Un carré est positif ou nul. Ainsi C(x) ≥ 180. Le minimum est atteint pour x = 4 et vaut 180 €.
          - type: paragraphe
            texte: "Deux nombres à la même distance de 4 donnent le même coût : la parabole est symétrique par rapport à la droite x = 4."
      questions:
          - id: q01
            type: nombre
            enonce: Calculer C(2). Saisir le montant en euros, sans écrire l’unité.
            aide: Commence par calculer 2 − 4.
          - id: q02
            type: nombre
            enonce: Calculer C(6). Saisir le montant en euros, sans écrire l’unité.
            aide: Commence par calculer 6 − 4.
          - id: q03
            type: texte
            enonce: Expliquer pourquoi C(2) et C(6) sont égaux.
            aide: Compare les écarts de 2 et de 6 par rapport à 4.
    - id: a03
      titre: Lecture graphique — Retrouver une information
      pourquoi: Lire une courbe avant de vérifier par le calcul.
      demarche:
          - "Sur l’axe horizontal, lire x : le nombre d’interventions."
          - Sur l’axe vertical, lire le coût en euros.
          - Pour chercher un coût donné, partir de l’axe vertical, rejoindre la courbe, puis redescendre sur l’axe horizontal.
      contenu:
          - type: image
            url: /assets/images/cours/maths-term-s06-parabole.svg
            alternative: "Courbe de C(x) = 5(x − 4)² + 180 sur [1 ; 8]. Axe horizontal : interventions mensuelles. Axe vertical : coût en euros. Droite horizontale en pointillés à 200 euros."
            legende: Le modèle est tracé pour 1 ≤ x ≤ 8. Dans le problème, on garde uniquement les nombres entiers.
          - type: paragraphe
            texte: Un antécédent de 200 est une valeur de x pour laquelle C(x) = 200. Une même image peut avoir plusieurs antécédents.
      questions:
          - id: q01
            type: texte
            enonce: Lire les coordonnées du sommet et expliquer ce que représentent ses deux coordonnées.
            aide: Repère le point le plus bas de la courbe.
          - id: q02
            type: texte
            enonce: Sur quel intervalle C est-elle décroissante ? Sur quel intervalle est-elle croissante ?
            aide: Une courbe qui descend correspond à une fonction décroissante.
          - id: q03
            type: texte
            enonce: "Lire les antécédents de 200 : pour quelles valeurs de x a-t-on C(x) = 200 ?"
            aide: Repère les intersections avec la droite horizontale en pointillés.
      ressources:
          - type: paragraphe
            texte: Si besoin, dans GeoGebra, saisir C(x)=5*(x-4)^2+180 et y=200. Chercher les intersections puis vérifier leur abscisse.
          - type: lien
            titre: GeoGebra — Tracer la fonction et la droite
            url: https://www.geogebra.org/graphing
    - id: a04
      titre: Méthode — Résoudre une équation
      pourquoi: Obtenir des solutions exactes grâce au calcul.
      demarche:
          - Lire l’exemple résolu.
          - Pour chaque exercice, isoler le carré puis envisager les deux signes.
          - Vérifier les solutions et les contraintes 1 ≤ x ≤ 8.
      contenu:
          - type: paragraphe
            texte: "Une équation impose une égalité exacte. Exemple résolu : chercher un coût de 185 €."
          - type: code
            texte: |-
                C(x) = 185
                5(x − 4)² + 180 = 185
                5(x − 4)² = 5
                (x − 4)² = 1
                x − 4 = −1 ou x − 4 = 1
                x = 3 ou x = 5.
          - type: paragraphe
            texte: "On effectue la même opération des deux côtés de l’égalité. Si A² = k avec k > 0, alors A = −√k ou A = √k. Si k = 0, A = 0. Si k < 0, aucune solution réelle : un carré ne peut pas être négatif."
      questions:
          - id: q01
            type: texte
            enonce: Résoudre C(x) = 225. Écrire les étapes et conclure en nombre d’interventions.
            aide: Après soustraction de 180 puis division par 5, cherche les deux nombres dont le carré vaut le résultat obtenu.
          - id: q02
            type: texte
            enonce: Peut-on obtenir un coût de 175 € avec ce modèle ? Justifier.
            aide: Compare 175 au minimum, ou commence à résoudre C(x) = 175.
    - id: a05
      titre: Application — Ne pas dépasser un budget
      pourquoi: Distinguer un coût exact et un plafond à respecter.
      demarche:
          - Traduire « au maximum » par une inégalité.
          - Lire la partie de la courbe située sous le plafond.
          - Garder les valeurs entières autorisées, puis appliquer la contrainte supplémentaire.
      contenu:
          - type: paragraphe
            texte: "Une inéquation contient une inégalité. « Au maximum 200 € » signifie C(x) ≤ 200. Le signe ≤ se lit « inférieur ou égal à » : le budget lui-même est accepté."
          - type: paragraphe
            texte: "Avec a > 0, l’inégalité (x − α)² ≤ a² signifie que x est à une distance d’au plus a de α : α − a ≤ x ≤ α + a. Les bornes sont incluses."
          - type: paragraphe
            texte: Sur un graphique, on cherche toute la portion de la courbe située en dessous de la droite de budget, ou sur cette droite.
      questions:
          - id: q01
            type: texte
            enonce: Traduire le budget maximal de 200 € par une inéquation, puis la transformer pour obtenir un carré seul à gauche.
            aide: Soustrais 180 des deux côtés, puis divise par 5.
          - id: q02
            type: texte
            enonce: En déduire l’intervalle des solutions réelles, puis la liste des nombres entiers d’interventions qui respectent ce budget.
            aide: "Le carré doit être inférieur ou égal à 2² : x reste à une distance d’au plus 2 de 4."
          - id: q03
            type: texte
            enonce: Le responsable demande au moins cinq interventions. Quelles possibilités restent dans le budget ? S’il veut le plus d’interventions possible, que choisir et à quel coût ?
            aide: Croise la liste précédente avec x ≥ 5, puis relis l’objectif du responsable.
    - id: a06
      titre: Exercice de transfert — Un autre contrat
      pourquoi: Réutiliser la méthode sans suivre exactement le même exemple.
      demarche:
          - Travailler seul, puis comparer la démarche avec le bilan.
          - Justifier les réponses qui ne sont pas de simples calculs.
      contenu:
          - type: paragraphe
            texte: Un autre prestataire propose le modèle fictif B(x) = 4(x − 5)² + 160, pour un nombre entier x compris entre 1 et 8. Le budget maximal est cette fois de 176 €.
      questions:
          - id: q01
            type: nombre
            enonce: Quel est le coût minimal donné par B ? Saisir le montant en euros.
            aide: Observe la forme canonique.
          - id: q02
            type: texte
            enonce: Résoudre B(x) ≤ 176. Donner l’intervalle des solutions, puis les nombres entiers possibles.
            aide: Reprends la méthode de l’activité précédente avec le nouveau centre, 5.
          - id: q03
            type: texte
            enonce: Le responsable impose au moins six interventions. Que reste-t-il ? Quelle fréquence donne le plus d’interventions sans dépasser 176 € ?
            aide: Croise la liste obtenue avec la contrainte x ≥ 6.
version_papier:
    titre: Fonctions du second degré — comprendre, calculer, décider
    introduction: "En S05, le sommet indiquait le coût minimal. Ici, on apprend à lire la formule et à trouver toutes les valeurs qui respectent un budget."
    sections:
        - titre: 1. Quel sommet cherche-t-on à lire ?
          blocs:
              - type: paragraphe
                texte: "Nous partons du coût C(x) = 5x² − 40x + 260. Cette écriture permet de calculer un coût, mais le minimum n’apparaît pas directement. Nous allons transformer l’écriture pour faire apparaître le carré (x − 4)²."
              - type: paragraphe
                texte: "Le coût ne change pas quand je passe d’une ligne à l’autre : seule son écriture change. Je peux ainsi choisir une écriture qui rend le minimum visible."
              - type: code
                texte: |-
                    Forme développée : C(x) = 5x² − 40x + 260
                    Forme canonique : C(x) = 5(x − 4)² + 180
              - type: paragraphe
                texte: "Le sommet est le point le plus bas de la courbe du coût. Dans C(x) = 5(x − 4)² + 180, je regarde la valeur qui annule le carré : x = 4. À cette valeur, le coût vaut 180. Le sommet de la courbe est donc S(4 ; 180) : 4 indique le nombre d’interventions, 180 indique le coût en euros. Comme 5 est positif et qu’un carré est toujours positif ou nul, aucun coût ne peut être inférieur à 180 €."
        - titre: 2. Transformer la formule ligne par ligne
          blocs:
              - type: titre
                texte: Étape A — Mettre 5 en facteur devant les deux premiers termes
              - type: paragraphe
                texte: "Dans 5x² − 40x, les deux termes contiennent le facteur 5. Diviser chacun par 5 donne x² et −8x. Le nombre 260 n’est pas dans ces deux termes : il reste donc à l’extérieur des parenthèses."
              - type: etapes
                elements:
                    - "Départ : C(x) = 5x² − 40x + 260."
                    - "Je réécris 5x² comme 5 × x² et −40x comme 5 × (−8x), car 5 × (−8x) = −40x."
                    - "Je peux donc mettre 5 en facteur : C(x) = 5(x² − 8x) + 260."
              - type: titre
                texte: Étape B — Pourquoi transformer x² − 8x en carré ?
              - type: paragraphe
                texte: "Nous voulons connaître le coût minimal. Une formule avec un carré nous aide, car un carré ne peut pas être négatif : on repère le minimum quand le carré vaut 0. Il faut donc réécrire x² − 8x en utilisant un carré. Dans (x − 4)², les deux produits croisés seront −4x et −4x : ensemble, ils font −8x. Le 4 est la moitié de 8. Je vérifie maintenant cette idée en effectuant les multiplications."
              - type: etapes
                elements:
                    - "J’écris le carré comme une multiplication : (x − 4)² = (x − 4) × (x − 4)."
                    - "Je multiplie x par chaque terme de la deuxième parenthèse : x × x = x² et x × (−4) = −4x."
                    - "Je multiplie −4 par chaque terme de la deuxième parenthèse : (−4) × x = −4x et (−4) × (−4) = +16. Deux nombres négatifs multipliés donnent un résultat positif."
                    - "Je rassemble les quatre produits : (x − 4)² = x² − 4x − 4x + 16."
                    - "Je regroupe les deux termes en x : −4x − 4x = −8x. Donc (x − 4)² = x² − 8x + 16."
              - type: titre
                texte: Étape C — Garder exactement x² − 8x
              - type: paragraphe
                texte: "Pourquoi retirer 16 ? En développant (x − 4)², nous avons fabriqué x² − 8x + 16. Le +16 n’était pas dans l’expression de départ. Je le retire donc pour annuler ce que le carré a ajouté et retrouver exactement x² − 8x."
              - type: code
                texte: |-
                    (x − 4)² − 16
                    = x² − 8x + 16 − 16
                    = x² − 8x
              - type: code
                texte: |-
                    (x − 4)² = x² − 8x + 16
                    Je retire 16 des deux côtés :
                    x² − 8x = (x − 4)² − 16
              - type: titre
                texte: Étape D — Remplacer puis simplifier
              - type: paragraphe
                texte: "Je remplace x² − 8x par son écriture équivalente (x − 4)² − 16 dans la formule de départ. Le 5 placé devant les crochets multiplie tout ce qui est à l’intérieur."
              - type: etapes
                elements:
                    - "Je pars de C(x) = 5(x² − 8x) + 260."
                    - "Je remplace x² − 8x : C(x) = 5((x − 4)² − 16) + 260."
                    - "Je distribue le 5 : 5 × (x − 4)² = 5(x − 4)² et 5 × (−16) = −80. J’obtiens C(x) = 5(x − 4)² − 80 + 260."
                    - "Je calcule les nombres seuls : −80 + 260 = 180. Donc C(x) = 5(x − 4)² + 180."
              - type: code
                texte: |-
                    C(x) = 5x² − 40x + 260
                         = 5(x² − 8x) + 260
                         = 5((x − 4)² − 16) + 260
                         = 5(x − 4)² − 80 + 260
                         = 5(x − 4)² + 180
              - type: titre
                texte: Je vérifie en développant dans l’autre sens
              - type: paragraphe
                texte: "Pour vérifier que les deux formules donnent bien le même coût, je développe la forme canonique. Je refais les multiplications et je regroupe les nombres."
              - type: etapes
                elements:
                    - "Je développe le carré : (x − 4)² = x² − 8x + 16."
                    - "Je remplace dans C(x) : 5(x − 4)² + 180 = 5(x² − 8x + 16) + 180."
                    - "Je distribue 5 à chacun des trois termes : 5x² − 40x + 80 + 180."
                    - "Je calcule 80 + 180 = 260 : je retrouve 5x² − 40x + 260, la formule de départ."
        - titre: 3. Lire le minimum et calculer un coût
          blocs:
              - type: paragraphe
                texte: "Dans C(x) = 5(x − 4)² + 180, un carré est toujours positif ou nul. Le plus petit carré possible vaut 0 ; il est obtenu quand x − 4 = 0, donc quand x = 4. Le coût minimal est alors 180 €. Le sommet est S(4 ; 180)."
              - type: code
                texte: |-
                    Exemple : calculer C(3)
                    C(3) = 5(3 − 4)² + 180
                         = 5 × (−1)² + 180
                         = 5 × 1 + 180
                         = 5 + 180
                         = 185 €
        - titre: 4. Résoudre une équation pas à pas
          blocs:
              - type: paragraphe
                texte: "Résoudre C(x) = 185 signifie chercher les nombres d’interventions qui donnent exactement 185 €. Je garde une égalité à chaque ligne et j’effectue la même opération des deux côtés."
              - type: etapes
                elements:
                    - "Formule de départ : 5(x − 4)² + 180 = 185."
                    - "Je retire 180 des deux côtés : 5(x − 4)² = 5."
                    - "Je divise les deux côtés par 5 : (x − 4)² = 1."
                    - "Les nombres dont le carré vaut 1 sont −1 et 1 : x − 4 = −1 ou x − 4 = 1."
                    - "Dans le premier cas, j’ajoute 4 : x = 3. Dans le second cas, j’ajoute 4 : x = 5."
                    - "Je vérifie : C(3) = 185 et C(5) = 185. Les deux solutions sont x = 3 et x = 5 interventions."
        - titre: 5. Respecter un budget maximal
          blocs:
              - type: paragraphe
                texte: "« Ne pas dépasser 200 € » signifie que le coût peut être inférieur à 200 € ou égal à 200 €. J’écris donc C(x) ≤ 200. Je transforme ensuite l’inégalité comme une équation, en faisant la même opération des deux côtés."
              - type: etapes
                elements:
                    - "Je remplace C(x) par sa formule : 5(x − 4)² + 180 ≤ 200."
                    - "Je retire 180 à gauche et à droite : 5(x − 4)² ≤ 20."
                    - "Je divise à gauche et à droite par 5. Comme 5 est positif, le sens de ≤ ne change pas : (x − 4)² ≤ 4."
                    - "Je reconnais 4 = 2². Un nombre dont le carré ne dépasse pas 2² est compris entre −2 et 2 : −2 ≤ x − 4 ≤ 2."
                    - "J’ajoute 4 aux trois membres de l’inégalité : 2 ≤ x ≤ 6."
              - type: paragraphe
                texte: "La dernière ligne donne les valeurs réelles possibles. Dans le problème, x est un nombre entier de 1 à 8 : je garde donc 2, 3, 4, 5 et 6 interventions. Les bornes 2 et 6 sont gardées, car un coût égal à 200 € respecte le budget maximal."
        - titre: 6. Exercices d’entraînement
          questions:
              - Calculer C(2) et C(6). Expliquer pourquoi les résultats sont égaux.
              - Lire sur le graphique le sommet et les solutions de C(x) = 200.
              - Résoudre C(x) = 225, puis vérifier les solutions dans le modèle.
              - Le budget est de 200 € et il faut au moins cinq interventions. Que peut choisir le responsable ?
              - Avec B(x) = 4(x − 5)² + 160, quelles valeurs entières respectent un budget de 176 € ?
        - titre: À retenir
          blocs:
              - type: liste
                elements:
                    - "Image : résultat obtenu pour une valeur de x. Antécédent : valeur de x qui donne un résultat fixé."
                    - "Une équation cherche une égalité exacte ; une inéquation cherche toutes les valeurs qui respectent une limite."
                    - "Après avoir résolu, vérifier le domaine et les contraintes concrètes du problème."
retenir:
    - Une image est le résultat C(x) ; un antécédent est une valeur de x donnant un résultat fixé.
    - "Résoudre C(x) = b : chercher un coût exactement égal à b. Résoudre C(x) ≤ b : chercher tous les coûts qui ne dépassent pas b."
    - "Pour A² = k > 0, penser aux deux signes : A = −√k ou A = √k."
    - "Un carré est positif ou nul : une équation A² = k < 0 n’a pas de solution réelle."
    - Les solutions mathématiques doivent respecter le domaine du modèle et les contraintes du problème.
bilan: Je sais lire une parabole, résoudre une équation simple à partir d’un carré et distinguer un coût exact d’un budget maximal. Je vérifie les unités, les bornes et les contraintes avant de conclure.
reperes_officiels:
