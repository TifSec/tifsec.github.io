      texte: "Cadre du bac professionnel agricole : module MG1, construction d’un raisonnement scientifique. Chercher les passages sur les fonctions, la résolution de problèmes et l’usage d’outils numériques dans le document d’accompagnement."
    - type: lien
      titre: Chlorofil — Référentiels et documents d’accompagnement du tronc commun
