titre: Découvrir la dérivation – Comment évolue un coût ?
theme: variation et taux de variation.
problematique: Découvrir la dérivation – Comment évolue un coût ?
pourquoi: "Objectif de cette séance : Comprendre ce qu'est une dérivée et à quoi elle sert."
application: Déplace le curseur pour observer comment évoluent le coût et la pente de la tangente. C(x) = 5x² - 40x + 260
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Comprendre ce qu'est une dérivée et à quoi elle sert.
        - Faire la différence entre un coût et son évolution.
        - Calculer la dérivée d'une fonction simple.
        - Utiliser la dérivée pour déterminer si une fonction augmente ou diminue.
        - Retrouver et justifier un coût minimal.
    competences:
        - Calculer un taux de variation.
        - Interpréter le signe d'une dérivée.
        - Dériver une fonction du type ax² + bx + c.
        - Résoudre une équation du type f'(x) = 0.
        - Lire et compléter un tableau de variations.
activites:
    - id: a03
      titre: 1. Retour rapide sur l'évaluation
      contenu:
          - type: paragraphe
            texte: "Durée indicative : 4 minutes. Calculatrice interdite."
          - type: paragraphe
            texte: Pourquoi ce rappel ? Nous allons retrouver les méthodes nécessaires pour comprendre la nouvelle notion.
      questions:
          - id: q01
            type: texte
            enonce: Calculer T(8) lorsque T(x) = 15x + 80.
            suite: []
          - id: q02
            type: texte
            enonce: Quel est le minimum de C(x) = 4(x - 5)² + 160 ?
            suite: []
          - id: q03
            type: texte
            enonce: Que signifie l'inégalité C(x) ≤ 176 ?
            suite: []
    - id: a04
      titre: 2. Comprendre une variation
      contenu:
          - type: paragraphe
            texte: "Durée indicative : 9 minutes. Calculatrice autorisée."
          - type: paragraphe
            texte: "Notion : variation et taux de variation."
          - type: paragraphe
            texte: Qu'est-ce que c'est ? Une variation mesure la différence entre deux valeurs. Le taux de variation mesure cette différence par unité de x.
          - type: paragraphe
            texte: À quoi ça sert ? À comparer la façon dont un coût évolue entre deux niveaux d'activité.
          - type: paragraphe
            texte: "Un centre équestre utilise le modèle fictif suivant pour prévoir le coût mensuel d'entretien de sa carrière :"
          - type: paragraphe
            texte: C(x) = 5x² - 40x + 260
          - type: paragraphe
            texte: x représente le nombre d'interventions mensuelles et C(x) le coût estimé en euros.
          - type: paragraphe
            texte: Le modèle est étudié mathématiquement sur l'intervalle [1 ; 8]. En pratique, le nombre d'interventions doit être entier.
      questions: []
    - id: a05
      titre: "Exercice : Comparer deux fréquences"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous allons calculer des coûts, puis mesurer comment ils changent.
      questions:
          - id: q01
            type: texte
            enonce: Calculer C(2) et C(3).
            suite: []
          - id: q02
            type: texte
            enonce: De combien le coût varie-t-il lorsque l'on passe de deux à trois interventions ?
            suite: []
          - id: q03
            type: texte
            enonce: Calculer le taux de variation entre deux et trois interventions.
            suite:
                - type: paragraphe
                  texte: À comprendre
                - type: paragraphe
                  texte: "Le taux de variation entre deux valeurs a et b est :"
                - type: paragraphe
                  texte: (f(b) - f(a)) / (b - a)
                - type: paragraphe
                  texte: Il décrit une évolution moyenne entre deux valeurs.
                - type: paragraphe
                  texte: Un taux négatif signifie une diminution moyenne ; un taux positif signifie une augmentation moyenne.
    - id: a06
      titre: 3. Découvrir le nombre dérivé
      contenu:
          - type: paragraphe
            texte: "Durée indicative : 10 minutes. Calculatrice autorisée."
          - type: paragraphe
            texte: "Notion : nombre dérivé."
          - type: paragraphe
            texte: Qu'est-ce que c'est ? Le nombre dérivé décrit l'évolution locale d'une fonction autour d'une valeur précise.
          - type: paragraphe
            texte: À quoi ça sert ? Il permet de connaître la pente de la courbe à un endroit donné.
          - type: paragraphe
            texte: Graphiquement, le nombre dérivé est le coefficient directeur de la tangente à la courbe.
      questions: []
    - id: a07
      titre: Observer une parabole et sa tangente
      contenu:
          - type: paragraphe
            texte: Déplace le curseur pour observer comment évoluent le coût et la pente de la tangente. C(x) = 5x² - 40x + 260
          - type: paragraphe
            texte: Nombre d'interventions
          - type: paragraphe
            texte: Coût en €
          - type: paragraphe
            texte: ● Courbe du coût
          - type: paragraphe
            texte: — Tangente
          - type: paragraphe
            texte: ● Minimum
          - type: paragraphe
            texte: "Nombre d'interventions : 3"
          - type: paragraphe
            texte: Coût C(x)
          - type: paragraphe
            texte: 185 €
          - type: paragraphe
            texte: Dérivée C'(x)
          - type: paragraphe
            texte: −10
          - type: paragraphe
            texte: Évolution locale
          - type: paragraphe
            texte: Décroissante
          - type: paragraphe
            texte: "La tangente descend : la dérivée est négative."
          - type: paragraphe
            texte: Le modèle est étudié sur un intervalle continu pour comprendre la dérivée. Dans la réalité, les interventions sont comptées en nombres entiers.
          - type: paragraphe
            texte: "Nous conservons notre fonction :"
          - type: paragraphe
            texte: C(x) = 5x² - 40x + 260
          - type: paragraphe
            texte: Nous allons regarder ce qui se passe au voisinage de x = 3.
          - type: paragraphe
            texte: Pour cela, on compare C(3) et C(3 + h), où h représente un petit écart non nul.
          - type: paragraphe
            texte: "Le taux de variation obtenu est :"
          - type: paragraphe
            texte: (C(3 + h) - C(3)) / h = -10 + 5h
          - type: courbe-quadratique
            a: 5
            b: -40
            c: 260
            x_min: 1
            x_max: 8
            y_min: 150
            y_max: 290
            depart: 3
      questions: []
    - id: a08
      titre: "Exercice : Observer une évolution locale"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous allons observer ce qui arrive au taux de variation lorsque les deux valeurs étudiées deviennent très proches.
      questions:
          - id: q01
            type: texte
            enonce: Calculer -10 + 5h pour h = 1 puis h = 0,1.
            suite: []
          - id: q02
            type: texte
            enonce: Vers quelle valeur se rapproche le taux lorsque h se rapproche de zéro ?
            suite: []
          - id: q03
            type: texte
            enonce: Que signifie le signe négatif de C'(3) ?
            suite:
                - type: paragraphe
                  texte: La différence à retenir
                - type: paragraphe
                  texte: "f(x) : valeur de la fonction, par exemple un coût en euros."
                - type: paragraphe
                  texte: "f'(x) : dérivée de la fonction, par exemple une évolution locale en euros par intervention."
                - type: paragraphe
                  texte: "f'(3) : nombre dérivé, c'est-à-dire la pente de la courbe au voisinage de x = 3."
    - id: a09
      titre: 4. Calculer une dérivée
      contenu:
          - type: paragraphe
            texte: "Durée indicative : 10 minutes. Calculatrice interdite."
          - type: paragraphe
            texte: "Notion : règles de dérivation."
          - type: paragraphe
            texte: Qu'est-ce que c'est ? Ce sont des règles permettant de calculer directement la dérivée d'une fonction.
          - type: paragraphe
            texte: À quoi ça sert ? Elles évitent de recommencer tous les calculs de taux de variation.
          - type: paragraphe
            texte: Les trois règles du jour
          - type: liste
            elements:
                - La dérivée d'une constante est 0.
                - La dérivée de ax est a.
                - La dérivée de ax² est 2ax.
          - type: paragraphe
            texte: "Donc, si f(x) = ax² + bx + c, alors :"
          - type: paragraphe
            texte: f'(x) = 2ax + b
      questions: []
    - id: a10
      titre: "Exercice : Appliquer les règles"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous allons apprendre à utiliser ces règles avant de les appliquer à notre situation professionnelle.
      questions:
          - id: q01
            type: texte
            enonce: Déterminer la dérivée de f(x) = 7x + 12.
            suite: []
          - id: q02
            type: texte
            enonce: Déterminer la dérivée de g(x) = 3x².
            suite: []
          - id: q03
            type: texte
            enonce: Déterminer la dérivée de h(x) = 4x² - 6x + 9.
            suite: []
          - id: q04
            type: texte
            enonce: Déterminer la dérivée de C(x) = 5x² - 40x + 260.
            suite: []
          - id: q05
            type: texte
            enonce: Calculer C'(3). Retrouve-t-on le résultat de l'activité précédente ?
            suite: []
    - id: a11
      titre: 5. Utiliser la dérivée pour rechercher un minimum
      contenu:
          - type: paragraphe
            texte: "Durée indicative : 12 minutes. Calculatrice autorisée."
          - type: paragraphe
            texte: "Notion : signe de la dérivée et variations d'une fonction."
          - type: paragraphe
            texte: Qu'est-ce que c'est ? Le signe de la dérivée indique si une fonction augmente ou diminue.
          - type: paragraphe
            texte: À quoi ça sert ? À repérer les périodes où un coût diminue, augmente ou atteint un minimum.
          - type: paragraphe
            texte: La règle à comprendre
          - type: liste
            elements:
                - Si la dérivée est négative sur un intervalle, la fonction y est décroissante.
                - Si la dérivée est positive sur un intervalle, la fonction y est croissante.
                - Si la dérivée passe de négative à positive, la fonction atteint un minimum au point de changement.
          - type: paragraphe
            texte: Une dérivée nulle indique une pente horizontale, mais ne suffit pas à elle seule pour affirmer qu'il existe un minimum.
          - type: paragraphe
            texte: "Nous conservons :"
          - type: paragraphe
            texte: C(x) = 5x² - 40x + 260
          - type: paragraphe
            texte: "Nous avons trouvé :"
          - type: paragraphe
            texte: C'(x) = 10x - 40
      questions: []
    - id: a12
      titre: "Exercice : Étudier le signe de la dérivée"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous allons déterminer où la pente devient nulle et comment elle change de signe.
      questions:
          - id: q01
            type: texte
            enonce: Résoudre l'équation C'(x) = 0.
            suite: []
          - id: q02
            type: texte
            enonce: Calculer C'(3) et C'(5). Que constatez-vous ?
            suite: []
          - id: q03
            type: texte
            enonce: Compléter le tableau de variations et expliquer le sens des flèches.
            suite:
                - type: tableau
                  colonnes:
                      - x
                      - "1"
                      - "4"
                      - "8"
                  lignes:
                      - - Signe de C'(x)
                        - −
                        - "0"
                        - +
                      - - Variation de C
                        - ↘
                        - Minimum
                        - ↗
                      - - Valeur de C
                        - 225 €
                        - 180 €
                        - 260 €
    - id: a13
      titre: "Exercice : Conclure professionnellement"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous allons transformer le résultat mathématique en une recommandation utilisable par le responsable du centre équestre.
      questions:
          - id: q01
            type: texte
            enonce: Quel est le coût minimal ? Pour combien d'interventions ? Justifier à l'aide de la dérivée.
            suite: []
          - id: q02
            type: texte
            enonce: Rédiger une recommandation de deux ou trois phrases au responsable.
            suite:
                - type: paragraphe
                  texte: "Réflexe Bac : rechercher un minimum avec la dérivée"
          - id: q03
            type: texte
            enonce: Calculer la dérivée f'(x).
            suite: []
          - id: q04
            type: texte
            enonce: Résoudre f'(x) = 0.
            suite: []
          - id: q05
            type: texte
            enonce: Étudier le signe de f'(x).
            suite: []
          - id: q06
            type: texte
            enonce: En déduire les variations de f.
            suite: []
          - id: q07
            type: texte
            enonce: Calculer le minimum et l'interpréter.
            suite: []
    - id: a14
      titre: 6. Bilan de la séance
      contenu:
          - type: paragraphe
            texte: "Durée indicative : 4 minutes. Calculatrice interdite."
          - type: paragraphe
            texte: Pourquoi ce bilan ? Nous allons vérifier que les idées essentielles sont comprises avant de passer à des fonctions plus complexes.
      questions:
          - id: q01
            type: texte
            enonce: Quelle différence existe-t-il entre C(x) et C'(x) ?
            suite: []
          - id: q02
            type: texte
            enonce: Déterminer la dérivée de f(x) = 3x² - 8x + 5.
            suite: []
          - id: q03
            type: texte
            enonce: Que signifie une dérivée négative sur un intervalle ?
            suite: []
    - id: a15
      titre: À retenir
      contenu:
          - type: liste
            elements:
                - Le taux de variation mesure une évolution moyenne entre deux valeurs.
                - La dérivée décrit l'évolution locale d'une fonction.
                - Le nombre dérivé f'(a) est la pente de la tangente au point d'abscisse a.
                - Si f(x) = ax² + bx + c, alors f'(x) = 2ax + b.
                - Une dérivée négative indique une fonction décroissante ; une dérivée positive indique une fonction croissante.
                - Lorsque la dérivée passe de négative à positive, la fonction atteint un minimum.
                - Le résultat mathématique doit toujours être interprété dans le contexte professionnel.
      questions: []
    - id: a16
      titre: "Pour aller plus loin : défi facultatif"
      contenu:
          - type: paragraphe
            texte: Calculatrice autorisée. À réaliser uniquement si les activités précédentes sont terminées.
          - type: paragraphe
            texte: "Une autre structure utilise le modèle fictif :"
          - type: paragraphe
            texte: F(x) = 2x³ - 15x² + 24x + 100
          - type: paragraphe
            texte: x est un niveau d'activité réel compris entre 0 et 6 et F(x) un coût estimé en euros.
          - type: paragraphe
            texte: "Nouvelle règle : la dérivée de ax³ est 3ax²."
          - type: paragraphe
            texte: Pourquoi ce défi ? Nous allons découvrir que la dérivation permet aussi d'étudier une fonction du troisième degré, qui peut posséder plusieurs changements de variation.
      questions:
          - id: q01
            type: texte
            enonce: Déterminer F'(x).
            suite: []
          - id: q02
            type: texte
            enonce: Vérifier que F'(x) = 6(x - 1)(x - 4).
            suite: []
          - id: q03
            type: texte
            enonce: Déterminer le signe de F'(x) sur [0 ; 6].
            suite:
                - type: paragraphe
                  texte: En déduire les variations de F.
          - id: q04
            type: texte
            enonce: Calculer F(0), F(1), F(4) et F(6), puis déterminer le minimum global.
            suite: []
      facultatif: true
