version_papier:
    titre: Fiche papier — Comprendre la dérivée et repérer un minimum
    introduction: "La dérivée est un indicateur de direction : elle dit si une courbe monte ou descend près d’un point. Imagine une route : la pente indique si l’on monte, si l’on descend ou si le chemin est plat."
    sections:
        - titre: "1. Variation moyenne : comparer deux moments"
          blocs:
              - type: paragraphe
                texte: Pour savoir comment le coût évolue entre deux valeurs, on calcule la différence des coûts puis on la rapporte à la différence des x.
              - type: code
                texte: |-
                    Taux de variation entre a et b : [f(b) − f(a)] ÷ (b − a).
                    Si le résultat est positif, le coût augmente entre a et b.
                    S’il est négatif, le coût diminue.
        - titre: "2. Nombre dérivé : la pente à un endroit précis"
          blocs:
              - type: paragraphe
                texte: "La dérivée f′(a) mesure la pente de la courbe au point d’abscisse a. Sur le dessin, c’est la pente de la droite qui touche la courbe en ce point : la tangente."
              - type: liste
                elements:
                    - "f′(a) > 0 : la courbe monte près de a."
                    - "f′(a) < 0 : la courbe descend près de a."
                    - "f′(a) = 0 : la tangente est horizontale. Cela peut signaler un sommet, mais il faut étudier le signe autour du point."
        - titre: 3. Calculer une dérivée
          blocs:
              - type: paragraphe
                texte: "Règles utiles : la dérivée d’une constante est 0 ; la dérivée de x est 1 ; la dérivée de x² est 2x. On dérive chaque terme séparément."
          questions:
              - Pour f(x) = 5x² − 40x + 260, écris la dérivée de chaque terme sur une ligne.
              - Regroupe les termes obtenus.
              - Calcule f′(4) et interprète le résultat.
        - titre: 4. Étudier le signe pour trouver un minimum
          blocs:
              - type: paragraphe
                texte: "On cherche quand la dérivée est négative et quand elle est positive. Si elle passe de − à +, la fonction descend puis remonte : elle atteint un minimum."
          questions:
              - Résous f′(x) = 0 pour trouver le point où la pente peut changer.
              - Fais un tableau de signes de f′.
              - Indique les intervalles où le coût diminue puis augmente.
              - Calcule le coût au point minimum et donne une phrase de conclusion.
        - titre: Je m’entraîne — même méthode que dans le cours
          blocs:
              - type: paragraphe
                texte: Reprends les étapes de l’exemple juste au-dessus. Écris une ligne par étape et garde les unités.
          questions:
              - Pour f(x) = 5x² − 40x + 260, écris séparément la dérivée de 5x², de −40x et de 260.
              - Regroupe les termes pour obtenir f′(x).
              - Résous f′(x) = 0 et explique ce que le résultat indique sur la pente.
        - titre: Je transfère — une situation nouvelle
          blocs:
              - type: paragraphe
                texte: Cette fois, les nombres ou le contexte changent. Commence par identifier ce que l’on cherche, puis choisis la méthode qui convient.
          questions:
              - Pour g(x) = 2x² − 12x + 30, calcule g′(x).
              - Résous g′(x) = 0 puis détermine où la fonction diminue et où elle augmente.
              - "Un coût baisse puis remonte : à quoi correspond le point de changement ?"
