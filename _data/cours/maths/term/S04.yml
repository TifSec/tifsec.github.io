version_papier:
    titre: Fiche papier — Comparer deux organisations avec des fonctions affines
    introduction: Une fonction affine décrit un coût qui comporte souvent une part fixe et une part qui augmente avec l’activité.
    sections:
        - titre: 1. Lire la formule comme un tarif
          blocs:
              - type: paragraphe
                texte: Dans f(x) = ax + b, x est le nombre d’activités, a est le coût ajouté à chaque activité et b est le coût fixe, même si x vaut zéro.
              - type: code
                texte: |-
                    Exemple : A(x) = 20x + 100.
                    20 € s’ajoutent par activité.
                    100 € sont payés au départ.
        - titre: 2. Calculer un coût
          blocs:
              - type: paragraphe
                texte: "Pour calculer une image, remplace x par le nombre demandé. Respecte les priorités : multiplication avant addition."
              - type: etapes
                elements:
                    - "Pour x = 4 : A(4) = 20 × 4 + 100."
                    - = 80 + 100.
                    - = 180 €.
        - titre: 3. Trouver le point de bascule
          blocs:
              - type: paragraphe
                texte: Le point de bascule est le nombre d’activités pour lequel les deux organisations coûtent pareil. On écrit donc une égalité.
              - type: etapes
                elements:
                    - A(x) = 20x + 100 ; B(x) = 30x + 40.
                    - 20x + 100 = 30x + 40.
                    - "On retire 20x : 100 = 10x + 40."
                    - "On retire 40 : 60 = 10x."
                    - "On divise par 10 : x = 6."
                    - À 6 activités, les coûts sont égaux. Ensuite, compare les deux prix pour savoir laquelle est la moins chère.
        - titre: 4. Conseiller sans oublier le contexte
          blocs:
              - type: paragraphe
                texte: Une formule peut donner un résultat juste mais impossible dans la réalité. Le nombre d’activités doit respecter le minimum, le maximum et le budget.
          questions:
              - Calcule les deux coûts pour le nombre demandé.
              - Vérifie les contraintes.
              - Écris une phrase qui nomme l’offre choisie et explique pourquoi.
        - titre: Je m’entraîne — même méthode que dans le cours
          blocs:
              - type: paragraphe
                texte: Reprends les étapes de l’exemple juste au-dessus. Écris une ligne par étape et garde les unités.
          questions:
              - Avec A(x) = 20x + 100, calcule A(6) en écrivant les étapes.
              - Avec B(x) = 30x + 40, cherche quand A(x) = B(x).
              - Interprète le nombre obtenu avec une phrase.
        - titre: Je transfère — une situation nouvelle
          blocs:
              - type: paragraphe
                texte: Cette fois, les nombres ou le contexte changent. Commence par identifier ce que l’on cherche, puis choisis la méthode qui convient.
          questions:
              - Deux prestataires proposent P(x) = 18x + 90 et Q(x) = 24x + 42. Trouve le nombre x pour lequel les tarifs sont égaux.
              - Compare les deux coûts pour x = 3, puis pour x = 10.
              - Quelle offre recommandes-tu selon le nombre d’activités ? Justifie.
