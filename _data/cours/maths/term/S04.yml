titre: Fonctions affines – Comparer deux organisations d'une journée équestre
theme: comparaison de deux modèles économiques.
problematique: Fonctions affines – Comparer deux organisations d'une journée équestre
pourquoi: "Objectif de cette séance : Comprendre ce qu'est une fonction affine et à quoi elle sert."
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Comprendre ce qu'est une fonction affine et à quoi elle sert.
        - Interpréter les coefficients d'une fonction affine dans une situation professionnelle.
        - Comparer deux organisations et rechercher leur point de bascule.
        - Comprendre la différence entre une équation et une inéquation.
        - Reconnaître les limites d'un modèle mathématique.
    competences:
        - Construire et simplifier une expression littérale.
        - Calculer les images d'une fonction.
        - Résoudre une équation et une inéquation du premier degré.
        - Interpréter un seuil mathématique en tenant compte de nombres entiers.
        - Rédiger une recommandation professionnelle justifiée.
activites:
    - id: a03
      titre: "1. Automatismes : retrouver les méthodes utiles"
      contenu:
          - type: paragraphe
            texte: "Notions : calcul mental, réduction, image d'une fonction, équation et inéquation."
          - type: paragraphe
            texte: Qu'est-ce que c'est ? Ce sont des outils qui permettent de simplifier des calculs, de trouver une valeur inconnue et de comparer des résultats.
          - type: paragraphe
            texte: À quoi ça sert ? Nous allons utiliser ces méthodes pour comparer deux organisations professionnelles.
          - type: paragraphe
            texte: Pourquoi commencer par ces exercices ?
          - type: paragraphe
            texte: Nous allons vérifier que les méthodes des séances précédentes sont suffisamment maîtrisées avant de les utiliser dans un problème plus complet.
          - type: paragraphe
            texte: "Durée indicative : 6 minutes. Calculatrice interdite."
      questions:
          - id: q01
            type: texte
            enonce: Calculer 25 % de 240 €.
            suite: []
          - id: q02
            type: texte
            enonce: "Réduire : 8x + 12 - 3x - 7."
            suite: []
          - id: q03
            type: texte
            enonce: Calculer l'image de 4 par f(x) = 5x - 3.
            suite: []
          - id: q04
            type: texte
            enonce: "Résoudre : 4x + 8 = 28."
            suite: []
          - id: q05
            type: texte
            enonce: "Résoudre : 3x > 18."
            suite:
                - type: paragraphe
                  texte: "Réflexe Bac :"
                - type: paragraphe
                  texte: "Avant de résoudre un problème, identifiez ce que vous cherchez : une valeur précise correspond souvent à une équation ; un ensemble de valeurs respectant une condition correspond souvent à une inéquation."
    - id: a04
      titre: 2. Comprendre les deux organisations
      contenu:
          - type: paragraphe
            texte: "Notion : comparaison de deux modèles économiques."
          - type: paragraphe
            texte: Qu'est-ce que c'est ? Deux organisations peuvent proposer une prestation comparable tout en ayant des prix, des charges fixes et des charges variables différents.
          - type: paragraphe
            texte: À quoi ça sert ? À comprendre pourquoi la solution la moins coûteuse au départ n'est pas nécessairement la meilleure lorsque l'activité se développe.
          - type: paragraphe
            texte: Pourquoi cette activité ?
          - type: paragraphe
            texte: Avant d'effectuer des calculs, nous devons comprendre les données et repérer ce qui change entre les deux organisations.
          - type: paragraphe
            texte: "Ce que cela vous apporte : savoir lire des données professionnelles et identifier les informations importantes."
          - type: paragraphe
            texte: Un centre équestre prépare une journée de découverte. Le responsable hésite entre deux organisations dont les prestations sont supposées comparables.
          - type: tableau
            colonnes:
                - Donnée
                - Organisation A
                - Organisation B
            lignes:
                - - Prix payé par participant
                  - 45 €
                  - 42 €
                - - Coût variable par participant
                  - 12 €
                  - 14 €
                - - Charges fixes
                  - 396 €
                  - 310 €
                - - Capacité maximale
                  - 20 participants
                  - 20 participants
          - type: paragraphe
            texte: Données fictives. On note x le nombre de participants, entier compris entre 0 et 20.
          - type: paragraphe
            texte: "Durée indicative : 9 minutes. Calculatrice autorisée."
      questions: []
    - id: a05
      titre: "Exercice 1 : Identifier les différences"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous allons repérer les avantages et les inconvénients de chaque organisation avant de construire les formules.
      questions:
          - id: q01
            type: texte
            enonce: Expliquer ce qui distingue les deux organisations du point de vue des charges.
            suite: []
    - id: a06
      titre: "Exercice 2 : Construire les résultats financiers"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous allons construire deux formules qui permettront de comparer les organisations pour n'importe quel nombre de participants.
      questions:
          - id: q01
            type: texte
            enonce: Retrouver l'expression du résultat financier de l'organisation A, étudiée à la séance précédente.
            suite: []
          - id: q02
            type: texte
            enonce: Construire l'expression du résultat financier de l'organisation B.
            suite: []
          - id: q03
            type: texte
            enonce: Calculer le résultat financier de chaque organisation pour 10 participants.
            suite: []
          - id: q04
            type: texte
            enonce: Quelle organisation est préférable avec 10 participants ? Justifier.
            suite: []
    - id: a07
      titre: 3. Comprendre les fonctions affines
      contenu:
          - type: paragraphe
            texte: "Notion : fonction affine et sens de variation."
          - type: paragraphe
            texte: Qu'est-ce que c'est ? Une fonction affine est une fonction qui peut s'écrire sous la forme f(x) = ax + b, où a et b sont deux nombres.
          - type: paragraphe
            texte: À quoi ça sert ? À représenter une quantité qui augmente ou diminue régulièrement lorsque la valeur d'entrée change.
          - type: paragraphe
            texte: Les deux coefficients
          - type: paragraphe
            texte: "Dans f(x) = ax + b :"
          - type: paragraphe
            texte: a indique de combien le résultat varie lorsque x augmente de 1.
          - type: paragraphe
            texte: b représente le résultat obtenu lorsque x = 0.
          - type: paragraphe
            texte: Si a est positif, la fonction est croissante. Si a est négatif, elle est décroissante. Si a est nul, elle est constante.
          - type: paragraphe
            texte: "Nous utilisons les fonctions :"
          - type: paragraphe
            texte: BA(x) = 33x - 396 et BB(x) = 28x - 310.
          - type: paragraphe
            texte: "Durée indicative : 10 minutes. Calculatrice autorisée."
      questions: []
    - id: a08
      titre: "Exercice 1 : Lire les coefficients"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous allons comprendre ce que chaque nombre représente pour pouvoir prévoir l'évolution des résultats financiers.
      questions:
          - id: q01
            type: texte
            enonce: Identifier les coefficients a et b de chaque fonction.
            suite: []
          - id: q02
            type: texte
            enonce: Interpréter les coefficients 33 et 28 dans le contexte professionnel.
            suite: []
          - id: q03
            type: texte
            enonce: Interpréter les coefficients -396 et -310.
            suite: []
          - id: q04
            type: texte
            enonce: Les deux fonctions sont-elles croissantes ou décroissantes ? Justifier.
            suite: []
    - id: a09
      titre: "Exercice 2 : Comparer les valeurs"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous allons observer les résultats à plusieurs niveaux de fréquentation pour repérer si le classement des organisations change.
      questions:
          - id: q01
            type: texte
            enonce: Compléter le tableau en calculant les résultats financiers des deux organisations.
            suite: []
          - id: q02
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Participants
                - "10"
                - "15"
                - "18"
                - "20"
            lignes:
                - - BA(x)
                  - ""
                  - ""
                  - ""
                  - ""
                - - BB(x)
                  - ""
                  - ""
                  - ""
                  - ""
          - id: q03
            type: texte
            enonce: Pour quelles valeurs du tableau l'organisation A donne-t-elle le meilleur résultat ?
            suite: []
          - id: q04
            type: texte
            enonce: Expliquer pourquoi A devient plus intéressante lorsque le nombre de participants augmente.
            suite: []
    - id: a10
      titre: 4. Déterminer le point de bascule
      contenu:
          - type: paragraphe
            texte: "Notion : égalité de deux fonctions affines."
          - type: paragraphe
            texte: Qu'est-ce que c'est ? Le point de bascule est le moment où deux modèles donnent le même résultat. Avant ce point, l'un peut être préférable ; après, l'autre peut devenir plus avantageux.
          - type: paragraphe
            texte: À quoi ça sert ? À déterminer précisément quand une décision doit changer selon la fréquentation.
          - type: paragraphe
            texte: Pourquoi résoudre une équation ?
          - type: paragraphe
            texte: Nous cherchons le nombre de participants pour lequel les deux résultats financiers sont égaux.
          - type: paragraphe
            texte: "Ce que cela vous apporte : savoir comparer deux situations sans effectuer une longue série d'essais."
          - type: paragraphe
            texte: "Durée indicative : 10 minutes. Calculatrice autorisée."
      questions: []
    - id: a11
      titre: "Exercice 1 : Trouver l'égalité"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous allons déterminer le nombre théorique de participants pour lequel les deux organisations donnent exactement le même résultat.
      questions:
          - id: q01
            type: texte
            enonce: Écrire l'équation correspondant à des résultats financiers identiques.
            suite: []
          - id: q02
            type: texte
            enonce: Résoudre cette équation en détaillant toutes les étapes.
            suite: []
          - id: q03
            type: texte
            enonce: Pourquoi ne peut-on pas retenir directement 17,2 participants ?
            suite: []
    - id: a12
      titre: "Exercice 2 : Interpréter le point de bascule"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous allons vérifier de quel côté du seuil chaque organisation est préférable.
      questions:
          - id: q01
            type: texte
            enonce: Calculer les résultats financiers pour 17 et 18 participants.
            suite: []
          - id: q02
            type: texte
            enonce: "Conclure : à partir de combien de participants faut-il choisir A ?"
            suite:
                - type: paragraphe
                  texte: "Réflexe Bac :"
                - type: paragraphe
                  texte: Une équation donne un résultat mathématique. Il faut ensuite vérifier que cette valeur est possible dans la situation professionnelle et, si nécessaire, tester les entiers voisins.
    - id: a13
      titre: 5. Conseiller le responsable
      contenu:
          - type: paragraphe
            texte: "Notion : inéquation du premier degré."
          - type: paragraphe
            texte: "Qu'est-ce que c'est ? Une inéquation ressemble à une équation, mais utilise un signe de comparaison : <, >, ≤ ou ≥."
          - type: paragraphe
            texte: À quoi ça sert ? À déterminer toutes les valeurs qui respectent une condition, par exemple les nombres de participants pour lesquels une organisation rapporte davantage qu'une autre.
          - type: paragraphe
            texte: Pourquoi utiliser une inéquation ?
          - type: paragraphe
            texte: Nous ne cherchons plus uniquement le point d'égalité. Nous voulons identifier toute la plage de fréquentation pour laquelle A donne un meilleur résultat.
          - type: paragraphe
            texte: "Ce que cela vous apporte : savoir prendre une décision à partir d'une condition et non d'un seul calcul."
          - type: paragraphe
            texte: Le responsable prévoit entre 12 et 20 participants.
          - type: paragraphe
            texte: "Durée indicative : 7 minutes. Calculatrice autorisée."
      questions: []
    - id: a14
      titre: "Exercice 1 : Traduire et résoudre une condition"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous allons transformer une phrase professionnelle en inéquation, puis trouver les valeurs qui la respectent.
      questions:
          - id: q01
            type: texte
            enonce: Écrire l'inéquation traduisant « l'organisation A rapporte davantage que l'organisation B ».
            suite: []
          - id: q02
            type: texte
            enonce: Résoudre cette inéquation.
            suite: []
          - id: q03
            type: texte
            enonce: Indiquer les valeurs entières pour lesquelles A est préférable, compte tenu de la capacité maximale.
            suite: []
    - id: a15
      titre: "Exercice 2 : Justifier un choix"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Un responsable doit pouvoir comprendre les calculs et la raison du choix proposé.
      questions:
          - id: q01
            type: texte
            enonce: Quelle organisation conseiller pour 15 participants ? Justifier par un calcul.
            suite: []
          - id: q02
            type: texte
            enonce: Quelle organisation conseiller pour 19 participants ? Justifier par un calcul.
            suite: []
          - id: q03
            type: texte
            enonce: Rédiger une recommandation de quelques lignes pour le responsable.
            suite: []
    - id: a16
      titre: 6. Bilan de la séance
      contenu:
          - type: paragraphe
            texte: Pourquoi ce bilan ? Il permet de vérifier que vous avez compris les méthodes, mais surtout pourquoi et quand les utiliser.
          - type: paragraphe
            texte: "Durée indicative : 3 minutes. Calculatrice interdite."
      questions:
          - id: q01
            type: texte
            enonce: Que représentent les coefficients a et b dans une fonction affine f(x) = ax + b ?
            suite: []
          - id: q02
            type: texte
            enonce: Quelle est la différence entre une équation et une inéquation ?
            suite: []
          - id: q03
            type: texte
            enonce: Pourquoi faut-il tenir compte du nombre maximal de participants ?
            suite: []
    - id: a18
      titre: À retenir
      contenu:
          - type: liste
            elements:
                - Une fonction affine s'écrit f(x) = ax + b.
                - Le coefficient a indique la variation du résultat lorsque x augmente de 1.
                - Le coefficient b représente la valeur de la fonction pour x = 0.
                - Si a est positif, la fonction est croissante ; s'il est négatif, elle est décroissante.
                - Une équation permet de rechercher quand deux modèles sont égaux.
                - Une inéquation permet de rechercher quand un modèle est plus avantageux.
                - Une solution doit respecter les contraintes de la situation professionnelle.
      questions: []
    - id: a19
      titre: "Pour aller plus loin : défi facultatif"
      contenu:
          - type: paragraphe
            texte: Pourquoi ce défi ? Jusqu'ici, nous avons supposé que les deux organisations attiraient le même nombre de participants. Nous allons maintenant tester ce qui se passe si cette hypothèse change.
          - type: paragraphe
            texte: À réaliser uniquement si le travail principal est terminé, ou en prolongement.
          - type: paragraphe
            texte: Calculatrice autorisée.
          - type: paragraphe
            texte: Une enquête interne estime que l'organisation B, moins chère pour les clients, pourrait attirer trois participants de plus que A, dans la limite de 20 places.
          - type: paragraphe
            texte: On note x le nombre de participants de A. L'organisation B accueille donc x + 3 participants.
      questions:
          - id: q01
            type: texte
            enonce: Expliquer pourquoi x ne peut pas dépasser 17 dans cette situation.
            suite:
                - type: paragraphe
                  texte: Exprimer le résultat financier des deux organisations en fonction de x.
          - id: q02
            type: texte
            enonce: Déterminer à partir de combien de participants dans A cette organisation devient plus avantageuse que B.
            suite: []
          - id: q03
            type: texte
            enonce: Si le centre augmente sa capacité, combien de places faudrait-il prévoir au minimum pour que A puisse devenir plus avantageuse, tout en conservant trois participants supplémentaires pour B ?
            suite: []
          - id: q04
            type: texte
            enonce: Expliquer pourquoi ce résultat mathématique ne suffit pas pour décider d'agrandir le centre.
            suite: []
      facultatif: true
    - id: a20
      titre: Sources et ressources
      contenu:
          - type: liste
            elements:
                - Chlorofil – Référentiel Bac Pro, tronc commun.
                - Chlorofil – Document d'accompagnement MG1.
          - type: lien
            titre: Chlorofil – Référentiel Bac Pro, tronc commun
            url: https://chlorofil.fr/diplomes/secondaire/bac-pro/1re-tle/tronc-commun
          - type: lien
            titre: Chlorofil – Document d'accompagnement MG1
            url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/bacpro/bacpro-tc-da-MG1.pdf
      questions: []
