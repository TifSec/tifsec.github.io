version_papier:
    titre: Fiche papier — Calculer un résultat et un seuil de rentabilité
    introduction: En gestion, on compare l’argent qui entre et l’argent qui sort. Les lettres permettent de faire le calcul pour plusieurs nombres de participants.
    sections:
        - titre: 1. Recettes, charges et résultat
          blocs:
              - type: paragraphe
                texte: La recette est l’argent reçu. Les charges sont les dépenses. Le résultat indique ce qu’il reste après avoir payé les charges.
              - type: etapes
                elements:
                    - "Exemple : 10 participants paient 30 € chacun."
                    - "Recettes : 30 × 10 = 300 €."
                    - "Charges : 120 € de frais fixes et 8 € par participant."
                    - "Charges totales : 120 + 8 × 10 = 200 €."
                    - "Résultat : 300 − 200 = 100 €."
        - titre: 2. Écrire une formule
          blocs:
              - type: paragraphe
                texte: On note x le nombre de participants. Une formule permet de refaire le calcul sans remplacer tout de suite x.
              - type: etapes
                elements:
                    - "Recettes : R(x) = 30x."
                    - "Charges : C(x) = 120 + 8x."
                    - "Résultat : G(x) = R(x) − C(x)."
                    - G(x) = 30x − (120 + 8x).
                    - G(x) = 30x − 120 − 8x = 22x − 120.
        - titre: 3. Trouver le seuil de rentabilité
          blocs:
              - type: paragraphe
                texte: "Le seuil est atteint quand recettes et charges sont égales : le résultat est alors zéro. C’est comme le point où le compteur passe de perte à bénéfice."
              - type: etapes
                elements:
                    - On résout 22x − 120 = 0.
                    - "On ajoute 120 des deux côtés : 22x = 120."
                    - "On divise par 22 : x = 120 ÷ 22 ≈ 5,45."
                    - On ne peut pas accueillir 5,45 personnes. Il faut donc au moins 6 participants.
                    - Vérifie le résultat avec x = 5 puis x = 6.
        - titre: 4. Comparer deux tarifs
          blocs:
              - type: paragraphe
                texte: Pour comparer deux offres, calcule les deux coûts avec le même nombre de participants, puis regarde à partir de quel effectif l’une devient moins chère.
          questions:
              - Note les deux formules de coût.
              - Choisis un nombre de participants et calcule chaque coût.
              - Écris une égalité si tu cherches le point où les deux coûts sont égaux.
              - Conclue avec le nombre de participants et l’offre conseillée.
        - titre: Je m’entraîne — même méthode que dans le cours
          blocs:
              - type: paragraphe
                texte: Reprends les étapes de l’exemple juste au-dessus. Écris une ligne par étape et garde les unités.
          questions:
              - Pour 12 participants à 30 € chacun, calcule les recettes.
