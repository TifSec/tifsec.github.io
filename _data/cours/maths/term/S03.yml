titre: Calcul littéral et équations – Étudier la rentabilité d'une activité équestre
theme: expression littérale et fonction affine.
problematique: Calcul littéral et équations – Étudier la rentabilité d'une activité équestre
pourquoi: "Objectif de cette séance : Comprendre ce que sont les recettes, les charges et le résultat financier."
application: "Notions : recettes, charges fixes, charges variables et résultat financier."
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Comprendre ce que sont les recettes, les charges et le résultat financier.
        - Comprendre comment une expression littérale représente une situation professionnelle.
        - Comprendre ce qu'est un seuil de rentabilité et pourquoi il est important.
        - Comprendre les limites d'un modèle mathématique.
    competences:
        - Calculer des recettes, des charges et un résultat financier.
        - Construire, développer et réduire une expression littérale.
        - Résoudre une équation du premier degré et vérifier sa solution.
        - Déterminer le nombre minimal de participants pour éviter une perte.
        - Comparer deux tarifs et justifier une décision professionnelle.
activites:
    - id: a03
      titre: "1. Automatismes : retrouver les outils nécessaires"
      contenu:
          - type: paragraphe
            texte: "Notions : pourcentages, réduction, développement et équations simples."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? Ce sont des méthodes qui permettent de transformer des calculs et de retrouver une valeur inconnue.
          - type: paragraphe
            texte: À quoi ça sert ? À construire et utiliser les formules qui serviront ensuite à étudier la rentabilité.
          - type: paragraphe
            texte: Pourquoi commencer par ces calculs ?
          - type: paragraphe
            texte: Nous allons réutiliser des méthodes rencontrées lors des deux premières séances. Les retrouver maintenant permettra de mieux comprendre les calculs professionnels qui suivront.
          - type: paragraphe
            texte: "Durée indicative : 6 minutes. Calculatrice interdite."
          - type: paragraphe
            texte: Effectuez les calculs en indiquant les étapes lorsque cela est nécessaire.
      questions:
          - id: q01
            type: texte
            enonce: Calculer 15 % de 200 €.
            suite: []
          - id: q02
            type: texte
            enonce: "Réduire : 12x + 8x - 5x."
            suite: []
          - id: q03
            type: texte
            enonce: "Développer : 25(x + 4)."
            suite: []
          - id: q04
            type: texte
            enonce: "Résoudre : 20x = 300."
            suite: []
          - id: q05
            type: texte
            enonce: "Résoudre : 30x - 120 = 0."
            suite:
                - type: paragraphe
                  texte: "Réflexe Bac :"
                - type: paragraphe
                  texte: Lorsque vous résolvez une équation, conservez les étapes et vérifiez la solution en la remplaçant dans l'égalité de départ.
    - id: a04
      titre: 2. Comprendre la situation professionnelle
      contenu:
          - type: paragraphe
            texte: "Notions : recettes, charges fixes, charges variables et résultat financier."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? Les recettes correspondent à l'argent reçu. Les charges correspondent aux dépenses. Le résultat financier simplifié est la différence entre les recettes et les charges.
          - type: paragraphe
            texte: À quoi ça sert ? À déterminer si une activité couvre ses dépenses ou génère une perte.
          - type: paragraphe
            texte: Pourquoi cette activité ?
          - type: paragraphe
            texte: Avant de construire une formule, nous devons comprendre les données de la situation et savoir quels calculs effectuer.
          - type: paragraphe
            texte: "Ce que cela vous apporte : savoir distinguer les différents montants d'une activité professionnelle."
          - type: paragraphe
            texte: Un centre équestre souhaite organiser une journée de découverte pour attirer de nouveaux clients.
          - type: paragraphe
            texte: Le responsable veut savoir combien de participants sont nécessaires pour ne pas perdre d'argent.
          - type: tableau
            colonnes:
                - Donnée
                - Montant
            lignes:
                - - Prix payé par participant
                  - 45 €
                - - Coût variable par participant
                  - 12 €
                - - Charges fixes de la journée
                  - 396 €
                - - Capacité maximale
                  - 20 participants
          - type: paragraphe
            texte: "Les données sont fictives. Le modèle est simplifié : les charges indiquées sont supposées couvrir toutes les dépenses prises en compte dans l'exercice."
          - type: paragraphe
            texte: "Durée indicative : 8 minutes. Calculatrice autorisée."
      questions: []
    - id: a05
      titre: "Exercice 1 : Comprendre les charges"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Toutes les dépenses n'évoluent pas de la même façon. Nous devons les distinguer pour prévoir le coût de la journée.
      questions:
          - id: q01
            type: texte
            enonce: Expliquer la différence entre une charge fixe et une charge variable.
            suite: []
    - id: a06
      titre: "Exercice 2 : Calculer le résultat pour 10 participants"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous allons vérifier si une journée accueillant dix participants couvre les dépenses prévues.
      questions:
          - id: q01
            type: texte
            enonce: Calculer les recettes pour 10 participants.
            suite: []
          - id: q02
            type: texte
            enonce: Calculer les charges totales pour 10 participants.
            suite: []
          - id: q03
            type: texte
            enonce: La journée est-elle rentable avec 10 participants ? Justifier.
            suite: []
    - id: a07
      titre: 3. Construire un modèle mathématique
      contenu:
          - type: paragraphe
            texte: "Notion : expression littérale et fonction affine."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? Une expression littérale utilise une lettre pour représenter un nombre variable. Une fonction permet de calculer un résultat à partir de ce nombre.
          - type: paragraphe
            texte: À quoi ça sert ? À prévoir rapidement les recettes, les charges et le résultat financier pour différents nombres de participants.
          - type: paragraphe
            texte: Pourquoi changer de méthode ?
          - type: paragraphe
            texte: Nous venons de calculer le résultat pour dix participants. Nous allons maintenant créer une formule réutilisable pour tous les effectifs possibles.
          - type: paragraphe
            texte: "Ce que cela vous apporte : ne plus avoir à reconstruire tous les calculs à chaque changement de fréquentation."
          - type: paragraphe
            texte: On note x le nombre de participants.
          - type: paragraphe
            texte: On note R(x) les recettes, C(x) les charges totales et B(x) le résultat financier, en euros.
          - type: paragraphe
            texte: "Durée indicative : 10 minutes. Calculatrice autorisée."
      questions: []
    - id: a08
      titre: "Exercice 1 : Construire les formules"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous allons traduire les données du tableau en expressions mathématiques.
      questions:
          - id: q01
            type: texte
            enonce: Exprimer les recettes R(x) en fonction de x.
            suite: []
          - id: q02
            type: texte
            enonce: Exprimer les charges totales C(x) en fonction de x.
            suite: []
          - id: q03
            type: texte
            enonce: Exprimer le résultat financier B(x) en fonction de x.
            suite: []
    - id: a09
      titre: "Exercice 2 : Simplifier et comprendre la formule"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Une formule simplifiée est plus rapide à utiliser et permet de mieux comprendre ce qui fait varier le résultat financier.
      questions:
          - id: q01
            type: texte
            enonce: Développer et réduire l'expression B(x).
            suite: []
          - id: q02
            type: texte
            enonce: Expliquer la signification de 33 et de -396 dans cette expression.
            suite: []
          - id: q03
            type: texte
            enonce: Vérifier que la formule donne bien une perte de 66 € pour 10 participants.
            suite:
                - type: paragraphe
                  texte: "Notre modèle :"
                - type: paragraphe
                  texte: "Recettes : R(x) = 45x."
                - type: paragraphe
                  texte: "Charges : C(x) = 396 + 12x."
                - type: paragraphe
                  texte: "Résultat financier : B(x) = 33x - 396."
                - type: paragraphe
                  texte: Ce modèle est valable pour un nombre entier de participants compris entre 0 et 20.
    - id: a10
      titre: 4. Déterminer le seuil de rentabilité
      contenu:
          - type: paragraphe
            texte: "Notion : équation du premier degré et seuil de rentabilité."
          - type: paragraphe
            texte: "Concrètement, qu'est-ce que c'est ? Dans ce modèle, le seuil de rentabilité correspond au nombre de participants pour lequel les recettes couvrent exactement les charges : le résultat financier est nul."
          - type: paragraphe
            texte: À quoi ça sert ? À fixer un objectif minimal de fréquentation avant d'organiser une activité.
          - type: paragraphe
            texte: Pourquoi utiliser une équation ?
          - type: paragraphe
            texte: Nous connaissons la formule du résultat financier, mais pas encore le nombre de participants qui permet d'obtenir zéro euro de résultat.
          - type: paragraphe
            texte: "Ce que cela vous apporte : savoir retrouver directement une valeur inconnue à partir d'un objectif."
          - type: paragraphe
            texte: On utilise la formule B(x) = 33x - 396.
          - type: paragraphe
            texte: "Durée indicative : 12 minutes. Calculatrice autorisée."
      questions: []
    - id: a11
      titre: "Exercice 1 : Résoudre l'équation"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous allons déterminer le nombre exact de participants qui permet de couvrir toutes les charges.
      questions:
          - id: q01
            type: texte
            enonce: Écrire l'équation correspondant à un résultat financier nul.
            suite: []
          - id: q02
            type: texte
            enonce: Résoudre cette équation en détaillant les étapes.
            suite: []
          - id: q03
            type: texte
            enonce: Interpréter le résultat obtenu dans le contexte professionnel.
            suite: []
    - id: a12
      titre: "Exercice 2 : Vérifier le seuil de rentabilité"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous allons vérifier que notre résultat correspond réellement au passage d'une perte à un résultat nul, puis à un bénéfice.
      questions:
          - id: q01
            type: texte
            enonce: Calculer B(11), B(12) et B(13).
            suite: []
          - id: q02
            type: texte
            enonce: Déterminer le nombre minimal de participants permettant d'éviter une perte.
            suite: []
          - id: q03
            type: texte
            enonce: Calculer le résultat financier maximal possible si le centre accueille 20 participants.
            suite:
                - type: paragraphe
                  texte: "Réflexe Bac :"
                - type: paragraphe
                  texte: Après avoir résolu une équation, vérifiez la solution et son sens dans le problème. Une valeur peut être correcte mathématiquement sans être admissible dans la situation réelle.
    - id: a13
      titre: 5. Comparer deux tarifs
      contenu:
          - type: paragraphe
            texte: "Notion : modification d'un modèle et comparaison de résultats."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? Nous allons modifier une donnée du modèle, puis recalculer les résultats pour mesurer son effet.
          - type: paragraphe
            texte: À quoi ça sert ? À anticiper les conséquences financières d'un changement de prix avant de prendre une décision.
          - type: paragraphe
            texte: Pourquoi cette dernière activité ?
          - type: paragraphe
            texte: Nous avons déterminé le seuil de rentabilité avec un tarif de 45 €. Nous allons maintenant voir comment ce seuil évolue si le tarif augmente.
          - type: paragraphe
            texte: "Ce que cela vous apporte : comprendre qu'une formule permet de comparer plusieurs décisions, mais qu'elle ne prédit pas automatiquement le comportement des clients."
          - type: paragraphe
            texte: Le responsable envisage de faire passer le prix de la journée de 45 € à 50 € par participant.
          - type: paragraphe
            texte: "Les charges restent identiques : 396 € de charges fixes et 12 € de charges variables par participant."
          - type: paragraphe
            texte: "Durée indicative : 11 minutes. Calculatrice autorisée."
      questions: []
    - id: a14
      titre: "Exercice 1 : Construire le nouveau modèle"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous allons réutiliser la méthode précédente avec un prix différent pour voir ce qui change dans la formule.
      questions:
          - id: q01
            type: texte
            enonce: Exprimer le nouveau résultat financier B₂(x), puis développer et réduire.
            suite: []
          - id: q02
            type: texte
            enonce: Résoudre l'équation B₂(x) = 0.
            suite: []
          - id: q03
            type: texte
            enonce: Déterminer le nombre minimal entier de participants permettant d'éviter une perte.
            suite: []
    - id: a15
      titre: "Exercice 2 : Comparer et prendre une décision"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous allons comparer les deux tarifs, puis expliquer pourquoi un résultat mathématique ne suffit pas toujours pour choisir une stratégie commerciale.
      questions:
          - id: q01
            type: texte
            enonce: Comparer les résultats financiers des deux tarifs pour 15 participants.
            suite: []
          - id: q02
            type: texte
            enonce: Expliquer pourquoi augmenter le tarif n'est pas nécessairement la meilleure décision commerciale.
            suite: []
    - id: a16
      titre: 6. Bilan de la séance
      contenu:
          - type: paragraphe
            texte: Pourquoi ce bilan ? Il permet de retrouver les étapes de la démarche et de comprendre ce que nous avons réellement appris à faire.
          - type: paragraphe
            texte: Calculatrice interdite. Répondez oralement ou par une courte phrase.
      questions:
          - id: q01
            type: texte
            enonce: Pourquoi le seuil de rentabilité est-il de 12 participants au tarif de 45 € ?
            suite: []
          - id: q02
            type: texte
            enonce: Pourquoi une équation est-elle plus pratique que de tester tous les nombres de participants ?
            suite: []
          - id: q03
            type: texte
            enonce: Pourquoi faut-il vérifier les hypothèses d'un modèle avant de prendre une décision ?
            suite: []
    - id: a18
      titre: À retenir
      contenu:
          - type: liste
            elements:
                - Les recettes correspondent à l'argent reçu et les charges aux dépenses prises en compte.
                - Le résultat financier se calcule en soustrayant les charges aux recettes.
                - Une expression littérale permet de représenter une situation avec une valeur variable.
                - Le seuil de rentabilité correspond à un résultat financier nul dans notre modèle.
                - Une équation permet de déterminer ce seuil.
                - Une solution doit être vérifiée et interprétée dans son contexte.
                - Un tarif plus élevé ne garantit pas un meilleur résultat si la fréquentation change.
      questions: []
    - id: a19
      titre: "Pour aller plus loin : défi facultatif"
      contenu:
          - type: paragraphe
            texte: Pourquoi ce défi ? Nous avons comparé deux tarifs en supposant la même fréquentation. Nous allons maintenant comparer trois tarifs avec des nombres d'inscriptions prévus différents.
          - type: paragraphe
            texte: À réaliser uniquement si le travail principal est terminé, ou en prolongement.
          - type: paragraphe
            texte: Calculatrice autorisée.
          - type: tableau
            colonnes:
                - Tarif
                - Prix par participant
                - Inscriptions prévues
            lignes:
                - - A
                  - 45 €
                  - "18"
                - - B
                  - 50 €
                  - "15"
                - - C
                  - 55 €
                  - "12"
          - type: paragraphe
            texte: Les charges fixes restent de 396 € et les charges variables de 12 € par participant. La capacité maximale reste de 20 participants.
      questions:
          - id: q01
            type: texte
            enonce: Calculer le résultat financier pour chacun des trois tarifs.
            suite: []
          - id: q02
            type: texte
            enonce: Combien de participants faudrait-il accueillir au tarif B pour obtenir un résultat au moins égal à celui du tarif A ?
            suite: []
          - id: q03
            type: texte
            enonce: Le responsable souhaite au moins 200 € de bénéfice et au moins 15 participants. Quels tarifs respectent ces deux objectifs avec les prévisions actuelles ?
            suite: []
          - id: q04
            type: texte
            enonce: Proposer une modification d'un seul paramètre permettant au tarif B de respecter les deux objectifs. Justifier par le calcul.
            suite: []
          - id: q05
            type: texte
            enonce: Rédiger une recommandation finale en précisant l'avantage et le risque de votre solution.
            suite: []
      facultatif: true
    - id: a20
      titre: Sources et ressources
      contenu:
          - type: liste
            elements:
                - "Chlorofil – Baccalauréat professionnel : tronc commun – référentiel et ressources officielles."
                - Chlorofil – Document d'accompagnement MG1 – pratique algébrique, fonctions, modélisation et résolution de problèmes.
                - Chlorofil – Bac professionnel CGEH – contexte de la filière hippique.
          - type: lien
            titre: "Chlorofil – Baccalauréat professionnel : tronc commun"
            url: https://chlorofil.fr/diplomes/secondaire/bac-pro/1re-tle/tronc-commun
          - type: lien
            titre: Chlorofil – Document d'accompagnement MG1
            url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/bacpro/bacpro-tc-da-MG1.pdf
          - type: lien
            titre: Chlorofil – Bac professionnel CGEH
            url: https://chlorofil.fr/diplomes/secondaire/bac-pro/1re-tle/cgeh
      questions: []
