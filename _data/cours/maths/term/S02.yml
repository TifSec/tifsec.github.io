version_papier:
    titre: Fiche papier — Statistiques, probabilités et calcul littéral
    introduction: Une statistique résume un groupe de données. Une probabilité décrit une chance. Une expression littérale est une formule qui fonctionne pour plusieurs valeurs.
    sections:
        - titre: 1. Moyenne, médiane et étendue
          blocs:
              - type: paragraphe
                texte: Range d’abord les valeurs dans l’ordre croissant. La moyenne partage le total équitablement ; la médiane est au milieu ; l’étendue mesure l’écart entre les extrêmes.
              - type: etapes
                elements:
                    - "Exemple : 4, 6, 6, 8, 11."
                    - "Moyenne : (4 + 6 + 6 + 8 + 11) ÷ 5 = 35 ÷ 5 = 7."
                    - "Médiane : la valeur du milieu est 6."
                    - "Étendue : 11 − 4 = 7."
        - titre: 2. Probabilité
          blocs:
              - type: paragraphe
                texte: Imagine un sac contenant 8 jetons rouges et 12 jetons bleus. Il y a 20 jetons en tout ; chaque jeton a la même chance d’être tiré.
              - type: etapes
                elements:
                    - P(rouge) = 8/20.
                    - "On simplifie en divisant en haut et en bas par 4 : 8/20 = 2/5."
                    - "En décimal : 2 ÷ 5 = 0,4, donc 40 %."
                    - P(non rouge) = 1 − 2/5 = 3/5. Les deux probabilités font 1 en tout.
        - titre: 3. Réduire une expression
          blocs:
              - type: paragraphe
                texte: "On ne peut additionner que les termes de même famille. Les x sont comme des pommes ; les x² sont comme des cartons de pommes : ce ne sont pas la même chose."
              - type: etapes
                elements:
                    - 4x + 3x = 7x.
                    - 7x − 2x + 4 = 5x + 4.
                    - 3x² + 2x² = 5x².
                    - "3x + 2 ne se réduit pas : x et le nombre 2 sont différents."
        - titre: 4. Développer avec la distributivité
          blocs:
              - type: paragraphe
                texte: "Le nombre devant la parenthèse multiplie chaque terme à l’intérieur. Pense à distribuer des cartes à chaque personne : personne n’est oublié."
              - type: etapes
                elements:
                    - 3(x + 4) = 3 × x + 3 × 4.
                    - = 3x + 12.
                    - 5(2x − 3) = 5 × 2x − 5 × 3.
                    - = 10x − 15.
                    - 2(x + 3) + 4x = 2x + 6 + 4x = 6x + 6.
        - titre: 5. Remplacer x par une valeur
          blocs:
              - type: paragraphe
                texte: Quand on calcule une formule pour une valeur donnée, remplace chaque x par cette valeur. Les parenthèses évitent les erreurs.
          questions:
              - Calcule 2x² + 3x − 1 pour x = 2. Écris une ligne par calcul.
              - Explique pourquoi 3x + 2 ne devient pas 5x.
        - titre: Je m’entraîne — même méthode que dans le cours
          blocs:
              - type: paragraphe
                texte: Reprends les étapes de l’exemple juste au-dessus. Écris une ligne par étape et garde les unités.
          questions:
              - "Données : 5, 6, 6, 7, 11. Calcule moyenne, médiane et étendue."
              - Un sac contient 3 jetons gagnants sur 12. Écris la probabilité en fraction puis en pourcentage.
              - Développe 4(x + 3), puis réduis 2x + 5x − 1.
        - titre: Je transfère — une situation nouvelle
          blocs:
              - type: paragraphe
                texte: Cette fois, les nombres ou le contexte changent. Commence par identifier ce que l’on cherche, puis choisis la méthode qui convient.
          questions:
              - "Compare deux semaines de travail avec les données du cours : choisis un indicateur et explique ce qu’il raconte."
              - Un événement a une probabilité de 0,35. Quelle est la probabilité de son contraire ?
              - Calcule 3x + 2 pour x = 4. Explique pourquoi 3x + 2 n’est pas égal à 5x.
