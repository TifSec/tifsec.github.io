    - type: titre
      texte: Ce que nous allons apprendre à faire
    - type: liste
      elements:
          - Calculer et interpréter une moyenne, une médiane et une étendue.
          - Calculer une probabilité simple et celle d'un événement contraire.
          - Réduire, développer et calculer une expression littérale.
          - Organiser plusieurs calculs pour prendre une décision professionnelle.
          - Expliquer et vérifier les résultats obtenus.
    - type: paragraphe
      texte: Le lien avec la séance précédente
    - type: paragraphe
      texte: Lors de la séance 1, nous avons travaillé le calcul mental, les pourcentages, les proportions, les équations et les fonctions.
    - type: paragraphe
