titre: Poursuivre le diagnostic – données, probabilités et calcul littéral
theme: calcul mental, fractions, pourcentages et premières expressions littérales.
problematique: Poursuivre le diagnostic – données, probabilités et calcul littéral
pourquoi: "Objectif de cette séance : Calculer et interpréter une moyenne, une médiane et une étendue."
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances: []
    competences:
        - Calculer et interpréter une moyenne, une médiane et une étendue.
        - Calculer une probabilité simple et celle d'un événement contraire.
        - Réduire, développer et calculer une expression littérale.
        - Organiser plusieurs calculs pour prendre une décision professionnelle.
        - Expliquer et vérifier les résultats obtenus.
activites:
    - id: a03
      titre: "1. Automatismes : deuxième remise en route"
      contenu:
          - type: paragraphe
            texte: "Notion : calcul mental, fractions, pourcentages et premières expressions littérales."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? Ce sont des calculs et des transformations simples que nous devons pouvoir retrouver sans utiliser systématiquement une calculatrice.
          - type: paragraphe
            texte: À quoi ça sert ? À vérifier rapidement un résultat, estimer une quantité et éviter qu'un calcul élémentaire bloque la résolution d'un problème.
          - type: paragraphe
            texte: Pourquoi recommencer des automatismes ?
          - type: paragraphe
            texte: Lors de la séance précédente, nous avons retrouvé plusieurs méthodes. Les réutiliser aujourd'hui permet de les consolider et de vérifier que nous savons les appliquer avec d'autres nombres.
          - type: paragraphe
            texte: Calculatrice interdite. Effectuez les calculs suivants et expliquez votre méthode lorsque cela est possible.
          - type: liste
            elements:
                - 9 × 6
                - 72 ÷ 8
                - 25 + 7 × 5
                - La moitié de 3,6
                - Le quart de 100
                - 50 % de 70
                - 20 % de 60
                - 3/5 de 50
                - "Réduire : 3x + 5x."
                - "Développer : 2(x + 4)."
          - type: paragraphe
            texte: "Réflexe Bac :"
          - type: paragraphe
            texte: "Un automatisme n'est pas seulement une réponse rapide : c'est une méthode comprise que l'on sait réutiliser sans interrompre son raisonnement."
      questions: []
    - id: a04
      titre: "2. Statistiques : comprendre des données professionnelles"
      contenu:
          - type: paragraphe
            texte: "Notion : moyenne, médiane, étendue et proportion."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? Les statistiques permettent d'organiser plusieurs données et de les résumer avec quelques indicateurs.
          - type: paragraphe
            texte: À quoi ça sert ? À comparer des activités, repérer des écarts, analyser des consommations et prendre des décisions à partir de mesures.
          - type: paragraphe
            texte: Pourquoi cette activité ?
          - type: paragraphe
            texte: Nous savons maintenant effectuer des calculs simples. Nous allons les utiliser pour analyser plusieurs valeurs et comprendre ce qu'elles nous apprennent réellement.
          - type: paragraphe
            texte: "Ce que cela vous apporte : savoir interpréter un tableau de données plutôt que simplement lire des nombres."
          - type: paragraphe
            texte: "Situation professionnelle fictive : dans une structure équestre, on relève le nombre d'heures d'activité de huit chevaux sur une période donnée."
          - type: paragraphe
            texte: 5 ; 8 ; 6 ; 10 ; 7 ; 9 ; 7 ; 4
          - type: paragraphe
            texte: Ces données sont inventées pour l'exercice. Elles ne constituent pas des recommandations sur le travail des chevaux.
          - type: paragraphe
            texte: Calculatrice autorisée.
      questions: []
    - id: a05
      titre: "Exercice 1 : Organiser et résumer les données"
      contenu:
          - type: paragraphe
            texte: Pourquoi commencer par cet exercice ? Avant d'interpréter une série, nous devons la mettre en ordre et calculer quelques indicateurs.
      questions:
          - id: q01
            type: texte
            enonce: Ranger les valeurs dans l'ordre croissant.
            suite: []
          - id: q02
            type: texte
            enonce: Calculer le nombre total d'heures.
            suite: []
          - id: q03
            type: texte
            enonce: Calculer la moyenne.
            suite: []
          - id: q04
            type: texte
            enonce: Déterminer la médiane.
            suite: []
          - id: q05
            type: texte
            enonce: Calculer l'étendue.
            suite:
                - type: paragraphe
                  texte: Trois indicateurs différents
                - type: paragraphe
                  texte: "Moyenne : somme des valeurs divisée par leur nombre."
                - type: paragraphe
                  texte: "Médiane : valeur centrale d'une série ordonnée, ou moyenne des deux valeurs centrales si l'effectif est pair."
                - type: paragraphe
                  texte: "Étendue : différence entre la valeur maximale et la valeur minimale."
    - id: a06
      titre: "Exercice 2 : Compter et calculer une proportion"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous allons utiliser les données pour répondre à une question précise et retrouver les pourcentages de la séance précédente.
      questions:
          - id: q01
            type: texte
            enonce: Combien de chevaux ont travaillé au moins 7 heures ?
            suite: []
          - id: q02
            type: texte
            enonce: Quel pourcentage de l'effectif cela représente-t-il ?
            suite: []
    - id: a07
      titre: "Exercice 3 : Interpréter correctement un résultat"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Une valeur statistique peut être correcte mathématiquement, mais mal interprétée. Nous devons apprendre à distinguer un résumé d'une observation individuelle.
      questions:
          - id: q01
            type: texte
            enonce: "Un élève affirme : « Un cheval travaille 7 heures. » Cette phrase décrit-elle correctement les données ? Expliquez."
            suite:
                - type: paragraphe
                  texte: "Réflexe Bac :"
                - type: paragraphe
                  texte: "Une valeur statistique doit être accompagnée de son unité et d'une interprétation. Écrire « moyenne = 7 » ne suffit pas : il faut préciser « moyenne = 7 heures » et expliquer ce que cela signifie."
    - id: a08
      titre: "3. Probabilités : mesurer une possibilité"
      contenu:
          - type: paragraphe
            texte: "Notion : probabilité, événement et événement contraire."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? Une probabilité est un nombre compris entre 0 et 1 qui mesure la possibilité qu'un événement se réalise dans un modèle donné.
          - type: paragraphe
            texte: À quoi ça sert ? À raisonner sur des situations incertaines, comprendre des risques et comparer des événements possibles.
          - type: paragraphe
            texte: Pourquoi passons-nous aux probabilités ?
          - type: paragraphe
            texte: Avec les statistiques, nous avons analysé des valeurs connues. Avec les probabilités, nous allons étudier ce qui peut arriver lorsque le résultat dépend du hasard.
          - type: paragraphe
            texte: "Ce que cela vous apporte : savoir distinguer une certitude d'une possibilité et exprimer cette possibilité avec un nombre."
          - type: paragraphe
            texte: "Situation fictive : dans un groupe de 20 chevaux, 8 participent à une compétition."
          - type: paragraphe
            texte: On choisit un cheval au hasard parmi les 20, en supposant que chaque cheval possède la même chance d'être choisi.
          - type: paragraphe
            texte: Calculatrice autorisée.
      questions: []
    - id: a09
      titre: "Exercice 1 : Identifier les possibilités"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Avant de calculer une probabilité, nous devons identifier toutes les issues possibles et celles qui correspondent à l'événement étudié.
      questions:
          - id: q01
            type: texte
            enonce: Combien y a-t-il d'issues possibles ?
            suite: []
          - id: q02
            type: texte
            enonce: Combien d'issues correspondent à « le cheval participe à une compétition » ?
            suite: []
          - id: q03
            type: texte
            enonce: Calculer la probabilité de cet événement sous forme de fraction.
            suite:
                - type: paragraphe
                  texte: "Méthode :"
                - type: paragraphe
                  texte: Lorsque toutes les issues sont équiprobables, la probabilité d'un événement est égale au nombre d'issues favorables divisé par le nombre d'issues possibles.
    - id: a10
      titre: "Exercice 2 : Exprimer une probabilité de plusieurs façons"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Une même probabilité peut être écrite sous plusieurs formes. Les reconnaître permet de mieux comprendre et comparer les résultats.
      questions:
          - id: q01
            type: texte
            enonce: Simplifier la fraction 8/20.
            suite: []
          - id: q02
            type: texte
            enonce: Donner cette probabilité sous forme décimale.
            suite: []
          - id: q03
            type: texte
            enonce: Donner cette probabilité en pourcentage.
            suite: []
    - id: a11
      titre: "Exercice 3 : Calculer l'événement contraire"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous allons découvrir une méthode qui permet de calculer rapidement la probabilité qu'un événement ne se produise pas.
      questions:
          - id: q01
            type: texte
            enonce: Calculer la probabilité que le cheval choisi ne participe pas à une compétition.
            suite: []
          - id: q02
            type: texte
            enonce: Que remarquez-vous en additionnant les deux probabilités ?
            suite:
                - type: paragraphe
                  texte: "Réflexe Bac :"
                - type: paragraphe
                  texte: La probabilité d'un événement et celle de son contraire ont pour somme 1. On peut donc calculer P(non A) = 1 - P(A).
    - id: a12
      titre: "4. Calcul littéral : comprendre et transformer une formule"
      contenu:
          - type: paragraphe
            texte: "Notion : expression littérale, réduction et développement."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? Le calcul littéral consiste à utiliser des lettres pour représenter des nombres. Ces lettres permettent d'écrire une formule valable pour plusieurs situations.
          - type: paragraphe
            texte: À quoi ça sert ? À calculer un coût, une surface, une consommation ou une quantité sans devoir réinventer la méthode à chaque changement de valeur.
          - type: paragraphe
            texte: Pourquoi cette activité ?
          - type: paragraphe
            texte: Nous savons effectuer des calculs avec des nombres. Nous allons maintenant apprendre à simplifier des calculs contenant des lettres, pour construire et utiliser des formules.
          - type: paragraphe
            texte: "Ce que cela vous apporte : savoir utiliser une même méthode avec différentes valeurs."
          - type: paragraphe
            texte: Calculatrice interdite.
      questions: []
    - id: a13
      titre: "Exercice 1 : Réduire une expression"
      contenu:
          - type: paragraphe
            texte: Pourquoi commencer par réduire ? Réduire permet de regrouper les termes semblables pour obtenir une expression plus simple, sans changer sa valeur.
      questions:
          - id: q01
            type: texte
            enonce: "Réduire : 4x + 3x."
            suite: []
          - id: q02
            type: texte
            enonce: "Réduire : 7x - 2x + 4."
            suite: []
          - id: q03
            type: texte
            enonce: "Réduire : 3x² + 2x²."
            suite: []
    - id: a14
      titre: "Exercice 2 : Développer une expression"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Développer permet de transformer une multiplication contenant une somme ou une différence en une expression sans parenthèses.
      questions:
          - id: q01
            type: texte
            enonce: "Développer : 3(x + 4)."
            suite: []
          - id: q02
            type: texte
            enonce: "Développer : 5(2x - 3)."
            suite:
                - type: paragraphe
                  texte: "Deux opérations différentes :"
                - type: paragraphe
                  texte: "Réduire : regrouper des termes semblables."
                - type: paragraphe
                  texte: "Développer : utiliser la distributivité, par exemple a(b + c) = ab + ac."
    - id: a15
      titre: "Exercice 3 : Développer puis réduire"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Nous allons combiner les deux méthodes précédentes pour simplifier une expression plus complète.
      questions:
          - id: q01
            type: texte
            enonce: "Développer puis réduire : 2(x + 3) + 4x."
            suite: []
    - id: a16
      titre: "Exercice 4 : Utiliser une expression littérale"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Une formule devient utile lorsqu'elle permet de calculer un résultat concret à partir d'une valeur connue.
      questions:
          - id: q01
            type: texte
            enonce: Calculer 2x² + 3x - 1 pour x = 2.
            suite: []
          - id: q02
            type: texte
            enonce: Expliquer pourquoi 3x + 2 ne peut pas être réduit en 5x.
            suite:
                - type: paragraphe
                  texte: "Réflexe Bac :"
                - type: paragraphe
                  texte: "Avant de transformer une expression, identifiez l'opération à effectuer : réduire, développer ou remplacer une variable par une valeur."
    - id: a17
      titre: "5. Problème de synthèse : préparer un achat professionnel"
      contenu:
          - type: paragraphe
            texte: "Notion : pourcentage, coût total, budget et résolution de problème."
          - type: paragraphe
            texte: Concrètement, qu'est-ce que c'est ? Résoudre un problème consiste à utiliser plusieurs informations pour répondre à une question précise, en organisant les calculs nécessaires.
          - type: paragraphe
            texte: À quoi ça sert ? À préparer un achat, comparer une dépense au budget disponible et éviter une erreur de décision.
          - type: paragraphe
            texte: Pourquoi terminer par ce problème ?
          - type: paragraphe
            texte: Jusqu'à présent, les exercices indiquaient généralement le calcul à effectuer. Maintenant, vous allez devoir choisir et organiser vous-mêmes les étapes.
          - type: paragraphe
            texte: "Ce que cela vous apporte : savoir résoudre une situation complète, comme vous pourriez le faire en entreprise ou en stage."
          - type: paragraphe
            texte: "Situation professionnelle : une entreprise équestre souhaite acheter un équipement affiché à 2 850 €."
          - type: paragraphe
            texte: Le fournisseur accorde une réduction de 12 %. Il faut ensuite ajouter 95 € de frais de livraison.
          - type: paragraphe
            texte: L'entreprise dispose d'un budget maximal de 2 600 €.
          - type: paragraphe
            texte: "Question principale : l'entreprise peut-elle réaliser cet achat sans dépasser son budget ?"
          - type: paragraphe
            texte: Calculatrice autorisée.
      questions:
          - id: q01
            type: texte
            enonce: Calculer le montant de la réduction.
            suite: []
          - id: q02
            type: texte
            enonce: Calculer le prix après réduction.
            suite: []
          - id: q03
            type: texte
            enonce: Calculer le coût total avec la livraison.
            suite: []
          - id: q04
            type: texte
            enonce: Le budget est-il suffisant ? Justifier.
            suite:
                - type: paragraphe
                  texte: "Réflexe Bac : résoudre un problème"
          - id: q05
            type: texte
            enonce: Comprendre ce que l'on cherche.
            suite: []
          - id: q06
            type: texte
            enonce: Repérer les données utiles.
            suite: []
          - id: q07
            type: texte
            enonce: Choisir les calculs et leur ordre.
            suite: []
          - id: q08
            type: texte
            enonce: Faire apparaître les étapes du raisonnement.
            suite: []
          - id: q09
            type: texte
            enonce: Vérifier le résultat et répondre par une phrase.
            suite: []
    - id: a18
      titre: 6. Mon bilan après deux séances
      contenu:
          - type: paragraphe
            texte: Pourquoi ce bilan ? Il permet de reconnaître vos progrès et d'identifier les notions à consolider avant de poursuivre.
          - type: paragraphe
            texte: Calculatrice interdite. Aucun calcul n'est nécessaire.
          - type: paragraphe
            texte: Complétez les phrases suivantes.
          - type: paragraphe
            texte: "Je suis plutôt à l'aise avec : ........................................................................"
          - type: paragraphe
            texte: "Je dois retravailler : ........................................................................"
          - type: paragraphe
            texte: "Une méthode ou un réflexe que je veux retenir : ........................................................................"
      questions: []
    - id: a19
      titre: 7. Ce que je dois savoir faire
      contenu:
          - type: paragraphe
            texte: "À l'issue de cette séance, je dois progressivement être capable de :"
          - type: liste
            elements:
                - Calculer mentalement des valeurs simples.
                - Respecter les priorités opératoires.
                - Calculer une moyenne et interpréter son résultat.
                - Déterminer une médiane et une étendue.
                - Passer d'un effectif à une proportion ou un pourcentage.
                - Calculer une probabilité simple et celle d'un événement contraire.
                - Réduire et développer une expression littérale simple.
                - Remplacer une variable par une valeur.
                - Organiser les étapes d'un problème.
                - Contrôler la cohérence d'un résultat.
                - Justifier une réponse avec des calculs et une phrase.
      questions: []
    - id: a20
      titre: À retenir
      contenu:
          - type: liste
            elements:
                - La moyenne, la médiane et l'étendue apportent des informations différentes sur une série statistique.
                - Une statistique doit être interprétée dans son contexte et accompagnée de son unité.
                - Une probabilité est comprise entre 0 et 1, soit entre 0 % et 100 %.
                - La probabilité d'un événement et celle de son contraire ont pour somme 1.
                - Réduire consiste à regrouper des termes semblables.
                - Développer consiste notamment à utiliser la distributivité.
                - Une formule permet de réaliser un même calcul avec différentes valeurs.
                - Dans un problème, les étapes du raisonnement doivent apparaître.
                - La calculatrice et le tableur effectuent les calculs, mais ne remplacent pas la compréhension des méthodes.
      questions: []
    - id: a21
      titre: Sources et ressources
      contenu:
          - type: liste
            elements:
                - "Chlorofil – Baccalauréat professionnel : tronc commun – référentiel et documents d'accompagnement."
                - Chlorofil – Document d'accompagnement MG1 – automatismes, statistiques, probabilités et pratique algébrique.
                - Chlorofil – Bac professionnel Conduite et gestion de l'entreprise hippique – référentiel de spécialité.
          - type: lien
            titre: "Chlorofil – Baccalauréat professionnel : tronc commun"
            url: https://chlorofil.fr/diplomes/secondaire/bac-pro/1re-tle/tronc-commun
          - type: lien
            titre: Chlorofil – Document d'accompagnement MG1
            url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/bacpro/bacpro-tc-da-MG1.pdf
          - type: lien
            titre: Chlorofil – Bac professionnel Conduite et gestion de l'entreprise hippique
            url: https://chlorofil.fr/diplomes/secondaire/bac-pro/1re-tle/cgeh
      questions: []
