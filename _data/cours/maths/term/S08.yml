version_papier:
    titre: Fiche papier — Méthodes à garder en tête pour le bilan
    introduction: "Cette fiche rappelle comment t’organiser. Elle ne contient aucune réponse au bilan : c’est ton travail qui montrera ce que tu sais faire."
    sections:
        - titre: 1. Pour chaque problème
          blocs:
              - type: liste
                elements:
                    - "Souligne la question : qu’est-ce qu’on cherche ?"
                    - Entoure les données utiles et leurs unités.
                    - Choisis une formule ou une méthode.
                    - Montre les calculs dans l’ordre.
                    - Réponds par une phrase et vérifie que le résultat est possible.
        - titre: 2. Repères de calcul
          blocs:
              - type: liste
                elements:
                    - "Pour une fonction : remplace x par la valeur donnée, puis respecte les priorités."
                    - "Pour une égalité : fais la même opération des deux côtés."
                    - "Pour un minimum en forme canonique : le carré vaut au minimum zéro."
                    - "Pour comparer deux offres : utilise la même valeur de x et les mêmes unités."
                    - "Pour une contrainte : traduis « au plus » par ≤ et « au moins » par ≥, puis vérifie le résultat dans le contexte."
        - titre: 3. Présenter un raisonnement lisible
          blocs:
              - type: paragraphe
                texte: Laisse une ligne par étape. N’efface pas les calculs qui permettent de comprendre ton raisonnement. Une calculatrice peut vérifier un résultat ; elle ne remplace pas l’explication.
          questions:
              - Avant de rendre, relis chaque consigne et vérifie que tu as répondu à toutes les parties.
