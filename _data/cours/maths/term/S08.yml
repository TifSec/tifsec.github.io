titre: Bilan de compétences – Calculer, modéliser et décider
theme: Mathématiques — Bilan de compétences – Calculer, modéliser et décider
problematique: Bilan de compétences – Calculer, modéliser et décider
pourquoi: Depuis plusieurs séances, nous utilisons les mathématiques pour prévoir des dépenses, comparer des prestations, rechercher un coût minimal et respecter un budget.
application: un centre équestre prépare l'achat de matériel pour une journée d'animation.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances: []
    competences: []
activites:
    - id: a02
      titre: À quoi sert cette évaluation ?
      contenu:
          - type: paragraphe
            texte: Depuis plusieurs séances, nous utilisons les mathématiques pour prévoir des dépenses, comparer des prestations, rechercher un coût minimal et respecter un budget.
          - type: paragraphe
            texte: Cette évaluation permet de vérifier ce que vous savez faire et d'identifier les méthodes à retravailler.
          - type: paragraphe
            texte: Consignes
          - type: liste
            elements:
                - "Durée : 55 minutes."
                - Travail individuel.
                - Calculatrice autorisée ou interdite selon les activités.
                - Écrire les étapes des calculs, même si le résultat final est incertain.
                - Indiquer les unités et justifier les décisions.
                - En cas de difficulté, passer à la question suivante puis revenir à la précédente.
          - type: paragraphe
            texte: "Barème : 20 points."
      questions: []
    - id: a03
      titre: 1. Automatismes et calculs professionnels
      contenu:
          - type: paragraphe
            texte: "Durée indicative : 7 minutes. Calculatrice interdite. Barème : 3 points."
          - type: paragraphe
            texte: "Situation : un centre équestre prépare l'achat de matériel pour une journée d'animation."
          - type: paragraphe
            texte: Pourquoi cette activité ? Les calculs simples permettent de vérifier rapidement un tarif, une remise ou une quantité.
      questions:
          - id: q01
            type: texte
            enonce: Calculer 15 % de 200 €. (0,5 point)
            suite: []
          - id: q02
            type: texte
            enonce: Un équipement coûte 240 €. Une remise de 25 % est accordée. Calculer son prix après remise. (1 point)
            suite: []
          - id: q03
            type: texte
            enonce: Résoudre l'équation 5x + 15 = 60. (1 point)
            suite: []
          - id: q04
            type: texte
            enonce: Calculer 3² + 4². (0,5 point)
            suite: []
    - id: a04
      titre: 2. Modéliser une prestation avec une fonction affine
      contenu:
          - type: paragraphe
            texte: "Durée indicative : 11 minutes. Calculatrice autorisée. Barème : 5 points."
          - type: paragraphe
            texte: "Situation professionnelle : un prestataire transporte du matériel pour des événements équestres."
          - type: paragraphe
            texte: "Son tarif comprend :"
          - type: liste
            elements:
                - 80 € de frais fixes par déplacement ;
                - 15 € par équipement transporté.
          - type: paragraphe
            texte: On note x le nombre d'équipements transportés et T(x) le coût total en euros.
          - type: paragraphe
            texte: Pourquoi cette activité ? Une fonction affine permet de prévoir un coût lorsque chaque équipement supplémentaire entraîne la même dépense.
      questions:
          - id: q01
            type: texte
            enonce: Écrire l'expression de T(x). (1 point)
            suite: []
          - id: q02
            type: texte
            enonce: Expliquer ce que représentent 15 et 80 dans la formule. (1 point)
            suite: []
          - id: q03
            type: texte
            enonce: Calculer le coût du transport de huit équipements. (1 point)
            suite: []
          - id: q04
            type: texte
            enonce: Le centre dispose de 230 €. Combien d'équipements peut-il transporter au maximum ? Justifier. (1,5 point)
            suite: []
          - id: q05
            type: texte
            enonce: Expliquer pourquoi onze équipements ne respectent pas ce budget. (0,5 point)
            suite: []
    - id: a05
      titre: 3. Rechercher un coût minimal et respecter un budget
      contenu:
          - type: paragraphe
            texte: "Durée indicative : 14 minutes. Calculatrice autorisée. Barème : 6 points."
          - type: paragraphe
            texte: "Situation professionnelle : un centre équestre souhaite prévoir le coût mensuel de l'entretien d'une installation."
          - type: paragraphe
            texte: "Le modèle fictif est :"
          - type: paragraphe
            texte: C(x) = 4(x - 5)² + 160
          - type: paragraphe
            texte: x représente le nombre d'interventions mensuelles, entier compris entre 1 et 9. C(x) représente le coût en euros.
          - type: paragraphe
            texte: Pourquoi cette activité ? La forme canonique permet de repérer le coût minimal et de déterminer les fréquences compatibles avec un budget.
      questions:
          - id: q01
            type: texte
            enonce: Expliquer pourquoi C est une fonction du second degré. (0,5 point)
            suite: []
          - id: q02
            type: texte
            enonce: Calculer C(3), C(5) et C(7). (1,5 point)
            suite: []
          - id: q03
            type: texte
            enonce: Déterminer le coût minimal et le nombre d'interventions correspondant. Justifier. (1,5 point)
            suite: []
          - id: q04
            type: texte
            enonce: Donner les coordonnées du sommet de la parabole. (0,5 point)
            suite:
                - type: paragraphe
                  texte: Le centre dispose maintenant d'un budget maximal de 176 € par mois.
                - type: paragraphe
                  texte: Pourquoi les questions suivantes ? Nous allons rechercher toutes les fréquences possibles, et non uniquement celle du coût minimal.
          - id: q05
            type: texte
            enonce: Écrire l'inéquation correspondant au budget. (0,5 point)
            suite: []
          - id: q06
            type: texte
            enonce: Résoudre cette inéquation et donner toutes les fréquences entières autorisées. (1,5 point)
            suite: []
    - id: a06
      titre: 4. Comparer deux prestataires
      contenu:
          - type: paragraphe
            texte: "Durée indicative : 16 minutes. Calculatrice autorisée. Barème : 6 points."
          - type: paragraphe
            texte: "Situation professionnelle : une structure équestre souhaite choisir un prestataire pour l'entretien mensuel de ses équipements."
          - type: paragraphe
            texte: "Deux entreprises proposent les modèles fictifs suivants :"
          - type: paragraphe
            texte: A(x) = 20x + 80
          - type: paragraphe
            texte: B(x) = 5(x - 4)² + 160
          - type: paragraphe
            texte: x représente le nombre d'interventions mensuelles, entier compris entre 1 et 8. Les coûts sont exprimés en euros.
          - type: paragraphe
            texte: Pourquoi cette activité ? Le prestataire le moins cher peut changer selon le nombre d'interventions. Nous allons comparer les offres, retrouver leurs points d'égalité et justifier une décision.
      questions: []
    - id: a07
      titre: "Exercice 1 : Calculer et comparer"
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Calculer les coûts des deux entreprises pour trois interventions. Indiquer laquelle est la moins chère. (1 point)
            suite: []
          - id: q02
            type: texte
            enonce: Calculer les coûts des deux entreprises pour six interventions. Indiquer laquelle est la moins chère. (1 point)
            suite: []
    - id: a08
      titre: "Exercice 2 : Rechercher les points d'égalité"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Une équation permet de rechercher les fréquences pour lesquelles les deux entreprises proposent exactement le même coût.
      questions:
          - id: q01
            type: texte
            enonce: Écrire l'équation A(x) = B(x), puis montrer qu'elle peut s'écrire x² - 12x + 32 = 0. (1,5 point)
            suite: []
          - id: q02
            type: texte
            enonce: Vérifier que x² - 12x + 32 = (x - 4)(x - 8), puis résoudre l'équation à l'aide de la règle du produit nul. (1,5 point)
            suite: []
          - id: q03
            type: texte
            enonce: Expliquer ce que représentent les solutions x = 4 et x = 8 dans cette situation professionnelle. (0,5 point)
            suite: []
    - id: a09
      titre: "Exercice 3 : Conseiller le responsable"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Les résultats mathématiques doivent permettre de prendre une décision qui respecte le besoin et le budget.
          - type: paragraphe
            texte: Le centre prévoit six interventions et dispose d'un budget mensuel maximal de 190 €.
      questions:
          - id: q01
            type: texte
            enonce: Rédiger une recommandation indiquant l'entreprise à choisir et justifier votre décision avec les coûts calculés. (0,5 point)
            suite: []
    - id: a10
      titre: 5. Mon bilan de compétences
      contenu:
          - type: paragraphe
            texte: "Durée indicative : 5 minutes. Sans calculatrice."
          - type: paragraphe
            texte: Pour chaque compétence, indiquez votre niveau actuel.
          - type: tableau
            colonnes:
                - Compétence
                - Acquis
                - À consolider
                - À retravailler
            lignes:
                - - Calculer un pourcentage
                  - □
                  - □
                  - □
                - - Construire une fonction affine
                  - □
                  - □
                  - □
                - - Calculer l'image d'une fonction
                  - □
                  - □
                  - □
                - - Lire le minimum d'une fonction
                  - □
                  - □
                  - □
                - - Résoudre une équation ou une inéquation
                  - □
                  - □
                  - □
                - - Justifier une décision professionnelle
                  - □
                  - □
                  - □
      questions:
          - id: q01
            type: texte
            enonce: Quelle méthode maîtrises-tu le mieux ?
            suite: []
          - id: q02
            type: texte
            enonce: Quelle méthode souhaites-tu retravailler en priorité ?
            suite: []
          - id: q03
            type: texte
            enonce: As-tu écrit une démarche lorsque tu ne trouvais pas le résultat ? Explique.
            suite: []
    - id: a11
      titre: À retenir
      contenu:
          - type: liste
            elements:
                - Une fonction affine représente une évolution régulière.
                - Une fonction du second degré peut posséder un minimum ou un maximum.
                - Une équation permet de rechercher des valeurs donnant une égalité.
                - Une inéquation permet de rechercher les valeurs respectant une condition.
                - Une décision professionnelle doit respecter les contraintes et être justifiée.
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
introduction:
    - type: titre
      texte: Ce que vous allez travailler
    - type: liste
      elements:
          - Calculer des pourcentages et résoudre une équation simple.
          - Utiliser une fonction affine pour prévoir un coût.
          - Étudier une fonction du second degré et rechercher son minimum.
          - Résoudre une inéquation liée à un budget.
          - Comparer deux prestations et justifier une décision professionnelle.
