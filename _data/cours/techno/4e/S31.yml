titre: 'Séance 31 : Écrire les règles d’un jeu avant de le programmer'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment écrire l’algorithme d’un jeu avant de le programmer ?
competences_bo:
    - Concevoir, écrire, tester et mettre au point un programme
objectifs:
    connaissances:
        - 'Un algorithme en langage naturel utilise des mots simples : QUAND, SI … ALORS … SINON, RÉPÉTER.'
        - 'On écrit l’algorithme avant de programmer : on réfléchit aux règles, puis on traduit en blocs.'
    competences:
        - Écrire un algorithme en langage naturel (réflexe R12).
        - Repérer les événements, les conditions et les boucles d’un jeu.
pourquoi:
    - En 5e, tu as modifié un jeu Arcade déjà fait. En séance 30, tu as écrit des instructions précises.
    - En 4e, tu écris d’abord les règles de ton jeu sous forme d’algorithme.
activites:
    -   id: a01
        titre: Le jeu à concevoir
        contenu:
            -   type: citation
                texte: 'Réflexe brevet n° 12 : j’écris un algorithme en langage naturel : QUAND…, SI… ALORS… SINON…'
            -   type: paragraphe
                texte: 'Jeu « Récolte » : un panier se déplace avec les flèches ; des fruits tombent du haut de l’écran ; si le panier attrape un fruit, le score augmente de 1 ; si un fruit touche le sol, on perd une vie ; à 0 vie, la partie est perdue.'
            -   type: paragraphe
                texte: 'Exemple expliqué : « QUAND le panier touche un fruit : ajouter 1 au score, détruire le fruit. » C’est un événement suivi de deux actions.'
        questions:
            -   id: q01
                type: tableau
                enonce: Écris l’algorithme du jeu en complétant chaque ligne.
                colonnes:
                    - Événement ou condition
                    - Actions
                lignes:
                    -   - QUAND on appuie sur une flèche
                        - ''
                    -   - QUAND le panier touche un fruit
                        - ''
                    -   - QUAND un fruit touche le sol
                        - ''
                    -   - SI vies = 0
                        - ''
                aide: Ligne × colonne.
    -   id: a02
        titre: Les fruits qui tombent
        transition: Les règles du panier sont écrites. Il faut aussi faire tomber les fruits.
        questions:
            -   id: q01
                type: texte
                enonce: Écris l’algorithme qui fait apparaître un fruit en haut de l’écran toutes les 2 secondes, à un endroit au hasard.
                aide: Combien d’éléments sont demandés ?
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le jeu devient plus difficile avec le temps.
        questions:
            -   id: q01
                type: texte
                enonce: Écris la règle qui accélère les fruits tous les 10 points.
                aide: Combien d’éléments sont demandés ?
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton algorithme est prêt. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment écrire l’algorithme d’un jeu avant de le programmer ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Algorithme en langage naturel : QUAND, SI … ALORS … SINON, RÉPÉTER.'
    - 'Réflexe R12 : écrire l’algorithme avant de programmer.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
