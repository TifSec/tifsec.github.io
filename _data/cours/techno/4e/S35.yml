titre: 'Séance 35 : Qui capte, qui décide, qui affiche ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Quels constituants du monte-charge acquièrent, traitent et communiquent l’information ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - 'Monte-charge : boutons, contacts haut et bas, capteur à ultrasons (acquérir) ; carte micro:bit (traiter) ; écran OLED et voyants (communiquer).'
        - 'Broches : P0 contact haut, P1 bouton Étage, P13 contact bas, P15 bouton RDC, P2 capteur à ultrasons.'
    competences:
        - Identifier sur l’objet réel les constituants de la chaîne d’information.
        - Associer constituant, broche et fonction.
pourquoi:
    - En 5e, la chaîne d’information du monte-charge t’était fournie. En séance 5, tu as repéré ses choix de conception.
    - Aujourd’hui, tu identifies toi-même la chaîne d’information.
activites:
    -   id: a01
        titre: Suivre les fils (poste maquette)
        consigne: Tu vas suivre les fils du monte-charge (au poste maquette, moteur arrêté, ou sur les photos) jusqu’à la carte micro:bit. On attend la broche et la fonction de chaque constituant.
        contenu:
            -   type: etapes
                elements:
                    - Au poste maquette, moteur arrêté, suis le fil de chaque constituant jusqu’à la carte.
                    - Note la broche (P0, P1…) inscrite sur le connecteur.
                    - Les autres groupes utilisent les photos de la carte.
            -   type: paragraphe
                texte: 'Pourquoi suivre les fils ? La broche dit au programme d’où vient l’information : c’est le lien entre l’objet réel et le programme.'
        questions:
            -   id: q01
                type: tableau
                enonce: Sur le monte-charge, note la broche de la carte et la fonction (acquérir, traiter, communiquer) de chaque constituant.
                colonnes:
                    - Constituant
                    - Broche
                    - Fonction
                lignes:
                    -   - Bouton Étage
                        - ''
                        - ''
                    -   - Contact haut
                        - ''
                        - ''
                    -   - Capteur à ultrasons
                        - ''
                        - ''
                aide: Capteur ou bouton → acquérir ; carte → traiter ; écran, voyant → communiquer.
    -   id: a02
        titre: Construire la chaîne
        transition: Tu as identifié les constituants. Range-les.
        consigne: Tu vas construire la chaîne d’information complète du monte-charge (acquérir, traiter, communiquer). On attend chaque constituant dans la bonne colonne.
        contenu:
            -   type: etapes
                elements:
                    - Range tous les constituants en trois colonnes.
                    - Acquérir = ce qui récupère une information ; traiter = ce qui décide ; communiquer = ce qui informe l’utilisateur.
                    - 'Vérifie : le moteur n’y est pas.'
            -   type: paragraphe
                texte: 'Pourquoi pas le moteur ? Il fait bouger la cabine : il appartient à la chaîne d’énergie, pas à celle de l’information.'
        questions:
            -   id: q01
                type: tableau
                enonce: Range tous les constituants du monte-charge dans sa chaîne d’information.
                colonnes:
                    - Acquérir
                    - Traiter
                    - Communiquer
                lignes:
                    -   - ''
                        - ''
                        - ''
                aide: Ligne × colonne.
    -   id: a03
        titre: Les voyants
        transition: La chaîne est complète. Observe ce qu’elle communique.
        consigne: Tu vas observer les voyants du monte-charge pendant une démonstration (démarrage, attente, trajet). On attend ce que communique chaque couleur.
        contenu:
            -   type: etapes
                elements:
                    - 'Observe la démonstration : démarrage, attente, trajet.'
                    - Note la couleur des voyants à chaque moment.
                    - Explique ce qu’elle communique.
            -   type: paragraphe
                texte: Pourquoi des couleurs ? Elles informent l’utilisateur d’un coup d’œil, même de loin.
        questions:
            -   id: q01
                type: texte
                enonce: Que communique chaque couleur (orange, vert, rouge) ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: On voudrait un son à l’arrivée.
        questions:
            -   id: q01
                type: texte
                enonce: Quel constituant ajouter, et dans quelle fonction ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as identifié toute la chaîne. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : qui capte, qui décide, qui affiche dans le monte-charge ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Acquérir : boutons, contacts, ultrasons. Traiter : micro:bit. Communiquer : écran, voyants.'
    - 'Broches : P0, P1, P2, P13, P15.'
sources:
