titre: 'Séance 35 : Qui capte, qui décide, qui affiche ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Quels constituants du monte-charge acquièrent, traitent et communiquent l’information ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - 'Monte-charge : boutons Étage et RDC, contacts haut et bas, capteur à ultrasons (acquérir) ; carte micro:bit (traiter) ; écran OLED et voyants (communiquer).'
        - 'Les constituants sont reliés à la carte par des broches : P0 contact haut, P1 bouton Étage, P13 contact bas, P15 bouton RDC, P2 capteur à ultrasons.'
    competences:
        - Identifier sur l’objet réel les constituants de la chaîne d’information.
        - Associer chaque constituant à sa broche et à sa fonction.
pourquoi:
    - En 5e, la chaîne d’information du monte-charge t’était fournie. En séance 5, tu as repéré ses choix de conception.
    - Aujourd’hui, tu identifies toi-même les constituants de la chaîne d’information.
activites:
    -   id: a01
        titre: Identifier (poste maquette)
        contenu:
            -   type: paragraphe
                texte: Chaque groupe passe au poste maquette (moteur arrêté) et suit les fils depuis chaque constituant jusqu’à la carte.
        questions:
            -   id: q01
                type: tableau
                enonce: Note chaque constituant repéré, sa broche et sa fonction.
                colonnes:
                    - Constituant
                    - Broche
                    - Fonction
                lignes:
                    -   - Bouton Étage
                        - ''
                        - ''
                    -   - Contact haut
                        - ''
                        - ''
                    -   - Capteur à ultrasons
                        - ''
                        - ''
                aide: Ligne × colonne.
    -   id: a02
        titre: Le schéma de la chaîne
        transition: Tu as identifié les constituants. Range-les dans la chaîne.
        questions:
            -   id: q01
                type: tableau
                enonce: Complète la chaîne d’information du monte-charge.
                colonnes:
                    - Acquérir
                    - Traiter
                    - Communiquer
                lignes:
                    -   - ''
                        - ''
                        - ''
                aide: Ligne × colonne.
            -   id: q02
                type: qcm
                enonce: Le moteur fait-il partie de la chaîne d’information ?
                choix:
                    -   id: a
                        texte: 'Non : il fait partie de la chaîne d’énergie (il convertit l’énergie électrique en mouvement).'
                    -   id: b
                        texte: 'Oui : il acquiert.'
                    -   id: c
                        texte: 'Oui : il communique.'
                aide: Relis l’exemple expliqué.
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: 'Les voyants changent de couleur : orange, vert, rouge.'
        questions:
            -   id: q01
                type: texte
                enonce: Que communique chaque couleur à l’utilisateur ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as identifié toute la chaîne. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : qui capte, qui décide, qui affiche dans le monte-charge ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Acquérir : boutons, contacts, ultrasons. Traiter : micro:bit. Communiquer : écran, voyants.'
    - 'Broches : P0 contact haut, P1 Étage, P2 ultrasons, P13 contact bas, P15 RDC.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
