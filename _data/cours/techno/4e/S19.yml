titre: 'Séance 19 : Que fait chaque constituant de l’éolienne ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Quels constituants de l’éolienne convertissent et transmettent l’énergie, et sous quelle forme ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - Le ventilateur (alimenté par l’alimentation ATX) crée le vent ; le rotor convertit l’énergie du vent en rotation ; le moteur de CD, utilisé en génératrice, convertit la rotation en électricité ; les fils la transmettent.
        - À chaque conversion, une partie de l’énergie est perdue (frottements, chaleur).
    competences:
        - Identifier les constituants sur l’objet réel.
        - Indiquer l’énergie en entrée et en sortie de chaque constituant.
pourquoi:
    - En 5e, la chaîne d’énergie de l’éolienne t’était fournie.
    - En 4e, c’est toi qui identifies les constituants sur la vraie maquette et qui écris les énergies.
activites:
    -   id: a01
        titre: Identifier (poste maquette)
        consigne: Tu vas suivre le chemin de l’énergie dans l’éolienne de la classe (ou sur les photos projetées), de la prise à la LED. On attend la liste des constituants dans l’ordre. Seul le professeur branche l’alimentation 230 V.
        contenu:
            -   type: etapes
                elements:
                    - '⚠️ L’alimentation ATX est branchée sur le 230 V : seul le professeur la branche et la manipule.'
                    - Quand ton groupe passe au poste maquette, suis le chemin de l’énergie, de la prise à la LED.
                    - Note les constituants dans l’ordre.
                    - Les autres groupes utilisent les photos projetées.
            -   type: paragraphe
                texte: 'Pourquoi suivre le chemin de l’énergie ? Une chaîne d’énergie se lit dans l’ordre : chaque constituant reçoit l’énergie du précédent.'
        questions:
            -   id: q01
                type: tableau
                enonce: Écris les constituants dans l’ordre où passe l’énergie.
                colonnes:
                    - Ordre
                    - Constituant
                lignes:
                    -   - '1'
                        - ''
                    -   - '2'
                        - ''
                    -   - '3'
                        - ''
                    -   - '4'
                        - ''
                aide: Source → constituant qui transforme → forme d’énergie en sortie.
    -   id: a02
        titre: Énergie en entrée, énergie en sortie
        transition: Tu as identifié les constituants. Précise les énergies.
        consigne: Tu vas trouver quelle énergie reçoit et quelle énergie fournit chaque constituant de l’éolienne, en t’aidant de l’exemple du ventilateur. On attend le tableau des énergies et la fonction de la génératrice.
        contenu:
            -   type: paragraphe
                texte: 'Exemple expliqué : le ventilateur reçoit de l’énergie électrique et fournit l’énergie de mouvement de l’air (le vent).'
            -   type: etapes
                elements:
                    - Lis l’exemple expliqué.
                    - 'Pour le rotor puis la génératrice, demande-toi : quelle énergie reçoit-il ? laquelle fournit-il ?'
                    - Complète le tableau.
            -   type: paragraphe
                texte: 'Pourquoi entrée et sortie ? Un constituant qui convertit change la forme de l’énergie : c’est ce qu’on écrit sur les flèches d’un schéma bloc.'
        questions:
            -   id: q01
                type: tableau
                enonce: Pour le rotor et la génératrice de l’éolienne de la classe, écris l’énergie reçue (entrée) et l’énergie fournie (sortie).
                colonnes:
                    - Constituant
                    - Énergie en entrée
                    - Énergie en sortie
                lignes:
                    -   - Rotor
                        - ''
                        - ''
                    -   - Génératrice
                        - ''
                        - ''
                aide: Source → constituant qui transforme → forme d’énergie en sortie.
            -   id: q02
                type: qcm
                enonce: Quelle fonction réalise la génératrice ?
                choix:
                    -   id: a
                        texte: Convertir.
                    -   id: b
                        texte: Transmettre.
                    -   id: c
                        texte: Stocker.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a03
        titre: Les pertes
        transition: Toute l’énergie du ventilateur n’arrive pas à la LED.
        consigne: Tu vas comparer l’énergie consommée par le ventilateur (2 W) et celle produite par la génératrice (0,1 W). On attend une explication de la différence avec deux pertes.
        contenu:
            -   type: etapes
                elements:
                    - Lis les deux puissances.
                    - 'Compare : le ventilateur consomme 2 W, la génératrice produit 0,1 W.'
                    - Cherche où passe l’énergie manquante.
            -   type: paragraphe
                texte: 'Pourquoi des pertes ? Aucune conversion n’est parfaite : une partie de l’énergie part en chaleur ou en frottements.'
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi l’éolienne produit-elle beaucoup moins que ce que consomme le ventilateur ? Donne deux pertes.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le rendement compare l’énergie utile à l’énergie reçue.
        questions:
            -   id: q01
                type: texte
                enonce: Calcule le rendement de la maquette (0,1 W produits pour 2 W consommés).
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as décrit toute la chaîne. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quels constituants convertissent et transmettent l’énergie, et sous quelle forme ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Rotor : vent → rotation ; génératrice : rotation → électricité ; fils : transmettre.'
    - À chaque conversion, une partie de l’énergie est perdue.
sources:
