titre: "Que peut-on conclure à partir de mesures ?"
theme: "Excel/Calc, données et IA"
problematique: "Que peut-on conclure à partir de mesures ?"
pourquoi: "Une conclusion cite les données et précise la limite des essais."
application: "Un tableau organisé permet de comparer des mesures et d’expliquer un choix."
lien_precedent: "Après Quel graphique aide à comparer les résultats ?, une nouvelle mission t’aide à réutiliser tes méthodes."
prerequis:
    - "Tu peux relire la séance précédente (Quel graphique aide à comparer les résultats ?) si nécessaire."
notions:
    - titre: "Un exemple expliqué"
      texte: "Deux essais donnent 1,8 V puis 1,9 V. Je peux dire que les valeurs sont proches dans ces essais. Je ne peux pas affirmer que toutes les éoliennes donneront toujours cette tension."
objectifs:
    connaissances:
        - "Une conclusion cite les données et précise la limite des essais."
    competences:
        - "Interpréter le tableau et le graphique de S18. Citer deux valeurs et une limite de mesure."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Une conclusion cite les données et précise la limite des essais."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Interpréter le tableau et le graphique de S18. Citer deux valeurs et une limite de mesure."
    - type: paragraphe
      texte: "Dans la vie réelle : Un tableau organisé permet de comparer des mesures et d’expliquer un choix."
activites:
    - id: a01
      titre: "1. Comprendre la mission"
      pourquoi: "On commence par un exemple guidé : il montre une méthode avant que tu l’essaies."
      demarche:
          - Lis la situation.
          - Suis les étapes de l’exemple.
          - Repère la donnée qui aide à répondre.
      contenu:
          - type: paragraphe
            texte: "Deux essais donnent 1,8 V puis 1,9 V. Je peux dire que les valeurs sont proches dans ces essais. Je ne peux pas affirmer que toutes les éoliennes donneront toujours cette tension."
      questions:
          - id: q01
            type: texte
            enonce: "Quelle est la différence entre une donnée mesurée et une conclusion ?"
            aide: "Relis l’exemple et repère l’information qui répond à la question."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
            aide: "Une ou deux phrases suffisent."
    - id: a02
      titre: "2. À toi d’essayer"
      pourquoi: "Tu as vu la méthode ; maintenant, applique-la dans une tâche que tu peux vérifier."
      demarche:
          - Réalise les étapes dans l’ordre.
          - Note le résultat attendu.
          - Compare-le au résultat observé.
      consigne: "Interpréter le tableau et le graphique de S18. Citer deux valeurs et une limite de mesure."
      questions:
          - id: q01
            type: texte
            enonce: "Quel résultat observes-tu ? Décris ton essai."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
      ressources:
          - type: lien
            titre: "Éduscol — Technologie au cycle 4"
            url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
    - id: a03
      titre: "3. Réutiliser la méthode"
      pourquoi: "Un nouvel exemple t’aide à voir où cette méthode peut encore servir."
      contenu:
          - type: paragraphe
            texte: "Reprends la méthode avec une nouvelle valeur, un autre document ou une autre situation du dossier."
      questions:
          - id: q01
            type: texte
            enonce: "Quelle information permet de justifier ta conclusion ? Quelle limite reste à vérifier ?"
    - id: a04
      titre: "4. Ce que tu retiens"
      pourquoi: "Tu termines en gardant une idée et une méthode pour la prochaine séance."
      demarche:
          - Relis les deux éléments à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Une conclusion cite les données et précise la limite des essais."
    - "Pour vérifier, je compare une réponse ou un essai à une donnée précise."
bilan: "Je peux expliquer ce que j’ai appris et montrer une réponse ou un essai comme preuve."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie cycle 4 : cette séance travaille une conclusion cite les données et précise la limite des essais.. Elle contribue progressivement aux compétences de fin de cycle."
    - type: lien
      titre: "Ministère — Programme de Technologie du cycle 4, BO 2024"
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
    - type: lien
      titre: "Éduscol — Technologie au cycle 4"
      url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
