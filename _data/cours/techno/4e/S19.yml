titre: 'Séance 19 : Que fait chaque constituant de l’éolienne ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Quels constituants de l’éolienne convertissent et transmettent l’énergie, et sous quelle forme ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - Sur l’éolienne du collège, le ventilateur (alimenté par l’alimentation ATX) crée le vent ; le rotor convertit l’énergie du vent en mouvement de rotation ; le moteur de lecteur CD, utilisé en génératrice, convertit ce mouvement en énergie électrique ; les fils la transmettent à la LED ou au multimètre.
    competences:
        - Identifier les constituants sur l’objet réel.
        - Indiquer l’énergie en entrée et en sortie de chaque constituant.
pourquoi:
    - En 5e, la chaîne d’énergie de l’éolienne t’était fournie sur des photos.
    - En 4e, c’est toi qui identifies les constituants sur la vraie maquette, et qui écris les énergies.
activites:
    -   id: a01
        titre: Identifier (poste maquette)
        contenu:
            -   type: paragraphe
                texte: '⚠️ L’alimentation ATX se branche sur le 230 V : seul le professeur la branche et la manipule. Tu peux seulement observer, et utiliser l’interrupteur du ventilateur si le professeur te le demande.'
            -   type: paragraphe
                texte: Chaque groupe passe au poste maquette ; les autres préparent la mission 2 avec les photos.
        questions:
            -   id: q01
                type: tableau
                enonce: Écris le nom des constituants que tu as identifiés, dans l’ordre où passe l’énergie.
                colonnes:
                    - Ordre
                    - Constituant
                lignes:
                    -   - '1'
                        - ''
                    -   - '2'
                        - ''
                    -   - '3'
                        - ''
                    -   - '4'
                        - ''
                aide: Source → constituant qui transforme → forme d’énergie en sortie.
    -   id: a02
        titre: Énergie en entrée, énergie en sortie
        transition: Tu as identifié les constituants. Précise maintenant les énergies.
        contenu:
            -   type: paragraphe
                texte: 'Exemple expliqué : le ventilateur reçoit de l’énergie électrique et fournit l’énergie de mouvement de l’air (le vent).'
        questions:
            -   id: q01
                type: tableau
                enonce: Complète les énergies.
                colonnes:
                    - Constituant
                    - Énergie en entrée
                    - Énergie en sortie
                lignes:
                    -   - Rotor
                        - ''
                        - ''
                    -   - Moteur de CD (génératrice)
                        - ''
                        - ''
                aide: Source → constituant qui transforme → forme d’énergie en sortie.
            -   id: q02
                type: qcm
                enonce: Quelle fonction de la chaîne d’énergie réalise la génératrice ?
                choix:
                    -   id: a
                        texte: Convertir.
                    -   id: b
                        texte: Transmettre.
                    -   id: c
                        texte: Stocker.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a03
        titre: Des pertes
        transition: Toute l’énergie du ventilateur n’arrive pas à la LED.
        contenu:
            -   type: paragraphe
                texte: Le ventilateur consomme environ 2 W ; la génératrice produit environ 0,1 W.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi l’éolienne produit-elle beaucoup moins d’énergie que n’en consomme le ventilateur ? Donne deux pertes.
                aide: Source → constituant qui transforme → forme d’énergie en sortie.
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le rendement compare l’énergie utile à l’énergie reçue.
        questions:
            -   id: q01
                type: texte
                enonce: Calcule le rendement de la maquette avec les valeurs de la mission 3.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as décrit toute la chaîne. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quels constituants convertissent et transmettent l’énergie, et sous quelle forme ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Rotor : énergie du vent → rotation ; génératrice : rotation → électricité ; fils : transmettre.'
    - À chaque conversion, une partie de l’énergie est perdue (frottements, chaleur).
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
