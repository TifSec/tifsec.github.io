titre: 'Séance 48 : Revue de projet : le tracker communique'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Notre tracker communicant répond-il au cahier des charges, et savons-nous le prouver ?
competences_bo:
    - Imaginer, concevoir et réaliser une ou des solutions en réponse à un besoin, à des exigences (de développement durable, par exemple) ou à la nécessité d’améliorations dans une démarche de créativité
    - Valider les solutions techniques par des simulations ou par des protocoles de tests
objectifs:
    connaissances:
        - Une revue de projet compare le résultat au cahier des charges, avec des preuves.
    competences:
        - Présenter un projet avec des preuves.
        - Évaluer avec une grille.
pourquoi:
    - C’est la fin du projet commencé en séance 41.
    - Chaque groupe présente en 4 minutes, avec démonstration si possible.
activites:
    -   id: a01
        titre: Préparer notre bilan
        consigne: 'Tu vas faire le bilan de ton groupe avant la revue de projet : comparer le tracker communicant au cahier des charges écrit en séance 41, avec les preuves des tests. On attend un critère réussi et un critère moins réussi, chacun avec une preuve.'
        contenu:
            -   type: tableau
                titre: Grille de la revue de projet
                colonnes:
                    - Critère
                    - Question
                lignes:
                    -   - Besoin
                        - Est-il clair ?
                    -   - Cahier des charges
                        - Les critères sont-ils vérifiés ?
                    -   - Preuves
                        - Y a-t-il des tests chiffrés ?
                    -   - Oral
                        - Parlent-ils sans lire ?
            -   type: etapes
                elements:
                    - Relis le cahier des charges de ton groupe (séance 41).
                    - 'Pour chaque critère, cherche la preuve : un test, une mesure (séances 45 et 46).'
                    - Repère le critère le mieux respecté et le moins bien respecté.
            -   type: paragraphe
                texte: 'Pourquoi des preuves ? Dire « ça marche » ne suffit pas : une revue de projet s’appuie sur des mesures.'
        questions:
            -   id: q01
                type: texte
                enonce: Quel critère du cahier des charges votre tracker communicant respecte-t-il le mieux ? Lequel moins bien ? Donne une preuve pour chacun.
                aide: Combien d’éléments sont demandés ?
    -   id: a02
        titre: Évaluer un autre groupe
        transition: Ton bilan est prêt. Écoute maintenant les autres groupes.
        consigne: Tu vas évaluer la présentation d’un autre groupe avec la grille de la revue de projet. On attend une évaluation des quatre critères et un conseil précis.
        contenu:
            -   type: etapes
                elements:
                    - Écoute la présentation d’un autre groupe.
                    - Pour chaque critère de la grille, note oui / en partie / non et un mot d’explication.
                    - Écris un conseil précis et bienveillant.
            -   type: paragraphe
                texte: Pourquoi évaluer les autres ? Tu apprends à repérer ce qui rend une présentation convaincante, et tu l’appliques ensuite à la tienne.
        questions:
            -   id: q01
                type: texte
                enonce: Évalue un autre groupe sur les quatre critères de la grille (oui / en partie / non + un mot) et donne-lui un conseil.
                aide: Combien d’éléments sont demandés ?
    -   id: a03
        titre: Une version 2
        transition: Les revues sont faites. Pense à la suite.
        consigne: Tu vas proposer une amélioration du tracker communicant pour une version 2, à partir des conseils reçus à la revue. On attend une amélioration, le critère qu’elle améliore et un test.
        contenu:
            -   type: etapes
                elements:
                    - Relis les conseils reçus par ton groupe.
                    - Choisis une amélioration réaliste du tracker communicant.
                    - Dis quel critère elle améliore et comment la tester.
            -   type: paragraphe
                texte: 'Pourquoi une version 2 ? Un projet ne s’arrête pas à la revue : les défauts trouvés deviennent les améliorations suivantes.'
        questions:
            -   id: q01
                type: texte
                enonce: 'Propose une amélioration pour une version 2 du tracker communicant : quel critère améliore-t-elle, et comment la testerais-tu ?'
                aide: Attendu ou observé ?
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Les grandes entreprises font des revues de projet à chaque étape.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi ne pas attendre la fin du projet pour faire le point ?
                aide: Pense à « car » (réflexe n° 4).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Les revues sont terminées. Fais le bilan.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : votre tracker répond-il au cahier des charges ? Qu’as-tu appris dans ce projet ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Revue de projet : comparer au cahier des charges avec des preuves ; proposer des améliorations.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
