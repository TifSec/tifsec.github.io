titre: 'Séance 48 : Revue de projet : le tracker communique'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Notre tracker communicant répond-il au cahier des charges, et savons-nous le prouver ?
competences_bo:
    - Imaginer, concevoir et réaliser une ou des solutions en réponse à un besoin, à des exigences (de développement durable, par exemple) ou à la nécessité d’améliorations dans une démarche de créativité
    - Valider les solutions techniques par des simulations ou par des protocoles de tests
objectifs:
    connaissances:
        - Une revue de projet compare le résultat au cahier des charges, avec des preuves.
    competences:
        - Présenter un projet avec des preuves.
        - Évaluer avec une grille.
pourquoi:
    - C’est la fin du projet commencé en séance 41.
    - Chaque groupe présente en 4 minutes, avec démonstration si possible.
activites:
    -   id: a01
        titre: Évaluer un autre groupe
        contenu:
            -   type: tableau
                colonnes:
                    - Critère
                    - Question
                lignes:
                    -   - Besoin
                        - Est-il clair ?
                    -   - Cahier des charges
                        - Les critères sont-ils vérifiés ?
                    -   - Preuves
                        - Y a-t-il des tests chiffrés ?
                    -   - Oral
                        - Parlent-ils sans lire ?
        questions:
            -   id: q01
                type: texte
                enonce: Évalue un groupe sur les quatre critères (oui / en partie / non + un mot) et donne un conseil.
                aide: Combien d’éléments sont demandés ?
    -   id: a02
        titre: Notre présentation
        transition: Tu as évalué. Fais maintenant le point sur ton groupe.
        questions:
            -   id: q01
                type: texte
                enonce: Quel critère du cahier des charges votre prototype respecte-t-il le mieux ? Lequel moins ? Avec quelles preuves ?
                aide: Repère le verbe de la question.
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une revue de projet se termine souvent par des améliorations.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle amélioration proposerais-tu pour une version 2 ?
                aide: Ton idée répond-elle au besoin ?
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Les revues sont terminées. Fais le bilan.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : votre tracker répond-il au cahier des charges ? Qu’as-tu appris dans ce projet ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Revue de projet : comparer au cahier des charges avec des preuves ; proposer des améliorations.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
