titre: 'Séance 7 : Bilan et entraînement au brevet n° 1 : le vélo électrique'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Suis-je capable d’analyser un objet sur un dossier de type brevet, et de relire mes réponses ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
    - Décrire les interactions entre un objet ou un système technique, son environnement et les utilisateurs
objectifs:
    connaissances:
        - 'Analyser un objet : besoin, évolution, chaîne d’information, chaîne d’énergie, environnement.'
    competences:
        - Utiliser les réflexes R1 à R10.
        - Relire sa réponse avant de la rendre (réflexe R16).
pourquoi:
    - Depuis la séance 3, tu as étudié des évolutions d’objets et les choix de conception du monte-charge.
    - Aujourd’hui, tu traites un petit dossier de type brevet sur le vélo à assistance électrique, mission par mission.
activites:
    -   id: a01
        titre: Lire le dossier et classer les constituants
        consigne: 'Tu vas t’entraîner au brevet sur un dossier : le vélo à assistance électrique (document 1). On attend le classement de ses constituants dans la chaîne d’information et une explication tirée du document.'
        contenu:
            -   type: titre
                texte: Document 1 — Le vélo à assistance électrique (VAE)
            -   type: citation
                texte: Un capteur de pédalage détecte que le cycliste pédale. Une carte électronique commande alors un moteur placé dans la roue. Une batterie de 36 V alimente le moteur. Un écran au guidon indique le niveau de batterie. Le moteur s’arrête dès que le cycliste arrête de pédaler ou dépasse 25 km/h.
            -   type: etapes
                elements:
                    - Lis tout le document 1 une première fois, sans répondre.
                    - Relis-le en repérant les constituants (capteur, carte, écran, moteur, batterie).
                    - Classe ceux de la chaîne d’information dans le tableau.
            -   type: paragraphe
                texte: Pourquoi lire tout le dossier d’abord ? Une information utile à la question 1 se trouve parfois plus loin dans le document.
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, classe chaque constituant dans la chaîne d’information.
                colonnes:
                    - Constituant
                    - Fonction
                lignes:
                    -   - Capteur de pédalage
                        - ''
                    -   - Carte électronique
                        - ''
                    -   - Écran
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
            -   id: q02
                type: qcm
                enonce: D’après le document 1, pourquoi le moteur s’arrête-t-il au-delà de 25 km/h ?
                choix:
                    -   id: a
                        texte: Pour la sécurité (c’est la règle pour un vélo).
                    -   id: b
                        texte: Pour faire joli.
                    -   id: c
                        texte: Parce que la batterie est vide.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a02
        titre: Expliquer l’évolution
        transition: Les constituants sont classés. Passons à l’évolution du vélo.
        consigne: Tu vas expliquer l’apparition du vélo électrique à partir de la frise du document 2. On attend le besoin, justifié avec « D’après le document 2 » et « car », puis un avantage et un inconvénient pour l’environnement.
        contenu:
            -   type: tableau
                titre: Document 2 — Évolution
                colonnes:
                    - Époque
                    - Vélo
                    - Besoin
                lignes:
                    -   - '1890'
                        - Vélo à pédales, freins à patins
                        - Se déplacer sans cheval
                    -   - '1990'
                        - VTT à vitesses
                        - Rouler en montagne
                    -   - '2010'
                        - Vélo à assistance électrique
                        - Aller au travail sans transpirer, monter les côtes
            -   type: etapes
                elements:
                    - Lis le document 2.
                    - Repère le besoin qui apparaît en 2010.
                    - Écris ta réponse avec « D’après le document 2… » et « car ».
            -   type: paragraphe
                texte: Pourquoi citer le document ? Au brevet, une réponse appuyée sur le document rapporte plus qu’une opinion (réflexes n° 2 et 4).
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 2, quel besoin explique l’apparition du VAE ? Justifie avec « car ».
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
            -   id: q02
                type: texte
                enonce: Donne un avantage et un inconvénient du VAE pour l’environnement par rapport à une voiture.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a03
        titre: Relire avant de rendre (R16)
        transition: Le dossier est traité. Applique maintenant le nouveau réflexe.
        consigne: Tu vas appliquer le réflexe brevet n° 16 (relire avant de rendre) à tes réponses des missions 1 et 2. On attend une réponse avec la bonne unité et la description d’une correction que tu as faite.
        contenu:
            -   type: citation
                texte: 'Réflexe brevet n° 16 : avant de rendre, je relis : ai-je répondu à la question ? ai-je mis l’unité ? ai-je justifié ?'
            -   type: etapes
                elements:
                    - Relis chacune de tes réponses.
                    - 'Vérifie trois choses : ai-je répondu à la question ? ai-je mis l’unité ? ai-je justifié ?'
                    - Corrige ce qui manque, puis réponds aux questions ci-dessous.
            -   type: paragraphe
                texte: Pourquoi relire ? Au brevet, des points se perdent sur des oublis (unité, justification) qu’une relecture aurait évités.
        questions:
            -   id: q01
                type: nombre
                enonce: La batterie est de 36 V. Écris la tension en volts (nombre seul).
                unite: V
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: texte
                enonce: Quelle réponse as-tu corrigée en te relisant ? Qu’as-tu changé ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le moteur du VAE est dans la roue.
        questions:
            -   id: q01
                type: texte
                enonce: Décris la chaîne d’énergie du VAE, de la batterie à la roue.
                aide: Source → constituant qui transforme → forme d’énergie en sortie.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as traité un dossier complet. Il reste à faire le point.
        questions:
            -   id: q01
                type: texte
                enonce: Quel réflexe t’a le plus aidé aujourd’hui ? Donne un exemple tiré de ton dossier.
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Réflexe R16 : relire ; question traitée ? unité ? justification ?'
    - 'Analyser un objet : besoin, chaînes, environnement.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
