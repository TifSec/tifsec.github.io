titre: 'Séance 7 : Bilan et entraînement au brevet n° 1'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Suis-je capable d’analyser l’évolution d’un objet et ses choix de conception sur un dossier de type brevet ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
    - Décrire les interactions entre un objet ou un système technique, son environnement et les utilisateurs
objectifs:
    connaissances:
        - 'Analyser un objet : besoin, évolution, choix de conception (sécurité, ergonomie, énergie).'
    competences:
        - Utiliser les réflexes R1 à R10.
        - Relire sa réponse avant de la rendre (réflexe R16).
pourquoi:
    - Depuis la séance 3, tu as étudié des évolutions d’objets et les choix de conception du monte-charge.
    - Aujourd’hui, tu fais un petit dossier de type brevet sur un vélo électrique.
activites:
    -   id: a01
        titre: 'Le dossier : le vélo à assistance électrique'
        contenu:
            -   type: citation
                texte: 'Réflexe brevet n° 16 : avant de passer à la suite, je relis : ai-je répondu à la question ? ai-je mis l’unité ? ai-je justifié ?'
            -   type: titre
                texte: Document 1 — Le vélo à assistance électrique (VAE)
            -   type: citation
                texte: Un capteur de pédalage détecte que le cycliste pédale. Une carte électronique commande alors un moteur placé dans la roue. Une batterie de 36 V alimente le moteur. Un écran au guidon indique le niveau de batterie. Le moteur s’arrête dès que le cycliste arrête de pédaler ou dépasse 25 km/h.
            -   type: titre
                texte: Document 2 — Évolution
            -   type: tableau
                colonnes:
                    - Époque
                    - Vélo
                    - Besoin
                lignes:
                    -   - '1890'
                        - Vélo à pédales, freins à patins
                        - Se déplacer sans cheval
                    -   - '1990'
                        - VTT à vitesses
                        - Rouler en montagne
                    -   - '2010'
                        - Vélo à assistance électrique
                        - Aller au travail sans transpirer, monter les côtes
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, classe chaque constituant dans la chaîne d’information.
                colonnes:
                    - Constituant
                    - Fonction
                lignes:
                    -   - Capteur de pédalage
                        - ''
                    -   - Carte électronique
                        - ''
                    -   - Écran
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
            -   id: q02
                type: qcm
                enonce: D’après le document 1, pourquoi le moteur s’arrête-t-il au-delà de 25 km/h ?
                choix:
                    -   id: a
                        texte: Pour la sécurité (c’est aussi la règle pour un vélo).
                    -   id: b
                        texte: Pour faire joli.
                    -   id: c
                        texte: Parce que la batterie est vide.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q03
                type: texte
                enonce: D’après le document 2, quel besoin explique l’apparition du VAE ? Justifie avec « car ».
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
            -   id: q04
                type: texte
                enonce: Donne un avantage et un inconvénient du VAE pour l’environnement par rapport à une voiture.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
            -   id: q05
                type: nombre
                enonce: La batterie est de 36 V. Quelle unité représente « V » ? Écris la tension en volts (nombre seul).
                unite: V
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a02
        titre: Je relis
        transition: Tu as fini le dossier. Applique maintenant le nouveau réflexe R16.
        contenu:
            -   type: paragraphe
                texte: Relis toutes tes réponses avec le réflexe R16.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle réponse as-tu corrigée en te relisant ? Qu’as-tu changé ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le moteur du VAE est dans la roue.
        questions:
            -   id: q01
                type: texte
                enonce: Décris la chaîne d’énergie du VAE (de la batterie à la roue).
                aide: Source → constituant qui transforme → forme d’énergie en sortie.
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as traité un dossier. Il reste à faire le point sur tes réflexes.
        questions:
            -   id: q01
                type: texte
                enonce: Quel réflexe t’a le plus aidé aujourd’hui ? Donne un exemple tiré de ton dossier.
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Réflexe R16 : relire ; question traitée ? unité ? justification ?'
    - 'Analyser un objet : besoin, chaîne d’information, chaîne d’énergie, environnement.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
