titre: Un robot aspirateur est-il vraiment écologique ?
theme: "Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et à analyser"
problematique: Un robot aspirateur est-il vraiment écologique ?
pourquoi: "Objectif de cette séance : Comprendre qu’un objet peut avoir des impacts environnementaux avant, pendant et après son utilisation."
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Comprendre qu’un objet peut avoir des impacts environnementaux avant, pendant et après son utilisation.
        - Identifier les principales étapes du cycle de vie d’un produit.
        - Comprendre que la consommation électrique n’est qu’une partie de l’impact environnemental.
        - Comprendre que la durée de vie, la réparation et la fin de vie influencent également cet impact.
    competences:
        - identifier les étapes du cycle de vie d’un objet ;
        - associer des impacts possibles à ces différentes étapes ;
        - utiliser des informations provenant de sources institutionnelles ou techniques ;
        - comparer plusieurs scénarios d’utilisation ;
        - proposer des améliorations en tenant compte de nouvelles contraintes.
activites:
    - id: a02
      titre: Compétence visée
      contenu:
          - type: paragraphe
            texte: Analyser les conséquences environnementales liées au cycle de vie d’un objet ou d’un système technique.
      questions: []
    - id: a04
      titre: Production attendue
      contenu:
          - type: paragraphe
            texte: Vous devez produire un document LibreOffice Writer contenant vos premières hypothèses, une représentation du cycle de vie, un tableau d’impacts, l’analyse de plusieurs scénarios et une conclusion argumentée.
      questions: []
    - id: a05
      titre: 1. Créer votre document de travail
      contenu:
          - type: paragraphe
            texte: "Créez dès maintenant un document LibreOffice Writer nommé :"
          - type: paragraphe
            texte: 4e_S7_nom.odt
          - type: paragraphe
            texte: Remplacez nom par votre nom.
          - type: paragraphe
            texte: "Indiquez :"
          - type: liste
            elements:
                - votre nom et votre prénom ;
                - la date ;
                - "le titre : Séance 7 : Un robot aspirateur est-il vraiment écologique ?"
          - type: paragraphe
            texte: Organisez vos réponses avec des titres courts, des tableaux et des informations reformulées.
          - type: paragraphe
            texte: Le fichier devra être rendu en fin d’heure, même s’il n’est pas terminé.
      questions: []
    - id: a06
      titre: 2. Moins d’électricité = plus écologique ?
      contenu:
          - type: paragraphe
            texte: Un constructeur affirme que son nouveau robot aspirateur est « plus écologique » parce qu’il consomme moins d’électricité pendant son utilisation.
          - type: paragraphe
            texte: "Sans effectuer de recherche, répondez :"
      questions:
          - id: q01
            type: texte
            enonce: Cette information suffit-elle pour comparer l’impact environnemental de deux robots ? Pourquoi ?
            suite: []
          - id: q02
            type: texte
            enonce: À quels autres moments de la vie du produit pourrait-il y avoir des impacts ?
            suite: []
          - id: q03
            type: texte
            enonce: Citez au moins quatre éléments qu’il faudrait connaître avant de conclure.
            suite:
                - type: titre
                  texte: Besoin d’un indice ?
          - id: q04
            type: texte
            enonce: D’où viennent les matières utilisées ?
          - id: q05
            type: texte
            enonce: Comment l’objet est-il fabriqué et transporté ?
          - id: q06
            type: texte
            enonce: Combien de temps est-il utilisé ?
          - id: q07
            type: texte
            enonce: Peut-il être réparé ?
          - id: q08
            type: texte
            enonce: Que devient-il lorsqu’il n’est plus utilisé ?
    - id: a07
      titre: 3. Le cycle de vie d’un objet
      contenu:
          - type: paragraphe
            texte: Le ministère de la Transition écologique rappelle que l’écoconception consiste à prendre en compte les impacts d’un produit sur l’ensemble de son cycle de vie.
          - type: paragraphe
            texte: "Consultez : Ministère de la Transition écologique – L’économie circulaire ."
          - type: lien
            titre: Ministère de la Transition écologique – L’économie circulaire
            url: https://www.ecologie.gouv.fr/politiques-publiques/leconomie-circulaire
          - type: paragraphe
            texte: "Dans votre document, représentez les grandes étapes suivantes sous forme de frise ou de schéma réalisé directement dans Writer :"
          - type: etapes
            elements:
                - extraction et production des matières premières ;
                - fabrication des composants ;
                - assemblage ;
                - transport et distribution ;
                - utilisation ;
                - entretien et réparation ;
                - fin d’usage et fin de vie.
          - type: paragraphe
            texte: Ajoutez au moins une flèche permettant de montrer qu’un produit ou certaines matières peuvent éventuellement être réemployés, réutilisés ou recyclés.
      questions: []
    - id: a08
      titre: 4. Quels impacts à chaque étape ?
      contenu:
          - type: paragraphe
            texte: Complétez le tableau suivant.
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Étape
                - Impact possible
                - Une piste pour le réduire
            lignes:
                - - Matières premières
                  - ""
                  - ""
                - - Fabrication
                  - ""
                  - ""
                - - Transport
                  - ""
                  - ""
                - - Utilisation
                  - ""
                  - ""
                - - Entretien / réparation
                  - ""
                  - ""
                - - Fin de vie
                  - ""
                  - ""
            suite:
                - type: paragraphe
                  texte: "Pour vous aider à raisonner sur l’ensemble du cycle de vie, utilisez : Ministère de la Transition écologique – Durée de vie des produits ."
                - type: lien
                  titre: Ministère de la Transition écologique – Durée de vie des produits
                  url: https://www.ecologie.gouv.fr/politiques-publiques/duree-vie-produits
                - type: paragraphe
                  texte: La ressource rappelle notamment que le modèle « extraire, produire, consommer, jeter » utilise des ressources, génère des émissions et produit des déchets.
    - id: a09
      titre: 5. Que devient un aspirateur en fin de vie ?
      contenu:
          - type: paragraphe
            texte: Un aspirateur est un équipement électrique et électronique. Lorsqu’il arrive en fin de vie, il ne doit donc pas simplement être considéré comme un déchet ordinaire.
          - type: paragraphe
            texte: "Consultez : ecosystem – Que deviennent les équipements électriques ? ."
          - type: lien
            titre: ecosystem – Que deviennent les équipements électriques ?
            url: https://www.ecosystem.eco/comprendre/recyclage-deee
          - type: paragraphe
            texte: "Relevez trois informations :"
      questions:
          - id: q01
            type: texte
            enonce: Que retire-t-on avant de recycler les matières ?
            suite: []
          - id: q02
            type: texte
            enonce: Quels types de matières peuvent être séparés et récupérés ?
            suite: []
          - id: q03
            type: texte
            enonce: Quel pourcentage moyen du poids des petits appareils électriques est indiqué comme recyclé ?
            suite:
                - type: paragraphe
                  texte: "Notez ensuite :"
                - type: paragraphe
                  texte: Recycler un appareil signifie-t-il que sa fabrication n’a plus eu d’impact ? Justifiez.
    - id: a10
      titre: 6. Réparer ou remplacer ?
      contenu:
          - type: paragraphe
            texte: Imaginons qu’après quelques années, la batterie d’un robot ne tienne plus suffisamment la charge.
          - type: paragraphe
            texte: "Deux solutions :"
          - type: liste
            elements:
                - "Solution A : remplacer le robot complet ;"
                - "Solution B : remplacer uniquement la batterie si cela est possible."
          - type: paragraphe
            texte: "Consultez : iFixit – Batteries de remplacement pour robots iRobot ."
          - type: lien
            titre: iFixit – Batteries de remplacement pour robots iRobot
            url: https://www.ifixit.com/fr-fr/Parts/iRobot/Batteries
          - type: paragraphe
            texte: Cette ressource montre que des batteries de remplacement existent pour plusieurs générations de robots.
          - type: paragraphe
            texte: "Répondez :"
      questions:
          - id: q01
            type: texte
            enonce: Quelle solution évite de remplacer le plus grand nombre de composants ?
            suite: []
          - id: q02
            type: texte
            enonce: Pourquoi cela peut-il prolonger la durée d’utilisation du robot ?
            suite: []
          - id: q03
            type: texte
            enonce: La réparation est-elle toujours possible ou toujours pertinente ? Expliquez.
            suite:
                - type: paragraphe
                  texte: "Vous pouvez également consulter : Ministère de la Transition écologique – Allonger la durée de vie des produits ."
                - type: lien
                  titre: Ministère de la Transition écologique – Allonger la durée de vie des produits
                  url: https://www.ecologie.gouv.fr/politiques-publiques/duree-vie-produits
                - type: paragraphe
                  texte: Le ministère présente l’entretien, la réparation et la seconde vie comme des moyens d’allonger la durée d’usage des produits.
    - id: a11
      titre: 7. Trois robots, trois durées d’utilisation
      contenu:
          - type: paragraphe
            texte: "Comparez ces trois situations fictives :"
          - type: liste
            elements:
                - "Robot A : utilisé 2 ans puis remplacé alors qu’il fonctionne encore ;"
                - "Robot B : utilisé 5 ans puis batterie remplacée ;"
                - "Robot C : utilisé 9 ans grâce à l’entretien et au remplacement de plusieurs pièces."
          - type: paragraphe
            texte: "Ces situations sont volontairement simplifiées pour l’activité : elles ne représentent pas des durées moyennes réelles."
          - type: paragraphe
            texte: "Répondez :"
      questions:
          - id: q01
            type: texte
            enonce: Quel scénario utilise le plus longtemps les ressources déjà utilisées pour fabriquer l’appareil ?
            suite: []
          - id: q02
            type: texte
            enonce: Quel scénario entraîne probablement la fabrication du plus grand nombre d’appareils sur neuf ans ?
            suite: []
          - id: q03
            type: texte
            enonce: Pourquoi la durée d’utilisation peut-elle modifier fortement le bilan d’un produit ?
            suite: []
          - id: q04
            type: texte
            enonce: Quelles informations supplémentaires faudrait-il connaître pour comparer précisément les trois situations ?
            suite:
                - type: paragraphe
                  texte: "Pour vérifier l’importance de cette question, consultez : Ministère de la Transition écologique – Durée de vie des produits ."
                - type: lien
                  titre: Ministère de la Transition écologique – Durée de vie des produits
                  url: https://www.ecologie.gouv.fr/politiques-publiques/duree-vie-produits
    - id: a12
      titre: 8. Peut-on concevoir autrement ?
      contenu:
          - type: paragraphe
            texte: Imaginez maintenant que vous participez à la conception d’une nouvelle génération de robot aspirateur.
          - type: paragraphe
            texte: "Choisissez deux améliorations parmi les pistes suivantes :"
          - type: liste
            elements:
                - batterie facilement remplaçable ;
                - pièces détachées disponibles ;
                - démontage simplifié ;
                - matières recyclées lorsque cela est adapté ;
                - réduction de la quantité de matière ;
                - emballage réduit ;
                - consommation électrique réduite ;
                - produit plus robuste.
          - type: paragraphe
            texte: "Pour chacune, indiquez :"
          - type: liste
            elements:
                - "Modification : ..."
                - "Étape du cycle de vie concernée : ..."
                - "Impact que l’on cherche à réduire : ..."
                - "Nouvelle contrainte possible : ..."
          - type: paragraphe
            texte: "Pour réfléchir à la réparabilité, vous pouvez consulter : Ministère de la Transition écologique – Indice de réparabilité ."
          - type: lien
            titre: Ministère de la Transition écologique – Indice de réparabilité
            url: https://www.ecologie.gouv.fr/politiques-publiques/indice-reparabilite
          - type: paragraphe
            texte: L’indice prend notamment en compte des éléments liés à la documentation, au démontage et à la disponibilité ou au prix des pièces détachées.
      questions: []
    - id: a13
      titre: 9. Mettons des mots sur ce que nous avons découvert
      contenu:
          - type: paragraphe
            texte: Le cycle de vie d’un objet comprend l’ensemble des étapes allant des matières premières jusqu’à sa fin d’usage et sa fin de vie.
          - type: paragraphe
            texte: "Des impacts environnementaux peuvent apparaître à plusieurs étapes :"
          - type: liste
            elements:
                - utilisation de ressources ;
                - consommation d’énergie ;
                - fabrication et transport ;
                - production de déchets ;
                - traitement en fin de vie.
          - type: paragraphe
            texte: "Réduire l’impact d’un produit peut donc passer par plusieurs actions :"
          - type: liste
            elements:
                - utiliser moins de ressources ;
                - réduire certaines consommations ;
                - augmenter sa durée d’utilisation ;
                - faciliter son entretien ou sa réparation ;
                - favoriser le réemploi ou la réutilisation lorsqu’ils sont possibles ;
                - recycler correctement les matières en fin de vie.
          - type: paragraphe
            texte: Une seule caractéristique, comme la consommation électrique, ne suffit donc généralement pas à décrire l’ensemble des impacts environnementaux d’un objet.
      questions: []
    - id: a14
      titre: 10. Conclusion
      contenu:
          - type: paragraphe
            texte: "Rédigez quelques phrases pour répondre à la problématique :"
          - type: paragraphe
            texte: Un robot aspirateur peut-il être considéré comme « écologique » uniquement parce qu’il consomme peu d’électricité ?
          - type: paragraphe
            texte: "Votre réponse doit :"
          - type: liste
            elements:
                - prendre en compte au moins trois étapes du cycle de vie ;
                - citer au moins un exemple lié à la durée d’utilisation ou à la réparation ;
                - expliquer pourquoi la réponse doit être nuancée.
      questions: []
    - id: a15
      titre: 11. Rendu de fin de séance
      contenu:
          - type: paragraphe
            texte: À la fin du cours, votre fichier doit être rendu, même s’il n’est pas terminé.
          - type: paragraphe
            texte: "Déposez :"
          - type: paragraphe
            texte: 4e_S7_nom.odt
          - type: paragraphe
            texte: "Avant de le rendre, vérifiez :"
          - type: liste
            elements:
                - votre nom, la date et le titre ;
                - votre représentation du cycle de vie ;
                - votre tableau des impacts ;
                - vos réponses sur la réparation et la durée d’utilisation ;
                - vos deux propositions d’amélioration ;
                - votre conclusion ;
                - que les informations provenant d’une source ont été reformulées.
      questions: []
    - id: a16
      titre: Références pédagogiques
      contenu:
          - type: liste
            elements:
                - Ministère de l’Éducation nationale – Programme de technologie du cycle 4, BO n°9 du 29 février 2024
                - Éduscol STI – Guide d’accompagnement du programme de technologie au cycle 4
          - type: lien
            titre: Ministère de l’Éducation nationale – Programme de technologie du cycle 4, BO n°9 du 29 février 2024
            url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
          - type: lien
            titre: Éduscol STI – Guide d’accompagnement du programme de technologie au cycle 4
            url: https://sti.eduscol.education.fr/textes/guide-daccompagnement-du-programme-de-technologie-en-cycle-4-mai-2024
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
introduction:
    - type: paragraphe
      texte: "Problématique : Peut-on juger l’impact environnemental d’un robot aspirateur uniquement à partir de sa consommation électrique ?"
    - type: titre
      texte: Objectifs d’apprentissage
    - type: paragraphe
      texte: "Ce que vous allez apprendre :"
    - type: liste
      elements:
          - Comprendre qu’un objet peut avoir des impacts environnementaux avant, pendant et après son utilisation.
          - Identifier les principales étapes du cycle de vie d’un produit.
          - Comprendre que la consommation électrique n’est qu’une partie de l’impact environnemental.
          - Comprendre que la durée de vie, la réparation et la fin de vie influencent également cet impact.
    - type: paragraphe
      texte: "Ce que vous allez apprendre à faire :"
    - type: liste
      elements:
          - identifier les étapes du cycle de vie d’un objet ;
          - associer des impacts possibles à ces différentes étapes ;
          - utiliser des informations provenant de sources institutionnelles ou techniques ;
          - comparer plusieurs scénarios d’utilisation ;
          - proposer des améliorations en tenant compte de nouvelles contraintes.
