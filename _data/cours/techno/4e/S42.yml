titre: 'Séance 42 : Comment deux cartes se parlent-elles ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment une carte micro:bit envoie-t-elle une donnée à une autre par radio ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
    - Imaginer, concevoir et réaliser une ou des solutions en réponse à un besoin, à des exigences (de développement durable, par exemple) ou à la nécessité d’améliorations dans une démarche de créativité
objectifs:
    connaissances:
        - Les deux cartes doivent être sur le même groupe radio (bloc « radio définir groupe »).
        - L’émetteur utilise « radio envoyer nombre » ou « radio envoyer valeur nom = nombre » ; le récepteur utilise « quand une donnée est reçue par radio ».
    competences:
        - Programmer un émetteur et un récepteur dans le simulateur.
        - Identifier les blocs radio.
pourquoi:
    - En séance 41, ton groupe a fixé la nouvelle fonction du tracker.
    - Aujourd’hui, tu découvres la radio dans le simulateur MakeCode, qui affiche deux cartes.
activites:
    -   id: a01
        titre: Un premier message
        consigne: 'Tu vas faire communiquer deux cartes micro:bit par radio dans le simulateur MakeCode : un appui sur A envoie le nombre 7 à l’autre carte. On attend un programme qui fonctionne et le rôle de chaque bloc radio.'
        contenu:
            -   type: etapes
                elements:
                    - Ouvre MakeCode micro:bit, nouveau projet 4e_S42_groupe.
                    - 'Au démarrage : « radio définir groupe » avec le numéro de ton groupe.'
                    - '« quand le bouton A est pressé » : « radio envoyer nombre 7 ».'
                    - '« quand une donnée est reçue par radio receivedNumber » : « montrer nombre receivedNumber ».'
                    - 'Le simulateur affiche une deuxième carte : appuie sur A sur la première.'
            -   type: paragraphe
                texte: Pourquoi le même programme sur les deux cartes ? Celle où on appuie sur A envoie 7 ; l’autre reçoit 7 et l’affiche. Chaque carte peut émettre et recevoir.
        questions:
            -   id: q01
                type: qcm
                enonce: Que se passe-t-il si les deux cartes micro:bit ne sont pas sur le même groupe radio ?
                choix:
                    -   id: a
                        texte: Le message n’est pas reçu.
                    -   id: b
                        texte: Il est reçu deux fois.
                    -   id: c
                        texte: La carte s’éteint.
                aide: Le groupe radio est comme un canal de talkie-walkie. Deux cartes sur des canaux différents s’entendent-elles ?
            -   id: q02
                type: tableau
                enonce: Associe chaque bloc radio de MakeCode à son rôle.
                colonnes:
                    - Bloc
                    - Rôle
                lignes:
                    -   - radio définir groupe
                        - ''
                    -   - radio envoyer nombre
                        - ''
                    -   - quand une donnée est reçue par radio
                        - ''
                aide: 'Pour chaque bloc, regarde son nom : l’un règle le canal, l’autre envoie, le dernier réagit à l’arrivée d’un message.'
        ressources:
            -   type: lien
                titre: MakeCode micro:bit (gratuit, dans le navigateur)
                url: https://makecode.microbit.org/
    -   id: a02
        titre: Envoyer une mesure
        transition: Un nombre fixe passe. Envoie maintenant une vraie mesure.
        consigne: 'Tu vas remplacer le nombre fixe par une vraie mesure : la lumière captée par la première carte, envoyée toutes les 2 secondes. C’est ce que fera le tracker. On attend la description de ce qu’affiche la carte réceptrice.'
        contenu:
            -   type: etapes
                elements:
                    - Remplace 7 par le bloc « niveau d’intensité lumineuse ».
                    - Mets l’envoi dans « toujours », suivi de « pause 2000 ms ».
                    - Dans le simulateur, change la lumière de la première carte (curseur) et observe la seconde.
            -   type: paragraphe
                texte: Pourquoi une pause de 2 s ? Envoyer sans arrêt encombre la radio ; toutes les 2 secondes suffit pour suivre la lumière.
        questions:
            -   id: q01
                type: texte
                enonce: Dans le simulateur, décris ce qui s’affiche sur la carte réceptrice quand tu changes la lumière de la carte émettrice.
                aide: 'Dans le simulateur, déplace le curseur de lumière de la carte émettrice et regarde l’écran de l’autre carte : que vois-tu changer ?'
        ressources:
            -   type: lien
                titre: MakeCode micro:bit (gratuit, dans le navigateur)
                url: https://makecode.microbit.org/
    -   id: a03
        titre: Envoyer deux mesures
        transition: Une mesure passe. Le tracker en enverra deux.
        consigne: 'Tu vas envoyer deux mesures différentes (lumière et température) d’une carte à l’autre, avec des valeurs nommées. Le tracker enverra lui aussi deux mesures : la lumière et l’angle. On attend l’explication du rôle du nom et l’algorithme du récepteur.'
        contenu:
            -   type: etapes
                elements:
                    - Remplace « radio envoyer nombre » par « radio envoyer valeur « lum » = niveau d’intensité lumineuse ».
                    - Ajoute « radio envoyer valeur « temp » = température ».
                    - Sur le récepteur, utilise « quand une donnée est reçue par radio name, value » et « si name = « lum » alors montrer value ».
            -   type: paragraphe
                texte: 'Pourquoi un nom ? Quand deux mesures arrivent, le récepteur doit savoir laquelle il reçoit : le nom sert d’étiquette.'
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi faut-il envoyer un nom avec le nombre quand la carte émettrice transmet deux mesures (lumière et température) ?
                aide: 'La carte réceptrice reçoit deux nombres l’un après l’autre : sans nom, comment saurait-elle lequel est la lumière et lequel est la température ?'
            -   id: q02
                type: texte
                enonce: Écris en langage naturel ce que fait le récepteur quand il reçoit une valeur nommée.
                aide: Écris QUAND une valeur est reçue, puis un SI par nom possible, avec ce que la carte affiche dans chaque cas.
        ressources:
            -   type: lien
                titre: MakeCode micro:bit (gratuit, dans le navigateur)
                url: https://makecode.microbit.org/
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Plusieurs groupes émettent en même temps dans la salle.
        questions:
            -   id: q01
                type: texte
                enonce: Que se passerait-il si deux groupes choisissaient le même numéro de groupe radio ?
                aide: 'Deux groupes sur le même canal : les messages de l’un arrivent-ils chez l’autre ? Qu’affichera alors chaque récepteur ?'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Les deux cartes se parlent. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment une carte micro:bit envoie-t-elle une donnée à une autre par radio ?'
                aide: 'Cite les trois éléments vus aujourd’hui : le groupe commun, l’envoi par l’émetteur, la réaction du récepteur.'
retenir:
    - 'Radio micro:bit : même groupe ; envoyer (nombre, valeur nommée) ; « quand une donnée est reçue ».'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
