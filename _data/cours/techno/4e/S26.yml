titre: 'Séance 26 : Prendre en main la CAO'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment créer une pièce aux bonnes dimensions avec un logiciel de CAO ?
competences_bo:
    - Imaginer, concevoir et réaliser une ou des solutions en réponse à un besoin, à des exigences (de développement durable, par exemple) ou à la nécessité d’améliorations dans une démarche de créativité
objectifs:
    connaissances:
        - La CAO (conception assistée par ordinateur) crée un modèle 3D d’une pièce avant de la fabriquer.
        - 'Dans Tinkercad : on place des formes, on règle leurs cotes en millimètres, on les regroupe, on fait des trous avec des formes « perçage ».'
    competences:
        - Placer et coter des formes.
        - Regrouper des formes et faire un perçage.
pourquoi:
    - En séance 25, tu as vu comment les pièces sont fabriquées.
    - Avant de fabriquer, on dessine. Aujourd’hui, tu découvres la CAO avec Tinkercad.
activites:
    -   id: a01
        titre: Placer et coter
        contenu:
            -   type: etapes
                elements:
                    - Connecte-toi à Tinkercad avec le code de classe du professeur.
                    - Crée une nouvelle conception 3D, nommée 4e_S26_tonprenom.
                    - 'Place un cube et règle ses cotes : 40 × 20 × 5 mm.'
                    - Place un cylindre de 10 mm de diamètre et 5 mm de haut au centre du pavé.
        questions:
            -   id: q01
                type: nombre
                enonce: Quel est le volume du pavé de 40 × 20 × 5 mm ?
                unite: mm³
                aide: N’oublie pas l’unité (réflexe n° 5).
            -   id: q02
                type: qcm
                enonce: En quelle unité Tinkercad affiche-t-il les cotes par défaut ?
                choix:
                    -   id: a
                        texte: En millimètres.
                    -   id: b
                        texte: En mètres.
                    -   id: c
                        texte: En pouces.
                aide: Relis l’exemple expliqué.
        ressources:
            - &id001
                type: lien
                titre: Tinkercad — conception 3D (connexion avec le code de classe du professeur)
                url: https://www.tinkercad.com/
    -   id: a02
        titre: Percer et regrouper
        transition: Tu sais placer des formes. Fais maintenant un trou.
        contenu:
            -   type: etapes
                elements:
                    - Transforme le cylindre en « perçage » (forme transparente).
                    - Sélectionne le pavé et le cylindre, puis clique sur « Regrouper ».
                    - Tu obtiens une plaque percée d’un trou de 10 mm.
        questions:
            -   id: q01
                type: texte
                enonce: Explique en une phrase ce que fait une forme « perçage » quand on la regroupe avec une forme pleine.
                aide: Pense à « car » (réflexe n° 4).
            -   id: q02
                type: texte
                enonce: Décris les trois étapes pour obtenir ta plaque percée.
                aide: Combien d’éléments sont demandés ?
        ressources:
            - *id001
    -   id: a03
        titre: Un support de capteur
        transition: Tu sais percer. Dessine une vraie pièce utile.
        contenu:
            -   type: paragraphe
                texte: Le capteur à ultrasons du monte-charge a deux « yeux » de 16 mm de diamètre, distants de 26 mm (centre à centre).
        questions:
            -   id: q01
                type: texte
                enonce: Modélise une plaque de 50 × 25 × 3 mm percée de deux trous pour ces deux yeux. Note les positions et diamètres que tu as utilisés.
                aide: Repère le verbe de la question.
        ressources:
            - *id001
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un trou exactement de la taille de la pièce est souvent trop serré une fois imprimé.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi prévoit-on un « jeu » (un trou un peu plus grand) ?
                aide: Pense à « car » (réflexe n° 4).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as pris en main la CAO. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment créer une pièce aux bonnes dimensions avec un logiciel de CAO ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'CAO : placer des formes, régler les cotes (mm), percer, regrouper.'
    - Prévoir du jeu pour les pièces qui s’emboîtent.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
