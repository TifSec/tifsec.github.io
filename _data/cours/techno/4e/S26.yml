titre: 'Séance 26 : Prendre en main la CAO'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment créer une pièce aux bonnes dimensions avec un logiciel de CAO ?
competences_bo:
    - Imaginer, concevoir et réaliser une ou des solutions en réponse à un besoin, à des exigences (de développement durable, par exemple) ou à la nécessité d’améliorations dans une démarche de créativité
objectifs:
    connaissances:
        - La CAO (conception assistée par ordinateur) crée un modèle 3D d’une pièce avant de la fabriquer.
        - 'Dans Tinkercad : placer des formes, régler leurs cotes en mm, regrouper, percer avec des formes « perçage ».'
    competences:
        - Placer et coter des formes.
        - Regrouper et percer.
pourquoi:
    - En séance 25, tu as vu comment les pièces sont fabriquées.
    - Avant de fabriquer, on dessine. Aujourd’hui, tu découvres la CAO avec Tinkercad.
activites:
    -   id: a01
        titre: Placer et coter
        consigne: Tu vas découvrir le logiciel de CAO Tinkercad en dessinant un pavé de 40 × 20 × 5 mm et un cylindre, en suivant les étapes. On attend une pièce aux bonnes cotes et le calcul de son volume.
        contenu:
            -   type: etapes
                elements:
                    - Connecte-toi à Tinkercad avec le code de classe.
                    - Crée une conception nommée 4e_S26_tonprenom.
                    - 'Place un cube et règle ses cotes : 40 × 20 × 5 mm (clique sur les petits carrés blancs).'
                    - Place un cylindre de 10 mm de diamètre et 5 mm de haut au centre.
            -   type: paragraphe
                texte: 'Pourquoi des cotes précises ? La pièce imprimée aura exactement ces dimensions : une erreur de cote, et la pièce ne s’emboîte pas.'
        questions:
            -   id: q01
                type: nombre
                enonce: Quel est le volume du pavé de 40 × 20 × 5 mm ?
                unite: mm³
                aide: N’oublie pas l’unité (réflexe n° 5).
            -   id: q02
                type: qcm
                enonce: En quelle unité Tinkercad affiche-t-il les cotes ?
                choix:
                    -   id: a
                        texte: En millimètres.
                    -   id: b
                        texte: En mètres.
                    -   id: c
                        texte: En pouces.
                aide: Relis l’exemple expliqué.
        ressources:
            - &id001
                type: lien
                titre: Tinkercad — conception 3D (connexion avec le code de classe du professeur)
                url: https://www.tinkercad.com/
    -   id: a02
        titre: Percer et regrouper
        transition: Tu sais placer des formes. Fais maintenant un trou.
        consigne: Tu vas percer ta pièce Tinkercad avec une forme « perçage » et la regrouper. On attend une plaque percée et l’explication de la méthode en trois étapes.
        contenu:
            -   type: etapes
                elements:
                    - Sélectionne le cylindre et choisis « Perçage » (il devient transparent).
                    - Sélectionne le pavé et le cylindre.
                    - 'Clique sur « Regrouper » : tu obtiens une plaque percée.'
            -   type: paragraphe
                texte: 'Pourquoi un « perçage » ? Une forme perçage enlève de la matière : c’est comme ça qu’on fait des trous en CAO.'
        questions:
            -   id: q01
                type: texte
                enonce: Explique ce que fait une forme « perçage » quand on la regroupe avec une forme pleine.
                aide: Pense à « car » (réflexe n° 4).
            -   id: q02
                type: texte
                enonce: Décris les trois étapes pour obtenir ta plaque percée.
                aide: Combien d’éléments sont demandés ?
        ressources:
            - *id001
    -   id: a03
        titre: Un support de capteur
        transition: Tu sais percer. Dessine une vraie pièce utile.
        consigne: 'Tu vas dessiner seul dans Tinkercad une vraie pièce : un support pour le capteur à ultrasons du monte-charge, à partir des mesures données. On attend une plaque percée aux bonnes cotes, avec du jeu.'
        contenu:
            -   type: etapes
                elements:
                    - 'Mesure de référence : le capteur à ultrasons a deux « yeux » de 16 mm, à 26 mm de centre à centre.'
                    - Crée une plaque de 50 × 25 × 3 mm.
                    - Ajoute deux perçages de 17 mm (1 mm de jeu), centres à 26 mm.
                    - Regroupe.
            -   type: paragraphe
                texte: 'Pourquoi 17 mm et pas 16 ? L’impression n’est pas parfaite : un peu de « jeu » permet à la pièce d’entrer.'
        questions:
            -   id: q01
                type: texte
                enonce: Note les cotes que tu as utilisées (plaque, diamètres, entraxe).
                aide: Repère le verbe de la question.
        ressources:
            - *id001
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: On peut aligner les formes avec l’outil « Aligner ».
        questions:
            -   id: q01
                type: texte
                enonce: Centre parfaitement les deux trous sur la plaque. Quel outil as-tu utilisé ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as pris en main la CAO. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment créer une pièce aux bonnes dimensions avec la CAO ? Cite les étapes dans l’ordre.'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'CAO : formes, cotes (mm), perçage, regrouper.'
    - Prévoir du jeu pour les pièces qui s’emboîtent.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
