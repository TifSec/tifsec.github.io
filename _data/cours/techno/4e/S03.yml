titre: 'Séance 3 : Du téléphone fixe au smartphone : qu’a-t-on gagné, qu’a-t-on perdu ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Qu’apporte une évolution technologique, et quels inconvénients peut-elle avoir ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
objectifs:
    connaissances:
        - Une évolution technologique apporte des avantages (nouvelles fonctions, mobilité) mais aussi des inconvénients (dépendance, énergie, données personnelles, déchets).
        - 'Le smartphone rassemble de nombreux objets en un seul : téléphone, appareil photo, GPS, lecteur de musique, ordinateur.'
    competences:
        - Lire une frise chronologique.
        - Identifier les avantages et les inconvénients d’une évolution.
pourquoi:
    - En 5e, tu as vu comment la lampe a évolué.
    - 'Aujourd’hui, tu étudies une évolution que tu utilises tous les jours : celle du téléphone.'
activites:
    -   id: a01
        titre: Lire la frise du téléphone
        consigne: Tu vas étudier l’évolution du téléphone à partir de la frise du document 1 (du téléphone de Bell au smartphone). On attend des réponses qui citent les dates du document.
        contenu:
            -   type: tableau
                titre: Document 1 — Quelques étapes (dates arrondies)
                colonnes:
                    - Date
                    - Objet
                    - Ce qui change
                lignes:
                    -   - '1876'
                        - Téléphone de Bell
                        - On transmet la voix par un fil.
                    -   - '1980'
                        - Téléphone fixe à touches
                        - Composer plus vite, répondeur.
                    -   - '1992'
                        - Premier mobile grand public (GSM)
                        - On téléphone sans fil, partout.
                    -   - '2007'
                        - Smartphone à écran tactile
                        - Internet, applications, photo, GPS dans la poche.
            -   type: etapes
                elements:
                    - Lis le document 1 de haut en bas.
                    - Pour chaque date, repère ce qui change pour l’utilisateur.
                    - Réponds aux questions en citant la date.
            -   type: paragraphe
                texte: Pourquoi une frise ? Elle montre l’ordre des évolutions et aide à comprendre ce que chaque étape a apporté de nouveau.
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 1, quelle évolution a permis de téléphoner hors de chez soi ?
                choix:
                    -   id: a
                        texte: Le téléphone mobile (1992).
                    -   id: b
                        texte: Le téléphone à touches (1980).
                    -   id: c
                        texte: Le téléphone de Bell.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: nombre
                enonce: D’après le document 1, combien d’années séparent le téléphone de Bell du smartphone ?
                unite: ans
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a02
        titre: Peser le pour et le contre
        transition: Le téléphone a beaucoup évolué. Ces progrès ont-ils seulement des avantages ?
        consigne: Tu vas peser les avantages et les inconvénients du smartphone à partir des chiffres du document 2. On attend deux avantages et deux inconvénients tirés des documents.
        contenu:
            -   type: titre
                texte: Document 2 — Ce que disent des études (chiffres arrondis)
            -   type: liste
                elements:
                    - Un smartphone contient une cinquantaine de métaux différents, dont certains sont rares.
                    - La fabrication représente l’essentiel de son impact sur l’environnement.
                    - On le change en moyenne tous les 2 à 3 ans en France.
                    - Il permet d’appeler les secours de partout et de se repérer avec le GPS.
            -   type: etapes
                elements:
                    - Lis le document 2.
                    - Surligne mentalement ce qui est positif pour l’utilisateur ou la société.
                    - Puis ce qui pose problème (environnement, santé, vie privée).
                    - 'Remplis le tableau : deux lignes de chaque côté.'
            -   type: paragraphe
                texte: 'Pourquoi chercher aussi les inconvénients ? Juger une évolution, c’est la regarder en entier : au brevet, on attend les deux côtés.'
        questions:
            -   id: q01
                type: tableau
                enonce: D’après les documents, donne deux avantages et deux inconvénients du smartphone.
                colonnes:
                    - Avantages
                    - Inconvénients
                lignes:
                    -   - ''
                        - ''
                    -   - ''
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
    -   id: a03
        titre: Agir sur l’impact
        transition: Tu connais les inconvénients. Que peut-on faire, à notre échelle ?
        consigne: Tu vas expliquer comment un utilisateur peut réduire l’impact de son smartphone, à partir de la deuxième ligne du document 2. On attend une explication avec « car » et un fait du document.
        contenu:
            -   type: etapes
                elements:
                    - Relis la deuxième ligne du document 2.
                    - 'Fais le lien : si on fabrique moins de téléphones, que se passe-t-il ?'
                    - Écris ta réponse avec « car » suivi d’un fait du document.
            -   type: paragraphe
                texte: 'Pourquoi « car » ? Justifier avec un fait du document est un réflexe du brevet (réflexe n° 4) : il montre que ta réponse n’est pas une opinion.'
        questions:
            -   id: q01
                type: texte
                enonce: Explique pourquoi garder son smartphone plus longtemps réduit son impact sur l’environnement. Utilise « car ».
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Je m’entraîne
        transition: Tu as compris la méthode. Applique-la seul sur un cas nouveau.
        consigne: 'Tu vas appliquer seul la méthode sur un cas nouveau : le GPS de voiture décrit ci-dessous. On attend un avantage et un inconvénient, chacun justifié avec « car ».'
        contenu:
            -   type: citation
                texte: Avant, on préparait son trajet avec une carte routière en papier. Aujourd’hui, le GPS du téléphone calcule l’itinéraire, signale les bouchons et enregistre parfois les trajets.
            -   type: etapes
                elements:
                    - Lis le document sur le GPS de voiture.
                    - Repère un avantage et un inconvénient.
                    - Justifie chacun avec « car ».
            -   type: paragraphe
                texte: Pourquoi un autre objet ? La méthode « avantages / inconvénients » sert pour toute évolution au brevet.
        questions:
            -   id: q01
                type: texte
                enonce: Donne un avantage et un inconvénient du GPS pour les conducteurs. Justifie avec « car ».
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a05
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le téléphone fixe existe encore.
        questions:
            -   id: q01
                type: texte
                enonce: Cite une situation où un téléphone fixe reste plus utile qu’un smartphone.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a06
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as pesé le pour et le contre. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : qu’apporte l’évolution du téléphone, et quels inconvénients a-t-elle ? Donne au moins deux avantages et deux inconvénients.'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Une évolution technologique a des avantages et des inconvénients : il faut les peser.'
    - 'L’essentiel de l’impact d’un smartphone vient de sa fabrication : le garder longtemps le réduit.'
sources:
