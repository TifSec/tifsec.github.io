titre: 'Séance 3 : Du téléphone fixe au smartphone : qu’a-t-on gagné, qu’a-t-on perdu ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Qu’apporte une évolution technologique, et quels inconvénients peut-elle avoir ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
objectifs:
    connaissances:
        - Une évolution technologique apporte des avantages (nouvelles fonctions, mobilité) mais aussi des inconvénients (dépendance, énergie, données personnelles, déchets).
        - 'Le smartphone rassemble de nombreux objets en un seul : téléphone, appareil photo, GPS, lecteur de musique, ordinateur.'
    competences:
        - Identifier les avantages et les inconvénients d’une évolution.
        - Argumenter avec des faits tirés d’un document.
pourquoi:
    - En 5e, tu as vu comment la lampe a évolué.
    - 'Aujourd’hui, tu étudies une évolution plus récente, que tu utilises tous les jours : celle du téléphone.'
activites:
    -   id: a01
        titre: Une frise du téléphone
        contenu:
            -   type: tableau
                titre: Document 1 — Quelques étapes (dates arrondies)
                colonnes:
                    - Date
                    - Objet
                    - Ce qui change
                lignes:
                    -   - '1876'
                        - Téléphone de Bell
                        - On transmet la voix par un fil.
                    -   - '1980'
                        - Téléphone fixe à touches
                        - Composer plus vite, répondeur.
                    -   - '1992'
                        - Premier téléphone mobile grand public (GSM)
                        - On téléphone sans fil, partout.
                    -   - '2007'
                        - Smartphone à écran tactile
                        - Internet, applications, photo, GPS dans la poche.
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 1, quelle évolution a permis de téléphoner hors de chez soi ?
                choix:
                    -   id: a
                        texte: Le téléphone mobile (1992).
                    -   id: b
                        texte: Le téléphone à touches (1980).
                    -   id: c
                        texte: Le téléphone de Bell.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: nombre
                enonce: D’après le document 1, combien d’années séparent le téléphone de Bell du smartphone ?
                unite: ans
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a02
        titre: Gagné ou perdu ?
        transition: Le téléphone a beaucoup évolué. Ces progrès ont-ils seulement des avantages ?
        contenu:
            -   type: titre
                texte: Document 2 — Ce que disent des études (chiffres arrondis)
            -   type: liste
                elements:
                    - Un smartphone contient une cinquantaine de métaux différents, dont certains sont rares.
                    - La fabrication représente l’essentiel de son impact sur l’environnement.
                    - On le change en moyenne tous les 2 à 3 ans en France.
                    - Il permet d’appeler les secours de partout et de se repérer avec le GPS.
        questions:
            -   id: q01
                type: tableau
                enonce: D’après les documents, donne deux avantages et deux inconvénients du smartphone.
                colonnes:
                    - Avantages
                    - Inconvénients
                lignes:
                    -   - ''
                        - ''
                    -   - ''
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
            -   id: q02
                type: texte
                enonce: Explique pourquoi garder son smartphone plus longtemps réduit son impact sur l’environnement. Utilise « car ».
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le téléphone fixe existe encore.
        questions:
            -   id: q01
                type: texte
                enonce: Cite une situation où un téléphone fixe reste plus utile qu’un smartphone.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as pesé le pour et le contre. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : qu’apporte l’évolution du téléphone, et quels inconvénients a-t-elle ? Appuie-toi sur les documents.'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Une évolution technologique a des avantages et des inconvénients : il faut les peser.'
    - 'L’essentiel de l’impact d’un smartphone vient de sa fabrication : le garder longtemps le réduit.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
