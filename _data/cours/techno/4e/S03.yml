titre: Un robot aspirateur convient-il à tout le monde ?
theme: "Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et à analyser"
problematique: Un robot aspirateur convient-il à tout le monde ?
pourquoi: "Objectif de cette séance : Comprendre qu’un même besoin peut conduire à plusieurs solutions techniques."
application: Pour chaque utilisateur, cherchez d’abord ce qui est important, puis ce qui peut compliquer le choix.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Comprendre qu’un même besoin peut conduire à plusieurs solutions techniques.
        - Comprendre qu’une solution peut être adaptée à une situation et moins adaptée à une autre.
        - Comprendre que les contraintes influencent le choix d’une solution technique.
    competences:
        - analyser une situation d’utilisation ;
        - identifier un besoin et des contraintes ;
        - formuler une première hypothèse ;
        - vérifier une information dans une documentation technique ;
        - choisir une solution et justifier ce choix.
activites:
    - id: a02
      titre: Compétence visée
      contenu:
          - type: paragraphe
            texte: Identifier les besoins des utilisateurs et les contraintes liées à l’usage d’un objet ou d’un système technique.
      questions: []
    - id: a04
      titre: Production attendue
      contenu:
          - type: paragraphe
            texte: Vous devez produire un document LibreOffice Writer contenant vos premières hypothèses, un tableau d’analyse des quatre situations, une vérification documentaire, deux choix argumentés et une courte conclusion.
      questions: []
    - id: a05
      titre: 1. Créer votre document de travail
      contenu:
          - type: paragraphe
            texte: "Créez dès maintenant un document LibreOffice Writer nommé :"
          - type: paragraphe
            texte: 4e_S3_nom.odt
          - type: paragraphe
            texte: Remplacez nom par votre nom.
          - type: paragraphe
            texte: "Indiquez dans votre document :"
          - type: liste
            elements:
                - votre nom et votre prénom ;
                - la date ;
                - "le titre : Séance 3 : Un robot aspirateur convient-il à tout le monde ?"
          - type: paragraphe
            texte: Utilisez ce document pendant toute la séance pour conserver vos premières idées, vos réponses, les informations vérifiées et les corrections apportées à votre raisonnement.
          - type: paragraphe
            texte: Le fichier devra être rendu en fin d’heure, même s’il n’est pas terminé.
      questions: []
    - id: a06
      titre: 2. Tout le monde a-t-il besoin du même aspirateur ?
      contenu:
          - type: paragraphe
            texte: Lors de la séance précédente, vous avez vu que plusieurs objets peuvent répondre au même besoin.
          - type: paragraphe
            texte: Mais deux personnes qui veulent toutes les deux nettoyer leur logement ont-elles forcément intérêt à choisir la même solution ?
          - type: paragraphe
            texte: "Sans rechercher sur Internet, répondez :"
      questions:
          - id: q01
            type: texte
            enonce: Dans quelle situation un robot aspirateur vous semble-t-il particulièrement utile ?
            suite: []
          - id: q02
            type: texte
            enonce: Dans quelle situation pourrait-il être peu pratique ?
            suite: []
          - id: q03
            type: texte
            enonce: Citez au moins quatre éléments qui pourraient influencer le choix d’un aspirateur.
            suite:
                - type: paragraphe
                  texte: Expliquez rapidement chacune de vos propositions.
                - type: titre
                  texte: Besoin d’un indice ?
                - type: liste
                  elements:
                      - Pensez au logement.
                      - Pensez aux personnes qui l’utilisent.
                      - Pensez aux sols et aux obstacles.
                      - Pensez au temps disponible et au budget.
    - id: a07
      titre: 3. Quatre utilisateurs, quatre situations
      contenu:
          - type: titre
            texte: "Situation A : Louise"
          - type: liste
            elements:
                - 78 ans ;
                - appartement de 65 m² ;
                - peu de meubles au sol ;
                - un chat qui perd beaucoup de poils ;
                - difficultés à se baisser régulièrement ;
                - budget limité.
          - type: titre
            texte: "Situation B : la famille Martin"
          - type: liste
            elements:
                - deux adultes et trois enfants ;
                - maison de 140 m² sur deux étages ;
                - plusieurs tapis ;
                - des jouets sont régulièrement laissés au sol ;
                - un chien ;
                - peu de temps disponible pour le ménage.
          - type: titre
            texte: "Situation C : Yanis"
          - type: liste
            elements:
                - vit seul dans un studio de 28 m² ;
                - peu de meubles ;
                - principalement du carrelage ;
                - absent une grande partie de la journée ;
                - souhaite dépenser le moins possible.
          - type: titre
            texte: "Situation D : Camille"
          - type: liste
            elements:
                - vit dans une maison ancienne ;
                - plusieurs petites pièces ;
                - des seuils de porte assez hauts ;
                - plusieurs escaliers ;
                - parquet, carrelage et tapis ;
                - souhaite automatiser au maximum le nettoyage.
      questions: []
    - id: a08
      titre: 4. Décomposer chaque situation
      contenu:
          - type: paragraphe
            texte: Pour chaque utilisateur, cherchez d’abord ce qui est important, puis ce qui peut compliquer le choix.
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Utilisateur
                - Ce qu’il cherche
                - Ce qui peut compliquer la situation
                - Robot adapté ?
                - Pourquoi ?
            lignes:
                - - Louise
                  - ""
                  - ""
                  - ""
                  - ""
                - - Famille Martin
                  - ""
                  - ""
                  - ""
                  - ""
                - - Yanis
                  - ""
                  - ""
                  - ""
                  - ""
                - - Camille
                  - ""
                  - ""
                  - ""
                  - ""
            suite:
                - type: paragraphe
                  texte: Ne répondez pas uniquement par « oui » ou « non ». Utilisez au moins deux informations de la situation pour justifier votre réponse.
                - type: titre
                  texte: Besoin d’aide pour décomposer la situation ?
                - type: paragraphe
                  texte: "Commencez par deux questions :"
          - id: q02
            type: texte
            enonce: Qu’est-ce que cette personne cherche surtout à obtenir ?
            suite: []
          - id: q03
            type: texte
            enonce: Qu’est-ce qui risque d’empêcher ou de limiter cette solution ?
            suite: []
    - id: a09
      titre: 5. Certaines de nos suppositions sont-elles vraies ?
      contenu:
          - type: paragraphe
            texte: Dans votre tableau, vous avez peut-être considéré qu’un escalier, un tapis ou des objets au sol pouvaient poser problème.
          - type: paragraphe
            texte: Il faut maintenant distinguer ce que nous supposons de ce que nous avons vérifié.
          - type: paragraphe
            texte: "Choisissez deux questions :"
      questions:
          - id: q01
            type: texte
            enonce: Un robot peut-il détecter un escalier ?
          - id: q02
            type: texte
            enonce: Peut-il éviter des objets laissés au sol ?
          - id: q03
            type: texte
            enonce: Peut-il fonctionner sur un tapis ?
          - id: q04
            type: texte
            enonce: L’utilisateur doit-il quand même préparer le logement avant le nettoyage ?
          - id: q05
            type: texte
            enonce: La base du robot peut-elle être placée n’importe où ?
            suite:
                - type: titre
                  texte: Escaliers, tapis et navigation
                - type: paragraphe
                  texte: Consultez iRobot – Guide des robots Roomba . Le constructeur y présente notamment différentes fonctions de navigation, la détection des escaliers et le fonctionnement sur différents types de sols.
                - type: lien
                  titre: iRobot – Guide des robots Roomba
                  url: https://www.irobot.fr/fr_FR/buyersguide.html
                - type: titre
                  texte: Objets laissés au sol
                - type: paragraphe
                  texte: Consultez iRobot – Navigation PrecisionVision et détection des obstacles . Certains modèles peuvent reconnaître plusieurs catégories d’obstacles, mais ces capacités dépendent du modèle.
                - type: lien
                  titre: iRobot – Navigation PrecisionVision et détection des obstacles
                  url: https://assistance.irobot.fr/articles/fr/Knowledge/31161
                - type: titre
                  texte: Préparer le logement
                - type: paragraphe
                  texte: Consultez iRobot – Préparer le logement pour la navigation et la cartographie . Le constructeur recommande notamment de retirer certains vêtements, câbles ou objets susceptibles de gêner le robot. :chatgpt-content-reference{index="1"}
                - type: lien
                  titre: iRobot – Préparer le logement pour la navigation et la cartographie
                  url: https://assistance.irobot.fr/articles/fr/Knowledge/20500
                - type: titre
                  texte: Installer la base
                - type: paragraphe
                  texte: Consultez iRobot – Où placer la base ? . La base doit notamment être installée dans un espace dégagé et à distance d’un escalier. :chatgpt-content-reference{index="2"}
                - type: lien
                  titre: iRobot – Où placer la base ?
                  url: https://assistance.irobot.fr/articles/fr/Knowledge/31227
                - type: paragraphe
                  texte: "Pour chacune des deux questions choisies, notez :"
                - type: liste
                  elements:
                      - "Mon hypothèse : ..."
                      - "Ce que la documentation indique : ..."
                      - "Ma conclusion : hypothèse confirmée / infirmée / corrigée."
                - type: paragraphe
                  texte: "Attention : ne généralisez pas une caractéristique d’un modèle à tous les robots aspirateurs."
    - id: a10
      titre: 6. Faire émerger la notion de contrainte
      contenu:
          - type: paragraphe
            texte: Reprenez les éléments qui compliquaient les quatre situations.
          - type: paragraphe
            texte: "Essayez maintenant de compléter cette phrase avec vos propres mots :"
          - type: paragraphe
            texte: Une contrainte est...
          - type: paragraphe
            texte: "Comparez ensuite votre proposition avec cette formulation :"
          - type: paragraphe
            texte: Une contrainte est une condition qu’une solution technique doit respecter ou prendre en compte.
          - type: paragraphe
            texte: Si nécessaire, corrigez votre première proposition.
      questions: []
    - id: a11
      titre: 7. Choisir une solution adaptée
      contenu:
          - type: paragraphe
            texte: Choisissez maintenant deux utilisateurs parmi les quatre.
          - type: paragraphe
            texte: "Pour chacun, choisissez la solution qui vous semble la plus adaptée :"
          - type: liste
            elements:
                - balai ;
                - aspirateur traîneau ;
                - aspirateur sans fil ;
                - robot aspirateur ;
                - combinaison de plusieurs solutions.
          - type: paragraphe
            texte: "Présentez chaque choix sous la forme :"
          - type: liste
            elements:
                - "Solution choisie : ..."
                - "Besoin principal : ..."
                - "Deux contraintes prises en compte : ..."
                - "Pourquoi cette solution : ..."
                - "Une limite restante : ..."
          - type: paragraphe
            texte: Plusieurs solutions peuvent être correctes si elles sont correctement justifiées.
      questions: []
    - id: a12
      titre: 8. Mettons des mots sur ce que nous avons découvert
      contenu:
          - type: paragraphe
            texte: Un besoin correspond à ce qu’un utilisateur cherche à obtenir ou à réaliser.
          - type: paragraphe
            texte: Une contrainte est une condition que la solution doit respecter ou prendre en compte.
          - type: paragraphe
            texte: Deux utilisateurs ayant le même besoin peuvent donc choisir des solutions différentes parce que leurs contraintes ne sont pas les mêmes.
          - type: paragraphe
            texte: "Une solution technique n’est pas « la meilleure » dans l’absolu : elle est plus ou moins adaptée à une situation donnée."
      questions: []
    - id: a13
      titre: "9. Réinvestir : modifier le robot"
      contenu:
          - type: paragraphe
            texte: Choisissez une contrainte rencontrée pendant la séance.
          - type: paragraphe
            texte: Imaginez une modification du robot qui pourrait réduire cette contrainte.
          - type: paragraphe
            texte: "Présentez votre idée :"
          - type: liste
            elements:
                - "Contrainte : ..."
                - "Modification proposée : ..."
                - "Avantage attendu : ..."
                - "Nouvelle contrainte possible : ..."
      questions: []
    - id: a14
      titre: 10. Conclusion
      contenu:
          - type: paragraphe
            texte: "Rédigez quelques phrases pour répondre à la problématique :"
          - type: paragraphe
            texte: Un robot aspirateur convient-il à tout le monde ?
          - type: paragraphe
            texte: "Votre conclusion doit montrer :"
          - type: liste
            elements:
                - qu’un même besoin peut être satisfait de plusieurs façons ;
                - que les contraintes varient selon l’utilisateur et son environnement ;
                - que le choix d’une solution doit être justifié à partir de ces contraintes.
      questions: []
    - id: a15
      titre: 11. Rendu de fin de séance
      contenu:
          - type: paragraphe
            texte: À la fin du cours, votre fichier doit être rendu, même s’il n’est pas terminé.
          - type: paragraphe
            texte: "Déposez :"
          - type: paragraphe
            texte: 4e_S3_nom.odt
          - type: paragraphe
            texte: "Avant de le rendre, vérifiez :"
          - type: liste
            elements:
                - votre nom, la date et le titre ;
                - votre tableau ;
                - vos deux vérifications documentaires ;
                - vos deux choix argumentés ;
                - votre conclusion ;
                - que votre document est plus clair que lors de la séance précédente.
      questions: []
    - id: a16
      titre: Références pédagogiques
      contenu:
          - type: liste
            elements:
                - Ministère de l’Éducation nationale – Programme de technologie du cycle 4, BO n°9 du 29 février 2024
                - Éduscol STI – Guide d’accompagnement du programme de technologie au cycle 4
          - type: lien
            titre: Ministère de l’Éducation nationale – Programme de technologie du cycle 4, BO n°9 du 29 février 2024
            url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
          - type: lien
            titre: Éduscol STI – Guide d’accompagnement du programme de technologie au cycle 4
            url: https://sti.eduscol.education.fr/textes/guide-daccompagnement-du-programme-de-technologie-en-cycle-4-mai-2024
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
introduction:
    - type: paragraphe
      texte: "Problématique : Une même solution technique peut-elle convenir à tous les utilisateurs et à toutes les situations ?"
    - type: titre
      texte: Objectifs d’apprentissage
    - type: paragraphe
      texte: "Ce que vous allez apprendre :"
    - type: liste
      elements:
          - Comprendre qu’un même besoin peut conduire à plusieurs solutions techniques.
          - Comprendre qu’une solution peut être adaptée à une situation et moins adaptée à une autre.
          - Comprendre que les contraintes influencent le choix d’une solution technique.
    - type: paragraphe
      texte: "Ce que vous allez apprendre à faire :"
    - type: liste
      elements:
          - analyser une situation d’utilisation ;
          - identifier un besoin et des contraintes ;
          - formuler une première hypothèse ;
          - vérifier une information dans une documentation technique ;
          - choisir une solution et justifier ce choix.
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
