titre: 'Séance 25 : Pourquoi cette pièce a-t-elle cette forme ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment le procédé de fabrication explique-t-il la forme d’une pièce ?
competences_bo:
    - Caractériser et choisir un objet ou un système technique selon différents critères
objectifs:
    connaissances:
        - 'L’impression 3D dépose un fil de plastique fondu couche par couche : formes complexes possibles, mais pièce plus fragile entre les couches.'
        - La découpe laser découpe des plaques en formes planes ; on assemble ensuite les plaques par tenons et mortaises, comme le bâti du monte-charge.
    competences:
        - Relier la forme d’une pièce à son procédé.
        - Reconnaître les traces d’un procédé.
pourquoi:
    - En 5e, tu as vu que nos maquettes sont en bois découpé au laser et en plastique imprimé en 3D.
    - 'Aujourd’hui, tu cherches pourquoi chaque pièce a la forme qu’elle a : c’est le procédé qui décide.'
activites:
    -   id: a01
        titre: Deux procédés
        consigne: Tu vas reconnaître le procédé de fabrication de pièces de nos maquettes (rotor, bâti, tête du tracker) grâce au document 1 et aux traces visibles sur les pièces. On attend le procédé de chaque pièce et la trace qui l’indique.
        contenu:
            -   type: tableau
                titre: Document 1
                colonnes:
                    - Procédé
                    - Matière de départ
                    - Formes possibles
                    - Traces
                lignes:
                    -   - Impression 3D
                        - Fil de PLA
                        - Volumes, formes creuses
                        - Fines couches
                    -   - Découpe laser
                        - Plaque de contreplaqué
                        - Formes planes, à assembler
                        - Bords brunis
            -   type: etapes
                elements:
                    - Lis le document 1.
                    - Observe le rotor et un morceau de bâti (ou leurs photos).
                    - 'Pour chaque pièce, cherche la trace du procédé : couches ou bords brunis.'
            -   type: paragraphe
                texte: Pourquoi regarder les traces ? Elles permettent de reconnaître le procédé d’une pièce sans l’avoir vue fabriquer.
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1 et tes observations, quel procédé a servi à fabriquer chaque pièce de nos maquettes ?
                colonnes:
                    - Pièce
                    - Procédé
                lignes:
                    -   - Rotor de l’éolienne
                        - ''
                    -   - Côté du bâti du monte-charge
                        - ''
                    -   - Tête du tracker
                        - ''
                aide: Ligne × colonne.
            -   id: q02
                type: qcm
                enonce: Quelle trace montre une découpe laser ?
                choix:
                    -   id: a
                        texte: Des bords brunis.
                    -   id: b
                        texte: Des couches horizontales.
                    -   id: c
                        texte: De la peinture.
                aide: Relis l’exemple expliqué.
    -   id: a02
        titre: Formes et contraintes
        transition: Tu reconnais les procédés. Comprends leurs contraintes.
        consigne: 'Tu vas expliquer la forme de deux pièces par les contraintes de leur procédé : les créneaux du bâti du monte-charge et la casse d’une pale imprimée. On attend deux explications reliées au procédé.'
        contenu:
            -   type: etapes
                elements:
                    - 'Observe les bords du bâti : repère les créneaux.'
                    - Imagine comment deux plaques s’emboîtent.
                    - Pense au sens des couches d’une pale imprimée.
            -   type: paragraphe
                texte: 'Pourquoi ces formes ? Chaque procédé a ses contraintes : on dessine la pièce pour qu’il puisse la fabriquer et qu’elle tienne.'
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi le bâti du monte-charge a-t-il des créneaux sur ses bords ?
                aide: Pense à « car » (réflexe n° 4).
            -   id: q02
                type: texte
                enonce: Une pale imprimée casse toujours le long d’une ligne horizontale. Pourquoi ?
                aide: Pense à « car » (réflexe n° 4).
    -   id: a03
        titre: Choisir un procédé
        transition: Tu connais les contraintes. À toi de choisir.
        consigne: 'Tu vas choisir un procédé pour fabriquer une nouvelle pièce : un support de capteur en forme de L. On attend un choix justifié par la forme de la pièce.'
        contenu:
            -   type: etapes
                elements:
                    - 'Lis le besoin : un support en forme de L.'
                    - Imagine-le en impression 3D, puis en découpe laser.
                    - Choisis et justifie par la forme.
            -   type: paragraphe
                texte: 'Pourquoi justifier par la forme ? C’est le critère principal : un volume d’une pièce → impression ; des plaques à assembler → laser.'
        questions:
            -   id: q01
                type: texte
                enonce: Quel procédé pour un support de capteur en forme de L ? Justifie.
                aide: Pense à « car » (réflexe n° 4).
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le moulage par injection fabrique des milliers de pièces plastiques.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi n’utilise-t-on pas l’impression 3D pour un million de pièces ?
                aide: Pense à « car » (réflexe n° 4).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as relié formes et procédés. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment le procédé explique-t-il la forme d’une pièce ? Donne deux exemples.'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Impression 3D : volumes, couches, fragile entre les couches.'
    - 'Découpe laser : formes planes, bords brunis, tenons et mortaises.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
