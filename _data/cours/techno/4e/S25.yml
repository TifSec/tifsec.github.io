titre: 'Séance 25 : Pourquoi cette pièce a-t-elle cette forme ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment le procédé de fabrication explique-t-il la forme d’une pièce ?
competences_bo:
    - Caractériser et choisir un objet ou un système technique selon différents critères
objectifs:
    connaissances:
        - 'L’impression 3D dépose un fil de plastique fondu couche par couche : elle permet des formes complexes et creuses, mais les couches sont visibles et la pièce est moins solide dans le sens des couches.'
        - La découpe laser découpe des plaques (bois, plastique) en formes planes ; on assemble ensuite les plaques par tenons et mortaises, comme le bâti du monte-charge.
    competences:
        - Relier la forme d’une pièce à son procédé de fabrication.
        - Reconnaître les traces d’un procédé.
pourquoi:
    - En 5e, tu as vu que nos maquettes sont en bois découpé au laser et en plastique imprimé en 3D.
    - 'Aujourd’hui, tu cherches pourquoi chaque pièce a la forme qu’elle a : c’est le procédé qui décide.'
activites:
    -   id: a01
        titre: Deux procédés
        contenu:
            -   type: tableau
                titre: Document 1
                colonnes:
                    - Procédé
                    - Matière de départ
                    - Formes possibles
                    - Traces visibles
                lignes:
                    -   - Impression 3D
                        - Bobine de fil de PLA
                        - Volumes, formes creuses, courbes
                        - Fines couches horizontales
                    -   - Découpe laser
                        - Plaque de contreplaqué (3 ou 6 mm)
                        - Formes planes, à assembler
                        - Bords brunis par la brûlure du laser
            -   type: paragraphe
                texte: 'Exemple expliqué : le rotor de l’éolienne a des pales tordues (vrillées), en volume : seule l’impression 3D peut le faire d’une seule pièce. Le bâti du monte-charge est fait de plaques planes assemblées : c’est de la découpe laser.'
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, quel procédé a servi pour chaque pièce ?
                colonnes:
                    - Pièce
                    - Procédé
                lignes:
                    -   - Rotor de l’éolienne
                        - ''
                    -   - Côté du bâti du monte-charge
                        - ''
                    -   - Tête du tracker
                        - ''
                aide: Ligne × colonne.
            -   id: q02
                type: qcm
                enonce: Quelle trace montre qu’une pièce a été découpée au laser ?
                choix:
                    -   id: a
                        texte: Des bords brunis.
                    -   id: b
                        texte: Des couches horizontales.
                    -   id: c
                        texte: Des traces de peinture.
                aide: Relis l’exemple expliqué.
    -   id: a02
        titre: Formes et contraintes
        transition: Tu reconnais les procédés. Comprends maintenant leurs contraintes.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi le bâti du monte-charge a-t-il des créneaux sur ses bords ?
                aide: Pense à « car » (réflexe n° 4).
            -   id: q02
                type: texte
                enonce: Une pale imprimée casse toujours le long d’une ligne horizontale. Explique pourquoi.
                aide: Pense à « car » (réflexe n° 4).
    -   id: a03
        titre: Choisir un procédé
        transition: Tu connais les contraintes. À toi de choisir.
        questions:
            -   id: q01
                type: texte
                enonce: On veut fabriquer un support de capteur en forme de L pour le monte-charge. Quel procédé choisis-tu ? Justifie.
                aide: Pense à « car » (réflexe n° 4).
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Il existe aussi le moulage par injection pour fabriquer des milliers de pièces en plastique.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi n’utilise-t-on pas l’impression 3D pour fabriquer un million de pièces ?
                aide: Pense à « car » (réflexe n° 4).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as relié les formes aux procédés. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment le procédé explique-t-il la forme d’une pièce ? Donne deux exemples.'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Impression 3D : volumes complexes, couches visibles, fragilité entre les couches.'
    - 'Découpe laser : formes planes, bords brunis, assemblage par tenons et mortaises.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
