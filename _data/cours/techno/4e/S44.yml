titre: "Le modèle respecte-t-il les dimensions et le plan ?"
theme: "Prototyper et vérifier"
problematique: "Le modèle respecte-t-il les dimensions et le plan ?"
pourquoi: "Le modèle se compare au plan ; le modèle seul ne prouve pas le comportement du matériau réel."
application: "Un modèle numérique permet de préparer une forme avant de la fabriquer."
lien_precedent: "Après Comment modifier une forme selon une contrainte ?, une nouvelle mission t’aide à réutiliser tes méthodes."
prerequis:
    - "Tu peux relire la séance précédente (Comment modifier une forme selon une contrainte ?) si nécessaire."
notions:
    - titre: "Un exemple expliqué"
      texte: "Le plan demande 50 mm et le modèle affiche 50 mm : la cote est respectée, mais l’assemblage reste à tester."
objectifs:
    connaissances:
        - "Le modèle se compare au plan ; le modèle seul ne prouve pas le comportement du matériau réel."
    competences:
        - "Comparer deux cotes du modèle au plan et noter conforme ou non conforme avec une preuve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Le modèle se compare au plan ; le modèle seul ne prouve pas le comportement du matériau réel."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Comparer deux cotes du modèle au plan et noter conforme ou non conforme avec une preuve."
    - type: paragraphe
      texte: "Dans la vie réelle : Un modèle numérique permet de préparer une forme avant de la fabriquer."
activites:
    - id: a01
      titre: "1. Comprendre la mission"
      pourquoi: "On commence par un exemple guidé : il montre une méthode avant que tu l’essaies."
      demarche:
          - Lis la situation.
          - Suis les étapes de l’exemple.
          - Repère la donnée qui aide à répondre.
      contenu:
          - type: paragraphe
            texte: "Le plan demande 50 mm et le modèle affiche 50 mm : la cote est respectée, mais l’assemblage reste à tester."
      questions:
          - id: q01
            type: texte
            enonce: "Quel critère faut-il tester après les dimensions ?"
            aide: "Relis l’exemple et repère l’information qui répond à la question."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
            aide: "Une ou deux phrases suffisent."
    - id: a02
      titre: "2. À toi d’essayer"
      pourquoi: "Tu as vu la méthode ; maintenant, applique-la dans une tâche que tu peux vérifier."
      demarche:
          - Réalise les étapes dans l’ordre.
          - Note le résultat attendu.
          - Compare-le au résultat observé.
      consigne: "Comparer deux cotes du modèle au plan et noter conforme ou non conforme avec une preuve."
      questions:
          - id: q01
            type: texte
            enonce: "Quel résultat observes-tu ? Décris ton essai."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
      ressources:
          - type: lien
            titre: "Onshape — aide officielle, extrusion"
            url: https://cad.onshape.com/help/Content/PartStudio/extrude.htm
    - id: a03
      titre: "3. Réutiliser la méthode"
      pourquoi: "Un nouvel exemple t’aide à voir où cette méthode peut encore servir."
      contenu:
          - type: paragraphe
            texte: "Reprends la méthode avec une nouvelle valeur, un autre document ou une autre situation du dossier."
      questions:
          - id: q01
            type: texte
            enonce: "Quelle information permet de justifier ta conclusion ? Quelle limite reste à vérifier ?"
    - id: a04
      titre: "4. Ce que tu retiens"
      pourquoi: "Tu termines en gardant une idée et une méthode pour la prochaine séance."
      demarche:
          - Relis les deux éléments à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Le modèle se compare au plan ; le modèle seul ne prouve pas le comportement du matériau réel."
    - "Pour vérifier, je compare une réponse ou un essai à une donnée précise."
bilan: "Je peux expliquer ce que j’ai appris et montrer une réponse ou un essai comme preuve."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie cycle 4 : cette séance travaille le modèle se compare au plan ; le modèle seul ne prouve pas le comportement du matériau réel.. Elle contribue progressivement aux compétences de fin de cycle."
    - type: lien
      titre: "Ministère — Programme de Technologie du cycle 4, BO 2024"
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
    - type: lien
      titre: "Onshape — aide officielle, extrusion"
      url: https://cad.onshape.com/help/Content/PartStudio/extrude.htm
