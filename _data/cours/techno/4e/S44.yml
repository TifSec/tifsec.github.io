titre: 'Séance 44 : Programmer l’émetteur et le récepteur'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment ajouter l’envoi des mesures au programme du tracker sans casser ce qui fonctionne ?
competences_bo:
    - Concevoir, écrire, tester et mettre au point un programme
objectifs:
    connaissances:
        - 'On part du programme existant du tracker (chercherSoleil, suivi de la lumière) et on ajoute seulement : le groupe radio au démarrage, et l’envoi de la luminosité et de l’angle dans la boucle.'
        - 'Le récepteur a son propre programme : il reçoit les valeurs nommées et les affiche.'
    competences:
        - Ajouter une fonction à un programme existant.
        - Programmer un récepteur.
pourquoi:
    - En séances 42 et 43, tu as découvert la radio et préparé le prototype.
    - Aujourd’hui, tu programmes, dans le simulateur, l’émetteur (programme du tracker complété) et le récepteur.
activites:
    -   id: a01
        titre: L’émetteur
        contenu:
            -   type: etapes
                elements:
                    - Ouvre une copie du programme du tracker (lien du professeur).
                    - Au démarrage, ajoute « radio définir groupe » (ton numéro).
                    - Dans la boucle « toujours », après le réglage de l’angle, ajoute « radio envoyer valeur « lum » = gauche + droite » et « radio envoyer valeur « angle » = angle ».
                    - Ne modifie rien d’autre.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi ne faut-il rien modifier d’autre dans le programme du tracker ?
                aide: Bloc par bloc (réflexe n° 9).
            -   id: q02
                type: tableau
                enonce: Où places-tu chaque ajout ?
                colonnes:
                    - Ajout
                    - Emplacement
                lignes:
                    -   - radio définir groupe
                        - ''
                    -   - radio envoyer valeur « lum »
                        - ''
                aide: Ligne × colonne.
        ressources:
            - &id001
                type: lien
                titre: MakeCode micro:bit (gratuit, dans le navigateur)
                url: https://makecode.microbit.org/
    -   id: a02
        titre: Le récepteur
        transition: L’émetteur envoie. Programme maintenant le récepteur.
        contenu:
            -   type: etapes
                elements:
                    - Nouveau projet 4e_S44_recepteur.
                    - 'Au démarrage : même groupe radio.'
                    - '« quand une donnée est reçue par radio name, value » : si name = « lum » alors montrer value ; si name = « angle » alors montrer value sur la ligne… (ou afficher une flèche).'
        questions:
            -   id: q01
                type: texte
                enonce: Écris l’algorithme du récepteur en langage naturel.
                aide: Combien d’éléments sont demandés ?
            -   id: q02
                type: texte
                enonce: 'Teste dans le simulateur : change la lumière des capteurs de l’émetteur. Que montre le récepteur ?'
                aide: Attendu ou observé ?
        ressources:
            - *id001
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Envoyer trop souvent occupe la radio et vide les piles.
        questions:
            -   id: q01
                type: texte
                enonce: Comment n’envoyer les mesures que toutes les 5 secondes, sans ralentir le suivi du soleil ?
                aide: Attendu ou observé ?
        ressources:
            - *id001
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Les deux programmes sont prêts. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment as-tu ajouté l’envoi des mesures sans casser le programme du tracker ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Ajouter une fonction : on complète sans modifier ce qui marche.'
    - 'Émetteur : groupe + envoi de valeurs nommées ; récepteur : quand reçue + conditions sur le nom.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
