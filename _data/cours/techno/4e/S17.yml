titre: 'Séance 17 : Calc n° 1 : combien de temps pour envoyer une vidéo ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Comment calculer le temps d’envoi d’un fichier selon le débit de la connexion ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - Le débit est la quantité de données transmise par seconde, en mégabits par seconde (Mbit/s). 1 octet = 8 bits, donc 1 Mo = 8 Mbit.
        - 'Durée (s) = taille (Mbit) ÷ débit (Mbit/s). Dans Calc, une formule utilise des références de cellules : =B2*8/C2.'
    competences:
        - Calculer une durée de transfert.
        - Écrire une formule avec des références de cellules.
        - Faire un graphique avec un titre et des axes nommés.
pourquoi:
    - En 5e, tu as utilisé SOMME et MOYENNE dans Calc. En séance 13, tu as vu les liaisons du réseau.
    - Aujourd’hui, tu calcules combien de temps il faut pour envoyer une vidéo selon la connexion.
activites:
    -   id: a01
        titre: Calculer à la main
        contenu:
            -   type: paragraphe
                texte: 'Exemple expliqué : vidéo de 100 Mo avec un débit de 20 Mbit/s. Taille en mégabits : 100 × 8 = 800 Mbit. Durée : 800 ÷ 20 = 40 s.'
        questions:
            -   id: q01
                type: nombre
                enonce: Vidéo de 250 Mo, débit 50 Mbit/s. Quelle est la durée d’envoi ?
                unite: s
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: qcm
                enonce: Pourquoi multiplie-t-on la taille par 8 ?
                choix:
                    -   id: a
                        texte: Parce qu’un octet contient 8 bits.
                    -   id: b
                        texte: Parce qu’il y a 8 câbles.
                    -   id: c
                        texte: Au hasard.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a02
        titre: La feuille de calcul
        transition: Tu sais faire le calcul. Laisse Calc le faire pour plusieurs connexions.
        contenu:
            -   type: tableau
                titre: Ce que tu dois obtenir dans Calc (débits typiques arrondis)
                colonnes:
                    - ''
                    - A
                    - B
                    - C
                    - D
                lignes:
                    -   - '1'
                        - Connexion
                        - Taille (Mo)
                        - Débit (Mbit/s)
                        - Durée (s)
                    -   - '2'
                        - ADSL
                        - '250'
                        - '8'
                        - ''
                    -   - '3'
                        - 4G
                        - '250'
                        - '40'
                        - ''
                    -   - '4'
                        - Fibre
                        - '250'
                        - '500'
                        - ''
            -   type: etapes
                elements:
                    - Ouvre Calc, enregistre sous 4e_S17_tonprenom.ods et recopie le tableau.
                    - En D2, écris =B2*8/C2 puis Entrée.
                    - Recopie la formule jusqu’en D4 avec la poignée.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle formule as-tu écrite en D3 (après recopie) ?
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
            -   id: q02
                type: tableau
                enonce: Recopie les durées obtenues.
                colonnes:
                    - Connexion
                    - Durée (s)
                lignes:
                    -   - ADSL
                        - ''
                    -   - 4G
                        - ''
                    -   - Fibre
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
    -   id: a03
        titre: Le graphique
        transition: Les résultats sont calculés. Un graphique les rend plus parlants.
        contenu:
            -   type: etapes
                elements:
                    - Sélectionne A1:A4 et D1:D4 (touche Ctrl pour la deuxième plage).
                    - Insertion > Diagramme > Colonnes.
                    - 'Titre : « Durée d’envoi d’une vidéo de 250 Mo » ; axe Y : « Durée (s) ».'
        questions:
            -   id: q01
                type: texte
                enonce: D’après ton graphique, combien de fois la fibre est-elle plus rapide que l’ADSL pour ce fichier ? Montre le calcul.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
            -   id: q02
                type: qcm
                enonce: Pourquoi utiliser des références (B2, C2) plutôt que les nombres dans la formule ?
                choix:
                    -   id: a
                        texte: Si on change la taille ou le débit, le résultat se recalcule tout seul.
                    -   id: b
                        texte: C’est plus joli.
                    -   id: c
                        texte: Calc refuse les nombres.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Dans la réalité, le débit varie selon l’heure et le nombre d’utilisateurs.
        questions:
            -   id: q01
                type: texte
                enonce: Ajoute une colonne « Débit réel » égale à la moitié du débit. Quelle formule pour la durée réelle ?
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as calculé et comparé. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment calculer le temps d’envoi d’un fichier selon le débit ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Durée (s) = taille (Mo) × 8 ÷ débit (Mbit/s).
    - 'Calc : formule avec références de cellules, recopie avec la poignée, graphique avec titre et axes.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
