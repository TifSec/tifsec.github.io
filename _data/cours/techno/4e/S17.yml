titre: 'Séance 17 : Calc n° 1 : combien de temps pour envoyer une vidéo ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Comment calculer le temps d’envoi d’un fichier selon le débit de la connexion ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - Le débit est la quantité de données transmise par seconde (Mbit/s). 1 octet = 8 bits, donc 1 Mo = 8 Mbit.
        - 'Durée (s) = taille (Mo) × 8 ÷ débit (Mbit/s). Dans Calc, une formule utilise des références de cellules : =B2*8/C2.'
    competences:
        - Calculer une durée de transfert.
        - Écrire une formule avec des références de cellules.
        - Faire un graphique titré.
pourquoi:
    - En 5e, tu as utilisé SOMME et MOYENNE. En séance 13, tu as vu les liaisons du réseau.
    - Aujourd’hui, tu calcules combien de temps il faut pour envoyer une vidéo. Ton fichier reste sur l’ordinateur ; sur le site, tu réponds sur ta méthode.
activites:
    -   id: a01
        titre: Calculer à la main
        consigne: Tu vas calculer à la main le temps d’envoi d’une vidéo, à partir de l’exemple expliqué (taille en Mo, débit en Mbit/s). On attend une durée en secondes et l’explication du « × 8 ».
        contenu:
            -   type: paragraphe
                texte: 'Exemple expliqué : vidéo de 100 Mo, débit 20 Mbit/s. 100 × 8 = 800 Mbit ; 800 ÷ 20 = 40 s.'
            -   type: etapes
                elements:
                    - Lis l’exemple expliqué.
                    - Convertis la taille en mégabits (× 8).
                    - Divise par le débit.
                    - Écris le résultat en secondes.
            -   type: paragraphe
                texte: 'Pourquoi × 8 ? La taille d’un fichier est en octets, le débit en bits : il faut la même unité avant de diviser.'
        questions:
            -   id: q01
                type: nombre
                enonce: Vidéo de 250 Mo, débit 50 Mbit/s. Quelle est la durée d’envoi ?
                unite: s
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: qcm
                enonce: Pourquoi multiplie-t-on la taille par 8 ?
                choix:
                    -   id: a
                        texte: Un octet contient 8 bits.
                    -   id: b
                        texte: Il y a 8 câbles.
                    -   id: c
                        texte: Au hasard.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a02
        titre: La feuille de calcul
        transition: Tu sais faire le calcul. Laisse Calc le faire pour plusieurs connexions.
        consigne: Tu vas faire faire ce calcul par le tableur Calc pour trois connexions (ADSL, 4G, fibre), en recopiant le tableau fourni. On attend la formule recopiée et les durées obtenues.
        contenu:
            -   type: tableau
                titre: Ce que tu dois obtenir dans Calc
                colonnes:
                    - ''
                    - A
                    - B
                    - C
                    - D
                lignes:
                    -   - '1'
                        - Connexion
                        - Taille (Mo)
                        - Débit (Mbit/s)
                        - Durée (s)
                    -   - '2'
                        - ADSL
                        - '250'
                        - '8'
                        - ''
                    -   - '3'
                        - 4G
                        - '250'
                        - '40'
                        - ''
                    -   - '4'
                        - Fibre
                        - '250'
                        - '500'
                        - ''
            -   type: etapes
                elements:
                    - Ouvre Calc, enregistre sous 4e_S17_tonprenom.ods et recopie le tableau.
                    - En D2, écris =B2*8/C2 puis Entrée.
                    - Recopie la formule jusqu’en D4 avec la poignée (petit carré en bas à droite).
            -   type: paragraphe
                texte: 'Pourquoi des références (B2, C2) ? Si on change la taille ou le débit, Calc recalcule tout seul : c’est l’intérêt d’un tableur.'
        questions:
            -   id: q01
                type: texte
                enonce: Quelle formule obtiens-tu en D3 après la recopie ?
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
            -   id: q02
                type: tableau
                enonce: Recopie les durées calculées par ta feuille Calc (colonne D) pour la vidéo de 250 Mo.
                colonnes:
                    - Connexion
                    - Durée (s)
                lignes:
                    -   - ADSL
                        - ''
                    -   - 4G
                        - ''
                    -   - Fibre
                        - ''
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a03
        titre: Le graphique
        transition: Les résultats sont calculés. Un graphique les rend plus parlants.
        consigne: Tu vas tracer dans Calc le graphique des durées d’envoi de la mission 2. On attend un graphique titré et un calcul qui compare la fibre et l’ADSL.
        contenu:
            -   type: etapes
                elements:
                    - Sélectionne A1:A4, puis avec Ctrl, D1:D4.
                    - Insertion > Diagramme > Colonnes.
                    - 'Titre : « Durée d’envoi d’une vidéo de 250 Mo » ; axe Y : « Durée (s) ».'
                    - Enregistre (Ctrl + S).
            -   type: paragraphe
                texte: Pourquoi un titre et des axes nommés ? Un graphique sans titre ni unité ne peut pas être lu par quelqu’un d’autre.
        questions:
            -   id: q01
                type: texte
                enonce: Combien de fois la fibre est-elle plus rapide que l’ADSL pour ce fichier ? Montre le calcul.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le débit réel est souvent plus faible que prévu.
        questions:
            -   id: q01
                type: texte
                enonce: Ajoute une colonne « Débit réel » égale à la moitié du débit. Quelle formule pour la durée réelle ?
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as calculé et comparé. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment calculer le temps d’envoi d’un fichier ? Explique le calcul et la formule Calc.'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Durée (s) = taille (Mo) × 8 ÷ débit (Mbit/s).
    - 'Calc : références de cellules, poignée, graphique titré.'
sources:
