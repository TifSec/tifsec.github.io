titre: "Pix : retrouver mon parcours et mon aide"
theme: "Word et recherche technique"
problematique: "Pix : retrouver mon parcours et mon aide"
pourquoi: "Un parcours Pix est personnel ; son explication aide à apprendre une méthode."
application: "Un document clair aide une autre personne à retrouver une information technique."
lien_precedent: "Après Comment écrire une procédure que quelqu’un peut suivre ?, une nouvelle mission t’aide à réutiliser tes méthodes."
prerequis:
    - "Tu peux relire la séance précédente (Comment écrire une procédure que quelqu’un peut suivre ?) si nécessaire."
notions:
    - titre: "Un exemple expliqué"
      texte: "Après une erreur dans Pix, je lis l’explication et note une méthode à réutiliser. Je garde mon mot de passe privé."
objectifs:
    connaissances:
        - "Un parcours Pix est personnel ; son explication aide à apprendre une méthode."
    competences:
        - "Réaliser la campagne de rentrée ou le parcours indiqué, puis noter une méthode apprise sans recopier de réponse secrète."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Un parcours Pix est personnel ; son explication aide à apprendre une méthode."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Réaliser la campagne de rentrée ou le parcours indiqué, puis noter une méthode apprise sans recopier de réponse secrète."
    - type: paragraphe
      texte: "Dans la vie réelle : Un document clair aide une autre personne à retrouver une information technique."
activites:
    - id: a01
      titre: "1. Comprendre la mission"
      pourquoi: "On commence par un exemple guidé : il montre une méthode avant que tu l’essaies."
      demarche:
          - Lis la situation.
          - Suis les étapes de l’exemple.
          - Repère la donnée qui aide à répondre.
      contenu:
          - type: paragraphe
            texte: "Après une erreur dans Pix, je lis l’explication et note une méthode à réutiliser. Je garde mon mot de passe privé."
      questions:
          - id: q01
            type: texte
            enonce: "Que peux-tu noter après avoir lu une explication Pix ?"
            aide: "Relis l’exemple et repère l’information qui répond à la question."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
            aide: "Une ou deux phrases suffisent."
    - id: a02
      titre: "2. À toi d’essayer"
      pourquoi: "Tu as vu la méthode ; maintenant, applique-la dans une tâche que tu peux vérifier."
      demarche:
          - Réalise les étapes dans l’ordre.
          - Note le résultat attendu.
          - Compare-le au résultat observé.
      consigne: "Réaliser la campagne de rentrée ou le parcours indiqué, puis noter une méthode apprise sans recopier de réponse secrète."
      questions:
          - id: q01
            type: texte
            enonce: "Quel résultat observes-tu ? Décris ton essai."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
      ressources:
          - type: lien
            titre: "Pix — Espace élève"
            url: https://pix.fr/eleve/
    - id: a03
      titre: "3. Réutiliser la méthode"
      pourquoi: "Un nouvel exemple t’aide à voir où cette méthode peut encore servir."
      contenu:
          - type: paragraphe
            texte: "Reprends la méthode avec une nouvelle valeur, un autre document ou une autre situation du dossier."
      questions:
          - id: q01
            type: texte
            enonce: "Quelle information permet de justifier ta conclusion ? Quelle limite reste à vérifier ?"
    - id: a04
      titre: "4. Ce que tu retiens"
      pourquoi: "Tu termines en gardant une idée et une méthode pour la prochaine séance."
      demarche:
          - Relis les deux éléments à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Un parcours Pix est personnel ; son explication aide à apprendre une méthode."
    - "Pour vérifier, je compare une réponse ou un essai à une donnée précise."
bilan: "Je peux expliquer ce que j’ai appris et montrer une réponse ou un essai comme preuve."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie cycle 4 : cette séance travaille un parcours pix est personnel ; son explication aide à apprendre une méthode.. Elle contribue progressivement aux compétences de fin de cycle."
    - type: lien
      titre: "Ministère — Programme de Technologie du cycle 4, BO 2024"
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
    - type: lien
      titre: "Pix — Espace élève"
      url: https://pix.fr/eleve/
