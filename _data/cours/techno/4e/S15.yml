titre: 'Séance 15 : Construire un petit réseau en simulation'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Comment construire, paramétrer et vérifier un petit réseau local ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
    - Valider les solutions techniques par des simulations ou par des protocoles de tests
objectifs:
    connaissances:
        - Dans Filius, on place des ordinateurs et un commutateur, on les relie par des câbles, puis on donne une adresse IP à chaque ordinateur.
        - 'La commande ping envoie un petit message à une adresse et attend une réponse : elle vérifie que deux appareils communiquent.'
    competences:
        - Construire un réseau dans un simulateur.
        - Paramétrer les adresses IP.
        - Vérifier la communication avec ping.
pourquoi:
    - En séances 13 et 14, tu as vu les équipements et les adresses.
    - Aujourd’hui, tu construis toi-même un réseau, dans le simulateur Filius.
activites:
    -   id: a01
        titre: Construire
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Filius (mode conception, icône du marteau).
                    - Place trois ordinateurs et un commutateur.
                    - Relie chaque ordinateur au commutateur avec un câble.
                    - 'Double-clique sur chaque ordinateur et donne-lui une adresse : 192.168.1.1, 192.168.1.2, 192.168.1.3 (masque 255.255.255.0).'
        questions:
            -   id: q01
                type: tableau
                enonce: Recopie le paramétrage de tes ordinateurs.
                colonnes:
                    - Ordinateur
                    - Adresse IP
                lignes:
                    -   - PC 1
                        - ''
                    -   - PC 2
                        - ''
                    -   - PC 3
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
            -   id: q02
                type: qcm
                enonce: Quel équipement relie tes trois ordinateurs ?
                choix:
                    -   id: a
                        texte: Le commutateur.
                    -   id: b
                        texte: Le routeur.
                    -   id: c
                        texte: L’imprimante.
                aide: Élimine d’abord les réponses impossibles.
        ressources:
            - &id001
                type: lien
                titre: Filius — logiciel libre de simulation de réseau (site officiel)
                url: https://www.lernsoftware-filius.de/Herunterladen
    -   id: a02
        titre: Vérifier avec ping
        transition: Ton réseau est construit. Vérifie qu’il fonctionne.
        contenu:
            -   type: etapes
                elements:
                    - Passe en mode simulation (icône du triangle vert).
                    - Sur PC 1, installe le logiciel « Ligne de commande ».
                    - 'Tape : ping 192.168.1.3 puis Entrée.'
                    - Observe les réponses et les câbles qui clignotent.
        questions:
            -   id: q01
                type: texte
                enonce: Recopie ce qu’affiche Filius après le ping (au moins une ligne), et dis si les ordinateurs communiquent.
                aide: Une phrase complète qui reprend les mots de la question.
            -   id: q02
                type: texte
                enonce: Pendant le ping, quels câbles clignotent ? Que montre ce chemin ?
                aide: Une phrase complète qui reprend les mots de la question.
        ressources:
            - *id001
    -   id: a03
        titre: Ajouter un appareil
        transition: Ton réseau marche. Que se passe-t-il si on fait une erreur d’adresse ?
        contenu:
            -   type: paragraphe
                texte: Ajoute un quatrième ordinateur avec l’adresse 192.168.1.2 (déjà utilisée !), puis fais un ping vers 192.168.1.2.
        questions:
            -   id: q01
                type: texte
                enonce: Que se passe-t-il ? Explique et propose une correction.
                aide: Une idée + « car » + une raison tirée de la séance.
        ressources:
            - *id001
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Dans Filius, on peut ajouter un serveur web.
        questions:
            -   id: q01
                type: texte
                enonce: Installe un serveur web sur PC 3 et un navigateur sur PC 1. Que dois-tu taper dans le navigateur ?
                aide: Une phrase complète qui reprend les mots de la question.
        ressources:
            - *id001
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as construit et testé un réseau. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment construire, paramétrer et vérifier un petit réseau local ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Construire : ordinateurs + commutateur + câbles. Paramétrer : une adresse IP unique par ordinateur.'
    - 'Vérifier : ping envoie un message et attend la réponse.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
