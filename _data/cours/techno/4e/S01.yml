titre: Bienvenue en technologie
theme: Technologie — Bienvenue en technologie
problematique: Bienvenue en technologie
pourquoi: Cette première séance va permettre de découvrir la manière dont nous allons travailler cette année en technologie.
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances: []
    competences: []
activites:
    - id: a02
      titre: 1. Créer votre premier document de travail
      contenu:
          - type: paragraphe
            texte: "Cette année, presque chaque séance commencera de la même manière : vous créerez immédiatement votre document de travail."
          - type: paragraphe
            texte: "Créez maintenant un document LibreOffice Writer nommé :"
          - type: paragraphe
            texte: 4e_S1_nom.odt
          - type: paragraphe
            texte: Remplacez nom par votre nom.
          - type: paragraphe
            texte: "Commencez votre document en indiquant :"
          - type: liste
            elements:
                - votre nom et votre prénom ;
                - la date ;
                - "le titre : Séance 1 : Bienvenue en technologie."
          - type: paragraphe
            texte: Ce document doit être créé dès le début du cours.
          - type: paragraphe
            texte: "Il pourra servir à la fois :"
          - type: liste
            elements:
                - de brouillon ;
                - de carnet de recherche ;
                - d’espace pour vos essais ;
                - de fichier de réponses ;
                - de trace de votre travail.
          - type: paragraphe
            texte: Vous n’avez donc pas besoin d’attendre d’avoir une réponse parfaite avant d’écrire.
      questions: []
    - id: a03
      titre: 2. À quoi sert votre fichier ?
      contenu:
          - type: paragraphe
            texte: À la fin de presque chaque séance, vous devrez rendre le fichier sur lequel vous avez travaillé.
          - type: paragraphe
            texte: Le fichier doit être rendu même s’il n’est pas terminé.
          - type: paragraphe
            texte: "Il permettra au professeur de voir :"
          - type: liste
            elements:
                - ce que vous avez essayé ;
                - les idées que vous avez proposées ;
                - les difficultés rencontrées ;
                - les corrections effectuées ;
                - votre implication pendant le cours ;
                - votre progression au fil de l’année.
          - type: paragraphe
            texte: Au début de l’année, vos documents pourront être simples et parfois désordonnés.
          - type: paragraphe
            texte: Au fil des séances, vous devrez apprendre à les rendre progressivement plus clairs, mieux organisés et plus agréables à lire.
      questions: []
    - id: a04
      titre: 3. Peut-on se tromper ?
      contenu:
          - type: paragraphe
            texte: Oui.
          - type: paragraphe
            texte: En technologie, une réponse incorrecte peut être très intéressante si elle montre une véritable réflexion.
          - type: paragraphe
            texte: "Vous aurez souvent le droit de :"
          - type: liste
            elements:
                - proposer une idée sans être certain qu’elle fonctionne ;
                - faire un essai ;
                - obtenir un résultat inattendu ;
                - modifier votre réponse ;
                - recommencer autrement.
          - type: paragraphe
            texte: Lorsque vous modifiez une réponse après une recherche, une expérience ou une discussion, cela montre que votre réflexion progresse.
          - type: paragraphe
            texte: Une réponse imparfaite mais expliquée est préférable à une réponse parfaite copiée sans réflexion.
      questions: []
    - id: a05
      titre: 4. Comment demander de l’aide ?
      contenu:
          - type: paragraphe
            texte: Le professeur est là pour vous aider à avancer, mais il ne donnera pas systématiquement la solution.
          - type: paragraphe
            texte: "Avant de demander de l’aide, essayez :"
          - type: etapes
            elements:
                - de relire la consigne ;
                - d’observer les informations disponibles ;
                - de tester une première idée ;
                - de rechercher si cela est autorisé ;
                - éventuellement d’échanger avec un camarade.
          - type: paragraphe
            texte: "Vous pouvez ensuite expliquer au professeur :"
          - type: paragraphe
            texte: « J’ai essayé ceci, j’ai obtenu cela, mais je bloque ici. »
          - type: paragraphe
            texte: "Cette manière de demander de l’aide est beaucoup plus utile que :"
          - type: paragraphe
            texte: « Je ne comprends rien. »
      questions: []
    - id: a06
      titre: 5. Seul ou avec les autres ?
      contenu:
          - type: paragraphe
            texte: Vous travaillerez souvent seul sur votre poste informatique.
          - type: paragraphe
            texte: Certaines activités pourront cependant être réalisées à plusieurs.
          - type: paragraphe
            texte: "Même lorsque vous travaillez seul, vous pourrez parfois :"
          - type: liste
            elements:
                - échanger une idée avec un camarade ;
                - comparer vos résultats ;
                - demander un avis ;
                - expliquer votre raisonnement à quelqu’un.
          - type: paragraphe
            texte: Ces échanges doivent rester calmes afin de permettre à chacun de travailler.
          - type: paragraphe
            texte: Les discussions à voix basse sont possibles lorsqu’elles servent le travail.
      questions: []
    - id: a07
      titre: 6. Ce qui sera évalué cette année
      contenu:
          - type: paragraphe
            texte: Votre travail ne sera pas évalué uniquement sur le nombre de bonnes réponses.
          - type: paragraphe
            texte: "Le professeur observera régulièrement :"
          - type: liste
            elements:
                - votre implication ;
                - votre envie de chercher ;
                - votre autonomie ;
                - votre capacité à tester une idée ;
                - votre capacité à expliquer votre raisonnement ;
                - votre capacité à corriger et améliorer votre travail ;
                - la progression de vos productions numériques ;
                - votre comportement pendant le travail.
          - type: paragraphe
            texte: Les fichiers rendus au fil des séances permettront donc de suivre votre progression sur la durée.
      questions: []
    - id: a08
      titre: "7. Première activité : qu’est-ce que la technologie ?"
      contenu:
          - type: paragraphe
            texte: Sans effectuer de recherche sur Internet, écrivez dans votre document ce que signifie pour vous le mot technologie.
          - type: paragraphe
            texte: "Répondez ensuite aux questions suivantes :"
      questions:
          - id: q01
            type: texte
            enonce: À quoi sert la technologie selon vous ?
            suite: []
          - id: q02
            type: texte
            enonce: Citez cinq objets ou systèmes que vous considérez comme technologiques.
            suite: []
          - id: q03
            type: texte
            enonce: Un objet très ancien peut-il être un objet technique ? Expliquez.
            suite: []
          - id: q04
            type: texte
            enonce: Un objet qui ne contient ni écran ni électronique peut-il être technologique ? Expliquez.
            suite: []
          - id: q05
            type: texte
            enonce: Quelle invention ou quel objet technique a, selon vous, le plus changé la vie humaine ? Pourquoi ?
            suite:
                - type: paragraphe
                  texte: Il n’y a volontairement pas une seule réponse attendue. Ce sont vos idées et vos explications qui sont importantes.
    - id: a09
      titre: "8. Petit défi : améliorer un objet du quotidien"
      contenu:
          - type: paragraphe
            texte: Choisissez un objet que vous utilisez régulièrement.
          - type: paragraphe
            texte: "Dans votre document, indiquez :"
          - type: liste
            elements:
                - le nom de l’objet ;
                - à quoi il sert ;
                - une chose qui fonctionne bien ;
                - un problème ou une limite que vous avez remarqué ;
                - une amélioration que vous pourriez imaginer.
          - type: paragraphe
            texte: Vous pouvez ajouter un petit croquis si cela vous aide à présenter votre idée.
          - type: paragraphe
            texte: Votre amélioration n’a pas besoin d’exister réellement. Vous devez surtout être capable d’expliquer le problème que vous cherchez à résoudre.
      questions: []
    - id: a10
      titre: 9. Mise en commun
      contenu:
          - type: paragraphe
            texte: Nous allons comparer quelques réponses et propositions.
          - type: paragraphe
            texte: Pendant la discussion, vous pouvez compléter ou modifier votre document.
          - type: paragraphe
            texte: "Nous chercherons notamment à comprendre :"
          - type: liste
            elements:
                - pourquoi les objets techniques existent ;
                - pourquoi ils évoluent ;
                - pourquoi plusieurs solutions peuvent répondre au même problème ;
                - pourquoi il est important de réfléchir avant de chercher une solution.
      questions: []
    - id: a11
      titre: 10. Avant de rendre votre travail
      contenu:
          - type: paragraphe
            texte: Utilisez les dernières minutes de la séance pour relire votre document.
          - type: paragraphe
            texte: "Vérifiez :"
          - type: liste
            elements:
                - que votre nom et votre prénom sont présents ;
                - que la date est indiquée ;
                - que le titre est présent ;
                - que vos réponses sont compréhensibles ;
                - que votre fichier possède le bon nom.
          - type: paragraphe
            texte: Pour cette première séance, il n’est pas demandé d’avoir une mise en page parfaite.
          - type: paragraphe
            texte: "Conservez cependant en mémoire l’aspect de votre premier document : nous pourrons le comparer avec vos productions de fin d’année."
      questions: []
    - id: a12
      titre: 11. Rendu de fin de séance
      contenu:
          - type: paragraphe
            texte: À la fin du cours, votre fichier doit être rendu.
          - type: paragraphe
            texte: "Déposez le fichier :"
          - type: paragraphe
            texte: 4e_S1_nom.odt
          - type: paragraphe
            texte: dans l’espace indiqué par le professeur.
          - type: paragraphe
            texte: Rendez-le même si vous n’avez pas terminé toutes les activités.
          - type: paragraphe
            texte: Ce premier document constitue le point de départ de votre progression cette année.
      questions: []
    - id: a13
      titre: 12. À retenir
      contenu:
          - type: paragraphe
            texte: En technologie, chercher fait partie du travail.
          - type: paragraphe
            texte: Vous avez le droit de proposer, tester, vous tromper, corriger et recommencer.
          - type: paragraphe
            texte: Votre travail sera évalué à travers votre implication, votre raisonnement et votre progression.
          - type: paragraphe
            texte: À chaque séance, votre document numérique permettra de conserver une trace de votre travail et devra progressivement devenir plus clair et mieux organisé.
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
introduction:
    - type: titre
      texte: Objectif de la séance
    - type: paragraphe
      texte: Cette première séance va permettre de découvrir la manière dont nous allons travailler cette année en technologie.
    - type: paragraphe
      texte: "Vous allez régulièrement devoir :"
    - type: liste
      elements:
          - observer ;
          - chercher ;
          - faire des hypothèses ;
          - tester vos idées ;
          - vous tromper parfois ;
          - corriger et améliorer votre travail ;
          - expliquer vos choix.
    - type: paragraphe
      texte: Le but n’est pas de connaître immédiatement toutes les bonnes réponses, mais d’apprendre à chercher et à progresser.
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
