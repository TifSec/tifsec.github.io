titre: 'Séance 1 : Que retenons-nous de la 5e ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Que sais-je déjà faire en technologie, et sur quoi vais-je progresser en 4e ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
    - Comprendre et modifier un programme associé à une fonctionnalité d’un objet ou d’un système technique
objectifs:
    connaissances:
        - 'Une chaîne d’information : acquérir, traiter, communiquer. Une chaîne d’énergie : alimenter, convertir, transmettre.'
        - Les dix réflexes brevet de 5e (R1 à R10) restent valables toute l’année.
    competences:
        - Réutiliser les chaînes d’information et d’énergie.
        - Lire un programme bloc par bloc.
        - Repérer ses points forts et un objectif pour la 4e.
pourquoi:
    - En 5e, tu as étudié l’éolienne, le monte-charge, le tracker et la cuve, et tu as programmé un jeu avec Arcade.
    - 'Aujourd’hui, tu fais le point, sans pression : ce diagnostic sert à savoir d’où tu pars. En 4e, c’est toi qui identifieras, choisiras et proposeras.'
activites:
    -   id: a01
        titre: Retrouver les deux chaînes
        consigne: Tu vas retrouver les deux chaînes vues en 5e (information et énergie) sur le tracker et l’éolienne du collège, à l’aide du tableau de rappel. On attend la fonction de chaque constituant du tracker et l’énergie qui entre dans le rotor.
        contenu:
            -   type: tableau
                titre: Rappel de 5e
                colonnes:
                    - Chaîne
                    - Fonctions
                    - Exemple sur le monte-charge
                lignes:
                    -   - Information
                        - Acquérir → traiter → communiquer
                        - Bouton → carte micro:bit → écran
                    -   - Énergie
                        - Alimenter → convertir → transmettre
                        - Alimentation → moteur → poulie et câble
            -   type: etapes
                elements:
                    - Relis le tableau de rappel ci-dessus.
                    - 'Pour chaque constituant du tracker, demande-toi : récupère-t-il une information, décide-t-il, ou agit-il ?'
                    - Écris ta réponse dans le tableau de la question 1.
            -   type: paragraphe
                texte: 'Pourquoi revoir les chaînes ? Elles reviennent dans presque tous les sujets de brevet : savoir classer un constituant, c’est comprendre comment fonctionne l’objet.'
        questions:
            -   id: q01
                type: tableau
                enonce: Écris la fonction de chaque constituant du tracker.
                colonnes:
                    - Constituant
                    - Fonction
                lignes:
                    -   - Capteur de lumière
                        - ''
                    -   - Carte micro:bit
                        - ''
                    -   - Servomoteur
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
            -   id: q02
                type: qcm
                enonce: Sur l’éolienne, quelle énergie entre dans le rotor ?
                choix:
                    -   id: a
                        texte: L’énergie du vent (mouvement de l’air).
                    -   id: b
                        texte: L’énergie électrique.
                    -   id: c
                        texte: L’énergie lumineuse.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a02
        titre: Relire un programme
        transition: Tu reconnais les chaînes. Vérifions maintenant la lecture d’un programme.
        consigne: Tu vas lire un court programme de carte micro:bit (affiché ci-dessous) qui teste la lumière. On attend que tu prévoies ce qu’affiche la carte dans un cas précis, puis que tu expliques le programme en une ou deux phrases.
        contenu:
            -   type: code
                texte: "quand le bouton A est appuyé\n    si lumière > 100 alors\n        afficher « JOUR »\n    sinon\n        afficher « NUIT »"
            -   type: etapes
                elements:
                    - 'Lis la première ligne : quand le programme démarre-t-il ?'
                    - 'Lis la condition : que compare-t-il ?'
                    - 'Lis les deux actions : que fait-il si c’est vrai, et sinon ?'
            -   type: paragraphe
                texte: 'Pourquoi lire bloc par bloc ? Un programme s’exécute dans l’ordre, comme une recette : si tu sautes une ligne, tu te trompes sur ce qu’il fait (réflexe n° 9).'
        questions:
            -   id: q01
                type: qcm
                enonce: La lumière vaut 40 et on appuie sur A. Qu’affiche la carte ?
                choix:
                    -   id: a
                        texte: NUIT
                    -   id: b
                        texte: JOUR
                    -   id: c
                        texte: Rien
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Explique ce que fait ce programme, en une ou deux phrases.
                aide: 'Bloc par bloc : quand ? quelle condition ? quelle action ?'
    -   id: a03
        titre: Faire le point sur mes réflexes
        transition: Tu as révisé les chaînes et la lecture d’un programme. Fais le point sur tes réflexes.
        consigne: Tu vas faire le point sur les dix réflexes brevet de 5e, rappelés dans le tableau ci-dessous. On attend le réflexe que tu maîtrises le mieux et celui que tu dois travailler, chacun avec un exemple.
        contenu:
            -   type: tableau
                titre: Les dix réflexes de 5e
                colonnes:
                    - Réflexe
                    - Ce que je fais
                lignes:
                    -   - R1
                        - Je repère le verbe de la question.
                    -   - R2
                        - « D’après le document… »
                    -   - R3
                        - Je reprends les mots de la question.
                    -   - R4
                        - Je justifie avec « car ».
                    -   - R5
                        - J’écris l’unité.
                    -   - R6
                        - Ligne × colonne dans un tableau.
                    -   - R7
                        - Je complète un schéma bloc.
                    -   - R8
                        - Une seule chose à la fois dans un test.
                    -   - R9
                        - Je lis un programme bloc par bloc.
                    -   - R10
                        - Je gère mon temps.
            -   type: etapes
                elements:
                    - Lis la liste des réflexes de 5e.
                    - Repère celui que tu utilises le plus facilement.
                    - Repère celui que tu oublies souvent.
                    - Réponds aux deux questions avec un exemple.
            -   type: paragraphe
                texte: Pourquoi choisir un objectif ? On progresse plus vite quand on sait précisément ce qu’on veut améliorer.
        questions:
            -   id: q01
                type: texte
                enonce: Quel réflexe maîtrises-tu le mieux ? Donne un exemple où tu l’as utilisé.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
            -   id: q02
                type: texte
                enonce: Quel réflexe dois-tu travailler cette année ? Pourquoi ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Six nouveaux réflexes (R11 à R16) arrivent cette année.
        questions:
            -   id: q01
                type: texte
                enonce: Invente un réflexe qui t’aiderait au brevet et qui n’est pas dans la liste.
                aide: Une idée réaliste + « Cela permet de… ».
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as fait ton diagnostic. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : que sais-tu déjà faire en technologie, et sur quoi vas-tu progresser en 4e ? Cite au moins deux savoir-faire et un objectif.'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Chaîne d’information : acquérir, traiter, communiquer. Chaîne d’énergie : alimenter, convertir, transmettre.'
    - Les réflexes R1 à R10 restent valables en 4e.
sources:
