titre: 'Séance 1 : Que retenons-nous de la 5e ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Que sais-je déjà faire en technologie, et sur quoi vais-je progresser en 4e ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
    - Comprendre et modifier un programme associé à une fonctionnalité d’un objet ou d’un système technique
objectifs:
    connaissances:
        - 'Une chaîne d’énergie : alimenter, convertir, transmettre. Une chaîne d’information : acquérir, traiter, communiquer.'
        - 'Les dix réflexes brevet de 5e (R1 à R10) restent valables : on les réutilise toute l’année.'
    competences:
        - Réutiliser les chaînes d’énergie et d’information.
        - Lire un programme bloc par bloc.
        - Repérer ses points forts et ses points à travailler.
pourquoi:
    - En 5e, tu as étudié l’éolienne, le monte-charge, le tracker et la cuve d’eau, et tu as programmé un jeu avec Arcade.
    - 'Aujourd’hui, un petit diagnostic sans note sévère : il sert à savoir d’où tu pars. En 4e, tu iras plus loin : c’est toi qui identifieras, choisiras et proposeras.'
activites:
    -   id: a01
        titre: Les deux chaînes
        contenu:
            -   type: tableau
                titre: Rappel de 5e
                colonnes:
                    - Chaîne
                    - Fonctions
                    - Exemple sur le monte-charge
                lignes:
                    -   - Information
                        - Acquérir → traiter → communiquer
                        - Bouton → carte micro:bit → écran
                    -   - Énergie
                        - Alimenter → convertir → transmettre
                        - Alimentation → moteur → poulie et câble
            -   type: paragraphe
                texte: 'Exemple expliqué : sur l’éolienne, le moteur de lecteur CD utilisé en génératrice convertit l’énergie de mouvement en énergie électrique : c’est la fonction « convertir ».'
        questions:
            -   id: q01
                type: tableau
                enonce: Pour chaque constituant du tracker, écris sa fonction.
                colonnes:
                    - Constituant
                    - Fonction
                lignes:
                    -   - Capteur de lumière
                        - ''
                    -   - Carte micro:bit
                        - ''
                    -   - Servomoteur
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
            -   id: q02
                type: qcm
                enonce: Sur l’éolienne, quelle énergie entre dans le rotor ?
                choix:
                    -   id: a
                        texte: L’énergie du vent (énergie de mouvement de l’air).
                    -   id: b
                        texte: L’énergie électrique.
                    -   id: c
                        texte: L’énergie lumineuse.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a02
        titre: Lire un programme
        transition: Tu reconnais les deux chaînes. Vérifions maintenant la lecture d’un programme.
        contenu:
            -   type: code
                texte: "quand le bouton A est appuyé\n    si lumière > 100 alors\n        afficher « JOUR »\n    sinon\n        afficher « NUIT »"
            -   type: paragraphe
                texte: 'Rappel du réflexe n° 9 : on lit bloc par bloc : quand ? quelle condition ? quelle action ?'
        questions:
            -   id: q01
                type: qcm
                enonce: La lumière vaut 40 et on appuie sur A. Qu’affiche la carte ?
                choix:
                    -   id: a
                        texte: NUIT
                    -   id: b
                        texte: JOUR
                    -   id: c
                        texte: Rien
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Explique ce que fait ce programme, en une ou deux phrases.
                aide: 'Bloc par bloc : quand ? quelle condition ? quelle action ?'
    -   id: a03
        titre: Mes réflexes et mon objectif
        transition: Tu as révisé les chaînes et la lecture d’un programme. Fais le point sur tes réflexes.
        contenu:
            -   type: tableau
                titre: Les dix réflexes de 5e
                colonnes:
                    - Réflexe
                    - Ce que je fais
                lignes:
                    -   - R1
                        - Je repère le verbe de la question.
                    -   - R2
                        - « D’après le document… »
                    -   - R3
                        - Une phrase qui reprend les mots de la question.
                    -   - R4
                        - Je justifie avec « car ».
                    -   - R5
                        - J’écris l’unité.
                    -   - R6
                        - Ligne × colonne dans un tableau.
                    -   - R7
                        - Je complète un schéma bloc.
                    -   - R8
                        - Une seule chose à la fois dans un test.
                    -   - R9
                        - Je lis un programme bloc par bloc.
                    -   - R10
                        - Je gère mon temps.
        questions:
            -   id: q01
                type: texte
                enonce: Quel réflexe maîtrises-tu le mieux ? Donne un exemple où tu l’as utilisé.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
            -   id: q02
                type: texte
                enonce: Quel réflexe dois-tu travailler cette année ? Pourquoi ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Les réflexes R11 à R16 arrivent cette année.
        questions:
            -   id: q01
                type: texte
                enonce: Invente un réflexe qui t’aiderait au brevet et qui n’est pas dans la liste.
                aide: Une idée réaliste + « Cela permet de… ».
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as fait ton diagnostic. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : que sais-tu déjà faire en technologie, et sur quoi vas-tu progresser en 4e ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Chaîne d’information : acquérir, traiter, communiquer. Chaîne d’énergie : alimenter, convertir, transmettre.'
    - Les réflexes R1 à R10 restent valables en 4e.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
