titre: 'Séance 29 : Bilan : présenter sa pale'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Notre nouvelle pale répond-elle à notre objectif, et comment le montrer ?
competences_bo:
    - Imaginer, concevoir et réaliser une ou des solutions en réponse à un besoin, à des exigences (de développement durable, par exemple) ou à la nécessité d’améliorations dans une démarche de créativité
    - Valider les solutions techniques par des simulations ou par des protocoles de tests
objectifs:
    connaissances:
        - 'Présenter une solution : objectif, modification, preuves, limites.'
    competences:
        - Présenter sa pale avec des arguments.
        - Évaluer la pale d’un autre groupe.
pourquoi:
    - Depuis la séance 25, tu as étudié les procédés, la CAO, la modification du rotor et la rigidité.
    - Aujourd’hui, chaque groupe présente sa pale en 2 minutes ; la classe choisit celle qui sera imprimée, si l’imprimante est disponible.
activites:
    -   id: a01
        titre: Préparer la présentation
        consigne: 'Tu vas préparer la présentation orale de la pale de ton groupe (séances 27 et 28), en 2 minutes. On attend quatre phrases : objectif, modification, preuve, limite.'
        contenu:
            -   type: etapes
                elements:
                    - Relis tes réponses des séances 27 et 28.
                    - 'Écris une phrase par point : objectif, modification, preuve, limite.'
                    - Entraîne-toi à la dire en 2 minutes.
            -   type: paragraphe
                texte: 'Pourquoi quatre points ? Ce sont les questions que pose toujours un jury : qu’avez-vous voulu faire, fait, prouvé, et que reste-t-il ?'
        questions:
            -   id: q01
                type: texte
                enonce: Écris ta présentation en quatre phrases (objectif, modification, preuve, limite).
                aide: Combien d’éléments sont demandés ?
    -   id: a02
        titre: Écouter et évaluer
        transition: Chaque groupe présente. Évalue les autres.
        consigne: Tu vas écouter la présentation d’un autre groupe et l’évaluer sur les quatre points. On attend une évaluation et un conseil précis et bienveillant.
        contenu:
            -   type: etapes
                elements:
                    - Écoute la présentation d’un autre groupe.
                    - Pour chaque point (objectif, modification, preuve, limite), note oui / en partie / non.
                    - Écris un conseil bienveillant et précis.
            -   type: paragraphe
                texte: Pourquoi évaluer les autres ? En repérant ce qui est clair chez les autres, on apprend à mieux présenter soi-même.
        questions:
            -   id: q01
                type: texte
                enonce: Évalue un autre groupe sur les quatre points et donne un conseil.
                aide: Combien d’éléments sont demandés ?
    -   id: a03
        titre: Choisir la pale à imprimer
        transition: Toutes les pales ont été présentées. Il faut en choisir une.
        consigne: Tu vas choisir, parmi les pales présentées, celle que la classe imprimera. On attend un choix justifié par une preuve (test, mesure) présentée par le groupe.
        contenu:
            -   type: etapes
                elements:
                    - Compare les pales présentées.
                    - Choisis celle qui répond le mieux à son objectif, avec la meilleure preuve.
                    - Justifie ton vote.
            -   type: paragraphe
                texte: Pourquoi voter avec une justification ? Un choix de projet se décide sur des preuves, pas sur la préférence.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle pale choisis-tu pour l’impression ? Justifie avec une preuve présentée.
                aide: Pense à « car » (réflexe n° 4).
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une pale imprimée se fabrique en deux heures environ.
        questions:
            -   id: q01
                type: texte
                enonce: Quel test ferais-tu en premier sur la pale imprimée ?
                aide: Attendu ou observé ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Les présentations sont faites. Fais le bilan.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : votre pale répond-elle à votre objectif ? Qu’as-tu appris en CAO ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Présenter une solution : objectif, modification, preuves, limites.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
