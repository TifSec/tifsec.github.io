titre: 'Séance 29 : Bilan : présenter sa pale'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Notre nouvelle pale répond-elle à notre objectif, et comment le montrer ?
competences_bo:
    - Imaginer, concevoir et réaliser une ou des solutions en réponse à un besoin, à des exigences (de développement durable, par exemple) ou à la nécessité d’améliorations dans une démarche de créativité
    - Valider les solutions techniques par des simulations ou par des protocoles de tests
objectifs:
    connaissances:
        - 'Présenter une solution : objectif, modification, preuves (tests ou calculs), limites.'
    competences:
        - Présenter sa pale avec des arguments.
        - Évaluer la pale d’un autre groupe.
pourquoi:
    - Depuis la séance 25, tu as étudié les procédés, la CAO, la modification du rotor et la rigidité.
    - Aujourd’hui, chaque groupe présente sa pale en 2 minutes. La classe choisit celle qui sera imprimée, si l’imprimante est disponible.
activites:
    -   id: a01
        titre: Préparer sa présentation
        contenu:
            -   type: liste
                elements:
                    - 1. Notre objectif.
                    - 2. Notre modification (avant / après).
                    - '3. Nos preuves : test de flexion, masse estimée, raisonnement.'
                    - 4. Les limites.
        questions:
            -   id: q01
                type: texte
                enonce: Écris ta présentation en quatre phrases (une par point).
                aide: Combien d’éléments sont demandés ?
    -   id: a02
        titre: Écouter et évaluer
        transition: Chaque groupe présente. Évalue les autres.
        questions:
            -   id: q01
                type: texte
                enonce: 'Évalue un autre groupe : objectif clair ? modification expliquée ? preuve ? limite ? Écris un conseil.'
                aide: Pense à « car » (réflexe n° 4).
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une pale imprimée peut se fabriquer en deux heures.
        questions:
            -   id: q01
                type: texte
                enonce: Quel test ferais-tu en premier sur la pale imprimée ?
                aide: Attendu ou observé ?
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Les présentations sont faites. Fais le bilan.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : votre pale répond-elle à votre objectif ? Qu’as-tu appris en CAO ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Présenter une solution : objectif, modification, preuves, limites.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
