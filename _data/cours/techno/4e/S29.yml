titre: "La réparation répond-elle à l’exigence ?"
theme: "Dépanner par une méthode"
problematique: "La réparation répond-elle à l’exigence ?"
pourquoi: "On compare avant et après avec le même test et le même critère."
application: "Vérifier une cause avant de remplacer une pièce évite des réparations inutiles."
lien_precedent: "Après Comment suivre une procédure de réparation sans sauter d’étape ?, une nouvelle mission t’aide à réutiliser tes méthodes."
prerequis:
    - "Tu peux relire la séance précédente (Comment suivre une procédure de réparation sans sauter d’étape ?) si nécessaire."
notions:
    - titre: "Un exemple expliqué"
      texte: "Avant, l’écran ne s’allumait pas. Après, je refais le même test. S’il s’allume, ce critère est réussi ; d’autres restent à vérifier."
objectifs:
    connaissances:
        - "On compare avant et après avec le même test et le même critère."
    competences:
        - "Compléter un tableau avant/après et comparer les résultats à l’exigence."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : On compare avant et après avec le même test et le même critère."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Compléter un tableau avant/après et comparer les résultats à l’exigence."
    - type: paragraphe
      texte: "Dans la vie réelle : Vérifier une cause avant de remplacer une pièce évite des réparations inutiles."
activites:
    - id: a01
      titre: "1. Comprendre la mission"
      pourquoi: "On commence par un exemple guidé : il montre une méthode avant que tu l’essaies."
      demarche:
          - Lis la situation.
          - Suis les étapes de l’exemple.
          - Repère la donnée qui aide à répondre.
      contenu:
          - type: paragraphe
            texte: "Avant, l’écran ne s’allumait pas. Après, je refais le même test. S’il s’allume, ce critère est réussi ; d’autres restent à vérifier."
      questions:
          - id: q01
            type: texte
            enonce: "Pourquoi répéter le même test après la réparation ?"
            aide: "Relis l’exemple et repère l’information qui répond à la question."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
            aide: "Une ou deux phrases suffisent."
    - id: a02
      titre: "2. À toi d’essayer"
      pourquoi: "Tu as vu la méthode ; maintenant, applique-la dans une tâche que tu peux vérifier."
      demarche:
          - Réalise les étapes dans l’ordre.
          - Note le résultat attendu.
          - Compare-le au résultat observé.
      consigne: "Compléter un tableau avant/après et comparer les résultats à l’exigence."
      questions:
          - id: q01
            type: texte
            enonce: "Quel résultat observes-tu ? Décris ton essai."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
      ressources:
          - type: lien
            titre: "Éduscol — Technologie au cycle 4"
            url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
    - id: a03
      titre: "3. Réutiliser la méthode"
      pourquoi: "Un nouvel exemple t’aide à voir où cette méthode peut encore servir."
      contenu:
          - type: paragraphe
            texte: "Reprends la méthode avec une nouvelle valeur, un autre document ou une autre situation du dossier."
      questions:
          - id: q01
            type: texte
            enonce: "Quelle information permet de justifier ta conclusion ? Quelle limite reste à vérifier ?"
    - id: a04
      titre: "4. Ce que tu retiens"
      pourquoi: "Tu termines en gardant une idée et une méthode pour la prochaine séance."
      demarche:
          - Relis les deux éléments à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "On compare avant et après avec le même test et le même critère."
    - "Pour vérifier, je compare une réponse ou un essai à une donnée précise."
bilan: "Je peux expliquer ce que j’ai appris et montrer une réponse ou un essai comme preuve."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie cycle 4 : cette séance travaille on compare avant et après avec le même test et le même critère.. Elle contribue progressivement aux compétences de fin de cycle."
    - type: lien
      titre: "Ministère — Programme de Technologie du cycle 4, BO 2024"
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
    - type: lien
      titre: "Éduscol — Technologie au cycle 4"
      url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
