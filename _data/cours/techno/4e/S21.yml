titre: 'Séance 21 : L’éolienne produit-elle encore avec un vent faible ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Comment proposer et mener un protocole pour savoir si l’éolienne produit avec un vent faible ?
competences_bo:
    - Valider les solutions techniques par des simulations ou par des protocoles de tests
objectifs:
    connaissances:
        - Un protocole précise ce que je change (une seule chose), ce que je mesure, et ce que je garde identique.
        - On répète les mesures et on note les résultats dans un tableau avant de conclure.
    competences:
        - Proposer un protocole (réflexe R15).
        - Mettre en œuvre le protocole et exploiter les résultats.
pourquoi:
    - En 5e, le protocole de mesure de l’éolienne était fourni. En séance 20, tu as choisi les appareils.
    - Aujourd’hui, c’est toi qui proposes le protocole. La classe choisira le meilleur, puis on le mettra en œuvre.
activites:
    -   id: a01
        titre: Proposer un protocole
        contenu:
            -   type: citation
                texte: 'Réflexe brevet n° 15 : j’écris ce que je change, ce que je mesure, ce que je garde identique.'
            -   type: paragraphe
                texte: 'Le ventilateur a trois vitesses : 1 (faible), 2, 3 (fort).'
        questions:
            -   id: q01
                type: tableau
                enonce: Écris ton protocole.
                colonnes:
                    - Rubrique
                    - Mon protocole
                lignes:
                    -   - Ce que je change
                        - ''
                    -   - Ce que je mesure (appareil, unité)
                        - ''
                    -   - Ce que je garde identique
                        - ''
                aide: Attendu ou observé ?
            -   id: q02
                type: texte
                enonce: Combien de fois mesures-tu pour chaque vitesse, et pourquoi ?
                aide: Attendu ou observé ?
    -   id: a02
        titre: Mesurer (poste maquette) et mettre en commun
        transition: La classe a choisi un protocole. Mettons-le en œuvre.
        contenu:
            -   type: paragraphe
                texte: 'Le protocole choisi par la classe est mis en œuvre (le professeur gère l’alimentation). Résultats mis en commun :'
            -   type: tableau
                titre: Document 1 — Exemple de résultats (valeurs inventées si la mesure n’a pas pu être faite)
                colonnes:
                    - Vitesse du ventilateur
                    - Tension (V), moyenne de la classe
                lignes:
                    -   - 1 (faible)
                        - '0,3'
                    -   - '2'
                        - '1,1'
                    -   - 3 (fort)
                        - '1,9'
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, l’éolienne produit-elle encore avec un vent faible ? Justifie avec les valeurs et l’unité.
                aide: « D’après le document… » (réflexe n° 2).
            -   id: q02
                type: nombre
                enonce: Combien de fois la tension est-elle plus grande en vent fort qu’en vent faible (arrondi à l’unité) ?
                aide: N’oublie pas l’unité (réflexe n° 5).
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une LED rouge s’allume à partir d’environ 1,6 V.
        questions:
            -   id: q01
                type: texte
                enonce: À quelles vitesses du ventilateur la LED s’allume-t-elle ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as proposé, mené et exploité un protocole. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment as-tu proposé et mené ton protocole, et que conclus-tu ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Protocole : je change une seule chose, je mesure (appareil, unité), je garde le reste identique ; je répète.'
    - Plus le vent est fort, plus l’éolienne produit.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
