titre: "Quelles pièces composent le monte-charge et que font-elles ?"
theme: "Systèmes, réseaux et échanges"
problematique: "Quelles pièces composent le monte-charge et que font-elles ?"
pourquoi: "Un constituant réalise une fonction ; plusieurs constituants répondent au besoin."
application: "Comprendre les appareils et les informations qu’ils échangent aide à mieux les utiliser."
lien_precedent: "Après Pix IA : comment fonctionne une IA et quels sont ses enjeux ?, une nouvelle mission t’aide à réutiliser tes méthodes."
prerequis:
    - "Tu peux relire la séance précédente (Pix IA : comment fonctionne une IA et quels sont ses enjeux ?) si nécessaire."
notions:
    - titre: "Un exemple expliqué"
      texte: "Le bouton demande la montée, la carte décide, l’interface commande l’énergie et le moteur entraîne la plateforme. Chaque pièce a un rôle différent."
objectifs:
    connaissances:
        - "Un constituant réalise une fonction ; plusieurs constituants répondent au besoin."
    competences:
        - "Relier quatre pièces du monte-charge à leur rôle et distinguer information et énergie."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Un constituant réalise une fonction ; plusieurs constituants répondent au besoin."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Relier quatre pièces du monte-charge à leur rôle et distinguer information et énergie."
    - type: paragraphe
      texte: "Dans la vie réelle : Comprendre les appareils et les informations qu’ils échangent aide à mieux les utiliser."
activites:
    - id: a01
      titre: "1. Comprendre la mission"
      pourquoi: "On commence par un exemple guidé : il montre une méthode avant que tu l’essaies."
      demarche:
          - Lis la situation.
          - Suis les étapes de l’exemple.
          - Repère la donnée qui aide à répondre.
      contenu:
          - type: paragraphe
            texte: "Le bouton demande la montée, la carte décide, l’interface commande l’énergie et le moteur entraîne la plateforme. Chaque pièce a un rôle différent."
      questions:
          - id: q01
            type: texte
            enonce: "Quel composant transforme l’énergie électrique en mouvement ?"
            aide: "Relis l’exemple et repère l’information qui répond à la question."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
            aide: "Une ou deux phrases suffisent."
    - id: a02
      titre: "2. À toi d’essayer"
      pourquoi: "Tu as vu la méthode ; maintenant, applique-la dans une tâche que tu peux vérifier."
      demarche:
          - Réalise les étapes dans l’ordre.
          - Note le résultat attendu.
          - Compare-le au résultat observé.
      consigne: "Relier quatre pièces du monte-charge à leur rôle et distinguer information et énergie."
      questions:
          - id: q01
            type: texte
            enonce: "Quel résultat observes-tu ? Décris ton essai."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
      ressources:
          - type: lien
            titre: "Éduscol — Technologie au cycle 4"
            url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
    - id: a03
      titre: "3. Réutiliser la méthode"
      pourquoi: "Un nouvel exemple t’aide à voir où cette méthode peut encore servir."
      contenu:
          - type: paragraphe
            texte: "Reprends la méthode avec une nouvelle valeur, un autre document ou une autre situation du dossier."
      questions:
          - id: q01
            type: texte
            enonce: "Quelle information permet de justifier ta conclusion ? Quelle limite reste à vérifier ?"
    - id: a04
      titre: "4. Ce que tu retiens"
      pourquoi: "Tu termines en gardant une idée et une méthode pour la prochaine séance."
      demarche:
          - Relis les deux éléments à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Un constituant réalise une fonction ; plusieurs constituants répondent au besoin."
    - "Pour vérifier, je compare une réponse ou un essai à une donnée précise."
bilan: "Je peux expliquer ce que j’ai appris et montrer une réponse ou un essai comme preuve."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie cycle 4 : cette séance travaille un constituant réalise une fonction ; plusieurs constituants répondent au besoin.. Elle contribue progressivement aux compétences de fin de cycle."
    - type: lien
      titre: "Ministère — Programme de Technologie du cycle 4, BO 2024"
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
    - type: lien
      titre: "Éduscol — Technologie au cycle 4"
      url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
