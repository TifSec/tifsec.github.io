titre: 'Séance 21 : L’éolienne produit-elle encore avec un vent faible ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Comment proposer et mener un protocole pour savoir si l’éolienne produit avec un vent faible ?
competences_bo:
    - Valider les solutions techniques par des simulations ou par des protocoles de tests
objectifs:
    connaissances:
        - Un protocole précise ce que je change (une seule chose), ce que je mesure, et ce que je garde identique.
        - On répète les mesures avant de conclure.
    competences:
        - Proposer un protocole (réflexe R15).
        - Exploiter des résultats.
pourquoi:
    - En 5e, le protocole de mesure était fourni. En séance 20, tu as choisi les appareils.
    - Aujourd’hui, c’est toi qui proposes le protocole ; la classe choisit le meilleur et on le met en œuvre.
activites:
    -   id: a01
        titre: Proposer un protocole
        consigne: 'Tu vas écrire le protocole d’un essai sur l’éolienne de la classe : produit-elle encore une tension quand le ventilateur souffle faiblement (vitesse 1 sur 3) ? Tu t’appuies sur le réflexe R15. On attend trois lignes précises : ce que tu changes, ce que tu mesures (appareil, unité), ce que tu gardes identique.'
        contenu:
            -   type: citation
                texte: 'Réflexe brevet n° 15 : j’écris ce que je change, ce que je mesure, ce que je garde identique.'
            -   type: etapes
                elements:
                    - Lis le réflexe R15.
                    - 'Le ventilateur a trois vitesses : 1 (faible), 2, 3 (fort).'
                    - Écris ce que tu changes, ce que tu mesures (appareil, unité), ce que tu gardes identique.
            -   type: paragraphe
                texte: Pourquoi garder le reste identique ? Si on change deux choses à la fois, on ne sait pas laquelle explique la différence.
        questions:
            -   id: q01
                type: tableau
                enonce: Écris ton protocole pour savoir si l’éolienne de la classe produit encore une tension quand le ventilateur est sur la vitesse 1 (vent faible).
                colonnes:
                    - Rubrique
                    - Mon protocole
                lignes:
                    -   - Ce que je change
                        - ''
                    -   - Ce que je mesure (appareil, unité)
                        - ''
                    -   - Ce que je garde identique
                        - ''
                aide: 'Applique le réflexe R15 à l’éolienne de la classe : une seule chose change (le vent), une grandeur est mesurée (avec quel appareil ?), tout le reste reste pareil.'
    -   id: a02
        titre: Répéter les mesures
        transition: Ton protocole est écrit. Est-ce qu’une mesure suffit ?
        consigne: Tu vas décider combien de fois répéter chaque mesure de ton protocole de la mission 1. On attend un nombre de mesures et une explication de ce que tu fais des résultats.
        contenu:
            -   type: etapes
                elements:
                    - Demande-toi si une seule mesure suffit.
                    - Choisis combien de fois tu mesures.
                    - Explique ce que tu fais des résultats.
            -   type: paragraphe
                texte: 'Pourquoi répéter ? Une mesure varie un peu (souffle irrégulier, lecture) : la moyenne de plusieurs mesures est plus fiable.'
        questions:
            -   id: q01
                type: texte
                enonce: Combien de fois mesures-tu pour chaque vitesse, et pourquoi ?
                aide: 'Repense à la séance 26 de 5e : une seule mesure peut varier. Combien en fais-tu, et que calcules-tu ensuite ?'
    -   id: a03
        titre: Mesurer et conclure (poste maquette)
        transition: La classe a choisi un protocole. Mettons-le en œuvre.
        consigne: Tu vas exploiter les résultats de l’essai réalisé par la classe sur l’éolienne (document 1). On attend une conclusion avec des valeurs et leur unité, et un calcul de comparaison.
        contenu:
            -   type: tableau
                titre: Document 1 — Exemple de résultats (à remplacer par ceux de la classe)
                colonnes:
                    - Vitesse du ventilateur
                    - Tension (V), moyenne de la classe
                lignes:
                    -   - 1 (faible)
                        - '0,3'
                    -   - '2'
                        - '1,1'
                    -   - 3 (fort)
                        - '1,9'
            -   type: etapes
                elements:
                    - Le protocole choisi par la classe est mis en œuvre (le professeur gère l’alimentation).
                    - Lis les résultats mis en commun (document 1).
                    - Conclus avec les valeurs et l’unité.
            -   type: paragraphe
                texte: Pourquoi conclure avec des valeurs ? Une conclusion chiffrée se vérifie ; « elle produit peu » ne se vérifie pas.
        questions:
            -   id: q01
                type: texte
                enonce: L’éolienne produit-elle encore avec un vent faible ? Justifie avec les valeurs et l’unité.
                aide: 'Dans le document 1 (ou vos mesures), lis la tension à la vitesse 1 : est-elle nulle ? Compare-la à la vitesse 3, avec l’unité.'
            -   id: q02
                type: nombre
                enonce: Combien de fois la tension est-elle plus grande en vent fort qu’en vent faible (arrondi à l’unité) ?
                aide: Divise la tension en vent fort par la tension en vent faible, puis arrondis à l’unité.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une LED rouge s’allume à partir d’environ 1,6 V.
        questions:
            -   id: q01
                type: texte
                enonce: À quelles vitesses la LED s’allume-t-elle ?
                aide: 'Une LED a besoin d’une tension minimale pour s’allumer : regarde à quelles vitesses la tension mesurée l’atteint.'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as proposé, mené et exploité un protocole. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment as-tu mené ton protocole, et que conclus-tu ?'
                aide: Résume ton protocole (je change, je mesure, je garde), le nombre de mesures, puis ta conclusion chiffrée.
retenir:
    - 'Protocole : je change une seule chose, je mesure, je garde le reste identique ; je répète.'
    - Plus le vent est fort, plus l’éolienne produit.
sources:
