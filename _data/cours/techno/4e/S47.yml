titre: 'Séance 47 : Impress n° 1 : préparer la revue de projet'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment préparer un diaporama clair et des notes pour présenter sans lire ?
competences_bo:
    - Imaginer, concevoir et réaliser une ou des solutions en réponse à un besoin, à des exigences (de développement durable, par exemple) ou à la nécessité d’améliorations dans une démarche de créativité
objectifs:
    connaissances:
        - Le masque des diapositives applique la même mise en forme à toutes les diapositives (logo, couleurs, pied de page).
        - 'Les notes de l’orateur contiennent ce qu’on va dire : elles ne s’affichent que pour l’orateur.'
    competences:
        - Utiliser le masque des diapositives.
        - Rédiger des notes de l’orateur.
pourquoi:
    - En 5e, tu as fait un diaporama simple. Depuis la séance 41, ton groupe a mené le projet du tracker communicant.
    - Aujourd’hui, tu prépares la revue de projet avec un diaporama plus professionnel.
activites:
    -   id: a01
        titre: Le masque
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Impress, enregistre sous 4e_S47_groupe.odp.
                    - 'Affichage > Masque des diapos : choisis une couleur de fond et ajoute le nom du projet en bas.'
                    - 'Ferme le masque : toutes les diapositives ont la même présentation.'
        questions:
            -   id: q01
                type: qcm
                enonce: À quoi sert le masque des diapositives ?
                choix:
                    -   id: a
                        texte: À appliquer la même mise en forme à toutes les diapositives en une seule fois.
                    -   id: b
                        texte: À cacher les diapositives.
                    -   id: c
                        texte: À ajouter des animations.
                aide: Relis l’exemple expliqué.
    -   id: a02
        titre: Le contenu
        transition: La présentation a un style commun. Construis le contenu.
        contenu:
            -   type: liste
                elements:
                    - 1. Le besoin et la nouvelle fonction.
                    - 2. Le cahier des charges.
                    - 3. Les constituants ajoutés.
                    - 4. Les programmes (émetteur, récepteur).
                    - 5. Les tests (portée) et les mesures (graphique).
                    - 6. Bilan et améliorations.
        questions:
            -   id: q01
                type: texte
                enonce: Écris le titre et les deux idées principales de la diapositive 5.
                aide: Combien d’éléments sont demandés ?
    -   id: a03
        titre: Les notes de l’orateur
        transition: Le diaporama est prêt. Prépare ce que tu vas dire.
        contenu:
            -   type: etapes
                elements:
                    - Affichage > Notes.
                    - Sous chaque diapositive, écris ce que tu diras (3 ou 4 phrases).
        questions:
            -   id: q01
                type: texte
                enonce: Recopie les notes de l’orateur de la diapositive que tu présenteras.
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: En mode présentation, Impress peut afficher les notes sur l’écran de l’ordinateur et la diapositive sur le vidéoprojecteur.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi est-ce pratique ?
                aide: Pense à « car » (réflexe n° 4).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tout est prêt pour la revue. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment préparer un diaporama clair et présenter sans lire ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Masque des diapositives : mise en forme commune.'
    - 'Notes de l’orateur : ce que je dis, invisible pour le public.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
