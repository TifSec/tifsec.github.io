titre: 'Séance 23 : Quel matériau pour une pale ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Quel matériau choisir pour une pale d’éolienne, et quelles étapes du cycle de vie ce choix change-t-il ?
competences_bo:
    - Caractériser et choisir un objet ou un système technique selon différents critères
    - Imaginer, concevoir et réaliser une ou des solutions en réponse à un besoin, à des exigences (de développement durable, par exemple) ou à la nécessité d’améliorations dans une démarche de créativité
objectifs:
    connaissances:
        - 'Choisir un matériau : propriétés (légèreté, rigidité, résistance à l’eau et au soleil), procédé de fabrication possible, coût, impact environnemental.'
        - 'Le choix du matériau touche toutes les étapes du cycle de vie : extraction, fabrication, utilisation, fin de vie.'
    competences:
        - Comparer des matériaux avec des critères.
        - Relier un choix de matériau aux étapes du cycle de vie.
pourquoi:
    - En 5e, tu as étudié les propriétés des matériaux et le cycle de vie. En séance 22, tu as comparé deux sources d’énergie.
    - Aujourd’hui, tu choisis le matériau d’une nouvelle pale pour l’éolienne.
activites:
    -   id: a01
        titre: Comparer trois matériaux
        contenu:
            -   type: tableau
                titre: Document 1 — Trois matériaux (valeurs indicatives)
                colonnes:
                    - Critère
                    - PLA (plastique imprimé)
                    - Bois (contreplaqué)
                    - Aluminium
                lignes:
                    -   - Masse d’une pale
                        - 15 g
                        - 25 g
                        - 30 g
                    -   - Rigidité
                        - Moyenne
                        - Bonne
                        - Très bonne
                    -   - Procédé au collège
                        - Impression 3D
                        - Découpe laser
                        - Impossible
                    -   - Fin de vie
                        - Recyclable (filière rare)
                        - Biodégradable / valorisable
                        - Très bien recyclé
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 1, quel matériau ne peut pas être mis en forme au collège ?
                choix:
                    -   id: a
                        texte: L’aluminium.
                    -   id: b
                        texte: Le PLA.
                    -   id: c
                        texte: Le bois.
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: texte
                enonce: Pour une pale qui doit être légère et fabriquée au collège, quel matériau choisis-tu ? Justifie avec deux critères.
                aide: Pense à « car » (réflexe n° 4).
    -   id: a02
        titre: Le cycle de vie
        transition: Le matériau choisi a des conséquences tout au long de la vie de la pale.
        contenu:
            -   type: paragraphe
                texte: 'Rappel : extraction des matières premières → fabrication → transport → utilisation → fin de vie.'
        questions:
            -   id: q01
                type: tableau
                enonce: Pour la pale en PLA, écris une conséquence du choix à chaque étape.
                colonnes:
                    - Étape
                    - Conséquence
                lignes:
                    -   - Extraction
                        - ''
                    -   - Fabrication
                        - ''
                    -   - Fin de vie
                        - ''
                aide: Ligne × colonne.
    -   id: a03
        titre: Arbitrer
        transition: 'Aucun matériau n’est parfait : il faut arbitrer.'
        questions:
            -   id: q01
                type: texte
                enonce: Le bois est plus rigide et se valorise mieux en fin de vie. Dans quel cas le choisirais-tu plutôt que le PLA ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Les vraies pales d’éoliennes sont en matériaux composites (fibres de verre et résine).
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi leur recyclage pose-t-il problème ?
                aide: Pense à « car » (réflexe n° 4).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as choisi un matériau en pensant à tout son cycle de vie. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quel matériau pour la pale, et quelles étapes du cycle de vie ce choix change-t-il ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Choisir un matériau : propriétés, procédé, coût, impact.'
    - 'Le choix touche tout le cycle de vie : extraction, fabrication, utilisation, fin de vie.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
