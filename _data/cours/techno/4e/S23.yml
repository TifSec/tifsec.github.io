titre: 'Séance 23 : Quel matériau pour une pale ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Quel matériau choisir pour une pale, et quelles étapes du cycle de vie ce choix change-t-il ?
competences_bo:
    - Caractériser et choisir un objet ou un système technique selon différents critères
    - Imaginer, concevoir et réaliser une ou des solutions en réponse à un besoin, à des exigences (de développement durable, par exemple) ou à la nécessité d’améliorations dans une démarche de créativité
objectifs:
    connaissances:
        - 'Choisir un matériau : propriétés (légèreté, rigidité, résistance), procédé possible, coût, impact.'
        - Le choix touche toutes les étapes du cycle de vie.
    competences:
        - Comparer des matériaux avec des critères.
        - Relier un choix aux étapes du cycle de vie.
pourquoi:
    - En 5e, tu as étudié les matériaux et le cycle de vie. En séance 22, tu as comparé deux sources.
    - Aujourd’hui, tu choisis le matériau d’une nouvelle pale.
activites:
    -   id: a01
        titre: Comparer trois matériaux
        consigne: Tu vas comparer trois matériaux possibles pour une pale d’éolienne, à partir du document 1. On attend le matériau impossible à mettre en forme au collège et un choix justifié par deux critères.
        contenu:
            -   type: tableau
                titre: Document 1 (valeurs indicatives)
                colonnes:
                    - Critère
                    - PLA (imprimé)
                    - Bois (contreplaqué)
                    - Aluminium
                lignes:
                    -   - Masse d’une pale
                        - 15 g
                        - 25 g
                        - 30 g
                    -   - Rigidité
                        - Moyenne
                        - Bonne
                        - Très bonne
                    -   - Procédé au collège
                        - Impression 3D
                        - Découpe laser
                        - Impossible
                    -   - Fin de vie
                        - Recyclage difficile
                        - Valorisable
                        - Très bien recyclé
            -   type: etapes
                elements:
                    - Lis le document 1.
                    - Élimine le matériau qu’on ne peut pas mettre en forme au collège.
                    - Compare les deux autres sur la masse et la rigidité.
            -   type: paragraphe
                texte: Pourquoi éliminer d’abord ? Un matériau idéal sur le papier ne sert à rien si on ne peut pas le fabriquer.
        questions:
            -   id: q01
                type: qcm
                enonce: Quel matériau ne peut pas être mis en forme au collège ?
                choix:
                    -   id: a
                        texte: L’aluminium.
                    -   id: b
                        texte: Le PLA.
                    -   id: c
                        texte: Le bois.
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: texte
                enonce: Pour une pale légère fabriquée au collège, quel matériau choisis-tu ? Justifie avec deux critères.
                aide: Pense à « car » (réflexe n° 4).
    -   id: a02
        titre: Le cycle de vie de la pale
        transition: Le matériau choisi a des conséquences tout au long de la vie de la pale.
        consigne: Tu vas suivre le cycle de vie d’une pale en PLA, de l’extraction à la fin de vie. On attend une conséquence du choix du PLA à trois étapes.
        contenu:
            -   type: etapes
                elements:
                    - 'Rappelle-toi les étapes : extraction, fabrication, transport, utilisation, fin de vie.'
                    - Pour la pale en PLA, cherche ce qui se passe à trois étapes.
                    - Remplis le tableau.
            -   type: paragraphe
                texte: 'Pourquoi tout le cycle de vie ? Un choix bon à la fabrication peut être mauvais en fin de vie : il faut regarder l’ensemble.'
        questions:
            -   id: q01
                type: tableau
                enonce: Pour la pale en PLA, écris une conséquence du choix à chaque étape.
                colonnes:
                    - Étape
                    - Conséquence
                lignes:
                    -   - Extraction
                        - ''
                    -   - Fabrication
                        - ''
                    -   - Fin de vie
                        - ''
                aide: Ligne × colonne.
    -   id: a03
        titre: Arbitrer
        transition: Aucun matériau n’est parfait.
        consigne: Tu vas arbitrer entre le bois et le PLA pour la pale. On attend une situation où le bois est le meilleur choix, justifiée.
        contenu:
            -   type: etapes
                elements:
                    - Relis les avantages du bois (rigidité, fin de vie).
                    - Imagine une situation où ces avantages comptent plus que la masse.
                    - Écris ton arbitrage.
            -   type: paragraphe
                texte: 'Pourquoi arbitrer ? Aucun matériau n’est parfait : choisir, c’est accepter un inconvénient pour un avantage plus important.'
        questions:
            -   id: q01
                type: texte
                enonce: Dans quel cas choisirais-tu le bois plutôt que le PLA ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Je m’entraîne
        transition: Tu as compris la méthode. Applique-la seul sur un cas nouveau.
        consigne: 'Tu vas appliquer seul la méthode sur un cas nouveau : une cale plate et rigide du monte-charge, à découper au collège. On attend un matériau du document 1 justifié par deux critères.'
        contenu:
            -   type: etapes
                elements:
                    - Lis la situation de la pièce du monte-charge.
                    - Choisis un matériau parmi ceux du document 1.
                    - Justifie avec deux critères.
            -   type: paragraphe
                texte: Pourquoi un autre objet ? Choisir un matériau se fait toujours selon l’usage de la pièce.
        questions:
            -   id: q01
                type: texte
                enonce: Une cale du monte-charge doit être plate, rigide et découpée au collège. Quel matériau ? Justifie avec deux critères.
                aide: Pense à « car » (réflexe n° 4).
    -   id: a05
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Les vraies pales d’éoliennes sont en composites (fibres et résine).
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi leur recyclage pose-t-il problème ?
                aide: Pense à « car » (réflexe n° 4).
    -   id: a06
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as choisi un matériau en pensant à tout son cycle de vie. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quel matériau pour la pale, et quelles étapes du cycle de vie ce choix change-t-il ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Choisir un matériau : propriétés, procédé, coût, impact.'
    - Le choix touche tout le cycle de vie.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
