titre: "Que montre le modèle virtuel et que ne montre-t-il pas ?"
theme: "Systèmes, réseaux et échanges"
problematique: "Que montre le modèle virtuel et que ne montre-t-il pas ?"
pourquoi: "Un modèle représente certains aspects du réel ; ses limites doivent être précisées."
application: "Comprendre les appareils et les informations qu’ils échangent aide à mieux les utiliser."
lien_precedent: "Après Quelles pièces composent le monte-charge et que font-elles ?, une nouvelle mission t’aide à réutiliser tes méthodes."
prerequis:
    - "Tu peux relire la séance précédente (Quelles pièces composent le monte-charge et que font-elles ?) si nécessaire."
notions:
    - titre: "Un exemple expliqué"
      texte: "Le modèle peut montrer l’ordre donné au moteur. S’il ne représente pas le poids de la charge, il ne permet pas de conclure comment ce poids change la durée de montée."
objectifs:
    connaissances:
        - "Un modèle représente certains aspects du réel ; ses limites doivent être précisées."
    competences:
        - "Comparer trois observations du dossier au modèle virtuel. Classer ce qui est représenté et ce qui reste à vérifier."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Un modèle représente certains aspects du réel ; ses limites doivent être précisées."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Comparer trois observations du dossier au modèle virtuel. Classer ce qui est représenté et ce qui reste à vérifier."
    - type: paragraphe
      texte: "Dans la vie réelle : Comprendre les appareils et les informations qu’ils échangent aide à mieux les utiliser."
activites:
    - id: a01
      titre: "1. Comprendre la mission"
      pourquoi: "On commence par un exemple guidé : il montre une méthode avant que tu l’essaies."
      demarche:
          - Lis la situation.
          - Suis les étapes de l’exemple.
          - Repère la donnée qui aide à répondre.
      contenu:
          - type: paragraphe
            texte: "Le modèle peut montrer l’ordre donné au moteur. S’il ne représente pas le poids de la charge, il ne permet pas de conclure comment ce poids change la durée de montée."
      questions:
          - id: q01
            type: texte
            enonce: "Une simulation qui fonctionne prouve-t-elle que la maquette réelle est sûre ?"
            aide: "Relis l’exemple et repère l’information qui répond à la question."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
            aide: "Une ou deux phrases suffisent."
    - id: a02
      titre: "2. À toi d’essayer"
      pourquoi: "Tu as vu la méthode ; maintenant, applique-la dans une tâche que tu peux vérifier."
      demarche:
          - Réalise les étapes dans l’ordre.
          - Note le résultat attendu.
          - Compare-le au résultat observé.
      consigne: "Comparer trois observations du dossier au modèle virtuel. Classer ce qui est représenté et ce qui reste à vérifier."
      questions:
          - id: q01
            type: texte
            enonce: "Quel résultat observes-tu ? Décris ton essai."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
      ressources:
          - type: lien
            titre: "Éduscol — Technologie au cycle 4"
            url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
    - id: a03
      titre: "3. Réutiliser la méthode"
      pourquoi: "Un nouvel exemple t’aide à voir où cette méthode peut encore servir."
      contenu:
          - type: paragraphe
            texte: "Reprends la méthode avec une nouvelle valeur, un autre document ou une autre situation du dossier."
      questions:
          - id: q01
            type: texte
            enonce: "Quelle information permet de justifier ta conclusion ? Quelle limite reste à vérifier ?"
    - id: a04
      titre: "4. Ce que tu retiens"
      pourquoi: "Tu termines en gardant une idée et une méthode pour la prochaine séance."
      demarche:
          - Relis les deux éléments à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Un modèle représente certains aspects du réel ; ses limites doivent être précisées."
    - "Pour vérifier, je compare une réponse ou un essai à une donnée précise."
bilan: "Je peux expliquer ce que j’ai appris et montrer une réponse ou un essai comme preuve."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie cycle 4 : cette séance travaille un modèle représente certains aspects du réel ; ses limites doivent être précisées.. Elle contribue progressivement aux compétences de fin de cycle."
    - type: lien
      titre: "Ministère — Programme de Technologie du cycle 4, BO 2024"
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
    - type: lien
      titre: "Éduscol — Technologie au cycle 4"
      url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
