titre: 'Séance 22 : Éolienne ou panneau solaire du tracker ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Quelle source d’énergie choisir pour alimenter un petit capteur dans la cour ?
competences_bo:
    - Caractériser et choisir un objet ou un système technique selon différents critères
    - Imaginer, concevoir et réaliser une ou des solutions en réponse à un besoin, à des exigences (de développement durable, par exemple) ou à la nécessité d’améliorations dans une démarche de créativité
objectifs:
    connaissances:
        - 'On compare deux solutions avec des critères nommés et des chiffres : production, coût, entretien, impact.'
        - Le choix dépend du besoin.
    competences:
        - Comparer deux solutions avec des chiffres et des critères (réflexe R14).
        - Choisir et justifier.
pourquoi:
    - En séance 21, tu as mesuré l’éolienne. En 5e, tu as étudié le panneau du tracker.
    - Aujourd’hui, tu compares ces deux sources pour un besoin précis.
activites:
    -   id: a01
        titre: Lire les données
        consigne: 'Tu vas comparer deux sources d’énergie pour alimenter un petit capteur dans la cour : l’éolienne et le panneau solaire du tracker, à partir du document 1. On attend la meilleure solution pour chaque critère.'
        contenu:
            -   type: citation
                texte: 'Réflexe brevet n° 14 : je compare avec des chiffres et je nomme le critère.'
            -   type: tableau
                titre: Document 1 (valeurs inventées)
                colonnes:
                    - Critère
                    - Petite éolienne
                    - Petit panneau solaire
                lignes:
                    -   - Production moyenne par jour
                        - 2 Wh
                        - 5 Wh
                    -   - Prix
                        - 40 €
                        - 25 €
                    -   - Pièces en mouvement (usure)
                        - Oui
                        - Non
                    -   - Production la nuit
                        - Oui, s’il y a du vent
                        - Non
            -   type: etapes
                elements:
                    - Lis le réflexe R14.
                    - Lis le document 1 critère par critère.
                    - Pour chaque critère, désigne la meilleure solution.
            -   type: paragraphe
                texte: 'Pourquoi critère par critère ? Une solution est rarement la meilleure partout : on compare d’abord, on choisit ensuite.'
        questions:
            -   id: q01
                type: tableau
                enonce: Quelle solution est la meilleure pour chaque critère ?
                colonnes:
                    - Critère
                    - Meilleure solution
                lignes:
                    -   - Production par jour
                        - ''
                    -   - Prix
                        - ''
                    -   - Usure
                        - ''
                    -   - Nuit
                        - ''
                aide: Pour chaque ligne du document 1, compare les deux solutions et garde la meilleure. Attention, pour « nuit », pense à ce que fait un panneau sans soleil.
    -   id: a02
        titre: Choisir pour le besoin
        transition: Tu as comparé. Le choix dépend du besoin.
        consigne: Tu vas choisir la source qui répond au besoin du capteur de la cour (3 Wh par jour, de jour comme de nuit), décrit ci-dessous. On attend un choix justifié par deux critères chiffrés et le rôle de la batterie.
        contenu:
            -   type: paragraphe
                texte: Le capteur de la cour consomme 3 Wh par jour et doit envoyer une mesure toutes les heures, de jour comme de nuit. Il a une petite batterie.
            -   type: etapes
                elements:
                    - Lis le besoin du capteur.
                    - Vérifie quelle source couvre 3 Wh par jour.
                    - 'Pense à la nuit : que faut-il ajouter ?'
                    - Écris ton choix avec deux critères chiffrés.
            -   type: paragraphe
                texte: Pourquoi partir du besoin ? La « meilleure » solution est celle qui répond au besoin, pas celle qui gagne le plus de critères.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle source choisis-tu ? Justifie avec au moins deux critères chiffrés.
                aide: Choisis, puis cite au moins deux lignes du document 1 avec leurs valeurs et nomme chaque critère (réflexe R14).
            -   id: q02
                type: qcm
                enonce: Pourquoi la batterie est-elle nécessaire avec le panneau ?
                choix:
                    -   id: a
                        texte: Le panneau ne produit pas la nuit.
                    -   id: b
                        texte: Pour faire joli.
                    -   id: c
                        texte: Pour augmenter le prix.
                aide: Le capteur doit fonctionner jour et nuit. Le panneau produit-il la nuit ?
    -   id: a03
        titre: Et l’environnement ?
        transition: 'Il reste un critère : l’environnement.'
        consigne: Tu vas réfléchir à l’impact sur l’environnement de l’éolienne et du panneau solaire, de leur fabrication à leur fin de vie. On attend un impact pour chacune.
        contenu:
            -   type: etapes
                elements:
                    - Pense à la fabrication de chaque solution (matières, métaux).
                    - Pense à sa fin de vie.
                    - Écris un impact pour chacune.
            -   type: paragraphe
                texte: Pourquoi l’environnement ? Une source d’énergie « verte » a quand même un impact à sa fabrication.
        questions:
            -   id: q01
                type: texte
                enonce: Cite un impact sur l’environnement de chacune des deux solutions.
                aide: Pour chaque solution, pense à ce qu’il faut extraire ou fabriquer (matériaux, métaux) ou à ce qui s’use.
    -   id: a04
        titre: Je m’entraîne
        transition: Tu as compris la méthode. Applique-la seul sur un cas nouveau.
        consigne: 'Tu vas appliquer seul la méthode sur un cas nouveau : une lampe de jardin qui consomme 1 Wh par nuit. On attend un choix de source justifié par un chiffre du document 1.'
        contenu:
            -   type: etapes
                elements:
                    - Lis le besoin de la lampe de jardin.
                    - Compare les deux solutions avec un critère chiffré.
                    - Choisis et justifie.
            -   type: paragraphe
                texte: 'Pourquoi un autre besoin ? Le choix dépend du besoin : un autre besoin peut donner un autre choix.'
        questions:
            -   id: q01
                type: texte
                enonce: Pour une lampe de jardin qui s’allume 4 h chaque nuit (1 Wh), quelle source choisis-tu ? Justifie avec un chiffre.
                aide: Compare le besoin de la lampe (1 Wh par nuit) à ce que produit chaque source par jour d’après le document 1. Justifie avec un chiffre.
    -   id: a05
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: On peut combiner les deux sources.
        questions:
            -   id: q01
                type: texte
                enonce: Dans quelle situation combinerais-tu éolienne et panneau ?
                aide: 'Le vent souffle parfois la nuit et en hiver, le soleil surtout le jour et l’été : dans quel lieu les deux se complètent-ils ?'
    -   id: a06
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as comparé et choisi. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quelle source choisir pour le capteur de la cour ? Argumente avec des chiffres.'
                aide: Donne ta source pour le capteur de la cour et au moins deux critères chiffrés du document 1.
retenir:
    - 'Comparer : critères nommés + chiffres ; le choix dépend du besoin.'
    - Réflexe R14.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
