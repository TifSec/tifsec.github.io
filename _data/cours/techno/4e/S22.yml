titre: 'Séance 22 : Éolienne ou panneau solaire du tracker ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: 'Quelle source d’énergie choisir pour alimenter un petit capteur dans la cour : l’éolienne ou le panneau solaire ?'
competences_bo:
    - Caractériser et choisir un objet ou un système technique selon différents critères
    - Imaginer, concevoir et réaliser une ou des solutions en réponse à un besoin, à des exigences (de développement durable, par exemple) ou à la nécessité d’améliorations dans une démarche de créativité
objectifs:
    connaissances:
        - 'On compare deux solutions avec des critères nommés et des chiffres : production, coût, entretien, impact sur l’environnement.'
        - 'Une solution peut être meilleure sur un critère et moins bonne sur un autre : on pondère selon le besoin.'
    competences:
        - Comparer deux solutions avec des chiffres et des critères (réflexe R14).
        - Choisir et justifier.
pourquoi:
    - En séance 21, tu as mesuré la production de l’éolienne. En 5e, tu as étudié le panneau du tracker.
    - Aujourd’hui, tu compares ces deux sources pour un besoin précis.
activites:
    -   id: a01
        titre: Les données
        contenu:
            -   type: citation
                texte: 'Réflexe brevet n° 14 : je compare avec des chiffres et je nomme le critère.'
            -   type: tableau
                titre: Document 1 — Données comparées (valeurs inventées pour l’exercice)
                colonnes:
                    - Critère
                    - Petite éolienne
                    - Petit panneau solaire
                lignes:
                    -   - Production moyenne par jour dans la cour
                        - 2 Wh
                        - 5 Wh
                    -   - Prix
                        - 40 €
                        - 25 €
                    -   - Pièces en mouvement (usure)
                        - Oui
                        - Non
                    -   - Production la nuit
                        - Oui, s’il y a du vent
                        - Non
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, quelle solution est la meilleure pour chaque critère ?
                colonnes:
                    - Critère
                    - Meilleure solution
                lignes:
                    -   - Production par jour
                        - ''
                    -   - Prix
                        - ''
                    -   - Usure
                        - ''
                    -   - Nuit
                        - ''
                aide: Ligne × colonne.
    -   id: a02
        titre: Le besoin
        transition: Tu as comparé les solutions. Le choix dépend du besoin.
        contenu:
            -   type: paragraphe
                texte: Le capteur de la cour consomme 3 Wh par jour et doit envoyer une mesure toutes les heures, de jour comme de nuit. Il y a une petite batterie.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle source choisis-tu ? Justifie avec au moins deux critères et des chiffres.
                aide: Pense à « car » (réflexe n° 4).
            -   id: q02
                type: qcm
                enonce: Pourquoi la batterie est-elle nécessaire avec le panneau solaire ?
                choix:
                    -   id: a
                        texte: Parce que le panneau ne produit pas la nuit.
                    -   id: b
                        texte: Pour faire joli.
                    -   id: c
                        texte: Pour augmenter le prix.
                aide: Relis l’exemple expliqué.
    -   id: a03
        titre: Et l’environnement ?
        transition: 'Il reste un critère : l’environnement.'
        questions:
            -   id: q01
                type: texte
                enonce: Cite un impact sur l’environnement de chacune des deux solutions.
                aide: Combien d’éléments sont demandés ?
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: On peut combiner les deux sources.
        questions:
            -   id: q01
                type: texte
                enonce: Dans quelle situation combinerais-tu éolienne et panneau ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as comparé et choisi. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quelle source choisir pour le capteur de la cour ? Argumente.'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Comparer des solutions : critères nommés + chiffres ; le choix dépend du besoin.'
    - Réflexe R14.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
