titre: "Comment écrire une procédure que quelqu’un peut suivre ?"
theme: "Word et recherche technique"
problematique: "Comment écrire une procédure que quelqu’un peut suivre ?"
pourquoi: "Une procédure donne des actions courtes dans l’ordre réel."
application: "Un document clair aide une autre personne à retrouver une information technique."
lien_precedent: "Après Comment retrouver une valeur dans deux notices ?, une nouvelle mission t’aide à réutiliser tes méthodes."
prerequis:
    - "Tu peux relire la séance précédente (Comment retrouver une valeur dans deux notices ?) si nécessaire."
notions:
    - titre: "Un exemple expliqué"
      texte: "Exemple : 1. Ouvre le document. 2. Choisis le bon fichier. 3. Vérifie son nom avant de l’enregistrer."
objectifs:
    connaissances:
        - "Une procédure donne des actions courtes dans l’ordre réel."
    competences:
        - "Écrire quatre étapes pour retrouver et enregistrer le bon document. Faire relire la procédure par un camarade."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Une procédure donne des actions courtes dans l’ordre réel."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Écrire quatre étapes pour retrouver et enregistrer le bon document. Faire relire la procédure par un camarade."
    - type: paragraphe
      texte: "Dans la vie réelle : Un document clair aide une autre personne à retrouver une information technique."
activites:
    - id: a01
      titre: "1. Comprendre la mission"
      pourquoi: "On commence par un exemple guidé : il montre une méthode avant que tu l’essaies."
      demarche:
          - Lis la situation.
          - Suis les étapes de l’exemple.
          - Repère la donnée qui aide à répondre.
      contenu:
          - type: paragraphe
            texte: "Exemple : 1. Ouvre le document. 2. Choisis le bon fichier. 3. Vérifie son nom avant de l’enregistrer."
      questions:
          - id: q01
            type: texte
            enonce: "Dans quel ordre faut-il placer les étapes d’une procédure ?"
            aide: "Relis l’exemple et repère l’information qui répond à la question."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
            aide: "Une ou deux phrases suffisent."
    - id: a02
      titre: "2. À toi d’essayer"
      pourquoi: "Tu as vu la méthode ; maintenant, applique-la dans une tâche que tu peux vérifier."
      demarche:
          - Réalise les étapes dans l’ordre.
          - Note le résultat attendu.
          - Compare-le au résultat observé.
      consigne: "Écrire quatre étapes pour retrouver et enregistrer le bon document. Faire relire la procédure par un camarade."
      questions:
          - id: q01
            type: texte
            enonce: "Quel résultat observes-tu ? Décris ton essai."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
      ressources:
          - type: lien
            titre: "Aide Microsoft Word — mise en forme"
            url: https://support.microsoft.com/word
    - id: a03
      titre: "3. Réutiliser la méthode"
      pourquoi: "Un nouvel exemple t’aide à voir où cette méthode peut encore servir."
      contenu:
          - type: paragraphe
            texte: "Reprends la méthode avec une nouvelle valeur, un autre document ou une autre situation du dossier."
      questions:
          - id: q01
            type: texte
            enonce: "Quelle information permet de justifier ta conclusion ? Quelle limite reste à vérifier ?"
    - id: a04
      titre: "4. Ce que tu retiens"
      pourquoi: "Tu termines en gardant une idée et une méthode pour la prochaine séance."
      demarche:
          - Relis les deux éléments à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Une procédure donne des actions courtes dans l’ordre réel."
    - "Pour vérifier, je compare une réponse ou un essai à une donnée précise."
bilan: "Je peux expliquer ce que j’ai appris et montrer une réponse ou un essai comme preuve."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie cycle 4 : cette séance travaille une procédure donne des actions courtes dans l’ordre réel.. Elle contribue progressivement aux compétences de fin de cycle."
    - type: lien
      titre: "Ministère — Programme de Technologie du cycle 4, BO 2024"
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
    - type: lien
      titre: "Aide Microsoft Word — mise en forme"
      url: https://support.microsoft.com/word
