titre: 'Séance 20 : Avec quel appareil mesurer ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Quel appareil choisir pour mesurer une grandeur, et comment le brancher ?
competences_bo:
    - Caractériser et choisir un objet ou un système technique selon différents critères
    - Valider les solutions techniques par des simulations ou par des protocoles de tests
objectifs:
    connaissances:
        - Le multimètre mesure une tension (en volts, V) en voltmètre, branché en dérivation (aux bornes), ou une intensité (en ampères, A) en ampèremètre, branché en série (dans le circuit).
        - Le chronomètre mesure une durée (s) ; le compte-tours (tachymètre) mesure une vitesse de rotation (tr/min).
    competences:
        - Choisir l’appareil adapté à une grandeur.
        - Écrire l’unité donnée par l’appareil (réflexe R11).
pourquoi:
    - En 5e, on te disait quel appareil utiliser. En séance 19, tu as identifié les énergies de l’éolienne.
    - Aujourd’hui, tu choisis toi-même les appareils de mesure.
activites:
    -   id: a01
        titre: Grandeur, appareil, unité
        contenu:
            -   type: citation
                texte: 'Réflexe brevet n° 11 : je choisis l’appareil de mesure et j’écris l’unité qu’il donne.'
            -   type: tableau
                titre: Document 1
                colonnes:
                    - Grandeur
                    - Appareil
                    - Unité
                lignes:
                    -   - Tension électrique
                        - Multimètre en voltmètre
                        - volt (V)
                    -   - Intensité du courant
                        - Multimètre en ampèremètre
                        - ampère (A)
                    -   - Durée
                        - Chronomètre
                        - seconde (s)
                    -   - Vitesse de rotation
                        - Compte-tours
                        - tour par minute (tr/min)
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, choisis l’appareil pour chaque mesure.
                colonnes:
                    - Je veux mesurer…
                    - Appareil
                lignes:
                    -   - la vitesse de rotation du rotor
                        - ''
                    -   - la tension produite par la génératrice
                        - ''
                    -   - le temps que met le rotor à s’arrêter
                        - ''
                aide: Action → résultat attendu → résultat observé ; une seule chose à la fois.
    -   id: a02
        titre: Brancher le multimètre
        transition: Tu sais choisir l’appareil. Encore faut-il bien le brancher.
        contenu:
            -   type: paragraphe
                texte: 'Exemple expliqué : pour mesurer la tension de la génératrice, on place les deux pointes du multimètre aux deux bornes de la génératrice, sans ouvrir le circuit : c’est le branchement en dérivation.'
        questions:
            -   id: q01
                type: qcm
                enonce: Comment brancher un ampèremètre pour mesurer le courant qui traverse la LED ?
                choix:
                    -   id: a
                        texte: 'En série : on ouvre le circuit et on place l’ampèremètre dedans.'
                    -   id: b
                        texte: En dérivation, aux bornes de la LED.
                    -   id: c
                        texte: On ne le branche pas.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: tableau
                enonce: Écris le résultat avec la bonne unité.
                colonnes:
                    - Affichage
                    - Résultat avec unité
                lignes:
                    -   - 'Multimètre sur V : 1,8'
                        - ''
                    -   - 'Multimètre sur A : 0,02'
                        - ''
                    -   - 'Compte-tours : 900'
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
    -   id: a03
        titre: Choisir pour une question
        transition: Tu connais les appareils. Choisis-en un pour répondre à une vraie question.
        questions:
            -   id: q01
                type: texte
                enonce: On veut savoir si l’éolienne tourne plus vite avec 3 ou 5 pales. Quel appareil choisis-tu ? Explique comment tu l’utilises.
                aide: Une idée + « car » + une raison tirée de la séance.
            -   id: q02
                type: texte
                enonce: Pourquoi faut-il toujours écrire l’unité d’une mesure ?
                aide: Action → résultat attendu → résultat observé ; une seule chose à la fois.
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: 'La puissance électrique se calcule : P = U × I.'
        questions:
            -   id: q01
                type: texte
                enonce: Avec 1,8 V et 0,02 A, calcule la puissance produite.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais choisir et brancher. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quel appareil choisir pour une grandeur, et comment brancher le multimètre ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Voltmètre en dérivation (V), ampèremètre en série (A), chronomètre (s), compte-tours (tr/min).
    - 'Réflexe R11 : appareil adapté + unité.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
