titre: "Pix IA : comment fonctionne une IA et quels sont ses enjeux ?"
theme: "Excel/Calc, données et IA"
problematique: "Pix IA : comment fonctionne une IA et quels sont ses enjeux ?"
pourquoi: "Une IA produit un résultat qui peut comporter des erreurs ou des biais."
application: "Un tableau organisé permet de comparer des mesures et d’expliquer un choix."
lien_precedent: "Après Que peut-on conclure à partir de mesures ?, une nouvelle mission t’aide à réutiliser tes méthodes."
prerequis:
    - "Tu peux relire la séance précédente (Que peut-on conclure à partir de mesures ?) si nécessaire."
notions:
    - titre: "Un exemple expliqué"
      texte: "Une réponse bien formulée ne prouve pas qu’elle est vraie. Je vérifie les faits avec une source fiable."
objectifs:
    connaissances:
        - "Une IA produit un résultat qui peut comporter des erreurs ou des biais."
    competences:
        - "Réaliser le parcours Pix IA « Décrypter le fonctionnement et les enjeux de l’IA », puis noter une limite et une règle de vérification."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Une IA produit un résultat qui peut comporter des erreurs ou des biais."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Réaliser le parcours Pix IA « Décrypter le fonctionnement et les enjeux de l’IA », puis noter une limite et une règle de vérification."
    - type: paragraphe
      texte: "Dans la vie réelle : Un tableau organisé permet de comparer des mesures et d’expliquer un choix."
activites:
    - id: a01
      titre: "1. Comprendre la mission"
      pourquoi: "On commence par un exemple guidé : il montre une méthode avant que tu l’essaies."
      demarche:
          - Lis la situation.
          - Suis les étapes de l’exemple.
          - Repère la donnée qui aide à répondre.
      contenu:
          - type: paragraphe
            texte: "Une réponse bien formulée ne prouve pas qu’elle est vraie. Je vérifie les faits avec une source fiable."
      questions:
          - id: q01
            type: texte
            enonce: "Une réponse fluide d’une IA prouve-t-elle qu’elle est exacte ?"
            aide: "Relis l’exemple et repère l’information qui répond à la question."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
            aide: "Une ou deux phrases suffisent."
    - id: a02
      titre: "2. À toi d’essayer"
      pourquoi: "Tu as vu la méthode ; maintenant, applique-la dans une tâche que tu peux vérifier."
      demarche:
          - Réalise les étapes dans l’ordre.
          - Note le résultat attendu.
          - Compare-le au résultat observé.
      consigne: "Réaliser le parcours Pix IA « Décrypter le fonctionnement et les enjeux de l’IA », puis noter une limite et une règle de vérification."
      questions:
          - id: q01
            type: texte
            enonce: "Quel résultat observes-tu ? Décris ton essai."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
      ressources:
          - type: lien
            titre: "Bulletin officiel — parcours Pix IA"
            url: https://www.education.gouv.fr/bo/2026/Hebdo6/MENE2527173N
    - id: a03
      titre: "3. Réutiliser la méthode"
      pourquoi: "Un nouvel exemple t’aide à voir où cette méthode peut encore servir."
      contenu:
          - type: paragraphe
            texte: "Reprends la méthode avec une nouvelle valeur, un autre document ou une autre situation du dossier."
      questions:
          - id: q01
            type: texte
            enonce: "Quelle information permet de justifier ta conclusion ? Quelle limite reste à vérifier ?"
    - id: a04
      titre: "4. Ce que tu retiens"
      pourquoi: "Tu termines en gardant une idée et une méthode pour la prochaine séance."
      demarche:
          - Relis les deux éléments à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Une IA produit un résultat qui peut comporter des erreurs ou des biais."
    - "Pour vérifier, je compare une réponse ou un essai à une donnée précise."
bilan: "Je peux expliquer ce que j’ai appris et montrer une réponse ou un essai comme preuve."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie cycle 4 : cette séance travaille une ia produit un résultat qui peut comporter des erreurs ou des biais.. Elle contribue progressivement aux compétences de fin de cycle."
    - type: lien
      titre: "Ministère — Programme de Technologie du cycle 4, BO 2024"
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
    - type: lien
      titre: "Bulletin officiel — parcours Pix IA"
      url: https://www.education.gouv.fr/bo/2026/Hebdo6/MENE2527173N
