titre: 'Séance 20 : Avec quel appareil mesurer ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Quel appareil choisir pour mesurer une grandeur, et comment le brancher ?
competences_bo:
    - Caractériser et choisir un objet ou un système technique selon différents critères
    - Valider les solutions techniques par des simulations ou par des protocoles de tests
objectifs:
    connaissances:
        - Le multimètre mesure une tension (V) en voltmètre, branché en dérivation (aux bornes), ou une intensité (A) en ampèremètre, branché en série (dans le circuit).
        - Le chronomètre mesure une durée (s) ; le compte-tours mesure une vitesse de rotation (tr/min).
    competences:
        - Choisir l’appareil adapté à une grandeur.
        - Écrire l’unité donnée par l’appareil (réflexe R11).
pourquoi:
    - En 5e, on te disait quel appareil utiliser. En séance 19, tu as identifié les énergies de l’éolienne.
    - Aujourd’hui, tu choisis toi-même les appareils de mesure.
activites:
    -   id: a01
        titre: Grandeur, appareil, unité
        consigne: Tu vas apprendre à choisir l’appareil de mesure qui convient (multimètre, chronomètre, compte-tours…) pour des mesures sur l’éolienne, à l’aide du document 1. On attend le bon appareil pour chaque mesure.
        contenu:
            -   type: citation
                texte: 'Réflexe brevet n° 11 : je choisis l’appareil de mesure et j’écris l’unité qu’il donne.'
            -   type: tableau
                titre: Document 1
                colonnes:
                    - Grandeur
                    - Appareil
                    - Unité
                lignes:
                    -   - Tension
                        - Multimètre en voltmètre
                        - volt (V)
                    -   - Intensité
                        - Multimètre en ampèremètre
                        - ampère (A)
                    -   - Durée
                        - Chronomètre
                        - seconde (s)
                    -   - Vitesse de rotation
                        - Compte-tours
                        - tour par minute (tr/min)
            -   type: etapes
                elements:
                    - Lis le document 1.
                    - Pour chaque mesure demandée, repère la grandeur (tension, durée, rotation…).
                    - Choisis l’appareil qui mesure cette grandeur.
            -   type: paragraphe
                texte: 'Pourquoi ce réflexe ? Une mesure n’a de sens qu’avec le bon appareil et la bonne unité : au brevet, l’unité oubliée coûte des points.'
        questions:
            -   id: q01
                type: tableau
                enonce: Pour chaque mesure à faire sur l’éolienne de la classe, choisis l’appareil dans le document 1.
                colonnes:
                    - Je veux mesurer…
                    - Appareil
                lignes:
                    -   - la vitesse de rotation du rotor
                        - ''
                    -   - la tension de la génératrice
                        - ''
                    -   - le temps que met le rotor à s’arrêter
                        - ''
                aide: Action → résultat attendu → résultat observé ; une seule chose à la fois.
    -   id: a02
        titre: Brancher le multimètre
        transition: Tu sais choisir l’appareil. Encore faut-il bien le brancher.
        consigne: Tu vas apprendre à brancher le multimètre en voltmètre ou en ampèremètre, à partir de l’exemple expliqué. On attend le bon branchement et des résultats écrits avec leur unité.
        contenu:
            -   type: paragraphe
                texte: 'Exemple expliqué : pour mesurer la tension de la génératrice, on pose les deux pointes du multimètre sur ses deux bornes, sans ouvrir le circuit : c’est la dérivation.'
            -   type: etapes
                elements:
                    - Lis l’exemple expliqué (voltmètre).
                    - 'Retiens : tension = aux bornes (dérivation) ; intensité = dans le circuit (série).'
                    - Réponds, puis écris chaque mesure avec son unité.
            -   type: paragraphe
                texte: 'Pourquoi deux branchements ? L’intensité est le courant qui traverse le circuit : il doit passer dans l’ampèremètre. La tension se mesure entre deux points.'
        questions:
            -   id: q01
                type: qcm
                enonce: Comment brancher un ampèremètre pour mesurer le courant de la LED ?
                choix:
                    -   id: a
                        texte: 'En série : on ouvre le circuit et on le place dedans.'
                    -   id: b
                        texte: En dérivation.
                    -   id: c
                        texte: On ne le branche pas.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: tableau
                enonce: Voici trois affichages lus sur les appareils de mesure de l’éolienne. Écris chaque résultat avec la bonne unité.
                colonnes:
                    - Affichage
                    - Résultat
                lignes:
                    -   - 'Multimètre sur V : 1,8'
                        - ''
                    -   - 'Multimètre sur A : 0,02'
                        - ''
                    -   - 'Compte-tours : 900'
                        - ''
                aide: Action → résultat attendu → résultat observé ; une seule chose à la fois.
    -   id: a03
        titre: Choisir pour une vraie question
        transition: Tu connais les appareils. Choisis-en un pour une vraie question.
        consigne: 'Tu vas choisir l’appareil et la méthode pour répondre à une vraie question : l’éolienne tourne-t-elle plus vite avec 3 ou 5 pales ? On attend l’appareil, son utilisation et ce que tu gardes identique.'
        contenu:
            -   type: etapes
                elements:
                    - Lis la question.
                    - Choisis la grandeur à mesurer, puis l’appareil.
                    - Explique comment l’utiliser et ce que tu gardes identique.
            -   type: paragraphe
                texte: Pourquoi garder le même vent ? Pour comparer les rotors, seule la forme doit changer (réflexe n° 8).
        questions:
            -   id: q01
                type: texte
                enonce: On veut savoir si l’éolienne tourne plus vite avec 3 ou 5 pales. Quel appareil choisis-tu, et comment l’utilises-tu ?
                aide: Une idée réaliste + « Cela permet de… ».
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: 'La puissance électrique se calcule : P = U × I.'
        questions:
            -   id: q01
                type: texte
                enonce: Avec 1,8 V et 0,02 A, calcule la puissance.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais choisir et brancher. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quel appareil choisir pour chaque grandeur, et comment brancher le multimètre ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Voltmètre en dérivation (V), ampèremètre en série (A), chronomètre (s), compte-tours (tr/min).
    - Réflexe R11.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
