titre: 'Séance 24 : Bilan et entraînement au brevet n° 3 : une éolienne de bateau'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Suis-je capable d’analyser une chaîne d’énergie, de choisir un appareil de mesure et de comparer deux solutions ?
competences_bo:
    - Caractériser et choisir un objet ou un système technique selon différents critères
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - Chaîne d’énergie, mesures, comparaison de solutions.
    competences:
        - Utiliser les réflexes R5, R11, R14, R15, R16.
pourquoi:
    - Depuis la séance 19, tu as étudié l’énergie de l’éolienne.
    - Aujourd’hui, tu traites un dossier sur la petite éolienne d’un voilier (situation inventée).
activites:
    -   id: a01
        titre: Le dossier
        contenu:
            -   type: titre
                texte: Document 1 — L’éolienne du voilier
            -   type: citation
                texte: Sur un voilier, une petite éolienne recharge une batterie de 12 V qui alimente l’éclairage et le GPS. Le rotor fait tourner une génératrice. Un régulateur protège la batterie contre la surcharge.
            -   type: tableau
                titre: Document 2 — Production selon le vent
                colonnes:
                    - Vent (km/h)
                    - '10'
                    - '20'
                    - '30'
                    - '40'
                lignes:
                    -   - Puissance produite (W)
                        - '5'
                        - '30'
                        - '80'
                        - '150'
        questions:
            -   id: q01
                type: tableau
                enonce: Complète la chaîne d’énergie du voilier.
                colonnes:
                    - Constituant
                    - Fonction
                lignes:
                    -   - Rotor et génératrice
                        - ''
                    -   - Batterie
                        - ''
                    -   - Fils
                        - ''
                aide: Quelle énergie entre, laquelle sort ?
            -   id: q02
                type: nombre
                enonce: D’après le document 2, quelle puissance l’éolienne produit-elle avec un vent de 30 km/h ?
                unite: W
                aide: N’oublie pas l’unité (réflexe n° 5).
            -   id: q03
                type: qcm
                enonce: Quel appareil choisir pour vérifier la tension de la batterie ?
                choix:
                    -   id: a
                        texte: Un multimètre en voltmètre, branché aux bornes de la batterie.
                    -   id: b
                        texte: Un chronomètre.
                    -   id: c
                        texte: Un ampèremètre en dérivation.
                aide: Relis l’exemple expliqué.
            -   id: q04
                type: tableau
                enonce: Propose un protocole pour vérifier le document 2 sur une éolienne réelle.
                colonnes:
                    - Rubrique
                    - Protocole
                lignes:
                    -   - Je change
                        - ''
                    -   - Je mesure
                        - ''
                    -   - Je garde identique
                        - ''
                aide: Attendu ou observé ?
            -   id: q05
                type: texte
                enonce: Le propriétaire hésite entre l’éolienne et un panneau solaire. Donne un argument chiffré ou un critère pour chaque solution.
                aide: Combien d’éléments sont demandés ?
    -   id: a02
        titre: Je relis (R16)
        transition: Le dossier est terminé. Relis-toi.
        questions:
            -   id: q01
                type: texte
                enonce: 'Vérifie les unités : en as-tu oublié une ? Laquelle as-tu ajoutée ?'
                aide: Repère le verbe de la question.
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Énergie (Wh) = puissance (W) × durée (h).
        questions:
            -   id: q01
                type: texte
                enonce: Quelle énergie produit l’éolienne en 5 h avec un vent de 20 km/h ?
                aide: Quelle énergie entre, laquelle sort ?
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as traité un dossier complet. Fais le point.
        questions:
            -   id: q01
                type: texte
                enonce: Quel réflexe as-tu le mieux utilisé aujourd’hui ? Donne un exemple.
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Chaîne d’énergie : convertir, stocker, transmettre.'
    - 'Mesurer : appareil adapté et unité ; protocole : changer, mesurer, garder.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
