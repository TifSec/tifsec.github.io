titre: "Comment les appareils communiquent-ils dans un réseau local ?"
theme: "Réseaux et parcours Pix"
problematique: "Comment les appareils communiquent-ils dans un réseau local ?"
pourquoi: "Un terminal connecté doit être reconnu pour échanger des informations."
application: "Protéger ses données et reconnaître les appareils connectés aide à travailler en sécurité."
lien_precedent: "Après Comment relier capteur, carte et actionneur dans un autre système ?, une nouvelle mission t’aide à réutiliser tes méthodes."
prerequis:
    - "Tu peux relire la séance précédente (Comment relier capteur, carte et actionneur dans un autre système ?) si nécessaire."
notions:
    - titre: "Un exemple expliqué"
      texte: "Un ordinateur envoie un document à une imprimante du même réseau. Le schéma montre les deux terminaux et le point d’accès qui les relie."
objectifs:
    connaissances:
        - "Un terminal connecté doit être reconnu pour échanger des informations."
    competences:
        - "Dessiner un réseau local avec deux terminaux et un point d’accès, puis suivre le message dans la simulation."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Un terminal connecté doit être reconnu pour échanger des informations."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Dessiner un réseau local avec deux terminaux et un point d’accès, puis suivre le message dans la simulation."
    - type: paragraphe
      texte: "Dans la vie réelle : Protéger ses données et reconnaître les appareils connectés aide à travailler en sécurité."
activites:
    - id: a01
      titre: "1. Comprendre la mission"
      pourquoi: "On commence par un exemple guidé : il montre une méthode avant que tu l’essaies."
      demarche:
          - Lis la situation.
          - Suis les étapes de l’exemple.
          - Repère la donnée qui aide à répondre.
      contenu:
          - type: paragraphe
            texte: "Un ordinateur envoie un document à une imprimante du même réseau. Le schéma montre les deux terminaux et le point d’accès qui les relie."
      questions:
          - id: q01
            type: texte
            enonce: "Pourquoi chaque appareil doit-il être identifié avant l’échange ?"
            aide: "Relis l’exemple et repère l’information qui répond à la question."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
            aide: "Une ou deux phrases suffisent."
    - id: a02
      titre: "2. À toi d’essayer"
      pourquoi: "Tu as vu la méthode ; maintenant, applique-la dans une tâche que tu peux vérifier."
      demarche:
          - Réalise les étapes dans l’ordre.
          - Note le résultat attendu.
          - Compare-le au résultat observé.
      consigne: "Dessiner un réseau local avec deux terminaux et un point d’accès, puis suivre le message dans la simulation."
      questions:
          - id: q01
            type: texte
            enonce: "Quel résultat observes-tu ? Décris ton essai."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
      ressources:
          - type: lien
            titre: "CNIL — ressources pour les élèves"
            url: https://www.cnil.fr/fr/education
    - id: a03
      titre: "3. Réutiliser la méthode"
      pourquoi: "Un nouvel exemple t’aide à voir où cette méthode peut encore servir."
      contenu:
          - type: paragraphe
            texte: "Reprends la méthode avec une nouvelle valeur, un autre document ou une autre situation du dossier."
      questions:
          - id: q01
            type: texte
            enonce: "Quelle information permet de justifier ta conclusion ? Quelle limite reste à vérifier ?"
    - id: a04
      titre: "4. Ce que tu retiens"
      pourquoi: "Tu termines en gardant une idée et une méthode pour la prochaine séance."
      demarche:
          - Relis les deux éléments à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Un terminal connecté doit être reconnu pour échanger des informations."
    - "Pour vérifier, je compare une réponse ou un essai à une donnée précise."
bilan: "Je peux expliquer ce que j’ai appris et montrer une réponse ou un essai comme preuve."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie cycle 4 : cette séance travaille un terminal connecté doit être reconnu pour échanger des informations.. Elle contribue progressivement aux compétences de fin de cycle."
    - type: lien
      titre: "Ministère — Programme de Technologie du cycle 4, BO 2024"
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
    - type: lien
      titre: "CNIL — ressources pour les élèves"
      url: https://www.cnil.fr/fr/education
