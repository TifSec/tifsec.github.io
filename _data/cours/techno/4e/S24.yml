titre: 'Séance 24 : Bilan et entraînement au brevet n° 3 : l’éolienne d’un voilier'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Suis-je capable d’analyser une chaîne d’énergie, de choisir un appareil et de proposer un protocole ?
competences_bo:
    - Caractériser et choisir un objet ou un système technique selon différents critères
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - Chaîne d’énergie, mesures, protocole, comparaison.
    competences:
        - Utiliser les réflexes R5, R11, R14, R15, R16.
pourquoi:
    - Depuis la séance 19, tu as étudié l’énergie de l’éolienne.
    - Aujourd’hui, un dossier sur l’éolienne d’un voilier (situation inventée), mission par mission.
activites:
    -   id: a01
        titre: La chaîne d’énergie du voilier
        consigne: Tu vas t’entraîner au brevet sur la chaîne d’énergie de l’éolienne d’un voilier (documents 1 et 2). On attend la fonction de chaque constituant et une puissance lue dans le document 2.
        contenu:
            -   type: titre
                texte: Document 1 — L’éolienne du voilier
            -   type: citation
                texte: Une petite éolienne recharge une batterie de 12 V qui alimente l’éclairage et le GPS. Le rotor fait tourner une génératrice. Un régulateur protège la batterie.
            -   type: tableau
                titre: Document 2
                colonnes:
                    - Vent (km/h)
                    - '10'
                    - '20'
                    - '30'
                    - '40'
                lignes:
                    -   - Puissance (W)
                        - '5'
                        - '30'
                        - '80'
                        - '150'
            -   type: etapes
                elements:
                    - Lis tout le document 1.
                    - Repère le constituant qui convertit, celui qui stocke, celui qui transmet.
                    - Complète le tableau.
            -   type: paragraphe
                texte: 'Pourquoi « stocker » ? Sur un bateau, on a besoin d’électricité même sans vent : la batterie garde l’énergie pour plus tard.'
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, écris la fonction de chaque constituant de la chaîne d’énergie du voilier (convertir, stocker, transmettre).
                colonnes:
                    - Constituant
                    - Fonction
                lignes:
                    -   - Rotor et génératrice
                        - ''
                    -   - Batterie
                        - ''
                    -   - Fils
                        - ''
                aide: Quelle énergie entre, laquelle sort ?
            -   id: q02
                type: nombre
                enonce: D’après le document 2, quelle puissance avec un vent de 30 km/h ?
                unite: W
                aide: N’oublie pas l’unité (réflexe n° 5).
    -   id: a02
        titre: Mesurer et proposer un protocole
        transition: La chaîne est claire. Passons aux mesures.
        consigne: Tu vas choisir un appareil de mesure et écrire un protocole pour vérifier le document 2 sur l’éolienne du voilier (réflexes R11 et R15). On attend l’appareil et un protocole en trois lignes.
        contenu:
            -   type: etapes
                elements:
                    - Choisis l’appareil pour la tension de la batterie (R11).
                    - Puis écris un protocole pour vérifier le document 2 (R15).
                    - 'Une seule chose change : le vent.'
            -   type: paragraphe
                texte: 'Pourquoi vérifier le document 2 ? Les chiffres d’un fabricant se vérifient par un protocole : c’est la démarche d’un technicien.'
        questions:
            -   id: q01
                type: qcm
                enonce: Quel appareil pour vérifier la tension de la batterie ?
                choix:
                    -   id: a
                        texte: Un multimètre en voltmètre, aux bornes de la batterie.
                    -   id: b
                        texte: Un chronomètre.
                    -   id: c
                        texte: Un ampèremètre en dérivation.
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: tableau
                enonce: Propose un protocole pour vérifier, avec l’éolienne du voilier, que la puissance produite augmente avec la vitesse du vent comme l’indique le document 2.
                colonnes:
                    - Rubrique
                    - Protocole
                lignes:
                    -   - Je change
                        - ''
                    -   - Je mesure
                        - ''
                    -   - Je garde identique
                        - ''
                aide: Attendu ou observé ?
    -   id: a03
        titre: Comparer et relire
        transition: Les mesures sont prévues. Termine en comparant.
        consigne: Tu vas comparer l’éolienne et un panneau solaire pour le voilier, puis relire tout ton dossier (R14, R16). On attend un argument avec un critère nommé pour chaque solution.
        contenu:
            -   type: etapes
                elements:
                    - Donne un argument pour chaque solution, avec un critère nommé (R14).
                    - 'Relis tout le dossier : unités, justifications (R16).'
            -   type: paragraphe
                texte: Pourquoi un argument pour chaque solution ? Le propriétaire choisira mieux s’il connaît les deux côtés.
        questions:
            -   id: q01
                type: texte
                enonce: Le propriétaire hésite entre l’éolienne et un panneau solaire. Donne un argument chiffré ou un critère pour chacun.
                aide: Combien d’éléments sont demandés ?
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Énergie (Wh) = puissance (W) × durée (h).
        questions:
            -   id: q01
                type: texte
                enonce: Quelle énergie en 5 h avec un vent de 20 km/h ?
                aide: Quelle énergie entre, laquelle sort ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as traité un dossier complet. Fais le point.
        questions:
            -   id: q01
                type: texte
                enonce: Quel réflexe as-tu le mieux utilisé aujourd’hui ? Donne un exemple.
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Chaîne d’énergie : convertir, stocker, transmettre.'
    - 'Mesurer : bon appareil et unité ; protocole : changer, mesurer, garder.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
