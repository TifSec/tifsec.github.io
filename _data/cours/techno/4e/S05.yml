titre: 'Séance 5 : Pourquoi le monte-charge a-t-il un capot et un contrepoids ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Quels choix de conception rendent le monte-charge sûr, pratique et économe en énergie ?
competences_bo:
    - Décrire les interactions entre un objet ou un système technique, son environnement et les utilisateurs
objectifs:
    connaissances:
        - Les concepteurs font des choix pour la sécurité (capot, contacts de fin de course), l’ergonomie (boutons à chaque étage, écran) et l’économie d’énergie (contrepoids).
        - 'Le contrepoids équilibre la cabine : le moteur n’a qu’à soulever la différence de masse.'
    competences:
        - Repérer sur l’objet réel les choix de conception.
        - Expliquer chaque choix par un critère.
pourquoi:
    - En 5e, on t’a fourni la liste des constituants du monte-charge.
    - En 4e, c’est toi qui les repères sur la maquette, puis tu expliques pourquoi les concepteurs les ont choisis.
activites:
    -   id: a01
        titre: Repérer sur la maquette (poste maquette)
        consigne: Tu vas repérer sur le monte-charge du collège (ou sur les photos projetées) le capot, le contrepoids, les boutons et les contacts haut et bas. On attend, pour chaque élément, une phrase qui dit à quoi il sert.
        contenu:
            -   type: etapes
                elements:
                    - Quand ton groupe passe au poste maquette, observe le monte-charge moteur arrêté.
                    - Repère le capot, le contrepoids, les boutons et les contacts haut et bas.
                    - Pour chacun, note à quoi il sert.
                    - Les autres groupes utilisent les photos projetées.
            -   type: paragraphe
                texte: 'Pourquoi observer l’objet réel ? En 4e, tu identifies toi-même les constituants : c’est ce qu’on attend d’un technicien face à un objet qu’il ne connaît pas.'
        questions:
            -   id: q01
                type: tableau
                enonce: Pour chaque élément repéré sur le monte-charge, écris à quoi il sert.
                colonnes:
                    - Élément repéré
                    - À quoi il sert
                lignes:
                    -   - Capot de protection
                        - ''
                    -   - Contrepoids
                        - ''
                    -   - Boutons à chaque étage
                        - ''
                    -   - Contacts haut et bas
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
    -   id: a02
        titre: Sécurité, ergonomie ou énergie ?
        transition: Tu as repéré les éléments. Classe maintenant les choix des concepteurs.
        consigne: 'Tu vas classer les choix de conception du monte-charge selon trois critères : sécurité, ergonomie, énergie, à partir de l’exemple expliqué. On attend le critère principal de chaque choix.'
        contenu:
            -   type: paragraphe
                texte: 'Exemple expliqué : l’écran qui affiche « Appel Etage » est un choix d’ergonomie : l’utilisateur sait ce que fait la machine.'
            -   type: etapes
                elements:
                    - Lis l’exemple expliqué ci-dessous.
                    - 'Pour chaque choix, demande-toi : protège-t-il l’utilisateur, le rend-il plus pratique, ou fait-il économiser de l’énergie ?'
                    - Écris le critère principal.
            -   type: paragraphe
                texte: 'Pourquoi classer les choix ? Au brevet, on demande souvent de justifier un choix de conception : le nommer avec le bon critère est la moitié de la réponse.'
        questions:
            -   id: q01
                type: tableau
                enonce: Classe chaque choix de conception du monte-charge selon son critère principal (sécurité, ergonomie ou énergie).
                colonnes:
                    - Choix
                    - Critère
                lignes:
                    -   - Capot
                        - ''
                    -   - Contrepoids
                        - ''
                    -   - Boutons à chaque étage
                        - ''
                aide: Source → constituant qui transforme → forme d’énergie en sortie.
    -   id: a03
        titre: Le rôle du contrepoids
        transition: Le contrepoids est le choix le plus surprenant. Comprenons-le.
        consigne: Tu vas comprendre le rôle du contrepoids du monte-charge à partir des masses données (cabine 600 g, contrepoids 500 g). On attend un calcul de masse et une explication sur l’énergie.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis les masses : cabine 600 g, contrepoids 500 g.'
                    - Le contrepoids tire de l’autre côté de la poulie.
                    - Calcule ce que le moteur doit encore soulever.
                    - Explique ce que cela change pour l’énergie.
            -   type: paragraphe
                texte: 'Pourquoi un contrepoids ? Le moteur consomme de l’énergie pour soulever une masse : plus la masse à soulever est petite, moins il consomme.'
        questions:
            -   id: q01
                type: nombre
                enonce: Quelle masse le moteur doit-il soulever avec le contrepoids ?
                unite: g
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: texte
                enonce: Explique pourquoi le moteur consomme moins d’énergie grâce au contrepoids.
                aide: Source → constituant qui transforme → forme d’énergie en sortie.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Dans un vrai ascenseur, le contrepoids pèse environ la masse de la cabine plus la moitié de la charge maximale.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi ajoute-t-on la moitié de la charge maximale ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as analysé les choix des concepteurs. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quels choix rendent le monte-charge sûr, pratique et économe ? Donne un choix pour chaque critère.'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Choix de conception : sécurité (capot, contacts), ergonomie (boutons, écran), énergie (contrepoids).'
    - Le contrepoids réduit l’effort du moteur.
sources:
