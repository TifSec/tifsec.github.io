titre: 'Séance 5 : Pourquoi le monte-charge a-t-il un capot et un contrepoids ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Quels choix de conception rendent le monte-charge sûr, pratique et économe en énergie ?
competences_bo:
    - Décrire les interactions entre un objet ou un système technique, son environnement et les utilisateurs
objectifs:
    connaissances:
        - Les concepteurs font des choix pour la sécurité (capot, contacts de fin de course), l’ergonomie (boutons à chaque étage, écran) et l’économie d’énergie (contrepoids).
        - 'Le contrepoids équilibre la cabine : le moteur n’a qu’à soulever la différence de masse.'
    competences:
        - Repérer sur l’objet réel les choix de conception.
        - 'Expliquer chaque choix par un critère : sécurité, ergonomie, énergie.'
pourquoi:
    - En 5e, on t’a fourni la liste des constituants du monte-charge.
    - En 4e, c’est toi qui les repères sur la maquette, puis tu expliques pourquoi les concepteurs les ont choisis.
activites:
    -   id: a01
        titre: Repérer sur la maquette (poste maquette)
        contenu:
            -   type: paragraphe
                texte: Chaque groupe passe 5 minutes au poste maquette, moteur arrêté. Les autres préparent la mission 2.
        questions:
            -   id: q01
                type: tableau
                enonce: Note ce que tu as repéré et à quoi cela sert.
                colonnes:
                    - Élément repéré
                    - À quoi il sert
                lignes:
                    -   - Capot de protection
                        - ''
                    -   - Contrepoids
                        - ''
                    -   - Boutons à chaque étage
                        - ''
                    -   - Contacts haut et bas
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
    -   id: a02
        titre: Sécurité, ergonomie ou énergie ?
        transition: Tu as repéré les éléments. Classe maintenant les choix des concepteurs.
        contenu:
            -   type: paragraphe
                texte: 'Exemple expliqué : l’écran qui affiche « Appel Etage » est un choix d’ergonomie : l’utilisateur sait ce que fait la machine.'
        questions:
            -   id: q01
                type: tableau
                enonce: Classe chaque choix selon le critère principal.
                colonnes:
                    - Choix
                    - Critère
                lignes:
                    -   - Capot
                        - ''
                    -   - Contrepoids
                        - ''
                    -   - Boutons à chaque étage
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
            -   id: q02
                type: texte
                enonce: Cabine de 600 g, contrepoids de 500 g. Explique pourquoi le moteur force moins avec le contrepoids.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a03
        titre: Proposer une amélioration
        transition: Les concepteurs ont fait des choix. À ton tour d’en proposer un.
        questions:
            -   id: q01
                type: texte
                enonce: Propose un autre choix de conception pour rendre le monte-charge plus sûr, et explique-le.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Dans un vrai ascenseur, le contrepoids pèse environ la masse de la cabine plus la moitié de la charge maximale.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi ajoute-t-on la moitié de la charge maximale ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as analysé les choix des concepteurs. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quels choix rendent le monte-charge sûr, pratique et économe ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Choix de conception : sécurité (capot, contacts), ergonomie (boutons, écran), énergie (contrepoids).'
    - 'Le contrepoids réduit l’effort du moteur : il ne soulève que la différence de masse.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
