titre: Quel robot aspirateur choisir ?
theme: "Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et à analyser"
problematique: Quel robot aspirateur choisir ?
pourquoi: "Objectif de cette séance : Comprendre qu’un objet peut être plus ou moins adapté selon l’utilisateur et la situation."
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Comprendre qu’un objet peut être plus ou moins adapté selon l’utilisateur et la situation.
        - Comprendre qu’il faut définir des critères avant de comparer plusieurs solutions.
        - Comprendre qu’un choix technique résulte souvent d’un compromis.
    competences:
        - identifier des critères utiles ;
        - extraire des caractéristiques d’une fiche technique ;
        - distinguer une donnée mesurable d’un argument commercial ;
        - organiser des données dans un tableau ;
        - choisir une solution et justifier ce choix.
activites:
    - id: a02
      titre: Compétence visée
      contenu:
          - type: paragraphe
            texte: Comparer des objets ou systèmes techniques selon différents critères afin de choisir une solution adaptée à un besoin.
      questions: []
    - id: a04
      titre: Production attendue
      contenu:
          - type: paragraphe
            texte: Vous devez produire un document LibreOffice Writer contenant vos premières hypothèses, une liste de critères, un tableau comparatif de trois robots réels, trois choix argumentés et une conclusion sur la notion de compromis.
      questions: []
    - id: a05
      titre: 1. Créer votre document de travail
      contenu:
          - type: paragraphe
            texte: "Créez dès maintenant un document LibreOffice Writer nommé :"
          - type: paragraphe
            texte: 4e_S5_nom.odt
          - type: paragraphe
            texte: Remplacez nom par votre nom.
          - type: paragraphe
            texte: "Indiquez :"
          - type: liste
            elements:
                - votre nom et votre prénom ;
                - la date ;
                - "le titre : Séance 5 : Quel robot aspirateur choisir ?"
          - type: paragraphe
            texte: Organisez votre document dès le début avec des titres clairement identifiables.
          - type: paragraphe
            texte: Le fichier devra être rendu en fin d’heure, même s’il n’est pas terminé.
      questions: []
    - id: a06
      titre: 2. Le plus cher est-il forcément le meilleur ?
      contenu:
          - type: paragraphe
            texte: "Imaginez trois robots :"
          - type: liste
            elements:
                - "Robot A : environ 120 € ;"
                - "Robot B : environ 390 € ;"
                - "Robot C : plus de 1 000 €."
          - type: paragraphe
            texte: "Sans consulter les fiches techniques, répondez :"
      questions:
          - id: q01
            type: texte
            enonce: Peut-on déjà affirmer que le robot C est le meilleur ? Pourquoi ?
            suite: []
          - id: q02
            type: texte
            enonce: Quelles informations faudrait-il connaître avant de choisir ?
            suite: []
          - id: q03
            type: texte
            enonce: Citez au moins cinq éléments qui pourraient permettre de comparer les trois robots.
            suite:
                - type: paragraphe
                  texte: "Conservez vos premières idées : nous les comparerons avec les critères utilisés plus tard."
                - type: titre
                  texte: Besoin d’un indice ?
                - type: liste
                  elements:
                      - Pensez au prix.
                      - Pensez aux performances.
                      - Pensez aux dimensions du logement.
                      - Pensez aux obstacles et aux tapis.
                      - Pensez au travail qui reste à faire par l’utilisateur.
    - id: a07
      titre: 3. De quoi avons-nous besoin pour comparer ?
      contenu:
          - type: paragraphe
            texte: Pour comparer plusieurs objets, il faut observer les mêmes caractéristiques.
          - type: paragraphe
            texte: "Choisissez six critères qui vous semblent particulièrement utiles parmi les exemples suivants :"
          - type: liste
            elements:
                - prix ;
                - puissance d’aspiration ;
                - navigation ;
                - évitement des obstacles ;
                - fonction lavage ;
                - station automatique ;
                - capacité à nettoyer les tapis ;
                - capacité à franchir des seuils ;
                - hauteur du robot ;
                - gestion des cheveux ou poils d’animaux ;
                - commande par application ;
                - entretien nécessaire.
          - type: paragraphe
            texte: "Dans votre document, indiquez pour chacun des six critères :"
          - type: paragraphe
            texte: Ce critère est utile parce que...
      questions: []
    - id: a08
      titre: 4. Trois robots réels à comparer
      contenu:
          - type: paragraphe
            texte: Vous allez comparer trois robots actuellement proposés par le même constructeur, mais situés dans des gammes très différentes.
          - type: titre
            texte: "Robot A : Roborock Q7 L5"
          - type: paragraphe
            texte: Consultez la fiche constructeur du Roborock Q7 L5 .
          - type: lien
            titre: fiche constructeur du Roborock Q7 L5
            url: https://fr.roborock.com/products/roborock-q7-l5
          - type: paragraphe
            texte: "Vous pourrez notamment y trouver :"
          - type: liste
            elements:
                - le prix affiché ;
                - la puissance d’aspiration ;
                - le type de navigation ;
                - la présence d’une fonction lavage ;
                - les possibilités de contrôle par application.
          - type: titre
            texte: "Robot B : Roborock Qrevo S Pro"
          - type: paragraphe
            texte: Consultez la fiche constructeur du Roborock Qrevo S Pro .
          - type: lien
            titre: fiche constructeur du Roborock Qrevo S Pro
            url: https://fr.roborock.com/products/roborock-qrevo-s-pro
          - type: paragraphe
            texte: "Observez notamment :"
          - type: liste
            elements:
                - la puissance d’aspiration ;
                - la station multifonction ;
                - le système de lavage ;
                - l’évitement des obstacles ;
                - les dimensions du robot.
          - type: titre
            texte: "Robot C : Roborock Saros 20"
          - type: paragraphe
            texte: Consultez la fiche constructeur du Roborock Saros 20 .
          - type: lien
            titre: fiche constructeur du Roborock Saros 20
            url: https://fr.roborock.com/products/roborock-saros-20
          - type: paragraphe
            texte: "Observez notamment :"
          - type: liste
            elements:
                - la puissance d’aspiration ;
                - le système de navigation ;
                - le franchissement des seuils ;
                - le fonctionnement sur tapis ;
                - la hauteur du robot.
          - type: paragraphe
            texte: "Attention aux prix : les prix et promotions peuvent évoluer. Notez le prix affiché au moment où vous consultez la fiche et indiquez la date."
          - type: paragraphe
            texte: "Autre règle importante : si une information n’est pas indiquée sur la fiche, écrivez « non indiqué ». N’inventez jamais une valeur."
      questions: []
    - id: a09
      titre: 5. Donnée technique ou publicité ?
      contenu:
          - type: paragraphe
            texte: Une fiche constructeur contient à la fois des caractéristiques techniques et des phrases destinées à présenter favorablement le produit.
          - type: paragraphe
            texte: "Classez les exemples suivants dans deux catégories :"
          - type: liste
            elements:
                - "« puissance d’aspiration : 18 500 Pa » ;"
                - « navigation LiDAR » ;
                - « nettoyage puissant » ;
                - "« dimensions : 350 × 353 × 96,5 mm » ;"
                - « la commodité ultime » ;
                - "« batterie : 5 200 mAh »."
          - type: paragraphe
            texte: "Créez deux catégories :"
          - type: liste
            elements:
                - information technique vérifiable ;
                - argument commercial.
          - type: paragraphe
            texte: Expliquez ensuite comment vous avez fait la différence.
      questions: []
    - id: a10
      titre: 6. Construire le tableau comparatif
      contenu:
          - type: paragraphe
            texte: À partir des fiches précédentes, construisez votre tableau.
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Critère
                - Roborock Q7 L5
                - Roborock Qrevo S Pro
                - Roborock Saros 20
            lignes:
                - - Prix observé
                  - ""
                  - ""
                  - ""
                - - Puissance d’aspiration
                  - ""
                  - ""
                  - ""
                - - Navigation
                  - ""
                  - ""
                  - ""
                - - Gestion des obstacles
                  - ""
                  - ""
                  - ""
                - - Station automatique
                  - ""
                  - ""
                  - ""
                - - Fonction lavage
                  - ""
                  - ""
                  - ""
                - - Critère personnel 1
                  - ""
                  - ""
                  - ""
                - - Critère personnel 2
                  - ""
                  - ""
                  - ""
            suite:
                - type: paragraphe
                  texte: "Ajoutez sous le tableau :"
                - type: paragraphe
                  texte: "Prix relevés le : ..."
    - id: a11
      titre: 7. Trois utilisateurs, trois choix différents ?
      contenu:
          - type: titre
            texte: "Utilisateur A : petit logement et budget limité"
          - type: liste
            elements:
                - appartement de 45 m² ;
                - sol principalement dur ;
                - aucun animal ;
                - "budget maximal : 250 € ;"
                - souhaite surtout automatiser l’aspiration quotidienne.
          - type: titre
            texte: "Utilisateur B : maison avec animaux"
          - type: liste
            elements:
                - maison de 120 m² ;
                - deux chiens ;
                - plusieurs tapis ;
                - nettoyage fréquent ;
                - "budget maximal : 600 €."
          - type: titre
            texte: "Utilisateur C : automatiser au maximum"
          - type: liste
            elements:
                - logement avec plusieurs types de sols ;
                - plusieurs petits seuils ;
                - souhaite intervenir le moins possible ;
                - souhaite une station automatique ;
                - budget supérieur à 1 000 € possible si cela apporte un avantage utile.
          - type: paragraphe
            texte: "Pour chaque utilisateur :"
      questions:
          - id: q01
            type: texte
            enonce: identifiez les trois critères les plus importants ;
            suite:
                - type: paragraphe
                  texte: choisissez le robot le plus adapté parmi les trois ;
          - id: q02
            type: texte
            enonce: justifiez votre choix à partir du tableau ;
            suite: []
          - id: q03
            type: texte
            enonce: indiquez au moins une limite de votre choix.
            suite: []
    - id: a12
      titre: 8. Faire émerger la notion de compromis
      contenu:
          - type: paragraphe
            texte: Comparez maintenant vos décisions.
      questions:
          - id: q01
            type: texte
            enonce: Le robot le plus cher a-t-il été choisi dans toutes les situations ?
            suite: []
          - id: q02
            type: texte
            enonce: Le modèle possédant le plus de fonctions est-il toujours le plus pertinent ?
            suite: []
          - id: q03
            type: texte
            enonce: Pourquoi un utilisateur peut-il accepter une moins bonne performance sur un critère ?
            suite:
                - type: paragraphe
                  texte: "Essayez ensuite de compléter avec vos propres mots :"
                - type: paragraphe
                  texte: Faire un compromis consiste à...
                - type: paragraphe
                  texte: "Comparez votre proposition avec cette formulation :"
                - type: paragraphe
                  texte: Un compromis consiste à privilégier certains critères en acceptant d’être moins performant sur d’autres afin de répondre au mieux à une situation donnée.
    - id: a13
      titre: 9. Les valeurs permettent-elles de tout décider ?
      contenu:
          - type: paragraphe
            texte: Une valeur plus élevée n’est pas automatiquement meilleure pour l’utilisateur.
          - type: paragraphe
            texte: Prenez l’exemple de la puissance d’aspiration annoncée.
          - type: paragraphe
            texte: "Répondez :"
      questions:
          - id: q01
            type: texte
            enonce: Le robot ayant la valeur la plus élevée est-il automatiquement le meilleur choix ?
            suite: []
          - id: q02
            type: texte
            enonce: Quelles autres caractéristiques faudrait-il prendre en compte ?
            suite: []
          - id: q03
            type: texte
            enonce: Comment pourrait-on vérifier réellement qu’un robot nettoie mieux qu’un autre ?
            suite:
                - type: paragraphe
                  texte: "Conservez votre dernière réponse : elle servira de point de départ à la prochaine séance."
    - id: a14
      titre: 10. Mettons des mots sur ce que nous avons découvert
      contenu:
          - type: paragraphe
            texte: Un critère est un élément utilisé pour comparer ou choisir plusieurs solutions.
          - type: paragraphe
            texte: "Certains critères peuvent être exprimés par une valeur mesurable : prix, dimensions, puissance annoncée..."
          - type: paragraphe
            texte: "D’autres critères peuvent être plus qualitatifs : facilité d’entretien, simplicité d’utilisation, qualité de la navigation..."
          - type: paragraphe
            texte: Les critères importants dépendent du besoin, de l’utilisateur et de ses contraintes.
          - type: paragraphe
            texte: Choisir une solution technique conduit donc souvent à faire un compromis entre plusieurs critères.
      questions: []
    - id: a15
      titre: "11. Conclusion : mon choix"
      contenu:
          - type: paragraphe
            texte: Imaginez que vous deviez choisir personnellement l’un des trois robots.
          - type: paragraphe
            texte: "Indiquez :"
          - type: liste
            elements:
                - "Mon choix : ..."
                - "Mes trois critères prioritaires : ..."
                - "Pourquoi ce modèle : ..."
                - "La limite que j’accepte : ..."
          - type: paragraphe
            texte: Votre choix peut être différent de celui d’un autre élève. C’est votre justification qui doit permettre de comprendre votre décision.
      questions: []
    - id: a16
      titre: 12. Rendu de fin de séance
      contenu:
          - type: paragraphe
            texte: À la fin du cours, votre fichier doit être rendu, même s’il n’est pas terminé.
          - type: paragraphe
            texte: "Déposez :"
          - type: paragraphe
            texte: 4e_S5_nom.odt
          - type: paragraphe
            texte: "Avant de le rendre, vérifiez :"
          - type: liste
            elements:
                - votre nom, la date et le titre ;
                - vos critères ;
                - votre tableau comparatif ;
                - la date de relevé des prix ;
                - vos trois choix argumentés ;
                - votre définition du compromis ;
                - votre conclusion personnelle ;
                - que votre document est clairement organisé.
      questions: []
    - id: a17
      titre: Références pédagogiques
      contenu:
          - type: liste
            elements:
                - Ministère de l’Éducation nationale – Programme de technologie du cycle 4, BO n°9 du 29 février 2024
                - Éduscol STI – Guide d’accompagnement du programme de technologie au cycle 4
          - type: lien
            titre: Ministère de l’Éducation nationale – Programme de technologie du cycle 4, BO n°9 du 29 février 2024
            url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
          - type: lien
            titre: Éduscol STI – Guide d’accompagnement du programme de technologie au cycle 4
            url: https://sti.eduscol.education.fr/textes/guide-daccompagnement-du-programme-de-technologie-en-cycle-4-mai-2024
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
introduction:
    - type: paragraphe
      texte: "Problématique : Comment choisir une solution technique lorsqu’aucune n’est meilleure dans tous les domaines ?"
    - type: titre
      texte: Objectifs d’apprentissage
    - type: paragraphe
      texte: "Ce que vous allez apprendre :"
    - type: liste
      elements:
          - Comprendre qu’un objet peut être plus ou moins adapté selon l’utilisateur et la situation.
          - Comprendre qu’il faut définir des critères avant de comparer plusieurs solutions.
          - Comprendre qu’un choix technique résulte souvent d’un compromis.
    - type: paragraphe
      texte: "Ce que vous allez apprendre à faire :"
    - type: liste
      elements:
          - identifier des critères utiles ;
          - extraire des caractéristiques d’une fiche technique ;
          - distinguer une donnée mesurable d’un argument commercial ;
          - organiser des données dans un tableau ;
          - choisir une solution et justifier ce choix.
reperes_officiels:
