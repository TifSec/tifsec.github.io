titre: 'Séance 27 : Modifier le rotor'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment modifier le modèle du rotor pour proposer une nouvelle pale ?
competences_bo:
    - Imaginer, concevoir et réaliser une ou des solutions en réponse à un besoin, à des exigences (de développement durable, par exemple) ou à la nécessité d’améliorations dans une démarche de créativité
objectifs:
    connaissances:
        - 'On part d’un modèle existant (le rotor fourni) et on modifie une seule caractéristique à la fois : longueur, largeur ou angle de la pale.'
        - Une modification se justifie par un objectif (plus de prise au vent, moins de masse).
    competences:
        - Modifier un modèle 3D fourni.
        - Justifier une modification par un objectif.
pourquoi:
    - En 5e, la classe a mesuré que le nombre de pales change la production. En séance 26, tu as pris en main Tinkercad.
    - Aujourd’hui, chaque groupe propose une nouvelle pale à partir du modèle fourni.
activites:
    -   id: a01
        titre: Le modèle fourni
        contenu:
            -   type: paragraphe
                texte: 'Le professeur partage le modèle du rotor : un moyeu de 20 mm et 3 pales de 60 mm de long, 15 mm de large, inclinées de 20°.'
            -   type: paragraphe
                texte: 'Exemple expliqué : un groupe veut plus de prise au vent. Il élargit les pales de 15 à 20 mm, sans rien changer d’autre. Il pourra comparer avec le rotor d’origine.'
        questions:
            -   id: q01
                type: qcm
                enonce: Pourquoi ne modifier qu’une seule caractéristique à la fois ?
                choix:
                    -   id: a
                        texte: Pour savoir quel changement explique la différence de production.
                    -   id: b
                        texte: Parce que Tinkercad l’interdit.
                    -   id: c
                        texte: Pour aller plus vite.
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: texte
                enonce: Choisis un objectif pour ta pale (plus de prise au vent, plus légère, démarrage avec un vent faible…). Écris-le.
                aide: Ton idée répond-elle au besoin ?
        ressources:
            - &id001
                type: lien
                titre: Tinkercad — conception 3D (connexion avec le code de classe du professeur)
                url: https://www.tinkercad.com/
    -   id: a02
        titre: Modifier
        transition: Ton objectif est fixé. Modifie le modèle.
        contenu:
            -   type: etapes
                elements:
                    - Copie le modèle du rotor dans ta conception.
                    - Modifie UNE caractéristique de la pale (longueur, largeur ou angle).
                    - Applique la même modification aux trois pales.
                    - Exporte une capture d’écran (facultatif).
        questions:
            -   id: q01
                type: tableau
                enonce: Décris ta modification.
                colonnes:
                    - Caractéristique
                    - Avant
                    - Après
                lignes:
                    -   - ''
                        - ''
                        - ''
                aide: Ligne × colonne.
            -   id: q02
                type: texte
                enonce: Explique en quoi ta modification répond à ton objectif. Utilise « car ».
                aide: Pense à « car » (réflexe n° 4).
        ressources:
            - *id001
    -   id: a03
        titre: Anticiper
        transition: Une modification a souvent un prix.
        questions:
            -   id: q01
                type: texte
                enonce: Ta modification peut avoir un inconvénient. Lequel ? Comment le vérifier ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Les grandes éoliennes ont trois pales.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi pas une seule pale très longue ?
                aide: Pense à « car » (réflexe n° 4).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as proposé une nouvelle pale. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment as-tu modifié le rotor, et pourquoi ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Modifier un modèle : une caractéristique à la fois, avec un objectif.'
    - Une modification a souvent un inconvénient à vérifier.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
