titre: 'Séance 27 : Modifier le rotor'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment modifier le modèle du rotor pour proposer une nouvelle pale ?
competences_bo:
    - Imaginer, concevoir et réaliser une ou des solutions en réponse à un besoin, à des exigences (de développement durable, par exemple) ou à la nécessité d’améliorations dans une démarche de créativité
objectifs:
    connaissances:
        - On part d’un modèle existant et on modifie une seule caractéristique (longueur, largeur ou angle de la pale).
        - Une modification se justifie par un objectif.
    competences:
        - Modifier un modèle 3D fourni.
        - Justifier une modification par un objectif.
pourquoi:
    - En 5e, la classe a mesuré que le nombre de pales change la production. En séance 26, tu as pris en main Tinkercad.
    - Aujourd’hui, chaque groupe propose une nouvelle pale à partir du modèle fourni.
activites:
    -   id: a01
        titre: Choisir un objectif
        consigne: Tu vas choisir un objectif d’amélioration pour la pale du rotor de l’éolienne, à partir du modèle 3D fourni par le professeur. On attend un objectif clair (plus de prise au vent, pale plus légère…).
        contenu:
            -   type: paragraphe
                texte: 'Modèle fourni : moyeu de 20 mm, 3 pales de 60 mm de long, 15 mm de large, inclinées de 20° (valeurs d’exemple).'
            -   type: etapes
                elements:
                    - Ouvre le modèle du rotor partagé par le professeur.
                    - 'Mesure une pale : longueur, largeur, angle.'
                    - 'Choisis un objectif : plus de prise au vent, pale plus légère, démarrage par vent faible…'
            -   type: paragraphe
                texte: Pourquoi un objectif d’abord ? Sans objectif, on modifie au hasard et on ne sait pas si c’est mieux.
        questions:
            -   id: q01
                type: qcm
                enonce: Pourquoi ne modifier qu’une caractéristique à la fois ?
                choix:
                    -   id: a
                        texte: Pour savoir quel changement explique la différence.
                    -   id: b
                        texte: Tinkercad l’impose.
                    -   id: c
                        texte: Pour aller vite.
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: texte
                enonce: Écris l’objectif de ton groupe pour la nouvelle pale du rotor de l’éolienne.
                aide: Combien d’éléments sont demandés ?
        ressources:
            - &id001
                type: lien
                titre: Tinkercad — conception 3D (connexion avec le code de classe du professeur)
                url: https://www.tinkercad.com/
    -   id: a02
        titre: Modifier
        transition: Ton objectif est fixé. Modifie le modèle.
        consigne: Tu vas modifier dans Tinkercad une seule caractéristique des pales du modèle, pour atteindre ton objectif. On attend la modification (avant / après) et une justification avec « car ».
        contenu:
            -   type: etapes
                elements:
                    - Copie le modèle dans ta conception.
                    - Modifie UNE caractéristique de la pale.
                    - Applique la même modification aux trois pales.
                    - Prends une capture d’écran (facultatif).
            -   type: paragraphe
                texte: 'Pourquoi les trois pales pareilles ? Un rotor déséquilibré vibre et s’use : les pales doivent être identiques.'
        questions:
            -   id: q01
                type: tableau
                enonce: Décris la modification que tu as faite sur la pale du rotor.
                colonnes:
                    - Caractéristique
                    - Avant
                    - Après
                lignes:
                    -   - ''
                        - ''
                        - ''
                aide: Ligne × colonne.
            -   id: q02
                type: texte
                enonce: Explique en quoi ta modification répond à ton objectif. Utilise « car ».
                aide: Pense à « car » (réflexe n° 4).
        ressources:
            - *id001
    -   id: a03
        titre: Anticiper un inconvénient
        transition: Une modification a souvent un prix.
        consigne: Tu vas prévoir un inconvénient de ta modification de la pale avant de la fabriquer. On attend l’inconvénient et un moyen de le vérifier.
        contenu:
            -   type: etapes
                elements:
                    - Pense aux effets de ta modification sur la masse, la solidité, le démarrage.
                    - Choisis un inconvénient possible.
                    - Propose comment le vérifier.
            -   type: paragraphe
                texte: Pourquoi chercher un inconvénient ? Un bon concepteur anticipe les défauts avant de fabriquer.
        questions:
            -   id: q01
                type: texte
                enonce: Quel inconvénient ta modification peut-elle avoir ? Comment le vérifier ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Les grandes éoliennes ont trois pales.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi pas une seule pale très longue ?
                aide: Pense à « car » (réflexe n° 4).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as proposé une nouvelle pale. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment as-tu modifié le rotor, et pourquoi ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Modifier un modèle : une caractéristique à la fois, avec un objectif.'
    - Anticiper les inconvénients.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
