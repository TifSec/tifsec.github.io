titre: "Quelles données entrent et sortent du programme ?"
theme: "Programmes et tests"
problematique: "Quelles données entrent et sortent du programme ?"
pourquoi: "Une entrée est reçue, une sortie est produite ; une variable garde une valeur."
application: "Les programmes commandent des jeux et des systèmes à partir de données."
lien_precedent: "Après Comment lire un programme dans l’ordre ?, une nouvelle mission t’aide à réutiliser tes méthodes."
prerequis:
    - "Tu peux relire la séance précédente (Comment lire un programme dans l’ordre ?) si nécessaire."
notions:
    - titre: "Un exemple expliqué"
      texte: "Un capteur fournit la température. La variable la conserve. L’écran affiche « chaud » si elle dépasse le seuil."
objectifs:
    connaissances:
        - "Une entrée est reçue, une sortie est produite ; une variable garde une valeur."
    competences:
        - "Annoter un programme fourni avec ses entrées, variables et sorties. Classer une variable : nombre, texte ou vrai/faux."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Une entrée est reçue, une sortie est produite ; une variable garde une valeur."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Annoter un programme fourni avec ses entrées, variables et sorties. Classer une variable : nombre, texte ou vrai/faux."
    - type: paragraphe
      texte: "Dans la vie réelle : Les programmes commandent des jeux et des systèmes à partir de données."
activites:
    - id: a01
      titre: "1. Comprendre la mission"
      pourquoi: "On commence par un exemple guidé : il montre une méthode avant que tu l’essaies."
      demarche:
          - Lis la situation.
          - Suis les étapes de l’exemple.
          - Repère la donnée qui aide à répondre.
      contenu:
          - type: paragraphe
            texte: "Un capteur fournit la température. La variable la conserve. L’écran affiche « chaud » si elle dépasse le seuil."
      questions:
          - id: q01
            type: texte
            enonce: "La valeur relevée par un capteur est-elle une entrée ou une sortie ?"
            aide: "Relis l’exemple et repère l’information qui répond à la question."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
            aide: "Une ou deux phrases suffisent."
    - id: a02
      titre: "2. À toi d’essayer"
      pourquoi: "Tu as vu la méthode ; maintenant, applique-la dans une tâche que tu peux vérifier."
      demarche:
          - Réalise les étapes dans l’ordre.
          - Note le résultat attendu.
          - Compare-le au résultat observé.
      consigne: "Annoter un programme fourni avec ses entrées, variables et sorties. Classer une variable : nombre, texte ou vrai/faux."
      questions:
          - id: q01
            type: texte
            enonce: "Quel résultat observes-tu ? Décris ton essai."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
      ressources:
          - type: lien
            titre: "MakeCode micro:bit — documentation"
            url: https://makecode.microbit.org/reference
    - id: a03
      titre: "3. Réutiliser la méthode"
      pourquoi: "Un nouvel exemple t’aide à voir où cette méthode peut encore servir."
      contenu:
          - type: paragraphe
            texte: "Reprends la méthode avec une nouvelle valeur, un autre document ou une autre situation du dossier."
      questions:
          - id: q01
            type: texte
            enonce: "Quelle information permet de justifier ta conclusion ? Quelle limite reste à vérifier ?"
    - id: a04
      titre: "4. Ce que tu retiens"
      pourquoi: "Tu termines en gardant une idée et une méthode pour la prochaine séance."
      demarche:
          - Relis les deux éléments à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Une entrée est reçue, une sortie est produite ; une variable garde une valeur."
    - "Pour vérifier, je compare une réponse ou un essai à une donnée précise."
bilan: "Je peux expliquer ce que j’ai appris et montrer une réponse ou un essai comme preuve."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie cycle 4 : cette séance travaille une entrée est reçue, une sortie est produite ; une variable garde une valeur.. Elle contribue progressivement aux compétences de fin de cycle."
    - type: lien
      titre: "Ministère — Programme de Technologie du cycle 4, BO 2024"
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
    - type: lien
      titre: "MakeCode micro:bit — documentation"
      url: https://makecode.microbit.org/reference
