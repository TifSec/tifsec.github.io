titre: 'Séance 32 : Traduire l’algorithme en blocs'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment traduire un algorithme en programme qui fonctionne ?
competences_bo:
    - Concevoir, écrire, tester et mettre au point un programme
objectifs:
    connaissances:
        - 'Chaque ligne de l’algorithme devient un ou plusieurs blocs : QUAND → bloc d’événement ; SI … ALORS → bloc « si » ; RÉPÉTER → bloc « répéter » ou « toujours ».'
        - On teste après chaque partie traduite.
    competences:
        - Traduire un algorithme en blocs Arcade.
        - Utiliser une boucle « répéter » ou « toujours ».
pourquoi:
    - En séance 31, tu as écrit l’algorithme du jeu « Récolte ».
    - Aujourd’hui, tu le traduis en blocs dans MakeCode Arcade.
activites:
    -   id: a01
        titre: Le panier
        contenu:
            -   type: etapes
                elements:
                    - Ouvre MakeCode Arcade, nouveau projet 4e_S32_tonprenom.
                    - Crée un sprite « panier » (type Player) en bas de l’écran.
                    - Ajoute le bloc « déplacer panier avec les boutons » et mets la vitesse verticale à 0.
        questions:
            -   id: q01
                type: texte
                enonce: 'Quel bloc correspond à la ligne « QUAND on appuie sur une flèche : déplacer le panier » de ton algorithme ?'
                aide: 'Bloc par bloc : quand ? quelle condition ? quelle action ?'
        ressources:
            - &id001
                type: lien
                titre: MakeCode Arcade (gratuit, dans le navigateur)
                url: https://arcade.makecode.com/
    -   id: a02
        titre: Les fruits
        transition: Le panier bouge. Fais tomber les fruits.
        contenu:
            -   type: etapes
                elements:
                    - Dans « à chaque 2000 ms », crée un sprite « fruit » (type Food) en haut, à une position x au hasard entre 10 et 150.
                    - Donne-lui une vitesse vy = 50.
                    - 'Ajoute « quand sprite de type Player chevauche sprite de type Food » : changer le score de 1, détruire le fruit.'
        questions:
            -   id: q01
                type: tableau
                enonce: Associe chaque ligne de l’algorithme à son bloc.
                colonnes:
                    - Algorithme
                    - Bloc Arcade
                lignes:
                    -   - Toutes les 2 secondes
                        - ''
                    -   - Position au hasard
                        - ''
                    -   - QUAND le panier touche un fruit
                        - ''
                aide: Bloc par bloc (réflexe n° 9).
            -   id: q02
                type: qcm
                enonce: Quel bloc répète des instructions sans fin ?
                choix:
                    -   id: a
                        texte: « toujours »
                    -   id: b
                        texte: « au démarrage »
                    -   id: c
                        texte: « si … alors »
                aide: Relis l’exemple expliqué.
        ressources:
            - *id001
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Il reste les vies.
        questions:
            -   id: q01
                type: texte
                enonce: Programme la perte d’une vie quand un fruit sort de l’écran par le bas. Quel bloc as-tu utilisé ?
                aide: Bloc par bloc (réflexe n° 9).
        ressources:
            - *id001
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton jeu prend forme. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment as-tu traduit ton algorithme en programme ? Donne deux exemples de traduction.'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - QUAND → événement ; SI → « si … alors » ; RÉPÉTER → « répéter » / « toujours » / « à chaque … ms ».
    - On teste après chaque partie traduite.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
