titre: 'Séance 28 : La pale va-t-elle plier ?'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment savoir si une pale résiste au vent sans trop plier ?
competences_bo:
    - Valider les solutions techniques par des simulations ou par des protocoles de tests
objectifs:
    connaissances:
        - 'Un test de flexion : on fixe un échantillon par une extrémité et on accroche des masses à l’autre ; on mesure la flèche (de combien l’extrémité descend).'
        - Plus la flèche est petite pour une même masse, plus l’échantillon est rigide.
    competences:
        - Mettre en œuvre un protocole de test fourni.
        - Exploiter des résultats pour comparer des matériaux ou des formes.
pourquoi:
    - En séance 23, tu as comparé des matériaux sur un tableau. En séance 27, tu as dessiné une nouvelle pale.
    - Aujourd’hui, tu testes vraiment la rigidité d’échantillons.
activites:
    -   id: a01
        titre: Le protocole
        contenu:
            -   type: tableau
                titre: Document 1 — Protocole fourni
                colonnes:
                    - Étape
                    - Action
                lignes:
                    -   - '1'
                        - Fixer l’échantillon au bord de la table avec une pince (5 cm dépassent).
                    -   - '2'
                        - Mesurer la hauteur de l’extrémité avec une règle (position de départ).
                    -   - '3'
                        - Accrocher 50 g, puis 100 g, puis 150 g.
                    -   - '4'
                        - Mesurer à chaque fois de combien l’extrémité est descendue (la flèche, en mm).
        questions:
            -   id: q01
                type: tableau
                enonce: Pour ce test, complète.
                colonnes:
                    - Rubrique
                    - Réponse
                lignes:
                    -   - Ce qu’on change
                        - ''
                    -   - Ce qu’on mesure (unité)
                        - ''
                    -   - Ce qu’on garde identique
                        - ''
                aide: Attendu ou observé ?
    -   id: a02
        titre: Résultats
        transition: Le protocole est clair. Exploite les résultats.
        contenu:
            -   type: tableau
                titre: Document 2 — Exemple de résultats (valeurs inventées si la classe n’a pas pu mesurer)
                colonnes:
                    - Masse
                    - PLA épaisseur 2 mm
                    - PLA épaisseur 3 mm
                    - Contreplaqué 3 mm
                lignes:
                    -   - 50 g
                        - 4 mm
                        - 2 mm
                        - 1 mm
                    -   - 100 g
                        - 8 mm
                        - 4 mm
                        - 2 mm
                    -   - 150 g
                        - 13 mm
                        - 6 mm
                        - 3 mm
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 2, quel échantillon est le plus rigide ?
                choix:
                    -   id: a
                        texte: Le contreplaqué 3 mm.
                    -   id: b
                        texte: Le PLA 2 mm.
                    -   id: c
                        texte: Le PLA 3 mm.
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: nombre
                enonce: D’après le document 2, de combien de millimètres la flèche du PLA est-elle réduite à 150 g en passant de 2 à 3 mm d’épaisseur ?
                unite: mm
                aide: N’oublie pas l’unité (réflexe n° 5).
            -   id: q03
                type: texte
                enonce: Que conclus-tu sur l’épaisseur de la pale en PLA ? Justifie avec les valeurs.
                aide: Pense à « car » (réflexe n° 4).
    -   id: a03
        titre: Limites du test
        transition: Un test simplifie toujours la réalité.
        questions:
            -   id: q01
                type: texte
                enonce: Ce test ressemble-t-il exactement à ce que subit une pale dans le vent ? Donne une différence.
                aide: Attendu ou observé ?
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La flèche semble proportionnelle à la masse pour les petites masses.
        questions:
            -   id: q01
                type: texte
                enonce: Vérifie-le avec le PLA 3 mm. Que prévois-tu pour 200 g ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as testé la rigidité. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment savoir si une pale résiste au vent sans trop plier ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Test de flexion : masse en bout, mesure de la flèche (mm) ; petite flèche = rigide.'
    - 'Un test simplifie la réalité : on en connaît les limites.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
