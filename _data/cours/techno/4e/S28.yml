titre: "Comment suivre une procédure de réparation sans sauter d’étape ?"
theme: "Dépanner par une méthode"
problematique: "Comment suivre une procédure de réparation sans sauter d’étape ?"
pourquoi: "Une procédure décrit les actions dans l’ordre et demande une vérification entre les étapes."
application: "Vérifier une cause avant de remplacer une pièce évite des réparations inutiles."
lien_precedent: "Après Quel contrôle permet de vérifier une cause de panne ?, une nouvelle mission t’aide à réutiliser tes méthodes."
prerequis:
    - "Tu peux relire la séance précédente (Quel contrôle permet de vérifier une cause de panne ?) si nécessaire."
notions:
    - titre: "Un exemple expliqué"
      texte: "Je repère un câble débranché sur un schéma hors tension, suis les étapes et demande une vérification avant tout essai réel."
objectifs:
    connaissances:
        - "Une procédure décrit les actions dans l’ordre et demande une vérification entre les étapes."
    competences:
        - "Suivre la procédure fournie sur le schéma ou la simulation et noter chaque résultat."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Une procédure décrit les actions dans l’ordre et demande une vérification entre les étapes."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Suivre la procédure fournie sur le schéma ou la simulation et noter chaque résultat."
    - type: paragraphe
      texte: "Dans la vie réelle : Vérifier une cause avant de remplacer une pièce évite des réparations inutiles."
activites:
    - id: a01
      titre: "1. Comprendre la mission"
      pourquoi: "On commence par un exemple guidé : il montre une méthode avant que tu l’essaies."
      demarche:
          - Lis la situation.
          - Suis les étapes de l’exemple.
          - Repère la donnée qui aide à répondre.
      contenu:
          - type: paragraphe
            texte: "Je repère un câble débranché sur un schéma hors tension, suis les étapes et demande une vérification avant tout essai réel."
      questions:
          - id: q01
            type: texte
            enonce: "Pourquoi vérifier après une étape avant de continuer ?"
            aide: "Relis l’exemple et repère l’information qui répond à la question."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
            aide: "Une ou deux phrases suffisent."
    - id: a02
      titre: "2. À toi d’essayer"
      pourquoi: "Tu as vu la méthode ; maintenant, applique-la dans une tâche que tu peux vérifier."
      demarche:
          - Réalise les étapes dans l’ordre.
          - Note le résultat attendu.
          - Compare-le au résultat observé.
      consigne: "Suivre la procédure fournie sur le schéma ou la simulation et noter chaque résultat."
      questions:
          - id: q01
            type: texte
            enonce: "Quel résultat observes-tu ? Décris ton essai."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
      ressources:
          - type: lien
            titre: "Éduscol — Technologie au cycle 4"
            url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
    - id: a03
      titre: "3. Réutiliser la méthode"
      pourquoi: "Un nouvel exemple t’aide à voir où cette méthode peut encore servir."
      contenu:
          - type: paragraphe
            texte: "Reprends la méthode avec une nouvelle valeur, un autre document ou une autre situation du dossier."
      questions:
          - id: q01
            type: texte
            enonce: "Quelle information permet de justifier ta conclusion ? Quelle limite reste à vérifier ?"
    - id: a04
      titre: "4. Ce que tu retiens"
      pourquoi: "Tu termines en gardant une idée et une méthode pour la prochaine séance."
      demarche:
          - Relis les deux éléments à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Une procédure décrit les actions dans l’ordre et demande une vérification entre les étapes."
    - "Pour vérifier, je compare une réponse ou un essai à une donnée précise."
bilan: "Je peux expliquer ce que j’ai appris et montrer une réponse ou un essai comme preuve."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie cycle 4 : cette séance travaille une procédure décrit les actions dans l’ordre et demande une vérification entre les étapes.. Elle contribue progressivement aux compétences de fin de cycle."
    - type: lien
      titre: "Ministère — Programme de Technologie du cycle 4, BO 2024"
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
    - type: lien
      titre: "Éduscol — Technologie au cycle 4"
      url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
