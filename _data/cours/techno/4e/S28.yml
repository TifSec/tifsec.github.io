titre: 'Séance 28 : La pale va-t-elle plier ?'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment savoir si une pale résiste au vent sans trop plier ?
competences_bo:
    - Valider les solutions techniques par des simulations ou par des protocoles de tests
objectifs:
    connaissances:
        - 'Test de flexion : on fixe un échantillon par une extrémité, on accroche des masses à l’autre, on mesure la flèche (de combien l’extrémité descend).'
        - Petite flèche = échantillon rigide.
    competences:
        - Mettre en œuvre un protocole fourni.
        - Exploiter des résultats.
pourquoi:
    - En séance 23, tu as comparé des matériaux sur un tableau. En séance 27, tu as dessiné une nouvelle pale.
    - Aujourd’hui, tu testes vraiment la rigidité d’échantillons.
activites:
    -   id: a01
        titre: Comprendre le protocole
        consigne: Tu vas comprendre le protocole d’un test de flexion qui mesure de combien une pale plie (document 1). On attend ce que l’on change, ce que l’on mesure et ce que l’on garde identique.
        contenu:
            -   type: tableau
                titre: Document 1 — Protocole fourni
                colonnes:
                    - Étape
                    - Action
                lignes:
                    -   - '1'
                        - Fixer l’échantillon au bord de la table (5 cm dépassent).
                    -   - '2'
                        - Mesurer la hauteur de l’extrémité.
                    -   - '3'
                        - Accrocher 50 g, puis 100 g, puis 150 g.
                    -   - '4'
                        - Mesurer à chaque fois la flèche (mm).
            -   type: etapes
                elements:
                    - Lis le protocole du document 1.
                    - Repère ce qui change, ce qu’on mesure, ce qui reste identique.
                    - Remplis le tableau.
            -   type: paragraphe
                texte: Pourquoi analyser le protocole ? Comprendre un protocole avant de le suivre évite les erreurs de mesure.
        questions:
            -   id: q01
                type: tableau
                enonce: Pour le test de flexion du document 1, complète ce qui change, ce qu’on mesure et ce qui reste identique.
                colonnes:
                    - Rubrique
                    - Réponse
                lignes:
                    -   - Ce qu’on change
                        - ''
                    -   - Ce qu’on mesure (unité)
                        - ''
                    -   - Ce qu’on garde identique
                        - ''
                aide: Attendu ou observé ?
    -   id: a02
        titre: Mesurer et exploiter
        transition: Le protocole est clair. Mesure et exploite.
        consigne: Tu vas réaliser le test de flexion en groupe sur des échantillons de PLA et de contreplaqué, puis exploiter les résultats (document 2). On attend l’échantillon le plus rigide et un calcul d’écart.
        contenu:
            -   type: tableau
                titre: Document 2 — Exemple de résultats
                colonnes:
                    - Masse
                    - PLA 2 mm
                    - PLA 3 mm
                    - Contreplaqué 3 mm
                lignes:
                    -   - 50 g
                        - 4 mm
                        - 2 mm
                        - 1 mm
                    -   - 100 g
                        - 8 mm
                        - 4 mm
                        - 2 mm
                    -   - 150 g
                        - 13 mm
                        - 6 mm
                        - 3 mm
            -   type: etapes
                elements:
                    - Faites les mesures en groupe (échantillons fournis).
                    - Comparez avec le document 2.
                    - Cherche l’échantillon qui plie le moins.
            -   type: paragraphe
                texte: Pourquoi la même masse pour tous ? Pour comparer les échantillons, ils doivent subir la même charge.
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 2, quel échantillon est le plus rigide ?
                choix:
                    -   id: a
                        texte: Le contreplaqué 3 mm.
                    -   id: b
                        texte: Le PLA 2 mm.
                    -   id: c
                        texte: Le PLA 3 mm.
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: nombre
                enonce: De combien de mm la flèche du PLA est-elle réduite à 150 g en passant de 2 à 3 mm ?
                unite: mm
                aide: N’oublie pas l’unité (réflexe n° 5).
    -   id: a03
        titre: Conclure et critiquer le test
        transition: Les résultats sont là. Que peut-on en conclure ?
        consigne: Tu vas conclure sur l’épaisseur de la pale en PLA et critiquer le test de flexion. On attend une conclusion avec des valeurs et une différence entre le test et une vraie pale dans le vent.
        contenu:
            -   type: etapes
                elements:
                    - Conclus sur l’épaisseur de la pale avec des valeurs.
                    - Compare le test à ce que subit une vraie pale dans le vent.
                    - Écris une différence.
            -   type: paragraphe
                texte: 'Pourquoi critiquer le test ? Un test simplifie toujours la réalité : connaître ses limites évite de trop conclure.'
        questions:
            -   id: q01
                type: texte
                enonce: Que conclus-tu sur l’épaisseur de la pale en PLA ? Justifie avec les valeurs.
                aide: Pense à « car » (réflexe n° 4).
            -   id: q02
                type: texte
                enonce: Donne une différence entre ce test et le vent sur une vraie pale.
                aide: Attendu ou observé ?
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La flèche semble proportionnelle à la masse.
        questions:
            -   id: q01
                type: texte
                enonce: Vérifie-le pour le PLA 3 mm et prévois la flèche à 200 g.
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as testé la rigidité. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment savoir si une pale résiste au vent sans trop plier ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Test de flexion : masse en bout, flèche (mm) ; petite flèche = rigide.'
    - Un test simplifie la réalité.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
