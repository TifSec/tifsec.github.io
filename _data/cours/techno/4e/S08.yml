titre: Faut-il réparer ou remplacer ?
theme: "Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et à analyser"
problematique: Faut-il réparer ou remplacer ?
pourquoi: "Objectif de cette séance : Comprendre qu’un symptôme ne permet pas toujours d’identifier immédiatement la cause d’une panne."
application: Les situations et les valeurs suivantes sont fictives et simplifiées pour l’activité pédagogique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Comprendre qu’un symptôme ne permet pas toujours d’identifier immédiatement la cause d’une panne.
        - Comprendre qu’une panne ne signifie pas forcément que l’objet doit être remplacé.
        - Comprendre que la réparabilité dépend notamment du démontage, des pièces disponibles et de la documentation.
        - Comprendre qu’une décision de réparation dépend de critères techniques, économiques et environnementaux.
    competences:
        - analyser un symptôme ;
        - proposer plusieurs causes possibles ;
        - imaginer des vérifications simples avant de conclure ;
        - comparer réparation et remplacement ;
        - justifier une décision à partir de plusieurs critères.
activites:
    - id: a02
      titre: Compétence visée
      contenu:
          - type: paragraphe
            texte: Analyser les choix liés à la durée de vie, à la maintenance et à la réparabilité d’un objet ou d’un système technique.
      questions: []
    - id: a04
      titre: Production attendue
      contenu:
          - type: paragraphe
            texte: Vous devez produire un document LibreOffice Writer contenant votre première décision, une démarche de diagnostic, l’analyse de trois situations, une recherche sur la réparabilité et une conclusion argumentée.
      questions: []
    - id: a05
      titre: 1. Créer votre document de travail
      contenu:
          - type: paragraphe
            texte: "Créez dès maintenant un document LibreOffice Writer nommé :"
          - type: paragraphe
            texte: 4e_S8_nom.odt
          - type: paragraphe
            texte: Remplacez nom par votre nom.
          - type: paragraphe
            texte: "Indiquez :"
          - type: liste
            elements:
                - votre nom et votre prénom ;
                - la date ;
                - "le titre : Séance 8 : Faut-il réparer ou remplacer ?"
          - type: paragraphe
            texte: Votre document doit permettre de comprendre non seulement votre décision finale, mais aussi comment vous êtes arrivé à cette décision.
          - type: paragraphe
            texte: Le fichier devra être rendu en fin d’heure, même s’il n’est pas terminé.
      questions: []
    - id: a06
      titre: 2. Un symptôme suffit-il pour connaître la panne ?
      contenu:
          - type: paragraphe
            texte: Votre robot aspirateur a trois ans.
          - type: paragraphe
            texte: Lorsqu’il est complètement chargé, il fonctionne maintenant seulement environ 15 minutes, alors qu’il fonctionnait beaucoup plus longtemps auparavant.
          - type: paragraphe
            texte: "Sans rechercher sur Internet, répondez :"
      questions:
          - id: q01
            type: texte
            enonce: Quel est le symptôme observé ?
            suite: []
          - id: q02
            type: texte
            enonce: Quelle cause vous semble la plus probable ?
            suite: []
          - id: q03
            type: texte
            enonce: Existe-t-il d’autres causes possibles ? Donnez-en au moins une.
            suite: []
          - id: q04
            type: texte
            enonce: Que faudrait-il vérifier avant d’acheter une nouvelle batterie ?
            suite:
                - type: paragraphe
                  texte: "Terminez par une première décision :"
                - type: paragraphe
                  texte: À ce stade, je choisirais de... parce que...
                - type: titre
                  texte: Besoin d’un indice ?
                - type: paragraphe
                  texte: Pensez à la batterie, mais aussi à la recharge, aux contacts électriques, au chargeur ou à l’utilisation de l’appareil.
    - id: a07
      titre: 3. Du symptôme à la cause probable
      contenu:
          - type: paragraphe
            texte: "Une démarche de diagnostic peut être organisée ainsi :"
          - type: paragraphe
            texte: Symptôme → causes possibles → vérifications → causes éliminées → cause probable → intervention → nouveau test
          - type: paragraphe
            texte: Appliquez cette méthode au problème précédent.
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Étape
                - Votre proposition
            lignes:
                - - Symptôme observé
                  - ""
                - - Cause possible 1
                  - ""
                - - Cause possible 2
                  - ""
                - - Vérification à effectuer
                  - ""
                - - Cause probable si la vérification confirme l’hypothèse
                  - ""
                - - Intervention possible
                  - ""
                - - Test après intervention
                  - ""
    - id: a08
      titre: 4. Une réparation est-elle possible ?
      contenu:
          - type: paragraphe
            texte: "Une cause probable ne suffit pas : il faut aussi savoir si la pièce peut être remplacée."
          - type: paragraphe
            texte: "Consultez : iFixit – Pièces détachées pour robots Roomba ."
          - type: lien
            titre: iFixit – Pièces détachées pour robots Roomba
            url: https://www.ifixit.com/fr-fr/Parts/Roomba
          - type: paragraphe
            texte: "Recherchez :"
          - type: etapes
            elements:
                - au moins trois types de pièces disponibles ;
                - un exemple de batterie ;
                - un exemple de roue ou de roulette ;
                - le prix de deux pièces de votre choix.
          - type: paragraphe
            texte: "Attention : la disponibilité et le prix des pièces dépendent du modèle et peuvent évoluer."
          - type: paragraphe
            texte: "Répondez ensuite :"
          - type: paragraphe
            texte: Pourquoi la disponibilité d’une pièce détachée peut-elle modifier la décision de réparer ou remplacer ?
      questions: []
    - id: a09
      titre: 5. Qu’est-ce qui rend un produit réparable ?
      contenu:
          - type: paragraphe
            texte: La réparabilité ne dépend pas uniquement de la présence d’une pièce détachée.
          - type: paragraphe
            texte: "Consultez : Ministère de la Transition écologique – Indice de réparabilité ."
          - type: lien
            titre: Ministère de la Transition écologique – Indice de réparabilité
            url: https://www.ecologie.gouv.fr/politiques-publiques/indice-reparabilite
          - type: paragraphe
            texte: Les aspirateurs font partie des catégories concernées par l’indice de réparabilité.
          - type: paragraphe
            texte: Relevez dans la ressource quatre éléments utilisés pour évaluer la réparabilité d’un produit.
          - type: paragraphe
            texte: "Puis classez-les dans le tableau :"
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Élément
                - Pourquoi facilite-t-il ou limite-t-il une réparation ?
            lignes:
                - - Documentation
                  - ""
                - - Démontabilité
                  - ""
                - - Disponibilité des pièces
                  - ""
                - - Prix des pièces
                  - ""
    - id: a10
      titre: 6. Trois situations, trois décisions
      contenu:
          - type: paragraphe
            texte: Les situations et les valeurs suivantes sont fictives et simplifiées pour l’activité pédagogique.
          - type: titre
            texte: "Cas A : autonomie fortement réduite"
          - type: liste
            elements:
                - robot âgé de 3 ans ;
                - bon état général ;
                - batterie diagnostiquée comme usée ;
                - "batterie compatible disponible : 60 € ;"
                - "robot neuf équivalent : 320 € ;"
                - remplacement de la batterie relativement simple.
          - type: titre
            texte: "Cas B : roue motrice défectueuse"
          - type: liste
            elements:
                - robot âgé de 5 ans ;
                - batterie encore correcte ;
                - module de roue diagnostiqué comme défectueux ;
                - "module disponible : 45 € ;"
                - "robot neuf équivalent : 350 € ;"
                - appareil en état général correct.
          - type: titre
            texte: "Cas C : plusieurs éléments usés"
          - type: liste
            elements:
                - robot âgé de 8 ans ;
                - carte électronique diagnostiquée comme défaillante ;
                - "carte difficile à trouver : environ 160 € ;"
                - batterie très usée ;
                - brosses également à remplacer ;
                - "robot neuf équivalent : environ 250 €."
          - type: paragraphe
            texte: "Pour chaque cas, complétez :"
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Cas
                - Réparation envisagée
                - Coût approximatif
                - État général
                - Durée supplémentaire espérée
                - Décision
            lignes:
                - - A
                  - ""
                  - ""
                  - ""
                  - ""
                  - ""
                - - B
                  - ""
                  - ""
                  - ""
                  - ""
                  - ""
                - - C
                  - ""
                  - ""
                  - ""
                  - ""
                  - ""
            suite:
                - type: paragraphe
                  texte: Pour chaque décision, donnez au moins deux arguments.
    - id: a11
      titre: 7. Réparer est-il toujours préférable ?
      contenu:
          - type: paragraphe
            texte: Reprenez le cas C.
          - type: paragraphe
            texte: Imaginez maintenant que la carte électronique soit disponible pour seulement 30 €.
          - type: paragraphe
            texte: "Répondez :"
      questions:
          - id: q01
            type: texte
            enonce: Votre décision changerait-elle automatiquement ?
            suite: []
          - id: q02
            type: texte
            enonce: Quels autres éléments devriez-vous encore prendre en compte ?
            suite: []
          - id: q03
            type: texte
            enonce: Pourquoi le prix de la pièce ne suffit-il pas pour décider ?
            suite:
                - type: titre
                  texte: Besoin d’un indice ?
                - type: paragraphe
                  texte: Pensez à l’âge du robot, à la batterie, aux autres composants usés, au temps de réparation et à la durée d’utilisation supplémentaire espérée.
    - id: a12
      titre: 8. Concevoir un robot plus facile à réparer
      contenu:
          - type: paragraphe
            texte: Imaginez maintenant une nouvelle génération de robot aspirateur conçue pour pouvoir être utilisée longtemps.
          - type: paragraphe
            texte: Proposez deux améliorations qui faciliteraient son entretien ou sa réparation.
          - type: paragraphe
            texte: "Pour chacune :"
          - type: liste
            elements:
                - "Modification proposée : ..."
                - "Pièce ou partie concernée : ..."
                - "Pourquoi la réparation serait plus facile : ..."
                - "Nouvelle contrainte possible : ..."
          - type: paragraphe
            texte: Vous pouvez vous appuyer sur les critères de l’indice de réparabilité étudiés précédemment.
      questions: []
    - id: a13
      titre: 9. Revenons à votre première décision
      contenu:
          - type: paragraphe
            texte: Reprenez votre réponse de la partie 2.
          - type: paragraphe
            texte: "Complétez :"
          - type: liste
            elements:
                - "Ma première décision était : ..."
                - "Maintenant, je choisirais : ..."
                - "Ma réponse a changé / n’a pas changé parce que : ..."
                - "Les trois critères qui me semblent les plus importants sont : ..."
          - type: paragraphe
            texte: Changer d’avis après avoir obtenu de nouvelles informations fait partie du raisonnement technique.
      questions: []
    - id: a14
      titre: 10. Mettons des mots sur ce que nous avons découvert
      contenu:
          - type: paragraphe
            texte: Un symptôme est ce que l’on observe lorsqu’un système ne fonctionne pas normalement.
          - type: paragraphe
            texte: Le diagnostic consiste à rechercher la cause probable du dysfonctionnement à l’aide d’observations et de vérifications.
          - type: paragraphe
            texte: La maintenance regroupe les opérations permettant de conserver ou de remettre un objet en état de fonctionner.
          - type: paragraphe
            texte: "La réparabilité dépend notamment :"
          - type: liste
            elements:
                - de la possibilité de diagnostiquer la panne ;
                - de la facilité de démontage ;
                - de la documentation disponible ;
                - de la disponibilité des pièces ;
                - du prix des pièces.
          - type: paragraphe
            texte: "Pour décider de réparer ou remplacer, il faut également prendre en compte :"
          - type: liste
            elements:
                - l’état général et l’âge du produit ;
                - le coût de la réparation ;
                - la difficulté ou la sécurité de l’intervention ;
                - la durée d’utilisation supplémentaire espérée ;
                - les conséquences liées au remplacement de l’appareil.
          - type: paragraphe
            texte: Une panne ne signifie donc pas automatiquement qu’il faut remplacer l’objet, mais réparer n’est pas non plus toujours la solution la plus pertinente.
      questions: []
    - id: a15
      titre: 11. Conclusion
      contenu:
          - type: paragraphe
            texte: "Rédigez quelques phrases pour répondre à la problématique :"
          - type: paragraphe
            texte: Comment décider s’il vaut mieux réparer un objet en panne ou le remplacer ?
          - type: paragraphe
            texte: "Votre conclusion doit expliquer :"
          - type: liste
            elements:
                - pourquoi il faut commencer par diagnostiquer la panne ;
                - pourquoi le prix n’est pas le seul critère ;
                - pourquoi la réparabilité du produit est importante ;
                - pourquoi la décision dépend de la situation.
      questions: []
    - id: a16
      titre: 12. Rendu de fin de séance
      contenu:
          - type: paragraphe
            texte: À la fin du cours, votre fichier doit être rendu, même s’il n’est pas terminé.
          - type: paragraphe
            texte: "Déposez :"
          - type: paragraphe
            texte: 4e_S8_nom.odt
          - type: paragraphe
            texte: "Avant de le rendre, vérifiez :"
          - type: liste
            elements:
                - votre nom, la date et le titre ;
                - votre démarche de diagnostic ;
                - les informations relevées dans les sources ;
                - votre tableau des trois situations ;
                - vos décisions et leurs justifications ;
                - la comparaison entre votre première et votre dernière décision ;
                - votre conclusion.
      questions: []
    - id: a17
      titre: Références pédagogiques
      contenu:
