titre: 'Séance 8 : Comment protéger un compte ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Comment un site sait-il que c’est bien moi, et comment protéger mes comptes ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
objectifs:
    connaissances:
        - L’identification dit qui je suis (identifiant) ; l’authentification le prouve (mot de passe, code reçu, empreinte).
        - 'La double authentification demande deux preuves différentes : quelque chose que je sais et quelque chose que j’ai.'
    competences:
        - Distinguer identification et authentification.
        - Créer un mot de passe solide avec une méthode.
pourquoi:
    - En 5e, tu as appris ce qu’est un mot de passe solide et comment repérer l’hameçonnage.
    - 'En 4e, tu vas plus loin : comment le site vérifie qui tu es, et comment ajouter une deuxième protection.'
activites:
    -   id: a01
        titre: Identifier ou authentifier ?
        consigne: Tu vas apprendre la différence entre s’identifier et s’authentifier, à partir de l’exemple du site de cours. On attend, pour chaque élément du tableau, le bon mot.
        contenu:
            -   type: paragraphe
                texte: 'Exemple expliqué : sur le site de cours, ton adresse e-mail t’identifie (elle dit qui tu prétends être) ; ton mot de passe t’authentifie (il prouve que c’est bien toi).'
            -   type: etapes
                elements:
                    - Lis l’exemple expliqué.
                    - 'Pour chaque élément du tableau, demande-toi : dit-il qui je suis, ou le prouve-t-il ?'
                    - Écris « identification » ou « authentification ».
            -   type: paragraphe
                texte: Pourquoi deux étapes ? Tout le monde peut connaître ton identifiant ; seule la preuve (mot de passe, code) montre que c’est vraiment toi.
        questions:
            -   id: q01
                type: tableau
                enonce: Pour chaque élément, écris « identification » ou « authentification ».
                colonnes:
                    - Élément
                    - Rôle
                lignes:
                    -   - Nom d’utilisateur
                        - ''
                    -   - Mot de passe
                        - ''
                    -   - Code reçu par SMS
                        - ''
                    -   - Empreinte digitale
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
    -   id: a02
        titre: Un mot de passe solide
        transition: Tu sais comment le site te reconnaît. Le mot de passe reste la première protection.
        consigne: Tu vas comparer la solidité de mots de passe (document 1) et apprendre la méthode des phrases. On attend le mot de passe le plus solide et un exemple inventé (jamais ton vrai mot de passe).
        contenu:
            -   type: paragraphe
                texte: 'Méthode des phrases : « Mon chat Tigrou a 3 ans et adore le lait ! » → « McTa3aeall! »'
            -   type: tableau
                titre: Document 1
                colonnes:
                    - Mot de passe
                    - Longueur
                    - Types de caractères
                lignes:
                    -   - soleil
                        - '6'
                        - minuscules
                    -   - Soleil2012
                        - '10'
                        - minuscules, majuscule, chiffres
                    -   - McTa3aeall!
                        - '11'
                        - minuscules, majuscules, chiffre, symbole
            -   type: etapes
                elements:
                    - Lis la méthode des phrases.
                    - Invente une phrase que tu retiendras (pas un vrai mot de passe !).
                    - Garde la première lettre de chaque mot, les chiffres et la ponctuation.
                    - Compare avec le document 1.
            -   type: paragraphe
                texte: 'Pourquoi une phrase ? Elle donne un mot de passe long et varié, mais facile à retenir : on n’a pas besoin de l’écrire sur un papier.'
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 1, quel mot de passe est le plus solide ?
                choix:
                    -   id: a
                        texte: McTa3aeall!
                    -   id: b
                        texte: Soleil2012
                    -   id: c
                        texte: soleil
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Écris ta phrase inventée et le mot de passe obtenu avec la méthode.
                aide: Une idée réaliste + « Cela permet de… ».
    -   id: a03
        titre: La double authentification
        transition: Un mot de passe peut être volé. Il existe une deuxième protection.
        consigne: Tu vas comprendre la double authentification à partir du principe expliqué ci-dessous. On attend une explication de la protection qu’elle apporte et la bonne réaction face à une demande de code.
        contenu:
            -   type: paragraphe
                texte: Avec la double authentification, après le mot de passe, le site envoie un code sur ton téléphone, valable quelques minutes.
            -   type: etapes
                elements:
                    - Lis le principe ci-dessous.
                    - 'Imagine qu’un pirate connaît ton mot de passe : que lui manque-t-il ?'
                    - Réponds aux deux questions.
            -   type: paragraphe
                texte: 'Pourquoi deux preuves ? Même si l’une est volée, le pirate n’a pas l’autre : ton compte reste protégé.'
        questions:
            -   id: q01
                type: texte
                enonce: Un pirate a volé ton mot de passe. Explique pourquoi la double authentification l’empêche d’entrer.
                aide: Une idée + « car » + une raison tirée de la séance.
            -   id: q02
                type: qcm
                enonce: Quelqu’un t’appelle en disant travailler pour le site et te demande le code reçu par SMS. Que fais-tu ?
                choix:
                    -   id: a
                        texte: Je ne le donne jamais et je raccroche.
                    -   id: b
                        texte: Je le donne.
                    -   id: c
                        texte: Je donne la moitié du code.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a04
        titre: Je m’entraîne
        transition: Tu as compris la méthode. Applique-la seul sur un cas nouveau.
        consigne: 'Tu vas appliquer seul ce que tu as appris sur un cas nouveau : les comptes de Noa, décrits ci-dessous. On attend deux conseils précis, chacun expliqué.'
        contenu:
            -   type: citation
                texte: Noa utilise le même mot de passe « noa2012 » pour ses jeux, sa messagerie et son ENT. Il l’a noté dans les notes de son téléphone.
            -   type: etapes
                elements:
                    - Lis la situation de Noa.
                    - Repère ce qui est dangereux.
                    - Propose deux conseils précis.
            -   type: paragraphe
                texte: Pourquoi un cas pratique ? Savoir conseiller quelqu’un montre que tu as compris les règles de protection.
        questions:
            -   id: q01
                type: texte
                enonce: Donne deux conseils à Noa pour mieux protéger ses comptes, et explique-les.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a05
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un gestionnaire de mots de passe retient tous tes mots de passe derrière un seul mot de passe maître.
        questions:
            -   id: q01
                type: texte
                enonce: Quel est l’avantage et le risque d’un gestionnaire de mots de passe ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a06
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as compris comment un compte est protégé. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment un site sait-il que c’est bien toi, et comment protéger tes comptes ? Cite au moins trois protections.'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Identifier (qui je suis) ≠ authentifier (je le prouve).
    - 'Double authentification : deux preuves ; on ne donne jamais un code reçu.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
