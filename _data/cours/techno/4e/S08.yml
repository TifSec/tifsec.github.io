titre: 'Séance 8 : Comment protéger un compte ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Comment un site sait-il que c’est bien moi, et comment protéger mes comptes ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
objectifs:
    connaissances:
        - L’identification dit qui je suis (identifiant) ; l’authentification le prouve (mot de passe, code reçu, empreinte).
        - 'La double authentification demande deux preuves différentes : quelque chose que je sais et quelque chose que j’ai (téléphone).'
    competences:
        - Distinguer identification et authentification.
        - Juger la solidité d’un mot de passe et proposer une méthode pour en créer un.
pourquoi:
    - En 5e, tu as vu ce qu’est un mot de passe solide et comment repérer l’hameçonnage.
    - 'En 4e, tu vas plus loin : comment le site vérifie qui tu es, et comment ajouter une deuxième protection.'
activites:
    -   id: a01
        titre: Identifier ou authentifier ?
        contenu:
            -   type: paragraphe
                texte: 'Exemple expliqué : sur le site de cours, ton adresse e-mail t’identifie (elle dit qui tu prétends être) ; ton mot de passe t’authentifie (il prouve que c’est bien toi).'
        questions:
            -   id: q01
                type: tableau
                enonce: Pour chaque élément, écris « identification » ou « authentification ».
                colonnes:
                    - Élément
                    - Rôle
                lignes:
                    -   - Nom d’utilisateur
                        - ''
                    -   - Mot de passe
                        - ''
                    -   - Code reçu par SMS
                        - ''
                    -   - Empreinte digitale
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
    -   id: a02
        titre: Un mot de passe solide
        transition: Tu sais comment le site te reconnaît. Le mot de passe reste la première protection.
        contenu:
            -   type: paragraphe
                texte: 'Méthode des phrases : on choisit une phrase facile à retenir et on garde la première lettre de chaque mot, avec les chiffres et la ponctuation. « Mon chat Tigrou a 3 ans et adore le lait ! » → « McTa3aeall! »'
            -   type: tableau
                titre: Document 1
                colonnes:
                    - Mot de passe
                    - Longueur
                    - Types de caractères
                lignes:
                    -   - soleil
                        - '6'
                        - minuscules
                    -   - Soleil2012
                        - '10'
                        - minuscules, majuscule, chiffres
                    -   - McTa3aeall!
                        - '11'
                        - minuscules, majuscules, chiffre, symbole
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 1, quel mot de passe est le plus solide ?
                choix:
                    -   id: a
                        texte: McTa3aeall!
                    -   id: b
                        texte: Soleil2012
                    -   id: c
                        texte: soleil
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Invente une phrase et transforme-la en mot de passe avec la méthode (n’utilise pas un vrai mot de passe !).
                aide: Une idée réaliste + « Cela permet de… ».
    -   id: a03
        titre: La double authentification
        transition: Un mot de passe peut être volé. Il existe une deuxième protection.
        contenu:
            -   type: paragraphe
                texte: Avec la double authentification, après le mot de passe, le site envoie un code sur ton téléphone, valable quelques minutes.
        questions:
            -   id: q01
                type: texte
                enonce: Un pirate a volé ton mot de passe. Explique pourquoi la double authentification l’empêche quand même d’entrer.
                aide: Une idée + « car » + une raison tirée de la séance.
            -   id: q02
                type: qcm
                enonce: Quelqu’un t’appelle en disant travailler pour le site et te demande le code reçu par SMS. Que fais-tu ?
                choix:
                    -   id: a
                        texte: Je ne donne jamais ce code et je raccroche.
                    -   id: b
                        texte: Je le donne car il travaille pour le site.
                    -   id: c
                        texte: Je donne seulement la moitié du code.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un gestionnaire de mots de passe retient tous tes mots de passe derrière un seul mot de passe maître.
        questions:
            -   id: q01
                type: texte
                enonce: Quel est l’avantage et le risque d’un gestionnaire de mots de passe ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as compris comment un compte est protégé. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment un site sait-il que c’est bien toi, et comment protéger tes comptes ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Identifier (qui je suis) ≠ authentifier (je le prouve).
    - 'Double authentification : deux preuves ; on ne donne jamais un code reçu.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
