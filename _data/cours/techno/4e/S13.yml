titre: 'Séance 13 : De quoi est fait le réseau du collège ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Quels équipements relient les ordinateurs du collège entre eux et à Internet ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - Un réseau relie des terminaux (ordinateurs, imprimantes) par des liaisons (câbles, Wi-Fi).
        - Le commutateur (switch) relie les appareils d’un réseau local ; le point d’accès Wi-Fi relie les appareils sans fil ; le routeur relie le réseau du collège à Internet.
        - Quand tous les appareils sont reliés au même commutateur, on parle de topologie en étoile.
    competences:
        - Identifier les équipements d’un réseau local et leur rôle.
        - Décrire la topologie d’un réseau.
pourquoi:
    - Depuis la séance 8, tu as vu comment protéger tes données.
    - Mais par où passent-elles ? Aujourd’hui, tu enquêtes sur le réseau du collège, à partir de photos.
activites:
    -   id: a01
        titre: Les équipements du réseau
        consigne: Tu vas découvrir les équipements du réseau du collège (ordinateur, commutateur, routeur, point d’accès…) à partir du document 1 et des photos projetées. On attend que tu associes chaque photo à son équipement et que tu dises si une impression passe par Internet.
        contenu:
            -   type: tableau
                titre: Document 1
                colonnes:
                    - Équipement
                    - Rôle
                lignes:
                    -   - Terminal (ordinateur, imprimante)
                        - Envoie ou reçoit des données.
                    -   - Commutateur (switch)
                        - Relie les appareils d’un réseau local et envoie chaque message au bon destinataire.
                    -   - Point d’accès Wi-Fi
                        - Relie les appareils sans fil au réseau.
                    -   - Routeur (ou box)
                        - Relie le réseau local à un autre réseau, comme Internet.
                    -   - Serveur
                        - Ordinateur qui rend un service aux autres.
            -   type: etapes
                elements:
                    - 'Lis le document 1 : le rôle de chaque équipement.'
                    - Observe les photos projetées (décrites dans le tableau de la question).
                    - Associe chaque photo à son équipement.
            -   type: paragraphe
                texte: Pourquoi connaître ces équipements ? Quand « Internet ne marche plus », savoir lequel est en cause permet de trouver la panne.
        questions:
            -   id: q01
                type: tableau
                enonce: Associe chaque photo (décrite) à son équipement.
                colonnes:
                    - Photo
                    - Équipement
                lignes:
                    -   - Boîtier avec 24 prises et des voyants, dans une armoire
                        - ''
                    -   - Petit boîtier blanc fixé au plafond, logo d’ondes
                        - ''
                    -   - Boîtier qui relie le collège à la fibre
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
            -   id: q02
                type: qcm
                enonce: Un élève imprime dans la salle. Son document passe-t-il par Internet ?
                choix:
                    -   id: a
                        texte: 'Non : il reste dans le réseau local.'
                    -   id: b
                        texte: Oui, toujours.
                    -   id: c
                        texte: Seulement en couleur.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a02
        titre: La topologie de la salle
        transition: Tu connais les équipements. Voyons comment ils sont reliés.
        consigne: Tu vas étudier l’organisation du réseau de la salle de technologie, décrite ci-dessous (15 ordinateurs, une imprimante, un commutateur). On attend le nom de cette organisation et ce qui se passe en cas de panne d’un câble ou du commutateur.
        contenu:
            -   type: paragraphe
                texte: Dans la salle de technologie, les 15 ordinateurs et l’imprimante sont chacun reliés par un câble au même commutateur.
            -   type: etapes
                elements:
                    - Lis la description de la salle.
                    - Dessine dans ta tête le commutateur au centre et les ordinateurs autour.
                    - Imagine qu’un câble est débranché, puis que le commutateur tombe en panne.
            -   type: paragraphe
                texte: 'Pourquoi parler de topologie ? La forme du réseau dit ce qui se passe en cas de panne : un seul poste coupé, ou toute la salle.'
        questions:
            -   id: q01
                type: qcm
                enonce: Comment s’appelle cette organisation ?
                choix:
                    -   id: a
                        texte: Une topologie en étoile.
                    -   id: b
                        texte: Une topologie en ligne.
                    -   id: c
                        texte: Un réseau sans liaison.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Que se passe-t-il si le câble d’un seul ordinateur est débranché ? Et si le commutateur tombe en panne ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a03
        titre: Le chemin d’une recherche sur Internet
        transition: Le réseau de la salle est relié au reste du monde.
        consigne: Tu vas suivre le trajet d’une recherche sur Internet, depuis un poste de la salle jusqu’au site, en utilisant les équipements du document 1. On attend les équipements cités dans l’ordre, aller et retour.
        contenu:
            -   type: etapes
                elements:
                    - Pars du poste de la salle.
                    - Cite les équipements traversés dans l’ordre, jusqu’au site.
                    - N’oublie pas que la réponse revient.
            -   type: paragraphe
                texte: Pourquoi suivre le chemin ? C’est la base pour comprendre Internet, que tu étudieras en 3e.
        questions:
            -   id: q01
                type: texte
                enonce: Explique le chemin d’une recherche sur Internet depuis un poste de la salle, en citant les équipements dans l’ordre.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Je m’entraîne
        transition: Tu as compris la méthode. Applique-la seul sur un cas nouveau.
        consigne: 'Tu vas appliquer seul ce que tu as appris sur un cas nouveau : le réseau d’une maison, décrit ci-dessous. On attend le rôle de chaque équipement et ce qui se passe si la box tombe en panne.'
        contenu:
            -   type: citation
                texte: 'À la maison, une box est reliée à la fibre. Elle fait aussi point d’accès Wi-Fi : deux ordinateurs, une console et deux téléphones s’y connectent.'
            -   type: etapes
                elements:
                    - Lis la description du réseau de la maison.
                    - Repère chaque équipement et son rôle.
                    - Réponds aux deux questions.
            -   type: paragraphe
                texte: 'Pourquoi la maison ? C’est le même principe qu’au collège, en plus petit : un bon test pour vérifier ta compréhension.'
        questions:
            -   id: q01
                type: tableau
                enonce: Donne le rôle de chaque équipement de la maison.
                colonnes:
                    - Équipement
                    - Rôle
                lignes:
                    -   - La box
                        - ''
                    -   - Le Wi-Fi de la box
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
            -   id: q02
                type: qcm
                enonce: La box tombe en panne. Les deux ordinateurs de la maison peuvent-ils encore aller sur Internet ?
                choix:
                    -   id: a
                        texte: Non.
                    -   id: b
                        texte: Oui.
                    -   id: c
                        texte: Un seul.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a05
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le Wi-Fi et le câble transportent tous les deux des données.
        questions:
            -   id: q01
                type: texte
                enonce: Donne un avantage et un inconvénient du Wi-Fi par rapport au câble.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a06
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as exploré le réseau du collège. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quels équipements relient les ordinateurs du collège entre eux et à Internet ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Terminaux + liaisons + commutateur = réseau local ; le routeur relie à Internet.
    - 'Topologie en étoile : tous reliés au même commutateur.'
sources:
