titre: 'Séance 13 : De quoi est fait le réseau du collège ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Quels équipements relient les ordinateurs du collège entre eux et à Internet ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - Un réseau informatique relie des terminaux (ordinateurs, imprimantes, tablettes) par des liaisons (câbles, Wi-Fi).
        - Le commutateur (switch) relie les appareils d’un même réseau local ; le point d’accès Wi-Fi relie les appareils sans fil ; le routeur relie le réseau du collège à Internet.
        - Quand tous les appareils sont reliés à un même commutateur, on parle de topologie en étoile.
    competences:
        - Identifier les équipements d’un réseau local et leur rôle.
        - Décrire la topologie d’un réseau.
pourquoi:
    - Depuis la séance 8, tu as vu comment protéger tes données.
    - Mais par où passent-elles ? Aujourd’hui, tu enquêtes sur le réseau du collège, à partir de photos.
activites:
    -   id: a01
        titre: Les équipements
        contenu:
            -   type: tableau
                titre: Document 1 — Les équipements d’un réseau
                colonnes:
                    - Équipement
                    - Rôle
                lignes:
                    -   - Terminal (ordinateur, imprimante)
                        - Envoie ou reçoit des données.
                    -   - Commutateur (switch)
                        - Relie les appareils d’un même réseau local et transmet chaque message au bon destinataire.
                    -   - Point d’accès Wi-Fi
                        - Relie les appareils sans fil au réseau.
                    -   - Routeur (ou box)
                        - Relie le réseau local à un autre réseau, par exemple Internet.
                    -   - Serveur
                        - Ordinateur qui rend un service aux autres (fichiers, impression).
            -   type: paragraphe
                texte: 'Exemple expliqué : quand tu imprimes depuis un poste de la salle de technologie, ton fichier passe par le câble, puis par le commutateur de la salle, qui l’envoie à l’imprimante. Il ne sort pas sur Internet.'
        questions:
            -   id: q01
                type: tableau
                enonce: Associe chaque photo (décrite) à son équipement.
                colonnes:
                    - Photo
                    - Équipement
                lignes:
                    -   - Boîtier avec 24 prises réseau et des voyants qui clignotent, dans une armoire
                        - ''
                    -   - Petit boîtier blanc fixé au plafond, avec un logo d’ondes
                        - ''
                    -   - Boîtier qui relie le collège à la fibre de l’opérateur
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
            -   id: q02
                type: qcm
                enonce: Un élève imprime dans la salle. Son document passe-t-il par Internet ?
                choix:
                    -   id: a
                        texte: 'Non : il reste dans le réseau local (ordinateur → commutateur → imprimante).'
                    -   id: b
                        texte: Oui, toujours.
                    -   id: c
                        texte: Seulement s’il est en couleur.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a02
        titre: La topologie
        transition: Tu connais les équipements. Voyons comment ils sont reliés.
        contenu:
            -   type: paragraphe
                texte: Dans la salle de technologie, les 15 ordinateurs et l’imprimante sont chacun reliés par un câble au même commutateur.
        questions:
            -   id: q01
                type: qcm
                enonce: Comment s’appelle cette organisation ?
                choix:
                    -   id: a
                        texte: Une topologie en étoile.
                    -   id: b
                        texte: Une topologie en ligne.
                    -   id: c
                        texte: Un réseau sans liaison.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Que se passe-t-il pour les autres ordinateurs si le câble d’un seul ordinateur est débranché ? Et si le commutateur tombe en panne ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a03
        titre: Réseau local et Internet
        transition: Le réseau de la salle est relié au reste du monde. Par où passe une recherche sur Internet ?
        questions:
            -   id: q01
                type: texte
                enonce: Explique le chemin d’une recherche sur Internet depuis un poste de la salle, en citant les équipements dans l’ordre.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le Wi-Fi et le câble transportent tous les deux des données.
        questions:
            -   id: q01
                type: texte
                enonce: Donne un avantage et un inconvénient du Wi-Fi par rapport au câble.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as exploré le réseau du collège. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quels équipements relient les ordinateurs du collège entre eux et à Internet ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Terminaux + liaisons (câble, Wi-Fi) + commutateur = réseau local ; le routeur relie à Internet.
    - 'Topologie en étoile : tous les appareils reliés au même commutateur.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
