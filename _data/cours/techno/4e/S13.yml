titre: "Comment retrouver une valeur dans deux notices ?"
theme: "Word et recherche technique"
problematique: "Comment retrouver une valeur dans deux notices ?"
pourquoi: "On compare le même paramètre et on conserve son unité."
application: "Un document clair aide une autre personne à retrouver une information technique."
lien_precedent: "Après Comment ajouter un schéma que le lecteur peut comprendre ?, une nouvelle mission t’aide à réutiliser tes méthodes."
prerequis:
    - "Tu peux relire la séance précédente (Comment ajouter un schéma que le lecteur peut comprendre ?) si nécessaire."
notions:
    - titre: "Un exemple expliqué"
      texte: "Une notice indique 1,2 kg et l’autre 950 g. Je convertis 1,2 kg en 1 200 g ; je peux alors comparer les deux valeurs."
objectifs:
    connaissances:
        - "On compare le même paramètre et on conserve son unité."
    competences:
        - "Comparer deux notices fournies et relever un paramètre commun, sa valeur et son unité."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : On compare le même paramètre et on conserve son unité."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Comparer deux notices fournies et relever un paramètre commun, sa valeur et son unité."
    - type: paragraphe
      texte: "Dans la vie réelle : Un document clair aide une autre personne à retrouver une information technique."
activites:
    - id: a01
      titre: "1. Comprendre la mission"
      pourquoi: "On commence par un exemple guidé : il montre une méthode avant que tu l’essaies."
      demarche:
          - Lis la situation.
          - Suis les étapes de l’exemple.
          - Repère la donnée qui aide à répondre.
      contenu:
          - type: paragraphe
            texte: "Une notice indique 1,2 kg et l’autre 950 g. Je convertis 1,2 kg en 1 200 g ; je peux alors comparer les deux valeurs."
      questions:
          - id: q01
            type: texte
            enonce: "Pourquoi faut-il comparer le même paramètre dans les deux notices ?"
            aide: "Relis l’exemple et repère l’information qui répond à la question."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
            aide: "Une ou deux phrases suffisent."
    - id: a02
      titre: "2. À toi d’essayer"
      pourquoi: "Tu as vu la méthode ; maintenant, applique-la dans une tâche que tu peux vérifier."
      demarche:
          - Réalise les étapes dans l’ordre.
          - Note le résultat attendu.
          - Compare-le au résultat observé.
      consigne: "Comparer deux notices fournies et relever un paramètre commun, sa valeur et son unité."
      questions:
          - id: q01
            type: texte
            enonce: "Quel résultat observes-tu ? Décris ton essai."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
      ressources:
          - type: lien
            titre: "Éduscol — Technologie au cycle 4"
            url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
    - id: a03
      titre: "3. Réutiliser la méthode"
      pourquoi: "Un nouvel exemple t’aide à voir où cette méthode peut encore servir."
      contenu:
          - type: paragraphe
            texte: "Reprends la méthode avec une nouvelle valeur, un autre document ou une autre situation du dossier."
      questions:
          - id: q01
            type: texte
            enonce: "Quelle information permet de justifier ta conclusion ? Quelle limite reste à vérifier ?"
    - id: a04
      titre: "4. Ce que tu retiens"
      pourquoi: "Tu termines en gardant une idée et une méthode pour la prochaine séance."
      demarche:
          - Relis les deux éléments à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "On compare le même paramètre et on conserve son unité."
    - "Pour vérifier, je compare une réponse ou un essai à une donnée précise."
bilan: "Je peux expliquer ce que j’ai appris et montrer une réponse ou un essai comme preuve."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie cycle 4 : cette séance travaille on compare le même paramètre et on conserve son unité.. Elle contribue progressivement aux compétences de fin de cycle."
    - type: lien
      titre: "Ministère — Programme de Technologie du cycle 4, BO 2024"
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
    - type: lien
      titre: "Éduscol — Technologie au cycle 4"
      url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
