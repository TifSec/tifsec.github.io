titre: 'Séance 33 : Une vague d’ennemis'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment gérer plusieurs objets du même type avec une liste et une boucle « pour chaque » ?
competences_bo:
    - Concevoir, écrire, tester et mettre au point un programme
objectifs:
    connaissances:
        - 'Une liste (tableau) range plusieurs valeurs ou objets sous un seul nom : liste des fruits, liste des scores.'
        - La boucle « pour chaque élément de la liste » applique la même action à tous les éléments.
    competences:
        - Créer et parcourir une liste.
        - Utiliser une boucle « pour chaque ».
pourquoi:
    - En séance 32, tu as fait tomber les fruits un par un.
    - 'Aujourd’hui, tu ajoutes une vague de pièges qui doivent tous changer de vitesse en même temps : il faut une liste.'
activites:
    -   id: a01
        titre: Comprendre une liste
        contenu:
            -   type: paragraphe
                texte: 'Exemple expliqué : liste vitesses = [30, 50, 80]. L’élément d’indice 0 vaut 30, l’élément d’indice 1 vaut 50, l’élément d’indice 2 vaut 80. La longueur de la liste est 3.'
        questions:
            -   id: q01
                type: tableau
                enonce: Pour la liste couleurs = [rouge, vert, bleu, jaune], complète.
                colonnes:
                    - Question
                    - Réponse
                lignes:
                    -   - Élément d’indice 0
                        - ''
                    -   - Élément d’indice 2
                        - ''
                    -   - Longueur de la liste
                        - ''
                aide: Ligne × colonne.
            -   id: q02
                type: qcm
                enonce: Pourquoi l’indice du premier élément est-il 0 ?
                choix:
                    -   id: a
                        texte: 'C’est une convention des langages de programmation : on compte à partir de 0.'
                    -   id: b
                        texte: C’est une erreur.
                    -   id: c
                        texte: Le premier élément est vide.
                aide: Relis l’exemple expliqué.
    -   id: a02
        titre: La vague
        transition: Tu sais ce qu’est une liste. Utilise-la pour piloter une vague de pièges.
        contenu:
            -   type: etapes
                elements:
                    - Au démarrage, crée 5 sprites « piège » (type Enemy) et ajoute-les à une liste « pièges » (bloc « tableau de sprites de type Enemy »).
                    - 'Toutes les 5 secondes : « pour chaque élément valeur de pièges » : mettre vy de valeur à 80.'
                    - 'Teste : tous les pièges accélèrent en même temps.'
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi la boucle « pour chaque » est-elle plus pratique que 5 blocs « mettre vy » ?
                aide: Bloc par bloc (réflexe n° 9).
            -   id: q02
                type: texte
                enonce: Décris en langage naturel ce que fait ton programme toutes les 5 secondes.
                aide: Bloc par bloc (réflexe n° 9).
        ressources:
            - &id001
                type: lien
                titre: MakeCode Arcade (gratuit, dans le navigateur)
                url: https://arcade.makecode.com/
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: On peut compter les éléments d’une liste.
        questions:
            -   id: q01
                type: texte
                enonce: Affiche le nombre de pièges encore présents. Quel bloc utilises-tu ?
                aide: Bloc par bloc (réflexe n° 9).
        ressources:
            - *id001
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ta vague fonctionne. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment gérer plusieurs objets du même type ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Liste : plusieurs éléments sous un même nom ; indice à partir de 0 ; longueur.'
    - « pour chaque » applique la même action à tous les éléments.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
