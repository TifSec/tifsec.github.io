titre: 'Séance 11 : Vrai ou faux ? Vérifier une information en ligne'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Comment vérifier qu’une information trouvée en ligne est fiable ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
objectifs:
    connaissances:
        - 'On vérifie une information avec trois questions : qui l’a écrite ? quand ? d’autres sources sérieuses disent-elles la même chose ?'
        - Une image peut être retouchée ou sortie de son contexte ; une recherche d’image inversée permet de retrouver son origine.
    competences:
        - Évaluer la fiabilité d’une source.
        - Croiser les sources.
pourquoi:
    - En séance 10, tu as appris à citer une source.
    - Mais toutes les sources ne se valent pas. Aujourd’hui, tu joues les vérificateurs d’information.
activites:
    -   id: a01
        titre: Qui, quand, d’autres sources ?
        contenu:
            -   type: titre
                texte: Document 1 — Un message partagé sur un réseau social (inventé)
            -   type: citation
                texte: '« INCROYABLE : une éolienne de jardin produit assez d’électricité pour 10 maisons ! Partagez avant que ce soit censuré !!! » — publié par @SuperEnergie2000, sans date, sans lien.'
            -   type: paragraphe
                texte: 'Exemple expliqué : ce message est douteux. On ne sait pas qui est l’auteur, il n’y a pas de date ni de source, il cherche à faire réagir (« INCROYABLE », « censuré », points d’exclamation). Et d’après la séance 21 de 5e, une petite éolienne produit peu.'
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, réponds aux trois questions de vérification.
                colonnes:
                    - Question
                    - Réponse
                lignes:
                    -   - Qui l’a écrit ?
                        - ''
                    -   - Quand ?
                        - ''
                    -   - D’autres sources ?
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
            -   id: q02
                type: qcm
                enonce: Quel indice montre que le message cherche surtout à faire réagir ?
                choix:
                    -   id: a
                        texte: Les mots « INCROYABLE », « censuré » et les points d’exclamation.
                    -   id: b
                        texte: Le mot « éolienne ».
                    -   id: c
                        texte: Le nombre 10.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a02
        titre: Croiser les sources
        transition: Un message douteux se vérifie en le comparant à d’autres sources.
        contenu:
            -   type: tableau
                titre: Document 2 — Trois sources sur les petites éoliennes
                colonnes:
                    - Source
                    - Qui ?
                    - Ce qu’elle dit
                lignes:
                    -   - Site de l’ADEME (agence publique)
                        - Experts de l’énergie
                        - Une petite éolienne de jardin produit peu, souvent moins qu’un panneau solaire de même prix.
                    -   - Blog d’un vendeur d’éoliennes
                        - Une entreprise qui vend
                        - Notre éolienne est la meilleure du marché !
                    -   - Journal régional
                        - Journaliste
                        - Un habitant a installé une éolienne ; elle couvre une partie de ses besoins.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 2, quelle source est la plus fiable pour connaître la production d’une petite éolienne ? Justifie.
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
            -   id: q02
                type: qcm
                enonce: Le message du document 1 est-il confirmé par les sources du document 2 ?
                choix:
                    -   id: a
                        texte: 'Non : aucune source sérieuse ne dit qu’une petite éolienne alimente 10 maisons.'
                    -   id: b
                        texte: Oui, par le vendeur.
                    -   id: c
                        texte: Oui, par toutes.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a03
        titre: Une image trompeuse
        transition: Les images aussi peuvent tromper.
        contenu:
            -   type: paragraphe
                texte: Une photo d’une immense centrale solaire circule avec la légende « notre collège l’an prochain ». Une recherche d’image inversée montre qu’elle a été prise en Espagne en 2015.
        questions:
            -   id: q01
                type: texte
                enonce: Comment cette recherche prouve-t-elle que la légende est fausse ? Que faut-il faire avant de partager ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Certaines images sont créées par une intelligence artificielle.
        questions:
            -   id: q01
                type: texte
                enonce: Cite un indice qui peut trahir une image fabriquée par une IA.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais vérifier une information. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment vérifier qu’une information trouvée en ligne est fiable ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Vérifier : qui ? quand ? d’autres sources sérieuses ?'
    - Se méfier des messages qui jouent sur l’émotion ; vérifier l’origine d’une image.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
