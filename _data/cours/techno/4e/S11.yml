titre: 'Séance 11 : Vrai ou faux ? Vérifier une information en ligne'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Comment vérifier qu’une information trouvée en ligne est fiable ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
objectifs:
    connaissances:
        - 'On vérifie une information avec trois questions : qui l’a écrite ? quand ? d’autres sources sérieuses disent-elles la même chose ?'
        - Une image peut être sortie de son contexte ; une recherche d’image inversée permet de retrouver son origine.
    competences:
        - Évaluer la fiabilité d’une source.
        - Croiser les sources.
pourquoi:
    - En séance 10, tu as appris à citer une source.
    - Mais toutes les sources ne se valent pas. Aujourd’hui, tu joues les vérificateurs.
activites:
    -   id: a01
        titre: Les trois questions
        consigne: 'Tu vas vérifier un message partagé sur un réseau social (document 1, inventé) avec trois questions : qui, quand, quelle source. On attend les trois réponses et l’indice qui montre que le message veut faire réagir.'
        contenu:
            -   type: titre
                texte: Document 1 — Un message partagé sur un réseau social (inventé)
            -   type: citation
                texte: '« INCROYABLE : une éolienne de jardin produit assez d’électricité pour 10 maisons ! Partagez avant que ce soit censuré !!! » — publié par @SuperEnergie2000, sans date, sans lien.'
            -   type: etapes
                elements:
                    - Lis le message du document 1.
                    - Cherche qui l’a écrit, quand, et s’il cite une source.
                    - Repère les mots qui cherchent à te faire réagir.
            -   type: paragraphe
                texte: 'Pourquoi ces trois questions ? Une information sans auteur, sans date et sans source ne peut pas être vérifiée : il faut s’en méfier.'
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, réponds aux trois questions de vérification.
                colonnes:
                    - Question
                    - Réponse
                lignes:
                    -   - Qui l’a écrit ?
                        - ''
                    -   - Quand ?
                        - ''
                    -   - D’autres sources ?
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
            -   id: q02
                type: qcm
                enonce: Quel indice montre que le message cherche surtout à faire réagir ?
                choix:
                    -   id: a
                        texte: « INCROYABLE », « censuré » et les points d’exclamation.
                    -   id: b
                        texte: Le mot « éolienne ».
                    -   id: c
                        texte: Le nombre 10.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a02
        titre: Croiser les sources
        transition: Un message douteux se vérifie en le comparant à d’autres sources.
        consigne: Tu vas croiser plusieurs sources (document 2) pour vérifier le message du document 1 sur l’éolienne de jardin. On attend la source la plus fiable, justifiée, et ta conclusion sur le message.
        contenu:
            -   type: tableau
                titre: Document 2
                colonnes:
                    - Source
                    - Qui ?
                    - Ce qu’elle dit
                lignes:
                    -   - Site de l’ADEME (agence publique)
                        - Experts de l’énergie
                        - Une petite éolienne de jardin produit peu, souvent moins qu’un panneau solaire de même prix.
                    -   - Blog d’un vendeur d’éoliennes
                        - Une entreprise qui vend
                        - Notre éolienne est la meilleure du marché !
                    -   - Journal régional
                        - Journaliste
                        - Un habitant couvre une partie de ses besoins avec une éolienne.
            -   type: etapes
                elements:
                    - Lis le document 2.
                    - 'Pour chaque source, demande-toi : qui écrit ? a-t-il intérêt à exagérer ?'
                    - Compare ce qu’elles disent avec le message du document 1.
            -   type: paragraphe
                texte: Pourquoi croiser ? Si plusieurs sources sérieuses et indépendantes disent la même chose, l’information est probablement vraie.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 2, quelle source est la plus fiable pour connaître la production d’une petite éolienne ? Justifie.
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
            -   id: q02
                type: qcm
                enonce: Le message du document 1 est-il confirmé par le document 2 ?
                choix:
                    -   id: a
                        texte: Non.
                    -   id: b
                        texte: Oui, par le vendeur.
                    -   id: c
                        texte: Oui, par toutes.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a03
        titre: Une image trompeuse
        transition: Les images aussi peuvent tromper.
        consigne: Tu vas analyser une photo partagée avec une fausse légende, décrite ci-dessous. On attend ce que prouve la recherche d’image inversée et ce qu’il faut faire avant de partager.
        contenu:
            -   type: paragraphe
                texte: Une photo d’une immense centrale solaire circule avec la légende « notre collège l’an prochain ». Une recherche d’image inversée montre qu’elle a été prise en Espagne en 2015.
            -   type: etapes
                elements:
                    - Lis la situation.
                    - Explique ce que prouve la recherche d’image inversée.
                    - Dis ce qu’il faut faire avant de partager.
            -   type: paragraphe
                texte: Pourquoi les images aussi ? Une vraie photo avec une fausse légende trompe plus facilement qu’un texte, car on croit ce qu’on voit.
        questions:
            -   id: q01
                type: texte
                enonce: Comment la recherche prouve-t-elle que la légende est fausse ? Que faut-il faire avant de partager ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Je m’entraîne
        transition: Tu as compris la méthode. Applique-la seul sur un cas nouveau.
        consigne: 'Tu vas appliquer seul la méthode sur un cas nouveau : le titre d’article sur le Wi-Fi reproduit ci-dessous. On attend les trois questions appliquées et ta décision de partager ou non, justifiée.'
        contenu:
            -   type: citation
                texte: '« Scandale : le Wi-Fi des collèges bientôt interdit !!! » — site « infos-choc.biz », sans auteur, sans date, sans source.'
            -   type: etapes
                elements:
                    - Lis le titre d’article.
                    - Applique les trois questions de vérification.
                    - Dis si tu le partages ou non, et pourquoi.
            -   type: paragraphe
                texte: Pourquoi s’entraîner ? Vérifier avant de partager doit devenir un réflexe.
        questions:
            -   id: q01
                type: texte
                enonce: Applique les trois questions à cet article et dis si tu le partages. Justifie.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a05
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Certaines images sont créées par une intelligence artificielle.
        questions:
            -   id: q01
                type: texte
                enonce: Cite un indice qui peut trahir une image fabriquée par une IA.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a06
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais vérifier une information. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment vérifier qu’une information en ligne est fiable ? Cite la méthode complète.'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Vérifier : qui ? quand ? d’autres sources sérieuses ?'
    - Se méfier des messages émotionnels ; vérifier l’origine d’une image.
sources:
