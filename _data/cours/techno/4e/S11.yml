titre: "Séance 11 : Comment rendre une fiche technique facile à lire ?"
themes:
    - "Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser"
problematique: "Un client veut connaître les caractéristiques d’un robot aspirateur en moins d’une minute. Comment présenter la fiche technique pour qu’il trouve vite l’information ?"
competences_bo:
    - "Caractériser et choisir un objet ou un système technique selon différents critères"
objectifs:
    connaissances:
        - "Une fiche technique présente les caractéristiques d’un objet : ce qu’il fait, ses dimensions, son autonomie, son prix…"
        - "Dans un traitement de texte, un style de titre (Titre 1, Titre 2) organise le document et crée son plan."
    competences:
        - "Repérer ce qui rend un document facile ou difficile à lire."
        - "Appliquer les styles Titre 1 et Titre 2 dans Writer ou Word."
        - "Vérifier le plan de son document avec le Navigateur (ou le volet de navigation)."
pourquoi:
    - "Avant la Toussaint, tu as comparé des robots aspirateurs grâce à leurs caractéristiques. Tu as vu qu’il fallait parfois chercher longtemps l’information dans une fiche mal présentée."
    - "Aujourd’hui, c’est toi qui fabriques une fiche technique claire. Tu vas apprendre à utiliser les styles : c’est l’outil qu’utilisent tous les professionnels pour organiser un document."
activites:
    - id: a01
      titre: "Deux fiches pour le même robot"
      contenu:
          - type: paragraphe
            texte: "Voici deux fiches techniques du même robot aspirateur, le « Robot R2 ». Elles contiennent exactement les mêmes informations."
          - type: titre
            texte: "Fiche A"
          - type: paragraphe
            texte: "ROBOT R2 LE MEILLEUR ROBOT POUR VOTRE MAISON. Le Robot R2 aspire les sols durs et les tapis, il revient seul sur sa base pour se recharger, son autonomie est de 120 minutes, il mesure 33 cm de diamètre et 9 cm de haut, son bac à poussière contient 0,4 L, il fait 65 dB de bruit, il faut vider le bac après chaque passage et nettoyer la brosse une fois par semaine, il coûte 249 €."
          - type: titre
            texte: "Fiche B"
          - type: paragraphe
            texte: "Robot R2 — Fiche technique"
          - type: paragraphe
            texte: "À quoi sert-il ? Il aspire les sols durs et les tapis. Il revient seul sur sa base pour se recharger."
          - type: tableau
            colonnes:
                - Caractéristique
                - Valeur
            lignes:
                - - Autonomie
                  - 120 minutes
                - - Dimensions
                  - 33 cm de diamètre, 9 cm de haut
                - - Bac à poussière
                  - 0,4 L
                - - Bruit
                  - 65 dB
                - - Prix
                  - 249 €
          - type: paragraphe
            texte: "Entretien : vider le bac après chaque passage. Nettoyer la brosse une fois par semaine."
      questions:
          - id: q01
            type: qcm
            enonce: "Dans quelle fiche trouves-tu le plus vite l’autonomie du robot ?"
            choix:
                - id: b
                  texte: "Dans la fiche B."
                - id: a
                  texte: "Dans la fiche A."
                - id: pareil
                  texte: "C’est pareil dans les deux."
          - id: q02
            type: texte
            enonce: "Donne deux différences qui rendent la fiche B plus facile à lire."
            aide: "Regarde comment les informations sont rangées : en un seul bloc, ou en parties séparées ?"
    - id: a02
      titre: "L’outil des professionnels : les styles"
      transition: "Tu sais reconnaître une fiche claire. Mais comment la fabriquer proprement dans un traitement de texte ? On ne met pas simplement le texte en gros et en gras : on utilise des styles."
      contenu:
          - type: paragraphe
            texte: "Un style, c’est une mise en forme toute prête, avec un nom. Dans Writer ou Word, tu le choisis dans la liste en haut à gauche (là où il est écrit « Corps de texte » ou « Normal »)."
          - type: liste
            elements:
                - "Titre 1 : le grand titre du document (ici : « Robot R2 — Fiche technique »)."
                - "Titre 2 : le titre de chaque partie (ici : « À quoi sert-il ? », « Caractéristiques », « Entretien »)."
                - "Corps de texte (ou Normal) : les phrases normales."
          - type: paragraphe
            texte: "Pourquoi c’est utile ? Le logiciel comprend que ce texte est un titre. Il peut alors afficher le plan du document, créer un sommaire automatique, et changer la couleur de tous les titres en une seule fois."
      questions:
          - id: q01
            type: qcm
            enonce: "Quel style faut-il donner au titre de partie « Caractéristiques » ?"
            choix:
                - id: titre2
                  texte: "Titre 2"
                - id: titre1
                  texte: "Titre 1"
                - id: corps
                  texte: "Corps de texte, mis en gras"
          - id: q02
            type: texte
            enonce: "Léo a écrit ses titres en taille 18 et en gras, sans utiliser de style. Explique-lui ce qu’il perd."
            aide: "Relis la dernière phrase du cadre : qu’est-ce que le logiciel peut faire avec un vrai style de titre ?"
      ressources:
          - type: paragraphe
            texte: "Cette fiche montre où se trouvent les styles dans LibreOffice Writer et comment les appliquer."
          - type: lien
            titre: "Université du Littoral — Comment appliquer un style (Writer)"
            url: https://compnum.univ-littoral.fr/fiches/TT_Comment_appliquer_un_style.pdf
          - type: paragraphe
            texte: "Tu travailles avec Word ? Lis la partie « Si vous avez des entrées manquantes » : elle montre où choisir le style Titre 1 dans l’onglet Accueil."
          - type: lien
            titre: "Microsoft — Insérer une table des matières (styles de titre)"
            url: https://support.microsoft.com/fr-fr/office/ins%C3%A9rer-une-table-des-mati%C3%A8res-882e8564-0edb-435e-84b5-1d8552ccf0c0
    - id: a03
      titre: "À toi de fabriquer la fiche"
      transition: "Tu connais les styles. Maintenant, tu passes à la pratique : tu vas créer toi-même la fiche B dans le traitement de texte."
      demarche:
          - "Ouvre Writer (ou Word) et crée un nouveau document."
          - "Recopie le texte de la fiche B (activité 1). Le tableau peut attendre : écris d’abord les phrases."
          - "Mets le grand titre en Titre 1, puis les trois titres de partie en Titre 2."
          - "Ouvre le Navigateur avec la touche F5 (Writer), ou le volet de navigation avec Ctrl + F (Word). Les titres doivent tous y apparaître."
          - "Enregistre ton fichier : il te servira à la séance 12."
      questions:
          - id: q01
            type: tableau
            enonce: "Quel style as-tu donné à chaque ligne ?"
            colonnes:
                - Ligne de la fiche
                - Style utilisé
            lignes:
                - - "Robot R2 — Fiche technique"
                  - ""
                - - "À quoi sert-il ?"
                  - ""
                - - "Caractéristiques"
                  - ""
                - - "Entretien"
                  - ""
          - id: q02
            type: texte
            enonce: "Ouvre le Navigateur (ou le volet de navigation). Combien de titres vois-tu ? S’il en manque un, que dois-tu corriger ?"
            aide: "Un titre qui n’apparaît pas a sûrement gardé le style « Corps de texte » ou « Normal »."
      ressources:
          - type: paragraphe
            texte: "Cette fiche explique comment ouvrir et utiliser le Navigateur dans Writer."
          - type: lien
            titre: "Université du Littoral — Comment naviguer dans un document (Writer)"
            url: https://compnum.univ-littoral.fr/fiches/TT_Comment_naviguer_dans_un_document.pdf
    - id: a04
      titre: "Toutes les parties en bleu, d’un seul coup"
      defi: true
      facultatif: true
      contenu:
          - type: paragraphe
            texte: "Le client veut que tous les titres de partie soient en bleu. Ne les change pas un par un : modifie le style Titre 2 lui-même (clic droit sur le style, puis « Modifier »)."
      questions:
          - id: q01
            type: texte
            enonce: "Explique ce que tu as fait, et ce qui s’est passé pour les trois titres de partie."
            aide: "Si un seul titre change de couleur, c’est que tu as modifié le texte et pas le style."
    - id: a05
      titre: "Conclusion de ton travail"
      conclusion: true
      transition: "Tu as comparé deux fiches, découvert les styles et fabriqué ta propre fiche. Il reste à répondre au problème de départ."
      questions:
          - id: q01
            type: texte
            enonce: "Réponds au problème du jour en 2 ou 3 phrases : comment présenter une fiche technique pour qu’un client trouve vite l’information ?"
            aide: "Tu peux commencer par : « Pour qu’une fiche soit facile à lire, il faut… On utilise les styles… parce que… »"
sources:
    - type: lien
      titre: "Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)"
      url: https://www.education.gouv.fr/media/160767/download
    - type: lien
      titre: "Microsoft — Insérer une table des matières"
      url: https://support.microsoft.com/fr-fr/office/ins%C3%A9rer-une-table-des-mati%C3%A8res-882e8564-0edb-435e-84b5-1d8552ccf0c0
