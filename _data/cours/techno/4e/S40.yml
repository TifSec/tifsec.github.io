titre: 'Séance 40 : Bilan et entraînement au brevet n° 4 : une barrière de parking'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Suis-je capable d’analyser une chaîne d’information, un algorithme et de compléter un programme ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
    - Comprendre et modifier un programme associé à une fonctionnalité d’un objet ou d’un système technique
objectifs:
    connaissances:
        - 'Chaîne d’information : acquérir, traiter, communiquer.'
        - Algorithme en langage naturel ; programme à compléter.
    competences:
        - Utiliser les réflexes R9, R12, R13 et R16.
pourquoi:
    - Depuis la séance 35, tu as analysé et complété le programme du monte-charge.
    - Aujourd’hui, un dossier de type brevet sur la barrière du parking du collège (situation inventée).
activites:
    -   id: a01
        titre: La chaîne d’information de la barrière
        consigne: 'Tu vas t’entraîner au brevet sur un dossier : la barrière du parking du collège (document 1, situation inventée). On attend la fonction de chaque constituant de la barrière dans la chaîne d’information (acquérir, traiter, communiquer).'
        contenu:
            -   type: titre
                texte: Document 1 — La barrière du parking (situation inventée)
            -   type: citation
                texte: 'Un lecteur de badge lit la carte du professeur. Si le badge est autorisé, la carte programmable commande le moteur qui lève la barrière, et un feu passe au vert. Un capteur infrarouge détecte la voiture sous la barrière : tant qu’une voiture est détectée, la barrière reste levée. Puis elle se baisse et le feu repasse au rouge.'
            -   type: etapes
                elements:
                    - Lis tout le document 1 une première fois, sans répondre.
                    - Relis-le en soulignant mentalement chaque constituant.
                    - 'Pour chacun, demande-toi : récupère-t-il une information, décide-t-il, ou informe-t-il l’utilisateur ?'
            -   type: paragraphe
                texte: Pourquoi lire deux fois ? La première lecture donne le fonctionnement général ; la seconde sert à chercher les réponses.
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, écris la fonction de chaque constituant de la barrière dans la chaîne d’information.
                colonnes:
                    - Constituant
                    - Fonction
                lignes:
                    -   - Lecteur de badge
                        - ''
                    -   - Capteur infrarouge
                        - ''
                    -   - Carte programmable
                        - ''
                    -   - Feu
                        - ''
                aide: Ligne × colonne.
    -   id: a02
        titre: Compléter le programme
        transition: Tu connais la chaîne d’information. Passe au programme.
        consigne: Tu vas compléter le programme de la barrière (document 2) à partir de son fonctionnement décrit dans le document 1, avec le réflexe R13. On attend les deux trous complétés et l’explication de la sécurité apportée par la boucle « tant que ».
        contenu:
            -   type: titre
                texte: Document 2 — Programme incomplet de la barrière
            -   type: code
                texte: "toujours\n    si badge autorisé alors\n        lever la barrière ; feu vert\n        attendre 3 s\n        tant que ……………… \n            attendre 0,5 s\n        baisser la barrière ; ………………"
            -   type: etapes
                elements:
                    - Lis le programme incomplet (document 2).
                    - Relis dans le document 1 ce que doit faire la barrière quand une voiture est dessous.
                    - Compare ligne par ligne (R13) et complète les trous.
            -   type: paragraphe
                texte: 'Pourquoi revenir au document 1 ? C’est lui qui dit ce que le programme doit faire : la réponse est dans le texte.'
        questions:
            -   id: q01
                type: tableau
                enonce: Complète les deux trous du programme de la barrière (document 2).
                colonnes:
                    - Trou
                    - À écrire
                lignes:
                    -   - Condition du « tant que »
                        - ''
                    -   - Dernière action
                        - ''
                aide: Bloc par bloc (réflexe n° 9).
            -   id: q02
                type: texte
                enonce: Pourquoi la boucle « tant que » du programme de la barrière est-elle une sécurité ? Justifie avec « car ».
                aide: Bloc par bloc (réflexe n° 9).
    -   id: a03
        titre: Écrire l’algorithme et relire
        transition: Le programme est complet. Écris l’algorithme, puis relis-toi.
        consigne: Tu vas écrire l’algorithme complet de la barrière en langage naturel (R12), puis relire tout ton dossier (R16). On attend un algorithme avec TOUJOURS, SI … ALORS, TANT QUE, et une amélioration précise d’une de tes réponses.
        contenu:
            -   type: etapes
                elements:
                    - Écris l’algorithme complet de la barrière avec TOUJOURS, SI … ALORS, TANT QUE (R12).
                    - 'Relis toutes tes réponses du dossier (R16) : ai-je répondu à la question ? justifié ? utilisé les documents ?'
                    - Améliore une réponse.
            -   type: paragraphe
                texte: 'Pourquoi écrire l’algorithme à la fin ? Tu as compris le fonctionnement et le programme : il ne reste qu’à le dire en français.'
        questions:
            -   id: q01
                type: texte
                enonce: Écris l’algorithme complet de la barrière du parking en langage naturel.
                aide: Combien d’éléments sont demandés ?
            -   id: q02
                type: texte
                enonce: En relisant ton dossier sur la barrière, quelle réponse as-tu améliorée ? Qu’as-tu changé ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le badge peut être refusé.
        questions:
            -   id: q01
                type: texte
                enonce: Ajoute un « sinon » à l’algorithme de la barrière pour ce cas.
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as traité un dossier complet. Fais le point.
        questions:
            -   id: q01
                type: texte
                enonce: Quel réflexe (R9, R12, R13, R16) t’a le plus aidé dans le dossier de la barrière ? Donne un exemple précis de ta copie.
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Chaîne d’information : acquérir, traiter, communiquer.'
    - 'Compléter un programme : comparer à ce qu’il doit faire (R13) ; algorithme en langage naturel (R12).'
sources:
