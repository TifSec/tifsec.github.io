titre: 'Séance 40 : Bilan et entraînement au brevet n° 4 : une barrière de parking'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Suis-je capable d’analyser une chaîne d’information, un algorithme et de compléter un programme ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
    - Comprendre et modifier un programme associé à une fonctionnalité d’un objet ou d’un système technique
objectifs:
    connaissances:
        - Chaîne d’information, algorithme, programme à compléter.
    competences:
        - Utiliser les réflexes R9, R12, R13 et R16.
pourquoi:
    - Depuis la séance 35, tu as analysé et complété le programme du monte-charge.
    - Aujourd’hui, un dossier sur la barrière du parking du collège (situation inventée).
activites:
    -   id: a01
        titre: Le dossier
        contenu:
            -   type: titre
                texte: Document 1 — La barrière
            -   type: citation
                texte: 'Un lecteur de badge lit la carte du professeur. Si le badge est autorisé, la carte programmable commande le moteur qui lève la barrière, et un feu passe au vert. Un capteur infrarouge détecte la voiture sous la barrière : tant qu’une voiture est détectée, la barrière reste levée. Puis elle se baisse et le feu repasse au rouge.'
            -   type: titre
                texte: Document 2 — Programme incomplet
            -   type: code
                texte: "toujours\n    si badge autorisé alors\n        lever la barrière ; feu vert\n        attendre 3 s\n        tant que ……………… \n            attendre 0,5 s\n        baisser la barrière ; ………………"
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, classe les constituants.
                colonnes:
                    - Constituant
                    - Fonction
                lignes:
                    -   - Lecteur de badge
                        - ''
                    -   - Capteur infrarouge
                        - ''
                    -   - Carte programmable
                        - ''
                    -   - Feu
                        - ''
                aide: Ligne × colonne.
            -   id: q02
                type: tableau
                enonce: Complète les deux trous du programme (document 2).
                colonnes:
                    - Trou
                    - À écrire
                lignes:
                    -   - Condition du « tant que »
                        - ''
                    -   - Dernière action
                        - ''
                aide: Bloc par bloc (réflexe n° 9).
            -   id: q03
                type: texte
                enonce: Écris l’algorithme complet en langage naturel.
                aide: Combien d’éléments sont demandés ?
            -   id: q04
                type: texte
                enonce: Pourquoi la boucle « tant que » est-elle une sécurité ? Justifie avec « car ».
                aide: Pense à « car » (réflexe n° 4).
    -   id: a02
        titre: Je relis (R16)
        transition: Relis-toi.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle réponse as-tu améliorée en te relisant ?
                aide: Repère le verbe de la question.
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le badge peut être refusé.
        questions:
            -   id: q01
                type: texte
                enonce: Ajoute un « sinon » à l’algorithme pour ce cas.
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as traité un dossier complet. Fais le point.
        questions:
            -   id: q01
                type: texte
                enonce: Quel réflexe (R9, R12, R13, R16) t’a le plus aidé ? Exemple.
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Chaîne d’information : acquérir, traiter, communiquer.'
    - 'Compléter un programme : comparer à ce qu’il doit faire (R13) ; algorithme en langage naturel (R12).'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
