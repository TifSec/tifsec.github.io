titre: 'Séance 6 : Writer n° 1 : un compte rendu bien organisé'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Comment organiser un compte rendu pour qu’on s’y retrouve facilement ?
competences_bo:
    - Décrire les interactions entre un objet ou un système technique, son environnement et les utilisateurs
objectifs:
    connaissances:
        - Les styles de titres (Titre 1, Titre 2) structurent un document ; Writer s’en sert pour créer une table des matières automatique.
        - L’en-tête et le pied de page se répètent sur chaque page (nom, numéro de page).
    competences:
        - Appliquer des styles de titres.
        - Insérer une table des matières automatique.
        - Créer un en-tête et un pied de page avec le numéro de page.
pourquoi:
    - En 5e, tu as utilisé le style Titre 1 et une liste. En séance 5, tu as analysé le monte-charge.
    - Aujourd’hui, tu rédiges le compte rendu de la séance 5 dans Writer, avec une table des matières et des numéros de page. Ton fichier reste sur l’ordinateur ; sur le site, tu réponds sur ta méthode.
activites:
    -   id: a01
        titre: Structurer avec les styles
        consigne: Tu vas créer dans Writer le compte rendu des choix de conception du monte-charge (séance 5), organisé avec les styles de titre. On attend un fichier enregistré et des réponses sur le rôle des styles.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Writer et enregistre sous 4e_S06_tonprenom.odt.
                    - Écris le titre « Les choix de conception du monte-charge » en style Titre.
                    - 'Écris trois parties en style Titre 1 : « Sécurité », « Ergonomie », « Énergie ».'
                    - Sous chaque partie, écris deux phrases tirées de la séance 5.
            -   type: paragraphe
                texte: 'Pourquoi des styles plutôt que du gras ? Writer reconnaît les titres grâce aux styles : c’est ce qui lui permettra de construire la table des matières tout seul.'
        questions:
            -   id: q01
                type: qcm
                enonce: À quoi servent les styles Titre 1 et Titre 2 ?
                choix:
                    -   id: a
                        texte: À structurer le document et à créer la table des matières.
                    -   id: b
                        texte: Seulement à grossir le texte.
                    -   id: c
                        texte: À changer la couleur de la page.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Recopie les phrases de ta partie « Énergie ».
                aide: Source → constituant qui transforme → forme d’énergie en sortie.
    -   id: a02
        titre: La table des matières
        transition: Ton document est structuré. Writer peut construire la table des matières tout seul.
        consigne: Tu vas ajouter une table des matières automatique à ton compte rendu Writer. On attend que tu expliques comment la table se met à jour et ce qu’il faut pour qu’un titre y apparaisse.
        contenu:
            -   type: etapes
                elements:
                    - Place le curseur sous le titre.
                    - Clique sur Insertion > Table des matières et index > Table des matières, puis OK.
                    - Ajoute une partie « Conclusion » en style Titre 1 à la fin.
                    - Clic droit sur la table > Mettre à jour l’index.
            -   type: paragraphe
                texte: Pourquoi une table automatique ? Si on ajoute une partie ou une page, elle se met à jour en un clic, sans rien recopier.
        questions:
            -   id: q01
                type: texte
                enonce: Que se passe-t-il dans la table quand tu ajoutes « Conclusion » et que tu mets à jour ?
                aide: Une phrase complète qui reprend les mots de la question.
            -   id: q02
                type: qcm
                enonce: Que faut-il pour qu’un titre apparaisse dans la table des matières ?
                choix:
                    -   id: a
                        texte: Un style de titre.
                    -   id: b
                        texte: Le gras.
                    -   id: c
                        texte: Les majuscules.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a03
        titre: En-tête et pied de page
        transition: Il reste à identifier chaque page.
        consigne: Tu vas ajouter à ton compte rendu un en-tête (prénom, classe) et un pied de page avec le numéro de page automatique. On attend que tu expliques l’intérêt du champ « Numéro de page ».
        contenu:
            -   type: etapes
                elements:
                    - Clique sur Insertion > En-tête et pied de page > En-tête > Par défaut ; écris ton prénom et ta classe.
                    - Clique sur Insertion > En-tête et pied de page > Pied de page > Par défaut.
                    - 'Dans le pied de page : Insertion > Champ > Numéro de page.'
                    - Enregistre (Ctrl + S).
            -   type: paragraphe
                texte: Pourquoi un champ « Numéro de page » ? Il s’écrit une seule fois et se met à jour tout seul sur chaque page.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi utiliser le champ « Numéro de page » plutôt que d’écrire les numéros à la main ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le style Titre 2 crée des sous-parties.
        questions:
            -   id: q01
                type: texte
                enonce: Ajoute deux sous-parties en Titre 2 dans « Sécurité » et mets à jour la table. Que vois-tu ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton compte rendu est organisé. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment organiser un compte rendu pour qu’on s’y retrouve ? Cite au moins quatre étapes dans l’ordre.'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Styles de titres → table des matières automatique (mise à jour par clic droit).
    - En-tête et pied de page répétés ; numéro de page par un champ.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
