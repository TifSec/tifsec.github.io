titre: Peut-on vérifier les performances d’un robot ?
theme: "Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et à analyser"
problematique: Peut-on vérifier les performances d’un robot ?
pourquoi: "Imaginons que trois mesures aient été réalisées dans les mêmes conditions :"
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Comprendre qu’une performance doit être associée à une grandeur mesurable.
        - Comprendre qu’un test doit être préparé avant d’être réalisé.
        - Comprendre que les conditions d’un test influencent les résultats.
        - Comprendre que plusieurs mesures sont souvent nécessaires pour obtenir un résultat plus fiable.
    competences:
        - transformer une affirmation en question testable ;
        - choisir une grandeur et un instrument de mesure ;
        - identifier le paramètre modifié et les conditions à conserver ;
        - proposer un protocole ;
        - analyser plusieurs mesures et argumenter une conclusion.
activites:
    - id: a02
      titre: Compétence visée
      contenu:
          - type: paragraphe
            texte: Mesurer et comparer les performances d’un objet ou d’un système technique.
      questions: []
    - id: a04
      titre: Production attendue
      contenu:
          - type: paragraphe
            texte: Vous devez produire un document LibreOffice Writer contenant vos hypothèses, un protocole de test, l’analyse d’un jeu de mesures, deux propositions de tests supplémentaires et une conclusion.
      questions: []
    - id: a05
      titre: 1. Créer votre document de travail
      contenu:
          - type: paragraphe
            texte: "Créez dès maintenant un document LibreOffice Writer nommé :"
          - type: paragraphe
            texte: 4e_S6_nom.odt
          - type: paragraphe
            texte: Remplacez nom par votre nom.
          - type: paragraphe
            texte: "Indiquez :"
          - type: liste
            elements:
                - votre nom et votre prénom ;
                - la date ;
                - "le titre : Séance 6 : Peut-on vérifier les performances d’un robot ?"
          - type: paragraphe
            texte: Organisez votre document avec des titres clairement identifiables.
          - type: paragraphe
            texte: Le fichier devra être rendu en fin d’heure, même s’il n’est pas terminé.
      questions: []
    - id: a06
      titre: 2. Une fiche technique suffit-elle ?
      contenu:
          - type: paragraphe
            texte: Lors de la séance précédente, vous avez comparé plusieurs robots à partir de caractéristiques annoncées par les fabricants.
          - type: paragraphe
            texte: On peut par exemple trouver sur une fiche constructeur une puissance d’aspiration annoncée, une capacité à franchir certains obstacles ou différentes fonctions de navigation.
          - type: paragraphe
            texte: Consultez rapidement la fiche constructeur du Roborock Saros 20 .
          - type: lien
            titre: fiche constructeur du Roborock Saros 20
            url: https://fr.roborock.com/products/roborock-saros-20
          - type: paragraphe
            texte: Choisissez une performance annoncée que l’on pourrait essayer de vérifier.
          - type: paragraphe
            texte: "Dans votre document, notez :"
          - type: liste
            elements:
                - "Performance annoncée : ..."
                - "Question que l’on pourrait poser : ..."
                - "Ce qu’il faudrait mesurer : ..."
          - type: paragraphe
            texte: "Exemple de transformation :"
          - type: paragraphe
            texte: « Le robot franchit certains seuils » → « Quelle hauteur maximale de seuil peut-il réellement franchir dans des conditions données ? »
      questions: []
    - id: a07
      titre: 3. Le problème que nous allons étudier
      contenu:
          - type: paragraphe
            texte: "Nous allons travailler sur une question plus simple :"
          - type: paragraphe
            texte: Le même système motorisé se déplacerait-il à la même vitesse sur différents types de surfaces ?
          - type: paragraphe
            texte: "Sans chercher de réponse, écrivez votre hypothèse :"
          - type: paragraphe
            texte: Je pense que...
          - type: paragraphe
            texte: "Puis expliquez :"
          - type: paragraphe
            texte: Je pense cela parce que...
          - type: titre
            texte: Besoin d’un indice ?
      questions:
          - id: q01
            type: texte
            enonce: Une roue accroche-t-elle de la même manière sur toutes les surfaces ?
          - id: q02
            type: texte
            enonce: Une surface souple peut-elle modifier le déplacement ?
          - id: q03
            type: texte
            enonce: Un tapis oppose-t-il les mêmes résistances qu’un sol dur ?
    - id: a08
      titre: 4. Décomposer le test
      contenu:
          - type: paragraphe
            texte: "Pour répondre correctement à la question, il faut séparer trois choses :"
          - type: liste
            elements:
                - ce que nous allons volontairement modifier ;
                - ce que nous allons mesurer ;
                - ce qui doit rester identique.
          - type: paragraphe
            texte: "Complétez :"
          - type: liste
            elements:
                - "Paramètre modifié : ..."
                - "Grandeur mesurée : ..."
                - "Instrument nécessaire : ..."
                - "Conditions à conserver : ..."
          - type: paragraphe
            texte: Identifiez au moins quatre conditions qui devraient rester identiques.
          - type: titre
            texte: Besoin d’un indice ?
      questions:
          - id: q01
            type: texte
            enonce: Utilise-t-on le même système à chaque fois ?
          - id: q02
            type: texte
            enonce: La distance parcourue doit-elle changer ?
          - id: q03
            type: texte
            enonce: Le point de départ doit-il rester le même ?
          - id: q04
            type: texte
            enonce: Le niveau de charge de la batterie peut-il être très différent ?
          - id: q05
            type: texte
            enonce: La méthode de chronométrage doit-elle changer ?
            suite:
                - type: paragraphe
                  texte: "Question importante : si deux paramètres changent en même temps, comment savoir lequel a réellement influencé le résultat ?"
    - id: a09
      titre: 5. Construire un protocole
      contenu:
          - type: paragraphe
            texte: Imaginez que vous deviez donner vos instructions à une autre personne qui ne connaît pas votre idée.
          - type: paragraphe
            texte: Écrivez un protocole suffisamment précis pour qu’elle puisse réaliser le test sans vous poser de question.
          - type: paragraphe
            texte: "Votre protocole doit préciser :"
          - type: liste
            elements:
                - la distance parcourue ;
                - le point de départ ;
                - le moment où le chronomètre démarre et s’arrête ;
                - le nombre de mesures par surface ;
                - la manière de noter les résultats ;
                - les conditions qui doivent rester identiques.
          - type: paragraphe
            texte: Utilisez une liste numérotée pour présenter les étapes dans l’ordre.
      questions: []
    - id: a10
      titre: 6. Pourquoi plusieurs mesures ?
      contenu:
          - type: paragraphe
            texte: "Imaginons que trois mesures aient été réalisées dans les mêmes conditions :"
          - type: liste
            elements:
                - "essai 1 : 4,2 s ;"
                - "essai 2 : 4,8 s ;"
                - "essai 3 : 4,4 s."
          - type: paragraphe
            texte: "Répondez :"
      questions:
          - id: q01
            type: texte
            enonce: Pourquoi les trois valeurs ne sont-elles pas exactement identiques ?
            suite: []
          - id: q02
            type: texte
            enonce: Quelle valeur faudrait-il conserver si l’on voulait résumer les trois essais ?
            suite: []
          - id: q03
            type: texte
            enonce: Pourquoi cette valeur est-elle plus intéressante qu’un seul essai ?
            suite:
                - type: paragraphe
                  texte: "Calculez ensuite :"
                - type: paragraphe
                  texte: temps moyen = (essai 1 + essai 2 + essai 3) ÷ 3
    - id: a11
      titre: 7. Analyser un jeu de résultats
      contenu:
          - type: paragraphe
            texte: Les données ci-dessous sont simulées pour les besoins de l’activité pédagogique. Elles ne correspondent pas aux mesures d’un modèle commercial précis.
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Surface
                - Essai 1
                - Essai 2
                - Essai 3
                - Temps moyen
            lignes:
                - - Sol dur
                  - 3,8 s
                  - 3,9 s
                  - 3,7 s
                  - ""
                - - Carton
                  - 4,1 s
                  - 4,0 s
                  - 4,2 s
                  - ""
                - - Tissu
                  - 4,9 s
                  - 5,1 s
                  - 5,0 s
                  - ""
                - - Tapis
                  - 6,2 s
                  - 6,5 s
                  - 6,3 s
                  - ""
            suite:
                - type: paragraphe
                  texte: "Dans votre document :"
          - id: q02
            type: texte
            enonce: calculez les quatre temps moyens ;
            suite:
                - type: paragraphe
                  texte: classez les surfaces de la plus rapide à la plus lente ;
          - id: q03
            type: texte
            enonce: comparez les résultats avec votre hypothèse ;
            suite: []
          - id: q04
            type: texte
            enonce: indiquez si les données semblent confirmer, infirmer ou seulement nuancer votre hypothèse ;
            suite: []
          - id: q05
            type: texte
            enonce: proposez une explication possible aux différences observées.
            suite: []
    - id: a12
      titre: 8. Une performance peut se tester de plusieurs façons
      contenu:
          - type: paragraphe
            texte: La vitesse de déplacement n’est qu’une performance possible.
          - type: paragraphe
            texte: "Choisissez deux autres tests parmi :"
          - type: liste
            elements:
                - niveau sonore ;
                - autonomie ;
                - capacité à franchir un obstacle ;
                - consommation électrique ;
                - capacité à ramasser une quantité donnée de saletés ;
                - temps nécessaire pour nettoyer une zone ;
                - capacité à éviter des obstacles.
          - type: paragraphe
            texte: "Pour chaque test, complétez :"
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Élément
                - Votre proposition
            lignes:
                - - Performance étudiée
                  - ""
                - - Grandeur à mesurer
                  - ""
                - - Instrument nécessaire
                  - ""
                - - Paramètre modifié
                  - ""
                - - Conditions à conserver
                  - ""
            suite:
                - type: titre
                  texte: Besoin d’un exemple de grandeur ?
                - type: liste
                  elements:
                      - niveau sonore → niveau en décibels ;
                      - autonomie → durée ;
                      - franchissement → hauteur de l’obstacle ;
                      - consommation → énergie électrique consommée ;
                      - nettoyage → masse ou quantité de saletés récupérées.
                - type: paragraphe
                  texte: Pour comprendre comment un niveau sonore peut être mesuré, vous pouvez consulter INRS – Mesurage du bruit .
                - type: lien
                  titre: INRS – Mesurage du bruit
                  url: https://www.inrs.fr/media.html?refINRS=ED%206035
                - type: paragraphe
                  texte: Pour réfléchir à la consommation électrique, vous pouvez consulter ADEME – Comprendre et réduire sa consommation d’électricité .
                - type: lien
                  titre: ADEME – Comprendre et réduire sa consommation d’électricité
                  url: https://agirpourlatransition.ademe.fr/particuliers/economiser/energie/20-solutions-reduire-consommation-electricite
    - id: a13
      titre: 9. Mettons des mots sur ce que nous avons découvert
      contenu:
          - type: paragraphe
            texte: Une performance caractérise la capacité d’un objet ou d’un système technique à réaliser une action.
          - type: paragraphe
            texte: Pour comparer une performance, il faut choisir une grandeur mesurable.
          - type: paragraphe
            texte: Un protocole décrit précisément les conditions et les étapes d’un test.
          - type: paragraphe
            texte: "Lorsqu’on cherche l’effet d’un paramètre, il faut autant que possible :"
          - type: liste
            elements:
                - ne modifier que ce paramètre ;
                - conserver les autres conditions identiques ;
                - répéter les mesures lorsque cela est pertinent ;
                - analyser les résultats avant de conclure.
      questions: []
    - id: a14
      titre: 10. Conclusion
      contenu:
          - type: paragraphe
            texte: "Rédigez quelques phrases pour répondre à la problématique :"
          - type: paragraphe
            texte: Comment peut-on vérifier les performances d’un robot ?
          - type: paragraphe
            texte: "Votre conclusion doit expliquer :"
          - type: liste
            elements:
                - pourquoi une performance doit être mesurable ;
                - pourquoi le protocole est important ;
                - pourquoi certaines conditions doivent rester identiques ;
                - pourquoi plusieurs mesures peuvent améliorer la fiabilité du résultat.
      questions: []
    - id: a15
      titre: 11. Rendu de fin de séance
      contenu:
          - type: paragraphe
            texte: À la fin du cours, votre fichier doit être rendu, même s’il n’est pas terminé.
          - type: paragraphe
            texte: "Déposez :"
          - type: paragraphe
            texte: 4e_S6_nom.odt
          - type: paragraphe
            texte: "Avant de le rendre, vérifiez :"
          - type: liste
            elements:
                - votre nom, la date et le titre ;
                - votre hypothèse ;
                - votre protocole ;
                - vos calculs et leurs unités ;
                - vos deux propositions de tests ;
                - votre conclusion ;
                - que votre document est organisé et compréhensible.
      questions: []
    - id: a16
      titre: Références pédagogiques
      contenu:
          - type: liste
            elements:
                - Ministère de l’Éducation nationale – Programme de technologie du cycle 4, BO n°9 du 29 février 2024
                - Éduscol STI – Guide d’accompagnement du programme de technologie au cycle 4
          - type: lien
            titre: Ministère de l’Éducation nationale – Programme de technologie du cycle 4, BO n°9 du 29 février 2024
            url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
          - type: lien
            titre: Éduscol STI – Guide d’accompagnement du programme de technologie au cycle 4
            url: https://sti.eduscol.education.fr/textes/guide-daccompagnement-du-programme-de-technologie-en-cycle-4-mai-2024
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
introduction:
    - type: paragraphe
      texte: "Problématique : Comment vérifier qu’une performance annoncée pour un robot correspond réellement à ce qu’il est capable de faire ?"
    - type: titre
      texte: Objectifs d’apprentissage
    - type: paragraphe
      texte: "Ce que vous allez apprendre :"
    - type: liste
      elements:
          - Comprendre qu’une performance doit être associée à une grandeur mesurable.
          - Comprendre qu’un test doit être préparé avant d’être réalisé.
          - Comprendre que les conditions d’un test influencent les résultats.
          - Comprendre que plusieurs mesures sont souvent nécessaires pour obtenir un résultat plus fiable.
    - type: paragraphe
      texte: "Ce que vous allez apprendre à faire :"
    - type: liste
      elements:
          - transformer une affirmation en question testable ;
          - choisir une grandeur et un instrument de mesure ;
          - identifier le paramètre modifié et les conditions à conserver ;
          - proposer un protocole ;
          - analyser plusieurs mesures et argumenter une conclusion.
