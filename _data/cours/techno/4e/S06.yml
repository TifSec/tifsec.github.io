titre: 'Séance 6 : Writer n° 1 : un compte rendu bien organisé'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Comment organiser un compte rendu pour qu’on s’y retrouve facilement ?
competences_bo:
    - Décrire les interactions entre un objet ou un système technique, son environnement et les utilisateurs
objectifs:
    connaissances:
        - Les styles de titres (Titre 1, Titre 2) structurent un document ; Writer s’en sert pour créer une table des matières automatique.
        - L’en-tête et le pied de page se répètent sur chaque page (nom, date, numéro de page).
    competences:
        - Appliquer des styles de titres.
        - Insérer une table des matières automatique.
        - Créer un en-tête et un pied de page avec le numéro de page.
pourquoi:
    - En 5e, tu as utilisé les styles Titre 1 et Titre 2 et une liste numérotée.
    - Aujourd’hui, tu rédiges le compte rendu de la séance 5 (le monte-charge) avec une table des matières et des numéros de page.
activites:
    -   id: a01
        titre: Structurer avec les styles
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Writer, enregistre sous 4e_S06_tonprenom.odt.
                    - Titre « Les choix de conception du monte-charge » en style Titre.
                    - 'Trois parties en Titre 1 : « Sécurité », « Ergonomie », « Énergie ».'
                    - Dans chaque partie, deux ou trois phrases tirées de la séance 5.
        questions:
            -   id: q01
                type: qcm
                enonce: À quoi servent les styles Titre 1 et Titre 2 ?
                choix:
                    -   id: a
                        texte: À structurer le document et à créer la table des matières automatiquement.
                    -   id: b
                        texte: Seulement à grossir le texte.
                    -   id: c
                        texte: À changer la couleur de la page.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Recopie les phrases de ta partie « Énergie ».
                aide: Source → constituant qui transforme → forme d’énergie en sortie.
    -   id: a02
        titre: La table des matières
        transition: Ton document est structuré. Writer peut maintenant construire la table des matières tout seul.
        contenu:
            -   type: etapes
                elements:
                    - Place le curseur sous le titre.
                    - Insertion > Table des matières et index > Table des matières.
                    - 'Valide : les trois parties apparaissent.'
                    - Ajoute une partie « Conclusion » en Titre 1, puis clic droit sur la table > Mettre à jour l’index.
        questions:
            -   id: q01
                type: texte
                enonce: Que se passe-t-il dans la table des matières quand tu ajoutes la partie « Conclusion » et que tu mets à jour ?
                aide: Une phrase complète qui reprend les mots de la question.
            -   id: q02
                type: qcm
                enonce: Que faut-il faire pour qu’un titre apparaisse dans la table des matières ?
                choix:
                    -   id: a
                        texte: Lui donner un style de titre (Titre 1, Titre 2…).
                    -   id: b
                        texte: L’écrire en gras.
                    -   id: c
                        texte: L’écrire en majuscules.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a03
        titre: En-tête et pied de page
        transition: Il reste à identifier chaque page avec un en-tête et un pied de page.
        contenu:
            -   type: etapes
                elements:
                    - 'Insertion > En-tête et pied de page > En-tête > Par défaut : écris ton prénom et ta classe.'
                    - Insertion > En-tête et pied de page > Pied de page > Par défaut.
                    - 'Dans le pied de page : Insertion > Champ > Numéro de page.'
                    - Enregistre (Ctrl + S).
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi utiliser le champ « Numéro de page » plutôt que d’écrire les numéros à la main ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le style Titre 2 crée des sous-parties.
        questions:
            -   id: q01
                type: texte
                enonce: Ajoute deux sous-parties en Titre 2 dans « Sécurité ». Que devient la table des matières ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton compte rendu est organisé. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment organiser un compte rendu pour qu’on s’y retrouve facilement ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Styles de titres → table des matières automatique (mise à jour par clic droit).
    - 'En-tête et pied de page : répétés sur chaque page ; numéro de page par un champ.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
