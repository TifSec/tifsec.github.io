titre: 'Séance 18 : Bilan et entraînement au brevet n° 2 : le réseau d’une médiathèque'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Suis-je capable d’analyser un réseau et de calculer un temps de transfert sur un dossier de type brevet ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - Réseau local, adresse IP, débit et durée de transfert.
    competences:
        - Utiliser les réflexes R1 à R10 et R16 sur un dossier réseau.
pourquoi:
    - Depuis la séance 13, tu as étudié le réseau.
    - Aujourd’hui, tu traites un dossier sur le réseau d’une médiathèque (situation inventée).
activites:
    -   id: a01
        titre: Le dossier
        contenu:
            -   type: titre
                texte: Document 1 — Le réseau de la médiathèque
            -   type: citation
                texte: Six ordinateurs et une imprimante sont reliés par câble à un commutateur. Un point d’accès Wi-Fi permet aux visiteurs de se connecter. Une box relie la médiathèque à Internet avec un débit de 100 Mbit/s.
            -   type: tableau
                titre: Document 2 — Quelques adresses
                colonnes:
                    - Appareil
                    - Adresse IP
                lignes:
                    -   - Poste accueil
                        - '192.168.10.2'
                    -   - Poste 1
                        - '192.168.10.3'
                    -   - Imprimante
                        - '192.168.10.3'
                    -   - Tablette visiteur
                        - '192.168.10.40'
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, donne le rôle de chaque équipement.
                colonnes:
                    - Équipement
                    - Rôle
                lignes:
                    -   - Commutateur
                        - ''
                    -   - Point d’accès Wi-Fi
                        - ''
                    -   - Box
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
            -   id: q02
                type: texte
                enonce: D’après le document 2, un problème empêche d’imprimer depuis le Poste 1. Lequel ? Propose une correction.
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
            -   id: q03
                type: nombre
                enonce: Un visiteur télécharge un fichier de 500 Mo avec le débit de 100 Mbit/s. Combien de secondes faut-il ?
                unite: s
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q04
                type: qcm
                enonce: Quelle est la topologie du réseau filaire de la médiathèque ?
                choix:
                    -   id: a
                        texte: En étoile, autour du commutateur.
                    -   id: b
                        texte: En ligne.
                    -   id: c
                        texte: Il n’y en a pas.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q05
                type: texte
                enonce: Pourquoi est-il prudent que le Wi-Fi des visiteurs soit séparé du réseau des postes du personnel ? Justifie avec « car ».
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a02
        titre: Je relis (R16)
        transition: Le dossier est terminé. Relis-toi.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle réponse as-tu améliorée en te relisant (unité, justification…) ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le débit est partagé entre tous les visiteurs.
        questions:
            -   id: q01
                type: texte
                enonce: Si 4 visiteurs téléchargent en même temps, quel débit a chacun (environ) ? Combien de temps pour le fichier de 500 Mo ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as traité un dossier complet. Fais le point.
        questions:
            -   id: q01
                type: texte
                enonce: Quel point du réseau dois-tu encore revoir ? Comment vas-tu le travailler ?
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Réseau local : terminaux, commutateur, point d’accès, box ; adresses IP uniques.'
    - Durée = taille × 8 ÷ débit.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
