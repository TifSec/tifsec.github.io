titre: "Quel graphique aide à comparer les résultats ?"
theme: "Excel/Calc, données et IA"
problematique: "Quel graphique aide à comparer les résultats ?"
pourquoi: "Le type de graphique dépend de la question posée."
application: "Un tableau organisé permet de comparer des mesures et d’expliquer un choix."
lien_precedent: "Après Comment écrire une formule qui se recopie ?, une nouvelle mission t’aide à réutiliser tes méthodes."
prerequis:
    - "Tu peux relire la séance précédente (Comment écrire une formule qui se recopie ?) si nécessaire."
notions:
    - titre: "Un exemple expliqué"
      texte: "Pour comparer la tension de trois orientations, un diagramme en colonnes montre les différences. J’ajoute un titre et l’unité sur l’axe vertical."
objectifs:
    connaissances:
        - "Le type de graphique dépend de la question posée."
    competences:
        - "Créer un graphique à partir des mesures de S16, ajouter un titre et vérifier les axes."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Le type de graphique dépend de la question posée."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Créer un graphique à partir des mesures de S16, ajouter un titre et vérifier les axes."
    - type: paragraphe
      texte: "Dans la vie réelle : Un tableau organisé permet de comparer des mesures et d’expliquer un choix."
activites:
    - id: a01
      titre: "1. Comprendre la mission"
      pourquoi: "On commence par un exemple guidé : il montre une méthode avant que tu l’essaies."
      demarche:
          - Lis la situation.
          - Suis les étapes de l’exemple.
          - Repère la donnée qui aide à répondre.
      contenu:
          - type: paragraphe
            texte: "Pour comparer la tension de trois orientations, un diagramme en colonnes montre les différences. J’ajoute un titre et l’unité sur l’axe vertical."
      questions:
          - id: q01
            type: texte
            enonce: "Quel graphique permet de comparer rapidement trois catégories ?"
            aide: "Relis l’exemple et repère l’information qui répond à la question."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
            aide: "Une ou deux phrases suffisent."
    - id: a02
      titre: "2. À toi d’essayer"
      pourquoi: "Tu as vu la méthode ; maintenant, applique-la dans une tâche que tu peux vérifier."
      demarche:
          - Réalise les étapes dans l’ordre.
          - Note le résultat attendu.
          - Compare-le au résultat observé.
      consigne: "Créer un graphique à partir des mesures de S16, ajouter un titre et vérifier les axes."
      questions:
          - id: q01
            type: texte
            enonce: "Quel résultat observes-tu ? Décris ton essai."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
      ressources:
          - type: lien
            titre: "Aide LibreOffice Calc — formules"
            url: https://help.libreoffice.org/latest/fr/text/scalc/guide/formulas.html
    - id: a03
      titre: "3. Réutiliser la méthode"
      pourquoi: "Un nouvel exemple t’aide à voir où cette méthode peut encore servir."
      contenu:
          - type: paragraphe
            texte: "Reprends la méthode avec une nouvelle valeur, un autre document ou une autre situation du dossier."
      questions:
          - id: q01
            type: texte
            enonce: "Quelle information permet de justifier ta conclusion ? Quelle limite reste à vérifier ?"
    - id: a04
      titre: "4. Ce que tu retiens"
      pourquoi: "Tu termines en gardant une idée et une méthode pour la prochaine séance."
      demarche:
          - Relis les deux éléments à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Le type de graphique dépend de la question posée."
    - "Pour vérifier, je compare une réponse ou un essai à une donnée précise."
bilan: "Je peux expliquer ce que j’ai appris et montrer une réponse ou un essai comme preuve."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie cycle 4 : cette séance travaille le type de graphique dépend de la question posée.. Elle contribue progressivement aux compétences de fin de cycle."
    - type: lien
      titre: "Ministère — Programme de Technologie du cycle 4, BO 2024"
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
    - type: lien
      titre: "Aide LibreOffice Calc — formules"
      url: https://help.libreoffice.org/latest/fr/text/scalc/guide/formulas.html
