titre: 'Séance 2 : De l’idée à l’objet : comment conçoit-on un objet ?'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Par quelles étapes passe-t-on pour concevoir un objet qui répond à un besoin ?
competences_bo:
    - Imaginer, concevoir et réaliser une ou des solutions en réponse à un besoin, à des exigences (de développement durable, par exemple) ou à la nécessité d’améliorations dans une démarche de créativité
objectifs:
    connaissances:
        - 'Une démarche de projet : besoin → cahier des charges → recherche de solutions → choix → prototype → tests → présentation.'
        - Un prototype est un premier modèle qu’on teste avant de fabriquer en série.
    competences:
        - Remettre dans l’ordre les étapes d’un projet.
        - Distinguer besoin, solution et prototype.
pourquoi:
    - En 5e, tu as amélioré le tracker en suivant un planning fourni.
    - Cette année, tu mèneras un vrai projet (le tracker qui communique). Avant, il faut connaître les étapes d’un projet.
activites:
    -   id: a01
        titre: Les étapes d’un projet
        consigne: Tu vas découvrir les six étapes d’un projet de conception à partir de l’exemple du tracker solaire du collège (document 1). On attend les six étapes remises dans l’ordre.
        contenu:
            -   type: citation
                texte: 'Document 1 — Le tracker du collège. Besoin : capter plus d’énergie solaire. Cahier des charges : suivre la lumière, coûter peu, fonctionner seul. Solutions : moteur pas à pas ou servomoteur, un ou deux capteurs. Choix : un servomoteur et deux capteurs. Prototype : la maquette imprimée en 3D. Tests : avec une lampe de poche.'
            -   type: etapes
                elements:
                    - Lis l’exemple du tracker dans le document 1.
                    - Repère dans l’exemple chacune des six étapes.
                    - Remets les étapes dans l’ordre dans le tableau.
            -   type: paragraphe
                texte: Pourquoi cet ordre ? On ne peut pas choisir une solution avant d’avoir écrit ce qu’elle doit faire (le cahier des charges), ni tester avant d’avoir un prototype.
        questions:
            -   id: q01
                type: tableau
                enonce: Remets les étapes dans l’ordre (numéros 1 à 6).
                colonnes:
                    - Étape
                    - Numéro
                lignes:
                    -   - Tester le prototype
                        - ''
                    -   - Exprimer le besoin
                        - ''
                    -   - Rédiger le cahier des charges
                        - ''
                    -   - Fabriquer un prototype
                        - ''
                    -   - Chercher des solutions
                        - ''
                    -   - Choisir une solution
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
    -   id: a02
        titre: Besoin, solution ou prototype ?
        transition: Tu connais les étapes. Apprends maintenant à distinguer besoin, solution et prototype.
        consigne: Tu vas apprendre à distinguer un besoin, une solution et un prototype à partir des phrases du tableau de la question. On attend un classement juste et une explication du rôle du prototype.
        contenu:
            -   type: etapes
                elements:
                    - Lis chaque phrase du tableau.
                    - 'Demande-toi : exprime-t-elle ce que veut l’utilisateur (besoin), comment on y répond (solution), ou un premier modèle à tester (prototype) ?'
                    - Écris ton classement.
            -   type: paragraphe
                texte: Pourquoi distinguer besoin et solution ? Si on part directement d’une solution, on risque de passer à côté de ce que veut vraiment l’utilisateur.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Classe chaque phrase : besoin, solution ou prototype.'
                colonnes:
                    - Phrase
                    - Classement
                lignes:
                    -   - « Je voudrais savoir de loin si la cuve est pleine. »
                        - ''
                    -   - « Un capteur à ultrasons mesure le niveau. »
                        - ''
                    -   - « La maquette en carton avec la carte micro:bit. »
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
            -   id: q02
                type: qcm
                enonce: Pourquoi fabrique-t-on un prototype avant de produire en série ?
                choix:
                    -   id: a
                        texte: Pour vérifier que la solution répond au besoin et corriger les défauts à moindre coût.
                    -   id: b
                        texte: Pour le vendre plus cher.
                    -   id: c
                        texte: Parce que la loi l’oblige.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a03
        titre: Le projet de l’année
        transition: Tu sais distinguer les étapes. Prépare-toi au projet de l’année.
        consigne: Tu vas formuler le besoin du projet de l’année (suivre à distance ce que mesure le tracker), présenté ci-dessous. On attend une phrase qui commence par « Je voudrais… », sans parler de technique.
        contenu:
            -   type: paragraphe
                texte: En fin d’année, la personne qui s’occupe du tracker voudra connaître, depuis la salle, ce qu’il mesure, sans aller dans la cour.
            -   type: etapes
                elements:
                    - Lis la présentation du projet ci-dessous.
                    - Repère qui est l’utilisateur.
                    - Écris ce qu’il veut, en commençant par « Je voudrais… », sans parler de technique.
            -   type: paragraphe
                texte: Pourquoi écrire le besoin sans technique ? Le besoin dit ce que veut l’utilisateur ; la technique viendra ensuite, quand on cherchera des solutions.
        questions:
            -   id: q01
                type: texte
                enonce: Formule le besoin du projet en une phrase, en commençant par « Je voudrais… ».
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a04
        titre: Je m’entraîne
        transition: Tu as compris la méthode. Applique-la seul sur un cas nouveau.
        consigne: 'Tu vas appliquer seul la méthode sur un cas nouveau : la lampe de trottinette décrite ci-dessous. On attend le besoin, la solution et le prototype de ce projet.'
        contenu:
            -   type: citation
                texte: Des élèves veulent être vus la nuit quand ils roulent en trottinette. Ils imaginent une lampe à LED qui s’allume toute seule quand la trottinette roule, et en fabriquent un premier modèle pour le tester.
            -   type: etapes
                elements:
                    - Lis la situation de la trottinette.
                    - Repère le besoin, puis la solution, puis le prototype.
                    - Écris chacun dans le tableau.
            -   type: paragraphe
                texte: Pourquoi un nouveau cas ? Pour vérifier que tu sais appliquer seul la démarche de projet à un objet inconnu.
        questions:
            -   id: q01
                type: tableau
                enonce: Pour le projet de lampe de trottinette, écris le besoin, la solution et le prototype.
                colonnes:
                    - Étape
                    - Pour la trottinette
                lignes:
                    -   - Besoin
                        - ''
                    -   - Solution
                        - ''
                    -   - Prototype
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
    -   id: a05
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Certains objets n’ont jamais dépassé le stade du prototype.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi, d’après toi, un prototype peut-il être abandonné ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a06
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu connais la démarche de projet. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : par quelles étapes passe-t-on pour concevoir un objet ? Cite les étapes dans l’ordre et dis à quoi sert le prototype.'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Démarche de projet : besoin → cahier des charges → solutions → choix → prototype → tests → présentation.'
    - On teste un prototype pour corriger les défauts avant de fabriquer.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
