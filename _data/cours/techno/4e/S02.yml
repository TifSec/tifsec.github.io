titre: Pourquoi avons-nous inventé le robot aspirateur ?
theme: "Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et à analyser"
problematique: Pourquoi avons-nous inventé le robot aspirateur ?
pourquoi: "À partir de toutes vos observations, complétez dans votre document :"
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Comprendre qu’un même besoin peut être satisfait par plusieurs solutions techniques.
        - Comprendre que les objets techniques évoluent avec les besoins, les usages et les contraintes.
        - Comprendre qu’une évolution apporte des avantages mais peut aussi créer de nouvelles contraintes.
    competences:
        - observer et comparer plusieurs solutions techniques ;
        - formuler une hypothèse avant de rechercher une réponse ;
        - identifier ce que fait l’utilisateur et ce que fait l’objet ;
        - vérifier une hypothèse avec une source technique ;
        - justifier l’évolution d’un objet technique.
activites:
    - id: a02
      titre: Compétence visée
      contenu:
          - type: paragraphe
            texte: Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques.
      questions: []
    - id: a04
      titre: Production attendue
      contenu:
          - type: paragraphe
            texte: Vous devez produire un document LibreOffice Writer contenant vos premières hypothèses, un tableau de comparaison, une vérification documentaire, vos réponses argumentées et une courte conclusion.
      questions: []
    - id: a05
      titre: 1. Créer votre document de travail
      contenu:
          - type: paragraphe
            texte: "Créez dès maintenant un document LibreOffice Writer nommé :"
          - type: paragraphe
            texte: 4e_S2_nom.odt
          - type: paragraphe
            texte: Remplacez nom par votre nom.
          - type: paragraphe
            texte: "Indiquez dans votre document :"
          - type: liste
            elements:
                - votre nom et votre prénom ;
                - la date ;
                - "le titre : Séance 2 : Pourquoi avons-nous inventé le robot aspirateur ?"
          - type: paragraphe
            texte: Votre document servira pendant toute la séance pour conserver vos premières idées, vos réponses, vos recherches et vos corrections.
          - type: paragraphe
            texte: Le fichier devra être rendu en fin d’heure, même s’il n’est pas terminé.
      questions: []
    - id: a06
      titre: 2. Plusieurs solutions pour le même problème
      contenu:
          - type: paragraphe
            texte: "Voici quatre objets utilisés pour nettoyer les sols :"
          - type: etapes
            elements:
                - le balai ;
                - l’aspirateur traîneau ;
                - l’aspirateur sans fil ;
                - le robot aspirateur.
          - type: paragraphe
            texte: "Ils répondent globalement au même besoin : nettoyer un sol."
          - type: paragraphe
            texte: Pourtant, aucun ne fonctionne exactement de la même manière.
          - type: paragraphe
            texte: "Sans rechercher sur Internet, répondez dans votre document :"
          - type: paragraphe
            texte: Classez ces quatre solutions du plus ancien au plus récent.
      questions:
          - id: q01
            type: texte
            enonce: Si le balai permet déjà de nettoyer un sol, pourquoi a-t-on inventé les autres solutions ?
            suite: []
          - id: q02
            type: texte
            enonce: Qu’est-ce qui a progressivement changé dans le travail réalisé par l’utilisateur ?
            suite:
                - type: paragraphe
                  texte: Écrivez vos premières idées, même si vous n’êtes pas certain de votre réponse.
                - type: titre
                  texte: Besoin d’un indice ?
          - id: q03
            type: texte
            enonce: Qui produit le mouvement ?
          - id: q04
            type: texte
            enonce: Qui doit déplacer l’objet ?
          - id: q05
            type: texte
            enonce: Qui produit l’aspiration ?
          - id: q06
            type: texte
            enonce: L’utilisateur doit-il être présent pendant tout le nettoyage ?
    - id: a07
      titre: 3. Comparer les solutions
      contenu:
          - type: paragraphe
            texte: Créez dans votre document le tableau suivant et complétez-le.
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Objet
                - Ce que fait l’utilisateur
                - Ce que fait l’objet
                - Un avantage
                - Une limite
            lignes:
                - - Balai
                  - ""
                  - ""
                  - ""
                  - ""
                - - Aspirateur traîneau
                  - ""
                  - ""
                  - ""
                  - ""
                - - Aspirateur sans fil
                  - ""
                  - ""
                  - ""
                  - ""
                - - Robot aspirateur
                  - ""
                  - ""
                  - ""
                  - ""
            suite:
                - type: paragraphe
                  texte: Pour chaque objet, cherchez au moins un avantage et une limite.
                - type: titre
                  texte: Quelques pistes si vous bloquez
                - type: liste
                  elements:
                      - effort physique ;
                      - présence d’un câble ;
                      - autonomie ;
                      - temps consacré au nettoyage ;
                      - prix ;
                      - capacité à accéder à certains endroits.
    - id: a08
      titre: 4. Décomposer l’évolution
      contenu:
          - type: paragraphe
            texte: Le passage du balai au robot aspirateur ne s’est pas fait en une seule étape.
          - type: paragraphe
            texte: Pour chaque évolution, identifiez le problème que la nouvelle solution cherche à réduire.
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Évolution
                - Problème ou contrainte réduite
                - Nouvelle limite possible
            lignes:
                - - Balai → aspirateur traîneau
                  - ""
                  - ""
                - - Aspirateur traîneau → aspirateur sans fil
                  - ""
                  - ""
                - - Aspirateur sans fil → robot aspirateur
                  - ""
                  - ""
            suite:
                - type: paragraphe
                  texte: Pour chaque ligne, justifiez brièvement votre proposition.
    - id: a09
      titre: 5. Vérifier ce que peut réellement faire un robot
      contenu:
          - type: paragraphe
            texte: Jusqu’ici, vous avez travaillé à partir de vos connaissances et de vos hypothèses.
          - type: paragraphe
            texte: Vérifions maintenant certaines capacités réelles d’un robot aspirateur.
          - type: paragraphe
            texte: "Consultez la documentation suivante :"
          - type: paragraphe
            texte: iRobot – Guide des robots Roomba
          - type: lien
            titre: iRobot – Guide des robots Roomba
            url: https://www.irobot.fr/fr_FR/buyersguide.html
          - type: paragraphe
            texte: "Cette documentation présente plusieurs fonctions possibles selon les modèles : évitement d’obstacles, fonctionnement sur différents sols, recharge, nettoyage automatisé, etc."
          - type: paragraphe
            texte: "Choisissez deux questions parmi les suivantes :"
      questions:
          - id: q01
            type: texte
            enonce: Le robot peut-il éviter de tomber dans un escalier ?
          - id: q02
            type: texte
            enonce: Peut-il détecter certains obstacles ?
          - id: q03
            type: texte
            enonce: Peut-il revenir se recharger sans intervention de l’utilisateur ?
          - id: q04
            type: texte
            enonce: Peut-il fonctionner sur plusieurs types de sols ?
            suite:
                - type: paragraphe
                  texte: "Pour chaque question, notez :"
                - type: liste
                  elements:
                      - "Avant la recherche : je pense que..."
                      - "Information trouvée : ..."
                      - "Conclusion : mon hypothèse est confirmée, infirmée ou doit être corrigée."
                - type: paragraphe
                  texte: "Attention : les fonctions disponibles peuvent varier selon les modèles de robots."
    - id: a10
      titre: 6. L’utilisateur fait-il vraiment moins de travail ?
      contenu:
          - type: paragraphe
            texte: Un robot aspirateur peut réaliser certaines tâches automatiquement.
          - type: paragraphe
            texte: Mais cela signifie-t-il que l’utilisateur n’a plus rien à faire ?
          - type: paragraphe
            texte: "Pour vous aider, vous pouvez consulter :"
          - type: paragraphe
            texte: iRobot – Où placer la base du robot ?
          - type: lien
            titre: iRobot – Où placer la base du robot ?
            url: https://assistance.irobot.fr/articles/fr/Knowledge/31227
          - type: paragraphe
            texte: La documentation précise par exemple qu’une base doit être installée dans une zone suffisamment dégagée.
          - type: paragraphe
            texte: "Vous pouvez aussi consulter : iRobot – Préparer le logement pour la navigation et la cartographie ."
          - type: lien
            titre: iRobot – Préparer le logement pour la navigation et la cartographie
            url: https://assistance.irobot.fr/articles/fr/Knowledge/20500
          - type: paragraphe
            texte: Dans votre document, trouvez au moins trois actions qui peuvent encore être réalisées par l’utilisateur.
          - type: paragraphe
            texte: "Puis répondez :"
          - type: paragraphe
            texte: Le robot aspirateur supprime-t-il le travail humain ou le transforme-t-il ? Justifiez.
      questions: []
    - id: a11
      titre: 7. Pourquoi les objets évoluent-ils ?
      contenu:
          - type: paragraphe
            texte: "À partir de toutes vos observations, complétez dans votre document :"
          - type: paragraphe
            texte: Les objets techniques évoluent notamment parce que...
          - type: paragraphe
            texte: Donnez au moins trois raisons différentes.
          - type: titre
            texte: Besoin d’un indice ?
      questions:
          - id: q01
            type: texte
            enonce: Les besoins des utilisateurs peuvent-ils évoluer ?
          - id: q02
            type: texte
            enonce: Les utilisateurs peuvent-ils rechercher davantage de confort ?
          - id: q03
            type: texte
            enonce: De nouvelles technologies peuvent-elles apparaître ?
          - id: q04
            type: texte
            enonce: De nouvelles contraintes peuvent-elles apparaître ?
    - id: a12
      titre: 8. Mettons des mots sur ce que nous avons découvert
      contenu:
          - type: paragraphe
            texte: "Les différents objets étudiés répondent globalement au même besoin : nettoyer un sol."
          - type: paragraphe
            texte: Pourtant, leurs usages, leurs avantages, leurs limites et la quantité de travail laissée à l’utilisateur sont différents.
          - type: paragraphe
            texte: "Les objets et systèmes techniques évoluent notamment lorsque :"
          - type: liste
            elements:
                - les besoins ou les habitudes évoluent ;
                - les utilisateurs recherchent davantage de confort ou d’autonomie ;
                - de nouvelles technologies deviennent disponibles ;
                - de nouvelles contraintes apparaissent.
          - type: paragraphe
            texte: Une évolution technique ne rend donc pas automatiquement une solution meilleure dans toutes les situations.
      questions: []
    - id: a13
      titre: "9. Réinvestir : imaginer l’évolution suivante"
      contenu:
          - type: paragraphe
            texte: Identifiez d’abord une limite actuelle d’un robot aspirateur.
          - type: paragraphe
            texte: Imaginez ensuite une évolution qui pourrait réduire cette limite.
          - type: paragraphe
            texte: "Présentez votre proposition sous la forme :"
          - type: liste
            elements:
                - "Problème actuel : ..."
                - "Évolution proposée : ..."
                - "Avantage attendu : ..."
                - "Nouvelle contrainte possible : ..."
      questions: []
    - id: a14
      titre: 10. Conclusion
      contenu:
          - type: paragraphe
            texte: "Rédigez quelques phrases pour répondre à la problématique :"
          - type: paragraphe
            texte: Pourquoi avons-nous inventé le robot aspirateur alors que d’autres solutions permettaient déjà de nettoyer les sols ?
          - type: paragraphe
            texte: "Votre conclusion doit expliquer :"
          - type: liste
            elements:
                - pourquoi une solution technique peut évoluer ;
                - comment le rôle de l’utilisateur a changé ;
                - pourquoi une nouvelle solution peut apporter à la fois des avantages et de nouvelles contraintes.
          - type: paragraphe
            texte: Utilisez vos propres mots.
      questions: []
    - id: a15
      titre: 11. Rendu de fin de séance
      contenu:
          - type: paragraphe
            texte: À la fin du cours, votre fichier doit être rendu, même s’il n’est pas terminé.
          - type: paragraphe
            texte: "Déposez :"
          - type: paragraphe
            texte: 4e_S2_nom.odt
          - type: paragraphe
            texte: "Avant de le rendre, vérifiez rapidement :"
          - type: liste
            elements:
                - votre nom, la date et le titre ;
                - vos deux tableaux ;
                - vos deux vérifications documentaires ;
                - vos justifications ;
                - votre conclusion ;
                - la lisibilité générale de votre document.
      questions: []
    - id: a16
      titre: Références pédagogiques
      contenu:
          - type: liste
            elements:
                - Ministère de l’Éducation nationale – Programme de technologie du cycle 4, BO n°9 du 29 février 2024
                - Ministère de l’Éducation nationale – Annexe du programme de technologie du cycle 4
          - type: lien
            titre: Ministère de l’Éducation nationale – Programme de technologie du cycle 4, BO n°9 du 29 février 2024
            url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
          - type: lien
            titre: Ministère de l’Éducation nationale – Annexe du programme de technologie du cycle 4
            url: https://www.education.gouv.fr/sites/default/files/ensel802_annexe.pdf
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
introduction:
    - type: paragraphe
      texte: "Problématique : Pourquoi les solutions utilisées pour nettoyer les sols ont-elles évolué alors que le besoin principal reste le même ?"
    - type: titre
      texte: Objectifs d’apprentissage
    - type: paragraphe
      texte: "Ce que vous allez apprendre :"
    - type: liste
      elements:
          - Comprendre qu’un même besoin peut être satisfait par plusieurs solutions techniques.
          - Comprendre que les objets techniques évoluent avec les besoins, les usages et les contraintes.
          - Comprendre qu’une évolution apporte des avantages mais peut aussi créer de nouvelles contraintes.
    - type: paragraphe
      texte: "Ce que vous allez apprendre à faire :"
    - type: liste
      elements:
          - observer et comparer plusieurs solutions techniques ;
          - formuler une hypothèse avant de rechercher une réponse ;
          - identifier ce que fait l’utilisateur et ce que fait l’objet ;
          - vérifier une hypothèse avec une source technique ;
          - justifier l’évolution d’un objet technique.
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
