titre: 'Séance 12 : Qui est responsable quand ça dérape ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Que risque-t-on, et que faire, en cas de cyberharcèlement ou d’usurpation d’identité ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
objectifs:
    connaissances:
        - Le cyberharcèlement (messages répétés pour blesser), l’usurpation d’identité (se faire passer pour quelqu’un) et la diffusion d’images sans accord sont punis par la loi.
        - 'En cas de problème : ne pas répondre, faire des captures d’écran, en parler à un adulte, appeler le 3018 (numéro gratuit et anonyme).'
    competences:
        - Identifier une situation de cyberviolence.
        - Connaître les bons réflexes et les personnes à alerter.
pourquoi:
    - Depuis la séance 8, tu as appris à protéger tes comptes, tes traces et à respecter les œuvres des autres.
    - Aujourd’hui, tu vois ce qui se passe quand ça dérape, et comment réagir. C’est aussi le bilan de la séquence.
activites:
    -   id: a01
        titre: Reconnaître les situations
        contenu:
            -   type: tableau
                titre: Document 1
                colonnes:
                    - Situation (inventée)
                    - Ce qui se passe
                lignes:
                    -   - A
                        - Un élève crée un faux compte au nom d’un camarade et publie des messages moqueurs.
                    -   - B
                        - Un groupe envoie chaque jour des messages blessants à une élève.
                    -   - C
                        - Une photo de classe est publiée par un élève, avec l’accord de tous.
                    -   - D
                        - Une photo gênante d’un élève est partagée sans son accord.
        questions:
            -   id: q01
                type: tableau
                enonce: Pour chaque situation, écris le nom du problème, ou « aucun ».
                colonnes:
                    - Situation
                    - Problème
                lignes:
                    -   - A
                        - ''
                    -   - B
                        - ''
                    -   - C
                        - ''
                    -   - D
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
    -   id: a02
        titre: Les bons réflexes
        transition: Tu reconnais ces situations. Voici comment réagir.
        contenu:
            -   type: liste
                elements:
                    - Ne pas répondre ni transférer.
                    - Faire des captures d’écran (preuves).
                    - Bloquer et signaler le compte.
                    - En parler à un adulte de confiance.
                    - Appeler le 3018 (gratuit, anonyme, 7 jours sur 7).
        questions:
            -   id: q01
                type: qcm
                enonce: Tu reçois des messages blessants répétés. Quelle est la première chose à faire ?
                choix:
                    -   id: a
                        texte: Garder des preuves et en parler à un adulte.
                    -   id: b
                        texte: Répondre aussi méchamment.
                    -   id: c
                        texte: Supprimer tout sans rien dire.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Un camarade est victime de la situation B. Explique ce que tu peux faire pour l’aider, sans te mettre en danger.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a03
        titre: La loi
        transition: 'Ces actes ne sont pas des blagues : la loi les punit.'
        contenu:
            -   type: paragraphe
                texte: Le cyberharcèlement est puni par la loi, même pour un mineur, et même si on n’a fait que partager ou « liker » un message. Les sanctions dépendent de l’âge et de la gravité.
        questions:
            -   id: q01
                type: texte
                enonce: 'Un élève dit : « Je n’ai fait que partager, ce n’est pas moi qui l’ai écrit. » A-t-il raison de se croire non responsable ? Explique.'
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le 3018 propose aussi une application.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi un numéro anonyme peut-il aider une victime à parler ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu connais les risques et les réflexes. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : que risque-t-on, et que faire, en cas de cyberharcèlement ou d’usurpation d’identité ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Cyberharcèlement, usurpation d’identité, diffusion d’images sans accord : punis par la loi, même en partageant.'
    - 'Réflexes : preuves, bloquer, signaler, adulte de confiance, 3018.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
