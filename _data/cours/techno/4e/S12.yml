titre: 'Séance 12 : Qui est responsable quand ça dérape ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Que risque-t-on, et que faire, en cas de cyberharcèlement ou d’usurpation d’identité ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
objectifs:
    connaissances:
        - Le cyberharcèlement, l’usurpation d’identité et la diffusion d’images sans accord sont punis par la loi, même quand on ne fait que partager.
        - 'En cas de problème : ne pas répondre, garder des preuves, bloquer et signaler, en parler à un adulte, appeler le 3018.'
    competences:
        - Identifier une situation de cyberviolence.
        - Connaître les bons réflexes.
pourquoi:
    - Depuis la séance 8, tu as appris à protéger tes comptes, tes traces et à respecter les œuvres des autres.
    - Aujourd’hui, tu vois ce qui se passe quand ça dérape, et comment réagir. C’est le bilan de la séquence.
activites:
    -   id: a01
        titre: Reconnaître les situations
        consigne: Tu vas reconnaître des situations à risque en ligne à partir des quatre situations du document 1. On attend, pour chaque situation, le nom du problème (cyberharcèlement, usurpation…) ou « aucun ».
        contenu:
            -   type: tableau
                titre: Document 1
                colonnes:
                    - Situation (inventée)
                    - Ce qui se passe
                lignes:
                    -   - A
                        - Un élève crée un faux compte au nom d’un camarade et publie des messages moqueurs.
                    -   - B
                        - Un groupe envoie chaque jour des messages blessants à une élève.
                    -   - C
                        - Une photo de classe est publiée avec l’accord de tous.
                    -   - D
                        - Une photo gênante d’un élève est partagée sans son accord.
            -   type: etapes
                elements:
                    - Lis les quatre situations du document 1.
                    - 'Pour chacune, demande-toi : quelqu’un est-il blessé, imité ou exposé sans son accord ?'
                    - Écris le nom du problème, ou « aucun ».
            -   type: paragraphe
                texte: Pourquoi nommer le problème ? Savoir le nommer permet de comprendre qu’il est grave, et de savoir à qui en parler.
        questions:
            -   id: q01
                type: tableau
                enonce: Pour chaque situation, écris le problème, ou « aucun ».
                colonnes:
                    - Situation
                    - Problème
                lignes:
                    -   - A
                        - ''
                    -   - B
                        - ''
                    -   - C
                        - ''
                    -   - D
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
    -   id: a02
        titre: Les bons réflexes
        transition: Tu reconnais ces situations. Voici comment réagir.
        consigne: Tu vas apprendre les bons réflexes face au cyberharcèlement à partir de la liste ci-dessous. On attend ce que tu fais en premier et comment aider un camarade sans te mettre en danger.
        contenu:
            -   type: liste
                elements:
                    - Ne pas répondre ni transférer.
                    - Faire des captures d’écran (preuves).
                    - Bloquer et signaler le compte.
                    - En parler à un adulte de confiance.
                    - Appeler le 3018 (gratuit, anonyme, 7 jours sur 7).
            -   type: etapes
                elements:
                    - Lis la liste des réflexes.
                    - 'Classe-les dans ta tête : se protéger, garder des preuves, demander de l’aide.'
                    - Réponds aux questions.
            -   type: paragraphe
                texte: Pourquoi garder des preuves ? Sans captures d’écran, il est difficile pour les adultes et la justice d’agir.
        questions:
            -   id: q01
                type: qcm
                enonce: Tu reçois des messages blessants répétés. Que fais-tu en premier ?
                choix:
                    -   id: a
                        texte: Je garde des preuves et j’en parle à un adulte.
                    -   id: b
                        texte: Je réponds méchamment.
                    -   id: c
                        texte: Je supprime tout sans rien dire.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Un camarade est victime de la situation B. Comment peux-tu l’aider sans te mettre en danger ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a03
        titre: Ce que dit la loi
        transition: 'Ces actes ne sont pas des blagues : la loi les punit.'
        consigne: Tu vas découvrir ce que dit la loi sur le cyberharcèlement, à partir du rappel ci-dessous. On attend une réponse qui utilise la loi pour juger la phrase de l’élève.
        contenu:
            -   type: paragraphe
                texte: Le cyberharcèlement est puni par la loi, même pour un mineur, et même si on n’a fait que partager ou « liker » un message.
            -   type: etapes
                elements:
                    - Lis le rappel de la loi.
                    - Relis la phrase de l’élève dans la question.
                    - Réponds en utilisant la loi.
            -   type: paragraphe
                texte: Pourquoi la loi s’applique-t-elle aussi à ceux qui partagent ? Parce que chaque partage diffuse le message et augmente le mal fait à la victime.
        questions:
            -   id: q01
                type: texte
                enonce: 'Un élève dit : « Je n’ai fait que partager. » A-t-il raison de se croire non responsable ? Explique.'
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Je m’entraîne
        transition: Tu as compris la méthode. Applique-la seul sur un cas nouveau.
        consigne: 'Tu vas appliquer seul ce que tu as appris sur un cas nouveau : la situation de Lina, décrite ci-dessous. On attend le nom du problème et les actions de Lina dans l’ordre.'
        contenu:
            -   type: citation
                texte: Lina découvre un compte à son nom, avec sa photo, qui publie des messages qu’elle n’a jamais écrits.
            -   type: etapes
                elements:
                    - Lis la situation de Lina.
                    - Nomme le problème.
                    - Écris ce qu’elle doit faire, dans l’ordre.
            -   type: paragraphe
                texte: Pourquoi s’entraîner ? Savoir quoi faire, dans l’ordre, aide à réagir vite si cela t’arrive ou arrive à un ami.
        questions:
            -   id: q01
                type: texte
                enonce: Nomme le problème et écris, dans l’ordre, ce que Lina doit faire.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a05
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le 3018 propose aussi une application.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi un numéro anonyme peut-il aider une victime à parler ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a06
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu connais les risques et les réflexes. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : que risque-t-on, et que faire, en cas de cyberharcèlement ou d’usurpation d’identité ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Cyberharcèlement, usurpation, diffusion sans accord : punis, même en partageant.'
    - 'Réflexes : preuves, bloquer, signaler, adulte de confiance, 3018.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
