titre: "Comment ajouter un schéma que le lecteur peut comprendre ?"
theme: "Word et recherche technique"
problematique: "Comment ajouter un schéma que le lecteur peut comprendre ?"
pourquoi: "Un schéma a un titre, des légendes lisibles et une source."
application: "Un document clair aide une autre personne à retrouver une information technique."
lien_precedent: "Après Comment créer une fiche technique facile à lire ?, une nouvelle mission t’aide à réutiliser tes méthodes."
prerequis:
    - "Tu peux relire la séance précédente (Comment créer une fiche technique facile à lire ?) si nécessaire."
notions:
    - titre: "Un exemple expliqué"
      texte: "Une flèche pointe vers les pales et porte la légende « pales ». Sous l’image, on ajoute un titre. Si elle vient d’un site, on cite la source."
objectifs:
    connaissances:
        - "Un schéma a un titre, des légendes lisibles et une source."
    competences:
        - "Ajouter un schéma à la fiche S11, poser trois légendes et inscrire la source de l’image."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Un schéma a un titre, des légendes lisibles et une source."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Ajouter un schéma à la fiche S11, poser trois légendes et inscrire la source de l’image."
    - type: paragraphe
      texte: "Dans la vie réelle : Un document clair aide une autre personne à retrouver une information technique."
activites:
    - id: a01
      titre: "1. Comprendre la mission"
      pourquoi: "On commence par un exemple guidé : il montre une méthode avant que tu l’essaies."
      demarche:
          - Lis la situation.
          - Suis les étapes de l’exemple.
          - Repère la donnée qui aide à répondre.
      contenu:
          - type: paragraphe
            texte: "Une flèche pointe vers les pales et porte la légende « pales ». Sous l’image, on ajoute un titre. Si elle vient d’un site, on cite la source."
      questions:
          - id: q01
            type: texte
            enonce: "Que doit montrer une légende pour aider à comprendre un schéma ?"
            aide: "Relis l’exemple et repère l’information qui répond à la question."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
            aide: "Une ou deux phrases suffisent."
    - id: a02
      titre: "2. À toi d’essayer"
      pourquoi: "Tu as vu la méthode ; maintenant, applique-la dans une tâche que tu peux vérifier."
      demarche:
          - Réalise les étapes dans l’ordre.
          - Note le résultat attendu.
          - Compare-le au résultat observé.
      consigne: "Ajouter un schéma à la fiche S11, poser trois légendes et inscrire la source de l’image."
      questions:
          - id: q01
            type: texte
            enonce: "Quel résultat observes-tu ? Décris ton essai."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
      ressources:
          - type: lien
            titre: "Aide Microsoft Word — mise en forme"
            url: https://support.microsoft.com/word
    - id: a03
      titre: "3. Réutiliser la méthode"
      pourquoi: "Un nouvel exemple t’aide à voir où cette méthode peut encore servir."
      contenu:
          - type: paragraphe
            texte: "Reprends la méthode avec une nouvelle valeur, un autre document ou une autre situation du dossier."
      questions:
          - id: q01
            type: texte
            enonce: "Quelle information permet de justifier ta conclusion ? Quelle limite reste à vérifier ?"
    - id: a04
      titre: "4. Ce que tu retiens"
      pourquoi: "Tu termines en gardant une idée et une méthode pour la prochaine séance."
      demarche:
          - Relis les deux éléments à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Un schéma a un titre, des légendes lisibles et une source."
    - "Pour vérifier, je compare une réponse ou un essai à une donnée précise."
bilan: "Je peux expliquer ce que j’ai appris et montrer une réponse ou un essai comme preuve."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie cycle 4 : cette séance travaille un schéma a un titre, des légendes lisibles et une source.. Elle contribue progressivement aux compétences de fin de cycle."
    - type: lien
      titre: "Ministère — Programme de Technologie du cycle 4, BO 2024"
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
    - type: lien
      titre: "Aide Microsoft Word — mise en forme"
      url: https://support.microsoft.com/word
