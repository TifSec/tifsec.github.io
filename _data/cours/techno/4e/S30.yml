titre: "Comment expliquer un dépannage avec une preuve ?"
theme: "Dépanner par une méthode"
problematique: "Comment expliquer un dépannage avec une preuve ?"
pourquoi: "Un raisonnement relie le symptôme, le contrôle, son résultat et la conclusion."
application: "Vérifier une cause avant de remplacer une pièce évite des réparations inutiles."
lien_precedent: "Après La réparation répond-elle à l’exigence ?, une nouvelle mission t’aide à réutiliser tes méthodes."
prerequis:
    - "Tu peux relire la séance précédente (La réparation répond-elle à l’exigence ?) si nécessaire."
notions:
    - titre: "Un exemple expliqué"
      texte: "Le voyant est éteint, mais le dossier indique que le fusible est intact. Je ne conclus pas que le fusible est la cause ; je propose une autre vérification."
objectifs:
    connaissances:
        - "Un raisonnement relie le symptôme, le contrôle, son résultat et la conclusion."
    competences:
        - "Traiter un mini-dossier de panne : relever le symptôme, choisir un contrôle, lire le résultat et conclure."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Un raisonnement relie le symptôme, le contrôle, son résultat et la conclusion."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Traiter un mini-dossier de panne : relever le symptôme, choisir un contrôle, lire le résultat et conclure."
    - type: paragraphe
      texte: "Dans la vie réelle : Vérifier une cause avant de remplacer une pièce évite des réparations inutiles."
activites:
    - id: a01
      titre: "1. Comprendre la mission"
      pourquoi: "On commence par un exemple guidé : il montre une méthode avant que tu l’essaies."
      demarche:
          - Lis la situation.
          - Suis les étapes de l’exemple.
          - Repère la donnée qui aide à répondre.
      contenu:
          - type: paragraphe
            texte: "Le voyant est éteint, mais le dossier indique que le fusible est intact. Je ne conclus pas que le fusible est la cause ; je propose une autre vérification."
      questions:
          - id: q01
            type: texte
            enonce: "Quelle information du dossier peut servir de preuve à ta conclusion ?"
            aide: "Relis l’exemple et repère l’information qui répond à la question."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
            aide: "Une ou deux phrases suffisent."
    - id: a02
      titre: "2. À toi d’essayer"
      pourquoi: "Tu as vu la méthode ; maintenant, applique-la dans une tâche que tu peux vérifier."
      demarche:
          - Réalise les étapes dans l’ordre.
          - Note le résultat attendu.
          - Compare-le au résultat observé.
      consigne: "Traiter un mini-dossier de panne : relever le symptôme, choisir un contrôle, lire le résultat et conclure."
      questions:
          - id: q01
            type: texte
            enonce: "Quel résultat observes-tu ? Décris ton essai."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
      ressources:
          - type: lien
            titre: "Éduscol — Technologie au cycle 4"
            url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
    - id: a03
      titre: "3. Réutiliser la méthode"
      pourquoi: "Un nouvel exemple t’aide à voir où cette méthode peut encore servir."
      contenu:
          - type: paragraphe
            texte: "Reprends la méthode avec une nouvelle valeur, un autre document ou une autre situation du dossier."
      questions:
          - id: q01
            type: texte
            enonce: "Quelle information permet de justifier ta conclusion ? Quelle limite reste à vérifier ?"
    - id: a04
      titre: "4. Ce que tu retiens"
      pourquoi: "Tu termines en gardant une idée et une méthode pour la prochaine séance."
      demarche:
          - Relis les deux éléments à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Un raisonnement relie le symptôme, le contrôle, son résultat et la conclusion."
    - "Pour vérifier, je compare une réponse ou un essai à une donnée précise."
bilan: "Je peux expliquer ce que j’ai appris et montrer une réponse ou un essai comme preuve."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie cycle 4 : cette séance travaille un raisonnement relie le symptôme, le contrôle, son résultat et la conclusion.. Elle contribue progressivement aux compétences de fin de cycle."
    - type: lien
      titre: "Ministère — Programme de Technologie du cycle 4, BO 2024"
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
    - type: lien
      titre: "Éduscol — Technologie au cycle 4"
      url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
