titre: 'Séance 30 : Penser comme un ordinateur'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Pourquoi un ordinateur a-t-il besoin d’instructions très précises, dans un ordre précis ?
competences_bo:
    - Concevoir, écrire, tester et mettre au point un programme
objectifs:
    connaissances:
        - Un algorithme est une suite d’instructions précises, dans un ordre précis, pour résoudre un problème.
        - 'Une machine ne devine rien : une instruction floue ou dans le mauvais ordre donne un mauvais résultat.'
    competences:
        - Écrire des instructions précises.
        - Repérer une instruction ambiguë ou mal placée.
pourquoi:
    - En 5e, tu as programmé un jeu Arcade avec des blocs.
    - 'Avant de programmer en 4e, tu vas apprendre à écrire un algorithme. Aujourd’hui, sans ordinateur : un élève joue le robot.'
activites:
    -   id: a01
        titre: Le robot humain (activité débranchée)
        contenu:
            -   type: paragraphe
                texte: 'Le professeur dessine une grille de 5 × 5 cases. Un élève « robot » ne connaît que trois instructions : AVANCER (d’une case), TOURNER À DROITE, TOURNER À GAUCHE.'
            -   type: paragraphe
                texte: 'Exemple expliqué : pour aller deux cases devant puis une à droite : AVANCER, AVANCER, TOURNER À DROITE, AVANCER. Si on oublie TOURNER À DROITE, le robot avance tout droit et se trompe.'
        questions:
            -   id: q01
                type: tableau
                enonce: Le robot part de la case en bas à gauche, regard vers le haut. Écris les 4 premières instructions pour atteindre la case 2 cases au-dessus et 1 case à droite.
                colonnes:
                    - N°
                    - Instruction
                lignes:
                    -   - '1'
                        - ''
                    -   - '2'
                        - ''
                    -   - '3'
                        - ''
                    -   - '4'
                        - ''
                aide: Ligne × colonne.
    -   id: a02
        titre: Des instructions floues
        transition: Le robot n’exécute que des instructions précises.
        questions:
            -   id: q01
                type: texte
                enonce: « Va vers la porte. » Pourquoi un robot ne peut-il pas exécuter cette instruction ?
                aide: Pense à « car » (réflexe n° 4).
            -   id: q02
                type: qcm
                enonce: Dans quel ordre faut-il écrire les instructions pour faire un sandwich ?
                choix:
                    -   id: a
                        texte: Ouvrir le pain, mettre le jambon, fermer le pain.
                    -   id: b
                        texte: Fermer le pain, mettre le jambon, ouvrir le pain.
                    -   id: c
                        texte: L’ordre n’a pas d’importance.
                aide: Relis l’exemple expliqué.
    -   id: a03
        titre: Répéter
        transition: Écrire des instructions répétées est long. Il y a plus court.
        contenu:
            -   type: paragraphe
                texte: 'Pour avancer de 4 cases, on peut écrire : RÉPÉTER 4 FOIS : AVANCER. C’est une boucle.'
        questions:
            -   id: q01
                type: texte
                enonce: 'Réécris avec une boucle : AVANCER, TOURNER À DROITE, AVANCER, TOURNER À DROITE, AVANCER, TOURNER À DROITE, AVANCER, TOURNER À DROITE. Que dessine le robot ?'
                aide: Combien d’éléments sont demandés ?
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: On ajoute l’instruction SI MUR DEVANT ALORS TOURNER À DROITE.
        questions:
            -   id: q01
                type: texte
                enonce: Écris un algorithme qui fait suivre les murs au robot.
                aide: Combien d’éléments sont demandés ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu penses comme un ordinateur. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : pourquoi un ordinateur a-t-il besoin d’instructions précises, dans un ordre précis ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Algorithme : instructions précises, dans l’ordre.'
    - 'Boucle : RÉPÉTER n FOIS.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
