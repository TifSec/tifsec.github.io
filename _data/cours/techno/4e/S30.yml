titre: 'Séance 30 : Penser comme un ordinateur'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Pourquoi un ordinateur a-t-il besoin d’instructions précises, dans un ordre précis ?
competences_bo:
    - Concevoir, écrire, tester et mettre au point un programme
objectifs:
    connaissances:
        - Un algorithme est une suite d’instructions précises, dans un ordre précis.
        - 'Une boucle répète des instructions : RÉPÉTER 4 FOIS…'
    competences:
        - Écrire des instructions précises.
        - Utiliser une boucle.
pourquoi:
    - En 5e, tu as programmé un jeu Arcade avec des blocs.
    - 'Avant de programmer en 4e, tu apprends à écrire un algorithme. Aujourd’hui, sans ordinateur : un élève joue le robot.'
activites:
    -   id: a01
        titre: Le robot humain (activité débranchée)
        consigne: 'Tu vas jouer au « robot humain » sur une grille de 5 × 5 cases tracée par le professeur : le robot ne connaît que trois instructions. On attend les quatre instructions qui mènent le robot à une case donnée.'
        contenu:
            -   type: etapes
                elements:
                    - Le professeur trace une grille de 5 × 5 cases.
                    - 'Un élève « robot » ne connaît que : AVANCER, TOURNER À DROITE, TOURNER À GAUCHE.'
                    - Un autre élève lui dicte les instructions pour atteindre une case.
                    - Observe ce qui se passe quand une instruction manque.
            -   type: paragraphe
                texte: Pourquoi un robot humain ? Il montre qu’une machine fait exactement ce qu’on lui dit, ni plus ni moins.
        questions:
            -   id: q01
                type: tableau
                enonce: Le robot part en bas à gauche, regard vers le haut. Écris les 4 instructions pour aller 2 cases au-dessus et 1 à droite.
                colonnes:
                    - N°
                    - Instruction
                lignes:
                    -   - '1'
                        - ''
                    -   - '2'
                        - ''
                    -   - '3'
                        - ''
                    -   - '4'
                        - ''
                aide: Ligne × colonne.
    -   id: a02
        titre: Des instructions floues
        transition: Le robot n’exécute que des instructions précises.
        consigne: Tu vas comprendre pourquoi une machine ne peut pas exécuter une instruction floue comme « Va vers la porte ». On attend une explication et le bon ordre d’une suite d’actions.
        contenu:
            -   type: etapes
                elements:
                    - Lis l’instruction « Va vers la porte ».
                    - Demande-toi si le robot la connaît.
                    - Réécris-la avec les instructions du robot (en imaginant la grille).
            -   type: paragraphe
                texte: 'Pourquoi être précis ? Un ordinateur ne devine jamais : une instruction floue ne peut pas être exécutée.'
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi le robot ne peut-il pas exécuter « Va vers la porte » ?
                aide: Pense à « car » (réflexe n° 4).
            -   id: q02
                type: qcm
                enonce: Dans quel ordre faire un sandwich ?
                choix:
                    -   id: a
                        texte: Ouvrir le pain, mettre le jambon, fermer le pain.
                    -   id: b
                        texte: Fermer, mettre, ouvrir.
                    -   id: c
                        texte: Peu importe.
                aide: Relis l’exemple expliqué.
    -   id: a03
        titre: La boucle
        transition: Écrire des instructions répétées est long. Il y a plus court.
        consigne: Tu vas raccourcir une suite d’instructions répétées avec une boucle RÉPÉTER. On attend l’algorithme avec la boucle et la figure que dessine le robot.
        contenu:
            -   type: etapes
                elements:
                    - Lis la suite d’instructions de la question.
                    - Repère le groupe d’instructions qui se répète.
                    - Réécris-la avec RÉPÉTER … FOIS.
            -   type: paragraphe
                texte: 'Pourquoi une boucle ? Elle évite de recopier : plus court, et moins d’erreurs.'
        questions:
            -   id: q01
                type: texte
                enonce: 'Réécris avec une boucle : AVANCER, TOURNER À DROITE (4 fois de suite). Que dessine le robot ?'
                aide: Combien d’éléments sont demandés ?
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: On ajoute l’instruction SI MUR DEVANT ALORS TOURNER À DROITE.
        questions:
            -   id: q01
                type: texte
                enonce: Écris un algorithme qui fait suivre les murs au robot.
                aide: Combien d’éléments sont demandés ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu penses comme un ordinateur. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : pourquoi un ordinateur a-t-il besoin d’instructions précises, dans un ordre précis ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Algorithme : instructions précises, dans l’ordre.'
    - 'Boucle : RÉPÉTER n FOIS.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
