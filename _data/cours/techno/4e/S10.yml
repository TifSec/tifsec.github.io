titre: 'Séance 10 : Ai-je le droit d’utiliser cette image ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Quand ai-je le droit d’utiliser une image trouvée sur Internet ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
objectifs:
    connaissances:
        - 'Une œuvre (image, musique, texte) appartient à son auteur : c’est le droit d’auteur. On ne peut pas l’utiliser librement.'
        - 'Les licences Creative Commons disent ce qui est permis : BY (citer l’auteur), NC (pas d’usage commercial), ND (pas de modification), SA (partager dans les mêmes conditions).'
    competences:
        - Lire une licence Creative Commons.
        - Citer correctement une source.
pourquoi:
    - En séance 6, tu as rédigé un compte rendu.
    - Pour l’illustrer, tu cherches souvent des images sur Internet. As-tu le droit de les utiliser ?
activites:
    -   id: a01
        titre: Le droit d’auteur
        consigne: Tu vas découvrir la règle du droit d’auteur à partir de l’exemple de la photo d’un site d’actualité. On attend que tu saches ce que l’on peut faire d’une image sans licence.
        contenu:
            -   type: paragraphe
                texte: 'Exemple expliqué : une photo trouvée sur un site d’actualité appartient au photographe. La publier dans ton exposé en ligne, sans autorisation, n’est pas permis.'
            -   type: etapes
                elements:
                    - Lis l’exemple expliqué.
                    - 'Retiens la règle : par défaut, une image appartient à son auteur.'
                    - Réponds à la question.
            -   type: paragraphe
                texte: 'Pourquoi protéger les œuvres ? Un photographe ou un dessinateur vit de son travail : l’utiliser sans accord, c’est le lui prendre.'
        questions:
            -   id: q01
                type: qcm
                enonce: Une image trouvée sur Internet sans aucune indication de licence…
                choix:
                    -   id: a
                        texte: '… est protégée : on ne peut pas la réutiliser librement.'
                    -   id: b
                        texte: … est libre de droits.
                    -   id: c
                        texte: … appartient à Internet.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a02
        titre: Lire une licence Creative Commons
        transition: 'Toutes les images ne sont pas interdites : certaines ont une licence qui dit ce qui est permis.'
        consigne: Tu vas apprendre à lire une licence Creative Commons à partir des sigles du document 1. On attend, pour chaque situation, si l’utilisation est permise, et l’explication de CC BY-SA.
        contenu:
            -   type: tableau
                titre: Document 1 — Les sigles Creative Commons
                colonnes:
                    - Sigle
                    - Signification
                lignes:
                    -   - BY
                        - Je dois citer l’auteur.
                    -   - NC
                        - Pas d’utilisation commerciale.
                    -   - ND
                        - Pas de modification.
                    -   - SA
                        - Je partage ma création dans les mêmes conditions.
            -   type: etapes
                elements:
                    - Lis la signification des sigles dans le document 1.
                    - Pour chaque situation, repère le sigle de l’image.
                    - Vérifie si ce que veut faire l’élève est permis par ce sigle.
            -   type: paragraphe
                texte: 'Pourquoi des licences ? Certains auteurs veulent que leurs œuvres circulent : la licence dit clairement ce qu’on a le droit de faire.'
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, ai-je le droit ? Écris « oui » ou « non ».
                colonnes:
                    - Situation
                    - Oui ou non ?
                lignes:
                    -   - 'Image CC BY : je la mets dans mon exposé en citant l’auteur.'
                        - ''
                    -   - 'Image CC BY-ND : je change ses couleurs.'
                        - ''
                    -   - 'Image CC BY-NC : je l’imprime sur des t-shirts que je vends.'
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
            -   id: q02
                type: texte
                enonce: Explique ce que veut dire la licence CC BY-SA en une phrase.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a03
        titre: Citer une source
        transition: Tu sais lire une licence. Il faut aussi citer la source correctement.
        consigne: 'Tu vas apprendre à citer la source d’une image en suivant le modèle donné. On attend une citation complète dans le bon ordre : auteur, titre, site, date, licence.'
        contenu:
            -   type: paragraphe
                texte: 'Modèle : « Photo : Jean Martin, Éolienne au soleil, Wikimedia Commons, 2021, CC BY-SA 4.0. »'
            -   type: etapes
                elements:
                    - Lis le modèle de citation.
                    - 'Repère les cinq éléments : auteur, titre, site, date, licence.'
                    - Écris la citation demandée dans le même ordre.
            -   type: paragraphe
                texte: 'Pourquoi citer ? C’est respecter l’auteur, et permettre au lecteur de retrouver l’image : c’est une règle dans tous les dossiers.'
        questions:
            -   id: q01
                type: texte
                enonce: 'Écris la citation : photographe Léa Durand ; titre « Panneau solaire » ; site Wikimedia Commons ; 2022 ; licence CC BY 4.0.'
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a04
        titre: Je m’entraîne
        transition: Tu as compris la méthode. Applique-la seul sur un cas nouveau.
        consigne: 'Tu vas appliquer seul la méthode sur un cas nouveau : trois images et leurs licences, présentées dans le tableau ci-dessous. On attend l’image que tu peux publier et sa citation.'
        contenu:
            -   type: tableau
                colonnes:
                    - Image
                    - Auteur
                    - Licence
                lignes:
                    -   - '1'
                        - Agence photo
                        - Tous droits réservés
                    -   - '2'
                        - Sam Lee, « Éolienne en mer », Wikimedia Commons, 2020
                        - CC BY 4.0
                    -   - '3'
                        - Inconnu (réseau social)
                        - Aucune indiquée
            -   type: etapes
                elements:
                    - Lis les trois images proposées.
                    - Pour chacune, lis la licence.
                    - Choisis celle que tu peux mettre dans un exposé publié en ligne, puis écris la citation.
            -   type: paragraphe
                texte: Pourquoi s’entraîner ? Choisir une image utilisable et la citer, tu le feras dans chaque exposé.
        questions:
            -   id: q01
                type: qcm
                enonce: Quelle image peux-tu publier dans ton exposé en ligne ?
                choix:
                    -   id: a
                        texte: Image 2 (CC BY).
                    -   id: b
                        texte: Image 1 (tous droits réservés).
                    -   id: c
                        texte: Image 3 (trouvée sur un réseau social, sans licence).
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Écris la citation de l’image 2.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a05
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une œuvre entre dans le domaine public 70 ans après la mort de son auteur, en France.
        questions:
            -   id: q01
                type: texte
                enonce: Claude Monet est mort en 1926. Ses tableaux sont-ils dans le domaine public ? Explique.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a06
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu connais les règles. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quand as-tu le droit d’utiliser une image trouvée sur Internet ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Par défaut, une œuvre est protégée par le droit d’auteur.
    - 'Creative Commons : BY, NC, ND, SA.'
    - 'Citer : auteur, titre, site, date, licence.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
