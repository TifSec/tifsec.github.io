titre: Le robot aspirateur parfait existe-t-il ?
theme: "Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et à analyser"
problematique: Le robot aspirateur parfait existe-t-il ?
pourquoi: "Objectif de cette séance : Comprendre qu’une solution technique est conçue pour répondre à un besoin précis."
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Comprendre qu’une solution technique est conçue pour répondre à un besoin précis.
        - Comprendre que les contraintes et les critères ne sont pas les mêmes pour tous les utilisateurs.
        - Comprendre qu’améliorer une caractéristique peut en dégrader une autre.
        - Comprendre qu’une conception technique résulte souvent de compromis.
    competences:
        - analyser un besoin ;
        - identifier et hiérarchiser des contraintes ;
        - choisir des caractéristiques cohérentes ;
        - justifier plusieurs choix techniques ;
        - identifier les limites de votre propre solution ;
        - réutiliser les méthodes étudiées lors des séances précédentes.
activites:
    - id: a02
      titre: Compétence visée
      contenu:
          - type: paragraphe
            texte: Choisir et proposer une solution technique adaptée à un besoin en prenant en compte plusieurs critères et contraintes.
      questions: []
    - id: a04
      titre: Production attendue
      contenu:
          - type: paragraphe
            texte: Vous devez produire un document LibreOffice Writer présentant l’analyse d’un utilisateur, les critères prioritaires de votre conception, les principales caractéristiques de votre robot, les compromis réalisés et une conclusion argumentée.
      questions: []
    - id: a05
      titre: 1. Créer votre document de travail
      contenu:
          - type: paragraphe
            texte: "Créez un document LibreOffice Writer nommé :"
          - type: paragraphe
            texte: 4e_S10_nom.odt
          - type: paragraphe
            texte: Remplacez nom par votre nom.
          - type: paragraphe
            texte: "Indiquez :"
          - type: liste
            elements:
                - votre nom et votre prénom ;
                - la date ;
                - "le titre : Séance 10 : Le robot aspirateur parfait existe-t-il ?"
          - type: paragraphe
            texte: À ce stade de l’année, votre document doit être organisé dès le début avec des titres et des tableaux lisibles.
          - type: paragraphe
            texte: Le fichier devra être rendu en fin d’heure, même s’il n’est pas terminé.
      questions: []
    - id: a06
      titre: 2. Peut-on vraiment fabriquer le meilleur robot ?
      contenu:
          - type: paragraphe
            texte: "Depuis la séance 2, vous avez étudié plusieurs caractéristiques d’un robot aspirateur :"
          - type: liste
            elements:
                - son prix ;
                - ses performances ;
                - son adaptation au logement ;
                - sa consommation et son cycle de vie ;
                - sa réparabilité ;
                - les matériaux et dimensions de certaines pièces.
          - type: paragraphe
            texte: "Sans effectuer de recherche, répondez :"
      questions:
          - id: q01
            type: texte
            enonce: Peut-on fabriquer un robot qui soit à la fois le moins cher, le plus performant, le plus autonome, le plus silencieux, le plus réparable et celui utilisant le moins de ressources ? Expliquez.
            suite: []
          - id: q02
            type: texte
            enonce: Donnez deux exemples de caractéristiques qui peuvent être difficiles à améliorer en même temps.
            suite: []
          - id: q03
            type: texte
            enonce: Qu’appelle-t-on un compromis ? Reformulez avec vos propres mots.
            suite:
                - type: titre
                  texte: Besoin d’un indice ?
                - type: paragraphe
                  texte: Pensez par exemple à la batterie, au prix, à la masse, au nombre de fonctions ou à la quantité de matière.
    - id: a07
      titre: "3. Votre mission : concevoir pour un utilisateur"
      contenu:
          - type: paragraphe
            texte: Vous devez concevoir un robot aspirateur pour un seul des profils suivants.
          - type: titre
            texte: "Profil A : petit logement, petit budget"
          - type: liste
            elements:
                - appartement de 40 m² ;
                - sols principalement durs ;
                - aucun animal ;
                - peu d’obstacles ;
                - "budget maximal : 250 € ;"
                - "priorité : simplicité et prix réduit."
          - type: titre
            texte: "Profil B : grande maison avec animaux"
          - type: liste
            elements:
                - maison de 130 m² ;
                - deux chiens et un chat ;
                - plusieurs tapis ;
                - nettoyage presque quotidien ;
                - "budget maximal : 650 € ;"
                - "priorité : efficacité du nettoyage."
          - type: titre
            texte: "Profil C : automatiser au maximum"
          - type: liste
            elements:
                - logement de 90 m² ;
                - plusieurs pièces ;
                - sols principalement durs ;
                - "budget maximal : 900 € ;"
                - souhaite programmer le nettoyage ;
                - "priorité : intervenir le moins souvent possible."
          - type: titre
            texte: "Profil D : conserver longtemps l’appareil"
          - type: liste
            elements:
                - logement de 80 m² ;
                - "budget maximal : 500 € ;"
                - souhaite conserver le robot longtemps ;
                - souhaite pouvoir remplacer batterie, roues et brosses ;
                - souhaite limiter les remplacements prématurés ;
                - "priorité : durée d’utilisation et réparabilité."
      questions: []
    - id: a08
      titre: 4. Décomposer le problème avant de chercher une solution
      contenu:
          - type: paragraphe
            texte: Avant de concevoir le robot, analysez votre utilisateur.
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Élément à analyser
                - Votre réponse
            lignes:
                - - Besoin principal
                  - ""
                - - Caractéristiques du logement
                  - ""
                - - Budget maximal
                  - ""
                - - Contraintes principales
                  - ""
                - - Ce que l’utilisateur veut privilégier
                  - ""
            suite:
                - type: paragraphe
                  texte: "Terminez cette partie en formulant le problème sous la forme :"
                - type: paragraphe
                  texte: Comment concevoir un robot capable de ... tout en respectant ... ?
    - id: a09
      titre: 5. Quels critères sont réellement prioritaires ?
      contenu:
          - type: paragraphe
            texte: Vous ne pouvez pas tout privilégier.
          - type: paragraphe
            texte: "Choisissez seulement cinq critères parmi :"
          - type: liste
            elements:
                - prix ;
                - autonomie ;
                - efficacité de nettoyage ;
                - niveau sonore ;
                - navigation ;
                - évitement des obstacles ;
                - fonction lavage ;
                - automatisation ;
                - facilité d’entretien ;
                - réparabilité ;
                - durée d’utilisation ;
                - consommation d’énergie ;
                - quantité de matière utilisée.
          - type: paragraphe
            texte: "Classez-les par ordre de priorité :"
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Priorité
                - Critère
                - Pourquoi est-il important pour cet utilisateur ?
            lignes:
                - - "1"
                  - ""
                  - ""
                - - "2"
                  - ""
                  - ""
                - - "3"
                  - ""
                  - ""
                - - "4"
                  - ""
                  - ""
                - - "5"
                  - ""
                  - ""
    - id: a10
      titre: 6. Concevoir votre solution
      contenu:
          - type: paragraphe
            texte: Vous pouvez maintenant définir votre robot.
          - type: paragraphe
            texte: Ne cherchez pas à ajouter toutes les fonctions possibles. Chaque caractéristique doit répondre à votre besoin ou à une contrainte identifiée.
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Caractéristique
                - Votre choix
                - Pourquoi ?
            lignes:
                - - Autonomie recherchée
                  - ""
                  - ""
                - - Navigation / détection
                  - ""
                  - ""
                - - Fonctions principales
                  - ""
                  - ""
                - - Station automatique
                  - ""
                  - ""
                - - Entretien / réparabilité
                  - ""
                  - ""
                - - Choix concernant la conception
                  - ""
                  - ""
                - - Prix cible
                  - ""
                  - ""
            suite:
                - type: paragraphe
                  texte: Vous pouvez ajouter une caractéristique si elle est réellement importante pour votre utilisateur.
                - type: titre
                  texte: Pour réfléchir à la réparabilité
                - type: paragraphe
                  texte: "Vous pouvez consulter : Ministère de la Transition écologique – Indice de réparabilité ."
                - type: lien
                  titre: Ministère de la Transition écologique – Indice de réparabilité
                  url: https://www.ecologie.gouv.fr/politiques-publiques/indice-reparabilite
                - type: paragraphe
                  texte: Vérifiez notamment l’intérêt de la documentation, de la facilité de démontage et de la disponibilité des pièces détachées.
    - id: a11
      titre: 7. Identifier vos compromis
      contenu:
          - type: paragraphe
            texte: Relisez votre solution.
          - type: paragraphe
            texte: Choisissez deux décisions importantes pour lesquelles vous avez dû faire un compromis.
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Ce que je privilégie
                - Ce que j’accepte de limiter
                - Pourquoi ce compromis ?
            lignes:
                - - ""
                  - ""
                  - ""
                - - ""
                  - ""
                  - ""
            suite:
                - type: titre
                  texte: Besoin d’un exemple ?
                - type: paragraphe
                  texte: Une batterie plus importante peut augmenter l’autonomie mais aussi augmenter la masse, le prix ou la quantité de matière.
    - id: a12
      titre: 8. Vérifier la durée de vie de votre solution
      contenu:
          - type: paragraphe
            texte: Lors des séances précédentes, vous avez vu qu’une solution doit aussi pouvoir être entretenue et utilisée pendant une durée suffisante.
          - type: paragraphe
            texte: "Choisissez deux éléments parmi :"
          - type: liste
            elements:
                - batterie ;
                - roues ;
                - brosses ;
                - capteurs ;
                - coque ;
                - carte électronique.
          - type: paragraphe
            texte: "Pour chacun, indiquez :"
          - type: liste
            elements:
                - s’il doit pouvoir être remplacé facilement ;
                - comment on pourrait y accéder ;
                - pourquoi ce choix pourrait prolonger la durée d’utilisation du robot.
          - type: paragraphe
            texte: "Pour replacer cette réflexion dans le cycle de vie du produit, vous pouvez consulter : Ministère de la Transition écologique – Durée de vie des produits ."
          - type: lien
            titre: Ministère de la Transition écologique – Durée de vie des produits
            url: https://www.ecologie.gouv.fr/politiques-publiques/duree-vie-produits
      questions: []
    - id: a13
      titre: 9. Votre robot fonctionne-t-il aussi pour quelqu’un d’autre ?
      contenu:
          - type: paragraphe
            texte: Choisissez maintenant un autre profil parmi A, B, C ou D.
          - type: paragraphe
            texte: "Testez votre solution :"
      questions:
          - id: q01
            type: texte
            enonce: Quelles caractéristiques resteraient adaptées ?
            suite: []
          - id: q02
            type: texte
            enonce: Quelles caractéristiques deviendraient moins intéressantes ?
            suite: []
          - id: q03
            type: texte
            enonce: Quelle fonction ou performance manquerait ?
            suite: []
          - id: q04
            type: texte
            enonce: Quelle modification principale faudrait-il apporter ?
            suite:
                - type: paragraphe
                  texte: "Terminez par :"
                - type: paragraphe
                  texte: Mon robot est / n’est pas universel parce que...
    - id: a14
      titre: 10. Présenter votre concept
      contenu:
          - type: paragraphe
            texte: Ajoutez dans Writer une petite représentation numérique de votre robot à l’aide de formes simples si elle permet de mieux comprendre votre proposition.
          - type: paragraphe
            texte: "Vous pouvez faire apparaître seulement les éléments importants :"
          - type: liste
            elements:
                - capteurs ;
                - roues ;
                - brosses ;
                - batterie ;
                - bac ;
                - éléments facilement démontables ;
                - station éventuelle.
          - type: paragraphe
            texte: Cette représentation est facultative si votre tableau décrit déjà clairement votre solution.
      questions: []
    - id: a15
      titre: 11. Mettons des mots sur ce que nous avons découvert
      contenu:
          - type: paragraphe
            texte: Une solution technique doit répondre à un besoin tout en respectant plusieurs contraintes.
          - type: paragraphe
            texte: Des critères permettent de comparer ou d’évaluer plusieurs solutions.
          - type: paragraphe
            texte: Selon l’utilisateur, certains critères deviennent prioritaires alors que d’autres le sont moins.
          - type: paragraphe
            texte: "Les critères peuvent également entrer en opposition :"
          - type: liste
            elements:
                - performance et coût ;
                - autonomie et masse ;
                - nombre de fonctions et simplicité ;
                - rigidité et quantité de matière ;
                - prix réduit et réparabilité.
          - type: paragraphe
            texte: Le concepteur doit alors effectuer des compromis.
          - type: paragraphe
            texte: "Une bonne solution technique n’est donc pas forcément la meilleure dans tous les domaines : elle est surtout adaptée au problème à résoudre."
      questions: []
    - id: a16
      titre: 12. Conclusion
      contenu:
          - type: paragraphe
            texte: "Rédigez quelques phrases pour répondre à la problématique :"
          - type: paragraphe
            texte: Le robot aspirateur parfait existe-t-il ?
          - type: paragraphe
            texte: "Votre conclusion doit utiliser les mots :"
          - type: liste
            elements:
                - besoin ;
                - contrainte ;
                - critère ;
                - compromis.
          - type: paragraphe
            texte: Donnez également un exemple provenant de votre propre conception pour montrer pourquoi votre robot peut être adapté à un utilisateur mais moins adapté à un autre.
      questions: []
    - id: a17
      titre: 13. Rendu de fin de séance
      contenu:
          - type: paragraphe
            texte: À la fin du cours, votre fichier doit être rendu, même s’il n’est pas terminé.
          - type: paragraphe
            texte: "Déposez :"
          - type: paragraphe
            texte: 4e_S10_nom.odt
          - type: paragraphe
            texte: "Avant de le rendre, vérifiez :"
          - type: liste
            elements:
                - votre nom, la date et le titre ;
                - l’analyse de votre utilisateur ;
                - vos cinq critères prioritaires ;
                - les caractéristiques de votre robot ;
                - vos deux compromis ;
                - votre analyse de la durée de vie ;
                - le test avec un autre utilisateur ;
                - votre conclusion ;
                - la lisibilité générale du document.
      questions: []
    - id: a18
      titre: Références pédagogiques
      contenu:
          - type: liste
            elements:
                - Ministère de l’Éducation nationale – Programme de technologie du cycle 4, BO n°9 du 29 février 2024
                - Éduscol – Ressources d’accompagnement du programme de technologie au cycle 4
          - type: lien
            titre: Ministère de l’Éducation nationale – Programme de technologie du cycle 4, BO n°9 du 29 février 2024
            url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
          - type: lien
            titre: Éduscol – Ressources d’accompagnement du programme de technologie au cycle 4
            url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
introduction:
    - type: paragraphe
      texte: "Problématique : Comment concevoir une solution adaptée lorsqu’il est impossible d’être le meilleur dans tous les domaines ?"
    - type: titre
      texte: Objectifs d’apprentissage
    - type: paragraphe
      texte: "Ce que vous allez apprendre :"
    - type: liste
      elements:
          - Comprendre qu’une solution technique est conçue pour répondre à un besoin précis.
          - Comprendre que les contraintes et les critères ne sont pas les mêmes pour tous les utilisateurs.
          - Comprendre qu’améliorer une caractéristique peut en dégrader une autre.
          - Comprendre qu’une conception technique résulte souvent de compromis.
    - type: paragraphe
      texte: "Ce que vous allez apprendre à faire :"
    - type: liste
      elements:
          - analyser un besoin ;
          - identifier et hiérarchiser des contraintes ;
          - choisir des caractéristiques cohérentes ;
          - justifier plusieurs choix techniques ;
          - identifier les limites de votre propre solution ;
          - réutiliser les méthodes étudiées lors des séances précédentes.
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
