titre: 'Séance 49 : Entraînement au brevet n° 5 : un dossier complet'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Suis-je capable de traiter un dossier complet de type brevet en 30 minutes ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
    - Comprendre et modifier un programme associé à une fonctionnalité d’un objet ou d’un système technique
objectifs:
    connaissances:
        - Un dossier mêle chaîne d’information et d’énergie, algorithme, mesures, protocole et environnement.
    competences:
        - Utiliser les réflexes R1 à R16 ; gérer son temps (R10).
pourquoi:
    - Toute l’année, tu as enrichi tes réflexes.
    - Aujourd’hui, un dossier complet en 30 minutes sur l’arrosage automatique connecté du potager (situation inventée), puis correction.
activites:
    -   id: a01
        titre: Analyser le système (10 minutes)
        consigne: 'Tu vas t’entraîner au brevet sur un dossier complet : l’arrosage automatique connecté du potager du collège (documents 1 et 2, situation inventée). Partie 1 : on attend la fonction de trois constituants et l’algorithme de l’arrosage. Garde 10 minutes pour cette partie.'
        contenu:
            -   type: titre
                texte: Document 1 — L’arrosage connecté du potager du collège (situation inventée)
            -   type: citation
                texte: Un capteur d’humidité planté dans la terre mesure l’humidité (0 = sec, 100 = très humide). Si l’humidité est inférieure à 30 et qu’il ne pleut pas (capteur de pluie), la carte ouvre l’électrovanne pendant 10 minutes. Un panneau solaire charge une batterie qui alimente le système. Toutes les heures, la carte envoie l’humidité par radio à une carte placée dans la salle de technologie.
            -   type: titre
                texte: Document 2 — Mesures d’une semaine
            -   type: tableau
                colonnes:
                    - Jour
                    - Lundi
                    - Mardi
                    - Mercredi
                    - Jeudi
                    - Vendredi
                lignes:
                    -   - Humidité à 8 h
                        - '45'
                        - '32'
                        - '25'
                        - '60'
                        - '28'
                    -   - Pluie ?
                        - Non
                        - Non
                        - Non
                        - Oui
                        - Oui
            -   type: etapes
                elements:
                    - Lis tout le document 1 une première fois, sans répondre.
                    - 'Repère les constituants : capteurs, carte, électrovanne, panneau, batterie.'
                    - Classe-les (chaîne d’information ou d’énergie) et écris l’algorithme.
            -   type: paragraphe
                texte: 'Pourquoi un temps par partie ? Au brevet, on gère son temps (R10) : 10 minutes par partie évitent de bloquer sur une question.'
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, écris la chaîne et la fonction de chaque constituant de l’arrosage connecté.
                colonnes:
                    - Constituant
                    - Chaîne et fonction
                lignes:
                    -   - Capteur d’humidité
                        - ''
                    -   - Électrovanne
                        - ''
                    -   - Panneau solaire
                        - ''
                aide: Ligne × colonne.
            -   id: q02
                type: texte
                enonce: D’après le document 1, écris l’algorithme de l’arrosage en langage naturel (R12).
                aide: « D’après le document… » (réflexe n° 2).
    -   id: a02
        titre: Exploiter les mesures (10 minutes)
        transition: Tu as compris le système. Utilise maintenant les mesures.
        consigne: 'Partie 2 du dossier : tu vas utiliser les mesures d’une semaine (document 2) et l’algorithme de la partie 1 pour savoir quand l’arrosage se déclenche. On attend des réponses qui citent les valeurs. Garde 10 minutes.'
        contenu:
            -   type: etapes
                elements:
                    - Lis le document 2, jour par jour.
                    - 'Pour chaque jour, vérifie les deux conditions : humidité < 30 ? pas de pluie ?'
                    - Écris ta réponse en citant les valeurs.
            -   type: paragraphe
                texte: 'Pourquoi vérifier les deux conditions ? Avec un ET, il faut que les deux soient vraies : une seule ne suffit pas.'
        questions:
            -   id: q01
                type: qcm
                enonce: D’après les documents 1 et 2, quel jour l’arrosage du potager se déclenche-t-il ?
                choix:
                    -   id: a
                        texte: Mercredi seulement.
                    -   id: b
                        texte: Mercredi et vendredi.
                    -   id: c
                        texte: Mardi.
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: nombre
                enonce: La carte du potager envoie l’humidité toutes les heures. Combien de messages envoie-t-elle en une journée ?
                unite: messages
                aide: N’oublie pas l’unité (réflexe n° 5).
    -   id: a03
        titre: Protocole et environnement (10 minutes)
        transition: Il reste la dernière partie du dossier.
        consigne: 'Partie 3 du dossier : tu vas proposer un protocole pour vérifier le capteur d’humidité, puis comparer l’arrosage connecté à un arrosage à heure fixe. On attend un protocole en trois points et un avantage justifié. Garde du temps pour relire.'
        contenu:
            -   type: etapes
                elements:
                    - 'Écris un protocole pour vérifier le capteur d’humidité (R15) : je change, je mesure, je garde identique.'
                    - Compare avec un arrosage à heure fixe et justifie avec « car » (R4).
                    - Relis toutes tes réponses (R16).
            -   type: paragraphe
                texte: 'Pourquoi relire ? Les dernières minutes servent à vérifier les unités et les justifications : ce sont des points faciles à gagner.'
        questions:
            -   id: q01
                type: texte
                enonce: Propose un protocole pour vérifier que le capteur d’humidité du potager donne des mesures fiables (R15).
                aide: Attendu ou observé ?
            -   id: q02
                type: texte
                enonce: Donne un avantage pour l’environnement de l’arrosage connecté par rapport à un arrosage à heure fixe. Justifie avec « car » (R4).
                aide: Pense à « car » (réflexe n° 4).
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le potager reçoit aussi un capteur de température.
        questions:
            -   id: q01
                type: texte
                enonce: Ajoute une condition à l’algorithme pour ne pas arroser s’il gèle.
                aide: Bloc par bloc (réflexe n° 9).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Le temps est écoulé. Fais le point.
        questions:
            -   id: q01
                type: texte
                enonce: Quel réflexe de 4e (R11 à R16) t’a été le plus utile dans le dossier de l’arrosage ? Donne un exemple de ta copie, puis dis comment tu as réparti tes 30 minutes.
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - Gérer son temps (R10) et utiliser tous les réflexes R1 à R16.
sources:
