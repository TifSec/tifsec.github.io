titre: 'Séance 49 : Entraînement au brevet n° 5 : un dossier complet'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Suis-je capable de traiter un dossier complet de type brevet en 30 minutes ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
    - Comprendre et modifier un programme associé à une fonctionnalité d’un objet ou d’un système technique
objectifs:
    connaissances:
        - Un dossier mêle évolution, chaîne d’information et d’énergie, réseau, programme, mesures.
    competences:
        - Utiliser les réflexes R1 à R16 ; gérer son temps (R10).
pourquoi:
    - Toute l’année, tu as enrichi tes réflexes.
    - Aujourd’hui, un dossier complet en 30 minutes sur un arrosage automatique connecté (situation inventée), puis correction.
activites:
    -   id: a01
        titre: Le dossier (30 minutes)
        contenu:
            -   type: titre
                texte: Document 1 — L’arrosage connecté du potager du collège
            -   type: citation
                texte: Un capteur d’humidité planté dans la terre mesure l’humidité (0 = sec, 100 = très humide). Si l’humidité est inférieure à 30 et qu’il ne pleut pas (capteur de pluie), la carte ouvre l’électrovanne pendant 10 minutes. Un panneau solaire charge une batterie qui alimente le système. Toutes les heures, la carte envoie l’humidité par radio à une carte placée dans la salle de technologie.
            -   type: titre
                texte: Document 2 — Mesures d’une semaine
            -   type: tableau
                colonnes:
                    - Jour
                    - Lundi
                    - Mardi
                    - Mercredi
                    - Jeudi
                    - Vendredi
                lignes:
                    -   - Humidité à 8 h
                        - '45'
                        - '32'
                        - '25'
                        - '60'
                        - '28'
                    -   - Pluie ?
                        - Non
                        - Non
                        - Non
                        - Oui
                        - Oui
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, classe chaque constituant.
                colonnes:
                    - Constituant
                    - Chaîne et fonction
                lignes:
                    -   - Capteur d’humidité
                        - ''
                    -   - Électrovanne
                        - ''
                    -   - Panneau solaire
                        - ''
                aide: Ligne × colonne.
            -   id: q02
                type: texte
                enonce: Écris l’algorithme de l’arrosage en langage naturel (R12).
                aide: Combien d’éléments sont demandés ?
            -   id: q03
                type: qcm
                enonce: D’après les documents 1 et 2, quel jour l’arrosage se déclenche-t-il ?
                choix:
                    -   id: a
                        texte: Mercredi seulement.
                    -   id: b
                        texte: Mercredi et vendredi.
                    -   id: c
                        texte: Mardi.
                aide: Relis l’exemple expliqué.
            -   id: q04
                type: texte
                enonce: Propose un protocole pour vérifier que le capteur d’humidité donne des mesures fiables (R15).
                aide: Attendu ou observé ?
            -   id: q05
                type: texte
                enonce: Donne un avantage pour l’environnement de ce système par rapport à un arrosage à heure fixe. Justifie (R4).
                aide: Pense à « car » (réflexe n° 4).
    -   id: a02
        titre: Correction et bilan
        transition: Le temps est écoulé. Corrigeons.
        contenu:
            -   type: paragraphe
                texte: Correction collective.
        questions:
            -   id: q01
                type: texte
                enonce: Comment as-tu réparti tes 30 minutes ? Que changerais-tu ?
                aide: Repère le verbe de la question.
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: L’humidité est envoyée toutes les heures.
        questions:
            -   id: q01
                type: texte
                enonce: Combien de messages en une semaine ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Fais le point.
        questions:
            -   id: q01
                type: texte
                enonce: Quel réflexe de 4e (R11 à R16) t’a été le plus utile aujourd’hui ? Donne un exemple de ta copie.
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - Gérer son temps (R10) et utiliser tous les réflexes R1 à R16.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
