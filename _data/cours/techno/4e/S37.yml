titre: "Comment choisir parmi plusieurs idées ?"
theme: "Concevoir une amélioration"
problematique: "Comment choisir parmi plusieurs idées ?"
pourquoi: "Une solution se compare aux critères du besoin, pas seulement à son apparence."
application: "Comparer plusieurs idées aide à choisir une solution adaptée aux utilisateurs."
lien_precedent: "Après Quel besoin faut-il résoudre et comment reconnaître une réussite ?, une nouvelle mission t’aide à réutiliser tes méthodes."
prerequis:
    - "Tu peux relire la séance précédente (Quel besoin faut-il résoudre et comment reconnaître une réussite ?) si nécessaire."
notions:
    - titre: "Un exemple expliqué"
      texte: "Pour une alerte, je compare voyant et message selon visibilité, simplicité et accessibilité. Je choisis d’après les critères fournis."
objectifs:
    connaissances:
        - "Une solution se compare aux critères du besoin, pas seulement à son apparence."
    competences:
        - "Dessiner deux idées puis remplir un tableau de comparaison selon les critères."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Une solution se compare aux critères du besoin, pas seulement à son apparence."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Dessiner deux idées puis remplir un tableau de comparaison selon les critères."
    - type: paragraphe
      texte: "Dans la vie réelle : Comparer plusieurs idées aide à choisir une solution adaptée aux utilisateurs."
activites:
    - id: a01
      titre: "1. Comprendre la mission"
      pourquoi: "On commence par un exemple guidé : il montre une méthode avant que tu l’essaies."
      demarche:
          - Lis la situation.
          - Suis les étapes de l’exemple.
          - Repère la donnée qui aide à répondre.
      contenu:
          - type: paragraphe
            texte: "Pour une alerte, je compare voyant et message selon visibilité, simplicité et accessibilité. Je choisis d’après les critères fournis."
      questions:
          - id: q01
            type: texte
            enonce: "Quel critère permet de comparer les deux solutions ?"
            aide: "Relis l’exemple et repère l’information qui répond à la question."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
            aide: "Une ou deux phrases suffisent."
    - id: a02
      titre: "2. À toi d’essayer"
      pourquoi: "Tu as vu la méthode ; maintenant, applique-la dans une tâche que tu peux vérifier."
      demarche:
          - Réalise les étapes dans l’ordre.
          - Note le résultat attendu.
          - Compare-le au résultat observé.
      consigne: "Dessiner deux idées puis remplir un tableau de comparaison selon les critères."
      questions:
          - id: q01
            type: texte
            enonce: "Quel résultat observes-tu ? Décris ton essai."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
      ressources:
          - type: lien
            titre: "Éduscol — Technologie au cycle 4"
            url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
    - id: a03
      titre: "3. Réutiliser la méthode"
      pourquoi: "Un nouvel exemple t’aide à voir où cette méthode peut encore servir."
      contenu:
          - type: paragraphe
            texte: "Reprends la méthode avec une nouvelle valeur, un autre document ou une autre situation du dossier."
      questions:
          - id: q01
            type: texte
            enonce: "Quelle information permet de justifier ta conclusion ? Quelle limite reste à vérifier ?"
    - id: a04
      titre: "4. Ce que tu retiens"
      pourquoi: "Tu termines en gardant une idée et une méthode pour la prochaine séance."
      demarche:
          - Relis les deux éléments à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Une solution se compare aux critères du besoin, pas seulement à son apparence."
    - "Pour vérifier, je compare une réponse ou un essai à une donnée précise."
bilan: "Je peux expliquer ce que j’ai appris et montrer une réponse ou un essai comme preuve."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie cycle 4 : cette séance travaille une solution se compare aux critères du besoin, pas seulement à son apparence.. Elle contribue progressivement aux compétences de fin de cycle."
    - type: lien
      titre: "Ministère — Programme de Technologie du cycle 4, BO 2024"
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
    - type: lien
      titre: "Éduscol — Technologie au cycle 4"
      url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
