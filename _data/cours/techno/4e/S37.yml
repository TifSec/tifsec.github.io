titre: 'Séance 37 : Que disent les mesures du capteur à ultrasons ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Comment exploiter les mesures du capteur à ultrasons pour améliorer le programme ?
competences_bo:
    - Comprendre et modifier un programme associé à une fonctionnalité d’un objet ou d’un système technique
objectifs:
    connaissances:
        - Le capteur à ultrasons mesure la distance (cm) entre lui et la cabine.
        - On associe une plage de distances à une position, puis on l’utilise dans des conditions.
    competences:
        - Analyser des relevés.
        - En déduire une modification du programme.
pourquoi:
    - En séance 35, tu as vu que le capteur à ultrasons est relié à P2.
    - Aujourd’hui, tu analyses ce qu’il mesure pendant un trajet.
activites:
    -   id: a01
        titre: Lire les relevés
        consigne: Tu vas lire les mesures du capteur à ultrasons du monte-charge pendant un trajet (document 1). On attend le sens du déplacement de la cabine et un calcul de distance parcourue.
        contenu:
            -   type: tableau
                titre: Document 1 — Distance mesurée pendant un trajet (exemple)
                colonnes:
                    - Temps (s)
                    - '0'
                    - '1'
                    - '2'
                    - '3'
                    - '4'
                    - '5'
                    - '6'
                lignes:
                    -   - Distance (cm)
                        - '4'
                        - '8'
                        - '13'
                        - '18'
                        - '23'
                        - '27'
                        - '28'
            -   type: etapes
                elements:
                    - Lis le document 1.
                    - 'Retiens : le capteur est en haut de la cage.'
                    - Plus la distance est grande, plus la cabine est basse.
                    - Réponds aux questions.
            -   type: paragraphe
                texte: Pourquoi la position du capteur compte-t-elle ? La même valeur ne veut pas dire la même chose selon l’endroit d’où l’on mesure.
        questions:
            -   id: q01
                type: qcm
                enonce: La distance augmente avec le temps. La cabine…
                choix:
                    -   id: a
                        texte: … descend.
                    -   id: b
                        texte: … monte.
                    -   id: c
                        texte: … ne bouge pas.
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: nombre
                enonce: De combien la cabine se déplace-t-elle entre 1 s et 4 s ?
                unite: cm
                aide: N’oublie pas l’unité (réflexe n° 5).
    -   id: a02
        titre: Associer distance et position
        transition: Tu sais lire les relevés. Associe-les à des positions.
        consigne: Tu vas associer les distances mesurées par le capteur aux positions de la cabine (haut, milieu, bas). On attend une plage de distances pour chaque position.
        contenu:
            -   type: paragraphe
                texte: 'Mesures complémentaires : cabine en haut → 4 cm ; au milieu → 16 cm ; en bas → 28 cm.'
            -   type: etapes
                elements:
                    - Lis les mesures complémentaires.
                    - Choisis une limite entre « haut » et « milieu », puis entre « milieu » et « bas ».
                    - Écris les trois plages.
            -   type: paragraphe
                texte: 'Pourquoi des plages ? Une mesure n’est jamais exactement la même : une plage tolère les petites variations.'
        questions:
            -   id: q01
                type: tableau
                enonce: Propose une plage de distances mesurées par le capteur pour chaque position de la cabine.
                colonnes:
                    - Position
                    - Plage (cm)
                lignes:
                    -   - En haut
                        - ''
                    -   - Au milieu
                        - ''
                    -   - En bas
                        - ''
                aide: Attendu ou observé ?
    -   id: a03
        titre: Écrire la modification
        transition: Tu connais les plages. Utilise-les dans le programme.
        consigne: Tu vas écrire la partie du programme qui affiche la position de la cabine à partir de la distance mesurée. On attend une condition SI … SINON SI … SINON en langage naturel.
        contenu:
            -   type: etapes
                elements:
                    - Reprends tes plages.
                    - Écris une condition SI … SINON SI … SINON.
                    - Vérifie avec 5, 16 et 26 cm.
            -   type: paragraphe
                texte: 'Pourquoi « sinon si » ? Il y a trois cas : une seule condition ne suffit pas.'
        questions:
            -   id: q01
                type: texte
                enonce: Écris en langage naturel la partie qui affiche « HAUT », « MILIEU » ou « BAS ».
                aide: Combien d’éléments sont demandés ?
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une mesure à ultrasons peut être fausse (0 ou 400 cm).
        questions:
            -   id: q01
                type: texte
                enonce: Comment ignorer une mesure absurde ?
                aide: Attendu ou observé ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as exploité des mesures. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment exploiter les mesures du capteur pour améliorer le programme ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - Le capteur à ultrasons mesure une distance (cm).
    - Plages → position → conditions.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
