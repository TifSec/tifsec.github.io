titre: 'Séance 34 : Pourquoi mon jeu bugue-t-il ?'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment trouver et corriger un bug dans un programme ?
competences_bo:
    - Valider les solutions techniques par des simulations ou par des protocoles de tests
    - Concevoir, écrire, tester et mettre au point un programme
objectifs:
    connaissances:
        - 'Un bug est une erreur de programme. Pour le trouver : reproduire le bug, isoler la partie en cause, faire une hypothèse, modifier une seule chose, retester.'
        - Faire tester son jeu par un camarade révèle des bugs qu’on ne voit pas soi-même.
    competences:
        - Suivre une méthode de débogage.
        - Faire tester son programme et exploiter les retours.
pourquoi:
    - En séances 31 à 33, tu as programmé ton jeu.
    - Aujourd’hui, tu chasses les bugs. C’est aussi le bilan de la séquence.
activites:
    -   id: a01
        titre: Trois bugs fréquents
        contenu:
            -   type: tableau
                titre: Document 1
                colonnes:
                    - Bug
                    - Cause probable
                lignes:
                    -   - Le score augmente de 2 à chaque fruit
                        - Deux blocs de chevauchement identiques
                    -   - Les fruits ne tombent pas
                        - Vitesse vy à 0 ou bloc « à chaque » absent
                    -   - Le panier sort de l’écran
                        - Option « rester à l’écran » non activée
            -   type: paragraphe
                texte: 'Méthode : 1) reproduire le bug ; 2) chercher le bloc concerné ; 3) une hypothèse ; 4) une seule modification ; 5) retester (réflexe n° 8).'
        questions:
            -   id: q01
                type: qcm
                enonce: Le score augmente de 2 par fruit. Que vérifies-tu en premier ?
                choix:
                    -   id: a
                        texte: S’il y a deux blocs de chevauchement qui ajoutent 1.
                    -   id: b
                        texte: La couleur du panier.
                    -   id: c
                        texte: Le son.
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: texte
                enonce: Explique pourquoi on ne modifie qu’une seule chose avant de retester.
                aide: Attendu ou observé ?
    -   id: a02
        titre: Faire tester
        transition: Tu connais la méthode. Un autre regard aide à trouver les bugs.
        contenu:
            -   type: paragraphe
                texte: Échange ton poste avec un camarade pendant 5 minutes. Il joue et note les bugs. Puis vous corrigez chacun votre jeu.
        questions:
            -   id: q01
                type: tableau
                enonce: Note deux bugs trouvés (par toi ou ton testeur) et leur correction.
                colonnes:
                    - Bug observé
                    - Correction
                lignes:
                    -   - ''
                        - ''
                    -   - ''
                        - ''
                aide: Attendu ou observé ?
        ressources:
            -   type: lien
                titre: MakeCode Arcade (gratuit, dans le navigateur)
                url: https://arcade.makecode.com/
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Certains bugs n’arrivent que rarement.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi un bug rare est-il difficile à corriger ?
                aide: Pense à « car » (réflexe n° 4).
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as débogué ton jeu. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment trouver et corriger un bug dans un programme ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Déboguer : reproduire, isoler, hypothèse, une seule modification, retester.'
    - Faire tester par un autre.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
