titre: 'Séance 34 : Pourquoi mon jeu bugue-t-il ?'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment trouver et corriger un bug dans un programme ?
competences_bo:
    - Valider les solutions techniques par des simulations ou par des protocoles de tests
    - Concevoir, écrire, tester et mettre au point un programme
objectifs:
    connaissances:
        - 'Déboguer : reproduire le bug, isoler la partie en cause, faire une hypothèse, modifier une seule chose, retester.'
        - Faire tester par un autre révèle des bugs qu’on ne voit pas.
    competences:
        - Suivre une méthode de débogage.
        - Faire tester et exploiter les retours.
pourquoi:
    - En séances 31 à 33, tu as programmé ton jeu.
    - Aujourd’hui, tu chasses les bugs. C’est le bilan de la séquence.
activites:
    -   id: a01
        titre: La méthode
        consigne: Tu vas apprendre une méthode pour trouver un bug, à partir de trois bugs fréquents du jeu « Récolte » (document 1). On attend ce que tu vérifies en premier et pourquoi on ne change qu’une chose à la fois.
        contenu:
            -   type: tableau
                titre: Document 1
                colonnes:
                    - Bug
                    - Cause probable
                lignes:
                    -   - Le score augmente de 2
                        - Deux blocs de chevauchement identiques
                    -   - Les fruits ne tombent pas
                        - vy à 0 ou bloc « à chaque » absent
                    -   - Le panier sort de l’écran
                        - « rester à l’écran » non activé
            -   type: liste
                elements:
                    - 1. Reproduire le bug.
                    - 2. Trouver le bloc concerné.
                    - 3. Faire une hypothèse.
                    - 4. Modifier une seule chose.
                    - 5. Retester.
            -   type: etapes
                elements:
                    - 'Lis le document 1 : trois bugs fréquents.'
                    - Lis la méthode en 5 étapes.
                    - Applique-la au premier bug.
            -   type: paragraphe
                texte: Pourquoi une méthode ? Corriger au hasard crée souvent de nouveaux bugs.
        questions:
            -   id: q01
                type: qcm
                enonce: Le score augmente de 2 par fruit. Que vérifies-tu en premier ?
                choix:
                    -   id: a
                        texte: S’il y a deux blocs de chevauchement identiques.
                    -   id: b
                        texte: La couleur du panier.
                    -   id: c
                        texte: Le son.
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: texte
                enonce: Pourquoi ne modifier qu’une seule chose avant de retester ?
                aide: Attendu ou observé ?
    -   id: a02
        titre: Faire tester
        transition: Tu connais la méthode. Un autre regard aide.
        consigne: Tu vas faire tester ton jeu « Récolte » par un camarade, puis corriger les bugs qu’il a trouvés. On attend deux bugs réels et leur correction.
        contenu:
            -   type: etapes
                elements:
                    - Échange ton poste avec un camarade pendant 5 minutes.
                    - Il joue et note les bugs.
                    - Reprends ton poste et corrige avec la méthode.
            -   type: paragraphe
                texte: 'Pourquoi un testeur ? Le programmeur sait comment son jeu « devrait » marcher : il ne pense pas à jouer autrement.'
        questions:
            -   id: q01
                type: tableau
                enonce: Note deux bugs trouvés par ton testeur dans ton jeu « Récolte », et leur correction.
                colonnes:
                    - Bug observé
                    - Correction
                lignes:
                    -   - ''
                        - ''
                    -   - ''
                        - ''
                aide: Attendu ou observé ?
        ressources:
            -   type: lien
                titre: MakeCode Arcade (gratuit, dans le navigateur)
                url: https://arcade.makecode.com/
    -   id: a03
        titre: Vérifier la correction
        transition: Les bugs sont corrigés. Vérifie.
        consigne: Tu vas vérifier que tes corrections n’ont rien cassé d’autre dans ton jeu. On attend la description de ta vérification.
        contenu:
            -   type: etapes
                elements:
                    - Rejoue la situation qui provoquait le bug.
                    - Vérifie que le bug a disparu.
                    - Vérifie que le reste du jeu marche encore.
            -   type: paragraphe
                texte: 'Pourquoi revérifier tout le jeu ? Une correction peut casser autre chose : c’est pour ça qu’on reteste.'
        questions:
            -   id: q01
                type: texte
                enonce: Comment as-tu vérifié que ta correction n’a rien cassé d’autre ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Certains bugs n’arrivent que rarement.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi un bug rare est-il difficile à corriger ?
                aide: Pense à « car » (réflexe n° 4).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as débogué ton jeu. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment trouver et corriger un bug ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Déboguer : reproduire, isoler, hypothèse, une modification, retester.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
