titre: "Comment présenter un résultat avec une preuve et une consigne ?"
theme: "Mesurer et communiquer autour de l’eau"
problematique: "Comment présenter un résultat avec une preuve et une consigne ?"
pourquoi: "Une présentation montre une donnée, une conclusion, une limite et une source."
application: "Suivre une réserve d’eau aide à éviter le débordement et à mieux gérer son usage."
lien_precedent: "Après Comment présenter les limites d’un procédé ?, une nouvelle mission t’aide à réutiliser tes méthodes."
prerequis:
    - "Tu peux relire la séance précédente (Comment présenter les limites d’un procédé ?) si nécessaire."
notions:
    - titre: "Un exemple expliqué"
      texte: "Une diapositive montre le niveau mesuré, un graphique titré et la consigne « eau non potable — ne pas boire »."
objectifs:
    connaissances:
        - "Une présentation montre une donnée, une conclusion, une limite et une source."
    competences:
        - "Créer une présentation courte dans PowerPoint ou Impress : résultat, preuve, limite et consigne."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Une présentation montre une donnée, une conclusion, une limite et une source."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Créer une présentation courte dans PowerPoint ou Impress : résultat, preuve, limite et consigne."
    - type: paragraphe
      texte: "Dans la vie réelle : Suivre une réserve d’eau aide à éviter le débordement et à mieux gérer son usage."
activites:
    - id: a01
      titre: "1. Comprendre la mission"
      pourquoi: "On commence par un exemple guidé : il montre une méthode avant que tu l’essaies."
      demarche:
          - Lis la situation.
          - Suis les étapes de l’exemple.
          - Repère la donnée qui aide à répondre.
      contenu:
          - type: paragraphe
            texte: "Une diapositive montre le niveau mesuré, un graphique titré et la consigne « eau non potable — ne pas boire »."
      questions:
          - id: q01
            type: texte
            enonce: "Quelle donnée affiches-tu comme preuve et quelle consigne doit rester visible ?"
            aide: "Relis l’exemple et repère l’information qui répond à la question."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
            aide: "Une ou deux phrases suffisent."
    - id: a02
      titre: "2. À toi d’essayer"
      pourquoi: "Tu as vu la méthode ; maintenant, applique-la dans une tâche que tu peux vérifier."
      demarche:
          - Réalise les étapes dans l’ordre.
          - Note le résultat attendu.
          - Compare-le au résultat observé.
      consigne: "Créer une présentation courte dans PowerPoint ou Impress : résultat, preuve, limite et consigne."
      questions:
          - id: q01
            type: texte
            enonce: "Quel résultat observes-tu ? Décris ton essai."
          - id: q02
            type: texte
            enonce: "Explique ta réponse en citant une donnée ou un indice du cours."
      ressources:
          - type: lien
            titre: "LibreOffice Impress — aide"
            url: https://help.libreoffice.org/latest/fr/text/simpress/main0000.html
    - id: a03
      titre: "3. Réutiliser la méthode"
      pourquoi: "Un nouvel exemple t’aide à voir où cette méthode peut encore servir."
      contenu:
          - type: paragraphe
            texte: "Reprends la méthode avec une nouvelle valeur, un autre document ou une autre situation du dossier."
      questions:
          - id: q01
            type: texte
            enonce: "Quelle information permet de justifier ta conclusion ? Quelle limite reste à vérifier ?"
    - id: a04
      titre: "4. Ce que tu retiens"
      pourquoi: "Tu termines en gardant une idée et une méthode pour la prochaine séance."
      demarche:
          - Relis les deux éléments à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Une présentation montre une donnée, une conclusion, une limite et une source."
    - "Pour vérifier, je compare une réponse ou un essai à une donnée précise."
bilan: "Je peux expliquer ce que j’ai appris et montrer une réponse ou un essai comme preuve."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie cycle 4 : cette séance travaille une présentation montre une donnée, une conclusion, une limite et une source.. Elle contribue progressivement aux compétences de fin de cycle."
    - type: lien
      titre: "Ministère — Programme de Technologie du cycle 4, BO 2024"
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
    - type: lien
      titre: "LibreOffice Impress — aide"
      url: https://help.libreoffice.org/latest/fr/text/simpress/main0000.html
