titre: 'Séance 50 : Mon bilan de 4e'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Qu’ai-je appris en 4e, et que dois-je travailler avant la 3e ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
objectifs:
    connaissances:
        - 'En 4e : évolution des objets, numérique responsable, réseau, énergie et mesures, CAO, algorithmes et programmes, objet communicant.'
    competences:
        - Faire le bilan de ses apprentissages.
        - Reprendre une difficulté.
pourquoi:
    - Depuis la séance 1, tu as identifié, choisi, proposé, complété et ajouté une fonction à un objet.
    - Aujourd’hui, bilan, reprise d’une difficulté, et on joue aux jeux Arcade des autres.
activites:
    -   id: a01
        titre: Ce que je sais faire
        consigne: Tu vas faire le bilan de ton année de 4e en technologie, à partir de la liste des séances du site. On attend trois savoir-faire nouveaux, chacun avec un exemple précis de séance.
        contenu:
            -   type: etapes
                elements:
                    - Feuillette la liste des séances de 4e sur le site.
                    - Choisis trois choses que tu ne savais pas faire en septembre.
                    - Pour chacune, retrouve un exemple précis (séance, objet, résultat).
            -   type: paragraphe
                texte: Pourquoi un exemple ? « Je sais programmer » est vague ; « j’ai ajouté l’envoi radio au tracker en séance 44 » prouve ce que tu sais faire.
        questions:
            -   id: q01
                type: texte
                enonce: Cite trois choses que tu sais faire en technologie à la fin de la 4e (et pas en septembre), avec un exemple de séance pour chacune.
                aide: Combien d’éléments sont demandés ?
            -   id: q02
                type: qcm
                enonce: 'Quel réflexe brevet dit : « J’écris ce que je change, ce que je mesure, ce que je garde identique » ?'
                choix:
                    -   id: a
                        texte: R15
                    -   id: b
                        texte: R11
                    -   id: c
                        texte: R13
                aide: Relis l’exemple expliqué.
    -   id: a02
        titre: Reprendre une difficulté
        transition: Tu as fait le bilan. Reprends une difficulté.
        consigne: Tu vas reprendre seul une notion de 4e qui t’a posé problème, en relisant sa séance sur le site. On attend le nom de la notion, une explication avec tes mots et un exemple.
        contenu:
            -   type: etapes
                elements:
                    - Choisis une notion qui t’a posé problème (réseau, protocole, programme, Calc…).
                    - Relis la séance correspondante sur le site, en particulier « Ce que je retiens ».
                    - Refais une question de cette séance sans regarder ta première réponse.
            -   type: paragraphe
                texte: 'Pourquoi reprendre une difficulté ? En 3e, tout revient au brevet : mieux vaut la régler maintenant.'
        questions:
            -   id: q01
                type: texte
                enonce: Quelle notion de 4e as-tu reprise ? Explique-la avec tes mots et un exemple.
                aide: Pense à « car » (réflexe n° 4).
    -   id: a03
        titre: Échanger nos jeux
        transition: La difficulté est reprise. Place au jeu !
        consigne: Tu vas tester le jeu « Récolte » programmé par un camarade (séances 31 à 34). On attend une réussite et une amélioration précise.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre ton jeu « Récolte » (séances 31 à 34) dans MakeCode Arcade.
                    - Échange de poste avec un camarade et joue à son jeu.
                    - Note une réussite et une idée d’amélioration.
            -   type: paragraphe
                texte: Pourquoi jouer au jeu d’un autre ? Tu vois d’autres façons de programmer la même chose.
        questions:
            -   id: q01
                type: texte
                enonce: Dans le jeu « Récolte » de ton camarade, qu’as-tu trouvé de réussi, et quelle amélioration lui proposes-tu ?
                aide: Ton idée répond-elle au besoin ?
        ressources:
            -   type: lien
                titre: MakeCode Arcade (gratuit, dans le navigateur)
                url: https://arcade.makecode.com/
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: En 3e, tu prépareras le brevet.
        questions:
            -   id: q01
                type: texte
                enonce: Quel réflexe veux-tu améliorer en premier, et comment ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Fais ton bilan.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : qu’as-tu appris en 4e, et que dois-tu travailler avant la 3e ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Faire le bilan : nommer ses savoir-faire avec des exemples ; reprendre une difficulté.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
