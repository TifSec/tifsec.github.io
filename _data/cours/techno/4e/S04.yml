titre: 'Séance 4 : Pourquoi a-t-on changé cet objet ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Comment l’évolution des besoins des utilisateurs fait-elle évoluer un objet ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
    - Décrire les interactions entre un objet ou un système technique, son environnement et les utilisateurs
objectifs:
    connaissances:
        - Un objet évolue quand les besoins changent (sécurité, confort, économie d’énergie), quand une nouvelle technique apparaît, ou quand une règle change.
        - On justifie une évolution en reliant une modification de l’objet à un besoin.
    competences:
        - Relier une évolution d’un objet à un besoin.
        - Justifier avec un fait.
pourquoi:
    - En séance 3, tu as étudié l’évolution du téléphone.
    - 'Aujourd’hui, tu cherches pourquoi on a changé des objets du collège : la clé, la lampe de la salle, la cantine.'
activites:
    -   id: a01
        titre: Trois objets du collège
        contenu:
            -   type: tableau
                titre: Document 1 — Des évolutions au collège
                colonnes:
                    - Avant
                    - Aujourd’hui
                    - Besoin qui a changé
                lignes:
                    -   - Clé en métal
                        - Badge électronique
                        - 'Sécurité : on peut désactiver un badge perdu.'
                    -   - Tube fluorescent
                        - Dalle LED
                        - Économie d’énergie et durée de vie.
                    -   - Ticket de cantine en papier
                        - Passage de la carte au lecteur
                        - Gain de temps et suivi des repas.
            -   type: paragraphe
                texte: 'Exemple expliqué : on a remplacé la clé par un badge. Si une clé est perdue, il faut changer la serrure ; un badge perdu se désactive en un clic. Le besoin de sécurité explique le changement.'
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, écris le besoin qui explique chaque évolution.
                colonnes:
                    - Évolution
                    - Besoin
                lignes:
                    -   - Clé → badge
                        - ''
                    -   - Tube → LED
                        - ''
                    -   - Ticket → carte
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
    -   id: a02
        titre: Le monte-charge a-t-il évolué ?
        transition: Les objets du collège ont changé pour répondre à des besoins. Le monte-charge aussi.
        contenu:
            -   type: paragraphe
                texte: Les monte-charges anciens se commandaient avec un levier. Celui du collège a des boutons, des capteurs, un écran et un programme.
        questions:
            -   id: q01
                type: texte
                enonce: Donne deux améliorations du monte-charge du collège par rapport à un monte-charge à levier, et le besoin de chacune.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
            -   id: q02
                type: qcm
                enonce: Quel besoin explique le capteur à ultrasons du monte-charge ?
                choix:
                    -   id: a
                        texte: Savoir où se trouve la cabine (sécurité, information).
                    -   id: b
                        texte: Rendre la cabine plus jolie.
                    -   id: c
                        texte: Faire du bruit.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a03
        titre: À toi d’enquêter
        transition: Tu sais relier une évolution à un besoin. Applique-le à un objet que tu connais.
        questions:
            -   id: q01
                type: texte
                enonce: Choisis un objet de ta maison qui a changé depuis l’enfance de tes parents. Décris l’évolution et le besoin qui l’explique.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: 'Certaines évolutions viennent de la loi : par exemple, les ampoules à filament ont été retirées de la vente.'
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi une loi peut-elle faire évoluer un objet ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as relié des évolutions à des besoins. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment l’évolution des besoins fait-elle évoluer un objet ? Donne un exemple.'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Un objet évolue quand les besoins changent, quand une technique nouvelle apparaît ou quand la loi change.
    - 'Justifier une évolution : modification de l’objet + besoin.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
