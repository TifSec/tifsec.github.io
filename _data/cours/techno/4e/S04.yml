            suite:
                - type: paragraphe
                  texte: Justifiez brièvement chaque réponse.
    - id: a10
      titre: 6. Pourquoi les objets évoluent-ils ?
      contenu:
          - type: paragraphe
            texte: Les évolutions ne viennent pas toutes de la même cause.
          - type: paragraphe
            texte: "Classez les éléments suivants dans deux catégories :"
          - type: liste
            elements:
                - batteries plus performantes ;
                - utilisateurs souhaitant gagner du temps ;
                - capteurs plus performants ;
                - recherche d’un meilleur confort ;
                - moteurs plus petits ;
                - développement des objets connectés ;
                - évolution des habitudes de vie ;
                - préoccupations liées à l’énergie, à la réparation ou aux déchets.
          - type: paragraphe
            texte: "Créez deux catégories :"
          - type: liste
            elements:
                - Évolution des technologies
                - Évolution des besoins, usages ou contraintes
          - type: paragraphe
            texte: Si un élément peut appartenir aux deux catégories, expliquez votre choix.
      questions: []
    - id: a11
      titre: 7. Ajouter une illustration réellement utile
      contenu:
          - type: paragraphe
            texte: Choisissez une étape importante de votre chronologie et ajoutez dans votre document une image provenant de l’une des sources utilisées dans la séance.
          - type: paragraphe
            texte: "L’image doit :"
          - type: liste
            elements:
                - illustrer une évolution technique précise ;
                - être placée près du texte correspondant ;
                - posséder une courte légende ;
                - indiquer le nom de la source ;
                - ne pas remplacer votre explication écrite.
          - type: paragraphe
            texte: "Exemple de légende :"
          - type: paragraphe
            texte: "Roomba i7+ présenté en 2018 : la station permet au robot de vider automatiquement son bac. Source : iRobot."
      questions: []
    - id: a12
      titre: 8. Mettons des mots sur ce que nous avons découvert
      contenu:
          - type: paragraphe
            texte: Une famille d’objets techniques peut évoluer pendant de nombreuses années.
          - type: paragraphe
            texte: "Ces évolutions peuvent être provoquées par :"
          - type: liste
            elements:
                - de nouvelles technologies ;
                - l’évolution des besoins des utilisateurs ;
                - de nouveaux usages ;
                - de nouvelles contraintes ;
                - la recherche de meilleures performances ;
                - des préoccupations économiques ou environnementales.
          - type: paragraphe
            texte: Une innovation correspond ici à l’apparition ou à l’amélioration d’une solution permettant de répondre différemment à un besoin ou à une contrainte.
          - type: paragraphe
            texte: "Une nouvelle solution ne remplace pas forcément les anciennes : plusieurs générations d’un même objet peuvent rester utiles dans des situations différentes."
      questions: []
    - id: a13
      titre: "9. Réinvestir : quelle pourrait être la prochaine évolution ?"
      contenu:
          - type: paragraphe
            texte: Identifiez d’abord une limite actuelle des appareils de nettoyage.
          - type: paragraphe
            texte: Imaginez ensuite une évolution plausible permettant de réduire cette limite.
          - type: paragraphe
            texte: "Présentez votre idée :"
          - type: liste
            elements:
                - "Problème ou besoin : ..."
                - "Évolution proposée : ..."
                - "Technologie ou principe utilisé : ..."
                - "Avantage attendu : ..."
                - "Nouvelle contrainte possible : ..."
      questions: []
    - id: a14
      titre: 10. Conclusion
      contenu:
          - type: paragraphe
            texte: "Rédigez quelques phrases pour répondre à la problématique :"
          - type: paragraphe
            texte: Pourquoi les aspirateurs ont-ils autant évolué alors que les anciennes solutions fonctionnent encore ?
          - type: paragraphe
            texte: "Votre conclusion doit expliquer :"
          - type: liste
            elements:
                - au moins deux causes possibles d’évolution ;
                - un exemple d’évolution technologique ;
                - un exemple lié à l’évolution des usages ou des besoins ;
                - pourquoi une innovation peut aussi créer une nouvelle contrainte.
      questions: []
    - id: a15
      titre: 11. Rendu de fin de séance
      contenu:
          - type: paragraphe
            texte: À la fin du cours, votre fichier doit être rendu, même s’il n’est pas terminé.
          - type: paragraphe
            texte: "Déposez :"
          - type: paragraphe
            texte: 4e_S4_nom.odt
          - type: paragraphe
            texte: "Avant de le rendre, vérifiez :"
          - type: liste
            elements:
                - votre nom, la date et le titre ;
                - votre chronologie ;
                - vos sources ;
                - vos justifications ;
                - la légende de votre illustration ;
                - votre conclusion ;
                - que votre document est plus organisé que lors des séances précédentes.
      questions: []
