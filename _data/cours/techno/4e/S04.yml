titre: Pourquoi les aspirateurs ont-ils autant évolué ?
theme: "Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et à analyser"
problematique: Pourquoi les aspirateurs ont-ils autant évolué ?
pourquoi: "Nous avons déjà étudié plusieurs solutions permettant de nettoyer un sol :"
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Comprendre qu’une famille d’objets peut évoluer sur une longue période.
        - Comprendre qu’une évolution peut répondre à un besoin, réduire une contrainte ou exploiter une nouvelle technologie.
        - Comprendre qu’une innovation peut apporter un avantage tout en créant de nouvelles contraintes.
    competences:
        - rechercher une information précise dans une source fiable ;
        - construire une chronologie simple ;
        - relier une évolution technique à un problème ou à un besoin ;
        - distinguer évolution des technologies et évolution des usages ;
        - présenter des informations de manière plus organisée dans un document numérique.
activites:
    - id: a02
      titre: Compétence visée
      contenu:
          - type: paragraphe
            texte: Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques.
      questions: []
    - id: a04
      titre: Production attendue
      contenu:
          - type: paragraphe
            texte: Vous devez produire un document LibreOffice Writer contenant vos premières hypothèses, une chronologie commentée, une analyse des causes d’évolution, une illustration utile et une conclusion.
      questions: []
    - id: a05
      titre: 1. Créer votre document de travail
      contenu:
          - type: paragraphe
            texte: "Créez dès maintenant un document LibreOffice Writer nommé :"
          - type: paragraphe
            texte: 4e_S4_nom.odt
          - type: paragraphe
            texte: Remplacez nom par votre nom.
          - type: paragraphe
            texte: "Indiquez dans votre document :"
          - type: liste
            elements:
                - votre nom et votre prénom ;
                - la date ;
                - "le titre : Séance 4 : Pourquoi les aspirateurs ont-ils autant évolué ?"
          - type: paragraphe
            texte: Cette fois, essayez de rendre votre document plus facile à lire que lors des séances précédentes en utilisant des titres, un tableau clair et une organisation logique.
          - type: paragraphe
            texte: Le fichier devra être rendu en fin d’heure, même s’il n’est pas terminé.
      questions: []
    - id: a06
      titre: 2. Pourquoi changer un objet qui fonctionne déjà ?
      contenu:
          - type: paragraphe
            texte: "Nous avons déjà étudié plusieurs solutions permettant de nettoyer un sol :"
          - type: liste
            elements:
                - le balai ;
                - l’aspirateur traîneau ;
                - l’aspirateur sans fil ;
                - le robot aspirateur.
          - type: paragraphe
            texte: Ces solutions existent encore aujourd’hui.
          - type: paragraphe
            texte: "Sans rechercher sur Internet, répondez :"
      questions:
          - id: q01
            type: texte
            enonce: Pourquoi inventer de nouveaux aspirateurs alors que les anciens modèles fonctionnent toujours ?
            suite: []
          - id: q02
            type: texte
            enonce: Citez trois améliorations qui ont pu être recherchées au cours du temps.
            suite: []
          - id: q03
            type: texte
            enonce: Selon vous, quelle évolution a le plus modifié le travail de l’utilisateur ? Justifiez.
            suite:
                - type: titre
                  texte: Besoin d’un indice ?
                - type: liste
                  elements:
                      - Pensez à l’effort demandé.
                      - Pensez au fil électrique.
                      - Pensez au temps consacré au nettoyage.
                      - Pensez à l’entretien de l’appareil.
                      - Pensez à ce que l’appareil peut faire automatiquement.
    - id: a07
      titre: 3. Retrouver quelques grandes étapes
      contenu:
          - type: paragraphe
            texte: Vous allez maintenant construire une chronologie de l’évolution des appareils de nettoyage.
          - type: titre
            texte: Premiers aspirateurs motorisés
          - type: paragraphe
            texte: Consultez Science Museum Group – Original vacuum cleaner .
          - type: lien
            titre: Science Museum Group – Original vacuum cleaner
            url: https://collection.sciencemuseumgroup.org.uk/objects/co48604/original-vacuum-cleaner-from-to-royal-naval-college-vacuum-cleaner
          - type: paragraphe
            texte: "Relevez :"
          - type: liste
            elements:
                - la période d’apparition ;
                - le principe utilisé ;
                - une limite importante de cette première solution.
          - type: paragraphe
            texte: Vous pouvez aussi consulter Smithsonian – Hoover Upright Vacuum Cleaner pour observer l’évolution vers un appareil électrique domestique plus pratique.
          - type: lien
            titre: Smithsonian – Hoover Upright Vacuum Cleaner
            url: https://americanhistory.si.edu/collections/object/nmah_704090
          - type: titre
            texte: Aspirateur sans sac
          - type: paragraphe
            texte: Consultez Dyson – Évolution des aspirateurs cycloniques .
          - type: lien
            titre: Dyson – Évolution des aspirateurs cycloniques
            url: https://www.dyson.com/discover/innovation/behind-the-invention/dyson-colors-materials-finishes
          - type: paragraphe
            texte: "Relevez :"
          - type: liste
            elements:
                - la période d’apparition du premier modèle Dyson sans sac ;
                - la technologie utilisée ;
                - le problème que cette évolution cherche à réduire.
          - type: titre
            texte: Robot aspirateur
          - type: paragraphe
            texte: Consultez iRobot – Présentation du premier Roomba en 2002 .
          - type: lien
            titre: iRobot – Présentation du premier Roomba en 2002
            url: https://media.irobot.com/2002-09-18-iRobot-Introduces-Roomba-Intelligent-FloorVac-The-First-Automatic-Floor-Cleaner-In-The-U-S
          - type: paragraphe
            texte: "Relevez :"
          - type: liste
            elements:
                - l’année de lancement ;
                - ce que l’appareil réalise automatiquement ;
                - l’avantage recherché pour l’utilisateur.
          - type: titre
            texte: Robot avec station automatique
          - type: paragraphe
            texte: Consultez iRobot – Roomba i7+ avec vidange automatique, 2018 .
          - type: lien
            titre: iRobot – Roomba i7+ avec vidange automatique, 2018
            url: https://media.irobot.com/2018-09-06-a-href-https-www-multivu-com-players-English-8234051-irobot-roomba-i7-plus-New-iRobot-R-Roomba-R-i7-Robot-Vacuum-Learns-a-Homes-Floor-Plan-and-Empties-Itself-a
          - type: paragraphe
            texte: "Relevez :"
          - type: liste
            elements:
                - l’année ;
                - la nouvelle tâche automatisée ;
                - ce que cela change pour l’utilisateur.
      questions: []
    - id: a08
      titre: 4. Construire la chronologie
      contenu:
          - type: paragraphe
            texte: "À partir des informations trouvées, créez dans votre document le tableau suivant :"
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Solution
                - Période
