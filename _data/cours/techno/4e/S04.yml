titre: 'Séance 4 : Pourquoi a-t-on changé cet objet ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Comment l’évolution des besoins des utilisateurs fait-elle évoluer un objet ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
    - Décrire les interactions entre un objet ou un système technique, son environnement et les utilisateurs
objectifs:
    connaissances:
        - Un objet évolue quand les besoins changent (sécurité, confort, économie d’énergie), quand une technique nouvelle apparaît, ou quand une règle change.
        - On justifie une évolution en reliant une modification de l’objet à un besoin.
    competences:
        - Relier une évolution d’un objet à un besoin.
        - Justifier avec un fait.
pourquoi:
    - En séance 3, tu as étudié l’évolution du téléphone.
    - Aujourd’hui, tu cherches pourquoi on a changé des objets du collège.
activites:
    -   id: a01
        titre: Trois objets du collège
        consigne: Tu vas chercher pourquoi trois objets du collège ont changé, à partir du document 1 (ancien objet / nouvel objet). On attend, pour chaque objet, le besoin qui explique l’évolution.
        contenu:
            -   type: tableau
                titre: Document 1 — Des évolutions au collège
                colonnes:
                    - Avant
                    - Aujourd’hui
                    - Ce qui a changé
                lignes:
                    -   - Clé en métal
                        - Badge électronique
                        - Un badge perdu se désactive en un clic.
                    -   - Tube fluorescent
                        - Dalle LED
                        - Consomme moins et dure plus longtemps.
                    -   - Ticket de cantine en papier
                        - Carte au lecteur
                        - Passage plus rapide, repas comptés automatiquement.
            -   type: etapes
                elements:
                    - Lis le document 1, ligne par ligne.
                    - Pour chaque objet, compare l’ancien et le nouveau.
                    - Trouve le besoin qui explique le changement (sécurité, énergie, temps…).
            -   type: paragraphe
                texte: 'Pourquoi chercher le besoin ? Une évolution n’arrive pas par hasard : elle répond toujours à quelque chose que les utilisateurs voulaient mieux faire.'
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, écris le besoin qui explique chaque évolution.
                colonnes:
                    - Évolution
                    - Besoin
                lignes:
                    -   - Clé → badge
                        - ''
                    -   - Tube → LED
                        - ''
                    -   - Ticket → carte
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
    -   id: a02
        titre: Le monte-charge a évolué
        transition: Les objets du collège ont changé pour répondre à des besoins. Le monte-charge aussi.
        consigne: Tu vas comparer le monte-charge du collège à un ancien monte-charge à levier, décrits ci-dessous. On attend deux améliorations, chacune reliée au besoin auquel elle répond.
        contenu:
            -   type: paragraphe
                texte: 'Monte-charge à levier : on pousse un levier pour monter et on le relâche pour s’arrêter. Monte-charge du collège : boutons à chaque étage, contacts de fin de course, capteur à ultrasons, écran, programme.'
            -   type: etapes
                elements:
                    - Observe les deux descriptions ci-dessous.
                    - Repère deux choses que le monte-charge du collège fait de plus que le monte-charge à levier.
                    - Pour chacune, écris le besoin auquel elle répond.
            -   type: paragraphe
                texte: Pourquoi relier amélioration et besoin ? C’est exactement ce qu’on attend au brevet quand on demande de « justifier une évolution ».
        questions:
            -   id: q01
                type: texte
                enonce: Donne deux améliorations du monte-charge du collège par rapport à un monte-charge à levier, et le besoin de chacune.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
            -   id: q02
                type: qcm
                enonce: Quel besoin explique le capteur à ultrasons du monte-charge ?
                choix:
                    -   id: a
                        texte: Savoir où se trouve la cabine.
                    -   id: b
                        texte: Rendre la cabine plus jolie.
                    -   id: c
                        texte: Faire du bruit.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a03
        titre: Enquête à la maison
        transition: Tu sais relier une évolution à un besoin. Applique-le à un objet que tu connais.
        consigne: Tu vas mener une petite enquête sur un objet de ta maison qui existait déjà quand tes parents étaient enfants. On attend la description de l’ancienne et de la nouvelle version, et le besoin qui explique l’évolution.
        contenu:
            -   type: etapes
                elements:
                    - Choisis un objet de chez toi qui existait déjà quand tes parents étaient enfants.
                    - Décris l’ancienne version et la nouvelle.
                    - Écris le besoin qui explique l’évolution, avec « car ».
            -   type: paragraphe
                texte: Pourquoi un objet de chez toi ? Pour vérifier que tu sais appliquer la méthode seul, sur un exemple qui n’a pas été vu en classe.
        questions:
            -   id: q01
                type: texte
                enonce: Décris l’évolution d’un objet de ta maison et le besoin qui l’explique.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Je m’entraîne
        transition: Tu as compris la méthode. Applique-la seul sur un cas nouveau.
        consigne: 'Tu vas appliquer seul la méthode sur un cas nouveau : les poubelles du collège, décrites ci-dessous. On attend le besoin qui explique le passage au tri, justifié avec « car ».'
        contenu:
            -   type: paragraphe
                texte: Il y a vingt ans, le collège avait une seule poubelle par salle. Aujourd’hui, il y a une poubelle pour le papier et une pour les autres déchets.
            -   type: etapes
                elements:
                    - Lis l’évolution de la poubelle du collège.
                    - Repère ce qui a changé.
                    - Écris le besoin qui l’explique avec « car ».
            -   type: paragraphe
                texte: Pourquoi s’entraîner ? Relier une modification à un besoin est une question classique du brevet.
        questions:
            -   id: q01
                type: texte
                enonce: Quel besoin explique le passage d’une poubelle unique à des poubelles de tri ? Justifie.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a05
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: 'Certaines évolutions viennent de la loi : les ampoules à filament ont été retirées de la vente.'
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi une loi peut-elle faire évoluer un objet ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a06
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as relié des évolutions à des besoins. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment l’évolution des besoins fait-elle évoluer un objet ? Donne un exemple justifié.'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Un objet évolue quand les besoins changent, quand une technique nouvelle apparaît ou quand la loi change.
    - 'Justifier une évolution : modification de l’objet + besoin.'
sources:
