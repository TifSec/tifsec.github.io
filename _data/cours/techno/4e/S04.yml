                - type: paragraphe
                  texte: Pour l’aspirateur sans fil, vous pouvez utiliser vos connaissances ou rechercher une fiche constructeur récente pour identifier ce que la suppression du câble apporte à l’utilisateur.
    - id: a09
      titre: 5. Chaque évolution cherche-t-elle à résoudre un problème ?
      contenu:
          - type: paragraphe
            texte: Observez votre chronologie.
          - type: paragraphe
            texte: Pour chaque transition, identifiez le problème que l’évolution cherche à réduire.
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Évolution
                - Problème ou contrainte réduite
                - Nouvelle contrainte possible
            lignes:
                - - Balai → aspirateur électrique
                  - ""
                  - ""
                - - Aspirateur avec sac → sans sac
