titre: 'Séance 36 : Que fait ce programme, en français ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Comment traduire le programme du monte-charge en algorithme ?
competences_bo:
    - Comprendre et modifier un programme associé à une fonctionnalité d’un objet ou d’un système technique
objectifs:
    connaissances:
        - 'Traduire un programme en algorithme : écrire en langage naturel ce que fait chaque bloc, dans l’ordre, avec QUAND, TANT QUE, SI … ALORS.'
    competences:
        - Traduire un programme en algorithme en langage naturel.
        - Expliquer le rôle d’une boucle « tant que ».
pourquoi:
    - En séance 35, tu as identifié la chaîne d’information. En séance 31, tu as écrit un algorithme avant de programmer.
    - 'Aujourd’hui, tu fais l’inverse : tu pars du programme et tu écris l’algorithme.'
activites:
    -   id: a01
        titre: Le programme
        contenu:
            -   type: code
                texte: "au démarrage\n    voyants orange ; écrire « Attente » ; voyants verts\n\ntoujours\n    si (P13 = 1) ET (P1 appuyé) alors\n        écrire « Appel Etage » ; voyants rouges\n        tant que P0 = 0\n            moteur M1 en avant, vitesse 137\n        arrêter le moteur\n        écrire « Stop Etage » ; voyants verts\n    si (P0 = 1) ET (P15 appuyé) alors\n        écrire « Appel RDC » ; voyants rouges\n        tant que P13 = 0\n            moteur M1 en arrière, vitesse 137\n        arrêter le moteur\n        écrire « Stop RDC » ; voyants verts"
            -   type: paragraphe
                texte: 'Exemple expliqué : « si (P13 = 1) ET (P1 appuyé) » se traduit : SI la cabine est en bas ET qu’on appuie sur le bouton Étage ALORS…'
        questions:
            -   id: q01
                type: texte
                enonce: Traduis la première partie (montée) en algorithme, en langage naturel.
                aide: Repère le verbe de la question.
    -   id: a02
        titre: La boucle « tant que »
        transition: Tu as traduit la montée. Concentre-toi sur la boucle qui fait monter la cabine.
        questions:
            -   id: q01
                type: qcm
                enonce: Que fait la boucle « tant que P0 = 0 » ?
                choix:
                    -   id: a
                        texte: Elle fait tourner le moteur tant que le contact haut n’est pas appuyé.
                    -   id: b
                        texte: Elle répète 0 fois.
                    -   id: c
                        texte: Elle arrête le moteur.
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: texte
                enonce: Quelle est la différence entre « répéter 4 fois » et « tant que » ?
                aide: Repère le verbe de la question.
    -   id: a03
        titre: La descente
        transition: La montée est traduite. À toi pour la descente.
        questions:
            -   id: q01
                type: texte
                enonce: Écris l’algorithme de la descente.
                aide: Combien d’éléments sont demandés ?
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: On appuie sur Étage pendant que la cabine descend.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le programme, que se passe-t-il ? Est-ce un problème ?
                aide: Bloc par bloc (réflexe n° 9).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as traduit le programme. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment traduire le programme en algorithme ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Programme → algorithme : chaque bloc en langage naturel, dans l’ordre.'
    - '« tant que » : répète tant qu’une condition est vraie.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
