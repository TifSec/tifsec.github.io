titre: 'Séance 45 : La liaison radio est-elle fiable ?'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment proposer et mener un protocole pour vérifier la portée de la liaison radio ?
competences_bo:
    - Valider les solutions techniques par des simulations ou par des protocoles de tests
objectifs:
    connaissances:
        - 'Fiabilité d’une liaison : proportion de messages reçus selon la distance et les obstacles.'
        - 'Protocole : je change la distance (ou l’obstacle), je mesure le nombre de messages reçus sur 10 envoyés, je garde le reste identique.'
    competences:
        - Proposer un protocole de test.
        - Vérifier un critère du cahier des charges.
pourquoi:
    - En séance 44, émetteur et récepteur ont fonctionné dans le simulateur.
    - Aujourd’hui, on teste en vrai avec le tracker et la deuxième carte. Le cahier des charges demandait une réception à au moins 10 m.
activites:
    -   id: a01
        titre: Proposer le protocole
        questions:
            -   id: q01
                type: tableau
                enonce: Écris ton protocole.
                colonnes:
                    - Rubrique
                    - Mon protocole
                lignes:
                    -   - Je change
                        - ''
                    -   - Je mesure
                        - ''
                    -   - Je garde identique
                        - ''
                aide: Attendu ou observé ?
    -   id: a02
        titre: Mesures (poste maquette) et exploitation
        transition: La classe applique le protocole retenu.
        contenu:
            -   type: paragraphe
                texte: 'Le professeur téléverse le programme d’un groupe sur le tracker et sur la carte libre. Les mesures sont mises en commun :'
            -   type: tableau
                titre: Document 1 — Exemple de résultats (à remplacer par ceux de la classe)
                colonnes:
                    - Distance
                    - 2 m
                    - 5 m
                    - 10 m
                    - 15 m
                    - 10 m derrière un mur
                lignes:
                    -   - Messages reçus sur 10
                        - '10'
                        - '10'
                        - '9'
                        - '6'
                        - '3'
        questions:
            -   id: q01
                type: nombre
                enonce: D’après le document 1, quel pourcentage de messages est reçu à 10 m ?
                unite: '%'
                aide: N’oublie pas l’unité (réflexe n° 5).
            -   id: q02
                type: texte
                enonce: Le critère « réception à au moins 10 m » est-il respecté ? Justifie, et parle du mur.
                aide: Pense à « car » (réflexe n° 4).
            -   id: q03
                type: qcm
                enonce: Après les tests, que faut-il faire sur le tracker ?
                choix:
                    -   id: a
                        texte: Remettre le programme d’origine (ou garder le nôtre si la classe l’adopte).
                    -   id: b
                        texte: Rien.
                    -   id: c
                        texte: Le démonter.
                aide: Relis l’exemple expliqué.
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Certains messages arrivent mais sont perdus si le récepteur est occupé.
        questions:
            -   id: q01
                type: texte
                enonce: Comment le récepteur pourrait-il signaler qu’il n’a rien reçu depuis 10 s ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: La liaison est testée. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment as-tu vérifié la fiabilité de la liaison, et qu’as-tu conclu ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Fiabilité : messages reçus / messages envoyés, selon distance et obstacles.'
    - On vérifie un critère du cahier des charges par un test.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
