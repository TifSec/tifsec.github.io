titre: 'Séance 9 : Quelles traces je laisse sans le savoir ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Quelles traces laissons-nous en naviguant, et comment les limiter ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
objectifs:
    connaissances:
        - 'Un cookie (témoin de connexion) est un petit fichier déposé par un site pour se souvenir de toi : panier, langue, mais aussi publicité ciblée.'
        - La géolocalisation donne ta position ; des applications l’enregistrent parfois en permanence. On peut refuser les cookies non nécessaires et couper la localisation.
    competences:
        - Expliquer le rôle d’un cookie.
        - Proposer des réglages pour limiter ses traces.
pourquoi:
    - En séance 8, tu as protégé tes comptes.
    - Mais même sans compte, tu laisses des traces. Aujourd’hui, tu enquêtes sur ces traces invisibles.
activites:
    -   id: a01
        titre: Les cookies
        contenu:
            -   type: paragraphe
                texte: 'Exemple expliqué : tu ajoutes des baskets au panier d’un site, tu fermes la page, tu reviens le lendemain : le panier est toujours là. Le site a déposé un cookie sur ton ordinateur pour s’en souvenir.'
            -   type: tableau
                titre: Document 1 — Des exemples de cookies
                colonnes:
                    - Cookie
                    - Sert à…
                    - Nécessaire ?
                lignes:
                    -   - Panier
                        - Retenir les articles choisis
                        - Oui
                    -   - Langue
                        - Afficher le site en français
                        - Oui
                    -   - Publicité
                        - Montrer des publicités selon les sites visités
                        - Non
                    -   - Statistiques
                        - Compter les visites
                        - Non (souvent)
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 1, quel cookie peux-tu refuser sans gêner l’utilisation du site ?
                choix:
                    -   id: a
                        texte: Le cookie de publicité.
                    -   id: b
                        texte: Le cookie du panier.
                    -   id: c
                        texte: Le cookie de langue.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Explique pourquoi tu vois des publicités de baskets après avoir visité un site de chaussures.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a02
        titre: La géolocalisation
        transition: Les cookies ne sont pas les seules traces. Ton téléphone sait aussi où tu es.
        contenu:
            -   type: paragraphe
                texte: Un téléphone connaît sa position grâce au GPS, au Wi-Fi et aux antennes. Une application de photos peut enregistrer le lieu dans chaque photo.
        questions:
            -   id: q01
                type: tableau
                enonce: Pour chaque application, la localisation est-elle utile ? Écris « utile » ou « inutile ».
                colonnes:
                    - Application
                    - Localisation
                lignes:
                    -   - Carte et itinéraire
                        - ''
                    -   - Lampe de poche
                        - ''
                    -   - Météo
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
            -   id: q02
                type: texte
                enonce: Pourquoi peut-il être dangereux de publier une photo qui contient le lieu où elle a été prise ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a03
        titre: Mes réglages
        transition: Tu connais les traces. À toi de les limiter.
        questions:
            -   id: q01
                type: texte
                enonce: Propose trois réglages pour limiter tes traces, et explique chacun.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le RGPD est une loi européenne sur les données personnelles.
        questions:
            -   id: q01
                type: texte
                enonce: Cherche un droit que le RGPD donne aux utilisateurs.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
        ressources:
            -   type: lien
                titre: CNIL — Les droits pour maîtriser vos données
                url: https://www.cnil.fr/fr/les-droits-pour-maitriser-vos-donnees-personnelles
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as enquêté sur tes traces. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quelles traces laissons-nous en naviguant, et comment les limiter ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Cookie : petit fichier déposé par un site ; utile (panier) ou publicitaire (refusable).'
    - 'Géolocalisation : à couper pour les applications qui n’en ont pas besoin.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
