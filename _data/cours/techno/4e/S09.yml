                - Déformation obtenue
            lignes:
                - - ""
                  - ""
                - - ""
                  - ""
                - - ""
                  - ""
            suite:
                - type: paragraphe
                  texte: "Répondez :"
          - id: q02
            type: texte
            enonce: Que devient la déformation lorsque l’épaisseur augmente ?
            suite: []
          - id: q03
            type: texte
            enonce: L’effet semble-t-il faible ou important ?
            suite: []
          - id: q04
            type: texte
            enonce: Quelle solution proposeriez-vous à un concepteur dont une pièce est trop souple ?
            suite: []
    - id: a10
      titre: "6. Expérience 3 : pourquoi la longueur compte-t-elle ?"
      contenu:
