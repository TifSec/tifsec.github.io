titre: Qu’est-ce qui rend une pièce plus rigide ?
theme: "Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre"
problematique: Qu’est-ce qui rend une pièce plus rigide ?
pourquoi: Testez une pièce courte, une pièce intermédiaire et une pièce longue.
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Comprendre que tous les matériaux ne se déforment pas de la même manière.
        - Comprendre que les dimensions d’une pièce influencent fortement sa déformation.
        - Comprendre qu’une pièce plus rigide se déforme moins sous un même effort.
        - Comprendre qu’un concepteur doit rechercher un compromis entre rigidité, dimensions et quantité de matière.
    competences:
        - utiliser une simulation pour étudier le comportement d’une pièce ;
        - modifier un seul paramètre à la fois ;
        - relever et comparer des valeurs ;
        - faire évoluer une hypothèse à partir des résultats ;
        - proposer une amélioration en utilisant les résultats obtenus.
activites:
    - id: a02
      titre: Compétence visée
      contenu:
          - type: paragraphe
            texte: Paramétrer une simulation pour comparer le comportement mécanique de plusieurs solutions.
      questions: []
    - id: a04
      titre: Production attendue
      contenu:
          - type: paragraphe
            texte: Vous devez produire un document LibreOffice Writer contenant vos hypothèses, trois tableaux de résultats issus du simulateur, une synthèse et une proposition d’amélioration argumentée.
      questions: []
    - id: a05
      titre: 1. Créer votre document de travail
      contenu:
          - type: paragraphe
            texte: "Créez dès maintenant un document LibreOffice Writer nommé :"
          - type: paragraphe
            texte: 4e_S9_nom.odt
          - type: paragraphe
            texte: Remplacez nom par votre nom.
          - type: paragraphe
            texte: "Indiquez :"
          - type: liste
            elements:
                - votre nom et votre prénom ;
                - la date ;
                - "le titre : Séance 9 : Qu’est-ce qui rend une pièce plus rigide ?"
          - type: paragraphe
            texte: Conservez dans votre document vos premières hypothèses, vos résultats et vos corrections.
          - type: paragraphe
            texte: Le fichier devra être rendu en fin d’heure, même s’il n’est pas terminé.
      questions: []
    - id: a06
      titre: "2. Avant de simuler : qu’est-ce qui influence la déformation ?"
      contenu:
          - type: paragraphe
            texte: Imaginez un support maintenant le moteur ou une roue d’un robot.
          - type: paragraphe
            texte: Cette pièce ne doit pas se déformer excessivement lorsqu’elle subit un effort.
          - type: paragraphe
            texte: "Sans utiliser le simulateur, indiquez si vous êtes d’accord ou non avec les affirmations suivantes et justifiez :"
          - type: etapes
            elements:
                - Deux pièces de mêmes dimensions mais fabriquées avec des matériaux différents se déforment forcément de la même manière.
                - Une pièce plus épaisse se déforme généralement moins.
                - Une pièce plus longue se déforme généralement davantage.
                - Pour rendre une pièce plus rigide, il suffit toujours de choisir un meilleur matériau.
          - type: paragraphe
            texte: "Conservez vos réponses : vous les reprendrez à la fin de la séance."
          - type: titre
            texte: Besoin d’un indice ?
          - type: paragraphe
            texte: "Pensez à une règle en plastique ou en métal : sa matière compte, mais sa longueur et son épaisseur peuvent-elles également changer la facilité avec laquelle elle se plie ?"
      questions: []
    - id: a07
      titre: 3. Ouvrir le laboratoire virtuel
      contenu:
          - type: paragraphe
            texte: "Ouvrez : Explerify – Young’s Modulus Simulator ."
          - type: lien
            titre: Explerify – Young’s Modulus Simulator
            url: https://explerify.com/simulator-youngs-modulus/
          - type: paragraphe
            texte: Le simulateur représente une poutre soumise à un effort. Il permet de modifier plusieurs caractéristiques et d’observer la déformation obtenue.
          - type: paragraphe
            texte: "Pour cette séance, repérez seulement les réglages suivants :"
          - type: tableau
            colonnes:
                - Terme dans le simulateur
                - Signification
            lignes:
                - - Material
                  - Matériau
                - - Length
                  - Longueur
                - - Width
                  - Largeur
                - - Height
                  - Hauteur / épaisseur
                - - Load / Applied Force
                  - Charge ou force appliquée
                - - Deflection
                  - Déformation / flèche
          - type: paragraphe
            texte: "Règle pour toutes les comparaisons : ne modifiez qu’un seul paramètre à la fois."
          - type: paragraphe
            texte: "Le module de Young caractérise la réponse élastique d’un matériau : pour des conditions comparables, un matériau ayant un module plus élevé se déforme moins. Pour aller plus loin : MIT OpenCourseWare – Mechanics of Materials ."
          - type: lien
            titre: MIT OpenCourseWare – Mechanics of Materials
            url: https://ocw.mit.edu/courses/3-11-mechanics-of-materials-fall-1999/
      questions: []
    - id: a08
      titre: "4. Expérience 1 : le matériau influence-t-il la déformation ?"
      contenu:
          - type: paragraphe
            texte: Choisissez une configuration de départ.
          - type: paragraphe
            texte: "Notez :"
          - type: liste
            elements:
                - la longueur ;
                - la largeur ;
                - l’épaisseur ;
                - la charge appliquée.
          - type: paragraphe
            texte: Ne modifiez plus ces quatre valeurs.
          - type: paragraphe
            texte: Testez ensuite trois matériaux différents.
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Matériau
                - Déformation obtenue
                - Classement
            lignes:
                - - ""
                  - ""
                  - ""
                - - ""
                  - ""
                  - ""
                - - ""
                  - ""
                  - ""
            suite:
                - type: paragraphe
                  texte: "Répondez :"
          - id: q02
            type: texte
            enonce: Quel matériau se déforme le moins ?
            suite: []
          - id: q03
            type: texte
            enonce: Quel matériau se déforme le plus ?
            suite: []
          - id: q04
            type: texte
            enonce: Pourquoi était-il important de conserver les mêmes dimensions et la même charge ?
            suite: []
          - id: q05
            type: texte
            enonce: Votre première hypothèse sur le matériau est-elle confirmée ?
            suite: []
    - id: a09
      titre: "5. Expérience 2 : l’épaisseur change-t-elle beaucoup le résultat ?"
      contenu:
          - type: paragraphe
            texte: Choisissez un seul matériau.
          - type: paragraphe
            texte: "Conservez :"
          - type: liste
