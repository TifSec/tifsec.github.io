    - id: a12
      titre: 8. Rigide ne signifie pas incassable
      contenu:
          - type: paragraphe
            texte: Le simulateur permet essentiellement d’étudier la déformation de la poutre.
          - type: paragraphe
            texte: Une pièce qui se déforme peu sous un même effort est considérée ici comme plus rigide.
          - type: paragraphe
            texte: Mais une pièce très rigide peut malgré tout casser dans certaines conditions.
          - type: paragraphe
            texte: "Dans votre document, expliquez avec vos propres mots la différence entre :"
          - type: liste
            elements:
                - une pièce qui se déforme peu ;
                - une pièce qui résiste à la rupture.
      questions: []
    - id: a13
      titre: 9. Défi de conception
      contenu:
          - type: paragraphe
            texte: Un support de moteur de robot se déforme trop lorsqu’il fonctionne.
          - type: paragraphe
            texte: Votre objectif est de réduire sa déformation sans simplement augmenter fortement toutes ses dimensions.
          - type: paragraphe
            texte: Choisissez une configuration de départ dans le simulateur et relevez sa déformation.
          - type: paragraphe
            texte: "Vous pouvez ensuite modifier :"
          - type: liste
            elements:
                - le matériau ;
                - la longueur ;
                - l’épaisseur.
          - type: paragraphe
            texte: "Présentez votre solution :"
          - type: liste
            elements:
                - "Configuration de départ : ..."
                - "Déformation initiale : ..."
                - "Modification choisie : ..."
                - "Nouvelle déformation : ..."
                - "Pourquoi ce choix : ..."
                - "Nouvelle contrainte possible : ..."
          - type: paragraphe
            texte: Il n’existe pas une seule bonne réponse. Votre proposition doit être justifiée par les résultats obtenus.
      questions: []
    - id: a14
      titre: 10. Mettons des mots sur ce que nous avons découvert
      contenu:
          - type: paragraphe
            texte: La rigidité caractérise ici la capacité d’une pièce à limiter sa déformation lorsqu’elle subit un effort.
          - type: paragraphe
            texte: "La déformation dépend notamment :"
          - type: liste
            elements:
                - du matériau ;
                - des dimensions de la pièce ;
                - de sa longueur ;
                - de l’effort appliqué.
          - type: paragraphe
            texte: Le concepteur doit donc agir à la fois sur le matériau et sur la géométrie de la pièce.
          - type: paragraphe
            texte: "Augmenter l’épaisseur peut limiter la déformation, mais peut aussi augmenter :"
          - type: liste
            elements:
                - la quantité de matière ;
                - la masse ;
                - l’encombrement ;
                - le coût.
          - type: paragraphe
            texte: La conception nécessite donc souvent un compromis entre plusieurs contraintes.
      questions: []
    - id: a15
      titre: 11. Revenons aux hypothèses du début
      contenu:
          - type: paragraphe
            texte: Relisez vos quatre réponses de la partie 2.
          - type: paragraphe
            texte: "Pour chacune, indiquez :"
          - type: liste
