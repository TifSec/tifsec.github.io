                - la même largeur ;
                - la même épaisseur ;
                - la même charge.
          - type: paragraphe
            texte: Modifiez uniquement Length.
          - type: paragraphe
            texte: Testez une pièce courte, une pièce intermédiaire et une pièce longue.
      questions:
          - id: q01
