titre: 'Séance 9 : Quelles traces je laisse sans le savoir ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Quelles traces laissons-nous en naviguant, et comment les limiter ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
objectifs:
    connaissances:
        - 'Un cookie (témoin de connexion) est un petit fichier déposé par un site pour se souvenir de toi : panier, langue, mais aussi publicité ciblée.'
        - La géolocalisation donne ta position ; on peut la couper pour les applications qui n’en ont pas besoin.
    competences:
        - Expliquer le rôle d’un cookie.
        - Proposer des réglages pour limiter ses traces.
pourquoi:
    - En séance 8, tu as protégé tes comptes.
    - Même sans compte, tu laisses des traces. Aujourd’hui, tu enquêtes sur ces traces invisibles.
activites:
    -   id: a01
        titre: Les cookies
        consigne: Tu vas découvrir ce que sont les cookies à partir de l’exemple des baskets et du document 1. On attend le cookie que l’on peut refuser et l’explication des publicités ciblées.
        contenu:
            -   type: paragraphe
                texte: 'Exemple expliqué : tu mets des baskets dans le panier d’un site, tu fermes la page, tu reviens le lendemain : le panier est toujours là. Le site a déposé un cookie pour s’en souvenir.'
            -   type: tableau
                titre: Document 1
                colonnes:
                    - Cookie
                    - Sert à…
                    - Nécessaire ?
                lignes:
                    -   - Panier
                        - Retenir les articles
                        - Oui
                    -   - Langue
                        - Afficher en français
                        - Oui
                    -   - Publicité
                        - Montrer des publicités selon les sites visités
                        - Non
                    -   - Statistiques
                        - Compter les visites
                        - Souvent non
            -   type: etapes
                elements:
                    - Lis l’exemple expliqué.
                    - Lis le document 1 et repère à quoi sert chaque cookie.
                    - Demande-toi lesquels sont nécessaires au fonctionnement du site.
            -   type: paragraphe
                texte: 'Pourquoi les cookies existent-ils ? Sans eux, un site oublierait tout entre deux pages : ton panier, ta langue… Mais certains servent surtout à la publicité.'
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 1, quel cookie peux-tu refuser sans gêner le site ?
                choix:
                    -   id: a
                        texte: Le cookie de publicité.
                    -   id: b
                        texte: Le cookie du panier.
                    -   id: c
                        texte: Le cookie de langue.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Explique pourquoi tu vois des publicités de baskets après avoir visité un site de chaussures.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a02
        titre: La géolocalisation
        transition: Les cookies ne sont pas les seules traces. Ton téléphone sait aussi où tu es.
        consigne: Tu vas réfléchir à la géolocalisation des applications de ton téléphone, à partir du texte ci-dessous. On attend, pour chaque application, si la localisation est utile, et le danger d’une photo localisée.
        contenu:
            -   type: paragraphe
                texte: Un téléphone connaît sa position grâce au GPS, au Wi-Fi et aux antennes. Une application de photos peut enregistrer le lieu dans chaque photo.
            -   type: etapes
                elements:
                    - Lis comment un téléphone connaît sa position.
                    - Pour chaque application, demande-toi si elle a vraiment besoin de savoir où tu es.
                    - Écris « utile » ou « inutile ».
            -   type: paragraphe
                texte: 'Pourquoi se méfier ? Ta position dit où tu habites, où tu vas au collège, à quelle heure : ce sont des informations personnelles.'
        questions:
            -   id: q01
                type: tableau
                enonce: Pour chaque application, la localisation est-elle utile ?
                colonnes:
                    - Application
                    - Localisation
                lignes:
                    -   - Carte et itinéraire
                        - ''
                    -   - Lampe de poche
                        - ''
                    -   - Météo
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
            -   id: q02
                type: texte
                enonce: Pourquoi peut-il être dangereux de publier une photo qui contient le lieu où elle a été prise ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a03
        titre: Mes réglages
        transition: Tu connais les traces. À toi de les limiter.
        consigne: Tu vas choisir tes propres réglages pour limiter tes traces, en reprenant les missions 1 et 2. On attend trois réglages ou gestes concrets, chacun relié à la trace qu’il évite.
        contenu:
            -   type: etapes
                elements:
                    - Reprends ce que tu as appris dans les missions 1 et 2.
                    - Choisis trois réglages ou gestes concrets.
                    - Pour chacun, écris la trace qu’il évite.
            -   type: paragraphe
                texte: 'Pourquoi agir soi-même ? Les réglages par défaut favorisent souvent la collecte de données : c’est à l’utilisateur de les choisir.'
        questions:
            -   id: q01
                type: texte
                enonce: Propose trois réglages pour limiter tes traces, et explique chacun.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Je m’entraîne
        transition: Tu as compris la méthode. Applique-la seul sur un cas nouveau.
        consigne: 'Tu vas appliquer seul ce que tu as appris sur un cas nouveau : le bandeau de cookies d’un site, reproduit ci-dessous. On attend le bouton choisi et une justification.'
        contenu:
            -   type: citation
                texte: '« Ce site utilise des cookies : nécessaires (connexion, panier), mesure d’audience, publicité personnalisée. [Tout accepter] [Tout refuser] [Personnaliser] »'
            -   type: etapes
                elements:
                    - Lis le bandeau de cookies.
                    - Repère les cookies nécessaires et ceux qui ne le sont pas.
                    - Choisis ce que tu acceptes et justifie.
            -   type: paragraphe
                texte: 'Pourquoi s’entraîner sur un bandeau ? Tu en vois tous les jours : savoir y répondre est un vrai réflexe.'
        questions:
            -   id: q01
                type: qcm
                enonce: Quel bouton choisis-tu pour limiter tes traces tout en utilisant le site ?
                choix:
                    -   id: a
                        texte: « Personnaliser » puis n’accepter que les cookies nécessaires.
                    -   id: b
                        texte: « Tout accepter ».
                    -   id: c
                        texte: Fermer le navigateur.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Explique ton choix.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a05
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le RGPD est une loi européenne sur les données personnelles.
        questions:
            -   id: q01
                type: texte
                enonce: Cherche un droit que le RGPD donne aux utilisateurs.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
        ressources:
            -   type: lien
                titre: CNIL — Les droits pour maîtriser vos données
                url: https://www.cnil.fr/fr/les-droits-pour-maitriser-vos-donnees-personnelles
    -   id: a06
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as enquêté sur tes traces. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quelles traces laissons-nous en naviguant, et comment les limiter ? Cite deux traces et deux moyens.'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Cookie : petit fichier déposé par un site ; utile (panier) ou publicitaire (refusable).'
    - 'Géolocalisation : à couper pour les applications qui n’en ont pas besoin.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
