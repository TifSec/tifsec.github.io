titre: 'Séance 41 : Quelle nouvelle fonction pour le tracker ?'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Quel besoin justifie d’ajouter une fonction au tracker, et comment l’écrire dans un cahier des charges ?
competences_bo:
    - Imaginer, concevoir et réaliser une ou des solutions en réponse à un besoin, à des exigences (de développement durable, par exemple) ou à la nécessité d’améliorations dans une démarche de créativité
objectifs:
    connaissances:
        - 'Ajouter une fonction : le tracker enverra par radio sa luminosité et son angle à une deuxième carte micro:bit, qui les affichera.'
        - Un cahier des charges liste les fonctions, les critères (ce qu’on mesure) et les niveaux (la valeur à atteindre).
    competences:
        - Formuler le besoin et les fonctions d’un objet.
        - Rédiger un cahier des charges simple dans Writer (tableau, styles).
        - Organiser le planning du groupe.
pourquoi:
    - En 5e, tu as modifié le comportement du tracker. En séance 2, tu as vu les étapes d’un projet.
    - 'En 4e, ton groupe va ajouter une vraie nouvelle fonction au tracker : communiquer à distance.'
activites:
    -   id: a01
        titre: Le besoin
        consigne: 'Tu vas formuler le besoin à l’origine du projet de l’année : rendre le tracker solaire du collège « communicant ». Tu t’appuies sur la demande de l’utilisateur ci-dessous. On attend une phrase de besoin et la fonction à ajouter.'
        contenu:
            -   type: citation
                texte: La personne qui s’occupe du tracker veut savoir, depuis la salle, si le tracker reçoit du soleil et vers où il est tourné, sans aller dans la cour.
            -   type: etapes
                elements:
                    - Lis la demande de l’utilisateur ci-dessous.
                    - Écris ce qu’il veut, en commençant par « Je voudrais… », sans parler de technique.
                    - Puis écris la fonction à ajouter au tracker pour y répondre.
            -   type: paragraphe
                texte: Pourquoi séparer besoin et fonction ? Le besoin, c’est ce que veut l’utilisateur ; la fonction, c’est ce que l’objet devra faire pour y répondre.
        questions:
            -   id: q01
                type: texte
                enonce: Formule le besoin de l’utilisateur du tracker en une phrase (« Je voudrais… »), puis la fonction à ajouter au tracker.
                aide: « = » + fonction + plage.
    -   id: a02
        titre: Le cahier des charges (Writer n° 2)
        transition: Le besoin est clair. Écris-le dans un vrai document.
        consigne: Tu vas rédiger dans Writer le cahier des charges du tracker communicant, sous forme de tableau (fonction, critère, niveau), en t’aidant de l’exemple de ligne. On attend un fichier enregistré et deux lignes complètes recopiées.
        contenu:
            -   type: paragraphe
                texte: 'Exemple de ligne : Fonction « Envoyer la luminosité » ; critère « distance de réception » ; niveau « au moins 10 m ».'
            -   type: paragraphe
                texte: 'Rappel de la séance 6 : styles de titres et en-tête.'
            -   type: etapes
                elements:
                    - Ouvre Writer et enregistre sous 4e_S41_groupe.odt.
                    - Écris le titre « Cahier des charges du tracker communicant » en style Titre.
                    - 'Insère un tableau de 3 colonnes : Fonction, Critère, Niveau (Tableau > Insérer un tableau).'
                    - Remplis au moins deux lignes, puis ajoute un en-tête avec les noms du groupe.
            -   type: paragraphe
                texte: 'Pourquoi un critère et un niveau ? « Envoyer la luminosité » ne suffit pas : il faut dire comment on vérifiera (la distance) et la valeur à atteindre (10 m).'
        questions:
            -   id: q01
                type: tableau
                enonce: Recopie deux lignes du cahier des charges du tracker communicant que tu as écrit dans Writer.
                colonnes:
                    - Fonction
                    - Critère
                    - Niveau
                lignes:
                    -   - ''
                        - ''
                        - ''
                    -   - ''
                        - ''
                        - ''
                aide: Ligne × colonne.
    -   id: a03
        titre: Le planning du groupe
        transition: Le cahier des charges est prêt. Organisez le travail du groupe.
        consigne: Tu vas organiser le travail de ton groupe pour le projet du tracker communicant, à partir du planning proposé (séances 42 à 48). On attend une répartition des rôles et ton propre rôle.
        contenu:
            -   type: tableau
                titre: Planning proposé
                colonnes:
                    - Séance
                    - Tâche
                lignes:
                    -   - '42'
                        - Découvrir la radio dans le simulateur
                    -   - '43'
                        - Identifier les constituants manquants
                    -   - '44'
                        - Programmer émetteur et récepteur
                    -   - '45'
                        - Tester la liaison
                    -   - '46'
                        - Exploiter les mesures (Calc)
                    -   - 47-48
                        - Préparer et présenter la revue de projet
            -   type: etapes
                elements:
                    - Lis le planning proposé (séances 42 à 48).
                    - 'Liste les rôles utiles : programmeur émetteur, programmeur récepteur, testeur, rédacteur…'
                    - Répartissez-les dans le groupe.
            -   type: paragraphe
                texte: Pourquoi des rôles ? Chacun sait ce qu’il doit faire à chaque séance, et rien n’est oublié.
        questions:
            -   id: q01
                type: texte
                enonce: Pour le projet du tracker communicant, répartissez les rôles dans le groupe (au moins deux rôles) et écris le tien.
                aide: Combien d’éléments sont demandés ?
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La radio de la micro:bit fonctionne sur un « groupe » (un canal) de 0 à 255.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi chaque groupe de la classe doit-il choisir un numéro de groupe radio différent ?
                aide: Pense à « car » (réflexe n° 4).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Le projet est lancé. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quel besoin justifie la nouvelle fonction du tracker, et comment l’as-tu écrite dans le cahier des charges ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Ajouter une fonction : partir d’un besoin.'
    - 'Cahier des charges : fonction, critère, niveau.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
