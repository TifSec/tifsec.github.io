titre: 'Séance 39 : D’où vient la panne ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Comment proposer un protocole pour trouver l’origine d’une panne du monte-charge ?
competences_bo:
    - Identifier un dysfonctionnement d’un objet technique et y remédier
objectifs:
    connaissances:
        - Un protocole de dépannage commence par les vérifications simples et générales (alimentation), puis va vers les plus précises (un capteur, un fil, le programme).
        - 'Pour chaque vérification : ce que je teste, ce que j’attends, ce que je conclus si ce n’est pas le cas.'
    competences:
        - Proposer un protocole de dépannage.
        - Conclure sur l’origine d’une panne.
pourquoi:
    - En 5e, le protocole de dépannage était fourni.
    - En 4e, c’est toi qui le proposes. Le professeur a préparé une panne réversible sur le monte-charge.
activites:
    -   id: a01
        titre: Le symptôme
        consigne: 'Tu vas analyser une panne réelle du monte-charge, préparée par le professeur : la cabine ne monte pas. Tu t’appuies sur le symptôme décrit ci-dessous et sur la chaîne d’information (séance 35). On attend la liste de ce qui fonctionne et des causes possibles.'
        contenu:
            -   type: citation
                texte: 'Symptôme observé : au démarrage, les voyants sont orange puis verts, l’écran affiche « Attente ». La cabine est en bas. On appuie sur le bouton Étage : rien ne se passe.'
            -   type: etapes
                elements:
                    - Observe la démonstration du professeur (ou lis le symptôme ci-dessous).
                    - 'Liste ce qui fonctionne : voyants, écran, carte…'
                    - Liste ce qui pourrait être en cause pour que la cabine ne monte pas.
            -   type: paragraphe
                texte: 'Pourquoi commencer par ce qui marche ? Tout ce qui fonctionne est hors de cause : il reste moins de suspects.'
        questions:
            -   id: q01
                type: texte
                enonce: Le monte-charge démarre normalement, mais la cabine ne monte pas quand on appuie sur Étage. D’après ce symptôme, qu’est-ce qui fonctionne et qu’est-ce qui peut être en cause ?
                aide: Repère le verbe de la question.
    -   id: a02
        titre: Proposer le protocole
        transition: Tu connais les causes possibles. Organise les vérifications.
        consigne: 'Tu vas écrire le protocole de dépannage du monte-charge : les vérifications à faire, dans l’ordre, pour trouver pourquoi la cabine ne monte pas. Tu t’appuies sur tes causes possibles de la mission 1 et sur l’exemple de ligne. On attend un tableau de trois vérifications complètes.'
        contenu:
            -   type: paragraphe
                texte: 'Exemple expliqué de ligne : « Vérification : l’écran s’allume-t-il ? — Attendu : il affiche « Attente ». — Sinon : problème d’alimentation ou de carte. »'
            -   type: etapes
                elements:
                    - Reprends tes causes possibles de la mission 1.
                    - Range-les de la plus simple à vérifier à la plus précise.
                    - Pour chacune, écris ce que tu attends si tout va bien.
                    - Puis ce que tu conclus si ce n’est pas le cas.
            -   type: paragraphe
                texte: Pourquoi du simple au précis ? On vérifie d’abord ce qui est rapide et fréquent, pour ne pas démonter le monte-charge pour rien.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Écris ton protocole pour trouver pourquoi la cabine du monte-charge ne monte pas : trois vérifications, de la plus simple à la plus précise.'
                colonnes:
                    - Vérification
                    - Résultat attendu si tout va bien
                    - Si ce n’est pas le cas, je conclus…
                lignes:
                    -   - ''
                        - ''
                        - ''
                    -   - ''
                        - ''
                        - ''
                    -   - ''
                        - ''
                        - ''
                aide: Attendu ou observé ?
    -   id: a03
        titre: Conclure
        transition: Le protocole est proposé. La classe l’applique en démonstration.
        consigne: Tu vas expliquer la panne trouvée par la classe (un contact décalé) à l’aide du programme du monte-charge étudié en séance 36. On attend une explication qui relie le contact, la broche P13 et la condition de montée.
        contenu:
            -   type: paragraphe
                texte: 'Résultat du protocole de la classe : le contact bas n’est plus appuyé par la cabine (il a été légèrement décalé).'
            -   type: etapes
                elements:
                    - Lis le résultat du protocole appliqué par la classe.
                    - 'Relis la condition de montée du programme (séance 36) : si (P13 = 1) ET (P1 appuyé).'
                    - Explique le lien entre le contact décalé et la condition.
            -   type: paragraphe
                texte: 'Pourquoi relier au programme ? La panne est mécanique, mais c’est le programme qui décide de ne pas démarrer : il faut les deux pour comprendre.'
        questions:
            -   id: q01
                type: texte
                enonce: Le contact bas du monte-charge a été légèrement décalé. Explique pourquoi cela empêche la montée, en t’appuyant sur le programme de la séance 36.
                aide: Bloc par bloc (réflexe n° 9).
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une panne peut aussi venir du programme.
        questions:
            -   id: q01
                type: texte
                enonce: Comment vérifier si le programme du monte-charge est en cause, sans toucher aux fils ?
                aide: Bloc par bloc (réflexe n° 9).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as proposé un protocole et trouvé la panne. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment proposer un protocole pour trouver l’origine d’une panne du monte-charge ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Protocole de dépannage : du symptôme aux causes ; du simple au précis ; attendu et conclusion pour chaque vérification.'
sources:
