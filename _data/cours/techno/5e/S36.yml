titre: Une eau claire est-elle forcément utilisable ?
theme: Concevoir une cuve intelligente simulée
problematique: Une eau claire est-elle forcément utilisable ?
pourquoi: Identifier une limite d’observation et de mesure.
application: "L’apparence ne suffit pas pour vérifier la qualité sanitaire de l’eau."
lien_precedent: "Après S35 — Quand faut-il arrêter de remplir ?, nous poursuivons avec un seul objectif : identifier une limite d’observation et de mesure."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: paragraphe
            texte: Une observation de couleur ou de trouble ne mesure pas toutes les substances et tous les risques. Un filtre qui retient des particules ne suffit pas à garantir une eau potable. Dans notre projet, l’eau reste étiquetée NON POTABLE.
          - type: tableau
            colonnes:
                - Échantillon fictif
                - Aspect
                - Information connue
            lignes:
                - - A
                  - Clair
                  - Composition inconnue
                - - B
                  - Trouble
                  - Particules visibles
                - - C
                  - Clair
                  - Alerte donnée par le scénario
          - type: paragraphe
            texte: "Exemple guidé : une eau peut paraître claire et contenir pourtant des microbes ou des substances invisibles. La vue seule ne permet donc pas de dire qu’elle est potable. Dans notre projet, l’eau reste non potable et ne se goûte jamais."
      questions:
          - id: q01
            type: texte
            enonce: Peut-on déclarer A potable avec le seul document ?
            aide: Une absence d’indice visible n’est pas une preuve complète.
          - id: q02
            type: texte
            enonce: Pourquoi B et C peuvent-ils conduire à une alerte pour des raisons différentes ?
            aide: Comparer observation et information donnée.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - Classer séparément ce qui est observé et ce qui est inconnu.
          - Chercher sur la ressource ce que signifie contrôler la qualité d’une eau.
          - Rédiger une étiquette de projet qui ne promet pas plus que les données disponibles.
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: Rédiger une étiquette courte pour l’eau du projet, avec une limite explicite.
            aide: Évite la mention « propre donc buvable ».
      ressources:
          - type: paragraphe
            texte: Sur le portail public, chercher qualité de l’eau et usages ; relever une information qui distingue observation et contrôle.
          - type: lien
            titre: Eaufrance — Portail public de l’eau
            url: https://www.eaufrance.fr/
    - id: a03
      titre: 3. Explique avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Un groupe filtre B et obtient un aspect clair. Quelle conclusion peut-il écrire, et laquelle doit-il éviter ?
            aide: Ne dépasse pas ce qui a été observé.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Une observation visuelle ne permet pas de détecter toutes les substances ou tous les microbes."
    - "Identifier une limite d’observation et de mesure."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Une observation visuelle ne permet pas de détecter toutes les substances ou tous les microbes."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Identifier une limite d’observation et de mesure."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : L’apparence ne suffit pas pour vérifier la qualité sanitaire de l’eau."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
