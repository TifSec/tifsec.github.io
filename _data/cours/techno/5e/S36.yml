titre: Une eau claire est-elle forcément utilisable ?
theme: Concevoir une cuve intelligente simulée
problematique: Une eau claire est-elle forcément utilisable ?
pourquoi: Identifier une limite d’observation et de mesure.
application: Une cuve peut collecter une eau non potable et isoler une arrivée signalée suspecte dans un modèle.
lien_precedent: "Après S35 — Quand faut-il arrêter de remplir ?, nous poursuivons avec un seul objectif : identifier une limite d’observation et de mesure."
activites:
    - id: a01
      titre: Comprendre le document
      pourquoi: Identifier une limite d’observation et de mesure.
      demarche:
          - Lire le document et repérer les mots utiles.
          - Répondre aux deux questions avec une information du document.
      contenu:
          - type: paragraphe
            texte: Une observation de couleur ou de trouble ne mesure pas toutes les substances et tous les risques. Un filtre qui retient des particules ne suffit pas à garantir une eau potable. Dans notre projet, l’eau reste étiquetée NON POTABLE.
          - type: tableau
            colonnes:
                - Échantillon fictif
                - Aspect
                - Information connue
            lignes:
                - - A
                  - Clair
                  - Composition inconnue
                - - B
                  - Trouble
                  - Particules visibles
                - - C
                  - Clair
                  - Alerte donnée par le scénario
      questions:
          - id: q01
            type: texte
            enonce: Peut-on déclarer A potable avec le seul document ?
            aide: Une absence d’indice visible n’est pas une preuve complète.
          - id: q02
            type: texte
            enonce: Pourquoi B et C peuvent-ils conduire à une alerte pour des raisons différentes ?
            aide: Comparer observation et information donnée.
    - id: a02
      titre: Faire, chercher et tester
      pourquoi: Mettre l’idée à l’épreuve plutôt que recopier une définition.
      demarche:
          - Classer séparément ce qui est observé et ce qui est inconnu.
          - Chercher sur la ressource ce que signifie contrôler la qualité d’une eau.
          - Rédiger une étiquette de projet qui ne promet pas plus que les données disponibles.
      contenu:
          - type: paragraphe
            texte: "Travaille au brouillon, dans le logiciel ou sur le schéma. Garde une trace d’essai : situation, résultat attendu et observation. En binôme, échangez les rôles au milieu du travail."
      questions:
          - id: q01
            type: texte
            enonce: Rédiger une étiquette courte pour l’eau du projet, avec une limite explicite.
            aide: Évite la mention « propre donc buvable ».
      ressources:
          - type: paragraphe
            texte: Sur le portail public, chercher qualité de l’eau et usages ; relever une information qui distingue observation et contrôle.
          - type: lien
            titre: Eaufrance — Portail public de l’eau
            url: https://www.eaufrance.fr/
    - id: a03
      titre: Expliquer ce que le test permet de conclure
      pourquoi: Relier sa réponse à une donnée et préciser une limite.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Un groupe filtre B et obtient un aspect clair. Quelle conclusion peut-il écrire, et laquelle doit-il éviter ?
            aide: Ne dépasse pas ce qui a été observé.
    - id: a04
      titre: Conserver et retenir
      pourquoi: Finir avec une trace réutilisable.
      demarche:
          - Vérifier le nom du projet ou de la trace.
          - Noter au brouillon une erreur corrigée ou une étape à reprendre.
      contenu: []
      questions: []
retenir:
    - Identifier une limite d’observation et de mesure.
    - Une exigence exprime ce que la solution doit respecter et comment on pourra le vérifier.
    - Le projet gère une eau non potable ; un aspect clair ou une mesure isolée ne garantit pas la potabilité.
bilan: Je conserve une trace qui montre ce que j’ai compris ou testé. Une erreur expliquée et corrigée est un progrès observable.
introduction:
    - type: paragraphe
      texte: "Objectif du jour : Identifier une limite d’observation et de mesure."
    - type: paragraphe
      texte: "Séance de 50 minutes de travail effectif : lire et comprendre, réaliser ou chercher, tester, puis faire un bilan. Les essais font partie du travail ; une version simple suffit pour commencer."
    - type: liste
      elements:
          - Une exigence exprime ce que la solution doit respecter et comment on pourra le vérifier.
          - Le programme reçoit des données et applique des règles ; il ne sait pas ce que les données ne décrivent pas.
          - Le projet gère une eau non potable ; un aspect clair ou une mesure isolée ne garantit pas la potabilité.
reperes_officiels:
