titre: 'Séance 36 : Que se passe-t-il si je change un nombre du programme ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Comment changer la vitesse du moteur dans le programme, et comment vérifier l’effet de ce changement ?
competences_bo:
    - Comprendre et modifier un programme associé à une fonctionnalité d’un objet ou d’un système technique
    - Valider les solutions techniques par des simulations ou par des protocoles de tests
objectifs:
    connaissances:
        - 'Un paramètre est un nombre du programme qui règle un comportement : ici, la vitesse du moteur (137 dans le programme d’origine, sur une échelle de 0 à 255).'
        - 'On vérifie l’effet d’un changement par un test : prévoir, changer une seule chose, observer, comparer.'
    competences:
        - Repérer un paramètre dans un programme.
        - Prévoir l’effet d’un changement, puis le vérifier par un test.
pourquoi:
    - En séance 30, tu as changé la vitesse de ton personnage dans Arcade. En séance 35, tu as lu le programme du monte-charge.
    - Aujourd’hui, tu modifies un paramètre du vrai programme. Chaque groupe prépare sa modification ; le professeur l’envoie sur la maquette, un groupe à la fois.
activites:
    -   id: a01
        titre: Repérer les paramètres
        contenu:
            -   type: code
                texte: 'faire tourner le moteur vers l’avant à la vitesse 137

                    écran : écrire « Appel Etage »'
            -   type: paragraphe
                texte: Dans le programme d’origine, le moteur tourne à la vitesse 137. La carte accepte des valeurs de 0 (arrêt) à 255 (vitesse maximale).
            -   type: paragraphe
                texte: 'Rappel de la séance 6 et du réflexe n° 8 : je change une seule chose à la fois.'
        questions:
            -   id: q01
                type: qcm
                enonce: Que se passe-t-il probablement si on met la vitesse à 0 ?
                choix:
                    -   id: a
                        texte: 'Le moteur ne tourne pas : la cabine ne monte pas.'
                    -   id: b
                        texte: La cabine monte très vite.
                    -   id: c
                        texte: L’écran s’éteint.
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: texte
                enonce: 'Ton groupe choisit une nouvelle vitesse (entre 80 et 200). Écris ta valeur et ta prévision : la cabine montera-t-elle plus vite ou moins vite, et pourquoi ?'
                aide: Pense à « car » (réflexe n° 4).
        ressources:
            -   type: lien
                titre: MakeCode micro:bit (gratuit, dans le navigateur)
                url: https://makecode.microbit.org/
    -   id: a02
        titre: Tester (poste maquette)
        transition: Tu as prévu. Le test sur la vraie maquette va dire si tu avais raison.
        contenu:
            -   type: tableau
                titre: Protocole de test
                colonnes:
                    - Étape
                    - Ce qu’on fait
                lignes:
                    -   - '1'
                        - Mesurer avec un chronomètre la durée de la montée avec le programme d’origine (vitesse 137).
                    -   - '2'
                        - Le professeur envoie le programme modifié du groupe.
                    -   - '3'
                        - Mesurer la durée de la montée avec la nouvelle vitesse, dans les mêmes conditions (cabine vide).
                    -   - '4'
                        - Le professeur remet le programme d’origine.
            -   type: tableau
                titre: Document 1 — Exemple de résultats d’une autre classe (valeurs inventées)
                colonnes:
                    - Vitesse
                    - Durée de la montée
                lignes:
                    -   - '137'
                        - 6 s
                    -   - '100'
                        - 9 s
                    -   - '200'
                        - 4 s
        questions:
            -   id: q01
                type: texte
                enonce: Écris les durées mesurées par ton groupe (vitesse 137 et ta vitesse), avec leur unité.
                aide: Attendu ou observé ?
            -   id: q02
                type: nombre
                enonce: D’après le document 1, combien de secondes gagne-t-on en passant de la vitesse 137 à la vitesse 200 ?
                unite: s
                aide: N’oublie pas l’unité (réflexe n° 5).
            -   id: q03
                type: texte
                enonce: Ta prévision était-elle juste ? Compare avec tes mesures.
                aide: Attendu ou observé ?
    -   id: a03
        titre: Plus vite, est-ce mieux ?
        transition: Tu as mesuré l’effet de la vitesse. Mais la vitesse la plus grande est-elle la meilleure ?
        questions:
            -   id: q01
                type: texte
                enonce: Donne un avantage et un inconvénient d’une vitesse très élevée pour un monte-charge.
                aide: Combien d’éléments sont demandés ?
            -   id: q02
                type: texte
                enonce: Propose un autre paramètre ou un message de l’écran que tu aimerais changer, et explique ce que cela apporterait à l’utilisateur.
                aide: Pense à « car » (réflexe n° 4).
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le capteur à ultrasons mesure la distance pendant le trajet.
        questions:
            -   id: q01
                type: texte
                enonce: Imagine comment on pourrait utiliser cette distance pour ralentir la cabine juste avant l’arrivée. Écris ton idée en « si … alors … ».
                aide: Bloc par bloc (réflexe n° 9).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as modifié un paramètre et vérifié son effet. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment changer la vitesse du moteur, et comment vérifier l’effet de ce changement ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - Un paramètre est un nombre qui règle un comportement (vitesse 0 à 255).
    - 'On vérifie un changement par un test : prévoir, ne changer qu’une chose, mesurer, comparer.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
