titre: Comment partager sans exposer les autres ?
theme: Rechercher, conserver et partager une information
problematique: Comment partager sans exposer les autres ?
pourquoi: Distinguer partage utile, données personnelles et droit d’usage.
application: "Partager des documents sans exposer les personnes protège leur vie privée et respecte les auteurs."
lien_precedent: "Après S26 — Comment retrouver une information et sa source ?, nous poursuivons avec un seul objectif : distinguer partage utile, données personnelles et droit d’usage."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: tableau
            colonnes:
                - Document envisagé
                - Contenu
            lignes:
                - - A
                  - Photo de classe avec noms complets
                - - B
                  - Schéma original de cuve sans visage ni nom
                - - C
                  - Image trouvée sans auteur ni licence
          - type: paragraphe
            texte: Un travail peut être partagé sans révéler l’identité des élèves. L’autorisation d’utiliser une image n’est pas donnée par sa simple présence sur internet.
          - type: paragraphe
            texte: "Exemple guidé : avant de partager une capture d’écran, je vérifie qu’elle ne montre ni nom complet, ni visage, ni identifiant. Je retire ces informations et je cite l’auteur d’une image que je réutilise."
      questions:
          - id: q01
            type: texte
            enonce: Quel document contient des données personnelles évidentes ?
            aide: Pense à ce qui permet d’identifier une personne.
          - id: q02
            type: texte
            enonce: Pourquoi C ne peut-il pas être réutilisé sans vérification ?
            aide: Accessible ne signifie pas libre de droits.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - Choisir un schéma de ton travail et lui donner un titre clair.
          - Retirer les données personnelles inutiles.
          - Préciser la source des éléments réutilisés ou dessiner soi-même une version simple.
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: Décrire deux choix faits pour rendre ton document partageable et compréhensible.
            aide: Une action protège les personnes, une autre aide à comprendre.
      ressources:
          - type: paragraphe
            texte: Lire comment accéder aux parcours avec son établissement et conserver son compte.
          - type: lien
            titre: Pix — Espace élève
            url: https://pix.fr/eleve/
    - id: a03
      titre: 3. Explique avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Un lien public est proposé pour le travail du groupe. Quelle vérification faut-il demander avant diffusion ?
            aide: Diffuser au groupe et publier à tous ne sont pas la même chose.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Un partage respecte les données personnelles et les droits d’utilisation."
    - "Distinguer partage utile, données personnelles et droit d’usage."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Un partage respecte les données personnelles et les droits d’utilisation."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Distinguer partage utile, données personnelles et droit d’usage."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : Partager des documents sans exposer les personnes protège leur vie privée et respecte les auteurs."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
