titre: Comment partager sans exposer les autres ?
theme: Rechercher, conserver et partager une information
problematique: Comment partager sans exposer les autres ?
pourquoi: Distinguer partage utile, données personnelles et droit d’usage.
application: Une méthode technique sert à expliquer, choisir et améliorer les outils du quotidien.
lien_precedent: "Après S26 — Comment retrouver une information et sa source ?, nous poursuivons avec un seul objectif : distinguer partage utile, données personnelles et droit d’usage."
activites:
    - id: a01
      titre: Comprendre le document
      pourquoi: Distinguer partage utile, données personnelles et droit d’usage.
      demarche:
          - Lire le document et repérer les mots utiles.
          - Répondre aux deux questions avec une information du document.
      contenu:
          - type: tableau
            colonnes:
                - Document envisagé
                - Contenu
            lignes:
                - - A
                  - Photo de classe avec noms complets
                - - B
                  - Schéma original de cuve sans visage ni nom
                - - C
                  - Image trouvée sans auteur ni licence
          - type: paragraphe
            texte: Un travail peut être partagé sans révéler l’identité des élèves. L’autorisation d’utiliser une image n’est pas donnée par sa simple présence sur internet.
      questions:
          - id: q01
            type: texte
            enonce: Quel document contient des données personnelles évidentes ?
            aide: Pense à ce qui permet d’identifier une personne.
          - id: q02
            type: texte
            enonce: Pourquoi C ne peut-il pas être réutilisé sans vérification ?
            aide: Accessible ne signifie pas libre de droits.
    - id: a02
      titre: Faire, chercher et tester
      pourquoi: Mettre l’idée à l’épreuve plutôt que recopier une définition.
      demarche:
          - Choisir un schéma de ton travail et lui donner un titre clair.
          - Retirer les données personnelles inutiles.
          - Préciser la source des éléments réutilisés ou dessiner soi-même une version simple.
      contenu:
          - type: paragraphe
            texte: "Travaille au brouillon, dans le logiciel ou sur le schéma. Garde une trace d’essai : situation, résultat attendu et observation. En binôme, échangez les rôles au milieu du travail."
      questions:
          - id: q01
            type: texte
            enonce: Décrire deux choix faits pour rendre ton document partageable et compréhensible.
            aide: Une action protège les personnes, une autre aide à comprendre.
      ressources:
          - type: paragraphe
            texte: Lire comment accéder aux parcours avec son établissement et conserver son compte.
          - type: lien
            titre: Pix — Espace élève
            url: https://pix.fr/eleve/
    - id: a03
      titre: Expliquer ce que le test permet de conclure
      pourquoi: Relier sa réponse à une donnée et préciser une limite.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Un lien public est proposé pour le travail du groupe. Quelle vérification faut-il demander avant diffusion ?
            aide: Diffuser au groupe et publier à tous ne sont pas la même chose.
    - id: a04
      titre: Conserver et retenir
      pourquoi: Finir avec une trace réutilisable.
      demarche:
          - Vérifier le nom du projet ou de la trace.
          - Noter au brouillon une erreur corrigée ou une étape à reprendre.
      contenu: []
      questions: []
retenir:
    - Distinguer partage utile, données personnelles et droit d’usage.
    - Une source identifiée permet de retrouver et de vérifier une information.
    - Un partage doit respecter les personnes et les conditions de réutilisation des ressources.
bilan: Je conserve une trace qui montre ce que j’ai compris ou testé. Une erreur expliquée et corrigée est un progrès observable.
introduction:
    - type: paragraphe
      texte: "Objectif du jour : Distinguer partage utile, données personnelles et droit d’usage."
    - type: paragraphe
      texte: "Séance de 50 minutes de travail effectif : lire et comprendre, réaliser ou chercher, tester, puis faire un bilan. Les essais font partie du travail ; une version simple suffit pour commencer."
    - type: liste
      elements:
          - Une source identifiée permet de retrouver et de vérifier une information.
          - Un nom de fichier explicite et des dossiers organisés facilitent le suivi du travail.
          - Un partage doit respecter les personnes et les conditions de réutilisation des ressources.
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
