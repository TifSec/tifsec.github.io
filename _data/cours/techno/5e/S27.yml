titre: 'Séance 27 : Calc n° 2 : 3, 4 ou 5 pales ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Comment un tableur aide-t-il à comparer les rotors avec des moyennes et un graphique ?
competences_bo:
    - Caractériser et choisir un objet ou un système technique selon différents critères
    - Valider les solutions techniques par des simulations ou par des protocoles de tests
objectifs:
    connaissances:
        - La fonction MOYENNE calcule la moyenne d’une plage de cellules.
        - Un graphique en barres permet de comparer des valeurs d’un coup d’œil ; il a un titre et des axes nommés.
    competences:
        - Calculer une moyenne avec une formule.
        - Créer un graphique en barres et lui donner un titre.
        - Conclure à partir d’un graphique.
pourquoi:
    - En séance 26, tu as mesuré la tension produite par les rotors.
    - 'Aujourd’hui, tu traites ces mesures avec Calc : moyennes, graphique, conclusion. Ton fichier reste sur l’ordinateur ; sur le site, tu écris tes formules et tes résultats.'
activites:
    -   id: a01
        titre: Saisir et calculer les moyennes
        contenu:
            -   type: paragraphe
                texte: 'Utilise les mesures du document 2 de la séance 26 (valeurs inventées), rappelées ici :'
            -   type: tableau
                titre: Ce que tu dois obtenir dans Calc
                colonnes:
                    - ''
                    - A
                    - B
                    - C
                    - D
                    - E
                lignes:
                    -   - '1'
                        - Rotor
                        - Mesure 1 (V)
                        - Mesure 2 (V)
                        - Mesure 3 (V)
                        - Moyenne (V)
                    -   - '2'
                        - 3 pales
                        - '1,8'
                        - '1,9'
                        - '1,7'
                        - ''
                    -   - '3'
                        - 4 pales
                        - '2,2'
                        - '2,4'
                        - '2,3'
                        - ''
                    -   - '4'
                        - 5 pales
                        - '2,1'
                        - '2,0'
                        - '2,2'
                        - ''
            -   type: etapes
                elements:
                    - Ouvre Calc et enregistre sous 5e_S27_tonprenom.ods.
                    - Recopie le tableau (sans la colonne E pour l’instant).
                    - En E2, écris =MOYENNE(B2:D2) puis Entrée.
                    - Recopie la formule vers le bas jusqu’à E4 avec la poignée (comme en séance 16).
            -   type: paragraphe
                texte: 'Exemple expliqué : =MOYENNE(B2:D2) additionne B2, C2 et D2 puis divise par 3. Pour le rotor à 3 pales : (1,8 + 1,9 + 1,7) ÷ 3 = 1,8 V.'
        questions:
            -   id: q01
                type: texte
                enonce: Écris la formule que tu as mise en E3.
                aide: « = » + fonction + plage.
            -   id: q02
                type: nombre
                enonce: Quelle moyenne le tableur affiche-t-il pour le rotor à 5 pales ?
                unite: V
                aide: N’oublie pas l’unité (réflexe n° 5).
    -   id: a02
        titre: Le graphique
        transition: Les moyennes sont calculées. Un graphique les rend faciles à comparer.
        contenu:
            -   type: etapes
                elements:
                    - Sélectionne les cellules A1 à A4, puis, en maintenant Ctrl, les cellules E1 à E4.
                    - Menu Insertion > Diagramme, choisis « Colonne » (barres verticales).
                    - 'Donne un titre : Tension moyenne selon le nombre de pales.'
                    - 'Nomme l’axe vertical : Tension (V).'
                    - Enregistre (Ctrl + S).
            -   type: paragraphe
                texte: 'Un graphique sans titre ni unité est inutilisable : le lecteur ne sait pas ce qu’il regarde (réflexe n° 5).'
        questions:
            -   id: q01
                type: qcm
                enonce: Pourquoi choisir un graphique en barres pour comparer les rotors ?
                choix:
                    -   id: a
                        texte: Pour comparer les hauteurs des barres d’un coup d’œil.
                    -   id: b
                        texte: Pour montrer une évolution dans le temps.
                    -   id: c
                        texte: Pour faire joli.
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: texte
                enonce: Écris le titre de ton graphique et le nom de son axe vertical.
                aide: « = » + fonction + plage.
    -   id: a03
        titre: Conclure
        transition: Le graphique est prêt. Il reste à conclure, chiffres à l’appui.
        contenu:
            -   type: paragraphe
                texte: 'Rappel des réflexes n° 4 et 5 : « car » + des valeurs avec leur unité.'
        questions:
            -   id: q01
                type: qcm
                enonce: D’après ton graphique, quel rotor produit la tension moyenne la plus élevée ?
                choix:
                    -   id: a
                        texte: Le rotor à 4 pales.
                    -   id: b
                        texte: Le rotor à 3 pales.
                    -   id: c
                        texte: Le rotor à 5 pales.
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: texte
                enonce: Plus de pales, est-ce toujours mieux ? Justifie avec les moyennes.
                aide: Pense à « car » (réflexe n° 4).
            -   id: q03
                type: texte
                enonce: Nos propres mesures de la séance 26 donnent-elles le même classement ? Compare.
                aide: Attendu ou observé ?
    -   id: a04
        titre: 'Défi : les vraies éoliennes'
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Les grandes éoliennes ont presque toutes 3 pales.
        questions:
            -   id: q01
                type: texte
                enonce: Cherche ou propose une raison pour laquelle on ne met pas plus de pales sur les grandes éoliennes.
                aide: Ton idée répond-elle au besoin ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as calculé, représenté et conclu. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment un tableur aide-t-il à comparer les rotors ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - =MOYENNE(B2:D2) calcule une moyenne.
    - Un graphique en barres compare des catégories ; il a un titre et des axes avec unité.
    - 'Plus de pales n’est pas toujours mieux : il faut mesurer pour le savoir.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
