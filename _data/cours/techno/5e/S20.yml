titre: 'Séance 20 : Une seconde vie pour un vieux lecteur CD ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Que devient un objet avant et après son utilisation, et comment lui donner une seconde vie ?
competences_bo:
    - Caractériser et choisir un objet ou un système technique selon différents critères
objectifs:
    connaissances:
        - 'Le cycle de vie d’un objet : extraction des matières premières, fabrication, transport, utilisation, fin de vie.'
        - En fin de vie, on peut réparer, réemployer (réutiliser une pièce telle quelle) ou recycler (refaire de la matière).
    competences:
        - Ranger les étapes du cycle de vie dans l’ordre.
        - Distinguer réemploi et recyclage.
        - Expliquer l’intérêt d’une seconde vie pour l’environnement.
pourquoi:
    - 'Notre éolienne cache une surprise : son moteur vient d’un vieux lecteur CD, et le ventilateur est alimenté par une alimentation d’ordinateur récupérée.'
    - Aujourd’hui, tu découvres le cycle de vie d’un objet et tu comprends pourquoi donner une seconde vie à ses pièces est utile.
activites:
    -   id: a01
        titre: Le cycle de vie
        consigne: Tu vas découvrir le cycle de vie d’un objet, avec l’exemple du lecteur CD. On attend les étapes du cycle de vie d’une gourde dans l’ordre.
        contenu:
            -   type: paragraphe
                texte: Un objet a une vie bien avant qu’on l’achète, et elle continue après qu’on ne s’en sert plus.
            -   type: tableau
                titre: 'Exemple expliqué : le cycle de vie d’un lecteur CD'
                colonnes:
                    - Étape
                    - Exemple pour un lecteur CD
                lignes:
                    -   - 1. Extraction des matières premières
                        - On extrait du pétrole (plastiques) et des métaux (cuivre, fer).
                    -   - 2. Fabrication
                        - On fabrique les pièces et on les assemble en usine.
                    -   - 3. Transport
                        - Le lecteur voyage en bateau et en camion jusqu’au magasin.
                    -   - 4. Utilisation
                        - On écoute des CD pendant des années (il consomme de l’électricité).
                    -   - 5. Fin de vie
                        - Il est jeté, recyclé… ou réemployé.
            -   type: etapes
                elements:
                    - 'Lis l’exemple du lecteur CD : de l’extraction des matières à la fin de vie.'
                    - Pour la gourde, cherche quelle étape vient en premier.
                    - Numérote les étapes de 1 à 4.
            -   type: paragraphe
                texte: Pourquoi le cycle de vie ? Un objet a un impact bien avant qu’on l’achète, et encore après qu’on le jette.
        questions:
            -   id: q01
                type: tableau
                enonce: Range ces étapes du cycle de vie d’une gourde en métal dans l’ordre (écris le numéro de 1 à 4).
                colonnes:
                    - Étape
                    - Numéro
                lignes:
                    -   - On remplit la gourde tous les jours pendant 5 ans.
                        - ''
                    -   - On extrait le minerai de fer de la mine.
                        - ''
                    -   - On la dépose dans le bac à métaux.
                        - ''
                    -   - L’usine la fabrique.
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
    -   id: a02
        titre: Réemployer ou recycler ?
        transition: 'Tu connais les étapes. À la fin de vie, il existe plusieurs chemins : regardons celui choisi pour notre éolienne.'
        consigne: Tu vas distinguer réemploi et recyclage, avec les pièces réemployées dans notre éolienne (document 1). On attend le bon mot pour le moteur et pour chaque cas.
        contenu:
            -   type: paragraphe
                texte: Recycler, c’est transformer un objet en matière pour en fabriquer un autre (fondre un métal, broyer un plastique). Réemployer, c’est réutiliser l’objet ou une pièce tel quel, pour le même usage ou un autre.
            -   type: tableau
                titre: Document 1 — Les pièces réemployées dans notre éolienne
                colonnes:
                    - Pièce récupérée
                    - Ancien usage
                    - Nouvel usage dans notre éolienne
                lignes:
                    -   - Moteur du lecteur CD
                        - Faire tourner le CD
                        - Produire de l’électricité quand les pales le font tourner
                    -   - Alimentation d’ordinateur (ATX)
                        - Alimenter un ordinateur
                        - Alimenter le ventilateur qui fait le vent
            -   type: etapes
                elements:
                    - Lis les deux définitions.
                    - 'Pour chaque cas, demande-toi : réutilise-t-on l’objet tel quel, ou le transforme-t-on en matière ?'
                    - Écris « réemploi » ou « recyclage ».
            -   type: paragraphe
                texte: Pourquoi distinguer ? Le réemploi évite de fabriquer quoi que ce soit ; le recyclage demande encore de l’énergie pour transformer la matière.
        questions:
            -   id: q01
                type: qcm
                enonce: Le moteur du lecteur CD dans notre éolienne est-il recyclé ou réemployé ?
                choix:
                    -   id: a
                        texte: 'Réemployé : il est réutilisé tel quel.'
                    -   id: b
                        texte: 'Recyclé : il a été fondu.'
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: tableau
                enonce: Pour chaque cas, écris « réemploi » ou « recyclage ».
                colonnes:
                    - Cas
                    - Réemploi ou recyclage ?
                lignes:
                    -   - Des bouteilles en plastique broyées pour faire une polaire
                        - ''
                    -   - Un vieux pot de confiture qui sert de pot à crayons
                        - ''
                    -   - Des canettes fondues pour faire des pièces de vélo
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
    -   id: a03
        titre: Pourquoi c’est utile ?
        transition: Tu sais distinguer réemploi et recyclage. Il reste à comprendre pourquoi c’est utile.
        consigne: Tu vas expliquer pourquoi réemployer le moteur d’un lecteur CD dans l’éolienne est bon pour l’environnement. On attend une explication avec « car » et les étapes évitées.
        contenu:
            -   type: paragraphe
                texte: 'Rappel du réflexe brevet n° 4 : « car » + un fait précis.'
            -   type: etapes
                elements:
                    - Relis les étapes du cycle de vie.
                    - Cherche celles qu’on n’a pas besoin de refaire grâce au réemploi.
                    - Explique avec « car ».
            -   type: paragraphe
                texte: 'Pourquoi le moteur du lecteur CD ? C’est un exemple réel de notre classe : un objet jeté a eu une seconde vie.'
        questions:
            -   id: q01
                type: texte
                enonce: Explique pourquoi réemployer le moteur du lecteur CD est bon pour l’environnement. Pense aux étapes du cycle de vie qu’on évite.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Chez toi, un objet est peut-être cassé ou inutilisé.
        questions:
            -   id: q01
                type: texte
                enonce: Propose une seconde vie pour un objet ou une pièce de ta maison.
                aide: Une idée réaliste + « Cela permet de… ».
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as découvert le cycle de vie et la seconde vie des pièces. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : que devient un objet avant et après son utilisation, et comment lui donner une seconde vie ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Cycle de vie : extraction, fabrication, transport, utilisation, fin de vie.'
    - 'Réemployer : réutiliser tel quel. Recycler : refaire de la matière.'
    - Réemployer évite des étapes du cycle de vie et économise des ressources.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
