titre: Quelles pales choisir pour notre besoin ?
theme: Comparer des solutions d’énergie
problematique: Quelles pales choisir pour notre besoin ?
pourquoi: Comparer des solutions selon plusieurs critères.
application: "On choisit une pièce selon le besoin et les critères importants, pas seulement selon son apparence."
lien_precedent: "Après S19 — Comment comparer deux essais d’éolienne ?, nous poursuivons avec un seul objectif : comparer des solutions selon plusieurs critères."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: paragraphe
            texte: Trois propositions fictives de pales sont comparées pour une maquette. Le choix doit respecter un budget de 8 € et permettre le remplacement d’une pale seule.
          - type: tableau
            colonnes:
                - Solution
                - Prix
                - Masse
                - Remplacement
            lignes:
                - - A
                  - 6 €
                  - 30 g
                  - Chaque pale séparée
                - - B
                  - 7 €
                  - 20 g
                  - Rotor entier
                - - C
                  - 9 €
                  - 18 g
                  - Chaque pale séparée
          - type: paragraphe
            texte: "Exemple guidé : si l’objectif est d’obtenir une tension stable, la pale qui tourne le plus vite n’est pas automatiquement la meilleure. Je compare les solutions avec le même protocole, puis je choisis selon le critère annoncé."
      questions:
          - id: q01
            type: texte
            enonce: Quelle solution respecte le prix maximal et le remplacement séparé ?
            aide: Vérifie les deux critères pour chaque ligne.
          - id: q02
            type: texte
            enonce: Pourquoi choisir uniquement la pale la plus légère ne suffit-il pas ?
            aide: Commence par les exigences annoncées.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - Créer une grille de choix avec les deux exigences obligatoires.
          - Éliminer les propositions non conformes avant de comparer la masse.
          - Dessiner un assemblage démontable et expliquer le lien avec la réparation.
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: Décrire ton assemblage démontable et un avantage pour la maintenance.
            aide: Comparer une fixation démontable et un collage permanent.
      ressources:
          - type: paragraphe
            texte: Rechercher dans le guide la source, le convertisseur et une limite d’une énergie renouvelable.
          - type: lien
            titre: ADEME — Les clés de l’énergie
            url: https://mtaterre.fr/wp-content/uploads/2024/01/2024-01-cles-energie-guide-version-nationale.pdf
    - id: a03
      titre: 3. Explique avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Une pale est recyclable mais l’ensemble doit être jeté à chaque casse. Quel autre critère faut-il examiner ?
            aide: Raisonner sur le cycle de vie entier.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Un choix technique se fait à partir de critères liés au besoin."
    - "Comparer des solutions selon plusieurs critères."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Un choix technique se fait à partir de critères liés au besoin."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Comparer des solutions selon plusieurs critères."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : On choisit une pièce selon le besoin et les critères importants, pas seulement selon son apparence."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
