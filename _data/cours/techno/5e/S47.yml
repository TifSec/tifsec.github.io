titre: 'Séance 47 : Impress n° 1 : préparer la revue de projet'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment préparer un diaporama clair pour présenter notre amélioration du tracker ?
competences_bo:
    - Imaginer, concevoir et réaliser une ou des solutions en réponse à un besoin, à des exigences (de développement durable, par exemple) ou à la nécessité d’améliorations dans une démarche de créativité
objectifs:
    connaissances:
        - 'Un diaporama accompagne un oral : une idée par diapositive, peu de texte, des images et des résultats.'
        - 'Dans Impress (ou PowerPoint) : nouvelle diapositive, mise en page titre + contenu, insérer une image ou un tableau.'
    competences:
        - Créer un diaporama de 3 à 5 diapositives.
        - Choisir ce qu’on met sur chaque diapositive.
        - Préparer ce qu’on va dire.
pourquoi:
    - De la séance 43 à la séance 46, ton groupe a choisi, programmé et testé une amélioration du tracker.
    - La revue de projet aura lieu en séance 48. Aujourd’hui, vous préparez le diaporama. Le fichier reste sur l’ordinateur ; sur le site, tu réponds sur la méthode.
activites:
    -   id: a01
        titre: Le plan du diaporama
        consigne: Tu vas préparer le plan du diaporama de la revue de projet, à partir du document 1. On attend ce que l’on met sur une diapositive et le contenu de ta diapositive 2.
        contenu:
            -   type: tableau
                titre: Document 1 — Plan conseillé
                colonnes:
                    - Diapositive
                    - Contenu
                lignes:
                    -   - '1'
                        - 'Titre : notre amélioration du tracker + noms du groupe'
                    -   - '2'
                        - 'Le problème et notre amélioration (A, B ou C) : pourquoi elle est utile'
                    -   - '3'
                        - Notre modification du programme (capture ou phrase « si … alors »)
                    -   - '4'
                        - 'Nos tests : tableau attendu / observé'
                    -   - '5'
                        - 'Conclusion : ça marche ? ce qu’on améliorerait'
            -   type: etapes
                elements:
                    - Lis le plan conseillé du document 1.
                    - 'Retiens : une idée par diapositive.'
                    - Écris le titre et la phrase principale de la diapositive 2.
            -   type: paragraphe
                texte: Pourquoi un plan ? Il évite d’oublier une partie et donne un ordre logique à la présentation.
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 1, que met-on sur une diapositive ?
                choix:
                    -   id: a
                        texte: Une idée, avec peu de texte et une image ou un tableau.
                    -   id: b
                        texte: Tout ce qu’on va dire, en entier.
                    -   id: c
                        texte: Le plus d’animations possible.
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: texte
                enonce: Écris le titre de votre diapositive 2 et la phrase principale qu’elle contiendra.
                aide: Combien d’éléments sont demandés ?
    -   id: a02
        titre: Réaliser le diaporama
        transition: Vous avez un plan. Réalisez maintenant les diapositives.
        consigne: Tu vas réaliser le diaporama de la revue de projet dans Impress. On attend les menus utilisés et l’intérêt de montrer vos résultats de tests.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Impress et enregistre sous 5e_S47_groupe.odp.
                    - 'Diapositive 1 : mise en page « Diapo de titre ».'
                    - Ajoute les diapositives 2 à 5 (Diapo > Nouvelle diapo), mise en page « Titre, contenu ».
                    - Insère sur la diapositive 4 un tableau avec vos résultats de tests (Insertion > Tableau).
                    - Vérifie que le texte est assez gros pour être lu du fond de la salle.
                    - Enregistre (Ctrl + S).
            -   type: paragraphe
                texte: 'Rappel de la séance 11 : une image a toujours une légende ; ici, un titre de diapositive peut jouer ce rôle.'
        questions:
            -   id: q01
                type: tableau
                enonce: Associe chaque action à son menu dans Impress.
                colonnes:
                    - Action
                    - Menu
                lignes:
                    -   - Ajouter une diapositive
                        - ''
                    -   - Insérer un tableau
                        - ''
                    -   - Choisir la mise en page
                        - ''
                aide: Ligne × colonne.
            -   id: q02
                type: texte
                enonce: Pourquoi mettre vos résultats de tests dans le diaporama ?
                aide: Attendu ou observé ?
    -   id: a03
        titre: Préparer l’oral
        transition: Le diaporama est prêt. Il reste à préparer ce que chacun dira.
        consigne: Tu vas préparer ce que tu diras à l’oral pendant la revue de projet. On attend tes deux idées et une question prévue avec sa réponse.
        contenu:
            -   type: paragraphe
                texte: 'Chaque membre du groupe présente au moins une diapositive. On ne lit pas l’écran : on explique en regardant le public.'
            -   type: etapes
                elements:
                    - Choisis la diapositive que tu présenteras.
                    - Écris deux idées à dire, sans lire l’écran.
                    - Imagine une question du public et prépare la réponse.
            -   type: paragraphe
                texte: Pourquoi préparer une question ? Une réponse préparée rassure et montre que vous maîtrisez votre projet.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle diapositive vas-tu présenter ? Écris les deux idées que tu diras.
                aide: Combien d’éléments sont demandés ?
            -   id: q02
                type: texte
                enonce: Prévois une question que le public pourrait vous poser, et votre réponse.
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Impress propose des transitions entre diapositives.
        questions:
            -   id: q01
                type: texte
                enonce: Faut-il mettre beaucoup d’animations dans un diaporama de revue de projet ? Explique.
                aide: Pense à « car » (réflexe n° 4).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Le diaporama et l’oral sont préparés. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment préparer un diaporama clair pour présenter votre amélioration ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - Une idée par diapositive, peu de texte, des preuves (tests).
    - On présente en regardant le public, sans lire l’écran.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
