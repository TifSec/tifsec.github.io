titre: Présenter une amélioration avec des preuves
theme: Améliorer, réaliser et valider une solution numérique
problematique: Présenter une amélioration avec des preuves
pourquoi: Comparer deux versions et expliquer une limite.
application: "Comparer deux versions avec les mêmes essais permet de montrer un progrès réel."
lien_precedent: "Après S46 — Réaliser puis chercher un défaut, nous poursuivons avec un seul objectif : comparer deux versions et expliquer une limite."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: paragraphe
            texte: "La présentation dure deux minutes par groupe : problème de départ, modification, résultat du même test avant/après et limite restante. Chaque participant explique une partie."
          - type: tableau
            colonnes:
                - Avant
                - Après
            lignes:
                - - Version et résultat du test
                  - Version et résultat du même test
          - type: paragraphe
            texte: "Exemple guidé : je compare l’ancienne et la nouvelle version avec le même test. Je montre une preuve du changement, puis je précise ce que je n’ai pas encore testé."
      questions:
          - id: q01
            type: texte
            enonce: Quel problème de départ ta présentation doit-elle rappeler ?
            aide: Le public ne connaît pas toute l’histoire du projet.
          - id: q02
            type: texte
            enonce: Quelle preuve compares-tu entre l’avant et l’après ?
            aide: Comparer une préférence n’est pas comparer un résultat d’essai.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - "Préparer un support unique : un dessin, une capture sans données personnelles ou une courte démonstration."
          - Présenter à un autre groupe et écouter sa question.
          - Corriger une phrase ou une étape de la notice à partir de cette question.
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: Rédiger le bilan de l’amélioration avec un résultat et une limite.
            aide: Une limite n’annule pas un résultat correctement établi.
      ressources:
          - type: paragraphe
            texte: Rechercher un mot-clé précis sur la ressource publique, puis noter le titre et l’organisme de la page utile.
          - type: lien
            titre: Éduscol — Ressources de Technologie
            url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
    - id: a03
      titre: 3. Explique avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Quelle question du public t’a aidé à améliorer ton explication ? Décrire le changement.
            aide: L’objectif est de rendre le fonctionnement compréhensible.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Une comparaison valable utilise les mêmes conditions avant et après."
    - "Comparer deux versions et expliquer une limite."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Une comparaison valable utilise les mêmes conditions avant et après."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Comparer deux versions et expliquer une limite."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : Comparer deux versions avec les mêmes essais permet de montrer un progrès réel."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
