titre: Présenter une amélioration avec des preuves
theme: Améliorer, réaliser et valider une solution numérique
problematique: Présenter une amélioration avec des preuves
pourquoi: Comparer deux versions et expliquer une limite.
application: Une méthode technique sert à expliquer, choisir et améliorer les outils du quotidien.
lien_precedent: "Après S46 — Réaliser puis chercher un défaut, nous poursuivons avec un seul objectif : comparer deux versions et expliquer une limite."
activites:
    - id: a01
      titre: Comprendre le document
      pourquoi: Comparer deux versions et expliquer une limite.
      demarche:
          - Lire le document et repérer les mots utiles.
          - Répondre aux deux questions avec une information du document.
      contenu:
          - type: paragraphe
            texte: "La présentation dure deux minutes par groupe : problème de départ, modification, résultat du même test avant/après et limite restante. Chaque participant explique une partie."
          - type: tableau
            colonnes:
                - Avant
                - Après
            lignes:
                - - Version et résultat du test
                  - Version et résultat du même test
      questions:
          - id: q01
            type: texte
            enonce: Quel problème de départ ta présentation doit-elle rappeler ?
            aide: Le public ne connaît pas toute l’histoire du projet.
          - id: q02
            type: texte
            enonce: Quelle preuve compares-tu entre l’avant et l’après ?
            aide: Comparer une préférence n’est pas comparer un résultat d’essai.
    - id: a02
      titre: Faire, chercher et tester
      pourquoi: Mettre l’idée à l’épreuve plutôt que recopier une définition.
      demarche:
          - "Préparer un support unique : un dessin, une capture sans données personnelles ou une courte démonstration."
          - Présenter à un autre groupe et écouter sa question.
          - Corriger une phrase ou une étape de la notice à partir de cette question.
      contenu:
          - type: paragraphe
            texte: "Travaille au brouillon, dans le logiciel ou sur le schéma. Garde une trace d’essai : situation, résultat attendu et observation. En binôme, échangez les rôles au milieu du travail."
      questions:
          - id: q01
            type: texte
            enonce: Rédiger le bilan de l’amélioration avec un résultat et une limite.
            aide: Une limite n’annule pas un résultat correctement établi.
      ressources:
          - type: paragraphe
            texte: Rechercher un mot-clé précis sur la ressource publique, puis noter le titre et l’organisme de la page utile.
          - type: lien
            titre: Éduscol — Ressources de Technologie
            url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
    - id: a03
      titre: Expliquer ce que le test permet de conclure
      pourquoi: Relier sa réponse à une donnée et préciser une limite.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Quelle question du public t’a aidé à améliorer ton explication ? Décrire le changement.
            aide: L’objectif est de rendre le fonctionnement compréhensible.
    - id: a04
      titre: Conserver et retenir
      pourquoi: Finir avec une trace réutilisable.
      demarche:
          - Vérifier le nom du projet ou de la trace.
          - Noter au brouillon une erreur corrigée ou une étape à reprendre.
      contenu: []
      questions: []
retenir:
    - Comparer deux versions et expliquer une limite.
    - Une amélioration répond à un problème observé et à un critère explicite.
    - La validation indique les cas testés et les limites restantes.
bilan: Je conserve une trace qui montre ce que j’ai compris ou testé. Une erreur expliquée et corrigée est un progrès observable.
introduction:
    - type: paragraphe
      texte: "Objectif du jour : Comparer deux versions et expliquer une limite."
    - type: paragraphe
      texte: "Séance de 50 minutes de travail effectif : lire et comprendre, réaliser ou chercher, tester, puis faire un bilan. Les essais font partie du travail ; une version simple suffit pour commencer."
    - type: liste
      elements:
          - Une amélioration répond à un problème observé et à un critère explicite.
          - Conserver les versions et comparer des essais identiques aide à expliquer un changement.
          - La validation indique les cas testés et les limites restantes.
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
