titre: 'Séance 39 : Pourquoi les objets tombent-ils en panne ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Pourquoi les objets tombent-ils en panne, et comment savoir s’ils seront faciles à réparer ?
competences_bo:
    - Identifier un dysfonctionnement d’un objet technique et y remédier
objectifs:
    connaissances:
        - Une panne peut venir de l’usure, d’un choc, d’une mauvaise utilisation, d’un défaut de fabrication ou d’une pièce qui n’est plus fabriquée.
        - La fiabilité, c’est la capacité d’un objet à fonctionner sans panne ; la durabilité, c’est sa capacité à durer longtemps, en étant entretenu et réparé.
        - L’indice de réparabilité (sur 10) tient compte de la notice, de la facilité de démontage, de la disponibilité et du prix des pièces.
    competences:
        - Classer les causes de pannes.
        - Expliquer ce qui rend un objet réparable.
        - Proposer des gestes pour faire durer un objet.
pourquoi:
    - En séance 21, tu as lu l’indice de réparabilité d’un aspirateur. En séance 20, tu as vu qu’un objet qui dure longtemps a moins d’impact sur l’environnement.
    - Aujourd’hui, tu cherches pourquoi les objets tombent en panne. C’est le début de la séquence « Je dépanne ».
activites:
    -   id: a01
        titre: Les causes des pannes
        consigne: Tu vas découvrir les causes fréquentes des pannes, avec l’exemple expliqué. On attend la cause probable de chaque panne.
        contenu:
            -   type: tableau
                titre: 'Exemple expliqué : cinq causes de pannes'
                colonnes:
                    - Cause
                    - Exemple
                lignes:
                    -   - Usure
                        - Les patins de frein d’un vélo s’usent à force de freiner.
                    -   - Choc
                        - Un téléphone tombe et son écran se fissure.
                    -   - Mauvaise utilisation
                        - On force sur une fermeture éclair coincée.
                    -   - Défaut de fabrication
                        - Une soudure mal faite dans un appareil neuf.
                    -   - Pièce plus fabriquée
                        - Une imprimante dont la cartouche n’existe plus.
            -   type: etapes
                elements:
                    - Lis les cinq causes de pannes.
                    - Pour chaque panne, cherche la cause qui l’explique.
                    - Écris-la.
            -   type: paragraphe
                texte: Pourquoi connaître les causes ? Savoir pourquoi un objet tombe en panne aide à l’éviter et à le réparer.
        questions:
            -   id: q01
                type: tableau
                enonce: Pour chaque panne, écris sa cause probable.
                colonnes:
                    - Panne
                    - Cause probable
                lignes:
                    -   - Les poils d’une brosse à dents sont écrasés après 6 mois.
                        - ''
                    -   - Une manette ne marche plus après être tombée dans les escaliers.
                        - ''
                    -   - 'Un ventilateur de 15 ans ne peut pas être réparé : son moteur n’est plus vendu.'
                        - ''
                aide: Ligne × colonne.
    -   id: a02
        titre: Réparable ou pas ?
        transition: 'Tu connais les causes de pannes. Certains objets se réparent facilement, d’autres non : qu’est-ce qui fait la différence ?'
        consigne: Tu vas apprendre ce que mesure l’indice de réparabilité, avec le document 1. On attend une explication tirée du document et la maquette facile à réparer.
        contenu:
            -   type: tableau
                titre: Document 1 — Ce que mesure l’indice de réparabilité
                colonnes:
                    - Critère de l’indice
                    - Question
                lignes:
                    -   - Documentation
                        - Existe-t-il une notice de réparation ?
                    -   - Démontage
                        - Peut-on ouvrir l’objet avec des outils simples (pas de colle) ?
                    -   - Pièces détachées
                        - Peut-on acheter les pièces, et pendant combien d’années ?
                    -   - Prix des pièces
                        - Une pièce coûte-t-elle beaucoup moins cher qu’un objet neuf ?
            -   type: etapes
                elements:
                    - Lis le document 1.
                    - Compare un écran collé et un écran vissé.
                    - Pense aux pièces que le collège peut refaire lui-même.
            -   type: paragraphe
                texte: Pourquoi un indice ? Il permet de savoir, avant d’acheter, si l’objet pourra être réparé.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, explique pourquoi un téléphone dont l’écran est collé est moins réparable qu’un téléphone dont l’écran est vissé.
                aide: « D’après le document… » (réflexe n° 2).
            -   id: q02
                type: qcm
                enonce: Quelle maquette du collège est facile à réparer parce que ses pièces sont imprimées en 3D au collège ?
                choix:
                    -   id: a
                        texte: L’éolienne (et le tracker).
                    -   id: b
                        texte: Aucune.
                    -   id: c
                        texte: Le téléphone du professeur.
                aide: Relis l’exemple expliqué.
    -   id: a03
        titre: Faire durer
        transition: Un objet réparable peut durer plus longtemps. Toi aussi, tu peux agir pour faire durer tes objets.
        consigne: Tu vas proposer des gestes pour faire durer un objet que tu utilises. On attend trois gestes expliqués.
        contenu:
            -   type: paragraphe
                texte: 'Rappel de la séance 20 : faire durer un objet évite d’extraire des matières et de fabriquer un objet neuf.'
            -   type: etapes
                elements:
                    - Choisis un objet de tous les jours.
                    - Pour chaque geste, demande-toi quelle panne il évite.
                    - Explique chaque geste.
            -   type: paragraphe
                texte: Pourquoi faire durer ? Chaque objet qui dure évite d’en fabriquer un neuf (séance 20).
        questions:
            -   id: q01
                type: texte
                enonce: Propose trois gestes pour faire durer un objet que tu utilises (téléphone, vélo, ordinateur…), et explique chacun.
                aide: Pense à « car » (réflexe n° 4).
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: On parle d’« obsolescence » quand un objet devient inutilisable trop tôt.
        questions:
            -   id: q01
                type: texte
                enonce: Cherche un exemple d’objet qui devient inutilisable alors qu’il fonctionne encore (mise à jour impossible, pièce introuvable…). Que pourrait-on faire ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as étudié les causes et la réparabilité. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : pourquoi les objets tombent-ils en panne, et comment savoir s’ils seront faciles à réparer ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Causes de pannes : usure, choc, mauvaise utilisation, défaut, pièce introuvable.'
    - 'Un objet réparable : notice, démontage simple, pièces disponibles et peu chères.'
    - Faire durer un objet réduit son impact sur l’environnement.
sources:
