titre: Quand faut-il arrêter de remplir ?
theme: Concevoir une cuve intelligente simulée
problematique: Quand faut-il arrêter de remplir ?
pourquoi: Modifier une règle liée à une limite.
application: "Une alerte de niveau peut prévenir un débordement dans un système de collecte."
lien_precedent: "Après S34 — Quelles informations faut-il à la cuve ?, nous poursuivons avec un seul objectif : modifier une règle liée à une limite."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: paragraphe
            texte: "Maquette numérique : niveau est une valeur simulée entre 0 et 100. Pour apprendre à programmer, le seuil haut est fixé à 80. Ce nombre pédagogique n’est pas un seuil sanitaire ni une consigne du futur matériel."
          - type: code
            texte: |-
                Au démarrage : niveau ← 0
                Bouton A : augmenter niveau de 10
                Bouton B : niveau ← 0
                Toujours : si niveau ≥ 80 afficher PLEIN, sinon afficher COLLECTE
          - type: paragraphe
            texte: "Exemple guidé avec un autre seuil : si le niveau atteint 60, l’écran affiche « presque pleine ». À 50, il affiche « collecte » ; à 60 et à 70, il affiche « presque pleine ». Je vérifie le seuil et les deux côtés."
      questions:
          - id: q01
            type: texte
            enonce: Quel état doit-on afficher pour le niveau 80 ?
            aide: Le symbole inclut-il l’égalité ?
          - id: q02
            type: texte
            enonce: Pourquoi le niveau 90 doit-il encore donner PLEIN ?
            aide: Compare ≥ 80 et = 80.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - Reconstituer le modèle dans MakeCode avec la variable niveau.
          - Utiliser des nombres ou icônes si le texte défile trop lentement.
          - Tester 70, 80 et 90, sans brancher de pompe.
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: Décrire les résultats des trois essais et la correction éventuelle de ton programme.
            aide: Teste avant le seuil, au seuil et après le seuil.
      ressources:
          - type: paragraphe
            texte: Dans la documentation, retrouver les blocs d’événement, variable et condition utilisés aujourd’hui.
          - type: lien
            titre: MakeCode micro:bit — Référence
            url: https://makecode.microbit.org/reference
          - type: lien
            titre: Ouvrir le simulateur MakeCode micro:bit
            url: https://makecode.microbit.org/
    - id: a03
      titre: 3. Explique avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Un programme n’arrête la collecte que pour niveau = 80. Quel risque de fonctionnement montre l’essai à 90 ?
            aide: Utilise les valeurs du document, sans parler de matériel non testé.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Le symbole ≥ signifie « supérieur ou égal » : le seuil est inclus."
    - "Modifier une règle liée à une limite."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Le symbole ≥ signifie « supérieur ou égal » : le seuil est inclus."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Modifier une règle liée à une limite."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : Une alerte de niveau peut prévenir un débordement dans un système de collecte."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
