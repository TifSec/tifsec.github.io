titre: 'Séance 35 : Que fait le programme du monte-charge ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Que fait le programme du monte-charge quand on appuie sur le bouton d’appel de l’étage ?
competences_bo:
    - Comprendre et modifier un programme associé à une fonctionnalité d’un objet ou d’un système technique
objectifs:
    connaissances:
        - 'Le programme du monte-charge utilise les mêmes types de blocs que ton jeu : un bloc « toujours », des conditions « si … alors », une fonction et une variable.'
        - Les données d’entrée viennent des boutons et des capteurs ; les données de sortie commandent le moteur, l’écran et les voyants.
    competences:
        - Lire un programme réel bloc par bloc (réflexe n° 9).
        - Repérer les données utilisées (entrées) et produites (sorties) par le programme.
pourquoi:
    - En séance 32, tu as écrit une condition « si … alors » dans ton jeu. En séance 33, tu as vu les constituants d’information du monte-charge.
    - 'Aujourd’hui, tu ouvres le vrai programme du monte-charge et tu retrouves les blocs de ton jeu. Le guidage est un peu plus léger : appuie-toi sur la méthode du réflexe n° 9.'
activites:
    -   id: a01
        titre: Retrouver les blocs du jeu
        contenu:
            -   type: paragraphe
                texte: Le professeur projette le programme dans MakeCode micro:bit. Voici une version simplifiée, en français, de ses parties principales (la fonction Descendre ressemble à Monter, vers le bas).
            -   type: code
                texte: "au démarrage\n    voyants Étage et RDC en orange\n    Etat = 0\n\ntoujours\n    écran : effacer\n    si (contact bas appuyé) ET (bouton Étage appuyé) alors\n        appeler Monter\n    si (contact haut appuyé) ET (bouton RDC appuyé) alors\n        appeler Descendre\n    écran : écrire « Attente »\n    voyants Étage et RDC en vert\n\nfonction Monter\n    Etat = 1\n    voyant Étage en rouge\n    écran : écrire « Appel Etage »\n    tant que (contact haut pas appuyé)\n        faire tourner le moteur vers l’avant à la vitesse 137\n        écran : écrire la distance mesurée par le capteur à ultrasons (cm)\n    freiner le moteur\n    écran : écrire « Stop Etage »\n    Etat = 0"
            -   type: paragraphe
                texte: 'Rappel du réflexe n° 9 : lis bloc par bloc, de haut en bas.'
        questions:
            -   id: q01
                type: tableau
                enonce: Associe chaque élément du programme du monte-charge à ce qu’il ressemble dans ton jeu Arcade.
                colonnes:
                    - Dans le monte-charge
                    - Dans mon jeu Arcade (séances 30 à 32)
                lignes:
                    -   - Le bloc « toujours »
                        - ''
                    -   - si … alors …
                        - ''
                    -   - La variable Etat
                        - ''
            -   id: q02
                type: qcm
                enonce: Que fait la carte quand rien n’est appuyé ?
                choix:
                    -   id: a
                        texte: Elle affiche « Attente » et met les voyants en vert.
                    -   id: b
                        texte: Elle fait monter la cabine.
                    -   id: c
                        texte: Elle éteint l’écran pour toujours.
        ressources:
            -   type: lien
                titre: MakeCode micro:bit (gratuit, dans le navigateur)
                url: https://makecode.microbit.org/
            -   type: lien
                titre: 'Éduscol — Édubase : le projet de monte-charge'
                url: https://edubase.eduscol.education.fr/fiche/24732
    -   id: a02
        titre: Entrées et sorties du programme
        transition: Tu as reconnu la structure du programme. Repère maintenant les données qu’il lit et celles qu’il produit.
        contenu:
            -   type: paragraphe
                texte: Une entrée est une donnée lue par le programme ; une sortie est une donnée produite pour commander un constituant.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Range chaque élément : entrée ou sortie du programme.'
                colonnes:
                    - Élément
                    - Entrée ou sortie ?
                lignes:
                    -   - Contact bas
                        - ''
                    -   - Bouton Étage
                        - ''
                    -   - Moteur
                        - ''
                    -   - Écran OLED
                        - ''
                    -   - Capteur à ultrasons
                        - ''
                    -   - Voyants
                        - ''
    -   id: a03
        titre: Prévoir le comportement
        transition: Tu sais ce qui entre et ce qui sort. Tu peux maintenant prévoir ce que fera le monte-charge.
        contenu:
            -   type: paragraphe
                texte: Prévoir, c’est dérouler le programme dans sa tête avant de tester.
        questions:
            -   id: q01
                type: texte
                enonce: La cabine est en bas. Un élève appuie sur le bouton Étage. Raconte ce que fait le programme, dans l’ordre, jusqu’à l’arrêt.
            -   id: q02
                type: qcm
                enonce: La cabine est déjà en haut. On appuie sur le bouton Étage. Que se passe-t-il ?
                choix:
                    -   id: a
                        texte: 'Rien : la condition demande que le contact bas soit appuyé.'
                    -   id: b
                        texte: La cabine monte encore et casse la maquette.
                    -   id: c
                        texte: La cabine descend.
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La variable Etat vaut 1 pendant la montée, -1 pendant la descente et 0 à l’arrêt.
        questions:
            -   id: q01
                type: texte
                enonce: À quoi pourrait servir cette variable si on voulait ajouter une nouvelle fonction ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as lu, analysé et prévu. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : que fait le programme quand on appuie sur le bouton d’appel de l’étage ?'
retenir:
    - Le programme lit des entrées (boutons, contacts, capteur) et commande des sorties (moteur, écran, voyants).
    - 'Mêmes blocs que dans le jeu : boucle « toujours », condition « si … alors », variable, fonction.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
