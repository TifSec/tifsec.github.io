titre: Comment retrouver une information et sa source ?
theme: Rechercher, conserver et partager une information
problematique: Comment retrouver une information et sa source ?
pourquoi: Mener une recherche ciblée et organiser une trace.
application: "Vérifier l’auteur et la date d’une page aide à éviter de reprendre une information douteuse."
lien_precedent: "Après S25 — PIX : retrouver mon parcours et ma méthode, nous poursuivons avec un seul objectif : mener une recherche ciblée et organiser une trace."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: paragraphe
            texte: Une information utile doit pouvoir être retrouvée. Pour une ressource sur l’éolienne ou l’eau, note son auteur ou organisme, son titre, son adresse et ce qu’elle permet de vérifier. Un résultat de recherche n’est pas automatiquement une preuve.
          - type: tableau
            colonnes:
                - Trace de recherche
                - Information conservée
            lignes:
                - - A
                  - « vu sur internet »
                - - B
                  - Organisme, titre, adresse, date de consultation et idée reformulée
          - type: paragraphe
            texte: "Exemple guidé : je cherche « fonctionnement d’un capteur de lumière micro:bit ». Je vérifie l’organisme qui publie la page, son titre et la date, puis je note l’information utile avec le lien pour pouvoir la retrouver."
      questions:
          - id: q01
            type: texte
            enonce: Quelle trace permettra le mieux de retrouver et de vérifier une information ? Pourquoi ?
            aide: Une adresse doit être accompagnée de son sens.
          - id: q02
            type: texte
            enonce: Donner deux mots-clés utilisés et expliquer ce qu’ils précisent dans ta recherche.
            aide: Évite une recherche trop générale comme « technologie ».
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - Chercher une information sur le vent ou l’eau avec deux mots-clés précis.
          - Comparer une ressource institutionnelle et une page commerciale.
          - Enregistrer une courte note dans un dossier nommé 5e_Technologie, avec un nom de fichier explicite.
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: Présenter une information trouvée avec sa source et la reformuler en une phrase.
            aide: Ne copie pas tout un paragraphe.
      ressources:
          - type: paragraphe
            texte: Rechercher un mot-clé précis sur la ressource publique, puis noter le titre et l’organisme de la page utile.
          - type: lien
            titre: Éduscol — Ressources de Technologie
            url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
    - id: a03
      titre: 3. Explique avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Pourquoi le nom « travail_final_final2 » est-il moins utile qu’un nom contenant sujet et séance ?
            aide: Pense à retrouver le fichier dans deux mois.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Une recherche fiable précise les mots-clés, la source et l’information retenue."
    - "Mener une recherche ciblée et organiser une trace."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Une recherche fiable précise les mots-clés, la source et l’information retenue."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Mener une recherche ciblée et organiser une trace."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : Vérifier l’auteur et la date d’une page aide à éviter de reprendre une information douteuse."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
