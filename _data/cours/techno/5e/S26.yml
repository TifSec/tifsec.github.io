titre: 'Séance 26 : Comment mesurer ce que produit l’éolienne ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Comment mesurer correctement la tension produite par l’éolienne pour comparer plusieurs rotors ?
competences_bo:
    - Caractériser et choisir un objet ou un système technique selon différents critères
    - Valider les solutions techniques par des simulations ou par des protocoles de tests
objectifs:
    connaissances:
        - Le multimètre utilisé en voltmètre mesure une tension électrique en volts (V).
        - Un protocole est une suite d’étapes à suivre pour que la mesure soit fiable et comparable.
        - On répète une mesure plusieurs fois et on ne change qu’une seule chose à la fois.
    competences:
        - Suivre un protocole fourni.
        - Relever une mesure avec son unité.
        - Ne changer qu’une seule chose à la fois dans un test (réflexe brevet n° 8).
pourquoi:
    - 'Notre éolienne a trois rotors interchangeables : à 3, 4 et 5 pales. Lequel produit le plus ?'
    - 'Pour le savoir, il faut mesurer, et bien mesurer. Aujourd’hui, chaque groupe fait une mesure au poste maquette ; toute la classe partage ensuite ses résultats. Sécurité : l’alimentation de l’éolienne se branche sur la prise du mur (230 V). Seul le professeur la branche et la débranche. On change un rotor seulement quand le ventilateur est arrêté.'
activites:
    -   id: a01
        titre: Le protocole
        consigne: Tu vas comprendre le protocole de mesure de la tension produite par l’éolienne (document 1). On attend deux explications sur les règles du protocole.
        contenu:
            -   type: tableau
                titre: Document 1 — Protocole de mesure
                colonnes:
                    - Étape
                    - Ce qu’on fait
                    - Pourquoi
                lignes:
                    -   - '1'
                        - Le professeur place le ventilateur à 20 cm de l’éolienne et le règle toujours à la même vitesse.
                        - Pour que le vent soit le même pour tous les rotors.
                    -   - '2'
                        - Ventilateur arrêté, on monte le rotor à tester.
                        - 'Sécurité : on ne touche jamais un rotor qui tourne.'
                    -   - '3'
                        - On règle le multimètre sur la position V (tension continue).
                        - Pour mesurer une tension en volts.
                    -   - '4'
                        - On allume le ventilateur et on attend 10 secondes.
                        - Pour que la vitesse de rotation soit stable.
                    -   - '5'
                        - On lit la tension et on la note avec son unité. On recommence 3 fois.
                        - Répéter permet de repérer une erreur et de faire une moyenne.
            -   type: citation
                texte: 'Réflexe brevet n° 8 : dans un test, je ne change qu’une seule chose à la fois (ici, le rotor). Tout le reste (distance, vitesse du ventilateur) reste identique.'
            -   type: paragraphe
                texte: 'Rappel de la séance 6 : prévoir, tester, comparer.'
            -   type: etapes
                elements:
                    - Lis le protocole du document 1.
                    - 'Lis le réflexe n° 8 : une seule chose change.'
                    - Pour chaque règle, demande-toi ce qui se passerait sans elle.
            -   type: paragraphe
                texte: 'Pourquoi un protocole ? Tous les groupes mesurent de la même façon : on peut alors comparer leurs résultats.'
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 1, pourquoi le ventilateur reste-t-il toujours à 20 cm ?
                choix:
                    -   id: a
                        texte: Pour que seul le rotor change entre deux mesures.
                    -   id: b
                        texte: Pour que les élèves voient mieux.
                    -   id: c
                        texte: Pour que le ventilateur chauffe moins.
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: qcm
                enonce: Pourquoi attend-on 10 secondes avant de lire la tension ?
                choix:
                    -   id: a
                        texte: Pour que la rotation soit stable.
                    -   id: b
                        texte: Pour laisser le multimètre refroidir.
                    -   id: c
                        texte: Pour économiser l’électricité.
                aide: Relis l’exemple expliqué.
        ressources:
            -   type: paragraphe
                texte: 'Sécurité : l’alimentation de l’éolienne se branche sur la prise du mur (230 V). Seul le professeur la branche et la débranche. On change un rotor seulement quand le ventilateur est arrêté.'
    -   id: a02
        titre: Mesurer (poste maquette)
        transition: Tu connais le protocole. C’est le moment de mesurer au poste maquette, groupe par groupe.
        consigne: Tu vas mesurer au poste maquette la tension produite par un rotor, puis exploiter des mesures d’exemple (document 2). On attend tes mesures avec leur unité, une moyenne et une explication.
        contenu:
            -   type: paragraphe
                texte: Chaque groupe passe au poste maquette pour mesurer un rotor. Pendant ce temps, les autres groupes travaillent sur les questions. Les résultats de toute la classe sont écrits au tableau.
            -   type: tableau
                titre: Document 2 — Exemple de mesures d’une autre classe (valeurs inventées pour l’exercice)
                colonnes:
                    - Rotor
                    - Mesure 1
                    - Mesure 2
                    - Mesure 3
                lignes:
                    -   - 3 pales
                        - 1,8 V
                        - 1,9 V
                        - 1,7 V
                    -   - 4 pales
                        - 2,2 V
                        - 2,4 V
                        - 2,3 V
                    -   - 5 pales
                        - 2,1 V
                        - 2,0 V
                        - 2,2 V
            -   type: paragraphe
                texte: 'Rappel du réflexe brevet n° 5 : écris l’unité.'
            -   type: etapes
                elements:
                    - Au poste maquette, suis le protocole et note tes trois mesures. Seul le professeur branche l’alimentation 230 V.
                    - Pour la moyenne, additionne les trois valeurs et divise par 3.
                    - Cherche pourquoi les mesures ne sont pas identiques.
            -   type: paragraphe
                texte: Pourquoi trois mesures ? Une mesure peut être un peu fausse ; la moyenne de plusieurs est plus fiable.
        questions:
            -   id: q01
                type: texte
                enonce: Recopie les trois mesures obtenues dans ta classe pour le rotor que ton groupe (ou un autre groupe) a mesuré, avec leur unité.
                aide: Attendu ou observé ?
            -   id: q02
                type: nombre
                enonce: D’après le document 2, quelle est la moyenne des trois mesures du rotor à 4 pales ?
                unite: V
                aide: Additionne les trois mesures, puis divise par 3.
            -   id: q03
                type: texte
                enonce: Dans le document 2, les trois mesures d’un même rotor ne sont pas identiques. Propose une raison.
                aide: Attendu ou observé ?
    -   id: a03
        titre: Conclure prudemment
        transition: Les mesures sont faites. Il reste à conclure, sans aller trop vite.
        consigne: Tu vas conclure prudemment sur le rotor qui produit le plus, avec le document 2. On attend une réponse justifiée par des valeurs.
        contenu:
            -   type: etapes
                elements:
                    - Compare les moyennes des trois rotors.
                    - Désigne le plus élevé.
                    - Justifie avec les valeurs et leur unité.
            -   type: paragraphe
                texte: 'Pourquoi « prudemment » ? Les écarts sont petits : il faut des valeurs pour pouvoir conclure.'
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 2, quel rotor produit la tension la plus élevée ? Justifie avec des valeurs.
                aide: « D’après le document… » (réflexe n° 2).
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un élève propose de mesurer en même temps un nouveau rotor ET une vitesse de ventilateur plus forte.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi sa mesure ne permettra-t-elle pas de savoir si le nouveau rotor est meilleur ?
                aide: Attendu ou observé ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as suivi un protocole, mesuré et comparé. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment mesurer correctement la tension produite pour comparer plusieurs rotors ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - Le multimètre en voltmètre mesure une tension en volts (V).
    - Un protocole rend les mesures fiables et comparables ; on répète et on fait la moyenne.
    - 'Réflexe brevet n° 8 : je ne change qu’une seule chose à la fois.'
sources:
