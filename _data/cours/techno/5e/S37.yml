titre: Comment donner priorité à une alerte ?
theme: Concevoir une cuve intelligente simulée
problematique: Comment donner priorité à une alerte ?
pourquoi: Lire l’ordre de décisions d’un programme.
application: Une cuve peut collecter une eau non potable et isoler une arrivée signalée suspecte dans un modèle.
lien_precedent: "Après S36 — Une eau claire est-elle forcément utilisable ?, nous poursuivons avec un seul objectif : lire l’ordre de décisions d’un programme."
activites:
    - id: a01
      titre: Comprendre le document
      pourquoi: Lire l’ordre de décisions d’un programme.
      demarche:
          - Lire le document et repérer les mots utiles.
          - Répondre aux deux questions avec une information du document.
      contenu:
          - type: paragraphe
            texte: "Pour notre affichage simulé, la priorité est : alerte active → ISOLEMENT ; sinon niveau ≥ 80 → PLEIN ; sinon → COLLECTE. Les états peuvent être représentés par 2, 1 et 0."
          - type: code
            texte: |-
                si alerte = 1 : état ← 2
                sinon si niveau ≥ 80 : état ← 1
                sinon : état ← 0
      questions:
          - id: q01
            type: texte
            enonce: Quel état doit-on obtenir pour niveau 20 et alerte 1 ?
            aide: La première règle est prioritaire.
          - id: q02
            type: texte
            enonce: Quel état doit-on obtenir pour niveau 90 et alerte 0 ?
            aide: La première condition est fausse ; examiner la suivante.
    - id: a02
      titre: Faire, chercher et tester
      pourquoi: Mettre l’idée à l’épreuve plutôt que recopier une définition.
      demarche:
          - Créer alerte et état dans une copie du projet.
          - Faire varier alerte avec A et B ; régler niveau dans le démarrage pour les essais.
          - Tester (niveau 20, alerte 1), (90, 0) puis (90, 1).
      contenu:
          - type: paragraphe
            texte: "Travaille au brouillon, dans le logiciel ou sur le schéma. Garde une trace d’essai : situation, résultat attendu et observation. En binôme, échangez les rôles au milieu du travail."
      questions:
          - id: q01
            type: texte
            enonce: Décrire le résultat pour niveau 90 et alerte 1, et expliquer quelle règle a priorité.
            aide: Lire les règles dans leur ordre.
      ressources:
          - type: paragraphe
            texte: Dans la documentation, retrouver les blocs d’événement, variable et condition utilisés aujourd’hui.
          - type: lien
            titre: MakeCode micro:bit — Référence
            url: https://makecode.microbit.org/reference
          - type: lien
            titre: Ouvrir le simulateur MakeCode micro:bit
            url: https://makecode.microbit.org/
    - id: a03
      titre: Expliquer ce que le test permet de conclure
      pourquoi: Relier sa réponse à une donnée et préciser une limite.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Pourquoi deux règles indépendantes qui écrivent chacune l’état peuvent-elles poser problème ?
            aide: Cherche si une seconde écriture peut effacer la première.
    - id: a04
      titre: Conserver et retenir
      pourquoi: Finir avec une trace réutilisable.
      demarche:
          - Vérifier le nom du projet ou de la trace.
          - Noter au brouillon une erreur corrigée ou une étape à reprendre.
      contenu: []
      questions: []
retenir:
    - Lire l’ordre de décisions d’un programme.
    - Une exigence exprime ce que la solution doit respecter et comment on pourra le vérifier.
    - Le projet gère une eau non potable ; un aspect clair ou une mesure isolée ne garantit pas la potabilité.
bilan: Je conserve une trace qui montre ce que j’ai compris ou testé. Une erreur expliquée et corrigée est un progrès observable.
introduction:
    - type: paragraphe
      texte: "Objectif du jour : Lire l’ordre de décisions d’un programme."
    - type: paragraphe
      texte: "Séance de 50 minutes de travail effectif : lire et comprendre, réaliser ou chercher, tester, puis faire un bilan. Les essais font partie du travail ; une version simple suffit pour commencer."
    - type: liste
      elements:
          - Une exigence exprime ce que la solution doit respecter et comment on pourra le vérifier.
          - Le programme reçoit des données et applique des règles ; il ne sait pas ce que les données ne décrivent pas.
          - Le projet gère une eau non potable ; un aspect clair ou une mesure isolée ne garantit pas la potabilité.
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
