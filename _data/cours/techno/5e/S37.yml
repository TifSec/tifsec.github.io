titre: Comment donner priorité à une alerte ?
theme: Concevoir une cuve intelligente simulée
problematique: Comment donner priorité à une alerte ?
pourquoi: Lire l’ordre de décisions d’un programme.
application: "Dans une alarme ou un système de sécurité, les alertes importantes doivent être traitées en priorité."
lien_precedent: "Après S36 — Une eau claire est-elle forcément utilisable ?, nous poursuivons avec un seul objectif : lire l’ordre de décisions d’un programme."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: paragraphe
            texte: "Pour notre affichage simulé, la priorité est : alerte active → ISOLEMENT ; sinon niveau ≥ 80 → PLEIN ; sinon → COLLECTE. Les états peuvent être représentés par 2, 1 et 0."
          - type: code
            texte: |-
                si alerte = 1 : état ← 2
                sinon si niveau ≥ 80 : état ← 1
                sinon : état ← 0
          - type: paragraphe
            texte: "Exemple guidé : si le niveau est trop haut, le programme doit d’abord afficher l’alerte et arrêter la collecte ; sinon, il affiche le niveau normal. L’ordre des décisions évite qu’un message ordinaire cache une alerte importante."
      questions:
          - id: q01
            type: texte
            enonce: Quel état doit-on obtenir pour niveau 20 et alerte 1 ?
            aide: La première règle est prioritaire.
          - id: q02
            type: texte
            enonce: Quel état doit-on obtenir pour niveau 90 et alerte 0 ?
            aide: La première condition est fausse ; examiner la suivante.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - Créer alerte et état dans une copie du projet.
          - Faire varier alerte avec A et B ; régler niveau dans le démarrage pour les essais.
          - Tester (niveau 20, alerte 1), (90, 0) puis (90, 1).
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: Décrire le résultat pour niveau 90 et alerte 1, et expliquer quelle règle a priorité.
            aide: Lire les règles dans leur ordre.
      ressources:
          - type: paragraphe
            texte: Dans la documentation, retrouver les blocs d’événement, variable et condition utilisés aujourd’hui.
          - type: lien
            titre: MakeCode micro:bit — Référence
            url: https://makecode.microbit.org/reference
          - type: lien
            titre: Ouvrir le simulateur MakeCode micro:bit
            url: https://makecode.microbit.org/
    - id: a03
      titre: 3. Explique avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Pourquoi deux règles indépendantes qui écrivent chacune l’état peuvent-elles poser problème ?
            aide: Cherche si une seconde écriture peut effacer la première.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "L’ordre des conditions peut donner la priorité à une alerte."
    - "Lire l’ordre de décisions d’un programme."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : L’ordre des conditions peut donner la priorité à une alerte."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Lire l’ordre de décisions d’un programme."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : Dans une alarme ou un système de sécurité, les alertes importantes doivent être traitées en priorité."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
