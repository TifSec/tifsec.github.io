titre: "Choisir et justifier : dossier énergie"
theme: Comparer des solutions d’énergie
problematique: "Choisir et justifier : dossier énergie"
pourquoi: Utiliser deux critères et une preuve chiffrée.
application: Les choix d’énergie dépendent du lieu, des besoins et des essais.
lien_precedent: "Après S23 — Comment une mesure peut-elle déclencher un affichage ?, nous poursuivons avec un seul objectif : utiliser deux critères et une preuve chiffrée."
activites:
    - id: a01
      titre: Comprendre le document
      pourquoi: Utiliser deux critères et une preuve chiffrée.
      demarche:
          - Lire le document et repérer les mots utiles.
          - Répondre aux deux questions avec une information du document.
      contenu:
          - type: paragraphe
            texte: "Dossier fictif. Une balise consomme de l’énergie la nuit ; on compare deux kits complets avec stockage. Exigences : coût ≤ 30 € et autonomie annoncée ≥ 3 nuits dans les conditions de test."
          - type: tableau
            colonnes:
                - Kit
                - Coût
                - Autonomie du test
            lignes:
                - - Solaire A
                  - 28 €
                  - 2 nuits
                - - Éolien B
                  - 30 €
                  - 4 nuits
                - - Solaire C
                  - 34 €
                  - 5 nuits
      questions:
          - id: q01
            type: texte
            enonce: Quel kit respecte les deux exigences du document ?
            aide: Teste les deux inégalités pour chaque kit.
          - id: q02
            type: texte
            enonce: Pourquoi A et C ne conviennent-ils pas tous les deux malgré un avantage chacun ?
            aide: Une exigence respectée ne compense pas automatiquement une exigence obligatoire manquée.
    - id: a02
      titre: Faire, chercher et tester
      pourquoi: Mettre l’idée à l’épreuve plutôt que recopier une définition.
      demarche:
          - Traiter le dossier seul pendant quinze minutes.
          - Comparer ensuite les critères utilisés avec un camarade.
          - Rédiger une conclusion puis une question à poser avant une installation réelle.
      contenu:
          - type: paragraphe
            texte: "Travaille au brouillon, dans le logiciel ou sur le schéma. Garde une trace d’essai : situation, résultat attendu et observation. En binôme, échangez les rôles au milieu du travail."
      questions:
          - id: q01
            type: texte
            enonce: Rédiger une recommandation avec les deux valeurs qui la justifient.
            aide: Écrire le choix puis les preuves.
      ressources:
          - type: paragraphe
            texte: Rechercher dans le guide la source, le convertisseur et une limite d’une énergie renouvelable.
          - type: lien
            titre: ADEME — Les clés de l’énergie
            url: https://mtaterre.fr/wp-content/uploads/2024/01/2024-01-cles-energie-guide-version-nationale.pdf
    - id: a03
      titre: Entraînement DNB — justifier avec une preuve
      pourquoi: Relier sa réponse à une donnée et préciser une limite.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu:
          - type: paragraphe
            texte: "Habitudes du DNB, adaptées à la 5e : dossier court, réponse rédigée et démarche explicite. Ce travail n’est pas un sujet officiel et n’exige pas les connaissances de troisième."
      questions:
          - id: q01
            type: texte
            enonce: Avant une installation, quelle limite des données faut-il signaler ?
            aide: Le document ne décrit pas tous les lieux possibles.
    - id: a04
      titre: Conserver et retenir
      pourquoi: Finir avec une trace réutilisable.
      demarche:
          - Vérifier le nom du projet ou de la trace.
          - Noter au brouillon une erreur corrigée ou une étape à reprendre.
      contenu: []
      questions: []
retenir:
    - Utiliser deux critères et une preuve chiffrée.
    - Une source fournit une énergie ; un convertisseur en change la forme.
    - Une solution est choisie pour un besoin et des contraintes, pas pour un seul avantage.
bilan: Je conserve une trace qui montre ce que j’ai compris ou testé. Une erreur expliquée et corrigée est un progrès observable.
introduction:
    - type: paragraphe
      texte: "Objectif du jour : Utiliser deux critères et une preuve chiffrée."
    - type: paragraphe
      texte: "Séance de 50 minutes de travail effectif : lire et comprendre, réaliser ou chercher, tester, puis faire un bilan. Les essais font partie du travail ; une version simple suffit pour commencer."
    - type: liste
      elements:
          - Une source fournit une énergie ; un convertisseur en change la forme.
          - Une comparaison doit préciser la grandeur, l’unité et les conditions des essais.
          - Une solution est choisie pour un besoin et des contraintes, pas pour un seul avantage.
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
    - type: paragraphe
      texte: Les habitudes de rédaction et de justification prennent appui sur le cadre publié pour le DNB à compter de 2027. Le format devra être revérifié avant votre propre session.
    - type: lien
      titre: Éduscol — Épreuves et sujets de référence du DNB
      url: https://eduscol.education.gouv.fr/5607/les-epreuves-du-dnb
