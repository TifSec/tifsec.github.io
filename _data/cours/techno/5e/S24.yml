titre: 'Séance 24 : Comment notre éolienne produit-elle de l’électricité ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Par quels constituants l’énergie passe-t-elle dans notre éolienne, de la prise du mur jusqu’à l’électricité produite ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - Une chaîne d’énergie montre le chemin de l’énergie dans un objet, de constituant en constituant.
        - 'Un moteur électrique peut fonctionner « à l’envers » : quand on le fait tourner, il produit de l’électricité. On l’appelle alors une génératrice.'
    competences:
        - Identifier les constituants de la chaîne d’énergie de l’éolienne (organisation fournie).
        - Compléter un schéma bloc avec les bons mots (réflexe brevet n° 7).
pourquoi:
    - En séance 20, tu as appris que notre éolienne réemploie un moteur de lecteur CD et une alimentation d’ordinateur.
    - 'Aujourd’hui, le professeur la met en marche. Tu vas suivre le chemin de l’énergie, constituant après constituant. Sécurité : l’alimentation de l’éolienne se branche sur la prise du mur (230 V). Seul le professeur la branche et la débranche. On change un rotor seulement quand le ventilateur est arrêté.'
activites:
    -   id: a01
        titre: Observer la démonstration
        consigne: Tu vas observer la démonstration de notre éolienne et identifier ses constituants avec le document 1. On attend le constituant qui produit l’électricité et celui qui remplace le vent.
        contenu:
            -   type: paragraphe
                texte: 'Démonstration : le professeur branche l’alimentation, allume le ventilateur, et l’éolienne se met à tourner. Un multimètre branché sur le moteur de CD affiche une tension en volts (V) : de l’électricité est produite.'
            -   type: tableau
                titre: Document 1 — Les constituants de notre éolienne
                colonnes:
                    - Constituant
                    - Ce qu’il fait
                lignes:
                    -   - Prise du mur
                        - Fournit l’électricité du réseau (230 V).
                    -   - Alimentation d’ordinateur (ATX)
                        - Transforme le 230 V en une tension plus faible (12 V) pour le ventilateur.
                    -   - Ventilateur de tour PC
                        - 'Fait tourner son hélice et souffle de l’air : c’est notre « vent ».'
                    -   - Rotor (pales)
                        - Le vent pousse les pales, qui font tourner l’axe.
                    -   - Moteur de lecteur CD (génératrice)
                        - Entraîné par l’axe, il produit une tension électrique.
            -   type: etapes
                elements:
                    - 'Observe : le professeur branche l’alimentation, le ventilateur souffle, l’éolienne tourne.'
                    - Lis le document 1.
                    - Associe chaque constituant à ce que tu as vu. Seul le professeur branche l’alimentation 230 V.
            -   type: paragraphe
                texte: 'Pourquoi un ventilateur ? En classe, il n’y a pas de vent : le ventilateur le remplace pour que l’on puisse faire des essais.'
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 1, quel constituant produit l’électricité à la sortie de l’éolienne ?
                choix:
                    -   id: a
                        texte: Le moteur de lecteur CD, utilisé en génératrice.
                    -   id: b
                        texte: Le ventilateur.
                    -   id: c
                        texte: Les pales.
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: qcm
                enonce: Dans notre maquette, quel constituant remplace le vent naturel ?
                choix:
                    -   id: a
                        texte: Le ventilateur de tour PC.
                    -   id: b
                        texte: L’alimentation ATX.
                    -   id: c
                        texte: Le multimètre.
                aide: Relis l’exemple expliqué.
        ressources:
            -   type: paragraphe
                texte: 'Sécurité : l’alimentation de l’éolienne se branche sur la prise du mur (230 V). Seul le professeur la branche et la débranche. On change un rotor seulement quand le ventilateur est arrêté.'
    -   id: a02
        titre: Le schéma bloc de la chaîne d’énergie
        transition: 'Tu as vu les constituants. Il faut maintenant les ranger dans l’ordre du chemin de l’énergie : c’est le schéma bloc.'
        consigne: Tu vas compléter le schéma bloc de la chaîne d’énergie de l’éolienne, dans l’ordre du chemin de l’énergie (réflexe n° 7). On attend les constituants dans l’ordre et une explication avec « car ».
        contenu:
            -   type: citation
                texte: 'Réflexe brevet n° 7 : pour compléter un schéma bloc, je suis l’ordre du chemin de l’énergie et j’écris le nom du constituant dans chaque bloc.'
            -   type: paragraphe
                texte: 'Un schéma bloc se lit de gauche à droite. Ici, il est écrit sous forme de tableau : chaque ligne est un bloc, dans l’ordre du chemin de l’énergie.'
            -   type: paragraphe
                texte: 'Exemple expliqué : le premier bloc est la prise du mur, car c’est là que l’énergie entre dans le système.'
            -   type: etapes
                elements:
                    - 'Lis le réflexe n° 7 et l’exemple : le premier bloc est la prise.'
                    - Suis le chemin de l’énergie de la prise jusqu’à la sortie.
                    - Écris un constituant par bloc, dans l’ordre.
            -   type: paragraphe
                texte: 'Pourquoi un schéma bloc ? Il montre en un coup d’œil par où passe l’énergie : c’est une question presque sûre au brevet.'
        questions:
            -   id: q01
                type: tableau
                enonce: Complète le schéma bloc dans l’ordre du chemin de l’énergie (aide-toi du document 1).
                colonnes:
                    - Ordre
                    - Constituant
                lignes:
                    -   - '1'
                        - Prise du mur
                    -   - '2'
                        - ''
                    -   - '3'
                        - ''
                    -   - '4'
                        - ''
                    -   - '5'
                        - ''
                aide: Source → constituant qui transforme → forme d’énergie en sortie.
            -   id: q02
                type: texte
                enonce: Explique pourquoi le ventilateur ne peut pas tourner si on débranche l’alimentation ATX. Utilise « car ».
                aide: Pense à « car » (réflexe n° 4).
    -   id: a03
        titre: Un modèle, pas une vraie centrale
        transition: 'Tu as construit la chaîne d’énergie de la maquette. Mais attention : notre maquette n’est pas une vraie centrale électrique.'
        consigne: Tu vas comparer notre maquette à une vraie éolienne. On attend une réponse sur ce que la maquette consomme et produit, avec une explication.
        contenu:
            -   type: paragraphe
                texte: 'Dans une vraie éolienne, le vent est gratuit : il vient de la nature. Dans notre maquette, on utilise de l’électricité pour faire du vent, puis on refabrique de l’électricité. C’est un modèle pour comprendre, pas un moyen de produire de l’énergie.'
            -   type: etapes
                elements:
                    - 'Relis : dans la maquette, on utilise de l’électricité pour faire du vent.'
                    - Compare ce qui entre et ce qui sort.
                    - Propose une explication de la différence.
            -   type: paragraphe
                texte: Pourquoi une maquette alors ? Elle n’est pas faite pour produire de l’énergie, mais pour comprendre et tester.
        questions:
            -   id: q01
                type: texte
                enonce: Notre maquette produit-elle plus ou moins d’électricité qu’elle n’en consomme ? Propose une explication.
                aide: Ton idée répond-elle au besoin ?
    -   id: a04
        titre: La vraie éolienne
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Dans une grande éolienne, il n’y a ni prise ni ventilateur.
        questions:
            -   id: q01
                type: texte
                enonce: Écris la chaîne d’énergie d’une vraie éolienne, du vent jusqu’au réseau électrique.
                aide: Source → constituant qui transforme → forme d’énergie en sortie.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as observé, ordonné et compris la chaîne d’énergie. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : par quels constituants l’énergie passe-t-elle dans notre éolienne ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - Une chaîne d’énergie suit le chemin de l’énergie, de constituant en constituant.
    - 'Un moteur qu’on fait tourner devient une génératrice : il produit de l’électricité.'
    - 'Réflexe brevet n° 7 : je complète un schéma bloc dans l’ordre du chemin de l’énergie.'
sources:
