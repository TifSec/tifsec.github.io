titre: Comment comparer deux essais d’éolienne ?
theme: Comparer des solutions d’énergie
problematique: Comment comparer deux essais d’éolienne ?
pourquoi: Suivre un protocole donné et comparer des résultats.
application: Les choix d’énergie dépendent du lieu, des besoins et des essais.
lien_precedent: "Après S18 — Comment le vent peut-il produire de l’électricité ?, nous poursuivons avec un seul objectif : suivre un protocole donné et comparer des résultats."
activites:
    - id: a01
      titre: Comprendre le document
      pourquoi: Suivre un protocole donné et comparer des résultats.
      demarche:
          - Lire le document et repérer les mots utiles.
          - Répondre aux deux questions avec une information du document.
      contenu:
          - type: paragraphe
            texte: Données fictives pour apprendre à comparer. Le modèle de rotor est le même ; la distance au ventilateur change. Les trois mesures de chaque essai utilisent le même appareil et le même réglage.
          - type: tableau
            colonnes:
                - Distance
                - Mesure 1, V
                - Mesure 2, V
                - Mesure 3, V
            lignes:
                - - 30 cm
                  - 1,8
                  - 1,9
                  - 1,8
                - - 60 cm
                  - 1,0
                  - 1,1
                  - 1,0
      questions:
          - id: q01
            type: texte
            enonce: Quel paramètre change entre les deux essais ? Citer un paramètre conservé.
            aide: Cherche ce qui permet une comparaison équitable.
          - id: q02
            type: texte
            enonce: Donner les deux moyennes arrondies au dixième de volt.
            aide: Additionne les trois valeurs puis divise par trois.
    - id: a02
      titre: Faire, chercher et tester
      pourquoi: Mettre l’idée à l’épreuve plutôt que recopier une définition.
      demarche:
          - Dans un tableur réel ou sur papier, organiser les données en gardant les unités.
          - Calculer la moyenne de chaque série ; arrondir au dixième.
          - Écrire une conclusion limitée à ce protocole, puis identifier ce qui manque pour comparer une puissance.
      contenu:
          - type: paragraphe
            texte: "Travaille au brouillon, dans le logiciel ou sur le schéma. Garde une trace d’essai : situation, résultat attendu et observation. En binôme, échangez les rôles au milieu du travail."
      questions:
          - id: q01
            type: texte
            enonce: Présenter ta conclusion et préciser pourquoi on ne doit pas changer de rotor en même temps.
            aide: Une comparaison doit permettre d’identifier ce qui explique la différence.
      ressources:
          - type: paragraphe
            texte: Rechercher dans le guide la source, le convertisseur et une limite d’une énergie renouvelable.
          - type: lien
            titre: ADEME — Les clés de l’énergie
            url: https://mtaterre.fr/wp-content/uploads/2024/01/2024-01-cles-energie-guide-version-nationale.pdf
    - id: a03
      titre: Expliquer ce que le test permet de conclure
      pourquoi: Relier sa réponse à une donnée et préciser une limite.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Peut-on conclure que l’éolienne fournit deux fois plus de puissance à 30 cm ? Justifier avec la nature des mesures.
            aide: Le tableau donne des volts, pas des watts.
    - id: a04
      titre: Conserver et retenir
      pourquoi: Finir avec une trace réutilisable.
      demarche:
          - Vérifier le nom du projet ou de la trace.
          - Noter au brouillon une erreur corrigée ou une étape à reprendre.
      contenu: []
      questions: []
retenir:
    - Suivre un protocole donné et comparer des résultats.
    - Une source fournit une énergie ; un convertisseur en change la forme.
    - Une solution est choisie pour un besoin et des contraintes, pas pour un seul avantage.
bilan: Je conserve une trace qui montre ce que j’ai compris ou testé. Une erreur expliquée et corrigée est un progrès observable.
introduction:
    - type: paragraphe
      texte: "Objectif du jour : Suivre un protocole donné et comparer des résultats."
    - type: paragraphe
      texte: "Séance de 50 minutes de travail effectif : lire et comprendre, réaliser ou chercher, tester, puis faire un bilan. Les essais font partie du travail ; une version simple suffit pour commencer."
    - type: liste
      elements:
          - Une source fournit une énergie ; un convertisseur en change la forme.
          - Une comparaison doit préciser la grandeur, l’unité et les conditions des essais.
          - Une solution est choisie pour un besoin et des contraintes, pas pour un seul avantage.
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
