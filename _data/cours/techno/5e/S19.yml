titre: Comment comparer deux essais d’éolienne ?
theme: Comparer des solutions d’énergie
problematique: Comment comparer deux essais d’éolienne ?
pourquoi: Suivre un protocole donné et comparer des résultats.
application: "Un protocole juste aide à comparer des objets ou des réglages sans confondre les causes."
lien_precedent: "Après S18 — Comment le vent peut-il produire de l’électricité ?, nous poursuivons avec un seul objectif : suivre un protocole donné et comparer des résultats."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: paragraphe
            texte: Données fictives pour apprendre à comparer. Le modèle de rotor est le même ; la distance au ventilateur change. Les trois mesures de chaque essai utilisent le même appareil et le même réglage.
          - type: tableau
            colonnes:
                - Distance
                - Mesure 1, V
                - Mesure 2, V
                - Mesure 3, V
            lignes:
                - - 30 cm
                  - 1,8
                  - 1,9
                  - 1,8
                - - 60 cm
                  - 1,0
                  - 1,1
                  - 1,0
          - type: paragraphe
            texte: "Exemple guidé : pour comparer deux formes de pales, je garde le même ventilateur et la même distance. Je ne change que les pales, puis je mesure la tension avec le même appareil. Ainsi, la différence observée peut être reliée au changement testé."
      questions:
          - id: q01
            type: texte
            enonce: Quel paramètre change entre les deux essais ? Citer un paramètre conservé.
            aide: Cherche ce qui permet une comparaison équitable.
          - id: q02
            type: texte
            enonce: Donner les deux moyennes arrondies au dixième de volt.
            aide: Additionne les trois valeurs puis divise par trois.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - Dans un tableur réel ou sur papier, organiser les données en gardant les unités.
          - Calculer la moyenne de chaque série ; arrondir au dixième.
          - Écrire une conclusion limitée à ce protocole, puis identifier ce qui manque pour comparer une puissance.
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: Présenter ta conclusion et préciser pourquoi on ne doit pas changer de rotor en même temps.
            aide: Une comparaison doit permettre d’identifier ce qui explique la différence.
      ressources:
          - type: paragraphe
            texte: Rechercher dans le guide la source, le convertisseur et une limite d’une énergie renouvelable.
          - type: lien
            titre: ADEME — Les clés de l’énergie
            url: https://mtaterre.fr/wp-content/uploads/2024/01/2024-01-cles-energie-guide-version-nationale.pdf
    - id: a03
      titre: 3. Explique avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Peut-on conclure que l’éolienne fournit deux fois plus de puissance à 30 cm ? Justifier avec la nature des mesures.
            aide: Le tableau donne des volts, pas des watts.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Pour comparer deux essais, on change un seul paramètre et on garde les autres conditions identiques."
    - "Suivre un protocole donné et comparer des résultats."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Pour comparer deux essais, on change un seul paramètre et on garde les autres conditions identiques."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Suivre un protocole donné et comparer des résultats."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : Un protocole juste aide à comparer des objets ou des réglages sans confondre les causes."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
