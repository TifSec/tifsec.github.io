titre: 'Séance 19 : Quel matériau choisir pour notre future cuve ?'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Quel matériau choisir pour la cuve de récupération d’eau de pluie de notre projet, et pourquoi ?
competences_bo:
    - Imaginer, concevoir et réaliser une ou des solutions en réponse à un besoin, à des exigences (de développement durable, par exemple) ou à la nécessité d’améliorations dans une démarche de créativité
    - Caractériser et choisir un objet ou un système technique selon différents critères
objectifs:
    connaissances:
        - Choisir un matériau, c’est comparer plusieurs propositions avec des critères liés à l’usage.
        - Un tableau de critères aide à décider et à justifier son choix.
    competences:
        - Lire un tableau de critères.
        - Choisir un matériau parmi plusieurs et justifier son choix.
pourquoi:
    - 'En séance 15, tu as décrit la cuve intelligente avec des données. Elle n’est pas encore construite : tu participes à sa conception.'
    - Une cuve reste dehors, au soleil et à la pluie, pendant des années, et elle contient beaucoup d’eau. Le choix du matériau est important.
activites:
    -   id: a01
        titre: Les exigences de la cuve
        contenu:
            -   type: citation
                texte: 'Exigences (cahier des charges simplifié) — La cuve doit : contenir 300 litres d’eau ; résister à l’eau et au soleil pendant au moins 10 ans ; pouvoir être déplacée par deux adultes quand elle est vide ; coûter le moins cher possible ; pouvoir être recyclée en fin de vie.'
            -   type: paragraphe
                texte: 'Exemple expliqué : « résister au soleil » est une exigence car la cuve est dehors : un matériau qui se fissure au soleil ne conviendrait pas.'
        questions:
            -   id: q01
                type: texte
                enonce: Explique pourquoi l’exigence « pouvoir être déplacée par deux adultes quand elle est vide » est utile.
                aide: Une idée + « car » + une raison tirée de la séance.
            -   id: q02
                type: qcm
                enonce: Quelle exigence protège l’environnement ?
                choix:
                    -   id: a
                        texte: Pouvoir être recyclée en fin de vie.
                    -   id: b
                        texte: Contenir 300 litres.
                    -   id: c
                        texte: Coûter le moins cher possible.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a02
        titre: Comparer trois matériaux
        transition: Tu connais les exigences. Compare maintenant trois matériaux possibles avec un tableau de critères.
        contenu:
            -   type: tableau
                titre: Document 1 — Trois matériaux possibles (valeurs approximatives)
                colonnes:
                    - Critère
                    - Polyéthylène (plastique)
                    - Acier galvanisé (métal)
                    - Béton
                lignes:
                    -   - Masse d’une cuve vide de 300 L
                        - environ 25 kg
                        - environ 60 kg
                        - plus de 500 kg
                    -   - Résistance à l’eau et au soleil
                        - Bonne (avec un traitement anti-UV)
                        - Bonne, mais rouille si la couche protectrice est rayée
                        - Très bonne
                    -   - Prix approximatif
                        - Faible
                        - Moyen
                        - Moyen, mais installation coûteuse
                    -   - Recyclable
                        - Oui
                        - Oui
                        - Difficilement (concassé)
            -   type: paragraphe
                texte: 'Rappel du réflexe brevet n° 6 : croise la ligne du critère et la colonne du matériau.'
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, écris si chaque matériau respecte l’exigence « déplaçable par deux adultes » (oui ou non).
                colonnes:
                    - Matériau
                    - Déplaçable par deux adultes ?
                lignes:
                    -   - Polyéthylène
                        - ''
                    -   - Acier galvanisé
                        - ''
                    -   - Béton
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
            -   id: q02
                type: qcm
                enonce: Quel matériau semble le plus adapté à notre petite cuve de 300 L ?
                choix:
                    -   id: a
                        texte: Le polyéthylène.
                    -   id: b
                        texte: Le béton.
                    -   id: c
                        texte: L’acier galvanisé.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a03
        titre: Justifier ton choix
        transition: Tu as un matériau préféré. Un bon concepteur justifie son choix avec des arguments précis.
        contenu:
            -   type: paragraphe
                texte: 'Un bon argument cite le critère, la valeur du document et l’exigence. Exemple : « Le béton ne convient pas car, d’après le document 1, une cuve vide pèse plus de 500 kg : deux adultes ne peuvent pas la déplacer. »'
        questions:
            -   id: q01
                type: texte
                enonce: Justifie ton choix de matériau pour la cuve avec au moins trois critères du document 1.
                aide: Une idée + « car » + une raison tirée de la séance.
            -   id: q02
                type: texte
                enonce: Ton choix a-t-il un inconvénient ? Lequel, et comment le limiter ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Certaines cuves sont enterrées dans le jardin.
        questions:
            -   id: q01
                type: texte
                enonce: Pour une cuve enterrée, le béton devient-il un bon choix ? Explique.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as comparé et choisi. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quel matériau choisir pour notre cuve, et pourquoi ? Réponds en 2 ou 3 phrases.'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Choisir un matériau : partir des exigences, comparer avec un tableau de critères, justifier.'
    - Un argument cite le critère, la valeur et l’exigence.
sources:
