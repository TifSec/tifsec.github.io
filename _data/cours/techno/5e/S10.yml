titre: 'Séance 10 : Comment la lampe a-t-elle évolué ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Pourquoi la façon de s’éclairer a-t-elle changé au cours de l’histoire ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
objectifs:
    connaissances:
        - Un objet évolue pour répondre à de nouveaux besoins, grâce à des inventions et à des innovations.
        - Une frise chronologique range les objets dans l’ordre du temps.
        - Des données sont des informations qu’on peut trier et comparer (date, énergie utilisée, avantage).
    competences:
        - Collecter des informations dans des documents.
        - Trier des données dans l’ordre chronologique.
        - Expliquer une évolution par un besoin ou une invention.
pourquoi:
    - En séance 9, tu as comparé plusieurs solutions pour éclairer.
    - Ces solutions ne sont pas apparues en même temps. Aujourd’hui, tu vas les ranger dans le temps et comprendre ce qui a poussé les humains à changer de lampe.
activites:
    -   id: a01
        titre: Collecter les informations
        consigne: Tu vas collecter des informations sur l’histoire de l’éclairage dans le document 1. On attend la solution la plus ancienne et un calcul d’écart entre deux dates.
        contenu:
            -   type: titre
                texte: Document 1 — Quelques étapes de l’éclairage (dates arrondies)
            -   type: tableau
                colonnes:
                    - Solution
                    - Date d’apparition
                    - Énergie utilisée
                    - Ce qu’elle a apporté
                lignes:
                    -   - Lampe à huile
                        - vers -15 000 (Préhistoire)
                        - Graisse ou huile qui brûle
                        - Une lumière qu’on peut transporter dans une grotte
                    -   - Bougie
                        - Antiquité
                        - Cire qui brûle
                        - Plus pratique et plus propre que la graisse
                    -   - Ampoule à filament
                        - '1879'
                        - Électricité
                        - Pas de flamme, donc moins de risque d’incendie
                    -   - LED d’éclairage
                        - années 2000
                        - Électricité
                        - Beaucoup moins de consommation, très longue durée
                    -   - Lampe solaire de jardin
                        - années 2000
                        - Lumière du soleil stockée dans une batterie
                        - Pas de fil ni de prise
            -   type: paragraphe
                texte: Dans ce tableau, chaque ligne est un objet ; chaque colonne est un type de donnée (date, énergie, avantage).
            -   type: etapes
                elements:
                    - 'Lis le document 1 : chaque ligne est une solution, chaque colonne une information.'
                    - Cherche la date la plus ancienne.
                    - Pour le calcul, fais une soustraction entre les deux dates.
            -   type: paragraphe
                texte: 'Pourquoi un tableau ? Il range les informations : on retrouve vite une date ou une énergie.'
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 1, quelle est la plus ancienne solution ?
                choix:
                    -   id: a
                        texte: La bougie.
                    -   id: b
                        texte: La lampe à huile.
                    -   id: c
                        texte: L’ampoule à filament.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: nombre
                enonce: D’après le document 1, combien d’années séparent l’ampoule à filament (1879) de l’an 2000 ?
                unite: ans
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a02
        titre: Ranger sur une frise
        transition: Tu as collecté les informations. Pour voir l’évolution, il faut maintenant trier ces données dans l’ordre du temps.
        consigne: Tu vas ranger les solutions pour éclairer sur une frise chronologique, de la plus ancienne à la plus récente. On attend le bon rang pour chaque solution.
        contenu:
            -   type: paragraphe
                texte: Une frise chronologique se lit de gauche (le plus ancien) à droite (le plus récent).
            -   type: paragraphe
                texte: 'Exemple expliqué : la lampe à huile vient en premier car c’est la plus ancienne (vers -15 000).'
            -   type: etapes
                elements:
                    - Repère la date de chaque solution dans le document 1.
                    - Range-les de la plus ancienne à la plus récente.
                    - Complète le tableau rang par rang.
            -   type: paragraphe
                texte: Pourquoi une frise ? Elle montre d’un coup d’œil ce qui est venu avant et après, et aide à voir les grands changements.
        questions:
            -   id: q01
                type: tableau
                enonce: Range les solutions de la plus ancienne à la plus récente (écris le nom de la solution dans chaque case).
                colonnes:
                    - Rang
                    - Solution
                lignes:
                    -   - 1 (la plus ancienne)
                        - Lampe à huile
                    -   - '2'
                        - ''
                    -   - '3'
                        - ''
                    -   - 4 (les plus récentes, à égalité)
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: qcm
                enonce: Quelle grande invention sépare la bougie de l’ampoule à filament ?
                choix:
                    -   id: a
                        texte: L’utilisation de l’électricité.
                    -   id: b
                        texte: La découverte du feu.
                    -   id: c
                        texte: Le panneau solaire.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a03
        titre: Expliquer les évolutions
        transition: Tu vois l’ordre des inventions. Il reste à comprendre pourquoi on est passé de l’une à l’autre.
        consigne: Tu vas expliquer deux évolutions de l’éclairage avec le document 1 et la séance 9. On attend deux explications justifiées avec « car » et un fait.
        contenu:
            -   type: paragraphe
                texte: Une évolution s’explique souvent par un besoin nouveau (moins de danger, moins de dépenses) ou par une invention (l’électricité, la LED).
            -   type: etapes
                elements:
                    - 'Compare la bougie et l’ampoule : qu’est-ce qui change dans la colonne « Énergie » ?'
                    - Compare l’ampoule et la LED avec ce que tu as appris en séance 9.
                    - Justifie chaque évolution avec « car ».
            -   type: paragraphe
                texte: 'Pourquoi expliquer ? Une évolution a toujours une raison : un besoin nouveau ou une invention.'
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, explique pourquoi on est passé de la bougie à l’ampoule à filament. Utilise « car » et un fait du document (réflexe n° 4).
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
            -   id: q02
                type: texte
                enonce: Explique pourquoi on remplace aujourd’hui les ampoules à filament par des LED. Pense à ce que tu as appris en séance 9.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Et demain ?
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: L’éclairage continue d’évoluer.
        questions:
            -   id: q01
                type: texte
                enonce: 'Imagine la lampe de demain : à quel nouveau besoin répondrait-elle ?'
                aide: Une idée réaliste + « Cela permet de… ».
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as collecté, trié et expliqué. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : pourquoi la façon de s’éclairer a-t-elle changé au cours de l’histoire ? Donne deux exemples.'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Un objet évolue grâce aux inventions et pour répondre à de nouveaux besoins.
    - Une frise chronologique se lit du plus ancien au plus récent.
    - Collecter, trier et analyser des données permet de comprendre une évolution.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
