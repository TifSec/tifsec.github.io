titre: 'Séance 28 : Éolienne, panneau solaire ou pile ?'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Quelle source d’énergie choisir pour alimenter un petit capteur de la cuve, au fond du jardin du collège ?
competences_bo:
    - Imaginer, concevoir et réaliser une ou des solutions en réponse à un besoin, à des exigences (de développement durable, par exemple) ou à la nécessité d’améliorations dans une démarche de créativité
    - Caractériser et choisir un objet ou un système technique selon différents critères
objectifs:
    connaissances:
        - 'Une source d’énergie fournit l’énergie à un objet : réseau électrique (prise), pile, batterie rechargée par un panneau solaire ou une éolienne…'
        - 'On choisit une source selon le besoin : quantité d’énergie, lieu, entretien, coût, impact sur l’environnement.'
    competences:
        - Comparer plusieurs sources d’énergie proposées.
        - Choisir une source et justifier ce choix.
pourquoi:
    - Notre future cuve intelligente aura un petit capteur de niveau d’eau et un voyant. Elle sera au fond du jardin, loin de toute prise.
    - 'Quelle source d’énergie choisir ? Tu connais maintenant l’éolienne et la lampe solaire de jardin : à toi de décider.'
activites:
    -   id: a01
        titre: Le besoin
        contenu:
            -   type: citation
                texte: Besoin — Le capteur et le voyant de la cuve consomment très peu d’énergie. Ils doivent fonctionner jour et nuit, toute l’année, à 50 m de la prise la plus proche, sans qu’on ait à intervenir chaque semaine.
        questions:
            -   id: q01
                type: qcm
                enonce: Pourquoi brancher la cuve sur une prise du collège n’est-il pas pratique ?
                choix:
                    -   id: a
                        texte: Il faudrait tirer un câble de 50 m dans le jardin.
                    -   id: b
                        texte: La prise donnerait trop peu d’énergie.
                    -   id: c
                        texte: Le capteur ne fonctionne qu’avec de l’eau.
    -   id: a02
        titre: Comparer les sources
        transition: Tu connais le besoin. Compare maintenant trois sources possibles.
        contenu:
            -   type: tableau
                titre: Document 1 — Trois sources possibles (comparaison simplifiée)
                colonnes:
                    - Critère
                    - Pile
                    - Petite éolienne + batterie
                    - Petit panneau solaire + batterie
                lignes:
                    -   - Fonctionne la nuit ?
                        - Oui
                        - Oui (batterie)
                        - Oui (batterie)
                    -   - Dépend de la météo ?
                        - Non
                        - Oui, du vent
                        - Oui, du soleil
                    -   - Entretien
                        - Changer la pile tous les quelques mois
                        - 'Pièces qui tournent : usure, bruit'
                        - Nettoyer le panneau de temps en temps
                    -   - Déchets
                        - Piles usagées à recycler
                        - Peu
                        - Peu
                    -   - Coût de départ
                        - Très faible
                        - Moyen
                        - Faible
            -   type: paragraphe
                texte: 'Rappel du réflexe brevet n° 6 : croise ligne et colonne.'
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, écris un avantage et un inconvénient de chaque source.
                colonnes:
                    - Source
                    - Un avantage
                    - Un inconvénient
                lignes:
                    -   - Pile
                        - ''
                        - ''
                    -   - Panneau solaire + batterie
                        - ''
                        - ''
            -   id: q02
                type: qcm
                enonce: Quelle source demande le plus d’interventions pendant l’année ?
                choix:
                    -   id: a
                        texte: La pile.
                    -   id: b
                        texte: Le panneau solaire.
                    -   id: c
                        texte: L’éolienne.
    -   id: a03
        titre: Choisir et justifier
        transition: Tu as les données. Un concepteur doit maintenant choisir et argumenter.
        contenu:
            -   type: paragraphe
                texte: 'Un bon choix répond au besoin. Exemple de raisonnement : « Le besoin dit ‘sans intervenir chaque semaine’ ; donc la pile, qu’il faut changer souvent, convient mal. »'
        questions:
            -   id: q01
                type: texte
                enonce: Quelle source choisis-tu pour la cuve ? Justifie avec au moins trois éléments du besoin et du document 1.
            -   id: q02
                type: texte
                enonce: Ton choix a une limite. Laquelle, et comment la réduire ?
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Notre tracker solaire oriente son panneau vers la lumière.
        questions:
            -   id: q01
                type: texte
                enonce: Serait-il utile de mettre un tracker sur la cuve ? Donne un avantage et un inconvénient.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as comparé et choisi. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quelle source d’énergie choisir pour le capteur de la cuve, et pourquoi ?'
retenir:
    - 'Une source d’énergie se choisit selon le besoin : énergie nécessaire, lieu, entretien, coût, déchets.'
    - 'Le soleil et le vent sont gratuits mais dépendent de la météo : une batterie stocke l’énergie.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
