titre: "Arcade : créer une mission de collecte"
theme: Créer un jeu de collecte et expliquer ses règles
problematique: "Arcade : créer une mission de collecte"
pourquoi: Réutiliser sprites et événements pour un objectif technique.
application: "Créer un jeu permet d’apprendre à programmer des événements et à tester une règle."
lien_precedent: "Après S27 — Comment partager sans exposer les autres ?, nous poursuivons avec un seul objectif : réutiliser sprites et événements pour un objectif technique."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: paragraphe
            texte: "Pause créative utile : on réutilise le jeu de S10 pour représenter une mission de collecte. Un personnage récupère un objet puis atteint une sortie. Une version simple qui fonctionne est préférable à beaucoup de décor."
          - type: code
            texte: |-
                Au démarrage : créer joueur, objet et sortie
                Déplacement : utiliser les boutons
                Au contact de l’objet : l’objet disparaît
          - type: paragraphe
            texte: "Exemple guidé dans Arcade : quand le joueur touche une clé, la clé disparaît. Je teste d’abord le déplacement, puis le contact. Le jeu est réussi seulement si l’événement déclenche bien l’action attendue."
      questions:
          - id: q01
            type: texte
            enonce: Quelles sont les trois petites fonctions à mettre en place avant le décor ?
            aide: Découpe la mission en actions testables.
          - id: q02
            type: texte
            enonce: Quel événement peut signaler que le joueur touche l’objet ?
            aide: Dans la documentation, chercher overlap.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - Créer une copie du projet de S10, ou reconstruire trois sprites simples.
          - Relier le joueur aux commandes et programmer le contact avec l’objet.
          - Tester le déplacement, la collecte et le redémarrage séparément.
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: "Décrire un test de collecte : action effectuée, résultat attendu et observation."
            aide: Un test doit pouvoir être refait.
      ressources:
          - type: paragraphe
            texte: Retrouver un bloc pour le sprite, les commandes, le score ou les contacts ; comparer avec ton programme.
          - type: lien
            titre: MakeCode Arcade — Référence
            url: https://arcade.makecode.com/reference
          - type: lien
            titre: Ouvrir MakeCode Arcade
            url: https://arcade.makecode.com/
    - id: a03
      titre: 3. Explique avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Pourquoi faut-il tester un redémarrage après la collecte ?
            aide: Un programme ne se teste pas seulement une fois.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Un événement de contact peut déclencher une action dans Arcade."
    - "Réutiliser sprites et événements pour un objectif technique."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Un événement de contact peut déclencher une action dans Arcade."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Réutiliser sprites et événements pour un objectif technique."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : Créer un jeu permet d’apprendre à programmer des événements et à tester une règle."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
