titre: Pourquoi orienter un panneau vers la lumière ?
theme: Comparer des solutions d’énergie
problematique: Pourquoi orienter un panneau vers la lumière ?
pourquoi: Comparer des orientations à partir de données.
application: "L’orientation d’un panneau ou d’un capteur peut changer la mesure obtenue."
lien_precedent: "Après S21 — Éolienne ou panneau : est-ce toujours le même choix ?, nous poursuivons avec un seul objectif : comparer des orientations à partir de données."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: paragraphe
            texte: Étude numérique préparatoire au petit tracker solaire du professeur. Son cahier des charges réel sera ajouté plus tard. Les valeurs ci-dessous sont des indices fictifs de lumière ; ce ne sont ni des watts ni des mesures de production électrique.
          - type: tableau
            colonnes:
                - Orientation testée
                - Indice lumineux
            lignes:
                - - Gauche
                  - "45"
                - - Centre
                  - "72"
                - - Droite
                  - "58"
          - type: paragraphe
            texte: "Exemple guidé : à distance identique, un panneau face à la lampe donne 80 unités ; incliné, il en donne 45. Je garde la lampe et la distance inchangées : seule l’orientation varie, donc je peux comparer les deux mesures."
      questions:
          - id: q01
            type: texte
            enonce: Quelle orientation donne l’indice le plus élevé ?
            aide: Comparer les trois valeurs de la même grandeur.
          - id: q02
            type: texte
            enonce: Peut-on écrire que le panneau produit 72 W ? Pourquoi ?
            aide: Lis la nature et l’unité des données.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - Représenter les trois orientations sur un croquis.
          - Choisir celle qui correspond au meilleur indice du document.
          - Proposer un protocole où seule l’orientation change et préciser ce qu’il resterait à mesurer sur le vrai tracker.
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: "Décrire ton protocole : paramètre changé, paramètre conservé et résultat relevé."
            aide: Évite de déplacer la lampe et le panneau simultanément.
      ressources:
          - type: paragraphe
            texte: Chercher comment faire varier la lumière dans le simulateur et ce que la mesure représente.
          - type: lien
            titre: MakeCode — Mesurer la lumière
            url: https://makecode.microbit.org/projects/light-level-meter
          - type: lien
            titre: Ouvrir le simulateur MakeCode micro:bit
            url: https://makecode.microbit.org/
    - id: a03
      titre: 3. Explique avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Avant de programmer le tracker réel, citer deux informations à demander dans son cahier des charges ou sa notice.
            aide: Ne devine pas les broches ni les angles autorisés.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Une mesure n’est comparable que si les conditions et l’unité sont précisées."
    - "Comparer des orientations à partir de données."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Une mesure n’est comparable que si les conditions et l’unité sont précisées."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Comparer des orientations à partir de données."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : L’orientation d’un panneau ou d’un capteur peut changer la mesure obtenue."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
