titre: 'Séance 22 : Bilan et entraînement au brevet n° 2 : la gourde'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Suis-je capable de choisir un objet et de justifier mon choix avec un dossier ?
competences_bo:
    - Caractériser et choisir un objet ou un système technique selon différents critères
objectifs:
    connaissances:
        - 'Un dossier de type brevet mélange plusieurs documents : texte, tableau, schéma.'
    competences:
        - Utiliser les réflexes brevet n° 1 à 6.
        - Réinvestir matériaux, cycle de vie et choix d’un objet.
pourquoi:
    - Tu as étudié les matériaux, leurs propriétés, le cycle de vie et la lecture des fiches.
    - Aujourd’hui, tu utilises tout cela dans un dossier sur les gourdes, comme au brevet (adapté à la 5e, ce n’est pas un sujet officiel).
activites:
    -   id: a01
        titre: Le dossier
        contenu:
            -   type: citation
                texte: 'Réflexe brevet n° 6 : je lis un tableau en croisant une ligne et une colonne.'
            -   type: titre
                texte: Document 1 — Trois gourdes
            -   type: tableau
                colonnes:
                    - Critère
                    - Gourde A (plastique)
                    - Gourde B (aluminium)
                    - Gourde C (acier inoxydable)
                lignes:
                    -   - Masse vide
                        - 80 g
                        - 150 g
                        - 300 g
                    -   - Durée d’utilisation estimée
                        - 1 an
                        - 4 ans
                        - 10 ans
                    -   - Garde l’eau fraîche
                        - Non
                        - Non
                        - Oui (double paroi)
                    -   - Prix
                        - 5 €
                        - 15 €
                        - 25 €
                    -   - Recyclable
                        - Oui
                        - Oui
                        - Oui
            -   type: titre
                texte: Document 2 — Le cycle de vie
            -   type: citation
                texte: La fabrication d’une gourde demande des matières premières et de l’énergie. Plus une gourde dure longtemps, moins il faut en fabriquer de nouvelles, et plus son impact sur l’environnement est faible.
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 1, quelle gourde est la plus légère ?
                choix:
                    -   id: a
                        texte: La gourde A.
                    -   id: b
                        texte: La gourde B.
                    -   id: c
                        texte: La gourde C.
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: nombre
                enonce: D’après le document 1, combien de gourdes A faut-il acheter pour remplacer une seule gourde C sur 10 ans ?
                unite: gourdes
                aide: N’oublie pas l’unité (réflexe n° 5).
            -   id: q03
                type: nombre
                enonce: Combien coûtent ces gourdes A au total ?
                unite: €
                aide: N’oublie pas l’unité (réflexe n° 5).
            -   id: q04
                type: texte
                enonce: Cite la famille de matériau de chaque gourde (séance 17).
                aide: Combien d’éléments sont demandés ?
    -   id: a02
        titre: Choisir et justifier
        transition: Tu as relevé les informations. Au brevet, il faut ensuite choisir et argumenter.
        contenu:
            -   type: paragraphe
                texte: 'Rappel des réflexes n° 2, 4 et 5 : « D’après le document… », « car » + un fait, et toujours l’unité.'
        questions:
            -   id: q01
                type: texte
                enonce: Un randonneur part une journée en été. Quelle gourde lui conseilles-tu ? Justifie avec deux faits du document 1.
                aide: Pense à « car » (réflexe n° 4).
            -   id: q02
                type: texte
                enonce: D’après le document 2, explique pourquoi la gourde C a un impact plus faible sur l’environnement que la gourde A, même si elle est plus lourde.
                aide: « D’après le document… » (réflexe n° 2).
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une gourde peut aussi être fabriquée en verre.
        questions:
            -   id: q01
                type: texte
                enonce: Donne un avantage et un inconvénient d’une gourde en verre pour un collégien.
                aide: Combien d’éléments sont demandés ?
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as terminé le dossier. Compare avec ton premier entraînement pour mesurer tes progrès.
        questions:
            -   id: q01
                type: texte
                enonce: Relis ta copie. Quel réflexe as-tu mieux utilisé qu’au premier entraînement (séance 12) ? Donne un exemple de ta copie.
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - Un objet plus durable a souvent un impact plus faible, même s’il coûte plus cher à l’achat.
    - 'Dans un dossier : relever, calculer avec l’unité, choisir, justifier avec les documents.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
