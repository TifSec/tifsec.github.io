titre: Pourquoi orienter un panneau vers la lumière ?
theme: Comparer des solutions d’énergie
problematique: Pourquoi orienter un panneau vers la lumière ?
pourquoi: Comparer des orientations à partir de données.
application: Les choix d’énergie dépendent du lieu, des besoins et des essais.
lien_precedent: "Après S21 — Éolienne ou panneau : est-ce toujours le même choix ?, nous poursuivons avec un seul objectif : comparer des orientations à partir de données."
activites:
    - id: a01
      titre: Comprendre le document
      pourquoi: Comparer des orientations à partir de données.
      demarche:
          - Lire le document et repérer les mots utiles.
          - Répondre aux deux questions avec une information du document.
      contenu:
          - type: paragraphe
            texte: Étude numérique préparatoire au petit tracker solaire du professeur. Son cahier des charges réel sera ajouté plus tard. Les valeurs ci-dessous sont des indices fictifs de lumière ; ce ne sont ni des watts ni des mesures de production électrique.
          - type: tableau
            colonnes:
                - Orientation testée
                - Indice lumineux
            lignes:
                - - Gauche
                  - "45"
                - - Centre
                  - "72"
                - - Droite
                  - "58"
      questions:
          - id: q01
            type: texte
            enonce: Quelle orientation donne l’indice le plus élevé ?
            aide: Comparer les trois valeurs de la même grandeur.
          - id: q02
            type: texte
            enonce: Peut-on écrire que le panneau produit 72 W ? Pourquoi ?
            aide: Lis la nature et l’unité des données.
    - id: a02
      titre: Faire, chercher et tester
      pourquoi: Mettre l’idée à l’épreuve plutôt que recopier une définition.
      demarche:
          - Représenter les trois orientations sur un croquis.
          - Choisir celle qui correspond au meilleur indice du document.
          - Proposer un protocole où seule l’orientation change et préciser ce qu’il resterait à mesurer sur le vrai tracker.
      contenu:
          - type: paragraphe
            texte: "Travaille au brouillon, dans le logiciel ou sur le schéma. Garde une trace d’essai : situation, résultat attendu et observation. En binôme, échangez les rôles au milieu du travail."
      questions:
          - id: q01
            type: texte
            enonce: "Décrire ton protocole : paramètre changé, paramètre conservé et résultat relevé."
            aide: Évite de déplacer la lampe et le panneau simultanément.
      ressources:
          - type: paragraphe
            texte: Chercher comment faire varier la lumière dans le simulateur et ce que la mesure représente.
          - type: lien
            titre: MakeCode — Mesurer la lumière
            url: https://makecode.microbit.org/projects/light-level-meter
          - type: lien
            titre: Ouvrir le simulateur MakeCode micro:bit
            url: https://makecode.microbit.org/
    - id: a03
      titre: Expliquer ce que le test permet de conclure
      pourquoi: Relier sa réponse à une donnée et préciser une limite.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Avant de programmer le tracker réel, citer deux informations à demander dans son cahier des charges ou sa notice.
            aide: Ne devine pas les broches ni les angles autorisés.
    - id: a04
      titre: Conserver et retenir
      pourquoi: Finir avec une trace réutilisable.
      demarche:
          - Vérifier le nom du projet ou de la trace.
          - Noter au brouillon une erreur corrigée ou une étape à reprendre.
      contenu: []
      questions: []
retenir:
    - Comparer des orientations à partir de données.
    - Une source fournit une énergie ; un convertisseur en change la forme.
    - Une solution est choisie pour un besoin et des contraintes, pas pour un seul avantage.
bilan: Je conserve une trace qui montre ce que j’ai compris ou testé. Une erreur expliquée et corrigée est un progrès observable.
introduction:
    - type: paragraphe
      texte: "Objectif du jour : Comparer des orientations à partir de données."
    - type: paragraphe
      texte: "Séance de 50 minutes de travail effectif : lire et comprendre, réaliser ou chercher, tester, puis faire un bilan. Les essais font partie du travail ; une version simple suffit pour commencer."
    - type: liste
      elements:
          - Une source fournit une énergie ; un convertisseur en change la forme.
          - Une comparaison doit préciser la grandeur, l’unité et les conditions des essais.
          - Une solution est choisie pour un besoin et des contraintes, pas pour un seul avantage.
