titre: 'Séance 8 : Monter une lampe de poche… dans un simulateur'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Quels constituants faut-il assembler, et dans quel ordre, pour qu’une lampe de poche s’allume ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
    - Valider les solutions techniques par des simulations ou par des protocoles de tests
objectifs:
    connaissances:
        - 'Une lampe de poche contient une pile (source d’énergie), un interrupteur, une lampe et des fils (ou des lamelles) qui forment une boucle fermée : le circuit.'
        - Si la boucle est ouverte (interrupteur ouvert, fil débranché, pile usée), la lampe ne s’allume pas.
    competences:
        - Assembler des constituants fournis dans un simulateur.
        - Tester le prototype virtuel et expliquer une panne simple.
pourquoi:
    - En séance 4, tu as étudié ce qui agit autour de la lampe de poche. En séance 7, tu as présenté un objet du quotidien.
    - 'Aujourd’hui, tu passes de l’autre côté : tu assembles toi-même les constituants d’une lampe de poche, dans un simulateur. Rien ne peut casser : tu peux essayer, te tromper et recommencer.'
activites:
    -   id: a01
        titre: Les constituants d’une lampe de poche
        consigne: Tu vas découvrir le rôle de chaque constituant d’une lampe de poche (document 1), avant de l’assembler dans le simulateur PhET. On attend le rôle de la pile, de l’interrupteur et de la lampe.
        contenu:
            -   type: tableau
                titre: Document 1 — Ce que l’on va assembler
                colonnes:
                    - Constituant
                    - Rôle
                    - Dans le simulateur
                lignes:
                    -   - Pile
                        - Fournit l’énergie électrique.
                        - Pile (batterie)
                    -   - Interrupteur
                        - Ouvre ou ferme le circuit.
                        - Interrupteur
                    -   - Lampe
                        - Transforme l’énergie électrique en lumière.
                        - Ampoule
                    -   - Fils
                        - Relient les constituants en boucle.
                        - Fil
            -   type: paragraphe
                texte: 'Exemple expliqué : dans une vraie lampe de poche, les fils sont souvent remplacés par des lamelles de métal. Leur rôle est le même : faire une boucle de la pile à la lampe, puis de la lampe à la pile.'
            -   type: etapes
                elements:
                    - Lis le document 1 ligne par ligne.
                    - Pour chaque constituant, repère la colonne « Rôle ».
                    - Écris le rôle avec tes mots.
            -   type: paragraphe
                texte: Pourquoi connaître les rôles avant d’assembler ? On sait alors ce que chaque pièce doit faire dans le circuit, et on comprend pourquoi il ne marche pas.
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, écris le rôle de chaque constituant.
                colonnes:
                    - Constituant
                    - Rôle
                lignes:
                    -   - Pile
                        - ''
                    -   - Interrupteur
                        - ''
                    -   - Lampe
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
        ressources:
            - &id001
                type: lien
                titre: 'PhET (université du Colorado) — Kit de construction de circuits CC : laboratoire virtuel'
                url: https://phet.colorado.edu/fr/simulations/circuit-construction-kit-dc-virtual-lab
    -   id: a02
        titre: Assembler le circuit
        transition: Tu connais les constituants. Assemble maintenant ton prototype virtuel.
        consigne: Tu vas assembler une lampe de poche virtuelle dans le simulateur PhET, en suivant les étapes. On attend un circuit qui fonctionne et la description de ton montage.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre le simulateur (lien ci-dessous) et choisis l’écran « Laboratoire ».
                    - 'Fais glisser sur le plan de travail : une pile, un interrupteur, une ampoule et des fils.'
                    - 'Relie-les pour former une seule boucle : pile → interrupteur → ampoule → retour à la pile.'
                    - 'Clique sur l’interrupteur pour le fermer : l’ampoule doit s’allumer et des points bougent dans les fils.'
            -   type: paragraphe
                texte: 'Si rien ne s’allume, vérifie chaque connexion : les extrémités des fils doivent être bien collées (un petit cercle apparaît).'
            -   type: paragraphe
                texte: 'Pourquoi une boucle ? L’électricité doit pouvoir partir de la pile et y revenir : un seul fil manquant, et rien ne s’allume.'
        questions:
            -   id: q01
                type: qcm
                enonce: L’ampoule est allumée. Que se passe-t-il si tu ouvres l’interrupteur ?
                choix:
                    -   id: a
                        texte: 'L’ampoule s’éteint : la boucle est ouverte.'
                    -   id: b
                        texte: L’ampoule reste allumée.
                    -   id: c
                        texte: La pile explose.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Décris dans l’ordre comment tu as relié les constituants pour que l’ampoule s’allume.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
        ressources:
            - *id001
    -   id: a03
        titre: Tester et dépanner
        transition: Ton prototype fonctionne. Un vrai concepteur vérifie aussi ce qui se passe quand quelque chose ne va pas.
        consigne: Tu vas tester ton circuit virtuel avec les trois essais du document 2, puis aider un camarade à trouver une panne. On attend le résultat de chaque essai et deux causes de panne possibles.
        contenu:
            -   type: paragraphe
                texte: 'Un prototype se teste. Fais les essais du tableau un par un, en remettant le circuit en état entre deux essais (réflexe : une seule modification à la fois).'
            -   type: tableau
                titre: Document 2 — Essais à faire
                colonnes:
                    - Essai
                    - Ce que je change
                lignes:
                    -   - '1'
                        - J’ouvre l’interrupteur.
                    -   - '2'
                        - Je retire un fil entre l’ampoule et la pile.
                    -   - '3'
                        - Je remplace la pile par une deuxième ampoule (plus de pile).
            -   type: etapes
                elements:
                    - Fais l’essai 1, observe, puis remets le circuit comme avant.
                    - Fais l’essai 2, puis l’essai 3, de la même façon.
                    - Utilise tes observations pour proposer des causes de panne.
            -   type: paragraphe
                texte: Pourquoi un seul changement à la fois ? Si on change deux choses, on ne sait pas laquelle a éteint la lampe.
        questions:
            -   id: q01
                type: tableau
                enonce: Pour chaque essai, écris si l’ampoule s’allume (oui ou non).
                colonnes:
                    - Essai
                    - L’ampoule s’allume ?
                lignes:
                    -   - '1'
                        - ''
                    -   - '2'
                        - ''
                    -   - '3'
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: texte
                enonce: 'Un camarade dit : « Ma lampe de poche ne marche plus. » Propose deux causes possibles, d’après tes essais.'
                aide: 'Méthode : 1) relis le besoin ou le problème ; 2) propose une idée possible avec le matériel ou les données de la séance ; 3) dis en quoi elle répond au besoin (« Cela permet de… »).'
        ressources:
            - *id001
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Dans le simulateur, ajoute une deuxième ampoule.
        questions:
            -   id: q01
                type: texte
                enonce: Trouve un montage où les deux ampoules s’allument. Décris-le. Que se passe-t-il si tu dévisses (retires) l’une des deux ?
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
        ressources:
            - *id001
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as assemblé, testé et dépanné une lampe de poche virtuelle. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quels constituants faut-il assembler, et comment, pour qu’une lampe de poche s’allume ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Une lampe de poche : pile + interrupteur + lampe + fils, reliés en une boucle fermée (le circuit).'
    - Circuit ouvert = la lampe s’éteint. On teste en ne changeant qu’une seule chose à la fois.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
    - *id001
