titre: 'Séance 8 : PIX n° 1 : où en suis-je avec le numérique ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Quelles compétences numériques ai-je déjà, et lesquelles dois-je travailler cette année ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
objectifs:
    connaissances:
        - Pix est la plateforme officielle qui permet d’évaluer et de développer ses compétences numériques.
        - 'Les compétences numériques sont organisées en domaines : informations et données, communication, création de contenus, protection et sécurité, environnement numérique.'
    competences:
        - Se connecter à Pix par l’ENT ou avec le code donné par le professeur.
        - Réaliser le parcours de rentrée.
        - Repérer ses points forts et une compétence à travailler.
pourquoi:
    - 'Le numérique est partout en technologie : le site de cours, les logiciels, les programmes des maquettes.'
    - Aujourd’hui, tu passes le parcours de rentrée Pix. Il ne compte pas dans la note de Pix, mais il montre où tu en es.
activites:
    -   id: a01
        titre: Se connecter à Pix
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Pix depuis l’ENT (ou va sur pix.fr et choisis « Se connecter »).
                    - Saisis le code de parcours donné par le professeur.
                    - Vérifie ton prénom et ton nom avant de commencer.
            -   type: paragraphe
                texte: 'Ton compte Pix est personnel : il te suit jusqu’en 3e. Ne crée pas un deuxième compte si tu en as déjà un.'
            -   type: paragraphe
                texte: Ici, sur le site, tu ne recopies jamais un mot de passe ni les réponses de Pix.
        questions:
            -   id: q01
                type: qcm
                enonce: Tu as déjà un compte Pix de l’an dernier. Que fais-tu ?
                choix:
                    -   id: a
                        texte: Je me connecte avec ce compte.
                    -   id: b
                        texte: Je crée un nouveau compte.
                    -   id: c
                        texte: J’utilise le compte de mon voisin.
            -   id: q02
                type: qcm
                enonce: Où dois-tu écrire ton mot de passe Pix ?
                choix:
                    -   id: a
                        texte: Seulement sur la page de connexion de Pix ou de l’ENT.
                    -   id: b
                        texte: Dans une réponse du site de cours.
                    -   id: c
                        texte: Sur un papier collé sur l’écran.
        ressources:
            -   type: lien
                titre: Pix — se connecter
                url: https://pix.fr/
    -   id: a02
        titre: Le parcours de rentrée
        transition: Tu es connecté. Tu peux maintenant passer le parcours de rentrée.
        contenu:
            -   type: paragraphe
                texte: 'Fais le parcours sérieusement, sans aide extérieure : il sert à savoir où tu en es, pas à avoir une note.'
            -   type: paragraphe
                texte: 'Si une question est trop difficile, tu peux passer : c’est une information utile.'
            -   type: paragraphe
                texte: Pendant le parcours, note dans ta tête (ou sur un brouillon) une question qui t’a appris quelque chose.
        questions:
            -   id: q01
                type: texte
                enonce: Cite une chose que tu as apprise pendant le parcours (une méthode, un mot, une astuce). Ne recopie pas une question de Pix.
            -   id: q02
                type: texte
                enonce: Quel domaine du numérique (informations, communication, création de contenus, sécurité, environnement numérique) t’a semblé le plus facile ? Pourquoi ?
    -   id: a03
        titre: Mes points forts et mon objectif
        transition: Tu as terminé le parcours. Pour progresser, il faut savoir où tu es fort et ce que tu dois travailler.
        contenu:
            -   type: paragraphe
                texte: À la fin, Pix montre tes résultats par compétence. Repère la compétence où tu as le mieux réussi et celle où tu as le plus de difficulté.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle est ta compétence la plus forte ? Donne un exemple de ce que tu sais déjà faire dans ce domaine.
            -   id: q02
                type: texte
                enonce: Quelle compétence veux-tu travailler cette année ? Explique pourquoi elle te sera utile.
    -   id: a04
        titre: Encore un peu de Pix
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Si tu as terminé avant les autres, le professeur peut te donner le code d’un parcours d’entraînement.
        questions:
            -   id: q01
                type: texte
                enonce: Quel nouveau parcours as-tu commencé, et qu’y as-tu découvert ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu connais maintenant tes points forts et ton objectif. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quelles compétences numériques as-tu déjà, et lesquelles dois-tu travailler cette année ?'
retenir:
    - Pix évalue et développe les compétences numériques ; le compte est personnel et suit l’élève.
    - On ne partage jamais un mot de passe.
    - Connaître ses points forts et ses difficultés permet de progresser.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
