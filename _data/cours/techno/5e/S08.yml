titre: Un objet qui ne fonctionne plus est-il forcément à jeter ?
theme: "Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre"
problematique: Comment utiliser des observations et des vérifications simples avant de décider de remplacer un objet ?
pourquoi: "Objectif de cette séance : Comprendre qu'un objet qui ne fonctionne plus n'est pas forcément définitivement inutilisable."
application: Une petite lampe alimentée par des piles ne s'allume plus lorsque l'on appuie sur son interrupteur.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Comprendre qu'un objet qui ne fonctionne plus n'est pas forcément définitivement inutilisable.
        - Distinguer un dysfonctionnement observé de sa cause.
        - Comprendre qu'il faut observer et vérifier avant d'intervenir.
        - Découvrir la notion de diagnostic.
        - Comprendre qu'une vérification apporte une information permettant d'écarter ou de privilégier une cause possible.
        - Comprendre qu'une intervention doit être suivie d'un nouveau test.
        - Comprendre que réparer peut, dans certaines situations, prolonger la durée d'utilisation d'un objet.
    competences: []
activites:
    - id: a04
      titre: 1. Observer avant d'expliquer
      contenu:
          - type: paragraphe
            texte: "Imaginez la situation suivante :"
          - type: paragraphe
            texte: Une petite lampe alimentée par des piles ne s'allume plus lorsque l'on appuie sur son interrupteur.
      questions:
          - id: q01
            type: texte
            enonce: "Q1 : Décrivez uniquement ce que vous observez, sans essayer d'expliquer pourquoi."
          - id: q02
            type: texte
            enonce: "Q2 : Quel devrait être le fonctionnement normal de la lampe ?"
          - id: q03
            type: texte
            enonce: "Q3 : Peut-on déjà savoir avec certitude quelle pièce est responsable ? Expliquez."
    - id: a05
      titre: 2. Un même problème peut avoir plusieurs causes
      contenu:
          - type: paragraphe
            texte: La lampe ne s'allume pas.
          - type: paragraphe
            texte: "Plusieurs causes sont possibles :"
          - type: liste
            elements:
                - les piles sont absentes ;
                - une pile est placée dans le mauvais sens ;
                - les piles sont déchargées ;
                - l'interrupteur fonctionne mal ;
                - un contact électrique est mauvais ;
                - la source lumineuse est défectueuse.
      questions:
          - id: q01
            type: texte
            enonce: "Q4 : Parmi ces causes, lesquelles vous semblent les plus simples à vérifier sans démonter la lampe ?"
          - id: q02
            type: texte
            enonce: "Q5 : Pourquoi serait-il peu logique de remplacer immédiatement toutes les pièces de la lampe ?"
    - id: a06
      titre: 3. Dans quel ordre vérifier ?
      contenu:
          - type: paragraphe
            texte: Il faut maintenant choisir un ordre logique pour effectuer les vérifications.
      questions:
          - id: q01
            type: texte
            enonce: "Q6 : Classez les vérifications suivantes de celle que vous effectueriez en premier à celle que vous effectueriez en dernier :"
          - id: q02
            type: texte
            enonce: vérifier que les piles sont présentes ;
          - id: q03
            type: texte
            enonce: vérifier leur sens ;
          - id: q04
            type: texte
            enonce: vérifier si les piles peuvent encore alimenter correctement l'objet ;
          - id: q05
            type: texte
            enonce: vérifier le fonctionnement apparent de l'interrupteur ;
          - id: q06
            type: texte
            enonce: vérifier les contacts électriques accessibles ;
          - id: q07
            type: texte
            enonce: envisager un défaut d'un composant interne.
          - id: q08
            type: texte
            enonce: "Q7 : Pourquoi est-il généralement préférable de commencer par des vérifications simples et accessibles ?"
    - id: a07
      titre: 4. Une méthode pour rechercher l'origine d'un problème
      contenu:
          - type: paragraphe
            texte: "À partir de vos réponses, nous pouvons construire une démarche simple :"
          - type: paragraphe
            texte: Observer → envisager plusieurs causes → vérifier → écarter ou conserver → intervenir → tester
          - type: paragraphe
            texte: Chaque vérification apporte une nouvelle information.
          - type: paragraphe
            texte: "Elle peut :"
          - type: liste
            elements:
                - renforcer une cause possible ;
                - ou au contraire montrer qu'elle devient peu probable.
      questions: []
    - id: a08
      titre: 5. Dysfonctionnement, cause et diagnostic
      contenu:
          - type: paragraphe
            texte: Un dysfonctionnement correspond à un fonctionnement anormal ou à l'absence du fonctionnement attendu.
          - type: paragraphe
            texte: La cause correspond à ce qui provoque ce dysfonctionnement.
          - type: paragraphe
            texte: La recherche de l'origine du problème à partir des observations et des vérifications constitue un diagnostic.
          - type: paragraphe
            texte: "Exemple :"
          - type: liste
            elements:
                - "Dysfonctionnement : la lampe ne s'allume pas."
                - "Cause possible : une pile est placée dans le mauvais sens."
                - "Vérification : observer le sens indiqué dans le compartiment à piles."
      questions:
          - id: q01
            type: texte
            enonce: "Q8 : Avec vos propres mots, expliquez la différence entre un dysfonctionnement et sa cause."
    - id: a09
      titre: "6. Première enquête : la lampe"
      contenu:
          - type: paragraphe
            texte: "Voici les résultats de vérifications effectuées sur la lampe :"
          - type: tableau
            colonnes:
                - Vérification
                - Résultat obtenu
            lignes:
                - - Présence des piles
                  - Les deux piles sont présentes.
                - - Position des piles
                  - L'une des piles est installée dans le mauvais sens.
                - - État extérieur
                  - Aucun élément n'est visiblement cassé.
      questions:
          - id: q01
            type: texte
            enonce: "Q9 : Quelle cause devient maintenant la plus probable ?"
          - id: q02
            type: texte
            enonce: "Q10 : Quelle intervention simple proposeriez-vous ?"
          - id: q03
            type: texte
            enonce: "Q11 : Que faut-il faire après cette intervention ? Pourquoi ?"
    - id: a10
      titre: "7. Deuxième enquête : le petit ventilateur"
      contenu:
          - type: paragraphe
            texte: Un petit ventilateur alimenté par piles tourne beaucoup plus lentement que d'habitude.
          - type: paragraphe
            texte: "Plusieurs causes sont proposées :"
          - type: liste
            elements:
                - l'hélice est bloquée ;
                - un objet gêne son mouvement ;
                - les piles sont mal positionnées ;
                - les piles sont trop faibles ;
                - un autre élément interne fonctionne mal.
          - type: paragraphe
            texte: "Voici les vérifications disponibles :"
          - type: tableau
            colonnes:
                - Vérification
                - Résultat obtenu
            lignes:
                - - Hélice
                  - Elle tourne librement lorsque le ventilateur est arrêté.
                - - Grille de protection
                  - Rien ne bloque l'hélice.
                - - Position des piles
                  - Elles sont correctement installées.
                - - Historique des piles
                  - Elles sont utilisées depuis plusieurs semaines.
      questions:
          - id: q01
            type: texte
            enonce: "Q12 : Quelles causes pouvez-vous déjà écarter grâce aux vérifications ?"
          - id: q02
            type: texte
            enonce: "Q13 : Quelle cause devient la plus probable ?"
          - id: q03
            type: texte
            enonce: "Q14 : Quelle vérification supplémentaire permettrait de vérifier cette idée ?"
    - id: a11
      titre: "8. Troisième enquête : le jouet électronique"
      contenu:
          - type: paragraphe
            texte: Un jouet électronique fonctionne normalement lorsqu'il reste posé sur une table, mais peut s'éteindre lorsqu'on le déplace.
          - type: paragraphe
            texte: "Voici les observations :"
          - type: tableau
            colonnes:
                - Observation
                - Résultat
            lignes:
                - - À l'arrêt sur une table
                  - Le jouet fonctionne normalement.
                - - Lorsque le jouet est déplacé
                  - Il peut s'éteindre brutalement.
                - - Piles
                  - Elles sont chargées.
                - - Compartiment à piles
                  - Une pile semble légèrement bouger.
      questions:
          - id: q01
            type: texte
            enonce: "Q15 : Quel est le dysfonctionnement observé ?"
          - id: q02
            type: texte
            enonce: "Q16 : Quelle cause semble la plus probable ?"
          - id: q03
            type: texte
            enonce: "Q17 : Quel indice du tableau vous permet de privilégier cette cause ?"
          - id: q04
            type: texte
            enonce: "Q18 : Quelle intervention simple pourrait être envisagée ?"
          - id: q05
            type: texte
            enonce: "Q19 : Quel test faudrait-il ensuite réaliser ?"
    - id: a12
      titre: "9. Quatrième enquête : l'éclairage de vélo"
      contenu:
          - type: paragraphe
            texte: Un éclairage de vélo s'allume encore, mais sa lumière est devenue beaucoup plus faible qu'auparavant.
          - type: paragraphe
            texte: "Trois explications sont proposées :"
          - type: liste
            elements:
                - "A : la source lumineuse est défectueuse ;"
                - "B : les piles sont presque déchargées ;"
                - "C : un contact électrique est mauvais."
      questions:
          - id: q01
            type: texte
            enonce: "Q20 : Peut-on déjà choisir avec certitude entre A, B et C ? Pourquoi ?"
            suite:
                - type: paragraphe
                  texte: "De nouvelles observations sont disponibles :"
                - type: liste
                  elements:
                      - la lumière reste allumée sans clignoter ;
                      - les piles sont anciennes ;
                      - les contacts accessibles semblent correctement positionnés.
          - id: q02
            type: texte
            enonce: "Q21 : Quelle cause devient la plus probable ?"
          - id: q03
            type: texte
            enonce: "Q22 : Quelle vérification permettrait de la confirmer ?"
    - id: a13
      titre: 10. Construire un tableau de diagnostic
      contenu:
          - type: paragraphe
            texte: Choisissez maintenant deux des quatre enquêtes.
          - type: paragraphe
            texte: "Dans votre document Writer, construisez pour chacune un tableau :"
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Dysfonctionnement observé
                - Cause possible
                - Indice ou vérification
                - Cause conservée ou écartée ?
            lignes:
                - - ""
                  - ""
                  - ""
                  - ""
                - - ""
                  - ""
                  - ""
                  - ""
                - - ""
                  - ""
                  - ""
                  - ""
    - id: a14
      titre: 11. Une vérification qui échoue peut quand même être utile
      contenu:
          - type: paragraphe
            texte: Lors d'un diagnostic, une première idée peut se révéler fausse.
          - type: paragraphe
            texte: Cela ne signifie pas que la vérification était inutile.
          - type: paragraphe
            texte: "Si nous vérifions un élément et constatons qu'il fonctionne correctement, nous avons obtenu une information :"
          - type: paragraphe
            texte: cet élément devient moins probable comme origine du problème.
      questions:
          - id: q01
            type: texte
            enonce: "Q23 : Choisissez une enquête et donnez un exemple de cause que l'on peut écarter grâce à une vérification."
          - id: q02
            type: texte
            enonce: "Q24 : Pourquoi éliminer une mauvaise explication permet-il tout de même d'avancer ?"
    - id: a15
      titre: 12. Réparer, remplacer... ou continuer le diagnostic ?
      contenu:
          - type: paragraphe
            texte: Le diagnostic sert aussi à éviter de remplacer inutilement un objet entier.
          - type: paragraphe
            texte: "Étudiez les situations suivantes :"
          - type: tableau
            colonnes:
                - Situation
                - Informations disponibles
            lignes:
                - - A
                  - Une lampe ne fonctionne plus uniquement parce qu'une pile est installée à l'envers.
                - - B
                  - Un petit appareil possède un câble accessible débranché de son connecteur.
                - - C
                  - Un appareil possède plusieurs composants internes endommagés et aucune cause simple n'a encore été confirmée.
                - - D
                  - Un objet ancien fonctionne encore mais sa batterie ne conserve presque plus sa charge.
      questions:
          - id: q01
            type: texte
            enonce: "Q25 : Dans quelles situations une intervention simple semble possible à partir des informations fournies ?"
          - id: q02
            type: texte
            enonce: "Q26 : Dans quelles situations faudrait-il obtenir davantage d'informations avant de décider ?"
          - id: q03
            type: texte
            enonce: "Q27 : Pourquoi prolonger la durée d'utilisation d'un objet grâce à une réparation peut-il être intéressant ?"
          - id: q04
            type: texte
            enonce: "Q28 : Faut-il pour autant toujours réparer n'importe quel objet ? Expliquez."
    - id: a16
      titre: 13. La réparation dans la vraie vie
      contenu:
          - type: paragraphe
            texte: La réparation n'est pas seulement une activité scolaire.
          - type: paragraphe
            texte: L'ADEME recommande de vérifier si un objet peut être réparé avant de le remplacer lorsqu'une réparation pertinente est possible.
          - type: paragraphe
            texte: Réparer permet notamment de prolonger la durée d'utilisation d'un objet et peut éviter ou retarder l'achat et la fabrication d'un produit neuf.
          - type: paragraphe
            texte: Des professionnels, associations et ateliers spécialisés proposent réellement ce type de service.
          - type: paragraphe
            texte: "Le portail public data.gouv.fr met à disposition un jeu de données de l'ADEME recensant des acteurs de :"
          - type: liste
            elements:
                - la réparation ;
                - du réemploi ;
                - de la réutilisation ;
                - du tri.
      questions:
          - id: q01
            type: texte
            enonce: "Q29 : Pourquoi est-il intéressant de disposer de données réelles permettant de localiser des réparateurs plutôt que de simplement dire « il faut réparer » ?"
    - id: a17
      titre: "14. Petit défi : quelle méthode est la plus rigoureuse ?"
      contenu:
          - type: paragraphe
            texte: Trois élèves recherchent pourquoi une lampe ne s'allume plus.
          - type: tableau
            colonnes:
                - Élève
                - Méthode utilisée
            lignes:
                - - Léa
                  - Elle décide immédiatement que la source lumineuse est cassée et veut la remplacer.
                - - Hugo
                  - Il décrit d'abord le dysfonctionnement, utilise plusieurs causes possibles proposées puis vérifie progressivement les plus simples.
                - - Inès
                  - Elle souhaite remplacer en même temps les piles, l'interrupteur et la source lumineuse.
      questions:
          - id: q01
            type: texte
            enonce: "Q30 : Quel élève utilise la méthode la plus logique ?"
          - id: q02
            type: texte
            enonce: "Q31 : Quel est le problème dans la méthode de Léa ?"
          - id: q03
            type: texte
            enonce: "Q32 : Quel est le problème dans la méthode d'Inès ?"
    - id: a18
      titre: 15. Conclusion du travail
      contenu:
          - type: paragraphe
            texte: "Sans retourner lire les parties précédentes, complétez :"
          - type: liste
            elements:
                - Un fonctionnement anormal d'un objet est appelé un ................................................ .
                - Ce qui provoque ce problème est sa ................................................ .
                - La recherche de l'origine d'un problème est appelée un ................................................ .
                - Une vérification permet parfois d'................................................ une cause possible.
                - Après une intervention, il faut toujours ................................................ l'objet.
          - type: paragraphe
            texte: "Dernière question :"
          - type: paragraphe
            texte: Expliquez en trois ou quatre phrases pourquoi il est préférable d'observer et de vérifier progressivement plutôt que de remplacer immédiatement une pièce au hasard.
          - type: paragraphe
            texte: Enregistrez votre travail puis déposez-le dans l'espace d'échange.
      questions: []
    - id: a19
      titre: Sources et ressources
      contenu:
          - type: liste
            elements:
                - "Ministère de l'Éducation nationale – Programme de technologie du cycle 4 : Programme officiel de technologie"
                - "Ministère de l'Éducation nationale – Programme de technologie, compétence « Identifier un dysfonctionnement d'un objet technique et y remédier » : Repères de progressivité 5e / 4e / 3e"
                - "ADEME – Réparation, garanties : ce qu'il faut savoir pour faire durer ses objets : Guide sur la réparation et l'allongement de la durée d'usage"
                - "ADEME – Que faire de mes objets et déchets ? Réparer : Ressource pratique sur la réparation"
                - "data.gouv.fr / ADEME – Acteurs de l'économie circulaire : Données ouvertes sur les acteurs de la réparation, du réemploi et du tri"
          - type: lien
            titre: Programme officiel de technologie
            url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
          - type: lien
            titre: Repères de progressivité 5e / 4e / 3e
            url: https://www.education.gouv.fr/sites/default/files/document/Annexe%20%E2%80%94%20Programme%20de%20technologie%20du%20cycle%204-368016.pdf
          - type: lien
            titre: Guide sur la réparation et l'allongement de la durée d'usage
            url: https://librairie.ademe.fr/consommer-autrement/5391-reparation-garanties-ce-qu-il-faut-savoir-pour-faire-durer-ses-objets.html
          - type: lien
            titre: Ressource pratique sur la réparation
            url: https://quefairedemesdechets.ademe.fr/reduction-des-dechets/reparation-objets/
          - type: lien
            titre: Données ouvertes sur les acteurs de la réparation, du réemploi et du tri
            url: https://www.data.gouv.fr/dataservices/acteurs-de-leconomie-circulaire-que-faire-de-mes-objets-et-dechets
          - type: paragraphe
            texte: Les pannes présentées dans cette séance sont des situations pédagogiques simplifiées. Elles permettent de travailler la logique du diagnostic sans démontage ni intervention sur du matériel réel. En situation réelle, certaines réparations nécessitent des compétences particulières, des outils adaptés ou l'intervention d'un professionnel.
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
introduction:
    - type: titre
      texte: "Compétence visée : Identifier un dysfonctionnement simple, exploiter des observations pour rechercher son origine et proposer une intervention adaptée"
    - type: paragraphe
      texte: "Objectifs d’apprentissage :"
    - type: liste
      elements:
          - Comprendre qu'un objet qui ne fonctionne plus n'est pas forcément définitivement inutilisable.
          - Distinguer un dysfonctionnement observé de sa cause.
          - Comprendre qu'il faut observer et vérifier avant d'intervenir.
          - Découvrir la notion de diagnostic.
          - Comprendre qu'une vérification apporte une information permettant d'écarter ou de privilégier une cause possible.
          - Comprendre qu'une intervention doit être suivie d'un nouveau test.
          - Comprendre que réparer peut, dans certaines situations, prolonger la durée d'utilisation d'un objet.
    - type: liste
      elements:
          - Décrire précisément un dysfonctionnement.
          - Utiliser une liste guidée de causes possibles.
          - Lire les résultats de vérifications simples.
          - Écarter progressivement certaines causes possibles.
          - Identifier une cause probable à partir d'indices.
          - Proposer une intervention simple.
          - Expliquer comment vérifier que l'intervention a résolu le problème.
    - type: liste
      elements:
          - Un document LibreOffice Writer nommé 5e_S8_nom1_nom2.odt.
          - Les noms et prénoms des élèves du groupe.
          - Le titre de la séance.
          - Les réponses aux différentes questions.
          - Un tableau de diagnostic.
          - L'analyse de plusieurs situations de dysfonctionnement.
          - Une courte conclusion expliquant la méthode utilisée.
    - type: paragraphe
      texte: Le document devra être enregistré puis déposé dans l'espace d'échange à la fin de la séance, même s'il n'est pas entièrement terminé.
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
