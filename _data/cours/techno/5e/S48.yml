titre: "Entraînement DNB : un arrosage raisonné"
theme: Réutiliser ses méthodes et préparer la suite
problematique: "Entraînement DNB : un arrosage raisonné"
pourquoi: Traiter un dossier nouveau en réutilisant ses méthodes.
application: Une méthode technique sert à expliquer, choisir et améliorer les outils du quotidien.
lien_precedent: "Après S47 — Présenter une amélioration avec des preuves, nous poursuivons avec un seul objectif : traiter un dossier nouveau en réutilisant ses méthodes."
activites:
    - id: a01
      titre: Comprendre le document
      pourquoi: Traiter un dossier nouveau en réutilisant ses méthodes.
      demarche:
          - Lire le document et repérer les mots utiles.
          - Répondre aux deux questions avec une information du document.
      contenu:
          - type: paragraphe
            texte: "Dossier fictif : un arrosage de jardin utilise une eau non potable stockée. Le programme doit seulement simuler une autorisation : niveau disponible ≥ 20 et aucune alerte. Une alerte active ou une donnée inconnue interdit l’autorisation."
          - type: tableau
            colonnes:
                - Cas
                - Niveau
                - Alerte
            lignes:
                - - A
                  - "35"
                  - "0"
                - - B
                  - "15"
                  - "0"
                - - C
                  - "35"
                  - "1"
                - - D
                  - Inconnu
                  - "0"
          - type: paragraphe
            texte: "Travail de 5e inspiré des habitudes du DNB actuel : lire, raisonner, expliquer. Les réponses peuvent être incomplètes si la démarche est clairement écrite. Il ne s’agit pas d’un sujet officiel."
      questions:
          - id: q01
            type: texte
            enonce: Pour quels cas l’autorisation doit-elle être donnée ? Justifier.
            aide: Vérifie toutes les conditions de chaque cas.
          - id: q02
            type: texte
            enonce: Quel rôle jouent les données d’entrée dans la décision du programme ?
            aide: Entrées → traitement → sortie.
    - id: a02
      titre: Faire, chercher et tester
      pourquoi: Mettre l’idée à l’épreuve plutôt que recopier une définition.
      demarche:
          - Travailler seul pendant vingt-cinq minutes, documents ouverts.
          - Relire en repérant unités, preuves et conditions.
          - Comparer une réponse à la mise en commun, puis noter une correction utile.
      contenu:
          - type: paragraphe
            texte: "Travaille au brouillon, dans le logiciel ou sur le schéma. Garde une trace d’essai : situation, résultat attendu et observation. En binôme, échangez les rôles au milieu du travail."
      questions:
          - id: q01
            type: texte
            enonce: Écrire les règles en français ou en blocs et proposer un essai juste au seuil.
            aide: L’égalité à 20 doit être traitée explicitement.
      ressources:
          - type: paragraphe
            texte: Sur le portail public, chercher qualité de l’eau et usages ; relever une information qui distingue observation et contrôle.
          - type: lien
            titre: Eaufrance — Portail public de l’eau
            url: https://www.eaufrance.fr/
    - id: a03
      titre: Entraînement DNB — justifier avec une preuve
      pourquoi: Relier sa réponse à une donnée et préciser une limite.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu:
          - type: paragraphe
            texte: "Habitudes du DNB, adaptées à la 5e : dossier court, réponse rédigée et démarche explicite. Ce travail n’est pas un sujet officiel et n’exige pas les connaissances de troisième."
      questions:
          - id: q01
            type: texte
            enonce: Un groupe conclut « l’eau peut être bue puisque l’arrosage est autorisé ». Corriger cette conclusion avec le document.
            aide: Ne transforme pas une décision d’usage en garantie sanitaire.
    - id: a04
      titre: Conserver et retenir
      pourquoi: Finir avec une trace réutilisable.
      demarche:
          - Vérifier le nom du projet ou de la trace.
          - Noter au brouillon une erreur corrigée ou une étape à reprendre.
      contenu: []
      questions: []
retenir:
    - Traiter un dossier nouveau en réutilisant ses méthodes.
    - Une réponse justifiée relie une idée à une information du document ou à un essai.
    - Un progrès se décrit avec un exemple ou une trace, pas seulement une impression.
bilan: Je conserve une trace qui montre ce que j’ai compris ou testé. Une erreur expliquée et corrigée est un progrès observable.
introduction:
    - type: paragraphe
      texte: "Objectif du jour : Traiter un dossier nouveau en réutilisant ses méthodes."
    - type: paragraphe
      texte: "Séance de 50 minutes de travail effectif : lire et comprendre, réaliser ou chercher, tester, puis faire un bilan. Les essais font partie du travail ; une version simple suffit pour commencer."
    - type: liste
      elements:
          - Une réponse justifiée relie une idée à une information du document ou à un essai.
          - Une démarche claire peut être utile même lorsque la réponse est incomplète.
          - Un progrès se décrit avec un exemple ou une trace, pas seulement une impression.
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
    - type: paragraphe
      texte: Les habitudes de rédaction et de justification prennent appui sur le cadre publié pour le DNB à compter de 2027. Le format devra être revérifié avant votre propre session.
    - type: lien
      titre: Éduscol — Épreuves et sujets de référence du DNB
      url: https://eduscol.education.gouv.fr/5607/les-epreuves-du-dnb
