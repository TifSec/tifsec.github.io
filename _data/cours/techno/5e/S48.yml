titre: 'Séance 48 : Revue de projet : présenter notre amélioration'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Notre amélioration du tracker répond-elle au besoin, et savons-nous le prouver devant la classe ?
competences_bo:
    - Imaginer, concevoir et réaliser une ou des solutions en réponse à un besoin, à des exigences (de développement durable, par exemple) ou à la nécessité d’améliorations dans une démarche de créativité
    - Valider les solutions techniques par des simulations ou par des protocoles de tests
objectifs:
    connaissances:
        - Une revue de projet permet de présenter son travail, de prouver ses résultats et de recevoir des conseils.
    competences:
        - Présenter oralement un projet avec un diaporama.
        - Évaluer la présentation d’un autre groupe avec une grille.
        - Tirer des conclusions pour améliorer.
pourquoi:
    - C’est la dernière étape du projet tracker.
    - Chaque groupe présente son amélioration pendant 3 à 4 minutes. Pendant ce temps, les autres groupes l’évaluent avec une grille et préparent une question.
activites:
    -   id: a01
        titre: La grille d’évaluation
        contenu:
            -   type: tableau
                titre: Document 1 — Grille
                colonnes:
                    - Critère
                    - Question à se poser
                lignes:
                    -   - Problème
                        - Le groupe explique-t-il pourquoi l’amélioration est utile ?
                    -   - Solution
                        - Explique-t-il ce qu’il a changé dans le programme ?
                    -   - Preuves
                        - Montre-t-il des tests avec attendu et observé ?
                    -   - Oral
                        - Parle-t-il au public, sans lire ?
        questions:
            -   id: q01
                type: texte
                enonce: 'Évalue un autre groupe (nomme son amélioration) : pour chaque critère de la grille, écris « oui », « en partie » ou « non », avec un mot d’explication.'
                aide: Combien d’éléments sont demandés ?
            -   id: q02
                type: texte
                enonce: Écris la question que tu as posée (ou que tu aurais posée) à ce groupe.
                aide: Combien d’éléments sont demandés ?
    -   id: a02
        titre: Notre présentation
        transition: 'Tu as évalué les autres. À votre tour : retenez ce que le public vous a dit.'
        questions:
            -   id: q01
                type: texte
                enonce: Quelle question vous a posé le public, et qu’avez-vous répondu ?
                aide: Repère le verbe de la question.
            -   id: q02
                type: texte
                enonce: Quel conseil avez-vous reçu ? Comment pourriez-vous l’appliquer ?
                aide: Repère le verbe de la question.
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un vrai ingénieur présente aussi ses limites.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle limite de votre amélioration auriez-vous dû présenter ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Les revues de projet sont terminées. Il reste à faire le bilan du projet.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : votre amélioration répond-elle au besoin, et avez-vous su le prouver ? Qu’as-tu appris pendant ce projet ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Une revue de projet : problème, solution, preuves, oral.'
    - Une évaluation est utile si elle est précise et bienveillante.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
