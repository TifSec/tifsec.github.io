titre: 'Séance 23 : Comment le mouvement passe-t-il du moteur à la pièce qui bouge ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Comment un objet transmet-il ou transforme-t-il le mouvement de son moteur ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - Un mécanisme transmet un mouvement (engrenage, poulies et courroie, pignons et chaîne) ou le transforme (pignon et crémaillère, treuil, vérin).
        - 'Dans un engrenage, la petite roue tourne plus vite que la grande : avec 30 dents qui entraînent 10 dents, la petite fait 3 tours quand la grande en fait 1.'
    competences:
        - Associer une solution technique (un mécanisme) à une fonction technique.
        - Reconnaître un mouvement de rotation et de translation.
pourquoi:
    - 'En séance 20, tu as ouvert un vieux lecteur CD : son tiroir s’ouvre grâce à une courroie et une crémaillère.'
    - Avant d’étudier l’énergie de l’éolienne, tu regardes comment le mouvement d’un moteur arrive jusqu’à la pièce qui bouge.
activites:
    -   id: a01
        titre: Transmettre une rotation
        consigne: Tu vas associer trois objets du quotidien à leur mécanisme de transmission, à partir du document 1. On attend le mécanisme de chaque objet et le sens de rotation dans un engrenage.
        contenu:
            -   type: tableau
                titre: Document 1 — Trois mécanismes qui transmettent une rotation
                colonnes:
                    - Mécanisme
                    - Ce qu’il fait
                    - Exemple
                lignes:
                    -   - Engrenage (roues dentées en contact)
                        - transmet une rotation ; les deux roues tournent en sens inverse
                        - batteur à œufs, perceuse
                    -   - Poulies et courroie
                        - transmet une rotation à distance ; même sens de rotation
                        - tiroir d’un lecteur CD, machine à laver
                    -   - Pignons et chaîne
                        - transmet une rotation à distance ; même sens ; ne glisse pas
                        - vélo
            -   type: paragraphe
                texte: 'Exemple expliqué : sur un vélo, le plateau (avec les pédales) et le pignon (sur la roue) sont loin l’un de l’autre : la chaîne transmet la rotation, dans le même sens, sans glisser.'
            -   type: etapes
                elements:
                    - 'Lis le document 1 : pour chaque mécanisme, ce qu’il fait et un exemple.'
                    - Pour chaque objet du tableau, cherche dans le document le mécanisme qui lui correspond.
                    - Pour le sens de rotation, relis la deuxième colonne du document 1.
            -   type: paragraphe
                texte: 'Pourquoi un mécanisme ? Le moteur n’est presque jamais placé juste sur la pièce qui bouge : il faut transporter son mouvement, parfois en changeant sa vitesse ou son sens.'
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, écris le mécanisme de chaque objet.
                colonnes:
                    - Objet
                    - Mécanisme
                lignes:
                    -   - Vélo
                        - ''
                    -   - Batteur à œufs
                        - ''
                    -   - Tiroir du lecteur CD (moteur → première roue)
                        - ''
                aide: Ligne × colonne.
            -   id: q02
                type: qcm
                enonce: Deux roues dentées sont en contact. La première tourne dans le sens des aiguilles d’une montre. Comment tourne la deuxième ?
                choix:
                    -   id: a
                        texte: Dans le sens inverse.
                    -   id: b
                        texte: Dans le même sens.
                    -   id: c
                        texte: Elle ne tourne pas.
                aide: Relis l’exemple expliqué.
    -   id: a02
        titre: Plus vite ou plus fort ?
        transition: Tu sais reconnaître un mécanisme. Regarde maintenant ce qu’il change à la vitesse.
        consigne: Tu vas calculer combien de tours fait une roue de vélo pour un tour de pédalier, avec l’exemple de l’engrenage. On attend un nombre de tours et le bon choix de pignon pour monter une côte.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : une roue de 30 dents entraîne une roue de 10 dents.'
                    - 'Quand la grande fait 1 tour, 30 dents passent : la petite (10 dents) fait donc 30 ÷ 10 = 3 tours.'
                    - Fais le même calcul pour le vélo de la question.
            -   type: paragraphe
                texte: 'Pourquoi changer la vitesse ? Une petite roue entraînée tourne vite ; une grande roue entraînée tourne lentement mais avec plus de force : c’est le principe des vitesses du vélo.'
        questions:
            -   id: q01
                type: nombre
                enonce: Un plateau de vélo a 40 dents, le pignon de la roue arrière en a 20. Combien de tours fait la roue quand le pédalier fait 1 tour ?
                unite: tours
                aide: N’oublie pas l’unité (réflexe n° 5).
            -   id: q02
                type: qcm
                enonce: Pour monter une côte, le cycliste veut moins forcer. Que choisit-il ?
                choix:
                    -   id: a
                        texte: Un plus grand pignon à l’arrière.
                    -   id: b
                        texte: Un plus petit pignon à l’arrière.
                    -   id: c
                        texte: Le même pignon, en pédalant plus fort.
                aide: Relis l’exemple expliqué.
    -   id: a03
        titre: Transformer un mouvement
        transition: Le mouvement peut aussi changer de nature.
        consigne: Tu vas reconnaître des mécanismes qui transforment une rotation en ligne droite, à partir du document 2 et du monte-charge. On attend le mouvement de sortie de chaque objet et une explication pour le monte-charge.
        contenu:
            -   type: tableau
                titre: Document 2 — Transformer un mouvement
                colonnes:
                    - Mécanisme
                    - Mouvement d’entrée
                    - Mouvement de sortie
                    - Exemple
                lignes:
                    -   - Pignon et crémaillère
                        - rotation
                        - translation (ligne droite)
                        - tiroir d’un lecteur CD, portail
                    -   - Poulie et câble (treuil)
                        - rotation
                        - translation
                        - monte-charge
                    -   - Vérin
                        - énergie de l’air ou de l’huile sous pression
                        - translation
                        - porte de bus, benne de tracteur
            -   type: etapes
                elements:
                    - Lis le document 2.
                    - Rotation = tourner autour d’un axe ; translation = avancer en ligne droite.
                    - Pour le monte-charge, suis le mouvement du moteur jusqu’à la cabine.
            -   type: paragraphe
                texte: Pourquoi transformer ? Un moteur tourne, mais une cabine, un tiroir ou une porte doivent avancer en ligne droite.
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 2, écris le mouvement de sortie de chaque objet (rotation ou translation).
                colonnes:
                    - Objet
                    - Mouvement de sortie
                lignes:
                    -   - Tiroir du lecteur CD
                        - ''
                    -   - Cabine du monte-charge
                        - ''
                    -   - Porte de bus (vérin)
                        - ''
                aide: Ligne × colonne.
            -   id: q02
                type: texte
                enonce: Explique comment le monte-charge transforme la rotation de son moteur en montée de la cabine. Utilise « car ».
                aide: Pense à « car » (réflexe n° 4).
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: 'On met trois roues dentées à la suite : A entraîne B, qui entraîne C.'
        questions:
            -   id: q01
                type: texte
                enonce: Si A tourne dans le sens des aiguilles d’une montre, dans quel sens tourne C ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment un objet transmet-il ou transforme-t-il le mouvement de son moteur ? Donne deux exemples de mécanismes.'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Transmettre une rotation : engrenage (sens inverse), poulies et courroie, pignons et chaîne.'
    - 'Transformer : pignon et crémaillère, poulie et câble, vérin → translation.'
    - Petite roue entraînée = plus vite ; grande roue entraînée = plus de force.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
