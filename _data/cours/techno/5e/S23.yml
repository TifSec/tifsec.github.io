titre: 'Séance 23 : Comment protéger mes données et mes comptes ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Comment protéger mes données et mes comptes sur Internet ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
objectifs:
    connaissances:
        - Un mot de passe solide est long, mélange lettres, chiffres et symboles, et n’est utilisé que pour un seul compte.
        - L’hameçonnage est un faux message qui imite un vrai site pour voler un mot de passe ; on le repère à l’adresse de l’expéditeur, au lien et à l’urgence demandée.
        - Les données personnelles (nom, adresse, photos) doivent être partagées avec prudence.
    competences:
        - Repérer un message d’hameçonnage.
        - Juger la solidité d’un mot de passe.
        - Appliquer des règles pour protéger ses comptes et ses données.
pourquoi:
    - En séance 13, tu as vu qui peut lire ou modifier une information, et que notre site de cours protège tes réponses avec ton compte.
    - Aujourd’hui, tu apprends à protéger toi-même tes comptes et tes données, comme un enquêteur qui repère les pièges.
activites:
    -   id: a01
        titre: Vrai ou faux message ?
        consigne: Tu vas analyser un faux message reçu par Léa (document 1, inventé) pour apprendre à reconnaître l’hameçonnage. On attend trois indices et ce que Léa doit faire.
        contenu:
            -   type: titre
                texte: Document 1 — Un message reçu par Léa (inventé)
            -   type: citation
                texte: 'De : support-ent@ent-colleges-gratuit.com

                    Objet : URGENT ! Ton compte sera supprimé dans 1 heure

                    Bonjour, ton compte ENT a un problème. Clique vite ici et écris ton identifiant et ton mot de passe pour le garder : http://ent-connexion-verif.biz'
            -   type: paragraphe
                texte: 'Exemple expliqué : un vrai service ne demande jamais ton mot de passe par message. Trois indices trahissent ce faux message : l’adresse de l’expéditeur n’est pas celle de l’ENT, le lien mène vers un autre site, et on te presse (« URGENT », « 1 heure »).'
            -   type: etapes
                elements:
                    - Lis le message du document 1.
                    - 'Lis l’exemple expliqué : les trois indices d’un faux message.'
                    - Cherche ces indices dans le message de Léa.
            -   type: paragraphe
                texte: 'Pourquoi un faux message ? Les pirates imitent les vrais services pour voler les mots de passe : savoir les repérer te protège.'
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, relève trois indices qui montrent que ce message est un piège.
                colonnes:
                    - Indice
                    - Ce que je relève
                lignes:
                    -   - Expéditeur
                        - ''
                    -   - Lien
                        - ''
                    -   - Ton du message
                        - ''
                aide: Ligne × colonne.
            -   id: q02
                type: qcm
                enonce: Que doit faire Léa ?
                choix:
                    -   id: a
                        texte: Ne pas cliquer, supprimer le message et prévenir un adulte.
                    -   id: b
                        texte: Cliquer vite pour sauver son compte.
                    -   id: c
                        texte: Répondre en donnant seulement son identifiant.
                aide: Relis l’exemple expliqué.
    -   id: a02
        titre: Un mot de passe solide
        transition: Tu sais repérer un piège. Le deuxième geste de protection, c’est un bon mot de passe.
        consigne: Tu vas apprendre à reconnaître un mot de passe solide, à partir de l’exemple expliqué. On attend « solide » ou « faible » pour chaque mot de passe et l’explication d’une règle.
        contenu:
            -   type: paragraphe
                texte: 'Exemple expliqué : « chat2012 » est un mauvais mot de passe : court, et facile à deviner (un animal et une date). « Mon-Velo-Vert-Roule-7-Fois! » est bien meilleur : long, avec des majuscules, des chiffres et des symboles, mais facile à retenir.'
            -   type: etapes
                elements:
                    - 'Lis l’exemple : « chat2012 » est faible, une phrase longue est solide.'
                    - Pour chaque mot de passe, regarde sa longueur et s’il se devine facilement.
                    - Écris « solide » ou « faible ».
            -   type: paragraphe
                texte: Pourquoi une phrase ? Elle est longue, donc difficile à deviner, mais facile à retenir pour toi.
        questions:
            -   id: q01
                type: tableau
                enonce: Pour chaque mot de passe, écris « solide » ou « faible ».
                colonnes:
                    - Mot de passe
                    - Solide ou faible ?
                lignes:
                    -   - '123456'
                        - ''
                    -   - Lea2013
                        - ''
                    -   - J’aime-Les-Crepes-Au-Sucre-42!
                        - ''
                aide: Ligne × colonne.
            -   id: q02
                type: qcm
                enonce: Pourquoi ne faut-il pas utiliser le même mot de passe partout ?
                choix:
                    -   id: a
                        texte: Si un site se fait voler ses mots de passe, tous tes comptes sont en danger.
                    -   id: b
                        texte: Parce que c’est interdit par la loi.
                    -   id: c
                        texte: Parce que les sites refusent les mots de passe déjà utilisés.
                aide: Relis l’exemple expliqué.
        ressources:
            - &id001
                type: lien
                titre: CNIL — Les conseils pour un bon mot de passe
                url: https://www.cnil.fr/fr/mots-de-passe-des-recommandations-de-securite-minimales-pour-les-entreprises-et-les-particuliers
    -   id: a03
        titre: Mes règles de protection
        transition: Tu sais faire un bon mot de passe. Rassemble maintenant tes règles personnelles de protection.
        consigne: Tu vas écrire tes propres règles pour protéger tes données et tes comptes. On attend trois règles, chacune avec le risque qu’elle évite.
        contenu:
            -   type: paragraphe
                texte: 'Rappel de la séance 13 : on donne le droit de lire ou de modifier une information seulement à ceux qui en ont besoin.'
            -   type: etapes
                elements:
                    - Relis les missions 1 et 2 et la séance 13.
                    - Choisis trois règles que tu vas vraiment appliquer.
                    - Pour chacune, écris le risque évité.
            -   type: paragraphe
                texte: Pourquoi tes règles ? Une règle que tu as choisie toi-même, tu l’appliques plus facilement.
        questions:
            -   id: q01
                type: texte
                enonce: Écris trois règles que tu vas appliquer pour protéger tes données et tes comptes. Pour chacune, explique le risque évité.
                aide: Pense à « car » (réflexe n° 4).
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: 'Certaines adresses de sites imitent les vraies : « faceb00k.com », « ent-college.fr.verif.biz »…'
        questions:
            -   id: q01
                type: texte
                enonce: Invente un exemple de fausse adresse qui imite un site que tu connais, et explique comment la repérer.
                aide: Pense à « car » (réflexe n° 4).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as repéré un piège et rédigé tes règles. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment protéger tes données et tes comptes sur Internet ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Mot de passe solide : long, varié, unique pour chaque compte, jamais partagé.'
    - 'Hameçonnage : faux message pressant qui demande un mot de passe ; on ne clique pas, on signale.'
    - Partager ses données personnelles avec prudence ; se déconnecter sur un poste partagé.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
    - *id001
