titre: Comment une mesure peut-elle déclencher un affichage ?
theme: Comparer des solutions d’énergie
problematique: Comment une mesure peut-elle déclencher un affichage ?
pourquoi: Modifier une condition à partir d’un seuil fourni.
application: Les choix d’énergie dépendent du lieu, des besoins et des essais.
lien_precedent: "Après S22 — Pourquoi orienter un panneau vers la lumière ?, nous poursuivons avec un seul objectif : modifier une condition à partir d’un seuil fourni."
activites:
    - id: a01
      titre: Comprendre le document
      pourquoi: Modifier une condition à partir d’un seuil fourni.
      demarche:
          - Lire le document et repérer les mots utiles.
          - Répondre aux deux questions avec une information du document.
      contenu:
          - type: paragraphe
            texte: "Dans MakeCode micro:bit, la mesure de lumière est un indice de 0 à 255. Dans le simulateur, on peut modifier le curseur lumineux. Notre règle pédagogique : indice inférieur à 80 → lune ; sinon → soleil."
          - type: code
            texte: |-
                Toujours :
                    si mesure de lumière < 80 : afficher lune
                    sinon : afficher soleil
      questions:
          - id: q01
            type: texte
            enonce: Quel affichage faut-il attendre pour l’indice 79 ? Et pour 80 ?
            aide: La valeur égale au seuil fait partie de la branche sinon.
          - id: q02
            type: texte
            enonce: Quel élément acquiert l’information et quel élément l’affiche dans le modèle micro:bit ?
            aide: Distingue l’entrée et la sortie.
    - id: a02
      titre: Faire, chercher et tester
      pourquoi: Mettre l’idée à l’épreuve plutôt que recopier une définition.
      demarche:
          - Reconstituer la règle en blocs dans une copie de projet.
          - Tester les indices 20, 79, 80 et 150.
          - Remplacer le seuil par 100 et refaire deux essais qui montrent une différence.
      contenu:
          - type: paragraphe
            texte: "Travaille au brouillon, dans le logiciel ou sur le schéma. Garde une trace d’essai : situation, résultat attendu et observation. En binôme, échangez les rôles au milieu du travail."
      questions:
          - id: q01
            type: texte
            enonce: Décrire un essai avant et après le changement de seuil, avec le même indice.
            aide: Choisis un indice entre les deux seuils.
      ressources:
          - type: paragraphe
            texte: Chercher comment faire varier la lumière dans le simulateur et ce que la mesure représente.
          - type: lien
            titre: MakeCode — Mesurer la lumière
            url: https://makecode.microbit.org/projects/light-level-meter
          - type: lien
            titre: Ouvrir le simulateur MakeCode micro:bit
            url: https://makecode.microbit.org/
    - id: a03
      titre: Expliquer ce que le test permet de conclure
      pourquoi: Relier sa réponse à une donnée et préciser une limite.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Peut-on transformer directement un indice de 150 en 150 watts de production solaire ?
            aide: Les deux grandeurs n’ont pas la même signification.
    - id: a04
      titre: Conserver et retenir
      pourquoi: Finir avec une trace réutilisable.
      demarche:
          - Vérifier le nom du projet ou de la trace.
          - Noter au brouillon une erreur corrigée ou une étape à reprendre.
      contenu: []
      questions: []
retenir:
    - Modifier une condition à partir d’un seuil fourni.
    - Une source fournit une énergie ; un convertisseur en change la forme.
    - Une solution est choisie pour un besoin et des contraintes, pas pour un seul avantage.
bilan: Je conserve une trace qui montre ce que j’ai compris ou testé. Une erreur expliquée et corrigée est un progrès observable.
introduction:
    - type: paragraphe
      texte: "Objectif du jour : Modifier une condition à partir d’un seuil fourni."
    - type: paragraphe
      texte: "Séance de 50 minutes de travail effectif : lire et comprendre, réaliser ou chercher, tester, puis faire un bilan. Les essais font partie du travail ; une version simple suffit pour commencer."
    - type: liste
      elements:
          - Une source fournit une énergie ; un convertisseur en change la forme.
          - Une comparaison doit préciser la grandeur, l’unité et les conditions des essais.
          - Une solution est choisie pour un besoin et des contraintes, pas pour un seul avantage.
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
