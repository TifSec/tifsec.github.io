titre: Comment une mesure peut-elle déclencher un affichage ?
theme: Comparer des solutions d’énergie
problematique: Comment une mesure peut-elle déclencher un affichage ?
pourquoi: Modifier une condition à partir d’un seuil fourni.
application: "Un seuil permet à un appareil de transformer une mesure en message ou en action."
lien_precedent: "Après S22 — Pourquoi orienter un panneau vers la lumière ?, nous poursuivons avec un seul objectif : modifier une condition à partir d’un seuil fourni."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: paragraphe
            texte: "Dans MakeCode micro:bit, la mesure de lumière est un indice de 0 à 255. Dans le simulateur, on peut modifier le curseur lumineux. Notre règle pédagogique : indice inférieur à 80 → lune ; sinon → soleil."
          - type: code
            texte: |-
                Toujours :
                    si mesure de lumière < 80 : afficher lune
                    sinon : afficher soleil
          - type: paragraphe
            texte: "Exemple guidé : une lampe s’allume si la luminosité est inférieure à 30 ; sinon, elle reste éteinte. À 20, elle s’allume. À 40, elle reste éteinte. Le seuil transforme une mesure en décision."
      questions:
          - id: q01
            type: texte
            enonce: Quel affichage faut-il attendre pour l’indice 79 ? Et pour 80 ?
            aide: La valeur égale au seuil fait partie de la branche sinon.
          - id: q02
            type: texte
            enonce: Quel élément acquiert l’information et quel élément l’affiche dans le modèle micro:bit ?
            aide: Distingue l’entrée et la sortie.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - Reconstituer la règle en blocs dans une copie de projet.
          - Tester les indices 20, 79, 80 et 150.
          - Remplacer le seuil par 100 et refaire deux essais qui montrent une différence.
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: Décrire un essai avant et après le changement de seuil, avec le même indice.
            aide: Choisis un indice entre les deux seuils.
      ressources:
          - type: paragraphe
            texte: Chercher comment faire varier la lumière dans le simulateur et ce que la mesure représente.
          - type: lien
            titre: MakeCode — Mesurer la lumière
            url: https://makecode.microbit.org/projects/light-level-meter
          - type: lien
            titre: Ouvrir le simulateur MakeCode micro:bit
            url: https://makecode.microbit.org/
    - id: a03
      titre: 3. Explique avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Peut-on transformer directement un indice de 150 en 150 watts de production solaire ?
            aide: Les deux grandeurs n’ont pas la même signification.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Un seuil compare une mesure à une limite pour produire une sortie."
    - "Modifier une condition à partir d’un seuil fourni."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Un seuil compare une mesure à une limite pour produire une sortie."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Modifier une condition à partir d’un seuil fourni."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : Un seuil permet à un appareil de transformer une mesure en message ou en action."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
