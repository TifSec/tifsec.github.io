titre: 'Séance 23 : Comment le mouvement passe-t-il du moteur à la pièce qui bouge ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Comment le lecteur CD transmet-il et transforme-t-il le mouvement de ses moteurs ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - Un mécanisme transmet un mouvement (poulies et courroie, engrenage, pignons et chaîne) ou le transforme (pignon et crémaillère, vis et écrou, treuil).
        - 'Quand une petite poulie entraîne une grande poulie, la grande tourne moins vite mais avec plus de force : avec 10 mm et 30 mm de diamètre, la grande fait 1 tour quand la petite en fait 3.'
    competences:
        - Associer une solution technique (un mécanisme) à une fonction technique.
        - Reconnaître un mouvement de rotation et de translation.
pourquoi:
    - En séance 20, tu as découvert qu’un vieux lecteur CD peut avoir une seconde vie. Aujourd’hui, tu l’ouvres pour regarder ses mécanismes.
    - 'Un lecteur CD a deux moteurs : l’un fait sortir le tiroir, l’autre fait tourner le disque. Comment leur mouvement arrive-t-il jusqu’à la pièce qui bouge ?'
activites:
    -   id: a01
        titre: Transmettre une rotation
        consigne: Tu vas observer un lecteur CD ouvert et retrouver, avec les documents 1 et 2, le mécanisme de chaque liaison entre un moteur et la pièce qu’il fait bouger. On attend le mécanisme de chaque liaison et le sens de rotation dans un engrenage.
        contenu:
            -   type: tableau
                titre: Document 1 — Ce que l’on observe dans un lecteur CD ouvert (débranché)
                colonnes:
                    - Pièce du lecteur CD
                    - Ce que l’on observe
                lignes:
                    -   - Moteur du tiroir
                        - petit moteur électrique, avec une petite poulie sur son axe
                    -   - Courroie
                        - élastique qui relie la petite poulie du moteur à une grande poulie
                    -   - Roues dentées
                        - la grande poulie porte une petite roue dentée qui fait tourner une autre roue dentée
                    -   - Crémaillère
                        - 'barre dentée fixée sous le tiroir : la dernière roue dentée la pousse'
                    -   - Moteur du disque
                        - le disque est posé directement sur l’axe de son moteur
            -   type: tableau
                titre: Document 2 — Mécanismes qui transmettent une rotation
                colonnes:
                    - Mécanisme
                    - Ce qu’il fait
                lignes:
                    -   - Poulies et courroie
                        - transmet une rotation à distance ; les deux poulies tournent dans le même sens
                    -   - Engrenage (roues dentées en contact)
                        - transmet une rotation ; les deux roues tournent en sens inverse
                    -   - Pignons et chaîne
                        - transmet une rotation à distance, sans glisser (comme sur un vélo)
                    -   - Entraînement direct
                        - 'la pièce est fixée sur l’axe du moteur : pas de mécanisme'
            -   type: etapes
                elements:
                    - Au poste maquette, ouvre et ferme le tiroir à la main (lecteur débranché, capot retiré par le professeur) et suis le mouvement depuis le moteur.
                    - Lis le document 1 (ce que l’on observe) et le document 2 (les mécanismes).
                    - Pour chaque liaison du tableau, cherche le mécanisme du document 2 qui lui correspond.
            -   type: paragraphe
                texte: 'Pourquoi un mécanisme ? Le moteur n’est presque jamais placé juste sur la pièce qui bouge : il faut transporter son mouvement, parfois en changeant sa vitesse ou son sens.'
        questions:
            -   id: q01
                type: tableau
                enonce: D’après les documents 1 et 2 et ton observation, écris le mécanisme de chaque liaison du lecteur CD.
                colonnes:
                    - Liaison dans le lecteur CD
                    - Mécanisme
                lignes:
                    -   - Petite poulie du moteur → grande poulie
                        - ''
                    -   - Petite roue dentée → roue dentée suivante
                        - ''
                    -   - Moteur du disque → disque
                        - ''
                aide: 'Suis le mouvement dans le lecteur ouvert : entre deux poulies, il y a un élastique ; entre deux roues dentées, les dents se touchent ; pour le disque, regarde s’il y a une pièce entre lui et son moteur. Le document 2 donne les noms.'
            -   id: q02
                type: qcm
                enonce: Dans le lecteur CD, deux roues dentées sont en contact. La première tourne dans le sens des aiguilles d’une montre. Comment tourne la deuxième ?
                choix:
                    -   id: a
                        texte: Dans le sens inverse.
                    -   id: b
                        texte: Dans le même sens.
                    -   id: c
                        texte: Elle ne tourne pas.
                aide: 'Tourne doucement le tiroir à la main et regarde deux roues dentées qui se touchent : tournent-elles dans le même sens ?'
    -   id: a02
        titre: Plus vite ou plus fort ?
        transition: Tu sais reconnaître un mécanisme. Regarde maintenant ce qu’il change à la vitesse.
        consigne: Tu vas calculer, avec l’exemple des poulies, combien de tours fait le moteur du tiroir pour un tour de la grande poulie, puis le vérifier sur le lecteur CD de la classe. On attend un nombre de tours et l’intérêt de ce choix du fabricant.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : une poulie de 10 mm de diamètre entraîne une poulie de 30 mm.'
                    - 'La grande poulie est 30 ÷ 10 = 3 fois plus grande : la petite doit faire 3 tours pour que la grande en fasse 1.'
                    - Fais le même calcul avec les poulies du lecteur CD de la question.
                    - 'Au poste maquette, mesure à la règle le diamètre des deux poulies du lecteur de la classe : trouves-tu le même rapport ?'
            -   type: paragraphe
                texte: Pourquoi une petite poulie sur le moteur ? Le petit moteur tourne très vite mais avec peu de force ; la grande poulie ralentit le mouvement et donne plus de force pour pousser le tiroir.
        questions:
            -   id: q01
                type: nombre
                enonce: Dans un lecteur CD, la poulie du moteur a un diamètre de 6 mm et la grande poulie un diamètre de 24 mm. Combien de tours fait le moteur pour 1 tour de la grande poulie ?
                unite: tours
                aide: 'Fais comme dans l’exemple 30 ÷ 10 : divise le diamètre de la grande poulie par celui de la petite. Le résultat dit combien de tours fait le moteur.'
            -   id: q02
                type: qcm
                enonce: Pourquoi le fabricant a-t-il mis une petite poulie sur le moteur et une grande poulie ensuite ?
                choix:
                    -   id: a
                        texte: Pour que le tiroir sorte lentement, avec assez de force.
                    -   id: b
                        texte: Pour que le tiroir sorte le plus vite possible.
                    -   id: c
                        texte: Pour que le lecteur soit plus joli.
                aide: Le petit moteur tourne très vite. Après la grande poulie, le mouvement est-il plus lent ou plus rapide ? Et la force pour pousser le tiroir ?
    -   id: a03
        titre: Transformer un mouvement
        transition: Le mouvement peut aussi changer de nature.
        consigne: Tu vas reconnaître, sur le lecteur CD, les pièces qui tournent et celles qui avancent en ligne droite, puis expliquer comment sort le tiroir. On attend le mouvement de chaque pièce et une explication pour le tiroir.
        contenu:
            -   type: tableau
                titre: Document 3 — Transformer un mouvement
                colonnes:
                    - Mécanisme
                    - Mouvement d’entrée
                    - Mouvement de sortie
                    - Exemple
                lignes:
                    -   - Pignon et crémaillère
                        - rotation
                        - translation (ligne droite)
                        - tiroir du lecteur CD
                    -   - Vis et écrou
                        - rotation
                        - translation
                        - chariot du laser qui avance sous le disque
                    -   - Poulie et câble (treuil)
                        - rotation
                        - translation
                        - cabine du monte-charge
            -   type: etapes
                elements:
                    - Lis le document 3.
                    - 'Au poste maquette, ouvre et ferme le tiroir à la main : regarde la dernière roue dentée et la crémaillère sous le tiroir.'
                    - 'Repère aussi le chariot du laser sous le disque : comment avance-t-il ?'
                    - Rotation = tourner autour d’un axe ; translation = avancer en ligne droite.
            -   type: paragraphe
                texte: Pourquoi transformer ? Les moteurs tournent, mais le tiroir et le chariot du laser doivent avancer en ligne droite.
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 3 et ton observation, écris le mouvement de chaque pièce du lecteur CD (rotation ou translation).
                colonnes:
                    - Pièce du lecteur CD
                    - Mouvement
                lignes:
                    -   - Tiroir
                        - ''
                    -   - Disque
                        - ''
                    -   - Chariot du laser
                        - ''
                aide: 'Pour chaque pièce, demande-toi : tourne-t-elle sur elle-même, ou avance-t-elle en ligne droite ? Le document 3 t’aide pour le chariot du laser.'
            -   id: q02
                type: texte
                enonce: Explique comment le tiroir du lecteur CD transforme la rotation de son moteur en sortie du tiroir. Utilise « car ».
                aide: 'Regarde sous le tiroir : la dernière roue dentée tourne, et ses dents poussent une barre dentée. À quoi est fixée cette barre ? Explique avec « car ».'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: 'Dans le tiroir, trois roues dentées se suivent : A entraîne B, qui entraîne C.'
        questions:
            -   id: q01
                type: texte
                enonce: Si A tourne dans le sens des aiguilles d’une montre, dans quel sens tourne C ?
                aide: 'Applique la règle de la mission 1 deux fois : A fait tourner B dans un sens, puis B fait tourner C. Dessine trois cercles et des flèches si besoin.'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment le lecteur CD transmet-il et transforme-t-il le mouvement de ses moteurs ? Donne deux exemples de mécanismes.'
                aide: 'Deux idées : transmettre une rotation (cite un mécanisme du lecteur) et la transformer en translation (le tiroir ou le chariot du laser).'
retenir:
    - 'Transmettre une rotation : poulies et courroie (même sens), engrenage (sens inverse), pignons et chaîne.'
    - 'Transformer : pignon et crémaillère, vis et écrou, poulie et câble → translation.'
    - 'Petite poulie qui entraîne une grande : moins vite, plus de force.'
sources:
