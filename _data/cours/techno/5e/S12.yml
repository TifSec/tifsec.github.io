titre: Qu’est-ce qui agit, qu’est-ce qui informe ?
theme: Comprendre et commander un monte-charge
problematique: Qu’est-ce qui agit, qu’est-ce qui informe ?
pourquoi: Associer une fonction à un constituant.
application: Un monte-charge déplace une charge et renseigne son utilisateur.
lien_precedent: "Après S11 — À quoi sert notre monte-charge ?, nous poursuivons avec un seul objectif : associer une fonction à un constituant."
activites:
    - id: a01
      titre: Comprendre le document
      pourquoi: Associer une fonction à un constituant.
      demarche:
          - Lire le document et repérer les mots utiles.
          - Répondre aux deux questions avec une information du document.
      contenu:
          - type: paragraphe
            texte: "L’utilisateur appuie sur le bouton pour demander la montée. Le moteur, alimenté en électricité, fait monter la plateforme. Le détecteur du haut signale à la carte de commande : « la plateforme est arrivée en haut ». La carte commande alors l’arrêt du moteur. Le détecteur indique donc une position ; c’est le moteur qui fait monter la plateforme."
          - type: code
            texte: |-
                Bouton → carte de commande → ordre au système moteur
                Détecteur haut → information « arrivée en haut » → carte
      questions:
          - id: q01
            type: texte
            enonce: Quel constituant fournit l’information « arrivée en haut » ?
            aide: Cherche celui qui renseigne la carte.
          - id: q02
            type: texte
            enonce: Expliquer la différence entre le rôle du moteur et celui du détecteur.
            aide: Utilise les verbes agir et informer.
    - id: a02
      titre: Faire, chercher et tester
      pourquoi: Mettre l’idée à l’épreuve plutôt que recopier une définition.
      demarche:
          - Reprendre le dessin de S11.
          - Tracer en bleu le trajet des informations, en noir le trajet du mouvement.
          - Ajouter une légende compréhensible même sans voir les couleurs.
      contenu:
          - type: paragraphe
            texte: "Travaille au brouillon, dans le logiciel ou sur le schéma. Garde une trace d’essai : situation, résultat attendu et observation. En binôme, échangez les rôles au milieu du travail."
      questions:
          - id: q01
            type: texte
            enonce: Écrire le trajet de l’information d’arrivée avec trois éléments et des flèches.
            aide: Nomme ce qui est transmis sur chaque flèche.
      ressources:
          - type: paragraphe
            texte: "Observer la présentation du support : identifier la maquette et son modèle numérique, sans suivre les missions avancées de 4e–3e."
          - type: lien
            titre: Édubase — Présentation du monte-charge
            url: https://edubase.eduscol.education.fr/fiche/24732
    - id: a03
      titre: Expliquer ce que le test permet de conclure
      pourquoi: Relier sa réponse à une donnée et préciser une limite.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Un dessin relie directement le bouton à la plateforme sans commande ni mécanisme. Quels éléments faut-il ajouter pour expliquer le fonctionnement ?
            aide: Demande-toi ce qui décide et ce qui met en mouvement.
    - id: a04
      titre: Conserver et retenir
      pourquoi: Finir avec une trace réutilisable.
      demarche:
          - Vérifier le nom du projet ou de la trace.
          - Noter au brouillon une erreur corrigée ou une étape à reprendre.
      contenu: []
      questions: []
retenir:
    - Associer une fonction à un constituant.
    - Une fonction décrit ce que fait un élément ; un constituant est la pièce qui réalise cette fonction.
    - "Un modèle représente certains aspects du réel : il faut préciser ce qu’il permet de vérifier."
bilan: Je conserve une trace qui montre ce que j’ai compris ou testé. Une erreur expliquée et corrigée est un progrès observable.
introduction:
    - type: paragraphe
      texte: "Objectif du jour : Associer une fonction à un constituant."
    - type: paragraphe
      texte: "Séance de 50 minutes de travail effectif : lire et comprendre, réaliser ou chercher, tester, puis faire un bilan. Les essais font partie du travail ; une version simple suffit pour commencer."
    - type: liste
      elements:
          - Une fonction décrit ce que fait un élément ; un constituant est la pièce qui réalise cette fonction.
          - Une information renseigne le programme ; une action produit un changement.
          - "Un modèle représente certains aspects du réel : il faut préciser ce qu’il permet de vérifier."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
