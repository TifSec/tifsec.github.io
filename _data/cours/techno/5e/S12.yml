titre: Qu’est-ce qui agit, qu’est-ce qui informe ?
theme: Comprendre et commander un monte-charge
problematique: Qu’est-ce qui agit, qu’est-ce qui informe ?
pourquoi: Associer une fonction à un constituant.
application: "Dans un appareil, reconnaître quelle pièce agit et quelle pièce informe aide à comprendre son fonctionnement."
lien_precedent: "Après S11 — À quoi sert notre monte-charge ?, nous poursuivons avec un seul objectif : associer une fonction à un constituant."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: paragraphe
            texte: "L’utilisateur appuie sur le bouton pour demander la montée. Le moteur, alimenté en électricité, fait monter la plateforme. Le détecteur du haut signale à la carte de commande : « la plateforme est arrivée en haut ». La carte commande alors l’arrêt du moteur. Le détecteur indique donc une position ; c’est le moteur qui fait monter la plateforme."
          - type: code
            texte: |-
                Bouton → carte de commande → ordre au système moteur
                Détecteur haut → information « arrivée en haut » → carte
          - type: paragraphe
            texte: "Exemple guidé sur le monte-charge : le moteur fait monter la plateforme. « Faire monter » est sa fonction ; le moteur est le constituant qui la réalise. Le détecteur, lui, informe la carte de la position. On distingue donc l’action et l’information."
      questions:
          - id: q01
            type: texte
            enonce: Quel constituant fournit l’information « arrivée en haut » ?
            aide: Cherche celui qui renseigne la carte.
          - id: q02
            type: texte
            enonce: Expliquer la différence entre le rôle du moteur et celui du détecteur.
            aide: Utilise les verbes agir et informer.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - Reprendre le dessin de S11.
          - Tracer en bleu le trajet des informations, en noir le trajet du mouvement.
          - Ajouter une légende compréhensible même sans voir les couleurs.
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: Écrire le trajet de l’information d’arrivée avec trois éléments et des flèches.
            aide: Nomme ce qui est transmis sur chaque flèche.
      ressources:
          - type: paragraphe
            texte: "Observer la présentation du support : identifier la maquette et son modèle numérique, sans suivre les missions avancées de 4e–3e."
          - type: lien
            titre: Édubase — Présentation du monte-charge
            url: https://edubase.eduscol.education.fr/fiche/24732
    - id: a03
      titre: 3. Explique avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Un dessin relie directement le bouton à la plateforme sans commande ni mécanisme. Quels éléments faut-il ajouter pour expliquer le fonctionnement ?
            aide: Demande-toi ce qui décide et ce qui met en mouvement.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Une fonction dit ce que fait une pièce ; un constituant est la pièce elle-même."
    - "Associer une fonction à un constituant."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Une fonction dit ce que fait une pièce ; un constituant est la pièce elle-même."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Associer une fonction à un constituant."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : Dans un appareil, reconnaître quelle pièce agit et quelle pièce informe aide à comprendre son fonctionnement."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
