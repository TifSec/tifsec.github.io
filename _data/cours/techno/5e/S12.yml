titre: 'Séance 12 : Bilan et entraînement au brevet n° 1'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Suis-je capable d’utiliser mes méthodes sur un dossier de type brevet ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
    - Décrire les interactions entre un objet ou un système technique, son environnement et les utilisateurs
objectifs:
    connaissances:
        - 'Un sujet de brevet en technologie est un dossier : des documents, puis des questions qui s’appuient sur eux.'
    competences:
        - Utiliser les réflexes brevet n° 1 à 4 sur un dossier.
        - Lire un tableau de données et justifier une réponse.
pourquoi:
    - Depuis la rentrée, tu as appris quatre réflexes pour répondre aux questions.
    - Aujourd’hui, tu les utilises sur un petit dossier, comme au brevet, mais adapté à la 5e. Ce n’est pas un sujet officiel.
activites:
    -   id: a01
        titre: Lire le dossier
        contenu:
            -   type: citation
                texte: 'Réflexe brevet n° 1 : je repère le verbe.'
            -   type: citation
                texte: 'Réflexe brevet n° 2 : « D’après le document… ».'
            -   type: citation
                texte: 'Réflexe brevet n° 3 : phrase qui reprend la question.'
            -   type: citation
                texte: 'Réflexe brevet n° 4 : « car » + un fait précis du document.'
            -   type: titre
                texte: Document 1 — La trottinette électrique
            -   type: citation
                texte: La trottinette électrique permet de se déplacer en ville sans effort sur de petites distances. Un moteur électrique placé dans la roue avant la fait avancer. Une batterie fournit l’énergie ; on la recharge sur une prise. L’utilisateur accélère avec une gâchette et freine avec un levier. Un phare LED et un feu arrière la rendent visible la nuit. Le port du casque est recommandé.
            -   type: titre
                texte: Document 2 — Deux modèles
            -   type: tableau
                colonnes:
                    - Modèle
                    - Autonomie
                    - Masse
                    - Vitesse maximale
                    - Prix
                lignes:
                    -   - Modèle A
                        - 20 km
                        - 12 kg
                        - 20 km/h
                        - 300 €
                    -   - Modèle B
                        - 35 km
                        - 17 kg
                        - 25 km/h
                        - 550 €
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 1, à quel besoin répond la trottinette électrique ?
                choix:
                    -   id: a
                        texte: Se déplacer en ville sans effort sur de petites distances.
                    -   id: b
                        texte: Transporter des marchandises lourdes.
                    -   id: c
                        texte: Faire du sport intensif.
            -   id: q02
                type: texte
                enonce: Cite deux éléments extérieurs de la trottinette.
            -   id: q03
                type: texte
                enonce: Explique le rôle du phare LED et du feu arrière. Réponds par une phrase qui reprend la question.
    -   id: a02
        titre: Comparer deux modèles
        transition: Tu as décrit l’objet. Au brevet, on te demande aussi de choisir entre deux solutions avec des données.
        contenu:
            -   type: paragraphe
                texte: 'Réutilise la méthode de la séance 9 : comparer avec des données.'
        questions:
            -   id: q01
                type: nombre
                enonce: D’après le document 2, de combien de kilomètres l’autonomie du modèle B dépasse-t-elle celle du modèle A ?
                unite: km
            -   id: q02
                type: qcm
                enonce: Léa habite à 4 km du collège et doit porter sa trottinette dans l’escalier. Quel modèle lui conseiller ?
                choix:
                    -   id: a
                        texte: Le modèle A, plus léger et suffisant pour 8 km par jour.
                    -   id: b
                        texte: Le modèle B, car il va plus vite.
            -   id: q03
                type: texte
                enonce: Justifie ton conseil à Léa avec deux faits du document 2 (réflexe n° 4).
    -   id: a03
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un troisième modèle coûte 400 € et a 25 km d’autonomie, pour 14 kg.
        questions:
            -   id: q01
                type: texte
                enonce: Ce modèle serait-il un bon choix pour Léa ? Justifie.
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as répondu au dossier. Faire le point sur ses réflexes aide à progresser pour le prochain entraînement.
        questions:
            -   id: q01
                type: texte
                enonce: Relis tes réponses. Quel réflexe as-tu le mieux utilisé, et lequel dois-tu encore travailler ? Donne un exemple tiré de ta copie. Dis ce que tu feras pour progresser.
retenir:
    - 'Un sujet de brevet : des documents, puis des questions qui s’appuient sur eux.'
    - 'Les quatre premiers réflexes : verbe, « D’après le document », phrase complète, « car » + fait.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
