titre: 'Séance 3 : À quoi sert cet objet, et pour qui ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Comment présenter clairement à quoi sert un objet et pour qui il a été fabriqué ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
objectifs:
    connaissances:
        - L’utilisateur est la personne à qui l’objet rend service.
        - 'Un objet agit sur quelque chose : une feuille, un crayon, des légumes…'
        - 'La fonction d’usage, c’est ce à quoi sert l’objet. Elle s’écrit avec un verbe à l’infinitif : effacer, couper, éclairer…'
    competences:
        - Présenter un objet avec la méthode des trois questions.
        - Écrire la fonction d’usage d’un objet avec un verbe.
        - Prendre une information dans un document et dire d’où elle vient.
pourquoi:
    - En séance 2, tu as appris qu’un objet technique répond à un besoin.
    - Aujourd’hui, tu vas apprendre une méthode en trois questions pour présenter n’importe quel objet. Tu t’en serviras toute l’année, par exemple pour présenter le monte-charge ou l’éolienne.
activites:
    -   id: a01
        titre: La méthode des trois questions
        contenu:
            -   type: paragraphe
                texte: Pour présenter un objet, on répond à trois questions. Voici l’exemple de la gomme, entièrement expliqué.
            -   type: tableau
                titre: 'Exemple expliqué : la gomme'
                colonnes:
                    - Question
                    - Réponse pour la gomme
                    - Pourquoi cette réponse ?
                lignes:
                    -   - 1. À qui l’objet rend-il service ?
                        - À l’élève.
                        - 'C’est lui qui utilise la gomme : c’est l’utilisateur.'
                    -   - 2. Sur quoi l’objet agit-il ?
                        - Sur le trait de crayon, sur la feuille.
                        - C’est ce que la gomme modifie quand on s’en sert.
                    -   - 3. Dans quel but ? (sa fonction d’usage)
                        - Effacer le trait de crayon.
                        - 'C’est ce à quoi sert la gomme. La réponse commence par un verbe : « effacer ».'
            -   type: paragraphe
                texte: 'Attention : la couleur, le prix ou la matière ne sont pas la fonction d’usage. Ils décrivent l’objet, mais ne disent pas à quoi il sert.'
        questions:
            -   id: q01
                type: tableau
                enonce: Fais comme pour la gomme avec un taille-crayon.
                colonnes:
                    - Question
                    - Réponse pour le taille-crayon
                lignes:
                    -   - 1. À qui l’objet rend-il service ?
                        - ''
                    -   - 2. Sur quoi l’objet agit-il ?
                        - ''
                    -   - 3. Dans quel but ? (sa fonction d’usage)
                        - ''
                aide: Garde l’exemple de la gomme sous les yeux et change seulement ce qui est différent. Pour la ligne 3, commence par un verbe.
            -   id: q02
                type: qcm
                enonce: Quelle phrase est une fonction d’usage bien écrite ?
                choix:
                    -   id: a
                        texte: Tailler un crayon.
                    -   id: b
                        texte: Il est rouge et en plastique.
                    -   id: c
                        texte: On l’achète au supermarché.
                aide: 'Méthode : 1) lis toutes les réponses avant de choisir ; 2) élimine celles qui sont impossibles ; 3) vérifie ton choix avec le document ou l’exemple expliqué de la mission.'
    -   id: a02
        titre: La même méthode avec d’autres objets
        transition: Tu as appliqué la méthode à un objet très proche de l’exemple. Essaie maintenant avec deux autres objets de ta trousse.
        contenu:
            -   type: paragraphe
                texte: 'Rappel de la méthode : 1. À qui l’objet rend-il service ? 2. Sur quoi agit-il ? 3. Dans quel but ? La réponse 3 commence par un verbe.'
        questions:
            -   id: q01
                type: tableau
                enonce: Complète le tableau pour la règle et pour les ciseaux.
                colonnes:
                    - Objet
                    - À qui rend-il service ?
                    - Sur quoi agit-il ?
                    - Dans quel but ?
                lignes:
                    -   - La règle
                        - ''
                        - ''
                        - ''
                    -   - Les ciseaux
                        - ''
                        - ''
                        - ''
                aide: 'Pour la règle, demande-toi ce que tu fais avec elle sur ta feuille : tracer ? mesurer ?'
            -   id: q02
                type: qcm
                enonce: Les ciseaux et un couteau de cuisine sont deux objets différents, mais leur fonction d’usage est presque la même. Laquelle ?
                choix:
                    -   id: couper
                        texte: Couper.
                    -   id: mesurer
                        texte: Mesurer.
                    -   id: coller
                        texte: Coller.
                aide: 'Méthode : 1) lis toutes les réponses avant de choisir ; 2) élimine celles qui sont impossibles ; 3) vérifie ton choix avec le document ou l’exemple expliqué de la mission.'
    -   id: a03
        titre: 'Réflexe brevet n° 2 : dire où on a trouvé l’information'
        transition: 'Au brevet, on te donne des documents : il faut y chercher l’information, puis dire d’où elle vient. Tu vas t’entraîner avec la fiche d’un surligneur, en réutilisant la méthode des trois questions.'
        contenu:
            -   type: etapes
                elements:
                    - Je lis la question et je repère ce que je cherche.
                    - Je trouve la phrase du document qui répond.
                    - Je commence ma réponse par « D’après le document… ».
            -   type: titre
                texte: Document 1 — Fiche d’un surligneur (exemple inventé pour l’exercice)
            -   type: citation
                texte: 'Le surligneur Fluo+ est conçu pour les élèves et les étudiants. Son encre jaune transparente fait ressortir les mots importants d’un cours sans les cacher. Son capuchon est percé d’un petit trou : si un enfant l’avale par accident, l’air peut encore passer. Il est vendu par lot de 4.'
            -   type: paragraphe
                texte: 'Exemple expliqué. Question : « De quelle couleur est l’encre ? » Je cherche une couleur. La phrase utile est : « Son encre jaune transparente… ». Je réponds : « D’après le document 1, l’encre est jaune et transparente. »'
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 1, à qui ce surligneur rend-il service ?
                choix:
                    -   id: a
                        texte: Aux élèves et aux étudiants.
                    -   id: b
                        texte: Aux peintres.
                    -   id: c
                        texte: Aux cuisiniers.
                aide: 'Méthode : 1) lis toutes les réponses avant de choisir ; 2) élimine celles qui sont impossibles ; 3) vérifie ton choix avec le document ou l’exemple expliqué de la mission.'
            -   id: q02
                type: texte
                enonce: D’après le document 1, quelle est la fonction d’usage du surligneur ? Commence ta réponse par « D’après le document 1… ».
                aide: Cherche la phrase qui dit ce que fait l’encre. Ta réponse doit contenir un verbe à l’infinitif.
            -   id: q03
                type: texte
                enonce: Pourquoi le capuchon est-il percé d’un trou ? Réponds en disant d’où vient l’information.
                aide: Relis la troisième phrase du document.
    -   id: a04
        titre: L’objet mystère
        defi: true
        facultatif: true
        contenu:
            -   type: citation
                texte: 'Je rends service au cuisinier. J’agis sur les légumes. Mon but : les découper en fines lamelles toutes pareilles.'
        questions:
            -   id: q01
                type: texte
                enonce: Qui suis-je ? Puis invente à ton tour une devinette avec les trois questions pour un objet de ton choix.
                aide: Pense aux ustensiles d’une cuisine. Pour ta devinette, ne donne pas le nom de l’objet !
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu connais maintenant la méthode des trois questions et tu sais prendre une information dans un document. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Choisis un objet que nous n’avons pas étudié aujourd’hui (dans ta chambre, ta cuisine ou ton cartable). Présente-le en 2 ou 3 phrases : à qui il rend service, sur quoi il agit et quelle est sa fonction d’usage.'
                aide: 'Tu peux commencer par : « Le … rend service à… Il agit sur… Sa fonction d’usage est de… »'
retenir:
    - 'Pour présenter un objet : à qui rend-il service ? sur quoi agit-il ? dans quel but ?'
    - La fonction d’usage dit à quoi sert l’objet. Elle s’écrit avec un verbe à l’infinitif.
    - 'Réflexe brevet n° 2 : je commence par « D’après le document… » quand j’utilise une information d’un document.'
