titre: Comment un vélo peut-il remplir toutes ses fonctions ?
theme: "Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser"
problematique: Pour permettre à une personne de se déplacer à vélo, quels problèmes les concepteurs ont-ils dû résoudre ?
pourquoi: "Objectif de cette séance : Comprendre qu’un problème complexe peut être décomposé en plusieurs problèmes plus simples."
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Comprendre qu’un problème complexe peut être décomposé en plusieurs problèmes plus simples.
        - Découvrir la notion de fonction technique.
        - Comprendre qu’une fonction technique peut être réalisée par une ou plusieurs pièces.
        - Découvrir que plusieurs solutions techniques différentes peuvent répondre à une même fonction.
    competences: []
activites:
    - id: a04
      titre: 1. Un problème qui semble simple...
      contenu:
          - type: paragraphe
            texte: Lors de la séance précédente, nous avons vu qu’un vélo répond principalement au besoin de se déplacer.
          - type: paragraphe
            texte: "Mais fabriquer un vélo ne consiste pas simplement à résoudre le problème :"
          - type: paragraphe
            texte: « Comment se déplacer ? »
          - type: paragraphe
            texte: Imaginez que vous deviez concevoir un vélo sans en avoir jamais vu.
          - type: paragraphe
            texte: "Vous savez seulement qu’une personne doit pouvoir :"
          - type: liste
            elements:
                - monter dessus ;
                - se déplacer ;
                - choisir sa direction ;
                - rester suffisamment stable ;
                - ralentir et s’arrêter.
          - type: paragraphe
            texte: "Question : s’agit-il vraiment d’un seul problème à résoudre ?"
      questions: []
    - id: a05
      titre: 2. Décomposer le problème
      contenu:
          - type: paragraphe
            texte: En groupe, imaginez que vous êtes les concepteurs du vélo.
          - type: paragraphe
            texte: "Votre mission est de répondre à la question :"
          - type: paragraphe
            texte: « Que doit être capable de faire le vélo pour permettre à une personne de se déplacer correctement ? »
          - type: paragraphe
            texte: Trouvez au minimum cinq actions différentes.
          - type: paragraphe
            texte: Essayez de formuler chaque proposition avec un verbe à l’infinitif.
          - type: paragraphe
            texte: "Vous pouvez par exemple commencer certaines phrases par :"
          - type: paragraphe
            texte: « permettre de... »
          - type: paragraphe
            texte: "Dans votre document :"
      questions:
          - id: q01
            type: texte
            enonce: "Q1 : Pour permettre à l’utilisateur de se déplacer, le vélo doit pouvoir :"
            suite:
                - type: liste
                  elements:
                      - ............................................................
                      - ............................................................
                      - ............................................................
                      - ............................................................
                      - ............................................................
    - id: a06
      titre: 3. Mise en commun
      contenu:
          - type: paragraphe
            texte: Comparez maintenant les propositions des différents groupes.
          - type: paragraphe
            texte: Certaines réponses peuvent être formulées différemment tout en décrivant le même problème.
          - type: paragraphe
            texte: Essayez donc de les regrouper.
      questions:
          - id: q01
            type: texte
            enonce: "Q2 : Après la mise en commun, combien de grands problèmes différents avez-vous identifiés ?"
          - id: q02
            type: texte
            enonce: "Q3 : Pourquoi est-il plus simple de réfléchir à ces petits problèmes séparément plutôt qu’au problème « fabriquer un vélo » dans son ensemble ?"
    - id: a07
      titre: 4. Des problèmes... aux fonctions techniques
      contenu:
          - type: paragraphe
            texte: Les différents problèmes que vous venez d’identifier correspondent à ce que l’on appelle des fonctions techniques.
          - type: paragraphe
            texte: Une fonction technique décrit ce que l’objet doit être capable de faire pour contribuer à satisfaire le besoin de l’utilisateur.
          - type: paragraphe
            texte: Elle est souvent formulée avec un verbe à l’infinitif.
          - type: paragraphe
            texte: "Par exemple :"
          - type: liste
            elements:
                - permettre de changer de direction ;
                - permettre de ralentir ou de s’arrêter ;
                - transmettre le mouvement ;
                - supporter l’utilisateur.
          - type: paragraphe
            texte: "Attention : une fonction technique décrit ce que l’objet doit faire, mais pas encore comment cette fonction est réalisée."
      questions: []
    - id: a08
      titre: 5. Comment le vélo réalise-t-il ces fonctions ?
      contenu:
          - type: paragraphe
            texte: Observez l’image détaillée du vélo ci-dessous.
          - type: paragraphe
            texte: Vous pouvez la copier dans votre document Writer et l’agrandir si cela vous aide à observer les différentes pièces.
          - type: image
            url: https://tifsec.github.io/techno/5/images/image_velo_a_completer.jpg
            alternative: Vue détaillée d'un vélo permettant d'identifier ses principaux composants
          - type: paragraphe
            texte: "Repérez notamment :"
          - type: liste
            elements:
                - le cadre ;
                - le guidon ;
                - la fourche ;
                - les roues ;
                - les pneus ;
                - les pédales ;
                - le pédalier ;
                - la chaîne ;
                - les plateaux ;
                - les pignons ;
                - les freins ;
                - la selle.
      questions:
          - id: q01
            type: texte
            enonce: "Q4 : Pour chaque fonction technique identifiée précédemment, recherchez les pièces du vélo qui participent à sa réalisation."
            suite:
                - type: paragraphe
                  texte: "Important : une fonction n’est pas forcément réalisée par une seule pièce. Plusieurs éléments peuvent travailler ensemble."
    - id: a09
      titre: 6. Organiser nos observations
      contenu:
          - type: paragraphe
            texte: Dans votre document Writer, recopiez puis complétez le tableau suivant.
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Fonction technique
                - Éléments du vélo qui participent à cette fonction
            lignes:
                - - Permettre de changer de direction
                  - ""
                - - Permettre de ralentir ou de s’arrêter
                  - ""
                - - ""
                  - ""
                - - ""
                  - ""
                - - ""
                  - ""
            suite:
                - type: paragraphe
                  texte: Votre tableau doit contenir au minimum quatre fonctions techniques différentes.
    - id: a10
      titre: 7. Une même fonction, plusieurs solutions ?
      contenu:
          - type: paragraphe
            texte: Tous les vélos ne sont pas construits exactement de la même manière.
          - type: paragraphe
            texte: Pourtant, ils doivent souvent assurer les mêmes fonctions techniques.
          - type: paragraphe
            texte: Prenons l’exemple du freinage.
          - type: paragraphe
            texte: "Deux solutions couramment utilisées sur des vélos sont :"
          - type: liste
            elements:
                - le frein sur jante, par exemple à patins ;
                - le frein à disque.
          - type: paragraphe
            texte: "Source technique : Shimano – Documentation technique des systèmes de freinage pour cycles"
          - type: lien
            titre: Shimano – Documentation technique des systèmes de freinage pour cycles
            url: https://si.shimano.com/fr/
      questions:
          - id: q01
            type: texte
            enonce: "Q5 : Ces deux systèmes répondent-ils à la même fonction technique ? Justifiez."
          - id: q02
            type: texte
            enonce: "Q6 : Utilisent-ils exactement les mêmes pièces et le même principe de fonctionnement ? Expliquez ce qui vous semble différent."
    - id: a11
      titre: 8. Découvrir les solutions techniques
      contenu:
          - type: paragraphe
            texte: Nous venons de voir qu’une même fonction peut être réalisée de différentes manières.
          - type: paragraphe
            texte: Les éléments ou systèmes choisis pour réaliser concrètement une fonction sont appelés des solutions techniques.
          - type: paragraphe
            texte: "On peut donc écrire :"
          - type: liste
            elements:
                - "Fonction technique : permettre au vélo de ralentir ou de s’arrêter."
                - "Solution technique 1 : frein sur jante à patins."
                - "Solution technique 2 : frein à disque."
          - type: paragraphe
            texte: Une même fonction technique peut donc avoir plusieurs solutions techniques possibles.
      questions:
          - id: q01
            type: texte
            enonce: "Q7 : Avec vos propres mots, complétez :"
            suite:
                - type: liste
                  elements:
                      - "Fonction technique : elle indique ............................................................"
                      - "Solution technique : elle indique ............................................................"
    - id: a12
      titre: "9. Petit défi : choisir une solution adaptée"
      contenu:
          - type: paragraphe
            texte: Un fabricant souhaite proposer un vélo destiné principalement aux chemins boueux et accidentés.
          - type: paragraphe
            texte: "Pour les pneus, deux solutions sont envisagées :"
          - type: liste
            elements:
                - des pneus fins et presque lisses ;
                - des pneus plus larges avec des crampons marqués.
      questions:
          - id: q01
            type: texte
            enonce: "Q8 : Quelle solution choisiriez-vous ?"
          - id: q02
            type: texte
            enonce: "Q9 : À quelle fonction technique cette solution participe-t-elle ?"
          - id: q03
            type: texte
            enonce: "Q10 : Expliquez pourquoi cette solution semble plus adaptée à l’usage prévu."
          - id: q04
            type: texte
            enonce: "Q11 : Le pneu que vous avez choisi serait-il forcément le meilleur pour un vélo destiné uniquement à rouler rapidement sur une route sèche ? Expliquez."
    - id: a13
      titre: 10. Conclusion du travail
      contenu:
          - type: paragraphe
            texte: "Sans retourner lire les définitions précédentes, complétez les phrases suivantes :"
          - type: liste
            elements:
                - Un problème complexe peut être ............................................................ en plusieurs problèmes plus simples.
                - Ce que doit être capable de faire un objet pour répondre au besoin de l’utilisateur correspond à une ............................................................
                - Les éléments choisis pour réaliser concrètement cette fonction constituent une ............................................................
                - Pour une même fonction technique, il peut exister ............................................................
          - type: paragraphe
            texte: "Dernière question :"
          - type: paragraphe
            texte: Expliquez en deux ou trois phrases pourquoi un concepteur a intérêt à séparer un problème complexe en plusieurs fonctions techniques avant de chercher des solutions.
          - type: paragraphe
            texte: Enregistrez votre travail puis déposez-le dans l’espace d’échange.
      questions: []
    - id: a14
      titre: Sources et ressources
      contenu:
          - type: liste
            elements:
                - "Ministère de l'Éducation nationale – Programme de technologie du cycle 4, BO n°9 du 29 février 2024 : Programme officiel de technologie du cycle 4"
                - "Éduscol STI – Fonctions, solutions et constituants d'un objet technique : Ressource pédagogique sur les fonctions et solutions techniques"
          - type: lien
            titre: Programme officiel de technologie du cycle 4
            url: https://www.education.gouv.fr/sites/default/files/ensel802_annexe.pdf
          - type: lien
            titre: Ressource pédagogique sur les fonctions et solutions techniques
            url: https://sti.eduscol.education.fr/sites/eduscol.education.fr.sti/files/ressources/pedagogiques/18030/18030-fonction-usage-ftechniques-et-solutions-techniques.pdf
          - type: paragraphe
            texte: Les définitions et exemples ont été reformulés et simplifiés pour être adaptés au niveau 5e. Les exemples de composants et de systèmes de freinage s'appuient sur des ressources institutionnelles et sur de la documentation technique professionnelle.
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
introduction:
    - type: titre
      texte: "Compétence visée : Identifier les fonctions techniques d’un objet et les solutions techniques qui permettent de les réaliser"
    - type: paragraphe
      texte: "Objectifs d’apprentissage :"
    - type: liste
      elements:
          - Comprendre qu’un problème complexe peut être décomposé en plusieurs problèmes plus simples.
          - Découvrir la notion de fonction technique.
          - Comprendre qu’une fonction technique peut être réalisée par une ou plusieurs pièces.
          - Découvrir que plusieurs solutions techniques différentes peuvent répondre à une même fonction.
    - type: liste
      elements:
          - Observer un objet technique à partir d’une image détaillée.
          - Décomposer un problème en plusieurs sous-problèmes.
          - Associer une fonction technique à des éléments d’un objet.
          - Comparer plusieurs solutions répondant à une même fonction.
          - Justifier une réponse à partir d’observations.
    - type: liste
      elements:
          - Un document LibreOffice Writer nommé 5e_S3_nom1_nom2.odt.
          - Les noms et prénoms des élèves du groupe.
          - Le titre de la séance.
          - Les réponses aux différentes questions.
          - Un tableau reliant fonctions techniques et éléments du vélo.
          - Une comparaison de deux solutions techniques.
          - Une courte conclusion.
    - type: paragraphe
      texte: Le document devra être enregistré puis déposé dans l’espace d’échange à la fin de la séance, même s’il n’est pas entièrement terminé.
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
