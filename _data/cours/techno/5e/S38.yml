titre: "Décanter et filtrer : que peut-on attendre ?"
theme: Concevoir une cuve intelligente simulée
problematique: "Décanter et filtrer : que peut-on attendre ?"
pourquoi: Associer une technique à son effet et à sa limite.
application: Une cuve peut collecter une eau non potable et isoler une arrivée signalée suspecte dans un modèle.
lien_precedent: "Après S37 — Comment donner priorité à une alerte ?, nous poursuivons avec un seul objectif : associer une technique à son effet et à sa limite."
activites:
    - id: a01
      titre: Comprendre le document
      pourquoi: Associer une technique à son effet et à sa limite.
      demarche:
          - Lire le document et repérer les mots utiles.
          - Répondre aux deux questions avec une information du document.
      contenu:
          - type: tableau
            colonnes:
                - Technique décrite
                - Effet visé
            lignes:
                - - Décantation
                  - Laisser déposer certaines particules entraînées par l’eau
                - - Filtration mécanique
                  - Retenir certaines particules selon le filtre
                - - Isolement
                  - Séparer une arrivée signalée suspecte de la cuve principale
          - type: paragraphe
            texte: Ces descriptions ne garantissent pas l’élimination de toutes les substances dissoutes ou de tous les micro-organismes. Ici, on étudie un ordre de fonctions, sans réaliser de traitement réel.
      questions:
          - id: q01
            type: texte
            enonce: Quelle technique du document vise d’abord à laisser déposer certaines particules ?
            aide: Cherche la technique qui ne repose pas sur une barrière filtrante.
          - id: q02
            type: texte
            enonce: Pourquoi un filtre doit-il être accessible ?
            aide: Pense à la maintenance, pas seulement à l’installation.
    - id: a02
      titre: Faire, chercher et tester
      pourquoi: Mettre l’idée à l’épreuve plutôt que recopier une définition.
      demarche:
          - Dessiner un parcours avec un bac de décantation, un filtre accessible et la cuve.
          - Ajouter une voie d’isolement distincte.
          - Repérer où l’on pourrait entretenir le système sans devoir tout jeter.
      contenu:
          - type: paragraphe
            texte: "Travaille au brouillon, dans le logiciel ou sur le schéma. Garde une trace d’essai : situation, résultat attendu et observation. En binôme, échangez les rôles au milieu du travail."
      questions:
          - id: q01
            type: texte
            enonce: Expliquer l’ordre des fonctions de ton dessin et préciser le rôle de l’isolement.
            aide: Distingue améliorer l’aspect et gérer une alerte.
      ressources:
          - type: paragraphe
            texte: Sur le portail public, chercher qualité de l’eau et usages ; relever une information qui distingue observation et contrôle.
          - type: lien
            titre: Eaufrance — Portail public de l’eau
            url: https://www.eaufrance.fr/
    - id: a03
      titre: Expliquer ce que le test permet de conclure
      pourquoi: Relier sa réponse à une donnée et préciser une limite.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Une publicité affirme « notre filtre enlève tout ». Quelle preuve faudrait-il rechercher avant de reprendre cette affirmation ?
            aide: La preuve doit correspondre à l’usage annoncé.
    - id: a04
      titre: Conserver et retenir
      pourquoi: Finir avec une trace réutilisable.
      demarche:
          - Vérifier le nom du projet ou de la trace.
          - Noter au brouillon une erreur corrigée ou une étape à reprendre.
      contenu: []
      questions: []
retenir:
    - Associer une technique à son effet et à sa limite.
    - Une exigence exprime ce que la solution doit respecter et comment on pourra le vérifier.
    - Le projet gère une eau non potable ; un aspect clair ou une mesure isolée ne garantit pas la potabilité.
bilan: Je conserve une trace qui montre ce que j’ai compris ou testé. Une erreur expliquée et corrigée est un progrès observable.
introduction:
    - type: paragraphe
      texte: "Objectif du jour : Associer une technique à son effet et à sa limite."
    - type: paragraphe
      texte: "Séance de 50 minutes de travail effectif : lire et comprendre, réaliser ou chercher, tester, puis faire un bilan. Les essais font partie du travail ; une version simple suffit pour commencer."
    - type: liste
      elements:
          - Une exigence exprime ce que la solution doit respecter et comment on pourra le vérifier.
          - Le programme reçoit des données et applique des règles ; il ne sait pas ce que les données ne décrivent pas.
          - Le projet gère une eau non potable ; un aspect clair ou une mesure isolée ne garantit pas la potabilité.
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
