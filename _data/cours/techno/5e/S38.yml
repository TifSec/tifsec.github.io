titre: "Décanter et filtrer : que peut-on attendre ?"
theme: Concevoir une cuve intelligente simulée
problematique: "Décanter et filtrer : que peut-on attendre ?"
pourquoi: Associer une technique à son effet et à sa limite.
application: "La décantation et la filtration retirent certaines matières, mais ne rendent pas automatiquement l’eau potable."
lien_precedent: "Après S37 — Comment donner priorité à une alerte ?, nous poursuivons avec un seul objectif : associer une technique à son effet et à sa limite."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: tableau
            colonnes:
                - Technique décrite
                - Effet visé
            lignes:
                - - Décantation
                  - Laisser déposer certaines particules entraînées par l’eau
                - - Filtration mécanique
                  - Retenir certaines particules selon le filtre
                - - Isolement
                  - Séparer une arrivée signalée suspecte de la cuve principale
          - type: paragraphe
            texte: Ces descriptions ne garantissent pas l’élimination de toutes les substances dissoutes ou de tous les micro-organismes. Ici, on étudie un ordre de fonctions, sans réaliser de traitement réel.
          - type: paragraphe
            texte: "Exemple guidé : la décantation laisse des particules tomber au fond ; un filtre retient certaines particules. Ces actions peuvent rendre l’eau plus claire, mais elles ne prouvent pas qu’elle est potable."
      questions:
          - id: q01
            type: texte
            enonce: Quelle technique du document vise d’abord à laisser déposer certaines particules ?
            aide: Cherche la technique qui ne repose pas sur une barrière filtrante.
          - id: q02
            type: texte
            enonce: Pourquoi un filtre doit-il être accessible ?
            aide: Pense à la maintenance, pas seulement à l’installation.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - Dessiner un parcours avec un bac de décantation, un filtre accessible et la cuve.
          - Ajouter une voie d’isolement distincte.
          - Repérer où l’on pourrait entretenir le système sans devoir tout jeter.
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: Expliquer l’ordre des fonctions de ton dessin et préciser le rôle de l’isolement.
            aide: Distingue améliorer l’aspect et gérer une alerte.
      ressources:
          - type: paragraphe
            texte: Sur le portail public, chercher qualité de l’eau et usages ; relever une information qui distingue observation et contrôle.
          - type: lien
            titre: Eaufrance — Portail public de l’eau
            url: https://www.eaufrance.fr/
    - id: a03
      titre: 3. Explique avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Une publicité affirme « notre filtre enlève tout ». Quelle preuve faudrait-il rechercher avant de reprendre cette affirmation ?
            aide: La preuve doit correspondre à l’usage annoncé.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Une technique de séparation a un effet précis et des limites."
    - "Associer une technique à son effet et à sa limite."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Une technique de séparation a un effet précis et des limites."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Associer une technique à son effet et à sa limite."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : La décantation et la filtration retirent certaines matières, mais ne rendent pas automatiquement l’eau potable."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
