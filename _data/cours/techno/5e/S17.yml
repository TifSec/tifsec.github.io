titre: 'Séance 17 : En quoi sont faites nos maquettes ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: De quels matériaux sont faites nos maquettes, et comment ces pièces ont-elles été fabriquées ?
competences_bo:
    - Caractériser et choisir un objet ou un système technique selon différents critères
objectifs:
    connaissances:
        - 'Les matériaux se rangent en familles : métaux, matières plastiques, bois et dérivés, verre, céramiques, composites…'
        - On obtient une pièce en enlevant de la matière (découpe, perçage) ou en ajoutant de la matière couche par couche (impression 3D).
    competences:
        - Reconnaître la famille de matériau d’une pièce.
        - Associer une pièce à son procédé de fabrication.
        - Repérer dans un objet sa matière, son énergie et son information.
pourquoi:
    - Depuis le début de l’année, tu as étudié l’usage des objets. Tu vas maintenant regarder ce qu’il y a dedans.
    - 'Le professeur te montre nos trois maquettes : le monte-charge, l’éolienne et le tracker solaire. De quoi sont-elles faites, et comment ont-elles été fabriquées ?'
activites:
    -   id: a01
        titre: Les familles de matériaux
        consigne: Tu vas découvrir les quatre familles de matériaux, à partir de l’exemple expliqué. On attend la famille de chaque pièce du tableau.
        contenu:
            -   type: tableau
                titre: 'Exemple expliqué : quatre familles'
                colonnes:
                    - Famille
                    - Exemples
                    - Comment la reconnaître
                lignes:
                    -   - Métaux
                        - Acier, aluminium, cuivre
                        - Froid au toucher, souvent brillant ; l’acier est attiré par un aimant.
                    -   - Matières plastiques
                        - PLA, polyéthylène, PVC
                        - Léger, peut être de toutes les couleurs, souvent moulé ou imprimé.
                    -   - Bois et dérivés
                        - Pin, contreplaqué, MDF
                        - Fibres ou veines visibles, chaud au toucher.
                    -   - Verre et céramiques
                        - Vitre, porcelaine
                        - Dur, cassant.
            -   type: paragraphe
                texte: 'Le fil électrique d’une lampe contient deux matériaux : du cuivre (un métal) au centre, et une gaine en plastique autour.'
            -   type: etapes
                elements:
                    - Lis le tableau des quatre familles.
                    - Pour chaque pièce, demande-toi en quoi elle est faite.
                    - Écris la famille.
            -   type: paragraphe
                texte: 'Pourquoi des familles ? Les matériaux d’une même famille ont des propriétés proches : cela aide à choisir.'
        questions:
            -   id: q01
                type: tableau
                enonce: Écris la famille de matériau de chaque pièce.
                colonnes:
                    - Pièce
                    - Famille
                lignes:
                    -   - Le câble électrique (partie intérieure)
                        - ''
                    -   - La coque d’une gourde de sport
                        - ''
                    -   - Une planche d’étagère
                        - ''
                    -   - Une vitre
                        - ''
                aide: 'Pour chaque pièce, demande-toi de quoi elle est faite, puis range-la dans une des quatre familles de l’exemple : métal, plastique, bois, verre…'
    -   id: a02
        titre: Observe les maquettes
        transition: Tu connais les familles de matériaux. Applique-les maintenant à nos maquettes.
        consigne: Tu vas observer nos maquettes (au poste maquette ou avec le document 1) pour trouver leurs matériaux et la façon dont elles ont été fabriquées. On attend un procédé, ce qu’il fait à la matière et un choix expliqué.
        contenu:
            -   type: paragraphe
                texte: Démonstration du professeur, puis passage des groupes au poste maquette. Les autres groupes travaillent avec les descriptions ci-dessous.
            -   type: tableau
                titre: Document 1 — Ce que l’on observe
                colonnes:
                    - Maquette
                    - Pièce observée
                    - Matériau
                    - Procédé
                lignes:
                    -   - Monte-charge
                        - 'Bâti et cabine : panneaux de 6 mm de bois (contreplaqué ou MDF, à vérifier sur la maquette)'
                        - Bois et dérivés
                        - 'Découpe au laser : la machine enlève de la matière'
                    -   - Éolienne
                        - Pales et support
                        - Plastique imprimé en 3D
                        - 'Impression 3D : la machine ajoute de la matière couche par couche'
                    -   - Tracker solaire
                        - Socle et tête
                        - Plastique imprimé en 3D
                        - Impression 3D
                    -   - Les trois
                        - Fils électriques
                        - Cuivre et plastique
                        - Fabriqués en usine
            -   type: paragraphe
                texte: 'Découpe laser : un rayon laser découpe une plaque en suivant un dessin. Impression 3D : une buse dépose du plastique fondu, couche après couche.'
            -   type: etapes
                elements:
                    - Observe le bâti du monte-charge, puis les pales de l’éolienne (ou lis le document 1).
                    - 'Relis : la découpe laser enlève de la matière, l’impression 3D en ajoute.'
                    - Explique le choix de l’impression 3D avec « car ».
            -   type: paragraphe
                texte: 'Pourquoi deux procédés ? Chacun a ses avantages : le laser pour les plaques, l’impression 3D pour les formes en volume.'
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 1, comment a été fabriqué le bâti du monte-charge ?
                choix:
                    -   id: a
                        texte: Par découpe au laser dans des panneaux de bois.
                    -   id: b
                        texte: Par impression 3D.
                    -   id: c
                        texte: Par moulage du verre.
                aide: 'Dans le document 1, lis la ligne du monte-charge : en quoi est son bâti, et quelle machine l’a découpé ?'
            -   id: q02
                type: tableau
                enonce: Pour chaque procédé, indique s’il enlève de la matière ou s’il en ajoute.
                colonnes:
                    - Procédé
                    - Enlève ou ajoute de la matière ?
                lignes:
                    -   - Découpe laser
                        - ''
                    -   - Impression 3D
                        - ''
                    -   - Perçage d’un trou
                        - ''
                aide: 'Relis l’étape : la découpe laser enlève de la matière, l’impression 3D en ajoute. Un perçage fait un trou : enlève-t-il ou ajoute-t-il ?'
            -   id: q03
                type: texte
                enonce: Pourquoi utilise-t-on l’impression 3D pour les pales de l’éolienne plutôt que la découpe laser ? Explique avec « car ».
                aide: 'Regarde la forme d’une pale : est-elle plate comme une planche ou courbe ? Le laser découpe des formes plates. Commence par « car ».'
    -   id: a03
        titre: Fabriquer en suivant une procédure
        transition: Tu sais comment nos maquettes ont été fabriquées. À ton tour de préparer une pièce.
        consigne: 'Tu vas préparer l’impression 3D d’une pièce de l’éolienne à partir de son plan 3D, en suivant une procédure fournie (document 2), puis contrôler une pièce imprimée. On attend l’ordre des étapes et ta décision : conforme ou non.'
        contenu:
            -   type: tableau
                titre: 'Document 2 — Procédure : imprimer une pièce de l’éolienne en 3D'
                colonnes:
                    - Étape
                    - Ce que je fais
                lignes:
                    -   - '1'
                        - J’ouvre le fichier 3D de la pièce (plan fourni par le professeur, fichier .stl) dans le logiciel de tranchage.
                    -   - '2'
                        - 'J’applique les réglages fournis : plastique PLA, remplissage 20 %, sans supports.'
                    -   - '3'
                        - 'Je tranche : le logiciel découpe la pièce en couches et affiche le temps d’impression et la masse de plastique.'
                    -   - '4'
                        - 'Le professeur vérifie et lance l’impression (la buse chauffe à plus de 200 °C : on ne touche pas).'
                    -   - '5'
                        - Une fois la pièce refroidie, je contrôle sa cote principale avec la règle ou le pied à coulisse et je la compare au plan.
            -   type: etapes
                elements:
                    - Lis toute la procédure (document 2) avant de commencer.
                    - Sur ton poste, réalise les étapes 1 à 3 avec le fichier 3D fourni et note le temps et la masse affichés.
                    - Au poste imprimante, regarde le professeur lancer l’impression (étape 4).
                    - Pour l’étape 5, utilise la pièce imprimée lors d’une séance précédente et compare sa cote au plan.
            -   type: paragraphe
                texte: 'Pourquoi une procédure ? Elle permet à chacun d’obtenir la même pièce, sans danger et sans gâcher de plastique : c’est ainsi qu’on fabrique en série.'
        questions:
            -   id: q01
                type: tableau
                enonce: Complète l’ordre des étapes de la procédure (écris le numéro).
                colonnes:
                    - Étape
                    - Numéro
                lignes:
                    -   - Ouvrir le fichier 3D
                        - '1'
                    -   - Contrôler la cote de la pièce
                        - ''
                    -   - Appliquer les réglages fournis
                        - '2'
                    -   - Trancher la pièce
                        - ''
                aide: 'Relis le document 2 : on prépare la pièce sur l’ordinateur avant de l’imprimer, et on ne peut la contrôler qu’une fois imprimée.'
            -   id: q02
                type: qcm
                enonce: Le plan indique 60 mm, à 0,5 mm près. La pièce imprimée mesure 59,2 mm. Est-elle conforme ?
                choix:
                    -   id: a
                        texte: 'Non : l’écart de 0,8 mm dépasse les 0,5 mm acceptés.'
                    -   id: b
                        texte: 'Oui : c’est presque 60 mm.'
                    -   id: c
                        texte: On ne peut pas savoir sans la réimprimer.
                aide: Calcule l’écart entre le plan (60 mm) et la mesure (59,2 mm), puis compare-le aux 0,5 mm acceptés.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: 'Certains objets mélangent plusieurs familles : on parle de matériaux composites (ex. : fibre de carbone d’un vélo de course).'
        questions:
            -   id: q01
                type: texte
                enonce: Cite un objet de ta maison fait de plusieurs matériaux, et dis pourquoi chaque matériau a été choisi.
                aide: 'Cherche dans ta cuisine un objet fait de deux matériaux (une casserole, un couteau…). Pour chaque matériau, dis ce qu’il apporte : chauffer, ne pas brûler, couper.'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as reconnu les matériaux et les procédés. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : de quels matériaux sont faites nos maquettes, et comment ont-elles été fabriquées ?'
                aide: Pour chaque maquette (monte-charge, éolienne, tracker), dis en quoi elle est faite et quel procédé l’a fabriquée.
retenir:
    - 'Familles de matériaux : métaux, plastiques, bois et dérivés, verre et céramiques, composites.'
    - 'Découpe laser : enlève de la matière dans une plaque. Impression 3D : ajoute de la matière couche par couche.'
    - 'Un objet se regarde sous trois angles : matière, énergie, information.'
sources:
