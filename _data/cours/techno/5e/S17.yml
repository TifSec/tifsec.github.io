titre: "Expliquer et tester un monte-charge : premier entraînement"
theme: Comprendre et commander un monte-charge
problematique: "Expliquer et tester un monte-charge : premier entraînement"
pourquoi: Croiser des documents et justifier une conclusion courte.
application: "Au DNB comme dans la vie quotidienne, une conclusion est plus fiable lorsqu’elle s’appuie sur des preuves."
lien_precedent: "Après S16 — Une simulation suffit-elle à valider la maquette ?, nous poursuivons avec un seul objectif : croiser des documents et justifier une conclusion courte."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: tableau
            colonnes:
                - Exigence du modèle
                - Résultat attendu
            lignes:
                - - Appui sur demande, position basse
                  - Montée simulée
                - - Arrivée en haut
                  - Arrêt
                - - Aucune demande
                  - Attente
          - type: tableau
            colonnes:
                - Essai fourni
                - Résultat observé
            lignes:
                - - Sans demande
                  - Attente
                - - Demande en bas
                  - Montée
                - - Arrivée en haut
                  - Montée
          - type: paragraphe
            texte: "Entraînement aux habitudes du DNB, adapté à la 5e : lire les documents, nommer une preuve et rédiger une conclusion. Ce n’est pas une épreuve officielle de troisième."
          - type: paragraphe
            texte: "Exemple guidé : le tableau indique « attendu : arrêt » et « observé : montée ». Une réponse solide nomme les deux informations puis conclut : l’essai ne respecte pas l’exigence d’arrêt. La conclusion vient des données, pas d’une impression."
      questions:
          - id: q01
            type: texte
            enonce: Quel essai ne respecte pas l’exigence ? Citer les deux informations comparées.
            aide: Cite résultat attendu puis résultat observé.
          - id: q02
            type: texte
            enonce: Nommer l’information qui doit permettre l’arrêt.
            aide: Distingue une demande d’utilisateur d’une information de position.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - Traiter les deux premières questions seul pendant dix minutes.
          - À deux, proposer une correction de la règle d’arrêt en français ou en blocs.
          - Tester les trois situations dans une représentation ou un programme simulé.
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: Écrire une règle si… alors… qui corrige le défaut, puis décrire comment la tester.
            aide: Le test doit provoquer volontairement l’arrivée en haut.
      ressources:
          - type: paragraphe
            texte: "Observer la présentation du support : identifier la maquette et son modèle numérique, sans suivre les missions avancées de 4e–3e."
          - type: lien
            titre: Édubase — Présentation du monte-charge
            url: https://edubase.eduscol.education.fr/fiche/24732
    - id: a03
      titre: Entraînement DNB — justifier avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu:
          - type: paragraphe
            texte: "Habitudes du DNB, adaptées à la 5e : dossier court, réponse rédigée et démarche explicite. Ce travail n’est pas un sujet officiel et n’exige pas les connaissances de troisième."
      questions:
          - id: q01
            type: texte
            enonce: Peut-on valider les trois exigences avec le programme observé ? Rédiger une conclusion justifiée.
            aide: Une seule exigence non respectée empêche une validation complète.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Une conclusion justifiée relie un résultat observé à une exigence."
    - "Croiser des documents et justifier une conclusion courte."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Une conclusion justifiée relie un résultat observé à une exigence."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Croiser des documents et justifier une conclusion courte."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : Au DNB comme dans la vie quotidienne, une conclusion est plus fiable lorsqu’elle s’appuie sur des preuves."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
    - type: paragraphe
      texte: Les habitudes de rédaction et de justification prennent appui sur le cadre publié pour le DNB à compter de 2027. Le format devra être revérifié avant votre propre session.
    - type: lien
      titre: Éduscol — Épreuves et sujets de référence du DNB
      url: https://eduscol.education.gouv.fr/5607/les-epreuves-du-dnb
