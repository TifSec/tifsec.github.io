titre: 'Séance 17 : En quoi sont faites nos maquettes ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: De quels matériaux sont faites nos maquettes, et comment ces pièces ont-elles été fabriquées ?
competences_bo:
    - Caractériser et choisir un objet ou un système technique selon différents critères
objectifs:
    connaissances:
        - 'Les matériaux se rangent en familles : métaux, matières plastiques, bois et dérivés, verre, céramiques, composites…'
        - On obtient une pièce en enlevant de la matière (découpe, perçage) ou en ajoutant de la matière couche par couche (impression 3D).
    competences:
        - Reconnaître la famille de matériau d’une pièce.
        - Associer une pièce à son procédé de fabrication.
        - Repérer dans un objet sa matière, son énergie et son information.
pourquoi:
    - Depuis le début de l’année, tu as étudié l’usage des objets. Tu vas maintenant regarder ce qu’il y a dedans.
    - 'Le professeur te montre nos trois maquettes : le monte-charge, l’éolienne et le tracker solaire. De quoi sont-elles faites, et comment ont-elles été fabriquées ?'
activites:
    -   id: a01
        titre: Les familles de matériaux
        contenu:
            -   type: tableau
                titre: 'Exemple expliqué : quatre familles'
                colonnes:
                    - Famille
                    - Exemples
                    - Comment la reconnaître
                lignes:
                    -   - Métaux
                        - Acier, aluminium, cuivre
                        - Froid au toucher, souvent brillant ; l’acier est attiré par un aimant.
                    -   - Matières plastiques
                        - PLA, polyéthylène, PVC
                        - Léger, peut être de toutes les couleurs, souvent moulé ou imprimé.
                    -   - Bois et dérivés
                        - Pin, contreplaqué, MDF
                        - Fibres ou veines visibles, chaud au toucher.
                    -   - Verre et céramiques
                        - Vitre, porcelaine
                        - Dur, cassant.
            -   type: paragraphe
                texte: 'Le fil électrique d’une lampe contient deux matériaux : du cuivre (un métal) au centre, et une gaine en plastique autour.'
        questions:
            -   id: q01
                type: tableau
                enonce: Écris la famille de matériau de chaque pièce.
                colonnes:
                    - Pièce
                    - Famille
                lignes:
                    -   - Le câble électrique (partie intérieure)
                        - ''
                    -   - La coque d’une gourde de sport
                        - ''
                    -   - Une planche d’étagère
                        - ''
                    -   - Une vitre
                        - ''
    -   id: a02
        titre: Observe les maquettes
        transition: Tu connais les familles de matériaux. Applique-les maintenant à nos maquettes.
        contenu:
            -   type: paragraphe
                texte: Démonstration du professeur, puis passage des groupes au poste maquette. Les autres groupes travaillent avec les descriptions ci-dessous.
            -   type: tableau
                titre: Document 1 — Ce que l’on observe
                colonnes:
                    - Maquette
                    - Pièce observée
                    - Matériau
                    - Procédé
                lignes:
                    -   - Monte-charge
                        - 'Bâti et cabine : panneaux de 6 mm de bois (contreplaqué ou MDF, à vérifier sur la maquette)'
                        - Bois et dérivés
                        - 'Découpe au laser : la machine enlève de la matière'
                    -   - Éolienne
                        - Pales et support
                        - Plastique imprimé en 3D
                        - 'Impression 3D : la machine ajoute de la matière couche par couche'
                    -   - Tracker solaire
                        - Socle et tête
                        - Plastique imprimé en 3D
                        - Impression 3D
                    -   - Les trois
                        - Fils électriques
                        - Cuivre et plastique
                        - Fabriqués en usine
            -   type: paragraphe
                texte: 'Découpe laser : un rayon laser découpe une plaque en suivant un dessin. Impression 3D : une buse dépose du plastique fondu, couche après couche.'
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 1, comment a été fabriqué le bâti du monte-charge ?
                choix:
                    -   id: a
                        texte: Par découpe au laser dans des panneaux de bois.
                    -   id: b
                        texte: Par impression 3D.
                    -   id: c
                        texte: Par moulage du verre.
            -   id: q02
                type: tableau
                enonce: Pour chaque procédé, indique s’il enlève de la matière ou s’il en ajoute.
                colonnes:
                    - Procédé
                    - Enlève ou ajoute de la matière ?
                lignes:
                    -   - Découpe laser
                        - ''
                    -   - Impression 3D
                        - ''
                    -   - Perçage d’un trou
                        - ''
            -   id: q03
                type: texte
                enonce: Pourquoi utilise-t-on l’impression 3D pour les pales de l’éolienne plutôt que la découpe laser ? Explique avec « car ».
    -   id: a03
        titre: Matière, énergie, information
        transition: 'Tu as observé la matière des maquettes. Un objet, ce n’est pas seulement de la matière : il faut aussi de l’énergie et de l’information.'
        contenu:
            -   type: paragraphe
                texte: 'Tout objet technique peut être regardé de trois façons : la matière (ses matériaux), l’énergie (ce qui le fait fonctionner), l’information (ce qui le commande).'
            -   type: paragraphe
                texte: 'Exemple : pour la lampe de poche, matière = plastique et métal ; énergie = électricité des piles ; information = l’utilisateur appuie sur l’interrupteur.'
        questions:
            -   id: q01
                type: tableau
                enonce: Complète pour le monte-charge (aide-toi de la séance 1 et de la démonstration).
                colonnes:
                    - Point de vue
                    - Pour le monte-charge
                lignes:
                    -   - Matière (un matériau)
                        - ''
                    -   - Énergie (ce qui le fait bouger)
                        - ''
                    -   - Information (ce qui le commande)
                        - ''
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: 'Certains objets mélangent plusieurs familles : on parle de matériaux composites (ex. : fibre de carbone d’un vélo de course).'
        questions:
            -   id: q01
                type: texte
                enonce: Cite un objet de ta maison fait de plusieurs matériaux, et dis pourquoi chaque matériau a été choisi.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as reconnu les matériaux et les procédés. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : de quels matériaux sont faites nos maquettes, et comment ont-elles été fabriquées ?'
retenir:
    - 'Familles de matériaux : métaux, plastiques, bois et dérivés, verre et céramiques, composites.'
    - 'Découpe laser : enlève de la matière dans une plaque. Impression 3D : ajoute de la matière couche par couche.'
    - 'Un objet se regarde sous trois angles : matière, énergie, information.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
