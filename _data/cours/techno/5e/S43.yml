titre: "Cuve intelligente : peut-on valider notre modèle ?"
theme: Concevoir une cuve intelligente simulée
problematique: "Cuve intelligente : peut-on valider notre modèle ?"
pourquoi: Confronter des essais à trois exigences.
application: "Tester plusieurs exigences permet de savoir précisément ce qu’un prototype sait faire."
lien_precedent: "Après S42 — Une notice claire pour une cuve non potable, nous poursuivons avec un seul objectif : confronter des essais à trois exigences."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: tableau
            colonnes:
                - Essai fourni
                - État attendu
                - État observé
            lignes:
                - - niveau 70, alerte 0
                  - COLLECTE
                  - COLLECTE
                - - niveau 80, alerte 0
                  - PLEIN
                  - COLLECTE
                - - niveau 20, alerte 1
                  - ISOLEMENT
                  - ISOLEMENT
                - - donnée inconnue
                  - À VÉRIFIER
                  - À VÉRIFIER
          - type: paragraphe
            texte: Ce mini-dossier est indépendant de ton programme personnel. Les quatre lignes décrivent un autre prototype ; on ne prétend pas qu’elles sont tes observations.
          - type: paragraphe
            texte: "Exemple guidé : exigence « afficher une alerte au niveau haut ». Je provoque un niveau bas puis un niveau haut, je note l’affichage obtenu et je compare chaque résultat à l’exigence."
      questions:
          - id: q01
            type: texte
            enonce: Quel essai échoue ? Citer l’écart entre attendu et observé.
            aide: Compare les états de chaque ligne.
          - id: q02
            type: texte
            enonce: Quelle erreur de comparaison pourrait expliquer cet écart ?
            aide: Distingue une hypothèse et une preuve.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - Répondre seul aux deux premières questions.
          - Proposer une correction en binôme et choisir un essai supplémentaire.
          - Rédiger la conclusion puis reprendre un point de la séquence qui reste fragile.
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: Proposer un essai qui permet de vérifier cette hypothèse de seuil.
            aide: Garde l’autre donnée identique pour isoler l’effet.
      ressources:
          - type: paragraphe
            texte: Dans la documentation, retrouver les blocs d’événement, variable et condition utilisés aujourd’hui.
          - type: lien
            titre: MakeCode micro:bit — Référence
            url: https://makecode.microbit.org/reference
          - type: lien
            titre: Ouvrir le simulateur MakeCode micro:bit
            url: https://makecode.microbit.org/
    - id: a03
      titre: Entraînement DNB — justifier avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu:
          - type: paragraphe
            texte: "Habitudes du DNB, adaptées à la 5e : dossier court, réponse rédigée et démarche explicite. Ce travail n’est pas un sujet officiel et n’exige pas les connaissances de troisième."
      questions:
          - id: q01
            type: texte
            enonce: Rédiger un avis de validation, avec une limite et une action suivante.
            aide: Cite une preuve, une limite et la prochaine action.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "La validation compare chaque exigence à des résultats d’essais."
    - "Confronter des essais à trois exigences."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : La validation compare chaque exigence à des résultats d’essais."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Confronter des essais à trois exigences."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : Tester plusieurs exigences permet de savoir précisément ce qu’un prototype sait faire."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
    - type: paragraphe
      texte: Les habitudes de rédaction et de justification prennent appui sur le cadre publié pour le DNB à compter de 2027. Le format devra être revérifié avant votre propre session.
    - type: lien
      titre: Éduscol — Épreuves et sujets de référence du DNB
      url: https://eduscol.education.gouv.fr/5607/les-epreuves-du-dnb
