titre: 'Séance 43 : Un panneau qui suit la lumière, à quoi bon ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Pourquoi faire suivre la lumière à un panneau solaire, et quelle amélioration allons-nous apporter à notre tracker ?
competences_bo:
    - Imaginer, concevoir et réaliser une ou des solutions en réponse à un besoin, à des exigences (de développement durable, par exemple) ou à la nécessité d’améliorations dans une démarche de créativité
objectifs:
    connaissances:
        - Un tracker solaire oriente un panneau vers la lumière pour capter plus d’énergie qu’un panneau fixe.
        - Un projet se mène avec un planning (des tâches, dans un ordre, avec une durée) et se termine par une revue de projet, où l’on présente ce qu’on a fait et prouvé.
    competences:
        - Expliquer l’intérêt d’un tracker.
        - Choisir une amélioration à apporter à un objet existant.
        - Suivre un planning fourni.
pourquoi:
    - En séance 9, tu as vu que la lampe solaire de jardin charge moins bien si son panneau est mal orienté. En séance 28, tu as choisi un panneau solaire pour la cuve.
    - 'Notre tracker solaire règle ce problème : il tourne vers la lumière. Pendant 6 séances, ton groupe va le rendre encore plus malin, en modifiant son programme. Le tracker est déjà monté : on améliore son comportement.'
activites:
    -   id: a01
        titre: Pourquoi suivre la lumière ?
        contenu:
            -   type: paragraphe
                texte: 'Démonstration : le professeur éclaire le tracker avec une lampe de poche et la déplace lentement. La tête du tracker tourne pour faire face à la lampe.'
            -   type: paragraphe
                texte: 'Un panneau reçoit le plus de lumière quand il est face à elle. S’il est de biais, la même lumière est étalée sur sa surface : il en reçoit moins.'
            -   type: tableau
                titre: Document 1 — Comparaison simplifiée
                colonnes:
                    - Position du soleil
                    - Panneau fixe (face au sud)
                    - Panneau sur tracker
                lignes:
                    -   - Matin (à l’est)
                        - Reçoit peu
                        - Reçoit beaucoup
                    -   - Midi (au sud)
                        - Reçoit beaucoup
                        - Reçoit beaucoup
                    -   - Soir (à l’ouest)
                        - Reçoit peu
                        - Reçoit beaucoup
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 1, quand le tracker apporte-t-il le plus par rapport à un panneau fixe ?
                choix:
                    -   id: a
                        texte: Le matin et le soir.
                    -   id: b
                        texte: À midi seulement.
                    -   id: c
                        texte: La nuit.
            -   id: q02
                type: texte
                enonce: Explique pourquoi un panneau orienté vers la lumière produit plus qu’un panneau de biais.
    -   id: a02
        titre: Choisir notre amélioration
        transition: Tu as compris l’intérêt du tracker. Il fonctionne déjà, mais on peut le rendre plus malin.
        contenu:
            -   type: paragraphe
                texte: 'Le tracker fonctionne déjà : au démarrage, il cherche l’endroit le plus lumineux ; ensuite, il tourne vers le capteur le plus éclairé. Chaque groupe choisit une amélioration de son comportement :'
            -   type: tableau
                titre: Document 2 — Trois améliorations possibles
                colonnes:
                    - Amélioration
                    - Ce que le tracker fera de plus
                    - Pourquoi c’est utile
                lignes:
                    -   - A — Mode nuit
                        - Quand il fait très sombre, il se remet face à l’est (angle 20°).
                        - Au lever du soleil, il est déjà bien orienté.
                    -   - B — Afficher la direction
                        - Il affiche une flèche sur les LED de la carte selon qu’il regarde à gauche ou à droite.
                        - L’utilisateur voit tout de suite où il regarde.
                    -   - C — Réagir moins souvent
                        - Il ne bouge que si l’écart de lumière est plus grand, ou il attend plus longtemps entre deux mouvements.
                        - Le moteur s’use moins et consomme moins.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle amélioration ton groupe choisit-il ? Explique pourquoi elle est utile, avec « car ».
            -   id: q02
                type: qcm
                enonce: Pour l’amélioration C, pourquoi faire bouger le tracker moins souvent économise-t-il de l’énergie ?
                choix:
                    -   id: a
                        texte: Le servomoteur consomme de l’électricité à chaque mouvement.
                    -   id: b
                        texte: Le panneau produit plus quand il bouge.
                    -   id: c
                        texte: La carte s’éteint.
    -   id: a03
        titre: Le planning du projet
        transition: 'Ton choix est fait. Un projet se mène avec un planning : le voici.'
        contenu:
            -   type: tableau
                titre: Document 3 — Planning fourni
                colonnes:
                    - Séance
                    - Tâche
                    - Production
                lignes:
                    -   - '43'
                        - Comprendre le besoin, choisir l’amélioration
                        - Choix justifié
                    -   - '44'
                        - Comprendre comment est fait le tracker
                        - Description des constituants et du programme
                    -   - '45'
                        - Programmer l’amélioration dans le simulateur
                        - Programme modifié
                    -   - '46'
                        - Tester sur le vrai tracker
                        - Résultats de tests
                    -   - '47'
                        - Préparer la revue de projet
                        - Diaporama (Impress)
                    -   - '48'
                        - Revue de projet
                        - Présentation orale
            -   type: paragraphe
                texte: La revue de projet est une présentation où l’on explique ce qu’on a voulu faire, ce qu’on a fait et ce qu’on a prouvé par des tests.
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le planning, que fait-on avant de tester sur le vrai tracker ?
                choix:
                    -   id: a
                        texte: On programme l’amélioration dans le simulateur.
                    -   id: b
                        texte: On présente la revue de projet.
                    -   id: c
                        texte: On démonte le tracker.
            -   id: q02
                type: texte
                enonce: Pourquoi teste-t-on d’abord dans le simulateur avant d’envoyer le programme sur le vrai tracker ?
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Les grandes centrales solaires utilisent parfois des trackers.
        questions:
            -   id: q01
                type: texte
                enonce: Donne un inconvénient d’un tracker par rapport à un panneau fixe dans une grande centrale.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Le projet est lancé. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : pourquoi faire suivre la lumière à un panneau, et quelle amélioration allons-nous apporter à notre tracker ?'
retenir:
    - 'Un tracker oriente le panneau vers la lumière : il capte plus d’énergie le matin et le soir.'
    - 'Un projet : un besoin, un planning, des tests, une revue de projet.'
sources:
