titre: 'Séance 50 : Mon bilan de l’année'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Qu’ai-je appris en technologie cette année, et que dois-je encore travailler ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
objectifs:
    connaissances:
        - 'Les trois thèmes de l’année : les usages des objets, leur fonctionnement, la conception d’améliorations.'
    competences:
        - Faire le bilan de ses apprentissages.
        - Reprendre une difficulté avec une méthode précise.
pourquoi:
    - Depuis la séance 1, tu as étudié des objets du quotidien, des fichiers et des données, des matériaux, l’éolienne, la programmation avec Arcade, le monte-charge, le dépannage et le tracker.
    - Aujourd’hui, tu fais le bilan, tu reprends une difficulté, et la séance se termine en jouant aux jeux Arcade des autres.
activites:
    -   id: a01
        titre: Ce que j’ai appris
        contenu:
            -   type: tableau
                colonnes:
                    - Période
                    - Ce qu’on a étudié
                lignes:
                    -   - Début d’année
                        - Besoin, fonction d’usage, éléments extérieurs, ergonomie, réglages ; évolution de la lampe
                    -   - Automne
                        - Fichiers, octets, données ; Calc ; matériaux, cycle de vie
                    -   - Hiver
                        - 'Éolienne : chaîne d’énergie, mesures ; jeu Arcade'
                    -   - Printemps
                        - 'Monte-charge : chaîne d’information, programme, tests, dépannage'
                    -   - Fin d’année
                        - 'Tracker : amélioration, tests, revue de projet'
        questions:
            -   id: q01
                type: texte
                enonce: Cite trois choses que tu sais faire maintenant et que tu ne savais pas faire en septembre. Pour chacune, donne un exemple.
                aide: Combien d’éléments sont demandés ?
            -   id: q02
                type: qcm
                enonce: Quel réflexe brevet te fait penser à « D’après le document… » ?
                choix:
                    -   id: a
                        texte: Le réflexe n° 2.
                    -   id: b
                        texte: Le réflexe n° 8.
                    -   id: c
                        texte: Le réflexe n° 10.
                aide: Relis l’exemple expliqué.
    -   id: a02
        titre: Reprendre une difficulté
        transition: 'Tu as fait le bilan de ce que tu sais faire. Il reste sans doute une notion difficile : c’est le moment de la reprendre.'
        contenu:
            -   type: paragraphe
                texte: Choisis une notion qui t’a posé problème. Relis la séance où on l’a vue (les séances restent dans ton espace), puis refais un exercice proche.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle difficulté as-tu choisie, et dans quelle séance l’avons-nous travaillée ?
                aide: Repère le verbe de la question.
            -   id: q02
                type: texte
                enonce: Explique maintenant cette notion avec tes mots, avec un exemple.
                aide: Pense à « car » (réflexe n° 4).
    -   id: a03
        titre: Défi Arcade
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: 'Fin de séance : ouvre ton jeu Arcade (séances 30 à 32) et échange avec un camarade.'
        questions:
            -   id: q01
                type: texte
                enonce: À quel jeu as-tu joué ? Qu’as-tu trouvé de réussi ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton bilan est fait. Il reste à répondre au problème de l’année.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : qu’as-tu appris en technologie cette année, et que dois-tu encore travailler en 4e ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - Faire le bilan, c’est nommer ce qu’on sait faire, avec des exemples.
    - 'Reprendre une difficulté : relire la séance, refaire un exercice proche, expliquer avec ses mots.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
