titre: "Mon bilan de l’année : expliquer, tester et progresser"
theme: Réutiliser ses méthodes et préparer la suite
problematique: "Mon bilan de l’année : expliquer, tester et progresser"
pourquoi: Relier ses apprentissages à des traces de travail.
application: "Savoir expliquer ses progrès aide à réutiliser ses méthodes dans de nouveaux projets."
lien_precedent: "Après S49 — Reprendre une difficulté avec une méthode précise, nous poursuivons avec un seul objectif : relier ses apprentissages à des traces de travail."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: paragraphe
            texte: "L’année a relié les objets du quotidien, le monte-charge, l’énergie, les données, la programmation et la cuve simulée. Le bilan s’appuie sur deux traces choisies : un premier essai et une version améliorée."
          - type: paragraphe
            texte: "Pour expliquer un objet : besoin → fonctions et constituants → informations et actions → essai → conclusion limitée aux preuves. Une courte préparation orale aide aussi à prendre de bonnes habitudes pour la suite du collège."
          - type: paragraphe
            texte: "Exemple guidé : je choisis une première trace et une trace plus récente. Je nomme une action que je réussis mieux et je montre ce qui le prouve : une réponse corrigée, un programme testé ou une consigne améliorée."
      questions:
          - id: q01
            type: texte
            enonce: Quel support sais-tu maintenant mieux expliquer ? Donner un exemple de fonctionnement.
            aide: Choisis un objet réellement étudié.
          - id: q02
            type: texte
            enonce: Donner une erreur que tu sais désormais repérer, avec un exemple.
            aide: Appuie-toi sur une trace, pas seulement sur ton impression.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - Choisir deux traces datées ou identifiées sans données personnelles inutiles.
          - Préparer une présentation d’une minute avec un fonctionnement et un progrès précis.
          - Vérifier l’organisation des fichiers et définir un objectif pour l’année suivante.
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: Comparer tes deux traces et expliquer un progrès observable.
            aide: Nomme une action que tu sais mieux réaliser.
      ressources:
          - type: paragraphe
            texte: Rechercher un mot-clé précis sur la ressource publique, puis noter le titre et l’organisme de la page utile.
          - type: lien
            titre: Éduscol — Ressources de Technologie
            url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
    - id: a03
      titre: Entraînement DNB — justifier avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu:
          - type: paragraphe
            texte: "Habitudes du DNB, adaptées à la 5e : dossier court, réponse rédigée et démarche explicite. Ce travail n’est pas un sujet officiel et n’exige pas les connaissances de troisième."
      questions:
          - id: q01
            type: texte
            enonce: Quel objectif précis souhaites-tu travailler ensuite et quelle méthode peux-tu réutiliser ?
            aide: Un objectif précis est plus utile que « être meilleur ».
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Un progrès se montre avec une trace de travail et une comparaison."
    - "Relier ses apprentissages à des traces de travail."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Un progrès se montre avec une trace de travail et une comparaison."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Relier ses apprentissages à des traces de travail."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : Savoir expliquer ses progrès aide à réutiliser ses méthodes dans de nouveaux projets."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
    - type: paragraphe
      texte: Les habitudes de rédaction et de justification prennent appui sur le cadre publié pour le DNB à compter de 2027. Le format devra être revérifié avant votre propre session.
    - type: lien
      titre: Éduscol — Épreuves et sujets de référence du DNB
      url: https://eduscol.education.gouv.fr/5607/les-epreuves-du-dnb
