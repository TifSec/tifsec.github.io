titre: "Séance 11 : À quoi sert le monte-charge du collège ?"
themes:
    - "Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser"
problematique: "Au collège, qui utilise le monte-charge, et à quoi lui sert-il ?"
competences_bo:
    - "Décrire les interactions entre un objet ou un système technique, son environnement et les utilisateurs"
objectifs:
    connaissances:
        - "Un objet technique est fabriqué pour répondre à un besoin : rendre un service à quelqu’un."
        - "Autour d’un objet, il y a des éléments qui agissent avec lui : la personne qui l’utilise, ce qu’il transporte, l’électricité, le bâtiment."
    competences:
        - "Dire en une phrase à quoi sert un objet."
        - "Trier ce qui fait partie de l’objet et ce qui se trouve autour de lui."
        - "Expliquer ce que chaque élément autour de l’objet fait avec lui."
pourquoi:
    - "Pendant plusieurs séances, tu vas travailler sur un monte-charge : une petite plateforme qui monte et descend pour transporter des objets d’un étage à l’autre."
    - "Avant de comprendre ses pièces ou de le programmer, il faut d’abord savoir à quoi il sert et pour qui. C’est ce que tu vas découvrir aujourd’hui."
activites:
    - id: a01
      titre: "Le problème de Mme Diallo"
      contenu:
          - type: paragraphe
            texte: "Mme Diallo travaille au collège. Ce matin, elle doit monter 6 caisses de livres au premier étage. Chaque caisse pèse 8 kg. Il n’y a qu’un escalier."
          - type: paragraphe
            texte: "Le collège possède un monte-charge. Mme Diallo pose une caisse sur la plateforme, appuie sur le bouton « Monter », et la caisse arrive au premier étage. Elle n’a pas besoin de la porter dans l’escalier."
          - type: paragraphe
            texte: "Attention : un monte-charge transporte des objets, jamais des personnes."
      questions:
          - id: q01
            type: qcm
            enonce: "À quoi sert le monte-charge ?"
            choix:
                - id: a
                  texte: "À déplacer des objets d’un étage à l’autre."
                - id: b
                  texte: "À transporter des élèves d’un étage à l’autre."
                - id: c
                  texte: "À ranger les caisses dans une armoire."
          - id: q02
            type: texte
            enonce: "Pourquoi le monte-charge aide-t-il Mme Diallo ? Donne deux raisons."
            aide: "Pense au poids des caisses, au nombre de caisses et à l’escalier."
      ressources:
          - type: paragraphe
            texte: "Tu veux voir à quoi ressemble la maquette du monte-charge ? Regarde les photos sur cette page."
          - type: lien
            titre: "Édubase — Le projet de monte-charge"
            url: https://edubase.eduscol.education.fr/fiche/24732
    - id: a02
      titre: "Dedans ou autour ?"
      transition: "Tu sais maintenant à quoi sert le monte-charge. Pour bien le comprendre, il faut aussi savoir ce qui fait partie de lui, et ce qui se trouve seulement autour de lui."
      contenu:
          - type: paragraphe
            texte: "Une pièce du monte-charge fait partie de l’objet : si on l’enlève, le monte-charge est incomplet. Un élément autour du monte-charge n’en fait pas partie, mais il agit avec lui."
          - type: paragraphe
            texte: "Exemple : la caisse de livres n’est pas une pièce du monte-charge. Elle est autour : c’est elle qui est transportée."
      questions:
          - id: q01
            type: tableau
            enonce: "Pour chaque élément, écris « dedans » s’il fait partie du monte-charge, ou « autour » s’il est seulement autour."
            colonnes:
                - Élément
                - Dedans ou autour ?
            lignes:
                - - "La plateforme"
                  - ""
                - - "Mme Diallo"
                  - ""
                - - "Le moteur"
                  - ""
                - - "La prise électrique du mur"
                  - ""
                - - "Le bouton « Monter »"
                  - ""
                - - "Le bâtiment du collège"
                  - ""
            aide: "Pose-toi la question : si j’enlève cet élément, est-ce qu’il manque une pièce au monte-charge ?"
          - id: q02
            type: qcm
            enonce: "La caisse de livres est-elle une pièce du monte-charge ?"
            choix:
                - id: non
                  texte: "Non, elle est autour : c’est l’objet transporté."
                - id: oui
                  texte: "Oui, car elle est posée sur la plateforme."
    - id: a03
      titre: "Qui fait quoi avec le monte-charge ?"
      transition: "Tu as trié les éléments. Maintenant, on regarde ce que chaque élément autour du monte-charge fait avec lui. On appelle cela une interaction."
      contenu:
          - type: paragraphe
            texte: "Une interaction, c’est une action entre l’objet et ce qui l’entoure. Par exemple : Mme Diallo appuie sur le bouton, donc elle donne un ordre au monte-charge."
          - type: liste
            elements:
                - "Une personne peut donner un ordre à l’objet."
                - "Une source d’énergie peut lui fournir de l’électricité."
                - "Un objet peut être déplacé par lui."
                - "Un bâtiment peut le soutenir et l’abriter."
      questions:
          - id: q01
            type: tableau
            enonce: "Complète : que fait chaque élément avec le monte-charge ?"
            colonnes:
                - Élément autour
                - Ce qu’il fait avec le monte-charge
            lignes:
                - - "Mme Diallo"
                  - ""
                - - "La caisse de livres"
                  - ""
                - - "La prise électrique"
                  - ""
                - - "Le bâtiment"
                  - ""
            aide: "Utilise les exemples de la liste : donner un ordre, fournir de l’électricité, être déplacé, soutenir."
          - id: q02
            type: qcm
            enonce: "Il y a une coupure de courant dans le collège. Que se passe-t-il ?"
            choix:
                - id: arret
                  texte: "Le monte-charge ne peut plus fonctionner, car il ne reçoit plus d’électricité."
                - id: marche
                  texte: "Le monte-charge fonctionne quand même, car le bouton est toujours là."
    - id: a04
      titre: "Le monte-charge est en panne"
      defi: true
      facultatif: true
      contenu:
          - type: paragraphe
            texte: "Le monte-charge est en panne pendant une semaine. Mme Diallo doit quand même monter les caisses de livres."
      questions:
          - id: q01
            type: texte
            enonce: "Propose une autre solution pour monter les caisses. Donne un avantage et un inconvénient de ta solution."
            aide: "Pense à ce qu’on utilise dans un magasin ou pendant un déménagement."
    - id: a05
      titre: "Conclusion de ton travail"
      conclusion: true
      transition: "Tu as trouvé à quoi sert le monte-charge et ce qui agit avec lui. Il reste à répondre au problème de départ."
      questions:
          - id: q01
            type: texte
            enonce: "Réponds au problème du jour en 2 ou 3 phrases : au collège, qui utilise le monte-charge, et à quoi lui sert-il ?"
            aide: "Tu peux commencer par : « Le monte-charge sert à… Il est utilisé par… Pour fonctionner, il a besoin de… »"
sources:
    - type: lien
      titre: "Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)"
      url: https://www.education.gouv.fr/media/160767/download
    - type: lien
      titre: "Éduscol — Édubase : le projet de monte-charge"
      url: https://edubase.eduscol.education.fr/fiche/24732
