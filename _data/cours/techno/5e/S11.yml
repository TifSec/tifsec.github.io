titre: À quoi sert notre monte-charge ?
theme: Comprendre et commander un monte-charge
problematique: À quoi sert notre monte-charge ?
pourquoi: Expliquer à quoi sert le monte-charge, qui l’utilise et comment l’utiliser correctement.
application: Un monte-charge déplace une charge et renseigne son utilisateur.
lien_precedent: Après S10, nous savons décomposer un petit jeu, réagir à un événement et tester une fonction. Nous réutilisons cette méthode pour un objet technique.
activites:
    - id: a01
      titre: Comprendre le document
      pourquoi: Repérer à quoi sert le monte-charge et le rôle de ses pièces.
      demarche:
          - Lis le texte et le tableau.
          - Réponds avec les informations du document. Pour les QCM, choisis une seule réponse.
      contenu:
          - type: paragraphe
            texte: "En S10, nous avons assemblé les fonctions d’un jeu. Nous allons appliquer cette méthode à un objet réel. Notre modèle de monte-charge transporte une petite charge entre deux niveaux : BAS et HAUT. Il ne transporte pas de personne. Une personne appuie sur le bouton pour demander la montée. Le moteur fait monter la plateforme. Quand le détecteur du haut signale son arrivée, le système de commande arrête le moteur."
          - type: tableau
            colonnes:
                - Élément
                - Rôle indiqué dans notre document
            lignes:
                - - Plateforme
                  - Porter la charge
                - - Bouton
                  - Recevoir une demande
                - - Moteur
                  - Mettre le mécanisme en mouvement
                - - Détecteur en haut
                  - Signaler la position haute
      questions:
          - id: q01
            type: texte
            enonce: À quoi sert ce monte-charge ? Donne un exemple de personne qui pourrait l’utiliser.
            aide: Imagine une personne qui doit déplacer du matériel entre deux étages.
          - id: q02
            type: texte
            enonce: Donne deux exemples de choses à transporter avec ce monte-charge. Pourquoi une personne n’en fait-elle pas partie ?
            aide: Relis la phrase qui indique ce que notre maquette transporte.
          - id: q03
            type: qcm
            enonce: Quel est le rôle de la plateforme ?
            choix:
                - id: a
                  texte: Recevoir la demande de montée.
                - id: b
                  texte: Porter la charge.
                - id: c
                  texte: Signaler l’arrivée en haut.
          - id: q04
            type: qcm
            enonce: Sur quelle pièce l’utilisateur appuie-t-il pour demander la montée ?
            choix:
                - id: a
                  texte: Le moteur.
                - id: b
                  texte: Le détecteur du haut.
                - id: c
                  texte: Le bouton.
          - id: q05
            type: qcm
            enonce: Quelle pièce met le mécanisme en mouvement ?
            choix:
                - id: a
                  texte: Le moteur.
                - id: b
                  texte: La plateforme.
                - id: c
                  texte: Le bouton.
          - id: q06
            type: qcm
            enonce: Quelle pièce signale que la plateforme est arrivée en haut ?
            choix:
                - id: a
                  texte: Le moteur.
                - id: b
                  texte: Le détecteur du haut.
                - id: c
                  texte: La charge.
    - id: a02
      titre: Dessiner et faire comprendre le fonctionnement
      pourquoi: Vérifier qu’un camarade comprend ton dessin sans ton aide.
      demarche:
          - Sur une feuille ou dans un logiciel de dessin, représente la plateforme en bas, puis en haut. Ajoute la charge, le bouton, le moteur et le détecteur du haut.
          - "Trace une flèche pour montrer la montée. Numérote : 1. la demande avec le bouton ; 2. la montée avec le moteur ; 3. le signal du détecteur et l’arrêt."
          - Cache le texte du cours. Demande à un camarade de retrouver sur ton dessin où l’utilisateur agit et comment la montée se termine.
          - S’il hésite, ajoute une étiquette ou une flèche. Échangez ensuite les rôles. Seul, relis ton dessin en suivant les trois étapes.
      contenu:
          - type: paragraphe
            texte: "Tu peux dessiner simplement : des rectangles et des flèches suffisent. On évalue si ton dessin se comprend, pas s’il est beau."
      questions:
          - id: q01
            type: texte
            enonce: "Explique ton dessin en trois étapes : que fait l’utilisateur, que fait le moteur, puis comment la montée s’arrête-t-elle ?"
            aide: Une courte phrase pour chaque étape suffit.
      ressources:
          - type: paragraphe
            texte: "Observer la présentation du support : identifier la maquette et son modèle numérique, sans suivre les missions avancées de 4e–3e."
          - type: lien
            titre: Édubase — Présentation du monte-charge
            url: https://edubase.eduscol.education.fr/fiche/24732
    - id: a03
      titre: Vérifier une règle d’utilisation
      pourquoi: Utiliser le document et deux calculs pour décider si une charge est autorisée.
      demarche:
          - Lis la fiche d’exercice ci-dessous. Ces masses sont inventées pour le calcul.
          - Calcule les deux masses, puis explique pourquoi on ne peut pas transporter une personne.
      contenu:
          - type: paragraphe
            texte: "Fiche d’exercice fictive : la charge maximale autorisée est de 250 g. Une boîte de 120 g et un objet de 80 g sont posés ensemble sur la plateforme. Ces valeurs ne donnent pas la capacité de notre vraie maquette : seul le professeur la confirme avec sa notice."
      questions:
          - id: q01
            type: texte
            enonce: Le document dit « transporter une petite charge ». Un élève propose d’y faire monter une personne. Expliquer pourquoi ce n’est pas un usage autorisé.
            aide: Appuie ta réponse sur une information du document.
          - id: q02
            type: nombre
            enonce: Quelle masse totale les deux objets représentent-ils ? Réponds en grammes.
            aide: Les deux objets sont transportés en même temps.
          - id: q03
            type: nombre
            enonce: Quelle masse peut-on encore ajouter sans dépasser 250 g ? Réponds en grammes.
            aide: Cherche l’écart entre la limite et la masse déjà transportée.
    - id: a04
      titre: Relire et retenir
      pourquoi: Garder une trace claire de ce que tu sais expliquer.
      demarche:
          - Relis ton dessin et tes réponses.
          - Explique à voix basse à quoi sert le monte-charge, ce que fait le moteur et ce qui signale l’arrivée.
      contenu: []
      questions: []
retenir:
    - Expliquer à quoi sert le monte-charge, qui l’utilise et comment l’utiliser correctement.
    - "Chaque pièce a un rôle : porter, recevoir une demande, faire bouger ou signaler une position."
    - Un dessin doit permettre à quelqu’un d’autre de comprendre le fonctionnement.
bilan: Je conserve une trace qui montre ce que j’ai compris ou testé. Une erreur expliquée et corrigée est un progrès observable.
introduction:
    - type: paragraphe
      texte: "Objectif du jour : Expliquer à quoi sert le monte-charge, qui l’utilise et comment l’utiliser correctement."
    - type: paragraphe
      texte: Tu vas lire un document, répondre à des questions courtes, puis dessiner le monte-charge en bas et en haut. Tu expliqueras ensuite son fonctionnement à un camarade.
    - type: liste
      elements:
          - "Le rôle d’une pièce, c’est ce qu’elle fait. Exemple : la plateforme porte la charge."
          - "Une règle d’utilisation indique ce qui est permis ou interdit. Exemple : ne pas transporter de personne."
