titre: À quoi sert notre monte-charge ?
theme: Découvrir le besoin et les utilisateurs d’un objet technique
problematique: Qui utilise le monte-charge, et qu’est-ce qu’il doit faire ?
pourquoi: Comprendre le besoin auquel répond la maquette et repérer ce qui interagit avec elle.
application: Dans un collège, un monte-charge peut déplacer du matériel entre deux niveaux sans qu’une personne porte la charge dans l’escalier.
lien_precedent: Après la séance précédente, tu sais observer un système et expliquer ce qu’il fait. Aujourd’hui, nous commençons par comprendre à qui il sert, avant d’étudier ses pièces.
introduction:
    - type: paragraphe
      texte: "Ta mission : aider une nouvelle personne à comprendre pourquoi le collège utilise ce monte-charge. Tu vas observer la maquette, repérer son besoin et identifier ce qui agit autour d’elle."
    - type: liste
      elements:
          - "Tu vas apprendre à relier un objet à un besoin."
          - "Tu vas apprendre à reconnaître les éléments extérieurs qui interagissent avec un objet."
          - "À la fin, tu laisseras une courte fiche pour expliquer le rôle du monte-charge."
activites:
    - id: a01
      titre: Ta mission commence par un besoin
      pourquoi: Avant de regarder les pièces, il faut comprendre quel problème le monte-charge aide à résoudre.
      demarche:
          - Lis la situation ci-dessous.
          - Réponds d’abord à la question à choix multiple.
          - Puis explique ton choix avec un indice du texte.
      contenu:
          - type: paragraphe
            texte: "Au collège, une caisse de matériel doit parfois passer du rez-de-chaussée à l’étage. La transporter à la main peut être fatigant ou difficile. Le monte-charge sert à déplacer une charge entre deux niveaux. Notre maquette transporte une petite charge : elle n’est pas faite pour transporter une personne."
          - type: paragraphe
            texte: "Dans la vie réelle, un monte-charge peut aider à déplacer des cartons dans un bâtiment. C’est une comparaison avec notre maquette : les règles de sécurité et les capacités d’un vrai appareil dépendent de sa notice."
      questions:
          - id: q01
            type: qcm
            enonce: Quel problème le monte-charge aide-t-il à résoudre ?
            choix:
                - id: a
                  texte: Déplacer une petite charge entre deux niveaux.
                - id: b
                  texte: Transporter une personne dans le collège.
                - id: c
                  texte: Ranger les caisses dans une armoire.
          - id: q02
            type: texte
            enonce: Donne un exemple de matériel que le collège pourrait déplacer. Explique pourquoi le monte-charge peut être utile.
            aide: Reprends l’idée de la caisse. Qui aurait moins besoin de la porter dans l’escalier ?
      ressources:
          - type: lien
            titre: Édubase — Découvrir le projet de monte-charge et son jumeau numérique
            url: https://edubase.eduscol.education.fr/fiche/24732
    - id: a02
      titre: Qui et quoi interagissent avec lui ?
      pourquoi: Maintenant que tu connais son besoin, cherche ce qui se trouve autour du monte-charge et agit avec lui.
      demarche:
          - Imagine que tu traces une grande bordure autour de tout le monte-charge et de ses pièces.
          - Les éléments à l’intérieur de la bordure font partie du système ; ceux à l’extérieur peuvent interagir avec lui.
          - Lis l’exemple résolu, puis classe les autres éléments.
      contenu:
          - type: paragraphe
            texte: "Exemple résolu : l’utilisateur est à l’extérieur du monte-charge. Il agit sur lui en demandant un déplacement. La caisse est aussi à l’extérieur avant d’être placée sur la plateforme ; le monte-charge agit sur elle en la déplaçant."
          - type: paragraphe
            texte: "Analogie : un livreur remet un colis à quelqu’un. Le livreur et le colis ne sont pas des pièces du bâtiment ; ils interagissent avec lui. Revenons à notre monte-charge : nous cherchons ce qui est autour du système, pas les pièces qui sont dedans."
          - type: tableau
            colonnes:
                - Élément
                - Question à se poser
            lignes:
                - - Utilisateur
                  - Qui demande le déplacement ?
                - - Charge
                  - Qu’est-ce qui est déplacé ?
                - - Bâtiment
                  - Où le monte-charge est-il installé ?
                - - Alimentation électrique
                  - D’où vient l’énergie nécessaire au fonctionnement ?
                - - Moteur et plateforme
                  - Ces pièces sont-elles dedans ou autour du système ?
      questions:
          - id: q01
            type: qcm
            enonce: Dans notre dessin, quel élément est une pièce du monte-charge, et non un élément extérieur ?
            choix:
                - id: a
                  texte: L’utilisateur.
                - id: b
                  texte: La caisse transportée.
                - id: c
                  texte: La plateforme.
          - id: q02
            type: texte
            enonce: Nomme deux éléments extérieurs qui interagissent avec le monte-charge. Pour chacun, dis ce qu’il fait ou ce que le monte-charge fait avec lui.
            aide: Tu peux choisir parmi l’utilisateur, la charge, le bâtiment et l’alimentation électrique.
          - id: q03
            type: qcm
            enonce: Pourquoi trace-t-on une bordure autour du système ?
            choix:
                - id: a
                  texte: Pour distinguer ses pièces de ce qui se trouve autour et interagit avec lui.
                - id: b
                  texte: Pour montrer que tout ce qui est dans le bâtiment fait partie du monte-charge.
                - id: c
                  texte: Pour mesurer la hauteur du bâtiment.
      ressources:
          - type: lien
            titre: Ministère de l’Éducation nationale — Programme de Technologie du cycle 4
            url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
    - id: a03
      titre: Prépare la fiche de présentation
      pourquoi: Tu as repéré le besoin et les éléments autour. Il reste à l’expliquer clairement à une personne qui découvre la maquette.
      demarche:
          - Complète les trois réponses.
          - Relis-les comme si tu présentais le monte-charge à un camarade qui ne l’a jamais vu.
          - Si une phrase ne dit pas clairement qui agit ou ce qui est déplacé, précise-la.
      contenu:
          - type: paragraphe
            texte: "Tu peux garder le cours ouvert. Une bonne explication n’a pas besoin de mots compliqués : elle doit permettre à l’autre personne de comprendre le besoin et les interactions."
      questions:
          - id: q01
            type: texte
            enonce: "Complète : « Le monte-charge sert à… »"
            aide: Dis ce qu’il déplace et entre quels endroits.
          - id: q02
            type: texte
            enonce: Choisis un élément extérieur. Écris une phrase qui explique comment il interagit avec le monte-charge.
            aide: "Exemple de début : « L’utilisateur… » ou « La charge… »"
          - id: q03
            type: qcm
            enonce: Dans la prochaine séance, allons-nous surtout chercher qui utilise le monte-charge, ou comprendre le rôle de ses pièces ?
            choix:
                - id: a
                  texte: Comprendre le rôle de ses pièces.
                - id: b
                  texte: Recommencer toute la recherche sur les utilisateurs.
      ressources:
          - type: lien
            titre: Éduscol — Ressources d’accompagnement du programme de Technologie au cycle 4
            url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
    - id: a04
      titre: Ce que tu peux maintenant expliquer
      pourquoi: Une dernière relecture t’aide à vérifier que tu peux raconter l’idée sans réciter une définition.
      demarche:
          - Relis tes réponses.
          - Vérifie que tu as nommé le besoin et au moins deux éléments extérieurs.
          - Garde une phrase dont tu es fier : elle pourra t’aider en S12.
      contenu: []
      questions: []
retenir:
    - Le monte-charge répond au besoin de déplacer une petite charge entre deux niveaux.
    - Un utilisateur, une charge, le bâtiment ou l’alimentation peuvent interagir avec le système.
    - La plateforme et le moteur sont des pièces du monte-charge ; l’utilisateur et la charge sont autour du système.
bilan: Je sais expliquer à quoi sert le monte-charge et nommer des éléments extérieurs qui interagissent avec lui.
reperes_officiels:
    - type: paragraphe
      texte: "Repère de 5e du BO : décrire les interactions entre un objet ou un système technique, ses utilisateurs et son environnement. Cette séance entraîne ce savoir-faire ; elle ne valide pas seule une compétence de fin de cycle."
    - type: lien
      titre: BO — Programme de Technologie du cycle 4
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
