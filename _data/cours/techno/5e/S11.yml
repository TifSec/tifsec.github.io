titre: 'Séance 11 : Writer n° 1 : présenter un objet dans un document propre'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Comment réaliser un document clair et bien présenté avec un traitement de texte ?
competences_bo:
    - Décrire les interactions entre un objet ou un système technique, son environnement et les utilisateurs
objectifs:
    connaissances:
        - Un traitement de texte (LibreOffice Writer ou Microsoft Word) permet d’écrire, de mettre en forme et d’enregistrer un document.
        - Un document bien présenté a un titre, des paragraphes, une liste à puces et une image avec sa légende.
    competences:
        - Créer, nommer et enregistrer un fichier.
        - Mettre en forme un titre et une liste à puces.
        - Insérer une image et lui ajouter une légende.
pourquoi:
    - Tu as appris à présenter un objet (séance 7) et à comparer des lampes (séances 9 et 10).
    - Aujourd’hui, tu vas mettre en page une fiche sur la lampe LED avec Writer. Savoir faire un document propre te servira toute ta scolarité. Ton fichier reste sur l’ordinateur ; sur le site, tu réponds aux questions sur ta méthode.
activites:
    -   id: a01
        titre: Créer et enregistrer le fichier
        contenu:
            -   type: etapes
                elements:
                    - Ouvre LibreOffice Writer (ou Word).
                    - Clique sur Fichier, puis Enregistrer sous.
                    - Choisis ton dossier personnel.
                    - 'Nomme le fichier : 5e_S11_tonprenom.odt'
                    - Clique sur Enregistrer.
            -   type: paragraphe
                texte: Pourquoi enregistrer dès le début ? Si l’ordinateur s’éteint, ton travail est déjà sauvegardé. Ensuite, appuie souvent sur Ctrl + S.
            -   type: paragraphe
                texte: L’extension .odt indique que c’est un document texte de LibreOffice. On en reparlera en séance 13.
        questions:
            -   id: q01
                type: qcm
                enonce: Quel raccourci clavier permet d’enregistrer rapidement ?
                choix:
                    -   id: a
                        texte: Ctrl + S
                    -   id: b
                        texte: Ctrl + P
                    -   id: c
                        texte: Ctrl + Z
            -   id: q02
                type: texte
                enonce: Écris le nom exact que tu as donné à ton fichier.
    -   id: a02
        titre: Le titre et la liste à puces
        transition: Ton fichier existe et il est enregistré. Tu peux maintenant écrire et mettre en forme le texte.
        contenu:
            -   type: etapes
                elements:
                    - 'Tape le titre : La lampe LED.'
                    - Sélectionne le titre, puis choisis le style « Titre 1 » dans la liste des styles (en haut à gauche).
                    - 'Sous le titre, écris une phrase : La LED est une solution technique pour éclairer.'
                    - 'Écris trois avantages, un par ligne : Elle consomme peu. Elle dure longtemps. Elle chauffe peu.'
                    - Sélectionne ces trois lignes et clique sur le bouton « Liste à puces ».
            -   type: paragraphe
                texte: Pourquoi utiliser un style de titre plutôt que grossir le texte à la main ? Le style garde la même présentation pour tous les titres et permettra plus tard de faire un sommaire automatique.
        questions:
            -   id: q01
                type: qcm
                enonce: Pour mettre en forme le titre, quelle méthode est conseillée ?
                choix:
                    -   id: a
                        texte: Choisir le style « Titre 1 ».
                    -   id: b
                        texte: Écrire le titre en majuscules.
                    -   id: c
                        texte: Appuyer plusieurs fois sur Entrée.
            -   id: q02
                type: texte
                enonce: À quoi sert une liste à puces dans un document ?
    -   id: a03
        titre: L’image et sa légende
        transition: Ton texte est organisé. Une image rend la fiche plus claire, à condition d’avoir une légende.
        contenu:
            -   type: etapes
                elements:
                    - Cherche une image de lampe LED dans la banque d’images proposée par le professeur (ou dessine une LED avec les formes).
                    - Insère-la avec Insertion, puis Image.
                    - Clique droit sur l’image et choisis « Insérer une légende ».
                    - 'Écris la légende : Une ampoule LED.'
                    - Enregistre (Ctrl + S).
            -   type: paragraphe
                texte: Une légende dit ce que montre l’image. Au brevet comme dans un rapport, une image sans légende est difficile à utiliser.
        questions:
            -   id: q01
                type: tableau
                enonce: Associe chaque action à son menu ou à son bouton dans Writer.
                colonnes:
                    - Action
                    - Menu ou bouton utilisé
                lignes:
                    -   - Insérer une image
                        - ''
                    -   - Ajouter une légende
                        - ''
                    -   - Créer une liste à puces
                        - ''
            -   id: q02
                type: texte
                enonce: Explique pourquoi on ajoute une légende sous une image.
            -   id: q03
                type: qcm
                enonce: Tu as fini. Quelle est la dernière chose à faire avant de fermer Writer ?
                choix:
                    -   id: a
                        texte: Enregistrer avec Ctrl + S.
                    -   id: b
                        texte: Supprimer le fichier.
                    -   id: c
                        texte: Fermer sans rien faire.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Writer permet de mettre un en-tête en haut de chaque page.
        questions:
            -   id: q01
                type: texte
                enonce: Ajoute un en-tête avec ton prénom et ta classe (Insertion > En-tête et pied de page). Explique à quoi sert un en-tête.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ta fiche est terminée et enregistrée. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment réaliser un document clair et bien présenté avec un traitement de texte ? Cite au moins quatre étapes dans l’ordre.'
retenir:
    - Enregistrer dès le début, avec un nom clair, puis souvent (Ctrl + S).
    - Un titre se met en forme avec un style (Titre 1).
    - Une liste à puces présente des éléments séparés ; une image a toujours une légende.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
