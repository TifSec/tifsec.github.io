titre: 'Séance 40 : Quelle pièce est abîmée ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Comment repérer, en observant, la pièce qui empêche une maquette de bien fonctionner ?
competences_bo:
    - Identifier un dysfonctionnement d’un objet technique et y remédier
objectifs:
    connaissances:
        - Un symptôme est ce qu’on observe quand un objet fonctionne mal (bruit, vibration, mouvement qui ne se fait pas).
        - On remonte du symptôme à la pièce en cause en observant chaque pièce qui participe à la fonction en panne.
    competences:
        - Décrire un symptôme précisément.
        - Repérer visuellement une pièce défectueuse à partir d’un symptôme.
pourquoi:
    - En séance 39, tu as vu pourquoi les objets tombent en panne.
    - Aujourd’hui, tu deviens dépanneur. Le professeur projette des photos de nos maquettes avec des pièces abîmées ; ton travail est de trouver la pièce en cause.
activites:
    -   id: a01
        titre: Du symptôme à la pièce
        consigne: Tu vas apprendre une méthode pour trouver la pièce abîmée à partir d’un symptôme, avec l’exemple de l’éolienne. On attend l’étape qui suit la description du symptôme.
        contenu:
            -   type: paragraphe
                texte: 'Exemple expliqué : symptôme « l’éolienne vibre et fait du bruit en tournant ». Les pièces qui tournent sont les pales et l’axe. En observant, on voit qu’une pale est fendue : elle est plus légère d’un côté, le rotor est déséquilibré. La pièce en cause est la pale fendue.'
            -   type: etapes
                elements:
                    - J’observe et je décris le symptôme.
                    - Je liste les pièces qui participent à la fonction qui ne marche pas.
                    - J’observe ces pièces une par une.
                    - Je repère celle qui est abîmée et j’explique le lien avec le symptôme.
        questions:
            -   id: q01
                type: qcm
                enonce: D’après la méthode, que fait-on juste après avoir décrit le symptôme ?
                choix:
                    -   id: a
                        texte: On liste les pièces qui participent à la fonction en panne.
                    -   id: b
                        texte: On change toutes les pièces.
                    -   id: c
                        texte: On jette l’objet.
                aide: Relis l’exemple expliqué.
    -   id: a02
        titre: Enquête sur les photos
        transition: Tu connais la méthode. Applique-la aux photos de nos maquettes.
        consigne: Tu vas enquêter sur des photos de pièces abîmées (document 1) en appliquant la méthode. On attend la pièce en cause sur chaque photo et un lien expliqué.
        contenu:
            -   type: tableau
                titre: Document 1 — Les photos projetées (descriptions)
                colonnes:
                    - Photo
                    - Maquette
                    - Symptôme
                    - Ce que montre la photo
                lignes:
                    -   - '1'
                        - Monte-charge
                        - La cabine penche et frotte dans ses rails.
                        - Le câble de levage est détendu d’un côté.
                    -   - '2'
                        - Tracker
                        - La tête ne tourne plus du tout, mais la carte est allumée.
                        - Le fil du servomoteur est débranché du connecteur Grove.
                    -   - '3'
                        - Éolienne
                        - Le rotor tourne mais le multimètre affiche 0 V.
                        - Un des deux fils du moteur de CD est sorti de sa borne.
                    -   - '4'
                        - Monte-charge
                        - 'La cabine monte mais ne s’arrête pas en haut : le moteur force.'
                        - 'Le contact haut est tordu : la cabine ne l’appuie plus.'
            -   type: paragraphe
                texte: 'Rappel de la séance 33 : le contact haut signale que la cabine est arrivée.'
            -   type: etapes
                elements:
                    - Lis la description de chaque photo.
                    - 'Applique la méthode : symptôme, pièces concernées, observation.'
                    - Écris la pièce en cause.
            -   type: paragraphe
                texte: Pourquoi une méthode ? Sans méthode, on change des pièces au hasard ; avec elle, on va droit à la bonne.
        questions:
            -   id: q01
                type: tableau
                enonce: Pour chaque photo, écris la pièce en cause.
                colonnes:
                    - Photo
                    - Pièce en cause
                lignes:
                    -   - '1'
                        - ''
                    -   - '2'
                        - ''
                    -   - '3'
                        - ''
                    -   - '4'
                        - ''
                aide: Ligne × colonne.
            -   id: q02
                type: texte
                enonce: 'Photo 4 : explique le lien entre la pièce abîmée et le symptôme.'
                aide: Pense à « car » (réflexe n° 4).
    -   id: a03
        titre: Pourquoi c’est dangereux ?
        transition: 'Trouver la pièce ne suffit pas : certaines pannes sont dangereuses si on continue à utiliser l’objet.'
        consigne: Tu vas réfléchir aux dangers d’une maquette abîmée et aux règles de sécurité. On attend un risque, l’action à faire et la raison de mettre hors tension.
        contenu:
            -   type: etapes
                elements:
                    - Relis les photos 2 et 4.
                    - Pour chacune, imagine ce qui pourrait arriver.
                    - Écris la règle de sécurité qui protège.
            -   type: paragraphe
                texte: 'Pourquoi hors tension ? On ne touche jamais un fil sous tension : c’est la première règle de sécurité.'
        questions:
            -   id: q01
                type: texte
                enonce: 'Photo 4 : quel risque y a-t-il à laisser fonctionner le monte-charge dans cet état ? Que faut-il faire immédiatement ?'
                aide: Repère le verbe de la question.
            -   id: q02
                type: texte
                enonce: 'Photo 2 : pourquoi faut-il débrancher (ou éteindre) le tracker avant de rebrancher le fil ?'
                aide: Pense à « car » (réflexe n° 4).
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une panne peut avoir plusieurs causes possibles.
        questions:
            -   id: q01
                type: texte
                enonce: 'Photo 3 : propose une autre cause possible du 0 V, et comment la vérifier.'
                aide: Ton idée répond-elle au besoin ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as enquêté sur des pannes réelles de nos maquettes. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment repérer, en observant, la pièce qui empêche une maquette de bien fonctionner ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - Symptôme → pièces concernées → observation → pièce en cause.
    - On intervient toujours hors tension et on prévient le professeur en cas de danger.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
