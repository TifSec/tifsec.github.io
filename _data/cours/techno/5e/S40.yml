titre: Comment suivre les volumes de la cuve ?
theme: Concevoir une cuve intelligente simulée
problematique: Comment suivre les volumes de la cuve ?
pourquoi: Organiser et exploiter des données avec une unité.
application: Une cuve peut collecter une eau non potable et isoler une arrivée signalée suspecte dans un modèle.
lien_precedent: "Après S39 — Que décider si une information manque ?, nous poursuivons avec un seul objectif : organiser et exploiter des données avec une unité."
activites:
    - id: a01
      titre: Comprendre le document
      pourquoi: Organiser et exploiter des données avec une unité.
      demarche:
          - Lire le document et repérer les mots utiles.
          - Répondre aux deux questions avec une information du document.
      contenu:
          - type: paragraphe
            texte: "Modèle numérique : la cuve contient 20 L au début. Chaque ligne ajoute un volume accepté, puis retire un volume utilisé. Les valeurs décrivent des volumes, pas une qualité d’eau."
          - type: tableau
            colonnes:
                - Étape
                - Volume accepté
                - Volume utilisé
            lignes:
                - - "1"
                  - 15 L
                  - 5 L
                - - "2"
                  - 10 L
                  - 8 L
                - - "3"
                  - 0 L
                  - 12 L
      questions:
          - id: q01
            type: texte
            enonce: Quel volume reste après l’étape 1 ?
            aide: Garde l’unité litre.
          - id: q02
            type: texte
            enonce: Donner le volume restant après l’étape 2, puis après l’étape 3.
            aide: Chaque ligne repart du résultat de la précédente.
    - id: a02
      titre: Faire, chercher et tester
      pourquoi: Mettre l’idée à l’épreuve plutôt que recopier une définition.
      demarche:
          - Créer un tableau dans Calc/Excel ou sur papier avec une colonne volume restant.
          - "Appliquer à chaque ligne : précédent + accepté − utilisé."
          - Vérifier les trois lignes et conserver le fichier sur ton espace habituel, sans l’envoyer au site.
      contenu:
          - type: paragraphe
            texte: "Travaille au brouillon, dans le logiciel ou sur le schéma. Garde une trace d’essai : situation, résultat attendu et observation. En binôme, échangez les rôles au milieu du travail."
      questions:
          - id: q01
            type: texte
            enonce: Écrire la formule ou la démarche utilisée pour mettre à jour une ligne, puis expliquer une vérification.
            aide: Une référence de cellule dépend de l’organisation de ton tableau.
      ressources:
          - type: paragraphe
            texte: Sur le portail public, chercher qualité de l’eau et usages ; relever une information qui distingue observation et contrôle.
          - type: lien
            titre: Eaufrance — Portail public de l’eau
            url: https://www.eaufrance.fr/
    - id: a03
      titre: Expliquer ce que le test permet de conclure
      pourquoi: Relier sa réponse à une donnée et préciser une limite.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: La cuve contient à nouveau 20 L. Cela prouve-t-il que son eau est de la même qualité qu’au début ?
            aide: Une même quantité peut avoir une composition différente.
    - id: a04
      titre: Conserver et retenir
      pourquoi: Finir avec une trace réutilisable.
      demarche:
          - Vérifier le nom du projet ou de la trace.
          - Noter au brouillon une erreur corrigée ou une étape à reprendre.
      contenu: []
      questions: []
retenir:
    - Organiser et exploiter des données avec une unité.
    - Une exigence exprime ce que la solution doit respecter et comment on pourra le vérifier.
    - Le projet gère une eau non potable ; un aspect clair ou une mesure isolée ne garantit pas la potabilité.
bilan: Je conserve une trace qui montre ce que j’ai compris ou testé. Une erreur expliquée et corrigée est un progrès observable.
introduction:
    - type: paragraphe
      texte: "Objectif du jour : Organiser et exploiter des données avec une unité."
    - type: paragraphe
      texte: "Séance de 50 minutes de travail effectif : lire et comprendre, réaliser ou chercher, tester, puis faire un bilan. Les essais font partie du travail ; une version simple suffit pour commencer."
    - type: liste
      elements:
          - Une exigence exprime ce que la solution doit respecter et comment on pourra le vérifier.
          - Le programme reçoit des données et applique des règles ; il ne sait pas ce que les données ne décrivent pas.
          - Le projet gère une eau non potable ; un aspect clair ou une mesure isolée ne garantit pas la potabilité.
reperes_officiels:
