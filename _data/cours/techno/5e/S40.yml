titre: Comment suivre les volumes de la cuve ?
theme: Concevoir une cuve intelligente simulée
problematique: Comment suivre les volumes de la cuve ?
pourquoi: Organiser et exploiter des données avec une unité.
application: "Lire des volumes avec leurs unités aide à gérer une réserve d’eau et à suivre son évolution."
lien_precedent: "Après S39 — Que décider si une information manque ?, nous poursuivons avec un seul objectif : organiser et exploiter des données avec une unité."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: paragraphe
            texte: "Modèle numérique : la cuve contient 20 L au début. Chaque ligne ajoute un volume accepté, puis retire un volume utilisé. Les valeurs décrivent des volumes, pas une qualité d’eau."
          - type: tableau
            colonnes:
                - Étape
                - Volume accepté
                - Volume utilisé
            lignes:
                - - "1"
                  - 15 L
                  - 5 L
                - - "2"
                  - 10 L
                  - 8 L
                - - "3"
                  - 0 L
                  - 12 L
          - type: paragraphe
            texte: "Exemple guidé : lundi, la cuve contient 20 L ; mardi, 35 L. La variation est 35 − 20 = 15 L. Je garde l’unité « litre » et je précise la période comparée."
      questions:
          - id: q01
            type: texte
            enonce: Quel volume reste après l’étape 1 ?
            aide: Garde l’unité litre.
          - id: q02
            type: texte
            enonce: Donner le volume restant après l’étape 2, puis après l’étape 3.
            aide: Chaque ligne repart du résultat de la précédente.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - Créer un tableau dans Calc/Excel ou sur papier avec une colonne volume restant.
          - "Appliquer à chaque ligne : précédent + accepté − utilisé."
          - Vérifier les trois lignes et conserver le fichier sur ton espace habituel, sans l’envoyer au site.
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: Écrire la formule ou la démarche utilisée pour mettre à jour une ligne, puis expliquer une vérification.
            aide: Une référence de cellule dépend de l’organisation de ton tableau.
      ressources:
          - type: paragraphe
            texte: Sur le portail public, chercher qualité de l’eau et usages ; relever une information qui distingue observation et contrôle.
          - type: lien
            titre: Eaufrance — Portail public de l’eau
            url: https://www.eaufrance.fr/
    - id: a03
      titre: 3. Explique avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: La cuve contient à nouveau 20 L. Cela prouve-t-il que son eau est de la même qualité qu’au début ?
            aide: Une même quantité peut avoir une composition différente.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Une donnée chiffrée doit être accompagnée d’une unité et d’une période."
    - "Organiser et exploiter des données avec une unité."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Une donnée chiffrée doit être accompagnée d’une unité et d’une période."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Organiser et exploiter des données avec une unité."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : Lire des volumes avec leurs unités aide à gérer une réserve d’eau et à suivre son évolution."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
