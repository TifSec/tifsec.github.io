titre: Existe-t-il un meilleur vélo ?
theme: "Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser"
problematique: Existe-t-il un vélo meilleur que tous les autres ou le choix dépend-il de son utilisation ?
pourquoi: "Objectif de cette séance : Comprendre qu'un même besoin peut être satisfait par plusieurs objets techniques différents."
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Comprendre qu'un même besoin peut être satisfait par plusieurs objets techniques différents.
        - Comprendre qu'un objet adapté à une situation ne l'est pas forcément à une autre.
        - Découvrir la notion de critère de choix.
        - Comprendre que les critères importants dépendent de l'usage et des contraintes.
        - Comprendre qu'un choix technique est souvent un compromis.
    competences: []
activites:
    - id: a04
      titre: 1. Quel est le meilleur vélo ?
      contenu:
          - type: paragraphe
            texte: Lors de la séance précédente, nous avons constaté que le vélo a beaucoup évolué et qu'il existe aujourd'hui de nombreux modèles répondant à des usages différents.
          - type: paragraphe
            texte: "Observez les quatre types de vélos suivants :"
          - type: image
            url: https://tifsec.github.io/techno/5/images/velo_ville_vs_vtt_vs_velo_route_vs_velo_cargo.jpg
            alternative: Comparaison d'un vélo de ville, d'un VTT, d'un vélo de route et d'un vélo cargo
      questions:
          - id: q01
            type: texte
            enonce: "Q1 : Sans effectuer de recherche, lequel de ces quatre vélos vous semble être le meilleur ?"
          - id: q02
            type: texte
            enonce: "Q2 : Expliquez votre choix en une ou deux phrases."
            suite:
                - type: paragraphe
                  texte: Comparez ensuite votre réponse avec celle des autres groupes.
          - id: q03
            type: texte
            enonce: "Q3 : Tous les groupes ont-ils choisi le même vélo ? Pourquoi, selon vous ?"
    - id: a05
      titre: 2. Le meilleur... mais pour quel usage ?
      contenu:
          - type: paragraphe
            texte: Quatre personnes souhaitent acheter un vélo. Leurs situations sont différentes.
          - type: tableau
            colonnes:
                - Utilisateur
                - Situation
            lignes:
                - - Lina
                  - Elle parcourt environ 3 km pour aller au collège. Elle roule principalement en ville et doit transporter son sac.
                - - Noah
                  - Il utilise principalement son vélo sur des chemins forestiers comportant de la boue, des pierres et des pentes.
                - - Émilie
                  - Elle pratique le vélo pour effectuer de longues sorties sportives sur route et souhaite limiter la masse du vélo.
                - - Sam
                  - Il souhaite transporter régulièrement des courses et parfois deux enfants.
      questions:
          - id: q01
            type: texte
            enonce: "Q4 : Quel type de vélo conseilleriez-vous à Lina ? Justifiez."
          - id: q02
            type: texte
            enonce: "Q5 : Quel type de vélo conseilleriez-vous à Noah ? Justifiez."
          - id: q03
            type: texte
            enonce: "Q6 : Quel type de vélo conseilleriez-vous à Émilie ? Justifiez."
          - id: q04
            type: texte
            enonce: "Q7 : Quel type de vélo conseilleriez-vous à Sam ? Justifiez."
    - id: a06
      titre: 3. Sur quoi nous sommes-nous appuyés pour choisir ?
      contenu:
          - type: paragraphe
            texte: "Pour choisir un vélo, vous avez utilisé certaines caractéristiques comme :"
          - type: liste
            elements:
                - la masse ;
                - le prix ;
                - le terrain d'utilisation ;
                - la capacité de transport ;
                - la présence d'une assistance électrique ;
                - la facilité d'utilisation ;
                - les équipements ;
                - la facilité d'entretien ou de réparation.
      questions:
          - id: q01
            type: texte
            enonce: "Q8 : Dans votre document, listez au moins cinq éléments que l'on pourrait utiliser pour comparer deux vélos."
    - id: a07
      titre: 4. Découvrir les critères de choix
      contenu:
          - type: paragraphe
            texte: Les caractéristiques que l'on prend en compte pour comparer plusieurs solutions sont appelées des critères de choix.
          - type: paragraphe
            texte: "Certains critères peuvent être mesurés précisément :"
          - type: liste
            elements:
                - la masse en kilogrammes ;
                - le prix en euros ;
                - la capacité de chargement en kilogrammes ;
                - l'autonomie d'un vélo électrique en kilomètres.
          - type: paragraphe
            texte: "D'autres sont plus difficiles à résumer par une seule valeur :"
          - type: liste
            elements:
                - le confort ;
                - la facilité de réparation ;
                - l'adaptation à un type de terrain ;
                - la facilité d'utilisation.
      questions:
          - id: q01
            type: texte
            enonce: "Q9 : Donnez deux exemples de critères mesurables."
          - id: q02
            type: texte
            enonce: "Q10 : Donnez deux exemples de critères qui nécessitent davantage d'observation ou d'appréciation."
    - id: a08
      titre: 5. Comparer de vrais vélos avec des données de constructeur
      contenu:
          - type: paragraphe
            texte: Nous allons maintenant travailler à partir de caractéristiques publiées par Decathlon pour quatre vélos réels.
          - type: paragraphe
            texte: Les quatre modèles choisis correspondent à des usages très différents.
          - type: tableau
            colonnes:
                - Caractéristique
                - A BTWIN – Vélo de ville 120 à cadre bas
                - B ROCKRIDER – VTT randonnée EXPL 500
                - C VAN RYSEL – Vélo route endurance EDR AF Microshift Sword 2x10v
                - D BTWIN – Vélo cargo électrique biporteur famille F900E
            lignes:
                - - Type principal
                  - Vélo de ville
                  - VTT semi-rigide
                  - Vélo de route endurance
                  - Vélo cargo électrique biporteur
                - - Masse annoncée
                  - 17,5 kg
                  - 14,85 kg en taille M, sans pédales
                  - 10,45 kg en taille M, sans pédales
                  - 66 kg
                - - Prix observé lors de la préparation de la séance
                  - 299,99 €
                  - 499,99 €
                  - 899,99 €
                  - 4 999,99 €
                - - Usage principal annoncé
                  - Déplacements urbains occasionnels
                  - Randonnée VTT et chemins
                  - Vélo de route et sorties endurance
                  - Transport familial et chargement important
                - - Équipement caractéristique
                  - Porte-bagages, garde-boue, béquille, éclairage par dynamo
                  - Fourche suspendue de 100 mm, freins à disque hydrauliques
                  - Cadre aluminium, fourche carbone, pneus 700 × 32, freins à disque mécaniques
                  - Moteur central 90 Nm, batterie 630 Wh, caisse avant, freins à disque hydrauliques 4 pistons
                - - Capacité de transport
                  - Porte-bagages pouvant supporter jusqu'à 27 kg, compatible avec un siège enfant
                  - Aucun équipement spécifique de transport mis en avant sur la fiche produit
                  - "Charge maximale utilisateur + chargement : 110 kg"
                  - Jusqu'à 184 kg de charge hors poids du vélo ; conçu pour transporter jusqu'à 4 enfants
                - - Particularité
                  - Position assise droite et équipements adaptés aux déplacements urbains
                  - Roues de 29" en tailles M à XL et équipement adapté aux terrains accidentés
                  - Masse la plus faible des quatre modèles et équipement orienté vers la pratique sur route
                  - Assistance électrique, autonomie annoncée de 40 à 80 km et forte capacité de chargement
          - type: lien
            titre: BTWIN – Vélo de ville 120 à cadre bas
            url: https://www.decathlon.fr/p/velo-de-ville-elops-120-a-cadre-bas/_/R-p-168864
          - type: lien
            titre: ROCKRIDER – VTT randonnée EXPL 500
            url: https://www.decathlon.fr/p/velo-vtt-randonnee-expl-500-noir-29/330628/c71m8920255
          - type: lien
            titre: VAN RYSEL – Vélo route endurance EDR AF Microshift Sword 2x10v
            url: https://www.decathlon.fr/p/velo-route-endurance-microshift-sword-2x10v-edr-af-gris-fonce/343660/c383m8771991
          - type: lien
            titre: BTWIN – Vélo cargo électrique biporteur famille F900E
            url: https://www.decathlon.fr/p/velo-cargo-electrique-biporteur-famille-f900e-polar-white/329211/c4m9009628
          - type: paragraphe
            texte: "Sources des données : fiches produits Decathlon accessibles directement en cliquant sur le nom de chaque vélo dans le tableau. Données consultées lors de la préparation de la séance. Les prix, caractéristiques et disponibilités commerciales peuvent évoluer. La masse peut également varier selon la taille choisie pour certains modèles."
      questions:
          - id: q01
            type: texte
            enonce: "Q11 : Quel modèle possède la masse la plus faible ?"
          - id: q02
            type: texte
            enonce: "Q12 : Quel modèle est conçu pour transporter le plus de personnes ou de marchandises ?"
          - id: q03
            type: texte
            enonce: "Q13 : Quel modèle possède des équipements spécifiquement adaptés aux chemins accidentés ?"
          - id: q04
            type: texte
            enonce: "Q14 : Quel modèle semble conçu en priorité pour rouler sur route avec une masse réduite ?"
          - id: q05
            type: texte
            enonce: "Q15 : Quel modèle possède une assistance électrique ?"
          - id: q06
            type: texte
            enonce: "Q16 : Existe-t-il un modèle qui soit meilleur que tous les autres sur tous les critères ? Justifiez avec au moins deux exemples issus du tableau."
    - id: a09
      titre: 6. Les données seules ne choisissent pas à notre place
      contenu:
          - type: paragraphe
            texte: Une fiche technique fournit des informations, mais elle ne dit pas automatiquement quel vélo choisir.
          - type: paragraphe
            texte: Il faut d'abord connaître la situation de l'utilisateur.
          - type: paragraphe
            texte: "Situation :"
          - type: paragraphe
            texte: Alex effectue régulièrement un trajet d'environ 5 km sur route. Son trajet comporte une côte. Il transporte un sac et son budget est limité.
      questions:
          - id: q01
            type: texte
            enonce: "Q17 : Relevez dans cette situation toutes les informations qui peuvent influencer son choix."
          - id: q02
            type: texte
            enonce: "Q18 : Transformez ces informations en trois critères prioritaires."
          - id: q03
            type: texte
            enonce: "Q19 : À partir du tableau, quel modèle choisiriez-vous parmi A, B, C et D ?"
          - id: q04
            type: texte
            enonce: "Q20 : Justifiez votre choix en utilisant au moins trois critères."
    - id: a10
      titre: 7. Tous les critères ont-ils la même importance ?
      contenu:
          - type: paragraphe
            texte: Pour Alex, le prix peut être très important.
          - type: paragraphe
            texte: Pour Sam, qui transporte deux enfants, la capacité de transport peut être prioritaire.
          - type: paragraphe
            texte: Pour Noah, le comportement sur les chemins peut être plus important que la masse minimale.
      questions:
          - id: q01
            type: texte
            enonce: "Q21 : Pourquoi ne peut-on pas simplement choisir le vélo possédant le plus grand nombre de « bonnes caractéristiques » ?"
          - id: q02
            type: texte
            enonce: "Q22 : Choisissez deux utilisateurs parmi Lina, Noah, Émilie et Sam et indiquez pour chacun :"
            suite:
                - type: liste
                  elements:
                      - son critère le plus important ;
                      - un critère qu'il pourrait accepter comme moins favorable.
    - id: a11
      titre: 8. Découvrir le compromis
      contenu:
          - type: paragraphe
            texte: Un objet ne peut généralement pas être optimal pour tous les critères en même temps.
          - type: paragraphe
            texte: Choisir consiste donc souvent à privilégier certaines caractéristiques et à en accepter d'autres moins favorables.
          - type: paragraphe
            texte: On appelle cela un compromis.
          - type: paragraphe
            texte: Un compromis consiste à rechercher une solution adaptée aux priorités d'une situation, sans exiger qu'elle soit la meilleure pour tous les critères.
      questions:
          - id: q01
            type: texte
            enonce: "Q23 : Donnez un exemple de compromis visible dans le tableau des quatre vélos."
    - id: a12
      titre: "9. Petit défi : changeons les priorités"
      contenu:
          - type: paragraphe
            texte: Reprenons les quatre modèles A, B, C et D.
          - type: paragraphe
            texte: Pour chacune des situations suivantes, choisissez le modèle qui vous semble le plus adapté.
          - type: paragraphe
            texte: Vous devez indiquer deux critères qui expliquent votre choix.
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Situation
                - Modèle choisi
                - Critère 1
                - Critère 2
            lignes:
                - - Effectuer principalement des sorties sportives sur route
                  - ""
                  - ""
                  - ""
                - - Faire régulièrement de la randonnée sur des chemins accidentés
                  - ""
                  - ""
                  - ""
                - - Transporter régulièrement deux enfants
                  - ""
                  - ""
                  - ""
                - - Effectuer quotidiennement un petit trajet urbain avec un budget limité
                  - ""
                  - ""
                  - ""
          - id: q02
            type: texte
            enonce: "Q24 : Pourquoi le modèle choisi change-t-il alors que les quatre vélos proposés restent exactement les mêmes ?"
    - id: a13
      titre: 10. Conclusion du travail
      contenu:
          - type: paragraphe
            texte: "Sans retourner lire les définitions précédentes, complétez :"
          - type: liste
            elements:
                - Pour comparer plusieurs solutions, on utilise des ................................................ .
                - L'importance d'un critère dépend de l'................................................ et des contraintes de la situation.
                - Une solution n'est pas forcément la meilleure pour tous les ................................................ .
                - Accepter qu'une solution soit moins performante sur certains critères pour en privilégier d'autres correspond à un ................................................ .
          - type: paragraphe
            texte: "Dernière question :"
          - type: paragraphe
            texte: "Répondez maintenant à la problématique de départ :"
          - type: paragraphe
            texte: « Existe-t-il un meilleur vélo ? »
          - type: paragraphe
            texte: "Justifiez votre réponse en deux ou trois phrases en utilisant les mots :"
          - type: paragraphe
            texte: usage — critère — compromis
          - type: paragraphe
            texte: Enregistrez votre travail puis déposez-le dans l'espace d'échange.
      questions: []
    - id: a14
      titre: Sources et ressources
      contenu:
          - type: liste
            elements:
                - "Ministère de l'Éducation nationale – Programme de technologie du cycle 4 : Programme officiel de technologie"
          - type: lien
            titre: Programme officiel de technologie
            url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
          - type: paragraphe
            texte: Les données techniques de la partie 5 proviennent de fiches produits réelles. Elles ont été sélectionnées et simplifiées pour permettre une comparaison adaptée au niveau 5e. Les prix correspondent à un relevé effectué lors de la préparation du cours et peuvent évoluer. Les modèles proposés constituent des exemples et ne représentent pas l'ensemble des vélos disponibles sur le marché.
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
introduction:
    - type: titre
      texte: "Compétence visée : Comparer plusieurs objets techniques et choisir une solution adaptée à un besoin en utilisant différents critères"
    - type: paragraphe
      texte: "Objectifs d’apprentissage :"
    - type: liste
      elements:
          - Comprendre qu'un même besoin peut être satisfait par plusieurs objets techniques différents.
          - Comprendre qu'un objet adapté à une situation ne l'est pas forcément à une autre.
          - Découvrir la notion de critère de choix.
          - Comprendre que les critères importants dépendent de l'usage et des contraintes.
          - Comprendre qu'un choix technique est souvent un compromis.
    - type: liste
      elements:
          - Comparer plusieurs objets techniques.
          - Identifier les critères importants dans une situation donnée.
          - Lire et exploiter des caractéristiques issues de fiches techniques réelles.
          - Organiser des informations dans un tableau comparatif.
          - Justifier un choix en utilisant plusieurs critères.
          - Distinguer une donnée mesurable d'une appréciation ou d'un jugement.
    - type: liste
      elements:
          - Un document LibreOffice Writer nommé 5e_S5_nom1_nom2.odt.
          - Les noms et prénoms des élèves du groupe.
          - Le titre de la séance.
          - Les réponses aux différentes questions.
          - L'exploitation d'un tableau comparatif de vélos réels.
          - Des choix argumentés pour les situations proposées.
          - Une courte conclusion répondant à la problématique.
    - type: paragraphe
      texte: Le document devra être enregistré puis déposé dans l'espace d'échange à la fin de la séance, même s'il n'est pas entièrement terminé.
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
