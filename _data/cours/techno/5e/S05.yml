titre: 'Séance 5 : Facile ou difficile à utiliser ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Comment savoir si un objet est facile à utiliser, et comment l’améliorer ?
competences_bo:
    - Décrire les interactions entre un objet ou un système technique, son environnement et les utilisateurs
objectifs:
    connaissances:
        - 'L’ergonomie, c’est l’adaptation d’un objet à la personne qui l’utilise : il doit être facile, confortable et sûr à utiliser.'
        - 'Décrire son expérience d’utilisateur, c’est dire ce qu’on a ressenti en utilisant l’objet : facile ou non, agréable ou non, et pourquoi.'
    competences:
        - Tester un objet en suivant une liste de vérifications.
        - Décrire son expérience d’utilisateur avec des faits précis.
        - Proposer une amélioration pour rendre un objet plus facile à utiliser.
pourquoi:
    - En séance 4, tu as vu que l’utilisateur est un élément extérieur très important.
    - 'Un objet bien conçu doit être facile à utiliser par la personne à qui il est destiné. Aujourd’hui, tu deviens testeur : tu vas juger la facilité d’utilisation d’objets, et proposer des améliorations.'
activites:
    -   id: a01
        titre: Qu’est-ce que l’ergonomie ?
        contenu:
            -   type: paragraphe
                texte: L’ergonomie, c’est l’adaptation d’un objet à la personne qui l’utilise. Un objet ergonomique est facile à comprendre, confortable et sûr.
            -   type: tableau
                titre: 'Exemple expliqué : la télécommande'
                colonnes:
                    - Critère
                    - Question à se poser
                    - Exemple avec une télécommande de télévision
                lignes:
                    -   - Facile à comprendre
                        - Est-ce que je sais tout de suite quoi faire ?
                        - Le bouton rouge pour allumer est reconnaissable.
                    -   - Confortable
                        - Est-ce agréable à tenir et à utiliser ?
                        - Elle tient bien dans la main.
                    -   - Sûr
                        - Est-ce que je risque de me blesser ou de faire une erreur ?
                        - Le compartiment des piles est fermé par un clapet.
                    -   - Adapté à l’utilisateur
                        - Est-ce que tout le monde peut s’en servir ?
                        - Des touches trop petites gênent une personne âgée.
        questions:
            -   id: q01
                type: qcm
                enonce: Une paire de ciseaux pour enfant a des bouts arrondis. Quel critère d’ergonomie cela améliore-t-il ?
                choix:
                    -   id: a
                        texte: 'La sécurité : l’enfant risque moins de se blesser.'
                    -   id: b
                        texte: La couleur des ciseaux.
                    -   id: c
                        texte: Le prix des ciseaux.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: tableau
                enonce: Pour chaque problème, écris le critère d’ergonomie qui n’est pas respecté (facile à comprendre, confortable, sûr ou adapté à l’utilisateur).
                colonnes:
                    - Problème rencontré
                    - Critère non respecté
                lignes:
                    -   - Les boutons d’un four n’ont aucun dessin ni aucun mot.
                        - ''
                    -   - La poignée d’un sac coupe les doigts quand il est lourd.
                        - ''
                    -   - Un jouet pour bébé a de toutes petites pièces qui se détachent.
                        - ''
                aide: Relis la colonne « Question à se poser » du tableau.
    -   id: a02
        titre: Teste l’appli minuteur
        transition: 'Tu connais les critères d’ergonomie. Maintenant, tu les appliques toi-même en testant un objet de tous les jours : une application de minuteur.'
        contenu:
            -   type: paragraphe
                texte: 'Tu vas tester le minuteur d’un téléphone ou d’un ordinateur, ou celui que le professeur projette. Ta mission : régler un minuteur de 3 minutes, le lancer, puis l’arrêter.'
            -   type: etapes
                elements:
                    - Ouvre le minuteur (ou regarde la démonstration).
                    - Essaie de régler 3 minutes sans aide. Compte le nombre d’actions (clics ou appuis) nécessaires.
                    - Lance le minuteur, puis arrête-le.
                    - Note ce qui a été facile et ce qui a été difficile.
            -   type: paragraphe
                texte: 'Un bon testeur décrit des faits : « J’ai dû appuyer 6 fois », « Le bouton Arrêter est caché en bas »… plutôt que « c’est nul » ou « c’est bien ».'
            -   type: paragraphe
                texte: 'Rappel du réflexe brevet n° 3 (séance 4) : réponds par des phrases qui reprennent les mots de la question.'
        questions:
            -   id: q01
                type: texte
                enonce: Combien d’actions (clics ou appuis) as-tu faites pour régler et lancer le minuteur de 3 minutes ? Écris le nombre et l’objet testé.
                aide: 'Méthode : 1) écris ce que tu fais (l’action) ; 2) écris ce qui doit se passer (résultat attendu) ; 3) compare avec ce qui se passe vraiment (résultat observé). Ne change qu’une seule chose à la fois.'
            -   id: q02
                type: texte
                enonce: 'Décris ton expérience d’utilisateur : une chose facile et une chose difficile, avec un fait précis pour chacune.'
                aide: 'Utilise des faits : le nombre d’appuis, la place d’un bouton, la taille d’un texte…'
    -   id: a03
        titre: Propose une amélioration
        transition: 'Tu as trouvé ce qui est facile et ce qui est difficile. Un testeur ne s’arrête pas là : il propose une solution.'
        contenu:
            -   type: paragraphe
                texte: 'Un concepteur part des difficultés des utilisateurs pour améliorer son objet. Exemple : beaucoup de personnes n’arrivent pas à ouvrir un pot de confiture. Amélioration : un couvercle plus large avec des stries pour mieux tenir.'
        questions:
            -   id: q01
                type: texte
                enonce: Choisis la difficulté que tu as trouvée pendant ton test (ou une difficulté avec un autre objet du quotidien). Propose une amélioration et explique ce qu’elle change pour l’utilisateur.
                aide: 'Commence par : « La difficulté était… Je propose… Cela aiderait l’utilisateur car… »'
    -   id: a04
        titre: Pour qui ?
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un objet peut être facile pour toi et difficile pour quelqu’un d’autre.
        questions:
            -   id: q01
                type: texte
                enonce: Choisis une personne (ton grand-parent, un enfant de 5 ans, une personne qui voit mal). Explique ce qui serait difficile pour elle avec le minuteur, et comment l’adapter.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as appris les critères, testé un objet et proposé une amélioration. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment savoir si un objet est facile à utiliser, et comment l’améliorer ?'
                aide: 'Tu peux commencer par : « Pour savoir si un objet est facile à utiliser, on… »'
retenir:
    - 'L’ergonomie : un objet doit être facile à comprendre, confortable, sûr et adapté à son utilisateur.'
    - Pour décrire son expérience d’utilisateur, on donne des faits précis, pas seulement un avis.
    - On améliore un objet en partant des difficultés de ses utilisateurs.
sources:
