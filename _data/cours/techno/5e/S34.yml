titre: 'Séance 34 : Pourquoi un contrepoids ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Comment le mouvement passe-t-il du moteur à la cabine, et à quoi sert le contrepoids ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - Une poulie et un câble transmettent le mouvement du moteur jusqu’à la cabine.
        - 'Le contrepoids équilibre en partie la masse de la cabine : le moteur a moins d’effort à fournir et consomme moins.'
    competences:
        - Décrire la transmission du mouvement du moteur à la cabine.
        - Expliquer le rôle du contrepoids.
pourquoi:
    - En séance 33, tu as vu comment le monte-charge reçoit et traite les informations.
    - 'Mais qui fait vraiment monter la cabine ? Aujourd’hui, tu suis le mouvement, du moteur jusqu’à la cabine, et tu découvres une pièce astucieuse : le contrepoids.'
activites:
    -   id: a01
        titre: Du moteur à la cabine
        contenu:
            -   type: paragraphe
                texte: 'Démonstration, moteur arrêté : le professeur montre le moteur, la poulie, le câble de levage, la cabine et le contrepoids (avec son tiroir amovible). Les groupes passent ensuite au poste maquette pour observer de près, sans rien démonter.'
            -   type: tableau
                titre: Document 1 — La transmission du mouvement
                colonnes:
                    - Constituant
                    - Rôle
                lignes:
                    -   - Moteur électrique
                        - Convertit l’énergie électrique en énergie cinétique (rotation).
                    -   - Poulie
                        - Tourne avec l’axe du moteur et enroule ou déroule le câble.
                    -   - Câble de levage
                        - Relie la cabine et le contrepoids en passant par la poulie.
                    -   - Cabine guidée par des rails
                        - Monte et descend sans se balancer.
                    -   - Contrepoids
                        - Descend quand la cabine monte, et inversement.
        questions:
            -   id: q01
                type: tableau
                enonce: Range dans l’ordre le chemin du mouvement, du moteur à la cabine.
                colonnes:
                    - Ordre
                    - Constituant
                lignes:
                    -   - '1'
                        - Moteur
                    -   - '2'
                        - ''
                    -   - '3'
                        - ''
                    -   - '4'
                        - Cabine
                aide: Ligne × colonne.
            -   id: q02
                type: qcm
                enonce: Quand la cabine monte, que fait le contrepoids ?
                choix:
                    -   id: a
                        texte: Il descend.
                    -   id: b
                        texte: Il monte aussi.
                    -   id: c
                        texte: Il reste immobile.
                aide: Relis l’exemple expliqué.
    -   id: a02
        titre: Le rôle du contrepoids
        transition: Tu as suivi le mouvement. Mais pourquoi ajouter une pièce qui descend quand la cabine monte ?
        contenu:
            -   type: paragraphe
                texte: 'Expérience de pensée : soulève ton cartable à la main. Maintenant, imagine qu’un sac de masse presque égale, attaché de l’autre côté d’une poulie, descend pendant que ton cartable monte. Il t’aide : tu as beaucoup moins d’effort à faire.'
            -   type: paragraphe
                texte: 'La comparaison avec le cartable est terminée. Revenons au monte-charge : le contrepoids joue le rôle du sac qui aide le moteur.'
        questions:
            -   id: q01
                type: texte
                enonce: Explique à quoi sert le contrepoids du monte-charge. Utilise « car ».
                aide: Pense à « car » (réflexe n° 4).
            -   id: q02
                type: qcm
                enonce: Le contrepoids a un tiroir amovible. À quoi peut-il servir ?
                choix:
                    -   id: a
                        texte: À ajuster la masse du contrepoids selon la charge transportée.
                    -   id: b
                        texte: À ranger les outils.
                    -   id: c
                        texte: À décorer la maquette.
                aide: Relis l’exemple expliqué.
    -   id: a03
        titre: Énergie et position
        transition: Le contrepoids aide le moteur. Avec les formes d’énergie, on peut l’expliquer encore mieux.
        contenu:
            -   type: paragraphe
                texte: 'Rappel de la séance 25 : un objet en hauteur possède de l’énergie potentielle.'
        questions:
            -   id: q01
                type: texte
                enonce: Quand la cabine arrive en haut, sous quelle forme a-t-elle gagné de l’énergie ? Et le contrepoids, a-t-il gagné ou perdu de l’énergie potentielle ?
                aide: Quelle énergie entre, laquelle sort ?
            -   id: q02
                type: texte
                enonce: Dans les vrais ascenseurs, il y a aussi un contrepoids. Donne une raison pour laquelle c’est important pour un immeuble.
                aide: Combien d’éléments sont demandés ?
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Sans contrepoids, la cabine pourrait aussi redescendre trop vite si le moteur s’arrête brutalement.
        questions:
            -   id: q01
                type: texte
                enonce: Explique pourquoi le contrepoids rend aussi le monte-charge plus sûr.
                aide: Pense à « car » (réflexe n° 4).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as suivi le mouvement et compris le contrepoids. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment le mouvement passe-t-il du moteur à la cabine, et à quoi sert le contrepoids ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Moteur → poulie → câble → cabine : c’est la transmission du mouvement.'
    - 'Le contrepoids équilibre la cabine : le moteur fournit moins d’effort et consomme moins.'
sources:
