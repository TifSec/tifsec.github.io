titre: Quelles informations faut-il à la cuve ?
theme: Concevoir une cuve intelligente simulée
problematique: Quelles informations faut-il à la cuve ?
pourquoi: Distinguer une entrée, un traitement et une sortie.
application: "De nombreux systèmes mesurent une information, la traitent puis l’affichent ou déclenchent une action."
lien_precedent: "Après S33 — Une cuve intelligente : pour quel besoin ?, nous poursuivons avec un seul objectif : distinguer une entrée, un traitement et une sortie."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: tableau
            colonnes:
                - Information ou action
                - Rôle dans notre modèle
            lignes:
                - - Niveau haut
                  - Information d’entrée
                - - Signal alerte
                  - Information d’entrée donnée au simulateur
                - - Décider COLLECTE ou ISOLEMENT
                  - Traitement
                - - Afficher l’état
                  - Action de sortie
          - type: paragraphe
            texte: L’alerte est ici une valeur fournie dans un scénario. Ce n’est pas la preuve qu’un capteur unique reconnaît toutes les pollutions.
          - type: paragraphe
            texte: "Exemple guidé : dans une serre, un capteur relève la température (entrée), la carte compare cette valeur à une règle (traitement), puis l’écran affiche un message (sortie). Pour la cuve, on remplace la température par le niveau d’eau."
      questions:
          - id: q01
            type: texte
            enonce: Citer les deux informations d’entrée du modèle.
            aide: Une entrée renseigne le programme.
          - id: q02
            type: texte
            enonce: L’afficheur peut-il, à lui seul, détecter un niveau haut ? Pourquoi ?
            aide: Distingue recevoir une information et l’afficher.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - Tracer le schéma entrées → décision → sorties.
          - Relier chaque élément du tableau au bon emplacement.
          - Comparer avec le schéma d’information du monte-charge en S12.
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: Décrire le trajet d’une alerte depuis son entrée dans le programme jusqu’à l’utilisateur.
            aide: Nomme l’information et l’action finale.
      ressources:
          - type: paragraphe
            texte: Dans la documentation, retrouver les blocs d’événement, variable et condition utilisés aujourd’hui.
          - type: lien
            titre: MakeCode micro:bit — Référence
            url: https://makecode.microbit.org/reference
          - type: lien
            titre: Ouvrir le simulateur MakeCode micro:bit
            url: https://makecode.microbit.org/
    - id: a03
      titre: 3. Explique avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Quel point commun ce trajet a-t-il avec l’arrivée en haut du monte-charge ?
            aide: Compare les rôles, pas la forme des objets.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Un système peut recevoir une entrée, la traiter puis produire une sortie."
    - "Distinguer une entrée, un traitement et une sortie."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Un système peut recevoir une entrée, la traiter puis produire une sortie."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Distinguer une entrée, un traitement et une sortie."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : De nombreux systèmes mesurent une information, la traitent puis l’affichent ou déclenchent une action."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
