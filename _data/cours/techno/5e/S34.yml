titre: Quelles informations faut-il à la cuve ?
theme: Concevoir une cuve intelligente simulée
problematique: Quelles informations faut-il à la cuve ?
pourquoi: Distinguer une entrée, un traitement et une sortie.
application: Une cuve peut collecter une eau non potable et isoler une arrivée signalée suspecte dans un modèle.
lien_precedent: "Après S33 — Une cuve intelligente : pour quel besoin ?, nous poursuivons avec un seul objectif : distinguer une entrée, un traitement et une sortie."
activites:
    - id: a01
      titre: Comprendre le document
      pourquoi: Distinguer une entrée, un traitement et une sortie.
      demarche:
          - Lire le document et repérer les mots utiles.
          - Répondre aux deux questions avec une information du document.
      contenu:
          - type: tableau
            colonnes:
                - Information ou action
                - Rôle dans notre modèle
            lignes:
                - - Niveau haut
                  - Information d’entrée
                - - Signal alerte
                  - Information d’entrée donnée au simulateur
                - - Décider COLLECTE ou ISOLEMENT
                  - Traitement
                - - Afficher l’état
                  - Action de sortie
          - type: paragraphe
            texte: L’alerte est ici une valeur fournie dans un scénario. Ce n’est pas la preuve qu’un capteur unique reconnaît toutes les pollutions.
      questions:
          - id: q01
            type: texte
            enonce: Citer les deux informations d’entrée du modèle.
            aide: Une entrée renseigne le programme.
          - id: q02
            type: texte
            enonce: L’afficheur peut-il, à lui seul, détecter un niveau haut ? Pourquoi ?
            aide: Distingue recevoir une information et l’afficher.
    - id: a02
      titre: Faire, chercher et tester
      pourquoi: Mettre l’idée à l’épreuve plutôt que recopier une définition.
      demarche:
          - Tracer le schéma entrées → décision → sorties.
          - Relier chaque élément du tableau au bon emplacement.
          - Comparer avec le schéma d’information du monte-charge en S12.
      contenu:
          - type: paragraphe
            texte: "Travaille au brouillon, dans le logiciel ou sur le schéma. Garde une trace d’essai : situation, résultat attendu et observation. En binôme, échangez les rôles au milieu du travail."
      questions:
          - id: q01
            type: texte
            enonce: Décrire le trajet d’une alerte depuis son entrée dans le programme jusqu’à l’utilisateur.
            aide: Nomme l’information et l’action finale.
      ressources:
          - type: paragraphe
            texte: Dans la documentation, retrouver les blocs d’événement, variable et condition utilisés aujourd’hui.
          - type: lien
            titre: MakeCode micro:bit — Référence
            url: https://makecode.microbit.org/reference
          - type: lien
            titre: Ouvrir le simulateur MakeCode micro:bit
            url: https://makecode.microbit.org/
    - id: a03
      titre: Expliquer ce que le test permet de conclure
      pourquoi: Relier sa réponse à une donnée et préciser une limite.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Quel point commun ce trajet a-t-il avec l’arrivée en haut du monte-charge ?
            aide: Compare les rôles, pas la forme des objets.
    - id: a04
      titre: Conserver et retenir
      pourquoi: Finir avec une trace réutilisable.
      demarche:
          - Vérifier le nom du projet ou de la trace.
          - Noter au brouillon une erreur corrigée ou une étape à reprendre.
      contenu: []
      questions: []
retenir:
    - Distinguer une entrée, un traitement et une sortie.
    - Une exigence exprime ce que la solution doit respecter et comment on pourra le vérifier.
    - Le projet gère une eau non potable ; un aspect clair ou une mesure isolée ne garantit pas la potabilité.
bilan: Je conserve une trace qui montre ce que j’ai compris ou testé. Une erreur expliquée et corrigée est un progrès observable.
introduction:
    - type: paragraphe
      texte: "Objectif du jour : Distinguer une entrée, un traitement et une sortie."
    - type: paragraphe
      texte: "Séance de 50 minutes de travail effectif : lire et comprendre, réaliser ou chercher, tester, puis faire un bilan. Les essais font partie du travail ; une version simple suffit pour commencer."
    - type: liste
      elements:
          - Une exigence exprime ce que la solution doit respecter et comment on pourra le vérifier.
          - Le programme reçoit des données et applique des règles ; il ne sait pas ce que les données ne décrivent pas.
          - Le projet gère une eau non potable ; un aspect clair ou une mesure isolée ne garantit pas la potabilité.
reperes_officiels:
