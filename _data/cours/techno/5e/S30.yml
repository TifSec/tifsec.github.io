titre: "Arcade : gagner seulement si les conditions sont réunies"
theme: Créer un jeu de collecte et expliquer ses règles
problematique: "Arcade : gagner seulement si les conditions sont réunies"
pourquoi: Lire et modifier une condition dans un programme existant.
application: "Les conditions permettent aux jeux et aux applications de réagir différemment selon la situation."
lien_precedent: "Après S29 — Arcade : à quoi sert un compteur ?, nous poursuivons avec un seul objectif : lire et modifier une condition dans un programme existant."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: paragraphe
            texte: "Nouvelle règle du jeu : la sortie termine la partie seulement lorsque le score est au moins égal à 3. Si le score vaut 0, 1 ou 2, le joueur doit continuer la collecte."
          - type: code
            texte: |-
                Quand joueur touche sortie :
                    si score ≥ 3 : terminer la partie avec victoire
                    sinon : afficher « collecte encore »
          - type: paragraphe
            texte: "Exemple guidé dans Arcade : si le score atteint 5, alors le jeu affiche « gagné » ; sinon, la partie continue. Je teste 4 puis 5 pour vérifier les deux branches de la condition."
      questions:
          - id: q01
            type: texte
            enonce: La sortie doit-elle permettre de gagner avec un score de 2 ? Justifier.
            aide: Comparer la valeur à la règle.
          - id: q02
            type: texte
            enonce: Pourquoi la valeur 3 doit-elle permettre de gagner ?
            aide: Distingue supérieur de supérieur ou égal.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - Ajouter cette condition au contact avec la sortie.
          - Tester volontairement avec un score de 2 puis de 3.
          - Rendre le message d’aide lisible et enregistrer une copie du projet.
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: Décrire tes deux essais à la limite du seuil et ce qu’ils montrent.
            aide: Un test proche du seuil repère les erreurs de comparaison.
      ressources:
          - type: paragraphe
            texte: Retrouver un bloc pour le sprite, les commandes, le score ou les contacts ; comparer avec ton programme.
          - type: lien
            titre: MakeCode Arcade — Référence
            url: https://arcade.makecode.com/reference
          - type: lien
            titre: Ouvrir MakeCode Arcade
            url: https://arcade.makecode.com/
    - id: a03
      titre: 3. Explique avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Un programme utilise score > 3. Quelle différence concrète observera-t-on ?
            aide: Cherche la première valeur qui change de résultat.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Une condition permet de tester une règle de victoire ou de poursuite."
    - "Lire et modifier une condition dans un programme existant."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Une condition permet de tester une règle de victoire ou de poursuite."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Lire et modifier une condition dans un programme existant."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : Les conditions permettent aux jeux et aux applications de réagir différemment selon la situation."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
