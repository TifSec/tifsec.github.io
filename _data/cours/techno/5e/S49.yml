titre: Reprendre une difficulté avec une méthode précise
theme: Réutiliser ses méthodes et préparer la suite
problematique: Reprendre une difficulté avec une méthode précise
pourquoi: Choisir une reprise à partir d’une erreur réelle.
application: "Reprendre une difficulté précise est souvent plus efficace que tout recommencer."
lien_precedent: "Après S48 — Entraînement DNB : un arrosage raisonné, nous poursuivons avec un seul objectif : choisir une reprise à partir d’une erreur réelle."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: paragraphe
            texte: "Choisir un atelier selon une trace récente : A, lire des entrées et sorties ; B, tester un seuil ; C, justifier un choix par un tableau. Si aucun retour professeur n’est encore disponible, utiliser son propre essai et le faire vérifier."
          - type: tableau
            colonnes:
                - Atelier
                - Petit cas de reprise
            lignes:
                - - A
                  - Bouton → carte → affichage
                - - B
                  - "Si valeur ≥ 10 : OUI, sinon NON ; tester 9, 10 et 11"
                - - C
                  - Budget 12 € ; solution A 10 € non réparable, B 12 € réparable ; réparabilité exigée
          - type: paragraphe
            texte: "Exemple guidé : si j’oublie souvent de citer le document, je reprends une question courte et je surligne l’indice avant d’écrire. Si je me trompe dans une condition, je teste une valeur juste avant puis juste après le seuil."
      questions:
          - id: q01
            type: texte
            enonce: Quel atelier choisis-tu et à quelle erreur ou hésitation correspond-il ?
            aide: Choisis une étape, pas « toute la technologie ».
          - id: q02
            type: texte
            enonce: Donner la réponse au petit cas de ton atelier avec une justification.
            aide: Utilise seulement les données de ton atelier.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - Choisir un atelier et nommer ce qui a posé problème.
          - Traiter le petit cas, expliquer à un camarade puis reprendre un exercice antérieur proche.
          - Écrire la différence entre la première réponse et la correction.
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: Présenter une correction d’un ancien exercice et expliquer ce qui change dans ta méthode.
            aide: Ne remplace pas seulement le résultat.
      ressources:
          - type: paragraphe
            texte: Rechercher un mot-clé précis sur la ressource publique, puis noter le titre et l’organisme de la page utile.
          - type: lien
            titre: Éduscol — Ressources de Technologie
            url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
    - id: a03
      titre: 3. Explique avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Comment vérifier sur un nouvel exemple que cette méthode est mieux comprise ?
            aide: Réussir une copie identique ne suffit pas à vérifier le transfert.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Une reprise efficace cible une difficulté observée et une méthode précise."
    - "Choisir une reprise à partir d’une erreur réelle."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Une reprise efficace cible une difficulté observée et une méthode précise."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Choisir une reprise à partir d’une erreur réelle."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : Reprendre une difficulté précise est souvent plus efficace que tout recommencer."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
