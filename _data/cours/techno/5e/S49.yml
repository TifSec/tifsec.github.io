titre: Reprendre une difficulté avec une méthode précise
theme: Réutiliser ses méthodes et préparer la suite
problematique: Reprendre une difficulté avec une méthode précise
pourquoi: Choisir une reprise à partir d’une erreur réelle.
application: Une méthode technique sert à expliquer, choisir et améliorer les outils du quotidien.
lien_precedent: "Après S48 — Entraînement DNB : un arrosage raisonné, nous poursuivons avec un seul objectif : choisir une reprise à partir d’une erreur réelle."
activites:
    - id: a01
      titre: Comprendre le document
      pourquoi: Choisir une reprise à partir d’une erreur réelle.
      demarche:
          - Lire le document et repérer les mots utiles.
          - Répondre aux deux questions avec une information du document.
      contenu:
          - type: paragraphe
            texte: "Choisir un atelier selon une trace récente : A, lire des entrées et sorties ; B, tester un seuil ; C, justifier un choix par un tableau. Si aucun retour professeur n’est encore disponible, utiliser son propre essai et le faire vérifier."
          - type: tableau
            colonnes:
                - Atelier
                - Petit cas de reprise
            lignes:
                - - A
                  - Bouton → carte → affichage
                - - B
                  - "Si valeur ≥ 10 : OUI, sinon NON ; tester 9, 10 et 11"
                - - C
                  - Budget 12 € ; solution A 10 € non réparable, B 12 € réparable ; réparabilité exigée
      questions:
          - id: q01
            type: texte
            enonce: Quel atelier choisis-tu et à quelle erreur ou hésitation correspond-il ?
            aide: Choisis une étape, pas « toute la technologie ».
          - id: q02
            type: texte
            enonce: Donner la réponse au petit cas de ton atelier avec une justification.
            aide: Utilise seulement les données de ton atelier.
    - id: a02
      titre: Faire, chercher et tester
      pourquoi: Mettre l’idée à l’épreuve plutôt que recopier une définition.
      demarche:
          - Choisir un atelier et nommer ce qui a posé problème.
          - Traiter le petit cas, expliquer à un camarade puis reprendre un exercice antérieur proche.
          - Écrire la différence entre la première réponse et la correction.
      contenu:
          - type: paragraphe
            texte: "Travaille au brouillon, dans le logiciel ou sur le schéma. Garde une trace d’essai : situation, résultat attendu et observation. En binôme, échangez les rôles au milieu du travail."
      questions:
          - id: q01
            type: texte
            enonce: Présenter une correction d’un ancien exercice et expliquer ce qui change dans ta méthode.
            aide: Ne remplace pas seulement le résultat.
      ressources:
          - type: paragraphe
            texte: Rechercher un mot-clé précis sur la ressource publique, puis noter le titre et l’organisme de la page utile.
          - type: lien
            titre: Éduscol — Ressources de Technologie
            url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
    - id: a03
      titre: Expliquer ce que le test permet de conclure
      pourquoi: Relier sa réponse à une donnée et préciser une limite.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Comment vérifier sur un nouvel exemple que cette méthode est mieux comprise ?
            aide: Réussir une copie identique ne suffit pas à vérifier le transfert.
    - id: a04
      titre: Conserver et retenir
      pourquoi: Finir avec une trace réutilisable.
      demarche:
          - Vérifier le nom du projet ou de la trace.
          - Noter au brouillon une erreur corrigée ou une étape à reprendre.
      contenu: []
      questions: []
retenir:
    - Choisir une reprise à partir d’une erreur réelle.
    - Une réponse justifiée relie une idée à une information du document ou à un essai.
    - Un progrès se décrit avec un exemple ou une trace, pas seulement une impression.
bilan: Je conserve une trace qui montre ce que j’ai compris ou testé. Une erreur expliquée et corrigée est un progrès observable.
introduction:
    - type: paragraphe
      texte: "Objectif du jour : Choisir une reprise à partir d’une erreur réelle."
    - type: paragraphe
      texte: "Séance de 50 minutes de travail effectif : lire et comprendre, réaliser ou chercher, tester, puis faire un bilan. Les essais font partie du travail ; une version simple suffit pour commencer."
    - type: liste
      elements:
          - Une réponse justifiée relie une idée à une information du document ou à un essai.
          - Une démarche claire peut être utile même lorsque la réponse est incomplète.
          - Un progrès se décrit avec un exemple ou une trace, pas seulement une impression.
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
