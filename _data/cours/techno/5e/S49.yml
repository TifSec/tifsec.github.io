titre: 'Séance 49 : Entraînement au brevet n° 4 : la cuve d’eau intelligente'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Suis-je capable de traiter un dossier complet de type brevet en 30 minutes ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
    - Comprendre et modifier un programme associé à une fonctionnalité d’un objet ou d’un système technique
objectifs:
    connaissances:
        - Un dossier de brevet mélange documents, chaîne d’information, données, programme et calculs.
        - Pour gérer son temps, on survole le sujet, on commence par ce qu’on sait, on garde du temps pour se relire.
    competences:
        - Utiliser les dix réflexes brevet.
        - Gérer son temps sur un dossier (réflexe brevet n° 10).
pourquoi:
    - Toute l’année, tu as appris des réflexes et des méthodes.
    - Aujourd’hui, tu traites un dossier complet sur le futur projet de cuve intelligente, en 30 minutes, puis on corrige ensemble. C’est un entraînement adapté à la 5e, pas un sujet officiel.
activites:
    -   id: a01
        titre: Le dossier (30 minutes)
        consigne: 'Tu vas t’entraîner au brevet sur un dossier complet : la cuve intelligente (documents 1 à 3), en 30 minutes. Partie 1 : on attend la chaîne d’information, une hauteur calculée et le premier jour où le voyant s’allume.'
        contenu:
            -   type: citation
                texte: 'Réflexe brevet n° 10 : je survole tout le sujet (2 minutes), je commence par les questions que je sais faire, et je garde 3 minutes pour me relire.'
            -   type: titre
                texte: Document 1 — La cuve intelligente
            -   type: citation
                texte: La cuve récupère l’eau de pluie du toit. Un capteur à ultrasons, placé dans le couvercle, mesure la distance jusqu’à l’eau. Une carte programmable calcule la hauteur d’eau. Si la hauteur dépasse 90 cm, un voyant rouge s’allume et un message « Cuve pleine » s’affiche sur un petit écran. La cuve mesure 100 cm de haut et contient 300 L quand elle est pleine.
            -   type: titre
                texte: Document 2 — Extrait du programme
            -   type: code
                texte: "toujours\n    distance = distance mesurée par le capteur (cm)\n    hauteur = 100 − distance\n    si hauteur > 90 alors\n        allumer le voyant rouge\n        écrire « Cuve pleine »\n    sinon\n        éteindre le voyant rouge"
            -   type: titre
                texte: Document 3 — Relevés de la semaine (valeurs inventées)
            -   type: tableau
                colonnes:
                    - Jour
                    - Lundi
                    - Mardi
                    - Mercredi
                    - Jeudi
                    - Vendredi
                lignes:
                    -   - Distance mesurée (cm)
                        - '70'
                        - '55'
                        - '40'
                        - '12'
                        - '8'
            -   type: etapes
                elements:
                    - Lis le réflexe n° 10 et survole tout le dossier (2 minutes).
                    - Commence par les questions que tu sais faire.
                    - Pour la hauteur, applique le calcul du document 2.
            -   type: paragraphe
                texte: Pourquoi survoler ? Tu repères les questions faciles et tu répartis ton temps.
        questions:
            -   id: q01
                type: tableau
                enonce: 'D’après le document 1, classe chaque constituant : acquérir, traiter ou communiquer.'
                colonnes:
                    - Constituant
                    - Fonction
                lignes:
                    -   - Capteur à ultrasons
                        - ''
                    -   - Carte programmable
                        - ''
                    -   - Voyant rouge
                        - ''
                aide: Capteur ou bouton → acquérir ; carte → traiter ; écran, voyant → communiquer.
            -   id: q02
                type: nombre
                enonce: D’après le document 2, quelle est la hauteur d’eau le mercredi ?
                unite: cm
                aide: N’oublie pas l’unité (réflexe n° 5).
            -   id: q03
                type: qcm
                enonce: D’après les documents 2 et 3, quel est le premier jour où le voyant rouge s’allume ?
                choix:
                    -   id: a
                        texte: Jeudi.
                    -   id: b
                        texte: Vendredi.
                    -   id: c
                        texte: Mercredi.
                aide: Relis l’exemple expliqué.
    -   id: a02
        titre: Le dossier, partie 2 (15 minutes)
        transition: La première moitié du dossier est faite. Garde ton rythme.
        consigne: 'Partie 2 du dossier de la cuve intelligente : tu vas expliquer le calcul de la hauteur, proposer une modification du programme et justifier un choix de la classe. On attend trois réponses justifiées.'
        contenu:
            -   type: etapes
                elements:
                    - 'Relis le document 2 : le calcul « 100 − distance ».'
                    - Pour le programme, repère le nombre qui déclenche le voyant rouge.
                    - Pour le dernier choix, reprends tes réponses des séances 19 et 28.
            -   type: paragraphe
                texte: Pourquoi deux parties ? En coupant le dossier en deux, tu vérifies à mi-parcours que tu as gardé assez de temps (réflexe n° 10).
        questions:
            -   id: q01
                type: texte
                enonce: Explique pourquoi la hauteur d’eau se calcule par « 100 − distance ».
                aide: « = » + fonction + plage.
            -   id: q02
                type: texte
                enonce: Le collège veut être prévenu un peu avant que la cuve déborde. Quel nombre du programme changerais-tu, et pour quelle valeur ? Justifie.
                aide: Bloc par bloc (réflexe n° 9).
            -   id: q03
                type: texte
                enonce: Notre classe a choisi le polyéthylène et un panneau solaire pour cette cuve (séances 19 et 28). Justifie un de ces deux choix en une phrase.
                aide: Pense à « car » (réflexe n° 4).
    -   id: a03
        titre: Correction et bilan
        transition: Le temps est écoulé. La correction est un moment pour comprendre ses erreurs.
        consigne: Tu vas corriger ton dossier avec le professeur, puis faire le bilan de ta gestion du temps. On attend une analyse honnête et une amélioration.
        contenu:
            -   type: paragraphe
                texte: Correction collective avec le professeur. Ensuite, réponds à la question ci-dessous.
            -   type: etapes
                elements:
                    - Suis la correction collective.
                    - Compare tes réponses.
                    - 'Repense à ton temps : où en as-tu perdu ?'
            -   type: paragraphe
                texte: Pourquoi le temps ? Au brevet, ne pas finir fait perdre des points faciles en fin de sujet.
        questions:
            -   id: q01
                type: texte
                enonce: Comment as-tu géré ton temps (réflexe n° 10) ? Qu’est-ce que tu ferais différemment ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La cuve se vide quand on arrose.
        questions:
            -   id: q01
                type: texte
                enonce: Ajoute au programme un message « Cuve presque vide » quand la hauteur est inférieure à 10 cm. Écris le bloc « si … alors ».
                aide: Bloc par bloc (réflexe n° 9).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as traité un dossier complet. Il reste à faire le point.
        questions:
            -   id: q01
                type: texte
                enonce: Quel réflexe brevet t’a été le plus utile aujourd’hui ? Donne un exemple tiré de ta copie.
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Réflexe brevet n° 10 : survoler, commencer par ce que je sais, garder du temps pour me relire.'
    - Un dossier mélange documents, chaîne d’information, données, programme et calculs.
sources:
