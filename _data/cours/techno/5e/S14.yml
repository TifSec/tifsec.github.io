titre: Comment mémoriser une position ?
theme: Comprendre et commander un monte-charge
problematique: Comment mémoriser une position ?
pourquoi: Utiliser une variable pour représenter un état.
application: "Les compteurs de points, les réglages et les états d’un appareil reposent sur des informations mémorisées."
lien_precedent: "Après S13 — Comment un bouton déclenche-t-il une action ?, nous poursuivons avec un seul objectif : utiliser une variable pour représenter un état."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: paragraphe
            texte: Une variable est une information conservée par le programme. Comme la case d’un tableau, elle a un nom et une valeur. Ici position vaut 0 en BAS et 1 en HAUT.
          - type: code
            texte: |-
                Au démarrage : position ← 0
                Bouton A : position ← 1
                Bouton B : position ← 0
                Toujours : afficher position
          - type: paragraphe
            texte: "Exemple guidé dans un jeu : la variable score vaut 0 au départ ; après une pièce, elle vaut 1. Cette comparaison montre qu’une variable garde une valeur. Revenons au monte-charge : position garde l’état BAS ou HAUT."
      questions:
          - id: q01
            type: texte
            enonce: Quelle valeur représente la position haute dans ce modèle ?
            aide: Lis la convention de codage.
          - id: q02
            type: texte
            enonce: Pourquoi faut-il donner une valeur à position au démarrage ?
            aide: Imagine deux essais qui commencent avec des valeurs différentes.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - Modifier une copie du projet de S13.
          - Créer position dans Variables, puis reconstituer le programme fourni.
          - Tester A, B, A et redémarrage ; noter la valeur à chaque fois.
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: Donner les valeurs observées après A, B, A puis redémarrage.
            aide: Affiche la variable, pas un nombre écrit à la main.
      ressources:
          - type: paragraphe
            texte: Dans la documentation, retrouver les blocs d’événement, variable et condition utilisés aujourd’hui.
          - type: lien
            titre: MakeCode micro:bit — Référence
            url: https://makecode.microbit.org/reference
          - type: lien
            titre: Ouvrir le simulateur MakeCode micro:bit
            url: https://makecode.microbit.org/
    - id: a03
      titre: 3. Explique avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Un programme affiche toujours 0 même après A. Proposer une vérification précise.
            aide: Il peut s’agir du changement de valeur ou de ce qui est affiché.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Une variable conserve une information qui peut changer pendant le programme."
    - "Utiliser une variable pour représenter un état."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Une variable conserve une information qui peut changer pendant le programme."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Utiliser une variable pour représenter un état."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : Les compteurs de points, les réglages et les états d’un appareil reposent sur des informations mémorisées."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
