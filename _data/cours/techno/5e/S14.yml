titre: 'Séance 14 : Combien pèse un fichier ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Comment mesurer la quantité d’information d’un fichier, et pourquoi une vidéo prend-elle plus de place qu’un texte ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
objectifs:
    connaissances:
        - 'Le bit est la plus petite information possible : 0 ou 1. Un octet est un groupe de 8 bits.'
        - 'Multiples : 1 kilooctet (Ko) = 1 000 octets ; 1 mégaoctet (Mo) = 1 000 Ko ; 1 gigaoctet (Go) = 1 000 Mo.'
        - 'Ordres de grandeur : un texte de quelques pages pèse quelques Ko, une photo quelques Mo, une minute de vidéo des dizaines de Mo.'
    competences:
        - Convertir entre Ko, Mo et Go.
        - Comparer la taille de fichiers différents.
        - Toujours écrire l’unité (réflexe brevet n° 5).
pourquoi:
    - En séance 13, tu as vu que chaque fichier a un type.
    - 'Les fichiers n’ont pas tous la même taille : une vidéo remplit vite une clé USB, un texte presque pas. Aujourd’hui, tu apprends à mesurer cette quantité d’information.'
activites:
    -   id: a01
        titre: Bits et octets
        contenu:
            -   type: paragraphe
                texte: 'Dans un ordinateur, toute information est écrite avec seulement deux symboles : 0 et 1. Un 0 ou un 1 s’appelle un bit.'
            -   type: paragraphe
                texte: 8 bits forment un octet. Un octet suffit pour écrire une lettre, par exemple la lettre A.
            -   type: tableau
                colonnes:
                    - Unité
                    - Valeur
                lignes:
                    -   - 1 octet
                        - 8 bits
                    -   - 1 kilooctet (Ko)
                        - 1 000 octets
                    -   - 1 mégaoctet (Mo)
                        - 1 000 Ko
                    -   - 1 gigaoctet (Go)
                        - 1 000 Mo
            -   type: paragraphe
                texte: 'Exemple expliqué : combien de Ko dans 3 Mo ? 1 Mo = 1 000 Ko, donc 3 Mo = 3 × 1 000 = 3 000 Ko.'
        questions:
            -   id: q01
                type: nombre
                enonce: Combien de bits y a-t-il dans 4 octets ?
                unite: bits
                aide: Un octet = 8 bits.
            -   id: q02
                type: nombre
                enonce: Combien de Mo y a-t-il dans 2 Go ?
                unite: Mo
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a02
        titre: Quel fichier est le plus lourd ?
        transition: Tu sais convertir les unités. Maintenant, compare la taille de fichiers différents et vois ce qui les rend lourds.
        contenu:
            -   type: tableau
                titre: Document 1 — Tailles habituelles (ordres de grandeur)
                colonnes:
                    - Fichier
                    - Taille
                lignes:
                    -   - Fiche Writer de 2 pages (texte)
                        - 20 Ko
                    -   - Photo prise avec un téléphone
                        - 4 Mo
                    -   - Chanson de 3 minutes (MP3)
                        - 5 Mo
                    -   - Vidéo de 1 minute en haute définition
                        - 100 Mo
            -   type: citation
                texte: 'Réflexe brevet n° 5 : j’écris toujours l’unité de mes résultats (Ko, Mo, Go, km, W…). Un nombre sans unité ne veut rien dire.'
            -   type: paragraphe
                texte: 'Exemple : « 4 » ne dit rien ; « 4 Mo » dit qu’il s’agit d’une photo d’environ 4 mégaoctets.'
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 1, quel fichier est le plus lourd ?
                choix:
                    -   id: a
                        texte: La fiche Writer.
                    -   id: b
                        texte: La photo.
                    -   id: c
                        texte: La vidéo d’une minute.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: nombre
                enonce: D’après le document 1, combien de photos de 4 Mo peut-on mettre sur une clé USB de 1 Go ?
                unite: photos
                aide: Convertis d’abord 1 Go en Mo, puis divise par la taille d’une photo.
            -   id: q03
                type: texte
                enonce: Pourquoi une vidéo est-elle beaucoup plus lourde qu’un texte ? Explique avec « car ».
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a03
        titre: Envoyer et stocker
        transition: Tu sais quels fichiers sont lourds. Cela a des conséquences quand on les envoie ou qu’on les garde.
        contenu:
            -   type: paragraphe
                texte: Plus un fichier est lourd, plus il met de temps à être envoyé et plus il remplit la mémoire d’un téléphone ou d’un serveur. Les serveurs qui stockent nos fichiers consomment de l’électricité.
        questions:
            -   id: q01
                type: texte
                enonce: Donne un conseil pour envoyer moins de données quand on partage des photos, et explique pourquoi c’est utile.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Défi calcul
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une minute de vidéo pèse environ 100 Mo.
        questions:
            -   id: q01
                type: texte
                enonce: Combien pèse environ un film de 2 heures ? Donne le résultat en Go, avec le calcul.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as appris les unités, comparé des fichiers et réfléchi à leur envoi. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment mesurer la quantité d’information d’un fichier, et pourquoi une vidéo prend-elle plus de place qu’un texte ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Bit : 0 ou 1. Octet : 8 bits. Ko, Mo, Go : on multiplie par 1 000 à chaque fois.'
    - Une vidéo est bien plus lourde qu’une photo, elle-même plus lourde qu’un texte.
    - 'Réflexe brevet n° 5 : j’écris toujours l’unité.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
