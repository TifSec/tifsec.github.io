titre: "Arcade : un jeu compréhensible pour quelqu’un d’autre"
theme: Créer un jeu de collecte et expliquer ses règles
problematique: "Arcade : un jeu compréhensible pour quelqu’un d’autre"
pourquoi: Tester l’usage et améliorer une consigne.
application: "Une consigne claire aide une autre personne à utiliser un jeu ou un outil sans être guidée en permanence."
lien_precedent: "Après S30 — Arcade : gagner seulement si les conditions sont réunies, nous poursuivons avec un seul objectif : tester l’usage et améliorer une consigne."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: paragraphe
            texte: "Un jeu fonctionnel doit aussi être compréhensible. Un testeur découvre une copie du projet sans explication orale. Il dispose d’une consigne courte : but, commandes et règle de victoire. Ne pas utiliser uniquement une couleur pour transmettre une information."
          - type: paragraphe
            texte: "Exemple guidé : une consigne dit « Va à droite, ramasse la clé, puis rejoins la porte ». Je la fais tester par une personne qui ne connaît pas le jeu. Si elle hésite, je précise une étape."
      questions:
          - id: q01
            type: texte
            enonce: Quelles informations la notice doit-elle donner avant de jouer ?
            aide: Distingue une consigne d’utilisation du code interne.
          - id: q02
            type: texte
            enonce: Pourquoi ne faut-il pas expliquer oralement pendant le premier essai ?
            aide: Le test porte sur l’autonomie d’usage.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - Écrire une notice de trois lignes.
          - Faire essayer le jeu à un camarade pendant trois minutes sans intervenir.
          - Noter une difficulté observée, modifier un seul élément et refaire le même test.
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: Décrire la difficulté observée, la modification faite et le résultat du second essai.
            aide: Sépare le fait observé de ton interprétation.
      ressources:
          - type: paragraphe
            texte: Retrouver un bloc pour le sprite, les commandes, le score ou les contacts ; comparer avec ton programme.
          - type: lien
            titre: MakeCode Arcade — Référence
            url: https://arcade.makecode.com/reference
          - type: lien
            titre: Ouvrir MakeCode Arcade
            url: https://arcade.makecode.com/
    - id: a03
      titre: 3. Explique avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Un objet dangereux n’est signalé que par la couleur rouge. Proposer une amélioration utile à davantage de joueurs.
            aide: Imagine une personne qui distingue mal cette couleur.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Une consigne se vérifie en faisant essayer le jeu à une autre personne."
    - "Tester l’usage et améliorer une consigne."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Une consigne se vérifie en faisant essayer le jeu à une autre personne."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Tester l’usage et améliorer une consigne."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : Une consigne claire aide une autre personne à utiliser un jeu ou un outil sans être guidée en permanence."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
