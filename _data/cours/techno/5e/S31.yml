titre: "Arcade : un jeu compréhensible pour quelqu’un d’autre"
theme: Créer un jeu de collecte et expliquer ses règles
problematique: "Arcade : un jeu compréhensible pour quelqu’un d’autre"
pourquoi: Tester l’usage et améliorer une consigne.
application: Créer un jeu aide à comprendre événements, données et tests.
lien_precedent: "Après S30 — Arcade : gagner seulement si les conditions sont réunies, nous poursuivons avec un seul objectif : tester l’usage et améliorer une consigne."
activites:
    - id: a01
      titre: Comprendre le document
      pourquoi: Tester l’usage et améliorer une consigne.
      demarche:
          - Lire le document et repérer les mots utiles.
          - Répondre aux deux questions avec une information du document.
      contenu:
          - type: paragraphe
            texte: "Un jeu fonctionnel doit aussi être compréhensible. Un testeur découvre une copie du projet sans explication orale. Il dispose d’une consigne courte : but, commandes et règle de victoire. Ne pas utiliser uniquement une couleur pour transmettre une information."
      questions:
          - id: q01
            type: texte
            enonce: Quelles informations la notice doit-elle donner avant de jouer ?
            aide: Distingue une consigne d’utilisation du code interne.
          - id: q02
            type: texte
            enonce: Pourquoi ne faut-il pas expliquer oralement pendant le premier essai ?
            aide: Le test porte sur l’autonomie d’usage.
    - id: a02
      titre: Faire, chercher et tester
      pourquoi: Mettre l’idée à l’épreuve plutôt que recopier une définition.
      demarche:
          - Écrire une notice de trois lignes.
          - Faire essayer le jeu à un camarade pendant trois minutes sans intervenir.
          - Noter une difficulté observée, modifier un seul élément et refaire le même test.
      contenu:
          - type: paragraphe
            texte: "Travaille au brouillon, dans le logiciel ou sur le schéma. Garde une trace d’essai : situation, résultat attendu et observation. En binôme, échangez les rôles au milieu du travail."
      questions:
          - id: q01
            type: texte
            enonce: Décrire la difficulté observée, la modification faite et le résultat du second essai.
            aide: Sépare le fait observé de ton interprétation.
      ressources:
          - type: paragraphe
            texte: Retrouver un bloc pour le sprite, les commandes, le score ou les contacts ; comparer avec ton programme.
          - type: lien
            titre: MakeCode Arcade — Référence
            url: https://arcade.makecode.com/reference
          - type: lien
            titre: Ouvrir MakeCode Arcade
            url: https://arcade.makecode.com/
    - id: a03
      titre: Expliquer ce que le test permet de conclure
      pourquoi: Relier sa réponse à une donnée et préciser une limite.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Un objet dangereux n’est signalé que par la couleur rouge. Proposer une amélioration utile à davantage de joueurs.
            aide: Imagine une personne qui distingue mal cette couleur.
    - id: a04
      titre: Conserver et retenir
      pourquoi: Finir avec une trace réutilisable.
      demarche:
          - Vérifier le nom du projet ou de la trace.
          - Noter au brouillon une erreur corrigée ou une étape à reprendre.
      contenu: []
      questions: []
retenir:
    - Tester l’usage et améliorer une consigne.
    - Un événement déclenche une action ; une variable garde une information.
    - Un test provoque une situation et compare le résultat observé au résultat attendu.
bilan: Je conserve une trace qui montre ce que j’ai compris ou testé. Une erreur expliquée et corrigée est un progrès observable.
introduction:
    - type: paragraphe
      texte: "Objectif du jour : Tester l’usage et améliorer une consigne."
    - type: paragraphe
      texte: "Séance de 50 minutes de travail effectif : lire et comprendre, réaliser ou chercher, tester, puis faire un bilan. Les essais font partie du travail ; une version simple suffit pour commencer."
    - type: liste
      elements:
          - Un événement déclenche une action ; une variable garde une information.
          - Une condition permet de choisir une action selon une situation.
          - Un test provoque une situation et compare le résultat observé au résultat attendu.
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
