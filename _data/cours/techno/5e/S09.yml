titre: 'Séance 9 : Une même fonction, plusieurs solutions ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Pour éclairer, pourquoi existe-t-il plusieurs solutions techniques, et comment les comparer ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
objectifs:
    connaissances:
        - 'Une fonction technique, c’est une action que l’objet doit réaliser (ici : produire de la lumière).'
        - 'Une solution technique, c’est le moyen choisi pour réaliser cette fonction : flamme, ampoule à filament, LED…'
        - 'On compare des solutions avec des critères : consommation, durée de vie, prix, sécurité.'
    competences:
        - Associer une solution technique à une fonction.
        - Comparer des solutions avec des données d’un tableau.
        - Justifier avec « car » et un fait du document (réflexe brevet n° 4).
pourquoi:
    - Depuis des milliers d’années, les humains ont besoin de s’éclairer la nuit.
    - 'Pour cette même fonction, ils ont inventé plusieurs solutions : la bougie, l’ampoule, la LED, la lampe solaire de jardin. Aujourd’hui, tu vas les comparer pour comprendre pourquoi on en change.'
activites:
    -   id: a01
        titre: Fonction et solutions
        contenu:
            -   type: paragraphe
                texte: La fonction technique est ce que l’objet doit faire. La solution technique est la façon de le faire.
            -   type: tableau
                titre: 'Exemple expliqué : éclairer'
                colonnes:
                    - Fonction technique
                    - Solution technique
                    - Comment ça marche ?
                lignes:
                    -   - Produire de la lumière
                        - La bougie
                        - Une mèche brûle et fait une flamme.
                    -   - Produire de la lumière
                        - L’ampoule à filament
                        - Un fil très fin chauffe et devient lumineux.
                    -   - Produire de la lumière
                        - La LED
                        - Un petit composant électronique produit de la lumière sans presque chauffer.
                    -   - Produire de la lumière
                        - La lampe solaire de jardin
                        - Un petit panneau solaire charge une batterie le jour ; une LED éclaire la nuit.
        questions:
            -   id: q01
                type: tableau
                enonce: Pour chaque solution technique, écris la fonction technique qu’elle réalise.
                colonnes:
                    - Solution technique
                    - Fonction technique
                lignes:
                    -   - Les roues d’un vélo
                        - ''
                    -   - Les freins d’un vélo
                        - ''
                    -   - La sonnette d’un vélo
                        - ''
                aide: 'Une fonction technique commence par un verbe : rouler, freiner, avertir…'
            -   id: q02
                type: qcm
                enonce: La LED et l’ampoule à filament…
                choix:
                    -   id: a
                        texte: réalisent la même fonction avec deux solutions différentes.
                    -   id: b
                        texte: réalisent deux fonctions différentes.
                    -   id: c
                        texte: sont la même solution.
    -   id: a02
        titre: Comparer avec des données
        transition: 'Tu sais qu’il existe plusieurs solutions pour éclairer. Pour savoir laquelle choisir, il faut des faits : c’est le rôle d’un tableau de données.'
        contenu:
            -   type: paragraphe
                texte: 'Pour choisir une solution, on la compare à d’autres avec des critères. Lis bien le tableau : une ligne croise une colonne.'
            -   type: tableau
                titre: Document 1 — Trois lampes qui éclairent autant (valeurs moyennes arrondies)
                colonnes:
                    - Solution
                    - Puissance consommée pour la même lumière
                    - Durée de vie
                    - Chaleur produite
                lignes:
                    -   - Ampoule à filament
                        - 60 W
                        - 1 000 heures
                        - Très chaude
                    -   - Lampe fluocompacte
                        - 12 W
                        - 8 000 heures
                        - Tiède
                    -   - LED
                        - 8 W
                        - 25 000 heures
                        - Peu chaude
            -   type: citation
                texte: 'Réflexe brevet n° 4 : pour justifier, j’écris « car » puis un fait précis tiré du document, avec sa valeur.'
            -   type: paragraphe
                texte: 'Exemple : « La LED dure plus longtemps car, d’après le document 1, elle dure 25 000 heures contre 1 000 heures pour l’ampoule à filament. »'
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 1, quelle lampe consomme le moins d’énergie ?
                choix:
                    -   id: a
                        texte: L’ampoule à filament.
                    -   id: b
                        texte: La lampe fluocompacte.
                    -   id: c
                        texte: La LED.
            -   id: q02
                type: nombre
                enonce: D’après le document 1, combien de fois la LED dure-t-elle plus longtemps que l’ampoule à filament ?
                unite: fois
                aide: Divise la durée de vie de la LED par celle de l’ampoule à filament.
            -   id: q03
                type: texte
                enonce: Pourquoi a-t-on presque remplacé les ampoules à filament par des LED ? Justifie avec deux faits du document 1 (réflexe n° 4).
    -   id: a03
        titre: Et la lampe solaire de jardin ?
        transition: 'Tu as comparé trois lampes électriques. Une quatrième solution n’a même pas besoin de prise : la lampe solaire de jardin.'
        contenu:
            -   type: paragraphe
                texte: 'La lampe solaire de jardin n’a pas besoin d’être branchée : son panneau solaire charge une batterie pendant la journée, puis une LED éclaire la nuit.'
            -   type: paragraphe
                texte: 'Mais si son panneau est à l’ombre ou mal orienté, la batterie se charge mal. Garde cette idée : on y reviendra en fin d’année avec le tracker solaire.'
        questions:
            -   id: q01
                type: texte
                enonce: Explique un avantage et une limite de la lampe solaire de jardin par rapport à une lampe branchée sur le secteur.
    -   id: a04
        titre: Inventer une solution
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: 'Une autre solution pour éclairer existe : la lampe à dynamo, qu’on recharge en tournant une manivelle.'
        questions:
            -   id: q01
                type: texte
                enonce: Dans quelle situation la lampe à dynamo est-elle la meilleure solution ? Explique.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as découvert plusieurs solutions et appris à les comparer avec des données. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : pour éclairer, pourquoi existe-t-il plusieurs solutions techniques, et comment les comparer ?'
retenir:
    - 'Fonction technique : ce que l’objet doit faire. Solution technique : comment il le fait.'
    - Une même fonction peut avoir plusieurs solutions ; on les compare avec des critères et des données.
    - 'Réflexe brevet n° 4 : je justifie avec « car » et un fait précis du document.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
