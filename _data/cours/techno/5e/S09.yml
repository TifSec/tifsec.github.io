      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
introduction:
    - type: titre
      texte: "Compétence visée : Décomposer de manière guidée un problème, organiser une suite d'actions et décrire en langage naturel le comportement attendu d'un programme"
    - type: paragraphe
      texte: "Objectifs d’apprentissage :"
    - type: liste
      elements:
          - Comprendre qu'un problème complexe peut être décomposé en plusieurs problèmes plus simples.
          - Comprendre que certaines parties d'un problème peuvent être étudiées séparément avant d'être assemblées.
          - Découvrir la notion d'algorithme.
          - Comprendre qu'un algorithme décrit une suite organisée d'actions.
          - Comprendre que certaines actions sont déclenchées par un événement.
          - Comprendre qu'un programme peut avoir besoin de mémoriser des informations pour les utiliser plus tard.
    - type: liste
      elements:
          - Identifier les principales parties d'un problème.
          - Décomposer de manière guidée un objectif en plusieurs sous-problèmes.
          - Organiser des actions dans un ordre logique.
          - Représenter une décomposition sous la forme d'un schéma simple.
          - Décrire avec des phrases précises ce qu'un futur programme devra faire.
          - Identifier quelques informations qu'un programme doit utiliser ou mémoriser.
    - type: liste
      elements:
          - Un document LibreOffice Writer nommé 5e_S9_nom1_nom2.odt.
          - Les noms et prénoms des élèves du groupe.
          - Le titre de la séance.
          - Les réponses aux différentes questions.
          - Un schéma présentant la décomposition d'un petit jeu vidéo.
          - Des algorithmes simples écrits en langage naturel.
          - Un tableau préparant les principales parties du futur programme.
    - type: paragraphe
      texte: Le document devra être rendu à la fin de la séance, même s'il n'est pas entièrement terminé.
    - type: paragraphe
      texte: "Important : aujourd'hui, vous ne programmez pas encore le jeu. Vous préparez sa logique afin de rendre la programmation de la prochaine séance plus simple."
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
