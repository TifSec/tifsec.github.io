titre: 'Séance 4 : Qu’est-ce qui agit autour d’un objet ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Avec quoi et avec qui une lampe de poche agit-elle quand on s’en sert ?
competences_bo:
    - Décrire les interactions entre un objet ou un système technique, son environnement et les utilisateurs
objectifs:
    connaissances:
        - 'Les éléments extérieurs (on dit aussi interacteurs) sont ce qui agit avec l’objet : l’utilisateur, l’environnement, les autres objets, l’énergie.'
        - 'Les pièces de l’objet ne sont pas des éléments extérieurs : elles font partie de lui.'
    competences:
        - Faire la liste des éléments extérieurs d’un objet.
        - Dire ce que chaque élément extérieur fait avec l’objet.
        - Répondre par une phrase qui reprend les mots de la question (réflexe brevet n° 3).
pourquoi:
    - En séance 3, tu as appris à dire à qui un objet rend service et sur quoi il agit.
    - 'Un objet n’est jamais tout seul : il reçoit de l’énergie, il est touché par l’utilisateur, il agit sur ce qui l’entoure. Aujourd’hui, tu vas repérer tous ces éléments avec une lampe de poche.'
activites:
    -   id: a01
        titre: Dedans ou autour de la lampe ?
        contenu:
            -   type: paragraphe
                texte: 'Une lampe de poche est faite de pièces : le boîtier, l’interrupteur, les piles, l’ampoule ou la LED. Ces pièces sont dans l’objet.'
            -   type: paragraphe
                texte: 'Autour d’elle, d’autres éléments agissent avec elle : la personne qui l’utilise, la nuit, l’objet qu’on éclaire… Ce sont les éléments extérieurs.'
            -   type: tableau
                titre: Exemple expliqué
                colonnes:
                    - Élément
                    - Dedans ou autour ?
                    - Pourquoi ?
                lignes:
                    -   - La personne qui tient la lampe
                        - Autour
                        - 'Elle n’est pas une pièce de la lampe : elle l’allume et la dirige.'
                    -   - L’interrupteur
                        - Dedans
                        - 'C’est une pièce de la lampe : si on l’enlève, la lampe est incomplète.'
            -   type: paragraphe
                texte: 'La question à se poser : si j’enlève cet élément, est-ce qu’il manque une pièce à la lampe ? Si oui, il est dedans. Sinon, il est autour.'
        questions:
            -   id: q01
                type: tableau
                enonce: Pour chaque élément, écris « dedans » ou « autour ».
                colonnes:
                    - Élément
                    - Dedans ou autour ?
                lignes:
                    -   - Les piles
                        - ''
                    -   - Le chemin que l’on éclaire
                        - ''
                    -   - La LED
                        - ''
                    -   - La pluie
                        - ''
                aide: 'Pose-toi la question de l’exemple : si j’enlève cet élément, manque-t-il une pièce à la lampe ?'
    -   id: a02
        titre: Que fait chaque élément avec la lampe ?
        transition: 'Tu sais trier ce qui est dedans et autour. Maintenant, tu cherches ce que chaque élément extérieur fait avec la lampe : c’est ce qu’on appelle une interaction.'
        contenu:
            -   type: paragraphe
                texte: 'Un élément extérieur agit avec l’objet, ou l’objet agit sur lui. Exemple : la lampe éclaire le chemin. Le chemin reçoit la lumière de la lampe.'
            -   type: liste
                elements:
                    - L’utilisateur donne un ordre (allumer, éteindre) et dirige la lampe.
                    - L’environnement (pluie, froid, chocs) peut abîmer la lampe.
                    - Un objet éclairé reçoit la lumière.
                    - Le chargeur ou les piles neuves apportent l’énergie.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Complète : que fait chaque élément extérieur avec la lampe ?'
                colonnes:
                    - Élément extérieur
                    - Ce qu’il fait avec la lampe (ou ce que la lampe fait avec lui)
                lignes:
                    -   - L’utilisateur
                        - ''
                    -   - La pluie
                        - ''
                    -   - Le chemin dans la nuit
                        - ''
                aide: 'Utilise les exemples de la liste : donner un ordre, abîmer, recevoir la lumière.'
            -   id: q02
                type: qcm
                enonce: Pourquoi beaucoup de lampes de poche ont-elles un boîtier étanche ?
                choix:
                    -   id: a
                        texte: Pour que la pluie, un élément extérieur, n’abîme pas les piles et la LED.
                    -   id: b
                        texte: Pour que la lampe éclaire plus loin.
                    -   id: c
                        texte: Pour que la lampe soit plus légère.
    -   id: a03
        titre: 'Réflexe brevet n° 3 : répondre avec une phrase qui reprend la question'
        transition: 'Tu as trouvé les éléments extérieurs et leurs actions. Il faut maintenant savoir l’écrire clairement : c’est un réflexe utile toute l’année et au brevet.'
        contenu:
            -   type: citation
                texte: 'Réflexe brevet n° 3 : je réponds par une phrase complète qui reprend les mots de la question. Celui qui lit ma réponse doit la comprendre sans lire la question.'
            -   type: tableau
                titre: Exemple expliqué
                colonnes:
                    - Question
                    - Réponse trop courte
                    - Réponse qui reprend la question
                lignes:
                    -   - Qui allume la lampe ?
                        - Lui.
                        - C’est l’utilisateur qui allume la lampe.
                    -   - Sur quoi la lampe agit-elle ?
                        - Le chemin.
                        - 'La lampe agit sur le chemin : elle l’éclaire.'
            -   type: paragraphe
                texte: 'Rappel du réflexe n° 1 (séance 1) : repère d’abord le verbe de la question.'
        questions:
            -   id: q01
                type: qcm
                enonce: Quelle réponse applique le réflexe n° 3 à la question « Qu’est-ce qui apporte l’énergie à la lampe ? » ?
                choix:
                    -   id: a
                        texte: Les piles.
                    -   id: b
                        texte: Ce sont les piles qui apportent l’énergie à la lampe.
                    -   id: c
                        texte: Énergie.
            -   id: q02
                type: texte
                enonce: Explique pourquoi on éteint une lampe de poche quand on ne s’en sert pas. Réponds par une phrase qui reprend la question.
                aide: 'Commence par : « On éteint une lampe de poche quand on ne s’en sert pas car… »'
    -   id: a04
        titre: La lampe frontale
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un randonneur utilise une lampe frontale, attachée sur la tête, au lieu d’une lampe de poche.
        questions:
            -   id: q01
                type: texte
                enonce: Cite deux éléments extérieurs de la lampe frontale qui n’existent pas pour la lampe de poche, ou qui agissent différemment. Explique ce que cela change pour sa conception.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as trié, expliqué et appris à rédiger une réponse complète. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : avec quoi et avec qui une lampe de poche agit-elle quand on s’en sert ? Donne au moins trois éléments extérieurs et ce qu’ils font.'
                aide: 'Tu peux commencer par : « Une lampe de poche agit avec… »'
retenir:
    - 'Les éléments extérieurs sont ce qui agit avec l’objet sans en faire partie : utilisateur, environnement, autres objets, énergie.'
    - Pour chaque élément extérieur, on dit ce qu’il fait avec l’objet (ou ce que l’objet fait avec lui).
    - 'Réflexe brevet n° 3 : je réponds par une phrase qui reprend les mots de la question.'
sources:
