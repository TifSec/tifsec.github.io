titre: Pourquoi les vélos ont-ils changé au cours du temps ?
theme: "Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser"
problematique: Si le besoin de se déplacer existe depuis longtemps, pourquoi les vélos d'aujourd'hui sont-ils différents des premiers vélos ?
pourquoi: Imaginons maintenant qu'un vélo permette déjà de se déplacer correctement.
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Comprendre qu'un objet technique évolue au cours du temps.
        - Comprendre que le besoin principal peut rester proche alors que les usages et les solutions techniques évoluent.
        - Découvrir les notions de famille d'objets techniques et de lignée d'objets techniques.
        - Identifier différentes raisons pouvant expliquer l'évolution d'un objet technique.
        - Comprendre qu'une évolution technique répond généralement à un problème, un usage ou une contrainte.
    competences: []
activites:
    - id: a04
      titre: 1. Le vélo a-t-il toujours ressemblé à celui que nous connaissons ?
      contenu:
          - type: paragraphe
            texte: Lors des séances précédentes, nous avons étudié le vélo actuel.
          - type: paragraphe
            texte: "Nous avons identifié plusieurs fonctions techniques comme :"
          - type: liste
            elements:
                - permettre d'avancer ;
                - permettre de changer de direction ;
                - permettre de ralentir ou de s'arrêter ;
                - supporter l'utilisateur.
          - type: paragraphe
            texte: Mais les ancêtres du vélo étaient très différents.
          - type: paragraphe
            texte: Le vélo a-t-il toujours utilisé les mêmes solutions techniques ?
          - type: paragraphe
            texte: Dans votre document, notez votre première hypothèse en une ou deux phrases.
      questions: []
    - id: a05
      titre: 2. Remettre les vélos dans l'ordre
      contenu:
          - type: paragraphe
            texte: Observez attentivement les différents vélos représentés sur l'image suivante.
          - type: image
            url: https://tifsec.github.io/techno/5/images/classement_velos.jpg
            alternative: Différents vélos et ancêtres du vélo à classer chronologiquement
          - type: paragraphe
            texte: Sans effectuer de recherche pour le moment, classez-les du plus ancien au plus récent.
      questions:
          - id: q01
            type: texte
            enonce: "Q1 : Notez votre classement dans votre document."
          - id: q02
            type: texte
            enonce: "Q2 : Pour chaque objet, indiquez au moins un indice qui vous a aidé à estimer son ancienneté."
            suite:
                - type: paragraphe
                  texte: "Vous pouvez notamment observer :"
                - type: liste
                  elements:
                      - la taille des roues ;
                      - la présence ou non de pédales ;
                      - la présence d'une transmission ;
                      - la forme du cadre ;
                      - les systèmes de freinage visibles ;
                      - les matériaux visibles ;
                      - la présence d'une batterie ou d'un moteur électrique.
    - id: a06
      titre: 3. Vérifier nos hypothèses avec des données historiques
      contenu:
          - type: paragraphe
            texte: Comparez maintenant votre classement avec les informations issues de documents historiques et techniques.
          - type: tableau
            colonnes:
                - Objet ou étape étudiée
                - Repère historique
                - Évolution importante
            lignes:
                - - Draisienne
                  - 1817-1818
                  - Deux roues alignées ; propulsion avec les pieds ; absence de pédales.
                - - Vélocipède à pédales
                  - Milieu du XIXe siècle
                  - Apparition de systèmes de pédalage permettant d'entraîner une roue.
                - - Grand-bi
                  - Deuxième moitié du XIXe siècle
                  - Très grande roue avant permettant de parcourir davantage de distance par tour de pédale.
                - - Bicyclette dite de sécurité
                  - Fin du XIXe siècle
                  - Deux roues de dimensions proches et développement de la transmission vers la roue arrière.
                - - Vélo tout-terrain
                  - Développement au XXe siècle
                  - Adaptation à la pratique sur chemins et terrains accidentés.
                - - Vélo à assistance électrique
                  - Développement important à l'époque contemporaine
                  - Ajout d'une assistance électrique au pédalage.
          - type: paragraphe
            texte: "INPI – De la draisienne au vélo sans chaîne : Histoire des inventions et brevets liés au vélo"
          - type: lien
            titre: Histoire des inventions et brevets liés au vélo
            url: https://www.inpi.fr/de-la-draisienne-au-velo-sans-chaine
          - type: paragraphe
            texte: "INPI – Un vélocipède pour les bipèdes (1818) : Brevet historique de la draisienne"
          - type: lien
            titre: Brevet historique de la draisienne
            url: https://www.inpi.fr/un-velocipede-pour-les-bipedes-1818
          - type: paragraphe
            texte: "Musée des Arts et Métiers – Bicycle Rudge ou « Grand Bi » : Ressource historique et technique sur la draisienne, le vélocipède et le grand-bi"
          - type: lien
            titre: Ressource historique et technique sur la draisienne, le vélocipède et le grand-bi
            url: https://www.arts-et-metiers.net/sites/arts-et-metiers/files/2021-10/field_media_document-324-fo_grand_bi.pdf
          - type: paragraphe
            texte: "Musée des Arts et Métiers – Le Dicycle Otto Safety : Ressource sur l'évolution des cycles et la recherche de sécurité"
          - type: lien
            titre: Ressource sur l'évolution des cycles et la recherche de sécurité
            url: https://www.arts-et-metiers.net/musee/le-dicycle-otto-safety
      questions:
          - id: q01
            type: texte
            enonce: "Q3 : Votre classement était-il correct ? Si nécessaire, indiquez ce que vous avez dû modifier."
          - id: q02
            type: texte
            enonce: "Q4 : Quelle différence essentielle observez-vous entre la draisienne et les vélocipèdes équipés de pédales ?"
          - id: q03
            type: texte
            enonce: "Q5 : Pourquoi le passage du grand-bi à des bicyclettes possédant deux roues de dimensions proches a-t-il constitué une évolution importante ?"
    - id: a07
      titre: 4. Qu'est-ce qui a changé ?
      contenu:
          - type: paragraphe
            texte: Choisissez maintenant trois objets appartenant à trois périodes différentes.
          - type: paragraphe
            texte: "Dans votre document Writer, recopiez puis complétez le tableau suivant :"
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Critère observé
                - Objet 1
                - Objet 2
                - Objet 3
            lignes:
                - - Comment l'utilisateur provoque-t-il le déplacement ?
                  - ""
                  - ""
                  - ""
                - - Comment change-t-il de direction ?
                  - ""
                  - ""
                  - ""
                - - Comment peut-il ralentir ou s'arrêter ?
                  - ""
                  - ""
                  - ""
                - - Comment l'utilisateur est-il installé ?
                  - ""
                  - ""
                  - ""
                - - Quelle énergie est fournie pour le déplacement ?
                  - ""
                  - ""
                  - ""
          - id: q02
            type: texte
            enonce: "Q6 : Parmi les éléments comparés, lequel vous semble avoir le plus évolué ? Justifiez avec un exemple précis."
    - id: a08
      titre: 5. Et qu'est-ce qui est resté proche ?
      contenu:
          - type: paragraphe
            texte: Les objets étudiés sont très différents, mais ils ont également des points communs.
      questions:
          - id: q01
            type: texte
            enonce: "Q7 : Quel besoin principal est commun à tous ces objets ?"
          - id: q02
            type: texte
            enonce: "Q8 : Retrouvez au moins trois fonctions techniques déjà étudiées que la plupart de ces objets doivent assurer."
          - id: q03
            type: texte
            enonce: "Q9 : Les solutions techniques utilisées pour réaliser ces fonctions sont-elles toujours identiques ? Donnez un exemple."
    - id: a09
      titre: 6. Pourquoi modifier un objet qui fonctionne déjà ?
      contenu:
          - type: paragraphe
            texte: Imaginons maintenant qu'un vélo permette déjà de se déplacer correctement.
          - type: paragraphe
            texte: Pourquoi continuer à le modifier ?
          - type: paragraphe
            texte: Avant de lire les exemples suivants, proposez dans votre document au moins quatre raisons qui pourraient pousser des concepteurs ou fabricants à faire évoluer un vélo.
      questions:
          - id: q01
            type: texte
            enonce: "Q10 : Notez vos quatre propositions."
            suite:
                - type: paragraphe
                  texte: "Comparez ensuite vos idées avec les pistes suivantes :"
                - type: liste
                  elements:
                      - augmenter la sécurité ;
                      - améliorer le confort ;
                      - rechercher de meilleures performances ;
                      - permettre de nouveaux usages ;
                      - rouler sur d'autres types de terrains ;
                      - transporter des personnes ou des marchandises ;
                      - réduire certains efforts de l'utilisateur ;
                      - utiliser de nouveaux matériaux ou procédés ;
                      - faciliter l'entretien ou la réparation ;
                      - répondre à de nouvelles contraintes environnementales ou réglementaires.
    - id: a10
      titre: 7. Relier un problème à une évolution technique
      contenu:
          - type: paragraphe
            texte: Une évolution technique n'apparaît généralement pas sans raison.
          - type: paragraphe
            texte: "On peut rechercher une relation de la forme :"
          - type: paragraphe
            texte: Problème, usage ou contrainte → évolution technique
          - type: paragraphe
            texte: "Exemples :"
          - type: liste
            elements:
                - rouler sur des chemins accidentés → adaptation des pneus, du cadre et éventuellement des suspensions ;
                - réduire l'effort fourni par le cycliste → assistance électrique ;
                - transporter des charges importantes → développement de vélos cargo ;
                - rechercher davantage de sécurité → évolution de la géométrie et des systèmes de freinage.
      questions:
          - id: q01
            type: texte
            enonce: "Q11 : Choisissez une évolution observée sur les vélos et expliquez :"
            suite:
                - type: etapes
                  elements:
                      - le problème, l'usage ou la contrainte ;
                      - la solution technique utilisée pour y répondre.
    - id: a11
      titre: 8. Une famille d'objets techniques
      contenu:
          - type: paragraphe
            texte: Des objets techniques différents peuvent répondre à un même besoin principal.
          - type: paragraphe
            texte: On peut les regrouper dans une famille d'objets techniques.
          - type: paragraphe
            texte: Par exemple, différents moyens de transport peuvent répondre au besoin de déplacer une personne, même s'ils utilisent des principes et des solutions techniques très différents.
      questions:
          - id: q01
            type: texte
            enonce: "Q12 : Parmi les objets suivants, lesquels peuvent être rapprochés par le besoin de déplacement ?"
            suite:
                - type: liste
                  elements:
                      - trottinette ;
                      - automobile ;
                      - train ;
                      - chaussure ;
                      - motocyclette ;
                      - skateboard.
                - type: paragraphe
                  texte: Justifiez au moins deux de vos choix.
    - id: a12
      titre: 9. Une lignée d'objets techniques
      contenu:
          - type: paragraphe
            texte: Nous pouvons aussi nous intéresser à la manière dont un type d'objet évolue au cours du temps.
          - type: paragraphe
            texte: Une lignée d'objets techniques permet de représenter différentes étapes ou générations d'objets liées par une évolution technique.
          - type: paragraphe
            texte: "Dans le cas étudié aujourd'hui :"
          - type: paragraphe
            texte: draisienne → vélocipède → grand-bi → bicyclette → vélos contemporains
          - type: paragraphe
            texte: Cette représentation permet d'observer les solutions conservées, remplacées ou ajoutées au fil du temps.
      questions:
          - id: q01
            type: texte
            enonce: "Q13 : Avec vos propres mots, expliquez la différence entre une famille et une lignée d'objets techniques."
    - id: a13
      titre: "10. Petit défi : faire évoluer un vélo"
      contenu:
          - type: paragraphe
            texte: Imaginez maintenant un vélo destiné à être utilisé dans environ trente ans.
          - type: paragraphe
            texte: Vous ne devez pas commencer par inventer une forme futuriste.
          - type: paragraphe
            texte: Commencez par identifier un problème, un usage ou une contrainte.
          - type: paragraphe
            texte: "Vous pouvez par exemple vous intéresser à :"
          - type: liste
            elements:
                - transporter deux enfants et des courses ;
                - circuler facilement sur des routes très pentues ;
                - prendre moins de place dans une habitation ;
                - être réparé plus facilement ;
                - remplacer facilement les pièces d'usure ;
                - utiliser moins de matières premières ;
                - augmenter la durée d'utilisation du vélo.
      questions:
          - id: q01
            type: texte
            enonce: "Q14 : Quel problème, usage ou contrainte avez-vous choisi ?"
          - id: q02
            type: texte
            enonce: "Q15 : Proposez une évolution ou une solution technique permettant d'y répondre."
          - id: q03
            type: texte
            enonce: "Q16 : Expliquez en deux ou trois phrases pourquoi cette solution répond au problème choisi."
    - id: a14
      titre: 11. Conclusion du travail
      contenu:
          - type: paragraphe
            texte: "Sans retourner lire les parties précédentes, complétez :"
          - type: liste
            elements:
                - Les objets techniques peuvent évoluer lorsque les ................................................, les usages, les contraintes ou les technologies évoluent.
                - Des objets techniques pouvant être rapprochés par un même besoin peuvent former une ................................................ d'objets techniques.
                - Les différentes étapes de l'évolution d'un type d'objet peuvent être représentées par une ................................................ d'objets techniques.
                - Une évolution technique permet généralement de répondre à un ................................................, un usage ou une contrainte.
          - type: paragraphe
            texte: "Dernière question :"
          - type: paragraphe
            texte: "Comparez la draisienne à un vélo actuel :"
          - type: paragraphe
            texte: le besoin principal est-il très différent ? Les solutions techniques sont-elles identiques ? Expliquez en deux ou trois phrases.
          - type: paragraphe
            texte: Enregistrez votre travail puis déposez-le dans l'espace d'échange.
      questions: []
    - id: a15
      titre: Sources et ressources
      contenu:
          - type: liste
            elements:
                - "Ministère de l'Éducation nationale – Programme de technologie du cycle 4 : Programme et compétences de technologie au collège"
                - "Éduscol STI – Technologie au collège : Programmes et ressources d'accompagnement"
          - type: lien
            titre: Programme et compétences de technologie au collège
            url: https://www.education.gouv.fr/les-programmes-du-college-470408
          - type: lien
            titre: Programmes et ressources d'accompagnement
            url: https://sti.eduscol.education.fr/technologie-college
          - type: paragraphe
            texte: Les repères historiques de cette séance sont volontairement simplifiés pour le niveau 5e. L'histoire du vélo comporte plusieurs inventions, perfectionnements, brevets et attributions parfois discutés. L'objectif de la séance est de comprendre l'évolution des solutions techniques et non de mémoriser une chronologie détaillée de toutes les inventions.
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
introduction:
    - type: titre
      texte: "Compétence visée : Mettre en relation l'évolution des objets techniques avec l'évolution des besoins, des usages, des contraintes et des solutions techniques"
    - type: paragraphe
      texte: "Objectifs d’apprentissage :"
    - type: liste
      elements:
          - Comprendre qu'un objet technique évolue au cours du temps.
          - Comprendre que le besoin principal peut rester proche alors que les usages et les solutions techniques évoluent.
          - Découvrir les notions de famille d'objets techniques et de lignée d'objets techniques.
          - Identifier différentes raisons pouvant expliquer l'évolution d'un objet technique.
          - Comprendre qu'une évolution technique répond généralement à un problème, un usage ou une contrainte.
    - type: liste
      elements:
          - Observer et comparer plusieurs objets techniques.
          - Proposer puis vérifier un classement chronologique.
          - Repérer ce qui a changé et ce qui est resté similaire.
          - Mettre en relation une évolution technique avec un problème, un usage ou une contrainte.
          - Organiser des informations dans un tableau.
          - Justifier une hypothèse à partir d'indices.
    - type: liste
      elements:
          - Un document LibreOffice Writer nommé 5e_S4_nom1_nom2.odt.
          - Les noms et prénoms des élèves du groupe.
          - Le titre de la séance.
          - Les réponses aux différentes questions.
          - Un classement chronologique des vélos étudiés.
          - Un tableau comparatif.
          - Une courte conclusion expliquant pourquoi le vélo a évolué.
    - type: paragraphe
      texte: Le document devra être enregistré puis déposé dans l'espace d'échange à la fin de la séance, même s'il n'est pas entièrement terminé.
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
