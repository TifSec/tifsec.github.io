titre: Quel problème allons-nous améliorer ?
theme: Améliorer, réaliser et valider une solution numérique
problematique: Quel problème allons-nous améliorer ?
pourquoi: Choisir une amélioration réaliste et un critère de réussite.
application: "Améliorer un outil commence par un problème observé par une personne qui l’utilise."
lien_precedent: "Après S43 — Cuve intelligente : peut-on valider notre modèle ?, nous poursuivons avec un seul objectif : choisir une amélioration réaliste et un critère de réussite."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: paragraphe
            texte: "Choisir un seul support déjà étudié : monte-charge simulé, affichage de la cuve ou jeu de collecte. L’amélioration doit corriger un problème observé, pas ajouter beaucoup de fonctionnalités sans les tester."
          - type: tableau
            colonnes:
                - Support
                - Exemple de problème
            lignes:
                - - Monte-charge simulé
                  - État mal compris au redémarrage
                - - Cuve simulée
                  - Message d’alerte peu clair
                - - Jeu
                  - Victoire impossible à comprendre
          - type: paragraphe
            texte: "Exemple guidé : si un message « erreur » ne dit pas quoi faire, je peux proposer d’ajouter une action précise. Mon critère de réussite est vérifiable : une personne qui lit le message sait quelle première vérification réaliser."
      questions:
          - id: q01
            type: texte
            enonce: Quel support choisis-tu et quelle observation justifie ce choix ?
            aide: Reprends une trace de travail antérieure.
          - id: q02
            type: texte
            enonce: Qui bénéficiera de l’amélioration ?
            aide: Décris la personne et la difficulté rencontrée.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - Reprendre une trace d’essai de la séquence choisie.
          - Formuler le problème et dessiner une amélioration.
          - Fixer un critère observable et faire valider le périmètre numérique par le professeur.
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: Présenter ton amélioration et un critère qui permettra de dire si elle fonctionne.
            aide: Le critère doit pouvoir être testé.
      ressources:
          - type: paragraphe
            texte: Dans la documentation, retrouver les blocs d’événement, variable et condition utilisés aujourd’hui.
          - type: lien
            titre: MakeCode micro:bit — Référence
            url: https://makecode.microbit.org/reference
          - type: lien
            titre: Ouvrir le simulateur MakeCode micro:bit
            url: https://makecode.microbit.org/
    - id: a03
      titre: 3. Explique avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Pourquoi faut-il limiter le projet à une amélioration principale ?
            aide: Relie le périmètre aux moyens.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Un critère de réussite doit être observable ou mesurable."
    - "Choisir une amélioration réaliste et un critère de réussite."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Un critère de réussite doit être observable ou mesurable."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Choisir une amélioration réaliste et un critère de réussite."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : Améliorer un outil commence par un problème observé par une personne qui l’utilise."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
