titre: Comment préparer un prototype testable ?
theme: Améliorer, réaliser et valider une solution numérique
problematique: Comment préparer un prototype testable ?
pourquoi: Organiser les tâches et prévoir un test avant de modifier.
application: Une méthode technique sert à expliquer, choisir et améliorer les outils du quotidien.
lien_precedent: "Après S44 — Quel problème allons-nous améliorer ?, nous poursuivons avec un seul objectif : organiser les tâches et prévoir un test avant de modifier."
activites:
    - id: a01
      titre: Comprendre le document
      pourquoi: Organiser les tâches et prévoir un test avant de modifier.
      demarche:
          - Lire le document et repérer les mots utiles.
          - Répondre aux deux questions avec une information du document.
      contenu:
          - type: paragraphe
            texte: Avant de modifier, conserver une copie de la version qui fonctionne. Un petit plan indique ce qui change, ce qui reste identique et comment comparer les deux versions.
          - type: tableau
            colonnes:
                - Trace à préparer
                - Contenu attendu
            lignes:
                - - Croquis ou blocs
                  - Partie modifiée repérable
                - - Liste de tâches
                  - Trois tâches courtes et ordonnées
                - - Test
                  - Même situation pour les deux versions
      questions:
          - id: q01
            type: texte
            enonce: Pourquoi conserver la version précédente avant la modification ?
            aide: Une correction peut aussi introduire une erreur.
          - id: q02
            type: texte
            enonce: Donner les noms des deux versions, sans nom complet ni donnée personnelle.
            aide: Par exemple support_v1 et support_v2.
    - id: a02
      titre: Faire, chercher et tester
      pourquoi: Mettre l’idée à l’épreuve plutôt que recopier une définition.
      demarche:
          - Dupliquer le projet numérique et nommer clairement les deux versions.
          - Dessiner les blocs ou écrans concernés avant de les modifier.
          - Écrire le test de comparaison et répartir les rôles, puis les faire tourner.
      contenu:
          - type: paragraphe
            texte: "Travaille au brouillon, dans le logiciel ou sur le schéma. Garde une trace d’essai : situation, résultat attendu et observation. En binôme, échangez les rôles au milieu du travail."
      questions:
          - id: q01
            type: texte
            enonce: Présenter tes trois tâches et le test prévu avant de commencer.
            aide: Le test doit viser le critère défini en S44.
      ressources:
          - type: paragraphe
            texte: Dans la documentation, retrouver les blocs d’événement, variable et condition utilisés aujourd’hui.
          - type: lien
            titre: MakeCode micro:bit — Référence
            url: https://makecode.microbit.org/reference
          - type: lien
            titre: Ouvrir le simulateur MakeCode micro:bit
            url: https://makecode.microbit.org/
    - id: a03
      titre: Expliquer ce que le test permet de conclure
      pourquoi: Relier sa réponse à une donnée et préciser une limite.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Si l’on change en même temps les commandes, les messages et les seuils, pourquoi devient-il difficile d’expliquer une amélioration ?
            aide: Commence par une seule modification principale.
    - id: a04
      titre: Conserver et retenir
      pourquoi: Finir avec une trace réutilisable.
      demarche:
          - Vérifier le nom du projet ou de la trace.
          - Noter au brouillon une erreur corrigée ou une étape à reprendre.
      contenu: []
      questions: []
retenir:
    - Organiser les tâches et prévoir un test avant de modifier.
    - Une amélioration répond à un problème observé et à un critère explicite.
    - La validation indique les cas testés et les limites restantes.
bilan: Je conserve une trace qui montre ce que j’ai compris ou testé. Une erreur expliquée et corrigée est un progrès observable.
introduction:
    - type: paragraphe
      texte: "Objectif du jour : Organiser les tâches et prévoir un test avant de modifier."
    - type: paragraphe
      texte: "Séance de 50 minutes de travail effectif : lire et comprendre, réaliser ou chercher, tester, puis faire un bilan. Les essais font partie du travail ; une version simple suffit pour commencer."
    - type: liste
      elements:
          - Une amélioration répond à un problème observé et à un critère explicite.
          - Conserver les versions et comparer des essais identiques aide à expliquer un changement.
          - La validation indique les cas testés et les limites restantes.
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
