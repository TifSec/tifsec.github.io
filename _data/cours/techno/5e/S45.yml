titre: Comment préparer un prototype testable ?
theme: Améliorer, réaliser et valider une solution numérique
problematique: Comment préparer un prototype testable ?
pourquoi: Organiser les tâches et prévoir un test avant de modifier.
application: "Préparer un test avant de modifier un objet aide à comprendre l’effet de chaque changement."
lien_precedent: "Après S44 — Quel problème allons-nous améliorer ?, nous poursuivons avec un seul objectif : organiser les tâches et prévoir un test avant de modifier."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: paragraphe
            texte: Avant de modifier, conserver une copie de la version qui fonctionne. Un petit plan indique ce qui change, ce qui reste identique et comment comparer les deux versions.
          - type: tableau
            colonnes:
                - Trace à préparer
                - Contenu attendu
            lignes:
                - - Croquis ou blocs
                  - Partie modifiée repérable
                - - Liste de tâches
                  - Trois tâches courtes et ordonnées
                - - Test
                  - Même situation pour les deux versions
          - type: paragraphe
            texte: "Exemple guidé : avant de changer un programme, je note le résultat actuel. Je modifie une seule règle, puis je refais le même essai. Cette comparaison permet de voir si mon changement a aidé."
      questions:
          - id: q01
            type: texte
            enonce: Pourquoi conserver la version précédente avant la modification ?
            aide: Une correction peut aussi introduire une erreur.
          - id: q02
            type: texte
            enonce: Donner les noms des deux versions, sans nom complet ni donnée personnelle.
            aide: Par exemple support_v1 et support_v2.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - Dupliquer le projet numérique et nommer clairement les deux versions.
          - Dessiner les blocs ou écrans concernés avant de les modifier.
          - Écrire le test de comparaison et répartir les rôles, puis les faire tourner.
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: Présenter tes trois tâches et le test prévu avant de commencer.
            aide: Le test doit viser le critère défini en S44.
      ressources:
          - type: paragraphe
            texte: Dans la documentation, retrouver les blocs d’événement, variable et condition utilisés aujourd’hui.
          - type: lien
            titre: MakeCode micro:bit — Référence
            url: https://makecode.microbit.org/reference
          - type: lien
            titre: Ouvrir le simulateur MakeCode micro:bit
            url: https://makecode.microbit.org/
    - id: a03
      titre: 3. Explique avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Si l’on change en même temps les commandes, les messages et les seuils, pourquoi devient-il difficile d’expliquer une amélioration ?
            aide: Commence par une seule modification principale.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Un test contrôlé change une seule chose et garde une trace du résultat."
    - "Organiser les tâches et prévoir un test avant de modifier."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Un test contrôlé change une seule chose et garde une trace du résultat."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Organiser les tâches et prévoir un test avant de modifier."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : Préparer un test avant de modifier un objet aide à comprendre l’effet de chaque changement."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
