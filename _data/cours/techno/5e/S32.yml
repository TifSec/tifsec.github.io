titre: "Arcade : expliquer son programme et ses tests"
theme: Créer un jeu de collecte et expliquer ses règles
problematique: "Arcade : expliquer son programme et ses tests"
pourquoi: Rendre compte d’un programme avec une preuve.
application: Créer un jeu aide à comprendre événements, données et tests.
lien_precedent: "Après S31 — Arcade : un jeu compréhensible pour quelqu’un d’autre, nous poursuivons avec un seul objectif : rendre compte d’un programme avec une preuve."
activites:
    - id: a01
      titre: Comprendre le document
      pourquoi: Rendre compte d’un programme avec une preuve.
      demarche:
          - Lire le document et repérer les mots utiles.
          - Répondre aux deux questions avec une information du document.
      contenu:
          - type: code
            texte: |-
                Règle attendue : victoire à la sortie si score ≥ 3
                Essai A : score 2, contact sortie → pas de victoire
                Essai B : score 3, contact sortie → victoire
          - type: paragraphe
            texte: "Ce document décrit deux essais conformes. Ton propre programme peut avoir un autre résultat : le but est de le repérer et de l’expliquer, pas de recopier « tout fonctionne »."
      questions:
          - id: q01
            type: texte
            enonce: Pourquoi les essais A et B ne sont-ils pas redondants ?
            aide: Comparer les valeurs plutôt que le nombre d’essais.
          - id: q02
            type: texte
            enonce: Quel bloc logique traduit « au moins trois » ?
            aide: Le cas score = 3 doit être accepté.
    - id: a02
      titre: Faire, chercher et tester
      pourquoi: Mettre l’idée à l’épreuve plutôt que recopier une définition.
      demarche:
          - Terminer la version minimale et conserver une copie du projet.
          - Présenter en une minute la règle principale et un test.
          - Comparer ton résultat à celui d’un camarade et écrire une limite du test.
      contenu:
          - type: paragraphe
            texte: "Travaille au brouillon, dans le logiciel ou sur le schéma. Garde une trace d’essai : situation, résultat attendu et observation. En binôme, échangez les rôles au milieu du travail."
      questions:
          - id: q01
            type: texte
            enonce: "Présenter ton programme : entrée de l’utilisateur, information mémorisée et action produite."
            aide: Appuie ton explication sur trois blocs repérables.
      ressources:
          - type: paragraphe
            texte: Retrouver un bloc pour le sprite, les commandes, le score ou les contacts ; comparer avec ton programme.
          - type: lien
            titre: MakeCode Arcade — Référence
            url: https://arcade.makecode.com/reference
          - type: lien
            titre: Ouvrir MakeCode Arcade
            url: https://arcade.makecode.com/
    - id: a03
      titre: Entraînement DNB — justifier avec une preuve
      pourquoi: Relier sa réponse à une donnée et préciser une limite.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu:
          - type: paragraphe
            texte: "Habitudes du DNB, adaptées à la 5e : dossier court, réponse rédigée et démarche explicite. Ce travail n’est pas un sujet officiel et n’exige pas les connaissances de troisième."
      questions:
          - id: q01
            type: texte
            enonce: Ces deux essais suffisent-ils à prouver que tout le jeu fonctionne ? Justifier et proposer un essai complémentaire.
            aide: Une conclusion doit indiquer ce que les tests couvrent.
    - id: a04
      titre: Conserver et retenir
      pourquoi: Finir avec une trace réutilisable.
      demarche:
          - Vérifier le nom du projet ou de la trace.
          - Noter au brouillon une erreur corrigée ou une étape à reprendre.
      contenu: []
      questions: []
retenir:
    - Rendre compte d’un programme avec une preuve.
    - Un événement déclenche une action ; une variable garde une information.
    - Un test provoque une situation et compare le résultat observé au résultat attendu.
bilan: Je conserve une trace qui montre ce que j’ai compris ou testé. Une erreur expliquée et corrigée est un progrès observable.
introduction:
    - type: paragraphe
      texte: "Objectif du jour : Rendre compte d’un programme avec une preuve."
    - type: paragraphe
      texte: "Séance de 50 minutes de travail effectif : lire et comprendre, réaliser ou chercher, tester, puis faire un bilan. Les essais font partie du travail ; une version simple suffit pour commencer."
    - type: liste
      elements:
          - Un événement déclenche une action ; une variable garde une information.
          - Une condition permet de choisir une action selon une situation.
          - Un test provoque une situation et compare le résultat observé au résultat attendu.
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
    - type: paragraphe
      texte: Les habitudes de rédaction et de justification prennent appui sur le cadre publié pour le DNB à compter de 2027. Le format devra être revérifié avant votre propre session.
    - type: lien
      titre: Éduscol — Épreuves et sujets de référence du DNB
      url: https://eduscol.education.gouv.fr/5607/les-epreuves-du-dnb
