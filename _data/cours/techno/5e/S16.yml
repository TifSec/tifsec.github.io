titre: Une simulation suffit-elle à valider la maquette ?
theme: Comprendre et commander un monte-charge
problematique: Une simulation suffit-elle à valider la maquette ?
pourquoi: Distinguer modèle et observation réelle.
application: "Une simulation aide à préparer un essai, mais ne remplace pas toutes les vérifications du réel."
lien_precedent: "Après S15 — Comment arrêter une montée au bon moment ?, nous poursuivons avec un seul objectif : distinguer modèle et observation réelle."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: paragraphe
            texte: Une simulation représente certains aspects d’un système. Elle peut montrer les décisions du programme sans représenter tous les frottements, défauts ou charges. Un résultat simulé n’est pas automatiquement un résultat réel.
          - type: tableau
            colonnes:
                - Essai
                - Simulation
                - Observation fournie de la maquette
            lignes:
                - - Demande de montée
                  - Montée puis arrêt
                  - Montée puis arrêt
                - - Charge ajoutée
                  - Même durée
                  - Durée plus longue
                - - Obstacle
                  - Non représenté
                  - Mouvement bloqué
          - type: paragraphe
            texte: "Exemple guidé avec une voiture simulée : le modèle peut représenter un freinage sans représenter l’usure des pneus. La voiture est seulement un exemple. Revenons à notre maquette : le simulateur ne vérifie pas tout ce qui se passe dans le monte-charge réel."
      questions:
          - id: q01
            type: texte
            enonce: Quel essai donne un résultat différent entre simulation et observation ?
            aide: Compare les deux colonnes ligne par ligne.
          - id: q02
            type: texte
            enonce: La simulation représente-t-elle l’effet de la charge sur la durée ? Justifier.
            aide: Appuie-toi sur une ligne précise.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - Comparer les trois lignes sans faire fonctionner la maquette toi-même.
          - "Dessiner deux colonnes : ce que le modèle représente et ce qu’il ne représente pas."
          - Proposer un essai complémentaire à réaliser par le professeur, avec sa notice.
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: "Proposer un essai complémentaire : ce que l’on change, ce que l’on observe et la précaution à respecter."
            aide: Ne propose pas une charge illimitée ni une personne.
      ressources:
          - type: paragraphe
            texte: "Observer la présentation du support : identifier la maquette et son modèle numérique, sans suivre les missions avancées de 4e–3e."
          - type: lien
            titre: Édubase — Présentation du monte-charge
            url: https://edubase.eduscol.education.fr/fiche/24732
    - id: a03
      titre: 3. Explique avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Un groupe écrit « le programme marche dans le simulateur, donc la maquette est sûre ». Corriger cette conclusion.
            aide: Une validation doit préciser son périmètre.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Une simulation ne représente qu’une partie du fonctionnement réel."
    - "Distinguer modèle et observation réelle."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Une simulation ne représente qu’une partie du fonctionnement réel."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Distinguer modèle et observation réelle."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : Une simulation aide à préparer un essai, mais ne remplace pas toutes les vérifications du réel."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
