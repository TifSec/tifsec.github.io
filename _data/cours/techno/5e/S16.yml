titre: Une simulation suffit-elle à valider la maquette ?
theme: Comprendre et commander un monte-charge
problematique: Une simulation suffit-elle à valider la maquette ?
pourquoi: Distinguer modèle et observation réelle.
application: Un monte-charge déplace une charge et renseigne son utilisateur.
lien_precedent: "Après S15 — Comment arrêter une montée au bon moment ?, nous poursuivons avec un seul objectif : distinguer modèle et observation réelle."
activites:
    - id: a01
      titre: Comprendre le document
      pourquoi: Distinguer modèle et observation réelle.
      demarche:
          - Lire le document et repérer les mots utiles.
          - Répondre aux deux questions avec une information du document.
      contenu:
          - type: paragraphe
            texte: Une simulation représente certains aspects d’un système. Elle peut montrer les décisions du programme sans représenter tous les frottements, défauts ou charges. Un résultat simulé n’est pas automatiquement un résultat réel.
          - type: tableau
            colonnes:
                - Essai
                - Simulation
                - Observation fournie de la maquette
            lignes:
                - - Demande de montée
                  - Montée puis arrêt
                  - Montée puis arrêt
                - - Charge ajoutée
                  - Même durée
                  - Durée plus longue
                - - Obstacle
                  - Non représenté
                  - Mouvement bloqué
      questions:
          - id: q01
            type: texte
            enonce: Quel essai donne un résultat différent entre simulation et observation ?
            aide: Compare les deux colonnes ligne par ligne.
          - id: q02
            type: texte
            enonce: La simulation représente-t-elle l’effet de la charge sur la durée ? Justifier.
            aide: Appuie-toi sur une ligne précise.
    - id: a02
      titre: Faire, chercher et tester
      pourquoi: Mettre l’idée à l’épreuve plutôt que recopier une définition.
      demarche:
          - Comparer les trois lignes sans faire fonctionner la maquette toi-même.
          - "Dessiner deux colonnes : ce que le modèle représente et ce qu’il ne représente pas."
          - Proposer un essai complémentaire à réaliser par le professeur, avec sa notice.
      contenu:
          - type: paragraphe
            texte: "Travaille au brouillon, dans le logiciel ou sur le schéma. Garde une trace d’essai : situation, résultat attendu et observation. En binôme, échangez les rôles au milieu du travail."
      questions:
          - id: q01
            type: texte
            enonce: "Proposer un essai complémentaire : ce que l’on change, ce que l’on observe et la précaution à respecter."
            aide: Ne propose pas une charge illimitée ni une personne.
      ressources:
          - type: paragraphe
            texte: "Observer la présentation du support : identifier la maquette et son modèle numérique, sans suivre les missions avancées de 4e–3e."
          - type: lien
            titre: Édubase — Présentation du monte-charge
            url: https://edubase.eduscol.education.fr/fiche/24732
    - id: a03
      titre: Expliquer ce que le test permet de conclure
      pourquoi: Relier sa réponse à une donnée et préciser une limite.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Un groupe écrit « le programme marche dans le simulateur, donc la maquette est sûre ». Corriger cette conclusion.
            aide: Une validation doit préciser son périmètre.
    - id: a04
      titre: Conserver et retenir
      pourquoi: Finir avec une trace réutilisable.
      demarche:
          - Vérifier le nom du projet ou de la trace.
          - Noter au brouillon une erreur corrigée ou une étape à reprendre.
      contenu: []
      questions: []
retenir:
    - Distinguer modèle et observation réelle.
    - Une fonction décrit ce que fait un élément ; un constituant est la pièce qui réalise cette fonction.
    - "Un modèle représente certains aspects du réel : il faut préciser ce qu’il permet de vérifier."
bilan: Je conserve une trace qui montre ce que j’ai compris ou testé. Une erreur expliquée et corrigée est un progrès observable.
introduction:
    - type: paragraphe
      texte: "Objectif du jour : Distinguer modèle et observation réelle."
    - type: paragraphe
      texte: "Séance de 50 minutes de travail effectif : lire et comprendre, réaliser ou chercher, tester, puis faire un bilan. Les essais font partie du travail ; une version simple suffit pour commencer."
    - type: liste
      elements:
          - Une fonction décrit ce que fait un élément ; un constituant est la pièce qui réalise cette fonction.
          - Une information renseigne le programme ; une action produit un changement.
          - "Un modèle représente certains aspects du réel : il faut préciser ce qu’il permet de vérifier."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
