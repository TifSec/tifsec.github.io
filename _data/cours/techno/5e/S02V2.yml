titre: Pourquoi fabrique-t-on des objets techniques ?
theme: Comprendre les objets, leurs usages et leur environnement
problematique: À quoi sert un vélo et avec quoi est-il en relation quand on l’utilise ?
pourquoi: Expliquer à quoi sert un objet technique, distinguer ses usages et repérer ce qui l’entoure pendant son utilisation.
application: Avant de choisir ou de modifier un objet, il faut comprendre à qui il sert, dans quelle situation et avec quels éléments il fonctionne.
lien_precedent: "En séance 1, le défi consistait à faire tenir une feuille debout pendant dix secondes. Plusieurs formes pouvaient convenir. Nous reprenons cette façon de réfléchir : comprendre ce que l’on veut obtenir, observer puis expliquer ses choix. Si tu n’as pas terminé le défi, ce rappel suffit pour commencer."
prerequis:
    - Lire une petite situation et y repérer une information.
    - Expliquer une idée avec ses mots. Les notions nouvelles sont expliquées ci-dessous.
objectifs:
    connaissances:
        - Un objet technique est conçu ou transformé pour répondre à un besoin.
        - Le besoin et l’usage ne désignent pas exactement la même chose.
        - Un objet est en relation avec des éléments extérieurs.
    competences:
        - Nommer des éléments extérieurs au vélo et expliquer leurs relations avec lui ou son utilisation.
        - Compléter une représentation simple de ces relations.
introduction: []
reperes_officiels:
    - type: paragraphe
      texte: En Technologie de 5e, nous apprenons notamment à repérer les éléments extérieurs en relation avec un objet technique. Cette séance prépare ce travail avec un vélo et une situation simple. Le classement naturel/technique et les mots besoin/usage servent de rappels guidés.
    - type: lien
      titre: "Ministère — BO n° 9 du 29 février 2024 : programme de Technologie"
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
    - type: lien
      titre: Annexe officielle — Interactions avec les utilisateurs et l’environnement, page PDF 5
      url: https://www.education.gouv.fr/sites/default/files/document/Annexe%20%E2%80%94%20Programme%20de%20technologie%20du%20cycle%204-368016.pdf
activites:
    - id: a01
      titre: 1. Du défi de la feuille aux objets du quotidien — 4 min
      pourquoi: Comprendre pourquoi on cherche une solution.
      demarche:
          - Lis l’exemple expliqué.
          - Applique la même méthode puis vérifie que ta réponse correspond à la situation.
      contenu:
          - type: paragraphe
            texte: En S1, on voulait qu’une feuille tienne debout. La plier en accordéon ou la courber étaient deux idées de solutions. On jugeait chaque idée en vérifiant si la feuille tenait réellement dix secondes.
          - type: paragraphe
            texte: "Retenons la méthode : je dis ce que je veux obtenir, je regarde les solutions possibles et j’explique comment elles répondent au problème. Aujourd’hui, nous l’appliquons aux objets que les êtres humains fabriquent."
          - type: paragraphe
            texte: "Exemple résolu : je veux écrire un message sur une feuille. Un crayon peut m’aider à laisser cette trace. Le crayon n’existe pas simplement parce qu’il est joli : il a été conçu pour rendre un service."
      ressources:
          - type: paragraphe
            texte: Tu peux modifier une première idée. Explique ce que tu as compris avec tes mots.
      questions: []
    - id: a02
      titre: 2. Naturel ou technique ? — 8 min
      pourquoi: Chercher si l’objet a été fabriqué ou transformé pour un usage.
      demarche:
          - Lis l’exemple expliqué.
          - Applique la même méthode puis vérifie que ta réponse correspond à la situation.
      contenu:
          - type: paragraphe
            texte: Pour ce classement, un élément naturel n’a pas été fabriqué ou transformé par les êtres humains pour l’usage décrit. Un objet technique a été conçu, fabriqué ou transformé pour répondre à un besoin.
          - type: tableau
            colonnes:
                - Élément observé
                - Classement
                - Pourquoi ?
            lignes:
                - - Un galet trouvé au bord d’une rivière, laissé tel quel
                  - Naturel
                  - Il n’a pas été façonné par une personne pour en faire un objet d’usage.
                - - Un bol fabriqué en terre cuite
                  - Technique
                  - La terre a été façonnée puis cuite pour obtenir un récipient.
            titre: Exemple entièrement expliqué
          - type: paragraphe
            texte: "Attention : la matière ne suffit pas pour classer. Un bol en terre et une table en bois utilisent des matières d’origine naturelle ; ils sont pourtant fabriqués. Il faut regarder l’objet obtenu et ce que l’on en a fait."
      ressources:
          - type: paragraphe
            texte: "Aide facultative : pose-toi deux questions. « Une personne a-t-elle fabriqué ou transformé cet objet ? Pour quoi faire ? » Le seul matériau ne donne pas la réponse."
      questions:
          - id: q01
            type: qcm
            enonce: Q1. Quel classement correspond à notre critère ?
            choix:
                - id: a
                  texte: Un coquillage vide trouvé sur une plage est naturel ; une chaussure fabriquée pour protéger le pied est technique.
                - id: b
                  texte: Le coquillage et la chaussure sont tous les deux techniques parce qu’on peut les toucher.
                - id: c
                  texte: Le coquillage et la chaussure sont tous les deux naturels parce que leurs matières viennent de la nature.
          - id: q02
            type: texte
            enonce: "Q2. Une bouteille en verre est fabriquée pour contenir une boisson. Un élève dit : « Le verre vient de matières naturelles, donc la bouteille est naturelle. » Explique ce qui ne va pas dans son raisonnement."
            aide: "Reprends l’exemple du bol : une matière naturelle peut-elle être utilisée pour fabriquer un objet technique ?"
    - id: a03
      titre: 3. Le besoin et les usages du vélo — 10 min
      pourquoi: Distinguer le service recherché et une utilisation précise.
      demarche:
          - Lis l’exemple expliqué.
          - Applique la même méthode puis vérifie que ta réponse correspond à la situation.
      contenu:
          - type: paragraphe
            texte: "Le besoin indique ce que l’on cherche à satisfaire : par exemple se déplacer, s’éclairer ou communiquer. L’usage décrit ce que l’on fait avec un objet dans une situation précise."
          - type: tableau
            colonnes:
                - Question
                - "Exemple résolu : une lampe de bureau"
            lignes:
                - - Quel besoin cherche-t-on à satisfaire ?
                  - S’éclairer pour voir ce que l’on fait.
                - - Quel usage précis en fait-on ?
                  - Léa allume la lampe le soir pour lire son livre.
            titre: "Besoin et usage : deux réponses différentes"
          - type: paragraphe
            texte: "La lampe est notre exemple. Revenons maintenant au vélo : son service principal est de permettre un déplacement. La raison du trajet et ce que l’on transporte peuvent changer selon les personnes."
          - type: paragraphe
            texte: "Document : Noé utilise son vélo pour aller de chez lui au collège. Le dimanche, sa sœur utilise le même vélo pour se promener. Une autre personne utilise un vélo équipé d’un panier pour rapporter des courses."
          - type: paragraphe
            texte: Un même vélo peut avoir plusieurs usages, mais cela ne signifie pas qu’il convient à tous les usages. Un vélo de promenade n’est pas automatiquement adapté à transporter une charge très lourde.
      ressources:
          - type: paragraphe
            texte: "Aide facultative : pour le besoin, commence par « Le vélo permet de… ». Pour l’usage, précise une personne et une situation : « … l’utilise pour… »."
      questions:
          - id: q01
            type: texte
            enonce: Q3. Dans le trajet de Noé, quel besoin le vélo permet-il de satisfaire ? Réponds par une courte phrase.
            aide: Ne réponds pas seulement « un vélo ». Dis ce que cet objet permet à Noé de faire.
          - id: q02
            type: texte
            enonce: Q4. Donne deux usages différents du vélo en t’appuyant sur le document. Pour chaque usage, précise ce que fait la personne.
            aide: Cherche deux situations différentes. Tu peux utiliser les exemples du texte.
    - id: a04
      titre: 4. Ce qui est dedans et ce qui est dehors — 10 min
      pourquoi: Définir le vélo étudié et repérer ses relations avec l’extérieur.
      demarche:
          - Lis l’exemple expliqué.
          - Applique la même méthode puis vérifie que ta réponse correspond à la situation.
      contenu:
          - type: paragraphe
            texte: "Pour savoir ce qui est extérieur, nous devons d’abord choisir ce que nous étudions. Ici, l’objet étudié est le vélo seul : cadre, roues, chaîne, selle et guidon. Le cycliste et le sac transporté ne font pas partie du vélo."
          - type: paragraphe
            texte: Un interacteur extérieur est un élément en relation avec l’objet ou avec son utilisation, mais situé en dehors de l’objet étudié. Ce peut être une personne, un autre objet, une information ou un élément du milieu.
          - type: paragraphe
            texte: "Exemple résolu différent : pour une lampe de poche, la personne qui appuie sur le bouton est extérieure à la lampe. Sa main commande l’allumage. En revanche, le bouton est une pièce de la lampe. Revenons au vélo : le cycliste le commande, tandis que le guidon est une de ses pièces."
          - type: paragraphe
            texte: "Document : pendant le trajet, le cycliste appuie sur les pédales et tient le guidon. Les roues roulent sur le sol. Un sac de courses est posé dans un panier. Le vent peut freiner le déplacement lorsqu’il souffle de face. La pluie peut mouiller le sol et diminuer l’adhérence. Un panneau donne une information au cycliste, qui adapte ensuite sa conduite."
          - type: paragraphe
            texte: "Un panneau ne pousse pas directement le vélo : son information est lue par le cycliste. Nous étudions aussi cette relation parce qu’elle intervient dans l’utilisation du vélo. Nommer un élément n’est pas suffisant : il faut dire ce qu’il fait ou ce qu’il change."
      ressources:
          - type: paragraphe
            texte: "Aide facultative : pour distinguer une pièce d’un élément extérieur, demande-toi si elle appartient au vélo tel qu’on l’a défini. Pour expliquer une relation, cherche un verbe : commander, porter, soutenir, informer, freiner…"
      questions:
          - id: q01
            type: qcm
            enonce: Q5. Quel élément fait partie du vélo, au lieu d’être un interacteur extérieur ?
            choix:
                - id: a
                  texte: Le cycliste qui pédale.
                - id: b
                  texte: Le vent qui souffle de face.
                - id: c
                  texte: La roue avant du vélo.
          - id: q02
            type: tableau
            enonce: Q6. Explique une conséquence possible de chaque élément sur l’utilisation du vélo.
            colonnes:
                - Élément extérieur
                - Ce que cela peut changer
            lignes:
                - - Vent de face
                  - ""
                - - Pluie
                  - ""
            aide: "Relis le document et explique avec tes mots ce que ces éléments peuvent changer. Évite de répondre seulement « ça agit ». "
    - id: a05
      titre: 5. Construire un schéma compréhensible — 12 min
      pourquoi: Organiser les relations autour du vélo.
      demarche:
          - Lis l’exemple expliqué.
          - Applique la même méthode puis vérifie que ta réponse correspond à la situation.
      contenu:
          - type: paragraphe
            texte: Un schéma sert à faire comprendre les relations. Nous plaçons le vélo au centre et les éléments extérieurs autour. Un trait relie chaque élément au vélo ; une courte phrase explique la relation.
          - type: paragraphe
            texte: "Exemple résolu : pour une lampe de poche, on peut écrire « personne ↔ lampe : la personne commande l’allumage ». Le trait signifie ici « est en relation avec ». Il ne représente pas nécessairement un câble, un mouvement ou un transfert d’énergie."
          - type: paragraphe
            texte: Revenons au vélo. Le schéma ci-dessous comporte quatre emplacements numérotés. Dans le tableau de réponse, donne pour chaque numéro un nom précis tiré du document précédent, puis explique la relation. Ta réponse complète les emplacements du schéma ; aucun logiciel de dessin n’est nécessaire.
          - type: image
            url: /assets/images/cours/techno-5e-s02-interactions.svg
            alternative: "Schéma à compléter : le vélo est au centre ; quatre éléments extérieurs sont demandés : la personne qui utilise, le sol, un objet apportant une information et une charge transportée."
            legende: Les quatre numéros correspondent aux lignes du tableau. Complète les noms et les relations dans les cases de réponse.
          - type: etapes
            elements:
                - "Repère dans le document qui utilise le vélo : ce sera le numéro 1."
                - Pour le numéro 2, cherche sur quoi les roues roulent.
                - Pour le numéro 3, cherche un objet qui renseigne le cycliste. Précise par qui l’information est utilisée.
                - Pour le numéro 4, cherche ce que le vélo transporte. Ne donne pas le nom d’une de ses pièces.
                - Dans la dernière colonne du tableau ci-dessous, écris une courte phrase pour dire ce que fait l’élément, ce qu’il change ou ce que le vélo lui fait. Regarde d’abord l’exemple rempli.
      ressources:
          - type: paragraphe
            texte: "Aide facultative : les noms doivent désigner des éléments précis. Écris par exemple « la personne qui utilise… » avant de retrouver son nom dans le texte. Les relations peuvent passer par le cycliste ; ne prétends pas qu’un panneau déplace le vélo."
      questions:
          - id: q01
            type: tableau
            enonce: "Q7. Complète le tableau ci-dessous : chaque ligne correspond à un numéro du schéma. Donne le nom de l’élément, puis écris une phrase comme dans l’exemple."
            contenu:
                - type: titre
                  texte: Exemple rempli avec une lampe de bureau
                - type: paragraphe
                  texte: "Ici, l’objet étudié est une lampe. La dernière colonne explique ce qui se passe entre la lampe et chaque élément extérieur :"
                - type: tableau
                  colonnes:
                      - Nom de l’élément
                      - Que fait cet élément, ou qu’est-ce qu’il change ?
                  lignes:
                      - - La personne
                        - Elle appuie sur l’interrupteur pour allumer la lampe.
                      - - La table
                        - Elle supporte la lampe.
                      - - Le livre
                        - Il est éclairé par la lampe.
                  titre: "Exemple : écrire une phrase qui explique le lien"
                - type: paragraphe
                  texte: "À toi maintenant : nous revenons au vélo. Complète ses quatre lignes ci-dessous avec le même type de phrases."
            colonnes:
                - Repère du schéma
                - Nom de l’élément
                - Que fait cet élément, ou qu’est-ce qu’il change ?
            lignes:
                - - 1 — La personne qui utilise
                  - ""
                  - ""
                - - 2 — Ce sur quoi les roues roulent
                  - ""
                  - ""
                - - 3 — Un objet qui renseigne
                  - ""
                  - ""
                - - 4 — Une charge transportée
                  - ""
                  - ""
    - id: a06
      titre: 6. Réutiliser la méthode avec un monte-charge — 6 min
      pourquoi: Appliquer les mêmes questions à un autre objet.
      demarche:
          - Lis l’exemple expliqué.
          - Applique la même méthode puis vérifie que ta réponse correspond à la situation.
      contenu:
          - type: paragraphe
            texte: "Passons du vélo à un autre objet : un monte-charge."
          - type: paragraphe
            texte: "Situation simplifiée : dans une réserve, une personne utilise un monte-charge pour déplacer des petites boîtes entre deux niveaux. Elle appuie sur un bouton d’appel qui fait partie du système. Les boîtes sont posées sur la plateforme. Le monte-charge étudié comprend la plateforme, le moteur, les boutons et ses autres composants. La personne et les boîtes restent extérieures à ce système."
          - type: paragraphe
            texte: Dans cette situation, le monte-charge transporte uniquement les boîtes, pas les personnes.
          - type: paragraphe
            texte: "Après ta réponse, relis le bilan « À retenir ». Compare ta méthode : as-tu nommé l’objet, expliqué le besoin puis identifié ce qui est extérieur ?"
      ressources:
          - type: paragraphe
            texte: "Aide facultative : reprends les questions du vélo. « À quoi sert l’objet ? Qui l’utilise ? Qu’est-ce qui est transporté ? » Attention : un bouton inclus dans le système n’est pas un élément extérieur."
      questions:
          - id: q01
            type: texte
            enonce: Q8. Quel besoin le monte-charge permet-il de satisfaire ? Nomme ensuite deux éléments extérieurs de cette situation et explique la relation de chacun avec le système.
            aide: "Utilise trois phrases : « Il permet de… », « … est extérieur et… », « … est extérieur et… ». Relis le périmètre indiqué dans le document."
    - id: a07
      titre: Pour aller plus loin — facultatif
      facultatif: true
      obligatoire: false
      pourquoi: Comparer deux objets qui répondent au même besoin.
      demarche:
          - Lis les deux descriptions.
          - Écris ta réponse dans la zone ci-dessous.
      contenu:
          - type: paragraphe
            texte: "Un élève affirme : « Tous les vélos permettent de se déplacer, donc n’importe quel vélo convient pour transporter trois caisses. » Compare les deux vélos décrits ci-dessous."
          - type: tableau
            colonnes:
                - Vélo
                - Chargement prévu dans cet exercice
            lignes:
                - - Vélo A
                  - Un panier qui peut recevoir une petite caisse.
                - - Vélo B
                  - Une plateforme qui peut recevoir trois petites caisses.
            titre: "Document fictif : deux vélos pour comparer des usages"
          - type: paragraphe
            texte: Tu souhaites transporter trois petites caisses en un seul trajet. Appuie ta réponse sur les informations du tableau.
      questions:
          - id: q01
            type: texte
            enonce: Quel vélo choisirais-tu pour ce trajet ? Justifie avec une information du tableau, puis explique pourquoi le besoin « se déplacer » ne suffit pas pour faire ce choix.
            libelle: Défi facultatif
            facultatif: true
            obligatoire: false
            aide: "Compare le nombre de caisses prévu pour chaque vélo. Commence par « Je choisis… parce que… ». "
retenir:
    - Un objet technique est conçu ou transformé par les êtres humains pour répondre à un besoin.
    - Le besoin indique ce que l’on cherche à satisfaire. L’usage décrit ce que l’on fait avec l’objet dans une situation précise.
    - Le vélo permet notamment de se déplacer. On peut l’utiliser pour aller au collège, se promener ou transporter des courses.
    - Un interacteur extérieur est un élément extérieur à l’objet, en relation avec lui ou avec son utilisation.
    - Le cycliste est extérieur au vélo. Une roue et le guidon sont des pièces du vélo.
    - Un schéma utile nomme les éléments et explique les relations. Il n’a pas besoin de ressembler à une photographie.
bilan: Je peux expliquer le besoin auquel répond le vélo, donner deux usages et nommer des éléments extérieurs avec leur rôle. En séance 3, nous regarderons les pièces du vélo pour comprendre comment elles permettent de se déplacer, de se diriger et de s’arrêter.
