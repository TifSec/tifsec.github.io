titre: Pourquoi fabrique-t-on des objets techniques ?
theme: "Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser"
problematique: Pourquoi les êtres humains fabriquent-ils des objets techniques et avec quoi ces objets interagissent-ils lorsqu'ils sont utilisés ?
pourquoi: Nous allons maintenant nous intéresser au vélo.
application: Avant d'étudier les objets techniques, commençons par observer différents éléments que nous pouvons rencontrer autour de nous.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Faire la différence entre un objet naturel et un objet technique.
        - Comprendre les notions de besoin et d'usage.
        - Comprendre qu'un même objet peut avoir plusieurs usages.
        - Comprendre qu'un objet technique interagit avec son utilisateur et son environnement.
        - Découvrir la notion d'interacteur extérieur.
    competences: []
activites:
    - id: a04
      titre: 1. Observer et classer
      contenu:
          - type: paragraphe
            texte: Avant d'étudier les objets techniques, commençons par observer différents éléments que nous pouvons rencontrer autour de nous.
          - type: paragraphe
            texte: "Classez les éléments suivants en deux catégories de votre choix :"
          - type: liste
            elements:
                - un arbre ;
                - un vélo ;
                - un caillou ;
                - une chaussure ;
                - un coquillage ;
                - une table ;
                - une fleur ;
                - un smartphone ;
                - une branche ;
                - une bouteille.
          - type: paragraphe
            texte: "Dans votre document Writer, répondez aux questions suivantes :"
      questions:
          - id: q01
            type: texte
            enonce: "Q1 : Quels sont les deux groupes que vous avez créés ?"
            suite: []
          - id: q02
            type: texte
            enonce: "Q2 : Quel critère avez-vous utilisé pour séparer les éléments ?"
            suite: []
          - id: q03
            type: texte
            enonce: "Q3 : Dans quel groupe placez-vous le vélo ? Justifiez votre réponse en une phrase."
            suite:
                - type: paragraphe
                  texte: "Mise en commun :"
                - type: paragraphe
                  texte: Un objet naturel existe sans avoir été conçu ou fabriqué par l'être humain.
                - type: paragraphe
                  texte: Un objet technique est créé ou transformé par l'être humain pour répondre à un besoin.
    - id: a05
      titre: 2. Pourquoi le vélo existe-t-il ?
      contenu:
          - type: paragraphe
            texte: Nous allons maintenant nous intéresser au vélo.
          - type: paragraphe
            texte: Pourquoi les êtres humains ont-ils créé le vélo ?
          - type: paragraphe
            texte: "Dans votre document Writer :"
      questions:
          - id: q01
            type: texte
            enonce: "Q4 : Quel est le besoin principal auquel répond le vélo ?"
            suite:
                - type: paragraphe
                  texte: "Q5 : Trouvez au moins quatre utilisations différentes que l'on peut faire d'un vélo."
                - type: paragraphe
                  texte: Deux personnes peuvent utiliser un vélo pour des raisons très différentes.
                - type: paragraphe
                  texte: Une personne peut par exemple l'utiliser pour aller travailler alors qu'une autre l'utilise pour pratiquer un sport.
                - type: titre
                  texte: Besoin et usage
                - type: paragraphe
                  texte: Le besoin correspond à ce que l'on cherche à satisfaire.
                - type: paragraphe
                  texte: L'usage correspond à la manière dont l'objet est utilisé dans une situation donnée.
                - type: paragraphe
                  texte: Un même objet technique peut donc répondre à un même besoin tout en ayant plusieurs usages.
                - type: paragraphe
                  texte: "Exemple :"
                - type: liste
                  elements:
                      - "Objet : vélo"
                      - "Besoin : se déplacer"
                      - "Usages possibles : aller au collège ; faire du sport ; se promener ; transporter des courses ; effectuer une livraison."
    - id: a06
      titre: 3. Le vélo fonctionne-t-il tout seul ?
      contenu:
          - type: paragraphe
            texte: Imaginez maintenant une personne circulant à vélo.
          - type: paragraphe
            texte: "Le vélo n'est pas isolé : pendant son utilisation, de nombreux éléments extérieurs peuvent agir sur lui, influencer son déplacement ou fournir des informations au cycliste."
          - type: paragraphe
            texte: "Recherche en groupe :"
          - type: paragraphe
            texte: Trouvez tout ce qui peut avoir une interaction avec le vélo lorsqu'il est utilisé.
          - type: paragraphe
            texte: Vous devez proposer au minimum six éléments différents.
          - type: paragraphe
            texte: "Quelques questions peuvent vous aider :"
      questions:
          - id: q01
            type: texte
            enonce: Qui utilise le vélo ?
          - id: q02
            type: texte
            enonce: Sur quoi roule-t-il ?
          - id: q03
            type: texte
            enonce: Que peut rencontrer le cycliste ?
          - id: q04
            type: texte
            enonce: Qu'est-ce qui peut modifier son déplacement ?
          - id: q05
            type: texte
            enonce: Avec quels autres objets partage-t-il son environnement ?
          - id: q06
            type: texte
            enonce: Quelles informations le cycliste doit-il percevoir ?
    - id: a07
      titre: 4. Les interacteurs du vélo
      contenu:
          - type: paragraphe
            texte: Les éléments que vous venez de rechercher sont extérieurs au vélo, mais ils peuvent agir sur lui, être utilisés par lui ou modifier son fonctionnement et son utilisation.
          - type: paragraphe
            texte: On les appelle des interacteurs extérieurs.
          - type: paragraphe
            texte: "Ils peuvent notamment être :"
          - type: liste
            elements:
                - des usagers ;
                - d'autres objets techniques ;
                - des éléments de l'environnement ;
                - des éléments fournissant des informations.
          - type: paragraphe
            texte: "Exemples possibles autour d'un vélo :"
          - type: liste
            elements:
                - le cycliste ;
                - la route ;
                - les autres véhicules ;
                - les piétons ;
                - la pluie ou le vent ;
                - les panneaux de circulation ;
                - les feux de circulation ;
                - les bagages transportés.
      questions: []
    - id: a08
      titre: 5. Représenter les interactions
      contenu:
          - type: paragraphe
            texte: Dans votre document LibreOffice Writer, réalisez maintenant un schéma des interactions.
          - type: paragraphe
            texte: Placez une image ou un dessin de vélo au centre.
          - type: paragraphe
            texte: Placez autour du vélo les différents interacteurs que vous avez trouvés.
          - type: paragraphe
            texte: Reliez chaque interacteur au vélo avec une ligne ou une flèche.
      questions:
          - id: q01
            type: texte
            enonce: Indiquez clairement le nom de chaque interacteur.
            suite:
                - type: paragraphe
                  texte: "Votre schéma doit contenir au minimum :"
                - type: liste
                  elements:
                      - 1 usager ;
                      - 2 autres objets techniques ;
                      - 2 éléments de l'environnement ;
                      - 1 élément fournissant une information utile au cycliste.
                - type: paragraphe
                  texte: "Exemple de structure :"
          - id: q02
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - ""
                - Route
                - ""
            lignes:
                - - Cycliste
                  - VÉLO
                  - Autres véhicules
                - - ""
                  - Pluie
                  - ""
            suite:
                - type: paragraphe
                  texte: Vous pouvez organiser votre schéma autrement tant qu'il reste clair, compréhensible et lisible.
    - id: a09
      titre: 6. Comprendre les interactions
      contenu:
          - type: paragraphe
            texte: "Sous votre schéma, créez et complétez le tableau suivant :"
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Interacteur
                - Catégorie
                - Quelle relation existe avec le vélo ou son utilisateur ?
            lignes:
                - - Cycliste
                  - Usager
                  - Il commande et utilise le vélo.
                - - Route
                  - Environnement
                  - ""
                - - Automobile
                  - Objet technique
                  - ""
                - - Pluie
                  - ""
                  - ""
                - - Feu de circulation
                  - ""
                  - ""
                - - ""
                  - ""
                  - ""
            suite:
                - type: paragraphe
                  texte: Votre tableau devra contenir au minimum six interacteurs.
    - id: a10
      titre: "7. Petit défi : existe-t-il un seul type de vélo ?"
      contenu:
          - type: paragraphe
            texte: "Un élève affirme :"
          - type: paragraphe
            texte: « Un vélo sert à se déplacer, donc tous les vélos sont faits pour exactement la même chose. »
          - type: paragraphe
            texte: Êtes-vous d'accord ?
          - type: paragraphe
            texte: Dans votre document, rédigez une réponse de deux ou trois phrases et justifiez votre avis.
          - type: paragraphe
            texte: "Vous pouvez notamment réfléchir aux objets suivants :"
          - type: liste
            elements:
                - VTT ;
                - vélo de route ;
                - vélo cargo ;
                - BMX ;
                - vélo de ville.
      questions: []
    - id: a11
      titre: 8. Conclusion du travail
      contenu:
          - type: paragraphe
            texte: "Sans retourner lire les définitions précédentes, complétez dans votre document Writer :"
          - type: liste
            elements:
                - Un objet technique est conçu ou transformé par ................................................ pour répondre à ................................................ .
                - Un même objet technique peut avoir plusieurs ................................................ .
                - Lorsqu'il est utilisé, un objet technique peut interagir avec son ................................................ et avec son ................................................ .
                - Les éléments extérieurs en relation avec l'objet peuvent être appelés des ................................................ .
          - type: paragraphe
            texte: "Dernière question :"
          - type: paragraphe
            texte: En deux ou trois phrases, expliquez pourquoi il est utile d'étudier l'environnement d'un objet technique et pas uniquement l'objet lui-même.
          - type: paragraphe
            texte: Enregistrez votre travail puis déposez-le dans l'espace d'échange.
      questions: []
    - id: a12
      titre: Sources et ressources
      contenu:
          - type: liste
            elements:
                - "Ministère de l'Éducation nationale – Programme de technologie du cycle 4, BO n°9 du 29 février 2024 : Programme officiel de technologie"
                - "Éduscol – Ressources d'accompagnement du programme de technologie au cycle 4 : Ressources d'accompagnement"
          - type: lien
            titre: Programme officiel de technologie
            url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
          - type: lien
            titre: Ressources d'accompagnement
            url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
          - type: paragraphe
            texte: Les définitions et exemples de cette séance ont été formulés et simplifiés pour être adaptés au niveau 5e, à partir des attendus du programme officiel de technologie du cycle 4.
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
introduction:
    - type: titre
      texte: "Compétence visée : Identifier un objet technique, comprendre son usage et décrire ses interactions avec son environnement et ses utilisateurs"
    - type: paragraphe
      texte: "Objectifs d’apprentissage :"
    - type: liste
      elements:
          - Faire la différence entre un objet naturel et un objet technique.
          - Comprendre les notions de besoin et d'usage.
          - Comprendre qu'un même objet peut avoir plusieurs usages.
          - Comprendre qu'un objet technique interagit avec son utilisateur et son environnement.
          - Découvrir la notion d'interacteur extérieur.
    - type: liste
      elements:
          - Observer et classer des objets.
          - Justifier un classement.
          - Identifier le besoin auquel répond un objet technique.
          - Identifier les éléments qui interagissent avec un objet technique.
          - Réaliser un schéma simple représentant ces interactions.
          - Produire un document numérique structuré.
    - type: liste
      elements:
          - Un document LibreOffice Writer nommé 5e_S2_nom1_nom2.odt.
          - Les noms et prénoms des élèves du groupe.
          - Le titre de la séance.
          - Les réponses aux différentes questions.
          - Un schéma représentant le vélo et ses interacteurs.
          - Un tableau présentant les interacteurs du vélo.
          - Une courte conclusion.
    - type: paragraphe
      texte: Le document devra être enregistré puis déposé dans l'espace d'échange à la fin de la séance, même s'il n'est pas entièrement terminé.
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
