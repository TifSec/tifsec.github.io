titre: "Séance 2 : Objet technique ou objet naturel ?"
themes:
    - "Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser"
problematique: "Comment reconnaître un objet fabriqué par l’être humain, et pourquoi l’a-t-il fabriqué ?"
competences_bo:
    - "Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques"
objectifs:
    connaissances:
        - "Un objet naturel existe dans la nature sans que l’être humain l’ait fabriqué."
        - "Un objet technique est fabriqué ou transformé par l’être humain pour répondre à un besoin."
        - "Un besoin, c’est ce qui manque à quelqu’un ou ce qu’il veut pouvoir faire."
    competences:
        - "Classer un objet : naturel ou technique."
        - "Trouver le besoin auquel répond un objet technique."
        - "Expliquer un classement avec « car »."
pourquoi:
    - "Autour de toi, presque tout a été fabriqué : ta chaise, ton stylo, la lampe de la classe, le monte-charge que tu as découvert en séance 1."
    - "Cette année, tu vas étudier des objets techniques. Il faut d’abord savoir les reconnaître et comprendre pourquoi on les a fabriqués."
activites:
    - id: a01
      titre: "Naturel ou technique ?"
      contenu:
          - type: paragraphe
            texte: "Un objet naturel existe dans la nature : personne ne l’a fabriqué. Un objet technique a été fabriqué ou transformé par l’être humain."
          - type: titre
            texte: "Exemples expliqués"
          - type: paragraphe
            texte: "Exemple 1 : un galet. Personne ne l’a fabriqué : c’est l’eau de la rivière qui l’a usé et arrondi. C’est donc un objet naturel."
          - type: paragraphe
            texte: "Exemple 2 : une gourde. Une usine l’a fabriquée en plastique ou en métal pour transporter de l’eau. C’est donc un objet technique."
          - type: titre
            texte: "La question à se poser"
          - type: paragraphe
            texte: "Est-ce qu’un être humain l’a fabriqué ou transformé ? Si oui, c’est un objet technique. Si non, c’est un objet naturel."
      questions:
          - id: q01
            type: tableau
            enonce: "Pour chaque objet, écris « naturel » ou « technique »."
            colonnes:
                - Objet
                - Naturel ou technique ?
            lignes:
                - - "Une pomme sur un pommier"
                  - ""
                - - "Un crayon à papier"
                  - ""
                - - "Un coquillage sur la plage"
                  - ""
                - - "Un ballon de football"
                  - ""
            aide: "Pour chaque objet, pose-toi la question : un être humain l’a-t-il fabriqué ou transformé ?"
          - id: q02
            type: qcm
            enonce: "Le crayon à papier est en bois, et le bois vient d’un arbre. Pourquoi le crayon est-il quand même un objet technique ?"
            choix:
                - id: a
                  texte: "Parce que l’être humain a transformé le bois pour fabriquer le crayon."
                - id: b
                  texte: "Parce que le crayon est peint en jaune."
                - id: c
                  texte: "Parce que l’arbre est lui aussi un objet technique."
    - id: a02
      titre: "À quel besoin répond-il ?"
      transition: "Tu sais reconnaître un objet technique. Mais pourquoi l’être humain l’a-t-il fabriqué ? Pour répondre à un besoin. C’est ce que tu cherches maintenant."
      contenu:
          - type: paragraphe
            texte: "Un besoin, c’est ce qui manque à quelqu’un ou ce qu’il veut pouvoir faire. Par exemple : avoir chaud, voir clair, se déplacer, garder de l’eau."
          - type: paragraphe
            texte: "Exemple expliqué : les lunettes. Sans elles, certaines personnes voient flou. Les lunettes répondent donc au besoin de voir net."
          - type: paragraphe
            texte: "La question à se poser : sans cet objet, qu’est-ce que la personne aurait du mal à faire ?"
      questions:
          - id: q01
            type: tableau
            enonce: "Pour chaque objet technique, écris le besoin auquel il répond."
            colonnes:
                - Objet technique
                - Besoin auquel il répond
            lignes:
                - - "Le parapluie"
                  - ""
                - - "Le vélo"
                  - ""
                - - "Le réveil"
                  - ""
                - - "Le réfrigérateur"
                  - ""
            aide: "Commence chaque réponse par un verbe : rester…, se déplacer…, se réveiller…, garder…"
          - id: q02
            type: qcm
            enonce: "Repense au monte-charge présenté en séance 1. À quel besoin répond-il ?"
            choix:
                - id: a
                  texte: "Déplacer des objets lourds d’un étage à l’autre sans les porter."
                - id: b
                  texte: "Éclairer l’escalier du collège."
                - id: c
                  texte: "Permettre aux élèves de faire du sport."
    - id: a03
      titre: "Un objet naturel peut-il devenir technique ?"
      transition: "Tu as vu que l’être humain fabrique des objets pour répondre à ses besoins. Parfois, il part d’un objet naturel et il le transforme."
      contenu:
          - type: paragraphe
            texte: "Il y a très longtemps, à la Préhistoire, les humains ramassaient des pierres : c’étaient des objets naturels. Ils les tapaient avec une autre pierre pour leur donner un bord tranchant. La pierre devenait un outil pour couper : un des tout premiers objets techniques, appelé biface."
          - type: paragraphe
            texte: "Comparaison avec aujourd’hui : un couteau répond au même besoin (couper), mais il est fabriqué en métal dans une usine. Le besoin n’a pas changé ; c’est l’objet qui a évolué."
          - type: paragraphe
            texte: "Rappel du réflexe brevet n° 1 (séance 1) : repère le verbe de la question avant de répondre."
      questions:
          - id: q01
            type: qcm
            enonce: "Une branche tombée par terre est un objet naturel. Ton grand-père la taille pour en faire une canne de marche. Que devient-elle ?"
            choix:
                - id: technique
                  texte: "Un objet technique, car un être humain l’a transformée."
                - id: naturel
                  texte: "Toujours un objet naturel, car elle est en bois."
                - id: aucun
                  texte: "Ni l’un ni l’autre."
          - id: q02
            type: qcm
            enonce: "La question suivante commence par « Explique ». Que dois-tu écrire ?"
            choix:
                - id: a
                  texte: "Une raison, avec « car » ou « parce que »."
                - id: b
                  texte: "Seulement un nom, sans phrase."
                - id: c
                  texte: "Un calcul."
          - id: q03
            type: texte
            enonce: "Explique à quel besoin répond la canne de marche."
            aide: "Tu peux commencer par : « La canne répond au besoin de… car… »"
      ressources:
          - type: paragraphe
            texte: "Pour voir à quoi ressemblait un biface, regarde les images de cette page."
          - type: lien
            titre: "Vikidia — Biface"
            url: https://fr.vikidia.org/wiki/Biface
    - id: a04
      titre: "Le smartphone, combien de besoins ?"
      defi: true
      facultatif: true
      contenu:
          - type: paragraphe
            texte: "Un seul objet peut répondre à plusieurs besoins. Le smartphone en est un bon exemple."
      questions:
          - id: q01
            type: texte
            enonce: "Cite au moins quatre besoins auxquels répond un smartphone. Lequel est le plus important pour toi ? Explique pourquoi."
            aide: "Pense à tout ce que tu fais avec : parler, s’orienter, s’informer, se divertir…"
    - id: a05
      titre: "Conclusion de ton travail"
      conclusion: true
      transition: "Tu as appris à reconnaître un objet technique et à trouver son besoin. Il reste à répondre au problème de départ."
      questions:
          - id: q01
            type: texte
            enonce: "Réponds au problème du jour en 2 ou 3 phrases : comment reconnaître un objet fabriqué par l’être humain, et pourquoi l’a-t-il fabriqué ? Donne un exemple."
            aide: "Tu peux commencer par : « Un objet technique est… On le reconnaît car… Il a été fabriqué pour… Par exemple… »"
retenir:
    - "Un objet naturel existe sans l’intervention de l’être humain."
    - "Un objet technique est fabriqué ou transformé par l’être humain."
    - "Tout objet technique répond à un besoin : ce qui manque à quelqu’un ou ce qu’il veut pouvoir faire."
    - "Le besoin peut rester le même pendant des siècles, alors que l’objet évolue (biface, puis couteau)."
sources:
    - type: lien
      titre: "Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)"
      url: https://www.education.gouv.fr/media/160767/download
    - type: lien
      titre: "Vikidia — Biface"
      url: https://fr.vikidia.org/wiki/Biface
