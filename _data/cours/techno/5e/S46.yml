titre: Réaliser puis chercher un défaut
theme: Améliorer, réaliser et valider une solution numérique
problematique: Réaliser puis chercher un défaut
pourquoi: Modifier un programme ou document existant et conserver une preuve.
application: "Une méthode de dépannage étape par étape évite les modifications au hasard."
lien_precedent: "Après S45 — Comment préparer un prototype testable ?, nous poursuivons avec un seul objectif : modifier un programme ou document existant et conserver une preuve."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: paragraphe
            texte: Aujourd’hui, on réalise l’amélioration préparée en S45. Une erreur repérée et expliquée est une trace utile. On évite d’ajouter un nouvel objectif avant d’avoir testé le premier.
          - type: paragraphe
            texte: "Exemple guidé : si l’affichage reste bloqué, je refais le même test et je vérifie une chose à la fois : événement reçu, valeur de la variable, puis condition. Je corrige seulement après avoir repéré l’étape fautive."
      questions:
          - id: q01
            type: texte
            enonce: Quel élément as-tu effectivement modifié ?
            aide: Évite « j’ai amélioré le projet » sans détail.
          - id: q02
            type: texte
            enonce: Quel élément as-tu gardé identique pour comparer ?
            aide: Relis le protocole de S45.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - Effectuer la modification dans la copie du projet.
          - Exécuter le test prévu, puis provoquer un cas différent.
          - Conserver une trace de l’avant, de l’après et d’un défaut ou d’une limite repérés.
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: Décrire un essai avec action, résultat attendu, observation et décision après l’essai.
            aide: Un résultat inattendu doit être décrit avant d’être corrigé.
      ressources:
          - type: paragraphe
            texte: Dans la documentation, retrouver les blocs d’événement, variable et condition utilisés aujourd’hui.
          - type: lien
            titre: MakeCode micro:bit — Référence
            url: https://makecode.microbit.org/reference
          - type: lien
            titre: Ouvrir le simulateur MakeCode micro:bit
            url: https://makecode.microbit.org/
    - id: a03
      titre: 3. Explique avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Un premier essai réussit. Pourquoi faut-il encore rechercher un cas différent ?
            aide: Pense redémarrage, seuil ou information absente selon ton support.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Dépanner consiste à isoler une cause possible puis à vérifier l’effet d’une correction."
    - "Modifier un programme ou document existant et conserver une preuve."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Dépanner consiste à isoler une cause possible puis à vérifier l’effet d’une correction."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Modifier un programme ou document existant et conserver une preuve."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : Une méthode de dépannage étape par étape évite les modifications au hasard."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
