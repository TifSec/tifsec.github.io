titre: 'Séance 46 : Notre amélioration fonctionne-t-elle ?'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment prouver, par des tests sur le vrai tracker, que notre amélioration fonctionne ?
competences_bo:
    - Valider les solutions techniques par des simulations ou par des protocoles de tests
objectifs:
    connaissances:
        - Un protocole de test sur l’objet réel reprend les tests du simulateur avec de vraies conditions (lampe, ombre).
        - On conclut à partir de résultats notés, et on dit honnêtement ce qui ne marche pas encore.
    competences:
        - Tester une modification sur l’objet réel en suivant un protocole.
        - Noter et exploiter des résultats dans un tableur.
        - Conclure honnêtement.
pourquoi:
    - En séance 45, ton groupe a programmé et testé son amélioration dans le simulateur.
    - Aujourd’hui, chaque groupe envoie son programme sur le vrai tracker et le teste. Le professeur remet le programme d’origine à la fin.
activites:
    -   id: a01
        titre: Le protocole (poste maquette)
        consigne: Tu vas tester votre amélioration sur le vrai tracker, au poste maquette, avec le protocole du document 1. On attend les résultats de tes deux tests et une comparaison avec le simulateur.
        contenu:
            -   type: tableau
                titre: Document 1 — Protocole de test
                colonnes:
                    - Étape
                    - Ce qu’on fait
                lignes:
                    -   - '1'
                        - Le professeur envoie le programme du groupe sur la carte.
                    -   - '2'
                        - On refait les deux tests de la séance 45 avec une lampe de poche (jour) ou en cachant les capteurs (nuit).
                    -   - '3'
                        - On note les résultats observés.
                    -   - '4'
                        - Le professeur remet le programme d’origine.
            -   type: paragraphe
                texte: Les groupes qui attendent leur passage travaillent sur la mission 2.
            -   type: etapes
                elements:
                    - Suis le protocole du document 1. Seul le professeur téléverse le programme.
                    - Note les résultats de tes deux tests.
                    - Compare avec ce que montrait le simulateur.
            -   type: paragraphe
                texte: 'Pourquoi tester en vrai ? Le simulateur ne connaît ni les vraies lampes ni les vrais capteurs : seul l’objet réel prouve.'
        questions:
            -   id: q01
                type: tableau
                enonce: Écris les résultats de tes deux tests sur le vrai tracker.
                colonnes:
                    - Test
                    - Résultat attendu
                    - Résultat observé
                lignes:
                    -   - ''
                        - ''
                        - ''
                    -   - ''
                        - ''
                        - ''
                aide: Attendu ou observé ?
            -   id: q02
                type: texte
                enonce: Y a-t-il une différence entre le simulateur et le vrai tracker ? Si oui, propose une explication.
                aide: Ton idée répond-elle au besoin ?
    -   id: a02
        titre: Panneau fixe ou panneau qui suit ?
        transition: 'Ton amélioration est testée. Une question reste : le tracker est-il vraiment utile par rapport à un panneau fixe ?'
        consigne: Tu vas calculer dans Calc les moyennes des mesures du panneau fixe et du panneau qui suit (document 2). On attend les deux moyennes.
        contenu:
            -   type: paragraphe
                texte: 'Démonstration : on éclaire le panneau avec une lampe placée à cinq positions, et on mesure la tension du panneau (multimètre), tracker éteint (fixe) puis allumé (il suit).'
            -   type: tableau
                titre: Document 2 — Exemple de mesures (valeurs inventées)
                colonnes:
                    - Position de la lampe
                    - Panneau fixe (V)
                    - Panneau qui suit (V)
                lignes:
                    -   - 1 (gauche)
                        - '0,8'
                        - '2,0'
                    -   - '2'
                        - '1,4'
                        - '2,1'
                    -   - 3 (face)
                        - '2,1'
                        - '2,1'
                    -   - '4'
                        - '1,3'
                        - '2,0'
                    -   - 5 (droite)
                        - '0,7'
                        - '1,9'
            -   type: etapes
                elements:
                    - Dans Calc, recopie le tableau (enregistre sous 5e_S46_groupe.ods).
                    - Calcule la moyenne de chaque colonne avec =MOYENNE() (séance 27).
                    - Calcule l’écart entre les deux moyennes.
        questions:
            -   id: q01
                type: nombre
                enonce: Quelle est la moyenne du panneau fixe ?
                unite: V
                aide: N’oublie pas l’unité (réflexe n° 5).
            -   id: q02
                type: nombre
                enonce: Quelle est la moyenne du panneau qui suit ?
                unite: V
                aide: N’oublie pas l’unité (réflexe n° 5).
    -   id: a03
        titre: Conclure sur le tracker
        transition: Les moyennes sont calculées. Que prouvent-elles ?
        consigne: Tu vas conclure, avec les moyennes calculées dans Calc, sur l’utilité du tracker par rapport à un panneau fixe. On attend une conclusion justifiée par les valeurs et leur unité.
        contenu:
            -   type: etapes
                elements:
                    - Compare les deux moyennes.
                    - Calcule l’écart entre elles.
                    - Écris ta conclusion avec « car » et les valeurs en volts.
            -   type: paragraphe
                texte: 'Pourquoi les moyennes ? Elles résument les cinq positions de la lampe : on compare deux nombres au lieu de dix.'
        questions:
            -   id: q01
                type: texte
                enonce: D’après ces moyennes, le tracker est-il utile ? Justifie avec les valeurs et leur unité.
                aide: Pense à « car » (réflexe n° 4).
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le servomoteur consomme aussi de l’énergie.
        questions:
            -   id: q01
                type: texte
                enonce: Que faudrait-il mesurer de plus pour savoir si le tracker gagne vraiment de l’énergie au total ?
                aide: Quelle énergie entre, laquelle sort ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as testé sur l’objet réel et comparé. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment prouver que votre amélioration fonctionne ? Votre amélioration fonctionne-t-elle ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'On prouve une amélioration par des tests sur l’objet réel : attendu, observé, conclusion honnête.'
    - Une moyenne permet de comparer deux séries de mesures.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
