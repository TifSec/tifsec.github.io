titre: Une notice claire pour une cuve non potable
theme: Concevoir une cuve intelligente simulée
problematique: Une notice claire pour une cuve non potable
pourquoi: Communiquer une consigne et les limites d’un prototype.
application: "Une notice bien rédigée évite les mauvais usages et rappelle les limites d’un prototype."
lien_precedent: "Après S41 — Réparer la cuve plutôt que tout remplacer ?, nous poursuivons avec un seul objectif : communiquer une consigne et les limites d’un prototype."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: paragraphe
            texte: "Une notice d’une page doit permettre à quelqu’un d’autre de comprendre : l’usage non potable, le sens des états, la conduite à tenir face à une alerte et la limite du prototype numérique."
          - type: tableau
            colonnes:
                - État du modèle
                - Information utilisateur
            lignes:
                - - COLLECTE
                  - Conditions du scénario compatibles avec la collecte
                - - PLEIN
                  - Limite de niveau atteinte
                - - ISOLEMENT / À VÉRIFIER
                  - Intervention ou vérification requise
          - type: paragraphe
            texte: "Exemple guidé de notice : « Cette cuve contient une eau non potable. Ne pas boire. Vérifier le niveau avant l’entretien. » Une bonne notice nomme le danger et indique l’action à faire."
      questions:
          - id: q01
            type: texte
            enonce: Pourquoi « tout va bien » est-il moins précis que « conditions du scénario compatibles avec la collecte » ?
            aide: Une notice doit éviter les promesses non démontrées.
          - id: q02
            type: texte
            enonce: Quelle mention d’usage doit rester visible sur la notice ?
            aide: Le projet ne garantit pas la potabilité.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - "Rédiger une notice courte avec trois rubriques : utiliser, comprendre, réagir."
          - Ajouter un pictogramme avec une légende écrite, pas seulement une couleur.
          - Faire lire la notice à un camarade et corriger un passage mal compris.
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: Donner une phrase de ta notice, la difficulté signalée par le lecteur et ta correction.
            aide: Comparer les deux formulations.
      ressources:
          - type: paragraphe
            texte: Sur le portail public, chercher qualité de l’eau et usages ; relever une information qui distingue observation et contrôle.
          - type: lien
            titre: Eaufrance — Portail public de l’eau
            url: https://www.eaufrance.fr/
    - id: a03
      titre: 3. Explique avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Un utilisateur voit À VÉRIFIER. Pourquoi la notice doit-elle préciser une action plutôt que le laisser deviner ?
            aide: Relier l’information à une action adaptée.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Une notice donne une action claire et signale les limites d’utilisation."
    - "Communiquer une consigne et les limites d’un prototype."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Une notice donne une action claire et signale les limites d’utilisation."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Communiquer une consigne et les limites d’un prototype."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : Une notice bien rédigée évite les mauvais usages et rappelle les limites d’un prototype."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
