titre: 'Séance 42 : Writer n° 2 : écrire une notice de dépannage'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Comment écrire une notice claire pour qu’une autre personne puisse dépanner le monte-charge ?
competences_bo:
    - Identifier un dysfonctionnement d’un objet technique et y remédier
objectifs:
    connaissances:
        - Une notice utilise des étapes numérotées, des titres et des images avec légendes.
        - 'Dans Writer : liste numérotée, styles Titre 1 et Titre 2, tableau, en-tête.'
    competences:
        - Créer une liste numérotée et des titres avec des styles.
        - Insérer un tableau.
        - Rédiger des consignes claires, une action par étape.
pourquoi:
    - En séance 11, tu as fait ta première fiche avec Writer. En séance 41, tu as suivi un protocole de dépannage.
    - Aujourd’hui, tu rédiges la notice de dépannage du monte-charge pour une autre classe. Ton fichier reste sur l’ordinateur ; sur le site, tu réponds sur ta méthode.
activites:
    -   id: a01
        titre: Organiser la notice
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Writer et enregistre sous 5e_S42_tonprenom.odt (rappel de la séance 11).
                    - Écris le titre « Dépanner le monte-charge » en style Titre 1.
                    - 'Crée deux parties en style Titre 2 : « Avant de commencer » et « Les vérifications ».'
                    - Dans « Avant de commencer », écris deux règles de sécurité.
            -   type: paragraphe
                texte: Le style Titre 2 sert aux sous-parties. Writer pourra plus tard en faire un sommaire automatique.
        questions:
            -   id: q01
                type: qcm
                enonce: Quel style donner à « Les vérifications » ?
                choix:
                    -   id: a
                        texte: Titre 2 (sous-partie).
                    -   id: b
                        texte: Titre 1 (titre principal).
                    -   id: c
                        texte: 'Aucun : on grossit le texte à la main.'
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: texte
                enonce: Écris les deux règles de sécurité de ta partie « Avant de commencer ».
                aide: Combien d’éléments sont demandés ?
    -   id: a02
        titre: Les étapes numérotées
        transition: Ta notice a une structure. Remplis-la maintenant avec des étapes numérotées.
        contenu:
            -   type: etapes
                elements:
                    - Sous « Les vérifications », écris les quatre vérifications du protocole de la séance 41, une par ligne.
                    - Sélectionne-les et clique sur « Liste numérotée ».
                    - Vérifie que chaque étape contient une seule action.
            -   type: paragraphe
                texte: 'Exemple : « 1. Allume la maquette et regarde si les voyants deviennent orange. » est clair. « 1. Vérifie tout » ne l’est pas : on ne sait pas quoi faire.'
        questions:
            -   id: q01
                type: texte
                enonce: Recopie ton étape 2 telle que tu l’as écrite dans la notice.
                aide: Repère le verbe de la question.
            -   id: q02
                type: qcm
                enonce: Pourquoi utiliser une liste numérotée plutôt qu’une liste à puces ?
                choix:
                    -   id: a
                        texte: Parce que l’ordre des étapes compte.
                    -   id: b
                        texte: Parce que c’est plus coloré.
                    -   id: c
                        texte: Parce que Writer l’impose.
                aide: Relis l’exemple expliqué.
    -   id: a03
        titre: Le tableau des pannes
        transition: Les étapes sont prêtes. Un tableau permet en plus de retrouver vite une panne à partir de son symptôme.
        contenu:
            -   type: etapes
                elements:
                    - Sous la liste, insère un tableau de 3 colonnes et 4 lignes (Tableau > Insérer un tableau).
                    - 'Titres des colonnes : Symptôme, Pièce à vérifier, Que faire.'
                    - Remplis trois lignes à partir des séances 40 et 41.
                    - Enregistre (Ctrl + S).
        questions:
            -   id: q01
                type: tableau
                enonce: Recopie deux lignes de ton tableau.
                colonnes:
                    - Symptôme
                    - Pièce à vérifier
                    - Que faire
                lignes:
                    -   - ''
                        - ''
                        - ''
                    -   - ''
                        - ''
                        - ''
                aide: Ligne × colonne.
            -   id: q02
                type: texte
                enonce: À quoi sert ce tableau pour la personne qui dépanne ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: 'Writer peut créer une table des matières : Insertion > Table des matières et index.'
        questions:
            -   id: q01
                type: texte
                enonce: Insère une table des matières. Quels titres apparaissent, et pourquoi ?
                aide: Pense à « car » (réflexe n° 4).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ta notice est terminée et enregistrée. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment écrire une notice claire pour qu’une autre personne puisse dépanner le monte-charge ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Une notice : titres (styles), consignes de sécurité, étapes numérotées (une action chacune), tableau symptôme / pièce / action.'
    - Liste numérotée quand l’ordre compte ; liste à puces sinon.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
