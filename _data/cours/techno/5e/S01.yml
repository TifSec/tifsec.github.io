titre: 'Séance 1 : Comment va-t-on travailler en technologie cette année ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment va-t-on travailler en technologie cette année, et sur quels objets ?
competences_bo:
    - Décrire les interactions entre un objet ou un système technique, son environnement et les utilisateurs
objectifs:
    connaissances:
        - En technologie, on cherche à comprendre comment et pourquoi les objets fonctionnent.
        - 'Cette année, on étudiera quatre projets : le monte-charge, l’éolienne, le tracker solaire et la cuve d’eau.'
        - Au laboratoire, des règles protègent les personnes et le matériel.
    competences:
        - Répondre sur le site avec les quatre types de réponses.
        - Choisir la bonne réaction face à une situation dangereuse au laboratoire.
        - Repérer le verbe d’une question pour savoir quoi écrire.
pourquoi:
    - Cette année, tu vas observer des objets, les tester, chercher leurs pannes et même les programmer.
    - 'Avant de commencer, il te faut trois choses : savoir répondre sur le site, connaître les règles du laboratoire et découvrir les maquettes de l’année. C’est le programme d’aujourd’hui.'
activites:
    -   id: a01
        titre: Prends en main ton site de cours
        consigne: 'Tu vas découvrir comment fonctionne ton site de cours : les missions, les types de réponses, les coups de pouce et la note. On attend la bonne réaction quand tu bloques et le nombre de points d’une séance.'
        contenu:
            -   type: paragraphe
                texte: Chaque séance est découpée en missions. Dans une mission, tu lis d’abord l’encadré « Ta mission » (ce que tu fais et ce qu’on attend), puis les documents et les étapes, et tu réponds aux questions juste en dessous.
            -   type: paragraphe
                texte: 'Tu vas rencontrer quatre types de réponses :'
            -   type: liste
                elements:
                    - 'Un choix dans une liste : tu cliques et tu choisis une seule réponse.'
                    - 'Un nombre : tu écris seulement le nombre. L’unité est indiquée sous la case.'
                    - 'Un tableau : tu remplis chaque case vide.'
                    - 'Un texte : tu écris une ou plusieurs phrases.'
            -   type: paragraphe
                texte: Sous certaines questions, « Un coup de pouce » donne une aide. L’utiliser ne fait jamais perdre de points.
            -   type: paragraphe
                texte: 'Chaque séance est notée sur 20 points. Le petit défi est facultatif : il ne compte pas dans la note. Mais s’il est réussi, il te rapporte 5 XP, plus qu’une question normale : tu débloques plus vite les thèmes du shop.'
            -   type: paragraphe
                texte: Tes réponses sont enregistrées au fur et à mesure. À la fin, tu cliques sur « J’ai terminé — remettre ma copie ».
            -   type: etapes
                elements:
                    - Lis les repères ci-dessus, un paragraphe à la fois.
                    - Repère ce que tu fais quand tu bloques.
                    - Repère sur combien de points une séance est notée.
            -   type: paragraphe
                texte: 'Pourquoi commencer par le site ? Tu vas t’en servir toute l’année : bien le connaître évite de perdre du temps et des points.'
        questions:
            -   id: q01
                type: qcm
                enonce: Tu bloques sur une question. Que fais-tu en premier ?
                choix:
                    -   id: a
                        texte: J’ouvre « Un coup de pouce » sous la question.
                    -   id: b
                        texte: Je ferme la page et j’attends la fin du cours.
                    -   id: c
                        texte: Je recopie la réponse de mon voisin.
                aide: 'Méthode : 1) lis toutes les réponses avant de choisir ; 2) élimine celles qui sont impossibles ; 3) vérifie ton choix avec le document ou l’exemple expliqué de la mission.'
            -   id: q02
                type: nombre
                enonce: Sur combien de points chaque séance est-elle notée ?
                unite: points
                aide: Relis l’avant-dernier paragraphe des repères ci-dessus.
    -   id: a02
        titre: Les règles du laboratoire
        transition: Tu sais répondre sur le site. Maintenant, tu vas apprendre les règles qui protègent tout le monde au laboratoire de technologie, car tu vas manipuler de vraies maquettes.
        consigne: Tu vas apprendre les règles du laboratoire de technologie et les appliquer à des situations, comme dans l’exemple expliqué. On attend ce que tu fais dans chaque situation et la raison d’une règle.
        contenu:
            -   type: liste
                elements:
                    - Je touche une maquette seulement quand le professeur me l’autorise.
                    - 'Je ne branche et je ne débranche rien sur une prise électrique : c’est le rôle du professeur.'
                    - Je garde mes mains et mes affaires loin des pièces qui tournent (pales, poulies, engrenages).
                    - Je préviens tout de suite le professeur si je vois un objet cassé, un fil abîmé ou si je sens une odeur de brûlé.
                    - Je ne mange pas et je ne bois pas près des ordinateurs et des maquettes.
                    - Je range mon poste avant de partir.
            -   type: titre
                texte: Exemple expliqué
            -   type: paragraphe
                texte: 'Situation : une pale de l’éolienne est fendue. Quelle règle s’applique ? C’est la quatrième : « Je préviens tout de suite le professeur si je vois un objet cassé ». Donc je ne mets pas l’éolienne en marche et j’appelle le professeur. Pourquoi ? Une pale fendue peut se casser en tournant et blesser quelqu’un.'
            -   type: etapes
                elements:
                    - Lis les règles du laboratoire.
                    - 'Lis l’exemple expliqué : la pale fendue.'
                    - Pour chaque situation, cherche la règle qui s’applique et écris ce que tu fais.
            -   type: paragraphe
                texte: 'Pourquoi des règles ? Les maquettes sont fragiles et certaines sont branchées sur le 230 V : les règles protègent les élèves et le matériel.'
        questions:
            -   id: q01
                type: tableau
                enonce: 'Fais comme dans l’exemple : pour chaque situation, écris ce que tu fais.'
                colonnes:
                    - Situation
                    - Ce que je fais
                lignes:
                    -   - Le ventilateur de l’éolienne tourne et ton stylo tombe juste à côté des pales.
                        - ''
                    -   - Tu vois un fil électrique abîmé sur une maquette.
                        - ''
                    -   - Ton voisin veut brancher une maquette sur la prise du mur.
                        - ''
                    -   - La sonnerie annonce la fin de la séance.
                        - ''
                aide: Pour chaque ligne, cherche dans la liste la règle qui correspond, puis écris l’action à faire.
            -   id: q02
                type: qcm
                enonce: Pourquoi seul le professeur branche-t-il les maquettes sur la prise du mur ?
                choix:
                    -   id: a
                        texte: Parce que la prise du mur donne une électricité dangereuse (230 volts).
                    -   id: b
                        texte: Parce que les maquettes sont trop lourdes.
                    -   id: c
                        texte: Parce que les élèves ne savent pas où se trouve la prise.
                aide: 'Méthode : 1) lis toutes les réponses avant de choisir ; 2) élimine celles qui sont impossibles ; 3) vérifie ton choix avec le document ou l’exemple expliqué de la mission.'
    -   id: a03
        titre: Les maquettes de l’année
        transition: Tu connais les règles. Tu peux maintenant découvrir les maquettes sur lesquelles tu vas travailler cette année. Le professeur va te les montrer.
        consigne: Tu vas découvrir les quatre projets de l’année (monte-charge, éolienne, tracker solaire, cuve d’eau) avec le tableau ci-dessus. On attend la bonne maquette pour trois descriptions et ton choix expliqué.
        ressources:
            -   type: paragraphe
                texte: Tu veux voir des photos du monte-charge ? Regarde la présentation du projet sur cette page.
            -   type: lien
                titre: 'Éduscol — Édubase : le projet de monte-charge'
                url: https://edubase.eduscol.education.fr/fiche/24732
        contenu:
            -   type: paragraphe
                texte: 'Chaque maquette répond à un besoin réel. Le collège n’en possède qu’un exemplaire : tu la verras en démonstration, puis ton groupe passera la manipuler à tour de rôle pendant certaines séances.'
            -   type: tableau
                colonnes:
                    - Maquette
                    - Ce qu’elle fait
                    - Quand on l’étudie
                lignes:
                    -   - Le monte-charge
                        - Une petite cabine monte et descend pour transporter un objet d’un étage à l’autre.
                        - Aux 2e et 3e trimestres
                    -   - L’éolienne
                        - Un ventilateur souffle sur des pales. En tournant, elles font produire de l’électricité à un petit moteur.
                        - Au 2e trimestre
                    -   - Le tracker solaire
                        - Un petit panneau solaire tourne tout seul vers la lumière.
                        - Au 3e trimestre
                    -   - La cuve d’eau intelligente
                        - 'Un projet de cuve qui récupère l’eau de pluie et surveille son niveau. Elle n’est pas encore construite : on l’étudiera sur des documents.'
                        - Au 1er trimestre et en fin d’année
            -   type: etapes
                elements:
                    - Lis le tableau des maquettes.
                    - Pour chaque question, cherche la ligne qui correspond.
                    - Choisis la maquette qui t’intéresse et explique pourquoi en une phrase.
            -   type: paragraphe
                texte: 'Pourquoi les présenter dès maintenant ? Tu les retrouveras toute l’année : savoir à quoi elles servent aide à comprendre chaque séance.'
        questions:
            -   id: q01
                type: qcm
                enonce: Quelle maquette produit de l’électricité grâce au vent ?
                choix:
                    -   id: montecharge
                        texte: Le monte-charge.
                    -   id: eolienne
                        texte: L’éolienne.
                    -   id: tracker
                        texte: Le tracker solaire.
                    -   id: cuve
                        texte: La cuve d’eau intelligente.
                aide: 'Méthode : 1) lis toutes les réponses avant de choisir ; 2) élimine celles qui sont impossibles ; 3) vérifie ton choix avec le document ou l’exemple expliqué de la mission.'
            -   id: q02
                type: qcm
                enonce: Quelle maquette transporte un objet d’un étage à l’autre ?
                choix:
                    -   id: montecharge
                        texte: Le monte-charge.
                    -   id: eolienne
                        texte: L’éolienne.
                    -   id: tracker
                        texte: Le tracker solaire.
                    -   id: cuve
                        texte: La cuve d’eau intelligente.
                aide: 'Méthode : 1) lis toutes les réponses avant de choisir ; 2) élimine celles qui sont impossibles ; 3) vérifie ton choix avec le document ou l’exemple expliqué de la mission.'
            -   id: q03
                type: qcm
                enonce: Quel projet n’est pas encore construit et sera étudié sur des documents ?
                choix:
                    -   id: montecharge
                        texte: Le monte-charge.
                    -   id: eolienne
                        texte: L’éolienne.
                    -   id: tracker
                        texte: Le tracker solaire.
                    -   id: cuve
                        texte: La cuve d’eau intelligente.
                aide: 'Méthode : 1) lis toutes les réponses avant de choisir ; 2) élimine celles qui sont impossibles ; 3) vérifie ton choix avec le document ou l’exemple expliqué de la mission.'
            -   id: q04
                type: texte
                enonce: Quelle maquette as-tu le plus envie d’étudier ? Explique pourquoi en une phrase.
                aide: 'Tu peux commencer par : « J’ai envie d’étudier… parce que… »'
    -   id: a04
        titre: 'Réflexe brevet n° 1 : repérer le verbe de la question'
        transition: 'Tu vas répondre à beaucoup de questions cette année, puis au brevet en fin de 3e. Un premier réflexe t’aide à savoir quoi écrire : repérer le verbe de la question.'
        consigne: 'Tu vas apprendre le premier réflexe du brevet : repérer le verbe de la question avant de répondre. On attend le bon type de réponse pour « Cite » et pour « Explique ».'
        contenu:
            -   type: paragraphe
                texte: Le brevet (on dit aussi le DNB) est l’examen de fin de 3e. On prépare dès maintenant quelques réflexes simples, un à la fois.
            -   type: tableau
                colonnes:
                    - Verbe
                    - Ce que je dois faire
                    - Exemple de réponse
                lignes:
                    -   - Cite
                        - Donner un ou plusieurs noms, sans expliquer.
                        - « Cite deux maquettes. » → « Le monte-charge et l’éolienne. »
                    -   - Décris
                        - Dire comment est quelque chose ou ce qu’il fait, avec des détails.
                        - « Décris le tracker. » → « C’est un petit panneau solaire qui tourne tout seul vers la lumière. »
                    -   - Explique
                        - Dire pourquoi, avec « car » ou « parce que ».
                        - « Explique pourquoi on garde les mains loin des pales. » → « Car elles tournent vite et peuvent blesser les doigts. »
                    -   - Calcule
                        - Faire une opération et écrire le résultat avec son unité.
                        - « Calcule la masse de deux caisses de 8 kg. » → « 8 + 8 = 16 kg. »
            -   type: etapes
                elements:
                    - Je lis toute la question.
                    - Je repère le verbe.
                    - Je réponds exactement à ce que le verbe demande.
            -   type: paragraphe
                texte: 'Pourquoi le verbe ? « Cite » demande une liste courte, « Explique » demande une raison : se tromper de verbe fait perdre des points.'
        questions:
            -   id: q01
                type: qcm
                enonce: 'La question est : « Cite deux règles du laboratoire. » Que dois-tu écrire ?'
                choix:
                    -   id: a
                        texte: Deux règles, sans les expliquer.
                    -   id: b
                        texte: Deux règles, chacune avec une longue explication.
                    -   id: c
                        texte: Un calcul avec une unité.
                aide: 'Méthode : 1) lis toutes les réponses avant de choisir ; 2) élimine celles qui sont impossibles ; 3) vérifie ton choix avec le document ou l’exemple expliqué de la mission.'
            -   id: q02
                type: texte
                enonce: Cite deux règles du laboratoire.
                aide: Relis la liste de la mission 2.
            -   id: q03
                type: texte
                enonce: Explique pourquoi on ne mange pas et on ne boit pas près des ordinateurs.
                aide: 'Le verbe est « Explique » : ta phrase doit contenir « car » ou « parce que ». Pense à ce qui arrive si une boisson se renverse sur un clavier.'
    -   id: a05
        titre: Invente une maquette
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le laboratoire peut accueillir une cinquième maquette. C’est toi qui l’imagines.
        questions:
            -   id: q01
                type: texte
                enonce: 'Décris ta maquette : à quoi servirait-elle, et pour qui ?'
                aide: Pense à un problème de la vie de tous les jours au collège ou chez toi.
    -   id: a06
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as découvert le site, les règles du laboratoire, les maquettes et un premier réflexe pour le brevet. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour en 2 ou 3 phrases : comment va-t-on travailler en technologie cette année, et sur quels objets ?'
                aide: 'Tu peux commencer par : « En technologie, on va… On répond sur… On étudiera… »'
retenir:
    - 'Si je bloque, j’ouvre « Un coup de pouce » : cela ne fait pas perdre de points.'
    - 'Je ne branche rien sur une prise : c’est le rôle du professeur.'
    - 'Cette année : le monte-charge, l’éolienne, le tracker solaire et la cuve d’eau.'
    - 'Réflexe brevet n° 1 : je repère le verbe de la question avant de répondre.'
