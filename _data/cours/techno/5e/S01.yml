titre: Comment allons-nous travailler en Technologie cette année ?
theme: Technologie — Comment allons-nous travailler en Technologie cette année ?
problematique: Comment allons-nous travailler en Technologie cette année ?
pourquoi: Cette année, nous allons observer, démonter, comparer, mesurer, expérimenter, réparer, programmer et surtout essayer de comprendre comment et pourquoi les objets et les systèmes qui nous entourent fonctionnent.
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances: []
    competences: []
activites:
    - id: a02
      titre: 1. Une année pour apprendre à réfléchir
      contenu:
          - type: paragraphe
            texte: Pendant les cours, vous rencontrerez régulièrement des problèmes pour lesquels la solution ne sera pas donnée immédiatement.
          - type: paragraphe
            texte: "Vous devrez :"
          - type: liste
            elements:
                - observer ;
                - vous poser des questions ;
                - proposer des idées ;
                - essayer ;
                - vous tromper parfois ;
                - comprendre pourquoi cela ne fonctionne pas ;
                - modifier votre idée ;
                - essayer à nouveau ;
                - expliquer finalement ce que vous avez compris.
          - type: paragraphe
            texte: Il n'est donc pas nécessaire de trouver la bonne solution immédiatement.
          - type: paragraphe
            texte: Une réponse qui ne fonctionne pas peut être très utile si elle vous permet de comprendre quelque chose et d'imaginer une nouvelle solution.
          - type: paragraphe
            texte: Je préfère un élève qui cherche, se trompe, réfléchit et recommence plutôt qu'un élève qui attend simplement qu'on lui donne la réponse.
      questions: []
    - id: a03
      titre: 2. Peut-on donner une mauvaise réponse ?
      contenu:
          - type: paragraphe
            texte: Lorsque vous réfléchissez à un problème, vous avez le droit de proposer une idée dont vous n'êtes pas certain.
          - type: paragraphe
            texte: "Le plus important est de pouvoir expliquer :"
          - type: liste
            elements:
                - ce que vous avez pensé ;
                - pourquoi vous avez essayé cette solution ;
                - ce que vous avez observé ;
                - et ce que vous pourriez changer si elle ne fonctionne pas.
          - type: paragraphe
            texte: Une proposition peut être incomplète, mal formulée ou finalement ne pas fonctionner. Ce n'est pas grave si elle permet de poursuivre la réflexion.
          - type: paragraphe
            texte: En revanche, une réponse copiée sans être comprise ne montre pas votre raisonnement.
          - type: paragraphe
            texte: "Dans ce cours, ce n'est donc pas seulement la réponse finale qui compte : le chemin utilisé pour y arriver est important."
      questions: []
    - id: a04
      titre: 3. Le rôle du professeur
      contenu:
          - type: paragraphe
            texte: Le professeur sera présent pour vous guider, mais il ne donnera pas directement les solutions aux problèmes proposés.
          - type: paragraphe
            texte: "Il pourra :"
          - type: liste
            elements:
                - reformuler une consigne ;
                - vous poser une nouvelle question ;
                - vous aider à observer un élément que vous n'aviez pas remarqué ;
                - vous rappeler une information déjà présente dans le cours ;
                - vous aider à découper un problème trop compliqué en plusieurs problèmes plus simples.
          - type: paragraphe
            texte: Mais si la réponse peut être trouvée grâce aux informations du cours, aux documents fournis, à vos observations ou à votre réflexion, le professeur ne vous donnera pas directement cette réponse.
          - type: paragraphe
            texte: "Il pourra par exemple répondre à une question par une autre question :"
          - type: paragraphe
            texte: « Qu'est-ce que tu as déjà essayé ? » « Qu'est-ce que tu observes ? » « Qu'est-ce qui pourrait expliquer ce résultat ? » « Peux-tu découper ton problème en plusieurs parties ? »
      questions: []
    - id: a05
      titre: 4. Que faire lorsque je suis bloqué ?
      contenu:
          - type: paragraphe
            texte: Être bloqué fait partie du travail.
          - type: paragraphe
            texte: "Avant de demander directement de l'aide au professeur, essayez cette méthode :"
          - type: paragraphe
            texte: Relire la question ou la consigne.
          - type: paragraphe
            texte: Observer les documents, l'objet ou le programme.
          - type: paragraphe
            texte: Discuter doucement avec votre binôme.
      questions:
          - id: q01
            type: texte
            enonce: Proposer une première hypothèse, même si vous n'êtes pas certain.
            suite:
                - type: paragraphe
                  texte: Essayer ou vérifier cette hypothèse lorsque c'est possible.
                - type: paragraphe
                  texte: Si vous êtes toujours bloqués, appeler le professeur en expliquant ce que vous avez déjà essayé.
                - type: paragraphe
                  texte: Dire simplement « Je ne sais pas » n'aide pas beaucoup.
                - type: paragraphe
                  texte: Dire « Nous avons essayé ceci, nous avons obtenu cela et nous ne comprenons pas pourquoi » permet au contraire de continuer à avancer.
    - id: a06
      titre: 5. Travailler ensemble, mais dans le calme
      contenu:
          - type: paragraphe
            texte: La plupart du temps, vous travaillerez par groupes de deux.
          - type: paragraphe
            texte: "Vous avez le droit de parler avec votre binôme pour :"
          - type: liste
            elements:
                - comparer vos idées ;
                - vous poser des questions ;
                - expliquer votre raisonnement ;
                - vous mettre d'accord sur une solution à essayer.
          - type: paragraphe
            texte: Ces échanges doivent cependant rester suffisamment calmes pour que tous les groupes puissent réfléchir.
          - type: paragraphe
            texte: On peut discuter, mais on chuchote.
          - type: paragraphe
            texte: Si toute la classe parle fort, il devient difficile de réfléchir, de se concentrer et d'écouter son propre binôme.
          - type: paragraphe
            texte: "Le calme n'empêche donc pas le travail en groupe : il permet au contraire à chacun de travailler correctement."
      questions: []
    - id: a07
      titre: 6. Comment serez-vous évalués ?
      contenu:
          - type: paragraphe
            texte: Il n'y aura pas de contrôle ponctuel destiné à vérifier en une heure tout ce que vous avez mémorisé.
          - type: paragraphe
            texte: Votre travail sera évalué régulièrement tout au long de l'année, principalement à partir de ce que vous produirez et rendrez pendant les séances.
          - type: paragraphe
            texte: "Le professeur regardera notamment :"
          - type: liste
            elements:
                - si le travail demandé a été réalisé ;
                - si vous avez réellement cherché des solutions ;
                - si vous avez essayé de justifier vos réponses ;
                - si vous savez revenir sur une réponse lorsque vous découvrez qu'elle ne fonctionne pas ;
                - si votre travail progresse au cours de la séance ;
                - si vous êtes capables de travailler de plus en plus par vous-mêmes ;
                - si le document rendu permet de comprendre votre démarche et ce que vous avez appris.
          - type: paragraphe
            texte: Une erreur ne vous pénalise donc pas simplement parce qu'elle existe.
          - type: paragraphe
            texte: Ce qui compte particulièrement est ce que vous en faites ensuite.
          - type: paragraphe
            texte: La note doit montrer votre travail, votre progression, votre autonomie et votre détermination, pas seulement votre capacité à trouver immédiatement une bonne réponse.
      questions: []
    - id: a08
      titre: 7. Votre travail à chaque séance
      contenu:
          - type: paragraphe
            texte: Au cours de nombreuses séances, vous réaliserez un document numérique par binôme.
          - type: paragraphe
            texte: "Les fichiers seront nommés de la manière suivante :"
          - type: paragraphe
            texte: 5e_S[numéro de séance]_nom1_nom2
          - type: paragraphe
            texte: "Par exemple :"
          - type: paragraphe
            texte: 5e_S3_dupont_martin.odt
          - type: paragraphe
            texte: "Ce document permettra de conserver :"
          - type: liste
            elements:
                - vos hypothèses ;
                - vos réponses ;
                - vos tableaux ou schémas ;
                - vos observations ;
                - vos essais ;
                - vos conclusions.
          - type: paragraphe
            texte: Il sera enregistré puis déposé dans l'espace d'échange demandé par le professeur.
          - type: paragraphe
            texte: "Important : votre document n'a pas besoin d'être parfait dès le début. Il doit montrer votre travail et évoluer pendant la séance."
      questions: []
    - id: a09
      titre: "8. Premier défi : faire tenir une feuille debout"
      contenu:
          - type: paragraphe
            texte: Pour découvrir immédiatement la manière dont nous allons travailler cette année, voici votre premier problème.
          - type: paragraphe
            texte: Chaque binôme dispose d'une simple feuille de papier A4.
          - type: paragraphe
            texte: "Défi : faire tenir la feuille debout sur la table pendant au moins 10 secondes sans la maintenir avec les mains."
          - type: paragraphe
            texte: "Vous pouvez :"
          - type: liste
            elements:
                - plier la feuille ;
                - la courber ;
                - essayer plusieurs formes.
          - type: paragraphe
            texte: "Vous ne pouvez pas :"
          - type: liste
            elements:
                - utiliser de colle ou de ruban adhésif ;
                - utiliser un autre objet pour la maintenir ;
                - demander directement au professeur comment faire.
          - type: paragraphe
            texte: Vous disposez de quelques minutes pour chercher une solution.
      questions: []
    - id: a10
      titre: 9. Ce qui compte dans le défi
      contenu:
          - type: paragraphe
            texte: La première solution que vous essayez ne fonctionnera peut-être pas.
          - type: paragraphe
            texte: "Dans ce cas :"
          - type: paragraphe
            texte: observez → cherchez pourquoi → modifiez quelque chose → testez à nouveau.
          - type: paragraphe
            texte: Si votre feuille tient debout, essayez de comprendre pourquoi.
          - type: paragraphe
            texte: Regardez ensuite discrètement autour de vous.
      questions:
          - id: q01
            type: texte
            enonce: "Q1 : Tous les groupes ont-ils utilisé exactement la même solution ?"
          - id: q02
            type: texte
            enonce: "Q2 : Plusieurs solutions différentes peuvent-elles fonctionner ?"
          - id: q03
            type: texte
            enonce: "Q3 : Votre première idée a-t-elle fonctionné immédiatement ? Si non, qu'avez-vous changé ?"
          - id: q04
            type: texte
            enonce: "Q4 : Qu'est-ce qui vous a aidés à trouver une solution : une observation, votre binôme, un essai précédent, une autre idée ?"
    - id: a11
      titre: 10. Ce petit défi ressemble beaucoup au cours de Technologie
      contenu:
          - type: paragraphe
            texte: Le professeur ne vous a pas montré comment plier la feuille.
          - type: paragraphe
            texte: "Il vous a donné :"
          - type: liste
            elements:
                - un problème ;
                - des contraintes ;
                - du matériel ;
                - du temps pour réfléchir.
          - type: paragraphe
            texte: "Vous avez ensuite dû :"
          - type: paragraphe
            texte: comprendre → imaginer → essayer → observer → modifier → tester.
          - type: paragraphe
            texte: Cette démarche sera utilisée très souvent pendant l'année.
          - type: paragraphe
            texte: Il n'existait pas forcément une seule manière correcte de faire tenir la feuille. Plusieurs solutions pouvaient répondre au même problème.
          - type: paragraphe
            texte: Dans les prochaines séances, nous appliquerons progressivement la même manière de réfléchir à des objets techniques, des expériences, des réparations puis des programmes informatiques.
      questions: []
    - id: a12
      titre: 11. Les règles essentielles du cours
      contenu:
          - type: paragraphe
            texte: "Pour que cette manière de travailler fonctionne, retenez quelques règles simples :"
          - type: liste
            elements:
                - Je cherche avant de demander la réponse.
                - J'ai le droit de me tromper.
                - Lorsque je me trompe, j'essaie de comprendre pourquoi.
                - J'écoute les idées de mon binôme.
                - Je peux discuter, mais je parle doucement.
                - Je respecte le matériel et les consignes de sécurité.
                - Je garde une trace de mon travail.
                - Je rends le travail demandé à la fin de la séance.
          - type: paragraphe
            texte: En Technologie, je vais apprendre à chercher des solutions et pas seulement à mémoriser des réponses. J'ai le droit de proposer une idée, de l'essayer et de me tromper. Une erreur peut m'aider à comprendre le problème et à trouver une meilleure solution. Le professeur est là pour me guider, mais il ne donnera pas directement une réponse que je peux trouver par ma réflexion, mes observations ou les documents disponibles. Je peux travailler et échanger avec mon binôme, mais je dois le faire dans le calme pour permettre à toute la classe de réfléchir.
          - type: paragraphe
            texte: "Méthode : Face à un problème : je lis → j'observe → je réfléchis → je propose → j'essaie → je teste → je corrige → j'explique."
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
introduction:
    - type: titre
      texte: "Objectif : Découvrir le fonctionnement du cours de Technologie, les méthodes de travail et la manière dont votre travail sera évalué tout au long de l'année"
    - type: paragraphe
      texte: Bienvenue en Technologie !
    - type: paragraphe
      texte: Cette année, nous allons observer, démonter, comparer, mesurer, expérimenter, réparer, programmer et surtout essayer de comprendre comment et pourquoi les objets et les systèmes qui nous entourent fonctionnent.
    - type: paragraphe
      texte: "Mais avant de commencer, il faut comprendre une chose importante :"
    - type: paragraphe
      texte: En Technologie, le professeur ne vous demandera pas seulement de connaître des réponses. Il vous demandera surtout d'apprendre à les chercher.
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
