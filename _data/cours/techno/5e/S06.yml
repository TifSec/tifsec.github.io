titre: 'Séance 6 : Que change un réglage ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Pourquoi les objets ont-ils des réglages, et comment vérifier l’effet d’un réglage ?
competences_bo:
    - Décrire les interactions entre un objet ou un système technique, son environnement et les utilisateurs
objectifs:
    connaissances:
        - 'Un réglage (on dit aussi un paramètre) permet d’adapter le fonctionnement d’un objet au besoin de l’utilisateur : heure, volume, luminosité, durée…'
        - 'Pour connaître l’effet d’un réglage, on fait un test : on change le réglage, puis on observe ce qui change.'
    competences:
        - Repérer les réglages d’un objet.
        - Prévoir l’effet d’un changement de réglage, puis le vérifier.
        - Mettre en service un objet en suivant une notice.
pourquoi:
    - En séance 5, tu as testé la facilité d’utilisation d’un minuteur.
    - 'Beaucoup d’objets se règlent : un réveil, un four, un téléphone… Comprendre les réglages, c’est aussi ce que tu feras plus tard avec les programmes des maquettes, quand tu changeras un nombre pour modifier leur comportement.'
activites:
    -   id: a01
        titre: Les réglages d’un réveil
        contenu:
            -   type: paragraphe
                texte: 'Un réveil a plusieurs réglages : l’heure actuelle, l’heure d’alarme, le volume de la sonnerie, la durée de la répétition (« snooze »).'
            -   type: tableau
                titre: Exemple expliqué
                colonnes:
                    - Réglage
                    - Ce qu’il change
                    - Pourquoi l’utilisateur le règle
                lignes:
                    -   - L’heure d’alarme
                        - Le moment où le réveil sonne.
                        - Se réveiller à l’heure dont il a besoin.
            -   type: paragraphe
                texte: 'Chaque réglage existe parce que tous les utilisateurs n’ont pas le même besoin : certains se lèvent à 6 h, d’autres à 7 h 30.'
        questions:
            -   id: q01
                type: tableau
                enonce: Complète comme dans l’exemple.
                colonnes:
                    - Réglage
                    - Ce qu’il change
                    - Pourquoi l’utilisateur le règle
                lignes:
                    -   - Le volume de la sonnerie
                        - ''
                        - ''
                    -   - La durée de répétition
                        - ''
                        - ''
                aide: 'Pense à deux personnes différentes : une qui a le sommeil léger, une qui a le sommeil lourd.'
    -   id: a02
        titre: Prévoir, tester, conclure
        transition: 'Tu sais à quoi servent les réglages. Maintenant, tu vas vérifier l’effet d’un réglage avec une méthode de scientifique : prévoir, tester, conclure.'
        contenu:
            -   type: paragraphe
                texte: 'Pour savoir ce que fait un réglage, on suit trois étapes : 1. Je prévois ce qui va se passer. 2. Je change seulement ce réglage et j’observe. 3. Je compare avec ma prévision.'
            -   type: paragraphe
                texte: 'Exemple expliqué : sur un téléphone, je baisse la luminosité de l’écran. Je prévois : « L’écran sera plus sombre et la batterie durera plus longtemps. » J’observe : l’écran est plus sombre. Je conclus : ma prévision sur l’écran est vérifiée ; pour la batterie, il faudrait un test plus long.'
            -   type: paragraphe
                texte: 'Le professeur fait la démonstration avec le minuteur de la séance 5 : il change la sonnerie de fin, puis la durée.'
        questions:
            -   id: q01
                type: texte
                enonce: 'Avant la démonstration, écris ta prévision : que va-t-il se passer si on règle le minuteur sur 10 secondes au lieu de 3 minutes ?'
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
            -   id: q02
                type: qcm
                enonce: Pendant un test, pourquoi faut-il changer un seul réglage à la fois ?
                choix:
                    -   id: a
                        texte: Pour savoir quel réglage a provoqué le changement observé.
                    -   id: b
                        texte: Pour aller plus vite.
                    -   id: c
                        texte: Parce que l’objet ne peut changer qu’un réglage par jour.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q03
                type: texte
                enonce: 'Après la démonstration : ta prévision était-elle juste ? Explique avec ce que tu as observé.'
                aide: Action → résultat attendu → résultat observé ; une seule chose à la fois.
    -   id: a03
        titre: Mettre en service avec une notice
        transition: 'Tu sais tester un réglage. Avant de régler un objet neuf, il faut le mettre en service : la notice te guide.'
        contenu:
            -   type: paragraphe
                texte: Mettre en service, c’est préparer un objet pour qu’il fonctionne la première fois. La notice donne les étapes dans l’ordre.
            -   type: citation
                texte: Notice simplifiée d’un réveil (document inventé pour l’exercice) — 1. Retirer la languette sous les piles. 2. Régler l’heure actuelle avec les boutons H et M. 3. Régler l’heure d’alarme en maintenant le bouton AL. 4. Placer l’interrupteur sur ON.
        questions:
            -   id: q01
                type: qcm
                enonce: D’après la notice, que faut-il faire en premier ?
                choix:
                    -   id: a
                        texte: Retirer la languette sous les piles.
                    -   id: b
                        texte: Régler l’heure d’alarme.
                    -   id: c
                        texte: Placer l’interrupteur sur ON.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Pourquoi faut-il retirer la languette avant de régler l’heure ? Réponds avec « car ».
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Le réglage caché
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: 'Certains objets se règlent tout seuls : la luminosité automatique d’un téléphone, le chauffage d’une maison…'
        questions:
            -   id: q01
                type: texte
                enonce: Choisis un objet qui se règle tout seul. Qu’est-ce qu’il mesure pour décider de son réglage ?
                aide: Action → résultat attendu → résultat observé ; une seule chose à la fois.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as étudié les réglages, testé leur effet et mis en service un objet. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : pourquoi les objets ont-ils des réglages, et comment vérifier l’effet d’un réglage ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Un réglage (un paramètre) adapte le fonctionnement d’un objet au besoin de l’utilisateur.
    - 'Pour vérifier l’effet d’un réglage : je prévois, je change un seul réglage, j’observe, je compare.'
    - Mettre en service, c’est préparer l’objet à fonctionner en suivant la notice dans l’ordre.
