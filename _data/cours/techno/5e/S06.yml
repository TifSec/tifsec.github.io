titre: Comment prouver qu'une situation est différente d'une autre ?
theme: "Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser"
problematique: Comment utiliser des mesures pour comparer objectivement deux situations ?
pourquoi: "Une mesure peut varier légèrement à cause de différents facteurs :"
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Comprendre qu'une impression ou une opinion ne suffit pas pour réaliser une comparaison objective.
        - Comprendre l'intérêt d'une grandeur mesurable.
        - Découvrir la notion de protocole expérimental.
        - Comprendre pourquoi certaines conditions doivent rester identiques pendant une comparaison.
        - Comprendre l'intérêt de réaliser plusieurs mesures.
        - Comprendre que les résultats obtenus constituent des données que l'on peut organiser et analyser.
    competences: []
activites:
    - id: a04
      titre: 1. Peut-on toujours faire confiance à notre impression ?
      contenu:
          - type: paragraphe
            texte: "Observez les deux images suivantes :"
          - type: tableau
            colonnes:
                - "Document : Lampe A"
                - "Document : Lampe B"
            lignes: []
          - type: image
            url: https://tifsec.github.io/techno/5/images/Lampe_A.png
            alternative: Lampe A
          - type: image
            url: https://tifsec.github.io/techno/5/images/Lampe_B.png
            alternative: Lampe B
      questions:
          - id: q01
            type: texte
            enonce: "Q1 : Sans rechercher d'information supplémentaire, laquelle de ces deux lampes vous semble capable d'éclairer le plus ?"
          - id: q02
            type: texte
            enonce: "Q2 : Sur quels indices vous êtes-vous appuyés pour répondre ?"
            suite:
                - type: paragraphe
                  texte: Comparez votre réponse avec celle des autres groupes.
          - id: q03
            type: texte
            enonce: "Q3 : Tous les groupes ont-ils nécessairement fait le même choix ?"
          - id: q04
            type: texte
            enonce: "Q4 : Cette observation suffit-elle pour prouver qu'une lampe éclaire réellement davantage que l'autre ? Expliquez."
    - id: a05
      titre: 2. Comment passer d'une impression à une mesure ?
      contenu:
          - type: paragraphe
            texte: Lors de la séance précédente, nous avons comparé plusieurs vélos à l'aide de critères et de données.
          - type: paragraphe
            texte: "Certaines caractéristiques peuvent être exprimées par des valeurs mesurées :"
          - type: liste
            elements:
                - une masse ;
                - une distance ;
                - une durée ;
                - une température ;
                - une vitesse ;
                - un niveau de lumière.
      questions:
          - id: q01
            type: texte
            enonce: "Q5 : Que pourrions-nous utiliser pour savoir si une zone reçoit plus de lumière qu'une autre sans nous fier uniquement à nos yeux ?"
          - id: q02
            type: texte
            enonce: "Q6 : Pourquoi une valeur mesurée peut-elle être plus utile qu'une phrase comme « je trouve qu'il fait plus clair » ?"
    - id: a06
      titre: 3. Utiliser le micro:bit comme instrument de mesure
      contenu:
          - type: paragraphe
            texte: Le BBC micro:bit peut utiliser les LED de son écran pour détecter le niveau de lumière qu'il reçoit.
          - type: paragraphe
            texte: "micro:bit Educational Foundation – Capteurs du BBC micro:bit : Documentation officielle des capteurs"
          - type: lien
            titre: Documentation officielle des capteurs
            url: https://microbit.org/fr/get-started/features/sensors/
          - type: paragraphe
            texte: "Microsoft MakeCode – Light Level : Documentation officielle de la mesure du niveau de lumière"
          - type: lien
            titre: Documentation officielle de la mesure du niveau de lumière
            url: https://makecode.microbit.org/reference/input/light-level
          - type: paragraphe
            texte: "micro:bit Educational Foundation – Capteur de lumière du soleil : Exemple officiel d'utilisation du micro:bit comme capteur de lumière"
          - type: lien
            titre: Exemple officiel d'utilisation du micro:bit comme capteur de lumière
            url: https://microbit.org/fr/projects/make-it-code-it/sunlight-sensor/
          - type: paragraphe
            texte: "Le programme utilisé aujourd'hui affiche une valeur comprise entre :"
          - type: liste
            elements:
                - "0 : niveau de lumière très faible ;"
                - "255 : niveau de lumière très élevé."
          - type: paragraphe
            texte: "Attention : cette valeur représente un niveau de luminosité mesuré par le micro:bit. Elle n'est pas exprimée en lux."
          - type: paragraphe
            texte: "Nous n'allons pas modifier le programme aujourd'hui : le micro:bit sera uniquement utilisé comme instrument de mesure."
      questions:
          - id: q01
            type: texte
            enonce: "Q7 : Quelle donnée allons-nous relever pendant l'expérience ?"
    - id: a07
      titre: 4. Peut-on mesurer n'importe comment ?
      contenu:
          - type: paragraphe
            texte: Imaginons que deux groupes cherchent à comparer deux situations d'éclairement.
          - type: paragraphe
            texte: "Voici quelques méthodes possibles :"
          - type: liste
            elements:
                - déplacer le micro:bit entre les deux mesures ;
                - réaliser une mesure près d'une fenêtre et l'autre au fond de la salle ;
                - orienter différemment le micro:bit ;
                - réaliser trois mesures dans une situation et seulement une dans l'autre ;
                - changer plusieurs éléments en même temps.
      questions:
          - id: q01
            type: texte
            enonce: "Q8 : Ces méthodes permettraient-elles de savoir précisément ce qui provoque une différence entre les résultats ? Pourquoi ?"
          - id: q02
            type: texte
            enonce: "Q9 : Quels éléments faudrait-il essayer de garder identiques pendant la comparaison ?"
    - id: a08
      titre: 5. Construire une comparaison fiable
      contenu:
          - type: paragraphe
            texte: Pour comparer correctement deux situations, il faut essayer de ne modifier volontairement qu'un seul paramètre à la fois.
          - type: paragraphe
            texte: "Dans notre expérience :"
          - type: liste
            elements:
                - le micro:bit restera au même endroit ;
                - son orientation restera identique ;
                - nous utiliserons le même programme ;
                - nous réaliserons le même nombre de mesures ;
                - nous chercherons uniquement à modifier la quantité de lumière atteignant le micro:bit.
      questions:
          - id: q01
            type: texte
            enonce: "Q10 : Pourquoi est-il important de ne pas modifier plusieurs paramètres en même temps ?"
    - id: a09
      titre: 6. Découvrir le protocole expérimental
      contenu:
          - type: paragraphe
            texte: Une suite précise d'étapes permettant de réaliser une expérience dans des conditions définies est appelée un protocole expérimental.
          - type: paragraphe
            texte: Un protocole permet à plusieurs personnes de réaliser une expérience de manière comparable et d'obtenir des résultats que l'on peut analyser.
          - type: paragraphe
            texte: "Pour cette activité, nous allons comparer deux situations :"
          - type: liste
            elements:
                - "Situation A : micro:bit posé sur la table dans les conditions normales d'éclairage de la salle ;"
                - "Situation B : même installation, mais avec une main placée quelques centimètres au-dessus afin de réduire partiellement la lumière reçue."
          - type: paragraphe
            texte: "Hypothèse avant l'expérience :"
      questions:
          - id: q01
            type: texte
            enonce: "Q11 : Dans quelle situation pensez-vous que le micro:bit affichera la valeur la plus élevée ? Pourquoi ?"
            suite:
                - type: paragraphe
                  texte: "Respectez ensuite précisément le protocole suivant :"
                - type: etapes
                  elements:
                      - Posez le micro:bit à plat sur la table, toujours au même endroit.
                      - Ne déplacez plus la carte pendant toute l'expérience.
                      - Laissez fonctionner le programme quelques secondes.
                      - Attendez que la valeur soit suffisamment stable pour pouvoir la relever.
                      - Notez une première mesure de la situation A.
                      - Recommencez deux fois dans les mêmes conditions afin d'obtenir trois mesures.
                      - Placez ensuite votre main quelques centimètres au-dessus du micro:bit, sans le toucher et sans masquer complètement toute la lumière.
                      - Essayez de garder la main dans la même position.
                      - Attendez quelques secondes puis relevez une première mesure de la situation B.
                      - Recommencez deux fois afin d'obtenir à nouveau trois mesures.
                - type: paragraphe
                  texte: "Important : ne déplacez pas le micro:bit entre les deux séries. Essayez également de conserver les mêmes conditions d'éclairage général dans la salle."
          - id: q02
            type: texte
            enonce: "Q12 : Quel est le seul paramètre que nous cherchons volontairement à modifier entre les situations A et B ?"
    - id: a10
      titre: 7. Réaliser et organiser les mesures
      contenu:
          - type: paragraphe
            texte: "Complétez dans votre document Writer :"
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Situation testée
                - Mesure 1
                - Mesure 2
                - Mesure 3
                - Moyenne
            lignes:
                - - A — micro:bit posé sur la table
                  - ""
                  - ""
                  - ""
                  - ""
                - - B — main placée au-dessus
                  - ""
                  - ""
                  - ""
                  - ""
          - id: q02
            type: texte
            enonce: "Q13 : Les trois valeurs d'une même série sont-elles exactement identiques ?"
          - id: q03
            type: texte
            enonce: "Q14 : Si elles sont légèrement différentes, cela signifie-t-il forcément que l'expérience est mauvaise ? Expliquez."
    - id: a11
      titre: 8. Pourquoi réaliser plusieurs mesures ?
      contenu:
          - type: paragraphe
            texte: "Une mesure peut varier légèrement à cause de différents facteurs :"
          - type: liste
            elements:
                - petite variation de la lumière ambiante ;
                - position légèrement différente de la main ;
                - mouvement autour du capteur ;
                - variation de la valeur mesurée au moment où elle est lue.
          - type: paragraphe
            texte: Réaliser plusieurs mesures permet de ne pas baser toute la conclusion sur une seule valeur.
          - type: paragraphe
            texte: Nous allons calculer la moyenne des trois mesures de chaque série.
          - type: paragraphe
            texte: "Pour trois mesures :"
          - type: paragraphe
            texte: Moyenne = (mesure 1 + mesure 2 + mesure 3) ÷ 3
      questions:
          - id: q01
            type: texte
            enonce: "Q15 : Calculez la moyenne de la situation A."
          - id: q02
            type: texte
            enonce: "Q16 : Calculez la moyenne de la situation B."
            suite:
                - type: paragraphe
                  texte: Vous pouvez arrondir le résultat à l'unité si nécessaire.
    - id: a12
      titre: 9. Des mesures aux données
      contenu:
          - type: paragraphe
            texte: Les valeurs obtenues pendant l'expérience constituent des données.
          - type: paragraphe
            texte: "Ces données peuvent être :"
          - type: liste
            elements:
                - enregistrées ;
                - classées ;
                - traitées ;
                - comparées ;
                - utilisées pour construire une conclusion.
      questions:
          - id: q01
            type: texte
            enonce: "Q17 : Quelle situation obtient la moyenne la plus élevée ?"
          - id: q02
            type: texte
            enonce: "Q18 : Cette observation correspond-elle à votre hypothèse de la question 11 ?"
          - id: q03
            type: texte
            enonce: "Q19 : Si votre hypothèse était différente du résultat obtenu, devez-vous modifier les résultats ou modifier votre conclusion ? Expliquez."
    - id: a13
      titre: 10. Qu'est-ce qu'une comparaison objective ?
      contenu:
          - type: paragraphe
            texte: Une comparaison devient plus objective lorsqu'elle s'appuie sur une méthode clairement définie et sur des données plutôt que sur une simple impression.
          - type: paragraphe
            texte: "Dans cette activité, nous avons utilisé :"
          - type: liste
            elements:
                - "une grandeur observable : le niveau de lumière détecté ;"
                - "un instrument de mesure : le micro:bit ;"
                - un protocole fourni ;
                - plusieurs mesures ;
                - un tableau de données ;
                - un calcul simple ;
                - une comparaison des résultats.
      questions:
          - id: q01
            type: texte
            enonce: "Q20 : Parmi ces éléments, lesquels manqueraient si nous nous étions simplement contentés de regarder la salle et de dire « il fait plus sombre » ?"
    - id: a14
      titre: "11. Petit défi : quelle méthode est la plus fiable ?"
      contenu:
          - type: paragraphe
            texte: Trois groupes veulent comparer deux situations d'éclairement.
          - type: tableau
            colonnes:
                - Groupe
                - Méthode utilisée
            lignes:
                - - Groupe A
                  - Les élèves regardent simplement les deux situations et choisissent celle qui leur paraît la plus lumineuse.
                - - Groupe B
                  - Ils réalisent une mesure dans chaque situation, mais déplacent le micro:bit entre les deux mesures.
                - - Groupe C
                  - Ils conservent le micro:bit au même endroit, réalisent trois mesures dans chaque situation puis comparent les moyennes.
      questions:
          - id: q01
            type: texte
            enonce: "Q21 : Quel groupe utilise la méthode qui permet la comparaison la plus fiable parmi les trois ?"
          - id: q02
            type: texte
            enonce: "Q22 : Expliquez précisément pourquoi."
          - id: q03
            type: texte
            enonce: "Q23 : Identifiez au moins une faiblesse dans la méthode du groupe A et une dans celle du groupe B."
    - id: a15
      titre: 12. Conclusion du travail
      contenu:
          - type: paragraphe
            texte: "Sans retourner lire les parties précédentes, complétez :"
          - type: liste
            elements:
                - Pour comparer objectivement deux situations, il est utile d'utiliser une grandeur que l'on peut ................................................ .
                - Une suite précise d'étapes permettant de réaliser une expérience est appelée un ................................................ expérimental.
                - Les valeurs obtenues pendant une expérience constituent des ................................................ .
                - Réaliser plusieurs mesures puis calculer une ................................................ permet de résumer plusieurs valeurs.
          - type: paragraphe
            texte: "Dernière question :"
          - type: paragraphe
            texte: "Un élève affirme :"
          - type: paragraphe
            texte: "« Je n'ai pas besoin de mesurer : je vois bien qu'il y a moins de lumière sous ma main. »"
          - type: paragraphe
            texte: Expliquez en deux ou trois phrases pourquoi l'observation reste utile mais ne remplace pas une comparaison réalisée avec un protocole et des mesures.
          - type: paragraphe
            texte: Enregistrez votre travail puis déposez-le dans l'espace d'échange.
      questions: []
    - id: a16
      titre: Sources et ressources
      contenu:
          - type: liste
            elements:
                - "Ministère de l'Éducation nationale – Programme de technologie du cycle 4 : Programme officiel de technologie"
          - type: lien
            titre: Programme officiel de technologie
            url: https://www.education.gouv.fr/sites/default/files/document/Annexe%20%E2%80%94%20Programme%20de%20technologie%20du%20cycle%204-368016.pdf
          - type: paragraphe
            texte: "Le micro:bit utilise les LED de son écran pour détecter le niveau de lumière. MakeCode fournit une valeur comprise entre 0 et 255 : il s'agit d'un niveau de luminosité utilisé par le micro:bit et non d'une mesure en lux. Le protocole de cette séance a été simplifié pour permettre aux élèves de 5e de travailler sur la comparaison de mesures dans des conditions contrôlées."
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
introduction:
    - type: titre
      texte: "Compétence visée : Mesurer et comparer une caractéristique à partir d'un protocole fourni et exploiter les données obtenues"
    - type: paragraphe
      texte: "Objectifs d’apprentissage :"
    - type: liste
      elements:
          - Comprendre qu'une impression ou une opinion ne suffit pas pour réaliser une comparaison objective.
          - Comprendre l'intérêt d'une grandeur mesurable.
          - Découvrir la notion de protocole expérimental.
          - Comprendre pourquoi certaines conditions doivent rester identiques pendant une comparaison.
          - Comprendre l'intérêt de réaliser plusieurs mesures.
          - Comprendre que les résultats obtenus constituent des données que l'on peut organiser et analyser.
    - type: liste
      elements:
          - Suivre précisément un protocole fourni.
          - Utiliser un micro:bit comme instrument de mesure.
          - Effectuer plusieurs mesures dans des conditions définies.
          - Organiser les résultats dans un tableau.
          - Calculer une moyenne simple.
          - Comparer deux séries de résultats.
          - Rédiger une conclusion à partir de données mesurées.
    - type: liste
      elements:
          - Un document LibreOffice Writer nommé 5e_S6_nom1_nom2.odt.
          - Les noms et prénoms des élèves du groupe.
          - Le titre de la séance.
          - Les réponses aux différentes questions.
          - Un tableau contenant les six mesures réalisées.
          - Le calcul des deux valeurs moyennes.
          - Une conclusion basée sur les résultats obtenus.
    - type: paragraphe
      texte: Le document devra être enregistré puis déposé dans l'espace d'échange à la fin de la séance, même s'il n'est pas entièrement terminé.
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
