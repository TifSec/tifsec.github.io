titre: 'Séance 25 : Quelle énergie entre, quelle énergie sort ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Sous quelle forme est l’énergie à l’entrée et à la sortie de chaque constituant de l’éolienne ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - 'Formes d’énergie : électrique, cinétique (énergie du mouvement), thermique (chaleur), lumineuse, potentielle (énergie de position en hauteur).'
        - 'Un constituant convertit souvent une forme d’énergie en une autre : le moteur convertit l’énergie électrique en énergie cinétique, la génératrice fait l’inverse.'
    competences:
        - Nommer la forme d’énergie à l’entrée et à la sortie d’un constituant.
        - Repérer une perte d’énergie sous forme de chaleur.
pourquoi:
    - En séance 24, tu as construit la chaîne d’énergie de notre éolienne.
    - 'Aujourd’hui, tu regardes ce qui change à chaque bloc : l’énergie ne disparaît pas, elle change de forme.'
activites:
    -   id: a01
        titre: Les formes d’énergie
        consigne: Tu vas découvrir les formes d’énergie avec l’exemple de la lampe. On attend la forme d’énergie principale à la sortie de chaque objet.
        contenu:
            -   type: tableau
                colonnes:
                    - Forme d’énergie
                    - Exemple
                lignes:
                    -   - Électrique
                        - Le courant dans un fil
                    -   - Cinétique
                        - 'Un objet en mouvement : vent, pales qui tournent, vélo qui roule'
                    -   - Thermique
                        - La chaleur d’un radiateur
                    -   - Lumineuse
                        - La lumière d’une lampe
                    -   - Potentielle
                        - Un objet placé en hauteur (la cabine du monte-charge en haut)
            -   type: paragraphe
                texte: 'Exemple expliqué : une lampe reçoit de l’énergie électrique et produit surtout de l’énergie lumineuse, mais aussi un peu d’énergie thermique (elle chauffe).'
            -   type: etapes
                elements:
                    - Lis le tableau des formes d’énergie.
                    - 'Lis l’exemple de la lampe : électrique à l’entrée, lumineuse à la sortie.'
                    - Pour chaque objet, demande-toi ce qu’il produit surtout.
            -   type: paragraphe
                texte: Pourquoi « principale » ? Un objet produit souvent plusieurs énergies ; on garde celle pour laquelle il a été conçu.
        questions:
            -   id: q01
                type: tableau
                enonce: Écris la forme d’énergie principale à la sortie de chaque objet.
                colonnes:
                    - Objet
                    - Énergie reçue
                    - Énergie principale produite
                lignes:
                    -   - Radiateur électrique
                        - Électrique
                        - ''
                    -   - Ventilateur
                        - Électrique
                        - ''
                    -   - LED
                        - Électrique
                        - ''
                aide: Source → constituant qui transforme → forme d’énergie en sortie.
    -   id: a02
        titre: Les énergies dans notre éolienne
        transition: Tu connais les formes d’énergie. Applique-les à chaque bloc de la chaîne d’énergie de l’éolienne.
        consigne: Tu vas trouver l’énergie qui entre et l’énergie qui sort de chaque constituant de notre éolienne. On attend un tableau complet et une comparaison entre ventilateur et génératrice.
        contenu:
            -   type: paragraphe
                texte: 'Rappel de la séance 24 : prise → alimentation ATX → ventilateur → rotor → génératrice. Applique la même méthode à chaque bloc : qu’est-ce qui entre ? qu’est-ce qui sort ?'
            -   type: etapes
                elements:
                    - Reprends la chaîne de la séance 24.
                    - 'Pour chaque constituant, demande-toi : qu’est-ce qui entre ? qu’est-ce qui sort ?'
                    - Compare le ventilateur et la génératrice.
            -   type: paragraphe
                texte: Pourquoi comparer ? Le ventilateur et la génératrice font la même conversion, mais dans les deux sens.
        questions:
            -   id: q01
                type: tableau
                enonce: Complète la forme d’énergie à l’entrée et à la sortie de chaque constituant de notre éolienne.
                colonnes:
                    - Constituant
                    - Énergie en entrée
                    - Énergie en sortie
                lignes:
                    -   - Ventilateur
                        - Électrique
                        - ''
                    -   - Rotor (pales)
                        - ''
                        - Cinétique (rotation)
                    -   - Moteur de CD (génératrice)
                        - ''
                        - ''
                aide: Quelle énergie entre, laquelle sort ?
            -   id: q02
                type: qcm
                enonce: Le ventilateur et la génératrice font-ils la même conversion ?
                choix:
                    -   id: a
                        texte: 'Non : le ventilateur convertit l’électrique en cinétique, la génératrice le cinétique en électrique.'
                    -   id: b
                        texte: Oui, exactement la même.
                    -   id: c
                        texte: Non, la génératrice produit de la chaleur.
                aide: Relis l’exemple expliqué.
    -   id: a03
        titre: Où part l’énergie perdue ?
        transition: 'Chaque bloc convertit l’énergie, mais pas parfaitement : une partie part ailleurs.'
        consigne: Tu vas chercher où part l’énergie perdue dans l’éolienne, puis faire une hypothèse sur le monte-charge. On attend la forme de l’énergie perdue et une hypothèse.
        contenu:
            -   type: paragraphe
                texte: En fonctionnant, l’alimentation ATX et le moteur du ventilateur chauffent un peu. Le professeur peut te faire approcher la main (sans toucher) de l’alimentation après quelques minutes.
            -   type: etapes
                elements:
                    - Approche la main de l’alimentation (sans toucher) si le professeur le propose.
                    - Note ce que tu ressens.
                    - Pour le monte-charge, pense à un objet en hauteur.
            -   type: paragraphe
                texte: 'Pourquoi parler de perte ? Cette chaleur n’est pas utile : elle ne fait pas tourner l’éolienne.'
        questions:
            -   id: q01
                type: texte
                enonce: Sous quelle forme une partie de l’énergie est-elle perdue dans la chaîne ? Explique pourquoi on parle de « perte ».
                aide: Quelle énergie entre, laquelle sort ?
            -   id: q02
                type: texte
                enonce: Où serait l’énergie potentielle dans le monte-charge que nous étudierons bientôt ? Fais une hypothèse.
                aide: Quelle énergie entre, laquelle sort ?
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une éolienne de jardin alimente une lampe LED la nuit grâce à une batterie.
        questions:
            -   id: q01
                type: texte
                enonce: Écris les conversions d’énergie, du vent jusqu’à la lumière.
                aide: Quelle énergie entre, laquelle sort ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as nommé les énergies et repéré les pertes. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : sous quelle forme est l’énergie à l’entrée et à la sortie des constituants de l’éolienne ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Formes d’énergie : électrique, cinétique, thermique, lumineuse, potentielle.'
    - Un constituant convertit une forme d’énergie en une autre.
    - Une partie de l’énergie est perdue, souvent en chaleur.
sources:
