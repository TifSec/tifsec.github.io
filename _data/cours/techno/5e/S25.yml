titre: "PIX : retrouver mon parcours et ma méthode"
theme: Rechercher, conserver et partager une information
problematique: "PIX : retrouver mon parcours et ma méthode"
pourquoi: Suivre un parcours numérique et identifier une aide utile.
application: "Savoir utiliser un parcours numérique et ses aides rend plus autonome face à un nouvel outil."
lien_precedent: "Après S24 — Choisir et justifier : dossier énergie, nous poursuivons avec un seul objectif : suivre un parcours numérique et identifier une aide utile."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: paragraphe
            texte: "Pix sert à apprendre et à suivre des compétences numériques. Utilise le parcours donné par ton professeur dans l’ENT ou avec son code. Si le parcours de rentrée est déjà terminé, le professeur choisit un parcours thématique : ne recrée pas de compte."
          - type: paragraphe
            texte: Les réponses à Pix sont personnelles. Ici, on note seulement une méthode apprise, jamais un mot de passe, un code secret ou les réponses du parcours.
          - type: paragraphe
            texte: "Exemple guidé : j’ouvre le parcours Pix donné par le professeur, je lis l’aide après une erreur et je note la méthode comprise. Je ne partage jamais mon mot de passe ni la réponse exacte d’un exercice."
      questions:
          - id: q01
            type: texte
            enonce: Pourquoi faut-il garder son compte Pix existant ?
            aide: Un nouveau compte ne reprend pas automatiquement l’ancien suivi.
          - id: q02
            type: texte
            enonce: Quelle information ne dois-tu jamais écrire dans les réponses de ce cours ?
            aide: Distingue une méthode de travail et un secret.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - Ouvrir Pix par l’accès de l’établissement.
          - Travailler individuellement environ vingt-cinq minutes sur le parcours attribué.
          - Lire une explication après une difficulté et noter une méthode réutilisable.
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: Décrire une méthode découverte dans une explication Pix, puis une situation où la réutiliser.
            aide: Décris les gestes, sans recopier une question ni sa réponse.
      ressources:
          - type: paragraphe
            texte: Lire comment accéder aux parcours avec son établissement et conserver son compte.
          - type: lien
            titre: Pix — Espace élève
            url: https://pix.fr/eleve/
    - id: a03
      titre: 3. Explique avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Un camarade propose de donner ses identifiants à un autre pour finir plus vite. Expliquer ce qui pose problème.
            aide: Pense à la sécurité et au sens du suivi.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Les aides numériques permettent d’apprendre sans partager ses identifiants."
    - "Suivre un parcours numérique et identifier une aide utile."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Les aides numériques permettent d’apprendre sans partager ses identifiants."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Suivre un parcours numérique et identifier une aide utile."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : Savoir utiliser un parcours numérique et ses aides rend plus autonome face à un nouvel outil."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
