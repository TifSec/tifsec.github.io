titre: 'Séance 29 : Bilan et entraînement au brevet n° 3 : le vélo à assistance électrique'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Suis-je capable de compléter une chaîne d’énergie et d’exploiter des mesures dans un dossier ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - Au brevet, on demande souvent de compléter un schéma bloc et d’exploiter un tableau de mesures.
    competences:
        - Utiliser les réflexes brevet n° 1 à 8.
        - Compléter une chaîne d’énergie et nommer les formes d’énergie.
pourquoi:
    - Tu as étudié la chaîne d’énergie de l’éolienne, les formes d’énergie et les mesures.
    - Aujourd’hui, tu réutilises tout cela sur un nouvel objet, le vélo à assistance électrique, dans un dossier de type brevet (adapté à la 5e, pas un sujet officiel).
activites:
    -   id: a01
        titre: Le dossier
        consigne: 'Tu vas t’entraîner au brevet sur un dossier : le vélo à assistance électrique (documents 1 et 2). On attend la chaîne d’énergie du moteur, ses énergies et la forme de stockage dans la batterie.'
        contenu:
            -   type: titre
                texte: Document 1 — Le vélo à assistance électrique
            -   type: citation
                texte: Le vélo à assistance électrique aide le cycliste à pédaler. Une batterie, rechargée sur une prise, alimente un moteur électrique placé dans la roue arrière. Le moteur fait tourner la roue et ajoute sa force à celle du cycliste. Quand le cycliste arrête de pédaler, le moteur s’arrête. La batterie stocke l’énergie sous forme chimique.
            -   type: citation
                texte: 'Réflexe brevet n° 7 : je complète un schéma bloc dans l’ordre du chemin de l’énergie.'
            -   type: etapes
                elements:
                    - Lis le réflexe n° 7.
                    - Lis le document 1 et suis le chemin de l’énergie, de la prise à la roue.
                    - Écris les constituants dans l’ordre, puis les énergies du moteur.
            -   type: paragraphe
                texte: 'Pourquoi suivre le chemin ? Le schéma bloc se remplit dans l’ordre où l’énergie passe : c’est la méthode la plus sûre.'
        questions:
            -   id: q01
                type: tableau
                enonce: Complète la chaîne d’énergie du moteur électrique, de la prise jusqu’à la roue (document 1).
                colonnes:
                    - Ordre
                    - Constituant
                lignes:
                    -   - '1'
                        - Prise
                    -   - '2'
                        - ''
                    -   - '3'
                        - ''
                    -   - '4'
                        - Roue arrière
                aide: Quelle énergie entre, laquelle sort ?
            -   id: q02
                type: tableau
                enonce: Écris la forme d’énergie en entrée et en sortie du moteur.
                colonnes:
                    - Constituant
                    - Énergie en entrée
                    - Énergie en sortie
                lignes:
                    -   - Moteur
                        - ''
                        - ''
                aide: Quelle énergie entre, laquelle sort ?
            -   id: q03
                type: qcm
                enonce: D’après le document 1, sous quelle forme la batterie stocke-t-elle l’énergie ?
                choix:
                    -   id: a
                        texte: Chimique.
                    -   id: b
                        texte: Lumineuse.
                    -   id: c
                        texte: Thermique.
                aide: Relis l’exemple expliqué.
    -   id: a02
        titre: Exploiter des mesures
        transition: Tu as décrit la chaîne d’énergie. Le brevet demande aussi d’exploiter des mesures.
        consigne: Tu vas exploiter les mesures d’autonomie du document 2. On attend une différence en km et une explication de la baisse d’autonomie.
        contenu:
            -   type: tableau
                titre: Document 2 — Autonomie d’un vélo selon le niveau d’assistance (valeurs inventées)
                colonnes:
                    - Niveau d’assistance
                    - Autonomie mesurée
                lignes:
                    -   - Faible
                        - 90 km
                    -   - Moyen
                        - 60 km
                    -   - Fort
                        - 35 km
            -   type: paragraphe
                texte: Rappel des réflexes n° 4, 5 et 8.
            -   type: etapes
                elements:
                    - Lis le document 2.
                    - Calcule la différence entre l’assistance faible et forte.
                    - Explique avec « car » pourquoi l’autonomie baisse.
            -   type: paragraphe
                texte: 'Pourquoi l’autonomie baisse-t-elle ? Plus d’assistance, c’est un moteur qui travaille plus : la batterie se vide plus vite.'
        questions:
            -   id: q01
                type: nombre
                enonce: D’après le document 2, combien de kilomètres d’autonomie perd-on en passant de l’assistance faible à l’assistance forte ?
                unite: km
                aide: N’oublie pas l’unité (réflexe n° 5).
            -   id: q02
                type: texte
                enonce: Explique pourquoi l’autonomie diminue quand l’assistance augmente.
                aide: Pense à « car » (réflexe n° 4).
    -   id: a03
        titre: Conseiller Inès
        transition: Tu sais lire le document 2. Utilise-le pour conseiller Inès.
        consigne: Tu vas expliquer la méthode du testeur, puis conseiller un niveau d’assistance à Inès avec le document 2. On attend une explication du protocole et un conseil justifié par des valeurs.
        contenu:
            -   type: etapes
                elements:
                    - 'Relis ce que le testeur a gardé identique (vélo, parcours, cycliste) : pense au réflexe n° 8.'
                    - Calcule la distance d’Inès en deux jours.
                    - Cherche dans le document 2 le niveau d’assistance qui dépasse cette distance.
            -   type: paragraphe
                texte: 'Pourquoi calculer sur deux jours ? Inès ne recharge que tous les deux jours : c’est sur cette distance que l’autonomie doit suffire.'
        questions:
            -   id: q01
                type: texte
                enonce: Pour mesurer l’autonomie, le testeur a utilisé le même vélo, sur le même parcours, avec le même cycliste. Pourquoi ?
                aide: Attendu ou observé ?
            -   id: q02
                type: texte
                enonce: Inès fait 30 km aller-retour par jour et veut recharger seulement tous les deux jours. Quel niveau d’assistance lui conseilles-tu ? Justifie avec le document 2.
                aide: Pense à « car » (réflexe n° 4).
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: En descente, certains vélos électriques rechargent un peu leur batterie.
        questions:
            -   id: q01
                type: texte
                enonce: Quel constituant joue alors le rôle de génératrice ? Écris la conversion d’énergie.
                aide: Quelle énergie entre, laquelle sort ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as terminé le dossier. Fais le point sur tes réflexes.
        questions:
            -   id: q01
                type: texte
                enonce: Relis ta copie. Quel réflexe as-tu le mieux utilisé aujourd’hui ? Lequel te pose encore problème ? Donne un exemple.
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - Une chaîne d’énergie se complète dans l’ordre ; chaque constituant convertit l’énergie.
    - 'Pour exploiter des mesures : calculer avec l’unité, ne comparer que ce qui est comparable, conclure.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
