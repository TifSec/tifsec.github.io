titre: "Arcade : à quoi sert un compteur ?"
theme: Créer un jeu de collecte et expliquer ses règles
problematique: "Arcade : à quoi sert un compteur ?"
pourquoi: Utiliser une variable et vérifier sa mise à jour.
application: "Les compteurs servent à suivre des quantités dans les jeux, les applications et les outils numériques."
lien_precedent: "Après S28 — Arcade : créer une mission de collecte, nous poursuivons avec un seul objectif : utiliser une variable et vérifier sa mise à jour."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: paragraphe
            texte: Le score représente le nombre d’objets collectés, pas une qualité d’eau. Il commence à 0 et augmente de 1 à chaque nouvel objet collecté. Un même objet ne doit pas être compté plusieurs fois.
          - type: paragraphe
            texte: "Exemple guidé dans Arcade : compteur vaut 0 au départ. À chaque objet ramassé, j’ajoute 1. Après trois objets, le compteur vaut 3. J’essaie aussi de recommencer pour vérifier que le score repart bien de 0."
      questions:
          - id: q01
            type: texte
            enonce: Quelle valeur doit avoir le compteur au début d’une nouvelle partie ?
            aide: Le démarrage doit être reproductible.
          - id: q02
            type: texte
            enonce: Après trois objets comptés une seule fois chacun, quelle valeur doit-on lire ?
            aide: Chaque nouvel objet ajoute une unité.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - Ajouter l’initialisation du score au démarrage.
          - Dans le contact avec un objet, ajouter 1 puis supprimer l’objet.
          - Collecter trois objets en vérifiant chaque changement, puis redémarrer.
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: Le score augmente plusieurs fois pour un seul objet. Quelle modification proposer et comment la vérifier ?
            aide: Le contact peut être détecté plus d’une fois si l’objet reste présent.
      ressources:
          - type: paragraphe
            texte: Retrouver un bloc pour le sprite, les commandes, le score ou les contacts ; comparer avec ton programme.
          - type: lien
            titre: MakeCode Arcade — Référence
            url: https://arcade.makecode.com/reference
          - type: lien
            titre: Ouvrir MakeCode Arcade
            url: https://arcade.makecode.com/
    - id: a03
      titre: 3. Explique avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Expliquer le point commun entre ce compteur et la variable position du monte-charge, puis une différence.
            aide: Une variable n’a pas toujours la même signification.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Une variable-compteur augmente quand un événement prévu se produit."
    - "Utiliser une variable et vérifier sa mise à jour."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Une variable-compteur augmente quand un événement prévu se produit."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Utiliser une variable et vérifier sa mise à jour."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : Les compteurs servent à suivre des quantités dans les jeux, les applications et les outils numériques."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
