titre: 'Séance 33 : Comment le monte-charge sait-il où est la cabine ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Quels constituants donnent des informations au monte-charge, lesquels décident et lesquels préviennent l’utilisateur ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - 'Une chaîne d’information montre le chemin de l’information : acquérir (capteurs, boutons), traiter (carte programmable), communiquer (écran, voyants).'
        - Un capteur de fin de course (contact) signale qu’une pièce est arrivée à une position. Le capteur à ultrasons mesure une distance.
    competences:
        - Identifier les constituants de la chaîne d’information du monte-charge (organisation fournie).
        - 'Associer chaque constituant à sa fonction : acquérir, traiter, communiquer.'
pourquoi:
    - En séance 1, tu as découvert le monte-charge du collège. Depuis, tu as appris ce qu’est une chaîne d’énergie, puis à programmer avec des blocs.
    - Aujourd’hui, le professeur fait fonctionner la maquette. Tu cherches comment elle « sait » où est la cabine et quand elle doit s’arrêter.
activites:
    -   id: a01
        titre: La démonstration
        contenu:
            -   type: paragraphe
                texte: 'Le professeur met le monte-charge en marche. Observe : la cabine est en bas. Le professeur appuie sur le bouton d’appel de l’étage : la cabine monte, puis s’arrête toute seule en haut. L’écran affiche des messages et des voyants changent de couleur.'
            -   type: tableau
                titre: Document 1 — Les constituants d’information du monte-charge
                colonnes:
                    - Constituant
                    - Où il est
                    - Ce qu’il fait
                lignes:
                    -   - Bouton d’appel « Étage »
                        - En haut de la maquette
                        - Demande que la cabine monte.
                    -   - Bouton d’appel « RDC » (rez-de-chaussée)
                        - En bas de la maquette
                        - Demande que la cabine descende.
                    -   - Contact haut (capteur de fin de course)
                        - En haut du guidage
                        - Signale que la cabine est arrivée en haut.
                    -   - Contact bas (capteur de fin de course)
                        - En bas du guidage
                        - Signale que la cabine est arrivée en bas.
                    -   - Capteur à ultrasons
                        - Au-dessus de la cabine
                        - Mesure une distance (en cm) ; elle s’affiche pendant le trajet.
                    -   - Carte micro:bit et sa carte d’extension
                        - Sur le côté
                        - Lit les informations et décide quoi faire grâce à son programme.
                    -   - Écran OLED
                        - Sur la façade
                        - 'Affiche des messages : « Attente », « Appel Etage », « Stop Etage »…'
                    -   - Voyants de couleur
                        - Près des boutons
                        - Verts en attente, rouges pendant le trajet.
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 1, comment le monte-charge sait-il que la cabine est arrivée en haut ?
                choix:
                    -   id: a
                        texte: Le contact haut le signale.
                    -   id: b
                        texte: L’écran le devine.
                    -   id: c
                        texte: Le voyant vert le mesure.
            -   id: q02
                type: qcm
                enonce: Quel constituant décide de faire monter ou descendre la cabine ?
                choix:
                    -   id: a
                        texte: La carte micro:bit, grâce à son programme.
                    -   id: b
                        texte: Le bouton d’appel.
                    -   id: c
                        texte: Le capteur à ultrasons.
        ressources:
            -   type: lien
                titre: 'Éduscol — Édubase : le projet de monte-charge'
                url: https://edubase.eduscol.education.fr/fiche/24732
    -   id: a02
        titre: La chaîne d’information
        transition: 'Tu connais les constituants. Range-les maintenant selon leur fonction : c’est la chaîne d’information.'
        contenu:
            -   type: tableau
                titre: Exemple expliqué
                colonnes:
                    - Fonction
                    - Ce que cela veut dire
                    - Exemple pour la lampe de poche
                lignes:
                    -   - Acquérir
                        - Recevoir une information
                        - L’interrupteur reçoit l’ordre de l’utilisateur
                    -   - Traiter
                        - Décider quoi faire
                        - '(pas de carte : l’interrupteur ferme directement le circuit)'
                    -   - Communiquer
                        - Donner une information à l’utilisateur
                        - La lumière montre que la lampe est allumée
            -   type: paragraphe
                texte: 'Pour le monte-charge, l’organisation est fournie : à toi de placer chaque constituant dans la bonne fonction.'
        questions:
            -   id: q01
                type: tableau
                enonce: 'Pour chaque constituant du document 1, écris sa fonction : acquérir, traiter ou communiquer.'
                colonnes:
                    - Constituant
                    - Fonction
                lignes:
                    -   - Bouton d’appel « Étage »
                        - ''
                    -   - Contact bas
                        - ''
                    -   - Carte micro:bit
                        - ''
                    -   - Écran OLED
                        - ''
                    -   - Voyants de couleur
                        - ''
                    -   - Capteur à ultrasons
                        - ''
    -   id: a03
        titre: Lire l’écran et les voyants
        transition: 'La chaîne d’information se termine par « communiquer » : regardons ce que l’utilisateur voit.'
        contenu:
            -   type: paragraphe
                texte: 'Rappel de la séance 4 : l’utilisateur est un élément extérieur. L’écran et les voyants communiquent avec lui.'
        questions:
            -   id: q01
                type: texte
                enonce: La cabine monte. D’après le document 1 et la démonstration, que voit l’utilisateur sur les voyants et sur l’écran ?
            -   id: q02
                type: texte
                enonce: Pourquoi est-il utile que l’utilisateur voie un voyant rouge pendant le trajet ? Explique avec « car ».
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le capteur à ultrasons mesure la distance au-dessus de la cabine.
        questions:
            -   id: q01
                type: texte
                enonce: Quand la cabine monte, la distance mesurée augmente-t-elle ou diminue-t-elle ? Explique.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as identifié la chaîne d’information du monte-charge. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quels constituants informent le monte-charge, lesquels décident et lesquels préviennent l’utilisateur ?'
retenir:
    - 'Chaîne d’information : acquérir (boutons, capteurs), traiter (carte programmable), communiquer (écran, voyants).'
    - Un contact de fin de course signale qu’une position est atteinte.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
