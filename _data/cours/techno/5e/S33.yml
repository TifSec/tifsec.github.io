titre: "Une cuve intelligente : pour quel besoin ?"
theme: Concevoir une cuve intelligente simulée
problematique: "Une cuve intelligente : pour quel besoin ?"
pourquoi: Exprimer le besoin et les limites d’un projet.
application: "Une cuve de récupération d’eau peut aider à suivre une réserve destinée à des usages non potables."
lien_precedent: "Après S32 — Arcade : expliquer son programme et ses tests, nous poursuivons avec un seul objectif : exprimer le besoin et les limites d’un projet."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: paragraphe
            texte: "Projet numérique : imaginer une cuve qui collecte une eau destinée à un usage non potable, surveille un niveau et isole une arrivée signalée comme suspecte. Aucune eau n’est manipulée pendant cette préparation. Le modèle ne certifie jamais la potabilité."
          - type: tableau
            colonnes:
                - Exigence proposée
                - Sens
            lignes:
                - - Ne pas déborder
                  - Repérer un niveau haut
                - - Isoler une arrivée suspecte
                  - Suivre un signal d’alerte
                - - Informer l’utilisateur
                  - Afficher un état compréhensible
          - type: paragraphe
            texte: "Exemple guidé : une famille veut savoir si sa cuve de récupération d’eau de pluie est presque pleine. Le besoin est d’être avertie avant le débordement ; le capteur et l’écran sont des solutions possibles, pas le besoin lui-même."
      questions:
          - id: q01
            type: texte
            enonce: Formuler le besoin sans commencer par une liste de composants.
            aide: Commence par ce que le système rend possible.
          - id: q02
            type: texte
            enonce: Pourquoi « rendre l’eau buvable » n’est-il pas une exigence de ce projet ?
            aide: Relis la limite annoncée du modèle.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - Dessiner la cuve, une arrivée, une sortie autorisée et une voie de collecte isolée.
          - Nommer les utilisateurs et le milieu extérieur.
          - Rédiger le besoin et deux exigences vérifiables avant de choisir des composants.
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: Donner deux exigences et préciser ce qui permettrait de vérifier chacune.
            aide: Une exigence doit pouvoir être confrontée à une observation.
      ressources:
          - type: paragraphe
            texte: Sur le portail public, chercher qualité de l’eau et usages ; relever une information qui distingue observation et contrôle.
          - type: lien
            titre: Eaufrance — Portail public de l’eau
            url: https://www.eaufrance.fr/
    - id: a03
      titre: 3. Explique avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Un groupe propose une sortie unique pour toute l’eau. Quelle difficulté cela pose-t-il à l’exigence d’isolement ?
            aide: Relie une solution à l’exigence qu’elle doit satisfaire.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Le besoin décrit le service attendu avant de choisir les composants."
    - "Exprimer le besoin et les limites d’un projet."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Le besoin décrit le service attendu avant de choisir les composants."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Exprimer le besoin et les limites d’un projet."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : Une cuve de récupération d’eau peut aider à suivre une réserve destinée à des usages non potables."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
