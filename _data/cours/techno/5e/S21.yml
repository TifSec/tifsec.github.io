titre: "Éolienne ou panneau : est-ce toujours le même choix ?"
theme: Comparer des solutions d’énergie
problematique: "Éolienne ou panneau : est-ce toujours le même choix ?"
pourquoi: Choisir une solution en tenant compte du milieu.
application: Les choix d’énergie dépendent du lieu, des besoins et des essais.
lien_precedent: "Après S20 — Quelles pales choisir pour notre besoin ?, nous poursuivons avec un seul objectif : choisir une solution en tenant compte du milieu."
activites:
    - id: a01
      titre: Comprendre le document
      pourquoi: Choisir une solution en tenant compte du milieu.
      demarche:
          - Lire le document et repérer les mots utiles.
          - Répondre aux deux questions avec une information du document.
      contenu:
          - type: tableau
            colonnes:
                - Site fictif
                - Ensoleillement
                - Vent régulier
                - Besoin
            lignes:
                - - Abri A
                  - Fort le jour
                  - Faible
                  - Éclairage la nuit
                - - Site B
                  - Variable
                  - Régulier
                  - Petit appareil le jour
          - type: paragraphe
            texte: Un panneau photovoltaïque convertit l’énergie du rayonnement solaire en énergie électrique. Une éolienne utilise le vent. La production et le besoin peuvent ne pas avoir lieu au même moment.
      questions:
          - id: q01
            type: texte
            enonce: Quelle source utilise le panneau photovoltaïque ?
            aide: Le panneau n’est pas une réserve d’électricité.
          - id: q02
            type: texte
            enonce: Pour l’abri A, quel décalage faut-il prendre en compte ?
            aide: Compare les moments de production et d’usage.
    - id: a02
      titre: Faire, chercher et tester
      pourquoi: Mettre l’idée à l’épreuve plutôt que recopier une définition.
      demarche:
          - Faire un schéma source → convertisseur → appareil pour chaque solution.
          - Comparer les deux sites, sans annoncer de production chiffrée absente des documents.
          - Ajouter ce qui manque si la production a lieu le jour et l’usage la nuit.
      contenu:
          - type: paragraphe
            texte: "Travaille au brouillon, dans le logiciel ou sur le schéma. Garde une trace d’essai : situation, résultat attendu et observation. En binôme, échangez les rôles au milieu du travail."
      questions:
          - id: q01
            type: texte
            enonce: Proposer une solution pour l’abri A et indiquer une limite à vérifier avant de la valider.
            aide: Ne confonds pas présence d’une source et autonomie assurée.
      ressources:
          - type: paragraphe
            texte: Rechercher dans le guide la source, le convertisseur et une limite d’une énergie renouvelable.
          - type: lien
            titre: ADEME — Les clés de l’énergie
            url: https://mtaterre.fr/wp-content/uploads/2024/01/2024-01-cles-energie-guide-version-nationale.pdf
    - id: a03
      titre: Expliquer ce que le test permet de conclure
      pourquoi: Relier sa réponse à une donnée et préciser une limite.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Peut-on affirmer que le site B sera autonome avec une éolienne à partir de ce seul tableau ?
            aide: Identifier une donnée qui manque à la décision.
    - id: a04
      titre: Conserver et retenir
      pourquoi: Finir avec une trace réutilisable.
      demarche:
          - Vérifier le nom du projet ou de la trace.
          - Noter au brouillon une erreur corrigée ou une étape à reprendre.
      contenu: []
      questions: []
retenir:
    - Choisir une solution en tenant compte du milieu.
    - Une source fournit une énergie ; un convertisseur en change la forme.
    - Une solution est choisie pour un besoin et des contraintes, pas pour un seul avantage.
bilan: Je conserve une trace qui montre ce que j’ai compris ou testé. Une erreur expliquée et corrigée est un progrès observable.
introduction:
    - type: paragraphe
      texte: "Objectif du jour : Choisir une solution en tenant compte du milieu."
    - type: paragraphe
      texte: "Séance de 50 minutes de travail effectif : lire et comprendre, réaliser ou chercher, tester, puis faire un bilan. Les essais font partie du travail ; une version simple suffit pour commencer."
    - type: liste
      elements:
          - Une source fournit une énergie ; un convertisseur en change la forme.
          - Une comparaison doit préciser la grandeur, l’unité et les conditions des essais.
          - Une solution est choisie pour un besoin et des contraintes, pas pour un seul avantage.
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
