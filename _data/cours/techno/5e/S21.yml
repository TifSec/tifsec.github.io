titre: 'Séance 21 : Lequel choisir en lisant sa fiche ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Comment choisir entre deux objets qui répondent au même besoin, en lisant leurs fiches ?
competences_bo:
    - Caractériser et choisir un objet ou un système technique selon différents critères
objectifs:
    connaissances:
        - L’étiquette énergie classe les appareils de A (le plus économe) à G (le moins économe).
        - L’indice de réparabilité, noté sur 10, dit si un appareil est facile à réparer.
        - Une notice explique comment utiliser et entretenir l’objet.
    competences:
        - Lire une étiquette énergie et un indice de réparabilité.
        - Comparer deux objets avec plusieurs critères.
        - Justifier un choix.
pourquoi:
    - En séance 20, tu as vu qu’un objet a un impact sur l’environnement pendant toute sa vie.
    - 'Quand on achète un objet, sa fiche donne des informations utiles pour bien choisir. Aujourd’hui, tu apprends à les lire. Désormais, le guidage est un peu plus léger : relis les exemples si besoin.'
activites:
    -   id: a01
        titre: Lire les informations
        contenu:
            -   type: tableau
                colonnes:
                    - Information
                    - Où la trouver
                    - Ce qu’elle indique
                lignes:
                    -   - Étiquette énergie
                        - Sur l’appareil ou sa fiche
                        - 'Sa consommation : de A (très économe) à G (gourmand)'
                    -   - Indice de réparabilité
                        - En magasin et sur le site du vendeur
                        - 'Une note sur 10 : plus elle est haute, plus l’appareil est facile à réparer'
                    -   - Notice
                        - Dans la boîte ou en ligne
                        - Comment l’utiliser, l’entretenir et le mettre au rebut
            -   type: paragraphe
                texte: 'Exemple : un téléviseur classé B avec un indice de réparabilité de 7,5/10 est plutôt économe et plutôt facile à réparer.'
        questions:
            -   id: q01
                type: qcm
                enonce: Un appareil classé A sur l’étiquette énergie…
                choix:
                    -   id: a
                        texte: consomme peu d’électricité.
                    -   id: b
                        texte: consomme beaucoup d’électricité.
                    -   id: c
                        texte: est facile à réparer.
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: qcm
                enonce: Un indice de réparabilité de 3/10 signifie que l’appareil…
                choix:
                    -   id: a
                        texte: est difficile à réparer.
                    -   id: b
                        texte: est très facile à réparer.
                    -   id: c
                        texte: consomme peu.
                aide: Relis l’exemple expliqué.
    -   id: a02
        titre: Comparer deux aspirateurs
        transition: Tu sais lire ces informations. Utilise-les pour comparer deux appareils qui répondent au même besoin.
        contenu:
            -   type: tableau
                titre: Document 1 — Deux aspirateurs (fiches inventées pour l’exercice)
                colonnes:
                    - Critère
                    - Aspirateur X
                    - Aspirateur Y
                lignes:
                    -   - Prix
                        - 120 €
                        - 160 €
                    -   - Consommation par an
                        - 40 kWh
                        - 28 kWh
                    -   - Indice de réparabilité
                        - 4,2 / 10
                        - 8,1 / 10
                    -   - Garantie
                        - 2 ans
                        - 5 ans
                    -   - Pièces détachées disponibles
                        - 5 ans
                        - 10 ans
            -   type: paragraphe
                texte: 'Rappel du réflexe brevet n° 5 : écris l’unité de chaque valeur.'
        questions:
            -   id: q01
                type: nombre
                enonce: D’après le document 1, combien de kWh l’aspirateur Y économise-t-il par an par rapport à X ?
                unite: kWh
                aide: N’oublie pas l’unité (réflexe n° 5).
            -   id: q02
                type: nombre
                enonce: En 10 ans, combien de kWh l’aspirateur Y économise-t-il ?
                unite: kWh
                aide: N’oublie pas l’unité (réflexe n° 5).
            -   id: q03
                type: texte
                enonce: L’aspirateur Y coûte 40 € de plus. Donne deux arguments du document 1 qui montrent qu’il peut quand même être un bon choix.
                aide: Combien d’éléments sont demandés ?
    -   id: a03
        titre: Conseiller un ami
        transition: 'Les chiffres ne suffisent pas : il faut tenir compte de la situation de la personne qui achète.'
        questions:
            -   id: q01
                type: texte
                enonce: Ton ami a peu d’argent mais veut un aspirateur qui dure. Lequel lui conseilles-tu ? Justifie en tenant compte du prix ET de la durée de vie.
                aide: Pense à « car » (réflexe n° 4).
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: L’électricité coûte environ 0,25 € par kWh (ordre de grandeur).
        questions:
            -   id: q01
                type: texte
                enonce: En 10 ans, combien d’euros d’électricité l’aspirateur Y fait-il économiser ? Compare avec les 40 € de différence de prix.
                aide: Pense à « car » (réflexe n° 4).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as lu, comparé et conseillé. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment choisir entre deux objets qui répondent au même besoin, en lisant leurs fiches ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Étiquette énergie : de A (économe) à G (gourmand).'
    - 'Indice de réparabilité : note sur 10, plus elle est haute, plus l’appareil est réparable.'
    - Un bon choix compare plusieurs critères sur toute la durée de vie.
sources:
