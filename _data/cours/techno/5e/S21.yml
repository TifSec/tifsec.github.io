titre: "Éolienne ou panneau : est-ce toujours le même choix ?"
theme: Comparer des solutions d’énergie
problematique: "Éolienne ou panneau : est-ce toujours le même choix ?"
pourquoi: Choisir une solution en tenant compte du milieu.
application: "Le lieu et les conditions météo influencent le choix d’une solution énergétique."
lien_precedent: "Après S20 — Quelles pales choisir pour notre besoin ?, nous poursuivons avec un seul objectif : choisir une solution en tenant compte du milieu."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: tableau
            colonnes:
                - Site fictif
                - Ensoleillement
                - Vent régulier
                - Besoin
            lignes:
                - - Abri A
                  - Fort le jour
                  - Faible
                  - Éclairage la nuit
                - - Site B
                  - Variable
                  - Régulier
                  - Petit appareil le jour
          - type: paragraphe
            texte: Un panneau photovoltaïque convertit l’énergie du rayonnement solaire en énergie électrique. Une éolienne utilise le vent. La production et le besoin peuvent ne pas avoir lieu au même moment.
          - type: paragraphe
            texte: "Exemple guidé : un panneau solaire peut convenir à un lieu très ensoleillé ; une éolienne peut convenir à un lieu où le vent est régulier. Je ne choisis pas seulement une technologie : je relie le lieu et le besoin à une preuve."
      questions:
          - id: q01
            type: texte
            enonce: Quelle source utilise le panneau photovoltaïque ?
            aide: Le panneau n’est pas une réserve d’électricité.
          - id: q02
            type: texte
            enonce: Pour l’abri A, quel décalage faut-il prendre en compte ?
            aide: Compare les moments de production et d’usage.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - Faire un schéma source → convertisseur → appareil pour chaque solution.
          - Comparer les deux sites, sans annoncer de production chiffrée absente des documents.
          - Ajouter ce qui manque si la production a lieu le jour et l’usage la nuit.
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: Proposer une solution pour l’abri A et indiquer une limite à vérifier avant de la valider.
            aide: Ne confonds pas présence d’une source et autonomie assurée.
      ressources:
          - type: paragraphe
            texte: Rechercher dans le guide la source, le convertisseur et une limite d’une énergie renouvelable.
          - type: lien
            titre: ADEME — Les clés de l’énergie
            url: https://mtaterre.fr/wp-content/uploads/2024/01/2024-01-cles-energie-guide-version-nationale.pdf
    - id: a03
      titre: 3. Explique avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Peut-on affirmer que le site B sera autonome avec une éolienne à partir de ce seul tableau ?
            aide: Identifier une donnée qui manque à la décision.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Une solution énergétique dépend des ressources et contraintes du lieu."
    - "Choisir une solution en tenant compte du milieu."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Une solution énergétique dépend des ressources et contraintes du lieu."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Choisir une solution en tenant compte du milieu."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : Le lieu et les conditions météo influencent le choix d’une solution énergétique."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
