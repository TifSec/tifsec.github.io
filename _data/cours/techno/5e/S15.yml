titre: Comment arrêter une montée au bon moment ?
theme: Comprendre et commander un monte-charge
problematique: Comment arrêter une montée au bon moment ?
pourquoi: Lire et tester une condition simple.
application: "Les ascenseurs, jeux et appareils utilisent des conditions pour décider quand agir ou s’arrêter."
lien_precedent: "Après S14 — Comment mémoriser une position ?, nous poursuivons avec un seul objectif : lire et tester une condition simple."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: paragraphe
            texte: "Un ordre doit dépendre de la situation observée. Notre modèle utilise haut : 0 signifie « pas arrivé », 1 signifie « arrivé ». Bouton A simule une arrivée en haut ; bouton B remet haut à 0."
          - type: code
            texte: |-
                Au démarrage : haut ← 0
                Toujours :
                    si haut = 1 : afficher une croix (arrêt)
                    sinon : afficher une flèche (montée simulée)
          - type: paragraphe
            texte: "Exemple guidé dans un jeu : si le personnage touche la porte, le niveau s’ouvre ; sinon, il reste fermé. C’est une comparaison pour comprendre la condition. Revenons au monte-charge : la carte lit la position et choisit l’affichage adapté."
      questions:
          - id: q01
            type: texte
            enonce: Quelle condition déclenche l’affichage d’arrêt ?
            aide: Repère ce qui suit le mot si.
          - id: q02
            type: texte
            enonce: Que doit afficher le programme pour haut = 0 ?
            aide: Lis la branche sinon.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - Créer haut et le programme fourni dans MakeCode.
          - "Ajouter A : haut ← 1 et B : haut ← 0."
          - "Tester les deux états puis expliquer la limite du modèle : aucune motorisation réelle."
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: Décrire le changement observé lorsque tu appuies sur A, puis B.
            aide: Donne la valeur et l’affichage correspondant.
      ressources:
          - type: paragraphe
            texte: Dans la documentation, retrouver les blocs d’événement, variable et condition utilisés aujourd’hui.
          - type: lien
            titre: MakeCode micro:bit — Référence
            url: https://makecode.microbit.org/reference
          - type: lien
            titre: Ouvrir le simulateur MakeCode micro:bit
            url: https://makecode.microbit.org/
    - id: a03
      titre: 3. Explique avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Le signal d’arrivée vaut 1, mais le programme continue d’afficher la montée. Quel résultat attendu permet de conclure à une erreur ?
            aide: Cite la condition et l’action attendue.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Une condition choisit une action selon une information observée."
    - "Lire et tester une condition simple."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Une condition choisit une action selon une information observée."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Lire et tester une condition simple."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : Les ascenseurs, jeux et appareils utilisent des conditions pour décider quand agir ou s’arrêter."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
