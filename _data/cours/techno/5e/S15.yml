titre: 'Séance 15 : Comment décrire une cuve d’eau avec des données ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Quelles données faut-il pour décrire une cuve de récupération d’eau de pluie et suivre son remplissage ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - Un objet se décrit avec des descripteurs (hauteur d’eau, capacité, matériau…) qui prennent des valeurs.
        - 'Une donnée a un type : nombre, texte, ou booléen (vrai/faux, qu’on peut écrire 1/0).'
    competences:
        - Choisir des descripteurs pour décrire un objet.
        - Donner le type de chaque donnée.
        - Lire une fiche de données.
pourquoi:
    - 'Notre classe prépare un projet de cuve d’eau intelligente : une cuve qui récupère l’eau de pluie et surveille son niveau. Elle n’est pas encore construite : on l’étudie sur documents.'
    - Pour qu’une cuve « intelligente » puisse prévenir quand elle est pleine, elle doit utiliser des données. Aujourd’hui, tu apprends à décrire un objet avec des données.
activites:
    -   id: a01
        titre: Descripteurs et valeurs
        contenu:
            -   type: paragraphe
                texte: Un descripteur, c’est une caractéristique qu’on peut mesurer ou noter. Sa valeur, c’est ce qu’on mesure ou note.
            -   type: tableau
                titre: 'Exemple expliqué : la cuve du document'
                colonnes:
                    - Descripteur
                    - Valeur
                    - Type de donnée
                lignes:
                    -   - Capacité
                        - 1 000
                        - Nombre (en litres)
                    -   - Matériau
                        - Plastique
                        - Texte
                    -   - Couvercle fermé
                        - Vrai
                        - Booléen (vrai ou faux)
            -   type: paragraphe
                texte: 'Un booléen n’a que deux valeurs : vrai ou faux. L’ordinateur l’écrit avec un seul bit : 1 pour vrai, 0 pour faux (séance 14).'
        questions:
            -   id: q01
                type: tableau
                enonce: 'Donne le type de chaque donnée : nombre, texte ou booléen.'
                colonnes:
                    - Descripteur
                    - Valeur
                    - Type
                lignes:
                    -   - Hauteur d’eau
                        - 42 cm
                        - ''
                    -   - Couleur
                        - Vert
                        - ''
                    -   - Cuve pleine
                        - Faux
                        - ''
                    -   - Nombre de litres récupérés hier
                        - '120'
                        - ''
    -   id: a02
        titre: Une fiche de données pour la cuve
        transition: 'Tu sais ce qu’est un descripteur et un type de donnée. Applique cela à notre projet : la cuve intelligente.'
        contenu:
            -   type: titre
                texte: Document 1 — Ce que la cuve intelligente pourrait mesurer
            -   type: citation
                texte: Un capteur placé dans le couvercle mesure la distance jusqu’à la surface de l’eau. La carte électronique en déduit la hauteur d’eau. Quand la hauteur dépasse 90 cm, la cuve est considérée comme pleine et un voyant s’allume. Chaque soir, la hauteur est enregistrée avec la date.
            -   type: paragraphe
                texte: 'Rappel du réflexe brevet n° 5 (séance 14) : écris toujours l’unité.'
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 1, quelle donnée la cuve calcule-t-elle à partir de la distance mesurée ?
                choix:
                    -   id: a
                        texte: La hauteur d’eau.
                    -   id: b
                        texte: La couleur de l’eau.
                    -   id: c
                        texte: La température.
            -   id: q02
                type: texte
                enonce: D’après le document 1, la donnée « cuve pleine » est-elle un nombre, un texte ou un booléen ? Explique quand elle vaut vrai.
            -   id: q03
                type: nombre
                enonce: Ce soir, la hauteur d’eau est de 95 cm. Écris la valeur du booléen « cuve pleine » avec un bit (1 pour vrai, 0 pour faux).
    -   id: a03
        titre: Choisir ses descripteurs
        transition: Les données du document ont été choisies par le concepteur. À toi de proposer les tiennes.
        contenu:
            -   type: paragraphe
                texte: 'Un descripteur utile aide à répondre à une question. Exemple : pour savoir s’il faut arroser avec l’eau de la cuve, la hauteur d’eau est utile ; la couleur de la cuve ne l’est pas.'
        questions:
            -   id: q01
                type: texte
                enonce: Propose deux autres descripteurs utiles pour suivre la cuve, avec leur type et leur unité si c’est un nombre. Explique à quoi sert chacun.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une cuve de 1 000 L mesure 1 m de haut.
        questions:
            -   id: q01
                type: texte
                enonce: Si la hauteur d’eau est de 40 cm, combien de litres environ contient-elle ? Explique ton calcul.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as décrit la cuve avec des données. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quelles données faut-il pour décrire la cuve et suivre son remplissage ? Donne au moins trois données avec leur type.'
retenir:
    - Un descripteur est une caractéristique ; il prend une valeur.
    - 'Types de données : nombre, texte, booléen (vrai/faux, 1/0).'
    - 'Les données permettent à un objet « intelligent » de décider (ex. : cuve pleine).'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
