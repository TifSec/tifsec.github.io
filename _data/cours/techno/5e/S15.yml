titre: Comment arrêter une montée au bon moment ?
theme: Comprendre et commander un monte-charge
problematique: Comment arrêter une montée au bon moment ?
pourquoi: Lire et tester une condition simple.
application: Un monte-charge déplace une charge et renseigne son utilisateur.
lien_precedent: "Après S14 — Comment mémoriser une position ?, nous poursuivons avec un seul objectif : lire et tester une condition simple."
activites:
    - id: a01
      titre: Comprendre le document
      pourquoi: Lire et tester une condition simple.
      demarche:
          - Lire le document et repérer les mots utiles.
          - Répondre aux deux questions avec une information du document.
      contenu:
          - type: paragraphe
            texte: "Un ordre doit dépendre de la situation observée. Notre modèle utilise haut : 0 signifie « pas arrivé », 1 signifie « arrivé ». Bouton A simule une arrivée en haut ; bouton B remet haut à 0."
          - type: code
            texte: |-
                Au démarrage : haut ← 0
                Toujours :
                    si haut = 1 : afficher une croix (arrêt)
                    sinon : afficher une flèche (montée simulée)
      questions:
          - id: q01
            type: texte
            enonce: Quelle condition déclenche l’affichage d’arrêt ?
            aide: Repère ce qui suit le mot si.
          - id: q02
            type: texte
            enonce: Que doit afficher le programme pour haut = 0 ?
            aide: Lis la branche sinon.
    - id: a02
      titre: Faire, chercher et tester
      pourquoi: Mettre l’idée à l’épreuve plutôt que recopier une définition.
      demarche:
          - Créer haut et le programme fourni dans MakeCode.
          - "Ajouter A : haut ← 1 et B : haut ← 0."
          - "Tester les deux états puis expliquer la limite du modèle : aucune motorisation réelle."
      contenu:
          - type: paragraphe
            texte: "Travaille au brouillon, dans le logiciel ou sur le schéma. Garde une trace d’essai : situation, résultat attendu et observation. En binôme, échangez les rôles au milieu du travail."
      questions:
          - id: q01
            type: texte
            enonce: Décrire le changement observé lorsque tu appuies sur A, puis B.
            aide: Donne la valeur et l’affichage correspondant.
      ressources:
          - type: paragraphe
            texte: Dans la documentation, retrouver les blocs d’événement, variable et condition utilisés aujourd’hui.
          - type: lien
            titre: MakeCode micro:bit — Référence
            url: https://makecode.microbit.org/reference
          - type: lien
            titre: Ouvrir le simulateur MakeCode micro:bit
            url: https://makecode.microbit.org/
    - id: a03
      titre: Expliquer ce que le test permet de conclure
      pourquoi: Relier sa réponse à une donnée et préciser une limite.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Le signal d’arrivée vaut 1, mais le programme continue d’afficher la montée. Quel résultat attendu permet de conclure à une erreur ?
            aide: Cite la condition et l’action attendue.
    - id: a04
      titre: Conserver et retenir
      pourquoi: Finir avec une trace réutilisable.
      demarche:
          - Vérifier le nom du projet ou de la trace.
          - Noter au brouillon une erreur corrigée ou une étape à reprendre.
      contenu: []
      questions: []
retenir:
    - Lire et tester une condition simple.
    - Une fonction décrit ce que fait un élément ; un constituant est la pièce qui réalise cette fonction.
    - "Un modèle représente certains aspects du réel : il faut préciser ce qu’il permet de vérifier."
bilan: Je conserve une trace qui montre ce que j’ai compris ou testé. Une erreur expliquée et corrigée est un progrès observable.
introduction:
    - type: paragraphe
      texte: "Objectif du jour : Lire et tester une condition simple."
    - type: paragraphe
      texte: "Séance de 50 minutes de travail effectif : lire et comprendre, réaliser ou chercher, tester, puis faire un bilan. Les essais font partie du travail ; une version simple suffit pour commencer."
    - type: liste
      elements:
          - Une fonction décrit ce que fait un élément ; un constituant est la pièce qui réalise cette fonction.
          - Une information renseigne le programme ; une action produit un changement.
          - "Un modèle représente certains aspects du réel : il faut préciser ce qu’il permet de vérifier."
reperes_officiels:
