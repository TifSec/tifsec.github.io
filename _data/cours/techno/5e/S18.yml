titre: Comment le vent peut-il produire de l’électricité ?
theme: Comparer des solutions d’énergie
problematique: Comment le vent peut-il produire de l’électricité ?
pourquoi: Repérer une source et des conversions d’énergie.
application: "Une éolienne transforme le mouvement du vent en énergie électrique ; le rendement dépend des conditions."
lien_precedent: "Après S17 — Expliquer et tester un monte-charge : premier entraînement, nous poursuivons avec un seul objectif : repérer une source et des conversions d’énergie."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: paragraphe
            texte: Le vent met les pales en rotation. Cette rotation entraîne une génératrice qui produit une énergie électrique. La maquette du professeur peut illustrer ce fonctionnement ; la séance utilise aussi le schéma pour ne dépendre d’aucun matériel.
          - type: code
            texte: Vent → pales en rotation → génératrice → sortie électrique
          - type: paragraphe
            texte: "Le ventilateur qui produit un vent artificiel reçoit lui-même de l’électricité : cette démonstration n’est pas une source d’énergie gratuite."
          - type: paragraphe
            texte: "Exemple guidé : le vent fait tourner les pales ; leur mouvement entraîne la génératrice ; la génératrice fournit de l’électricité. Chaque flèche indique ce qui est transmis ou transformé : vent → rotation → énergie électrique."
      questions:
          - id: q01
            type: texte
            enonce: Quelle est la source d’énergie d’une éolienne dans le milieu naturel ?
            aide: La source n’est pas la génératrice.
          - id: q02
            type: texte
            enonce: Que transforme la génératrice dans ce modèle ?
            aide: Distingue ce qui entre et ce qui sort.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - Représenter les quatre étapes avec des flèches.
          - Ajouter la source, les éléments en mouvement et la sortie.
          - Rechercher dans la ressource une autre source d’énergie renouvelable et la comparer.
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: Décrire ton schéma et expliquer le rôle des pales et de la génératrice.
            aide: Nomme le mouvement transmis.
      ressources:
          - type: paragraphe
            texte: Rechercher dans le guide la source, le convertisseur et une limite d’une énergie renouvelable.
          - type: lien
            titre: ADEME — Les clés de l’énergie
            url: https://mtaterre.fr/wp-content/uploads/2024/01/2024-01-cles-energie-guide-version-nationale.pdf
    - id: a03
      titre: 3. Explique avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Pourquoi la maquette placée devant un ventilateur électrique ne démontre-t-elle pas une production d’énergie gratuite ?
            aide: Ajoute au schéma ce qui alimente le ventilateur.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Une chaîne d’énergie décrit les formes d’énergie et les transformations."
    - "Repérer une source et des conversions d’énergie."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Une chaîne d’énergie décrit les formes d’énergie et les transformations."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Repérer une source et des conversions d’énergie."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : Une éolienne transforme le mouvement du vent en énergie électrique ; le rendement dépend des conditions."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
