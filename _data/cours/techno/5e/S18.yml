titre: Comment le vent peut-il produire de l’électricité ?
theme: Comparer des solutions d’énergie
problematique: Comment le vent peut-il produire de l’électricité ?
pourquoi: Repérer une source et des conversions d’énergie.
application: Les choix d’énergie dépendent du lieu, des besoins et des essais.
lien_precedent: "Après S17 — Expliquer et tester un monte-charge : premier entraînement, nous poursuivons avec un seul objectif : repérer une source et des conversions d’énergie."
activites:
    - id: a01
      titre: Comprendre le document
      pourquoi: Repérer une source et des conversions d’énergie.
      demarche:
          - Lire le document et repérer les mots utiles.
          - Répondre aux deux questions avec une information du document.
      contenu:
          - type: paragraphe
            texte: Le vent met les pales en rotation. Cette rotation entraîne une génératrice qui produit une énergie électrique. La maquette du professeur peut illustrer ce fonctionnement ; la séance utilise aussi le schéma pour ne dépendre d’aucun matériel.
          - type: code
            texte: Vent → pales en rotation → génératrice → sortie électrique
          - type: paragraphe
            texte: "Le ventilateur qui produit un vent artificiel reçoit lui-même de l’électricité : cette démonstration n’est pas une source d’énergie gratuite."
      questions:
          - id: q01
            type: texte
            enonce: Quelle est la source d’énergie d’une éolienne dans le milieu naturel ?
            aide: La source n’est pas la génératrice.
          - id: q02
            type: texte
            enonce: Que transforme la génératrice dans ce modèle ?
            aide: Distingue ce qui entre et ce qui sort.
    - id: a02
      titre: Faire, chercher et tester
      pourquoi: Mettre l’idée à l’épreuve plutôt que recopier une définition.
      demarche:
          - Représenter les quatre étapes avec des flèches.
          - Ajouter la source, les éléments en mouvement et la sortie.
          - Rechercher dans la ressource une autre source d’énergie renouvelable et la comparer.
      contenu:
          - type: paragraphe
            texte: "Travaille au brouillon, dans le logiciel ou sur le schéma. Garde une trace d’essai : situation, résultat attendu et observation. En binôme, échangez les rôles au milieu du travail."
      questions:
          - id: q01
            type: texte
            enonce: Décrire ton schéma et expliquer le rôle des pales et de la génératrice.
            aide: Nomme le mouvement transmis.
      ressources:
          - type: paragraphe
            texte: Rechercher dans le guide la source, le convertisseur et une limite d’une énergie renouvelable.
          - type: lien
            titre: ADEME — Les clés de l’énergie
            url: https://mtaterre.fr/wp-content/uploads/2024/01/2024-01-cles-energie-guide-version-nationale.pdf
    - id: a03
      titre: Expliquer ce que le test permet de conclure
      pourquoi: Relier sa réponse à une donnée et préciser une limite.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Pourquoi la maquette placée devant un ventilateur électrique ne démontre-t-elle pas une production d’énergie gratuite ?
            aide: Ajoute au schéma ce qui alimente le ventilateur.
    - id: a04
      titre: Conserver et retenir
      pourquoi: Finir avec une trace réutilisable.
      demarche:
          - Vérifier le nom du projet ou de la trace.
          - Noter au brouillon une erreur corrigée ou une étape à reprendre.
      contenu: []
      questions: []
retenir:
    - Repérer une source et des conversions d’énergie.
    - Une source fournit une énergie ; un convertisseur en change la forme.
    - Une solution est choisie pour un besoin et des contraintes, pas pour un seul avantage.
bilan: Je conserve une trace qui montre ce que j’ai compris ou testé. Une erreur expliquée et corrigée est un progrès observable.
introduction:
    - type: paragraphe
      texte: "Objectif du jour : Repérer une source et des conversions d’énergie."
    - type: paragraphe
      texte: "Séance de 50 minutes de travail effectif : lire et comprendre, réaliser ou chercher, tester, puis faire un bilan. Les essais font partie du travail ; une version simple suffit pour commencer."
    - type: liste
      elements:
          - Une source fournit une énergie ; un convertisseur en change la forme.
          - Une comparaison doit préciser la grandeur, l’unité et les conditions des essais.
          - Une solution est choisie pour un besoin et des contraintes, pas pour un seul avantage.
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
