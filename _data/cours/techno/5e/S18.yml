titre: 'Séance 18 : Quelle propriété pour quel usage ? La pale va-t-elle tenir ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Comment les propriétés d’un matériau guident-elles son choix, et comment vérifier qu’une pièce tiendra ?
competences_bo:
    - Caractériser et choisir un objet ou un système technique selon différents critères
    - Valider les solutions techniques par des simulations ou par des protocoles de tests
objectifs:
    connaissances:
        - 'Propriétés des matériaux : masse (léger ou lourd), rigidité (se déforme peu), résistance à l’eau, conduction de l’électricité, recyclabilité.'
        - Une simulation sur ordinateur permet de prévoir si une pièce va se déformer trop, avant de la fabriquer.
    competences:
        - Réaliser un test simple sur un échantillon.
        - Associer une propriété à un usage.
        - Lire les résultats d’une simulation pour valider une pièce.
pourquoi:
    - En séance 17, tu as reconnu les matériaux de nos maquettes.
    - Pourquoi du plastique pour une pale, du cuivre pour un fil ? Parce que chaque matériau a des propriétés. Aujourd’hui, tu les testes, puis tu utilises une simulation pour vérifier qu’une pale d’éolienne tiendra.
activites:
    -   id: a01
        titre: Tester des propriétés
        consigne: Tu vas tester (ou observer) trois échantillons pour découvrir des propriétés des matériaux. On attend des propriétés reliées à un usage.
        contenu:
            -   type: paragraphe
                texte: 'Le professeur te montre (ou tu testes en groupe) trois échantillons : une règle en plastique, une règle en métal, une baguette de bois.'
            -   type: tableau
                titre: Les tests du jour
                colonnes:
                    - Test
                    - Comment faire
                    - Propriété observée
                lignes:
                    -   - Test de l’aimant
                        - Approcher un aimant
                        - Le matériau est-il attiré ? (l’acier oui)
                    -   - Test de flexion
                        - Poser l’échantillon entre deux livres et appuyer au milieu avec un doigt
                        - Se déforme-t-il beaucoup ? (rigidité)
                    -   - Test de l’eau
                        - Déposer une goutte d’eau et attendre 2 minutes
                        - L’eau pénètre-t-elle ?
            -   type: paragraphe
                texte: 'Exemple expliqué : l’aimant attire la règle en métal (acier) mais pas la règle en plastique : seule l’acier est attirée par un aimant.'
            -   type: etapes
                elements:
                    - 'Observe les tests du jour : plier, aimanter, peser.'
                    - Note ce que fait chaque échantillon.
                    - Associe chaque propriété à un usage où elle est indispensable.
            -   type: paragraphe
                texte: 'Pourquoi des propriétés ? On choisit un matériau pour ce qu’il sait faire : être léger, rigide, conduire l’électricité…'
        questions:
            -   id: q01
                type: tableau
                enonce: Associe chaque propriété à un usage où elle est indispensable.
                colonnes:
                    - Propriété
                    - Usage où elle est indispensable
                lignes:
                    -   - Conduit l’électricité
                        - ''
                    -   - Résiste à l’eau
                        - ''
                    -   - Est léger
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
            -   id: q02
                type: qcm
                enonce: Pourquoi une pale d’éolienne doit-elle être légère ?
                choix:
                    -   id: a
                        texte: Pour tourner facilement même avec un vent faible.
                    -   id: b
                        texte: Pour être plus jolie.
                    -   id: c
                        texte: Pour conduire l’électricité.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a02
        titre: La pale va-t-elle tenir ?
        transition: 'Les propriétés aident à choisir un matériau. Mais il faut aussi vérifier que la pièce, avec sa forme, tiendra : c’est le rôle de la simulation.'
        consigne: Tu vas vérifier, avec les résultats d’une simulation (document 1), si des pales d’éolienne respectent une exigence du cahier des charges. On attend « oui » ou « non » pour chaque pale.
        contenu:
            -   type: paragraphe
                texte: 'Avant de fabriquer une pièce, un ingénieur fait une simulation : l’ordinateur calcule de combien la pièce se plie sous l’effet d’une force (ici, le vent).'
            -   type: tableau
                titre: Document 1 — Résultats d’une simulation (exemple inventé pour l’exercice)
                colonnes:
                    - Pale simulée
                    - Épaisseur
                    - Déformation calculée au bout de la pale
                lignes:
                    -   - Pale A
                        - 1 mm
                        - 8 mm
                    -   - Pale B
                        - 2 mm
                        - 3 mm
                    -   - Pale C
                        - 3 mm
                        - 1 mm
            -   type: citation
                texte: 'Exigence du cahier des charges : la pale ne doit pas se déformer de plus de 4 mm, sinon elle risque de toucher le support.'
            -   type: paragraphe
                texte: 'Exemple expliqué : la pale A se déforme de 8 mm. 8 mm est plus grand que 4 mm : elle ne respecte pas l’exigence.'
            -   type: etapes
                elements:
                    - 'Lis l’exigence : 4 mm de déformation au plus.'
                    - Lis l’exemple expliqué de la pale A.
                    - Compare la déformation de chaque pale à 4 mm.
            -   type: paragraphe
                texte: 'Pourquoi une simulation ? Elle évite de fabriquer des pales qui casseraient : on vérifie avant de fabriquer.'
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, écris pour chaque pale si elle respecte l’exigence de 4 mm au plus (oui ou non).
                colonnes:
                    - Pale
                    - Respecte l’exigence ?
                lignes:
                    -   - Pale B
                        - ''
                    -   - Pale C
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
    -   id: a03
        titre: Choisir la pale
        transition: Tu sais quelles pales respectent l’exigence. Il faut maintenant en choisir une.
        consigne: Tu vas choisir entre les pales B et C, qui respectent toutes les deux l’exigence, à partir des résultats de la simulation (document 1). On attend un choix justifié par des valeurs et l’intérêt de la simulation.
        contenu:
            -   type: etapes
                elements:
                    - Relis les déformations des pales B et C dans le document 1.
                    - 'Tiens compte de la masse : une pale plus épaisse est plus lourde.'
                    - Justifie ton choix avec des valeurs et leur unité (réflexes n° 4 et 5).
            -   type: paragraphe
                texte: 'Pourquoi ne pas prendre la plus épaisse ? La plus rigide n’est pas toujours la meilleure : une pale lourde démarre moins bien avec peu de vent.'
        questions:
            -   id: q01
                type: texte
                enonce: Les pales B et C respectent l’exigence. Laquelle choisirais-tu, sachant qu’une pale plus épaisse est plus lourde ? Justifie avec des valeurs (réflexes n° 4 et 5).
                aide: Une idée + « car » + une raison tirée de la séance.
            -   id: q02
                type: qcm
                enonce: Quel est l’intérêt de la simulation ?
                choix:
                    -   id: a
                        texte: Vérifier la pièce avant de la fabriquer, sans gaspiller de matière.
                    -   id: b
                        texte: Rendre la pale plus solide.
                    -   id: c
                        texte: Imprimer la pale plus vite.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une pale de 2 mm se déforme de 3 mm ; une pale de 1 mm de 8 mm.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi la déformation n’est-elle pas simplement divisée par deux quand l’épaisseur double ? Propose une explication.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as testé des propriétés et validé une pale par simulation. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment les propriétés d’un matériau guident-elles son choix, et comment vérifier qu’une pièce tiendra ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Chaque usage demande des propriétés : légèreté, rigidité, résistance à l’eau, conduction…'
    - Une simulation prévoit le comportement d’une pièce avant de la fabriquer.
    - On valide une pièce en comparant un résultat chiffré à une exigence.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
