titre: Que devient un objet avant et après son utilisation ?
theme: "Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser"
problematique: L'impact d'un objet technique commence-t-il seulement au moment où on l'utilise ?
pourquoi: "Objectif de cette séance : Comprendre qu'un objet technique existe bien avant son utilisation et continue d'avoir des conséquences après celle-ci."
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Comprendre qu'un objet technique existe bien avant son utilisation et continue d'avoir des conséquences après celle-ci.
        - Découvrir les principales étapes du cycle de vie d'un objet technique.
        - Comprendre que la fabrication d'un objet nécessite des matières premières, de l'énergie et des transports.
        - Comprendre que la durée d'utilisation, la réparation, le réemploi, la réutilisation et le recyclage peuvent modifier les impacts liés à un objet.
        - Comprendre que le choix d'un matériau peut avoir des conséquences sur la fabrication, l'utilisation, la réparation et la fin de vie.
    competences: []
activites:
    - id: a04
      titre: 1. Avant d'arriver dans le magasin...
      contenu:
          - type: paragraphe
            texte: Imaginez un vélo neuf présenté dans un magasin.
          - type: paragraphe
            texte: Nous connaissons son utilisation, mais il ne s'est évidemment pas retrouvé directement dans le magasin.
          - type: paragraphe
            texte: Que s'est-il passé avant ?
          - type: paragraphe
            texte: En groupe, imaginez toutes les étapes qui ont pu être nécessaires avant qu'un vélo puisse être acheté.
      questions:
          - id: q01
            type: texte
            enonce: "Q1 : Listez au moins cinq étapes qui ont probablement eu lieu avant l'arrivée du vélo dans le magasin."
            suite:
                - type: paragraphe
                  texte: Essayez ensuite de remettre vos propositions dans un ordre logique.
    - id: a05
      titre: 2. De quoi est fabriqué un vélo ?
      contenu:
          - type: paragraphe
            texte: Un vélo est constitué de nombreuses pièces qui n'utilisent pas toutes les mêmes matériaux.
          - type: paragraphe
            texte: À partir de l'image du vélo déjà utilisée dans les séances précédentes et, si nécessaire, d'une recherche rapide, complétez le tableau suivant.
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Élément du vélo
                - Matériau(x) possible(s)
            lignes:
                - - Cadre
                  - ""
                - - Pneu
                  - ""
                - - Chaîne
                  - ""
                - - Selle
                  - ""
                - - Jante
                  - ""
                - - Poignées
                  - ""
          - id: q02
            type: texte
            enonce: "Q2 : Pour chaque élément, indiquez un ou plusieurs matériaux possibles."
          - id: q03
            type: texte
            enonce: "Q3 : Un même élément peut-il être fabriqué avec des matériaux différents selon le modèle de vélo ? Donnez un exemple."
    - id: a06
      titre: 3. D'où viennent les matériaux ?
      contenu:
          - type: paragraphe
            texte: Avant de devenir une pièce de vélo, les matériaux doivent être obtenus puis transformés.
          - type: paragraphe
            texte: "Par exemple :"
          - type: liste
            elements:
                - les métaux sont obtenus à partir de minerais ou de matières métalliques recyclées ;
                - de nombreux plastiques sont produits à partir de ressources fossiles ou de matières recyclées ;
                - le caoutchouc peut être d'origine naturelle ou synthétique.
      questions:
          - id: q01
            type: texte
            enonce: "Q4 : Pourquoi l'extraction, la production et la transformation des matières nécessitent-elles de l'énergie ?"
          - id: q02
            type: texte
            enonce: "Q5 : Quels impacts environnementaux peuvent être associés à ces étapes ? Proposez au moins deux exemples."
    - id: a07
      titre: 4. Et après la fabrication des pièces ?
      contenu:
          - type: paragraphe
            texte: Une fois les matériaux transformés et les pièces fabriquées, le vélo doit encore être assemblé puis acheminé jusqu'à son utilisateur.
          - type: paragraphe
            texte: "Complétez :"
          - type: paragraphe
            texte: Matières premières → transformation → ................................ → ................................ → transport → distribution → utilisation
      questions:
          - id: q01
            type: texte
            enonce: "Q6 : Quelles étapes avez-vous ajoutées ?"
          - id: q02
            type: texte
            enonce: "Q7 : Pourquoi le transport d'un objet peut-il lui aussi avoir des impacts environnementaux ?"
    - id: a08
      titre: 5. Et lorsque l'utilisateur n'en veut plus ?
      contenu:
          - type: paragraphe
            texte: Imaginons maintenant qu'un vélo ait été utilisé pendant plusieurs années.
          - type: paragraphe
            texte: Son propriétaire ne souhaite plus l'utiliser.
      questions:
          - id: q01
            type: texte
            enonce: "Q8 : Quelles possibilités peut-on envisager pour ce vélo ?"
            suite:
                - type: paragraphe
                  texte: Trouvez au moins quatre solutions différentes.
                - type: paragraphe
                  texte: "Réfléchissez selon plusieurs situations :"
                - type: liste
                  elements:
                      - le vélo fonctionne encore ;
                      - une seule pièce est cassée ;
                      - plusieurs composants sont usés ;
                      - le vélo n'est plus utilisable dans son état actuel.
    - id: a09
      titre: 6. Réparer, réemployer, réutiliser ou recycler ?
      contenu:
          - type: paragraphe
            texte: Toutes les solutions proposées ne correspondent pas exactement à la même chose.
          - type: liste
            elements:
                - "Réparer : remettre l'objet en état afin de prolonger son utilisation."
                - "Réemploi : utiliser de nouveau un produit qui n'est pas devenu un déchet, pour un usage identique ou proche."
                - "Réutilisation : permettre à un produit ou à certains de ses composants de connaître un nouvel usage après être passé par une filière adaptée."
                - "Recyclage : traiter les déchets afin de récupérer des matières pouvant être utilisées à nouveau."
          - type: paragraphe
            texte: "Sources : ADEME – Économie circulaire ; ADEME – Réemploi, réutilisation et réparation"
          - type: lien
            titre: ADEME – Économie circulaire
            url: https://economie-circulaire.ademe.fr/economie-circulaire
          - type: lien
            titre: ADEME – Réemploi, réutilisation et réparation
            url: https://economie-circulaire.ademe.fr/reemploi-reutilisation-entreprises
      questions:
          - id: q01
            type: texte
            enonce: "Q9 : Pour chaque exemple suivant, indiquez la solution qui semble la plus adaptée :"
          - id: q02
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Situation
                - Solution possible
            lignes:
                - - Le vélo fonctionne mais son propriétaire souhaite en acheter un autre.
                  - ""
                - - Le câble de frein est cassé.
                  - ""
                - - Le vélo est hors d'usage mais certaines pièces peuvent encore servir.
                  - ""
                - - Une pièce métallique hors d'usage est transformée pour récupérer la matière.
                  - ""
          - id: q03
            type: texte
            enonce: "Q10 : Pourquoi réparation et recyclage ne correspondent-ils pas à la même démarche ?"
    - id: a10
      titre: 7. Découvrir le cycle de vie
      contenu:
          - type: paragraphe
            texte: Toutes les étapes étudiées constituent le cycle de vie d'un produit.
          - type: paragraphe
            texte: L'ADEME décrit le cycle de vie comme l'ensemble des étapes de l'existence d'un produit, depuis l'obtention des matières premières jusqu'à sa fin de vie et sa valorisation éventuelle.
          - type: paragraphe
            texte: "Source : ADEME – Le cycle de vie d'un produit"
          - type: lien
            titre: ADEME – Le cycle de vie d'un produit
            url: https://economie-circulaire.ademe.fr/consommation-responsable-concept-enjeux
          - type: paragraphe
            texte: "Nous pouvons le simplifier ainsi :"
          - type: paragraphe
            texte: Matières premières → fabrication → transport / distribution → utilisation → fin de vie
          - type: paragraphe
            texte: Mais le parcours n'est pas toujours une simple ligne droite.
          - type: paragraphe
            texte: La réparation, le réemploi et la réutilisation peuvent permettre de prolonger l'utilisation de l'objet ou de ses composants.
          - type: paragraphe
            texte: Le recyclage permet quant à lui de récupérer certaines matières lorsque l'objet ou ses composants deviennent des déchets.
      questions: []
    - id: a11
      titre: 8. Construire la frise du vélo
      contenu:
          - type: paragraphe
            texte: Dans votre document Writer, réalisez une frise présentant le cycle de vie simplifié d'un vélo.
          - type: paragraphe
            texte: "Votre frise devra contenir au minimum :"
          - type: liste
            elements:
                - obtention des matières premières ;
                - transformation des matériaux ;
                - fabrication des pièces ;
                - assemblage du vélo ;
                - transport et distribution ;
                - utilisation ;
                - entretien ou réparation éventuelle ;
                - réemploi, réutilisation, recyclage ou élimination.
          - type: paragraphe
            texte: Ajoutez sous chaque étape une phrase courte expliquant ce qui s'y passe.
      questions:
          - id: q01
            type: texte
            enonce: "Q11 : Ajoutez au moins deux flèches permettant de montrer qu'un vélo ou certaines pièces peuvent revenir vers une nouvelle phase d'utilisation au lieu d'aller immédiatement vers l'élimination."
    - id: a12
      titre: 9. Tous les matériaux ont-ils les mêmes conséquences ?
      contenu:
          - type: paragraphe
            texte: Deux vélos peuvent assurer les mêmes fonctions tout en utilisant des matériaux et des solutions techniques différents.
          - type: paragraphe
            texte: "Imaginons deux cadres :"
          - type: liste
            elements:
                - "cadre A : très léger mais difficile à réparer et dont la fin de vie est complexe ;"
                - "cadre B : un peu plus lourd mais conçu pour être facilement démonté, réparé et dont les matériaux peuvent être plus facilement récupérés."
      questions:
          - id: q01
            type: texte
            enonce: "Q12 : Quel cadre choisiriez-vous si votre seul critère était la masse ?"
          - id: q02
            type: texte
            enonce: "Q13 : Votre choix serait-il forcément le même si votre objectif était de conserver le vélo le plus longtemps possible ?"
          - id: q03
            type: texte
            enonce: "Q14 : Quel lien pouvez-vous faire avec la notion de compromis étudiée lors de la séance 5 ?"
    - id: a13
      titre: "10. Petit défi : comment prolonger la vie d'un vélo ?"
      contenu:
          - type: paragraphe
            texte: Un fabricant souhaite réduire les impacts liés à ses vélos en agissant sur leur cycle de vie.
          - type: paragraphe
            texte: En groupe, proposez au moins trois améliorations.
          - type: paragraphe
            texte: "Vous pouvez agir sur :"
          - type: liste
            elements:
                - la quantité ou le type de matériaux ;
                - la facilité de démontage ;
                - la durée de vie des composants ;
                - l'entretien ;
                - la réparation ;
                - la disponibilité des pièces détachées ;
                - le réemploi ;
                - le recyclage ;
                - le transport.
      questions:
          - id: q01
            type: texte
            enonce: "Q15 : Présentez vos trois propositions."
          - id: q02
            type: texte
            enonce: "Q16 : Pour chaque proposition, indiquez l'étape du cycle de vie concernée."
          - id: q03
            type: texte
            enonce: "Q17 : Choisissez ensuite celle qui vous semble la plus intéressante et expliquez précisément ce qu'elle permettrait d'améliorer."
    - id: a14
      titre: 11. Des données publiques sur la fin de vie des objets
      contenu:
          - type: paragraphe
            texte: Les déchets, le réemploi, la réparation et le recyclage ne sont pas seulement des sujets théoriques.
          - type: paragraphe
            texte: L'ADEME publie en accès libre sur data.gouv.fr plusieurs jeux de données permettant d'étudier la gestion réelle des déchets et les solutions de l'économie circulaire en France.
          - type: paragraphe
            texte: "Sources de données réelles : data.gouv.fr / ADEME – Que faire de mes déchets : Produits data.gouv.fr / ADEME – Acteurs de l'économie circulaire data.gouv.fr / ADEME – SINOE, destination des déchets ménagers"
          - type: lien
            titre: "data.gouv.fr / ADEME – Que faire de mes déchets : Produits"
            url: https://www.data.gouv.fr/datasets/que-faire-de-mes-dechets-produits
          - type: lien
            titre: data.gouv.fr / ADEME – Acteurs de l'économie circulaire
            url: https://www.data.gouv.fr/dataservices/acteurs-de-leconomie-circulaire-que-faire-de-mes-objets-et-dechets
          - type: lien
            titre: data.gouv.fr / ADEME – SINOE, destination des déchets ménagers
            url: https://www.data.gouv.fr/datasets/sinoe-r-destination-des-dma-collectes-par-type-de-traitement
          - type: paragraphe
            texte: "Par exemple, le service « Que faire de mes objets et déchets ? » rassemble des informations sur des acteurs de :"
          - type: liste
            elements:
                - la réparation ;
                - le réemploi ;
                - la réutilisation ;
                - le tri et le recyclage.
      questions:
          - id: q01
            type: texte
            enonce: "Q18 : Pourquoi peut-il être intéressant d'utiliser des données publiques réelles plutôt que d'inventer des exemples lorsqu'on étudie le devenir des objets ?"
    - id: a15
      titre: 12. Conclusion du travail
      contenu:
          - type: paragraphe
            texte: "Sans retourner lire les parties précédentes, complétez :"
          - type: liste
            elements:
                - Les différentes étapes de l'existence d'un objet constituent son ................................................ .
                - Avant la fabrication d'un objet, il faut obtenir et transformer des ................................................ .
                - Réparer un objet permet généralement de prolonger sa durée d'................................................ .
                - Utiliser de nouveau un produit encore utilisable correspond au ................................................ .
                - Transformer des déchets pour récupérer de la matière correspond au ................................................ .
          - type: paragraphe
            texte: "Dernière question :"
          - type: paragraphe
            texte: "Répondez à la problématique de départ :"
          - type: paragraphe
            texte: « L'impact d'un objet technique commence-t-il seulement au moment où on l'utilise ? »
          - type: paragraphe
            texte: Justifiez en trois ou quatre phrases en citant au moins trois étapes différentes du cycle de vie.
          - type: paragraphe
            texte: Enregistrez votre travail puis déposez-le dans l'espace d'échange.
          - type: paragraphe
            texte: "Le cycle de vie présenté dans cette séance est volontairement simplifié pour le niveau 5e. Les impacts environnementaux réels d'un produit dépendent de nombreux paramètres : matériaux, procédés de fabrication, énergie utilisée, durée d'usage, entretien, transport et fin de vie. Les exemples proposés servent à comprendre la démarche et ne constituent pas une analyse complète du cycle de vie d'un vélo réel."
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
introduction:
    - type: titre
      texte: "Compétence visée : Identifier les principales étapes du cycle de vie d'un objet technique et comprendre que les choix techniques peuvent influencer ses impacts"
    - type: paragraphe
      texte: "Objectifs d’apprentissage :"
    - type: liste
      elements:
          - Comprendre qu'un objet technique existe bien avant son utilisation et continue d'avoir des conséquences après celle-ci.
          - Découvrir les principales étapes du cycle de vie d'un objet technique.
          - Comprendre que la fabrication d'un objet nécessite des matières premières, de l'énergie et des transports.
          - Comprendre que la durée d'utilisation, la réparation, le réemploi, la réutilisation et le recyclage peuvent modifier les impacts liés à un objet.
          - Comprendre que le choix d'un matériau peut avoir des conséquences sur la fabrication, l'utilisation, la réparation et la fin de vie.
    - type: liste
      elements:
          - Reconstituer les principales étapes de la vie d'un objet technique.
          - Identifier les matériaux utilisés dans quelques composants simples.
          - Classer des étapes dans un ordre logique.
          - Repérer différentes étapes pouvant avoir un impact sur l'environnement.
          - Proposer des solutions permettant d'allonger la durée d'utilisation d'un objet.
          - Distinguer réparation, réemploi, réutilisation et recyclage.
    - type: liste
      elements:
          - Un document LibreOffice Writer nommé 5e_S7_nom1_nom2.odt.
          - Les noms et prénoms des élèves du groupe.
          - Le titre de la séance.
          - Les réponses aux différentes questions.
          - Une frise représentant les principales étapes du cycle de vie d'un vélo.
          - Un tableau consacré à quelques composants du vélo.
          - Une courte proposition permettant de prolonger la durée d'utilisation d'un objet technique.
    - type: paragraphe
      texte: Le document devra être enregistré puis déposé dans l'espace d'échange à la fin de la séance, même s'il n'est pas entièrement terminé.
