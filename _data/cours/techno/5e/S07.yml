titre: 'Séance 7 : Bilan : présenter un objet du quotidien'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Comment présenter complètement un objet du quotidien à quelqu’un qui ne le connaît pas ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
    - Décrire les interactions entre un objet ou un système technique, son environnement et les utilisateurs
objectifs:
    connaissances:
        - 'Une présentation complète d’un objet dit : son besoin, son utilisateur, sa fonction d’usage, ses éléments extérieurs et sa facilité d’utilisation.'
    competences:
        - Réutiliser les méthodes des séances 2 à 6 sur un nouvel objet.
        - Organiser une présentation claire.
pourquoi:
    - Depuis la séance 2, tu as appris plusieurs méthodes pour décrire un objet.
    - 'Aujourd’hui, tu les rassembles pour présenter un objet que tu n’as pas encore étudié : la brosse à dents électrique. C’est le bilan de la séquence.'
activites:
    -   id: a01
        titre: Le document de travail
        consigne: Tu vas présenter la brosse à dents électrique (document 1) en réutilisant les méthodes des séances 2 et 3. On attend son besoin et les réponses aux trois questions.
        contenu:
            -   type: titre
                texte: Document 1 — La brosse à dents électrique (document inventé pour l’exercice)
            -   type: citation
                texte: La brosse à dents électrique aide à nettoyer les dents plus efficacement qu’une brosse classique. Sa tête tourne toute seule grâce à un petit moteur. Elle est rechargée sur un socle branché à la prise. Un minuteur la fait vibrer toutes les 30 secondes pour indiquer de changer de zone. Le manche est antidérapant pour ne pas glisser des mains mouillées. Elle résiste aux éclaboussures d’eau.
            -   type: paragraphe
                texte: 'Rappel des méthodes : séance 2 (le besoin), séance 3 (les trois questions), séance 4 (les éléments extérieurs), séance 5 (l’ergonomie), réflexes brevet n° 2 et 3.'
            -   type: etapes
                elements:
                    - Lis tout le document 1 une première fois.
                    - Repère la phrase qui dit le besoin.
                    - 'Applique les trois questions de la séance 3 : à qui ? sur quoi ? dans quel but ?'
            -   type: paragraphe
                texte: 'Pourquoi réutiliser les méthodes ? C’est le bilan de la séquence : tu montres que tu sais les appliquer seul à un objet nouveau.'
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 1, à quel besoin répond la brosse à dents électrique ?
                choix:
                    -   id: a
                        texte: Nettoyer les dents efficacement.
                    -   id: b
                        texte: Charger un téléphone.
                    -   id: c
                        texte: Se coiffer.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: tableau
                enonce: Applique à la brosse à dents électrique la méthode des trois questions (séance 3).
                colonnes:
                    - Question
                    - Réponse
                lignes:
                    -   - À qui rend-elle service ?
                        - ''
                    -   - Sur quoi agit-elle ?
                        - ''
                    -   - Dans quel but ? (fonction d’usage)
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: Les éléments extérieurs de la brosse
        transition: Tu connais le besoin et l’usage de la brosse. Cherche maintenant ce qui agit autour d’elle.
        consigne: Tu vas trouver les éléments extérieurs de la brosse à dents électrique, avec la méthode de la séance 4 et le document 1. On attend trois éléments extérieurs et ce que chacun fait avec la brosse.
        contenu:
            -   type: etapes
                elements:
                    - 'Relis le document 1 : qui tient la brosse, ce qu’elle nettoie, ce qui la recharge, ce qui peut l’éclabousser.'
                    - 'Pour chaque élément, pose-toi la question de la séance 4 : si je l’enlève, manque-t-il une pièce à la brosse ?'
                    - Écris trois éléments extérieurs et ce qu’ils font avec la brosse.
            -   type: paragraphe
                texte: 'Pourquoi les éléments extérieurs ? Ce sont eux qui expliquent les choix des concepteurs : l’eau oblige à rendre la brosse étanche, par exemple.'
        questions:
            -   id: q01
                type: tableau
                enonce: Trouve trois éléments extérieurs de la brosse à dents électrique (séance 4) et ce qu’ils font avec elle.
                colonnes:
                    - Élément extérieur
                    - Ce qu’il fait avec la brosse
                lignes:
                    -   - ''
                        - ''
                    -   - ''
                        - ''
                    -   - ''
                        - ''
                aide: 'Cherche dans le document : qui la tient, ce qu’elle nettoie, ce qui la recharge, ce qui peut l’éclabousser.'
    -   id: a03
        titre: Est-elle facile à utiliser ?
        transition: Tu as décrit le besoin, l’usage et les éléments extérieurs. Il reste à juger la facilité d’utilisation, comme en séance 5.
        consigne: Tu vas juger la facilité d’utilisation de la brosse à dents électrique avec les critères de la séance 5. On attend deux choix de conception expliqués avec « car ».
        contenu:
            -   type: paragraphe
                texte: Relis le document 1 et repère les choix faits pour faciliter l’utilisation (séance 5).
            -   type: etapes
                elements:
                    - Relis le document 1 en cherchant ce qui rend la brosse facile, confortable ou sûre.
                    - Choisis deux choix de conception.
                    - Explique chacun avec « car ».
            -   type: paragraphe
                texte: Pourquoi l’ergonomie ? Un objet utilisé tous les jours, avec les mains mouillées, doit être sûr et facile à prendre en main.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, cite deux choix de conception qui rendent la brosse plus facile ou plus sûre à utiliser, et explique-les avec « car ».
                aide: 'Commence par : « D’après le document 1, … car … »'
    -   id: a04
        titre: Comparer
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La brosse classique et la brosse électrique répondent au même besoin.
        questions:
            -   id: q01
                type: texte
                enonce: Donne un avantage et un inconvénient de la brosse électrique par rapport à la brosse classique.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as rassemblé toutes les méthodes. Il reste à répondre au problème de départ en une présentation.
        questions:
            -   id: q01
                type: texte
                enonce: 'Présente la brosse à dents électrique à quelqu’un qui ne la connaît pas, en 4 ou 5 phrases : besoin, utilisateur, fonction d’usage, un élément extérieur et un choix qui la rend facile à utiliser.'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Présenter un objet : besoin, utilisateur, fonction d’usage, éléments extérieurs, facilité d’utilisation.'
    - Ces méthodes serviront pour présenter les maquettes de l’année.
sources:
