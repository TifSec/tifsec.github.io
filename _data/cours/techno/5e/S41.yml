titre: 'Séance 41 : Trouver la panne du monte-charge'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Comment trouver et réparer la panne du monte-charge en suivant un protocole ?
competences_bo:
    - Identifier un dysfonctionnement d’un objet technique et y remédier
    - Valider les solutions techniques par des simulations ou par des protocoles de tests
objectifs:
    connaissances:
        - Un protocole de dépannage est une suite de vérifications, de la plus simple à la plus compliquée.
        - 'Une réparation se valide par un test : l’objet doit refonctionner comme attendu.'
    competences:
        - Suivre un protocole de dépannage.
        - Valider une réparation par un test.
        - Retrouver l’ordre des étapes d’une notice.
pourquoi:
    - En séance 40, tu as repéré des pièces abîmées sur des photos.
    - Aujourd’hui, le professeur a préparé une vraie panne sur le monte-charge, sans rien casser. Ton groupe la cherche avec un protocole ; un groupe la répare devant la classe.
activites:
    -   id: a01
        titre: Le protocole de dépannage
        contenu:
            -   type: tableau
                titre: Document 1 — Protocole fourni
                colonnes:
                    - Étape
                    - Vérification
                    - Si NON, la panne est…
                lignes:
                    -   - '1'
                        - Au démarrage, les voyants s’allument-ils en orange, et l’écran fonctionne-t-il ?
                        - … dans l’alimentation ou la carte (appeler le professeur).
                    -   - '2'
                        - 'Cabine en bas, appui sur Étage : l’écran affiche-t-il « Appel Etage » ?'
                        - … dans le bouton Étage ou le contact bas, ou leurs connecteurs.
                    -   - '3'
                        - Le moteur tourne-t-il et la cabine monte-t-elle ?
                        - … dans le connecteur du moteur, le moteur, ou le câble de levage.
                    -   - '4'
                        - La cabine s’arrête-t-elle en haut avec « Stop Etage » ?
                        - … dans le contact haut ou son connecteur.
            -   type: paragraphe
                texte: 'On s’arrête à la première vérification qui échoue : c’est là que se trouve la panne. Toutes les vérifications se font hors tension quand on touche un fil.'
        questions:
            -   id: q01
                type: qcm
                enonce: Pourquoi commence-t-on par vérifier les voyants et l’écran au démarrage ?
                choix:
                    -   id: a
                        texte: Parce que si la carte n’est pas alimentée, rien d’autre ne peut fonctionner.
                    -   id: b
                        texte: Parce que c’est la plus jolie partie.
                    -   id: c
                        texte: Au hasard.
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: texte
                enonce: 'Un groupe observe : voyants orange au démarrage, puis en appuyant sur Étage (cabine en bas), rien ne s’affiche et rien ne bouge. D’après le document 1, où est la panne ?'
                aide: Attendu ou observé ?
    -   id: a02
        titre: La panne du jour (poste maquette)
        transition: Tu connais le protocole. Le moment est venu de l’appliquer à la vraie panne du jour.
        contenu:
            -   type: paragraphe
                texte: Chaque groupe passe 5 minutes au poste maquette pour suivre le protocole. Les autres groupes travaillent sur la mission 3. Le professeur valide le diagnostic, puis un groupe répare (hors tension) devant la classe.
        questions:
            -   id: q01
                type: texte
                enonce: Écris le résultat de chaque étape du protocole pour la panne du jour (oui/non), puis la pièce en cause.
                aide: Attendu ou observé ?
            -   id: q02
                type: texte
                enonce: Après la réparation, quel test permet de dire que la panne est réparée ?
                aide: Attendu ou observé ?
    -   id: a03
        titre: La notice d’assemblage
        transition: 'Pour réparer certaines pièces, il faut démonter dans le bon ordre : la notice d’assemblage le montre.'
        contenu:
            -   type: paragraphe
                texte: La notice d’assemblage du monte-charge montre l’ordre de construction. Pour remplacer une pièce, il faut savoir ce qu’on démonte avant elle.
            -   type: tableau
                colonnes:
                    - Étape de la notice (dans le désordre)
                lignes:
                    -   - Mise en place du câble de levage reliant la cabine au contrepoids
                    -   - Assemblage du bâti
                    -   - Fixation des composants électroniques
                    -   - Assemblage et mise en place du capot de protection
        questions:
            -   id: q01
                type: tableau
                enonce: Remets ces étapes dans l’ordre de la notice (écris le numéro de 1 à 4).
                colonnes:
                    - Étape
                    - Numéro
                lignes:
                    -   - Câble de levage
                        - ''
                    -   - Bâti
                        - ''
                    -   - Composants électroniques
                        - ''
                    -   - Capot de protection
                        - ''
                aide: Ligne × colonne.
            -   id: q02
                type: texte
                enonce: Pour changer le câble de levage, quelle pièce faut-il sans doute enlever d’abord ? Explique.
                aide: Pense à « car » (réflexe n° 4).
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un vrai ascenseur est vérifié régulièrement par un technicien.
        questions:
            -   id: q01
                type: texte
                enonce: Propose une vérification que le technicien devrait faire à chaque visite, et explique pourquoi.
                aide: Pense à « car » (réflexe n° 4).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as cherché une vraie panne, vu une réparation et compris la notice. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment trouver et réparer la panne du monte-charge en suivant un protocole ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Protocole de dépannage : du plus simple au plus compliqué, on s’arrête à la première vérification qui échoue.'
    - On répare hors tension, puis on valide par un test.
sources:
