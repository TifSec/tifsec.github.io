titre: Réparer la cuve plutôt que tout remplacer ?
theme: Concevoir une cuve intelligente simulée
problematique: Réparer la cuve plutôt que tout remplacer ?
pourquoi: Comparer des solutions sur leur cycle de vie.
application: Une cuve peut collecter une eau non potable et isoler une arrivée signalée suspecte dans un modèle.
lien_precedent: "Après S40 — Comment suivre les volumes de la cuve ?, nous poursuivons avec un seul objectif : comparer des solutions sur leur cycle de vie."
activites:
    - id: a01
      titre: Comprendre le document
      pourquoi: Comparer des solutions sur leur cycle de vie.
      demarche:
          - Lire le document et repérer les mots utiles.
          - Répondre aux deux questions avec une information du document.
      contenu:
          - type: tableau
            colonnes:
                - Solution fictive
                - Prix initial
                - Pièce usée remplaçable
                - Accès au filtre
            lignes:
                - - A
                  - 18 €
                  - Non
                  - Collé
                - - B
                  - 24 €
                  - Oui
                  - Trappe vissée
          - type: paragraphe
            texte: Le prix initial n’est pas la seule information. Durée d’usage, entretien, démontage et remplacement influencent les ressources consommées. Les données ne permettent pas de calculer un bilan environnemental complet.
      questions:
          - id: q01
            type: texte
            enonce: Quelle solution facilite l’accès au filtre ? Quel élément du document le montre ?
            aide: Cite une caractéristique, pas seulement une préférence.
          - id: q02
            type: texte
            enonce: Pourquoi la solution la moins chère à l’achat peut-elle devenir moins intéressante à l’usage ?
            aide: Pense aux interventions répétées.
    - id: a02
      titre: Faire, chercher et tester
      pourquoi: Mettre l’idée à l’épreuve plutôt que recopier une définition.
      demarche:
          - Repérer les pièces qui devront être entretenues dans ton schéma.
          - Dessiner une amélioration d’accès sans changer la fonction.
          - Comparer les deux solutions et préciser l’information qui manque pour estimer le coût sur plusieurs années.
      contenu:
          - type: paragraphe
            texte: "Travaille au brouillon, dans le logiciel ou sur le schéma. Garde une trace d’essai : situation, résultat attendu et observation. En binôme, échangez les rôles au milieu du travail."
      questions:
          - id: q01
            type: texte
            enonce: Décrire ton amélioration et expliquer comment elle facilite une opération précise.
            aide: Relie un détail de conception à un geste d’entretien.
      ressources:
          - type: paragraphe
            texte: Rechercher dans le guide la source, le convertisseur et une limite d’une énergie renouvelable.
          - type: lien
            titre: ADEME — Les clés de l’énergie
            url: https://mtaterre.fr/wp-content/uploads/2024/01/2024-01-cles-energie-guide-version-nationale.pdf
    - id: a03
      titre: Expliquer ce que le test permet de conclure
      pourquoi: Relier sa réponse à une donnée et préciser une limite.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Peut-on déclarer B meilleure pour l’environnement en toute situation avec ce seul tableau ?
            aide: Une caractéristique ne décrit pas tout le cycle de vie.
    - id: a04
      titre: Conserver et retenir
      pourquoi: Finir avec une trace réutilisable.
      demarche:
          - Vérifier le nom du projet ou de la trace.
          - Noter au brouillon une erreur corrigée ou une étape à reprendre.
      contenu: []
      questions: []
retenir:
    - Comparer des solutions sur leur cycle de vie.
    - Une exigence exprime ce que la solution doit respecter et comment on pourra le vérifier.
    - Le projet gère une eau non potable ; un aspect clair ou une mesure isolée ne garantit pas la potabilité.
bilan: Je conserve une trace qui montre ce que j’ai compris ou testé. Une erreur expliquée et corrigée est un progrès observable.
introduction:
    - type: paragraphe
      texte: "Objectif du jour : Comparer des solutions sur leur cycle de vie."
    - type: paragraphe
      texte: "Séance de 50 minutes de travail effectif : lire et comprendre, réaliser ou chercher, tester, puis faire un bilan. Les essais font partie du travail ; une version simple suffit pour commencer."
    - type: liste
      elements:
          - Une exigence exprime ce que la solution doit respecter et comment on pourra le vérifier.
          - Le programme reçoit des données et applique des règles ; il ne sait pas ce que les données ne décrivent pas.
          - Le projet gère une eau non potable ; un aspect clair ou une mesure isolée ne garantit pas la potabilité.
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
