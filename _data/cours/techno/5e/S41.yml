titre: Réparer la cuve plutôt que tout remplacer ?
theme: Concevoir une cuve intelligente simulée
problematique: Réparer la cuve plutôt que tout remplacer ?
pourquoi: Comparer des solutions sur leur cycle de vie.
application: "Réparer et remplacer une pièce peut prolonger la durée d’usage d’un objet."
lien_precedent: "Après S40 — Comment suivre les volumes de la cuve ?, nous poursuivons avec un seul objectif : comparer des solutions sur leur cycle de vie."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: tableau
            colonnes:
                - Solution fictive
                - Prix initial
                - Pièce usée remplaçable
                - Accès au filtre
            lignes:
                - - A
                  - 18 €
                  - Non
                  - Collé
                - - B
                  - 24 €
                  - Oui
                  - Trappe vissée
          - type: paragraphe
            texte: Le prix initial n’est pas la seule information. Durée d’usage, entretien, démontage et remplacement influencent les ressources consommées. Les données ne permettent pas de calculer un bilan environnemental complet.
          - type: paragraphe
            texte: "Exemple guidé : une cuve avec un filtre vissé permet de remplacer le filtre seul ; une cuve collée peut obliger à jeter davantage de pièces. Pour comparer leur durée de vie, je regarde les réparations possibles, pas seulement le prix d’achat."
      questions:
          - id: q01
            type: texte
            enonce: Quelle solution facilite l’accès au filtre ? Quel élément du document le montre ?
            aide: Cite une caractéristique, pas seulement une préférence.
          - id: q02
            type: texte
            enonce: Pourquoi la solution la moins chère à l’achat peut-elle devenir moins intéressante à l’usage ?
            aide: Pense aux interventions répétées.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - Repérer les pièces qui devront être entretenues dans ton schéma.
          - Dessiner une amélioration d’accès sans changer la fonction.
          - Comparer les deux solutions et préciser l’information qui manque pour estimer le coût sur plusieurs années.
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: Décrire ton amélioration et expliquer comment elle facilite une opération précise.
            aide: Relie un détail de conception à un geste d’entretien.
      ressources:
          - type: paragraphe
            texte: Rechercher dans le guide la source, le convertisseur et une limite d’une énergie renouvelable.
          - type: lien
            titre: ADEME — Les clés de l’énergie
            url: https://mtaterre.fr/wp-content/uploads/2024/01/2024-01-cles-energie-guide-version-nationale.pdf
    - id: a03
      titre: 3. Explique avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Peut-on déclarer B meilleure pour l’environnement en toute situation avec ce seul tableau ?
            aide: Une caractéristique ne décrit pas tout le cycle de vie.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Le cycle de vie comprend l’usage, l’entretien, la réparation et la fin de vie."
    - "Comparer des solutions sur leur cycle de vie."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Le cycle de vie comprend l’usage, l’entretien, la réparation et la fin de vie."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Comparer des solutions sur leur cycle de vie."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : Réparer et remplacer une pièce peut prolonger la durée d’usage d’un objet."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
