titre: Comment un bouton déclenche-t-il une action ?
theme: Comprendre et commander un monte-charge
problematique: Comment un bouton déclenche-t-il une action ?
pourquoi: Modifier un programme événementiel simple dans le simulateur.
application: "Les boutons, écrans et commandes déclenchent des actions dans les jeux et les objets du quotidien."
lien_precedent: "Après S12 — Qu’est-ce qui agit, qu’est-ce qui informe ?, nous poursuivons avec un seul objectif : modifier un programme événementiel simple dans le simulateur."
activites:
    - id: a01
      titre: 1. Repère les indices
      pourquoi: "Observe la situation et l’exemple guidé : ils montrent ce qu’il faut comprendre avant de commencer."
      demarche:
          - Lis la situation et repère les informations utiles.
          - Suis l’exemple guidé et repère la méthode utilisée.
          - Réponds aux questions en t’appuyant sur le cours.
      contenu:
          - type: paragraphe
            texte: "Dans le jeu de S10, un événement déclenchait une action. Ici nous utilisons le simulateur micro:bit : le bouton A représente une demande. Les LED représentent un état ; elles ne pilotent aucun moteur réel."
          - type: code
            texte: |-
                Au démarrage : afficher une croix
                Quand le bouton A est pressé : afficher une flèche vers le haut
          - type: paragraphe
            texte: "Exemple guidé : au démarrage, le simulateur affiche une croix. Quand on appuie sur A, il affiche une flèche. Le programme attend un événement (l’appui), puis lance une action (l’affichage). Sur notre monte-charge simulé, A représente une demande de montée."
      questions:
          - id: q01
            type: texte
            enonce: Quel événement représente la demande de montée ?
            aide: Un événement décrit ce qui déclenche une action.
          - id: q02
            type: texte
            enonce: Quelle image doit apparaître avant la demande ? Pourquoi ?
            aide: Relis le bloc au démarrage.
    - id: a02
      titre: 2. À toi de tester
      pourquoi: Tu viens de voir la méthode ; maintenant, applique-la dans un essai que tu peux vérifier.
      demarche:
          - Ouvrir MakeCode micro:bit et créer un projet nommé 5e_S13.
          - Dans Base et Entrée, reconstituer les deux événements du document.
          - Tester avant A, après A, puis après le redémarrage ; enregistrer le fichier du projet.
      contenu:
          - type: paragraphe
            texte: "Note une trace courte : ce que tu as fait, ce que tu attendais et ce que tu as observé."
      questions:
          - id: q01
            type: texte
            enonce: "Décrire tes trois essais : avant A, après A et après un redémarrage."
            aide: Pour chaque essai, distingue résultat attendu et résultat observé.
      ressources:
          - type: paragraphe
            texte: Dans la documentation, retrouver les blocs d’événement, variable et condition utilisés aujourd’hui.
          - type: lien
            titre: MakeCode micro:bit — Référence
            url: https://makecode.microbit.org/reference
          - type: lien
            titre: Ouvrir le simulateur MakeCode micro:bit
            url: https://makecode.microbit.org/
    - id: a03
      titre: 3. Explique avec une preuve
      pourquoi: Avant de conclure, relie ta réponse à une observation ou à une information précise.
      demarche:
          - Répondre en une à trois phrases.
          - Citer une observation, une règle ou une valeur du document.
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Une flèche s’affiche immédiatement sans appui sur A. Où chercher l’erreur dans le programme ?
            aide: Comparer l’événement qui contient chaque bloc.
    - id: a04
      titre: 4. Garde le mémo
      pourquoi: Garde une trace courte pour pouvoir réutiliser cette méthode dans une prochaine séance.
      demarche:
          - Relis les deux idées à retenir.
          - Note une méthode que tu pourras réutiliser.
      contenu: []
      questions: []
retenir:
    - "Un événement déclenche une action dans le programme."
    - "Modifier un programme événementiel simple dans le simulateur."
bilan: "Je peux expliquer avec mes mots ce que j’ai appris aujourd’hui et montrer une réponse ou un essai qui le prouve."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Un événement déclenche une action dans le programme."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Modifier un programme événementiel simple dans le simulateur."
    - type: paragraphe
      texte: "Tu vas observer une situation, suivre un exemple guidé, puis faire un essai et vérifier ce qu’il montre."
    - type: paragraphe
      texte: "À quoi cela sert dans la vie réelle : Les boutons, écrans et commandes déclenchent des actions dans les jeux et les objets du quotidien."
    - type: paragraphe
      texte: "Tu as environ 50 minutes : 10 minutes pour comprendre, 25 minutes pour faire, 10 minutes pour vérifier et 5 minutes pour le bilan."
reperes_officiels:
    - type: paragraphe
      texte: "Programme de Technologie du cycle 4, repères de 5e : cette séance contribue progressivement aux compétences ci-dessous ; elle ne prétend pas valider seule une compétence de fin de cycle."
    - type: lien
      titre: Ministère — Programme de Technologie 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
