titre: 'Séance 20 : Choisir et argumenter'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Quelle solution de cuve choisir pour le collège, et comment justifier ce choix ?
competences_bo:
    - Caractériser et choisir un objet ou un système technique selon différents critères
objectifs:
    connaissances:
        - Un choix argumenté s’appuie sur le cahier des charges, des critères chiffrés, le cycle de vie et les trois piliers du développement durable.
    competences:
        - Choisir une solution et l’argumenter (R19).
        - Tenir compte du cycle de vie.
pourquoi:
    - En séances 16 à 19, tu as étudié le besoin, le cahier des charges, les cuves existantes et leur bilan carbone.
    - Aujourd’hui, la classe choisit la base de son projet.
activites:
    -   id: a01
        titre: La grille de choix
        consigne: Tu vas départager les cuves A et B avec une grille de choix pondérée (documents 1 et 2). On attend le score de chaque cuve.
        contenu:
            -   type: tableau
                titre: Document 1 — Poids des critères décidés par la classe
                colonnes:
                    - Critère
                    - Poids
                lignes:
                    -   - Prix
                        - '3'
                    -   - Bilan carbone
                        - '3'
                    -   - Installation simple
                        - '2'
                    -   - Durée de vie
                        - '1'
            -   type: tableau
                titre: Document 2 — Notes des cuves
                colonnes:
                    - Critère
                    - Cuve A
                    - Cuve B
                lignes:
                    -   - Prix (note /5)
                        - '5'
                        - '1'
                    -   - Bilan carbone (/5)
                        - '5'
                        - '2'
                    -   - Installation (/5)
                        - '5'
                        - '1'
                    -   - Durée de vie (/5)
                        - '3'
                        - '5'
            -   type: etapes
                elements:
                    - Lis les poids des critères décidés par la classe (document 1).
                    - Lis les notes des cuves (document 2).
                    - 'Pour chaque cuve : multiplie chaque note par son poids, puis additionne.'
            -   type: paragraphe
                texte: 'Pourquoi des poids ? Tous les critères ne comptent pas autant : le prix et le bilan carbone comptent ici trois fois plus que la durée de vie.'
        questions:
            -   id: q01
                type: nombre
                enonce: D’après les documents 1 et 2, calcule le score pondéré de la cuve A (note × poids, additionnés).
                unite: points
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: nombre
                enonce: Calcule de même le score pondéré de la cuve B.
                unite: points
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a02
        titre: Argumenter le choix
        transition: Les scores sont calculés. Argumente le choix.
        consigne: Tu vas rédiger l’argumentation du choix de la cuve, avec les chiffres des séances 18 à 20. On attend une argumentation en trois temps avec au moins deux chiffres.
        contenu:
            -   type: etapes
                elements:
                    - Reprends les scores, le bilan carbone (séance 19) et les prix (séance 18).
                    - Écris « J’affirme que… », puis « D’après… » avec au moins deux chiffres, puis « Donc… ».
                    - Relis-toi.
            -   type: paragraphe
                texte: 'Pourquoi des chiffres ? Une argumentation chiffrée se vérifie : c’est ce qui la rend convaincante.'
        questions:
            -   id: q01
                type: texte
                enonce: Argumente en trois temps (R19) le choix de la cuve pour le collège, avec au moins deux chiffres des séances 18 à 20.
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a03
        titre: Les limites du choix
        transition: Le choix est argumenté. A-t-il des faiblesses ?
        consigne: Tu vas repérer une limite de la cuve choisie et proposer comment le projet peut la compenser. On attend une limite et une compensation.
        contenu:
            -   type: etapes
                elements:
                    - Regarde les critères où la cuve choisie est moins bonne.
                    - Imagine ce que le projet peut faire pour compenser.
                    - Écris la limite et sa compensation.
            -   type: paragraphe
                texte: 'Pourquoi parler des limites ? Un choix honnête reconnaît ses faiblesses : c’est ce qu’attend un jury de soutenance.'
        questions:
            -   id: q01
                type: texte
                enonce: Quelle limite a le choix de la cuve A ? Comment le projet peut-il la compenser ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Si la classe change les poids, le choix peut changer.
        questions:
            -   id: q01
                type: texte
                enonce: Quels poids feraient gagner la cuve B ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Le choix est fait. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quelle solution de cuve choisir pour le collège, et comment la justifier ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Choix argumenté : grille pondérée, chiffres, cycle de vie, R19.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
