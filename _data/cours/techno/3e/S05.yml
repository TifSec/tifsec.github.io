titre: Comment vérifier les performances d'une solution technique ?
theme: "Création, conception, réalisation, innovations : des objets à concevoir et à réaliser"
problematique: Comment savoir si une solution technique respecte réellement les performances attendues ?
pourquoi: "Objectif de cette séance : Une performance doit pouvoir être associée à une grandeur mesurable ou vérifiable."
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Une performance doit pouvoir être associée à une grandeur mesurable ou vérifiable.
        - Une exigence permet de déterminer si une performance est suffisante.
        - Une seule mesure peut être insuffisante pour caractériser correctement une performance.
        - Un protocole expérimental précise les conditions dans lesquelles les mesures sont réalisées.
        - Pour comparer plusieurs solutions, les essais doivent être réalisés dans des conditions comparables.
    competences: []
activites:
    - id: a05
      titre: Production attendue
      contenu:
          - type: liste
            elements:
                - Un fichier LibreOffice Writer nommé 3e_S05_nom.odt.
                - L'analyse des performances de deux prototypes d'éoliennes.
                - Les calculs de moyenne.
                - Une conclusion sur la validation des prototypes.
                - Un protocole expérimental pour comparer plusieurs rotors.
          - type: paragraphe
            texte: Le fichier devra être déposé en fin de séance, même s'il n'est pas entièrement terminé.
      questions: []
    - id: a06
      titre: 1. Préparez votre document de travail
      contenu:
          - type: paragraphe
            texte: Ouvrez LibreOffice Writer.
          - type: paragraphe
            texte: Créez un nouveau document.
          - type: paragraphe
            texte: "Enregistrez-le immédiatement sous le nom : 3e_S05_nom.odt."
      questions:
          - id: q01
            type: texte
            enonce: "Écrivez votre nom, votre prénom et le titre : Séance 5 – Comment vérifier les performances d'une solution technique ?"
            suite: []
    - id: a07
      titre: 2. Comment savoir si une éolienne est suffisamment performante ?
      contenu:
          - type: paragraphe
            texte: Une entreprise souhaite choisir une petite éolienne destinée à alimenter un dispositif électronique.
          - type: paragraphe
            texte: Deux prototypes, A et B, sont disponibles.
      questions:
          - id: q01
            type: texte
            enonce: "Q1 : Peut-on choisir la meilleure éolienne simplement en la regardant ? Pourquoi ?"
            suite:
                - type: titre
                  texte: Le cahier des charges
                - type: paragraphe
                  texte: "Pour cet exercice, l'entreprise fixe les exigences suivantes :"
                - type: tableau
                  colonnes:
                      - Critère
                      - Exigence
                  lignes:
                      - - Puissance électrique produite
                        - Au moins 3 W
                      - - Niveau sonore
                        - Inférieur à 50 dB
                      - - Masse
                        - Inférieure à 500 g
                - type: paragraphe
                  texte: "Important : ces valeurs constituent un cahier des charges fictif créé pour l'activité. Elles ne correspondent pas à des exigences universelles applicables à toutes les éoliennes."
                - type: paragraphe
                  texte: "Pour mieux comprendre le fonctionnement général d'une éolienne, vous pouvez consulter :"
                - type: paragraphe
                  texte: ADEME – Le défi éolien en 10 questions
                - type: lien
                  titre: ADEME – Le défi éolien en 10 questions
                  url: https://agirpourlatransition.ademe.fr/acteurs-education/enseigner/catalogue/defi-eolien-10-questions
    - id: a08
      titre: 3. Une seule mesure suffit-elle ?
      contenu:
          - type: paragraphe
            texte: Les deux prototypes sont testés dans les mêmes conditions.
          - type: tableau
            colonnes:
                - Mesure
                - Éolienne A
                - Éolienne B
            lignes:
                - - Puissance - essai 1
                  - 2,6 W
                  - 3,2 W
                - - Puissance - essai 2
                  - 2,8 W
                  - 3,1 W
                - - Puissance - essai 3
                  - 2,7 W
                  - 3,3 W
                - - Niveau sonore
                  - 45 dB
                  - 54 dB
                - - Masse
                  - 320 g
                  - 410 g
      questions:
          - id: q01
            type: texte
            enonce: "Q2 : Pourquoi a-t-on réalisé trois mesures de puissance au lieu d'une seule ?"
          - id: q02
            type: texte
            enonce: "Q3 : Les trois mesures d'une même éolienne sont-elles exactement identiques ? Que peut-on faire pour obtenir une valeur représentative ?"
            suite:
                - type: titre
                  texte: "Mise en commun : la moyenne"
                - type: paragraphe
                  texte: "Lorsqu'une même grandeur est mesurée plusieurs fois, on peut calculer une moyenne :"
                - type: paragraphe
                  texte: Moyenne = somme des mesures ÷ nombre de mesures
                - type: paragraphe
                  texte: Calculez maintenant la puissance moyenne des deux prototypes.
    - id: a09
      titre: 4. Les performances respectent-elles les exigences ?
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: "Q4 : Relevez dans le cahier des charges la puissance minimale exigée."
          - id: q02
            type: texte
            enonce: "Q5 : Pour chaque prototype, comparez la puissance moyenne obtenue à l'exigence."
            suite:
                - type: paragraphe
                  texte: "Utilisez la structure :"
                - type: paragraphe
                  texte: Valeur mesurée → comparaison → conclusion
          - id: q03
            type: texte
            enonce: "Q6 : Vérifiez maintenant les trois exigences pour les deux prototypes."
          - id: q04
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - ""
                - Puissance
                - Bruit
                - Masse
                - Prototype validé ?
            lignes:
                - - Éolienne A
                  - ""
                  - ""
                  - ""
                  - ""
                - - Éolienne B
                  - ""
                  - ""
                  - ""
                  - ""
            suite:
                - type: titre
                  texte: "Mise en commun : mesurer une performance"
                - type: paragraphe
                  texte: Une solution technique peut être validée lorsque ses performances mesurées respectent les exigences définies.
                - type: paragraphe
                  texte: "Une mesure seule n'est donc pas suffisante : il faut savoir quoi mesurer, dans quelles conditions et à quoi comparer le résultat."
    - id: a10
      titre: 5. Comment comparer correctement plusieurs rotors ?
      contenu:
          - type: paragraphe
            texte: L'entreprise souhaite maintenant étudier l'influence du nombre de pales sur la performance d'une petite éolienne.
          - type: paragraphe
            texte: "Elle dispose :"
          - type: liste
            elements:
                - du même générateur électrique ;
                - de rotors comportant 3, 4 et 5 pales identiques ;
                - d'un ventilateur ;
                - d'un appareil permettant de mesurer la tension ou la puissance produite.
      questions:
          - id: q01
            type: texte
            enonce: "Q7 : Quelle est la seule caractéristique du rotor que nous voulons modifier pendant l'expérience ?"
          - id: q02
            type: texte
            enonce: "Q8 : Quelles conditions doivent rester identiques pour que la comparaison soit correcte ?"
            suite:
                - type: paragraphe
                  texte: Proposez au moins quatre conditions.
                - type: paragraphe
                  texte: "Si vous avez besoin d'aide, réfléchissez à :"
                - type: titre
                  texte: Indice 1
                - type: paragraphe
                  texte: Le ventilateur doit-il être placé à la même distance pour tous les essais ?
                - type: titre
                  texte: Indice 2
                - type: paragraphe
                  texte: Peut-on changer la vitesse du ventilateur entre deux rotors ?
                - type: titre
                  texte: Indice 3
                - type: paragraphe
                  texte: Doit-on utiliser le même moteur/générateur pour tous les essais ?
    - id: a11
      titre: 6. Construisez votre protocole expérimental
      contenu:
          - type: paragraphe
            texte: Vous devez maintenant proposer un protocole qui pourra réellement être utilisé lors de la prochaine séance.
          - type: paragraphe
            texte: "Complétez :"
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Élément du protocole
                - Votre proposition
            lignes:
                - - Paramètre modifié
                  - ""
                - - Grandeur mesurée
                  - ""
                - - Conditions maintenues identiques
                  - ""
                - - Nombre de mesures par rotor
                  - ""
                - - Résultat à calculer
                  - ""
            suite:
                - type: paragraphe
                  texte: Écrivez ensuite votre protocole sous forme d'une liste numérotée.
    - id: a12
      titre: 7. Une expérience peut-elle donner une conclusion trompeuse ?
      contenu:
          - type: paragraphe
            texte: "Un groupe réalise les essais suivants :"
          - type: liste
            elements:
                - "rotor à 3 pales : ventilateur placé à 30 cm ;"
                - "rotor à 4 pales : ventilateur placé à 50 cm ;"
                - "rotor à 5 pales : ventilateur placé à 1 m."
      questions:
          - id: q01
            type: texte
            enonce: "Q9 : Peut-on utiliser les résultats pour déterminer quel nombre de pales est le plus performant ? Justifiez."
    - id: a13
      titre: 8. Conclusion du travail
      contenu:
          - type: paragraphe
            texte: "Complétez :"
          - type: liste
            elements:
                - Pour vérifier une performance, il faut ................................................................................ .
                - Une exigence permet de ..................................................................................................... .
                - Pour comparer plusieurs solutions, il faut ............................................................................. .
                - Répéter une mesure permet de ............................................................................................. .
                - Un protocole expérimental sert à .......................................................................................... .
          - type: paragraphe
            texte: "Répondez maintenant à la problématique en 4 à 6 lignes :"
          - type: paragraphe
            texte: Comment savoir si une solution technique respecte réellement les performances attendues ?
      questions: []
    - id: a14
      titre: Rendu attendu
      contenu:
          - type: paragraphe
            texte: À la fin de la séance, déposez 3e_S05_nom.odt.
          - type: paragraphe
            texte: Le fichier doit être rendu même si toutes les activités ne sont pas terminées.
      questions: []
    - id: a15
      titre: À retenir
      contenu:
          - type: paragraphe
            texte: Une performance doit être mesurée puis comparée à une exigence.
          - type: paragraphe
            texte: Pour comparer plusieurs solutions, il faut utiliser un protocole commun, conserver les mêmes conditions et ne modifier que le paramètre étudié.
          - type: paragraphe
            texte: Réaliser plusieurs mesures puis calculer une valeur représentative permet généralement d'obtenir une comparaison plus fiable.
      questions: []
    - id: a16
      titre: Sources générales
      contenu:
          - type: liste
            elements:
                - Ministère de l'Éducation nationale – Programme de technologie du cycle 4
                - Éduscol – Ressources d'accompagnement du programme de technologie
          - type: lien
            titre: Programme de technologie du cycle 4
            url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
          - type: lien
            titre: Ressources d'accompagnement du programme de technologie
            url: https://eduscol.education.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
introduction:
    - type: titre
      texte: "Compétence visée : Mesurer, comparer et interpréter des performances pour valider une solution technique"
    - type: titre
      texte: Objectifs d’apprentissage
    - type: paragraphe
      texte: "Ce que les élèves vont apprendre :"
    - type: liste
      elements:
          - Une performance doit pouvoir être associée à une grandeur mesurable ou vérifiable.
          - Une exigence permet de déterminer si une performance est suffisante.
          - Une seule mesure peut être insuffisante pour caractériser correctement une performance.
          - Un protocole expérimental précise les conditions dans lesquelles les mesures sont réalisées.
          - Pour comparer plusieurs solutions, les essais doivent être réalisés dans des conditions comparables.
    - type: paragraphe
      texte: "Ce qu'ils vont apprendre à faire :"
    - type: liste
      elements:
          - Extraire une information d'un dossier technique.
          - Calculer et interpréter une moyenne.
          - Comparer une mesure à une exigence.
          - Justifier la validation ou le refus d'une solution.
          - Proposer un protocole expérimental permettant de comparer plusieurs solutions.
