titre: "Ancien essai court — protéger l’accès à ses comptes"
theme: "Les objets et les systèmes techniques : leurs usages et leurs interactions"
problematique: "Comment utiliser un service en ligne sans donner accès à son compte à une autre personne ?"
pourquoi: "Un réseau peut fonctionner correctement alors qu’un utilisateur se fait tromper. Nous allons apprendre à choisir une réaction et à l’expliquer, plutôt qu’à mémoriser une liste de dangers."
application: "Ces réflexes servent pour l’ENT, une messagerie, un jeu en ligne ou un réseau social. Nous travaillons uniquement sur des situations inventées : ne saisis jamais un vrai mot de passe ni un code personnel dans tes réponses."
lien_precedent: "En S09, vous avez étudié comment des réseaux communiquent. Rappelle oralement le rôle du routeur. Puis discutez : pouvoir joindre un service prouve-t-il que la personne qui demande à se connecter est autorisée ? Si les réseaux restent difficiles, le professeur reprend un exemple avant de poursuivre."
prerequis:
    - "Un service en ligne échange des données par un réseau."
    - "Pour cette séance, aucune configuration réseau ni création de compte n’est nécessaire."
objectifs:
    connaissances:
        - "Un identifiant et un moyen d’authentification n’ont pas le même rôle."
        - "La protection d’un compte combine des moyens techniques et des choix de l’utilisateur."
        - "Une demande urgente peut chercher à nous faire agir sans vérifier."
    competences:
        - "Choisir des protections adaptées et expliquer leur utilité."
        - "Repérer des indices dans un message et vérifier par un autre chemin."
        - "Proposer des actions dans un ordre utile lorsqu’un compte est menacé."
notions:
    - titre: "Indiquer son identité et la vérifier"
      texte: "Un identifiant indique le compte demandé : par exemple un nom d’utilisateur. L’authentification sert à vérifier le droit d’utiliser ce compte, par exemple avec un mot de passe. Connaître un identifiant ne donne donc pas, à lui seul, le droit d’entrer."
    - titre: "Plusieurs protections se complètent"
      texte: "Un mot de passe long et difficile à deviner doit être différent pour chaque service. Un gestionnaire de mots de passe peut aider. Quand elle est proposée, la double authentification ajoute une vérification : par exemple un code temporaire sur un appareil que l’on possède. Ce code reste secret et cette protection ne rend pas toutes les tromperies impossibles."
    - titre: "Prendre le temps de vérifier"
      texte: "L’hameçonnage est une tromperie qui cherche à obtenir des informations ou une action en imitant un service connu. Une urgence, un logo ou le nom affiché de l’expéditeur ne prouvent pas l’origine du message. En cas de doute, ouvre toi-même l’application habituelle ou contacte le service par un moyen déjà connu. Sur un ordinateur partagé, déconnecte ton compte après usage."
activites:
    - id: "a01"
      titre: "Choisir comment protéger un compte"
      pourquoi: "Comprendre ce que chaque protection apporte, pour ne pas compter sur une seule précaution."
      demarche:
          - "Lis les repères. Explique oralement à ton voisin la différence entre identifiant et authentification."
          - "Réponds au choix proposé, puis explique les deux protections de la situation suivante en deux à quatre phrases."
          - "En groupe, chacun doit pouvoir expliquer l’une des protections ; une seule réponse commune est enregistrée."
      questions:
          - id: "q01"
            type: "qcm"
            enonce: "Sam saisit son nom d’utilisateur puis un code secret pour accéder à son compte. Quel élément sert à vérifier son droit d’accès ?"
            choix:
                - id: "identifiant"
                  texte: "Le nom d’utilisateur seul."
                - id: "code"
                  texte: "Le code secret."
                - id: "reseau"
                  texte: "Le fait d’avoir une connexion à Internet."
          - id: "q02"
            type: "texte"
            enonce: "Un mot de passe utilisé sur un jeu a été volé. Alex utilise un mot de passe différent pour sa messagerie et y a activé la double authentification. Explique ce que chacune de ces deux précautions apporte à sa messagerie."
            aide: "Fais deux phrases : « Un mot de passe différent sert à… » puis « La deuxième vérification sert à… ». Aucune protection ne garantit un risque nul."
    - id: "a02"
      titre: "Examiner une demande inhabituelle"
      pourquoi: "Apprendre à justifier un doute et à vérifier sans utiliser le chemin proposé par le message."
      consigne: "Message fictif, sans lien à ouvrir : « Assistance de ton ENT — Ton compte sera supprimé dans dix minutes. Pour le conserver, réponds immédiatement avec ton mot de passe et le code reçu sur ton téléphone. Ne contacte pas le collège : cela retarderait la vérification. »"
      demarche:
          - "Lis silencieusement le message. Repère ce qu’il demande de faire et ce qui pousse à se dépêcher."
          - "Compare tes observations avec ton voisin avant de rédiger. Explique tes indices avec tes mots."
          - "Si tu hésites, demande au professeur la ressource officielle sur l’hameçonnage. Cherche seulement comment vérifier une demande, puis reviens à la situation."
      questions:
          - id: "q01"
            type: "texte"
            enonce: "Relève deux indices différents qui doivent t’alerter, explique pourquoi, puis propose un moyen de vérifier la demande sans y répondre. Quatre à cinq phrases suffisent."
            aide: "Tu peux observer le délai, les informations demandées ou la consigne de ne contacter personne. Pour vérifier, cherche un chemin que tu connaissais avant ce message."
          - id: "q02"
            type: "qcm"
            enonce: "Un autre message affiche le vrai logo du collège et ne contient aucune faute. Que peux-tu en conclure ?"
            choix:
                - id: "certain"
                  texte: "Il vient forcément du collège."
                - id: "verifier"
                  texte: "Cela ne suffit pas : je dois encore vérifier une demande inhabituelle par un moyen connu."
                - id: "faux"
                  texte: "Il est forcément frauduleux parce qu’il ne contient aucune faute."
    - id: "a03"
      titre: "Réagir et expliquer"
      pourquoi: "Transformer les précautions du cours en une courte démarche utilisable dans une situation nouvelle."
      demarche:
          - "Imagine les premières actions utiles, sans ouvrir de compte réel ni modifier tes réglages personnels."
          - "Écris trois étapes numérotées et explique brièvement leur utilité. Relis ensuite les réponses de la séance."
      questions:
          - id: "q01"
            type: "texte"
            enonce: "Lou a communiqué le mot de passe de l’ENT à un faux service d’assistance. Lou peut encore ouvrir l’application habituelle. Propose trois actions utiles, dans un ordre cohérent, pour demander de l’aide et protéger le compte. Explique à quoi sert chaque action."
            aide: "Pense à qui prévenir, au chemin sûr pour accéder au compte et à ce qui permettrait à l’intrus de continuer à l’utiliser. Si le compte n’est plus accessible, l’assistance de l’établissement est nécessaire."
    - id: "a04"
      titre: "Pour aller plus loin, si tu as terminé"
      facultatif: true
      pourquoi: "Réutiliser les réflexes dans une autre situation, sans ajouter de travail obligatoire."
      demarche:
          - "Imagine oralement une demande inhabituelle dans un jeu en ligne, sans utiliser de données personnelles."
          - "Demande à un camarade quel indice il vérifierait et par quel autre chemin."
      questions: []
retenir:
    - "Un identifiant désigne le compte ; l’authentification vérifie le droit d’y accéder."
    - "Des mots de passe différents et une deuxième vérification protègent de façons complémentaires."
    - "Face à une demande inhabituelle, je prends le temps de vérifier par un moyen connu."
bilan: "Sans recopier les repères, explique oralement un réflexe que tu pourrais utiliser et ce qu’il protège. Indique ensuite au professeur ce qui reste difficile."
