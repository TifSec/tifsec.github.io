titre: 'Séance 10 : Comment l’ordinateur écrit-il un mot ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Comment un ordinateur représente-t-il des nombres et des lettres avec seulement des 0 et des 1 ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - 'Un bit vaut 0 ou 1. En binaire, chaque position vaut le double de la précédente : 1, 2, 4, 8, 16, 32, 64, 128. Exemple : 1010 en binaire = 8 + 2 = 10.'
        - 'Le code ASCII associe un nombre à chaque caractère : A = 65, B = 66… ; a = 97.'
    competences:
        - Convertir un nombre binaire en décimal (et inversement, petits nombres).
        - Coder un mot avec le code ASCII.
pourquoi:
    - En 5e, tu as vu les octets et les tailles de fichiers.
    - Aujourd’hui, tu découvres comment les 0 et les 1 deviennent des nombres et des lettres.
activites:
    -   id: a01
        titre: Le binaire
        contenu:
            -   type: tableau
                titre: 'Exemple expliqué : 00001010 = 8 + 2 = 10'
                colonnes:
                    - '128'
                    - '64'
                    - '32'
                    - '16'
                    - '8'
                    - '4'
                    - '2'
                    - '1'
                lignes:
                    -   - '0'
                        - '0'
                        - '0'
                        - '0'
                        - '1'
                        - '0'
                        - '1'
                        - '0'
        questions:
            -   id: q01
                type: nombre
                enonce: Que vaut 00000101 en décimal ?
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: nombre
                enonce: Que vaut 00001111 en décimal ?
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q03
                type: texte
                enonce: Écris 12 en binaire sur 8 bits et explique ta méthode.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a02
        titre: Le code ASCII
        transition: Les nombres sont codés. Et les lettres ?
        contenu:
            -   type: tableau
                titre: Document 1 — Extrait de la table ASCII
                colonnes:
                    - Caractère
                    - A
                    - B
                    - C
                    - E
                    - O
                    - T
                lignes:
                    -   - Code
                        - '65'
                        - '66'
                        - '67'
                        - '69'
                        - '79'
                        - '84'
        questions:
            -   id: q01
                type: tableau
                enonce: Code le mot « EAU » en ASCII.
                colonnes:
                    - Lettre
                    - Code
                lignes:
                    -   - E
                        - ''
                    -   - A
                        - ''
                    -   - U (code 85)
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
            -   id: q02
                type: texte
                enonce: Décode le message 84 79 84 79 avec le document 1.
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un octet = 8 bits.
        questions:
            -   id: q01
                type: texte
                enonce: Combien de valeurs différentes un octet peut-il représenter ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais coder en binaire. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment un ordinateur représente-t-il nombres et lettres avec des 0 et des 1 ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Binaire : positions 1, 2, 4, 8, 16, 32, 64, 128.'
    - 'ASCII : un code par caractère (A = 65).'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
