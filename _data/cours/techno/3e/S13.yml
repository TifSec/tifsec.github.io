titre: 'Séance 13 : Bilan et entraînement au brevet n° 2 : le réseau et les données'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Suis-je capable d’expliquer le trajet et le codage des données sur un dossier de type brevet ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - Internet, routage, binaire, numérisation.
    competences:
        - Soigner la langue (R20).
        - Utiliser les réflexes de calcul et de lecture.
pourquoi:
    - Depuis la séance 8, tu as étudié Internet et le codage.
    - Aujourd’hui, un dossier de type brevet sur la caméra d’un jardin partagé (inventé).
activites:
    -   id: a01
        titre: Calculer la taille des photos
        consigne: 'Tu vas t’entraîner au brevet sur un dossier : la caméra d’un jardin partagé (documents 1 et 2, situation inventée). Partie 1 : on attend la taille d’une photo avant et après compression, avec l’unité.'
        contenu:
            -   type: citation
                texte: 'Réflexe brevet n° 20 : je soigne la langue : vocabulaire technique exact, phrases relues.'
            -   type: titre
                texte: Document 1 — La caméra du jardin partagé (situation inventée)
            -   type: citation
                texte: Une caméra prend une photo de 1 000 × 800 pixels toutes les 10 minutes et l’envoie par Wi-Fi à la box, puis par Internet au serveur de l’association. Les photos sont compressées en JPEG (environ 10 fois plus légères).
            -   type: tableau
                titre: Document 2 — Table de routage de la box
                colonnes:
                    - Destination
                    - Sortie
                lignes:
                    -   - Réseau de l’association
                        - Sortie 2
                    -   - Autre
                        - Sortie 1
            -   type: etapes
                elements:
                    - Lis tout le dossier une première fois.
                    - 'Calcule la taille d’une photo : pixels × 3 octets (séance 11).'
                    - Divise par 10 pour la compression.
                    - Écris l’unité à chaque résultat.
            -   type: paragraphe
                texte: 'Pourquoi l’unité ? Au brevet, un résultat sans unité est incomplet : c’est un point perdu facilement.'
        questions:
            -   id: q01
                type: nombre
                enonce: D’après le document 1, quelle est la taille d’une photo de la caméra non compressée (3 octets par pixel) ?
                unite: octets
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: nombre
                enonce: Quelle est la taille de cette photo après compression JPEG (environ 10 fois moins) ?
                unite: octets
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a02
        titre: Le trajet des photos
        transition: Les tailles sont calculées. Suis maintenant le trajet des photos.
        consigne: 'Partie 2 du dossier : tu vas décrire le trajet d’une photo de la caméra jusqu’au serveur, avec la table de routage du document 2. On attend la bonne sortie et un trajet décrit avec le vocabulaire exact.'
        contenu:
            -   type: etapes
                elements:
                    - 'Relis le document 1 : par où passe la photo ?'
                    - Lis la table de routage de la box (document 2).
                    - 'Décris le trajet avec le vocabulaire exact : Wi-Fi, box, routeur, Internet, serveur, paquets (R20).'
            -   type: paragraphe
                texte: 'Pourquoi le vocabulaire exact ? Au brevet, la maîtrise de la langue est notée : « la box » ou « le routeur », pas « le truc ».'
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 2, par quelle sortie la box envoie-t-elle la photo vers le serveur de l’association ?
                choix:
                    -   id: a
                        texte: Sortie 2
                    -   id: b
                        texte: Sortie 1
                    -   id: c
                        texte: Aucune
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: D’après le document 1, décris le trajet d’une photo, de la caméra au serveur de l’association, avec le vocabulaire exact (R20).
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
    -   id: a03
        titre: Compter et relire
        transition: Termine le dossier, puis relis-toi.
        consigne: 'Partie 3 du dossier : tu vas calculer le nombre de photos par jour, puis relire tout ton travail (R16, R20). On attend un résultat avec son unité et une correction précise.'
        contenu:
            -   type: etapes
                elements:
                    - Calcule le nombre de photos par jour (une toutes les 10 minutes).
                    - 'Relis toutes tes réponses : unités, vocabulaire (R16, R20).'
                    - Note une correction faite en te relisant.
            -   type: paragraphe
                texte: 'Pourquoi garder du temps pour relire ? Les dernières minutes servent à corriger les unités et les mots : ce sont des points faciles.'
        questions:
            -   id: q01
                type: nombre
                enonce: D’après le document 1, combien de photos la caméra prend-elle par jour (24 h) ?
                unite: photos
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: texte
                enonce: En relisant ton dossier sur la caméra, quel mot technique ou quelle unité as-tu corrigé ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Les photos sont gardées 30 jours.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle place occupent-elles sur le serveur (compressées) ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Fais le point.
        questions:
            -   id: q01
                type: texte
                enonce: Quel point dois-tu revoir (routage, binaire, calcul de taille) ? Comment vas-tu le travailler ?
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'R20 : vocabulaire exact, phrases relues.'
    - Taille d’image = pixels × 3 octets ; compression.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
