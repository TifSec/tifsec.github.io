titre: 'Séance 13 : Bilan et entraînement au brevet n° 2 : le réseau et les données'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Suis-je capable d’expliquer le trajet et le codage des données sur un dossier de type brevet ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - Internet, routage, binaire, numérisation.
    competences:
        - Soigner la langue (R20).
        - Utiliser les réflexes de calcul et de lecture.
pourquoi:
    - Depuis la séance 8, tu as étudié Internet et le codage.
    - Aujourd’hui, un dossier sur une caméra de surveillance d’un jardin partagé (inventé).
activites:
    -   id: a01
        titre: Le dossier
        contenu:
            -   type: citation
                texte: 'Réflexe brevet n° 20 : je soigne la langue : vocabulaire technique exact, phrases relues.'
            -   type: titre
                texte: Document 1
            -   type: citation
                texte: Une caméra prend une photo de 1 000 × 800 pixels toutes les 10 minutes et l’envoie par Wi-Fi à la box, puis par Internet au serveur de l’association. Les photos sont compressées en JPEG (environ 10 fois plus légères).
            -   type: tableau
                titre: Document 2 — Table de routage de la box
                colonnes:
                    - Destination
                    - Sortie
                lignes:
                    -   - Réseau de l’association
                        - Sortie 2
                    -   - Autre
                        - Sortie 1
        questions:
            -   id: q01
                type: nombre
                enonce: Quelle est la taille d’une photo non compressée (3 octets par pixel) ?
                unite: octets
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: nombre
                enonce: Quelle est sa taille après compression (environ 10 fois moins) ?
                unite: octets
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q03
                type: qcm
                enonce: D’après le document 2, par quelle sortie la box envoie-t-elle la photo vers le serveur de l’association ?
                choix:
                    -   id: a
                        texte: Sortie 2
                    -   id: b
                        texte: Sortie 1
                    -   id: c
                        texte: Aucune
                aide: Élimine d’abord les réponses impossibles.
            -   id: q04
                type: texte
                enonce: Décris le trajet d’une photo, de la caméra au serveur, avec le vocabulaire exact (R20).
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
            -   id: q05
                type: nombre
                enonce: Combien de photos par jour (24 h) ?
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a02
        titre: Je relis (R16, R20)
        transition: Relis-toi.
        questions:
            -   id: q01
                type: texte
                enonce: Quel mot technique as-tu corrigé ou précisé en te relisant ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Les photos sont gardées 30 jours.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle place occupent-elles (compressées) ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Fais le point.
        questions:
            -   id: q01
                type: texte
                enonce: Quel point dois-tu revoir (routage, binaire, calcul de taille) ?
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'R20 : vocabulaire exact, phrases relues.'
    - Taille d’image = pixels × 3 octets ; compression.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
