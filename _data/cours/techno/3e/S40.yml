titre: 'Séance 40 : Bilan et entraînement au brevet n° 4 : algorithme et programme'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Suis-je capable de concevoir un algorithme et de compléter un programme ?
competences_bo:
    - Comprendre et modifier un programme associé à une fonctionnalité d’un objet ou d’un système technique
    - Concevoir, écrire, tester et mettre au point un programme
objectifs:
    connaissances:
        - Algorithme, fonctions, programme à compléter.
    competences:
        - Utiliser R12, R13.
pourquoi:
    - Depuis la séance 35, tu as programmé la cuve.
    - 'Aujourd’hui : un dossier de type brevet sur l’éclairage automatique d’un couloir (inventé).'
activites:
    -   id: a01
        titre: Compléter le programme
        consigne: 'Tu vas t’entraîner au brevet sur un dossier : l’éclairage automatique d’un couloir (documents 1 et 2, situation inventée). Partie 1 : on attend les deux trous du programme complétés.'
        contenu:
            -   type: titre
                texte: Document 1 — L’éclairage automatique d’un couloir (situation inventée)
            -   type: citation
                texte: Un détecteur de présence et un capteur de lumière. Si quelqu’un passe ET qu’il fait sombre (lumière < 50), la lampe s’allume pendant 2 minutes. Une fonction « allumer » gère l’allumage et la minuterie.
            -   type: titre
                texte: Document 2 — Programme incomplet
            -   type: code
                texte: "toujours\n    si presence ET ……… alors\n        appeler allumer\n\nfonction allumer\n    lampe ON\n    pause ………\n    lampe OFF"
            -   type: etapes
                elements:
                    - Lis le document 1 en entier.
                    - Compare le programme (document 2) avec ce qu’il doit faire (R13).
                    - Pour la pause, convertis 2 minutes en millisecondes (1 s = 1 000 ms).
            -   type: paragraphe
                texte: 'Pourquoi convertir ? Les cartes programmables comptent le temps en millisecondes : 2 « minutes » écrit tel quel serait faux.'
        questions:
            -   id: q01
                type: tableau
                enonce: Complète les deux trous du programme de l’éclairage du couloir (document 2).
                colonnes:
                    - Trou
                    - À écrire
                lignes:
                    -   - Condition
                        - ''
                    -   - Durée de la pause (en ms)
                        - ''
                aide: Bloc par bloc (réflexe n° 9).
    -   id: a02
        titre: Algorithme et fonction
        transition: Le programme est complet. Écris l’algorithme.
        consigne: 'Partie 2 du dossier : tu vas écrire l’algorithme de l’éclairage et expliquer l’intérêt de la fonction « allumer ». On attend un algorithme complet et une explication.'
        contenu:
            -   type: etapes
                elements:
                    - Écris l’algorithme complet en langage naturel (R12).
                    - Explique pourquoi « allumer » est une fonction.
                    - Pense à ce que tu as fait en séance 29.
            -   type: paragraphe
                texte: Pourquoi une fonction ici ? L’allumage avec minuterie pourra servir pour d’autres détecteurs sans être réécrit.
        questions:
            -   id: q01
                type: texte
                enonce: Écris l’algorithme complet de l’éclairage du couloir en langage naturel.
                aide: Combien d’éléments sont demandés ?
            -   id: q02
                type: texte
                enonce: D’après le document 1, pourquoi le programmeur a-t-il utilisé une fonction « allumer » ?
                aide: Bloc par bloc (réflexe n° 9).
    -   id: a03
        titre: Tester et relire
        transition: Termine le dossier, puis relis-toi.
        consigne: 'Partie 3 du dossier : tu vas proposer un test à la valeur limite, puis relire ton travail. On attend un test avec son résultat attendu et une correction précise.'
        contenu:
            -   type: etapes
                elements:
                    - Propose un test à la valeur limite (R15).
                    - Relis toutes tes réponses (R16).
                    - Note une correction.
            -   type: paragraphe
                texte: Pourquoi la valeur limite ? Au brevet, on demande souvent « que se passe-t-il si la lumière vaut exactement 50 ? ».
        questions:
            -   id: q01
                type: texte
                enonce: Propose un test à la valeur limite pour le programme de l’éclairage du couloir, avec le résultat attendu.
                aide: Bloc par bloc (réflexe n° 9).
            -   id: q02
                type: texte
                enonce: En relisant ton dossier sur l’éclairage du couloir, quelle correction as-tu faite ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Quelqu’un repasse pendant les 2 minutes.
        questions:
            -   id: q01
                type: texte
                enonce: Que fait le programme ? Est-ce gênant ?
                aide: Bloc par bloc (réflexe n° 9).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Fais le point.
        questions:
            -   id: q01
                type: texte
                enonce: Quel réflexe (R12, R13, R15, R16) t’a le plus aidé dans ce dossier ? Donne un exemple de ta copie.
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - R12 algorithme, R13 bloc manquant, fonction pour regrouper.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
