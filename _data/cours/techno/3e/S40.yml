titre: 'Séance 40 : Bilan et entraînement au brevet n° 4 : algorithme et programme'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Suis-je capable de concevoir un algorithme et de compléter un programme ?
competences_bo:
    - Comprendre et modifier un programme associé à une fonctionnalité d’un objet ou d’un système technique
    - Concevoir, écrire, tester et mettre au point un programme
objectifs:
    connaissances:
        - Algorithme, fonctions, programme à compléter.
    competences:
        - Utiliser R12, R13.
pourquoi:
    - Depuis la séance 35, tu as programmé la cuve.
    - 'Aujourd’hui : un dossier sur un éclairage automatique de couloir (inventé).'
activites:
    -   id: a01
        titre: Le dossier
        contenu:
            -   type: citation
                texte: Un détecteur de présence et un capteur de lumière. Si quelqu’un passe ET qu’il fait sombre (lumière < 50), la lampe s’allume pendant 2 minutes. Une fonction « allumer » gère l’allumage et la minuterie.
            -   type: code
                texte: "toujours\n    si presence ET ……… alors\n        appeler allumer\n\nfonction allumer\n    lampe ON\n    pause ………\n    lampe OFF"
        questions:
            -   id: q01
                type: tableau
                enonce: Complète les trous.
                colonnes:
                    - Trou
                    - À écrire
                lignes:
                    -   - Condition
                        - ''
                    -   - Durée de la pause (en ms)
                        - ''
                aide: Ligne × colonne.
            -   id: q02
                type: texte
                enonce: Écris l’algorithme complet en langage naturel.
                aide: Combien d’éléments sont demandés ?
            -   id: q03
                type: texte
                enonce: Pourquoi utiliser une fonction « allumer » ?
                aide: Pense à « car » (réflexe n° 4).
            -   id: q04
                type: texte
                enonce: Propose un test limite pour ce programme.
                aide: Bloc par bloc (réflexe n° 9).
    -   id: a02
        titre: Je relis
        transition: Relis-toi.
        questions:
            -   id: q01
                type: texte
                enonce: Correction faite en te relisant ?
                aide: Repère le verbe de la question.
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Quelqu’un repasse pendant les 2 minutes.
        questions:
            -   id: q01
                type: texte
                enonce: Que fait le programme ? Est-ce gênant ?
                aide: Bloc par bloc (réflexe n° 9).
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Fais le point.
        questions:
            -   id: q01
                type: texte
                enonce: Quel réflexe as-tu utilisé ? Exemple.
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - R12 algorithme, R13 bloc manquant, fonction pour regrouper.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
