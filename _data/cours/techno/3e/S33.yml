titre: 'Séance 33 : Brevet blanc n° 2 : correction et reprise'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment progresser à partir de mes erreurs du brevet blanc n° 2 ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
    - Comprendre et modifier un programme associé à une fonctionnalité d’un objet ou d’un système technique
objectifs:
    connaissances:
        - Une erreur = un réflexe à retravailler.
    competences:
        - Analyser ses erreurs.
        - S’entraîner sur un exercice proche.
pourquoi:
    - En séance 32, tu as passé le brevet blanc n° 2.
    - Aujourd’hui, correction et remédiation.
activites:
    -   id: a01
        titre: Analyser
        consigne: Tu vas analyser ta copie corrigée du brevet blanc n° 2 et la comparer à celle du n° 1. On attend ton erreur principale, le réflexe qui la corrige et la comparaison.
        contenu:
            -   type: etapes
                elements:
                    - Reprends ta copie corrigée du brevet blanc n° 2.
                    - Repère la question où tu as perdu le plus de points.
                    - 'Compare avec ton erreur principale du brevet blanc n° 1 (séance 15) : est-ce la même ?'
            -   type: paragraphe
                texte: 'Pourquoi comparer avec le n° 1 ? Si c’est la même erreur, le réflexe n’est pas encore acquis : c’est lui qu’il faut travailler en priorité.'
        questions:
            -   id: q01
                type: texte
                enonce: Quelle a été ton erreur principale au brevet blanc n° 2, et quel réflexe la corrige ? Est-ce la même qu’au brevet blanc n° 1 ?
                aide: Repère le verbe de la question.
    -   id: a02
        titre: 'Reprise : algorithme'
        transition: Tu connais ton erreur. Entraîne-toi sur un exercice proche.
        consigne: 'Tu vas refaire un exercice proche du brevet blanc sur un cas nouveau : la fontaine à eau de pluie de la cour (ci-dessous). On attend son algorithme complet.'
        contenu:
            -   type: citation
                texte: 'Une fontaine à eau de pluie dans la cour : un capteur de niveau mesure la cuve de 200 L ; si le niveau est inférieur à 20 L, la fontaine affiche « vide » et la pompe s’arrête.'
            -   type: etapes
                elements:
                    - Lis la situation de la fontaine.
                    - Écris l’algorithme avec TOUJOURS, SI … ALORS … SINON (R12).
                    - 'Vérifie : toutes les actions de la situation sont-elles dans ton algorithme ?'
            -   type: paragraphe
                texte: Pourquoi vérifier les actions ? L’oubli d’une action (ici, arrêter la pompe) est l’erreur la plus fréquente dans les algorithmes.
        questions:
            -   id: q01
                type: texte
                enonce: Écris l’algorithme de la fontaine à eau de pluie de la cour.
                aide: Combien d’éléments sont demandés ?
    -   id: a03
        titre: 'Reprise : calcul et justification'
        transition: L’algorithme est écrit. Continue avec le calcul et la justification.
        consigne: Tu vas calculer un seuil en pourcentage et justifier un choix de conception de la fontaine. On attend un pourcentage et une justification avec « car ».
        contenu:
            -   type: etapes
                elements:
                    - Calcule la part de la cuve que représentent 20 L (un pourcentage).
                    - Explique le rôle de l’arrêt de la pompe avec « car » (R4).
                    - Relis tes unités.
            -   type: paragraphe
                texte: 'Pourquoi un pourcentage ? Au brevet, les seuils sont souvent donnés en % : il faut savoir passer des litres aux pourcentages.'
        questions:
            -   id: q01
                type: nombre
                enonce: Quel pourcentage de la cuve de la fontaine représentent 20 L ?
                unite: '%'
                aide: N’oublie pas l’unité (réflexe n° 5).
            -   id: q02
                type: texte
                enonce: Pourquoi la fontaine arrête-t-elle la pompe quand la cuve est presque vide ? Justifie avec « car » (R4).
                aide: Pense à « car » (réflexe n° 4).
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le niveau de la fontaine est mesuré par ultrasons.
        questions:
            -   id: q01
                type: texte
                enonce: Donne la formule hauteur → volume si le fond mesure 4 dm².
                aide: « = » + fonction + plage.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Fais le point.
        questions:
            -   id: q01
                type: texte
                enonce: Quel réflexe vas-tu travailler pour le brevet blanc n° 3 ? Comment, concrètement ?
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - Une erreur = un réflexe à retravailler.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
