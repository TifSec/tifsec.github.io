titre: 'Séance 33 : Brevet blanc n° 2 : correction et reprise'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment progresser à partir de mes erreurs du brevet blanc n° 2 ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
    - Comprendre et modifier un programme associé à une fonctionnalité d’un objet ou d’un système technique
objectifs:
    connaissances:
        - Une erreur = un réflexe à retravailler.
    competences:
        - Analyser ses erreurs.
        - S’entraîner sur un exercice proche.
pourquoi:
    - En séance 32, tu as passé le brevet blanc n° 2.
    - Aujourd’hui, correction et remédiation.
activites:
    -   id: a01
        titre: Analyser
        questions:
            -   id: q01
                type: texte
                enonce: Quelle a été ton erreur principale, et quel réflexe la corrige ?
                aide: Repère le verbe de la question.
    -   id: a02
        titre: Remédiation
        transition: Entraîne-toi sur un exercice proche.
        contenu:
            -   type: citation
                texte: 'Une fontaine à eau de pluie dans la cour : un capteur de niveau mesure la cuve de 200 L ; si le niveau est inférieur à 20 L, la fontaine affiche « vide » et la pompe s’arrête.'
        questions:
            -   id: q01
                type: texte
                enonce: Écris l’algorithme de la fontaine.
                aide: Combien d’éléments sont demandés ?
            -   id: q02
                type: nombre
                enonce: Combien de pourcents de la cuve représentent 20 L ?
                unite: '%'
                aide: N’oublie pas l’unité (réflexe n° 5).
            -   id: q03
                type: texte
                enonce: Pourquoi arrêter la pompe quand la cuve est presque vide ? (R4)
                aide: Pense à « car » (réflexe n° 4).
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le niveau est mesuré par ultrasons.
        questions:
            -   id: q01
                type: texte
                enonce: Donne la formule hauteur → volume si le fond mesure 4 dm².
                aide: « = » + fonction + plage.
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Fais le point.
        questions:
            -   id: q01
                type: texte
                enonce: Quel réflexe vas-tu travailler pour le brevet blanc n° 3 ? Comment ?
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - Une erreur = un réflexe à retravailler.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
