titre: 'Séance 28 : Bilan et entraînement au brevet n° 3 : schéma bloc'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Suis-je capable de construire un schéma bloc et d’exploiter des mesures ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - Chaînes d’énergie et d’information ; grandeur mesurée → donnée.
    competences:
        - Utiliser R17, R18, R5.
pourquoi:
    - Depuis la séance 23, tu as étudié le fonctionnement de la cuve.
    - Aujourd’hui, un dossier sur un récupérateur d’eau de pluie de maison (inventé).
activites:
    -   id: a01
        titre: Le dossier
        contenu:
            -   type: titre
                texte: Document 1
            -   type: citation
                texte: Une batterie alimente une pompe par l’intermédiaire d’un relais commandé par une carte. Un capteur à ultrasons dans le couvercle d’une cuve de 120 cm de haut mesure la distance jusqu’à l’eau. Un écran affiche le volume. Le fond de la cuve mesure 80 dm².
        questions:
            -   id: q01
                type: tableau
                enonce: Construis la chaîne d’énergie (R17).
                colonnes:
                    - Fonction
                    - Constituant
                lignes:
                    -   - Alimenter
                        - ''
                    -   - Distribuer
                        - ''
                    -   - Convertir
                        - ''
                aide: Quelle énergie entre, laquelle sort ?
            -   id: q02
                type: tableau
                enonce: Construis la chaîne d’information.
                colonnes:
                    - Fonction
                    - Constituant
                lignes:
                    -   - Acquérir
                        - ''
                    -   - Traiter
                        - ''
                    -   - Communiquer
                        - ''
                aide: Ligne × colonne.
            -   id: q03
                type: nombre
                enonce: Le capteur mesure 40 cm. Quelle est la hauteur d’eau ?
                unite: cm
                aide: N’oublie pas l’unité (réflexe n° 5).
            -   id: q04
                type: nombre
                enonce: Quel est le volume d’eau (en litres) ?
                unite: L
                aide: N’oublie pas l’unité (réflexe n° 5).
            -   id: q05
                type: texte
                enonce: Pourquoi la carte ne peut-elle pas alimenter directement la pompe ?
                aide: Pense à « car » (réflexe n° 4).
            -   id: q06
                type: texte
                enonce: Pourquoi faut-il écrire l’unité de chaque résultat (R5) ?
                aide: Pense à « car » (réflexe n° 4).
    -   id: a02
        titre: Je relis
        transition: Relis-toi.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle erreur as-tu corrigée en te relisant ?
                aide: Repère le verbe de la question.
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La cuve se vide de 50 L par jour.
        questions:
            -   id: q01
                type: texte
                enonce: Combien de jours sans pluie avant d’être vide (depuis 640 L) ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Fais le point.
        questions:
            -   id: q01
                type: texte
                enonce: Quel réflexe as-tu le mieux utilisé ? Exemple.
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'R17 : schéma bloc complet.'
    - Distance → hauteur → volume.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
