titre: 'Séance 28 : Bilan et entraînement au brevet n° 3 : schéma bloc'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Suis-je capable de construire un schéma bloc et d’exploiter des mesures ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - Chaînes d’énergie et d’information ; grandeur mesurée → donnée.
    competences:
        - Utiliser R17, R18, R5.
pourquoi:
    - Depuis la séance 23, tu as étudié le fonctionnement de la cuve.
    - Aujourd’hui, un dossier de type brevet sur le récupérateur d’eau d’une maison (inventé).
activites:
    -   id: a01
        titre: Les deux chaînes
        consigne: 'Tu vas t’entraîner au brevet sur un dossier : le récupérateur d’eau de pluie d’une maison (document 1, situation inventée). Partie 1 : on attend la chaîne d’énergie et la chaîne d’information.'
        contenu:
            -   type: titre
                texte: Document 1 — Le récupérateur d’eau d’une maison (situation inventée)
            -   type: citation
                texte: Une batterie alimente une pompe par l’intermédiaire d’un relais commandé par une carte. Un capteur à ultrasons dans le couvercle d’une cuve de 120 cm de haut mesure la distance jusqu’à l’eau. Un écran affiche le volume. Le fond de la cuve mesure 80 dm².
            -   type: etapes
                elements:
                    - Lis tout le document 1 une première fois.
                    - Repère les constituants de la chaîne d’énergie (batterie, relais, pompe).
                    - Puis ceux de la chaîne d’information (capteur, carte, écran).
            -   type: paragraphe
                texte: 'Pourquoi séparer les deux chaînes ? Au brevet, c’est une question presque toujours posée : il faut savoir ranger chaque constituant.'
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, construis la chaîne d’énergie du récupérateur (R17).
                colonnes:
                    - Fonction
                    - Constituant
                lignes:
                    -   - Alimenter
                        - ''
                    -   - Distribuer
                        - ''
                    -   - Convertir
                        - ''
                aide: Quelle énergie entre, laquelle sort ?
            -   id: q02
                type: tableau
                enonce: D’après le document 1, construis la chaîne d’information du récupérateur.
                colonnes:
                    - Fonction
                    - Constituant
                lignes:
                    -   - Acquérir
                        - ''
                    -   - Traiter
                        - ''
                    -   - Communiquer
                        - ''
                aide: Ligne × colonne.
    -   id: a02
        titre: De la mesure au volume
        transition: Les chaînes sont faites. Exploite la mesure.
        consigne: 'Partie 2 du dossier : tu vas transformer la distance mesurée par le capteur en hauteur d’eau, puis en volume, avec la méthode de la séance 26. On attend deux résultats avec leur unité.'
        contenu:
            -   type: etapes
                elements:
                    - 'Calcule la hauteur d’eau : hauteur de la cuve − distance (séance 26).'
                    - Convertis en dm, puis multiplie par la surface du fond.
                    - Écris l’unité à chaque résultat (R5).
            -   type: paragraphe
                texte: 'Pourquoi l’unité ? 80 tout seul ne veut rien dire : 80 cm et 80 L sont deux réponses différentes.'
        questions:
            -   id: q01
                type: nombre
                enonce: D’après le document 1, le capteur mesure 40 cm. Quelle est la hauteur d’eau dans la cuve ?
                unite: cm
                aide: N’oublie pas l’unité (réflexe n° 5).
            -   id: q02
                type: nombre
                enonce: Quel est alors le volume d’eau dans la cuve ?
                unite: L
                aide: N’oublie pas l’unité (réflexe n° 5).
    -   id: a03
        titre: Expliquer et relire
        transition: Termine le dossier, puis relis-toi.
        consigne: 'Partie 3 du dossier : tu vas expliquer le rôle du relais, puis relire tout ton travail. On attend une explication avec « car » et une correction précise.'
        contenu:
            -   type: etapes
                elements:
                    - Explique le rôle du relais avec « car ».
                    - 'Relis toutes tes réponses : unités (R5), constituants, justifications (R16).'
                    - Note une correction.
            -   type: paragraphe
                texte: Pourquoi relire en dernier ? Une unité oubliée ou un constituant inversé se repèrent en un coup d’œil à la relecture.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, pourquoi la carte ne peut-elle pas alimenter directement la pompe ? Justifie avec « car ».
                aide: « D’après le document… » (réflexe n° 2).
            -   id: q02
                type: texte
                enonce: En relisant ton dossier sur le récupérateur, quelle erreur as-tu corrigée ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La cuve se vide de 50 L par jour.
        questions:
            -   id: q01
                type: texte
                enonce: Combien de jours sans pluie avant qu’elle soit vide (depuis 640 L) ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Fais le point.
        questions:
            -   id: q01
                type: texte
                enonce: Quel réflexe (R5, R16, R17, R18) as-tu le mieux utilisé dans ce dossier ? Donne un exemple de ta copie.
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'R17 : schéma bloc complet.'
    - Distance → hauteur → volume.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
