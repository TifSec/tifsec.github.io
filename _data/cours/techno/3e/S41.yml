titre: 'Séance 41 : Choisir les constituants et câbler la cuve en simulation'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Quels constituants choisir et comment les relier pour réaliser le prototype numérique de la cuve ?
competences_bo:
    - Imaginer, concevoir et réaliser une ou des solutions en réponse à un besoin, à des exigences (de développement durable, par exemple) ou à la nécessité d’améliorations dans une démarche de créativité
objectifs:
    connaissances:
        - On choisit chaque constituant selon le cahier des charges (fonction, alimentation, prix) et on le relie à la bonne broche de la carte.
        - Dans Tinkercad Circuits, on câble la micro:bit, le capteur à ultrasons, la LED (avec sa résistance) et le buzzer, puis on simule.
    competences:
        - Choisir des constituants et les justifier.
        - Câbler un circuit en simulation.
pourquoi:
    - En séance 25, tu as défini la chaîne d’information ; en séance 27, tu as modélisé le couvercle.
    - Aujourd’hui, tu assembles le prototype numérique.
activites:
    -   id: a01
        titre: Choisir
        contenu:
            -   type: tableau
                titre: Document 1 — Proposition de la classe
                colonnes:
                    - Fonction
                    - Constituant choisi
                    - Broche
                lignes:
                    -   - Mesurer le niveau
                        - Capteur à ultrasons
                        - P1 (trig) et P2 (echo)
                    -   - Alerter visuellement
                        - LED rouge + résistance 220 Ω
                        - P0
                    -   - Alerter par le son
                        - Buzzer
                        - P8
                    -   - Demander l’affichage
                        - Bouton A de la carte
                        - —
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi met-on une résistance en série avec la LED ?
                aide: Pense à « car » (réflexe n° 4).
            -   id: q02
                type: qcm
                enonce: Pourquoi utiliser le bouton A de la carte plutôt qu’un bouton externe ?
                choix:
                    -   id: a
                        texte: 'Il est déjà sur la carte : moins de câblage, moins de pièces.'
                    -   id: b
                        texte: Il est plus joli.
                    -   id: c
                        texte: Obligatoire.
                aide: Relis l’exemple expliqué.
    -   id: a02
        titre: Câbler et simuler
        transition: Les constituants sont choisis. Câble-les.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Tinkercad Circuits, nouveau circuit 3e_S41_groupe.
                    - Place la micro:bit, le capteur à ultrasons, la LED, la résistance, le buzzer.
                    - Relie selon le document 1 (masse commune).
                    - Lance la simulation avec un programme simple (LED allumée si distance < 20).
        questions:
            -   id: q01
                type: texte
                enonce: Décris ton câblage (constituant → broche) et le résultat de la simulation.
                aide: Combien d’éléments sont demandés ?
        ressources:
            -   type: lien
                titre: Tinkercad Circuits — simulation de circuits avec micro:bit
                url: https://www.tinkercad.com/learn/circuits
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Toutes les masses doivent être reliées.
        questions:
            -   id: q01
                type: texte
                enonce: Que se passe-t-il si le capteur n’a pas la même masse que la carte ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quels constituants et comment les relier ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - Choisir des constituants selon le cahier des charges ; câbler aux bonnes broches ; simuler.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
