titre: 'Séance 29 : Ranger son code dans des fonctions'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: À quoi sert une fonction (sous-programme), et comment en créer une ?
competences_bo:
    - Concevoir, écrire, tester et mettre au point un programme
objectifs:
    connaissances:
        - Une fonction regroupe des instructions sous un nom ; on l’appelle quand on en a besoin. Elle évite de répéter du code et rend le programme lisible.
        - 'Exemple réel : la fonction chercherSoleil du tracker, appelée au démarrage et quand la lumière baisse beaucoup.'
    competences:
        - Repérer une fonction et ses appels.
        - Créer et appeler une fonction dans un jeu.
pourquoi:
    - En 5e et en 4e, tu as lu le programme du tracker. En 4e, tu as programmé avec des boucles et des listes.
    - En 3e, tu ranges ton code dans des fonctions, comme les programmeurs.
activites:
    -   id: a01
        titre: La fonction chercherSoleil
        contenu:
            -   type: code
                texte: "au démarrage\n    angle = 90\n    appeler chercherSoleil\n\ntoujours\n    …\n    si luminosité < 0,7 × meilleure luminosité alors\n        appeler chercherSoleil\n    …\n\nfonction chercherSoleil\n    balayer de 20° à 160° par pas de 5°\n    retenir l’angle le plus éclairé\n    tourner vers cet angle"
        questions:
            -   id: q01
                type: nombre
                enonce: Combien de fois la fonction chercherSoleil est-elle appelée dans le texte du programme ?
                aide: N’oublie pas l’unité (réflexe n° 5).
            -   id: q02
                type: texte
                enonce: Pourquoi avoir écrit une fonction plutôt que de recopier le balayage deux fois ?
                aide: Pense à « car » (réflexe n° 4).
    -   id: a02
        titre: Créer une fonction dans un jeu
        transition: Tu as vu une vraie fonction. Crée la tienne.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre MakeCode Arcade, nouveau projet 3e_S29_tonprenom.
                    - Avancé > Fonctions > Créer une fonction « nouvelleVague ».
                    - 'Dans la fonction : créer 3 ennemis à des positions au hasard.'
                    - Appelle « nouvelleVague » au démarrage et chaque fois que le score atteint un multiple de 10.
        questions:
            -   id: q01
                type: texte
                enonce: Écris en langage naturel le contenu de ta fonction et les endroits où tu l’appelles.
                aide: Combien d’éléments sont demandés ?
            -   id: q02
                type: qcm
                enonce: Que se passe-t-il quand on appelle une fonction ?
                choix:
                    -   id: a
                        texte: Le programme exécute ses instructions, puis reprend là où il était.
                    -   id: b
                        texte: Le programme s’arrête.
                    -   id: c
                        texte: La fonction est supprimée.
                aide: Relis l’exemple expliqué.
        ressources:
            - &id001
                type: lien
                titre: MakeCode Arcade (gratuit, dans le navigateur)
                url: https://arcade.makecode.com/
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une fonction peut recevoir un paramètre.
        questions:
            -   id: q01
                type: texte
                enonce: Modifie « nouvelleVague » pour qu’elle reçoive le nombre d’ennemis. Quel intérêt ?
                aide: Repère le verbe de la question.
        ressources:
            - *id001
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : à quoi sert une fonction, et comment en créer une ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Fonction : instructions regroupées sous un nom, appelées quand on en a besoin.'
    - 'Exemple : chercherSoleil du tracker.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
