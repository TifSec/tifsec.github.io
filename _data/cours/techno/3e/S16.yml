titre: 'Séance 16 : Pourquoi récupérer l’eau de pluie ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Pourquoi le collège aurait-il besoin d’une cuve d’eau de pluie intelligente ?
competences_bo:
    - Décrire les interactions entre un objet ou un système technique, son environnement et les utilisateurs
    - Caractériser et choisir un objet ou un système technique selon différents critères
objectifs:
    connaissances:
        - 'Le développement durable a trois piliers : environnemental, économique, social.'
        - Récupérer l’eau de pluie économise l’eau potable pour des usages qui n’en ont pas besoin (arrosage, nettoyage).
    competences:
        - Analyser un besoin avec les trois piliers du développement durable.
        - Formuler le besoin du collège.
pourquoi:
    - En 5e, la cuve était un objet d’étude sur documents.
    - 'En 3e, c’est le projet de l’année : la classe va la concevoir vraiment (en numérique).'
activites:
    -   id: a01
        titre: L’eau au collège
        contenu:
            -   type: tableau
                titre: Document 1 (valeurs inventées)
                colonnes:
                    - Usage
                    - Volume par an (estimation)
                    - Faut-il de l’eau potable ?
                lignes:
                    -   - Arrosage du potager
                        - 20 m³
                        - Non
                    -   - Nettoyage de la cour
                        - 10 m³
                        - Non
                    -   - Cantine
                        - 400 m³
                        - Oui
            -   type: paragraphe
                texte: 'Prix de l’eau potable : environ 4 € le m³.'
        questions:
            -   id: q01
                type: nombre
                enonce: D’après le document 1, combien de m³ d’eau potable par an pourraient être remplacés par l’eau de pluie ?
                unite: m³
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: nombre
                enonce: Quelle économie en euros par an ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a02
        titre: Les trois piliers
        transition: Le besoin est chiffré. Analyse-le avec le développement durable.
        contenu:
            -   type: paragraphe
                texte: 'Exemple expliqué : pilier environnemental : on préserve la ressource en eau potable.'
        questions:
            -   id: q01
                type: tableau
                enonce: Donne un argument pour chaque pilier.
                colonnes:
                    - Pilier
                    - Argument
                lignes:
                    -   - Environnemental
                        - ''
                    -   - Économique
                        - ''
                    -   - Social
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
    -   id: a03
        titre: Le besoin
        transition: Formule maintenant le besoin du projet.
        questions:
            -   id: q01
                type: texte
                enonce: Formule le besoin du collège en une phrase, puis donne une fonction « intelligente » utile pour la cuve.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Il tombe environ 700 mm de pluie par an dans notre région (valeur indicative). 1 mm sur 1 m² = 1 litre.
        questions:
            -   id: q01
                type: texte
                enonce: Combien de m³ récupère un toit de 100 m² en un an ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Le besoin est posé. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : pourquoi le collège aurait-il besoin d’une cuve intelligente ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Développement durable : environnement, économie, social.'
    - 'Eau de pluie : pour les usages qui n’exigent pas d’eau potable.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
