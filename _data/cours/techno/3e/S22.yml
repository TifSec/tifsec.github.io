titre: 'Séance 22 : Qu’est-ce qu’un objet connecté ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Qu’est-ce qui rend un objet « connecté », et quelles questions cela pose-t-il ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - Un objet connecté acquiert des données (capteurs), les traite, et les envoie sur un réseau (radio, Wi-Fi, Internet) pour être consultées ou commandées à distance.
        - 'Il pose des questions : sécurité (piratage), données personnelles, consommation d’énergie, durée de vie (mises à jour).'
    competences:
        - Identifier les fonctions d’un objet connecté.
        - Peser avantages et risques.
pourquoi:
    - En 4e, tu as rendu le tracker communicant.
    - La cuve sera un objet connecté. Avant de la programmer, tu étudies ce que cela implique.
activites:
    -   id: a01
        titre: Connecté ou pas ?
        consigne: Tu vas apprendre à reconnaître un objet connecté, à partir des quatre objets du document 1. On attend un classement et la différence entre les deux thermostats.
        contenu:
            -   type: tableau
                titre: Document 1 — Quatre objets
                colonnes:
                    - Objet
                    - Description
                lignes:
                    -   - Thermostat A
                        - Règle le chauffage selon la température de la pièce.
                    -   - Thermostat B
                        - Règle le chauffage et se commande depuis un téléphone, même hors de la maison.
                    -   - Montre C
                        - Affiche l’heure.
                    -   - Montre D
                        - Mesure le rythme cardiaque et l’envoie à une application.
            -   type: etapes
                elements:
                    - 'Lis le document 1 : quatre objets.'
                    - 'Pour chacun, demande-toi : envoie-t-il ou reçoit-il des données par un réseau ?'
                    - Compare les deux thermostats.
            -   type: paragraphe
                texte: 'Pourquoi comparer deux thermostats ? Ils font le même travail : la seule différence est la communication, c’est elle qui rend un objet « connecté ».'
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, ces objets sont-ils connectés ? Écris « oui » ou « non ».
                colonnes:
                    - Objet
                    - Connecté ?
                lignes:
                    -   - Thermostat A
                        - ''
                    -   - Thermostat B
                        - ''
                    -   - Montre D
                        - ''
                aide: Ligne × colonne.
            -   id: q02
                type: texte
                enonce: D’après le document 1, qu’est-ce qui fait la différence entre le thermostat A et le thermostat B ?
                aide: « D’après le document… » (réflexe n° 2).
    -   id: a02
        titre: Avantages et risques
        transition: Les objets connectés ont des avantages… et des risques.
        consigne: Tu vas peser les avantages et les risques d’une cuve connectée pour le collège. On attend deux avantages et deux risques précis.
        contenu:
            -   type: etapes
                elements:
                    - Imagine la cuve du collège connectée à Internet.
                    - Liste ce qu’elle permettrait (à distance, en temps réel…).
                    - 'Liste ce qui pourrait mal tourner : piratage, panne, énergie, données.'
            -   type: paragraphe
                texte: 'Pourquoi les risques ? Être connecté a un prix : il faut le connaître pour concevoir un objet responsable.'
        questions:
            -   id: q01
                type: tableau
                enonce: Pour la cuve connectée du collège, donne deux avantages et deux risques.
                colonnes:
                    - Avantages
                    - Risques
                lignes:
                    -   - ''
                        - ''
                    -   - ''
                        - ''
                aide: Ligne × colonne.
    -   id: a03
        titre: Notre choix de connexion
        transition: Les risques sont connus. Comment connecter notre cuve ?
        consigne: Tu vas choisir comment la cuve communiquera (radio ou Internet), en t’appuyant sur ce que tu as fait en 4e et sur les risques de la mission 2. On attend un choix justifié.
        contenu:
            -   type: etapes
                elements:
                    - 'Rappelle-toi la radio du tracker en 4e : elle ne passe pas par Internet.'
                    - 'Compare : radio entre deux cartes, ou Internet.'
                    - Choisis pour la cuve et justifie avec un risque de la mission 2.
            -   type: paragraphe
                texte: Pourquoi la radio ? Elle suffit pour prévenir la salle de technologie, et elle évite plusieurs risques liés à Internet.
        questions:
            -   id: q01
                type: texte
                enonce: Pour la cuve du collège, choisis entre une liaison radio entre deux cartes (comme le tracker en 4e) et une connexion à Internet. Justifie avec un risque de la mission 2.
                aide: Pense à « car » (réflexe n° 4).
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Certains objets connectés ne sont plus mis à jour après quelques années.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi est-ce un risque ?
                aide: Pense à « car » (réflexe n° 4).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : qu’est-ce qui rend un objet connecté, et quelles questions cela pose-t-il ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Objet connecté : acquérir, traiter, communiquer sur un réseau.'
    - 'Questions : sécurité, données, énergie, mises à jour.'
sources:
