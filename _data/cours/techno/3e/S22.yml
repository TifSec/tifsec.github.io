titre: 'Séance 22 : Qu’est-ce qu’un objet connecté ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Qu’est-ce qui rend un objet « connecté », et quelles questions cela pose-t-il ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - Un objet connecté acquiert des données (capteurs), les traite, et les envoie sur un réseau (radio, Wi-Fi, Internet) pour être consultées ou commandées à distance.
        - 'Il pose des questions : sécurité (piratage), données personnelles, consommation d’énergie, durée de vie (mises à jour).'
    competences:
        - Identifier les fonctions d’un objet connecté.
        - Peser avantages et risques.
pourquoi:
    - En 4e, tu as rendu le tracker communicant.
    - La cuve sera un objet connecté. Avant de la programmer, tu étudies ce que cela implique.
activites:
    -   id: a01
        titre: Connecté ou pas ?
        contenu:
            -   type: tableau
                titre: Document 1
                colonnes:
                    - Objet
                    - Description
                lignes:
                    -   - Thermostat A
                        - Règle le chauffage selon la température de la pièce.
                    -   - Thermostat B
                        - Règle le chauffage et se commande depuis un téléphone, même hors de la maison.
                    -   - Montre C
                        - Affiche l’heure.
                    -   - Montre D
                        - Mesure le rythme cardiaque et l’envoie à une application.
        questions:
            -   id: q01
                type: tableau
                enonce: Ces objets sont-ils connectés ? Écris « oui » ou « non ».
                colonnes:
                    - Objet
                    - Connecté ?
                lignes:
                    -   - Thermostat A
                        - ''
                    -   - Thermostat B
                        - ''
                    -   - Montre D
                        - ''
                aide: Ligne × colonne.
            -   id: q02
                type: texte
                enonce: Qu’est-ce qui fait la différence entre le thermostat A et le thermostat B ?
                aide: Repère le verbe de la question.
    -   id: a02
        titre: Avantages et risques
        transition: Les objets connectés ont des avantages… et des risques.
        questions:
            -   id: q01
                type: tableau
                enonce: Pour la cuve connectée du collège, donne deux avantages et deux risques.
                colonnes:
                    - Avantages
                    - Risques
                lignes:
                    -   - ''
                        - ''
                    -   - ''
                        - ''
                aide: Ligne × colonne.
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Certains objets connectés ne sont plus mis à jour après quelques années.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi est-ce un risque ?
                aide: Pense à « car » (réflexe n° 4).
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : qu’est-ce qui rend un objet connecté, et quelles questions cela pose-t-il ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Objet connecté : acquérir, traiter, communiquer sur un réseau.'
    - 'Questions : sécurité, données, énergie, mises à jour.'
sources:
