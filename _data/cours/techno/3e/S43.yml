titre: 'Séance 43 : Writer n° 2 : finaliser le dossier de projet'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment finaliser un dossier de projet complet et le partager en PDF ?
competences_bo:
    - Imaginer, concevoir et réaliser une ou des solutions en réponse à un besoin, à des exigences (de développement durable, par exemple) ou à la nécessité d’améliorations dans une démarche de créativité
objectifs:
    connaissances:
        - 'Un dossier final : sommaire à jour, images légendées (Insertion > Légende), sources citées, export en PDF (Fichier > Exporter au format PDF).'
    competences:
        - Insérer des captures légendées.
        - Citer les sources.
        - Exporter en PDF.
pourquoi:
    - Depuis la séance 17, le dossier de projet se construit.
    - Aujourd’hui, on le finalise.
activites:
    -   id: a01
        titre: Images et légendes
        consigne: Tu vas compléter le dossier de projet de la cuve (Writer) avec des captures légendées automatiquement. On attend la liste de tes trois figures et leurs légendes.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre ton dossier 3e_dossier_cuve_groupe.odt.
                    - 'Insère trois captures : programme, modèle 3D du couvercle, circuit.'
                    - 'Clic droit sur chaque image > Insérer une légende : « Figure 1 : … ».'
                    - Mets à jour la table des matières.
            -   type: paragraphe
                texte: Pourquoi des légendes automatiques ? Si tu ajoutes une figure au milieu, toutes les autres se renumérotent seules.
        questions:
            -   id: q01
                type: texte
                enonce: Liste les trois figures de ton dossier de projet avec leurs légendes.
                aide: Repère le verbe de la question.
    -   id: a02
        titre: Les sources
        transition: Les figures sont prêtes. Cite tes sources.
        consigne: Tu vas ajouter la partie « Sources » de ton dossier de projet, avec la méthode de citation vue en 4e. On attend deux sources complètes.
        contenu:
            -   type: etapes
                elements:
                    - Ajoute une partie « Sources » en style Titre 1.
                    - 'Pour chaque document utilisé, écris : auteur, titre, site, date (comme en 4e).'
                    - Mets à jour la table des matières.
            -   type: paragraphe
                texte: Pourquoi citer ? C’est respecter le travail des autres, et permettre au lecteur de vérifier.
        questions:
            -   id: q01
                type: texte
                enonce: Écris deux sources de ton dossier de projet, correctement citées (auteur, titre, site, date).
                aide: Combien d’éléments sont demandés ?
    -   id: a03
        titre: Le PDF
        transition: Le dossier est complet. Exporte-le.
        consigne: Tu vas exporter le dossier de projet en PDF et vérifier le résultat. On attend le rôle du PDF et ce que tu as contrôlé.
        contenu:
            -   type: etapes
                elements:
                    - Relis tout le dossier une dernière fois.
                    - Fichier > Exporter au format PDF.
                    - Ouvre le PDF et vérifie la mise en page.
            -   type: paragraphe
                texte: Pourquoi un PDF ? Il s’affiche pareil sur tous les ordinateurs et ne se modifie pas par erreur.
        questions:
            -   id: q01
                type: qcm
                enonce: Pourquoi exporte-t-on le dossier de projet en PDF pour le partager ?
                choix:
                    -   id: a
                        texte: La mise en page est conservée sur tous les ordinateurs.
                    -   id: b
                        texte: Le fichier est modifiable par tous.
                    -   id: c
                        texte: C’est plus lourd.
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: texte
                enonce: En vérifiant ton PDF, qu’as-tu contrôlé (ou corrigé) ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Writer peut créer un index des figures.
        questions:
            -   id: q01
                type: texte
                enonce: Où le trouver dans les menus ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment finaliser un dossier de projet complet et le partager en PDF ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Dossier final : sommaire, légendes, sources, PDF.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
