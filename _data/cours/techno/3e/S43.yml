titre: 'Séance 43 : Writer n° 2 : finaliser le dossier de projet'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment finaliser un dossier de projet complet et le partager en PDF ?
competences_bo:
    - Imaginer, concevoir et réaliser une ou des solutions en réponse à un besoin, à des exigences (de développement durable, par exemple) ou à la nécessité d’améliorations dans une démarche de créativité
objectifs:
    connaissances:
        - 'Un dossier final : sommaire à jour, images légendées (Insertion > Légende), sources citées, export en PDF (Fichier > Exporter au format PDF).'
    competences:
        - Insérer des captures légendées.
        - Citer les sources.
        - Exporter en PDF.
pourquoi:
    - Depuis la séance 17, le dossier de projet se construit.
    - Aujourd’hui, on le finalise.
activites:
    -   id: a01
        titre: Images et légendes
        contenu:
            -   type: etapes
                elements:
                    - Insère les captures (programme, modèle 3D, circuit).
                    - 'Clic droit > Insérer une légende : « Figure 1 : … ».'
                    - Mets à jour la table des matières.
        questions:
            -   id: q01
                type: texte
                enonce: Liste les figures de ton dossier avec leurs légendes.
                aide: Repère le verbe de la question.
    -   id: a02
        titre: Sources et PDF
        transition: Termine par les sources et le PDF.
        contenu:
            -   type: etapes
                elements:
                    - 'Ajoute une partie « Sources » : auteur, titre, site, date.'
                    - Fichier > Exporter au format PDF.
        questions:
            -   id: q01
                type: texte
                enonce: Écris deux sources de ton dossier, correctement citées.
                aide: Combien d’éléments sont demandés ?
            -   id: q02
                type: qcm
                enonce: Pourquoi exporter en PDF pour partager le dossier ?
                choix:
                    -   id: a
                        texte: La mise en page est conservée sur tous les ordinateurs.
                    -   id: b
                        texte: Le fichier est modifiable par tous.
                    -   id: c
                        texte: C’est plus lourd.
                aide: Relis l’exemple expliqué.
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Writer peut créer un index des figures.
        questions:
            -   id: q01
                type: texte
                enonce: Où le trouver ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment finaliser et partager le dossier ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Dossier final : sommaire, légendes, sources, PDF.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
