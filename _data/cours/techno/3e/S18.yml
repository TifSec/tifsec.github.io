titre: "Comment vérifier que ses réactions respectent les règles prévues ?"
theme: "Monte-charge : prévoir, programmer, tester"
problematique: "Comment vérifier que ses réactions respectent les règles prévues ?"
pourquoi: "Transférer les raisonnements d’Arcade au système réel et à son jumeau."
application: "Décrire une règle, un programme ou un test du monte-charge en suivant les informations et les actions dans l’ordre."
lien_precedent: "Reprends une méthode des séances précédentes : elle t’aidera pour comment vérifier que ses réactions respectent les règles prévues ?."
prerequis:
    - "Lire une consigne et repérer les informations données."
    - "Suivre un exemple étape par étape et expliquer ce que tu fais."
notions:
    - titre: "Un exemple pour démarrer"
      texte: "Pour une montée : demande de l’utilisateur → information du capteur → décision de la carte → action du moteur. Le capteur informe ; le moteur fait bouger la plateforme. Aujourd’hui, on l’applique à monte-charge et jumeau numérique."
objectifs:
    connaissances:
        - "Transférer les raisonnements d’Arcade au système réel et à son jumeau."
    competences:
        - "Décrire une règle, un programme ou un test du monte-charge en suivant les informations et les actions dans l’ordre."
        - "Justifier une réponse avec une information observée ou un résultat de test."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Transférer les raisonnements d’Arcade au système réel et à son jumeau."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Décrire une règle, un programme ou un test du monte-charge en suivant les informations et les actions dans l’ordre."
    - type: paragraphe
      texte: "Dans la vie réelle : Pour une montée : demande de l’utilisateur → information du capteur → décision de la carte → action du moteur. Le capteur informe ; le moteur fait bouger la plateforme."
    - type: paragraphe
      texte: "Nous allons observer un exemple, essayer avec de l’aide, puis réutiliser la méthode. Suis les étapes dans l’ordre ; elles te guident."
activites:
    - id: a01
      titre: "Observer l’exemple"
      pourquoi: "L’exemple montre une première méthode avant que tu essaies."
      demarche:
          - "Lis la consigne et repère ce qui est demandé."
          - "Suis l’exemple et fais les étapes dans l’ordre."
          - "Garde une trace courte de ton résultat."
      contenu:
          - type: paragraphe
            texte: "Lis la situation : Comment vérifier que ses réactions respectent les règles prévues ?. Repère le besoin, les informations utiles et le résultat attendu."
      questions:
          - id: q01
            type: texte
            obligatoire: true
            consigne: "Qu’est-ce qu’on cherche à comprendre ou à réaliser ?"
            aide: "Relis l’exemple et cite une information précise."
            correction: manuelle
    - id: a02
      titre: "Essayer avec un guide"
      pourquoi: "Tu réutilises les étapes de l’exemple sur une situation proche."
      demarche:
          - "Lis la consigne et repère ce qui est demandé."
          - "Suis l’exemple et fais les étapes dans l’ordre."
          - "Garde une trace courte de ton résultat."
      contenu:
          - type: paragraphe
            texte: "Décrire une règle, un programme ou un test du monte-charge en suivant les informations et les actions dans l’ordre."
      questions:
          - id: q01
            type: texte
            obligatoire: true
            consigne: "Quelle étape as-tu faite en premier ? Quelle information t’a aidé ?"
            aide: "Relis l’exemple et cite une information précise."
            correction: manuelle
    - id: a03
      titre: "Réinvestir"
      pourquoi: "Tu changes de situation pour vérifier que tu sais réutiliser la méthode."
      demarche:
          - "Lis la consigne et repère ce qui est demandé."
          - "Suis l’exemple et fais les étapes dans l’ordre."
          - "Garde une trace courte de ton résultat."
      contenu:
          - type: paragraphe
            texte: "Applique la méthode à un autre cas de monte-charge et jumeau numérique. Compare le résultat attendu et le résultat obtenu ; si cela ne fonctionne pas, modifie une seule chose puis recommence."
      questions:
          - id: q01
            type: texte
            obligatoire: true
            consigne: "Qu’as-tu changé et qu’est-ce que cela a amélioré ?"
            aide: "Relis l’exemple et cite une information précise."
            correction: manuelle
    - id: a04
      titre: "Garder une trace"
      pourquoi: "Une trace courte te permettra de retrouver la méthode plus tard."
      demarche:
          - "Lis la consigne et repère ce qui est demandé."
          - "Suis l’exemple et fais les étapes dans l’ordre."
          - "Garde une trace courte de ton résultat."
      contenu:
          - type: paragraphe
            texte: "Écris une phrase qui résume ce que tu sais maintenant faire dans « Comment vérifier que ses réactions respectent les règles prévues ? ». Ajoute une preuve ou un exemple."
      questions:
          - id: q01
            type: texte
            obligatoire: true
            consigne: "Quelle méthode veux-tu retenir pour la prochaine séance ?"
            aide: "Relis l’exemple et cite une information précise."
            correction: manuelle
ressources:
    - titre: "Aide pour monte-charge et jumeau numérique"
      url: "https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4"
      pourquoi: "Utilise cette ressource pour rechercher une information utile, puis reformule avec tes mots."
reperes_officiels:
    programme: "Technologie au cycle 4 — programme officiel applicable en 3e à partir de la rentrée 2026."
    lien: "https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A"
    contribution: "Cette séance contribue à : Transférer les raisonnements d’Arcade au système réel et à son jumeau."
bilan:
    - "Je peux expliquer ce que j’ai appris avec mes mots."
    - "Je peux montrer une réponse, une production ou un test qui prouve mon travail."
