titre: 'Séance 18 : Quelles cuves existent déjà ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Quelles solutions existent déjà, et comment les évaluer ?
competences_bo:
    - Caractériser et choisir un objet ou un système technique selon différents critères
objectifs:
    connaissances:
        - 'Avant d’inventer, on fait l’état de l’art : on liste les solutions existantes et on les évalue selon des critères (coût, réparabilité, performances, impact).'
        - Dans un long document technique, on ne surligne que les données utiles à la question (R18).
    competences:
        - Extraire des données utiles d’un document long.
        - Évaluer des solutions avec des critères.
pourquoi:
    - En séance 17, tu as écrit le cahier des charges.
    - Aujourd’hui, tu étudies trois cuves du commerce pour t’en inspirer.
activites:
    -   id: a01
        titre: Lire les fiches techniques
        consigne: 'Tu vas faire l’état de l’art : comparer trois cuves du commerce à partir de leurs fiches techniques (document 1), avec le réflexe R18. On attend la meilleure cuve pour trois critères et un calcul de prix par litre.'
        contenu:
            -   type: citation
                texte: 'Réflexe brevet n° 18 : dans un long document, je surligne seulement les données utiles à la question.'
            -   type: tableau
                titre: Document 1 — Trois cuves du commerce (extraits de fiches, valeurs indicatives)
                colonnes:
                    - Critère
                    - Cuve A (plastique, 1 000 L)
                    - Cuve B (béton, enterrée, 3 000 L)
                    - Cuve C (bois et bâche, 500 L)
                lignes:
                    -   - Prix
                        - 150 €
                        - 1 500 €
                        - 250 €
                    -   - Pièces de rechange
                        - Robinet, filtre
                        - Pompe, filtre
                        - Bâche
                    -   - Installation
                        - Simple, au sol
                        - Travaux de terrassement
                        - Simple
                    -   - Durée de vie
                        - 20 ans
                        - 50 ans
                        - 10 ans
                    -   - Capteur de niveau
                        - Non
                        - Option
                        - Non
            -   type: etapes
                elements:
                    - Lis le réflexe R18.
                    - Pour chaque critère demandé, cherche la ligne du document 1 qui y répond.
                    - Compare les trois cuves sur cette ligne seulement.
            -   type: paragraphe
                texte: 'Pourquoi ne relever que l’utile ? Un document technique contient beaucoup d’informations : on perd du temps si on lit tout pour chaque question.'
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, quelle cuve est la meilleure pour chaque critère ?
                colonnes:
                    - Critère
                    - Cuve
                lignes:
                    -   - Prix
                        - ''
                    -   - Durée de vie
                        - ''
                    -   - Facilité d’installation
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
            -   id: q02
                type: nombre
                enonce: D’après le document 1, quel est le prix par litre de stockage de la cuve A ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a02
        titre: Évaluer pour notre besoin
        transition: Tu as extrait les données utiles. Évalue maintenant pour notre besoin.
        consigne: Tu vas choisir la cuve du commerce la plus proche du besoin du collège, rappelé ci-dessous. On attend un choix justifié par deux critères chiffrés.
        contenu:
            -   type: paragraphe
                texte: 'Rappel : besoin ≈ 30 m³ par an pour l’arrosage et le nettoyage ; budget limité ; installation par l’établissement.'
            -   type: etapes
                elements:
                    - Relis le besoin du collège (séance 16), rappelé ci-dessous.
                    - Élimine les cuves qui ne conviennent pas (budget, travaux).
                    - Justifie ton choix avec deux critères chiffrés (R14).
            -   type: paragraphe
                texte: Pourquoi revenir au besoin ? La « meilleure » cuve dans l’absolu n’est pas forcément la bonne pour le collège.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle cuve du document 1 s’approche le plus du besoin du collège ? Justifie avec deux critères chiffrés (R14).
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a03
        titre: Ce que notre projet apporte
        transition: La base est choisie. Que manque-t-il ?
        consigne: Tu vas repérer ce que notre projet ajoutera aux cuves du commerce. On attend les fonctions intelligentes qui n’existent pas dans le document 1.
        contenu:
            -   type: etapes
                elements:
                    - Regarde la ligne « Capteur de niveau » du document 1.
                    - Relis la fonction intelligente imaginée en séance 16.
                    - Liste ce que notre cuve fera de plus.
            -   type: paragraphe
                texte: Pourquoi chercher ce qui manque ? Un projet utile apporte quelque chose que les solutions existantes n’ont pas.
        questions:
            -   id: q01
                type: texte
                enonce: Qu’apportera notre cuve intelligente que les cuves du commerce du document 1 n’ont pas ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La cuve B dure 2,5 fois plus longtemps que la cuve A.
        questions:
            -   id: q01
                type: texte
                enonce: Compare le coût par année de vie des cuves A et B.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as fait l’état de l’art. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quelles solutions de cuve existent, et comment les évaluer ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'État de l’art : lister et évaluer les solutions existantes.'
    - 'R18 : ne relever que les données utiles.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
