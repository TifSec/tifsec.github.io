titre: 'Séance 34 : Le numérique a-t-il un impact sur l’environnement ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Quel est l’impact environnemental de nos usages numériques, et comment le réduire ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
    - Caractériser et choisir un objet ou un système technique selon différents critères
objectifs:
    connaissances:
        - L’essentiel de l’impact du numérique vient de la fabrication des équipements (métaux, énergie) ; viennent ensuite les centres de données et les réseaux.
        - 'Sobriété numérique : garder ses appareils longtemps, réparer, limiter la vidéo en haute définition, trier ses fichiers stockés en ligne.'
    competences:
        - Identifier les sources d’impact du numérique.
        - Proposer des gestes de sobriété.
pourquoi:
    - En 4e, tu as vu que l’impact d’un smartphone vient surtout de sa fabrication. En séance 11, tu as calculé des tailles de fichiers.
    - Aujourd’hui, tu mesures l’impact de tes usages numériques.
activites:
    -   id: a01
        titre: D’où vient l’impact ?
        consigne: Tu vas découvrir d’où vient l’impact environnemental du numérique, à partir des ordres de grandeur du document 1. On attend la source principale et le lien avec la durée de vie des appareils.
        contenu:
            -   type: tableau
                titre: Document 1 — Ordres de grandeur arrondis (études ADEME-Arcep)
                colonnes:
                    - Source
                    - Part de l’impact du numérique en France (ordre de grandeur)
                lignes:
                    -   - Fabrication des terminaux (téléphones, ordinateurs, TV)
                        - Environ 3/4
                    -   - Centres de données
                        - Environ 1/10 à 1/5
                    -   - Réseaux
                        - Environ 1/10
            -   type: etapes
                elements:
                    - 'Lis le document 1 : trois sources d’impact du numérique.'
                    - Repère la plus importante.
                    - Fais le lien avec la durée de vie de ton téléphone.
            -   type: paragraphe
                texte: Pourquoi la fabrication pèse-t-elle autant ? Extraire les métaux et fabriquer les puces demande énormément d’énergie et de matières, avant même la première utilisation.
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 1, quelle est la principale source d’impact du numérique ?
                choix:
                    -   id: a
                        texte: La fabrication des terminaux.
                    -   id: b
                        texte: Les réseaux.
                    -   id: c
                        texte: Les centres de données.
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: texte
                enonce: D’après le document 1, pourquoi garder son téléphone deux ans de plus réduit-il plus l’impact que de supprimer quelques e-mails ?
                aide: « D’après le document… » (réflexe n° 2).
    -   id: a02
        titre: La vidéo
        transition: Tu connais les sources. Regarde un de tes usages.
        consigne: 'Tu vas chiffrer l’effet d’un geste simple : regarder ses vidéos en définition standard. On attend un calcul de données économisées, en Go.'
        contenu:
            -   type: paragraphe
                texte: 'Ordre de grandeur : une heure de vidéo en haute définition transfère environ 3 Go ; en définition standard, environ 1 Go.'
            -   type: etapes
                elements:
                    - 'Lis l’ordre de grandeur ci-dessous : données transférées par heure de vidéo.'
                    - Calcule la différence entre haute définition et définition standard pour une heure.
                    - Multiplie par 10 heures.
            -   type: paragraphe
                texte: 'Pourquoi la vidéo ? C’est l’usage qui transfère le plus de données : réseaux et centres de données travaillent pour elle.'
        questions:
            -   id: q01
                type: nombre
                enonce: Combien de Go économise-t-on en regardant 10 heures de vidéo en définition standard plutôt qu’en haute définition ?
                unite: Go
                aide: N’oublie pas l’unité (réflexe n° 5).
    -   id: a03
        titre: Mes gestes de sobriété
        transition: Tu as chiffré un geste. Classe maintenant tous tes gestes.
        consigne: Tu vas proposer et classer trois gestes de sobriété numérique, du plus efficace au moins efficace, à l’aide du document 1. On attend un classement justifié.
        contenu:
            -   type: etapes
                elements:
                    - Liste trois gestes de sobriété numérique que tu pourrais faire.
                    - Classe-les selon la source d’impact qu’ils réduisent (document 1).
                    - Justifie le geste le plus efficace.
            -   type: paragraphe
                texte: 'Pourquoi classer ? Tous les gestes n’ont pas le même effet : mieux vaut commencer par celui qui compte le plus.'
        questions:
            -   id: q01
                type: texte
                enonce: Propose trois gestes de sobriété numérique et classe-les du plus efficace au moins efficace. Justifie le premier avec le document 1.
                aide: Pense à « car » (réflexe n° 4).
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le reconditionnement donne une seconde vie aux téléphones.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi un téléphone reconditionné a-t-il un impact plus faible qu’un neuf ?
                aide: Bloc par bloc (réflexe n° 9).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quel est l’impact de nos usages numériques, et comment le réduire ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Impact du numérique : surtout la fabrication des équipements.'
    - 'Sobriété : garder, réparer, réduire la vidéo HD, trier.'
sources:
