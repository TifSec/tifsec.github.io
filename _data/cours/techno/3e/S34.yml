titre: 'Séance 34 : Le numérique a-t-il un impact sur l’environnement ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Quel est l’impact environnemental de nos usages numériques, et comment le réduire ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
    - Caractériser et choisir un objet ou un système technique selon différents critères
objectifs:
    connaissances:
        - L’essentiel de l’impact du numérique vient de la fabrication des équipements (métaux, énergie) ; viennent ensuite les centres de données et les réseaux.
        - 'Sobriété numérique : garder ses appareils longtemps, réparer, limiter la vidéo en haute définition, trier ses fichiers stockés en ligne.'
    competences:
        - Identifier les sources d’impact du numérique.
        - Proposer des gestes de sobriété.
pourquoi:
    - En 4e, tu as vu que l’impact d’un smartphone vient surtout de sa fabrication. En séance 11, tu as calculé des tailles de fichiers.
    - Aujourd’hui, tu mesures l’impact de tes usages numériques.
activites:
    -   id: a01
        titre: D’où vient l’impact ?
        contenu:
            -   type: tableau
                titre: Document 1 — Ordres de grandeur arrondis (études ADEME-Arcep)
                colonnes:
                    - Source
                    - Part de l’impact du numérique en France (ordre de grandeur)
                lignes:
                    -   - Fabrication des terminaux (téléphones, ordinateurs, TV)
                        - Environ 3/4
                    -   - Centres de données
                        - Environ 1/10 à 1/5
                    -   - Réseaux
                        - Environ 1/10
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 1, quelle est la principale source d’impact ?
                choix:
                    -   id: a
                        texte: La fabrication des terminaux.
                    -   id: b
                        texte: Les réseaux.
                    -   id: c
                        texte: Les centres de données.
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: texte
                enonce: Pourquoi garder son téléphone deux ans de plus réduit-il plus l’impact que de supprimer quelques e-mails ?
                aide: Pense à « car » (réflexe n° 4).
    -   id: a02
        titre: Mes usages
        transition: Tu connais les sources. Regarde tes usages.
        contenu:
            -   type: paragraphe
                texte: 'Ordre de grandeur : une heure de vidéo en haute définition transfère environ 3 Go ; en définition standard, environ 1 Go.'
        questions:
            -   id: q01
                type: nombre
                enonce: Combien de Go économise-t-on en regardant 10 heures de vidéo en définition standard plutôt qu’en haute définition ?
                unite: Go
                aide: N’oublie pas l’unité (réflexe n° 5).
            -   id: q02
                type: texte
                enonce: Propose trois gestes de sobriété numérique et classe-les du plus efficace au moins efficace. Justifie le premier.
                aide: Pense à « car » (réflexe n° 4).
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le reconditionnement donne une seconde vie aux téléphones.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi un téléphone reconditionné a-t-il un impact plus faible qu’un neuf ?
                aide: Bloc par bloc (réflexe n° 9).
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quel est l’impact de nos usages numériques, et comment le réduire ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Impact du numérique : surtout la fabrication des équipements.'
    - 'Sobriété : garder, réparer, réduire la vidéo HD, trier.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
