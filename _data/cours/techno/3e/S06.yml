titre: Comment comparer expérimentalement plusieurs solutions ?
theme: "Création, conception, réalisation, innovations : des objets à concevoir et à réaliser"
problematique: Comment réaliser une expérience suffisamment fiable pour comparer plusieurs solutions techniques ?
pourquoi: "Objectif de cette séance : Un protocole doit être suffisamment précis pour pouvoir être reproduit."
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Un protocole doit être suffisamment précis pour pouvoir être reproduit.
        - Une expérience réelle peut révéler des défauts dans un protocole pourtant correct sur le papier.
        - Pour comparer plusieurs solutions, une seule caractéristique doit être modifiée à la fois.
        - Les autres conditions de l'expérience doivent rester aussi constantes que possible.
        - Plusieurs mesures permettent d'obtenir un résultat plus représentatif.
    competences: []
activites:
    - id: a05
      titre: Production attendue
      contenu:
          - type: liste
            elements:
                - Un fichier LibreOffice Writer nommé 3e_S06_nom.odt.
                - Le protocole corrigé de la séance précédente.
                - Les mesures réalisées avec les rotors à 3, 4 et 5 pales.
                - Les moyennes calculées.
                - Une analyse des résultats et des limites de l'expérience.
                - Une conclusion argumentée.
          - type: paragraphe
            texte: Le fichier devra être déposé à la fin de la séance, même s'il n'est pas entièrement terminé.
      questions: []
    - id: a06
      titre: 1. Préparez votre document de travail
      contenu:
          - type: paragraphe
            texte: Ouvrez LibreOffice Writer.
          - type: paragraphe
            texte: Créez un nouveau document.
          - type: paragraphe
            texte: "Enregistrez-le immédiatement sous le nom : 3e_S06_nom.odt."
      questions:
          - id: q01
            type: texte
            enonce: "Écrivez votre nom, votre prénom et le titre : Séance 6 – Comment comparer expérimentalement plusieurs solutions ?"
            suite: []
    - id: a07
      titre: 2. Votre protocole peut-il réellement être utilisé ?
      contenu:
          - type: paragraphe
            texte: Lors de la séance précédente, vous avez proposé un protocole permettant d'étudier l'influence du nombre de pales sur une petite éolienne.
          - type: paragraphe
            texte: Relisez-le sans encore toucher au matériel.
      questions:
          - id: q01
            type: texte
            enonce: "Q1 : Si un autre groupe devait réaliser votre expérience uniquement en lisant votre protocole, saurait-il exactement :"
            suite:
                - type: liste
                  elements:
                      - quel rotor installer ;
                      - où placer l'éolienne ;
                      - comment régler la source d'air ;
                      - quelle grandeur mesurer ;
                      - comment utiliser l'appareil de mesure ;
                      - quand relever la valeur ;
                      - combien de mesures effectuer ?
                - type: paragraphe
                  texte: Corrigez votre protocole si certaines informations manquent.
                - type: titre
                  texte: "Mise en commun : un protocole reproductible"
                - type: paragraphe
                  texte: Un protocole est reproductible lorsqu'une autre personne peut refaire l'expérience dans les mêmes conditions en suivant uniquement les instructions données.
    - id: a08
      titre: 3. Préparez le banc d'essai
      contenu:
          - type: paragraphe
            texte: "Vous allez comparer trois rotors :"
          - type: liste
            elements:
                - 3 pales ;
                - 4 pales ;
                - 5 pales.
          - type: paragraphe
            texte: "Avant toute mesure, vérifiez avec le professeur :"
          - type: liste
            elements:
                - que la génératrice est correctement fixée ;
                - que le rotor peut tourner librement ;
                - que la source d'air est correctement positionnée ;
                - que le multimètre est réglé pour mesurer une tension continue en volts ;
                - que les câbles de mesure sont correctement branchés.
          - type: paragraphe
            texte: Ne modifiez pas la position du ventilateur ou de la soufflerie pendant les essais.
      questions: []
    - id: a09
      titre: 4. Réalisez les mesures
      contenu:
          - type: paragraphe
            texte: "Pour chaque rotor :"
          - type: paragraphe
            texte: installez le rotor ;
      questions:
          - id: q01
            type: texte
            enonce: vérifiez qu'il tourne librement ;
            suite:
                - type: paragraphe
                  texte: mettez en fonctionnement la source d'air ;
                - type: paragraphe
                  texte: attendez quelques secondes que la rotation se stabilise ;
                - type: paragraphe
                  texte: relevez la tension indiquée par le multimètre ;
                - type: paragraphe
                  texte: arrêtez puis recommencez l'essai afin d'obtenir trois mesures.
          - id: q02
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Rotor
                - Mesure 1
                - Mesure 2
                - Mesure 3
                - Tension moyenne
            lignes:
                - - 3 pales
                  - ""
                  - ""
                  - ""
                  - ""
                - - 4 pales
                  - ""
                  - ""
                  - ""
                  - ""
                - - 5 pales
                  - ""
                  - ""
                  - ""
                  - ""
            suite:
                - type: paragraphe
                  texte: "Unité : indiquez toutes les tensions en volts (V)."
    - id: a10
      titre: 5. Qu'indiquent réellement vos mesures ?
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: "Q2 : Quel rotor obtient la tension moyenne la plus élevée ?"
          - id: q02
            type: texte
            enonce: "Q3 : Justifiez avec les valeurs obtenues."
          - id: q03
            type: texte
            enonce: "Q4 : Les trois mesures réalisées avec un même rotor sont-elles exactement identiques ?"
          - id: q04
            type: texte
            enonce: "Q5 : Proposez au moins deux raisons pouvant expliquer les éventuels écarts."
    - id: a11
      titre: 6. Peut-on affirmer que seul le nombre de pales explique le résultat ?
      contenu:
          - type: paragraphe
            texte: Votre objectif était de modifier uniquement le nombre de pales.
          - type: paragraphe
            texte: Mais observez maintenant votre expérience réelle.
      questions:
          - id: q01
            type: texte
            enonce: "Q6 : Toutes les autres caractéristiques étaient-elles réellement identiques ?"
            suite:
                - type: paragraphe
                  texte: "Examinez notamment :"
                - type: liste
                  elements:
                      - la forme des pales ;
                      - leur angle ;
                      - leur masse ;
                      - la qualité de l'impression ;
                      - leur équilibrage ;
                      - leur position par rapport au flux d'air.
          - id: q02
            type: texte
            enonce: "Q7 : Peut-on conclure que le nombre de pales est forcément la seule cause des différences observées ? Justifiez."
    - id: a12
      titre: 7. Votre protocole résiste-t-il à la réalité ?
      contenu:
          - type: paragraphe
            texte: Reprenez le protocole que vous aviez écrit avant l'expérience.
          - type: paragraphe
            texte: Indiquez au moins deux améliorations que vous apporteriez maintenant.
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Problème observé
                - Amélioration proposée
            lignes:
                - - ""
                  - ""
                - - ""
                  - ""
            suite:
                - type: titre
                  texte: "Mise en commun : expérience et amélioration"
                - type: paragraphe
                  texte: Une expérience réelle permet souvent de découvrir des éléments qui n'avaient pas été prévus lors de la rédaction du protocole.
                - type: paragraphe
                  texte: Une démarche expérimentale consiste donc aussi à observer les limites du test puis améliorer la méthode.
    - id: a13
      titre: 8. Une mauvaise expérience peut-elle donner un résultat convaincant ?
      contenu:
          - type: paragraphe
            texte: "Un groupe annonce :"
          - type: liste
            elements:
                - "3 pales : 0,42 V ;"
                - "4 pales : 0,61 V ;"
                - "5 pales : 0,37 V."
          - type: paragraphe
            texte: "Mais il indique ensuite :"
          - type: liste
            elements:
                - avoir déplacé le ventilateur entre les essais ;
                - avoir utilisé une vitesse différente pour le rotor à 4 pales ;
                - n'avoir effectué qu'une seule mesure avec chaque rotor.
      questions:
          - id: q01
            type: texte
            enonce: "Q8 : Peut-on conclure que le rotor à 4 pales est le meilleur ? Justifiez."
    - id: a14
      titre: 9. Conclusion du travail
      contenu:
          - type: paragraphe
            texte: Rédigez une conclusion de 4 à 6 lignes.
          - type: paragraphe
            texte: "Elle doit obligatoirement comporter :"
          - type: liste
            elements:
                - le rotor ayant obtenu la meilleure tension moyenne ;
                - la valeur mesurée ;
                - une comparaison avec les autres rotors ;
                - au moins une limite de l'expérience.
          - type: paragraphe
            texte: "Commencez votre conclusion par :"
          - type: paragraphe
            texte: « Dans nos conditions d'essai... »
      questions: []
    - id: a15
      titre: Rendu attendu
      contenu:
          - type: paragraphe
            texte: À la fin de la séance, déposez votre fichier 3e_S06_nom.odt.
          - type: paragraphe
            texte: Le fichier doit être rendu même si toutes les activités ne sont pas terminées.
      questions: []
    - id: a16
      titre: À retenir
      contenu:
          - type: paragraphe
            texte: Pour comparer expérimentalement plusieurs solutions, il faut modifier un seul paramètre et conserver les autres conditions aussi constantes que possible.
          - type: paragraphe
            texte: Réaliser plusieurs mesures permet de mieux représenter le comportement réel du système.
          - type: paragraphe
            texte: Une conclusion expérimentale doit toujours être liée aux conditions dans lesquelles les essais ont été réalisés.
          - type: paragraphe
            texte: Un protocole peut être corrigé et amélioré après l'expérience.
      questions: []
    - id: a17
      titre: Sources générales
      contenu:
          - type: liste
            elements:
                - Ministère de l'Éducation nationale – Programme de technologie du cycle 4
                - Éduscol – Ressources d'accompagnement du programme de technologie
          - type: lien
            titre: Programme de technologie du cycle 4
            url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
          - type: lien
            titre: Ressources d'accompagnement du programme de technologie
            url: https://eduscol.education.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
introduction:
    - type: titre
      texte: "Compétence visée : Mettre en œuvre, analyser et améliorer un protocole expérimental"
    - type: titre
      texte: Objectifs d’apprentissage
    - type: paragraphe
      texte: "Ce que les élèves vont apprendre :"
    - type: liste
      elements:
          - Un protocole doit être suffisamment précis pour pouvoir être reproduit.
          - Une expérience réelle peut révéler des défauts dans un protocole pourtant correct sur le papier.
          - Pour comparer plusieurs solutions, une seule caractéristique doit être modifiée à la fois.
          - Les autres conditions de l'expérience doivent rester aussi constantes que possible.
          - Plusieurs mesures permettent d'obtenir un résultat plus représentatif.
    - type: paragraphe
      texte: "Ce qu'ils vont apprendre à faire :"
    - type: liste
      elements:
          - Mettre en œuvre un protocole préparé précédemment.
          - Mesurer une tension électrique avec un multimètre.
          - Réaliser plusieurs essais dans les mêmes conditions.
          - Calculer une moyenne.
          - Identifier les limites d'une expérience.
          - Modifier un protocole après l'avoir confronté au réel.
          - Conclure à partir de mesures expérimentales.
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
