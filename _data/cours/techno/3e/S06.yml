titre: 'Séance 6 : L’IA peut-elle se tromper ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Pourquoi une IA peut-elle se tromper, et quelles précautions prendre ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
objectifs:
    connaissances:
        - 'Un biais : si les exemples d’entraînement sont mal choisis (déséquilibrés, avec un détail commun), l’IA apprend une mauvaise règle.'
        - Une IA doit être testée, ses résultats vérifiés par un humain, surtout quand la décision est importante.
    competences:
        - Mettre en évidence un biais.
        - Proposer des précautions.
pourquoi:
    - En séance 5, tu as entraîné un modèle avec des exemples variés.
    - Aujourd’hui, on fait exprès de mal l’entraîner pour comprendre d’où viennent les erreurs.
activites:
    -   id: a01
        titre: Un entraînement biaisé
        consigne: Tu vas entraîner volontairement une IA avec un lot de photos mal choisi (fond bleu / fond blanc), puis la piéger. On attend ce que répond le modèle et l’explication de son erreur.
        contenu:
            -   type: etapes
                elements:
                    - 'Prends le lot de photos « biaisé » fourni par le professeur : toutes les eaux claires sont sur fond bleu, toutes les eaux troubles sur fond blanc.'
                    - Entraîne un nouveau modèle dans Teachable Machine.
                    - Teste-le avec une photo d’eau claire sur fond blanc.
            -   type: paragraphe
                texte: Pourquoi faire exprès ? En créant le défaut nous-mêmes, on voit exactement d’où il vient.
        questions:
            -   id: q01
                type: texte
                enonce: Que répond le modèle entraîné avec le lot biaisé pour un verre d’eau claire sur fond blanc ? Explique pourquoi.
                aide: Une idée + « car » + une raison tirée de la séance.
            -   id: q02
                type: qcm
                enonce: Comment appelle-t-on ce défaut d’une IA mal entraînée ?
                choix:
                    -   id: a
                        texte: Un biais.
                    -   id: b
                        texte: Un virus.
                    -   id: c
                        texte: Une panne.
                aide: Élimine d’abord les réponses impossibles.
        ressources:
            -   type: lien
                titre: Teachable Machine (Google) — apprentissage automatique dans le navigateur
                url: https://teachablemachine.withgoogle.com/
    -   id: a02
        titre: Des biais dans la réalité
        transition: Ce défaut existe aussi dans de vraies IA.
        consigne: 'Tu vas analyser un cas réel de biais : un logiciel de recrutement, décrit ci-dessous. On attend une explication qui compare ce cas à ton expérience de la mission 1.'
        contenu:
            -   type: citation
                texte: 'Exemple réel souvent cité : un logiciel de recrutement entraîné surtout avec des CV d’hommes a défavorisé les CV de femmes ; il a été abandonné.'
            -   type: etapes
                elements:
                    - Lis l’exemple du logiciel de recrutement ci-dessous.
                    - 'Compare-le à ton expérience de la mission 1 : quel « détail » l’IA a-t-elle appris ?'
                    - Explique le biais.
            -   type: paragraphe
                texte: 'Pourquoi un cas réel ? Les biais ne restent pas dans les exercices : ils peuvent causer des injustices.'
        questions:
            -   id: q01
                type: texte
                enonce: Explique comment le biais du logiciel de recrutement s’est produit, en le comparant au fond bleu de la mission 1.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a03
        titre: Des précautions
        transition: Tu sais d’où viennent les biais. Comment s’en protéger ?
        consigne: Tu vas proposer des précautions pour utiliser une IA de façon responsable, à partir des deux biais étudiés. On attend deux précautions précises.
        contenu:
            -   type: etapes
                elements:
                    - Reprends les deux biais étudiés.
                    - Pour chacun, cherche ce qui aurait permis de l’éviter ou de le repérer.
                    - Écris deux précautions générales.
            -   type: paragraphe
                texte: Pourquoi des précautions ? On ne peut pas supprimer tous les biais, mais on peut les repérer avant qu’ils fassent du tort.
        questions:
            -   id: q01
                type: texte
                enonce: Propose deux précautions à prendre avant d’utiliser une IA pour une décision importante (recruter, soigner…).
                aide: Une idée réaliste + « Cela permet de… ».
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Les IA qui génèrent du texte peuvent inventer des informations.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi faut-il vérifier une réponse donnée par une IA conversationnelle ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu connais les limites de l’IA. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : pourquoi une IA peut-elle se tromper, et quelles précautions prendre ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Biais : exemples mal choisis → mauvaise règle apprise.'
    - 'Précautions : exemples variés, tests, contrôle humain.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
