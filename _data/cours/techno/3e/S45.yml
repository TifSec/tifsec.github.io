titre: 'Séance 45 : Soutenance du projet'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Notre cuve répond-elle au besoin du collège, et savons-nous le prouver ?
competences_bo:
    - Imaginer, concevoir et réaliser une ou des solutions en réponse à un besoin, à des exigences (de développement durable, par exemple) ou à la nécessité d’améliorations dans une démarche de créativité
    - Valider les solutions techniques par des simulations ou par des protocoles de tests
objectifs:
    connaissances:
        - 'Soutenir : présenter, démontrer, prouver, répondre aux questions.'
    competences:
        - Soutenir un projet à l’oral.
        - Évaluer avec une grille.
pourquoi:
    - C’est l’aboutissement du projet de l’année.
    - Chaque groupe soutient sa partie, avec démonstration de la simulation.
activites:
    -   id: a01
        titre: Évaluer un autre groupe
        consigne: Tu vas évaluer la soutenance d’un autre groupe avec la grille ci-dessous. On attend une évaluation des cinq critères et un conseil précis.
        contenu:
            -   type: tableau
                titre: Grille de soutenance
                colonnes:
                    - Critère
                    - Question
                lignes:
                    -   - Besoin
                        - Clair ?
                    -   - Choix
                        - Argumentés avec des chiffres ?
                    -   - Preuves
                        - Tests montrés ?
                    -   - Oral
                        - Sans lire, dans le temps ?
                    -   - Questions
                        - Réponses justes ?
            -   type: etapes
                elements:
                    - Écoute la soutenance d’un autre groupe.
                    - Pour chaque critère de la grille, note oui / en partie / non et un mot.
                    - Écris un conseil précis et bienveillant.
            -   type: paragraphe
                texte: Pourquoi évaluer ? Tu apprends ce qui rend une soutenance convaincante, et tu peux l’appliquer à la tienne.
        questions:
            -   id: q01
                type: texte
                enonce: Évalue la soutenance d’un autre groupe sur les cinq critères de la grille, et donne-lui un conseil.
                aide: Combien d’éléments sont demandés ?
    -   id: a02
        titre: Notre soutenance
        transition: Fais le point sur ta soutenance.
        consigne: 'Tu vas faire le point sur la soutenance de ton groupe : la question posée par le jury et votre réponse. On attend la question, la réponse et le lien avec ta préparation.'
        contenu:
            -   type: etapes
                elements:
                    - Après votre passage, note la question posée par le jury.
                    - Écris ce que vous avez répondu.
                    - Dis si la réponse était préparée (séance 44).
            -   type: paragraphe
                texte: 'Pourquoi noter la question ? C’est souvent elle qui montre ce que le jury a trouvé flou : utile pour la suite.'
        questions:
            -   id: q01
                type: texte
                enonce: Quelle question le jury vous a-t-il posée, et qu’avez-vous répondu ? Était-elle préparée ?
                aide: Repère le verbe de la question.
    -   id: a03
        titre: Le bilan du projet
        transition: Les soutenances sont terminées. Fais le bilan du projet.
        consigne: Tu vas faire le bilan du projet cuve en le comparant au besoin du collège posé en séance 16. On attend un bilan argumenté et ce qui manque pour une vraie installation.
        contenu:
            -   type: etapes
                elements:
                    - Relis le besoin du collège (séance 16).
                    - Compare avec ce que fait votre prototype.
                    - Écris ce qui manque pour une vraie cuve au collège.
            -   type: paragraphe
                texte: Pourquoi revenir au besoin ? Un projet se juge sur le besoin de départ, pas sur la beauté du programme.
        questions:
            -   id: q01
                type: texte
                enonce: Votre cuve répond-elle au besoin du collège ? Que faudrait-il encore pour l’installer vraiment ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Si un budget arrive, la cuve pourra être construite.
        questions:
            -   id: q01
                type: texte
                enonce: Que faudrait-il acheter en premier ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Fais le bilan.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : notre cuve répond-elle au besoin du collège, et savons-nous le prouver ? Dis aussi ce que tu as appris.'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Soutenir : besoin, choix, preuves, oral, questions.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
