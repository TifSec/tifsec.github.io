titre: 'Séance 45 : Soutenance du projet'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Notre cuve répond-elle au besoin du collège, et savons-nous le prouver ?
competences_bo:
    - Imaginer, concevoir et réaliser une ou des solutions en réponse à un besoin, à des exigences (de développement durable, par exemple) ou à la nécessité d’améliorations dans une démarche de créativité
    - Valider les solutions techniques par des simulations ou par des protocoles de tests
objectifs:
    connaissances:
        - 'Soutenir : présenter, démontrer, prouver, répondre aux questions.'
    competences:
        - Soutenir un projet à l’oral.
        - Évaluer avec une grille.
pourquoi:
    - C’est l’aboutissement du projet de l’année.
    - Chaque groupe soutient sa partie, avec démonstration de la simulation.
activites:
    -   id: a01
        titre: Évaluer
        contenu:
            -   type: tableau
                colonnes:
                    - Critère
                    - Question
                lignes:
                    -   - Besoin
                        - Clair ?
                    -   - Choix
                        - Argumentés avec des chiffres ?
                    -   - Preuves
                        - Tests montrés ?
                    -   - Oral
                        - Sans lire, dans le temps ?
                    -   - Questions
                        - Réponses justes ?
        questions:
            -   id: q01
                type: texte
                enonce: Évalue un groupe sur les cinq critères et donne un conseil.
                aide: Combien d’éléments sont demandés ?
    -   id: a02
        titre: Notre soutenance
        transition: Fais le point sur ta soutenance.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle question vous a été posée, et qu’avez-vous répondu ?
                aide: Repère le verbe de la question.
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Si un budget arrive, la cuve pourra être construite.
        questions:
            -   id: q01
                type: texte
                enonce: Que faudrait-il acheter en premier ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Fais le bilan.
        questions:
            -   id: q01
                type: texte
                enonce: Réponds au problème du jour et dis ce que tu as appris.
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Soutenir : besoin, choix, preuves, oral, questions.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
