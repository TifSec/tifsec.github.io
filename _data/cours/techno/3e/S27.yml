titre: 'Séance 27 : Quel matériau et quel procédé pour le couvercle-filtre ?'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment choisir le matériau et le procédé du couvercle-filtre, puis le modéliser ?
competences_bo:
    - Caractériser et choisir un objet ou un système technique selon différents critères
    - Imaginer, concevoir et réaliser une ou des solutions en réponse à un besoin, à des exigences (de développement durable, par exemple) ou à la nécessité d’améliorations dans une démarche de créativité
objectifs:
    connaissances:
        - Le couvercle-filtre retient les feuilles et supporte le capteur ; il doit résister à l’eau et au soleil, être léger, démontable pour le nettoyage.
        - Contraintes techniques (rigidité, UV, eau) et environnementales (recyclable, peu de matière) guident le choix ; on modélise la pièce en CAO.
    competences:
        - Justifier le choix d’un matériau et d’un procédé.
        - Modéliser une pièce en CAO.
pourquoi:
    - En 4e, tu as choisi un matériau de pale et pris en main Tinkercad.
    - 'Aujourd’hui : le couvercle-filtre de la cuve.'
activites:
    -   id: a01
        titre: Choisir
        consigne: Tu vas choisir le matériau et le procédé du couvercle-filtre de la cuve, qui retient les feuilles et porte le capteur, à partir du document 1. On attend un choix justifié par une contrainte technique et une contrainte environnementale.
        contenu:
            -   type: tableau
                titre: Document 1 — Trois solutions (indicatif)
                colonnes:
                    - Critère
                    - Contreplaqué découpé au laser
                    - PETG imprimé en 3D
                    - Grille inox du commerce
                lignes:
                    -   - Résiste à l’eau
                        - Mal (gonfle)
                        - Bien
                        - Très bien
                    -   - Résiste au soleil (UV)
                        - Moyen
                        - Bien
                        - Très bien
                    -   - Fabrication au collège
                        - Oui
                        - Oui
                        - Non (achat)
                    -   - Recyclable
                        - Valorisable
                        - Oui
                        - Oui
            -   type: etapes
                elements:
                    - Lis le rôle du couvercle-filtre.
                    - Lis le document 1 critère par critère.
                    - Élimine ce qui ne résiste pas à l’eau ou ne se fabrique pas au collège.
                    - Justifie avec une contrainte technique et une contrainte environnementale.
            -   type: paragraphe
                texte: Pourquoi deux types de contraintes ? La pièce doit tenir dehors pendant des années ET avoir le moins d’impact possible.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, quel matériau et quel procédé choisis-tu pour le couvercle-filtre de la cuve ? Justifie avec une contrainte technique et une contrainte environnementale.
                aide: « D’après le document… » (réflexe n° 2).
    -   id: a02
        titre: Modéliser
        transition: Le matériau est choisi. Modélise la pièce.
        consigne: Tu vas modéliser le couvercle-filtre de la cuve dans Tinkercad, avec ses trous de filtrage et l’emplacement du capteur à ultrasons. On attend une description précise de ta pièce.
        contenu:
            -   type: etapes
                elements:
                    - Dans Tinkercad, crée un disque de 300 mm de diamètre et 4 mm d’épaisseur (ou un modèle réduit).
                    - Ajoute des perçages de 5 mm pour filtrer l’eau.
                    - Ajoute deux perçages de 17 mm à 26 mm d’entraxe pour le capteur à ultrasons (comme en 4e).
                    - Regroupe.
            -   type: paragraphe
                texte: 'Pourquoi 17 mm ? Les « yeux » du capteur font 16 mm : 1 mm de jeu permet de l’emboîter.'
        questions:
            -   id: q01
                type: texte
                enonce: 'Décris le couvercle-filtre que tu as modélisé dans Tinkercad : dimensions, nombre de trous de filtrage, emplacement du capteur.'
                aide: Combien d’éléments sont demandés ?
        ressources:
            -   type: lien
                titre: Tinkercad — conception 3D (connexion avec le code de classe du professeur)
                url: https://www.tinkercad.com/
    -   id: a03
        titre: Vérifier la fabrication
        transition: La pièce est dessinée. Peut-on la fabriquer ?
        consigne: Tu vas vérifier que ton couvercle-filtre peut être fabriqué avec l’imprimante 3D du collège. On attend une solution si la pièce est trop grande.
        contenu:
            -   type: paragraphe
                texte: 'Contrainte : le plateau de l’imprimante 3D du collège mesure 20 cm × 20 cm.'
            -   type: etapes
                elements:
                    - Lis la contrainte de l’imprimante 3D du collège (ci-dessous).
                    - Compare avec les dimensions de ton couvercle.
                    - Propose une solution si la pièce est trop grande.
            -   type: paragraphe
                texte: Pourquoi vérifier ? Une pièce parfaite en CAO ne sert à rien si la machine ne peut pas la fabriquer.
        questions:
            -   id: q01
                type: texte
                enonce: L’imprimante 3D du collège imprime des pièces de 20 cm au maximum. Comment fabriquer ton couvercle-filtre de 30 cm ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le PETG est recyclable, mais seulement s’il est trié.
        questions:
            -   id: q01
                type: texte
                enonce: Que faudrait-il écrire sur la pièce pour faciliter son recyclage ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment as-tu choisi et modélisé le couvercle-filtre de la cuve ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Choisir matériau et procédé : contraintes techniques et environnementales.'
    - 'Modéliser en CAO : cotes, perçages.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
