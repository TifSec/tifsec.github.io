titre: "Quel support répondrait à un besoin précis ?"
theme: "Concevoir un support utile en 3D"
problematique: "Quel support répondrait à un besoin précis ?"
pourquoi: "Passer d’un besoin à un modèle numérique vérifié et expliqué."
application: "Créer, modifier et vérifier un modèle 3D en suivant le besoin et les dimensions indiquées."
lien_precedent: "Reprends une méthode des séances précédentes : elle t’aidera pour quel support répondrait à un besoin précis ?."
prerequis:
    - "Lire une consigne et repérer les informations données."
    - "Réutiliser une méthode déjà rencontrée, puis vérifier ton résultat."
notions:
    - titre: "Un exemple pour démarrer"
      texte: "Pour dessiner un support, commence par une esquisse plane, cote ses dimensions, puis extrude la forme. Chaque étape répond à un besoin mesurable. Aujourd’hui, on l’applique à Onshape."
objectifs:
    connaissances:
        - "Passer d’un besoin à un modèle numérique vérifié et expliqué."
    competences:
        - "Créer, modifier et vérifier un modèle 3D en suivant le besoin et les dimensions indiquées."
        - "Justifier une réponse avec une information observée ou un résultat de test."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Passer d’un besoin à un modèle numérique vérifié et expliqué."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Créer, modifier et vérifier un modèle 3D en suivant le besoin et les dimensions indiquées."
    - type: paragraphe
      texte: "Dans la vie réelle : Pour dessiner un support, commence par une esquisse plane, cote ses dimensions, puis extrude la forme. Chaque étape répond à un besoin mesurable."
    - type: paragraphe
      texte: "Nous allons observer un exemple, essayer avec de l’aide, puis réutiliser la méthode. Les étapes sont rappelées : choisis celles qui répondent au problème."
activites:
    - id: a01
      titre: "Observer l’exemple"
      pourquoi: "L’exemple montre une première méthode avant que tu essaies."
      demarche:
          - "Lis la consigne et repère ce qui est demandé."
          - "Choisis une méthode déjà apprise et vérifie-la sur le cas proposé."
          - "Garde une trace courte de ton résultat."
      contenu:
          - type: paragraphe
            texte: "Lis la situation : Quel support répondrait à un besoin précis ?. Repère le besoin, les informations utiles et le résultat attendu."
      questions:
          - id: q01
            type: texte
            obligatoire: true
            enonce: "Qu’est-ce qu’on cherche à comprendre ou à réaliser ?"
            aide: "Relis l’exemple et cite une information précise."
    - id: a02
      titre: "Essayer avec un guide"
      pourquoi: "Tu réutilises les étapes de l’exemple sur une situation proche."
      demarche:
          - "Lis la consigne et repère ce qui est demandé."
          - "Choisis une méthode déjà apprise et vérifie-la sur le cas proposé."
          - "Garde une trace courte de ton résultat."
      contenu:
          - type: paragraphe
            texte: "Créer, modifier et vérifier un modèle 3D en suivant le besoin et les dimensions indiquées."
      questions:
          - id: q01
            type: texte
            obligatoire: true
            enonce: "Quelle étape as-tu faite en premier ? Quelle information t’a aidé ?"
            aide: "Relis l’exemple et cite une information précise."
    - id: a03
      titre: "Réinvestir"
      pourquoi: "Tu changes de situation pour vérifier que tu sais réutiliser la méthode."
      demarche:
          - "Lis la consigne et repère ce qui est demandé."
          - "Choisis une méthode déjà apprise et vérifie-la sur le cas proposé."
          - "Garde une trace courte de ton résultat."
      contenu:
          - type: paragraphe
            texte: "Applique la méthode à un autre cas de Onshape. Compare le résultat attendu et le résultat obtenu ; si cela ne fonctionne pas, modifie une seule chose puis recommence."
      questions:
          - id: q01
            type: texte
            obligatoire: true
            enonce: "Qu’as-tu changé et qu’est-ce que cela a amélioré ?"
            aide: "Relis l’exemple et cite une information précise."
    - id: a04
      titre: "Garder une trace"
      pourquoi: "Une trace courte te permettra de retrouver la méthode plus tard."
      demarche:
          - "Lis la consigne et repère ce qui est demandé."
          - "Choisis une méthode déjà apprise et vérifie-la sur le cas proposé."
          - "Garde une trace courte de ton résultat."
      contenu:
          - type: paragraphe
            texte: "Écris une phrase qui résume ce que tu sais maintenant faire dans « Quel support répondrait à un besoin précis ? ». Ajoute une preuve ou un exemple."
      questions:
          - id: q01
            type: texte
            obligatoire: true
            enonce: "Quelle méthode veux-tu retenir pour la prochaine séance ?"
            aide: "Relis l’exemple et cite une information précise."
ressources:
    - titre: "Aide pour Onshape"
      url: "https://cad.onshape.com/help/Content/PartStudio/extrude.htm"
      pourquoi: "Utilise cette ressource pour rechercher une information utile, puis reformule avec tes mots."
reperes_officiels:
    programme: "Technologie au cycle 4 — programme officiel applicable en 3e à partir de la rentrée 2026."
    lien: "https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A"
    contribution: "Cette séance contribue à : Passer d’un besoin à un modèle numérique vérifié et expliqué."
bilan:
    - "Je peux expliquer ce que j’ai appris avec mes mots."
    - "Je peux montrer une réponse, une production ou un test qui prouve mon travail."
