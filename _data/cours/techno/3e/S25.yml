titre: 'Séance 25 : Quels capteurs pour notre cuve ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Quelle chaîne d’information permettra à la cuve de surveiller l’eau et d’alerter ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - 'Chaîne d’information de la cuve : acquérir (capteur de niveau à ultrasons, capteur de pluie, bouton), traiter (micro:bit), communiquer (écran, LED, buzzer, radio).'
    competences:
        - Décrire la chaîne d’information d’un objet à concevoir.
        - Choisir les capteurs selon les données à acquérir.
pourquoi:
    - En séance 22, tu as vu ce qu’est un objet connecté. En séance 23, tu as fait la chaîne d’énergie.
    - 'Aujourd’hui : la chaîne d’information de la cuve.'
activites:
    -   id: a01
        titre: Quelles données ?
        consigne: Tu vas choisir les capteurs de la cuve à partir des données qu’elle doit acquérir, en t’appuyant sur ceux de nos maquettes. On attend le capteur de chaque donnée.
        contenu:
            -   type: etapes
                elements:
                    - 'Relis le cahier des charges : ce que la cuve doit surveiller.'
                    - Pour chaque donnée, rappelle-toi les capteurs vus sur nos maquettes (ultrasons du monte-charge, boutons…).
                    - Choisis le capteur.
            -   type: paragraphe
                texte: 'Pourquoi partir des données ? On ne choisit pas un capteur « parce qu’il existe » : on le choisit pour une information dont on a besoin.'
        questions:
            -   id: q01
                type: tableau
                enonce: Pour chaque donnée que la cuve doit acquérir, choisis le capteur.
                colonnes:
                    - Donnée à acquérir
                    - Capteur
                lignes:
                    -   - Hauteur d’eau
                        - ''
                    -   - Il pleut ou non
                        - ''
                    -   - L’utilisateur demande l’affichage
                        - ''
                aide: Capteur ou bouton → acquérir ; carte → traiter ; écran, voyant → communiquer.
    -   id: a02
        titre: La chaîne complète
        transition: Les capteurs sont choisis. Construis toute la chaîne.
        consigne: Tu vas construire la chaîne d’information complète de la cuve, de ses capteurs jusqu’à l’alerte radio. On attend chaque constituant dans la bonne colonne.
        contenu:
            -   type: etapes
                elements:
                    - Range les capteurs dans « Acquérir ».
                    - Écris la carte dans « Traiter ».
                    - 'Liste dans « Communiquer » tout ce qui informe : écran, LED, buzzer, radio.'
            -   type: paragraphe
                texte: 'Pourquoi la radio dans « communiquer » ? Elle ne mesure rien et ne décide rien : elle transmet l’information à une autre carte.'
        questions:
            -   id: q01
                type: tableau
                enonce: Construis la chaîne d’information de la cuve du collège.
                colonnes:
                    - Acquérir
                    - Traiter
                    - Communiquer
                lignes:
                    -   - ''
                        - ''
                        - ''
                aide: Ligne × colonne.
            -   id: q02
                type: texte
                enonce: Pourquoi la radio fait-elle partie de « communiquer » dans la chaîne d’information de la cuve ?
                aide: Capteur ou bouton → acquérir ; carte → traiter ; écran, voyant → communiquer.
    -   id: a03
        titre: Données et décisions
        transition: Que fera la carte de ces données ?
        consigne: Tu vas imaginer les décisions que la carte de la cuve prendra à partir des données de ses capteurs. On attend deux décisions écrites avec SI … ALORS.
        contenu:
            -   type: etapes
                elements:
                    - Imagine ce que la carte doit faire de chaque donnée.
                    - Écris chaque décision sous la forme SI … ALORS ….
                    - Pense à la sécurité de la pompe (cuve vide).
            -   type: paragraphe
                texte: 'Pourquoi des décisions ? Ce sont elles qui rendent la cuve « intelligente » : elles deviendront l’algorithme de la séance 35.'
        questions:
            -   id: q01
                type: texte
                enonce: Donne deux décisions que la carte de la cuve devra prendre à partir des données de ses capteurs (SI … ALORS …).
                aide: Bloc par bloc (réflexe n° 9).
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un capteur d’eau trouble pourrait utiliser l’IA de la séance 5.
        questions:
            -   id: q01
                type: texte
                enonce: Quel constituant faudrait-il ajouter à la cuve ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quelle chaîne d’information permettra à la cuve de surveiller l’eau et d’alerter ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Cuve : acquérir (ultrasons, pluie, bouton) → traiter (micro:bit) → communiquer (écran, LED, buzzer, radio).'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
