titre: 'Séance 25 : Quels capteurs pour notre cuve ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Quelle chaîne d’information permettra à la cuve de surveiller l’eau et d’alerter ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - 'Chaîne d’information de la cuve : acquérir (capteur de niveau à ultrasons, capteur de pluie, bouton), traiter (micro:bit), communiquer (écran, LED, buzzer, radio).'
    competences:
        - Décrire la chaîne d’information d’un objet à concevoir.
        - Choisir les capteurs selon les données à acquérir.
pourquoi:
    - En séance 22, tu as vu ce qu’est un objet connecté. En séance 23, tu as fait la chaîne d’énergie.
    - 'Aujourd’hui : la chaîne d’information de la cuve.'
activites:
    -   id: a01
        titre: Quelles données ?
        questions:
            -   id: q01
                type: tableau
                enonce: Pour chaque donnée, choisis le capteur.
                colonnes:
                    - Donnée à acquérir
                    - Capteur
                lignes:
                    -   - Hauteur d’eau
                        - ''
                    -   - Il pleut ou non
                        - ''
                    -   - L’utilisateur demande l’affichage
                        - ''
                aide: Ligne × colonne.
    -   id: a02
        titre: La chaîne complète
        transition: Les capteurs sont choisis. Construis toute la chaîne.
        questions:
            -   id: q01
                type: tableau
                enonce: Construis la chaîne d’information de la cuve.
                colonnes:
                    - Acquérir
                    - Traiter
                    - Communiquer
                lignes:
                    -   - ''
                        - ''
                        - ''
                aide: Ligne × colonne.
            -   id: q02
                type: texte
                enonce: Pourquoi la radio fait-elle partie de « communiquer » ?
                aide: Capteur ou bouton → acquérir ; carte → traiter ; écran, voyant → communiquer.
    -   id: a03
        titre: Données et décisions
        transition: Que fera la carte de ces données ?
        questions:
            -   id: q01
                type: texte
                enonce: Donne deux décisions que la carte devra prendre à partir des données.
                aide: Combien d’éléments sont demandés ?
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un capteur d’eau trouble pourrait utiliser l’IA de la séance 5.
        questions:
            -   id: q01
                type: texte
                enonce: Quel constituant faudrait-il ajouter ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quelle chaîne d’information pour la cuve ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Cuve : acquérir (ultrasons, pluie, bouton) → traiter (micro:bit) → communiquer (écran, LED, buzzer, radio).'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
