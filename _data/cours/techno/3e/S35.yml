titre: 'Séance 35 : Que doit décider la cuve ?'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Quelles données la cuve utilise-t-elle, et quel algorithme décidera de ses actions ?
competences_bo:
    - Concevoir, écrire, tester et mettre au point un programme
objectifs:
    connaissances:
        - 'Concevoir un algorithme : lister les données d’entrée (niveau, pluie, bouton), les sorties (pompe, alerte, affichage, radio), puis les règles de décision.'
        - 'On découpe en fonctions confiées aux groupes : mesurerNiveau, gererPompe, declencherAlerte, afficher, envoyerRadio.'
    competences:
        - Déterminer les données d’un problème.
        - Concevoir un algorithme et le découper en fonctions.
pourquoi:
    - En séances 25 et 26, tu as défini les capteurs et la mesure. En séance 29, tu as utilisé des fonctions.
    - Aujourd’hui, la classe conçoit l’algorithme de la cuve et répartit les fonctions.
activites:
    -   id: a01
        titre: Les données
        questions:
            -   id: q01
                type: tableau
                enonce: Complète les entrées et sorties.
                colonnes:
                    - Type
                    - Données
                lignes:
                    -   - Entrées
                        - ''
                    -   - Sorties
                        - ''
                aide: Ligne × colonne.
    -   id: a02
        titre: L’algorithme
        transition: Les données sont connues. Conçois les règles.
        contenu:
            -   type: paragraphe
                texte: 'Règles décidées par la classe : alerte « pleine » au-dessus de 90 % ; pompe interdite sous 10 % ; affichage du volume quand on appuie sur le bouton ; envoi radio de l’alerte.'
        questions:
            -   id: q01
                type: texte
                enonce: Écris l’algorithme principal en langage naturel, en appelant des fonctions.
                aide: Combien d’éléments sont demandés ?
            -   id: q02
                type: tableau
                enonce: Répartissez les fonctions entre les groupes.
                colonnes:
                    - Fonction
                    - Groupe
                lignes:
                    -   - mesurerNiveau
                        - ''
                    -   - declencherAlerte
                        - ''
                aide: Ligne × colonne.
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Deux règles peuvent se contredire.
        questions:
            -   id: q01
                type: texte
                enonce: Que faire si la cuve est pleine et que la pompe doit être bloquée ? Y a-t-il contradiction ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quelles données, et quel algorithme pour la cuve ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Concevoir un algorithme : entrées, sorties, règles, fonctions.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
