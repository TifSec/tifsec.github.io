titre: 'Séance 35 : Que doit décider la cuve ?'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Quelles données la cuve utilise-t-elle, et quel algorithme décidera de ses actions ?
competences_bo:
    - Concevoir, écrire, tester et mettre au point un programme
objectifs:
    connaissances:
        - 'Concevoir un algorithme : lister les données d’entrée (niveau, pluie, bouton), les sorties (pompe, alerte, affichage, radio), puis les règles de décision.'
        - 'On découpe en fonctions confiées aux groupes : mesurerNiveau, gererPompe, declencherAlerte, afficher, envoyerRadio.'
    competences:
        - Déterminer les données d’un problème.
        - Concevoir un algorithme et le découper en fonctions.
pourquoi:
    - En séances 25 et 26, tu as défini les capteurs et la mesure. En séance 29, tu as utilisé des fonctions.
    - Aujourd’hui, la classe conçoit l’algorithme de la cuve et répartit les fonctions.
activites:
    -   id: a01
        titre: Entrées et sorties
        consigne: Tu vas lister les données que la carte de la cuve reçoit (entrées) et ce qu’elle commande (sorties), à partir de sa chaîne d’information (séance 25). On attend les deux listes.
        contenu:
            -   type: etapes
                elements:
                    - Relis la chaîne d’information de la cuve (séance 25).
                    - Les entrées sont ce que la carte reçoit (capteurs, bouton).
                    - Les sorties sont ce que la carte commande (pompe, LED, écran, radio).
            -   type: paragraphe
                texte: 'Pourquoi entrées et sorties ? Un algorithme transforme des entrées en sorties : il faut d’abord savoir lesquelles.'
        questions:
            -   id: q01
                type: tableau
                enonce: Écris les entrées et les sorties de la carte de la cuve.
                colonnes:
                    - Type
                    - Données
                lignes:
                    -   - Entrées
                        - ''
                    -   - Sorties
                        - ''
                aide: Une entrée donne une information à la carte (mesure, appui) ; une sortie reçoit un ordre (pompe, alarme, écran, radio). Range tout ce que la cuve possède.
    -   id: a02
        titre: L’algorithme principal
        transition: Les données sont connues. Conçois les règles.
        consigne: Tu vas écrire l’algorithme principal de la cuve à partir des règles décidées par la classe (ci-dessous), en appelant des fonctions. On attend un algorithme qui traite les quatre règles.
        contenu:
            -   type: paragraphe
                texte: 'Règles décidées par la classe : alerte « pleine » au-dessus de 90 % ; pompe interdite sous 10 % ; affichage du volume quand on appuie sur le bouton ; envoi radio de l’alerte vers la salle.'
            -   type: etapes
                elements:
                    - Lis les règles décidées par la classe.
                    - Écris l’algorithme principal avec TOUJOURS, SI … ALORS, QUAND.
                    - Remplace chaque action détaillée par l’appel d’une fonction (mesurerNiveau, declencherAlerte…).
            -   type: paragraphe
                texte: Pourquoi appeler des fonctions ? L’algorithme principal reste court et lisible ; chaque groupe programmera une fonction.
        questions:
            -   id: q01
                type: texte
                enonce: Écris l’algorithme principal de la cuve en langage naturel, en appelant des fonctions.
                aide: Écris TOUJOURS, puis appelle une fonction pour mesurer, puis des SI pour chaque décision (pleine, presque vide, pluie), en appelant d’autres fonctions pour agir.
    -   id: a03
        titre: Répartir les fonctions
        transition: L’algorithme est écrit. Répartissez le travail.
        consigne: Tu vas répartir avec la classe les fonctions de l’algorithme de la cuve entre les groupes. On attend la répartition notée.
        contenu:
            -   type: etapes
                elements:
                    - Liste les fonctions appelées dans ton algorithme.
                    - Avec la classe, attribue chaque fonction à un groupe.
                    - Note la tienne.
            -   type: paragraphe
                texte: Pourquoi répartir ? Comme dans une entreprise, chaque équipe programme une partie ; il faudra ensuite les assembler (séance 42).
        questions:
            -   id: q01
                type: tableau
                enonce: Note quel groupe programme chaque fonction de la cuve.
                colonnes:
                    - Fonction
                    - Groupe
                lignes:
                    -   - mesurerNiveau
                        - ''
                    -   - declencherAlerte
                        - ''
                aide: Pour chaque fonction, attribue un groupe, en évitant qu’un groupe en ait deux pendant qu’un autre n’en a aucune.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Deux règles peuvent se contredire.
        questions:
            -   id: q01
                type: texte
                enonce: 'La cuve est pleine et la pompe doit être bloquée : y a-t-il une contradiction dans les règles ?'
                aide: 'Relis les deux règles : bloquer la pompe dépend de quel seuil ? Est-ce le même que celui de la cuve pleine ?'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quelles données la cuve utilise-t-elle, et quel algorithme décidera de ses actions ?'
                aide: Cite les entrées, les sorties, les grandes règles de décision et la liste des fonctions.
retenir:
    - 'Concevoir un algorithme : entrées, sorties, règles, fonctions.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
