titre: 'Séance 37 : La cuve prévient l’afficheur'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment deux objets communiquent-ils une alerte par radio ?
competences_bo:
    - Concevoir, écrire, tester et mettre au point un programme
    - Imaginer, concevoir et réaliser une ou des solutions en réponse à un besoin, à des exigences (de développement durable, par exemple) ou à la nécessité d’améliorations dans une démarche de créativité
objectifs:
    connaissances:
        - La carte de la cuve envoie l’alerte par radio ; la carte « afficheur » (dans la salle) la reçoit et l’affiche.
        - Test réel avec la carte libre et la carte du tracker, reprogrammée le temps de la séance, puis on lui remet son programme.
    competences:
        - Programmer un émetteur et un récepteur d’alerte.
        - Tester une communication réelle.
pourquoi:
    - En 4e, tu as programmé une liaison radio. En séance 36, tu as programmé ta fonction.
    - Aujourd’hui, la cuve prévient l’afficheur.
activites:
    -   id: a01
        titre: Simuler
        contenu:
            -   type: etapes
                elements:
                    - 'Ajoute envoyerRadio à la fonction declencherAlerte : radio envoyer chaîne « PLEINE ».'
                    - 'Récepteur : quand une chaîne est reçue, l’afficher et jouer un son.'
                    - Teste dans le simulateur (deux cartes).
        questions:
            -   id: q01
                type: texte
                enonce: Décris les blocs de l’émetteur et du récepteur.
                aide: Bloc par bloc (réflexe n° 9).
        ressources:
            -   type: lien
                titre: MakeCode micro:bit (gratuit, dans le navigateur)
                url: https://makecode.microbit.org/
    -   id: a02
        titre: Test réel (poste maquette)
        transition: La simulation marche. Testons en vrai.
        contenu:
            -   type: paragraphe
                texte: Le professeur téléverse l’émetteur sur la carte libre et le récepteur sur la carte du tracker (programme du tracker sauvegardé).
        questions:
            -   id: q01
                type: texte
                enonce: Le test réel a-t-il fonctionné ? À quelle distance ?
                aide: Attendu ou observé ?
            -   id: q02
                type: qcm
                enonce: Après le test, que faut-il faire sur la carte du tracker ?
                choix:
                    -   id: a
                        texte: Lui remettre son programme d’origine.
                    -   id: b
                        texte: Rien.
                    -   id: c
                        texte: La garder en récepteur.
                aide: Relis l’exemple expliqué.
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Plusieurs cuves dans le collège ?
        questions:
            -   id: q01
                type: texte
                enonce: Comment l’afficheur saurait-il quelle cuve alerte ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment deux objets communiquent-ils une alerte par radio ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Deux objets communicants : même groupe radio, émission, réception, test réel.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
