titre: 'Séance 1 : La 3e en technologie : ce qui nous attend'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Que faut-il savoir faire en technologie pour réussir sa 3e et le brevet ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
    - Comprendre et modifier un programme associé à une fonctionnalité d’un objet ou d’un système technique
objectifs:
    connaissances:
        - 'Au DNB, la technologie fait partie de l’épreuve de sciences (format 2027 à confirmer : deux disciplines sur trois, environ 30 minutes par discipline).'
        - Les réflexes R1 à R16 de 5e et de 4e restent la base ; de nouveaux réflexes arrivent en 3e.
    competences:
        - Réviser les réflexes R1 à R16.
        - Faire un diagnostic de ses acquis.
pourquoi:
    - En 5e et en 4e, tu as étudié les quatre maquettes, programmé des jeux et un objet communicant.
    - 'En 3e, tu vas concevoir un objet nouveau : la cuve d’eau de pluie intelligente. Et tu prépares le brevet.'
activites:
    -   id: a01
        titre: Le brevet
        consigne: Tu vas découvrir comment la technologie est évaluée au brevet, à partir de la présentation de l’épreuve ci-dessous. On attend la durée de la partie technologie et une explication du réflexe R10 (gérer son temps).
        contenu:
            -   type: paragraphe
                texte: 'Selon la note de cadrage (à revérifier) : l’épreuve de sciences porte sur deux disciplines parmi physique-chimie, SVT et technologie, environ 30 minutes chacune, avec des points pour la maîtrise de la langue.'
            -   type: citation
                texte: 'Réflexe brevet n° 10 : je gère mon temps : je survole tout le sujet, je commence par ce que je sais, je garde du temps pour relire.'
            -   type: etapes
                elements:
                    - Lis la présentation de l’épreuve ci-dessous.
                    - Repère la durée de la partie technologie.
                    - Relis le réflexe R10 (gérer son temps) et explique-le avec tes mots.
            -   type: paragraphe
                texte: 'Pourquoi en parler dès la rentrée ? Chaque séance de 3e t’entraîne à une partie de l’épreuve : savoir où l’on va aide à travailler.'
        questions:
            -   id: q01
                type: qcm
                enonce: D’après la présentation, combien de temps dure environ la partie de technologie au brevet (si elle est tirée au sort) ?
                choix:
                    -   id: a
                        texte: Environ 30 minutes.
                    -   id: b
                        texte: 2 heures.
                    -   id: c
                        texte: 5 minutes.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Pourquoi faut-il gérer son temps pendant les 30 minutes de technologie au brevet ? Utilise le réflexe R10.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a02
        titre: 'Diagnostic : une cuve connectée'
        transition: Tu connais l’épreuve. Fais le point sur tes acquis.
        consigne: 'Tu vas faire un diagnostic de tes acquis de 5e et de 4e sur un exemple : une cuve connectée (description et programme ci-dessous). On attend la fonction de chaque constituant et le programme traduit en français.'
        contenu:
            -   type: citation
                texte: 'Une cuve connectée : un capteur de niveau mesure la hauteur d’eau ; une carte micro:bit décide ; une LED rouge prévient quand la cuve est presque pleine ; une pompe envoie l’eau vers l’arrosage.'
            -   type: code
                texte: "toujours\n    si niveau d’eau > 90 alors\n        allumer la LED rouge\n    sinon\n        éteindre la LED rouge"
            -   type: etapes
                elements:
                    - Lis la description de la cuve connectée et son programme.
                    - Range chaque constituant dans sa fonction (acquérir, traiter, communiquer, agir).
                    - Traduis le programme en phrases (SI … ALORS … SINON).
            -   type: paragraphe
                texte: Pourquoi un diagnostic ? Tu vois ce que tu as retenu de la 5e et de la 4e, et ce qu’il faut revoir avant le brevet.
        questions:
            -   id: q01
                type: tableau
                enonce: Écris la fonction de chaque constituant de la cuve connectée décrite ci-dessus.
                colonnes:
                    - Constituant
                    - Fonction
                lignes:
                    -   - Capteur de niveau
                        - ''
                    -   - Carte micro:bit
                        - ''
                    -   - LED rouge
                        - ''
                    -   - Pompe
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
            -   id: q02
                type: texte
                enonce: Traduis le programme de la cuve connectée en algorithme, en langage naturel.
                aide: 'Bloc par bloc : quand ? quelle condition ? quelle action ?'
    -   id: a03
        titre: Mes réflexes
        transition: Fais le point sur tes réflexes.
        consigne: Tu vas faire le point sur les seize réflexes brevet appris en 5e et en 4e, rappelés ci-dessous. On attend un réflexe maîtrisé et un réflexe à travailler, chacun avec une raison.
        contenu:
            -   type: paragraphe
                texte: 'Réflexes de 5e : R1 à R10 ; réflexes de 4e : R11 appareil + unité, R12 algorithme, R13 bloc manquant, R14 comparer avec chiffres, R15 protocole, R16 relire.'
            -   type: etapes
                elements:
                    - Lis la liste des réflexes R1 à R16.
                    - Choisis celui que tu utilises le mieux, avec un exemple vécu.
                    - Choisis celui que tu dois travailler, et dis pourquoi.
            -   type: paragraphe
                texte: Pourquoi choisir un réflexe à travailler ? On progresse mieux sur un objectif précis que sur « tout revoir ».
        questions:
            -   id: q01
                type: texte
                enonce: Parmi les réflexes R1 à R16, lequel utilises-tu le mieux, et lequel dois-tu travailler cette année ? Pourquoi ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La cuve d’eau de pluie intelligente sera le projet de l’année.
        questions:
            -   id: q01
                type: texte
                enonce: Imagine une fonction que la cuve du collège devrait avoir.
                aide: Une idée réaliste + « Cela permet de… ».
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as fait le point. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : que faut-il savoir faire en technologie pour réussir sa 3e et le brevet ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Brevet : technologie dans l’épreuve de sciences (format 2027 à confirmer).'
    - Les réflexes R1 à R16 restent la base.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
