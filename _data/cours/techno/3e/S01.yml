titre: Comment travailler en technologie cette année ?
theme: Technologie — Comment travailler en technologie cette année ?
problematique: Comment travailler en technologie cette année ?
pourquoi: Les objectifs et le lien avec les situations concrètes sont présentés au début du cours ci-dessous.
application: Dans votre document, recopiez puis complétez le tableau suivant avec ce que vous pensez devoir faire dans chaque situation.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances: []
    competences: []
activites:
    - id: a02
      titre: 1. Le principe de travail
      contenu:
          - type: paragraphe
            texte: Cette année, vous allez régulièrement travailler à partir d'un document créé au début de la séance. Ce document sera à la fois votre brouillon, votre espace de recherche, votre espace de test et votre fichier de réponses.
          - type: paragraphe
            texte: Votre document n'a donc pas besoin d'être parfait. Vous pouvez y laisser vos essais, vos erreurs, vos idées abandonnées et les différentes solutions que vous avez testées.
          - type: paragraphe
            texte: "On ne rend pas uniquement ce qui fonctionne : on rend ce que l'on a fait."
      questions: []
    - id: a03
      titre: 2. Créer votre premier document
      contenu:
          - type: paragraphe
            texte: Ouvrez LibreOffice Writer.
          - type: paragraphe
            texte: Créez un nouveau document.
          - type: paragraphe
            texte: "Enregistrez-le immédiatement sous le nom : 3e_S01_nom.odt."
          - type: paragraphe
            texte: Remplacez nom par votre nom de famille.
      questions:
          - id: q01
            type: texte
            enonce: "Écrivez en haut du document : votre nom et votre prénom ; Séance 1 – Comment travailler en technologie cette année ?"
            suite: []
    - id: a04
      titre: 3. Que faire dans chaque situation ?
      contenu:
          - type: paragraphe
            texte: Dans votre document, recopiez puis complétez le tableau suivant avec ce que vous pensez devoir faire dans chaque situation.
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Situation
                - Ce que je dois faire
            lignes:
                - - Je viens d'arriver en cours.
                  - ""
                - - Je ne comprends pas une consigne.
                  - ""
                - - J'ai essayé quelque chose mais cela ne fonctionne pas.
                  - ""
                - - Mon voisin semble avoir trouvé une solution.
                  - ""
                - - Je pense avoir terminé mon travail.
                  - ""
                - - Il reste cinq minutes et mon travail n'est pas terminé.
                  - ""
                - - Mon document contient des essais ou des erreurs.
                  - ""
    - id: a05
      titre: 4. La méthode à utiliser pendant l'année
      contenu:
          - type: paragraphe
            texte: Comparez vos réponses avec les règles suivantes et complétez votre document si nécessaire.
          - type: etapes
            elements:
                - "Je commence rapidement : je lis la consigne et je crée immédiatement le fichier demandé."
                - "Je lis avant d'agir : je prends connaissance de l'ensemble de la consigne avant de commencer."
                - "Je garde des traces : j'écris mes réponses, mes idées, mes essais et mes difficultés dans mon document."
                - "J'essaie avant de demander : en cas de problème, je relis la consigne et je tente au moins une solution."
                - "Je peux échanger : je peux demander discrètement l'avis d'un camarade sans simplement copier son travail."
                - "Je demande de l'aide en expliquant : je montre ce que j'ai déjà essayé et j'explique précisément mon problème."
                - "Je sauvegarde régulièrement : je n'attends pas la fin de l'heure pour enregistrer mon travail."
                - "Je rends toujours mon fichier : même si le travail est incomplet ou contient encore des erreurs."
      questions: []
    - id: a06
      titre: "5. Mini-défi : mon espace de travail"
      contenu:
          - type: paragraphe
            texte: Ajoutez une nouvelle partie intitulée Mon espace de travail dans votre document.
          - type: paragraphe
            texte: Imaginez l'espace dans lequel vous travailleriez le mieux et présentez-le dans votre document. Il peut être réaliste ou imaginaire.
          - type: paragraphe
            texte: "Votre présentation doit obligatoirement contenir :"
          - type: liste
            elements:
                - un titre ;
                - un petit paragraphe expliquant votre idée ;
                - une liste d'au moins trois éléments importants pour vous ;
                - un tableau comportant au moins trois lignes ;
                - une image ou une capture d'écran.
          - type: paragraphe
            texte: Il n'y a pas de mauvaise réponse. L'objectif est de montrer que vous savez organiser et enrichir votre document.
      questions: []
    - id: a07
      titre: 6. Faire le bilan de votre travail
      contenu:
          - type: paragraphe
            texte: À la fin de votre document, ajoutez le tableau suivant et complétez-le.
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Mon bilan
                - Ma réponse
            lignes:
                - - Ce que j'ai réussi facilement
                  - ""
                - - Ce qui m'a posé problème
                  - ""
                - - Ce que j'ai essayé pour résoudre mon problème
                  - ""
                - - Ce que je ferai différemment la prochaine fois
                  - ""
    - id: a08
      titre: Rendu attendu
      contenu:
          - type: paragraphe
            texte: À la fin de la séance, déposez votre fichier 3e_S01_nom.odt à l'endroit indiqué par le professeur.
          - type: paragraphe
            texte: Le fichier doit être rendu même si votre travail n'est pas terminé. Ce qui compte aujourd'hui est de montrer votre travail, vos essais et votre progression pendant la séance.
      questions: []
    - id: a09
      titre: À retenir
      contenu:
          - type: paragraphe
            texte: Créer → chercher → essayer → garder des traces → améliorer → sauvegarder → rendre.
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
introduction:
    - type: titre
      texte: Objectifs de la séance
    - type: liste
      elements:
          - Comprendre la méthode de travail utilisée en technologie cette année.
          - Savoir créer, enregistrer et rendre correctement un document.
          - Comprendre que les essais, les erreurs et les recherches font partie du travail attendu.
          - Apprendre à garder une trace de son travail pendant toute la séance.
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
