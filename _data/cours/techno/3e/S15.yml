titre: 'Séance 15 : Brevet blanc n° 1 : correction et reprise'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Comment progresser à partir de mes erreurs du brevet blanc ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - 'Chaque erreur correspond souvent à un réflexe oublié : lire le verbe, citer le document, unité, justifier, argumenter.'
    competences:
        - Analyser ses erreurs.
        - Refaire un exercice proche avec le bon réflexe.
pourquoi:
    - En séance 14, tu as passé le brevet blanc n° 1.
    - 'Aujourd’hui, correction détaillée et remédiation : tu retravailles les réflexes ratés.'
activites:
    -   id: a01
        titre: Analyser mes erreurs
        contenu:
            -   type: tableau
                titre: Document 1
                colonnes:
                    - Erreur fréquente
                    - Réflexe
                lignes:
                    -   - Oublier l’unité
                        - R5
                    -   - Ne pas citer le document
                        - R2
                    -   - Inverser acquérir et traiter
                        - Chaîne d’information
                    -   - Argument sans preuve
                        - R19
                    -   - Mal gérer le temps
                        - R10, R21
        questions:
            -   id: q01
                type: texte
                enonce: Quelle a été ton erreur principale ? À quel réflexe correspond-elle d’après le document 1 ?
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
    -   id: a02
        titre: Remédiation
        transition: Tu connais ton erreur principale. Entraîne-toi.
        contenu:
            -   type: titre
                texte: Exercice de reprise
            -   type: citation
                texte: 'Une serre automatique : un capteur mesure la température ; si elle dépasse 30 °C, la carte ouvre la fenêtre avec un moteur ; un écran affiche la température.'
        questions:
            -   id: q01
                type: tableau
                enonce: Classe les constituants.
                colonnes:
                    - Constituant
                    - Fonction
                lignes:
                    -   - Capteur
                        - ''
                    -   - Carte
                        - ''
                    -   - Écran
                        - ''
                    -   - Moteur
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
            -   id: q02
                type: texte
                enonce: Écris l’algorithme de la serre.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
            -   id: q03
                type: texte
                enonce: 'Argumente en trois temps : la serre automatique économise-t-elle l’énergie ?'
                aide: Source → constituant qui transforme → forme d’énergie en sortie.
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: On veut aussi arroser.
        questions:
            -   id: q01
                type: texte
                enonce: Ajoute une condition d’arrosage à l’algorithme.
                aide: 'Bloc par bloc : quand ? quelle condition ? quelle action ?'
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Fais le point.
        questions:
            -   id: q01
                type: texte
                enonce: Quel réflexe vas-tu appliquer en priorité au brevet blanc n° 2 ? Comment ?
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Une erreur = un réflexe à retravailler.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
