titre: 'Séance 15 : Brevet blanc n° 1 : correction et reprise'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Comment progresser à partir de mes erreurs du brevet blanc ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - 'Chaque erreur correspond souvent à un réflexe oublié : lire le verbe, citer le document, unité, justifier, argumenter.'
    competences:
        - Analyser ses erreurs.
        - Refaire un exercice proche avec le bon réflexe.
pourquoi:
    - En séance 14, tu as passé le brevet blanc n° 1.
    - 'Aujourd’hui, correction détaillée et remédiation : tu retravailles les réflexes ratés.'
activites:
    -   id: a01
        titre: Analyser mes erreurs
        consigne: Tu vas analyser ta copie corrigée du brevet blanc n° 1 avec le tableau des erreurs fréquentes (document 1). On attend ton erreur principale et le réflexe qui lui correspond.
        contenu:
            -   type: tableau
                titre: Document 1 — Erreurs fréquentes et réflexes
                colonnes:
                    - Erreur fréquente
                    - Réflexe
                lignes:
                    -   - Oublier l’unité
                        - R5
                    -   - Ne pas citer le document
                        - R2
                    -   - Inverser acquérir et traiter
                        - Chaîne d’information
                    -   - Argument sans preuve
                        - R19
                    -   - Mal gérer le temps
                        - R10, R21
            -   type: etapes
                elements:
                    - Reprends ta copie corrigée du brevet blanc n° 1.
                    - Repère la question où tu as perdu le plus de points.
                    - Cherche dans le document 1 le réflexe qui correspond à ton erreur.
            -   type: paragraphe
                texte: Pourquoi relier erreur et réflexe ? Une erreur isolée se corrige une fois ; un réflexe retrouvé sert à toutes les questions du même type.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle a été ton erreur principale au brevet blanc n° 1 ? À quel réflexe correspond-elle d’après le document 1 ?
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
    -   id: a02
        titre: 'Reprise : la chaîne d’information'
        transition: Tu connais ton erreur principale. Entraîne-toi.
        consigne: 'Tu vas refaire, sur un cas nouveau (une serre automatique), le type de question le plus souvent raté : la chaîne d’information. On attend la fonction de chaque constituant.'
        contenu:
            -   type: citation
                texte: 'Une serre automatique : un capteur mesure la température ; si elle dépasse 30 °C, la carte ouvre la fenêtre avec un moteur ; un écran affiche la température.'
            -   type: etapes
                elements:
                    - Lis la description de la serre automatique.
                    - 'Pour chaque constituant, demande-toi : récupère-t-il une information, décide-t-il, informe-t-il, ou agit-il ?'
                    - Écris la fonction.
            -   type: paragraphe
                texte: Pourquoi un exercice proche ? Refaire une question du même type, juste après la correction, fixe le bon réflexe.
        questions:
            -   id: q01
                type: tableau
                enonce: Écris la fonction de chaque constituant de la serre automatique.
                colonnes:
                    - Constituant
                    - Fonction
                lignes:
                    -   - Capteur
                        - ''
                    -   - Carte
                        - ''
                    -   - Écran
                        - ''
                    -   - Moteur
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
    -   id: a03
        titre: 'Reprise : algorithme et argumentation'
        transition: La chaîne est faite. Continue avec l’algorithme et l’argumentation.
        consigne: Tu vas écrire l’algorithme de la serre automatique et argumenter sur ses économies d’énergie. On attend un algorithme complet et une argumentation en trois temps.
        contenu:
            -   type: etapes
                elements:
                    - Écris l’algorithme de la serre avec TOUJOURS, SI … ALORS … SINON (R12).
                    - 'Argumente en trois temps (R19) : j’affirme, je prouve, je conclus.'
                    - Relis-toi avant de valider.
            -   type: paragraphe
                texte: 'Pourquoi ces deux questions ? Ce sont les questions qui rapportent le plus au brevet : il faut qu’elles deviennent automatiques.'
        questions:
            -   id: q01
                type: texte
                enonce: Écris l’algorithme de la serre automatique en langage naturel.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
            -   id: q02
                type: texte
                enonce: 'Argumente en trois temps : la serre automatique économise-t-elle l’énergie ?'
                aide: Source → constituant qui transforme → forme d’énergie en sortie.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: On veut aussi arroser la serre.
        questions:
            -   id: q01
                type: texte
                enonce: Ajoute une condition d’arrosage à l’algorithme.
                aide: 'Bloc par bloc : quand ? quelle condition ? quelle action ?'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Fais le point.
        questions:
            -   id: q01
                type: texte
                enonce: Quel réflexe vas-tu appliquer en priorité au brevet blanc n° 2 ? Comment ?
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Une erreur = un réflexe à retravailler.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
