titre: Comment protéger ses données et ses comptes ?
theme: "Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser"
problematique: Comment protéger efficacement ses comptes et ses données lorsqu'on utilise des services numériques ?
pourquoi: Cette séance permet d’identifier les risques numériques et d’adopter des comportements pour protéger ses comptes et ses données.
application: Ces précautions servent pour l’ENT, la messagerie, les jeux en ligne et les autres services numériques. Ne donne jamais de vrai mot de passe, de code personnel ou de coordonnées privées dans les réponses.
lien_precedent: Les séances 8 et 9 portaient sur la circulation des données et la configuration des réseaux. Cette séance porte sur la protection des accès, des données et des utilisateurs.
objectifs:
    connaissances:
        - L'identification et l'authentification sont deux étapes différentes.
        - Un mot de passe doit être difficile à deviner et différent d'un service à l'autre.
        - L'authentification multifacteur renforce la protection d'un compte.
        - L'hameçonnage cherche à tromper l'utilisateur pour obtenir des informations ou provoquer une action.
        - Les services numériques utilisent et enregistrent des données personnelles et des traces numériques.
        - La sécurité numérique dépend aussi des comportements de l'utilisateur.
    competences:
        - Repérer une situation présentant un risque numérique.
        - Distinguer identification et authentification.
        - Identifier les caractéristiques d'un mot de passe plus robuste.
        - Repérer les indices d'un message frauduleux.
        - Choisir une réaction adaptée face à une situation à risque.
        - Justifier une décision à partir d'indices précis.
activites:
    - id: a01
      titre: Connaître un identifiant suffit-il pour accéder à un compte ?
      contenu:
          - type: paragraphe
            texte: Imaginez que quelqu'un connaisse votre adresse électronique ou votre nom d'utilisateur.
      questions:
