    - id: a03
      titre: Pourquoi ajouter un deuxième facteur ?
      contenu:
          - type: paragraphe
            texte: "Un compte est protégé par :"
          - type: liste
            elements:
                - un mot de passe ;
                - puis un code temporaire demandé lors de la connexion.
      questions:
          - id: q01
            type: texte
            enonce: Si un attaquant découvre uniquement le mot de passe, pourra-t-il forcément se connecter ?
            numero: "5"
          - id: q02
            type: texte
            enonce: Quel intérêt apporte cette deuxième vérification ?
            numero: "6"
            suite:
                - type: titre
                  texte: "Mise en commun : authentification multifacteur"
                - type: paragraphe
                  texte: L'authentification multifacteur utilise plusieurs facteurs distincts pour vérifier l'identité d'un utilisateur.
                - type: paragraphe
                  texte: Elle réduit le risque qu'un mot de passe volé suffise à compromettre un compte.
                - type: lien
                  titre: CNIL – Utiliser l'authentification multifacteur
                  url: https://www.cnil.fr/fr/securite-utilisez-lauthentification-multifacteur-pour-vos-comptes-en-ligne
    - id: a04
      titre: Un message urgent est-il forcément légitime ?
      contenu:
          - type: paragraphe
            texte: "Vous recevez :"
          - type: citation
            texte: "URGENT : votre compte ENT sera supprimé dans 2 heures. Cliquez immédiatement sur le lien suivant et saisissez votre identifiant et votre mot de passe pour conserver votre compte."
      questions:
          - id: q01
            type: texte
            enonce: Relevez au moins trois indices qui doivent vous rendre méfiant.
            numero: "7"
          - id: q02
            type: texte
