            type: texte
            enonce: Cette personne peut-elle normalement accéder directement à votre compte ? Pourquoi ?
            numero: "1"
            suite:
                - type: paragraphe
                  texte: "Classez maintenant les éléments suivants :"
          - id: q02
            type: tableau
            enonce: Pour chaque élément, écris « oui » ou « non » dans chacune des deux colonnes.
            colonnes:
                - Élément
                - Sert surtout à indiquer qui l'on est
                - Sert surtout à vérifier l'identité
            lignes:
                - - Nom d'utilisateur
                  - ""
                  - ""
                - - Adresse électronique
                  - ""
                  - ""
                - - Mot de passe
                  - ""
                  - ""
                - - Code à usage unique reçu sur un téléphone
                  - ""
                  - ""
                - - Empreinte digitale
                  - ""
                  - ""
            libelle: Tableau à compléter
            suite:
                - type: titre
                  texte: "Mise en commun : identification et authentification"
                - type: paragraphe
                  texte: L'identification consiste à indiquer qui l'on prétend être.
                - type: paragraphe
                  texte: L'authentification consiste à vérifier que l'utilisateur est bien autorisé à utiliser cette identité.
                - type: lien
                  titre: "CNIL – Sécurité : authentifier les utilisateurs"
                  url: https://www.cnil.fr/fr/securite-authentifier-les-utilisateurs
    - id: a02
      titre: Tous les mots de passe protègent-ils autant ?
      contenu:
          - type: paragraphe
            texte: "Voici plusieurs mots de passe fictifs :"
          - type: liste
            elements:
                - azerty123
                - Lucas2012
                - Tracteur!Piano7Nuage
                - bonjour
          - type: paragraphe
            texte: Ne donnez jamais votre vrai mot de passe dans cette activité.
      questions:
          - id: q01
            type: texte
            enonce: Lequel semble le plus difficile à deviner ?
            numero: "2"
          - id: q02
            type: texte
            enonce: Quels éléments expliquent votre choix ?
            numero: "3"
          - id: q03
            type: texte
            enonce: Pourquoi utiliser le même mot de passe partout augmente-t-il les risques ?
            numero: "4"
            suite:
                - type: lien
                  titre: "Cybermalveillance.gouv.fr – Hameçonnage : conseils de protection"
