                - Réaction
                - Justification
            lignes:
                - - Une application demande l'accès permanent à votre localisation alors que cette fonction ne semble pas nécessaire.
                  - ""
                  - ""
                - - Un ami vous envoie soudainement un fichier inattendu avec seulement « regarde ça ».
                  - ""
                  - ""
                - - Votre téléphone propose une mise à jour de sécurité directement dans ses paramètres système.
                  - ""
                  - ""
                - - Vous recevez par erreur le mot de passe d'un camarade.
                  - ""
                  - ""
            libelle: Tableau à compléter
    - id: a06
      titre: Qu'est-ce qu'une donnée personnelle ?
      contenu:
          - type: paragraphe
            texte: Parmi les informations suivantes, lesquelles peuvent concerner une personne identifiable ?
          - type: liste
            elements:
                - nom et prénom ;
                - adresse électronique ;
                - numéro de téléphone ;
                - localisation ;
                - photographie ;
                - adresse IP ;
                - historique de navigation.
      questions:
          - id: q01
            type: texte
            enonce: Donnez trois exemples de données personnelles.
            numero: "9"
          - id: q02
            type: texte
            enonce: Pourquoi faut-il réfléchir avant de publier une photographie ou une information concernant quelqu'un d'autre ?
            numero: "10"
            suite:
                - type: lien
                  titre: Service-Public – Protection des données personnelles
                  url: https://www.service-public.fr/particuliers/vosdroits/F2024
    - id: a07
      titre: Une action en ligne peut-elle laisser une trace ?
      contenu:
          - type: paragraphe
            texte: Lorsque vous utilisez un service numérique, certaines informations peuvent être enregistrées.
          - type: paragraphe
            texte: "Voici des exemples d’informations ou d’actions qui peuvent laisser des traces numériques :"
          - type: liste
            elements:
                - recherche effectuée ;
                - publication ;
                - connexion à un compte ;
                - localisation enregistrée ;
                - clic ou interaction ;
                - historique de navigation.
      questions:
          - id: q01
            type: texte
            enonce: "Choisis un exemple dans la liste. Que pourrait-on apprendre sur une personne en consultant cette trace ? Explique pourquoi cette personne pourrait vouloir garder cette information privée."
            numero: "11"
    - id: a08
      titre: Mini-question type DNB
      contenu:
          - type: paragraphe
            texte: Un utilisateur utilise le même mot de passe pour son ENT, son adresse électronique et un réseau social.
          - type: paragraphe
            texte: Le réseau social subit une fuite de données et ce mot de passe est récupéré par un attaquant.
      questions:
          - id: q01
            type: texte
            enonce: Expliquez pourquoi les deux autres comptes peuvent également être menacés et proposez deux mesures permettant de réduire ce risque.
            suite:
