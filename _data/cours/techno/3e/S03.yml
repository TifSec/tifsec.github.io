titre: 'Séance 3 : Quelle invention a tout changé ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Qu’est-ce qu’une innovation de rupture, et comment change-t-elle la société ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
objectifs:
    connaissances:
        - 'Une innovation de rupture change profondément les usages : elle remplace d’autres objets et crée de nouveaux comportements (GPS, smartphone, Internet).'
        - 'Elle a des effets positifs et négatifs sur la société : emplois, communication, vie privée, environnement.'
    competences:
        - Distinguer innovation de rupture et amélioration.
        - Analyser les effets d’une innovation sur la société.
pourquoi:
    - En 4e, tu as étudié l’évolution du téléphone.
    - 'En 3e, tu vas plus loin : pourquoi certaines inventions changent-elles toute la société ?'
activites:
    -   id: a01
        titre: Rupture ou amélioration ?
        consigne: Tu vas apprendre à distinguer une innovation de rupture d’une simple amélioration, à partir de l’exemple expliqué du GPS. On attend le bon classement de trois innovations.
        contenu:
            -   type: paragraphe
                texte: 'Exemple expliqué : le GPS est une rupture : avant, on lisait une carte papier ; aujourd’hui, des millions de personnes se laissent guider, et des métiers nouveaux sont apparus (livraison). Un téléphone avec un meilleur appareil photo est une amélioration.'
            -   type: etapes
                elements:
                    - Lis l’exemple expliqué du GPS.
                    - 'Pour chaque exemple du tableau, demande-toi : les gens font-ils les choses autrement, ou font-ils la même chose en mieux ?'
                    - Écris « rupture » ou « amélioration ».
            -   type: paragraphe
                texte: Pourquoi distinguer les deux ? Une rupture change la société entière (métiers, habitudes) ; une amélioration rend seulement l’objet meilleur.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Classe chaque innovation : rupture ou amélioration.'
                colonnes:
                    - Innovation
                    - Classement
                lignes:
                    -   - Passage de la lampe à filament à la LED
                        - ''
                    -   - Apparition d’Internet
                        - ''
                    -   - Smartphone avec un écran plus grand
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
    -   id: a02
        titre: Les effets du GPS
        transition: Tu sais repérer une rupture. Étudie les effets de l’une d’elles.
        consigne: Tu vas analyser les effets du GPS sur la société à partir du document 1, puis argumenter. On attend deux effets positifs, deux effets négatifs et une argumentation en trois temps.
        contenu:
            -   type: titre
                texte: Document 1 — Le GPS en chiffres (arrondis)
            -   type: liste
                elements:
                    - Lancé pour l’armée américaine, ouvert au public dans les années 1990-2000.
                    - Présent dans presque tous les smartphones.
                    - Utilisé par l’agriculture, les secours, les livreurs, les avions.
            -   type: etapes
                elements:
                    - Lis le document 1 sur le GPS.
                    - Cherche deux effets positifs et deux effets négatifs sur la société.
                    - 'Puis argumente en trois temps : j’affirme, je prouve avec le document, je conclus.'
            -   type: paragraphe
                texte: 'Pourquoi argumenter en trois temps ? C’est le réflexe R19 du brevet : une affirmation sans preuve ne rapporte pas de points.'
        questions:
            -   id: q01
                type: tableau
                enonce: Donne deux effets positifs et deux effets négatifs du GPS sur la société.
                colonnes:
                    - Positifs
                    - Négatifs
                lignes:
                    -   - ''
                        - ''
                    -   - ''
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
            -   id: q02
                type: texte
                enonce: 'Argumente en trois temps (j’affirme, je prouve avec le document 1, je conclus) : le GPS a-t-il changé la société ?'
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a03
        titre: Je m’entraîne
        transition: Tu as compris la méthode. Applique-la seul sur un cas nouveau.
        consigne: 'Tu vas appliquer seul la méthode sur un cas nouveau : la visioconférence, décrite ci-dessous. On attend un classement (rupture ou amélioration) justifié par deux effets tirés du document.'
        contenu:
            -   type: citation
                texte: Depuis 2020, des millions de personnes travaillent ou suivent des cours en visioconférence. Les déplacements professionnels ont diminué. Certains se plaignent de fatigue devant l’écran et de moins voir leurs collègues.
            -   type: etapes
                elements:
                    - Lis le document sur la visioconférence.
                    - Décide si c’est une rupture ou une amélioration.
                    - Donne un effet positif et un effet négatif, chacun tiré du document.
            -   type: paragraphe
                texte: Pourquoi un cas nouveau ? Appliquer seul la méthode montre que tu l’as comprise.
        questions:
            -   id: q01
                type: texte
                enonce: La visioconférence est-elle une innovation de rupture ? Justifie avec un effet positif et un effet négatif tirés du document.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Certaines ruptures viennent d’une découverte scientifique.
        questions:
            -   id: q01
                type: texte
                enonce: Cite une découverte scientifique à l’origine d’une innovation.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as analysé des ruptures. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : qu’est-ce qu’une innovation de rupture, et comment change-t-elle la société ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Innovation de rupture : change profondément les usages ; amélioration : rend l’objet meilleur sans changer les usages.'
    - 'Effets sur la société : positifs et négatifs.'
sources:
