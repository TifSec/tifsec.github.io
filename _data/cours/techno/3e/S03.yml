titre: Comment les technologies transforment-elles la société ?
theme: "Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser"
problematique: Une nouvelle technologie améliore-t-elle toujours notre manière de vivre ?
pourquoi: "Objectif de cette séance : Une innovation technique peut modifier les habitudes, les usages et certains métiers."
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Une innovation technique peut modifier les habitudes, les usages et certains métiers.
        - Une technologie peut apporter des avantages tout en créant de nouvelles contraintes.
        - Certaines innovations modifient profondément la manière de répondre à un besoin.
        - Les systèmes d'intelligence artificielle utilisent des données pour produire des résultats.
        - Une intelligence artificielle peut produire des erreurs ou reproduire des biais présents dans les données utilisées.
    competences: []
activites:
    - id: a05
      titre: Production attendue
      contenu:
          - type: liste
            elements:
                - Un document LibreOffice Writer nommé 3e_S03_nom.odt.
                - Les tableaux et réponses demandés pendant la séance.
                - Une analyse d'un exemple d'intelligence artificielle.
                - Une réponse argumentée à la problématique.
          - type: paragraphe
            texte: Le fichier devra être déposé à la fin de la séance, même s'il n'est pas entièrement terminé.
      questions: []
    - id: a06
      titre: 1. Préparez votre document de travail
      contenu:
          - type: paragraphe
            texte: Ouvrez LibreOffice Writer.
          - type: paragraphe
            texte: Créez un nouveau document.
          - type: paragraphe
            texte: "Enregistrez-le immédiatement sous le nom : 3e_S03_nom.odt."
      questions:
          - id: q01
            type: texte
            enonce: "Écrivez votre nom, votre prénom et le titre : Séance 3 – Comment les technologies transforment-elles la société ?"
            suite: []
    - id: a07
      titre: 2. Une technologie peut-elle réellement changer nos habitudes ?
      contenu:
          - type: paragraphe
            texte: "Choisissez une seule technologie parmi les suivantes :"
          - type: liste
            elements:
                - smartphone ;
                - GPS / géolocalisation ;
                - commerce en ligne ;
                - plateformes de vidéo à la demande ;
                - réseaux sociaux ;
                - voiture électrique ;
                - impression 3D ;
                - intelligence artificielle générative.
          - type: paragraphe
            texte: "Complétez le tableau :"
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Question
                - Votre réponse
            lignes:
                - - Comment faisait-on avant cette technologie ?
                  - ""
                - - Que permet-elle de faire aujourd'hui ?
                  - ""
                - - Quel avantage apporte-t-elle ?
                  - ""
                - - Quelle nouvelle contrainte ou quel nouveau problème peut-elle créer ?
                  - ""
                - - A-t-elle changé certaines habitudes ou certains métiers ?
                  - ""
            suite:
                - type: paragraphe
                  texte: "Quelques ressources fiables :"
                - type: liste
                  elements:
                      - "GPS / géolocalisation : IGN – Comment fonctionne la géolocalisation par satellites ?"
                      - "Commerce en ligne : DGCCRF – Commerce en ligne : le consommateur doit redoubler de vigilance"
                      - "Vidéo / streaming : ADEME – Impacts des usages numériques"
                      - "Réseaux sociaux : CNIL – Bulle de filtre"
                      - "Voiture électrique : Ministère de la Transition écologique – 5 idées reçues sur la voiture électrique"
                - type: lien
                  titre: IGN – Comment fonctionne la géolocalisation par satellites ?
                  url: https://www.ign.fr/mag/comment-fonctionne-la-geolocalisation-par-satellites
                - type: lien
                  titre: "DGCCRF – Commerce en ligne : le consommateur doit redoubler de vigilance"
                  url: https://www.economie.gouv.fr/dgccrf/laction-de-la-dgccrf/les-enquetes-et-les-controles/commerce-en-ligne-le-consommateur-doit
                - type: lien
                  titre: ADEME – Impacts des usages numériques
                  url: https://agirpourlatransition.ademe.fr/particuliers/mieux-consommer/numerique/impacts-lecture-musique-films-jeux-ligne
                - type: lien
                  titre: CNIL – Bulle de filtre
                  url: https://www.cnil.fr/fr/definition/bulle-de-filtre
                - type: lien
                  titre: Ministère de la Transition écologique – 5 idées reçues sur la voiture électrique
                  url: https://www.ecologie.gouv.fr/actualites/5-idees-recues-voiture-electrique
                - type: paragraphe
                  texte: Vous n'avez besoin que de la ressource correspondant à votre technologie.
                - type: titre
                  texte: "Mise en commun : technologie et société"
                - type: paragraphe
                  texte: Une innovation technique peut modifier les usages, les habitudes, les métiers et parfois l'organisation de la société.
                - type: paragraphe
                  texte: "Une même technologie peut apporter des bénéfices et créer de nouvelles contraintes. Il faut donc analyser ses effets dans plusieurs domaines : usage, sécurité, coût, environnement, emploi ou données personnelles."
    - id: a08
      titre: 3. Toutes les innovations transforment-elles autant la société ?
      contenu:
          - type: paragraphe
            texte: Classez chaque évolution en amélioration progressive ou changement important, puis justifiez.
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Évolution
                - Votre classement
                - Justification
            lignes:
                - - Une batterie de smartphone offrant deux heures d'autonomie supplémentaires
                  - ""
                  - ""
                - - Le passage de la carte routière papier au GPS
                  - ""
                  - ""
                - - Une imprimante 3D capable d'imprimer plus rapidement
                  - ""
                  - ""
                - - Le passage du courrier papier à la messagerie électronique
                  - ""
                  - ""
            suite:
                - type: titre
                  texte: Mise en commun
                - type: paragraphe
                  texte: Une amélioration progressive conserve le principe général d'une solution mais améliore certaines performances.
                - type: paragraphe
                  texte: Une innovation de rupture transforme fortement la manière de répondre à un besoin ou les usages associés.
    - id: a09
      titre: 4. Où utilise-t-on déjà l'intelligence artificielle ?
      contenu:
          - type: paragraphe
            texte: L'intelligence artificielle n'est pas limitée aux outils capables de générer du texte ou des images.
          - type: paragraphe
            texte: "Choisissez deux domaines :"
          - type: liste
            elements:
                - santé ;
                - transport ;
                - agriculture ;
                - réseaux sociaux ;
                - commerce ;
                - industrie ;
                - jeux vidéo ;
                - éducation.
          - type: paragraphe
            texte: "Pour chacun, recherchez un exemple d'utilisation de l'IA et complétez :"
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Domaine
                - Ce que fait l'IA
                - Données utilisées
                - Intérêt
            lignes:
                - - ""
                  - ""
                  - ""
                  - ""
                - - ""
                  - ""
                  - ""
                  - ""
            suite:
                - type: paragraphe
                  texte: "Ressources :"
                - type: liste
                  elements:
                      - "CNIL – Intelligence artificielle : de quoi parle-t-on ?"
                      - Conseil général de l'économie – Baromètre du numérique 2026
                - type: lien
                  titre: "CNIL – Intelligence artificielle : de quoi parle-t-on ?"
                  url: https://www.cnil.fr/fr/intelligence-artificielle/intelligence-artificielle-de-quoi-parle-t-on
                - type: lien
                  titre: Conseil général de l'économie – Baromètre du numérique 2026
                  url: https://www.economie.gouv.fr/cge/barometre-du-numerique-edition-2026
                - type: titre
                  texte: "Mise en commun : données et intelligence artificielle"
                - type: paragraphe
                  texte: Un système d'intelligence artificielle utilise des données et des méthodes de calcul afin de produire un résultat, une prédiction, une recommandation ou une décision.
    - id: a10
      titre: 5. Toutes les données se valent-elles ?
      contenu:
          - type: paragraphe
            texte: On entraîne une intelligence artificielle à reconnaître des chats et des chiens.
          - type: paragraphe
            texte: "On lui fournit :"
          - type: liste
            elements:
                - 10 000 photographies de chiens de nombreuses races et prises dans des situations différentes ;
                - 200 photographies de chats, presque toutes montrant des chats noirs à l'intérieur d'une maison.
          - type: paragraphe
            texte: "Répondez :"
      questions:
          - id: q01
            type: texte
            enonce: L'IA dispose-t-elle d'autant d'informations sur les chats que sur les chiens ?
            suite: []
          - id: q02
            type: texte
            enonce: Les photographies de chats représentent-elles correctement tous les chats ?
            suite: []
          - id: q03
            type: texte
            enonce: Que pourrait-il se passer avec la photographie d'un chat roux dans un jardin ?
            suite: []
          - id: q04
            type: texte
            enonce: Comment améliorer les données utilisées pour l'entraînement ?
            suite:
                - type: paragraphe
                  texte: "Pour vérifier : CNIL – Collecter et qualifier les données d'entraînement"
                - type: lien
                  titre: CNIL – Collecter et qualifier les données d'entraînement
                  url: https://www.cnil.fr/fr/intelligence-artificielle/guide/collecter-et-qualifier-les-donnees-dentrainement
                - type: titre
                  texte: "Mise en commun : erreurs et biais"
                - type: paragraphe
                  texte: Une intelligence artificielle peut produire des erreurs si les données utilisées sont insuffisantes, peu représentatives, de mauvaise qualité ou si les conditions d'utilisation sont différentes de celles prévues.
                - type: paragraphe
                  texte: La CNIL rappelle notamment qu'un manque de représentativité des données peut conduire à des performances différentes selon les situations.
    - id: a11
      titre: 6. Une IA peut-elle donner une réponse convaincante mais fausse ?
      contenu:
          - type: paragraphe
            texte: Une IA générative produit une réponse très détaillée à une question, mais vous ne connaissez pas sa source.
          - type: paragraphe
            texte: Que devez-vous faire avant d'utiliser cette information dans un travail scolaire ?
          - type: paragraphe
            texte: La recopier puisque la réponse semble précise.
      questions:
          - id: q01
            type: texte
            enonce: Vérifier l'information avec une ou plusieurs sources fiables.
            suite:
                - type: paragraphe
                  texte: Considérer que l'IA ne peut pas inventer une information.
                - type: paragraphe
                  texte: Justifiez votre choix.
                - type: paragraphe
                  texte: "Ressource : CNIL – Questions-réponses sur l'utilisation d'un système d'IA générative"
                - type: lien
                  titre: CNIL – Questions-réponses sur l'utilisation d'un système d'IA générative
                  url: https://www.cnil.fr/fr/les-questions-reponses-de-la-cnil-sur-lutilisation-dun-systeme-dia-generative
    - id: a12
      titre: "7. Technologie : progrès ou problème ?"
      contenu:
          - type: paragraphe
            texte: "Choisissez une affirmation :"
          - type: liste
            elements:
                - « Une nouvelle technologie améliore toujours notre vie. »
                - « L'intelligence artificielle remplacera de nombreux métiers. »
                - « Si une technologie est pratique, son impact environnemental n'est pas important. »
                - « Une machine devrait pouvoir prendre certaines décisions à la place d'un humain. »
          - type: paragraphe
            texte: Indiquez si vous êtes d'accord, pas d'accord ou partagé.
          - type: paragraphe
            texte: "Rédigez ensuite 4 à 6 lignes comportant :"
          - type: liste
            elements:
                - votre position ;
                - un avantage ;
                - un risque ou une limite ;
                - un exemple précis.
          - type: paragraphe
            texte: "Pour la question sur l'impact du numérique, vous pouvez consulter :"
          - type: paragraphe
            texte: ADEME – Calculer l'empreinte carbone de ses usages numériques
          - type: lien
            titre: ADEME – Calculer l'empreinte carbone de ses usages numériques
            url: https://agirpourlatransition.ademe.fr/particuliers/evaluer-son-impact/calculer-empreinte-carbone/calculez-empreinte-carbone-usages-numeriques
      questions: []
    - id: a13
      titre: 8. Conclusion du travail
      contenu:
          - type: paragraphe
            texte: "Complétez :"
          - type: liste
            elements:
                - Une innovation peut transformer les ................................................ et les ................................................ .
                - Une technologie peut apporter des avantages mais aussi créer de nouvelles ................................................ .
                - Une intelligence artificielle utilise des ................................................ pour produire des résultats.
                - Des données peu nombreuses ou peu représentatives peuvent provoquer des ................................................ ou des biais.
                - Une information produite par une IA doit être ................................................ avant d'être utilisée.
          - type: paragraphe
            texte: "Répondez maintenant à la problématique en 4 à 6 lignes :"
          - type: paragraphe
            texte: Une nouvelle technologie améliore-t-elle toujours notre manière de vivre ?
      questions: []
    - id: a14
      titre: Rendu attendu
      contenu:
          - type: paragraphe
            texte: À la fin de la séance, déposez votre fichier 3e_S03_nom.odt.
          - type: paragraphe
            texte: Le fichier doit être rendu même si toutes les activités ne sont pas terminées.
      questions: []
    - id: a15
      titre: À retenir
      contenu:
          - type: paragraphe
            texte: Une innovation technique peut transformer profondément les usages, les habitudes et certains métiers.
          - type: paragraphe
            texte: Une technologie apporte généralement des avantages mais peut également créer de nouvelles contraintes.
          - type: paragraphe
            texte: Les systèmes d'intelligence artificielle dépendent des données utilisées. Des données insuffisantes ou peu représentatives peuvent conduire à des erreurs ou des biais.
          - type: paragraphe
            texte: Les résultats produits par une intelligence artificielle doivent donc être analysés avec esprit critique et vérifiés lorsqu'ils sont utilisés comme source d'information.
      questions: []
    - id: a16
      titre: Sources générales
      contenu:
          - type: liste
            elements:
                - Ministère de l'Éducation nationale – Programme de technologie du cycle 4
                - Éduscol – Ressources d'accompagnement du programme de technologie
          - type: lien
            titre: Programme de technologie du cycle 4
            url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
          - type: lien
            titre: Ressources d'accompagnement du programme de technologie
            url: https://eduscol.education.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
introduction:
    - type: titre
      texte: "Compétence visée : Analyser les effets d'une innovation technique sur les usages, la société et l'environnement"
    - type: titre
      texte: Objectifs d’apprentissage
    - type: paragraphe
      texte: "Ce que les élèves vont apprendre :"
    - type: liste
      elements:
          - Une innovation technique peut modifier les habitudes, les usages et certains métiers.
          - Une technologie peut apporter des avantages tout en créant de nouvelles contraintes.
          - Certaines innovations modifient profondément la manière de répondre à un besoin.
          - Les systèmes d'intelligence artificielle utilisent des données pour produire des résultats.
          - Une intelligence artificielle peut produire des erreurs ou reproduire des biais présents dans les données utilisées.
    - type: paragraphe
      texte: "Ce qu'ils vont apprendre à faire :"
    - type: liste
      elements:
          - Comparer une situation avant et après l'apparition d'une technologie.
          - Identifier des avantages, des contraintes et des risques.
          - Repérer plusieurs usages actuels de l'intelligence artificielle.
          - Analyser la qualité de données utilisées pour entraîner un système.
          - Construire et justifier une opinion à partir d'exemples précis.
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4
