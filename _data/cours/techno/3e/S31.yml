titre: 'Séance 31 : Un mini-jeu sur l’eau'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment concevoir un mini-jeu qui sensibilise à l’économie de l’eau ?
competences_bo:
    - Concevoir, écrire, tester et mettre au point un programme
    - Valider les solutions techniques par des simulations ou par des protocoles de tests
objectifs:
    connaissances:
        - 'Concevoir un programme : algorithme, fonctions, tests par un camarade.'
    competences:
        - Concevoir un jeu avec au moins une fonction.
        - Faire tester et corriger.
pourquoi:
    - En séances 29 et 30, tu as utilisé des fonctions et découvert Python.
    - 'Aujourd’hui, tu conçois un mini-jeu sur l’eau : c’est le bilan de la séquence.'
activites:
    -   id: a01
        titre: Concevoir
        consigne: Tu vas concevoir un mini-jeu qui sensibilise à l’économie de l’eau, à partir de l’idée ci-dessous ou de la tienne. On attend un algorithme avec au moins un événement, une condition et une fonction.
        contenu:
            -   type: paragraphe
                texte: 'Idée : le joueur ferme des robinets qui fuient ; chaque robinet fermé fait gagner des litres économisés ; une fonction « nouvelleFuite » crée une fuite au hasard.'
            -   type: etapes
                elements:
                    - Lis l’idée de jeu proposée (ou invente la tienne sur le même thème).
                    - 'Écris les règles : ce que fait le joueur, ce qui fait gagner, ce qui fait perdre.'
                    - Transforme-les en algorithme avec au moins un événement (QUAND), une condition (SI) et une fonction.
            -   type: paragraphe
                texte: Pourquoi l’algorithme d’abord ? En séance 31 de 4e, tu as vu que programmer devient une simple traduction quand les règles sont écrites.
        questions:
            -   id: q01
                type: texte
                enonce: Écris l’algorithme de ton mini-jeu sur l’économie de l’eau (au moins un événement, une condition et une fonction).
                aide: Bloc par bloc (réflexe n° 9).
    -   id: a02
        titre: Programmer
        transition: L’algorithme est prêt. Programme-le.
        consigne: Tu vas programmer ton mini-jeu dans MakeCode Arcade, en traduisant ton algorithme partie par partie. On attend la description de la fonction de ton jeu.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre MakeCode Arcade, nouveau projet 3e_S31_tonprenom.
                    - Programme ton algorithme partie par partie.
                    - Teste après chaque partie.
            -   type: paragraphe
                texte: Pourquoi tester après chaque partie ? Si un bug apparaît, tu sais qu’il vient de ce que tu viens d’ajouter.
        questions:
            -   id: q01
                type: texte
                enonce: 'Décris la fonction de ton mini-jeu : son nom, ce qu’elle fait et quand elle est appelée.'
                aide: Combien d’éléments sont demandés ?
        ressources:
            - &id001
                type: lien
                titre: MakeCode Arcade (gratuit, dans le navigateur)
                url: https://arcade.makecode.com/
    -   id: a03
        titre: Faire tester et corriger
        transition: Ton jeu fonctionne. Fais-le tester.
        consigne: Tu vas faire tester ton mini-jeu par un camarade, puis corriger un bug avec la méthode de débogage de 4e. On attend un bug précis et sa correction.
        contenu:
            -   type: etapes
                elements:
                    - Échange ton poste avec un camarade pendant 5 minutes.
                    - Il joue et note les bugs ou ce qui n’est pas clair.
                    - 'Reprends ton poste et corrige avec la méthode de 4e : reproduire, isoler, modifier une chose, retester.'
            -   type: paragraphe
                texte: Pourquoi un testeur ? Il joue autrement que toi et trouve ce que tu ne vois plus.
        questions:
            -   id: q01
                type: texte
                enonce: Décris un bug trouvé par ton testeur dans ton mini-jeu et la correction que tu as faite.
                aide: Attendu ou observé ?
        ressources:
            - *id001
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le message de sensibilisation compte autant que le jeu.
        questions:
            -   id: q01
                type: texte
                enonce: Quel message ton jeu affiche-t-il à la fin, et pourquoi ce message ?
                aide: Pense à « car » (réflexe n° 4).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment as-tu conçu ton mini-jeu sur l’eau ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Concevoir : algorithme → programme avec fonctions → tests → corrections.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
