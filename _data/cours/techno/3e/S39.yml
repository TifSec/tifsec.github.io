titre: 'Séance 39 : Une pièce cassée : la refaire sur mesure'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment remplacer une pièce cassée en la redessinant sur mesure ?
competences_bo:
    - Identifier un dysfonctionnement d’un objet technique et y remédier
objectifs:
    connaissances:
        - 'Dépanner : formuler des hypothèses, les vérifier, réparer. Réparer une pièce introuvable : la mesurer, la redessiner en CAO, la fabriquer.'
        - 'Exemple : le support du capteur à ultrasons du monte-charge (situation simulée).'
    competences:
        - Formuler des hypothèses de panne.
        - Redessiner une pièce sur mesure.
pourquoi:
    - En 5e et en 4e, tu as dépanné le monte-charge. En 4e, tu as dessiné en CAO.
    - 'Aujourd’hui : le support du capteur est cassé (photo), il faut le refaire.'
activites:
    -   id: a01
        titre: Hypothèses
        consigne: 'Tu vas diagnostiquer une panne simulée du monte-charge : son capteur à ultrasons pend et l’écran affiche n’importe quoi. On attend deux hypothèses, chacune avec sa vérification.'
        contenu:
            -   type: paragraphe
                texte: 'Symptôme (situation simulée) : l’écran du monte-charge affiche des positions incohérentes ; la photo montre le capteur à ultrasons qui pend, son support est fendu.'
            -   type: etapes
                elements:
                    - Lis le symptôme et regarde la photo projetée.
                    - Liste les causes possibles des positions incohérentes.
                    - Pour chacune, écris comment la vérifier sans rien démonter.
            -   type: paragraphe
                texte: 'Pourquoi plusieurs hypothèses ? La pièce cassée est évidente, mais un fil peut aussi s’être débranché dans la chute : il faut tout vérifier.'
        questions:
            -   id: q01
                type: texte
                enonce: Le monte-charge affiche des positions incohérentes et son capteur pend. Formule deux hypothèses de panne et la vérification de chacune.
                aide: « = » + fonction + plage.
    -   id: a02
        titre: Redessiner
        transition: Le support est en cause. Redessine-le.
        consigne: Tu vas redessiner dans Tinkercad le support cassé du capteur, à partir des mesures relevées sur la pièce (ci-dessous). On attend une pièce aux bonnes cotes, avec du jeu.
        contenu:
            -   type: paragraphe
                texte: 'Mesures relevées sur la pièce cassée : plaque 50 × 25 × 3 mm ; deux trous de 16 mm à 26 mm d’entraxe ; deux trous de fixation de 3 mm aux coins.'
            -   type: etapes
                elements:
                    - Lis les mesures relevées sur la pièce cassée.
                    - Dans Tinkercad, crée la plaque et ses perçages.
                    - Prévois du jeu pour les trous du capteur (+1 mm).
                    - Ajoute les trous de fixation.
            -   type: paragraphe
                texte: 'Pourquoi du jeu ? L’impression 3D n’est pas parfaitement précise : sans jeu, le capteur n’entrera pas.'
        questions:
            -   id: q01
                type: texte
                enonce: 'Décris le support de capteur que tu as modélisé dans Tinkercad : cotes, trous, jeu prévu, fixations.'
                aide: Combien d’éléments sont demandés ?
        ressources:
            -   type: lien
                titre: Tinkercad — conception 3D (connexion avec le code de classe du professeur)
                url: https://www.tinkercad.com/
    -   id: a03
        titre: Améliorer la pièce
        transition: La pièce est redessinée. Peut-on faire mieux ?
        consigne: Tu vas améliorer le support redessiné pour qu’il ne casse plus. On attend une modification justifiée.
        contenu:
            -   type: etapes
                elements:
                    - Regarde où le support s’est fendu (photo).
                    - Cherche pourquoi il a cassé à cet endroit.
                    - Propose une modification qui le renforce.
            -   type: paragraphe
                texte: 'Pourquoi améliorer ? Refaire la même pièce, c’est risquer la même panne : un bon réparateur supprime la cause.'
        questions:
            -   id: q01
                type: texte
                enonce: Quelle modification apportes-tu au support du capteur pour qu’il ne casse plus ? Justifie.
                aide: Pense à « car » (réflexe n° 4).
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: L’impression 3D de la pièce prend environ 30 minutes.
        questions:
            -   id: q01
                type: texte
                enonce: Comment vérifier la pièce avant de l’imprimer pour de bon ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment remplacer une pièce cassée en la redessinant sur mesure ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Dépanner : hypothèses → vérifications → réparation.'
    - 'Pièce introuvable : mesurer, redessiner, fabriquer.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
