titre: 'Séance 11 : Combien pèsent une photo et un son ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Comment une photo et un son sont-ils numérisés, et pourquoi pèsent-ils si lourd ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - Une photo numérique est un tableau de pixels ; chaque pixel est codé par trois nombres (rouge, vert, bleu), soit 3 octets. Une photo de 4 000 × 3 000 pixels pèse 36 Mo sans compression.
        - 'Un son est numérisé en prenant des mesures (échantillons) très souvent : 44 100 fois par seconde pour un CD. La compression (JPEG, MP3) réduit la taille.'
    competences:
        - Calculer la taille d’une image non compressée.
        - Expliquer la numérisation d’un son et l’intérêt de la compression.
pourquoi:
    - En séance 10, tu as codé des nombres et des lettres. En 4e, tu as calculé des durées d’envoi.
    - 'Aujourd’hui : images et sons.'
activites:
    -   id: a01
        titre: L’image
        consigne: Tu vas calculer la taille d’une image numérique non compressée, à partir de l’exemple expliqué. On attend un calcul en octets et le sens des 3 octets par pixel.
        contenu:
            -   type: paragraphe
                texte: 'Exemple expliqué : une image de 100 × 100 pixels contient 10 000 pixels ; à 3 octets par pixel, elle pèse 30 000 octets, soit 30 ko.'
            -   type: etapes
                elements:
                    - Lis l’exemple expliqué.
                    - 'Calcule le nombre de pixels : largeur × hauteur.'
                    - Multiplie par 3 octets (rouge, vert, bleu).
            -   type: paragraphe
                texte: 'Pourquoi 3 octets par pixel ? Chaque pixel mélange trois lumières : rouge, verte et bleue, chacune codée par un nombre de 0 à 255.'
        questions:
            -   id: q01
                type: nombre
                enonce: Combien d’octets pèse une image de 200 × 100 pixels non compressée ?
                unite: octets
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: qcm
                enonce: Pourquoi compte-t-on 3 octets par pixel dans une image en couleur ?
                choix:
                    -   id: a
                        texte: 'Un octet pour chaque couleur : rouge, vert, bleu.'
                    -   id: b
                        texte: Par hasard.
                    -   id: c
                        texte: Pour la luminosité seulement.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a02
        titre: Le son
        transition: Une image se calcule. Et un son ?
        consigne: Tu vas comprendre comment un son est transformé en nombres, et l’intérêt de la compression MP3, à partir du texte ci-dessous. On attend deux explications.
        contenu:
            -   type: paragraphe
                texte: Un microphone transforme le son en signal électrique ; la carte son mesure ce signal 44 100 fois par seconde et code chaque mesure en nombre.
            -   type: etapes
                elements:
                    - Lis comment un son est numérisé.
                    - 'Pense à un dessin fait avec peu de points : il perd des détails.'
                    - Lis les tailles d’une chanson en qualité CD et en MP3, et compare.
            -   type: paragraphe
                texte: Pourquoi compresser ? Un fichier 10 fois plus léger se stocke et s’envoie 10 fois plus vite, au prix d’un peu de qualité.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi la carte son mesure-t-elle le son 44 100 fois par seconde ?
                aide: Action → résultat attendu → résultat observé ; une seule chose à la fois.
            -   id: q02
                type: texte
                enonce: Une chanson de 3 min pèse environ 30 Mo en qualité CD et 3 Mo en MP3. Quel est l’intérêt de la compression ? Y a-t-il un inconvénient ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a03
        titre: Lien avec le réseau
        transition: Ces fichiers doivent voyager sur Internet.
        consigne: Tu vas calculer le temps d’envoi d’une photo non compressée, avec la méthode de la 4e (× 8, ÷ débit). On attend une durée en secondes.
        contenu:
            -   type: etapes
                elements:
                    - Reprends la photo de 36 Mo (4 000 × 3 000 pixels).
                    - Convertis en mégabits (× 8), comme en 4e.
                    - Divise par le débit.
            -   type: paragraphe
                texte: 'Pourquoi relier au réseau ? Ces fichiers lourds voyagent sur Internet : leur taille décide du temps d’envoi.'
        questions:
            -   id: q01
                type: nombre
                enonce: Combien de secondes faut-il pour envoyer la photo de 36 Mo avec un débit de 8 Mbit/s ?
                unite: s
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le JPEG peut diviser la taille d’une photo par 10.
        questions:
            -   id: q01
                type: texte
                enonce: Combien pèserait alors la photo de 36 Mo ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais pourquoi les fichiers pèsent lourd. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment une photo et un son sont-ils numérisés, et pourquoi pèsent-ils lourd ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Image : pixels × 3 octets (RVB).'
    - 'Son : échantillonné (44 100 fois par seconde) ; compression = fichier plus léger, un peu de qualité perdue.'
sources:
