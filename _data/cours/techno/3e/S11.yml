titre: Comment circulent l’énergie et l’information dans un système automatisé ?
theme: "Structure, fonctionnement, comportement : comprendre un système automatisé"
problematique: "Tu appuies sur Monter : comment la plateforme se met-elle en mouvement ?"
pourquoi: Comprendre ce qui donne les ordres et ce qui fait bouger la plateforme.
application: Le même principe se retrouve dans un portail ou un volet roulant.
lien_precedent: En S07, un capteur donnait une information pour commander une pompe. Ici, nous suivons les messages et l’énergie dans un monte-charge.
prerequis:
    - Un capteur détecte une situation.
    - "Une pièce remplit un rôle : détecter, commander, entraîner…"
notions:
    - titre: Donner un ordre ou fournir de l’énergie ?
      texte: "Pense à une télévision : la télécommande demande l’allumage ; la prise fournit l’électricité. Le message et l’énergie suivent deux chemins différents. La télévision sert seulement d’exemple. Reprenons maintenant notre monte-charge : dans les deux chemins ci-dessous, nous parlons bien de ses pièces."
    - titre: Le chemin des messages
      texte: "Le bouton envoie une demande. Le capteur indique une position. La carte lit ces messages et donne un ordre : c’est la chaîne d’information."
    - titre: Le chemin de l’énergie
      texte: "L’alimentation fournit l’électricité. L’interface de puissance est un interrupteur piloté par la carte. Le moteur produit le mouvement ; la poulie et le câble le transmettent à la plateforme : c’est la chaîne d’énergie."
objectifs:
    connaissances:
        - Un ordre et un apport d’énergie ont des rôles différents.
    competences:
        - Expliquer le rôle des pièces.
        - Relier les pièces dans le bon ordre.
        - Proposer une vérification pour chercher une panne.
activites:
    - id: a01
      titre: Qui fait quoi ?
      pourquoi: Reconnaître les pièces avant de les relier.
      demarche:
          - Lis le dossier.
          - Écris une courte action pour chaque pièce.
      contenu:
          - type: paragraphe
            texte: Notre monte-charge transporte des caisses entre deux niveaux. Nous l’étudions sur documents, sans manipulation.
          - type: liste
            elements:
                - "Bouton Monter : l’utilisateur appuie pour demander la montée."
                - "Capteur haut : il détecte l’arrivée de la plateforme en haut."
                - "Carte de commande : elle lit les messages et donne les ordres."
                - "Alimentation et interface de puissance : elles fournissent et commandent l’électricité du moteur."
                - "Moteur, poulie et câble : ils entraînent la plateforme."
                - "Voyant : la carte l’allume quand elle commande un mouvement."
      questions:
          - id: q01
            type: tableau
            enonce: Que fait chaque pièce ? Une courte phrase par case suffit.
            colonnes:
                - Composant
                - Son rôle
            lignes:
                - - Bouton Monter
                  - ""
                - - Capteur de position haut
                  - ""
                - - Carte de commande
                  - ""
                - - Moteur électrique
                  - ""
                - - Voyant
                  - ""
            aide: "Commence par un verbe : détecter, demander, décider, entraîner ou informer."
          - id: q02
            type: qcm
            enonce: Quelle pièce fournit l’électricité au moteur ?
            choix:
                - id: bouton
                  texte: Le bouton Monter.
                - id: alimentation
                  texte: L’alimentation électrique.
                - id: capteur
                  texte: Le capteur de position.
      ressources:
          - type: paragraphe
            texte: "Si besoin : dans la page micro:bit, cherche « entrée » et « sortie ». Quel rôle joue un bouton ? Et une LED ? Reviens ensuite aux pièces de notre dossier ; le câblage n’est pas le même."
          - &a1
            type: lien
            titre: micro:bit — LEDs et boutons (en français)
            url: https://microbit.org/fr/get-started/features/leds-and-buttons/
    - id: a02
      titre: Suivre l’énergie et les messages
      pourquoi: Comprendre comment les pièces travaillent ensemble.
      demarche:
          - Complète le tableau de l’énergie.
          - Complète ensuite les deux trajets des messages.
      contenu:
          - type: paragraphe
            texte: "Pour monter : l’alimentation fournit l’électricité, l’interface de puissance la laisse passer et le moteur tourne. La poulie et le câble entraînent la plateforme."
      questions:
          - id: q01
            type: tableau
            enonce: Quelle pièce réalise chaque action ?
            colonnes:
                - Action
                - Pièce ou ensemble de pièces
            lignes:
                - - 1 — Fournir l’électricité (alimenter)
                  - ""
                - - 2 — Laisser passer l’électricité (distribuer)
                  - ""
                - - 3 — Produire un mouvement (convertir)
                  - ""
                - - 4 — Entraîner la plateforme (transmettre)
                  - ""
          - id: q02
            type: texte
            enonce: Complète les deux lignes ci-dessous. Remplace chaque « … » par une pièce ou un court message.
            aide: "Une flèche signifie « envoie un message à ». Exemple : télécommande — « change de chaîne » → télévision. Les noms des pièces et leur rôle sont dans le dossier."
            contenu:
                - type: code
                  texte: |-
                      Tu appuies sur Monter :
                      bouton — « … » → … — « … » → interface de puissance

                      La plateforme arrive en haut :
                      … — « … » → carte de commande
      ressources:
          - type: paragraphe
            texte: "Si besoin : lis le court passage sur la chaîne d’énergie dans le texte sous la vidéo. Repère les quatre fonctions, puis retrouve les pièces correspondantes dans notre dossier. Tu n’as pas besoin de regarder toute la vidéo."
          - type: lien
            titre: Lumni / France Télévisions — Comment produire et bien utiliser l’énergie électrique ?
            url: https://www.lumni.fr/video/comment-produire-et-bien-utiliser-lenergie-electrique-23-avril
    - id: a03
      titre: Chercher une panne — entraînement DNB
      pourquoi: Vérifier avant d’accuser une pièce.
      demarche:
          - Lis les observations.
          - Explique ton raisonnement en quelques phrases.
      contenu:
          - type: paragraphe
            texte: "Le voyant s’allume, mais la plateforme ne bouge pas. Le voyant reçoit son ordre de la carte : il ne mesure pas le mouvement. On n’a pas encore vérifié si le moteur reçoit de l’électricité ou si son axe tourne."
      questions:
          - id: q01
            type: texte
            enonce: "Un élève dit : « Le voyant est allumé, donc le câble est cassé. » Réponds aux trois points suivants."
            aide: "Exemple : si la lampe de ton vélo ne s’allume pas, tu vérifies avant de décider que l’ampoule est cassée. Ici aussi, plusieurs pièces peuvent être en cause. Propose une vérification, sans la réaliser."
            contenu:
                - type: liste
                  elements:
                      - Le voyant suffit-il à savoir si le moteur reçoit de l’électricité ? Pourquoi ?
                      - Que pourrait-on vérifier pour trouver la panne ?
                      - Explique ce que le résultat de cette vérification nous apprendrait.
          - id: q02
            type: texte
            enonce: La carte donne l’ordre de monter, mais rien ne bouge. Cite une pièce qui pourrait être en cause et explique son rôle.
      ressources:
          - type: paragraphe
            texte: "Si besoin : relis le rôle d’une LED sur la page micro:bit. Distingue ce qu’elle affiche de ce qu’un capteur mesure. Puis justifie ton test avec les observations du dossier."
          - *a1
    - id: a04
      titre: Pour aller plus loin
      facultatif: true
      pourquoi: Retrouver les deux chemins dans un objet connu.
      demarche:
          - Choisis un volet ou un portail.
          - Explique oralement ce qui donne l’ordre et ce qui fournit l’énergie.
      contenu:
          - type: paragraphe
            texte: "Facultatif : ce travail n’est pas nécessaire pour obtenir 20."
      questions: []
retenir:
    - "Information : recevoir des messages, décider, donner un ordre."
    - "Énergie : fournir l’électricité, la distribuer, produire puis transmettre un mouvement."
    - Un voyant allumé ne prouve pas que toutes les pièces fonctionnent.
bilan: Quelle différence fais-tu entre donner un ordre et faire bouger la plateforme ?
reperes_officiels:
    - type: paragraphe
      texte: Nous préparons la description des chaînes d’information et d’énergie. Dans l’annexe, consulte la rubrique « Énergie » page 8 et la colonne 3e. Inutile de lire tout le programme.
    - type: lien
      titre: Ministère — Programme de technologie, BO du 29 février 2024
      url: https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A
    - type: lien
      titre: "Ministère — Annexe du programme : énergie, page 8"
      url: https://www.education.gouv.fr/sites/default/files/document/Annexe%20%E2%80%94%20Programme%20de%20technologie%20du%20cycle%204-368016.pdf#page=8
