titre: "Séance 11 : Comment le monte-charge se met-il en mouvement ?"
themes:
    - "Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre"
problematique: "Tu appuies sur le bouton « Monter » : que se passe-t-il à l’intérieur du monte-charge pour que la plateforme bouge ?"
competences_bo:
    - "Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)"
    - "Identifier un dysfonctionnement d’un objet technique et y remédier"
objectifs:
    connaissances:
        - "Dans un système automatisé, il y a deux chemins : le chemin des informations (les messages et les ordres) et le chemin de l’énergie (ce qui fait bouger)."
        - "La chaîne d’information : le bouton et le capteur envoient des messages, la carte de commande décide et donne les ordres."
        - "La chaîne d’énergie : l’alimentation fournit l’électricité, l’interface de puissance la laisse passer, le moteur produit le mouvement, la poulie et le câble le transmettent."
    competences:
        - "Dire le rôle de chaque pièce du monte-charge."
        - "Ranger les pièces dans le bon ordre, sur le bon chemin."
        - "Proposer une vérification pour chercher une panne, au lieu d’accuser une pièce au hasard."
pourquoi:
    - "Au DNB, on te demandera souvent d’expliquer comment fonctionne un système : un portail, un volet roulant, un ascenseur… Ils fonctionnent tous de la même façon : des pièces qui donnent des ordres, et des pièces qui font bouger."
    - "Aujourd’hui, tu apprends à séparer ces deux chemins sur le monte-charge. Cette méthode te servira pour n’importe quel système."
activites:
    - id: a01
      titre: "Qui fait quoi dans le monte-charge ?"
      contenu:
          - type: paragraphe
            texte: "Le monte-charge transporte des caisses entre deux étages. Voici ses pièces principales :"
          - type: liste
            elements:
                - "Bouton « Monter » : l’utilisateur appuie dessus pour demander la montée."
                - "Capteur haut : il détecte quand la plateforme arrive en haut."
                - "Carte de commande : c’est le « cerveau ». Elle lit les messages et donne les ordres."
                - "Alimentation : elle fournit l’électricité."
                - "Interface de puissance : c’est un interrupteur commandé par la carte. Il laisse passer, ou non, l’électricité vers le moteur."
                - "Moteur : il tourne quand il reçoit de l’électricité."
                - "Poulie et câble : ils transmettent le mouvement du moteur à la plateforme."
                - "Voyant : la carte l’allume quand elle donne l’ordre de bouger."
      questions:
          - id: q01
            type: tableau
            enonce: "Écris le rôle de chaque pièce. Une courte phrase suffit."
            colonnes:
                - Pièce
                - Son rôle
            lignes:
                - - Bouton « Monter »
                  - ""
                - - Capteur haut
                  - ""
                - - Carte de commande
                  - ""
                - - Moteur
                  - ""
                - - Voyant
                  - ""
            aide: "Commence chaque phrase par un verbe : demander, détecter, décider, tourner, afficher."
          - id: q02
            type: qcm
            enonce: "Quelle pièce fournit l’électricité au moteur ?"
            choix:
                - id: bouton
                  texte: "Le bouton « Monter »."
                - id: alimentation
                  texte: "L’alimentation."
                - id: capteur
                  texte: "Le capteur haut."
      ressources:
          - type: paragraphe
            texte: "Tu ne sais plus ce qu’est une entrée (comme un bouton) ou une sortie (comme une lumière) ? Cette page l’explique avec la carte micro:bit."
          - &microbit
            type: lien
            titre: "micro:bit — LEDs et boutons (en français)"
            url: https://microbit.org/fr/get-started/features/leds-and-buttons/
    - id: a02
      titre: "Les deux chemins : les ordres et l’énergie"
      transition: "Tu connais le rôle de chaque pièce. Maintenant, tu vas voir comment elles travaillent ensemble. Il y a deux chemins différents : celui des messages et celui de l’énergie."
      contenu:
          - type: paragraphe
            texte: "Exemple pour comprendre : avec une télévision, la télécommande envoie un ordre (« allume-toi »), mais c’est la prise qui fournit l’électricité. L’ordre et l’énergie ne passent pas par le même chemin."
          - type: paragraphe
            texte: "Dans le monte-charge, c’est pareil. Pour monter : l’alimentation fournit l’électricité, l’interface de puissance la laisse passer, le moteur tourne, puis la poulie et le câble entraînent la plateforme. C’est la chaîne d’énergie."
          - type: paragraphe
            texte: "En même temps, le bouton et le capteur envoient des messages à la carte, et la carte envoie un ordre à l’interface de puissance. C’est la chaîne d’information."
      questions:
          - id: q01
            type: tableau
            enonce: "Chaîne d’énergie : quelle pièce réalise chaque action ?"
            colonnes:
                - Action
                - Pièce
            lignes:
                - - "1. Fournir l’électricité (alimenter)"
                  - ""
                - - "2. Laisser passer l’électricité (distribuer)"
                  - ""
                - - "3. Produire un mouvement (convertir)"
                  - ""
                - - "4. Amener le mouvement à la plateforme (transmettre)"
                  - ""
          - id: q02
            type: texte
            enonce: "Chaîne d’information : recopie les deux lignes et remplace chaque « … » par une pièce ou un court message."
            aide: "Une flèche veut dire « envoie un message à ». Exemple : télécommande — « allume-toi » → télévision."
            contenu:
                - type: code
                  texte: |-
                      Tu appuies sur Monter :
                      bouton — « … » → … — « … » → interface de puissance

                      La plateforme arrive en haut :
                      … — « … » → carte de commande
      ressources:
          - type: paragraphe
            texte: "Cette vidéo explique la chaîne d’énergie. Lis seulement le texte sous la vidéo et repère les quatre actions : alimenter, distribuer, convertir, transmettre."
          - type: lien
            titre: "Lumni — Comment produire et bien utiliser l’énergie électrique ?"
            url: https://www.lumni.fr/video/comment-produire-et-bien-utiliser-lenergie-electrique-23-avril
    - id: a03
      titre: "Enquête : le monte-charge ne monte plus"
      transition: "Tu sais comment le monte-charge fonctionne quand tout va bien. Maintenant, on utilise ce que tu as appris pour chercher une panne, comme au DNB."
      contenu:
          - type: paragraphe
            texte: "Le voyant s’allume, mais la plateforme ne bouge pas."
          - type: paragraphe
            texte: "Rappel : le voyant est allumé par la carte de commande. Il montre seulement que la carte a donné l’ordre de monter. Il ne vérifie pas si le moteur tourne vraiment."
      questions:
          - id: q01
            type: texte
            enonce: "Un élève dit : « Le voyant est allumé, donc c’est le câble qui est cassé. » A-t-il raison ? Réponds aux trois points."
            aide: "Exemple de la vie courante : si ton vélo n’avance pas alors que tu pédales, est-ce forcément la chaîne ? Il faut vérifier avant de décider."
            contenu:
                - type: liste
                  elements:
                      - "Le voyant allumé prouve-t-il que le moteur reçoit de l’électricité ? Pourquoi ?"
                      - "Que pourrait-on vérifier pour trouver la panne ?"
                      - "Que nous apprendrait le résultat de cette vérification ?"
          - id: q02
            type: texte
            enonce: "La carte donne bien l’ordre de monter, mais rien ne bouge. Cite une pièce de la chaîne d’énergie qui pourrait être en panne, et explique pourquoi."
            aide: "Relis le tableau de la mission 2 : quelles pièces se trouvent après la carte de commande ?"
      ressources:
          - type: paragraphe
            texte: "Relis le rôle d’une LED (un voyant) sur cette page : elle affiche quelque chose, mais elle ne mesure rien."
          - *microbit
    - id: a04
      titre: "Le volet roulant de ta chambre"
      defi: true
      facultatif: true
      contenu:
          - type: paragraphe
            texte: "Un volet roulant électrique fonctionne comme le monte-charge : un interrupteur, une carte, un moteur, un axe qui enroule le volet."
      questions:
          - id: q01
            type: texte
            enonce: "Écris la chaîne d’information et la chaîne d’énergie du volet roulant, comme tu l’as fait pour le monte-charge."
            aide: "Commence par : « Information : interrupteur → … » puis « Énergie : alimentation → … »."
    - id: a05
      titre: "Conclusion de ton travail"
      conclusion: true
      transition: "Tu as trouvé le rôle des pièces, suivi les deux chemins et mené une enquête. Il reste à répondre au problème de départ."
      questions:
          - id: q01
            type: texte
            enonce: "Réponds au problème du jour en 3 ou 4 phrases : quand tu appuies sur « Monter », que se passe-t-il à l’intérieur du monte-charge ?"
            aide: "Tu peux commencer par : « Le bouton envoie… La carte de commande… L’interface de puissance… Le moteur… »"
sources:
    - type: lien
      titre: "Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)"
      url: https://www.education.gouv.fr/media/160767/download
    - type: lien
      titre: "Éduscol — Édubase : le projet de monte-charge"
      url: https://edubase.eduscol.education.fr/fiche/24732
