titre: 'Séance 12 : Mon identité numérique : quelles règles ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Comment construire et protéger son identité numérique ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
objectifs:
    connaissances:
        - 'L’identité numérique : tout ce qu’on trouve sur moi en ligne (publications, photos, commentaires, comptes) ; elle se construit et dure longtemps.'
        - 'Règles : réfléchir avant de publier, régler la confidentialité, respecter le droit à l’image et la propriété intellectuelle, limiter cookies et géolocalisation.'
    competences:
        - Analyser une identité numérique.
        - Appliquer des règles d’usage raisonné.
pourquoi:
    - En 4e, tu as vu les traces, les cookies et le droit d’auteur.
    - En 3e, avant de chercher un stage ou un lycée, on regarde ce qu’Internet dit de toi.
activites:
    -   id: a01
        titre: Que dit Internet de Max ?
        consigne: Tu vas analyser l’identité numérique de Max, un élève inventé, à partir du document 1. On attend un élément positif et un élément négatif, chacun justifié.
        contenu:
            -   type: tableau
                titre: Document 1 — L’identité numérique de Max (situation inventée)
                colonnes:
                    - Trouvé en ligne
                    - Effet possible
                lignes:
                    -   - Photo de soirée publique
                        - Image négative pour un recruteur
                    -   - Vidéo de son projet techno sur une plateforme
                        - Image positive
                    -   - Commentaire insultant d’il y a 2 ans
                        - Image négative durable
            -   type: etapes
                elements:
                    - 'Lis le document 1 : ce qu’on trouve en ligne sur Max.'
                    - Pour chaque élément, demande-toi ce qu’en penserait un recruteur de stage.
                    - Repère un élément positif et un élément négatif.
            -   type: paragraphe
                texte: Pourquoi un recruteur ? Avant un stage ou un emploi, beaucoup de gens tapent le nom du candidat dans un moteur de recherche.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, donne un élément qui construit une image positive de Max et un qui lui nuit. Justifie.
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
            -   id: q02
                type: qcm
                enonce: Max a supprimé une publication. A-t-elle forcément disparu d’Internet ?
                choix:
                    -   id: a
                        texte: 'Non : elle a pu être copiée, partagée ou capturée.'
                    -   id: b
                        texte: Oui, toujours.
                    -   id: c
                        texte: Oui, après une heure.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a02
        titre: Mes règles
        transition: Construis maintenant tes règles.
        consigne: Tu vas appliquer les règles d’un usage responsable d’Internet à trois situations de la vie courante. On attend la bonne règle pour chaque situation.
        contenu:
            -   type: etapes
                elements:
                    - Lis chaque situation du tableau.
                    - 'Rappelle-toi la 4e : droit à l’image, licences, géolocalisation.'
                    - Écris la règle à appliquer.
            -   type: paragraphe
                texte: Pourquoi des règles ? Elles protègent ta vie privée et respectent les droits des autres, qui ont les mêmes que toi.
        questions:
            -   id: q01
                type: tableau
                enonce: Pour chaque situation, écris la règle à appliquer pour protéger ton identité numérique ou celle des autres.
                colonnes:
                    - Situation
                    - Règle
                lignes:
                    -   - Je veux publier une photo d’un ami
                        - ''
                    -   - Une application demande ma position en permanence
                        - ''
                    -   - Je veux utiliser une musique dans ma vidéo
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
    -   id: a03
        titre: Construire une image positive
        transition: Tu sais te protéger. Construis aussi une image positive.
        consigne: Tu vas proposer des actions pour construire une identité numérique positive, en t’inspirant de l’exemple de Max. On attend deux actions concrètes.
        contenu:
            -   type: etapes
                elements:
                    - Repense à la vidéo de projet de Max.
                    - Cherche ce que toi, tu pourrais montrer de positif en ligne.
                    - Écris deux actions concrètes.
            -   type: paragraphe
                texte: 'Pourquoi construire ? L’identité numérique n’est pas qu’un danger : bien gérée, elle montre ce que tu sais faire.'
        questions:
            -   id: q01
                type: texte
                enonce: Propose deux actions concrètes pour construire une identité numérique positive.
                aide: Une idée réaliste + « Cela permet de… ».
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Tape ton prénom et ton nom dans un moteur de recherche (chez toi, avec un adulte si tu veux).
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi faire régulièrement cette recherche ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment construire et protéger son identité numérique ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Identité numérique : tout ce qu’on trouve sur moi ; elle dure.'
    - Réfléchir avant de publier ; confidentialité ; droit à l’image ; licences.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
