titre: 'Séance 19 : Calc n° 1 : quelle cuve a le plus petit bilan carbone ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment comparer l’impact carbone de deux cuves avec un tableur ?
competences_bo:
    - Caractériser et choisir un objet ou un système technique selon différents critères
objectifs:
    connaissances:
        - Le bilan carbone additionne les émissions de gaz à effet de serre de chaque étape du cycle de vie (en kg équivalent CO₂).
        - 'Dans Calc : la fonction SI affiche un résultat selon une condition, =SI(B6<C6;"A";"B") ; un graphique comparatif met côte à côte les deux solutions.'
    competences:
        - Calculer un bilan avec des formules.
        - Utiliser la fonction SI.
        - Faire un graphique comparatif.
pourquoi:
    - En séance 18, tu as comparé trois cuves.
    - Aujourd’hui, tu compares l’impact carbone des cuves A et B dans Calc.
activites:
    -   id: a01
        titre: Les totaux
        consigne: Tu vas calculer dans Calc le bilan carbone total des cuves A et B, à partir des émissions de chaque étape de leur cycle de vie (tableau ci-dessous). On attend les deux totaux.
        contenu:
            -   type: tableau
                titre: Ce que tu dois obtenir dans Calc (valeurs inventées pour l’exercice)
                colonnes:
                    - ''
                    - A
                    - B
                    - C
                lignes:
                    -   - '1'
                        - Étape
                        - Cuve A (kg CO₂e)
                        - Cuve B (kg CO₂e)
                    -   - '2'
                        - Fabrication
                        - '120'
                        - '600'
                    -   - '3'
                        - Transport
                        - '20'
                        - '150'
                    -   - '4'
                        - Utilisation (20 ans)
                        - '10'
                        - '10'
                    -   - '5'
                        - Fin de vie
                        - '15'
                        - '40'
                    -   - '6'
                        - Total
                        - ''
                        - ''
            -   type: etapes
                elements:
                    - Ouvre Calc et enregistre sous 3e_S19_groupe.ods.
                    - Recopie le tableau ci-dessous (lignes 1 à 6, colonnes A à C).
                    - En B6, écris =SOMME(B2:B5), puis recopie la formule en C6.
            -   type: paragraphe
                texte: Pourquoi SOMME ? Si une valeur change, le total se recalcule tout seul.
        questions:
            -   id: q01
                type: tableau
                enonce: Recopie les totaux calculés par Calc pour le bilan carbone des cuves A et B.
                colonnes:
                    - Cuve
                    - Total (kg CO₂e)
                lignes:
                    -   - A
                        - ''
                    -   - B
                        - ''
                aide: Dans ta feuille, lis les cellules où tu as additionné les étapes du cycle de vie de chaque cuve.
    -   id: a02
        titre: La fonction SI
        transition: Les totaux sont calculés. Fais désigner la meilleure cuve par Calc.
        consigne: Tu vas utiliser la fonction SI de Calc pour que la feuille désigne seule la cuve qui a le plus petit bilan carbone. On attend la formule et son résultat.
        contenu:
            -   type: etapes
                elements:
                    - 'En A8, écris « La meilleure cuve : ».'
                    - En B8, écris =SI(B6<C6;"Cuve A";"Cuve B").
                    - Change une valeur de la cuve B pour la rendre meilleure, observe B8, puis remets la valeur.
            -   type: paragraphe
                texte: 'Pourquoi SI ? La feuille décide toute seule : si les données changent, la conclusion change aussi.'
        questions:
            -   id: q01
                type: texte
                enonce: Écris la formule de la cellule B8 de ta feuille de bilan carbone et ce qu’elle affiche.
                aide: 'Clique sur B8 : recopie la formule SI telle qu’elle apparaît dans la barre de formule, puis le texte affiché dans la cellule.'
    -   id: a03
        titre: Graphique et analyse
        transition: Calc a choisi. Un graphique aide à comprendre pourquoi.
        consigne: Tu vas tracer le graphique du bilan carbone par étape et l’analyser, puis tenir compte de la durée de vie des cuves. On attend l’étape la plus lourde, expliquée, et un calcul par année.
        contenu:
            -   type: etapes
                elements:
                    - Sélectionne A1:C5, puis Insertion > Diagramme > Colonnes.
                    - Titre « Bilan carbone par étape » ; axe Y « kg CO₂e ».
                    - Repère l’étape la plus haute pour chaque cuve.
            -   type: paragraphe
                texte: 'Pourquoi un graphique ? Il montre d’un coup d’œil quelle étape pèse le plus : c’est là qu’il faut agir.'
        questions:
            -   id: q01
                type: texte
                enonce: D’après ton graphique, quelle étape du cycle de vie pèse le plus pour chaque cuve ? Pourquoi ?
                aide: 'Sur le graphique, cherche la barre la plus haute de chaque cuve, puis pense à ce qui demande le plus d’énergie : produire le béton ou le plastique, ou transporter ?'
            -   id: q02
                type: texte
                enonce: La cuve B dure 50 ans au lieu de 20. Faut-il en tenir compte ? Calcule le bilan carbone par année pour chaque cuve.
                aide: Divise le bilan de chaque cuve par sa durée de vie en années, puis compare les deux résultats.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: NB.SI compte les cellules qui respectent une condition.
        questions:
            -   id: q01
                type: texte
                enonce: Écris une formule qui compte combien d’étapes de la cuve B dépassent 100 kg.
                aide: Utilise NB.SI sur la plage des étapes de la cuve B, avec la condition « >100 » entre guillemets.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as comparé avec le tableur. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment comparer l’impact carbone de deux cuves avec un tableur ?'
                aide: 'Cite les étapes : additionner, désigner la meilleure avec SI, représenter avec un graphique, ramener à la durée de vie.'
retenir:
    - 'Bilan carbone : somme des étapes du cycle de vie (kg CO₂e).'
    - 'Calc : SOMME, SI, NB.SI, graphique comparatif.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
