titre: 'Séance 19 : Calc n° 1 : quelle cuve a le plus petit bilan carbone ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment comparer l’impact carbone de deux cuves avec un tableur ?
competences_bo:
    - Caractériser et choisir un objet ou un système technique selon différents critères
objectifs:
    connaissances:
        - Le bilan carbone additionne les émissions de gaz à effet de serre de chaque étape du cycle de vie (en kg équivalent CO₂).
        - 'Dans Calc : la fonction SI affiche un résultat selon une condition, =SI(B6<C6;"A";"B") ; un graphique comparatif met côte à côte les deux solutions.'
    competences:
        - Calculer un bilan avec des formules.
        - Utiliser la fonction SI.
        - Faire un graphique comparatif.
pourquoi:
    - En séance 18, tu as comparé trois cuves.
    - Aujourd’hui, tu compares l’impact carbone des cuves A et B dans Calc.
activites:
    -   id: a01
        titre: Les données
        contenu:
            -   type: tableau
                titre: Ce que tu dois obtenir dans Calc (valeurs inventées pour l’exercice)
                colonnes:
                    - ''
                    - A
                    - B
                    - C
                lignes:
                    -   - '1'
                        - Étape
                        - Cuve A (kg CO₂e)
                        - Cuve B (kg CO₂e)
                    -   - '2'
                        - Fabrication
                        - '120'
                        - '600'
                    -   - '3'
                        - Transport
                        - '20'
                        - '150'
                    -   - '4'
                        - Utilisation (20 ans)
                        - '10'
                        - '10'
                    -   - '5'
                        - Fin de vie
                        - '15'
                        - '40'
                    -   - '6'
                        - Total
                        - ''
                        - ''
            -   type: etapes
                elements:
                    - Ouvre Calc, enregistre sous 3e_S19_groupe.ods, recopie le tableau.
                    - 'En B6 : =SOMME(B2:B5) ; recopie vers C6.'
                    - 'En B8 : =SI(B6<C6;"Cuve A";"Cuve B").'
        questions:
            -   id: q01
                type: tableau
                enonce: Recopie les totaux.
                colonnes:
                    - Cuve
                    - Total (kg CO₂e)
                lignes:
                    -   - A
                        - ''
                    -   - B
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
            -   id: q02
                type: texte
                enonce: Écris la formule de B8 et ce qu’elle affiche.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a02
        titre: Graphique et analyse
        transition: Les totaux sont calculés. Un graphique aide à comparer.
        contenu:
            -   type: etapes
                elements:
                    - Sélectionne A1:C5, Insertion > Diagramme > Colonnes.
                    - Titre « Bilan carbone par étape » ; axe Y « kg CO₂e ».
        questions:
            -   id: q01
                type: texte
                enonce: D’après le graphique, quelle étape pèse le plus pour chaque cuve ? Pourquoi ?
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
            -   id: q02
                type: texte
                enonce: La cuve B dure 50 ans au lieu de 20. Faut-il en tenir compte ? Calcule le bilan par année.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: NB.SI compte les cellules qui respectent une condition.
        questions:
            -   id: q01
                type: texte
                enonce: Écris une formule qui compte combien d’étapes de la cuve B dépassent 100 kg.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as comparé avec le tableur. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment comparer l’impact carbone de deux cuves avec un tableur ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Bilan carbone : somme des étapes du cycle de vie (kg CO₂e).'
    - 'Calc : SOMME, SI, NB.SI, graphique comparatif.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
