titre: "Vérifier sa préparation à la certification et renforcer son profil"
theme: "Parcours transversal Pix"
problematique: "Vérifier sa préparation à la certification et renforcer son profil"
pourquoi: "Développer le profil et préparer la certification selon les besoins réels."
application: "Réaliser le parcours prévu par l’enseignant et noter les compétences à renforcer."
lien_precedent: "Reprends une méthode des séances précédentes : elle t’aidera pour vérifier sa préparation à la certification et renforcer son profil."
prerequis:
    - "Lire une consigne et repérer les informations données."
    - "Suivre un exemple étape par étape et expliquer ce que tu fais."
notions:
    - titre: "Un exemple pour démarrer"
      texte: "Lis la consigne du parcours, repère le résultat attendu, puis note une difficulté précise à reprendre. Aujourd’hui, on l’applique à Pix."
objectifs:
    connaissances:
        - "Développer le profil et préparer la certification selon les besoins réels."
    competences:
        - "Réaliser le parcours prévu par l’enseignant et noter les compétences à renforcer."
        - "Justifier une réponse avec une information observée ou un résultat de test."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Développer le profil et préparer la certification selon les besoins réels."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Réaliser le parcours prévu par l’enseignant et noter les compétences à renforcer."
    - type: paragraphe
      texte: "Dans la vie réelle : Lis la consigne du parcours, repère le résultat attendu, puis note une difficulté précise à reprendre."
    - type: paragraphe
      texte: "Nous allons observer un exemple, essayer avec de l’aide, puis réutiliser la méthode. Suis les étapes dans l’ordre ; elles te guident."
activites:
    - id: a01
      titre: "Observer l’exemple"
      pourquoi: "L’exemple montre une première méthode avant que tu essaies."
      demarche:
          - "Lis la consigne et repère ce qui est demandé."
          - "Suis l’exemple et fais les étapes dans l’ordre."
          - "Garde une trace courte de ton résultat."
      contenu:
          - type: paragraphe
            texte: "Lis la situation : Vérifier sa préparation à la certification et renforcer son profil. Repère le besoin, les informations utiles et le résultat attendu."
      questions:
          - id: q01
            type: texte
            obligatoire: true
            enonce: "Qu’est-ce qu’on cherche à comprendre ou à réaliser ?"
            aide: "Relis l’exemple et cite une information précise."
    - id: a02
      titre: "Essayer avec un guide"
      pourquoi: "Tu réutilises les étapes de l’exemple sur une situation proche."
      demarche:
          - "Lis la consigne et repère ce qui est demandé."
          - "Suis l’exemple et fais les étapes dans l’ordre."
          - "Garde une trace courte de ton résultat."
      contenu:
          - type: paragraphe
            texte: "Réaliser le parcours prévu par l’enseignant et noter les compétences à renforcer."
      questions:
          - id: q01
            type: texte
            obligatoire: true
            enonce: "Quelle étape as-tu faite en premier ? Quelle information t’a aidé ?"
            aide: "Relis l’exemple et cite une information précise."
    - id: a03
      titre: "Réinvestir"
      pourquoi: "Tu changes de situation pour vérifier que tu sais réutiliser la méthode."
      demarche:
          - "Lis la consigne et repère ce qui est demandé."
          - "Suis l’exemple et fais les étapes dans l’ordre."
          - "Garde une trace courte de ton résultat."
      contenu:
          - type: paragraphe
            texte: "Applique la méthode à un autre cas de Pix. Compare le résultat attendu et le résultat obtenu ; si cela ne fonctionne pas, modifie une seule chose puis recommence."
      questions:
          - id: q01
            type: texte
            obligatoire: true
            enonce: "Qu’as-tu changé et qu’est-ce que cela a amélioré ?"
            aide: "Relis l’exemple et cite une information précise."
    - id: a04
      titre: "Garder une trace"
      pourquoi: "Une trace courte te permettra de retrouver la méthode plus tard."
      demarche:
          - "Lis la consigne et repère ce qui est demandé."
          - "Suis l’exemple et fais les étapes dans l’ordre."
          - "Garde une trace courte de ton résultat."
      contenu:
          - type: paragraphe
            texte: "Écris une phrase qui résume ce que tu sais maintenant faire dans « Vérifier sa préparation à la certification et renforcer son profil ». Ajoute une preuve ou un exemple."
      questions:
          - id: q01
            type: texte
            obligatoire: true
            enonce: "Quelle méthode veux-tu retenir pour la prochaine séance ?"
            aide: "Relis l’exemple et cite une information précise."
ressources:
    - titre: "Aide pour Pix"
      url: "https://pix.fr/"
      pourquoi: "Utilise cette ressource pour rechercher une information utile, puis reformule avec tes mots."
reperes_officiels:
    programme: "Technologie au cycle 4 — programme officiel applicable en 3e à partir de la rentrée 2026."
    lien: "https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A"
    contribution: "Cette séance contribue à : Développer le profil et préparer la certification selon les besoins réels."
bilan:
    - "Je peux expliquer ce que j’ai appris avec mes mots."
    - "Je peux montrer une réponse, une production ou un test qui prouve mon travail."
