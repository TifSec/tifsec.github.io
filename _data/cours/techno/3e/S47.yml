titre: 'Séance 47 : Brevet blanc n° 3 : correction et reprise'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Quels réflexes dois-je encore consolider avant le brevet ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
    - Comprendre et modifier un programme associé à une fonctionnalité d’un objet ou d’un système technique
objectifs:
    connaissances:
        - Une erreur = un réflexe à retravailler.
    competences:
        - Analyser ses erreurs.
        - S’entraîner.
pourquoi:
    - En séance 46, tu as passé le dernier brevet blanc.
    - Correction et remédiation ciblée.
activites:
    -   id: a01
        titre: Analyser
        consigne: Tu vas comparer tes trois brevets blancs pour trouver l’erreur qui revient. On attend cette erreur et le réflexe qui la corrige.
        contenu:
            -   type: etapes
                elements:
                    - Reprends ta copie corrigée du brevet blanc n° 3.
                    - Compare avec tes erreurs des brevets blancs n° 1 et n° 2 (séances 15 et 33).
                    - Repère l’erreur qui revient.
            -   type: paragraphe
                texte: 'Pourquoi chercher l’erreur qui revient ? C’est elle qui risque de te coûter des points au DNB : c’est la priorité.'
        questions:
            -   id: q01
                type: texte
                enonce: Quelle erreur revient dans tes trois brevets blancs, et quel réflexe la corrige ?
                aide: Repère le verbe de la question.
    -   id: a02
        titre: 'Reprise : algorithme'
        transition: Ton erreur est identifiée. Entraîne-toi.
        consigne: 'Tu vas t’entraîner sur un cas nouveau proche du brevet : l’abri à vélos éclairé (ci-dessous). On attend son algorithme complet.'
        contenu:
            -   type: citation
                texte: 'Un abri à vélos éclairé : un détecteur de présence et un capteur de lumière ; si quelqu’un est présent ET qu’il fait nuit, la lampe s’allume 1 minute ; un panneau solaire charge une batterie.'
            -   type: etapes
                elements:
                    - Lis la situation de l’abri à vélos.
                    - Écris l’algorithme avec TOUJOURS, SI … ET … ALORS (R12).
                    - Vérifie que la durée d’allumage y est.
            -   type: paragraphe
                texte: 'Pourquoi « ET » ? Les deux conditions doivent être vraies : la lampe ne s’allume pas le jour, même si quelqu’un passe.'
        questions:
            -   id: q01
                type: texte
                enonce: Écris l’algorithme de l’éclairage de l’abri à vélos.
                aide: Combien d’éléments sont demandés ?
    -   id: a03
        titre: 'Reprise : chaîne d’information'
        transition: L’algorithme est écrit. Continue avec la chaîne.
        consigne: Tu vas construire la chaîne d’information de l’abri à vélos éclairé. On attend chaque constituant dans la bonne fonction.
        contenu:
            -   type: etapes
                elements:
                    - Repère les constituants de l’abri.
                    - Range chacun dans sa fonction.
                    - 'Attention : la lampe agit, elle ne mesure rien.'
            -   type: paragraphe
                texte: 'Pourquoi revoir la chaîne ? C’est une question presque sûre au brevet : elle doit être réussie à coup sûr.'
        questions:
            -   id: q01
                type: tableau
                enonce: Construis la chaîne d’information de l’abri à vélos éclairé.
                colonnes:
                    - Fonction
                    - Constituant
                lignes:
                    -   - Acquérir
                        - ''
                    -   - Traiter
                        - ''
                    -   - Communiquer / agir
                        - ''
                aide: Ligne × colonne.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La batterie de l’abri peut se vider en hiver.
        questions:
            -   id: q01
                type: texte
                enonce: Ajoute une règle à l’algorithme pour économiser la batterie.
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Fais le point.
        questions:
            -   id: q01
                type: texte
                enonce: Quels deux réflexes vas-tu réviser avant le DNB, et comment ?
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - Une erreur = un réflexe.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
