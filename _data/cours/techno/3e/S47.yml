titre: 'Séance 47 : Brevet blanc n° 3 : correction et reprise'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Quels réflexes dois-je encore consolider avant le brevet ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
    - Comprendre et modifier un programme associé à une fonctionnalité d’un objet ou d’un système technique
objectifs:
    connaissances:
        - Une erreur = un réflexe à retravailler.
    competences:
        - Analyser ses erreurs.
        - S’entraîner.
pourquoi:
    - En séance 46, tu as passé le dernier brevet blanc.
    - Correction et remédiation ciblée.
activites:
    -   id: a01
        titre: Analyser
        questions:
            -   id: q01
                type: texte
                enonce: Quelle a été ton erreur principale, et quel réflexe la corrige ?
                aide: Repère le verbe de la question.
    -   id: a02
        titre: Remédiation
        transition: Entraîne-toi.
        contenu:
            -   type: citation
                texte: 'Un abri à vélos éclairé : un détecteur de présence et un capteur de lumière ; si présence ET nuit, la lampe s’allume 1 minute ; un panneau solaire charge une batterie.'
        questions:
            -   id: q01
                type: texte
                enonce: Écris l’algorithme.
                aide: Combien d’éléments sont demandés ?
            -   id: q02
                type: tableau
                enonce: Chaîne d’information.
                colonnes:
                    - Fonction
                    - Constituant
                lignes:
                    -   - Acquérir
                        - ''
                    -   - Traiter
                        - ''
                    -   - Communiquer / agir
                        - ''
                aide: Ligne × colonne.
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La batterie de l’abri peut se vider en hiver.
        questions:
            -   id: q01
                type: texte
                enonce: Ajoute une règle pour économiser la batterie.
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Fais le point.
        questions:
            -   id: q01
                type: texte
                enonce: Quels deux réflexes vas-tu réviser avant le DNB ?
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - Une erreur = un réflexe.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
