titre: "Correction de S48 et priorités personnelles"
theme: "Parcours transversal DNB 2027"
problematique: "Correction de S48 et priorités personnelles"
pourquoi: "Mobiliser les acquis dans un dossier et expliquer son raisonnement."
application: "Répondre à partir des documents, citer une preuve et expliquer une étape de son raisonnement."
lien_precedent: "Reprends une méthode des séances précédentes : elle t’aidera pour correction de s48 et priorités personnelles."
prerequis:
    - "Lire une consigne et repérer les informations données."
    - "Réutiliser une méthode déjà rencontrée, puis vérifier ton résultat."
notions:
    - titre: "Un exemple pour démarrer"
      texte: "Souligne la question, entoure les données utiles et indique la pièce ou l’information qui justifie ta réponse. Aujourd’hui, on l’applique à dossier DNB."
objectifs:
    connaissances:
        - "Mobiliser les acquis dans un dossier et expliquer son raisonnement."
    competences:
        - "Répondre à partir des documents, citer une preuve et expliquer une étape de son raisonnement."
        - "Justifier une réponse avec une information observée ou un résultat de test."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Mobiliser les acquis dans un dossier et expliquer son raisonnement."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Répondre à partir des documents, citer une preuve et expliquer une étape de son raisonnement."
    - type: paragraphe
      texte: "Dans la vie réelle : Souligne la question, entoure les données utiles et indique la pièce ou l’information qui justifie ta réponse."
    - type: paragraphe
      texte: "Nous allons observer un exemple, essayer avec de l’aide, puis réutiliser la méthode. Tu peux choisir une méthode connue, mais explique et vérifie ton choix."
activites:
    - id: a01
      titre: "Observer l’exemple"
      pourquoi: "L’exemple montre une première méthode avant que tu essaies."
      demarche:
          - "Lis la consigne et repère ce qui est demandé."
          - "Choisis une méthode déjà apprise et vérifie-la sur le cas proposé."
          - "Garde une trace courte de ton résultat."
      contenu:
          - type: paragraphe
            texte: "Lis la situation : Correction de S48 et priorités personnelles. Repère le besoin, les informations utiles et le résultat attendu."
      questions:
          - id: q01
            type: texte
            obligatoire: true
            enonce: "Qu’est-ce qu’on cherche à comprendre ou à réaliser ?"
            aide: "Relis l’exemple et cite une information précise."
    - id: a02
      titre: "Essayer avec un guide"
      pourquoi: "Tu réutilises les étapes de l’exemple sur une situation proche."
      demarche:
          - "Lis la consigne et repère ce qui est demandé."
          - "Choisis une méthode déjà apprise et vérifie-la sur le cas proposé."
          - "Garde une trace courte de ton résultat."
      contenu:
          - type: paragraphe
            texte: "Répondre à partir des documents, citer une preuve et expliquer une étape de son raisonnement."
      questions:
          - id: q01
            type: texte
            obligatoire: true
            enonce: "Quelle étape as-tu faite en premier ? Quelle information t’a aidé ?"
            aide: "Relis l’exemple et cite une information précise."
    - id: a03
      titre: "Réinvestir"
      pourquoi: "Tu changes de situation pour vérifier que tu sais réutiliser la méthode."
      demarche:
          - "Lis la consigne et repère ce qui est demandé."
          - "Choisis une méthode déjà apprise et vérifie-la sur le cas proposé."
          - "Garde une trace courte de ton résultat."
      contenu:
          - type: paragraphe
            texte: "Applique la méthode à un autre cas de dossier DNB. Compare le résultat attendu et le résultat obtenu ; si cela ne fonctionne pas, modifie une seule chose puis recommence."
      questions:
          - id: q01
            type: texte
            obligatoire: true
            enonce: "Qu’as-tu changé et qu’est-ce que cela a amélioré ?"
            aide: "Relis l’exemple et cite une information précise."
    - id: a04
      titre: "Garder une trace"
      pourquoi: "Une trace courte te permettra de retrouver la méthode plus tard."
      demarche:
          - "Lis la consigne et repère ce qui est demandé."
          - "Choisis une méthode déjà apprise et vérifie-la sur le cas proposé."
          - "Garde une trace courte de ton résultat."
      contenu:
          - type: paragraphe
            texte: "Écris une phrase qui résume ce que tu sais maintenant faire dans « Correction de S48 et priorités personnelles ». Ajoute une preuve ou un exemple."
      questions:
          - id: q01
            type: texte
            obligatoire: true
            enonce: "Quelle méthode veux-tu retenir pour la prochaine séance ?"
            aide: "Relis l’exemple et cite une information précise."
ressources:
    - titre: "Aide pour dossier DNB"
      url: "https://www.education.gouv.fr/bo/2026/Hebdo4/MENE2623228N"
      pourquoi: "Utilise cette ressource pour rechercher une information utile, puis reformule avec tes mots."
reperes_officiels:
    programme: "Technologie au cycle 4 — programme officiel applicable en 3e à partir de la rentrée 2026."
    lien: "https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A"
    contribution: "Cette séance contribue à : Mobiliser les acquis dans un dossier et expliquer son raisonnement."
bilan:
    - "Je peux expliquer ce que j’ai appris avec mes mots."
    - "Je peux montrer une réponse, une production ou un test qui prouve mon travail."
