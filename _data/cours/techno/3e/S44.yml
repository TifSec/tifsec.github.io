titre: 'Séance 44 : Impress n° 1 : préparer la soutenance'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment préparer une soutenance claire, dans le temps, en anticipant les questions ?
competences_bo:
    - Imaginer, concevoir et réaliser une ou des solutions en réponse à un besoin, à des exigences (de développement durable, par exemple) ou à la nécessité d’améliorations dans une démarche de créativité
objectifs:
    connaissances:
        - 'Une soutenance : une idée par diapositive, un temps de parole réparti, une démonstration, des réponses préparées aux questions.'
    competences:
        - Construire un diaporama de soutenance.
        - Préparer les questions du jury.
pourquoi:
    - En 4e, tu as utilisé le masque et les notes. Le projet cuve est presque terminé.
    - Aujourd’hui, la soutenance se prépare.
activites:
    -   id: a01
        titre: Le diaporama
        consigne: Tu vas construire dans Impress le diaporama de la soutenance du projet cuve, en suivant le plan en six parties. On attend le contenu de la diapositive des tests.
        contenu:
            -   type: liste
                elements:
                    - 1. Le besoin et le cahier des charges.
                    - 2. Les choix argumentés (cuve, source, matériau).
                    - 3. Les chaînes d’énergie et d’information.
                    - 4. Le programme (fonctions) et la radio.
                    - 5. Les tests et le bilan.
                    - 6. Limites et suite.
            -   type: etapes
                elements:
                    - Ouvre Impress et enregistre sous 3e_soutenance_groupe.odp.
                    - Règle le masque (fond, nom du projet en bas), comme en 4e.
                    - Crée les six diapositives du plan, une idée chacune.
                    - 'Ajoute des preuves : chiffres, captures, graphiques.'
            -   type: paragraphe
                texte: Pourquoi une idée par diapositive ? Le jury suit plus facilement, et toi tu sais toujours où tu en es.
        questions:
            -   id: q01
                type: texte
                enonce: 'Écris le titre et le contenu (en quelques mots) de la diapositive 5 de ta soutenance : les tests et le bilan.'
                aide: Attendu ou observé ?
    -   id: a02
        titre: Le temps de parole
        transition: Le diaporama est prêt. Organise la parole.
        consigne: Tu vas répartir les 8 minutes de soutenance entre les membres du groupe et les parties du plan. On attend une répartition dont le total fait 8 minutes.
        contenu:
            -   type: etapes
                elements:
                    - La soutenance dure 8 minutes pour tout le groupe.
                    - Répartis les six parties entre les membres.
                    - 'Donne une durée à chaque partie : le total doit faire 8 minutes.'
            -   type: paragraphe
                texte: Pourquoi répartir ? Chacun doit parler ; et une soutenance qui déborde est souvent coupée avant la fin.
        questions:
            -   id: q01
                type: texte
                enonce: Répartis le temps de parole de la soutenance (8 minutes) entre les membres du groupe et les parties du plan.
                aide: Repère le verbe de la question.
    -   id: a03
        titre: Les questions du jury
        transition: Le temps est réparti. Anticipe les questions.
        consigne: Tu vas anticiper les questions du jury sur le projet cuve et préparer vos réponses. On attend deux questions pertinentes et deux réponses argumentées.
        contenu:
            -   type: etapes
                elements:
                    - Relis les limites de ton projet (séance 42).
                    - 'Imagine deux questions que poserait un jury : un choix, une limite…'
                    - Prépare une réponse argumentée avec un chiffre ou une preuve.
            -   type: paragraphe
                texte: Pourquoi anticiper ? Une question surprise fait perdre ses moyens ; une question préparée devient un point fort.
        questions:
            -   id: q01
                type: texte
                enonce: Prépare deux questions que le jury pourrait poser sur votre cuve, et vos réponses argumentées.
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une démonstration peut échouer le jour de la soutenance.
        questions:
            -   id: q01
                type: texte
                enonce: Quel plan B prévoir ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment préparer une soutenance claire, dans le temps, en anticipant les questions ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Soutenance : une idée par diapositive, temps réparti, démonstration, questions préparées.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
