# ========== TECHNOLOGIE 3e — S02 ==========

titre: "Pourquoi les objets techniques évoluent-ils ?"
theme: "Les objets et les systèmes techniques : leurs usages et leurs interactions"
problematique: "Pourquoi les objets techniques changent-ils alors qu'ils répondent parfois au même besoin ?"

objectifs:
    connaissances:
        - "Un objet technique répond à un besoin."
        - "Plusieurs objets peuvent répondre au même besoin avec des solutions différentes."
        - "Les solutions techniques évoluent au cours du temps."

    competences:
        - "Comparer plusieurs objets techniques."
        - "Identifier les évolutions des solutions techniques."
        - "Justifier une réponse à partir d'exemples."

activites:
    - id: "a01"
      titre: "Un même problème, des solutions différentes"
      consigne: "Pour chaque besoin, propose une solution utilisée autrefois et une solution actuelle."

      questions:
          - id: "q01"
            type: "tableau"
            colonnes:
                - "Besoin"
                - "Ancienne solution"
                - "Solution actuelle"
            lignes:
                - ["Communiquer à distance", "", ""]
                - ["S'éclairer", "", ""]
                - ["Se déplacer", "", ""]

          - id: "q02"
            type: "texte"
            enonce: "Qu'est-ce qui a surtout changé : le besoin ou la manière d'y répondre ? Justifie avec un exemple."

retenir:
    - "Un même besoin peut être satisfait par différentes solutions techniques."
    - "Les solutions techniques évoluent pour répondre aux besoins et améliorer les performances."
