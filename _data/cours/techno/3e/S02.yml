# ========== TECHNOLOGIE 3e — S02 ==========

titre: "Pourquoi les objets techniques évoluent-ils ?"
theme: "Les objets et les systèmes techniques : leurs usages et leurs interactions"
problematique: "Pourquoi les objets techniques changent-ils alors qu'ils répondent parfois au même besoin ?"
pourquoi: "Comparer des objets de différentes époques aide à comprendre ce qui change dans les solutions techniques et ce qui reste nécessaire aux utilisateurs."
application: "Quand on remplace un téléphone ou un moyen d’éclairage, on peut comparer les services rendus et les améliorations utiles, au-delà de leur apparence."
lien_precedent: "Pour démarrer, rappelle comment garder une trace de tes essais et de tes recherches. Ici, tes réponses se rédigent directement dans le cours."
notions:
    - titre: "Repérer le besoin"
      texte: "Le besoin exprime ce qu’une personne cherche à faire ou à obtenir. Avant de nommer un objet, demande-toi quel service est recherché dans la situation étudiée."
    - titre: "Observer la solution technique"
      texte: "La solution technique est le moyen choisi pour rendre ce service. Pour comparer deux objets, observe leur fonctionnement et leur usage, sans t’arrêter à leur forme ou à leur couleur."
    - titre: "Expliquer une évolution"
      texte: "Une évolution peut être liée à de nouvelles connaissances, à des inventions ou à des attentes différentes. On examine des critères précis : efficacité, sécurité, coût, confort, consommation de ressources ou possibilités de réparation. Un objet récent n’est pas automatiquement meilleur sur tous ces critères."
bilan: "Choisis un exemple du tableau et explique avec tes mots la différence entre le besoin et la solution technique. Relis ensuite ta justification."

objectifs:
    connaissances:
        - "Un objet technique répond à un besoin."
        - "Plusieurs objets peuvent répondre au même besoin avec des solutions différentes."
        - "Les solutions techniques évoluent au cours du temps."

    competences:
        - "Comparer plusieurs objets techniques."
        - "Identifier les évolutions des solutions techniques."
        - "Justifier une réponse à partir d'exemples."

activites:
    - id: "a01"
      titre: "Un même problème, des solutions différentes"
      pourquoi: "Distinguer ce dont les personnes ont besoin et les moyens qu’elles utilisent pour y répondre."
      demarche:
          - "Lis les repères du cours et reformule les mots que tu ne comprends pas avec ton professeur ou ton groupe."
          - "Pour chacun des trois besoins du tableau, propose un exemple ancien et un exemple actuel."
          - "Si un exemple te manque, fais une recherche courte dans une ressource proposée par ton professeur. Vérifie qu’elle répond bien à ta question, puis reformule avec tes mots."
          - "Compare tes exemples avant de rédiger ta justification. Si vous travaillez ensemble, chacun doit pouvoir expliquer le choix du groupe."
      consigne: "Pour chaque besoin, propose une solution utilisée autrefois et une solution actuelle."

      questions:
          - id: "q01"
            type: "tableau"
            colonnes:
                - "Besoin"
                - "Ancienne solution"
                - "Solution actuelle"
            lignes:
                - ["Communiquer à distance", "", ""]
                - ["S'éclairer", "", ""]
                - ["Se déplacer", "", ""]

          - id: "q02"
            type: "texte"
            enonce: "Qu'est-ce qui a surtout changé : le besoin ou la manière d'y répondre ? Justifie avec un exemple."

          - id: "q03"
            type: "qcm"
            enonce: "Pour vérifier que tu distingues besoin et solution technique, choisis une seule proposition : une lampe à huile et une lampe à DEL permettent toutes deux de s’éclairer. Qu’est-ce qui change entre ces deux objets ?"
            choix:
                - id: "besoin"
                  texte: "Le besoin : les utilisateurs ne cherchent plus à s’éclairer."
                - id: "solution"
                  texte: "La solution technique utilisée pour répondre au besoin de s’éclairer."
                - id: "aucun"
                  texte: "Rien : ces deux objets fonctionnent exactement de la même manière."

retenir:
    - "Un même besoin peut être satisfait par différentes solutions techniques."
    - "Les solutions techniques évoluent pour répondre aux besoins et améliorer les performances."
