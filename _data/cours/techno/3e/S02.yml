titre: 'Séance 2 : Quels métiers derrière nos objets ?'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Quels métiers conçoivent, fabriquent et réparent les objets techniques, et par quelles formations y accède-t-on ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
objectifs:
    connaissances:
        - 'De nombreux métiers interviennent dans la vie d’un objet : conception (ingénieur, designer, technicien bureau d’études), fabrication (opérateur, technicien de production), maintenance (technicien de maintenance), numérique (développeur, technicien réseau).'
        - 'Après la 3e : voie générale et technologique (dont la STI2D), voie professionnelle (bac pro, CAP), puis BTS, BUT, écoles d’ingénieurs.'
    competences:
        - Associer des métiers aux étapes de la vie d’un objet.
        - Repérer des formations.
pourquoi:
    - En 5e et en 4e, tu as étudié des objets de leur conception à leur dépannage.
    - En 3e, tu choisis ton orientation. Aujourd’hui, tu découvres les métiers qui se cachent derrière nos maquettes.
activites:
    -   id: a01
        titre: Les métiers de nos maquettes
        contenu:
            -   type: tableau
                titre: Document 1
                colonnes:
                    - Métier
                    - Ce qu’il fait
                lignes:
                    -   - Ingénieur ou technicien en bureau d’études
                        - Conçoit l’objet, dessine en CAO, fait les calculs.
                    -   - Développeur
                        - Écrit les programmes.
                    -   - Technicien de fabrication
                        - Règle les machines (imprimante 3D, découpe laser) et contrôle les pièces.
                    -   - Technicien de maintenance
                        - Dépanne et entretient.
                    -   - Technicien réseau
                        - Installe et dépanne les réseaux.
        questions:
            -   id: q01
                type: tableau
                enonce: Pour chaque tâche réalisée sur nos maquettes, quel métier ?
                colonnes:
                    - Tâche
                    - Métier
                lignes:
                    -   - Écrire le programme du tracker
                        - ''
                    -   - Dessiner le rotor en CAO
                        - ''
                    -   - Trouver la panne du monte-charge
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
    -   id: a02
        titre: Les formations
        transition: Ces métiers s’apprennent. Par quelles formations ?
        contenu:
            -   type: tableau
                titre: Document 2
                colonnes:
                    - Après la 3e
                    - Exemples
                lignes:
                    -   - Seconde générale et technologique
                        - Bac STI2D (sciences et technologies de l’industrie et du développement durable), bac général avec spécialité Sciences de l’ingénieur
                    -   - Voie professionnelle
                        - Bac pro Systèmes numériques, Maintenance des systèmes de production connectés, CAP
            -   type: paragraphe
                texte: 'Après le bac : BTS, BUT, écoles d’ingénieurs, apprentissage.'
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 2, quelle formation choisirait un élève qui veut devenir technicien réseau ? Justifie.
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
        ressources:
            -   type: lien
                titre: Onisep — Les métiers de l’industrie et du numérique
                url: https://www.onisep.fr/
    -   id: a03
        titre: Et moi ?
        transition: Et toi, qu’est-ce qui t’attire ?
        questions:
            -   id: q01
                type: texte
                enonce: Quel métier lié à la technologie t’intéresse ou t’intrigue ? Qu’aimerais-tu savoir sur lui ?
                aide: Une phrase complète qui reprend les mots de la question.
            -   id: q02
                type: qcm
                enonce: Les métiers techniques sont-ils réservés aux garçons ?
                choix:
                    -   id: a
                        texte: 'Non : ils sont ouverts à tous, filles et garçons.'
                    -   id: b
                        texte: Oui.
                    -   id: c
                        texte: Seulement certains.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Les métiers évoluent avec les technologies.
        questions:
            -   id: q01
                type: texte
                enonce: Cite un métier qui n’existait pas il y a 30 ans.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as découvert des métiers. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quels métiers interviennent dans la vie d’un objet, et par quelles formations y accède-t-on ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Métiers de la vie d’un objet : concevoir, fabriquer, programmer, maintenir.'
    - 'Formations : STI2D, bac pro, puis BTS, BUT, écoles d’ingénieurs.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
