titre: 'Séance 23 : Comment l’énergie circulera-t-elle dans la cuve ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Quel schéma bloc représente la chaîne d’énergie de la cuve ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - 'Un schéma bloc de chaîne d’énergie : alimenter → distribuer → convertir → transmettre, avec la forme d’énergie entre chaque bloc.'
        - 'Pour la cuve : une alimentation (batterie chargée par un panneau, par exemple) fournit l’énergie électrique ; un relais distribue ; la pompe convertit en énergie mécanique ; le tuyau transmet l’eau.'
    competences:
        - Construire un schéma bloc complet (R17).
        - Indiquer les énergies entre les blocs.
pourquoi:
    - En 5e et en 4e, tu as complété des chaînes d’énergie.
    - En 3e, tu construis entièrement celle de la cuve.
activites:
    -   id: a01
        titre: Le schéma bloc
        contenu:
            -   type: citation
                texte: 'Réflexe brevet n° 17 : je construis le schéma bloc complet : constituants, fonctions et énergies entre les blocs.'
            -   type: paragraphe
                texte: 'Exemple expliqué (éolienne) : vent → [rotor : capter] → énergie mécanique de rotation → [génératrice : convertir] → énergie électrique → [fils : transmettre] → LED.'
        questions:
            -   id: q01
                type: tableau
                enonce: Construis la chaîne d’énergie de la pompe de la cuve.
                colonnes:
                    - Fonction
                    - Constituant
                    - Énergie en sortie
                lignes:
                    -   - Alimenter
                        - ''
                        - ''
                    -   - Distribuer
                        - ''
                        - ''
                    -   - Convertir
                        - ''
                        - ''
                    -   - Transmettre
                        - ''
                        - ''
                aide: Quelle énergie entre, laquelle sort ?
    -   id: a02
        titre: Questions de conception
        transition: Le schéma est fait. Réfléchis aux choix qu’il implique.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi faut-il un relais (ou un transistor) entre la carte micro:bit et la pompe ?
                aide: Pense à « car » (réflexe n° 4).
            -   id: q02
                type: texte
                enonce: Où se trouvent les pertes d’énergie dans cette chaîne ?
                aide: Quelle énergie entre, laquelle sort ?
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La pompe consomme 5 W et fonctionne 10 minutes par jour.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle énergie consomme-t-elle par jour (en Wh) ?
                aide: Quelle énergie entre, laquelle sort ?
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quel schéma bloc représente la chaîne d’énergie de la cuve ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'R17 : schéma bloc complet avec énergies.'
    - 'Relais : la carte commande, la batterie alimente la pompe.'
sources:
