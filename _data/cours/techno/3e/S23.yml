titre: 'Séance 23 : Comment l’énergie circulera-t-elle dans la cuve ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Quel schéma bloc représente la chaîne d’énergie de la cuve ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - 'Un schéma bloc de chaîne d’énergie : alimenter → distribuer → convertir → transmettre, avec la forme d’énergie entre chaque bloc.'
        - 'Pour la cuve : une alimentation (batterie chargée par un panneau, par exemple) fournit l’énergie électrique ; un relais distribue ; la pompe convertit en énergie mécanique ; le tuyau transmet l’eau.'
    competences:
        - Construire un schéma bloc complet (R17).
        - Indiquer les énergies entre les blocs.
pourquoi:
    - En 5e et en 4e, tu as complété des chaînes d’énergie.
    - En 3e, tu construis entièrement celle de la cuve.
activites:
    -   id: a01
        titre: Le schéma bloc
        consigne: Tu vas construire entièrement la chaîne d’énergie de la pompe de la cuve, avec le réflexe R17 et l’exemple de l’éolienne. On attend le constituant et l’énergie de sortie de chaque fonction.
        contenu:
            -   type: citation
                texte: 'Réflexe brevet n° 17 : je construis le schéma bloc complet : constituants, fonctions et énergies entre les blocs.'
            -   type: paragraphe
                texte: 'Exemple expliqué (éolienne) : vent → [rotor : capter] → énergie mécanique de rotation → [génératrice : convertir] → énergie électrique → [fils : transmettre] → LED.'
            -   type: etapes
                elements:
                    - Lis le réflexe R17 et l’exemple de l’éolienne.
                    - 'Pour la pompe de la cuve, cherche le constituant de chaque fonction : alimenter, distribuer, convertir, transmettre.'
                    - Écris l’énergie qui sort de chaque bloc.
            -   type: paragraphe
                texte: 'Pourquoi l’énergie entre les blocs ? Elle montre la transformation : électrique dans les fils, mécanique dans la pompe.'
        questions:
            -   id: q01
                type: tableau
                enonce: Construis la chaîne d’énergie de la pompe de la cuve du collège.
                colonnes:
                    - Fonction
                    - Constituant
                    - Énergie en sortie
                lignes:
                    -   - Alimenter
                        - ''
                        - ''
                    -   - Distribuer
                        - ''
                        - ''
                    -   - Convertir
                        - ''
                        - ''
                    -   - Transmettre
                        - ''
                        - ''
                aide: Quelle énergie entre, laquelle sort ?
    -   id: a02
        titre: Le rôle du relais
        transition: Le schéma est fait. Réfléchis aux choix qu’il implique.
        consigne: Tu vas expliquer le rôle du relais dans la chaîne d’énergie de la cuve. On attend une explication qui relie le courant de la carte et celui de la pompe.
        contenu:
            -   type: etapes
                elements:
                    - 'Rappelle-toi : une carte micro:bit fournit très peu de courant.'
                    - Une pompe en demande beaucoup plus.
                    - Explique comment le relais résout ce problème.
            -   type: paragraphe
                texte: Pourquoi un relais ? Il permet à un petit signal (la carte) de commander une grande énergie (la batterie vers la pompe), comme un interrupteur télécommandé.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi faut-il un relais (ou un transistor) entre la carte micro:bit et la pompe de la cuve ?
                aide: Pense à « car » (réflexe n° 4).
    -   id: a03
        titre: Les pertes
        transition: Le relais est expliqué. Où l’énergie se perd-elle ?
        consigne: Tu vas repérer les pertes d’énergie dans la chaîne d’énergie de la pompe. On attend deux pertes précises.
        contenu:
            -   type: etapes
                elements:
                    - Pour chaque bloc, demande-toi s’il chauffe ou s’il frotte.
                    - Pense aussi à l’eau dans le tuyau.
                    - Écris deux pertes.
            -   type: paragraphe
                texte: 'Pourquoi les pertes ? Toute l’énergie de la batterie n’arrive pas dans l’eau : connaître les pertes aide à dimensionner la batterie.'
        questions:
            -   id: q01
                type: texte
                enonce: Où se trouvent les pertes d’énergie dans la chaîne d’énergie de la pompe de la cuve ? Donne deux pertes.
                aide: Quelle énergie entre, laquelle sort ?
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La pompe consomme 5 W et fonctionne 10 minutes par jour.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle énergie consomme-t-elle par jour (en Wh) ?
                aide: Quelle énergie entre, laquelle sort ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quel schéma bloc représente la chaîne d’énergie de la cuve ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'R17 : schéma bloc complet avec énergies.'
    - 'Relais : la carte commande, la batterie alimente la pompe.'
sources:
