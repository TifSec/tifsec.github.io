titre: 'Séance 36 : Programmer notre fonction'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment programmer et tester la fonction de notre groupe dans le simulateur ?
competences_bo:
    - Concevoir, écrire, tester et mettre au point un programme
objectifs:
    connaissances:
        - Chaque groupe programme sa fonction dans MakeCode micro:bit, la teste seule (avec des valeurs simulées), puis la partage.
    competences:
        - Programmer une fonction.
        - La tester seule avec des valeurs simulées.
pourquoi:
    - En séance 35, la classe a réparti les fonctions.
    - Aujourd’hui, ton groupe programme la sienne.
activites:
    -   id: a01
        titre: Programmer
        contenu:
            -   type: etapes
                elements:
                    - Nouveau projet 3e_S36_fonction_groupe.
                    - Crée ta fonction (Avancé > Fonctions).
                    - Dans « au démarrage », appelle-la avec des valeurs simulées (ex. distance = 15).
            -   type: paragraphe
                texte: 'Exemple (mesurerNiveau) : fonction mesurerNiveau : distance = lire P2 ; hauteur = 100 − distance ; renvoyer hauteur.'
        questions:
            -   id: q01
                type: texte
                enonce: Écris le contenu de ta fonction (en blocs décrits ou en Python).
                aide: Bloc par bloc (réflexe n° 9).
        ressources:
            - &id001
                type: lien
                titre: MakeCode micro:bit (gratuit, dans le navigateur)
                url: https://makecode.microbit.org/
    -   id: a02
        titre: Tester seule
        transition: Teste ta fonction seule.
        questions:
            -   id: q01
                type: tableau
                enonce: Écris trois tests de ta fonction.
                colonnes:
                    - Valeur simulée
                    - Résultat attendu
                    - Résultat observé
                lignes:
                    -   - ''
                        - ''
                        - ''
                    -   - ''
                        - ''
                        - ''
                    -   - ''
                        - ''
                        - ''
                aide: Attendu ou observé ?
        ressources:
            - *id001
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une valeur de distance de 0 ou de 400 est absurde.
        questions:
            -   id: q01
                type: texte
                enonce: Comment ta fonction peut-elle s’en protéger ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment as-tu programmé et testé ta fonction ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Une fonction se teste seule avec des valeurs simulées : cas normal, limite, extrême.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
