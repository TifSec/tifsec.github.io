titre: 'Séance 7 : Bilan et entraînement au brevet n° 1 : argumenter'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Suis-je capable d’argumenter sur l’effet d’une innovation sur la société ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
objectifs:
    connaissances:
        - 'Argumenter en trois temps (R19) : j’affirme, je prouve avec le document, je conclus.'
    competences:
        - Argumenter avec R19.
        - Utiliser les réflexes de lecture de documents.
pourquoi:
    - Depuis la séance 3, tu as étudié des innovations et l’IA.
    - Aujourd’hui, un court dossier de type brevet pour t’entraîner à argumenter.
activites:
    -   id: a01
        titre: Relever les arguments
        consigne: 'Tu vas t’entraîner au brevet sur un court dossier : les caisses sans caissier (document 1, inspiré de faits réels). Première étape : relever les avantages et les inconvénients. On attend deux éléments de chaque côté, tirés du document.'
        contenu:
            -   type: citation
                texte: 'Réflexe brevet n° 19 : j’argumente en trois temps : j’affirme, je prouve avec le document, je conclus.'
            -   type: titre
                texte: Document 1 — Des caisses sans caissier (situation inspirée de faits réels)
            -   type: citation
                texte: 'Des magasins testent des caméras qui reconnaissent les articles pris par les clients : plus de file d’attente, paiement automatique. Mais les clients sont filmés en permanence, et des postes de caissiers disparaissent. Le système se trompe parfois sur l’article.'
            -   type: etapes
                elements:
                    - Lis le document 1 une première fois en entier.
                    - Relis-le en repérant ce qui est bien pour les clients ou la société.
                    - Puis ce qui pose problème.
                    - Écris chaque élément dans la bonne colonne.
            -   type: paragraphe
                texte: Pourquoi relever avant d’écrire ? Les preuves de ton argumentation viendront de ce tableau.
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, relève les avantages et les inconvénients des caisses sans caissier.
                colonnes:
                    - Avantages
                    - Inconvénients
                lignes:
                    -   - ''
                        - ''
                    -   - ''
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
            -   id: q02
                type: qcm
                enonce: D’après le document 1, le système se trompe parfois sur l’article. Quel lien avec la séance 6 ?
                choix:
                    -   id: a
                        texte: Une IA peut se tromper ; il faut un contrôle humain.
                    -   id: b
                        texte: Aucun lien.
                    -   id: c
                        texte: La caméra est cassée.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a02
        titre: Argumenter en trois temps
        transition: Tu as tes preuves. Construis ton argumentation.
        consigne: Tu vas rédiger une argumentation en trois temps (R19) sur les caisses sans caissier, avec les éléments relevés en mission 1. On attend une affirmation, deux preuves tirées du document et une conclusion.
        contenu:
            -   type: paragraphe
                texte: 'Exemple de structure : « J’affirme que… D’après le document 1, … et … Donc… »'
            -   type: etapes
                elements:
                    - 'Choisis ta position : progrès, pas un progrès, ou progrès avec des conditions.'
                    - Écris « J’affirme que… ».
                    - Écris « D’après le document 1, … » avec deux éléments de ton tableau.
                    - Écris « Donc… » pour conclure.
            -   type: paragraphe
                texte: 'Pourquoi trois temps ? Au brevet, le correcteur cherche une affirmation, des preuves tirées des documents et une conclusion : tout est noté.'
        questions:
            -   id: q01
                type: texte
                enonce: 'Argumente en trois temps : les caisses sans caissier du document 1 sont-elles un progrès pour la société ?'
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a03
        titre: Je relis (R16)
        transition: Relis-toi.
        consigne: Tu vas relire ton argumentation avec le réflexe R16 et la grille des trois temps. On attend une amélioration précise de ton texte.
        contenu:
            -   type: etapes
                elements:
                    - Relis ton argumentation.
                    - 'Vérifie les trois temps : une affirmation ? deux preuves du document ? une conclusion ?'
                    - Corrige ce qui manque.
            -   type: paragraphe
                texte: 'Pourquoi relire ? C’est souvent à la relecture qu’on voit qu’une preuve manque : ce sont des points faciles à récupérer.'
        questions:
            -   id: q01
                type: texte
                enonce: En relisant ton argumentation sur les caisses sans caissier, qu’as-tu ajouté ou corrigé ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: En France, la CNIL encadre l’usage des caméras.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi une autorité contrôle-t-elle les caméras des magasins ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Fais le point.
        questions:
            -   id: q01
                type: texte
                enonce: Quel temps de l’argumentation (affirmer, prouver, conclure) est le plus difficile pour toi ? Comment vas-tu progresser ?
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'R19 : j’affirme, je prouve avec le document, je conclus.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
