titre: 'Séance 38 : Comment prouver que notre programme marche ?'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment définir et mener un protocole de test complet pour le programme de la cuve ?
competences_bo:
    - Valider les solutions techniques par des simulations ou par des protocoles de tests
objectifs:
    connaissances:
        - Un protocole de test liste les cas à tester (normaux, limites, anormaux), le résultat attendu et le résultat observé ; il vérifie chaque exigence du cahier des charges.
    competences:
        - Élaborer un protocole de test.
        - Le mettre en œuvre dans le simulateur.
pourquoi:
    - En séances 36-37, tu as programmé et testé des parties.
    - Aujourd’hui, tu définis le protocole qui prouvera que la cuve respecte le cahier des charges.
activites:
    -   id: a01
        titre: Définir le protocole
        questions:
            -   id: q01
                type: tableau
                enonce: Écris quatre cas de test (dont une limite et un cas anormal).
                colonnes:
                    - Cas (valeur du niveau ou situation)
                    - Exigence vérifiée
                    - Résultat attendu
                lignes:
                    -   - ''
                        - ''
                        - ''
                    -   - ''
                        - ''
                        - ''
                    -   - ''
                        - ''
                        - ''
                    -   - ''
                        - ''
                        - ''
                aide: Attendu ou observé ?
    -   id: a02
        titre: Mener le protocole
        transition: Le protocole est écrit. Mène-le.
        questions:
            -   id: q01
                type: texte
                enonce: 'Mène ton protocole dans le simulateur : quels cas ont réussi, lesquels ont échoué ? Que corriges-tu ?'
                aide: Attendu ou observé ?
        ressources:
            -   type: lien
                titre: MakeCode micro:bit (gratuit, dans le navigateur)
                url: https://makecode.microbit.org/
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une limite exacte (90 %) révèle souvent des erreurs.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi tester exactement la valeur limite ?
                aide: Attendu ou observé ?
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment prouver que le programme marche ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Protocole de test : cas normaux, limites, anormaux ; attendu / observé ; exigences du cahier des charges.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
