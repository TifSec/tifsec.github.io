titre: 'Séance 38 : Comment prouver que notre programme marche ?'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment définir et mener un protocole de test complet pour le programme de la cuve ?
competences_bo:
    - Valider les solutions techniques par des simulations ou par des protocoles de tests
objectifs:
    connaissances:
        - Un protocole de test liste les cas à tester (normaux, limites, anormaux), le résultat attendu et le résultat observé ; il vérifie chaque exigence du cahier des charges.
    competences:
        - Élaborer un protocole de test.
        - Le mettre en œuvre dans le simulateur.
pourquoi:
    - En séances 36-37, tu as programmé et testé des parties.
    - Aujourd’hui, tu définis le protocole qui prouvera que la cuve respecte le cahier des charges.
activites:
    -   id: a01
        titre: Définir le protocole
        consigne: Tu vas écrire le protocole de test du programme complet de la cuve, à partir de son cahier des charges (séance 17) et de ses règles (séance 35). On attend trois cas de test, dont un cas limite et un cas anormal.
        contenu:
            -   type: etapes
                elements:
                    - Relis le cahier des charges de la cuve (séance 17) et les règles (séance 35).
                    - Pour chaque exigence, choisis un niveau d’eau à simuler.
                    - Ajoute un cas limite (exactement 90 %) et un cas anormal (mesure absurde).
                    - Écris le résultat attendu.
            -   type: paragraphe
                texte: Pourquoi un cas limite ? C’est exactement au seuil que se cachent les erreurs de « < » ou « ≤ ».
        questions:
            -   id: q01
                type: tableau
                enonce: Écris trois cas de test du programme de la cuve (dont une limite et un cas anormal).
                colonnes:
                    - Cas (niveau ou situation)
                    - Exigence vérifiée
                    - Résultat attendu
                lignes:
                    -   - ''
                        - ''
                        - ''
                    -   - ''
                        - ''
                        - ''
                    -   - ''
                        - ''
                        - ''
                aide: Bloc par bloc (réflexe n° 9).
    -   id: a02
        titre: Mener le protocole
        transition: Le protocole est écrit. Mène-le.
        consigne: Tu vas mener ton protocole de test dans le simulateur, cas par cas. On attend le résultat observé de chaque cas.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre le programme de la cuve dans le simulateur.
                    - Pour chaque cas, règle la valeur simulée.
                    - Note le résultat observé à côté de l’attendu.
            -   type: paragraphe
                texte: Pourquoi noter l’observé ? Sans trace écrite, on ne peut pas prouver au jury que le programme a été testé.
        questions:
            -   id: q01
                type: texte
                enonce: 'Mène ton protocole dans le simulateur : quels cas ont réussi, lesquels ont échoué ?'
                aide: Attendu ou observé ?
        ressources:
            -   type: lien
                titre: MakeCode micro:bit (gratuit, dans le navigateur)
                url: https://makecode.microbit.org/
    -   id: a03
        titre: Corriger et conclure
        transition: Les résultats sont notés. Corrige ce qui échoue.
        consigne: Tu vas corriger les erreurs révélées par ton protocole et conclure sur le respect du cahier des charges. On attend une correction (ou sa justification) et une conclusion.
        contenu:
            -   type: etapes
                elements:
                    - Pour chaque cas qui a échoué, trouve le bloc en cause.
                    - Corrige une seule chose, puis refais le test.
                    - 'Conclus : le programme respecte-t-il le cahier des charges ?'
            -   type: paragraphe
                texte: Pourquoi refaire le test ? Une correction n’est validée que si le test qui échouait réussit maintenant.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle correction as-tu faite après ton protocole (ou pourquoi aucune n’était nécessaire) ? Le programme respecte-t-il le cahier des charges ?
                aide: Bloc par bloc (réflexe n° 9).
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une limite exacte (90 %) révèle souvent des erreurs.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi tester exactement la valeur limite ?
                aide: Attendu ou observé ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment prouver que le programme de la cuve marche ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Protocole de test : cas normaux, limites, anormaux ; attendu / observé ; exigences du cahier des charges.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
