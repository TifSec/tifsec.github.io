titre: 'Séance 14 : Brevet blanc n° 1 : la station météo du collège'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Suis-je capable de traiter une épreuve de technologie de type brevet en 30 minutes ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - 'L’épreuve : un dossier technique, des questions variées, environ 30 minutes (format 2027 à confirmer).'
        - Lire le barème permet de répartir son temps (réflexe R21).
    competences:
        - Traiter un sujet complet en temps limité.
        - S’autocorriger avec une grille.
pourquoi:
    - Depuis la rentrée, tu as étudié les innovations, l’IA, Internet et le codage.
    - 'Aujourd’hui, brevet blanc : 30 minutes, puis autocorrection guidée.'
activites:
    -   id: a01
        titre: Partie 1 — Analyser la station (10 minutes)
        consigne: 'Brevet blanc n° 1, en 30 minutes : la station météo connectée du collège (documents 1 à 3, situation inventée). Partie 1 : on attend la chaîne et la fonction de quatre constituants. Garde environ 10 minutes.'
        contenu:
            -   type: citation
                texte: 'Réflexe brevet n° 21 : je lis le barème : je donne plus de temps aux questions qui rapportent le plus.'
            -   type: titre
                texte: Document 1 — La station météo connectée du collège (situation inventée)
            -   type: citation
                texte: Un capteur de température et un capteur d’humidité sont reliés à une carte programmable. Toutes les 15 minutes, la carte envoie les mesures par Wi-Fi au réseau du collège, puis par Internet à un site de météo participative. Un petit panneau solaire et une batterie alimentent la station. Une LED clignote à chaque envoi.
            -   type: titre
                texte: Document 2 — Algorithme
            -   type: code
                texte: "répéter toujours\n    lire température et humidité\n    si température < 0 alors\n        envoyer « risque de gel »\n    envoyer les mesures\n    faire clignoter la LED\n    attendre 15 minutes"
            -   type: titre
                texte: Document 3 — Relevés d’une matinée
            -   type: tableau
                colonnes:
                    - Heure
                    - 7 h
                    - 7 h 15
                    - 7 h 30
                    - 7 h 45
                lignes:
                    -   - Température (°C)
                        - '-2'
                        - '-1'
                        - '0'
                        - '1'
            -   type: etapes
                elements:
                    - Lis le barème de chaque question (R21) et survole tout le sujet.
                    - Lis le document 1 en entier.
                    - 'Range chaque constituant : chaîne d’information ou d’énergie, et sa fonction.'
            -   type: paragraphe
                texte: 'Pourquoi lire le barème ? Une question à 5 points mérite plus de temps qu’une question à 2 points : c’est ainsi qu’on répartit ses 30 minutes.'
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, écris la chaîne (information ou énergie) et la fonction de chaque constituant de la station météo.
                colonnes:
                    - Constituant
                    - Chaîne et fonction
                lignes:
                    -   - Capteur de température
                        - ''
                    -   - Carte programmable
                        - ''
                    -   - Panneau solaire
                        - ''
                    -   - LED
                        - ''
                aide: Source → constituant qui transforme → forme d’énergie en sortie.
    -   id: a02
        titre: Partie 2 — Algorithme et mesures (10 minutes)
        transition: Passe à la partie 2 du sujet.
        consigne: 'Partie 2 du brevet blanc : tu vas exploiter l’algorithme (document 2) et les relevés (document 3) de la station météo. On attend deux résultats chiffrés avec leur unité. Garde environ 10 minutes.'
        contenu:
            -   type: etapes
                elements:
                    - Lis l’algorithme (document 2) ligne par ligne.
                    - Pour chaque relevé du document 3, vérifie la condition « température < 0 ».
                    - Pour les envois par jour, compte combien de fois 15 minutes tiennent dans une heure.
            -   type: paragraphe
                texte: 'Pourquoi vérifier chaque relevé ? « < 0 » exclut 0 : une lecture trop rapide fait perdre le point.'
        questions:
            -   id: q01
                type: nombre
                enonce: D’après les documents 2 et 3, combien de messages « risque de gel » la station envoie-t-elle entre 7 h et 7 h 45 ?
                unite: messages
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: nombre
                enonce: D’après le document 1, combien de fois la station envoie-t-elle ses mesures en 24 heures ?
                unite: envois
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a03
        titre: Partie 3 — Argumenter et décrire (10 minutes)
        transition: Dernière partie du sujet.
        consigne: 'Partie 3 du brevet blanc : tu vas argumenter sur l’utilité de la station et décrire le trajet de ses mesures. On attend une argumentation en trois temps et un trajet avec le vocabulaire exact. Garde du temps pour relire.'
        contenu:
            -   type: etapes
                elements:
                    - 'Argumente en trois temps (R19) : j’affirme, je prouve avec le document, je conclus.'
                    - Décris le trajet des mesures avec le vocabulaire exact (R20).
                    - Garde 2 minutes pour relire (R16).
            -   type: paragraphe
                texte: Pourquoi relire à la fin ? Les unités et les mots exacts se corrigent vite et rapportent des points.
        questions:
            -   id: q01
                type: texte
                enonce: 'Argumente en trois temps (R19) : la station météo participative du document 1 est-elle utile à la société ?'
                aide: Une phrase complète qui reprend les mots de la question.
            -   id: q02
                type: texte
                enonce: 'Décris le trajet des mesures de la station, de la carte au site de météo (R20 : vocabulaire exact).'
                aide: Action → résultat attendu → résultat observé ; une seule chose à la fois.
    -   id: a04
        titre: Autocorrection guidée
        transition: L’épreuve est terminée. Compare avec le corrigé.
        consigne: Tu vas corriger toi-même ta copie du brevet blanc avec le corrigé projeté par le professeur. On attend deux erreurs analysées, chacune reliée au réflexe qui t’a manqué.
        contenu:
            -   type: etapes
                elements:
                    - Le professeur projette le corrigé.
                    - Compare chaque réponse avec le corrigé.
                    - Pour chaque point perdu, repère le réflexe qui t’a manqué.
            -   type: paragraphe
                texte: 'Pourquoi s’autocorriger tout de suite ? Tu te souviens encore de ce que tu as pensé en répondant : tu vois mieux d’où vient l’erreur.'
        questions:
            -   id: q01
                type: texte
                enonce: Pour deux questions du brevet blanc où tu as perdu des points, écris le réflexe qui t’a manqué.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a05
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La LED de la station clignote à chaque envoi.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi est-ce utile pour la personne qui entretient la station ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a06
        titre: Conclusion de ton travail
        conclusion: true
        transition: Fais le point.
        questions:
            -   id: q01
                type: texte
                enonce: Comment as-tu réparti tes 30 minutes avec le barème (R21) ? Que changeras-tu au prochain brevet blanc ?
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'R21 : lire le barème pour répartir son temps.'
    - 'Une épreuve : documents, chaînes, algorithme, calculs, argumentation.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
