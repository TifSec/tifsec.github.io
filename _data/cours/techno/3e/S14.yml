titre: 'Séance 14 : Brevet blanc n° 1 : la station météo du collège'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Suis-je capable de traiter une épreuve de technologie de type brevet en 30 minutes ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
    - Comprendre et modifier un programme associé à une fonctionnalité d’un objet ou d’un système technique
    - Valider les solutions techniques par des simulations ou par des protocoles de tests
objectifs:
    connaissances:
        - 'L’épreuve de technologie du brevet dure 30 minutes. Sujet de référence DNB (ministère) : 30 minutes ; un dossier sur un objet réel ; quatre questions types : 1) chaîne d’énergie en schéma bloc, à partir d’un texte qui mélange énergie et information ; 2) choisir des constituants qui respectent deux exigences ; 3) proposer un protocole expérimental (schéma, liste de matériel, texte) ; 4) compléter un programme en blocs. Les démarches, même non abouties, sont prises en compte ; la rédaction et le vocabulaire précis comptent.'
    competences:
        - Traiter un sujet complet en temps limité.
        - S’autocorriger avec le barème.
pourquoi:
    - Depuis la rentrée, tu as étudié les innovations, l’IA, le codage des données et Internet.
    - 'Aujourd’hui, brevet blanc au format du sujet de référence : 30 minutes, puis autocorrection guidée.'
activites:
    -   id: a01
        titre: Partie 1 — Chaîne d’énergie et choix des constituants (12 minutes)
        consigne: 'Brevet blanc n° 1, en 30 minutes, au format du sujet de référence. Partie 1 : à partir du document 1, on attend le schéma bloc de la chaîne d’énergie et un choix de constituants justifié par deux exigences.'
        contenu:
            -   type: citation
                texte: 'Réflexe brevet n° 21 : je lis le barème : je donne plus de temps aux questions qui rapportent le plus.'
            -   type: titre
                texte: Document 1 — La station météo ventilée du collège (situation inventée)
            -   type: citation
                texte: 'La station mesure la température et l’humidité avec deux capteurs reliés à une carte programmable. Toutes les 15 minutes, la carte envoie les mesures par Wi-Fi ; une LED clignote à chaque envoi. Pour que le soleil ne fausse pas la mesure, un petit ventilateur renouvelle l’air de l’abri : un panneau solaire charge une batterie ; la carte commande un relais qui alimente le moteur du ventilateur ; l’hélice, fixée sur l’axe du moteur, souffle l’air dans l’abri.'
            -   type: titre
                texte: Document 2 — Batteries disponibles
            -   type: tableau
                colonnes:
                    - Modèle
                    - Batterie A
                    - Batterie B
                    - Batterie C
                lignes:
                    -   - Autonomie sans soleil (jours)
                        - '1'
                        - '3'
                        - '5'
                    -   - Masse (kg)
                        - '0,4'
                        - '0,9'
                        - '2,1'
            -   type: paragraphe
                texte: 'Exigence 1 : la station doit fonctionner au moins 3 jours sans soleil. Exigence 2 : l’abri est fixé sur un mât : la batterie doit être la plus légère possible.'
            -   type: etapes
                elements:
                    - Lis tout le sujet et repère les points de chaque question (R21).
                    - Dans le document 1, souligne seulement les constituants qui servent au mouvement ou à l’énergie (R18).
                    - 'Range-les dans l’ordre du schéma bloc : alimenter, distribuer, convertir, transmettre (R17).'
                    - Pour le choix, élimine d’abord ce qui ne respecte pas l’exigence 1, puis départage avec l’exigence 2.
            -   type: paragraphe
                texte: 'Pourquoi trier d’abord ? Le texte mélange les deux chaînes : le capteur ou l’écran appartiennent à la chaîne d’information, pas à la chaîne d’énergie.'
        questions:
            -   id: q01
                type: tableau
                enonce: 'D’après le document 1, écris le constituant de chaque bloc de la chaîne d’énergie du ventilateur de la station (schéma bloc). Attention : certains constituants du texte appartiennent à la chaîne d’information.'
                colonnes:
                    - Bloc du schéma
                    - Constituant
                lignes:
                    -   - Alimenter (stocker l’énergie)
                        - ''
                    -   - Distribuer
                        - ''
                    -   - Convertir
                        - ''
                    -   - Transmettre
                        - ''
                aide: Source → constituant qui transforme → forme d’énergie en sortie.
            -   id: q02
                type: texte
                enonce: D’après le document 2, quelle batterie respecte les deux exigences ? Justifie en citant les valeurs.
                aide: Élimine d’abord ce qui ne respecte pas l’exigence 1, puis choisis avec l’exigence 2. Justifie avec les valeurs du document.
    -   id: a02
        titre: Partie 2 — Protocole expérimental (8 minutes)
        transition: Passe à la partie 2 du sujet.
        consigne: 'Partie 2 du brevet blanc : tu vas proposer un protocole expérimental pour vérifier la précision d’un capteur de l’objet étudié. On attend le matériel, un schéma décrit et des étapes qui permettent de conclure.'
        contenu:
            -   type: etapes
                elements:
                    - Lis la précision attendue dans l’énoncé.
                    - Liste le matériel, dont une référence connue (mètre, thermomètre étalon…).
                    - Décris le schéma de l’expérience en une phrase (qui est placé où).
                    - 'Écris les étapes : plusieurs essais, plusieurs valeurs, comparaison avec la précision attendue.'
            -   type: paragraphe
                texte: Pourquoi une référence ? Pour savoir si un capteur mesure juste, il faut comparer sa mesure à une valeur que l’on connaît déjà.
        questions:
            -   id: q01
                type: texte
                enonce: Le capteur de température doit mesurer à 0,5 °C près. Propose un protocole expérimental (matériel, schéma décrit, étapes) pour vérifier cette précision.
                aide: 'Un protocole répond à quatre questions : avec quoi je mesure ? à quoi je compare ? combien d’essais, pour quelles valeurs ? comment je décide que c’est conforme ?'
    -   id: a03
        titre: Partie 3 — Compléter le programme (8 minutes)
        transition: Dernière partie du sujet.
        consigne: 'Partie 3 du brevet blanc : tu vas compléter le programme de l’objet étudié à partir du tableau de comportement. On attend chaque trou rempli avec les noms et les valeurs exacts du document.'
        contenu:
            -   type: titre
                texte: Document 3 — Comportement souhaité du ventilateur
            -   type: tableau
                colonnes:
                    - Valeur de la variable temperature
                    - Action
                lignes:
                    -   - supérieure à 30
                        - ventilateur à fond (vitesse = 100)
                    -   - comprise entre 20 et 30
                        - ventilateur doux (vitesse = 40)
                    -   - inférieure à 20
                        - ventilateur arrêté (vitesse = 0)
            -   type: titre
                texte: Document 4 — Programme à compléter
            -   type: code
                texte: "répéter indéfiniment\n    temperature ← lire le capteur de température\n    si temperature > 30 alors\n        vitesse ← 100\n    sinon si temperature > ① alors\n        vitesse ← ②\n    sinon\n        ③ ← ④\n    commander le moteur avec vitesse"
            -   type: etapes
                elements:
                    - Lis le tableau de comportement (document 3) ligne par ligne.
                    - 'Regarde comment la première condition est écrite dans le programme : réutilise la même syntaxe.'
                    - Écris les mots exacts du document (noms de variables, valeurs).
                    - Garde 2 minutes pour relire toute ta copie (R16).
            -   type: paragraphe
                texte: 'Pourquoi les noms exacts ? Une variable mal nommée fait un autre programme : le correcteur vérifie la syntaxe.'
        questions:
            -   id: q01
                type: tableau
                enonce: Complète les trous du programme (document 4) à l’aide du tableau de comportement (document 3).
                colonnes:
                    - Trou
                    - Ce que j’écris
                lignes:
                    -   - ①
                        - ''
                    -   - ②
                        - ''
                    -   - ③
                        - ''
                    -   - ④
                        - ''
                aide: 'Bloc par bloc : quand ? quelle condition ? quelle action ?'
    -   id: a04
        titre: Autocorrection guidée
        transition: L’épreuve est terminée. Compare avec le corrigé.
        consigne: Tu vas corriger toi-même ta copie du brevet blanc n° 1 avec le corrigé projeté par le professeur. On attend deux erreurs analysées, chacune reliée au réflexe qui t’a manqué.
        contenu:
            -   type: etapes
                elements:
                    - Le professeur projette le corrigé et le barème progressif.
                    - Compare chaque réponse avec le corrigé.
                    - Pour deux points perdus, repère le réflexe qui t’a manqué.
            -   type: paragraphe
                texte: 'Pourquoi s’autocorriger tout de suite ? Tu te souviens encore de ton raisonnement : tu vois mieux d’où vient l’erreur.'
        questions:
            -   id: q01
                type: texte
                enonce: Pour deux questions du brevet blanc n° 1 où tu as perdu des points, écris le réflexe qui t’a manqué.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a05
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La LED de la station clignote à chaque envoi.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi est-ce utile pour la personne qui entretient la station ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a06
        titre: Conclusion de ton travail
        conclusion: true
        transition: Fais le point.
        questions:
            -   id: q01
                type: texte
                enonce: Comment as-tu réparti tes 30 minutes entre les quatre questions ? Quelle question type dois-tu travailler avant le brevet blanc n° 2 ?
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Les quatre questions types : schéma bloc de la chaîne d’énergie, choix de constituants (2 exigences), protocole, programme à compléter.'
    - 'R21 : lire le barème pour répartir son temps.'
sources:
