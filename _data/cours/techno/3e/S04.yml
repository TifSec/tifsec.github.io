titre: 'Séance 4 : De la découverte scientifique à notre tracker'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Comment une découverte scientifique devient-elle un objet comme le tracker solaire ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
objectifs:
    connaissances:
        - 'L’effet photovoltaïque (découvert par Edmond Becquerel en 1839) : certains matériaux, comme le silicium, produisent de l’électricité quand ils reçoivent de la lumière.'
        - 'De la découverte à l’objet : découverte → première cellule (1954) → panneaux pour les satellites → panneaux grand public → objets comme la lampe de jardin et notre tracker.'
    competences:
        - Relier une découverte scientifique à un objet.
        - Expliquer le rôle de l’effet photovoltaïque dans le tracker.
pourquoi:
    - En 5e, tu as amélioré le tracker. En séance 3, tu as vu des innovations de rupture.
    - Aujourd’hui, tu remontes l’histoire du tracker jusqu’à la découverte scientifique d’origine.
activites:
    -   id: a01
        titre: La frise
        contenu:
            -   type: tableau
                titre: Document 1
                colonnes:
                    - Date
                    - Étape
                lignes:
                    -   - '1839'
                        - Edmond Becquerel découvre l’effet photovoltaïque.
                    -   - '1954'
                        - Première cellule solaire en silicium utilisable (laboratoires Bell).
                    -   - '1958'
                        - Premier satellite alimenté par des panneaux solaires.
                    -   - Années 2000
                        - Panneaux sur les toits, lampes de jardin.
                    -   - '2020'
                        - Le tracker du collège, imprimé en 3D.
        questions:
            -   id: q01
                type: nombre
                enonce: D’après le document 1, combien d’années séparent la découverte de la première cellule utilisable ?
                unite: ans
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: texte
                enonce: Pourquoi les satellites ont-ils été parmi les premiers utilisateurs des panneaux solaires ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a02
        titre: Au poste maquette
        transition: Tu connais l’histoire. Observe maintenant l’effet sur le tracker.
        contenu:
            -   type: paragraphe
                texte: 'Démonstration : on cache le panneau du tracker, puis on l’éclaire ; le multimètre mesure la tension.'
        questions:
            -   id: q01
                type: texte
                enonce: Décris ce que montre la démonstration et relie-la à l’effet photovoltaïque.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
            -   id: q02
                type: tableau
                enonce: Complète la chaîne d’énergie du panneau du tracker.
                colonnes:
                    - Énergie en entrée
                    - Constituant
                    - Énergie en sortie
                lignes:
                    -   - ''
                        - Panneau solaire
                        - ''
                aide: Source → constituant qui transforme → forme d’énergie en sortie.
    -   id: a03
        titre: Pourquoi le tracker ?
        transition: Le panneau existe. Pourquoi l’a-t-on mis sur un tracker ?
        questions:
            -   id: q01
                type: texte
                enonce: Explique pourquoi on a eu l’idée de faire suivre le soleil au panneau (lien avec la 5e).
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le rendement d’un panneau solaire du commerce est d’environ 20 %.
        questions:
            -   id: q01
                type: texte
                enonce: Que devient le reste de l’énergie lumineuse reçue ?
                aide: Source → constituant qui transforme → forme d’énergie en sortie.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as remonté l’histoire du tracker. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment une découverte scientifique devient-elle un objet comme le tracker ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Effet photovoltaïque : la lumière produit de l’électricité dans le silicium.'
    - 'De la découverte à l’objet : des décennies de recherche et d’applications.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
