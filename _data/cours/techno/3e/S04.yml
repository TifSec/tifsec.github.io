titre: 'Séance 4 : De la découverte scientifique à notre tracker'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
problematique: Comment une découverte scientifique devient-elle un objet comme le tracker solaire ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
objectifs:
    connaissances:
        - 'L’effet photovoltaïque (découvert par Edmond Becquerel en 1839) : certains matériaux, comme le silicium, produisent de l’électricité quand ils reçoivent de la lumière.'
        - 'De la découverte à l’objet : découverte → première cellule (1954) → panneaux pour les satellites → panneaux grand public → objets comme la lampe de jardin et notre tracker.'
    competences:
        - Relier une découverte scientifique à un objet.
        - Expliquer le rôle de l’effet photovoltaïque dans le tracker.
pourquoi:
    - En 5e, tu as amélioré le tracker. En séance 3, tu as vu des innovations de rupture.
    - Aujourd’hui, tu remontes l’histoire du tracker jusqu’à la découverte scientifique d’origine.
activites:
    -   id: a01
        titre: La frise
        consigne: Tu vas remonter l’histoire du panneau solaire, de la découverte de 1839 jusqu’au tracker du collège, à partir de la frise du document 1. On attend un calcul d’écart entre deux dates et une explication.
        contenu:
            -   type: tableau
                titre: Document 1 — Du laboratoire au tracker
                colonnes:
                    - Date
                    - Étape
                lignes:
                    -   - '1839'
                        - Edmond Becquerel découvre l’effet photovoltaïque.
                    -   - '1954'
                        - Première cellule solaire en silicium utilisable (laboratoires Bell).
                    -   - '1958'
                        - Premier satellite alimenté par des panneaux solaires.
                    -   - Années 2000
                        - Panneaux sur les toits, lampes de jardin.
                    -   - '2020'
                        - Le tracker du collège, imprimé en 3D.
            -   type: etapes
                elements:
                    - Lis le document 1 de haut en bas.
                    - Repère la découverte, puis la première cellule, puis les premiers usages.
                    - Calcule l’écart entre deux dates par une soustraction.
            -   type: paragraphe
                texte: Pourquoi une frise ? Elle montre qu’il faut souvent des dizaines d’années entre une découverte et un objet de tous les jours.
        questions:
            -   id: q01
                type: nombre
                enonce: D’après le document 1, combien d’années séparent la découverte de l’effet photovoltaïque de la première cellule utilisable ?
                unite: ans
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: texte
                enonce: D’après le document 1, les satellites ont été parmi les premiers à utiliser des panneaux solaires. Pourquoi ?
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
    -   id: a02
        titre: Au poste maquette
        transition: Tu connais l’histoire. Observe maintenant l’effet sur le tracker.
        consigne: Tu vas observer l’effet photovoltaïque sur le vrai panneau du tracker, grâce à une démonstration au multimètre. On attend la description de l’expérience et la chaîne d’énergie du panneau.
        contenu:
            -   type: etapes
                elements:
                    - 'Observe la démonstration : le professeur cache le panneau du tracker, puis l’éclaire avec une lampe.'
                    - Lis la tension sur le multimètre dans chaque cas.
                    - Relie ce que tu observes à l’effet photovoltaïque.
            -   type: paragraphe
                texte: Pourquoi cacher le panneau ? En comparant avec et sans lumière, on prouve que c’est bien la lumière qui produit l’électricité.
        questions:
            -   id: q01
                type: texte
                enonce: Décris ce que montre la démonstration sur le panneau du tracker (caché, puis éclairé) et relie-la à l’effet photovoltaïque.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
            -   id: q02
                type: tableau
                enonce: Complète la chaîne d’énergie du panneau solaire du tracker.
                colonnes:
                    - Énergie en entrée
                    - Constituant
                    - Énergie en sortie
                lignes:
                    -   - ''
                        - Panneau solaire
                        - ''
                aide: Source → constituant qui transforme → forme d’énergie en sortie.
    -   id: a03
        titre: Pourquoi un tracker ?
        transition: Le panneau existe. Pourquoi l’a-t-on mis sur un tracker ?
        consigne: Tu vas expliquer l’intérêt du tracker par rapport à un panneau fixe, en t’appuyant sur ce que tu as vu en 5e et sur la démonstration. On attend une explication qui relie orientation et production.
        contenu:
            -   type: etapes
                elements:
                    - 'Rappelle-toi la 5e : le tracker oriente son panneau vers la lumière.'
                    - Pense à ce qui se passe quand le panneau n’est pas face au soleil.
                    - Explique l’intérêt de suivre le soleil.
            -   type: paragraphe
                texte: 'Pourquoi revenir sur la 5e ? L’effet photovoltaïque explique la production ; le tracker l’améliore : c’est une innovation qui s’appuie sur une découverte.'
        questions:
            -   id: q01
                type: texte
                enonce: Explique pourquoi on a eu l’idée de faire suivre le soleil au panneau du tracker.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le rendement d’un panneau solaire du commerce est d’environ 20 %.
        questions:
            -   id: q01
                type: texte
                enonce: Que devient le reste de l’énergie lumineuse reçue par le panneau ?
                aide: Source → constituant qui transforme → forme d’énergie en sortie.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as remonté l’histoire du tracker. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment une découverte scientifique devient-elle un objet comme le tracker ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Effet photovoltaïque : la lumière produit de l’électricité dans le silicium.'
    - 'De la découverte à l’objet : des décennies de recherche et d’applications.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
