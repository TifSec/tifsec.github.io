titre: Comment choisir entre plusieurs solutions techniques ?
theme: "Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser"
problematique: Comment choisir une solution technique lorsqu'aucune solution n'est parfaite ?
pourquoi: "Objectif de cette séance : Un système technique est conçu pour répondre à un besoin mais doit également respecter plusieurs exigences."
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Un système technique est conçu pour répondre à un besoin mais doit également respecter plusieurs exigences.
        - Une exigence peut concerner les performances, le coût, la sécurité, l'accessibilité, l'énergie ou l'environnement.
        - Une exigence est particulièrement utile lorsqu'elle peut être vérifiée.
        - Plusieurs solutions peuvent répondre au même besoin sans être équivalentes.
        - Choisir une solution consiste souvent à rechercher le meilleur compromis.
        - L'impact environnemental d'un objet doit être étudié sur l'ensemble de son cycle de vie.
    competences: []
activites:
    - id: a05
      titre: Production attendue
      contenu:
          - type: liste
            elements:
                - Un fichier LibreOffice Writer nommé 3e_S04_nom.odt.
                - Des exigences associées à un système de déplacement vertical.
                - Un tableau de comparaison de plusieurs solutions.
                - Une analyse simplifiée du cycle de vie d'un produit.
                - Un choix technique argumenté.
          - type: paragraphe
            texte: Le fichier devra être déposé en fin de séance, même s'il n'est pas entièrement terminé.
      questions: []
    - id: a06
      titre: 1. Préparez votre document de travail
      contenu:
          - type: paragraphe
            texte: Ouvrez LibreOffice Writer.
          - type: paragraphe
            texte: Créez un nouveau document.
          - type: paragraphe
            texte: "Enregistrez-le immédiatement sous le nom : 3e_S04_nom.odt."
      questions:
          - id: q01
            type: texte
            enonce: "Écrivez votre nom, votre prénom et le titre : Séance 4 – Comment choisir entre plusieurs solutions techniques ?"
            suite: []
    - id: a07
      titre: 2. Le besoin suffit-il pour concevoir un système ?
      contenu:
          - type: paragraphe
            texte: Une commune souhaite permettre à une personne de se déplacer entre deux niveaux d'un bâtiment.
          - type: paragraphe
            texte: "Le besoin principal est :"
          - type: paragraphe
            texte: Permettre à une personne de se déplacer verticalement entre plusieurs niveaux.
          - type: paragraphe
            texte: Imaginez maintenant que vous deviez concevoir le système.
      questions:
          - id: q01
            type: texte
            enonce: "Q1 : Quelles autres questions devriez-vous poser avant de commencer la conception ?"
            suite:
                - type: paragraphe
                  texte: Proposez au moins cinq éléments importants.
                - type: paragraphe
                  texte: "Si vous manquez d'idées, vous pouvez réfléchir à :"
                - type: liste
                  elements:
                      - la sécurité ;
                      - la vitesse ;
                      - le nombre de personnes ;
                      - l'accessibilité ;
                      - la consommation d'énergie ;
                      - le bruit ;
                      - la place disponible ;
                      - le coût ;
                      - la durabilité.
                - type: titre
                  texte: "Mise en commun : les exigences"
                - type: paragraphe
                  texte: Les conditions que le système doit respecter sont appelées des exigences.
                - type: paragraphe
                  texte: Elles précisent ce que le système doit être capable de faire ou les contraintes qu'il doit respecter.
    - id: a08
      titre: 3. Peut-on vérifier une exigence ?
      contenu:
          - type: paragraphe
            texte: "Comparez :"
          - type: liste
            elements:
                - « Le système doit être rapide. »
                - « Le système doit effectuer le trajet en moins de 15 secondes. »
      questions:
          - id: q01
            type: texte
            enonce: "Q2 : Laquelle de ces deux formulations est la plus facile à vérifier ? Pourquoi ?"
            suite:
                - type: paragraphe
                  texte: Transformez maintenant les attentes suivantes en exigences plus précises et vérifiables.
          - id: q02
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Attente imprécise
                - Votre exigence
            lignes:
                - - Le système doit être rapide.
                  - ""
                - - Le système ne doit pas consommer beaucoup.
                  - ""
                - - Le système doit être silencieux.
                  - ""
                - - Le système doit transporter plusieurs personnes.
                  - ""
                - - Le système doit être sûr.
                  - ""
    - id: a09
      titre: 4. Plusieurs solutions peuvent-elles répondre au même besoin ?
      contenu:
          - type: paragraphe
            texte: "Pour franchir plusieurs niveaux, on peut envisager :"
          - type: liste
            elements:
                - un escalier ;
                - un escalator ;
                - un ascenseur ;
                - une plateforme élévatrice.
          - type: paragraphe
            texte: Pour chaque critère, attribuez une note de 1 à 5.
          - type: paragraphe
            texte: 5 = très favorable pour le critère étudié / 1 = très défavorable.
          - type: paragraphe
            texte: "Par exemple, pour le coût : 5 signifie peu coûteux et 1 signifie très coûteux."
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Solution
                - Accessibilité
                - Coût
                - Énergie
                - Débit de personnes
                - Encombrement
                - Total
            lignes:
                - - Escalier
                  - ""
                  - ""
                  - ""
                  - ""
                  - ""
                  - ""
                - - Escalator
                  - ""
                  - ""
                  - ""
                  - ""
                  - ""
                  - ""
                - - Ascenseur
                  - ""
                  - ""
                  - ""
                  - ""
                  - ""
                  - ""
                - - Plateforme élévatrice
                  - ""
                  - ""
                  - ""
                  - ""
                  - ""
                  - ""
            suite:
                - type: paragraphe
                  texte: "Accessibilité : la solution peut-elle être utilisée facilement par une personne ayant des difficultés à se déplacer ou utilisant un fauteuil roulant ?"
                - type: paragraphe
                  texte: "Ressource : Service-Public – Accessibilité d'un établissement recevant du public"
                - type: lien
                  titre: Service-Public – Accessibilité d'un établissement recevant du public
                  url: https://entreprendre.service-public.fr/vosdroits/F32873
    - id: a10
      titre: 5. Le meilleur total donne-t-il toujours la meilleure solution ?
      contenu:
          - type: paragraphe
            texte: "Répondez :"
      questions:
          - id: q01
            type: texte
            enonce: Quelle solution obtient votre meilleur score ?
            suite: []
          - id: q02
            type: texte
            enonce: Est-ce forcément la meilleure solution dans toutes les situations ?
            suite: []
          - id: q03
            type: texte
            enonce: Quelle solution choisiriez-vous pour une maison individuelle ?
            suite: []
          - id: q04
            type: texte
            enonce: Quelle solution choisiriez-vous pour une gare très fréquentée ?
            suite: []
          - id: q05
            type: texte
            enonce: Quelle solution choisiriez-vous pour permettre l'accès à un bâtiment public à une personne en fauteuil roulant ?
            suite:
                - type: paragraphe
                  texte: Justifiez chaque choix en utilisant au moins deux critères.
                - type: titre
                  texte: "Mise en commun : le compromis"
                - type: paragraphe
                  texte: En technologie, la meilleure solution n'est généralement pas celle qui possède la meilleure performance dans tous les domaines.
                - type: paragraphe
                  texte: "On cherche souvent un compromis : la solution la plus adaptée aux exigences jugées prioritaires."
    - id: a11
      titre: 6. L'utilisation est-elle la seule étape qui pollue ?
      contenu:
          - type: paragraphe
            texte: Prenons l'exemple d'un smartphone.
          - type: paragraphe
            texte: "Avant de consulter la ressource suivante, répondez :"
      questions:
          - id: q01
            type: texte
            enonce: "Q3 : À quelle étape de la vie du smartphone pensez-vous que ses impacts environnementaux sont importants ?"
            suite:
                - type: paragraphe
                  texte: "Consultez ensuite :"
                - type: paragraphe
                  texte: ADEME – Comprendre le cycle de vie d'un produit
                - type: lien
                  titre: ADEME – Comprendre le cycle de vie d'un produit
                  url: https://agirpourlatransition.ademe.fr/acteurs-education/enseigner/catalogue/video-comprendre-cycle-vie-produit
                - type: paragraphe
                  texte: Cette ressource présente le cycle de vie d'un produit depuis l'extraction des matières premières jusqu'à sa fin de vie.
                - type: paragraphe
                  texte: "On distingue notamment :"
                - type: etapes
                  elements:
                      - matières premières ;
                      - fabrication ;
                      - transport et distribution ;
                      - utilisation ;
                      - entretien et réparation ;
                      - fin de vie, réemploi ou recyclage.
                - type: paragraphe
                  texte: "Complétez le tableau pour le smartphone :"
          - id: q02
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Étape
                - Impact possible
                - Comment le réduire ?
            lignes:
                - - Matières premières
                  - ""
                  - ""
                - - Fabrication
                  - ""
                  - ""
                - - Transport
                  - ""
                  - ""
                - - Utilisation
                  - ""
                  - ""
                - - Fin de vie
                  - ""
                  - ""
            suite:
                - type: paragraphe
                  texte: "Pour aller plus loin : ADEME – Prolonger la durée de vie d'un téléphone portable"
                - type: lien
                  titre: ADEME – Prolonger la durée de vie d'un téléphone portable
                  url: https://agirpourlatransition.ademe.fr/particuliers/mieux-consommer/numerique/prolonger-vie-telephone-portable
                - type: titre
                  texte: "Mise en commun : le cycle de vie"
                - type: paragraphe
                  texte: Le cycle de vie permet d'étudier un produit depuis l'extraction des matières premières jusqu'à sa fin de vie.
                - type: paragraphe
                  texte: Comparer des solutions techniques suppose donc également de regarder ce qui se passe avant et après leur utilisation.
    - id: a12
      titre: "7. Mission : choisissez une solution"
      contenu:
          - type: paragraphe
            texte: Une commune souhaite permettre aux personnes à mobilité réduite d'accéder à un bâtiment public situé environ 3 mètres au-dessus du niveau de la rue.
          - type: paragraphe
            texte: "Deux solutions sont envisagées :"
          - type: liste
            elements:
                - "Solution A : un ascenseur, rapide et permettant de transporter plusieurs personnes, mais nécessitant des travaux et un entretien importants ;"
                - "Solution B : une plateforme élévatrice, plus lente et de capacité réduite, mais plus simple à intégrer dans certains bâtiments."
          - type: paragraphe
            texte: "Ressource : Service-Public – Accessibilité des établissements recevant du public"
          - type: lien
            titre: Service-Public – Accessibilité des établissements recevant du public
            url: https://entreprendre.service-public.fr/vosdroits/F32873
          - type: paragraphe
            texte: "Dans votre document :"
      questions:
          - id: q01
            type: texte
            enonce: identifiez quatre critères permettant de comparer les solutions ;
            suite: []
          - id: q02
            type: texte
            enonce: indiquez les critères qui vous semblent prioritaires dans cette situation ;
            suite:
                - type: paragraphe
                  texte: choisissez une solution ;
          - id: q03
            type: texte
            enonce: justifiez votre décision en 4 à 6 lignes.
            suite: []
    - id: a13
      titre: 8. Conclusion du travail
      contenu:
          - type: paragraphe
            texte: "Complétez sans recopier les définitions :"
          - type: liste
            elements:
                - Une exigence permet de ........................................................................................ .
                - Une exigence vérifiable permet de .......................................................................... .
                - Pour comparer plusieurs solutions, on utilise ........................................................... .
                - Le meilleur choix dépend des ................................................................................... .
                - Le cycle de vie permet d'étudier ............................................................................... .
          - type: paragraphe
            texte: "Répondez maintenant à la problématique en 4 à 6 lignes :"
          - type: paragraphe
            texte: Comment choisir une solution technique lorsqu'aucune solution n'est parfaite ?
      questions: []
    - id: a14
      titre: Rendu attendu
      contenu:
          - type: paragraphe
            texte: À la fin de la séance, déposez 3e_S04_nom.odt.
          - type: paragraphe
            texte: Le fichier doit être rendu même si toutes les activités ne sont pas terminées.
      questions: []
    - id: a15
      titre: À retenir
      contenu:
          - type: paragraphe
            texte: Choisir une solution technique consiste à rechercher le meilleur compromis entre plusieurs exigences.
          - type: paragraphe
            texte: Une solution peut être performante mais coûteuse, accessible mais encombrante ou économique mais moins adaptée à une forte fréquentation.
          - type: paragraphe
            texte: Le choix dépend donc du contexte et des critères prioritaires.
          - type: paragraphe
            texte: Il faut également prendre en compte les impacts du produit pendant l'ensemble de son cycle de vie.
      questions: []
