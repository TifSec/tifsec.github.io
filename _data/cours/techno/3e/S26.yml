titre: 'Séance 26 : Comment une distance devient-elle une hauteur d’eau ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Comment transformer la mesure du capteur à ultrasons en hauteur d’eau, puis en volume ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - Le capteur à ultrasons (placé dans le couvercle) mesure la distance jusqu’à l’eau. Hauteur d’eau = hauteur de la cuve − distance.
        - Volume (L) = surface du fond (dm²) × hauteur d’eau (dm) pour une cuve à section constante.
    competences:
        - Transformer une grandeur mesurée en donnée exploitable.
        - Vérifier une mesure sur le monte-charge.
pourquoi:
    - En 4e, tu as exploité les mesures du capteur à ultrasons du monte-charge. En séance 25, tu as choisi ce capteur pour la cuve.
    - Aujourd’hui, tu passes de la distance à la hauteur, puis au volume.
activites:
    -   id: a01
        titre: 'Au poste maquette : le capteur du monte-charge'
        contenu:
            -   type: paragraphe
                texte: 'Démonstration : on place la cabine à différentes hauteurs ; on lit la distance. Capteur en haut, cage de 30 cm.'
        questions:
            -   id: q01
                type: nombre
                enonce: La distance mesurée est 12 cm et la cage mesure 30 cm. À quelle hauteur est le dessus de la cabine ?
                unite: cm
                aide: N’oublie pas l’unité (réflexe n° 5).
    -   id: a02
        titre: La cuve
        transition: Le principe est le même pour la cuve.
        contenu:
            -   type: paragraphe
                texte: 'Cuve : 100 cm de haut, fond de 100 cm × 100 cm (soit 100 dm²).'
            -   type: paragraphe
                texte: 'Exemple expliqué : distance 40 cm → hauteur d’eau 100 − 40 = 60 cm = 6 dm → volume 100 × 6 = 600 L.'
        questions:
            -   id: q01
                type: tableau
                enonce: Complète le tableau.
                colonnes:
                    - Distance mesurée (cm)
                    - Hauteur d’eau (cm)
                    - Volume (L)
                lignes:
                    -   - '20'
                        - ''
                        - ''
                    -   - '75'
                        - ''
                        - ''
                aide: Ligne × colonne.
            -   id: q02
                type: texte
                enonce: Écris les deux formules que le programme utilisera.
                aide: « = » + fonction + plage.
    -   id: a03
        titre: Fiabilité
        transition: Une mesure peut être perturbée.
        questions:
            -   id: q01
                type: texte
                enonce: La surface de l’eau bouge (pluie, vent). Que peut faire le programme pour avoir une mesure fiable ?
                aide: Bloc par bloc (réflexe n° 9).
    -   id: a04
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une cuve cylindrique a un fond rond de rayon 50 cm.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle formule pour le volume ?
                aide: « = » + fonction + plage.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment passer de la distance mesurée au volume ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - Hauteur d’eau = hauteur de la cuve − distance.
    - Volume = surface du fond × hauteur ; moyenne de plusieurs mesures.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
