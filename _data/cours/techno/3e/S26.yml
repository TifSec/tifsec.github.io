titre: 'Séance 26 : Comment une distance devient-elle une hauteur d’eau ?'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
problematique: Comment transformer la mesure du capteur à ultrasons en hauteur d’eau, puis en volume ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
objectifs:
    connaissances:
        - Le capteur à ultrasons (placé dans le couvercle) mesure la distance jusqu’à l’eau. Hauteur d’eau = hauteur de la cuve − distance.
        - Volume (L) = surface du fond (dm²) × hauteur d’eau (dm) pour une cuve à section constante.
    competences:
        - Transformer une grandeur mesurée en donnée exploitable.
        - Vérifier une mesure sur le monte-charge.
pourquoi:
    - En 4e, tu as exploité les mesures du capteur à ultrasons du monte-charge. En séance 25, tu as choisi ce capteur pour la cuve.
    - Aujourd’hui, tu passes de la distance à la hauteur, puis au volume.
activites:
    -   id: a01
        titre: 'Au poste maquette : le capteur du monte-charge'
        consigne: Tu vas comprendre, sur le capteur à ultrasons du monte-charge, comment une distance mesurée devient une hauteur. On attend un calcul de hauteur avec son unité.
        contenu:
            -   type: etapes
                elements:
                    - 'Observe la démonstration : la cabine est placée à différentes hauteurs.'
                    - Lis la distance affichée par le capteur (en haut de la cage de 30 cm).
                    - 'Calcule la hauteur de la cabine : hauteur de la cage − distance.'
            -   type: paragraphe
                texte: 'Pourquoi le monte-charge ? Son capteur à ultrasons fonctionne exactement comme celui de la cuve : seule la chose mesurée change (cabine ou eau).'
        questions:
            -   id: q01
                type: nombre
                enonce: Sur le monte-charge, le capteur mesure 12 cm et la cage mesure 30 cm. À quelle hauteur se trouve le dessus de la cabine ?
                unite: cm
                aide: N’oublie pas l’unité (réflexe n° 5).
    -   id: a02
        titre: La cuve
        transition: Le principe est le même pour la cuve.
        consigne: Tu vas transformer la distance mesurée par le capteur de la cuve en hauteur d’eau, puis en volume, à partir des dimensions ci-dessous. On attend un tableau complété et les deux formules.
        contenu:
            -   type: paragraphe
                texte: 'Cuve : 100 cm de haut, fond de 100 cm × 100 cm (soit 100 dm²).'
            -   type: paragraphe
                texte: 'Exemple expliqué : distance 40 cm → hauteur d’eau 100 − 40 = 60 cm = 6 dm → volume 100 × 6 = 600 L.'
            -   type: etapes
                elements:
                    - Lis les dimensions de la cuve et l’exemple expliqué.
                    - 'Calcule la hauteur d’eau : 100 − distance.'
                    - Convertis en dm (÷ 10), puis multiplie par la surface du fond (100 dm²).
            -   type: paragraphe
                texte: 'Pourquoi des dm ? 1 dm³ = 1 litre : avec des dm, le volume se lit directement en litres.'
        questions:
            -   id: q01
                type: tableau
                enonce: Pour la cuve du collège, complète la hauteur d’eau et le volume pour chaque distance mesurée.
                colonnes:
                    - Distance mesurée (cm)
                    - Hauteur d’eau (cm)
                    - Volume (L)
                lignes:
                    -   - '20'
                        - ''
                        - ''
                    -   - '75'
                        - ''
                        - ''
                aide: Attendu ou observé ?
            -   id: q02
                type: texte
                enonce: Écris les deux formules que le programme de la cuve utilisera pour passer de la distance au volume.
                aide: « = » + fonction + plage.
    -   id: a03
        titre: Fiabilité de la mesure
        transition: Une mesure peut être perturbée.
        consigne: Tu vas proposer comment rendre fiable la mesure du niveau d’eau de la cuve. On attend deux solutions que le programme pourra appliquer.
        contenu:
            -   type: etapes
                elements:
                    - Imagine la surface de l’eau qui bouge sous la pluie.
                    - Pense à ce que tu as fait en 4e pour ignorer une mesure absurde.
                    - Propose deux solutions pour le programme.
            -   type: paragraphe
                texte: Pourquoi s’en soucier ? Une seule mauvaise mesure pourrait déclencher une fausse alerte « cuve vide ».
        questions:
            -   id: q01
                type: texte
                enonce: La surface de l’eau de la cuve bouge (pluie, vent). Que peut faire le programme pour obtenir une mesure fiable ?
                aide: Bloc par bloc (réflexe n° 9).
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une cuve cylindrique a un fond rond de rayon 50 cm.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle formule pour son volume ?
                aide: « = » + fonction + plage.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment transformer la mesure du capteur à ultrasons en hauteur d’eau, puis en volume ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - Hauteur d’eau = hauteur de la cuve − distance.
    - Volume = surface du fond × hauteur ; moyenne de plusieurs mesures.
sources:
