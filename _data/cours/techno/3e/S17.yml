titre: 'Séance 17 : Writer n° 1 : le cahier des charges de la cuve'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Comment rédiger un cahier des charges clair dans un dossier de projet ?
competences_bo:
    - Décrire les interactions entre un objet ou un système technique, son environnement et les utilisateurs
    - Imaginer, concevoir et réaliser une ou des solutions en réponse à un besoin, à des exigences (de développement durable, par exemple) ou à la nécessité d’améliorations dans une démarche de créativité
objectifs:
    connaissances:
        - 'Un cahier des charges liste les fonctions (ce que l’objet doit faire), les contraintes (ce qu’il doit respecter : eau non potable, sécurité, entretien) avec des critères et des niveaux.'
        - Le dossier de projet a un sommaire automatique (styles de titres) qui sera complété toute l’année.
    competences:
        - Rédiger un cahier des charges (fonctions, contraintes, critères, niveaux).
        - Créer un dossier de projet structuré dans Writer.
pourquoi:
    - En 4e, tu as fait un cahier des charges simple pour le tracker. En séance 16, tu as posé le besoin de la cuve.
    - Aujourd’hui, tu commences le dossier de projet de la cuve.
activites:
    -   id: a01
        titre: Créer le dossier
        consigne: Tu vas créer dans Writer le dossier de projet de la cuve, avec toutes ses parties et une table des matières automatique. On attend un fichier enregistré et des réponses sur son organisation.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Writer et enregistre sous 3e_dossier_cuve_groupe.odt.
                    - 'Écris une page de titre, puis les parties en style Titre 1 : Besoin, Cahier des charges, Solutions, Prototype, Tests, Bilan.'
                    - 'Place le curseur après la page de titre : Insertion > Table des matières et index > Table des matières.'
            -   type: paragraphe
                texte: 'Pourquoi tout préparer dès maintenant ? Le dossier se remplira séance après séance : chaque partie a déjà sa place.'
        questions:
            -   id: q01
                type: qcm
                enonce: Pourquoi crée-t-on toutes les parties du dossier de la cuve dès aujourd’hui ?
                choix:
                    -   id: a
                        texte: Pour organiser le travail de l’année et remplir le dossier au fur et à mesure.
                    -   id: b
                        texte: Pour faire plus de pages.
                    -   id: c
                        texte: Ce n’est pas utile.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Que faut-il faire pour qu’une nouvelle partie apparaisse dans la table des matières de ton dossier ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a02
        titre: Le cahier des charges
        transition: Le dossier est créé. Rédige le cahier des charges.
        consigne: Tu vas rédiger le cahier des charges de la cuve dans ton dossier Writer, avec des fonctions, des contraintes, des critères et des niveaux. On attend trois lignes complètes recopiées.
        contenu:
            -   type: paragraphe
                texte: 'Exemple de ligne : fonction « mesurer le niveau d’eau » ; critère « précision » ; niveau « à 5 cm près ».'
            -   type: paragraphe
                texte: 'Contraintes possibles : l’eau n’est pas potable (l’indiquer) ; sécurité (couvercle fermé, enfants) ; entretien facile ; coût.'
            -   type: etapes
                elements:
                    - Lis l’exemple de ligne et la liste des contraintes.
                    - 'Dans la partie « Cahier des charges », insère un tableau de 3 colonnes : Fonction ou contrainte, Critère, Niveau.'
                    - Remplis au moins deux fonctions et une contrainte, avec un niveau chiffré.
            -   type: paragraphe
                texte: Pourquoi un niveau chiffré ? « Mesurer le niveau » ne se vérifie pas ; « à 5 cm près » se vérifie par un test.
        questions:
            -   id: q01
                type: tableau
                enonce: Recopie deux fonctions et une contrainte du cahier des charges de la cuve que tu as écrit dans Writer.
                colonnes:
                    - Fonction ou contrainte
                    - Critère
                    - Niveau
                lignes:
                    -   - ''
                        - ''
                        - ''
                    -   - ''
                        - ''
                        - ''
                    -   - ''
                        - ''
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne (réflexe n° 6).'
    -   id: a03
        titre: Vérifier le cahier des charges
        transition: Le cahier des charges est écrit. Est-il vérifiable ?
        consigne: 'Tu vas vérifier que ton cahier des charges est vérifiable : chaque niveau doit pouvoir être contrôlé par un test. On attend un test précis pour une de tes lignes.'
        contenu:
            -   type: etapes
                elements:
                    - Relis chaque ligne de ton tableau.
                    - Pour chacune, imagine le test qui permettra de la vérifier.
                    - Corrige les niveaux trop vagues.
            -   type: paragraphe
                texte: Pourquoi penser au test maintenant ? Si on ne sait pas comment vérifier une ligne, elle est mal écrite.
        questions:
            -   id: q01
                type: texte
                enonce: Choisis une ligne de ton cahier des charges de la cuve et décris le test qui permettra de vérifier son niveau.
                aide: Action → résultat attendu → résultat observé ; une seule chose à la fois.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Writer peut insérer des légendes automatiques sous les images.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi des légendes numérotées automatiquement (Figure 1, Figure 2…) sont-elles utiles dans un long dossier ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Le cahier des charges est écrit. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment rédiger un cahier des charges clair dans un dossier de projet ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Cahier des charges : fonctions et contraintes, critères, niveaux chiffrés.'
    - 'Dossier de projet : styles de titres, sommaire automatique.'
sources:
