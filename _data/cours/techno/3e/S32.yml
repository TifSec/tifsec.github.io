titre: 'Séance 32 : Brevet blanc n° 2 : la cuve d’un gymnase'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Suis-je capable de traiter une épreuve de technologie de type brevet en 30 minutes ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
    - Comprendre et modifier un programme associé à une fonctionnalité d’un objet ou d’un système technique
objectifs:
    connaissances:
        - 'Épreuve : chaînes, grandeurs, algorithme, argumentation.'
    competences:
        - Traiter un sujet en temps limité (R21).
        - S’autocorriger.
pourquoi:
    - Depuis le brevet blanc n° 1, tu as travaillé le projet cuve et la programmation.
    - Aujourd’hui, brevet blanc n° 2.
activites:
    -   id: a01
        titre: L’épreuve (30 minutes)
        contenu:
            -   type: titre
                texte: Document 1 — La cuve d’un gymnase (situation inventée)
            -   type: citation
                texte: Le toit du gymnase (500 m²) alimente une cuve de 10 m³ qui sert aux toilettes. Un capteur à ultrasons mesure le niveau ; si la cuve est presque vide (moins de 10 %), une vanne bascule sur l’eau du réseau. Un écran affiche le volume. Une pompe alimentée par le secteur envoie l’eau vers les toilettes.
            -   type: code
                texte: "répéter toujours\n    volume = mesurer le volume\n    afficher volume\n    si volume < ……… alors\n        basculer la vanne sur l’eau du réseau\n    sinon\n        basculer la vanne sur la cuve"
        questions:
            -   id: q01
                type: tableau
                enonce: Chaîne d’information (document 1).
                colonnes:
                    - Fonction
                    - Constituant
                lignes:
                    -   - Acquérir
                        - ''
                    -   - Traiter
                        - ''
                    -   - Communiquer
                        - ''
                aide: Ligne × colonne.
            -   id: q02
                type: nombre
                enonce: Quelle valeur faut-il écrire dans le programme pour « moins de 10 % » d’une cuve de 10 m³ (en litres) ?
                unite: L
                aide: N’oublie pas l’unité (réflexe n° 5).
            -   id: q03
                type: nombre
                enonce: 1 mm de pluie sur 1 m² donne 1 L. Combien de litres récupère le toit pour une pluie de 8 mm ?
                unite: L
                aide: N’oublie pas l’unité (réflexe n° 5).
            -   id: q04
                type: texte
                enonce: 'Argumente (R19) : cette installation est-elle intéressante pour la commune ?'
                aide: Repère le verbe de la question.
            -   id: q05
                type: texte
                enonce: Pourquoi la vanne bascule-t-elle sur l’eau du réseau quand la cuve est presque vide ?
                aide: Pense à « car » (réflexe n° 4).
    -   id: a02
        titre: Autocorrection
        transition: Corrige-toi.
        questions:
            -   id: q01
                type: texte
                enonce: 'Analyse deux erreurs : quel réflexe t’a manqué ?'
                aide: Repère le verbe de la question.
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une chasse d’eau utilise 6 L.
        questions:
            -   id: q01
                type: texte
                enonce: Combien de chasses avec une cuve pleine ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Fais le point.
        questions:
            -   id: q01
                type: texte
                enonce: Ta gestion du temps s’est-elle améliorée depuis le brevet blanc n° 1 ? Explique.
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Épreuve : lire le barème, traiter toutes les questions, relire.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
