titre: 'Séance 32 : Brevet blanc n° 2 : la cuve d’un gymnase'
themes:
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Suis-je capable de traiter une épreuve de technologie de type brevet en 30 minutes ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
    - Comprendre et modifier un programme associé à une fonctionnalité d’un objet ou d’un système technique
objectifs:
    connaissances:
        - 'Épreuve : chaînes, grandeurs, algorithme, argumentation.'
    competences:
        - Traiter un sujet en temps limité (R21).
        - S’autocorriger.
pourquoi:
    - Depuis le brevet blanc n° 1, tu as travaillé le projet cuve et la programmation.
    - Aujourd’hui, brevet blanc n° 2.
activites:
    -   id: a01
        titre: Partie 1 — Analyser (10 minutes)
        consigne: 'Brevet blanc n° 2, en 30 minutes : la cuve d’eau de pluie d’un gymnase (documents 1 et 2, situation inventée). Partie 1 : on attend la chaîne d’information et la valeur à compléter dans le programme. Garde environ 10 minutes.'
        contenu:
            -   type: citation
                texte: 'Réflexe brevet n° 21 : je lis le barème : je donne plus de temps aux questions qui rapportent le plus.'
            -   type: titre
                texte: Document 1 — La cuve d’un gymnase (situation inventée)
            -   type: citation
                texte: Le toit du gymnase (500 m²) alimente une cuve de 10 m³ qui sert aux toilettes. Un capteur à ultrasons mesure le niveau ; si la cuve est presque vide (moins de 10 %), une vanne bascule sur l’eau du réseau. Un écran affiche le volume. Une pompe alimentée par le secteur envoie l’eau vers les toilettes.
            -   type: titre
                texte: Document 2 — Programme incomplet
            -   type: code
                texte: "répéter toujours\n    volume = mesurer le volume\n    afficher volume\n    si volume < ……… alors\n        basculer la vanne sur l’eau du réseau\n    sinon\n        basculer la vanne sur la cuve"
            -   type: etapes
                elements:
                    - Lis le barème (R21) et survole tout le sujet.
                    - Lis le document 1 en entier.
                    - Range les constituants de la chaîne d’information.
                    - Calcule la valeur à écrire dans le programme (document 2).
            -   type: paragraphe
                texte: Pourquoi survoler d’abord ? Tu repères les questions faciles et tu répartis ton temps avant de commencer.
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, écris le constituant de chaque fonction de la chaîne d’information de la cuve du gymnase.
                colonnes:
                    - Fonction
                    - Constituant
                lignes:
                    -   - Acquérir
                        - ''
                    -   - Traiter
                        - ''
                    -   - Communiquer
                        - ''
                aide: Ligne × colonne.
            -   id: q02
                type: nombre
                enonce: Quelle valeur faut-il écrire dans le programme (document 2) pour « moins de 10 % » d’une cuve de 10 m³ ?
                unite: L
                aide: N’oublie pas l’unité (réflexe n° 5).
    -   id: a02
        titre: Partie 2 — Calculer et expliquer (10 minutes)
        transition: Passe à la partie 2 du sujet.
        consigne: 'Partie 2 du brevet blanc : tu vas calculer l’eau récupérée par le toit du gymnase et expliquer le rôle de la vanne. On attend un résultat avec son unité et une explication avec « car ». Garde environ 10 minutes.'
        contenu:
            -   type: etapes
                elements:
                    - 'Lis la donnée sur la pluie : 1 mm sur 1 m² = 1 L.'
                    - Calcule le volume récupéré par le toit.
                    - Explique le rôle de la vanne avec « car ».
            -   type: paragraphe
                texte: Pourquoi « car » ? Une explication sans justification ne rapporte qu’une partie des points.
        questions:
            -   id: q01
                type: nombre
                enonce: 1 mm de pluie sur 1 m² donne 1 L. D’après le document 1, combien de litres le toit du gymnase récupère-t-il pour une pluie de 8 mm ?
                unite: L
                aide: N’oublie pas l’unité (réflexe n° 5).
            -   id: q02
                type: texte
                enonce: D’après le document 1, pourquoi la vanne bascule-t-elle sur l’eau du réseau quand la cuve est presque vide ? Justifie avec « car ».
                aide: « D’après le document… » (réflexe n° 2).
    -   id: a03
        titre: Partie 3 — Argumenter (10 minutes)
        transition: Dernière partie du sujet.
        consigne: 'Partie 3 du brevet blanc : tu vas argumenter sur l’intérêt de la cuve du gymnase pour la commune, avec les chiffres de tes réponses. On attend une argumentation en trois temps. Garde du temps pour relire.'
        contenu:
            -   type: etapes
                elements:
                    - Choisis ta position sur l’intérêt de l’installation pour la commune.
                    - Argumente en trois temps (R19) avec des chiffres de tes réponses.
                    - Garde 2 minutes pour relire (R16).
            -   type: paragraphe
                texte: Pourquoi réutiliser tes calculs ? Ils deviennent les preuves chiffrées de ton argumentation.
        questions:
            -   id: q01
                type: texte
                enonce: 'Argumente en trois temps (R19) : la cuve du gymnase est-elle intéressante pour la commune ?'
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Autocorrection
        transition: L’épreuve est terminée. Corrige-toi.
        consigne: Tu vas corriger toi-même ta copie du brevet blanc n° 2 avec le corrigé projeté. On attend deux erreurs analysées, chacune reliée à un réflexe.
        contenu:
            -   type: etapes
                elements:
                    - Le professeur projette le corrigé.
                    - Compare chaque réponse.
                    - Pour deux erreurs, note le réflexe qui t’a manqué.
            -   type: paragraphe
                texte: 'Pourquoi tout de suite ? Tu te souviens de ton raisonnement : tu vois mieux d’où vient l’erreur.'
        questions:
            -   id: q01
                type: texte
                enonce: Pour deux questions du brevet blanc n° 2 où tu as perdu des points, écris le réflexe qui t’a manqué.
                aide: Combien d’éléments sont demandés ?
    -   id: a05
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une chasse d’eau utilise 6 L.
        questions:
            -   id: q01
                type: texte
                enonce: Combien de chasses d’eau permet une cuve pleine de 10 m³ ?
                aide: Repère le verbe de la question.
    -   id: a06
        titre: Conclusion de ton travail
        conclusion: true
        transition: Fais le point.
        questions:
            -   id: q01
                type: texte
                enonce: Ta gestion du temps s’est-elle améliorée depuis le brevet blanc n° 1 ? Explique avec un exemple.
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Épreuve : lire le barème, traiter toutes les questions, relire.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
