titre: 'Séance 32 : Brevet blanc n° 2 : la cuve d’un gymnase'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Suis-je capable de traiter une épreuve de technologie de type brevet en 30 minutes ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
    - Comprendre et modifier un programme associé à une fonctionnalité d’un objet ou d’un système technique
    - Valider les solutions techniques par des simulations ou par des protocoles de tests
objectifs:
    connaissances:
        - 'L’épreuve de technologie du brevet dure 30 minutes. Sujet de référence DNB (ministère) : 30 minutes ; un dossier sur un objet réel ; quatre questions types : 1) chaîne d’énergie en schéma bloc, à partir d’un texte qui mélange énergie et information ; 2) choisir des constituants qui respectent deux exigences ; 3) proposer un protocole expérimental (schéma, liste de matériel, texte) ; 4) compléter un programme en blocs. Les démarches, même non abouties, sont prises en compte ; la rédaction et le vocabulaire précis comptent.'
    competences:
        - Traiter un sujet complet en temps limité.
        - S’autocorriger avec le barème.
pourquoi:
    - Depuis le brevet blanc n° 1, tu as travaillé le projet cuve, les chaînes et la programmation.
    - Aujourd’hui, brevet blanc n° 2 au format du sujet de référence.
activites:
    -   id: a01
        titre: Partie 1 — Chaîne d’énergie et choix des constituants (12 minutes)
        consigne: 'Brevet blanc n° 2, en 30 minutes, au format du sujet de référence. Partie 1 : à partir du document 1, on attend le schéma bloc de la chaîne d’énergie et un choix de constituants justifié par deux exigences.'
        contenu:
            -   type: citation
                texte: 'Réflexe brevet n° 18 : je surligne seulement les données utiles à la question.'
            -   type: titre
                texte: Document 1 — La cuve d’un gymnase (situation inventée)
            -   type: citation
                texte: Le toit du gymnase (500 m²) alimente une cuve de 10 m³ qui sert aux toilettes. Un capteur à ultrasons mesure le niveau et un écran affiche le volume. Pour envoyer l’eau vers les toilettes, le bloc d’alimentation branché sur le secteur fournit l’énergie ; la carte commande un relais qui alimente le moteur de la pompe ; le moteur fait tourner la turbine de la pompe, qui pousse l’eau dans les tuyaux.
            -   type: titre
                texte: Document 2 — Pompes disponibles
            -   type: tableau
                colonnes:
                    - Modèle
                    - Pompe A
                    - Pompe B
                    - Pompe C
                lignes:
                    -   - Débit à 10 m de hauteur (L/min)
                        - '12'
                        - '25'
                        - '40'
                    -   - Puissance consommée (W)
                        - '250'
                        - '400'
                        - '900'
            -   type: paragraphe
                texte: 'Exigence 1 : la pompe doit fournir au moins 20 L/min aux toilettes, situées 10 m plus haut. Exigence 2 : elle doit consommer le moins d’énergie possible.'
            -   type: etapes
                elements:
                    - Lis tout le sujet et repère les points de chaque question (R21).
                    - Dans le document 1, souligne seulement les constituants qui servent au mouvement ou à l’énergie (R18).
                    - 'Range-les dans l’ordre du schéma bloc : alimenter, distribuer, convertir, transmettre (R17).'
                    - Pour le choix, élimine d’abord ce qui ne respecte pas l’exigence 1, puis départage avec l’exigence 2.
            -   type: paragraphe
                texte: 'Pourquoi trier d’abord ? Le texte mélange les deux chaînes : le capteur ou l’écran appartiennent à la chaîne d’information, pas à la chaîne d’énergie.'
        questions:
            -   id: q01
                type: tableau
                enonce: 'D’après le document 1, écris le constituant de chaque bloc de la chaîne d’énergie de la pompe du gymnase (schéma bloc). Attention : certains constituants du texte appartiennent à la chaîne d’information.'
                colonnes:
                    - Bloc du schéma
                    - Constituant
                lignes:
                    -   - Alimenter
                        - ''
                    -   - Distribuer
                        - ''
                    -   - Convertir
                        - ''
                    -   - Transmettre
                        - ''
                aide: 'Dans le document 1, surligne seulement ce qui sert à envoyer l’eau vers les toilettes (R18), puis range dans l’ordre du schéma bloc : d’où vient l’énergie, qui la laisse passer, qui la transforme, ce qui pousse l’eau.'
            -   id: q02
                type: texte
                enonce: D’après le document 2, quelle pompe respecte les deux exigences ? Justifie en citant les valeurs.
                aide: Dans le document 2, élimine d’abord les pompes qui fournissent moins de 20 L/min, puis départage les autres avec la puissance consommée. Cite les valeurs et leurs unités.
    -   id: a02
        titre: Partie 2 — Protocole expérimental (8 minutes)
        transition: Passe à la partie 2 du sujet.
        consigne: 'Partie 2 du brevet blanc : tu vas proposer un protocole expérimental pour vérifier la précision d’un capteur de l’objet étudié. On attend le matériel, un schéma décrit et des étapes qui permettent de conclure.'
        contenu:
            -   type: etapes
                elements:
                    - Lis la précision attendue dans l’énoncé.
                    - Liste le matériel, dont une référence connue (mètre, thermomètre étalon…).
                    - Décris le schéma de l’expérience en une phrase (qui est placé où).
                    - 'Écris les étapes : plusieurs essais, plusieurs valeurs, comparaison avec la précision attendue.'
            -   type: paragraphe
                texte: Pourquoi une référence ? Pour savoir si un capteur mesure juste, il faut comparer sa mesure à une valeur que l’on connaît déjà.
        questions:
            -   id: q01
                type: texte
                enonce: Le capteur à ultrasons doit mesurer la hauteur d’eau à 1 cm près. Propose un protocole expérimental (matériel, schéma décrit, étapes) pour vérifier cette précision.
                aide: Pense à une hauteur d’eau que tu connais déjà grâce à une règle. Combien de hauteurs différentes testes-tu, et comment décides-tu si l’écart est acceptable (1 cm) ?
    -   id: a03
        titre: Partie 3 — Compléter le programme (8 minutes)
        transition: Dernière partie du sujet.
        consigne: 'Partie 3 du brevet blanc : tu vas compléter le programme de l’objet étudié à partir du tableau de comportement. On attend chaque trou rempli avec les noms et les valeurs exacts du document.'
        contenu:
            -   type: titre
                texte: Document 3 — Comportement souhaité
            -   type: tableau
                colonnes:
                    - Valeur de la variable volume (L)
                    - Action
                lignes:
                    -   - inférieure à 1 000
                        - vanne sur l’eau du réseau ; alerte = vrai
                    -   - comprise entre 1 000 et 9 500
                        - vanne sur la cuve ; alerte = faux
                    -   - supérieure à 9 500
                        - vanne sur la cuve ; ouvrir le trop-plein
            -   type: titre
                texte: Document 4 — Programme à compléter
            -   type: code
                texte: "répéter indéfiniment\n    volume ← mesurer le volume\n    si volume < 1000 alors\n        vanne ← réseau\n        alerte ← vrai\n    sinon si volume ① 9500 alors\n        vanne ← ②\n        alerte ← ③\n    sinon\n        vanne ← cuve\n        ④"
            -   type: etapes
                elements:
                    - Lis le tableau de comportement (document 3) ligne par ligne.
                    - 'Regarde comment la première condition est écrite dans le programme : réutilise la même syntaxe.'
                    - Écris les mots exacts du document (noms de variables, valeurs).
                    - Garde 2 minutes pour relire toute ta copie (R16).
            -   type: paragraphe
                texte: 'Pourquoi les noms exacts ? Une variable mal nommée fait un autre programme : le correcteur vérifie la syntaxe.'
        questions:
            -   id: q01
                type: tableau
                enonce: Complète les trous du programme (document 4) à l’aide du tableau de comportement (document 3).
                colonnes:
                    - Trou
                    - Ce que j’écris
                lignes:
                    -   - ①
                        - ''
                    -   - ②
                        - ''
                    -   - ③
                        - ''
                    -   - ④
                        - ''
                aide: 'Lis le document 3 ligne par ligne. La première condition du document 4 te montre la syntaxe : réutilise les mêmes noms de variables (vanne, alerte) et les mêmes valeurs.'
    -   id: a04
        titre: Autocorrection guidée
        transition: L’épreuve est terminée. Compare avec le corrigé.
        consigne: Tu vas corriger toi-même ta copie du brevet blanc n° 2 avec le corrigé projeté par le professeur. On attend deux erreurs analysées, chacune reliée au réflexe qui t’a manqué.
        contenu:
            -   type: etapes
                elements:
                    - Le professeur projette le corrigé et le barème progressif.
                    - Compare chaque réponse avec le corrigé.
                    - Pour deux points perdus, repère le réflexe qui t’a manqué.
            -   type: paragraphe
                texte: 'Pourquoi s’autocorriger tout de suite ? Tu te souviens encore de ton raisonnement : tu vois mieux d’où vient l’erreur.'
        questions:
            -   id: q01
                type: texte
                enonce: Pour deux questions du brevet blanc n° 2 où tu as perdu des points, écris le réflexe qui t’a manqué.
                aide: 'Reprends ta copie de la cuve du gymnase avec le corrigé : pour deux points perdus, était-ce l’ordre du schéma bloc, une exigence oubliée sur la pompe (20 L/min), un protocole sans valeurs testées, ou un nom de variable mal recopié ? Nomme le réflexe.'
    -   id: a05
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une chasse d’eau utilise 6 L.
        questions:
            -   id: q01
                type: texte
                enonce: Combien de chasses d’eau permet une cuve pleine de 10 m³ ?
                aide: Convertis 10 m³ en litres, puis divise par le volume d’une chasse d’eau.
    -   id: a06
        titre: Conclusion de ton travail
        conclusion: true
        transition: Fais le point.
        questions:
            -   id: q01
                type: texte
                enonce: Ta gestion du temps s’est-elle améliorée depuis le brevet blanc n° 1 ? Quelle question type réussis-tu le mieux maintenant ?
                aide: Compare ta répartition du temps avec celle du brevet blanc n° 1, puis nomme la question type où tu as le plus progressé.
retenir:
    - 'Les quatre questions types : schéma bloc, choix de constituants (2 exigences), protocole, programme à compléter.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
