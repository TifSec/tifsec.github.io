titre: "Comment réutiliser mes acquis dans un petit défi ?"
theme: "Consolider et montrer ses progrès"
problematique: "Comment réutiliser mes acquis dans un petit défi ?"
pourquoi: "Reprendre les difficultés observées et rendre les progrès visibles."
application: "Réutiliser les acquis de l’année pour analyser un besoin, proposer une solution et vérifier ses limites."
lien_precedent: "Reprends une méthode des séances précédentes : elle t’aidera pour comment réutiliser mes acquis dans un petit défi ?."
prerequis:
    - "Lire une consigne et repérer les informations données."
    - "Réutiliser une méthode déjà rencontrée, puis vérifier ton résultat."
notions:
    - titre: "Un exemple pour démarrer"
      texte: "Un capteur peut mesurer le niveau d’eau. Un programme transforme la mesure en affichage ou en alerte ; un filtre rudimentaire ne rend pas automatiquement l’eau potable. Aujourd’hui, on l’applique à cuve intelligente et bilan de projet."
objectifs:
    connaissances:
        - "Reprendre les difficultés observées et rendre les progrès visibles."
    competences:
        - "Réutiliser les acquis de l’année pour analyser un besoin, proposer une solution et vérifier ses limites."
        - "Justifier une réponse avec une information observée ou un résultat de test."
introduction:
    - type: paragraphe
      texte: "Ce que tu vas apprendre : Reprendre les difficultés observées et rendre les progrès visibles."
    - type: paragraphe
      texte: "Ce que tu vas apprendre à faire : Réutiliser les acquis de l’année pour analyser un besoin, proposer une solution et vérifier ses limites."
    - type: paragraphe
      texte: "Dans la vie réelle : Un capteur peut mesurer le niveau d’eau. Un programme transforme la mesure en affichage ou en alerte ; un filtre rudimentaire ne rend pas automatiquement l’eau potable."
    - type: paragraphe
      texte: "Nous allons observer un exemple, essayer avec de l’aide, puis réutiliser la méthode. Tu peux choisir une méthode connue, mais explique et vérifie ton choix."
activites:
    - id: a01
      titre: "Observer l’exemple"
      pourquoi: "L’exemple montre une première méthode avant que tu essaies."
      demarche:
          - "Lis la consigne et repère ce qui est demandé."
          - "Choisis une méthode déjà apprise et vérifie-la sur le cas proposé."
          - "Garde une trace courte de ton résultat."
      contenu:
          - type: paragraphe
            texte: "Lis la situation : Comment réutiliser mes acquis dans un petit défi ?. Repère le besoin, les informations utiles et le résultat attendu."
      questions:
          - id: q01
            type: texte
            obligatoire: true
            enonce: "Qu’est-ce qu’on cherche à comprendre ou à réaliser ?"
            aide: "Relis l’exemple et cite une information précise."
    - id: a02
      titre: "Essayer avec un guide"
      pourquoi: "Tu réutilises les étapes de l’exemple sur une situation proche."
      demarche:
          - "Lis la consigne et repère ce qui est demandé."
          - "Choisis une méthode déjà apprise et vérifie-la sur le cas proposé."
          - "Garde une trace courte de ton résultat."
      contenu:
          - type: paragraphe
            texte: "Réutiliser les acquis de l’année pour analyser un besoin, proposer une solution et vérifier ses limites."
      questions:
          - id: q01
            type: texte
            obligatoire: true
            enonce: "Quelle étape as-tu faite en premier ? Quelle information t’a aidé ?"
            aide: "Relis l’exemple et cite une information précise."
    - id: a03
      titre: "Réinvestir"
      pourquoi: "Tu changes de situation pour vérifier que tu sais réutiliser la méthode."
      demarche:
          - "Lis la consigne et repère ce qui est demandé."
          - "Choisis une méthode déjà apprise et vérifie-la sur le cas proposé."
          - "Garde une trace courte de ton résultat."
      contenu:
          - type: paragraphe
            texte: "Applique la méthode à un autre cas de cuve intelligente et bilan de projet. Compare le résultat attendu et le résultat obtenu ; si cela ne fonctionne pas, modifie une seule chose puis recommence."
      questions:
          - id: q01
            type: texte
            obligatoire: true
            enonce: "Qu’as-tu changé et qu’est-ce que cela a amélioré ?"
            aide: "Relis l’exemple et cite une information précise."
    - id: a04
      titre: "Garder une trace"
      pourquoi: "Une trace courte te permettra de retrouver la méthode plus tard."
      demarche:
          - "Lis la consigne et repère ce qui est demandé."
          - "Choisis une méthode déjà apprise et vérifie-la sur le cas proposé."
          - "Garde une trace courte de ton résultat."
      contenu:
          - type: paragraphe
            texte: "Écris une phrase qui résume ce que tu sais maintenant faire dans « Comment réutiliser mes acquis dans un petit défi ? ». Ajoute une preuve ou un exemple."
      questions:
          - id: q01
            type: texte
            obligatoire: true
            enonce: "Quelle méthode veux-tu retenir pour la prochaine séance ?"
            aide: "Relis l’exemple et cite une information précise."
ressources:
    - titre: "Aide pour cuve intelligente et bilan de projet"
      url: "https://eduscol.education.gouv.fr/5745/ressources-d-accompagnement-du-programme-de-technologie-au-cycle-4"
      pourquoi: "Utilise cette ressource pour rechercher une information utile, puis reformule avec tes mots."
reperes_officiels:
    programme: "Technologie au cycle 4 — programme officiel applicable en 3e à partir de la rentrée 2026."
    lien: "https://www.education.gouv.fr/bo/2024/Hebdo9/MENE2402802A"
    contribution: "Cette séance contribue à : Reprendre les difficultés observées et rendre les progrès visibles."
bilan:
    - "Je peux expliquer ce que j’ai appris avec mes mots."
    - "Je peux montrer une réponse, une production ou un test qui prouve mon travail."
