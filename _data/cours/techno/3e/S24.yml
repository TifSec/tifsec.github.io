titre: 'Séance 24 : Secteur, panneau solaire ou éolienne ?'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Quelle source d’énergie choisir pour la cuve ?
competences_bo:
    - Caractériser et choisir un objet ou un système technique selon différents critères
    - Imaginer, concevoir et réaliser une ou des solutions en réponse à un besoin, à des exigences (de développement durable, par exemple) ou à la nécessité d’améliorations dans une démarche de créativité
objectifs:
    connaissances:
        - 'Choisir une source : besoin en énergie, emplacement (câble possible ?), production selon la météo, coût, impact.'
        - 'On s’appuie sur nos maquettes : le panneau du tracker et l’éolienne.'
    competences:
        - Choisir une source d’énergie argumentée.
        - Exploiter des mesures sur les maquettes.
pourquoi:
    - En 4e, tu as comparé éolienne et panneau pour un capteur. En séance 23, tu as fait la chaîne d’énergie de la cuve.
    - Aujourd’hui, tu choisis la source de la cuve.
activites:
    -   id: a01
        titre: Le besoin et les sources
        consigne: Tu vas comparer trois sources d’énergie pour la cuve (secteur, panneau solaire, éolienne) avec son besoin quotidien (document 1). On attend le besoin total et la source qui le couvre le mieux.
        contenu:
            -   type: tableau
                titre: Document 1 — Trois sources possibles (valeurs indicatives)
                colonnes:
                    - Source
                    - Production moyenne par jour
                    - Contraintes
                lignes:
                    -   - Secteur (230 V)
                        - Illimitée
                        - Câble jusqu’au fond de la cour (travaux), sécurité
                    -   - Panneau 10 W + batterie
                        - ≈ 30 Wh (soleil)
                        - Peu l’hiver ; entretien faible
                    -   - Petite éolienne
                        - ≈ 10 Wh (vent faible ici)
                        - Bruit, pièces en mouvement
            -   type: paragraphe
                texte: 'Besoin de la cuve : carte + capteurs ≈ 2 Wh par jour ; pompe ≈ 1 Wh par jour.'
            -   type: etapes
                elements:
                    - 'Lis le besoin de la cuve : additionne carte, capteurs et pompe.'
                    - 'Lis le document 1 : production et contraintes de chaque source.'
                    - Compare chaque production au besoin.
            -   type: paragraphe
                texte: Pourquoi partir du besoin ? Une source se choisit pour couvrir une consommation précise, avec de la marge pour les mauvais jours.
        questions:
            -   id: q01
                type: nombre
                enonce: D’après le texte ci-dessous, quel est le besoin total en énergie de la cuve par jour ?
                unite: Wh
                aide: N’oublie pas l’unité (réflexe n° 5).
            -   id: q02
                type: qcm
                enonce: D’après le document 1, quelle source couvre le besoin de la cuve avec la plus grande marge, sans travaux ?
                choix:
                    -   id: a
                        texte: Le panneau solaire avec batterie.
                    -   id: b
                        texte: Le secteur.
                    -   id: c
                        texte: L’éolienne.
                aide: Relis l’exemple expliqué.
    -   id: a02
        titre: Au poste maquette
        transition: Observe les sources réelles.
        consigne: Tu vas observer la production réelle du panneau du tracker et de l’éolienne dans de mauvaises conditions, lors d’une démonstration. On attend ce que tu observes et sa conséquence pour la cuve.
        contenu:
            -   type: etapes
                elements:
                    - 'Observe la démonstration : tension du panneau du tracker par temps couvert (ou lampe éloignée).'
                    - Puis tension de l’éolienne avec un vent faible. Seul le professeur branche l’alimentation 230 V.
                    - Note ce qui arrive à la production.
            -   type: paragraphe
                texte: Pourquoi tester par mauvais temps ? La cuve doit fonctionner tous les jours, pas seulement quand il fait beau.
        questions:
            -   id: q01
                type: texte
                enonce: Que montrent les démonstrations sur le panneau du tracker et l’éolienne par mauvais temps ? Quelle conséquence pour la cuve ?
                aide: Repère le verbe de la question.
    -   id: a03
        titre: Argumenter
        transition: Argumente maintenant ton choix.
        consigne: Tu vas argumenter le choix de la source d’énergie de la cuve, avec les chiffres du document 1 et ton observation. On attend une argumentation en trois temps qui cite une limite.
        contenu:
            -   type: etapes
                elements:
                    - Reprends le besoin (mission 1) et l’observation (mission 2).
                    - Écris ton argumentation en trois temps (R19) avec au moins deux chiffres.
                    - Termine par la limite de ta solution et comment la compenser.
            -   type: paragraphe
                texte: 'Pourquoi la limite ? Un choix sans limite n’est pas crédible : le jury de soutenance la demandera.'
        questions:
            -   id: q01
                type: texte
                enonce: Argumente en trois temps (R19) ton choix de source d’énergie pour la cuve, avec au moins deux chiffres du document 1.
                aide: Quelle énergie entre, laquelle sort ?
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: En hiver, le panneau ne produit que 8 Wh par jour.
        questions:
            -   id: q01
                type: texte
                enonce: Le besoin de la cuve reste-t-il couvert ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quelle source d’énergie choisir pour la cuve ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Choisir une source : besoin, production, contraintes, stockage.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
