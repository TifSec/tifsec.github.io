titre: 'Séance 46 : Brevet blanc n° 3 : la borne de recharge'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Suis-je prêt pour l’épreuve de technologie du brevet ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
    - Comprendre et modifier un programme associé à une fonctionnalité d’un objet ou d’un système technique
    - Valider les solutions techniques par des simulations ou par des protocoles de tests
objectifs:
    connaissances:
        - 'L’épreuve de technologie du brevet dure 30 minutes. Sujet de référence DNB (ministère) : 30 minutes ; un dossier sur un objet réel ; quatre questions types : 1) chaîne d’énergie en schéma bloc, à partir d’un texte qui mélange énergie et information ; 2) choisir des constituants qui respectent deux exigences ; 3) proposer un protocole expérimental (schéma, liste de matériel, texte) ; 4) compléter un programme en blocs. Les démarches, même non abouties, sont prises en compte ; la rédaction et le vocabulaire précis comptent.'
    competences:
        - Traiter un sujet complet en temps limité.
        - S’autocorriger avec le barème.
pourquoi:
    - Dernier brevet blanc avant le DNB, au format du sujet de référence.
    - 30 minutes, puis autocorrection.
activites:
    -   id: a01
        titre: Partie 1 — Chaîne d’énergie et choix des constituants (12 minutes)
        consigne: 'Brevet blanc n° 3, en 30 minutes, au format du sujet de référence. Partie 1 : à partir du document 1, on attend le schéma bloc de la chaîne d’énergie et un choix de constituants justifié par deux exigences.'
        contenu:
            -   type: citation
                texte: 'Réflexe brevet n° 17 : je construis le schéma bloc de la chaîne d’énergie dans l’ordre : alimenter, distribuer, convertir, transmettre.'
            -   type: titre
                texte: Document 1 — La borne de recharge de vélos de la commune (situation inventée)
            -   type: citation
                texte: 'La borne recharge les vélos électriques avec l’énergie d’un panneau solaire stockée dans une batterie. Un capteur détecte le vélo et un écran affiche la charge ; les données partent vers la mairie par le réseau. Chaque casier se ferme avec une trappe motorisée : la batterie fournit l’énergie ; la carte commande un relais qui alimente un petit moteur ; un pignon fixé sur le moteur entraîne une crémaillère qui fait monter ou descendre la trappe.'
            -   type: titre
                texte: Document 2 — Batteries disponibles
            -   type: tableau
                colonnes:
                    - Modèle
                    - Batterie A
                    - Batterie B
                    - Batterie C
                lignes:
                    -   - Énergie stockée (Wh)
                        - 1 000
                        - 2 000
                        - 3 000
                    -   - Masse (kg)
                        - '12'
                        - '20'
                        - '34'
            -   type: paragraphe
                texte: 'Exigence 1 : la borne doit pouvoir stocker au moins 1 500 Wh (trois recharges de vélo). Exigence 2 : la batterie est placée en hauteur : elle doit être la plus légère possible.'
            -   type: etapes
                elements:
                    - Lis tout le sujet et repère les points de chaque question (R21).
                    - Dans le document 1, souligne seulement les constituants qui servent au mouvement ou à l’énergie (R18).
                    - 'Range-les dans l’ordre du schéma bloc : alimenter, distribuer, convertir, transmettre (R17).'
                    - Pour le choix, élimine d’abord ce qui ne respecte pas l’exigence 1, puis départage avec l’exigence 2.
            -   type: paragraphe
                texte: 'Pourquoi trier d’abord ? Le texte mélange les deux chaînes : le capteur ou l’écran appartiennent à la chaîne d’information, pas à la chaîne d’énergie.'
        questions:
            -   id: q01
                type: tableau
                enonce: 'D’après le document 1, écris le constituant de chaque bloc de la chaîne d’énergie de la trappe motorisée (schéma bloc). Attention : certains constituants du texte appartiennent à la chaîne d’information.'
                colonnes:
                    - Bloc du schéma
                    - Constituant
                lignes:
                    -   - Alimenter
                        - ''
                    -   - Distribuer
                        - ''
                    -   - Convertir
                        - ''
                    -   - Transmettre
                        - ''
                aide: 'Dans le document 1, garde seulement ce qui fait bouger la trappe (R18), puis range dans l’ordre du schéma bloc (R17) : stocker, distribuer, convertir, transmettre le mouvement.'
            -   id: q02
                type: texte
                enonce: D’après le document 2, quelle batterie respecte les deux exigences ? Justifie en citant les valeurs.
                aide: Dans le document 2, élimine d’abord les batteries qui stockent moins de 1 500 Wh, puis départage avec la masse. Cite les valeurs avec leurs unités.
    -   id: a02
        titre: Partie 2 — Protocole expérimental (8 minutes)
        transition: Passe à la partie 2 du sujet.
        consigne: 'Partie 2 du brevet blanc : tu vas proposer un protocole expérimental pour vérifier la précision d’un capteur de l’objet étudié. On attend le matériel, un schéma décrit et des étapes qui permettent de conclure.'
        contenu:
            -   type: etapes
                elements:
                    - Lis la précision attendue dans l’énoncé.
                    - Liste le matériel, dont une référence connue (mètre, thermomètre étalon…).
                    - Décris le schéma de l’expérience en une phrase (qui est placé où).
                    - 'Écris les étapes : plusieurs essais, plusieurs valeurs, comparaison avec la précision attendue.'
            -   type: paragraphe
                texte: Pourquoi une référence ? Pour savoir si un capteur mesure juste, il faut comparer sa mesure à une valeur que l’on connaît déjà.
        questions:
            -   id: q01
                type: texte
                enonce: Le capteur doit détecter un vélo jusqu’à 50 cm de la borne. Propose un protocole expérimental (matériel, schéma décrit, étapes) pour vérifier cette exigence.
                aide: Liste le matériel (dont un mètre), décris la position du vélo face au capteur, et choisis plusieurs distances autour de 50 cm, avec plusieurs essais à chacune.
    -   id: a03
        titre: Partie 3 — Compléter le programme (8 minutes)
        transition: Dernière partie du sujet.
        consigne: 'Partie 3 du brevet blanc : tu vas compléter le programme de l’objet étudié à partir du tableau de comportement. On attend chaque trou rempli avec les noms et les valeurs exacts du document.'
        contenu:
            -   type: titre
                texte: Document 3 — Comportement souhaité
            -   type: tableau
                colonnes:
                    - Situation
                    - Action
                lignes:
                    -   - un vélo est détecté et batterie > 20
                        - recharger ; afficher « Charge en cours »
                    -   - un vélo est détecté et batterie ≤ 20
                        - ne pas recharger ; afficher « Batterie faible »
                    -   - aucun vélo détecté
                        - fermer la trappe
                    -   - dans tous les cas
                        - le programme recommence toutes les 2 secondes
            -   type: titre
                texte: Document 4 — Programme à compléter
            -   type: code
                texte: "répéter indéfiniment\n    si velo_detecte alors\n        si batterie > ① alors\n            recharger\n            afficher « Charge en cours »\n        sinon\n            ②\n    sinon\n        ③\n    attendre ④ secondes"
            -   type: etapes
                elements:
                    - Lis le tableau de comportement (document 3) ligne par ligne.
                    - 'Regarde comment la première condition est écrite dans le programme : réutilise la même syntaxe.'
                    - Écris les mots exacts du document (noms de variables, valeurs).
                    - Garde 2 minutes pour relire toute ta copie (R16).
            -   type: paragraphe
                texte: 'Pourquoi les noms exacts ? Une variable mal nommée fait un autre programme : le correcteur vérifie la syntaxe.'
        questions:
            -   id: q01
                type: tableau
                enonce: Complète les trous du programme (document 4) à l’aide du tableau de comportement (document 3).
                colonnes:
                    - Trou
                    - Ce que j’écris
                lignes:
                    -   - ①
                        - ''
                    -   - ②
                        - ''
                    -   - ③
                        - ''
                    -   - ④
                        - ''
                aide: Lis le document 3 ligne par ligne et réutilise exactement les mots du document dans les trous (valeur du seuil, texte affiché, action, durée).
    -   id: a04
        titre: Autocorrection guidée
        transition: L’épreuve est terminée. Compare avec le corrigé.
        consigne: Tu vas corriger toi-même ta copie du brevet blanc n° 3 avec le corrigé projeté par le professeur. On attend deux erreurs analysées, chacune reliée au réflexe qui t’a manqué.
        contenu:
            -   type: etapes
                elements:
                    - Le professeur projette le corrigé et le barème progressif.
                    - Compare chaque réponse avec le corrigé.
                    - Pour deux points perdus, repère le réflexe qui t’a manqué.
            -   type: paragraphe
                texte: 'Pourquoi s’autocorriger tout de suite ? Tu te souviens encore de ton raisonnement : tu vois mieux d’où vient l’erreur.'
        questions:
            -   id: q01
                type: texte
                enonce: Pour deux questions du brevet blanc n° 3 où tu as perdu des points, écris le réflexe qui t’a manqué.
                aide: 'Reprends ta copie de la borne de recharge avec le corrigé : pour deux points perdus, était-ce une fonction mal placée dans la chaîne, la masse oubliée pour la batterie, un protocole sans essais répétés autour de 50 cm, ou un mot du document 3 mal recopié ? Nomme le réflexe.'
    -   id: a05
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un vélo se recharge avec 500 Wh.
        questions:
            -   id: q01
                type: texte
                enonce: Combien de vélos la batterie B peut-elle recharger quand elle est pleine ?
                aide: Divise l’énergie stockée par la batterie B (document 2) par l’énergie d’une recharge.
    -   id: a06
        titre: Conclusion de ton travail
        conclusion: true
        transition: Fais le point.
        questions:
            -   id: q01
                type: texte
                enonce: Es-tu prêt pour la technologie au DNB ? Quelle question type vas-tu revoir en priorité ?
                aide: 'Compare tes trois brevets blancs : quelle question type est maintenant solide, laquelle reste fragile ?'
retenir:
    - 'Les quatre questions types : schéma bloc, choix de constituants (2 exigences), protocole, programme à compléter.'
    - Lire le barème, traiter toutes les questions, relire.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
