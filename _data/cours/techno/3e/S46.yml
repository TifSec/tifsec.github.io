titre: 'Séance 46 : Brevet blanc n° 3 : la borne de recharge'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Suis-je prêt pour l’épreuve de technologie du brevet ?
competences_bo:
    - Décrire et caractériser l’organisation interne d’un objet ou d’un système technique et ses échanges avec son environnement (énergies, données)
    - Comprendre et modifier un programme associé à une fonctionnalité d’un objet ou d’un système technique
objectifs:
    connaissances:
        - Toutes les compétences du cycle.
    competences:
        - Traiter un sujet complet en 30 minutes.
        - S’autocorriger.
pourquoi:
    - Dernier brevet blanc avant le DNB.
    - 30 minutes, puis autocorrection.
activites:
    -   id: a01
        titre: Partie 1 — Énergie (10 minutes)
        consigne: 'Brevet blanc n° 3, en 30 minutes : une borne de recharge de vélos électriques (documents 1 et 2, situation inventée). Partie 1 : on attend la chaîne d’énergie et un calcul d’énergie. Garde environ 10 minutes.'
        contenu:
            -   type: citation
                texte: 'Réflexe brevet n° 21 : je lis le barème : je donne plus de temps aux questions qui rapportent le plus.'
            -   type: titre
                texte: Document 1 — Une borne de recharge de vélos électriques (situation inventée)
            -   type: citation
                texte: Un panneau solaire de 300 W charge une batterie. Quand un vélo est branché (capteur de présence de prise) et que la batterie est chargée à plus de 20 %, la carte active le relais de recharge ; un écran affiche le temps restant. La borne envoie chaque soir le nombre de recharges au service de la mairie par Internet.
            -   type: titre
                texte: Document 2 — Programme
            -   type: code
                texte: "répéter toujours\n    si prise détectée ET batterie > 20 alors\n        activer le relais\n        afficher temps restant\n    sinon\n        désactiver le relais"
            -   type: etapes
                elements:
                    - Lis le barème (R21) et survole tout le sujet.
                    - Lis le document 1 en entier.
                    - Construis la chaîne d’énergie (R17), puis calcule l’énergie produite (puissance × durée).
            -   type: paragraphe
                texte: Pourquoi Wh ? Une puissance (W) pendant une durée (h) donne une énergie en wattheures (Wh).
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, écris le constituant de chaque fonction de la chaîne d’énergie de la borne.
                colonnes:
                    - Fonction
                    - Constituant
                lignes:
                    -   - Alimenter (convertir)
                        - ''
                    -   - Stocker
                        - ''
                    -   - Distribuer
                        - ''
                aide: Quelle énergie entre, laquelle sort ?
            -   id: q02
                type: nombre
                enonce: Le panneau de la borne produit en moyenne 300 W pendant 5 h. Quelle énergie produit-il en Wh ?
                unite: Wh
                aide: N’oublie pas l’unité (réflexe n° 5).
    -   id: a02
        titre: Partie 2 — Programme (10 minutes)
        transition: Passe à la partie 2 du sujet.
        consigne: 'Partie 2 du brevet blanc : tu vas exploiter le programme de la borne (document 2). On attend la réaction de la borne dans une situation donnée et la justification de la condition sur la batterie. Garde environ 10 minutes.'
        contenu:
            -   type: etapes
                elements:
                    - Lis le programme (document 2).
                    - Vérifie les deux conditions pour la situation donnée.
                    - Justifie la condition « batterie > 20 » avec « car » (R4).
            -   type: paragraphe
                texte: Pourquoi les deux conditions ? Avec ET, une seule condition fausse suffit pour que la borne ne recharge pas.
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 2, un vélo est branché et la batterie de la borne est à 15 %. Que fait la borne ?
                choix:
                    -   id: a
                        texte: Elle ne recharge pas (relais désactivé).
                    -   id: b
                        texte: Elle recharge.
                    -   id: c
                        texte: Elle s’éteint.
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: texte
                enonce: D’après les documents, pourquoi la borne vérifie-t-elle « batterie > 20 » avant de recharger ? Justifie avec « car » (R4).
                aide: Pense à « car » (réflexe n° 4).
    -   id: a03
        titre: Partie 3 — Société et réseau (10 minutes)
        transition: Dernière partie du sujet.
        consigne: 'Partie 3 du brevet blanc : tu vas argumenter sur l’utilité de la borne et décrire le trajet de ses données. On attend une argumentation en trois temps et un trajet avec le vocabulaire exact. Garde du temps pour relire.'
        contenu:
            -   type: etapes
                elements:
                    - Argumente en trois temps (R19) sur l’utilité de la borne.
                    - Décris le trajet des données jusqu’à la mairie (R20).
                    - Garde 2 minutes pour relire (R16).
            -   type: paragraphe
                texte: 'Pourquoi garder la relecture ? C’est le dernier brevet blanc : prends l’habitude que tu auras le jour du DNB.'
        questions:
            -   id: q01
                type: texte
                enonce: 'Argumente en trois temps (R19) : la borne de recharge du document 1 est-elle utile à la commune ?'
                aide: Repère le verbe de la question.
            -   id: q02
                type: texte
                enonce: D’après le document 1, décris le trajet des données de la borne jusqu’au service de la mairie (R20).
                aide: « D’après le document… » (réflexe n° 2).
    -   id: a04
        titre: Autocorrection
        transition: L’épreuve est terminée. Corrige-toi.
        consigne: Tu vas corriger toi-même ta copie du dernier brevet blanc avec le corrigé projeté. On attend un réflexe solide et un réflexe fragile.
        contenu:
            -   type: etapes
                elements:
                    - Le professeur projette le corrigé.
                    - Compare chaque réponse.
                    - Repère le réflexe le mieux utilisé et celui qui reste fragile.
            -   type: paragraphe
                texte: Pourquoi les deux ? Tu sais sur quoi t’appuyer le jour du brevet, et ce qu’il reste à réviser.
        questions:
            -   id: q01
                type: texte
                enonce: D’après ton autocorrection du brevet blanc n° 3, quel réflexe as-tu le mieux utilisé, et lequel reste fragile ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un vélo se recharge avec 500 Wh.
        questions:
            -   id: q01
                type: texte
                enonce: Combien de vélos la borne peut-elle recharger par jour avec 1 500 Wh ?
                aide: Repère le verbe de la question.
    -   id: a06
        titre: Conclusion de ton travail
        conclusion: true
        transition: Fais le point.
        questions:
            -   id: q01
                type: texte
                enonce: Es-tu prêt pour la technologie au DNB ? Que vas-tu revoir en priorité ?
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - 'Une épreuve : documents, chaînes, calculs, algorithme, argumentation, réseau.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
