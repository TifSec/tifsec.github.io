    - id: a07
      titre: 2. Un même problème, des solutions différentes
      contenu:
          - type: paragraphe
            texte: Observez les besoins suivants. Pour chacun, trouvez une solution utilisée autrefois et une solution utilisée aujourd'hui.
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Besoin
                - Ancienne solution
                - Solution actuelle
            lignes:
                - - Communiquer à distance
                  - ""
                  - ""
                - - S'éclairer
                  - ""
                  - ""
                - - Se déplacer
                  - ""
                  - ""
                - - Conserver des aliments
                  - ""
                  - ""
                - - Transporter une personne entre plusieurs étages
                  - ""
                  - ""
          - id: q02
            type: texte
            enonce: "Q1 : Dans chaque ligne, le problème à résoudre a-t-il complètement changé entre l'ancienne et la nouvelle solution ?"
          - id: q03
            type: texte
            enonce: "Q2 : Qu'est-ce qui a surtout changé : le besoin ou la manière d'y répondre ? Justifiez avec un exemple."
            suite:
                - type: titre
                  texte: "Mise en commun : besoin, famille et lignée"
                - type: paragraphe
                  texte: "Un besoin correspond à quelque chose qu'une personne cherche à satisfaire : se déplacer, communiquer, s'éclairer, transporter une charge..."
                - type: paragraphe
                  texte: Une famille d'objets ou de systèmes techniques regroupe plusieurs solutions répondant à un même besoin.
                - type: paragraphe
                  texte: Une lignée permet de suivre l'évolution d'objets appartenant à une même famille et conservant un principe technique proche.
    - id: a08
      titre: 3. Suivez l'évolution d'une famille d'objets
      contenu:
          - type: paragraphe
            texte: "Choisissez un seul domaine :"
          - type: liste
            elements:
                - le téléphone ;
                - le vélo ;
                - l'appareil photographique ;
                - l'éclairage ;
                - le stockage et l'écoute de musique ;
                - les systèmes permettant de monter ou descendre entre plusieurs étages.
          - type: paragraphe
            texte: Recherchez trois objets ou systèmes appartenant à cette famille et apparus à des périodes différentes.
          - type: paragraphe
            texte: "Quelques ressources fiables pour vous aider :"
          - type: liste
            elements:
                - "Téléphone : INA – La saga du téléphone"
                - "Téléphone / photographie : Bibliothèque nationale de France – Électricité et communication"
                - "Vélo : Musée des Arts et Métiers – Le Dicycle Otto Safety — cette ressource permet notamment d'observer comment la recherche de vitesse et de sécurité a fait évoluer les premiers cycles."
                - "Vélo – pour aller plus loin : Musée des Arts et Métiers – Les pionniers des transports — on y retrouve notamment des vélocipèdes et des solutions techniques antérieures à la bicyclette moderne."
                - "Éclairage : EDF – Grandes dates de l'histoire de l'électricité — la ressource présente notamment la lampe à incandescence et plusieurs grandes étapes de l'électrification."
                - "Éclairage LED : EDF – Comment fonctionne une ampoule LED ? — utile pour comparer l'éclairage actuel aux anciennes solutions."
                - "Stockage et écoute de musique : Philharmonie de Paris – Du phonographe au MP3 — cette ressource retrace l'évolution de la musique enregistrée depuis le phonographe jusqu'aux technologies numériques."
                - "Musique – cassette audio : INA – Le succès de la cassette audio — permet d'étudier une étape importante entre les disques et les supports numériques."
                - "Ascenseur : Fédération des Ascenseurs – 1857 : premier ascenseur motorisé et sécurisé à usage public"
                - "Ascenseur – pour aller plus loin : Fédération des Ascenseurs – Guides et publications — la page propose notamment une fiche consacrée à l'histoire des ascenseurs."
          - type: lien
            titre: INA – La saga du téléphone
            url: https://www.ina.fr/ina-eclaire-actu/video/5420271_001_032/la-saga-du-telephone
          - type: lien
            titre: Bibliothèque nationale de France – Électricité et communication
            url: https://expositions.bnf.fr/sciencespourtous/techniques/electricite-et-communication/
          - type: lien
            titre: Musée des Arts et Métiers – Le Dicycle Otto Safety
            url: https://www.arts-et-metiers.net/musee/le-dicycle-otto-safety
          - type: lien
            titre: Musée des Arts et Métiers – Les pionniers des transports
            url: https://www.arts-et-metiers.net/musee/les-pionniers-des-transports
          - type: lien
            titre: EDF – Grandes dates de l'histoire de l'électricité
            url: https://www.edf.fr/groupe-edf/comprendre/electricite-au-quotidien/essentiels/grandes-dates
          - type: lien
            titre: EDF – Comment fonctionne une ampoule LED ?
            url: https://particulier.edf.fr/fr/accueil/guide-energie/economies-energie/eclairage-ampoule-led.html
          - type: lien
            titre: Philharmonie de Paris – Du phonographe au MP3
            url: https://mediatheque.philharmoniedeparis.fr/edutheque/doc/ALOES/0989702/musique-du-phonographe-au-mp3-1877-2011-ludovic-tournes
          - type: lien
            titre: INA – Le succès de la cassette audio
            url: https://www.ina.fr/ina-eclaire-actu/le-succes-de-la-musicassette-en-1975
          - type: lien
            titre: "Fédération des Ascenseurs – 1857 : premier ascenseur motorisé et sécurisé à usage public"
            url: https://www.ascenseurs.fr/confessions-dun-ascenseur/1857/
          - type: lien
            titre: Fédération des Ascenseurs – Guides et publications
            url: https://www.ascenseurs.fr/ressources/guides-publications/
          - type: paragraphe
            texte: Vous n'avez pas besoin de consulter toutes les ressources. Utilisez uniquement celles qui correspondent au domaine que vous avez choisi.
          - type: paragraphe
            texte: "Dans votre document, créez un tableau :"
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Objet ou système
                - Période approximative
                - Ce qui change par rapport au précédent
            lignes:
                - - ""
                  - ""
                  - ""
                - - ""
                  - ""
                  - ""
                - - ""
                  - ""
                  - ""
            suite:
                - type: paragraphe
                  texte: Ajoutez une seule image représentant l'une des trois solutions et indiquez sa source.
    - id: a09
      titre: 4. Qu'est-ce qui change réellement dans l'objet ?
      contenu:
          - type: paragraphe
            texte: "Reprenez deux objets de votre famille : un ancien et un plus récent."
      questions:
          - id: q01
            type: texte
            enonce: "Q3 : Quelle action importante doivent-ils tous les deux réaliser pour répondre au besoin ?"
          - id: q02
            type: texte
            enonce: "Q4 : Quels éléments ou technologies utilisent-ils pour réaliser cette action ?"
            suite:
                - type: paragraphe
                  texte: "Présentez votre réponse sous la forme :"
          - id: q03
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - ""
                - Objet ancien
                - Objet récent
            lignes:
                - - Action à réaliser
                  - ""
                  - ""
                - - Moyen utilisé
                  - ""
                  - ""
            suite:
                - type: titre
                  texte: "Mise en commun : fonction et solution technique"
                - type: paragraphe
                  texte: Une fonction technique correspond à une action réalisée par le système pour assurer son fonctionnement.
                - type: paragraphe
                  texte: Une solution technique correspond au moyen concret choisi pour réaliser cette fonction.
                - type: paragraphe
                  texte: "Exemple : pour un ascenseur, déplacer la cabine verticalement est une fonction technique. Utiliser un moteur électrique, une poulie et des câbles constitue une solution technique."
    - id: a10
      titre: 5. Toutes les évolutions sont-elles de même importance ?
      contenu:
          - type: paragraphe
            texte: Observez les quatre évolutions suivantes.
          - type: paragraphe
            texte: "Classez-les en deux catégories de votre choix : petite évolution ou changement important. Justifiez chaque réponse."
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Évolution
                - Votre classement
                - Justification
            lignes:
                - - Passage du téléphone à touches au smartphone
                  - ""
                  - ""
                - - Ajout d'une batterie offrant davantage d'autonomie à un vélo électrique
                  - ""
                  - ""
                - - Passage de la photographie argentique à la photographie numérique
                  - ""
                  - ""
                - - Remplacement d'une LED par une autre consommant moins d'énergie pour produire autant de lumière
                  - ""
                  - ""
            suite:
                - type: titre
                  texte: "Mise en commun : invention et innovation"
                - type: paragraphe
                  texte: Une invention correspond à la création d'un principe, d'un procédé ou d'un objet nouveau.
                - type: paragraphe
                  texte: Une innovation consiste à introduire ou améliorer une solution afin qu'elle apporte un nouvel usage ou de meilleures performances.
                - type: paragraphe
                  texte: Une innovation de rupture transforme fortement la manière de répondre à un besoin. Une amélioration progressive conserve davantage le principe existant tout en améliorant certaines performances.
    - id: a11
      titre: 6. Pourquoi modifier un objet qui fonctionne déjà ?
      contenu:
          - type: paragraphe
            texte: Reprenez la famille d'objets étudiée précédemment.
          - type: paragraphe
            texte: "Choisissez trois causes parmi les suivantes :"
          - type: liste
            elements:
                - évolution des besoins des utilisateurs ;
                - nouvelle technologie disponible ;
                - réduction du coût ;
                - amélioration des performances ;
                - amélioration de la sécurité ;
                - réduction de la consommation d'énergie ;
                - réduction de l'impact environnemental ;
                - nouvelle réglementation ;
                - amélioration du confort ou de l'ergonomie.
          - type: paragraphe
            texte: Pour chaque cause choisie, trouvez un exemple concernant votre famille d'objets.
      questions: []
    - id: a12
      titre: 7. Conclusion du travail
      contenu:
          - type: paragraphe
            texte: "Sans retourner recopier les définitions précédentes, complétez :"
          - type: liste
            elements:
                - Un objet technique est conçu pour répondre à un ................................................ .
                - Plusieurs objets répondant au même besoin peuvent appartenir à une même ................................................ .
                - Une ................................................ décrit une action que le système doit réaliser.
                - Une ................................................ correspond au moyen choisi pour réaliser cette action.
                - Un objet peut évoluer pour améliorer ses performances, sa sécurité, son coût, son confort ou son ................................................ .
          - type: paragraphe
            texte: "Dernière question :"
          - type: paragraphe
            texte: "En 4 à 6 lignes, répondez à la problématique :"
          - type: paragraphe
            texte: Pourquoi les objets et les systèmes techniques changent-ils alors qu'ils répondent parfois au même besoin depuis très longtemps ?
          - type: paragraphe
            texte: "Utilisez correctement au moins trois des mots suivants :"
          - type: paragraphe
            texte: besoin – fonction technique – solution technique – innovation – performance – sécurité – environnement
      questions: []
    - id: a13
      titre: Rendu attendu
      contenu:
          - type: paragraphe
            texte: À la fin de la séance, déposez votre fichier 3e_S02_nom.odt à l'endroit indiqué par le professeur.
          - type: paragraphe
            texte: Le fichier doit être rendu même si toutes les activités ne sont pas terminées. Vos recherches, essais et réponses intermédiaires doivent rester visibles.
      questions: []
    - id: a14
      titre: À retenir
      contenu:
          - type: paragraphe
            texte: Un même besoin peut être satisfait par des solutions techniques très différentes.
          - type: paragraphe
            texte: Au cours du temps, les fonctions nécessaires peuvent rester proches mais les solutions techniques évoluent.
          - type: paragraphe
            texte: Ces évolutions peuvent être liées à de nouvelles technologies ou à la recherche de meilleures performances, sécurité, coût, confort et impact environnemental.
      questions: []
