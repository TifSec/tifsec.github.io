titre: Pourquoi les objets techniques évoluent-ils ?
theme: "Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser"
problematique: Pourquoi les objets et les systèmes techniques changent-ils alors qu'ils répondent parfois au même besoin depuis très longtemps ?
pourquoi: Reprenez la famille d'objets étudiée précédemment.
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Un objet ou un système technique répond à un besoin.
        - Plusieurs objets peuvent répondre au même besoin avec des solutions différentes.
        - Une famille regroupe des objets ou systèmes répondant à un même besoin.
        - Une lignée permet de suivre l'évolution d'objets utilisant des principes techniques proches.
        - Les fonctions techniques peuvent rester identiques alors que les solutions techniques évoluent.
        - Les objets évoluent notamment pour améliorer leurs performances, leur sécurité, leur coût, leur confort ou leur impact environnemental.
    competences: []
activites:
    - id: a05
      titre: Production attendue
      contenu:
          - type: liste
            elements:
                - Un document LibreOffice Writer nommé 3e_S02_nom.odt.
                - Votre nom et votre prénom.
                - Les tableaux et réponses demandés pendant la séance.
                - Une courte étude de l'évolution d'une famille d'objets.
                - Une conclusion répondant à la problématique.
          - type: paragraphe
            texte: Le document devra être enregistré puis déposé dans l'espace d'échange à la fin de la séance, même s'il n'est pas entièrement terminé.
      questions: []
    - id: a06
      titre: 1. Préparez votre document de travail
      contenu:
