titre: 'Séance 48 : Prêt pour le brevet'
themes:
    - 'Les objets et les systèmes techniques : leurs usages et leurs interactions à découvrir et analyser'
    - 'Structure, fonctionnement, comportement : des objets et des systèmes techniques à comprendre'
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Qu’ai-je appris en technologie au collège, et suis-je prêt pour le brevet ?
competences_bo:
    - Décrire les liens entre usages et évolutions technologiques des objets et des systèmes techniques
objectifs:
    connaissances:
        - 'Les réflexes R1 à R21 ; les grandes notions du cycle 4 : objets et société, fonctionnement, conception, programmation.'
    competences:
        - Construire sa fiche de réflexes.
        - Faire le bilan du cycle.
pourquoi:
    - De la 5e à la 3e, tu as étudié l’éolienne, le monte-charge, le tracker et conçu la cuve.
    - 'Dernière séance : ta fiche de réflexes, le bilan, et on joue aux jeux Arcade de la classe.'
activites:
    -   id: a01
        titre: Ma fiche de réflexes
        consigne: Tu vas construire ta fiche de réflexes pour le brevet, à partir de tes trois brevets blancs. On attend cinq réflexes, chacun avec un exemple tiré de tes copies.
        contenu:
            -   type: etapes
                elements:
                    - Relis la liste des réflexes R1 à R21 (séance 1 et réflexes de 3e).
                    - Choisis les cinq qui t’ont le plus servi aux brevets blancs.
                    - Pour chacun, écris un exemple tiré de tes copies.
            -   type: paragraphe
                texte: Pourquoi cinq ? Une fiche courte se relit la veille du brevet ; une fiche trop longue ne se relit pas.
        questions:
            -   id: q01
                type: texte
                enonce: Écris tes cinq réflexes brevet les plus utiles, avec un exemple tiré de tes copies pour chacun.
                aide: Combien d’éléments sont demandés ?
    -   id: a02
        titre: Le bilan du cycle
        transition: Ta fiche est prête. Fais le bilan du cycle.
        consigne: Tu vas faire le bilan de tes trois années de technologie, à partir des quatre objets étudiés. On attend un projet et la raison de ton choix.
        contenu:
            -   type: etapes
                elements:
                    - 'Repense aux quatre objets étudiés : éolienne, monte-charge, tracker, cuve.'
                    - Choisis le projet qui t’a le plus appris.
                    - Dis pourquoi, avec un exemple précis.
            -   type: paragraphe
                texte: 'Pourquoi faire ce bilan ? Il t’aide à savoir ce que tu aimes : utile pour ton orientation (séance 2).'
        questions:
            -   id: q01
                type: texte
                enonce: Quel projet de technologie au collège (éolienne, monte-charge, tracker, cuve) t’a le plus appris ? Pourquoi ?
                aide: Pense à « car » (réflexe n° 4).
    -   id: a03
        titre: Échanger nos jeux
        transition: Le bilan est fait. Place aux jeux !
        consigne: Tu vas jouer au mini-jeu sur l’eau d’un camarade (séance 31). On attend une réussite précise de son jeu.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre ton mini-jeu sur l’eau (séance 31).
                    - Échange de poste avec un camarade et joue à son jeu.
                    - Note une réussite.
            -   type: paragraphe
                texte: Pourquoi finir par les jeux ? Pour voir tout ce que la classe sait programmer en fin de collège.
        questions:
            -   id: q01
                type: texte
                enonce: Dans le mini-jeu sur l’eau de ton camarade, qu’as-tu trouvé de réussi ?
                aide: Repère le verbe de la question.
        ressources:
            -   type: lien
                titre: MakeCode Arcade (gratuit, dans le navigateur)
                url: https://arcade.makecode.com/
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le brevet approche.
        questions:
            -   id: q01
                type: texte
                enonce: Que feras-tu la veille de l’épreuve de sciences ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Fais le point.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : qu’as-tu appris en technologie au collège, et es-tu prêt pour le brevet ? Que feras-tu la semaine précédente ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - Réflexes R1 à R21.
    - 'Cycle 4 : objets et société, fonctionnement, conception, programmation.'
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
