titre: 'Séance 42 : Rassembler et tester le prototype numérique'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Le prototype numérique complet de la cuve respecte-t-il le cahier des charges ?
competences_bo:
    - Imaginer, concevoir et réaliser une ou des solutions en réponse à un besoin, à des exigences (de développement durable, par exemple) ou à la nécessité d’améliorations dans une démarche de créativité
    - Valider les solutions techniques par des simulations ou par des protocoles de tests
objectifs:
    connaissances:
        - 'Intégrer : rassembler les fonctions des groupes dans un seul programme, puis relancer tout le protocole de test.'
    competences:
        - Intégrer plusieurs parties d’un programme.
        - Valider un prototype avec un protocole.
pourquoi:
    - En séances 36 à 38, chaque groupe a programmé et testé sa fonction.
    - Aujourd’hui, la classe rassemble tout et teste.
activites:
    -   id: a01
        titre: Intégrer
        consigne: Tu vas participer au rassemblement des fonctions de tous les groupes dans le programme complet de la cuve. On attend un problème d’intégration et sa solution.
        contenu:
            -   type: etapes
                elements:
                    - Le professeur rassemble les fonctions des groupes dans un seul projet.
                    - 'Repère les conflits : deux variables du même nom, deux constituants sur la même broche.'
                    - Proposez une règle commune pour les résoudre.
            -   type: paragraphe
                texte: 'Pourquoi des conflits ? Chaque groupe a travaillé seul : des choix différents se rencontrent pour la première fois.'
        questions:
            -   id: q01
                type: texte
                enonce: Quel problème d’intégration avez-vous rencontré (ou pourriez-vous rencontrer) en rassemblant les fonctions de la cuve ? Comment le résoudre ?
                aide: Repère le verbe de la question.
    -   id: a02
        titre: Relancer le protocole
        transition: Le programme est complet. Teste-le.
        consigne: Tu vas relancer ton protocole de test de la séance 38 sur le programme complet de la cuve. On attend les résultats observés de deux cas.
        contenu:
            -   type: etapes
                elements:
                    - Reprends ton protocole de la séance 38.
                    - Mène chaque cas sur le programme complet.
                    - Note l’observé à côté de l’attendu.
            -   type: paragraphe
                texte: Pourquoi tout retester ? Une fonction qui marchait seule peut être gênée par une autre une fois assemblée.
        questions:
            -   id: q01
                type: tableau
                enonce: Note les résultats de ton protocole de la séance 38 sur le prototype complet de la cuve.
                colonnes:
                    - Cas
                    - Attendu
                    - Observé
                lignes:
                    -   - ''
                        - ''
                        - ''
                    -   - ''
                        - ''
                        - ''
                aide: Attendu ou observé ?
        ressources:
            -   type: lien
                titre: MakeCode micro:bit (gratuit, dans le navigateur)
                url: https://makecode.microbit.org/
    -   id: a03
        titre: Conclure
        transition: Les tests sont faits. Conclus.
        consigne: Tu vas conclure sur le respect du cahier des charges de la cuve par le prototype numérique. On attend un bilan appuyé sur les tests et une limite de la simulation.
        contenu:
            -   type: etapes
                elements:
                    - Relis le cahier des charges (séance 17).
                    - Pour chaque exigence, cherche le test qui la prouve.
                    - Écris ton bilan, avec ce qui n’a pas pu être prouvé.
            -   type: paragraphe
                texte: 'Pourquoi dire ce qui n’est pas prouvé ? Un prototype numérique ne prouve pas tout : le reconnaître rend le bilan crédible.'
        questions:
            -   id: q01
                type: texte
                enonce: Le prototype numérique de la cuve respecte-t-il le cahier des charges ? Justifie avec tes tests et cite une exigence que la simulation ne peut pas prouver.
                aide: Attendu ou observé ?
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un vrai prototype pourrait être construit plus tard.
        questions:
            -   id: q01
                type: texte
                enonce: Quel premier test ferais-tu sur la vraie cuve ?
                aide: Attendu ou observé ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : le prototype numérique complet de la cuve respecte-t-il le cahier des charges ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - Intégrer, puis relancer tout le protocole de test.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
