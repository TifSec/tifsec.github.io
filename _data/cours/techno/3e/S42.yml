titre: 'Séance 42 : Rassembler et tester le prototype numérique'
themes:
    - 'Création, conception, réalisation, innovations : des objets à concevoir et à réaliser'
problematique: Le prototype numérique complet de la cuve respecte-t-il le cahier des charges ?
competences_bo:
    - Imaginer, concevoir et réaliser une ou des solutions en réponse à un besoin, à des exigences (de développement durable, par exemple) ou à la nécessité d’améliorations dans une démarche de créativité
    - Valider les solutions techniques par des simulations ou par des protocoles de tests
objectifs:
    connaissances:
        - 'Intégrer : rassembler les fonctions des groupes dans un seul programme, puis relancer tout le protocole de test.'
    competences:
        - Intégrer plusieurs parties d’un programme.
        - Valider un prototype avec un protocole.
pourquoi:
    - En séances 36 à 38, chaque groupe a programmé et testé sa fonction.
    - Aujourd’hui, la classe rassemble tout et teste.
activites:
    -   id: a01
        titre: Intégrer
        contenu:
            -   type: paragraphe
                texte: Le professeur rassemble les fonctions dans un seul projet. Des conflits peuvent apparaître (même nom de variable, même broche).
        questions:
            -   id: q01
                type: texte
                enonce: Quel problème d’intégration avez-vous rencontré (ou pourriez-vous rencontrer) ? Comment le résoudre ?
                aide: Repère le verbe de la question.
    -   id: a02
        titre: Tester
        transition: Le programme est complet. Teste-le.
        questions:
            -   id: q01
                type: tableau
                enonce: Résultats du protocole de la séance 38 sur le prototype complet.
                colonnes:
                    - Cas
                    - Attendu
                    - Observé
                lignes:
                    -   - ''
                        - ''
                        - ''
                    -   - ''
                        - ''
                        - ''
                    -   - ''
                        - ''
                        - ''
                aide: Attendu ou observé ?
            -   id: q02
                type: texte
                enonce: Le prototype respecte-t-il le cahier des charges ? Justifie.
                aide: Pense à « car » (réflexe n° 4).
        ressources:
            -   type: lien
                titre: MakeCode micro:bit (gratuit, dans le navigateur)
                url: https://makecode.microbit.org/
    -   id: a03
        titre: Défi
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un prototype numérique a des limites.
        questions:
            -   id: q01
                type: texte
                enonce: Que ne peut pas prouver la simulation ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Conclusion de ton travail
        conclusion: true
        transition: Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : le prototype respecte-t-il le cahier des charges ?'
                aide: Reprends les mots du problème (réflexe n° 3).
retenir:
    - Intégrer, puis relancer tout le protocole de test.
sources:
    -   type: lien
        titre: Ministère de l’Éducation nationale — Programme de technologie du cycle 4 (BO n° 9 du 29 février 2024)
        url: https://www.education.gouv.fr/media/160767/download
