titre: 'Séance 29 : S’entraîner pour l’entretien du DNB'
themes:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
problematique: Comment répondre aux questions du jury avec clarté ?
competences_bo:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
objectifs:
    connaissances:
        - Le jury évalue la maîtrise de l’expression orale et la maîtrise du sujet.
        - 'Pour répondre : reformuler la question, répondre, donner un exemple.'
    competences:
        - Lire une grille d’évaluation.
        - Répondre à une question avec la méthode reformuler-répondre-exemple.
pourquoi:
    - En S28, tu as fait ton support.
    - 'Les 10 minutes d’entretien comptent autant : on s’entraîne à répondre.'
activites:
    -   id: a01
        titre: La grille du jury
        consigne: Tu vas lire la grille d’oral du DNB (document 1) et choisir le critère le plus difficile pour toi. On attend les deux critères et ton choix justifié.
        contenu:
            -   type: tableau
                titre: Document 1 — Grille d’oral du DNB (simplifiée, sur 100)
                colonnes:
                    - Critère
                    - Points
                lignes:
                    -   - Maîtrise de l’expression orale (voix, regard, vocabulaire, gestion du temps)
                        - '50'
                    -   - Maîtrise du sujet présenté (contenu, démarche, réponses aux questions)
                        - '50'
            -   type: etapes
                elements:
                    - Lis la grille (document 1).
                    - Repère ce qui est évalué.
                    - Choisis le critère qui te semble le plus difficile.
            -   type: paragraphe
                texte: 'Pourquoi connaître la grille ? On sait ce que le jury attend : on peut s’y préparer.'
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, quels sont les deux grands critères ? Lequel te semble le plus difficile, et pourquoi ?
                aide: « D’après le document… ».
    -   id: a02
        titre: Préparer les questions
        transition: Tu sais ce qui est évalué. Prépare les questions.
        consigne: Tu vas imaginer une question du jury sur ton sujet et y répondre en trois temps. On attend la question et ta réponse complète.
        contenu:
            -   type: etapes
                elements:
                    - Imagine trois questions que le jury pourrait te poser sur ton sujet.
                    - 'Pour une question, écris ta réponse : reformuler, répondre, exemple.'
            -   type: paragraphe
                texte: Pourquoi un exemple ? Il prouve que tu as vraiment vécu ou compris ce que tu dis.
        questions:
            -   id: q01
                type: texte
                enonce: Écris une question possible du jury et ta réponse en trois temps (reformuler, répondre, exemple).
                aide: « = » + fonction + plage.
    -   id: a03
        titre: Entraînement en binôme
        transition: Tes réponses sont prêtes. Entraîne-toi à voix haute.
        consigne: Tu vas répondre à deux questions de ton binôme et recevoir un conseil. On attend le conseil et comment tu l’appliqueras.
        contenu:
            -   type: etapes
                elements:
                    - Ton binôme te pose deux questions.
                    - Réponds avec la méthode, en regardant ton binôme.
                    - Il te donne un conseil.
            -   type: paragraphe
                texte: Pourquoi en binôme ? Répondre à voix haute devant quelqu’un, c’est déjà se mettre en situation.
        questions:
            -   id: q01
                type: texte
                enonce: Quel conseil ton binôme t’a-t-il donné, et comment vas-tu l’appliquer ?
                aide: Combien d’éléments sont demandés ?
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le jury pose une question dont tu ne connais pas la réponse.
        questions:
            -   id: q01
                type: texte
                enonce: Que réponds-tu ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu es prêt pour l’entretien. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment répondre aux questions du jury avec clarté ?'
                aide: Reprends les mots du problème.
retenir:
    - 'Grille : expression orale et maîtrise du sujet.'
    - Reformuler, répondre, exemple.
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
