titre: 'Séance 21 : Préparer une vidéo métier : le storyboard'
themes:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
problematique: Comment préparer une vidéo courte pour présenter un métier du cheval ?
competences_bo:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
objectifs:
    connaissances:
        - 'Un storyboard découpe une vidéo en plans dessinés : image, texte dit, durée.'
        - Une vidéo courte (1 min) a un début, un milieu, une fin.
    competences:
        - Écrire un storyboard.
        - Choisir les plans et les durées.
pourquoi:
    - Tu vas présenter un métier de la filière cheval en vidéo, pour l’orientation.
    - 'Avant de filmer, on prépare : c’est le storyboard.'
activites:
    -   id: a01
        titre: Choisir le métier
        consigne: Tu vas choisir un métier de la filière cheval sur Equi-ressources et noter trois informations clés. On attend le métier, les informations et la source.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre les fiches métiers d’Equi-ressources.
                    - Choisis un métier (palefrenier-soigneur, maréchal-ferrant, moniteur, groom…).
                    - Note trois informations clés.
            -   type: paragraphe
                texte: Pourquoi une source fiable ? Ta vidéo doit donner des informations justes pour d’autres élèves.
        questions:
            -   id: q01
                type: texte
                enonce: Écris le métier choisi et trois informations clés trouvées sur sa fiche (avec la source).
                aide: Combien d’éléments sont demandés ?
        ressources:
            -   type: lien
                titre: Equi-ressources — fiches métiers de la filière cheval
                url: https://www.equiressources.fr/metiers
    -   id: a02
        titre: Le storyboard
        transition: Tu as tes informations. Organise ta vidéo.
        consigne: Tu vas écrire le storyboard de ta vidéo métier en 4 plans. On attend pour chaque plan l’image, le texte et la durée.
        contenu:
            -   type: etapes
                elements:
                    - Découpe ta vidéo en 4 plans de 10 à 20 secondes.
                    - 'Pour chaque plan : ce qu’on voit, ce qu’on entend, la durée.'
                    - 'Vérifie : 1 minute au total.'
            -   type: paragraphe
                texte: 'Pourquoi 4 plans ? Une minute passe vite : chaque plan doit avoir une seule idée.'
        questions:
            -   id: q01
                type: tableau
                enonce: Complète ton storyboard.
                colonnes:
                    - Plan
                    - On voit / on entend / durée
                lignes:
                    -   - 1 — Accroche
                        - ''
                    -   - 2 — Les missions
                        - ''
                    -   - 3 — La formation
                        - ''
                    -   - 4 — Conclusion
                        - ''
                aide: Ligne × colonne.
    -   id: a03
        titre: Vérifier la durée
        transition: Le storyboard est écrit. Respecte-t-il la durée ?
        consigne: Tu vas vérifier la durée de ton storyboard en lisant ton texte au chronomètre. On attend la durée totale et ton ajustement.
        contenu:
            -   type: citation
                texte: 'Réflexe DNB M5 : j’écris l’unité (s).'
            -   type: etapes
                elements:
                    - Additionne les durées de tes plans.
                    - Lis ton texte à voix haute avec un chronomètre.
                    - Ajuste si tu dépasses une minute.
            -   type: paragraphe
                texte: Pourquoi chronométrer ? On parle souvent plus longtemps qu’on ne le pense.
        questions:
            -   id: q01
                type: nombre
                enonce: Quelle est la durée totale prévue dans ton storyboard ?
                unite: s
                aide: N’oublie pas l’unité.
            -   id: q02
                type: texte
                enonce: Qu’as-tu ajusté après la lecture chronométrée ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un plan large montre le lieu, un gros plan un détail.
        questions:
            -   id: q01
                type: texte
                enonce: Quel plan pour montrer le geste du maréchal ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton storyboard est prêt. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment préparer une vidéo courte pour présenter un métier du cheval ?'
                aide: Reprends les mots du problème.
retenir:
    - 'Storyboard : plan, image, texte, durée.'
    - 'Vidéo courte : accroche, contenu, conclusion.'
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
