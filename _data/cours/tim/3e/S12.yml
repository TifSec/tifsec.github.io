titre: 'Séance 12 : Un faux mail de la fédération : l’hameçonnage'
themes:
    - Objectif 4 — Adopter une attitude responsable dans une société démocratique
problematique: Comment reconnaître un message frauduleux et réagir ?
competences_bo:
    - Objectif 4 — Adopter une attitude responsable dans une société démocratique
objectifs:
    connaissances:
        - L’hameçonnage (phishing) imite un organisme connu pour voler des identifiants ou de l’argent.
        - 'Indices : urgence, fautes, adresse d’expéditeur bizarre, lien qui ne mène pas au vrai site.'
    competences:
        - Repérer les indices d’un message frauduleux.
        - Adopter la bonne réaction.
pourquoi:
    - En S11, tu as vu que les données personnelles ont de la valeur.
    - 'Des escrocs essaient de les voler : un faux mail circule au nom de la fédération d’équitation.'
activites:
    -   id: a01
        titre: Chercher les indices
        consigne: Tu vas chercher les indices d’arnaque dans un faux mail au nom de la fédération (document 1, inventé). On attend trois indices.
        contenu:
            -   type: citation
                texte: 'Document 1 — De : ffe-licence@gmail-secure.net — Objet : URGENT licence suspandue ! « Votre licence sera supprimer dans 24 h. Cliquez ici et entrez votre numéro de carte bancaire pour la réactiver. »'
            -   type: paragraphe
                texte: Message inventé pour l’exercice.
            -   type: etapes
                elements:
                    - Lis le message (document 1, inventé).
                    - Cherche au moins trois indices d’arnaque.
                    - Note chaque indice.
            -   type: paragraphe
                texte: Pourquoi plusieurs indices ? Un seul peut être une erreur ; plusieurs ensemble prouvent la fraude.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, cite trois indices qui montrent que ce message est une arnaque.
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
    -   id: a02
        titre: Le lien piégé
        transition: Tu as repéré les indices. Regarde maintenant le lien.
        consigne: Tu vas comparer deux adresses de lien (document 2) pour trouver le vrai site de la fédération. On attend le bon lien et le domaine du lien piégé.
        contenu:
            -   type: liste
                elements:
                    - 'Lien a : https://www.ffe.com/licence'
                    - 'Lien b : https://ffe.com.licence-update.ru/login'
            -   type: etapes
                elements:
                    - Lis les deux adresses de lien (document 2).
                    - 'Repère le vrai nom de domaine : ce qui est juste avant le premier « / » après « https:// ».'
                    - Choisis le vrai site.
            -   type: paragraphe
                texte: Pourquoi le nom de domaine ? Un escroc peut écrire « ffe » n’importe où dans l’adresse, mais pas posséder ffe.com.
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 2, quel lien mène au vrai site de la fédération ?
                choix:
                    -   id: a
                        texte: https://www.ffe.com/licence
                    -   id: b
                        texte: https://ffe.com.licence-update.ru/login
                    -   id: c
                        texte: Les deux.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Quel est le vrai nom de domaine du lien b ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a03
        titre: Bien réagir
        transition: Tu sais repérer un faux. Et si on s’est fait avoir ?
        consigne: Tu vas indiquer la bonne réaction si on s’est fait piéger par un faux site. On attend les actions à faire tout de suite.
        contenu:
            -   type: etapes
                elements:
                    - Lis les réactions possibles.
                    - Choisis les bonnes.
                    - Explique ce qu’il faut faire si on a déjà cliqué.
            -   type: paragraphe
                texte: 'Pourquoi savoir réagir ? Même prudent, on peut se faire piéger : agir vite limite les dégâts.'
        questions:
            -   id: q01
                type: texte
                enonce: Tu as cliqué et tapé ton mot de passe sur le faux site. Que fais-tu tout de suite ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: L’hameçonnage existe aussi par SMS.
        questions:
            -   id: q01
                type: texte
                enonce: Comment s’appelle-t-il ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais déjouer l’hameçonnage. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment reconnaître un message frauduleux et réagir ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Hameçonnage : urgence, fautes, faux expéditeur, faux domaine.'
    - Ne pas cliquer ; signaler ; changer son mot de passe si besoin.
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
