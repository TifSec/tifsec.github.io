titre: 'Séance 5 : Une lettre pour chaque propriétaire : le publipostage'
themes:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
problematique: Comment écrire la même lettre à plusieurs personnes sans la retaper ?
competences_bo:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
objectifs:
    connaissances:
        - Le publipostage fusionne un modèle de lettre (Writer) et une liste de données (Calc).
        - Les champs (« Nom », « Cheval ») sont remplacés par les données de chaque ligne.
    competences:
        - Préparer une source de données dans Calc.
        - Réaliser un publipostage simple.
pourquoi:
    - En S02 à S04, tu as travaillé un document long.
    - 'La pension doit prévenir 4 propriétaires de la date du vaccin de leur cheval : même lettre, noms différents.'
activites:
    -   id: a01
        titre: Modèle et données
        consigne: Tu vas repérer dans la lettre de la pension (document 1) ce qui change selon le propriétaire, avec la liste du document 2. On attend la colonne de chaque partie variable.
        contenu:
            -   type: citation
                texte: Document 1 — « Madame Dupuis, le vaccin grippe-rhinopneumonie de Galopin aura lieu le 12 mars. Merci de nous confirmer votre accord. La pension du Moulin. »
            -   type: tableau
                titre: Document 2 — Liste des propriétaires (fictive)
                colonnes:
                    - Nom
                    - Cheval
                    - Date
                lignes:
                    -   - Madame Dupuis
                        - Galopin
                        - 12 mars
                    -   - Monsieur Ferré
                        - Tango
                        - 12 mars
                    -   - Madame Ould
                        - Iris
                        - 14 mars
                    -   - Monsieur Petit
                        - Nuage
                        - 14 mars
            -   type: etapes
                elements:
                    - Lis la lettre (document 1) et la liste (document 2).
                    - Repère dans la lettre ce qui change d’un propriétaire à l’autre.
                    - Associe chaque partie qui change à une colonne de la liste.
            -   type: paragraphe
                texte: Pourquoi séparer ? Le texte commun s’écrit une fois ; les données changent ligne par ligne.
        questions:
            -   id: q01
                type: tableau
                enonce: Associe chaque partie variable de la lettre à une colonne de la liste.
                colonnes:
                    - Dans la lettre
                    - Colonne
                lignes:
                    -   - Madame Dupuis
                        - ''
                    -   - Galopin
                        - ''
                    -   - 12 mars
                        - ''
                aide: 'Bloc par bloc : quand ? quelle condition ? quelle action ?'
    -   id: a02
        titre: Préparer la liste
        transition: Tu sais ce qui change. Prépare la liste dans Calc.
        consigne: Tu vas préparer dans Calc la liste des propriétaires qui servira de source au publipostage. On attend le rôle des titres et le nombre de lettres produites.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Calc et recopie le document 2 (titres en ligne 1).
                    - Enregistre sous 3e_S05_proprietaires.ods.
                    - 'Vérifie : une ligne par propriétaire, pas de ligne vide.'
            -   type: paragraphe
                texte: Pourquoi la ligne 1 ? Ses titres deviennent les noms des champs dans Writer.
        questions:
            -   id: q01
                type: qcm
                enonce: À quoi servent les titres de la ligne 1 dans le publipostage ?
                choix:
                    -   id: a
                        texte: Ce sont les noms des champs à insérer dans la lettre.
                    -   id: b
                        texte: À rien.
                    -   id: c
                        texte: Ils sont imprimés en haut de chaque lettre.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: nombre
                enonce: Combien de lettres le publipostage va-t-il produire ?
                unite: lettres
                aide: 'Méthode : 1) écris l’opération avec les nombres de l’énoncé ; 2) calcule (calculatrice autorisée) ; 3) vérifie que le résultat est vraisemblable et que l’unité est la bonne.'
    -   id: a03
        titre: Fusionner
        transition: La liste est prête. Relie-la à la lettre.
        consigne: Tu vas fusionner la lettre et la liste pour produire une lettre par propriétaire. On attend la lettre produite pour Monsieur Petit.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Writer, tape la lettre en laissant la place des champs.
                    - 'Outils > Assistant Mailing (ou Publipostage) : choisis ton fichier Calc comme source.'
                    - Insère les champs Nom, Cheval, Date (Insertion > Champ > Autres champs > Base de données).
                    - Lance la fusion et regarde les 4 lettres.
            -   type: paragraphe
                texte: Pourquoi vérifier les 4 lettres ? Une erreur dans la liste (faute, ligne vide) se retrouve dans une lettre.
        questions:
            -   id: q01
                type: texte
                enonce: Recopie la lettre produite pour Monsieur Petit.
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le publipostage sert aussi pour les étiquettes.
        questions:
            -   id: q01
                type: texte
                enonce: Donne un usage dans une écurie.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Les 4 lettres sont prêtes. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment écrire la même lettre à plusieurs personnes sans la retaper ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Publipostage = modèle Writer + liste Calc.
    - Une lettre par ligne ; vérifier les données.
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
