titre: 'Séance 28 : Le diaporama de mon oral du DNB'
themes:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
problematique: Comment construire un support qui aide mon oral du DNB sans le remplacer ?
competences_bo:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
objectifs:
    connaissances:
        - 'L’oral du DNB dure 15 minutes : 5 min d’exposé, 10 min d’entretien.'
        - 'Le support (5 à 7 diapositives) montre l’essentiel : plan, images, mots-clés ; c’est l’élève qui explique.'
    competences:
        - Construire un plan d’exposé.
        - Réaliser un diaporama court avec un masque.
pourquoi:
    - En 4e, tu as fait un diaporama sur l’écurie.
    - 'Cette fois, c’est pour le DNB : tu présentes un projet (stage, EPI, métier).'
activites:
    -   id: a01
        titre: Le plan de l’exposé
        consigne: Tu vas écrire le plan de ton exposé du DNB en 4 parties, avec le temps de chaque partie. On attend un plan qui tient en 5 minutes.
        contenu:
            -   type: citation
                texte: 'Réflexe DNB M10 : je gère mon temps : 5 minutes d’exposé, pas plus.'
            -   type: etapes
                elements:
                    - Choisis ton sujet (stage, projet, métier).
                    - 'Écris un plan en 4 parties : introduction, deux parties, conclusion.'
                    - Prévois le temps de chaque partie (5 min au total).
            -   type: paragraphe
                texte: Pourquoi un plan ? Le jury suit ton raisonnement, et tu ne te perds pas.
        questions:
            -   id: q01
                type: tableau
                enonce: Écris ton plan et le temps de chaque partie.
                colonnes:
                    - Partie
                    - Contenu et temps
                lignes:
                    -   - Introduction
                        - ''
                    -   - Partie 1
                        - ''
                    -   - Partie 2
                        - ''
                    -   - Conclusion
                        - ''
                aide: Ligne × colonne.
    -   id: a02
        titre: Le masque des diapositives
        transition: Ton plan est prêt. Prépare un support cohérent.
        consigne: Tu vas créer le masque de ton diaporama du DNB et une diapositive par partie du plan. On attend la description du masque et où changer la police.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Impress ; enregistre sous 3e_S28_oral_tonprenom.odp.
                    - 'Affichage > Masque : choisis une police lisible, un fond clair, ton nom en pied de page.'
                    - Ferme le masque et crée une diapositive par partie du plan.
            -   type: paragraphe
                texte: Pourquoi un masque ? Il applique la même présentation à toutes les diapositives d’un coup.
        questions:
            -   id: q01
                type: texte
                enonce: 'Décris ton masque : police, couleurs, élément répété.'
                aide: Combien d’éléments sont demandés ?
            -   id: q02
                type: qcm
                enonce: Tu veux changer la police de toutes les diapositives. Où le fais-tu ?
                choix:
                    -   id: a
                        texte: Dans le masque.
                    -   id: b
                        texte: Sur chaque diapositive.
                    -   id: c
                        texte: Dans Writer.
                aide: Relis l’exemple expliqué.
    -   id: a03
        titre: Peu de texte, des preuves
        transition: Le masque est prêt. Remplis les diapositives.
        consigne: Tu vas remplir tes diapositives avec des mots-clés et des preuves de ton travail. On attend la description d’une diapositive et de sa preuve.
        contenu:
            -   type: etapes
                elements:
                    - 'Sur chaque diapositive : un titre, 3 mots-clés, une image ou un schéma.'
                    - Ajoute une photo de ton stage (sans personne reconnaissable) ou un document produit.
                    - 'Vérifie : pas de phrase complète à lire.'
            -   type: paragraphe
                texte: Pourquoi des preuves ? Une photo de ton travail ou un tableau que tu as fait montre ce que tu as réellement appris.
        questions:
            -   id: q01
                type: texte
                enonce: Décris ta diapositive la plus réussie et la preuve qu’elle montre.
                aide: Combien d’éléments sont demandés ?
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le jury peut demander de voir un document précis.
        questions:
            -   id: q01
                type: texte
                enonce: Comment aller directement à la diapositive 4 pendant le diaporama ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton support est prêt. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment construire un support qui aide ton oral du DNB sans le remplacer ?'
                aide: Reprends les mots du problème.
retenir:
    - 'Oral DNB : 5 min d’exposé + 10 min d’entretien.'
    - Masque ; mots-clés ; preuves.
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
