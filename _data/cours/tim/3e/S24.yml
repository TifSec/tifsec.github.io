titre: 'Séance 24 : Comment est faite une page web ?'
themes:
    - Objectif 1 — S’approprier et utiliser un environnement informatique de travail
    - Objectif 2 — Créer, produire, traiter et exploiter des données
problematique: Comment une page web est-elle construite, et comment en modifier une ?
competences_bo:
    - Objectif 1 — S’approprier et utiliser un environnement informatique de travail
objectifs:
    connaissances:
        - 'Une page web est écrite en HTML : des balises comme <h1> (titre), <p> (paragraphe), <img> (image), <a> (lien).'
        - Le navigateur lit le HTML et affiche la page.
    competences:
        - Lire un code HTML simple.
        - Modifier une page web (titre, texte, lien).
pourquoi:
    - En S13, tu as vu que le web est un service d’internet.
    - Mais comment sont faites les pages que tu visites ? Tu vas créer celle de ta vidéo métier.
activites:
    -   id: a01
        titre: Lire les balises
        consigne: Tu vas lire un petit code HTML sur un métier du cheval (document 1) et dire le rôle de chaque balise. On attend le rôle de trois balises.
        contenu:
            -   type: code
                texte: '<h1>Le métier de maréchal-ferrant</h1>

                    <p>Il pare et ferre les sabots des chevaux.</p>

                    <a href="https://www.equiressources.fr">En savoir plus</a>'
            -   type: etapes
                elements:
                    - Lis le code HTML (document 1).
                    - Repère chaque balise et ce qu’elle affiche.
                    - Associe.
            -   type: paragraphe
                texte: 'Pourquoi des balises ? Elles disent au navigateur le rôle de chaque morceau : titre, paragraphe, lien.'
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, que fait chaque balise ?
                colonnes:
                    - Balise
                    - Rôle
                lignes:
                    -   - <h1>
                        - ''
                    -   - <p>
                        - ''
                    -   - <a href=…>
                        - ''
                aide: Ligne × colonne.
    -   id: a02
        titre: Modifier la page
        transition: Tu sais lire le HTML. Modifie la page.
        consigne: Tu vas modifier la page metier.html pour y présenter ton métier, puis l’ouvrir dans le navigateur. On attend tes lignes de titre et de paragraphe.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre le fichier fourni metier.html dans un éditeur de texte.
                    - Remplace le titre et le paragraphe par ton métier (S21).
                    - Enregistre, puis ouvre le fichier dans le navigateur.
            -   type: paragraphe
                texte: Pourquoi enregistrer avant d’ouvrir ? Le navigateur affiche le fichier tel qu’il est enregistré.
        questions:
            -   id: q01
                type: texte
                enonce: Recopie la ligne <h1> et la ligne <p> de ta page.
                aide: Repère le verbe de la question.
            -   id: q02
                type: qcm
                enonce: Tu oublies le </h1>. Que risque-t-il de se passer ?
                choix:
                    -   id: a
                        texte: Tout le texte suivant s’affiche en gros titre.
                    -   id: b
                        texte: Rien.
                    -   id: c
                        texte: La page s’efface.
                aide: Relis l’exemple expliqué.
    -   id: a03
        titre: Ajouter une image et un lien
        transition: Ta page a un titre et un texte. Ajoute une image et un lien.
        consigne: Tu vas ajouter à ta page une image avec un texte alternatif et un lien vers la fiche du métier. On attend ta ligne <img> et le rôle du texte alternatif.
        contenu:
            -   type: etapes
                elements:
                    - Ajoute <img src="image.jpg" alt="…"> avec une image libre fournie.
                    - Écris un texte alternatif (alt) qui décrit l’image.
                    - Ajoute un lien vers la fiche Equi-ressources de ton métier.
            -   type: paragraphe
                texte: Pourquoi le texte alternatif ? Il est lu aux personnes aveugles par leur logiciel, et s’affiche si l’image ne charge pas.
        questions:
            -   id: q01
                type: texte
                enonce: Écris ta ligne <img> avec son texte alternatif.
                aide: Combien d’éléments sont demandés ?
            -   id: q02
                type: texte
                enonce: À quoi sert le texte alternatif ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le CSS met en forme une page HTML.
        questions:
            -   id: q01
                type: texte
                enonce: 'Que fait la ligne h1 { color: darkgreen; } ?'
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ta page web est faite. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment une page web est-elle construite, et comment en modifier une ?'
                aide: Reprends les mots du problème.
retenir:
    - 'HTML : <h1>, <p>, <img alt>, <a href>.'
    - Ouvrir une balise, la fermer.
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
