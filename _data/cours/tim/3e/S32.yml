titre: 'Séance 32 : Mon bilan de TIM au collège'
themes:
    - Objectif 1 — S’approprier et utiliser un environnement informatique de travail
    - Objectif 2 — Créer, produire, traiter et exploiter des données
    - Objectif 3 — Répondre à un besoin d’information, analyser sa qualité et communiquer
    - Objectif 4 — Adopter une attitude responsable dans une société démocratique
    - Objectif 5 — Découvrir l’analyse et le codage
    - Objectif 6 — Appréhender les évolutions des technologies de l’informatique et du multimédia
problematique: Quelles compétences numériques ai-je acquises au collège, et lesquelles me serviront dans ma formation ?
competences_bo:
    - Objectif 1 — S’approprier et utiliser un environnement informatique de travail
    - Objectif 2 — Créer, produire, traiter et exploiter des données
objectifs:
    connaissances:
        - 'Le TIM de 4e-3e a travaillé les six objectifs : outils, documents, information, citoyenneté, programmation, impact du numérique.'
        - Pix atteste ces compétences.
    competences:
        - Faire le bilan de ses compétences.
        - Les relier à sa future formation.
pourquoi:
    - Depuis la 4e, tu as beaucoup appris.
    - Avant de partir en CAPa, en seconde ou ailleurs, tu fais le point.
activites:
    -   id: a01
        titre: Ce que je sais faire maintenant
        consigne: Tu vas faire la liste de ce que tu as appris de nouveau en 3e avec quatre outils. On attend une compétence précise par outil.
        contenu:
            -   type: etapes
                elements:
                    - Relis la liste des séquences de 3e.
                    - Pour chaque logiciel ou outil, écris une compétence nouvelle de 3e.
                    - Sois précis.
            -   type: paragraphe
                texte: Pourquoi « nouvelle » ? Tu mesures ce que la 3e t’a apporté par rapport à la 4e.
        questions:
            -   id: q01
                type: tableau
                enonce: Écris une compétence nouvelle de 3e pour chaque outil.
                colonnes:
                    - Outil
                    - Je sais…
                lignes:
                    -   - Writer
                        - ''
                    -   - Calc
                        - ''
                    -   - micro:bit
                        - ''
                    -   - Vidéo ou page web
                        - ''
                aide: Ligne × colonne.
    -   id: a02
        titre: Mon diagnostic de début d’année
        transition: Tu connais tes acquis. Reviens à ton objectif de départ.
        consigne: Tu vas vérifier si tu as atteint l’objectif fixé en S01, en citant une séance. On attend une réponse justifiée.
        contenu:
            -   type: etapes
                elements:
                    - Relis ton objectif de S01.
                    - L’as-tu atteint ?
                    - Justifie avec une séance où tu l’as travaillé.
            -   type: paragraphe
                texte: Pourquoi revenir au début ? Mesurer le chemin parcouru, c’est la meilleure preuve de progrès.
        questions:
            -   id: q01
                type: texte
                enonce: Rappelle ton objectif de S01. L’as-tu atteint ? Justifie avec une séance.
                aide: Pense à « car ».
    -   id: a03
        titre: Pour ma formation
        transition: Tu as fait le bilan. Regarde vers la suite.
        consigne: Tu vas relier deux compétences numériques acquises à la formation que tu as choisie. On attend deux compétences et leur usage.
        contenu:
            -   type: etapes
                elements:
                    - Pense à la formation choisie en S25.
                    - Choisis deux compétences numériques qui te serviront.
                    - Explique comment.
            -   type: paragraphe
                texte: Pourquoi relier ? Tu repars avec des outils utiles, pas seulement une note.
        questions:
            -   id: q01
                type: texte
                enonce: Quelles deux compétences numériques te serviront dans ta formation, et comment ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Pix continue au lycée.
        questions:
            -   id: q01
                type: texte
                enonce: Quel niveau Pix vises-tu en fin de lycée ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton bilan est fait. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quelles compétences numériques as-tu acquises au collège, et lesquelles te serviront dans ta formation ?'
                aide: Reprends les mots du problème.
retenir:
    - 'Bilan : Writer, Calc, programmation, multimédia, citoyenneté numérique.'
    - Des compétences utiles pour la suite.
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
