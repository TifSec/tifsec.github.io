titre: 'Séance 13 : Comment un message voyage sur internet ?'
themes:
    - Objectif 1 — S’approprier et utiliser un environnement informatique de travail
problematique: Comment une information va-t-elle d’un ordinateur à un autre sur internet ?
competences_bo:
    - Objectif 1 — S’approprier et utiliser un environnement informatique de travail
objectifs:
    connaissances:
        - Internet est un réseau de réseaux ; chaque appareil a une adresse IP.
        - Un message est découpé en paquets qui passent par des routeurs et sont rassemblés à l’arrivée.
    competences:
        - Décrire le chemin d’un message.
        - Distinguer internet et le web.
pourquoi:
    - En S12, tu as vu les adresses de sites.
    - Mais comment un mail envoyé de l’écurie arrive-t-il chez le vétérinaire ?
activites:
    -   id: a01
        titre: Le chemin d’un message
        consigne: Tu vas suivre le chemin d’un mail de l’écurie au vétérinaire sur le schéma du document 1. On attend les étapes dans l’ordre.
        contenu:
            -   type: code
                texte: '[Ordinateur écurie] → [Box] → (routeur) → (routeur) → (routeur) → [Box vétérinaire] → [Ordinateur vétérinaire]'
            -   type: etapes
                elements:
                    - Lis le schéma (document 1).
                    - Suis le message de l’ordinateur de l’écurie jusqu’au vétérinaire.
                    - Remets les étapes dans l’ordre.
            -   type: paragraphe
                texte: Pourquoi des routeurs ? Ils choisissent le chemin, comme un aiguillage, de réseau en réseau.
        questions:
            -   id: q01
                type: tableau
                enonce: Remets les étapes dans l’ordre (1 à 4).
                colonnes:
                    - Étape
                    - Ordre
                lignes:
                    -   - Les routeurs d’internet transmettent les paquets
                        - ''
                    -   - L’ordinateur de l’écurie découpe le message en paquets
                        - ''
                    -   - Le message arrive chez le vétérinaire, reconstitué
                        - ''
                    -   - La box de l’écurie envoie les paquets vers internet
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: Les paquets
        transition: Le message part. Mais il ne voyage pas en un seul morceau.
        consigne: Tu vas reconstituer un message découpé en paquets arrivés dans le désordre (document 2). On attend le message dans le bon ordre.
        contenu:
            -   type: liste
                elements:
                    - 'Paquet 3 : « droite, pouvez- »'
                    - 'Paquet 1 : « Tango boite »'
                    - 'Paquet 4 : « vous passer ? »'
                    - 'Paquet 2 : « patte avant »'
            -   type: etapes
                elements:
                    - 'Lis le document 2 : un message découpé en 4 paquets numérotés.'
                    - Les paquets arrivent dans le désordre.
                    - Remets le message dans l’ordre.
            -   type: paragraphe
                texte: 'Pourquoi numéroter ? Les paquets prennent des chemins différents : le numéro permet de les rassembler dans l’ordre.'
        questions:
            -   id: q01
                type: texte
                enonce: Remets les paquets du document 2 dans l’ordre et écris le message reconstitué.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a03
        titre: Internet ou web ?
        transition: Tu sais comment voyage un message. Mais internet et le web, est-ce pareil ?
        consigne: Tu vas classer trois usages selon qu’ils utilisent le web ou un autre service d’internet. On attend le bon classement.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis la définition : internet est le réseau ; le web est un service qui l’utilise (les sites).'
                    - Classe chaque usage.
                    - Réponds.
            -   type: paragraphe
                texte: Pourquoi distinguer ? Le mail, la visio ou les jeux en ligne utilisent internet sans être le web.
        questions:
            -   id: q01
                type: tableau
                enonce: Ces usages utilisent-ils le web (sites) ou un autre service d’internet ?
                colonnes:
                    - Usage
                    - Web ou autre service ?
                lignes:
                    -   - Consulter la fiche d’une race sur Équipédia
                        - ''
                    -   - Envoyer un mail au vétérinaire
                        - ''
                    -   - Appel vidéo avec le maréchal
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une adresse IP ressemble à 192.168.1.10.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi utilise-t-on des noms (ifce.fr) plutôt que des adresses IP ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais comment voyage un message. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment une information va-t-elle d’un ordinateur à un autre sur internet ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Internet : réseau de réseaux ; adresse IP ; paquets ; routeurs.'
    - Le web n’est qu’un service d’internet.
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
