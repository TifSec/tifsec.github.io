titre: 'Séance 27 : Une lettre de motivation pour mon stage'
themes:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
problematique: Comment rédiger une lettre de motivation convaincante et bien présentée ?
competences_bo:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
objectifs:
    connaissances:
        - 'Une lettre de motivation suit les normes de la lettre : expéditeur, destinataire, lieu et date, objet, formule d’appel, corps, formule de politesse, signature.'
        - 'Le corps dit : vous (l’entreprise), moi (mes atouts), nous (ce que je propose).'
    competences:
        - Mettre en page une lettre formelle.
        - Rédiger un corps en trois paragraphes.
pourquoi:
    - En S26, tu as fait ton CV.
    - On l’envoie toujours avec une lettre de motivation.
activites:
    -   id: a01
        titre: La mise en page d’une lettre
        consigne: Tu vas repérer la place des éléments d’une lettre formelle sur le modèle (document 1). On attend la place de trois éléments.
        contenu:
            -   type: code
                texte: "Prénom Nom                              \nAdresse, téléphone, mail\n                         Écurie du Moulin\n                         Adresse\n                         Lieu, le 12 janvier\nObjet : demande de stage\n\nMadame, Monsieur,\n   (vous) … (moi) … (nous) …\nVeuillez agréer, Madame, Monsieur, mes salutations distinguées.\n                                        Signature"
            -   type: etapes
                elements:
                    - Lis le modèle (document 1).
                    - Repère où se place chaque élément.
                    - Réponds.
            -   type: paragraphe
                texte: 'Pourquoi des règles ? Le lecteur sait où trouver l’objet, la date, la signature : la lettre a l’air sérieuse.'
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, où se place chaque élément ?
                colonnes:
                    - Élément
                    - Place
                lignes:
                    -   - Tes coordonnées
                        - ''
                    -   - Le destinataire
                        - ''
                    -   - L’objet
                        - ''
                aide: Ligne × colonne.
    -   id: a02
        titre: Le corps de la lettre
        transition: La mise en page est claire. Écris le contenu.
        consigne: Tu vas rédiger le corps de ta lettre en trois paragraphes (vous, moi, nous). On attend ton paragraphe « moi ».
        contenu:
            -   type: etapes
                elements:
                    - 'Paragraphe « vous » : pourquoi cette écurie ?'
                    - 'Paragraphe « moi » : tes qualités et ce que tu as déjà fait en stage.'
                    - 'Paragraphe « nous » : ce que tu proposes (dates, rencontre).'
            -   type: paragraphe
                texte: Pourquoi « vous » d’abord ? L’employeur veut savoir que tu t’intéresses à son entreprise, pas seulement à toi.
        questions:
            -   id: q01
                type: texte
                enonce: Écris ton paragraphe « moi ».
                aide: Combien d’éléments sont demandés ?
    -   id: a03
        titre: Mettre en page dans Writer
        transition: Le contenu est prêt. Mets la lettre en page.
        consigne: Tu vas mettre en page ta lettre dans Writer et l’exporter en PDF. On attend la méthode d’alignement et ta formule de politesse.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Writer ; enregistre sous 3e_S27_lettre_tonprenom.odt.
                    - Aligne le destinataire à droite (retrait ou tabulation).
                    - Justifie le corps du texte ; relis ; exporte en PDF.
            -   type: paragraphe
                texte: 'Pourquoi justifier le texte ? Les bords droits et gauches sont alignés : la lettre est plus soignée.'
        questions:
            -   id: q01
                type: qcm
                enonce: Comment aligner le bloc du destinataire à droite proprement ?
                choix:
                    -   id: a
                        texte: Avec un retrait de paragraphe ou une tabulation.
                    -   id: b
                        texte: Avec beaucoup d’espaces.
                    -   id: c
                        texte: En le mettant en gras.
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: texte
                enonce: Quelle formule de politesse as-tu écrite ?
                aide: « = » + fonction + plage.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un mail de candidature est plus court qu’une lettre.
        questions:
            -   id: q01
                type: texte
                enonce: Que mets-tu dans le corps du mail si la lettre est en pièce jointe ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ta lettre est prête. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment rédiger une lettre de motivation convaincante et bien présentée ?'
                aide: Reprends les mots du problème.
retenir:
    - 'Lettre : expéditeur, destinataire, date, objet, appel, corps, politesse, signature.'
    - 'Corps : vous, moi, nous.'
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
