titre: Comment organiser ses fichiers pour ne plus les perdre ?
theme: TIM — Comment organiser ses fichiers pour ne plus les perdre ?
problematique: Comment organiser ses fichiers pour ne plus les perdre ?
pourquoi: La partie située à la fin du nom d'un fichier, généralement après un point, s'appelle son extension.
application: apprendre à organiser correctement ses fichiers et ses dossiers afin de retrouver rapidement son travail.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Faire la différence entre un fichier et un dossier.
        - Comprendre le rôle d'une extension de fichier.
        - Comprendre l'intérêt d'une organisation en dossiers et sous-dossiers.
        - Comprendre qu'un même contenu peut exister sous plusieurs formats.
        - Comprendre la différence entre enregistrer et exporter un document.
    competences:
        - Créer une arborescence de dossiers.
        - Nommer correctement un fichier.
        - Déplacer et retrouver un fichier.
        - Identifier le type d'un fichier grâce à son extension.
        - Enregistrer un document Writer.
        - Exporter ce document au format PDF.
activites:
    - id: a01
      titre: Pour commencer
      contenu:
          - type: paragraphe
            texte: "Classe : 4e / 3e MFR"
          - type: paragraphe
            texte: "Durée : 50 minutes"
          - type: paragraphe
            texte: "Organisation : travail individuel"
          - type: paragraphe
            texte: "Outils : explorateur de fichiers et LibreOffice Writer"
          - type: paragraphe
            texte: "Mission : apprendre à organiser correctement ses fichiers et ses dossiers afin de retrouver rapidement son travail."
      questions: []
    - id: a04
      titre: Production attendue
      contenu:
          - type: paragraphe
            texte: "À la fin de la séance, vous devrez avoir créé :"
          - type: liste
            elements:
                - une arborescence de dossiers correctement organisée ;
                - 4e3e_S03_nom_prenom.odt ;
                - 4e3e_S03_nom_prenom.pdf.
          - type: paragraphe
            texte: Le fichier Writer devra être rendu dans l'espace indiqué par le professeur.
      questions: []
    - id: a05
      titre: 1. Fichier ou dossier ? – 5 minutes
      contenu:
          - type: paragraphe
            texte: Lorsque nous utilisons un ordinateur, nous manipulons principalement des fichiers et des dossiers.
          - type: liste
            elements:
                - "Un fichier contient des données : texte, image, son, vidéo, tableau, programme..."
                - Un dossier permet de ranger des fichiers ou d'autres dossiers.
      questions:
          - id: q01
            type: texte
            enonce: "Question 1 : indiquez si chaque élément est probablement un fichier ou un dossier."
          - id: q02
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Élément
                - Fichier ou dossier ?
            lignes:
                - - rapport_stage.odt
                  - ""
                - - Photos_stage
                  - ""
                - - presentation.odp
                  - ""
                - - Documents_TIM
                  - ""
                - - tableau_animaux.ods
                  - ""
            suite:
                - type: titre
                  texte: AIDE SI BESOIN – Fichier ou dossier ?
                - type: paragraphe
                  texte: "Indice 1/3 : observez attentivement les noms."
                - type: paragraphe
                  texte: "Indice 2/3 : certains éléments possèdent un point suivi de quelques lettres."
                - type: paragraphe
                  texte: "Indice 3/3 : .odt, .odp ou .ods sont des extensions de fichiers."
    - id: a06
      titre: 2. À quoi sert une extension ? – 5 minutes
      contenu:
          - type: paragraphe
            texte: La partie située à la fin du nom d'un fichier, généralement après un point, s'appelle son extension.
          - type: paragraphe
            texte: Elle permet notamment d'identifier son format.
          - type: tableau
            colonnes:
                - Extension
                - Type de fichier
                - Exemple de logiciel
            lignes:
                - - .odt
                  - Document texte OpenDocument
                  - LibreOffice Writer
                - - .ods
                  - Classeur OpenDocument
                  - LibreOffice Calc
                - - .odp
                  - Présentation OpenDocument
                  - LibreOffice Impress
                - - .pdf
                  - Document destiné notamment à la consultation
                  - Navigateur ou lecteur PDF
                - - .jpg / .png
                  - Image
                  - Visionneuse d'image / navigateur
      questions:
          - id: q01
            type: texte
            enonce: "Question 2 : quelle extension utiliseriez-vous pour :"
            suite:
                - type: paragraphe
                  texte: un document Writer que vous souhaitez encore modifier ;
                - type: paragraphe
                  texte: un tableau créé avec Calc ;
                - type: paragraphe
                  texte: une présentation créée avec Impress ;
          - id: q02
            type: texte
            enonce: une version terminée d'un document destinée surtout à être consultée ?
            suite:
                - type: titre
                  texte: AIDE SI BESOIN – Choisir l'extension
                - type: paragraphe
                  texte: "Indice 1/3 : regardez le tableau situé juste au-dessus."
                - type: paragraphe
                  texte: "Indice 2/3 : Writer, Calc et Impress n'utilisent pas la même extension."
                - type: paragraphe
                  texte: "Indice 3/3 : Writer = .odt, Calc = .ods, Impress = .odp, consultation = souvent .pdf."
    - id: a07
      titre: 3. Construire une arborescence – 10 minutes
      contenu:
          - type: paragraphe
            texte: Quand tous les fichiers sont placés au même endroit, il devient difficile de retrouver rapidement son travail.
          - type: paragraphe
            texte: Une solution consiste à créer une arborescence de dossiers.
          - type: paragraphe
            texte: "Dans votre espace personnel, créez l'organisation suivante :"
          - type: code
            texte: TIM └── 4e3e ├── Cours ├── Travaux │ └── S03 └── Ressources
          - type: titre
            texte: AIDE SI BESOIN – Créer l'arborescence
          - type: paragraphe
            texte: "Indice 1/3 : commencez uniquement par créer le dossier TIM."
          - type: paragraphe
            texte: "Indice 2/3 : ouvrez ensuite TIM avant de créer 4e3e."
          - type: paragraphe
            texte: "Indice 3/3 : dans 4e3e, créez Cours, Travaux et Ressources. Entrez ensuite dans Travaux pour créer S03."
      questions:
          - id: q01
            type: texte
            enonce: "Question 3 : où placeriez-vous les fichiers suivants ?"
          - id: q02
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Fichier
                - Dossier choisi
            lignes:
                - - 4e3e_S03_nom_prenom.odt
                  - ""
                - - fiche_aide_writer.pdf
                  - ""
                - - cours_extensions.pdf
                  - ""
    - id: a08
      titre: 4. Donner un nom utile à un fichier – 5 minutes
      contenu:
          - type: paragraphe
            texte: "Imaginez que le professeur reçoive les fichiers suivants :"
          - type: liste
            elements:
                - document.odt
                - travail.odt
                - sansnom1.odt
                - montravailfinalvraimentfinal2.odt
      questions:
          - id: q01
            type: texte
            enonce: "Question 4 : quels problèmes ces noms peuvent-ils provoquer ?"
            suite:
                - type: paragraphe
                  texte: "Nous utiliserons une règle de nommage simple :"
                - type: paragraphe
                  texte: classe_seance_nom_prenom.extension
                - type: paragraphe
                  texte: "Exemple :"
                - type: paragraphe
                  texte: 4e3e_S03_martin_lucas.odt
          - id: q02
            type: texte
            enonce: "Question 5 : corrigez les deux noms suivants :"
            suite:
                - type: etapes
                  elements:
                      - travail.odt pour Lucas Martin, séance 3 ;
                      - document.pdf pour Inès Durand, séance 3.
                - type: titre
                  texte: AIDE SI BESOIN – Nommer correctement un fichier
                - type: paragraphe
                  texte: "Indice 1/3 : reprenez le modèle classe_seance_nom_prenom."
                - type: paragraphe
                  texte: "Indice 2/3 : aujourd'hui, la séance est S03."
                - type: paragraphe
                  texte: "Indice 3/3 : exemple : 4e3e_S03_martin_lucas.odt."
    - id: a09
      titre: 5. Créer le document de travail – 10 minutes
      contenu:
          - type: paragraphe
            texte: Ouvrez LibreOffice Writer.
          - type: paragraphe
            texte: "Créez un nouveau document contenant :"
          - type: liste
            elements:
                - votre nom et votre prénom ;
                - votre classe ;
                - le titre Séance 3 – Organiser ses fichiers ;
                - vos réponses aux questions 1 à 5.
          - type: paragraphe
            texte: "Enregistrez le document dans :"
          - type: paragraphe
            texte: TIM > 4e3e > Travaux > S03
          - type: paragraphe
            texte: "sous le nom :"
          - type: paragraphe
            texte: 4e3e_S03_nom_prenom.odt
          - type: titre
            texte: AIDE SI BESOIN – Enregistrer au bon endroit
          - type: paragraphe
            texte: "Indice 1/3 : choisissez Enregistrer sous."
          - type: paragraphe
            texte: "Indice 2/3 : retrouvez d'abord votre dossier TIM."
          - type: paragraphe
            texte: "Indice 3/3 : ouvrez TIM → 4e3e → Travaux → S03 puis saisissez le nom demandé."
      questions: []
    - id: a10
      titre: 6. Même document, deux formats – 5 minutes
      contenu:
          - type: paragraphe
            texte: Votre fichier est actuellement au format ODT.
          - type: paragraphe
            texte: Il s'agit de votre fichier de travail Writer.
          - type: paragraphe
            texte: Nous allons maintenant créer une version au format PDF.
          - type: etapes
            elements:
                - Enregistrez d'abord votre travail avec Ctrl + S.
                - Utilisez la fonction d'export au format PDF.
                - Enregistrez le PDF dans le même dossier S03.
                - Nommez-le 4e3e_S03_nom_prenom.pdf.
      questions:
          - id: q01
            type: texte
            enonce: "Question 6 : pourquoi les deux fichiers ne sont-ils pas identiques alors qu'ils contiennent presque le même document ?"
    - id: a11
      titre: 7. Retrouver son fichier – 5 minutes
      contenu:
          - type: paragraphe
            texte: Fermez LibreOffice Writer.
          - type: paragraphe
            texte: Revenez dans le dossier TIM.
          - type: paragraphe
            texte: "Sans utiliser la liste des fichiers récents :"
          - type: etapes
            elements:
                - retrouvez votre dossier S03 ;
                - retrouvez votre fichier ODT ;
                - ouvrez-le ;
                - "ajoutez à la fin : Je sais retrouver un fichier dans une arborescence."
                - enregistrez avec Ctrl + S.
          - type: titre
            texte: AIDE SI BESOIN – Retrouver le fichier
          - type: paragraphe
            texte: "Indice 1/3 : commencez dans le dossier TIM."
          - type: paragraphe
            texte: "Indice 2/3 : souvenez-vous que votre travail se trouve dans le dossier Travaux."
          - type: paragraphe
            texte: "Indice 3/3 : suivez TIM → 4e3e → Travaux → S03."
      questions: []
    - id: a12
      titre: 8. Vérification et rendu – 5 minutes
      contenu:
          - type: paragraphe
            texte: Vérifiez votre dossier S03.
          - type: paragraphe
            texte: "Il doit contenir :"
          - type: liste
            elements:
                - 4e3e_S03_nom_prenom.odt
                - 4e3e_S03_nom_prenom.pdf
          - type: paragraphe
            texte: "Vérifiez également :"
          - type: liste
            elements:
                - Mon fichier possède le bon nom.
                - Il se trouve dans le bon dossier.
                - J'ai répondu aux questions.
                - Mon fichier ODT s'ouvre correctement.
                - Mon fichier PDF s'ouvre correctement.
          - type: paragraphe
            texte: "Déposez ensuite :"
          - type: paragraphe
            texte: 4e3e_S03_nom_prenom.odt
          - type: paragraphe
            texte: dans l'espace indiqué par le professeur.
          - type: paragraphe
            texte: Le fichier doit être rendu même si tout n'est pas terminé.
      questions: []
    - id: a13
      titre: Pour aller plus loin
      contenu:
          - type: paragraphe
            texte: Si vous avez terminé, comparez votre fichier ODT et votre fichier PDF.
          - type: paragraphe
            texte: "Observez leurs propriétés puis répondez :"
      questions:
          - id: q01
            type: texte
            enonce: "Question 7 :"
          - id: q02
            type: texte
            enonce: ont-ils la même extension ?
          - id: q03
            type: texte
            enonce: ont-ils exactement la même taille ?
          - id: q04
            type: texte
            enonce: quelles différences observez-vous ?
      facultatif: true
    - id: a14
      titre: À retenir
      contenu:
          - type: liste
            elements:
                - Un dossier sert à organiser des fichiers et d'autres dossiers.
                - Un fichier contient des données.
                - L'extension indique le format d'un fichier.
                - Une arborescence permet de ranger les documents de manière logique.
                - Un nom de fichier précis permet de retrouver et d'identifier plus facilement son travail.
                - Un fichier ODT peut servir de document de travail dans Writer.
                - Une version PDF peut être créée pour faciliter la consultation ou la transmission.
                - Je dois être capable de retrouver un fichier sans dépendre uniquement de la liste des documents récents.
      questions: []
    - id: a15
      titre: Référentiel
      contenu:
          - type: paragraphe
            texte: Cette séance permet notamment de travailler l'utilisation et la gestion d'un environnement informatique et des espaces de stockage.
          - type: paragraphe
            texte: "Source : ChloroFil – Classes de 4e et 3e de l'enseignement agricole ."
          - type: lien
            titre: ChloroFil – Classes de 4e et 3e de l'enseignement agricole
            url: https://chlorofil.fr/diplomes/secondaire/4e-3e
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
ressources:
    - type: paragraphe
      texte: Réalise les manipulations dans le logiciel demandé. Conserve tes fichiers sur ton espace habituel. Le site enregistre seulement tes réponses écrites, tes résultats, tes formules et tes démarches ; aucun fichier n’est téléversé.
introduction:
    - type: titre
      texte: Ce que vous allez apprendre
    - type: liste
      elements:
          - Faire la différence entre un fichier et un dossier.
          - Comprendre le rôle d'une extension de fichier.
          - Comprendre l'intérêt d'une organisation en dossiers et sous-dossiers.
          - Comprendre qu'un même contenu peut exister sous plusieurs formats.
          - Comprendre la différence entre enregistrer et exporter un document.
    - type: titre
      texte: Ce que vous allez apprendre à faire
    - type: liste
      elements:
          - Créer une arborescence de dossiers.
          - Nommer correctement un fichier.
          - Déplacer et retrouver un fichier.
          - Identifier le type d'un fichier grâce à son extension.
          - Enregistrer un document Writer.
          - Exporter ce document au format PDF.
reperes_officiels:
