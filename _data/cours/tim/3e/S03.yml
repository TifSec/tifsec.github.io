titre: 'Séance 3 : En-tête, pied de page et numéros de page'
themes:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
problematique: Comment donner une présentation professionnelle à toutes les pages d’un document ?
competences_bo:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
objectifs:
    connaissances:
        - 'L’en-tête et le pied de page se répètent sur chaque page : nom, titre, numéro de page.'
        - Un champ (numéro de page, date) se met à jour tout seul.
    competences:
        - Insérer un en-tête et un pied de page.
        - Insérer des champs (numéro de page, nombre de pages).
pourquoi:
    - En S02, ton rapport a un sommaire.
    - Pour qu’il ait l’air professionnel, chaque page doit porter ton nom et son numéro.
activites:
    -   id: a01
        titre: Ce qui se répète
        consigne: Tu vas repérer, sur le modèle de page du rapport (document 1), les éléments qui se répètent en haut et en bas. On attend la place de chaque élément.
        contenu:
            -   type: code
                texte: '┌──────────────────────────────────────┐

                    │ Manon L. — 3e        Rapport de stage │  ← haut de page

                    │                                      │

                    │   (texte du rapport)                 │

                    │                                      │

                    │              Page 3 sur 8            │  ← bas de page

                    └──────────────────────────────────────┘'
            -   type: etapes
                elements:
                    - Regarde le modèle de page (document 1).
                    - Repère ce qui est en haut et en bas de chaque page.
                    - Range ces éléments.
            -   type: paragraphe
                texte: Pourquoi répéter ? Si les pages sont imprimées et mélangées, on sait à qui elles sont et dans quel ordre les remettre.
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, où se trouve chaque élément ?
                colonnes:
                    - Élément
                    - En-tête ou pied de page ?
                lignes:
                    -   - Nom et classe de l’élève
                        - ''
                    -   - Titre du rapport
                        - ''
                    -   - Page 3 sur 8
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: Insérer les champs
        transition: Tu sais ce qui se répète. Insère-le dans ton rapport.
        consigne: Tu vas ajouter à ton rapport un en-tête et un pied de page avec les champs de numéro de page. On attend l’intérêt d’un champ et l’affichage sur une page.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre ton rapport de S02.
                    - 'Insertion > En-tête et pied de page > En-tête : écris ton prénom, ta classe et le titre.'
                    - Dans le pied de page, Insertion > Champ > Numéro de page, puis tape « sur » et Insertion > Champ > Nombre de pages.
                    - 'Fais défiler : chaque page porte son numéro.'
            -   type: paragraphe
                texte: Pourquoi un champ et pas un chiffre tapé ? Le chiffre tapé serait le même sur toutes les pages ; le champ s’adapte à chaque page.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi faut-il insérer un champ « numéro de page » plutôt que taper « 1 » ?
                aide: Une idée + « car » + une raison tirée de la séance.
            -   id: q02
                type: qcm
                enonce: Sur la 4e page d’un rapport de 9 pages, qu’affiche le pied de page ?
                choix:
                    -   id: a
                        texte: Page 4 sur 9
                    -   id: b
                        texte: Page 1 sur 9
                    -   id: c
                        texte: Page 4
                aide: Élimine d’abord les réponses impossibles.
    -   id: a03
        titre: Une page de garde sans numéro
        transition: Les pages sont numérotées. Reste la page de garde.
        consigne: Tu vas enlever l’en-tête de la page de garde grâce au style « Première page ». On attend le style utilisé et le résultat.
        contenu:
            -   type: etapes
                elements:
                    - La première page (page de garde) ne doit pas avoir d’en-tête.
                    - Sur la page 1, applique le style de page « Première page » (Format > Propriétés de la page ou barre latérale).
                    - 'Vérifie : page 1 sans en-tête, page 2 avec.'
            -   type: paragraphe
                texte: 'Pourquoi une page de garde nue ? Elle présente le rapport : le titre, une photo, ton nom, sans éléments répétés.'
        questions:
            -   id: q01
                type: texte
                enonce: Quel style de page as-tu appliqué à la page de garde, et quel est le résultat ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: On peut ajouter la date dans le pied de page.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle différence entre un champ date « fixe » et « variable » ?
                aide: 'Méthode : lis le programme bloc par bloc, comme une recette : 1) quand démarre ce bloc ? 2) quelle condition est vérifiée (si … alors) ? 3) quelle action en sortie (moteur, écran, son) ? Écris ta réponse avec ces trois éléments.'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton rapport a une présentation professionnelle. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment donner une présentation professionnelle à toutes les pages d’un document ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'En-tête et pied de page : répétés sur chaque page.'
    - 'Champs : numéro de page, nombre de pages, date.'
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
