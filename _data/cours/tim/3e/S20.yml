titre: 'Séance 20 : Exercice type DNB : lire et compléter un programme'
themes:
    - Objectif 5 — Découvrir l’analyse et le codage
problematique: Saurai-je analyser un programme comme au DNB ?
competences_bo:
    - Objectif 5 — Découvrir l’analyse et le codage
objectifs:
    connaissances:
        - Au DNB, on doit lire un programme, prévoir son résultat, le compléter et le corriger.
        - 'Réflexes : lire bloc par bloc (M9), justifier (M4), gérer son temps (M10).'
    competences:
        - Analyser un programme sans ordinateur.
        - Gérer son temps sur un exercice.
pourquoi:
    - De S16 à S19, tu as programmé la carte.
    - 'Aujourd’hui, entraînement en conditions DNB : 30 minutes, sans ordinateur.'
activites:
    -   id: a01
        titre: Lire le programme
        consigne: Tu vas analyser le programme de la mangeoire automatique (document 1), en conditions DNB. On attend la réaction de la carte et le rôle du capteur.
        contenu:
            -   type: citation
                texte: 'Réflexe DNB M10 : je gère mon temps : je lis tout le sujet, puis je donne environ 10 minutes à chaque partie.'
            -   type: code
                texte: "toujours\n    si niveau d’intensité lumineuse > 150 alors\n        servo P0 à 90°   (trappe ouverte)\n    sinon\n        servo P0 à 0°    (trappe fermée)"
            -   type: etapes
                elements:
                    - 'Lis le réflexe M10 : 10 minutes par partie.'
                    - Lis le programme de la mangeoire automatique (document 1).
                    - Réponds.
            -   type: paragraphe
                texte: 'Pourquoi minuter ? Au DNB, on doit répondre à tout : ne pas rester bloqué sur une question.'
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 1, que fait la carte si la lumière vaut 200 ?
                choix:
                    -   id: a
                        texte: Elle ouvre la trappe (servomoteur à 90°).
                    -   id: b
                        texte: Elle ferme la trappe.
                    -   id: c
                        texte: Rien.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: D’après le document 1, explique le rôle du capteur de lumière.
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
    -   id: a02
        titre: Compléter
        transition: Tu sais lire le programme. Complète-le.
        consigne: Tu vas compléter le programme de la mangeoire pour compter les ouvertures de la trappe. On attend le bloc et son emplacement.
        contenu:
            -   type: etapes
                elements:
                    - Le gérant veut compter les ouvertures de la trappe.
                    - 'Complète le programme : quel bloc, où ?'
                    - Justifie.
            -   type: paragraphe
                texte: Pourquoi justifier l’emplacement ? Le même bloc au mauvais endroit compte faux.
        questions:
            -   id: q01
                type: texte
                enonce: Quel bloc ajouter et où, pour compter les ouvertures de la trappe ?
                aide: 'Bloc par bloc : quand ? quelle condition ? quelle action ?'
    -   id: a03
        titre: Trouver le bogue
        transition: Le programme est complété. Mais le gérant signale un problème.
        consigne: Tu vas expliquer pourquoi le compteur de la mangeoire augmente sans arrêt et proposer une correction. On attend la cause et une correction.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis la remarque du gérant : « Le compteur augmente sans arrêt toute la journée. »'
                    - Relis le programme avec ton ajout.
                    - Explique la cause et propose une correction.
            -   type: paragraphe
                texte: Pourquoi ce bogue ? La boucle « toujours » répète l’ouverture tant qu’il fait jour.
        questions:
            -   id: q01
                type: texte
                enonce: Explique la cause du bogue et propose une correction.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: On veut que la trappe ne s’ouvre qu’une fois par jour.
        questions:
            -   id: q01
                type: texte
                enonce: Propose une solution.
                aide: 'Méthode : 1) relis le besoin ou le problème ; 2) propose une idée possible avec le matériel ou les données de la séance ; 3) dis en quoi elle répond au besoin (« Cela permet de… »).'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: L’entraînement est fini. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : saurais-tu analyser un programme comme au DNB ? Dis ce qui a marché et ce que tu dois revoir.'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'DNB : lire, prévoir, compléter, corriger un programme.'
    - 'Réflexe M10 : gérer son temps.'
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
