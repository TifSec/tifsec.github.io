titre: 'Séance 10 : La croissance d’un poulain : un graphique d’évolution'
themes:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
problematique: Comment montrer une évolution dans le temps et en tirer une information ?
competences_bo:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
objectifs:
    connaissances:
        - Un graphique en courbe (ou ligne) montre l’évolution d’une grandeur dans le temps.
        - On peut ajouter une deuxième série pour comparer à une référence.
    competences:
        - Créer un graphique en courbe avec deux séries.
        - Lire et interpréter une évolution.
pourquoi:
    - En 4e, tu as fait un diagramme en barres pour comparer.
    - 'Ici, on suit le poids d’un poulain mois après mois : c’est une évolution.'
activites:
    -   id: a01
        titre: Lire les données
        consigne: Tu vas lire les poids de Flocon et de la référence (document 1). On attend la prise de poids de Flocon et une comparaison à la référence.
        contenu:
            -   type: citation
                texte: 'Réflexe DNB M2 : je commence par « D’après le document… ».'
            -   type: tableau
                titre: Document 1 — Poids d’un poulain (données fictives, ordre de grandeur d’un cheval de selle)
                colonnes:
                    - Âge (mois)
                    - '1'
                    - '2'
                    - '3'
                    - '4'
                    - '5'
                    - '6'
                lignes:
                    -   - Flocon (kg)
                        - '95'
                        - '130'
                        - '160'
                        - '190'
                        - '220'
                        - '245'
                    -   - Référence (kg)
                        - '100'
                        - '140'
                        - '175'
                        - '205'
                        - '235'
                        - '260'
            -   type: etapes
                elements:
                    - 'Lis le document 1 : poids de Flocon et poids de référence.'
                    - Calcule la prise de poids de Flocon entre 1 et 6 mois.
                    - Compare avec la référence à 6 mois.
            -   type: paragraphe
                texte: Pourquoi une référence ? Elle dit si la croissance est normale ou s’il faut s’inquiéter.
        questions:
            -   id: q01
                type: nombre
                enonce: D’après le document 1, combien de kilos Flocon a-t-il pris entre 1 et 6 mois ?
                unite: kg
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: texte
                enonce: D’après le document 1, Flocon est-il au-dessus ou en dessous de la référence à 6 mois ? Justifie avec les valeurs.
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
    -   id: a02
        titre: Construire la courbe
        transition: Tu connais les valeurs. Montre-les en courbe.
        consigne: Tu vas construire dans Calc la courbe de croissance de Flocon avec la courbe de référence. On attend le titre, les axes et le type de graphique.
        contenu:
            -   type: etapes
                elements:
                    - Recopie le document 1 dans Calc ; enregistre sous 3e_S10_tonprenom.ods.
                    - Sélectionne les trois lignes.
                    - Insertion > Diagramme > Ligne > Points et lignes ; séries en lignes.
                    - Titre, axe horizontal « Âge (mois) », axe vertical « Poids (kg) ».
            -   type: paragraphe
                texte: 'Pourquoi une courbe ? Elle montre la tendance : la pente indique la vitesse de croissance.'
        questions:
            -   id: q01
                type: texte
                enonce: Écris le titre de ton graphique et les noms des deux axes.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
            -   id: q02
                type: qcm
                enonce: Quel type de graphique as-tu choisi ?
                choix:
                    -   id: a
                        texte: Ligne (courbe)
                    -   id: b
                        texte: Secteurs
                    -   id: c
                        texte: Barres
                aide: Élimine d’abord les réponses impossibles.
    -   id: a03
        titre: Interpréter
        transition: Le graphique est prêt. Que dit-il ?
        consigne: Tu vas interpréter l’écart entre la courbe de Flocon et la référence. On attend une tendance et un conseil justifié.
        contenu:
            -   type: etapes
                elements:
                    - Observe l’écart entre les deux courbes.
                    - Grandit-il, diminue-t-il, reste-t-il stable ?
                    - Propose ce que l’éleveur pourrait faire.
            -   type: paragraphe
                texte: 'Pourquoi interpréter ? Un graphique sert à décider : surveiller, changer l’alimentation, appeler le vétérinaire.'
        questions:
            -   id: q01
                type: texte
                enonce: D’après ton graphique, l’écart avec la référence augmente-t-il ? Que conseilles-tu à l’éleveur ? Justifie avec « car ».
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Calc peut ajouter une courbe de tendance.
        questions:
            -   id: q01
                type: texte
                enonce: À quoi sert-elle pour prévoir le poids à 8 mois ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton graphique raconte la croissance de Flocon. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment montrer une évolution dans le temps et en tirer une information ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Courbe = évolution dans le temps.
    - Comparer à une référence pour décider.
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
