titre: 'Séance 4 : Un tableau dans le rapport : le planning des soins'
themes:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
problematique: Comment présenter des informations en tableau dans un texte ?
competences_bo:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
objectifs:
    connaissances:
        - 'Un tableau dans Writer range des informations en lignes et colonnes : idéal pour un planning.'
        - On peut fusionner des cellules, ajuster les largeurs, colorer la ligne de titre et répéter l’en-tête sur chaque page.
    competences:
        - Insérer et remplir un tableau dans Writer.
        - Mettre en forme un tableau (fusion, ligne d’en-tête).
pourquoi:
    - En S03, ton rapport est mis en page.
    - 'Une partie présente le planning des soins de la semaine : un paragraphe serait illisible, un tableau est parfait.'
activites:
    -   id: a01
        titre: Texte ou tableau ?
        consigne: Tu vas chercher une information dans un planning écrit sous forme de paragraphe (document 1). On attend les soins du mercredi et l’intérêt d’un tableau.
        contenu:
            -   type: citation
                texte: 'Réflexe DNB M6 : je lis un tableau en croisant une ligne et une colonne.'
            -   type: paragraphe
                texte: Document 1 — « Le lundi, on fait le pansage complet et on vérifie les fers. Le mardi, pansage et graissage des sabots. Le mercredi, parage et curage des pieds puis douche des membres. Le jeudi, pansage complet. Le vendredi, vermifuge si prévu et nettoyage des boxes. »
            -   type: paragraphe
                texte: Données fictives créées pour l’exercice.
            -   type: etapes
                elements:
                    - Lis le paragraphe du document 1.
                    - 'Cherche une information précise : que fait-on le mercredi ?'
                    - 'Compare : serait-ce plus rapide dans un tableau ?'
            -   type: paragraphe
                texte: Pourquoi un tableau ? On lit en croisant le jour et le soin (réflexe M6), sans relire tout un paragraphe.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, quels soins sont faits le mercredi ?
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
            -   id: q02
                type: texte
                enonce: Pourquoi ces informations seraient-elles plus faciles à lire dans un tableau ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a02
        titre: Construire le tableau
        transition: Le paragraphe est difficile à lire. Transforme-le en tableau.
        consigne: Tu vas construire dans ton rapport le tableau du planning des soins, avec une ligne d’en-tête. On attend ses dimensions et son en-tête.
        contenu:
            -   type: etapes
                elements:
                    - 'Dans ton rapport, Tableau > Insérer un tableau : 2 colonnes, 6 lignes.'
                    - 'Ligne 1 : « Jour » et « Soins » ; puis un jour par ligne.'
                    - Mets la ligne 1 en gras sur fond coloré clair.
                    - Ajuste la largeur de la colonne « Jour ».
            -   type: paragraphe
                texte: Pourquoi une ligne d’en-tête colorée ? Elle dit ce que contient chaque colonne et se distingue des données.
        questions:
            -   id: q01
                type: texte
                enonce: Combien de lignes et de colonnes compte ton tableau, et qu’as-tu mis dans la première ligne ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a03
        titre: Fusionner et légender
        transition: Ton tableau est lisible. Ajoute un titre et une légende.
        consigne: Tu vas fusionner la première ligne pour y mettre un titre et ajouter une légende au tableau. On attend la méthode de fusion et ta légende.
        contenu:
            -   type: etapes
                elements:
                    - Ajoute une ligne en haut et fusionne ses deux cellules (Tableau > Fusionner les cellules).
                    - Écris-y « Planning des soins — semaine type ».
                    - Ajoute une légende sous le tableau (clic droit > Insérer une légende).
            -   type: paragraphe
                texte: Pourquoi fusionner ? Le titre du tableau s’étale sur toute la largeur, au-dessus des colonnes.
        questions:
            -   id: q01
                type: qcm
                enonce: Tu veux un titre sur toute la largeur du tableau. Que fais-tu ?
                choix:
                    -   id: a
                        texte: Je fusionne les cellules de la première ligne.
                    -   id: b
                        texte: J’élargis la première colonne.
                    -   id: c
                        texte: J’écris le titre dans chaque cellule.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Écris la légende de ton tableau.
                aide: 'Méthode : 1) relis la question et compte combien d’éléments sont demandés ; 2) cherche-les dans les documents ou dans « Ce que je retiens » ; 3) écris-les en phrase, un par un.'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un tableau peut continuer sur une deuxième page.
        questions:
            -   id: q01
                type: texte
                enonce: Comment répéter la ligne d’en-tête en haut de la page suivante ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton planning est en tableau. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment présenter des informations en tableau dans un texte ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Tableau Writer : en-tête, fusion, largeur, légende.'
    - On lit en croisant ligne et colonne (M6).
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
