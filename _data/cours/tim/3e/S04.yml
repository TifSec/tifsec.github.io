titre: Comment créer un document clair et professionnel ?
theme: TIM — Comment créer un document clair et professionnel ?
problematique: Comment créer un document clair et professionnel ?
pourquoi: "Objectif de cette séance : Comprendre qu'un document doit posséder une organisation visuelle cohérente."
application: transformer un texte brut en un document structuré, lisible et facile à modifier.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Comprendre qu'un document doit posséder une organisation visuelle cohérente.
        - Différencier un titre, un sous-titre et un paragraphe.
        - Comprendre l'intérêt des styles dans un traitement de texte.
        - Comprendre que la mise en forme doit faciliter la lecture.
        - Comprendre qu'une information importante doit ressortir sans surcharger le document.
    competences:
        - Créer et enregistrer un document avec LibreOffice Writer.
        - Utiliser les styles Titre et Titre 1.
        - Organiser un document en plusieurs parties.
        - Créer une liste à puces.
        - Mettre en valeur certaines informations.
        - Vérifier la cohérence générale d'une mise en page.
        - Exporter une version PDF.
activites:
    - id: a01
      titre: Pour commencer
      contenu:
          - type: paragraphe
            texte: "Classe : 4e / 3e MFR"
          - type: paragraphe
            texte: "Durée : 50 minutes"
          - type: paragraphe
            texte: "Organisation : travail individuel"
          - type: paragraphe
            texte: "Logiciel : LibreOffice Writer"
          - type: paragraphe
            texte: "Mission : transformer un texte brut en un document structuré, lisible et facile à modifier."
      questions: []
    - id: a04
      titre: Production attendue
      contenu:
          - type: paragraphe
            texte: Vous allez transformer un texte brut en une fiche claire et structurée concernant la sécurité pendant une activité professionnelle.
          - type: paragraphe
            texte: "À la fin de la séance, vous devrez avoir créé :"
          - type: liste
            elements:
                - 4e3e_S04_nom_prenom.odt ;
                - 4e3e_S04_nom_prenom.pdf.
          - type: paragraphe
            texte: Le fichier Writer devra être rendu dans l'espace indiqué par le professeur.
      questions: []
    - id: a05
      titre: 1. Qu'est-ce qu'un document facile à lire ? – 5 minutes
      contenu:
          - type: paragraphe
            texte: Imaginez deux documents contenant exactement les mêmes informations.
          - type: paragraphe
            texte: "Document A :"
          - type: liste
            elements:
                - tout le texte possède la même taille ;
                - aucun titre ne ressort ;
                - les paragraphes sont peu séparés ;
                - aucune information n'est mise en valeur.
          - type: paragraphe
            texte: "Document B :"
          - type: liste
            elements:
                - un titre principal est clairement visible ;
                - les différentes parties possèdent des sous-titres ;
                - les paragraphes sont séparés ;
                - certaines informations importantes ressortent.
      questions:
          - id: q01
            type: texte
            enonce: "Question 1 : quel document sera probablement le plus facile à lire ? Expliquez pourquoi."
            suite:
                - type: titre
                  texte: AIDE SI BESOIN – Réfléchir à la lisibilité
                - type: paragraphe
                  texte: "Indice 1/3 : dans quel document retrouvez-vous plus facilement une information précise ?"
                - type: paragraphe
                  texte: "Indice 2/3 : les titres permettent de séparer les différentes parties."
                - type: paragraphe
                  texte: "Indice 3/3 : le document B est plus facile à lire car les informations sont hiérarchisées et organisées."
    - id: a06
      titre: 2. Créer le document de travail – 5 minutes
      contenu:
          - type: paragraphe
            texte: Ouvrez LibreOffice Writer.
          - type: paragraphe
            texte: "Créez le dossier :"
          - type: paragraphe
            texte: TIM > 4e3e > Travaux > S04
          - type: paragraphe
            texte: "Enregistrez immédiatement votre document sous le nom :"
          - type: paragraphe
            texte: 4e3e_S04_nom_prenom.odt
          - type: titre
            texte: AIDE SI BESOIN – Créer et enregistrer le fichier
          - type: paragraphe
            texte: "Indice 1/3 : retrouvez le dossier TIM créé lors de la séance précédente."
          - type: paragraphe
            texte: "Indice 2/3 : ouvrez TIM → 4e3e → Travaux puis créez le dossier S04."
          - type: paragraphe
            texte: "Indice 3/3 : utilisez Fichier → Enregistrer sous puis saisissez le nom demandé."
      questions: []
    - id: a07
      titre: 3. Copier le texte brut – 5 minutes
      contenu:
          - type: paragraphe
            texte: Recopiez ou copiez le texte suivant dans votre document.
          - type: paragraphe
            texte: Pour le moment, ne modifiez pas sa mise en forme.
          - type: citation
            texte: Sécurité pendant une activité professionnelle Avant de commencer Une activité professionnelle peut comporter des risques. Avant de commencer une tâche, il faut prendre connaissance des consignes, identifier les dangers possibles et vérifier que le matériel utilisé est adapté. Les équipements de protection Selon l'activité réalisée, certains équipements de protection peuvent être nécessaires. Il peut par exemple s'agir de chaussures de sécurité, de gants, de lunettes de protection ou de protections auditives. En cas de problème Il ne faut pas essayer de réparer seul une machine ou un équipement que l'on ne connaît pas. En cas de problème, il faut arrêter l'activité si cela peut être fait sans danger puis prévenir le responsable ou le maître de stage. Les bons réflexes respecter les consignes utiliser le matériel prévu porter les protections demandées signaler un problème garder son espace de travail propre
          - type: paragraphe
            texte: "VIGILANCE : ce texte est un support pédagogique général. Les règles réelles de sécurité dépendent toujours de l'activité, de l'entreprise, du matériel utilisé et des consignes données par les responsables."
      questions: []
    - id: a08
      titre: 4. Donner une structure au document – 10 minutes
      contenu:
          - type: paragraphe
            texte: "Un document bien construit doit permettre de comprendre immédiatement :"
          - type: liste
            elements:
                - le sujet général ;
                - les différentes parties ;
                - les informations importantes.
          - type: paragraphe
            texte: Dans Writer, les styles permettent de donner un rôle et une présentation cohérente aux différents éléments du document.
          - type: paragraphe
            texte: "Appliquez :"
          - type: liste
            elements:
                - le style Titre à « Sécurité pendant une activité professionnelle » ;
                - le style Titre 1 à « Avant de commencer » ;
                - le style Titre 1 à « Les équipements de protection » ;
                - le style Titre 1 à « En cas de problème » ;
                - le style Titre 1 à « Les bons réflexes ».
          - type: paragraphe
            texte: Les paragraphes explicatifs doivent rester en texte normal ou en Corps de texte.
          - type: titre
            texte: AIDE SI BESOIN – Appliquer un style
          - type: paragraphe
            texte: "Indice 1/3 : placez le curseur dans le titre que vous voulez modifier."
          - type: paragraphe
            texte: "Indice 2/3 : cherchez la liste des styles dans la barre d'outils de Writer."
          - type: paragraphe
            texte: "Indice 3/3 : sélectionnez Titre pour le titre principal et Titre 1 pour les différentes parties."
      questions: []
    - id: a09
      titre: 5. Transformer une série d'actions en liste – 5 minutes
      contenu:
          - type: paragraphe
            texte: Dans la partie Les bons réflexes, transformez les cinq lignes en une liste à puces.
          - type: paragraphe
            texte: "Vous devez obtenir :"
          - type: liste
            elements:
                - respecter les consignes ;
                - utiliser le matériel prévu ;
                - porter les protections demandées ;
                - signaler un problème ;
                - garder son espace de travail propre.
      questions:
          - id: q01
            type: texte
            enonce: "Question 2 : pourquoi une liste à puces est-elle plus adaptée qu'un seul long paragraphe dans cette partie ?"
            suite:
                - type: titre
                  texte: AIDE SI BESOIN – Créer une liste à puces
                - type: paragraphe
                  texte: "Indice 1/3 : sélectionnez les cinq lignes."
                - type: paragraphe
                  texte: "Indice 2/3 : cherchez l'outil permettant de créer une liste."
                - type: paragraphe
                  texte: "Indice 3/3 : utilisez le bouton Liste à puces de Writer."
    - id: a10
      titre: 6. Mettre en valeur sans tout mettre en valeur – 5 minutes
      contenu:
          - type: paragraphe
            texte: "Dans la partie En cas de problème, mettez uniquement en gras :"
          - type: liste
            elements:
                - arrêter l'activité ;
                - prévenir le responsable ou le maître de stage.
      questions:
          - id: q01
            type: texte
            enonce: "Question 3 : pourquoi ne faut-il pas mettre tout le paragraphe en gras ?"
            suite:
                - type: titre
                  texte: AIDE SI BESOIN – Comprendre la mise en valeur
                - type: paragraphe
                  texte: "Indice 1/3 : le gras sert à attirer le regard."
                - type: paragraphe
                  texte: "Indice 2/3 : imaginez que tous les mots du paragraphe soient importants de la même manière."
                - type: paragraphe
                  texte: "Indice 3/3 : si tout est en gras, plus rien ne ressort réellement."
    - id: a11
      titre: 7. Repérer une mauvaise mise en page – 5 minutes
      contenu:
          - type: paragraphe
            texte: "Imaginez maintenant un document possédant les caractéristiques suivantes :"
          - type: liste
            elements:
                - le titre principal est écrit en taille 12 ;
                - un paragraphe entier est en gras ;
                - un sous-titre est rouge, un autre bleu et un autre vert ;
                - trois polices différentes sont utilisées ;
                - certaines lignes sont centrées sans raison ;
                - les cinq bons réflexes sont écrits dans un seul paragraphe.
      questions:
          - id: q01
            type: texte
            enonce: "Question 4 : proposez trois modifications permettant de rendre ce document plus facile à lire."
            suite:
                - type: titre
                  texte: AIDE SI BESOIN – Trouver des améliorations
                - type: paragraphe
                  texte: "Indice 1/3 : commencez par regarder le titre principal."
                - type: paragraphe
                  texte: "Indice 2/3 : observez ensuite les couleurs, les polices et le gras."
                - type: paragraphe
                  texte: "Indice 3/3 : vous pouvez agrandir le titre, uniformiser les sous-titres, réduire les couleurs, utiliser une liste et limiter le gras."
    - id: a12
      titre: 8. Vérifier et finaliser son document – 5 minutes
      contenu:
          - type: paragraphe
            texte: Relisez maintenant votre document.
          - type: paragraphe
            texte: "Vérifiez :"
          - type: liste
            elements:
                - Le titre principal est clairement identifiable.
                - Les quatre parties utilisent le même style de sous-titre.
                - Les paragraphes sont clairement séparés.
                - Les bons réflexes sont présentés sous forme de liste.
                - Les informations importantes sont mises en valeur sans excès.
                - Je n'ai pas utilisé de nombreuses couleurs ou polices sans raison.
                - Mon fichier porte le bon nom.
          - type: paragraphe
            texte: "Enregistrez votre travail avec :"
          - type: paragraphe
            texte: Ctrl + S
      questions: []
    - id: a13
      titre: 9. Exporter et rendre son travail – 5 minutes
      contenu:
          - type: paragraphe
            texte: Exportez maintenant votre document au format PDF.
          - type: paragraphe
            texte: "Enregistrez-le dans le même dossier :"
          - type: paragraphe
            texte: TIM > 4e3e > Travaux > S04
          - type: paragraphe
            texte: "sous le nom :"
          - type: paragraphe
            texte: 4e3e_S04_nom_prenom.pdf
          - type: paragraphe
            texte: "Votre dossier doit donc contenir :"
          - type: liste
            elements:
                - 4e3e_S04_nom_prenom.odt ;
                - 4e3e_S04_nom_prenom.pdf.
          - type: paragraphe
            texte: "Déposez ensuite :"
          - type: paragraphe
            texte: 4e3e_S04_nom_prenom.odt
          - type: paragraphe
            texte: dans l'espace demandé par le professeur.
          - type: paragraphe
            texte: Le travail doit être rendu même s'il n'est pas totalement terminé.
      questions: []
    - id: a14
      titre: Pour aller plus loin
      contenu:
          - type: paragraphe
            texte: "Si vous avez terminé, réalisez le défi suivant :"
          - type: paragraphe
            texte: ouvrez le panneau ou la liste des Styles ;
          - type: paragraphe
            texte: repérez le style Titre 1 ;
          - type: paragraphe
            texte: observez combien de parties de votre document utilisent ce style ;
      questions:
          - id: q01
            type: texte
            enonce: expliquez pourquoi l'utilisation d'un même style est intéressante.
            suite: []
          - id: q02
            type: texte
            enonce: "Question 5 : quel est selon vous le principal avantage des styles ?"
      facultatif: true
    - id: a15
      titre: À retenir
      contenu:
          - type: liste
            elements:
                - La mise en forme doit aider le lecteur à comprendre le document.
                - Un document est organisé avec un titre, des sous-titres et des paragraphes.
                - Une liste à puces est adaptée à une série d'éléments de même niveau.
                - Le gras doit être utilisé pour faire ressortir seulement certaines informations.
                - Les styles permettent de conserver une présentation cohérente.
                - Multiplier les couleurs, les polices ou les effets ne rend pas forcément un document plus lisible.
                - Le fichier ODT reste le document de travail.
                - Le fichier PDF constitue une version exportée adaptée notamment à la consultation.
      questions: []
    - id: a16
      titre: Référentiel
      contenu:
          - type: paragraphe
            texte: Cette séance participe notamment au travail sur la création, la production, le traitement et l'exploitation de documents numériques.
          - type: paragraphe
            texte: "Source : ChloroFil – Classes de 4e et 3e de l'enseignement agricole ."
          - type: lien
            titre: ChloroFil – Classes de 4e et 3e de l'enseignement agricole
            url: https://chlorofil.fr/diplomes/secondaire/4e-3e
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
ressources:
    - type: paragraphe
      texte: Réalise les manipulations dans le logiciel demandé. Conserve tes fichiers sur ton espace habituel. Le site enregistre seulement tes réponses écrites, tes résultats, tes formules et tes démarches ; aucun fichier n’est téléversé.
