titre: 'Séance 14 : La page du club sur les réseaux sociaux'
themes:
    - Objectif 4 — Adopter une attitude responsable dans une société démocratique
problematique: Comment communiquer pour une structure équestre sur les réseaux sociaux de façon professionnelle ?
competences_bo:
    - Objectif 4 — Adopter une attitude responsable dans une société démocratique
objectifs:
    connaissances:
        - Une publication professionnelle respecte le droit à l’image, a un ton correct et une information vérifiée.
        - 'L’e-réputation : l’image d’une personne ou d’une entreprise en ligne.'
    competences:
        - Rédiger une publication professionnelle.
        - Réagir à un commentaire négatif.
pourquoi:
    - En 4e, tu as vu le droit à l’image.
    - 'En stage, on peut te demander de publier pour l’écurie : ce n’est pas comme ton compte perso.'
activites:
    -   id: a01
        titre: Perso ou pro ?
        consigne: Tu vas comparer deux publications pour la page d’un centre équestre (document 1). On attend la publication qui convient et deux raisons.
        contenu:
            -   type: liste
                elements:
                    - 'Publication A : « Mdr Lucas a encore chuté 😂😂 » avec une photo de l’enfant au sol.'
                    - 'Publication B : « Stage poney du 21 au 25 avril, de 9 h à 16 h, à partir de 6 ans. Inscriptions à l’accueil ! » avec une photo des poneys au pré.'
            -   type: etapes
                elements:
                    - Lis les deux publications (document 1).
                    - Repère ce qui convient à une entreprise et ce qui ne convient pas.
                    - Réponds.
            -   type: paragraphe
                texte: 'Pourquoi une différence ? Une publication de l’écurie engage l’entreprise : clients, image, droit.'
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, quelle publication convient à la page du centre équestre ? Donne deux raisons.
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
    -   id: a02
        titre: Rédiger une publication
        transition: Tu sais ce qui est professionnel. Rédige ta publication.
        consigne: Tu vas rédiger une publication professionnelle pour un événement du centre équestre. On attend le texte et la photo choisie.
        contenu:
            -   type: etapes
                elements:
                    - Choisis un événement du centre (concours, journée portes ouvertes, naissance d’un poulain).
                    - 'Écris une publication : quoi, quand, où, pour qui.'
                    - Précise la photo choisie et pourquoi tu as le droit de la publier.
            -   type: paragraphe
                texte: Pourquoi préciser la photo ? Sans accord des personnes ou de l’auteur, la publication est illégale.
        questions:
            -   id: q01
                type: texte
                enonce: Écris ta publication et décris la photo qui l’accompagne.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a03
        titre: Un commentaire négatif
        transition: Ta publication est en ligne. Un client n’est pas content.
        consigne: Tu vas choisir comment le club répond au commentaire d’une cliente mécontente (document 2). On attend la bonne réponse et son effet sur l’e-réputation.
        contenu:
            -   type: citation
                texte: Document 2 — « Cours annulé sans prévenir, très déçue !! »
            -   type: etapes
                elements:
                    - Lis le commentaire d’un client mécontent (document 2).
                    - Choisis la réponse professionnelle.
                    - Explique ton choix.
            -   type: paragraphe
                texte: 'Pourquoi répondre calmement ? Tout le monde lit la réponse : elle construit la réputation du club.'
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 2, quelle réponse le club doit-il publier ?
                choix:
                    -   id: a
                        texte: « Nous sommes désolés. Pouvez-vous nous appeler pour en parler ? »
                    -   id: b
                        texte: « Si vous n’êtes pas content, allez ailleurs ! »
                    -   id: c
                        texte: Supprimer le commentaire et bloquer la personne.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Pourquoi cette réponse protège-t-elle l’e-réputation du club ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un employé publie sur son compte perso des critiques sur son patron.
        questions:
            -   id: q01
                type: texte
                enonce: Quels risques prend-il ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais communiquer pour un club. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment communiquer pour une structure équestre sur les réseaux sociaux de façon professionnelle ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Publication pro : utile, polie, droits respectés.'
    - 'E-réputation : répondre calmement.'
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
