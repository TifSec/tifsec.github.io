titre: 'Séance 11 : Le fichier clients du centre équestre : mes données personnelles'
themes:
    - Objectif 4 — Adopter une attitude responsable dans une société démocratique
problematique: Quelles données personnelles une entreprise peut-elle garder, et quels sont nos droits ?
competences_bo:
    - Objectif 4 — Adopter une attitude responsable dans une société démocratique
objectifs:
    connaissances:
        - Une donnée personnelle permet d’identifier une personne (nom, téléphone, photo, adresse IP).
        - Le RGPD impose de ne collecter que les données utiles, de les protéger, et donne des droits (accès, rectification, effacement).
    competences:
        - Reconnaître une donnée personnelle.
        - Appliquer le principe de minimisation.
pourquoi:
    - En 4e, tu as vu tes traces en ligne.
    - 'Le centre équestre crée un fichier clients : que peut-il y mettre ?'
activites:
    -   id: a01
        titre: Personnelle ou non ?
        consigne: Tu vas dire si quatre informations d’un centre équestre sont des données personnelles. On attend « oui » ou « non » pour chacune.
        contenu:
            -   type: etapes
                elements:
                    - Lis la liste des informations (tableau).
                    - 'Demande-toi : permet-elle de retrouver une personne ?'
                    - Réponds oui ou non.
            -   type: paragraphe
                texte: Pourquoi cette question ? Si une information identifie quelqu’un, la loi la protège.
        questions:
            -   id: q01
                type: tableau
                enonce: Ces informations sont-elles des données personnelles ? Écris « oui » ou « non ».
                colonnes:
                    - Information
                    - Donnée personnelle ?
                lignes:
                    -   - Le numéro de téléphone d’un cavalier
                        - ''
                    -   - La photo d’un cavalier reconnaissable
                        - ''
                    -   - Le nombre de poneys du club
                        - ''
                    -   - L’adresse mail prenom.nom@…
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: Seulement ce qui est utile
        transition: Tu reconnais une donnée personnelle. Lesquelles le centre peut-il garder ?
        consigne: Tu vas vérifier le formulaire d’inscription du gérant (document 1) et repérer les informations inutiles. On attend ces informations et la règle qui les interdit.
        contenu:
            -   type: liste
                elements:
                    - Nom et prénom du cavalier.
                    - Date de naissance.
                    - Téléphone d’un parent en cas d’urgence.
                    - Numéro de licence FFE.
                    - Religion.
                    - Métier des parents.
            -   type: lien
                titre: CNIL — Les bons réflexes pour protéger ses données (Éducnum)
                url: https://www.cnil.fr/fr/education
            -   type: etapes
                elements:
                    - Lis le formulaire d’inscription imaginé par le gérant (document 1).
                    - 'Pour chaque information, demande-toi : en a-t-il besoin pour donner des cours ?'
                    - Barre ce qui est inutile.
            -   type: paragraphe
                texte: 'Pourquoi minimiser ? Moins on collecte, moins on risque en cas de fuite : c’est une règle du RGPD.'
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, quelles informations le gérant n’a-t-il pas le droit de demander, car inutiles ? Justifie.
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
    -   id: a03
        titre: Mes droits
        transition: Le centre ne garde que l’utile. Et toi, que peux-tu demander ?
        consigne: Tu vas choisir le droit du RGPD (document 2) qui répond à trois situations de cavalier. On attend un droit pour chaque situation.
        contenu:
            -   type: tableau
                titre: Document 2 — Trois droits du RGPD
                colonnes:
                    - Droit
                    - Il permet de…
                lignes:
                    -   - Accès
                        - savoir quelles données sont gardées
                    -   - Rectification
                        - corriger une donnée fausse
                    -   - Effacement
                        - faire supprimer ses données
            -   type: etapes
                elements:
                    - 'Lis le document 2 : trois droits du RGPD.'
                    - Associe chaque situation au droit à utiliser.
                    - Réponds.
            -   type: paragraphe
                texte: Pourquoi connaître ses droits ? Tu peux savoir ce qu’une entreprise sait de toi et le faire corriger ou effacer.
        questions:
            -   id: q01
                type: tableau
                enonce: Quel droit utiliser dans chaque situation ?
                colonnes:
                    - Situation
                    - Droit
                lignes:
                    -   - Je veux savoir ce que le club a sur moi
                        - ''
                    -   - Mon numéro de téléphone a changé
                        - ''
                    -   - J’ai quitté le club et je veux qu’il supprime mes données
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le fichier clients est dans un tableur sur l’ordinateur de l’accueil.
        questions:
            -   id: q01
                type: texte
                enonce: Propose deux mesures pour le protéger.
                aide: Action → résultat attendu → résultat observé ; une seule chose à la fois.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu connais les règles du fichier clients. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quelles données personnelles une entreprise peut-elle garder, et quels sont nos droits ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Donnée personnelle = identifie une personne.
    - 'RGPD : seulement l’utile ; droits d’accès, rectification, effacement.'
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
