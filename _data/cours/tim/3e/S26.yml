titre: 'Séance 26 : Mon CV pour un stage en écurie'
themes:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
problematique: Comment présenter son parcours de façon claire et professionnelle dans un CV ?
competences_bo:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
objectifs:
    connaissances:
        - 'Un CV tient sur une page : coordonnées, formation, expériences (stages), compétences, centres d’intérêt.'
        - Une mise en page sobre et une adresse mail correcte font sérieux.
    competences:
        - Construire un CV structuré dans Writer.
        - Choisir les informations utiles.
pourquoi:
    - En S25, tu as choisi une formation. Pour trouver un stage ou une place en alternance, il faut un CV.
    - Tu réutilises ce que tu sais de Writer (styles, tableaux).
activites:
    -   id: a01
        titre: Les rubriques du CV
        consigne: Tu vas repérer les erreurs du CV de Maël, un élève qui cherche un stage en écurie (document 1). On attend deux erreurs précises.
        contenu:
            -   type: liste
                elements:
                    - 'Maël X — mail : bgdu42@mail.fr'
                    - 'Formation : 3e à la MFR'
                    - 'Centres d’intérêt : dormir, jeux vidéo'
                    - (aucune rubrique stages)
                    - 'Photo : selfie à la plage'
            -   type: etapes
                elements:
                    - Lis le CV de Maël (document 1).
                    - Repère les rubriques.
                    - Trouve ce qui ne va pas.
                    - 'Pourquoi des rubriques ? Le recruteur lit un CV en quelques secondes : il doit trouver vite chaque information.'
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, cite deux erreurs du CV de Maël.
                aide: 'Dans le document 1, regarde le CV de Maël avec les yeux d’un employeur : l’adresse mail, les rubriques, la photo.'
    -   id: a02
        titre: Construire mon CV
        transition: Tu connais les erreurs à éviter. Construis ton CV.
        consigne: Tu vas construire ton CV dans Writer avec ses rubriques et tes vrais stages. On attend ta rubrique « Stages ».
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Writer ; enregistre sous 3e_S26_CV_tonprenom.odt.
                    - 'Crée les rubriques en Titre 2 : Formation, Stages, Compétences, Centres d’intérêt.'
                    - Remplis avec tes vrais stages (structure, dates, tâches).
                    - Pourquoi détailler les tâches ? « Stage en écurie » dit peu ; « pansage, soins, sortie au paddock » montre ce que tu sais faire.
        questions:
            -   id: q01
                type: texte
                enonce: Recopie ta rubrique « Stages » telle qu’elle est dans ton CV.
                aide: 'Recopie ta rubrique « Stages » : lieu, dates, puis deux tâches précises par stage.'
    -   id: a03
        titre: Relire et exporter
        transition: Ton CV est rempli. Vérifie-le avant de l’envoyer.
        consigne: Tu vas relire ton CV avec le réflexe M8 et l’exporter en PDF. On attend ta correction et le nom du fichier.
        contenu:
            -   type: citation
                texte: 'Réflexe DNB M8 : je relis : orthographe, une page, informations à jour.'
            -   type: etapes
                elements:
                    - Lis le réflexe M8.
                    - 'Vérifie : une page, pas de faute, mail sérieux.'
                    - Exporte en PDF.
                    - Pourquoi un PDF ? Le CV s’affichera pareil chez l’employeur, quel que soit son logiciel.
        questions:
            -   id: q01
                type: texte
                enonce: Qu’as-tu corrigé en te relisant, et sous quel nom as-tu exporté ton CV ?
                aide: Note une correction faite en relisant (orthographe, longueur, information manquante), puis le nom exact du PDF.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Certains employeurs reçoivent les CV par mail.
        questions:
            -   id: q01
                type: texte
                enonce: Écris l’objet du mail pour envoyer ton CV.
                aide: L’objet du mail dit en quelques mots ce que tu demandes, pour quel poste, et qui tu es.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton CV est prêt. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment présenter son parcours de façon claire et professionnelle dans un CV ?'
                aide: 'Cite ce qui rend un CV professionnel : rubriques claires, stages détaillés, une page, relu, en PDF.'
retenir:
    - 'CV : coordonnées, formation, stages, compétences, intérêts.'
    - Une page, sobre, relu, PDF.
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
