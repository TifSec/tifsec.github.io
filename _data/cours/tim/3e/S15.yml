titre: 'Séance 15 : L’intelligence artificielle : une aide ou un piège ?'
themes:
    - Objectif 3 — Répondre à un besoin d’information, analyser sa qualité et communiquer
    - Objectif 4 — Adopter une attitude responsable dans une société démocratique
problematique: Comment utiliser une intelligence artificielle générative avec un esprit critique ?
competences_bo:
    - Objectif 3 — Répondre à un besoin d’information, analyser sa qualité et communiquer
objectifs:
    connaissances:
        - Une IA générative produit un texte ou une image à partir d’exemples ; elle peut se tromper avec assurance.
        - On vérifie toujours ses réponses avec une source fiable et on dit qu’on l’a utilisée.
    competences:
        - Repérer une erreur dans une réponse d’IA.
        - Fixer des règles d’usage.
pourquoi:
    - En 4e, tu as appris à vérifier une information.
    - 'Aujourd’hui, des élèves utilisent des IA pour faire leurs devoirs : est-ce fiable ?'
activites:
    -   id: a01
        titre: L’IA peut se tromper
        consigne: Tu vas comparer la réponse d’une IA sur le poney Shetland (document 1) à une source fiable (document 2). On attend l’erreur et la bonne valeur.
        contenu:
            -   type: citation
                texte: 'Document 1 — Réponse d’une IA (exemple construit) : « Le poney Shetland est originaire d’Écosse et peut mesurer jusqu’à 1,40 m au garrot. »'
            -   type: citation
                texte: 'Document 2 — Extrait adapté d’Équipédia : « Shetland : originaire des îles Shetland (Écosse), taille inférieure à 1,07 m. »'
            -   type: lien
                titre: IFCE — Équipédia (fiches techniques sur le cheval)
                url: https://equipedia.ifce.fr/
            -   type: etapes
                elements:
                    - Lis la réponse donnée par une IA (document 1).
                    - Compare avec l’extrait d’Équipédia (document 2).
                    - Trouve l’erreur.
            -   type: paragraphe
                texte: 'Pourquoi l’IA se trompe ? Elle prédit des mots probables, sans vérifier : la réponse peut sonner juste et être fausse.'
        questions:
            -   id: q01
                type: texte
                enonce: D’après les documents 1 et 2, quelle erreur l’IA a-t-elle faite ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a02
        titre: Utile pour quoi ?
        transition: L’IA peut se tromper. Alors, à quoi peut-elle servir ?
        consigne: Tu vas classer quatre usages d’une IA comme utiles ou risqués. On attend un avis pour chaque usage.
        contenu:
            -   type: etapes
                elements:
                    - Lis les usages proposés.
                    - Pour chacun, dis si l’IA est une aide utile, ou si c’est risqué ou interdit.
                    - Réponds.
            -   type: paragraphe
                texte: Pourquoi trier ? L’IA aide pour des idées ou reformuler, mais copier une réponse sans comprendre ne t’apprend rien.
        questions:
            -   id: q01
                type: tableau
                enonce: Pour chaque usage, écris « utile » ou « risqué ».
                colonnes:
                    - Usage
                    - Utile ou risqué ?
                lignes:
                    -   - Trouver des idées de titre pour une affiche
                        - ''
                    -   - Copier la réponse d’un exercice noté sans la lire
                        - ''
                    -   - Demander la dose d’un médicament pour un cheval
                        - ''
                    -   - Reformuler une phrase de mon rapport que j’ai écrite
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a03
        titre: Nos règles
        transition: Tu sais ce qui est utile ou risqué. Écris des règles.
        consigne: Tu vas écrire deux règles d’usage de l’intelligence artificielle pour la classe. On attend deux règles commençant par « Je… ».
        contenu:
            -   type: etapes
                elements:
                    - Pense aux erreurs et aux risques vus aujourd’hui.
                    - Écris deux règles d’usage de l’IA pour la classe.
                    - Commence par « Je… ».
            -   type: paragraphe
                texte: Pourquoi des règles ? Elles permettent d’utiliser un outil puissant sans tricher ni se tromper.
        questions:
            -   id: q01
                type: texte
                enonce: Écris deux règles d’usage de l’IA pour la classe.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une IA peut créer une fausse photo très réaliste.
        questions:
            -   id: q01
                type: texte
                enonce: Donne un indice pour repérer une image générée.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais utiliser une IA avec prudence. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment utiliser une intelligence artificielle générative avec un esprit critique ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - L’IA générative peut se tromper avec assurance.
    - Vérifier, ne pas copier, citer son usage.
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
