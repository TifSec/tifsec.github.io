titre: 'Séance 31 : Oral blanc du DNB n° 2'
themes:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
problematique: Ai-je progressé depuis le premier oral blanc ?
competences_bo:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
objectifs:
    connaissances:
        - On mesure une progression en comparant deux prestations avec la même grille.
        - Les points travaillés doivent être visibles.
    competences:
        - Appliquer ses axes d’amélioration.
        - Mesurer sa progression.
pourquoi:
    - En S30, tu as choisi deux points à améliorer.
    - 'Aujourd’hui, deuxième passage : as-tu progressé ?'
activites:
    -   id: a01
        titre: Mes points à travailler
        consigne: Tu vas préparer une action concrète pour chacun de tes deux points à améliorer (S30). On attend les deux points et leurs actions.
        contenu:
            -   type: etapes
                elements:
                    - Relis tes deux points de S30.
                    - Pour chacun, prépare une action concrète pour aujourd’hui.
                    - Modifie ton support si besoin.
            -   type: paragraphe
                texte: Pourquoi une action concrète ? « Parler mieux » est vague ; « marquer une pause après chaque partie » est faisable.
        questions:
            -   id: q01
                type: texte
                enonce: Rappelle tes deux points de S30 et l’action concrète prévue pour chacun.
                aide: Repère le verbe de la question.
    -   id: a02
        titre: Passer et observer
        transition: Tes actions sont prêtes. Passe l’oral.
        consigne: Tu vas passer le deuxième oral blanc et observer la progression d’un camarade. On attend un progrès précis observé.
        contenu:
            -   type: etapes
                elements:
                    - Passe l’oral blanc.
                    - Pendant les autres passages, observe un camarade avec la grille.
                    - Note s’il a progressé sur un point.
            -   type: paragraphe
                texte: Pourquoi observer encore ? Tu vois ce qu’une progression change, concrètement.
        questions:
            -   id: q01
                type: texte
                enonce: Pour le camarade observé, quel progrès as-tu remarqué ?
                aide: Attendu ou observé ?
    -   id: a03
        titre: Comparer mes deux oraux
        transition: Ton passage est fait. Mesure ta progression.
        consigne: Tu vas comparer tes deux oraux blancs (durée, point travaillé) et conclure sur ta progression. On attend le tableau comparatif et une conclusion justifiée.
        contenu:
            -   type: etapes
                elements:
                    - Compare tes grilles de S30 et de S31.
                    - Compare les durées.
                    - Conclus.
            -   type: paragraphe
                texte: Pourquoi comparer ? Voir ses progrès donne confiance pour le vrai DNB.
        questions:
            -   id: q01
                type: tableau
                enonce: Compare tes deux oraux blancs.
                colonnes:
                    - ''
                    - Oral 1
                    - Oral 2
                lignes:
                    -   - Durée de l’exposé
                        - ''
                        - ''
                    -   - Point 1 travaillé
                        - ''
                        - ''
                aide: Ligne × colonne.
            -   id: q02
                type: texte
                enonce: As-tu progressé ? Justifie avec « car ».
                aide: Pense à « car ».
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Il reste du temps avant le vrai DNB.
        questions:
            -   id: q01
                type: texte
                enonce: Quel dernier point veux-tu travailler ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Les oraux blancs sont terminés. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : as-tu progressé depuis le premier oral blanc ?'
                aide: Reprends les mots du problème.
retenir:
    - 'Progresser : un point à la fois, une action concrète.'
    - Comparer avec la même grille.
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
