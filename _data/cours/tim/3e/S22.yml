titre: 'Séance 22 : Monter la vidéo métier'
themes:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
problematique: Comment assembler des images, du texte et du son pour faire une vidéo claire ?
competences_bo:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
objectifs:
    connaissances:
        - Un logiciel de montage (Shotcut, OpenShot, Clipchamp) place des plans sur une ligne de temps.
        - On ajoute des titres, on coupe, on règle le son, puis on exporte (MP4).
    competences:
        - Couper et assembler des plans.
        - Ajouter un titre et exporter.
pourquoi:
    - En S21, tu as écrit ton storyboard.
    - Aujourd’hui, tu montes la vidéo avec les images fournies (ou tes images sans personne reconnaissable).
activites:
    -   id: a01
        titre: La ligne de temps
        consigne: Tu vas placer sur la ligne de temps les plans de ta vidéo métier, dans l’ordre de ton storyboard. On attend ce que représente la longueur d’un clip et l’ordre de tes plans.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre le logiciel de montage.
                    - Importe les images et clips fournis.
                    - Place-les sur la ligne de temps dans l’ordre du storyboard.
            -   type: paragraphe
                texte: Pourquoi une ligne de temps ? Elle montre l’ordre et la durée de chaque plan, de gauche à droite.
        questions:
            -   id: q01
                type: qcm
                enonce: Sur la ligne de temps, que représente la longueur d’un clip ?
                choix:
                    -   id: a
                        texte: Sa durée.
                    -   id: b
                        texte: Sa qualité.
                    -   id: c
                        texte: Son poids.
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: texte
                enonce: Dans quel ordre as-tu placé tes plans ?
                aide: Repère le verbe de la question.
    -   id: a02
        titre: Couper et titrer
        transition: Les plans sont en place. Rends la vidéo plus claire.
        consigne: Tu vas couper un clip inutile et ajouter un titre et des sous-titres à ta vidéo. On attend le clip coupé, le titre et un sous-titre.
        contenu:
            -   type: etapes
                elements:
                    - Coupe le début inutile d’un clip (outil scinder).
                    - 'Ajoute un titre au début : le nom du métier.'
                    - Ajoute un sous-titre pour chaque plan.
            -   type: paragraphe
                texte: 'Pourquoi des sous-titres ? Beaucoup regardent les vidéos sans le son : le texte porte le message.'
        questions:
            -   id: q01
                type: texte
                enonce: Quel clip as-tu coupé, et pourquoi ?
                aide: Pense à « car ».
            -   id: q02
                type: texte
                enonce: Écris le titre et un sous-titre de ta vidéo.
                aide: Combien d’éléments sont demandés ?
    -   id: a03
        titre: Exporter
        transition: Ta vidéo est montée. Il faut l’exporter pour la partager.
        consigne: Tu vas exporter ta vidéo en MP4 720p et vérifier le résultat. On attend sa durée et son poids.
        contenu:
            -   type: citation
                texte: 'Réflexe DNB M5 : j’écris les unités (s, Mo).'
            -   type: etapes
                elements:
                    - 'Fichier > Exporter : format MP4, 720p.'
                    - Nomme le fichier 3e_S22_metier_tonprenom.mp4.
                    - Regarde la vidéo exportée en entier.
                    - Note sa durée et son poids.
            -   type: paragraphe
                texte: Pourquoi 720p ? C’est assez net pour un écran, et le fichier reste léger à partager.
        questions:
            -   id: q01
                type: texte
                enonce: Écris la durée et le poids de ta vidéo exportée.
                aide: Combien d’éléments sont demandés ?
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une transition « fondu » adoucit le passage entre deux plans.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi ne pas en mettre partout ?
                aide: Pense à « car ».
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ta vidéo est montée. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment assembler des images, du texte et du son pour faire une vidéo claire ?'
                aide: Reprends les mots du problème.
retenir:
    - 'Ligne de temps : ordre et durée.'
    - Couper, titrer, sous-titrer, exporter en MP4.
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
