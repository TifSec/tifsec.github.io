titre: 'Séance 25 : Mon projet d’orientation dans la filière cheval'
themes:
    - Objectif 3 — Répondre à un besoin d’information, analyser sa qualité et communiquer
problematique: Comment trouver des informations fiables pour construire mon projet d’orientation ?
competences_bo:
    - Objectif 3 — Répondre à un besoin d’information, analyser sa qualité et communiquer
objectifs:
    connaissances:
        - Les sources officielles (ONISEP, Equi-ressources, sites des établissements) donnent les formations et les métiers.
        - Un tableau comparatif aide à choisir.
    competences:
        - Rechercher des formations dans une source fiable.
        - Comparer des formations dans un tableau.
pourquoi:
    - Après la 3e, il faut choisir une formation.
    - Aujourd’hui, tu cherches les formations pour le métier qui t’intéresse.
activites:
    -   id: a01
        titre: Les formations pour mon métier
        consigne: Tu vas chercher, dans une source fiable, deux formations qui mènent au métier qui t’intéresse. On attend le métier, les formations et la source.
        contenu:
            -   type: etapes
                elements:
                    - Reprends le métier de ta vidéo (ou un autre).
                    - Sur Equi-ressources ou l’ONISEP, cherche les formations qui y mènent.
                    - Note deux formations.
                    - Pourquoi deux formations ? Il y a souvent plusieurs chemins vers un même métier.
        questions:
            -   id: q01
                type: texte
                enonce: Écris ton métier et deux formations qui y mènent, avec la source.
                aide: Sur Equi-ressources ou l’Onisep, cherche ton métier et deux formations qui y mènent. Note la source.
        ressources:
            -   type: lien
                titre: Equi-ressources — fiches métiers de la filière cheval
                url: https://www.equiressources.fr/metiers
    -   id: a02
        titre: Comparer
        transition: Tu as trouvé des formations. Compare-les.
        consigne: Tu vas comparer tes deux formations dans un tableau Calc (durée, lieu, alternance). On attend le comparatif d’une formation.
        contenu:
            -   type: etapes
                elements:
                    - 'Ouvre Calc et crée un tableau : formation, durée, lieu, alternance oui/non.'
                    - Remplis-le pour tes deux formations.
                    - Enregistre sous 3e_S25_tonprenom.ods.
                    - 'Pourquoi un tableau ? Les critères sont côte à côte : la comparaison est plus facile.'
        questions:
            -   id: q01
                type: tableau
                enonce: Complète le comparatif pour une de tes formations.
                colonnes:
                    - Critère
                    - Ma formation
                lignes:
                    -   - Nom
                        - ''
                    -   - Durée
                        - ''
                    -   - Alternance ?
                        - ''
                aide: Pour la formation choisie, relève son nom exact, sa durée et si elle se fait en alternance.
    -   id: a03
        titre: Mon choix argumenté
        transition: Ton comparatif est prêt. Décide.
        consigne: Tu vas choisir la formation qui te convient et la justifier avec deux critères de ton comparatif. On attend un choix argumenté.
        contenu:
            -   type: citation
                texte: 'Réflexe DNB M4 : je justifie avec « car » et un fait précis.'
            -   type: etapes
                elements:
                    - Relis ton comparatif.
                    - Choisis la formation qui te convient le mieux.
                    - Justifie avec deux critères (réflexe M4).
                    - Pourquoi argumenter ? À l’oral du DNB et en entretien, on te demandera pourquoi ce choix.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle formation choisis-tu ? Justifie avec deux critères de ton tableau.
                aide: Choisis une formation et justifie avec « car » et deux lignes de ton tableau (durée, alternance, lieu…).
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Les journées portes ouvertes permettent de visiter les établissements.
        questions:
            -   id: q01
                type: texte
                enonce: Prépare deux questions à poser lors d’une visite.
                aide: 'Pense à ce que tu veux vraiment savoir : stages, débouchés, internat, chevaux de l’établissement.'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton projet d’orientation avance. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment trouver des informations fiables pour construire ton projet d’orientation ?'
                aide: Cite les sources fiables utilisées, la comparaison en tableau et ton choix argumenté.
retenir:
    - 'Sources : Equi-ressources, ONISEP, établissements.'
    - Comparer dans un tableau ; argumenter.
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
