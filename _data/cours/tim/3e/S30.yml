titre: 'Séance 30 : Oral blanc du DNB n° 1'
themes:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
problematique: Mon exposé respecte-t-il le temps et les attentes du jury ?
competences_bo:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
objectifs:
    connaissances:
        - 'Oral blanc : 5 min d’exposé, 10 min d’entretien, devant un jury (professeur et élèves observateurs).'
        - On en tire des points d’amélioration pour le deuxième oral blanc.
    competences:
        - Présenter son exposé en 5 minutes.
        - Analyser sa prestation avec la grille.
pourquoi:
    - Tu as préparé ton support (S28) et l’entretien (S29).
    - Aujourd’hui, premier passage en conditions réelles.
activites:
    -   id: a01
        titre: Avant de passer
        consigne: Tu vas préparer ton passage à l’oral blanc (plan, diaporama, introduction). On attend ta phrase d’introduction et la durée de l’exposé.
        contenu:
            -   type: citation
                texte: 'Réflexe DNB M10 : je gère mon temps : un regard discret sur l’horloge à la moitié de l’exposé.'
            -   type: etapes
                elements:
                    - Relis ton plan et tes mots-clés.
                    - Vérifie que ton diaporama s’ouvre.
                    - Écris ta phrase d’introduction.
            -   type: paragraphe
                texte: Pourquoi la première phrase ? Bien démarrer rassure et donne une bonne impression au jury.
        questions:
            -   id: q01
                type: texte
                enonce: Écris ta phrase d’introduction.
                aide: Combien d’éléments sont demandés ?
            -   id: q02
                type: qcm
                enonce: Combien de temps dure l’exposé ?
                choix:
                    -   id: a
                        texte: 5 minutes
                    -   id: b
                        texte: 15 minutes
                    -   id: c
                        texte: 1 minute
                aide: Relis l’exemple expliqué.
    -   id: a02
        titre: Observer un camarade
        transition: Tu es prêt. Pendant les passages, tu observes aussi.
        consigne: Tu vas observer le passage d’un camarade avec la grille (document 1) et le chronométrer. On attend sa durée, un point fort et un point à améliorer.
        contenu:
            -   type: tableau
                titre: Document 1 — Grille d’observation
                colonnes:
                    - Critère
                    - Oui / à améliorer
                lignes:
                    -   - Regarde le jury
                        - ''
                    -   - Voix claire
                        - ''
                    -   - Plan annoncé et suivi
                        - ''
                    -   - Exposé ≤ 5 min
                        - ''
                    -   - Réponses avec exemple
                        - ''
            -   type: etapes
                elements:
                    - Pendant le passage d’un camarade, remplis la grille (document 1).
                    - Note un point fort et un point à améliorer.
                    - Chronomètre son exposé.
            -   type: paragraphe
                texte: Pourquoi observer ? Repérer les qualités et les erreurs des autres aide à corriger les siennes.
        questions:
            -   id: q01
                type: texte
                enonce: 'Pour le camarade observé : durée, un point fort, un point à améliorer.'
                aide: Attendu ou observé ?
    -   id: a03
        titre: Mon analyse
        transition: Les passages sont faits. Analyse le tien.
        consigne: Tu vas analyser ton passage avec les grilles des observateurs et choisir deux points à améliorer. On attend ta durée et deux points précis.
        contenu:
            -   type: etapes
                elements:
                    - Après ton passage, lis les grilles des observateurs.
                    - Compare avec ton ressenti.
                    - Choisis deux points à améliorer pour l’oral blanc n° 2.
            -   type: paragraphe
                texte: Pourquoi deux points seulement ? On progresse mieux en se concentrant sur peu de choses à la fois.
        questions:
            -   id: q01
                type: texte
                enonce: Écris la durée de ton exposé et deux points à améliorer pour le prochain oral blanc.
                aide: Combien d’éléments sont demandés ?
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le stress fait parler vite.
        questions:
            -   id: q01
                type: texte
                enonce: Donne une technique pour ralentir.
                aide: Combien d’éléments sont demandés ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Le premier oral blanc est passé. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : ton exposé respecte-t-il le temps et les attentes du jury ?'
                aide: Reprends les mots du problème.
retenir:
    - 'Oral blanc : mesurer, observer, analyser.'
    - Deux points à améliorer.
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
