titre: 'Séance 1 : Ma 3e en TIM : où j’en suis, où je vais'
themes:
    - Objectif 1 — S’approprier et utiliser un environnement informatique de travail
    - Objectif 2 — Créer, produire, traiter et exploiter des données
problematique: Que sais-je déjà faire en TIM, et que dois-je atteindre en 3e pour le DNB et mes stages ?
competences_bo:
    - Objectif 1 — S’approprier et utiliser un environnement informatique de travail
    - Objectif 2 — Créer, produire, traiter et exploiter des données
objectifs:
    connaissances:
        - En 3e, le TIM prépare au DNB (réflexes, oral), à la certification Pix et aux écrits de stage.
        - On réutilise Writer, Calc, Impress et la programmation, à un niveau plus avancé.
    competences:
        - Faire un diagnostic de ses acquis.
        - Se fixer des objectifs pour l’année.
pourquoi:
    - En 4e, tu as découvert les logiciels de bureau, la recherche fiable et Scratch.
    - 'Cette année, tu vas plus loin : rapports de stage, tableurs qui décident, objets programmés, oral du DNB.'
activites:
    -   id: a01
        titre: Diagnostic rapide
        consigne: Tu vas faire un diagnostic de ce que tu sais faire depuis la 4e, sur des situations de stage. On attend le bon logiciel pour chaque situation et un calcul de tableur.
        contenu:
            -   type: etapes
                elements:
                    - Lis chaque situation du tableau.
                    - Écris le logiciel ou l’outil que tu utiliserais.
                    - 'Ne cherche pas : réponds avec ce que tu sais.'
                    - Pourquoi un diagnostic ? Savoir d’où tu pars permet de mesurer tes progrès en fin d’année.
        questions:
            -   id: q01
                type: tableau
                enonce: Pour chaque situation de stage, quel logiciel utiliserais-tu ?
                colonnes:
                    - Situation
                    - Logiciel
                lignes:
                    -   - Calculer le coût des granulés du mois
                        - ''
                    -   - Écrire ton rapport de stage
                        - ''
                    -   - Présenter ton stage à l’oral
                        - ''
                aide: 'Pour chaque tâche de stage, demande-toi : faut-il calculer (tableur), écrire un long texte (traitement de texte) ou montrer à un public (diaporama) ?'
            -   id: q02
                type: qcm
                enonce: Dans Calc, que donne la formule =SOMME(B2:B4) si B2 = 3, B3 = 5 et B4 = 2 ?
                choix:
                    -   id: a
                        texte: '10'
                    -   id: b
                        texte: '3'
                    -   id: c
                        texte: B2:B4
                aide: 'SOMME additionne toutes les cellules de B2 à B4 : fais l’addition des trois valeurs données.'
    -   id: a02
        titre: Ce qui m’attend en 3e
        transition: Tu as fait le point. Découvre ce qui t’attend.
        consigne: Tu vas lire le programme de TIM de 3e (document 1) et repérer ce qui est nouveau. On attend deux nouveautés par rapport à la 4e.
        contenu:
            -   type: liste
                elements:
                    - 'Writer : rapport de stage, sommaire automatique, publipostage.'
                    - 'Calc : fonction SI, tri, filtres, alertes en couleur.'
                    - Données personnelles, cybersécurité, réseaux, intelligence artificielle.
                    - Programmer une carte micro:bit (capteurs).
                    - Vidéo et page web.
                    - Orientation, CV, oral du DNB (deux oraux blancs).
            -   type: etapes
                elements:
                    - Lis le programme de l’année (document 1).
                    - Repère ce qui est nouveau par rapport à la 4e.
                    - Choisis ce qui t’intéresse le plus.
                    - Pourquoi regarder le programme ? Savoir où on va aide à donner du sens à chaque séance.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, cite deux choses nouvelles par rapport à la 4e.
                aide: 'Dans le document 1, cherche ce qui n’existait pas en 4e : un nouveau type de document, une nouvelle fonction du tableur, un nouvel outil.'
    -   id: a03
        titre: Mes objectifs
        transition: Tu connais le programme. Fixe-toi un cap.
        consigne: Tu vas te fixer un objectif de TIM pour la 3e, à partir de ton diagnostic. On attend un objectif précis justifié avec « car ».
        contenu:
            -   type: citation
                texte: 'Réflexe DNB M4 : je justifie avec « car » et un fait précis.'
            -   type: etapes
                elements:
                    - Relis tes réponses au diagnostic.
                    - Choisis un point faible à travailler.
                    - Écris ton objectif avec « car » (réflexe M4).
                    - Pourquoi « car » ? Un objectif justifié est plus facile à tenir.
        questions:
            -   id: q01
                type: texte
                enonce: Écris ton objectif de TIM pour la 3e et justifie-le avec « car ».
                aide: Choisis un objectif précis (un logiciel, un réflexe, Pix) et justifie-le avec « car » et une raison liée au DNB, au stage ou au métier.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La certification Pix a lieu en 3e.
        questions:
            -   id: q01
                type: texte
                enonce: Combien de domaines de compétences compte Pix ? Cherche sur pix.fr.
                aide: 'Sur pix.fr, cherche la page qui présente le référentiel des compétences : compte les grands domaines.'
        ressources:
            -   type: lien
                titre: Pix — tester et développer ses compétences numériques
                url: https://pix.fr/
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton point de départ est fait. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : que sais-tu déjà faire en TIM, et que dois-tu atteindre en 3e ?'
                aide: Cite deux choses acquises en 4e, deux nouveautés de 3e (document 1), puis ton objectif.
retenir:
    - '3e : Writer, Calc et programmation plus avancés ; DNB, Pix, stages.'
    - Un objectif personnel justifié.
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
