titre: 'Séance 23 : Une musique pour ma vidéo : ai-je le droit ?'
themes:
    - Objectif 4 — Adopter une attitude responsable dans une société démocratique
problematique: Comment choisir une musique ou un son qu’on a le droit d’utiliser ?
competences_bo:
    - Objectif 4 — Adopter une attitude responsable dans une société démocratique
objectifs:
    connaissances:
        - Une musique est protégée par le droit d’auteur ; on ne peut pas l’utiliser librement dans une vidéo publiée.
        - Les musiques libres ou sous licence Creative Commons sont utilisables en respectant la licence.
    competences:
        - Lire une licence de musique.
        - Créditer une musique.
pourquoi:
    - En S22, ta vidéo est montée sans musique.
    - 'Tu veux ajouter ta chanson préférée : en as-tu le droit ?'
activites:
    -   id: a01
        titre: Le droit d’auteur sur la musique
        consigne: Tu vas dire si trois utilisations de musique dans une vidéo sont autorisées, avec le document 1. On attend « oui » ou « non » pour chacune.
        contenu:
            -   type: paragraphe
                texte: Document 1 — Une œuvre musicale est protégée par le droit d’auteur jusqu’à 70 ans après la mort de l’auteur. On peut utiliser une musique dont la licence l’autorise (Creative Commons, musique libre de droits), en respectant ses conditions.
            -   type: etapes
                elements:
                    - Lis les trois situations.
                    - Pour chacune, dis si c’est autorisé.
                    - Justifie avec le document 1.
            -   type: paragraphe
                texte: 'Pourquoi c’est interdit ? Les artistes vivent de leurs œuvres : les utiliser sans accord, c’est les priver de leurs droits.'
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, ces utilisations sont-elles autorisées ? Écris « oui » ou « non ».
                colonnes:
                    - Utilisation
                    - Autorisée ?
                lignes:
                    -   - Une chanson du top 50 dans ma vidéo publiée sur internet
                        - ''
                    -   - Une musique CC BY en citant l’auteur
                        - ''
                    -   - Une musique que j’ai composée moi-même
                        - ''
                aide: Ligne × colonne.
    -   id: a02
        titre: Lire une licence
        transition: Tu sais que la musique est protégée. Cherche une musique libre.
        consigne: Tu vas lire la licence d’une musique libre (document 2) et écrire le crédit à mettre dans ta vidéo. On attend le crédit et si un usage commercial est permis.
        contenu:
            -   type: tableau
                titre: Document 2 — Fiche d’une musique libre (exemple)
                colonnes:
                    - Titre
                    - Auteur
                    - Licence
                lignes:
                    -   - Galop matinal
                        - Lina K.
                        - CC BY 4.0
            -   type: etapes
                elements:
                    - Lis la fiche d’une musique trouvée sur une plateforme de musique libre (document 2).
                    - Repère la licence et ce qu’elle demande.
                    - Écris le crédit à mettre dans la vidéo.
            -   type: paragraphe
                texte: 'Pourquoi un crédit ? La licence CC BY demande de citer l’auteur : c’est la condition pour avoir le droit.'
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 2, écris le crédit à mettre à la fin de ta vidéo.
                aide: « D’après le document… ».
            -   id: q02
                type: qcm
                enonce: D’après le document 2, peux-tu utiliser cette musique dans une publicité payante ?
                choix:
                    -   id: a
                        texte: Oui, CC BY autorise l’usage commercial en citant l’auteur.
                    -   id: b
                        texte: Non, jamais.
                    -   id: c
                        texte: Seulement le dimanche.
                aide: Relis l’exemple expliqué.
    -   id: a03
        titre: Ajouter le son
        transition: Tu as une musique autorisée. Ajoute-la.
        consigne: Tu vas ajouter la musique libre à ta vidéo, régler son volume et ajouter le crédit. On attend le réglage du volume et la place du crédit.
        contenu:
            -   type: etapes
                elements:
                    - Ajoute la musique fournie sur une piste audio.
                    - Baisse son volume quand quelqu’un parle.
                    - Ajoute le crédit à la fin et réexporte.
            -   type: paragraphe
                texte: 'Pourquoi baisser le volume ? La voix doit rester compréhensible : la musique accompagne, elle ne couvre pas.'
        questions:
            -   id: q01
                type: texte
                enonce: Comment as-tu réglé le volume de la musique, et où as-tu mis le crédit ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une plateforme vidéo a bloqué une vidéo avec une musique protégée.
        questions:
            -   id: q01
                type: texte
                enonce: Comment le détecte-t-elle ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ta vidéo a une musique autorisée. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment choisir une musique ou un son qu’on a le droit d’utiliser ?'
                aide: Reprends les mots du problème.
retenir:
    - Musique protégée par défaut.
    - 'Licence libre : respecter les conditions, créditer.'
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
