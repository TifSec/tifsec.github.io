titre: 'Séance 8 : Retrouver un cheval dans le registre : trier et filtrer'
themes:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
problematique: Comment retrouver rapidement des informations dans un grand tableau ?
competences_bo:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
objectifs:
    connaissances:
        - Trier range les lignes selon une colonne (A → Z, du plus petit au plus grand).
        - Filtrer affiche seulement les lignes qui respectent un critère, sans rien supprimer.
    competences:
        - Trier un tableau sans mélanger les lignes.
        - Appliquer un filtre automatique.
pourquoi:
    - En S07, tu as calculé des rations pour 3 chevaux.
    - 'Le registre d’un centre équestre en compte 40 : il faut trouver vite les bonnes lignes.'
activites:
    -   id: a01
        titre: Trier sans casser
        consigne: Tu vas trier le registre des chevaux par âge sans mélanger les informations de chaque ligne. On attend le cheval le plus âgé et le danger d’un tri sur une seule colonne.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre le fichier fourni registre.ods ; enregistre sous 3e_S08_tonprenom.ods.
                    - 'Clique dans le tableau, puis Données > Trier : par « Âge », décroissant.'
                    - Vérifie que chaque cheval a gardé ses informations.
            -   type: paragraphe
                texte: Pourquoi trier tout le tableau ? Si on trie une seule colonne, les âges ne correspondent plus aux bons chevaux.
        questions:
            -   id: q01
                type: texte
                enonce: Quel est le cheval le plus âgé du registre, et quel est son âge ?
                aide: Une phrase complète qui reprend les mots de la question.
            -   id: q02
                type: qcm
                enonce: Que se passe-t-il si on trie uniquement la colonne « Âge » ?
                choix:
                    -   id: a
                        texte: Les âges ne correspondent plus aux bons chevaux.
                    -   id: b
                        texte: Rien de grave.
                    -   id: c
                        texte: Le tableau se supprime.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a02
        titre: Filtrer
        transition: Le registre est trié. Affiche seulement ce qui t’intéresse.
        consigne: Tu vas filtrer le registre pour n’afficher que les poneys. On attend leur nombre et ce que deviennent les autres lignes.
        contenu:
            -   type: etapes
                elements:
                    - Données > Plus de filtres > AutoFiltre (ou Filtre automatique).
                    - Dans la colonne « Type », ne garde que « Poney ».
                    - Lis le nombre de lignes affichées en bas à gauche.
            -   type: paragraphe
                texte: Pourquoi filtrer ? On ne voit que ce qui nous intéresse ; les autres lignes sont cachées, pas effacées.
        questions:
            -   id: q01
                type: nombre
                enonce: Combien de poneys compte le registre ?
                unite: poneys
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: qcm
                enonce: Après le filtre, où sont les chevaux qui ne sont pas des poneys ?
                choix:
                    -   id: a
                        texte: 'Cachés : ils réapparaissent si on enlève le filtre.'
                    -   id: b
                        texte: Supprimés.
                    -   id: c
                        texte: Dans une autre feuille.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a03
        titre: Deux critères
        transition: Un critère, c’est bien. Le moniteur en a deux.
        consigne: Tu vas combiner deux filtres pour trouver les poneys de CSO demandés par le moniteur. On attend la liste de leurs noms.
        contenu:
            -   type: etapes
                elements:
                    - Garde le filtre « Poney ».
                    - 'Ajoute un filtre sur « Discipline » : « CSO ».'
                    - Réponds à la demande du moniteur.
            -   type: paragraphe
                texte: 'Pourquoi deux critères ? Le moniteur cherche des poneys de saut : les deux conditions doivent être vraies.'
        questions:
            -   id: q01
                type: texte
                enonce: Le moniteur cherche des poneys de CSO pour un stage. Écris leurs noms.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le filtre standard permet « Âge > 15 ».
        questions:
            -   id: q01
                type: texte
                enonce: Quels chevaux de plus de 15 ans pourraient avoir besoin d’un suivi dentaire renforcé ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais retrouver des lignes. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment retrouver rapidement des informations dans un grand tableau ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Trier : tout le tableau, selon une colonne.'
    - 'Filtrer : masquer les lignes hors critère.'
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
