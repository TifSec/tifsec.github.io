titre: Créons les invitations de notre rencontre
theme: TIM — Créons les invitations de notre rencontre
problematique: Créons les invitations de notre rencontre
pourquoi: "Objectif de cette séance : Comprendre le rôle d'un document de communication."
application: concevoir un véritable carton d'invitation pour la rencontre organisée par les apprenants de 3e de la MFR.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Comprendre le rôle d'un document de communication.
        - Identifier les informations indispensables dans une invitation.
        - Adapter un document à ses destinataires.
        - Hiérarchiser des informations pour faciliter leur lecture.
        - Comprendre l'intérêt d'un cahier des charges.
        - Comprendre la différence entre le contenu d'un document et sa présentation.
        - Comprendre l'intérêt d'un fichier modifiable et d'une version PDF destinée à être diffusée.
    competences:
        - Vous organiser dans un groupe.
        - Créer et enregistrer un document correctement nommé.
        - Régler une page au format A5.
        - Organiser les informations dans LibreOffice Writer.
        - Mettre en valeur les informations importantes.
        - Insérer et dimensionner une image.
        - Respecter un cahier des charges.
        - Évaluer et améliorer une production numérique.
        - Exporter une version finale au format PDF.
activites:
    - id: a01
      titre: Pour commencer
      contenu:
          - type: paragraphe
            texte: "Classe : 4e / 3e MFR"
          - type: paragraphe
            texte: "Durée exceptionnelle : 2 heures"
          - type: paragraphe
            texte: "Organisation : groupes de 4 élèves"
          - type: paragraphe
            texte: "Logiciel : LibreOffice Writer"
          - type: paragraphe
            texte: "Mission : concevoir un véritable carton d'invitation pour la rencontre organisée par les apprenants de 3e de la MFR."
          - type: paragraphe
            texte: Commentaire professeur – Préparation
          - type: paragraphe
            texte: "Cette séance est volontairement exceptionnelle : prévoir 2 heures consécutives. Les séances TIM suivantes reviennent au format habituel de 50 minutes."
          - type: paragraphe
            texte: La rencontre aura lieu le vendredi 4 décembre 2026 à 11 h à la MFR de Saint-Flour.
          - type: paragraphe
            texte: Les invitations sont destinées aux familles, maîtres de stage, membres du conseil d'administration et équipes pédagogiques.
          - type: paragraphe
            texte: Prévoir un ordinateur par groupe et LibreOffice Writer.
          - type: paragraphe
            texte: "Si des photographies sont utilisées, préparer auparavant un dossier contenant uniquement des photographies dont l'utilisation dans ce projet est autorisée : établissement, activités, réalisations ou stages."
          - type: paragraphe
            texte: Si le logo officiel de la MFR doit être utilisé, le placer également dans ce dossier.
          - type: paragraphe
            texte: "Ne pas laisser les élèves récupérer au hasard des images sur Internet : l'objectif est de travailler avec des visuels réellement liés à l'établissement et dont l'utilisation est maîtrisée."
          - type: paragraphe
            texte: Le projet concerne une rencontre réelle. Les informations obligatoires ne doivent donc pas être inventées ou modifiées par les élèves.
      questions: []
    - id: a04
      titre: Production attendue
      contenu:
          - type: paragraphe
            texte: Chaque groupe doit produire un carton d'invitation A5.
          - type: paragraphe
            texte: "À la fin de la séance, vous devrez rendre :"
          - type: liste
            elements:
                - "4e3e_S02_Groupe01.odt : le fichier modifiable ;"
                - "4e3e_S02_Groupe01.pdf : la version destinée à être consultée ou imprimée."
          - type: paragraphe
            texte: Remplacez 01 par le numéro donné à votre groupe.
          - type: paragraphe
            texte: Commentaire professeur – Évaluation
          - type: paragraphe
            texte: Comme pour les autres séances, la production finale sert de support à l'évaluation.
          - type: paragraphe
            texte: "Prendre principalement en compte : l'implication, la progression, la participation au groupe, le respect du cahier des charges, la qualité du rendu et la capacité à améliorer la production après un retour."
          - type: paragraphe
            texte: Ne pas évaluer uniquement l'esthétique du carton.
      questions: []
    - id: a05
      titre: 1. Comprendre notre mission – 10 minutes
      contenu:
          - type: paragraphe
            texte: Le vendredi 4 décembre 2026 à 11 h, les apprenants de 3e organiseront une rencontre à la MFR.
          - type: paragraphe
            texte: "Cette rencontre permettra de présenter :"
          - type: liste
            elements:
                - des apprentissages réalisés à la MFR ;
                - des projets et activités ;
                - des expériences vécues pendant les stages ;
                - des métiers découverts ;
                - des compétences acquises ;
                - des réussites et des progrès.
          - type: paragraphe
            texte: "Les personnes invitées pourront notamment être :"
          - type: liste
            elements:
                - les familles ;
                - les maîtres de stage ;
                - les membres du conseil d'administration ;
                - les équipes pédagogiques.
      questions:
          - id: q01
            type: texte
            enonce: "Question 1 : à quoi va servir le carton que vous allez créer ?"
          - id: q02
            type: texte
            enonce: "Question 2 : quelles sont, selon vous, les quatre informations qu'un invité doit pouvoir trouver le plus rapidement possible ?"
            suite:
                - type: titre
                  texte: AIDE SI BESOIN – Comprendre le rôle de l'invitation
                - type: paragraphe
                  texte: "Indice 1/3 : imaginez que vous recevez l'invitation sans aucune autre explication."
                - type: paragraphe
                  texte: "Indice 2/3 : vous devez comprendre ce qui va se passer et savoir quand venir."
                - type: paragraphe
                  texte: "Indice 3/3 : pensez au titre, à la date, à l'heure et au lieu."
                - type: paragraphe
                  texte: Commentaire professeur – Attendu
          - id: q03
            type: texte
            enonce: "Q1 : informer les destinataires de l'événement et leur donner les informations nécessaires pour y participer."
          - id: q04
            type: texte
            enonce: "Q2 : titre ou nature de l'événement, date, heure et lieu. Accepter également organisateurs ou objectif si la réponse est argumentée."
            suite:
                - type: paragraphe
                  texte: Ne pas passer plus de dix minutes sur cette introduction.
    - id: a06
      titre: 2. Organiser notre groupe – 5 minutes
      contenu:
          - type: paragraphe
            texte: Vous travaillez par groupes de quatre et réalisez une seule production commune.
          - type: paragraphe
            texte: "Répartissez-vous quatre responsabilités :"
          - type: liste
            elements:
                - "Rédaction : vérifie les textes et les informations."
                - "Mise en page : surveille l'organisation générale dans Writer."
                - "Illustrations : choisit les visuels parmi ceux autorisés."
                - "Qualité : vérifie le cahier des charges et la lisibilité."
          - type: paragraphe
            texte: "Attention : une responsabilité ne signifie pas qu'une seule personne effectue tout le travail correspondant."
          - type: paragraphe
            texte: Chaque membre doit participer aux décisions et aux manipulations.
          - type: paragraphe
            texte: "Numéro du groupe :"
          - type: paragraphe
            texte: "Responsable rédaction :"
          - type: paragraphe
            texte: "Responsable mise en page :"
          - type: paragraphe
            texte: "Responsable illustrations :"
          - type: paragraphe
            texte: "Responsable qualité :"
          - type: paragraphe
            texte: Commentaire professeur – Travail collectif
          - type: paragraphe
            texte: Former idéalement des groupes de quatre. Un groupe de trois ou cinq peut être accepté si l'effectif l'impose.
          - type: paragraphe
            texte: Un seul ordinateur peut être utilisé pour le document final, mais demander aux élèves de se relayer au clavier et à la souris.
          - type: paragraphe
            texte: Dans une classe mixte, mélanger éventuellement les niveaux lorsque cela favorise l'entraide, sans transformer systématiquement les 3e en tuteurs des 4e.
      questions: []
    - id: a07
      titre: 3. Choisir le titre de la rencontre – 10 minutes
      contenu:
          - type: paragraphe
            texte: Une invitation doit annoncer clairement l'événement.
          - type: paragraphe
            texte: "Voici quatre propositions :"
          - type: etapes
            elements:
                - Nos apprentissages, nos projets, nos réussites
                - Une année pour apprendre, des expériences à partager
                - Regards croisés sur notre année en alternance
                - Une rencontre pour valoriser nos expériences et nos apprentissages
      questions:
          - id: q01
            type: texte
            enonce: "Question 3 : quel titre votre groupe préfère-t-il et pourquoi ?"
            suite:
                - type: paragraphe
                  texte: Le professeur organise ensuite un vote.
                - type: paragraphe
                  texte: "Titre retenu :"
                - type: paragraphe
                  texte: "VIGILANCE : tous les groupes utilisent ensuite le même titre, même si leurs mises en page sont différentes."
                - type: paragraphe
                  texte: Commentaire professeur – Vote
                - type: paragraphe
                  texte: Faire voter les élèves rapidement et annoncer le résultat.
                - type: paragraphe
                  texte: En cas d'égalité, organiser un second vote entre les propositions concernées.
                - type: paragraphe
                  texte: Si plusieurs groupes de 3e doivent participer au choix définitif à des moments différents, annoncer que le titre est provisoire et conserver les fichiers ODT pour pouvoir le modifier ensuite.
    - id: a08
      titre: 4. Établir le cahier des charges – 15 minutes
      contenu:
          - type: paragraphe
            texte: "Imaginez que vous receviez uniquement le message suivant :"
          - type: citation
            texte: Nous organisons une rencontre pour présenter nos travaux. Nous espérons vous voir nombreux !
      questions:
          - id: q01
            type: texte
            enonce: "Question 4 : quelles informations manquent pour pouvoir réellement participer à l'événement ?"
            suite:
                - type: paragraphe
                  texte: "Votre invitation devra obligatoirement contenir :"
                - type: liste
                  elements:
                      - le titre retenu lors du vote ;
                      - la mention des apprenants de 3e de la MFR ;
                      - une courte phrase expliquant l'objectif de la rencontre ;
                      - "la date : vendredi 4 décembre 2026 ;"
                      - "l'heure : 11 h ;"
                      - "le lieu : MFR Saint-Flour, 10 Rte de Massales, 15100 Saint-Flour ;"
                      - au moins un visuel autorisé en rapport avec la MFR, une activité ou une réalisation ;
                      - une présentation claire et lisible ;
                      - un document tenant sur une seule page au format A5.
          - id: q02
            type: texte
            enonce: "Question 5 : parmi ces informations, lesquelles doivent être vues en premier ? Pourquoi ?"
            suite:
                - type: titre
                  texte: AIDE SI BESOIN – Hiérarchiser les informations
                - type: paragraphe
                  texte: "Indice 1/3 : imaginez que quelqu'un ne regarde le carton que cinq secondes."
                - type: paragraphe
                  texte: "Indice 2/3 : il doit comprendre immédiatement de quoi il s'agit et quand cela aura lieu."
                - type: paragraphe
                  texte: "Indice 3/3 : le titre, la date, l'heure et le lieu doivent être particulièrement faciles à retrouver."
                - type: paragraphe
                  texte: Commentaire professeur – Attendus et vigilance
                - type: paragraphe
                  texte: Faire distinguer les informations obligatoires des éléments décoratifs.
                - type: paragraphe
                  texte: Ne pas laisser les élèves inventer de téléphone, d'adresse électronique, de formulaire d'inscription ou d'autres modalités qui n'ont pas été validées.
          - id: q03
            type: texte
            enonce: "Q4 : au minimum date, heure, lieu, organisateurs et nature ou objectif de l'événement."
          - id: q04
            type: texte
            enonce: "Q5 : titre, date, heure et lieu doivent être rapidement repérables."
    - id: a09
      titre: 5. Préparer notre mise en page – 10 minutes
      contenu:
          - type: paragraphe
            texte: Avant d'ouvrir Writer, votre groupe doit décider comment organiser son invitation.
          - type: paragraphe
            texte: "Vous pouvez choisir :"
          - type: liste
            elements:
                - "une présentation classique : sobre, centrée et facile à réaliser ;"
                - "une présentation moderne : utilisant quelques blocs bien séparés ;"
                - "une présentation créative : mettant davantage en avant les activités et les visuels ;"
                - "une proposition originale : à condition de respecter le cahier des charges."
      questions:
          - id: q01
            type: texte
            enonce: "Question 6 : décrivez rapidement votre organisation."
            suite:
                - type: titre
                  texte: Quelques règles simples
                - type: liste
                  elements:
                      - Utilisez au maximum deux polices différentes.
                      - Limitez le nombre de couleurs.
                      - Gardez un contraste suffisant entre texte et fond.
                      - Ne remplissez pas tous les espaces.
                      - Ne transformez pas l'invitation en affiche surchargée.
                      - Une ou deux images pertinentes valent mieux que de nombreuses images inutiles.
                - type: paragraphe
                  texte: Commentaire professeur
                - type: paragraphe
                  texte: Laisser les élèves faire de vrais choix mais ne pas laisser cette phase dépasser dix minutes.
                - type: paragraphe
                  texte: Les groupes les moins à l'aise peuvent retenir une présentation simple. La difficulté informatique ne doit pas empêcher de réussir la mission.
    - id: a10
      titre: 6. Réaliser notre invitation dans Writer – 50 minutes
      contenu:
          - type: titre
            texte: Étape 1 – Créer immédiatement le document
          - type: paragraphe
            texte: Ouvrez LibreOffice Writer.
          - type: paragraphe
            texte: Créez un nouveau document texte.
          - type: paragraphe
            texte: Choisissez Fichier → Enregistrer sous.
          - type: paragraphe
            texte: Enregistrez le document dans l'emplacement indiqué par le professeur.
          - type: paragraphe
            texte: Nommez-le 4e3e_S02_Groupe01.odt.
          - type: paragraphe
            texte: Remplacez 01 par votre numéro de groupe.
      questions:
          - id: q01
            type: texte
            enonce: Vérifiez que le fichier est au format Document texte ODF (.odt).
            suite:
                - type: paragraphe
                  texte: "VIGILANCE : enregistrez régulièrement votre travail avec Ctrl + S."
                - type: paragraphe
                  texte: Commentaire professeur – Réinvestissement
                - type: paragraphe
                  texte: La création et le nommage du fichier réinvestissent les acquis de la séance 1.
                - type: paragraphe
                  texte: Ne pas effectuer l'enregistrement à la place du groupe. Faire verbaliser le problème en cas de blocage.
                - type: titre
                  texte: Étape 2 – Régler le format A5
                - type: paragraphe
                  texte: Votre carton doit occuper une seule page A5.
                - type: etapes
                  elements:
                      - Ouvrez les réglages de la page ou du style de page.
                      - Repérez la rubrique permettant de modifier le format du papier.
                      - Choisissez A5.
                      - Choisissez Portrait ou Paysage selon votre projet.
                      - Adaptez les marges si nécessaire, sans placer le contenu trop près du bord.
                      - Validez.
                - type: titre
                  texte: AIDE SI BESOIN – Je ne trouve pas le format A5
                - type: paragraphe
                  texte: "Indice 1/3 : ne cherchez pas dans les réglages de la police : vous devez modifier la page."
                - type: paragraphe
                  texte: "Indice 2/3 : recherchez le panneau ou la boîte de dialogue Style de page."
                - type: paragraphe
                  texte: "Indice 3/3 : dans les propriétés de la page, repérez Format / Taille puis sélectionnez A5."
                - type: paragraphe
                  texte: "Source : LibreOffice – Réglages de la page dans Writer ."
                - type: lien
                  titre: LibreOffice – Réglages de la page dans Writer
                  url: https://help.libreoffice.org/latest/fr/text/swriter/01/page.html?DbPAR=WRITER
                - type: titre
                  texte: Étape 3 – Saisir d'abord le contenu
                - type: paragraphe
                  texte: Avant de décorer votre carton, saisissez toutes les informations obligatoires.
                - type: paragraphe
                  texte: "Vous pouvez partir de cette base :"
                - type: citation
                  texte: LES APPRENANTS DE 3e DE LA MFR VOUS INVITENT [TITRE CHOISI] Nous avons le plaisir de vous inviter à une rencontre consacrée à nos apprentissages, nos projets et nos expériences en alternance. Nous partagerons avec vous des réalisations et des découvertes effectuées à la MFR et pendant nos périodes de stage. Vendredi 4 décembre 2026 11 h MFR Saint-Flour, 10 Rte de Massales, 15100 Saint-Flour Nous serons heureux de vous accueillir pour partager ce moment. Les apprenants de 3e de la MFR.
                - type: paragraphe
                  texte: Vous pouvez reformuler certaines phrases, mais vous ne devez pas modifier les informations factuelles de l'événement.
                - type: titre
                  texte: Étape 4 – Créer une hiérarchie visuelle
                - type: paragraphe
                  texte: Votre lecteur doit comprendre très rapidement ce qui est important.
                - type: paragraphe
                  texte: "Faites ressortir au minimum :"
                - type: liste
                  elements:
                      - le titre de la rencontre ;
                      - la date ;
                      - l'heure ;
                      - le lieu.
                - type: paragraphe
                  texte: "Vous pouvez utiliser :"
                - type: liste
                  elements:
                      - la taille du texte ;
                      - le gras ;
                      - l'alignement ;
                      - une couleur contrastée ;
                      - les espaces entre les éléments.
                - type: paragraphe
                  texte: "VIGILANCE : si tout est gros, gras et coloré, plus rien ne ressort réellement."
                - type: titre
                  texte: AIDE SI BESOIN – Mon carton ressemble encore à une page de texte
                - type: paragraphe
                  texte: "Indice 1/3 : commencez uniquement par le titre."
                - type: paragraphe
                  texte: "Indice 2/3 : rendez ensuite la date et l'heure faciles à repérer."
                - type: paragraphe
                  texte: "Indice 3/3 : conservez les phrases explicatives plus petites et plus discrètes que le titre."
                - type: titre
                  texte: Étape 5 – Organiser les espaces
                - type: paragraphe
                  texte: Évitez d'utiliser de nombreuses lignes vides uniquement pour déplacer le texte.
                - type: paragraphe
                  texte: Utilisez plutôt les réglages d'espacement des paragraphes lorsque cela est nécessaire.
                - type: paragraphe
                  texte: "Votre carton doit :"
                - type: liste
                  elements:
                      - rester lisible ;
                      - ne comporter qu'une seule page ;
                      - ne contenir aucun texte coupé ;
                      - laisser suffisamment d'espace autour des informations.
                - type: titre
                  texte: Étape 6 – Choisir une illustration
                - type: paragraphe
                  texte: Choisissez une ou deux images parmi celles mises à disposition par le professeur.
                - type: paragraphe
                  texte: "Elles doivent avoir un rapport direct avec :"
                - type: liste
                  elements:
                      - la MFR ;
                      - ses activités ;
                      - les projets réalisés ;
                      - les expériences professionnelles présentées lors de la rencontre.
          - id: q02
            type: texte
            enonce: "Question 7 : quelle image avez-vous choisie et pourquoi est-elle pertinente ?"
            suite:
                - type: paragraphe
                  texte: "VIGILANCE : n'utilisez aucune photographie extérieure au dossier prévu sans validation du professeur."
                - type: titre
                  texte: Étape 7 – Insérer et dimensionner l'image
                - type: paragraphe
                  texte: Placez le curseur à l'endroit souhaité.
                - type: paragraphe
                  texte: Choisissez Insertion → Image.
                - type: paragraphe
                  texte: Sélectionnez le fichier autorisé.
                - type: paragraphe
                  texte: Insérez l'image.
                - type: paragraphe
                  texte: Redimensionnez-la avec une poignée située dans un angle.
                - type: paragraphe
                  texte: Conservez ses proportions.
          - id: q03
            type: texte
            enonce: Vérifiez qu'elle ne masque aucun texte.
            suite:
                - type: titre
                  texte: AIDE SI BESOIN – Mon image prend toute la page
                - type: paragraphe
                  texte: "Indice 1/3 : cliquez une fois sur l'image."
                - type: paragraphe
                  texte: "Indice 2/3 : utilisez une poignée placée dans un angle."
                - type: paragraphe
                  texte: "Indice 3/3 : réduisez-la progressivement jusqu'à ce qu'elle accompagne le texte sans devenir l'élément principal du carton."
                - type: titre
                  texte: Étape 8 – Ajouter éventuellement le logo
                - type: paragraphe
                  texte: Si le professeur a fourni le logo officiel de la MFR, vous pouvez l'insérer.
                - type: paragraphe
                  texte: "VIGILANCE :"
                - type: liste
                  elements:
                      - ne déformez pas le logo ;
                      - ne changez pas ses couleurs ;
                      - ne le placez pas sur une zone qui le rend difficile à lire.
                - type: titre
                  texte: Étape 9 – Finaliser votre proposition
                - type: paragraphe
                  texte: Vous pouvez ajouter une ligne, un cadre ou un élément graphique simple si cela améliore réellement la lecture.
                - type: paragraphe
                  texte: "Avant de poursuivre, demandez-vous :"
          - id: q04
            type: texte
            enonce: Est-ce utile ?
          - id: q05
            type: texte
            enonce: Est-ce lisible ?
          - id: q06
            type: texte
            enonce: Est-ce cohérent avec le reste ?
            suite:
                - type: paragraphe
                  texte: Commentaire professeur – Réalisation
                - type: paragraphe
                  texte: C'est la partie principale de la séance. Préserver environ 50 minutes.
                - type: paragraphe
                  texte: "Priorités dans l'ordre : informations correctes → fichier enregistré → lisibilité → respect du format A5 → illustrations → décoration."
                - type: paragraphe
                  texte: Pour les élèves en difficulté, réduire la complexité graphique plutôt que faire les manipulations à leur place.
                - type: paragraphe
                  texte: Pour les élèves rapides, autoriser une deuxième proposition de mise en page ou demander une justification plus poussée des choix graphiques.
                - type: paragraphe
                  texte: Faire tourner la personne qui utilise l'ordinateur si un élève monopolise les manipulations.
    - id: a11
      titre: 7. Tester notre invitation – 15 minutes
      contenu:
          - type: titre
            texte: Contrôle qualité
          - type: liste
            elements:
                - Le titre retenu est présent.
                - Les apprenants de 3e sont identifiés comme organisateurs.
                - L'objectif de la rencontre est expliqué.
                - La date du vendredi 4 décembre 2026 est correcte.
                - L'heure de 11 h est visible.
                - Le lieu est correct.
                - Le carton tient sur une seule page A5.
                - Les informations importantes ressortent immédiatement.
                - Le texte est lisible.
                - Les images utilisées ont été autorisées.
                - Les images ne sont pas déformées.
                - Aucun élément ne masque une information.
                - Le fichier possède le bon nom.
          - type: titre
            texte: Le test des dix secondes
          - type: paragraphe
            texte: Montrez votre invitation à un autre groupe pendant seulement dix secondes.
          - type: paragraphe
            texte: "Sans regarder de nouveau le carton, ce groupe doit pouvoir indiquer :"
          - type: liste
            elements:
                - ce qui est organisé ;
                - la date ;
                - l'heure ;
                - le lieu ;
                - qui organise l'événement.
      questions:
          - id: q01
            type: texte
            enonce: "Question 8 : quel point positif l'autre groupe a-t-il relevé ?"
          - id: q02
            type: texte
            enonce: "Question 9 : quelle amélioration vous a-t-il proposée ?"
          - id: q03
            type: texte
            enonce: "Question 10 : qu'avez-vous modifié après ce retour ?"
            suite:
                - type: titre
                  texte: AIDE SI BESOIN – Notre invitation n'est pas comprise rapidement
                - type: paragraphe
                  texte: "Indice 1/3 : regardez d'abord la taille du titre."
                - type: paragraphe
                  texte: "Indice 2/3 : vérifiez ensuite la visibilité de la date et de l'heure."
                - type: paragraphe
                  texte: "Indice 3/3 : supprimez éventuellement un élément décoratif et donnez davantage de place aux informations importantes."
                - type: paragraphe
                  texte: Commentaire professeur – Retour entre pairs
                - type: paragraphe
                  texte: "Demander un retour constructif : un élément réussi et une proposition d'amélioration."
                - type: paragraphe
                  texte: Le retour n'a d'intérêt que si le groupe examine ensuite sa production et effectue au moins une modification lorsque cela est pertinent.
                - type: paragraphe
                  texte: Valoriser la capacité à corriger et améliorer, pas uniquement la première version obtenue.
    - id: a12
      titre: 8. Trois modèles de cartons d'invitation
      contenu:
          - type: paragraphe
            texte: Ces exemples présentent trois manières différentes d'organiser les informations. Ils sont conçus pour être réalisables dans Writer.
          - type: paragraphe
            texte: "Important : les titres sont illustratifs. Utilisez le titre retenu par l'ensemble des apprenants de 3e."
          - type: paragraphe
            texte: MFR – CLASSES DE 3e
          - type: paragraphe
            texte: Les apprenants ont le plaisir de vous inviter à leur rencontre
          - type: titre
            texte: Nos apprentissages, nos projets, nos réussites
          - type: paragraphe
            texte: Photographie autorisée de la MFR ou logo officiel
          - type: paragraphe
            texte: Un moment pour partager nos expériences à la MFR et en stage.
          - type: paragraphe
            texte: 04 DÉCEMBRE 2026
          - type: paragraphe
            texte: 11 h
          - type: paragraphe
            texte: "Lieu : MFR Saint-Flour, 10 Rte de Massales, 15100 Saint-Flour"
          - type: paragraphe
            texte: Au plaisir de vous accueillir
          - type: paragraphe
            texte: Modèle A – Classique et élégant
          - type: paragraphe
            texte: Une présentation sobre, avec une photographie de la MFR ou son logo. Adaptée aux familles, maîtres de stage, équipes pédagogiques et membres du CA.
          - type: paragraphe
            texte: UNE RENCONTRE ORGANISÉE PAR LES 3e
          - type: paragraphe
            texte: Photographie d'une activité ou réalisation effectuée à la MFR
          - type: titre
            texte: Une année pour apprendre, des expériences à partager
          - type: paragraphe
            texte: Découvrez nos projets et nos expériences professionnelles.
          - type: paragraphe
            texte: VENDREDI 04/12/2026
          - type: paragraphe
            texte: 11 H
          - type: paragraphe
            texte: Les apprenants de 3e de la MFR
          - type: paragraphe
            texte: "Lieu : MFR Saint-Flour, 10 Rte de Massales, 15100 Saint-Flour"
          - type: paragraphe
            texte: Nous serons heureux de partager nos réalisations avec vous.
          - type: paragraphe
            texte: Modèle B – Moderne et dynamique
          - type: paragraphe
            texte: Une présentation avec une photographie représentative des activités de la MFR et un bandeau mettant en évidence la date et l'heure.
          - type: paragraphe
            texte: APPRENDRE • DÉCOUVRIR • PARTAGER
          - type: titre
            texte: Regards croisés sur notre année en alternance
          - type: paragraphe
            texte: Nos stages
          - type: paragraphe
            texte: Nos métiers
          - type: paragraphe
            texte: Nos projets
          - type: paragraphe
            texte: Nos réussites
          - type: paragraphe
            texte: Photographies autorisées de plusieurs activités et métiers
          - type: paragraphe
            texte: Les apprenants de 3e vous invitent à découvrir leurs expériences et leurs réalisations.
          - type: paragraphe
            texte: 04.12.2026
          - type: paragraphe
            texte: À 11 h
          - type: paragraphe
            texte: "Lieu : MFR Saint-Flour, 10 Rte de Massales, 15100 Saint-Flour"
          - type: paragraphe
            texte: UNE RENCONTRE PRÉPARÉE PAR LES APPRENANTS
          - type: paragraphe
            texte: Modèle C – Créatif et professionnel
          - type: paragraphe
            texte: Une invitation qui met en valeur la diversité des métiers, les projets et les expériences à travers plusieurs photographies de la MFR.
          - type: paragraphe
            texte: Commentaire professeur – Utilisation des modèles
          - type: paragraphe
            texte: Les trois modèles sont des exemples de composition. Les rectangles en pointillés indiquent les emplacements où les élèves peuvent ajouter leurs propres photographies autorisées.
          - type: paragraphe
            texte: Éviter les illustrations génériques sans rapport avec l'établissement. Les visuels doivent montrer la MFR, ses activités ou des réalisations effectivement liées à la formation.
          - type: paragraphe
            texte: Le modèle A convient aux groupes débutants. Le modèle B demande un peu plus de travail sur la mise en page. Le modèle C est adapté aux groupes qui souhaitent valoriser plusieurs activités.
      questions: []
    - id: a13
      titre: 9. Exporter et rendre le travail – 5 minutes
      contenu:
          - type: paragraphe
            texte: Enregistrez d'abord une dernière fois votre fichier Writer avec Ctrl + S.
          - type: paragraphe
            texte: "Vous devez conserver :"
          - type: paragraphe
            texte: 4e3e_S02_Groupe01.odt
          - type: paragraphe
            texte: Créez ensuite la version PDF.
          - type: paragraphe
            texte: Utilisez la fonction d'export au format PDF de LibreOffice Writer.
          - type: paragraphe
            texte: Enregistrez le PDF dans le même dossier.
          - type: paragraphe
            texte: Nommez-le 4e3e_S02_Groupe01.pdf.
          - type: paragraphe
            texte: Ouvrez le PDF.
      questions:
          - id: q01
            type: texte
            enonce: Vérifiez qu'il ne comporte qu'une seule page.
            suite: []
          - id: q02
            type: texte
            enonce: Vérifiez qu'aucun texte ou visuel n'a disparu.
            suite:
                - type: paragraphe
                  texte: "Source : LibreOffice – Menu Fichier et export PDF ."
                - type: lien
                  titre: LibreOffice – Menu Fichier et export PDF
                  url: https://help.libreoffice.org/latest/fr/text/shared/menu/PickList.html?DbPAR=WRITER
                - type: titre
                  texte: Rendu obligatoire
                - type: paragraphe
                  texte: "Chaque groupe remet au professeur :"
                - type: liste
                  elements:
                      - 4e3e_S02_Groupe01.odt ;
                      - 4e3e_S02_Groupe01.pdf.
                - type: paragraphe
                  texte: Le travail doit être rendu même si vous estimez qu'il n'est pas totalement terminé.
                - type: paragraphe
                  texte: Commentaire professeur – Rendu
                - type: paragraphe
                  texte: Récupérer impérativement le fichier ODT et le PDF.
                - type: paragraphe
                  texte: Le fichier ODT doit être conservé pour permettre une correction ultérieure du titre, d'une date, d'une formulation ou d'un élément graphique avant une éventuelle diffusion réelle.
                - type: paragraphe
                  texte: Ne jamais diffuser directement les productions élèves sans validation finale du contenu, des informations factuelles et des droits relatifs aux photographies utilisées.
    - id: a14
      titre: Pour aller plus loin
      contenu:
          - type: paragraphe
            texte: "Si votre groupe termine en avance, réalisez l'un des défis suivants :"
          - type: paragraphe
            texte: Créez une deuxième version de votre invitation avec une organisation visuelle différente.
      questions:
          - id: q01
            type: texte
            enonce: Comparez les deux versions et indiquez laquelle communique le mieux les informations importantes.
            suite:
                - type: paragraphe
                  texte: Demandez à un élève qui n'a pas participé à votre groupe laquelle il comprend le plus rapidement.
                - type: paragraphe
                  texte: Commentaire professeur – Différenciation
                - type: paragraphe
                  texte: "Pour les élèves de 4e ou les groupes fragiles : réussite attendue = carton complet, lisible, enregistré correctement et contenant une image pertinente."
                - type: paragraphe
                  texte: "Pour les 3e ou groupes autonomes : demander davantage de justification sur la hiérarchie visuelle, le choix des images et l'adaptation aux différents destinataires."
                - type: paragraphe
                  texte: La différenciation porte ici sur le degré d'autonomie et de justification, pas sur la réalisation d'un projet complètement différent.
      facultatif: true
    - id: a15
      titre: À retenir
      contenu:
          - type: liste
            elements:
                - Un document de communication est conçu pour un destinataire et un objectif.
                - Les informations importantes doivent être hiérarchisées et faciles à retrouver.
                - Un cahier des charges indique les éléments que la production doit respecter.
                - La mise en forme et les images doivent aider à transmettre le message, pas gêner sa lecture.
                - Une production numérique peut être testée, critiquée puis améliorée.
                - Le fichier ODT permet de continuer à modifier le document.
                - Le fichier PDF permet notamment de transmettre une version dont la présentation reste stable.
                - Avant de diffuser un document réel, il faut vérifier son contenu et les droits concernant les images utilisées.
      questions: []
