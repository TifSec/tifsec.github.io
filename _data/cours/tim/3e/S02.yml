titre: 'Séance 2 : Un rapport de stage avec un sommaire automatique'
themes:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
problematique: Comment organiser un long document pour que le lecteur s’y retrouve ?
competences_bo:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
objectifs:
    connaissances:
        - Un long document est structuré par des styles de titres hiérarchisés (Titre 1, Titre 2).
        - Writer construit un sommaire (table des matières) à partir de ces styles et le met à jour.
    competences:
        - Appliquer une hiérarchie de titres.
        - Insérer et mettre à jour un sommaire.
pourquoi:
    - En 4e, tu as utilisé les styles sur une fiche d’une page.
    - 'Ton rapport de stage fera plusieurs pages : le lecteur doit trouver chaque partie.'
activites:
    -   id: a01
        titre: Le plan du rapport
        consigne: Tu vas associer un niveau de titre à chaque ligne du plan du rapport de Manon (document 1). On attend Titre 1 ou Titre 2 pour chaque ligne.
        contenu:
            -   type: code
                texte: "1. La structure de stage\n   1.1 Les installations\n   1.2 Les chevaux et leurs soins\n2. Mes activités\n   2.1 Une journée type\n   2.2 Ce que j’ai appris"
            -   type: etapes
                elements:
                    - Lis le plan du rapport de Manon (document 1).
                    - Repère les grandes parties et les sous-parties.
                    - Associe un niveau de titre à chaque ligne.
            -   type: paragraphe
                texte: 'Pourquoi deux niveaux ? Les grandes parties (Titre 1) contiennent des sous-parties (Titre 2) : c’est la hiérarchie.'
        questions:
            -   id: q01
                type: tableau
                enonce: 'D’après le document 1, quel style donner à chaque ligne : Titre 1 ou Titre 2 ?'
                colonnes:
                    - Ligne du plan
                    - Style
                lignes:
                    -   - La structure de stage
                        - ''
                    -   - Les installations
                        - ''
                    -   - Les chevaux et leurs soins
                        - ''
                    -   - Mes activités
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: Appliquer les styles
        transition: Le plan est clair. Applique-le dans Writer.
        consigne: Tu vas appliquer les styles de titres au rapport brut fourni, puis contrôler la structure avec le Navigateur. On attend une explication d’erreur et le nombre de titres.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre le fichier fourni rapport_brut.odt et enregistre-le sous 3e_S02_tonprenom.odt.
                    - Applique Titre 1 et Titre 2 selon le plan.
                    - 'Ouvre le Navigateur (F5) : vérifie que la hiérarchie apparaît.'
            -   type: paragraphe
                texte: 'Pourquoi le Navigateur ? Il montre la structure telle que Writer la comprend : s’il manque un titre, c’est qu’un style est oublié.'
        questions:
            -   id: q01
                type: qcm
                enonce: Dans le Navigateur, une sous-partie n’apparaît pas sous sa partie. Pourquoi ?
                choix:
                    -   id: a
                        texte: Son style n’est pas Titre 2.
                    -   id: b
                        texte: Le texte est trop long.
                    -   id: c
                        texte: Le fichier n’est pas enregistré.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Combien de titres de niveau 1 et de niveau 2 compte ton document ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a03
        titre: Le sommaire automatique
        transition: La structure est en place. Writer peut maintenant faire le sommaire.
        consigne: Tu vas insérer un sommaire automatique dans le rapport et le mettre à jour après une modification. On attend ce que fait la mise à jour.
        contenu:
            -   type: etapes
                elements:
                    - Place le curseur en haut, après la page de titre.
                    - Insertion > Table des matières et index > Table des matières.
                    - Change un titre, puis clic droit sur le sommaire > Mettre à jour.
                    - Enregistre.
            -   type: paragraphe
                texte: Pourquoi « automatique » ? Si tu ajoutes une partie ou si les pages bougent, un clic remet le sommaire à jour.
        questions:
            -   id: q01
                type: texte
                enonce: Explique ce qui se passe quand tu modifies un titre puis mets à jour le sommaire.
                aide: Une idée + « car » + une raison tirée de la séance.
            -   id: q02
                type: qcm
                enonce: Que faut-il faire après avoir ajouté une partie au rapport ?
                choix:
                    -   id: a
                        texte: Mettre à jour le sommaire.
                    -   id: b
                        texte: Le retaper.
                    -   id: c
                        texte: Rien, c’est impossible.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: On peut numéroter les titres automatiquement (1., 1.1…).
        questions:
            -   id: q01
                type: texte
                enonce: Quel menu permet de le faire ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton rapport est structuré. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment organiser un long document pour que le lecteur s’y retrouve ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Titre 1 : partie ; Titre 2 : sous-partie.'
    - 'Sommaire : Insertion > Table des matières ; clic droit > Mettre à jour.'
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
