bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
ressources:
    - type: paragraphe
      texte: Réalise les manipulations dans le logiciel demandé. Conserve tes fichiers sur ton espace habituel. Le site enregistre seulement tes réponses écrites, tes résultats, tes formules et tes démarches ; aucun fichier n’est téléversé.
introduction:
    - type: titre
      texte: Ce que vous allez apprendre
    - type: liste
      elements:
          - Comprendre le rôle d'un document de communication.
          - Identifier les informations indispensables dans une invitation.
          - Adapter un document à ses destinataires.
          - Hiérarchiser des informations pour faciliter leur lecture.
          - Comprendre l'intérêt d'un cahier des charges.
          - Comprendre la différence entre le contenu d'un document et sa présentation.
          - Comprendre l'intérêt d'un fichier modifiable et d'une version PDF destinée à être diffusée.
    - type: titre
      texte: Ce que vous allez apprendre à faire
    - type: liste
      elements:
          - Vous organiser dans un groupe.
          - Créer et enregistrer un document correctement nommé.
          - Régler une page au format A5.
          - Organiser les informations dans LibreOffice Writer.
          - Mettre en valeur les informations importantes.
          - Insérer et dimensionner une image.
          - Respecter un cahier des charges.
          - Évaluer et améliorer une production numérique.
          - Exporter une version finale au format PDF.
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://chlorofil.fr/diplomes/secondaire/4e-3e
