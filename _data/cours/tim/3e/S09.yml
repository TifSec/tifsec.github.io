titre: 'Séance 9 : Voir les alertes en couleur : la mise en forme conditionnelle'
themes:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
problematique: Comment faire ressortir automatiquement les valeurs importantes d’un tableau ?
competences_bo:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
objectifs:
    connaissances:
        - La mise en forme conditionnelle change la couleur d’une cellule selon sa valeur.
        - Elle se met à jour toute seule quand la valeur change.
    competences:
        - Créer une règle de mise en forme conditionnelle.
        - Choisir des couleurs lisibles et logiques.
pourquoi:
    - En S06, ton tableur écrivait « VERMIFUGER ».
    - Dans un grand tableau, une couleur se voit encore plus vite qu’un mot.
activites:
    -   id: a01
        titre: Quelle valeur faire ressortir ?
        consigne: Tu vas repérer, dans les températures du matin (document 1), les chevaux au-dessus de 38,5 °C. On attend leurs noms.
        contenu:
            -   type: tableau
                titre: 'Document 1 — Températures du matin (fictives ; normale du cheval adulte : 37,5 à 38,5 °C)'
                colonnes:
                    - Cheval
                    - Température (°C)
                lignes:
                    -   - Tango
                        - '39,2'
                    -   - Iris
                        - '38,8'
                    -   - Nuage
                        - '37,6'
                    -   - Galopin
                        - '38,1'
            -   type: etapes
                elements:
                    - Lis le tableau des températures de chevaux (document 1).
                    - 'Lis la règle : au-dessus de 38,5 °C, appeler le vétérinaire.'
                    - Repère les chevaux concernés.
            -   type: paragraphe
                texte: Pourquoi une règle claire ? La couleur doit signaler un vrai problème, défini à l’avance.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, quels chevaux ont une température qui impose d’appeler le vétérinaire ?
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
    -   id: a02
        titre: Créer la règle
        transition: Tu sais quelles valeurs alerter. Programme la couleur.
        consigne: Tu vas créer une règle de mise en forme conditionnelle qui colore en rouge les températures au-dessus de 38,5 °C. On attend la description de ta règle et son comportement.
        contenu:
            -   type: etapes
                elements:
                    - Recopie le document 1 dans Calc ; enregistre sous 3e_S09_tonprenom.ods.
                    - Sélectionne les températures.
                    - 'Format > Conditionnel > Condition : « supérieure à » 38,5 ; style « Mauvais » (fond rouge).'
                    - Vérifie les couleurs.
            -   type: paragraphe
                texte: 'Pourquoi le rouge ? C’est la couleur de l’alerte : le lecteur comprend sans légende.'
        questions:
            -   id: q01
                type: texte
                enonce: 'Décris ta règle : condition, valeur, couleur.'
                aide: 'Bloc par bloc : quand ? quelle condition ? quelle action ?'
            -   id: q02
                type: qcm
                enonce: La température de Nuage passe à 39 °C. Que se passe-t-il ?
                choix:
                    -   id: a
                        texte: Sa cellule devient rouge toute seule.
                    -   id: b
                        texte: Rien, il faut refaire la règle.
                    -   id: c
                        texte: Toute la colonne devient rouge.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a03
        titre: Une deuxième règle
        transition: L’alerte rouge marche. Ajoute l’alerte inverse.
        consigne: Tu vas ajouter une deuxième règle pour les températures trop basses et vérifier la lisibilité. On attend ton test et une règle de lisibilité.
        contenu:
            -   type: etapes
                elements:
                    - 'Ajoute une condition : inférieure à 37,5 → fond orange (température basse).'
                    - Change une valeur pour tester.
                    - Vérifie que les couleurs restent lisibles (texte foncé sur fond clair).
            -   type: paragraphe
                texte: 'Pourquoi tester la lisibilité ? Un texte clair sur fond clair ne se lit pas : la couleur ne doit pas cacher la valeur.'
        questions:
            -   id: q01
                type: texte
                enonce: Quelle valeur as-tu testée pour la règle orange, et quel résultat as-tu observé ?
                aide: Action → résultat attendu → résultat observé ; une seule chose à la fois.
            -   id: q02
                type: qcm
                enonce: Pourquoi éviter un texte jaune sur fond blanc ?
                choix:
                    -   id: a
                        texte: Il est presque illisible.
                    -   id: b
                        texte: Il est interdit.
                    -   id: c
                        texte: Il imprime mal en couleur.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Calc propose des « barres de données ».
        questions:
            -   id: q01
                type: texte
                enonce: À quoi servent-elles dans une colonne de poids ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Les alertes se voient. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment faire ressortir automatiquement les valeurs importantes d’un tableau ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Format > Conditionnel : condition → style.'
    - Couleurs logiques (rouge = alerte) et lisibles.
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
