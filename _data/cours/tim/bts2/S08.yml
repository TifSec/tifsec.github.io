titre: Évaluation – Exploiter des données pour aider à la décision
theme: TIM — Évaluation – Exploiter des données pour aider à la décision
problematique: Évaluation – Exploiter des données pour aider à la décision
pourquoi: "Depuis plusieurs séances, vous avez progressivement transformé des données brutes en informations utiles :"
application: Une exploitation souhaite faire un premier bilan de plusieurs parcelles fourragères.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances: []
    competences: []
activites:
    - id: a01
      titre: Pour commencer
      contenu:
          - type: paragraphe
            texte: "Durée : 55 minutes – Travail individuel – Note sur 20"
      questions: []
    - id: a02
      titre: Compétences évaluées
      contenu:
          - type: liste
            elements:
                - repérer des données douteuses ou mal structurées ;
                - construire des indicateurs avec des formules ;
                - automatiser une règle avec SI ;
                - croiser plusieurs conditions avec ET et OU ;
                - choisir une fonction adaptée parmi NB.SI, SOMME.SI et MOYENNE.SI ;
                - réaliser une synthèse avec une table dynamique ;
                - produire une représentation graphique adaptée ;
                - interpréter les résultats sans aller au-delà de ce que montrent les données.
      questions: []
    - id: a03
      titre: Pourquoi cette évaluation ?
      contenu:
          - type: paragraphe
            texte: "Depuis plusieurs séances, vous avez progressivement transformé des données brutes en informations utiles :"
          - type: paragraphe
            texte: vérifier → calculer → automatiser → synthétiser → représenter → interpréter.
          - type: paragraphe
            texte: Cette évaluation permet de vérifier que vous êtes maintenant capable de choisir vous-même les outils adaptés à une situation professionnelle.
      questions: []
    - id: a04
      titre: À quoi cela va-t-il servir ?
      contenu:
          - type: paragraphe
            texte: Dans votre futur environnement professionnel, un logiciel ne vous indiquera pas toujours quelle formule utiliser ou quel graphique créer.
          - type: paragraphe
            texte: Vous devrez être capable d'identifier le besoin, de choisir l'outil adapté et de vérifier que le résultat obtenu a réellement du sens.
      questions: []
    - id: a05
      titre: Situation professionnelle
      contenu:
          - type: paragraphe
            texte: Une exploitation souhaite faire un premier bilan de plusieurs parcelles fourragères.
          - type: paragraphe
            texte: Vous recevez un tableau contenant des données de production, de coût et de temps de travail.
          - type: paragraphe
            texte: Votre mission consiste à vérifier les données, produire quelques indicateurs et faire ressortir les informations importantes.
          - type: paragraphe
            texte: Les données de cette évaluation sont fictives et ont été créées uniquement à des fins pédagogiques.
      questions: []
    - id: a06
      titre: 1. Créer votre fichier
      contenu:
          - type: paragraphe
            texte: "Ouvrez LibreOffice Calc et créez un fichier nommé :"
          - type: paragraphe
            texte: BTS2_ACSAGRI_EVAL1_NOM_Prenom.ods
          - type: paragraphe
            texte: "Créez quatre feuilles :"
          - type: liste
            elements:
                - Donnees
                - Analyse
                - Synthese
                - Bilan
      questions: []
    - id: a07
      titre: 2. Vérifier les données – 2 points
      contenu:
          - type: paragraphe
            texte: "Copiez le tableau suivant dans la feuille Donnees :"
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Parcelle
                - Culture
                - Surface (ha)
                - Production (t MS)
                - Coût intrants (€)
                - Temps de travail (h)
                - Azote total (kg)
            lignes:
                - - E01
                  - Prairie permanente
                  - 7,2
                  - 38,9
                  - "1280"
                  - "49"
                  - "300"
                - - E02
                  - Maïs ensilage
                  - 5,0
                  - 58,5
                  - "3250"
                  - "56"
                  - "740"
                - - E03
                  - Prairie temp.
                  - 6,4
                  - 43,5
                  - "1790"
                  - "50"
                  - "420"
                - - E04
                  - Méteil
                  - 4,5
                  - 29,7
                  - "1890"
                  - "39"
                  - "280"
                - - E05
                  - Prairie permanente
                  - 8,8
                  - 47,2
                  - "1490"
                  - "61"
                  - ""
                - - E06
                  - Maïs ensilage
                  - 5,3
                  - 61,0
                  - "3420"
                  - "63"
                  - "7600"
            suite:
                - type: paragraphe
                  texte: Pourquoi cette partie ? Avant d'effectuer des calculs, il faut vérifier que les données utilisées sont suffisamment cohérentes.
                - type: paragraphe
                  texte: Dans la feuille Bilan, indiquez trois éléments qui méritent une vérification ou une correction.
                - type: paragraphe
                  texte: Vous pouvez corriger une écriture manifestement non standardisée, mais n'inventez jamais une valeur inconnue ou suspecte.
    - id: a08
      titre: 3. Construire des indicateurs – 3 points
      contenu:
          - type: paragraphe
            texte: Nous avons vérifié les données. Nous pouvons maintenant les transformer en indicateurs comparables.
          - type: paragraphe
            texte: "Copiez dans la feuille Analyse les colonnes :"
          - type: liste
            elements:
                - Parcelle ;
                - Culture ;
                - Surface ;
                - Production ;
                - Coût intrants ;
                - Temps de travail.
          - type: paragraphe
            texte: Corrigez Prairie temp. en Prairie temporaire.
          - type: paragraphe
            texte: "Ajoutez puis calculez automatiquement les trois indicateurs suivants :"
          - type: etapes
            elements:
                - Rendement (t MS/ha)
                - Coût intrants (€/ha)
                - Temps de travail (h/ha)
          - type: paragraphe
            texte: Pourquoi passer à ces indicateurs ? Les parcelles n'ont pas toutes la même surface. Ramener les valeurs à l'hectare permet de les comparer plus justement.
      questions: []
    - id: a09
      titre: 4. Automatiser une première règle – 3 points
      contenu:
          - type: paragraphe
            texte: Nous disposons maintenant d'un coût par hectare.
          - type: paragraphe
            texte: "L'exploitation fixe pour cet exercice l'objectif interne suivant :"
          - type: paragraphe
            texte: "Coût intrants maximum : 400 €/ha"
          - type: paragraphe
            texte: Cette valeur est fictive et ne constitue pas une recommandation agricole.
          - type: paragraphe
            texte: Pourquoi cette partie ? Lorsqu'un tableau comporte de nombreuses lignes, il est plus fiable de faire appliquer automatiquement une règle que de vérifier chaque valeur manuellement.
          - type: paragraphe
            texte: Dans une zone libre de la feuille Analyse, inscrivez le paramètre 400 €/ha.
          - type: paragraphe
            texte: Ajoutez une colonne Alerte coût.
          - type: paragraphe
            texte: "Créez une formule permettant d'afficher :"
          - type: liste
            elements:
                - À surveiller lorsque le coût dépasse le paramètre ;
                - OK sinon.
          - type: paragraphe
            texte: La formule doit utiliser une référence absolue vers le paramètre.
      questions: []
    - id: a10
      titre: 5. Croiser deux critères – 3 points
      contenu:
          - type: paragraphe
            texte: "Nous allons maintenant tenir compte d'un deuxième indicateur :"
          - type: paragraphe
            texte: "Temps de travail maximum : 9 h/ha"
          - type: paragraphe
            texte: Pourquoi passer à deux critères ? Une situation professionnelle dépend rarement d'une seule valeur. Croiser plusieurs informations permet de faire ressortir les situations cumulant plusieurs points de vigilance.
          - type: paragraphe
            texte: Ajoutez ce deuxième paramètre dans votre zone de paramètres.
          - type: paragraphe
            texte: "Ajoutez une colonne Priorité et appliquez la règle suivante :"
          - type: liste
            elements:
                - Prioritaire si le coût dépasse 400 €/ha ET le temps de travail dépasse 9 h/ha ;
                - À surveiller si un seul des deux critères est dépassé ;
                - OK si aucun des deux critères n'est dépassé.
          - type: paragraphe
            texte: Choisissez vous-même les fonctions adaptées.
      questions: []
    - id: a11
      titre: 6. Produire des indicateurs de synthèse – 3 points
      contenu:
          - type: paragraphe
            texte: Nous avons analysé chaque ligne. Nous allons maintenant résumer l'ensemble du tableau.
          - type: paragraphe
            texte: Pourquoi changer d'échelle ? Un responsable a souvent besoin de quelques indicateurs globaux plutôt que de relire toutes les parcelles une par une.
          - type: paragraphe
            texte: "Dans la feuille Synthese, calculez automatiquement :"
          - type: etapes
            elements:
                - le nombre de parcelles Prioritaires ;
                - la surface totale en Maïs ensilage ;
                - le rendement moyen du Maïs ensilage.
          - type: paragraphe
            texte: Choisissez vous-même la fonction adaptée pour chaque calcul.
      questions: []
    - id: a12
      titre: 7. Réaliser une table dynamique – 2 points
      contenu:
          - type: paragraphe
            texte: Les fonctions précédentes répondent à trois questions précises.
          - type: paragraphe
            texte: Nous voulons maintenant comparer toutes les cultures sans écrire une série de nouvelles formules.
          - type: paragraphe
            texte: Pourquoi passer à une table dynamique ? Elle permet de regrouper automatiquement les données par catégorie et de produire plusieurs indicateurs en une seule synthèse.
          - type: paragraphe
            texte: "À partir de la feuille Analyse, créez une table dynamique permettant d'afficher pour chaque culture :"
          - type: liste
            elements:
                - la surface totale ;
                - le rendement moyen.
          - type: paragraphe
            texte: Placez cette table dans la feuille Synthese, sous les indicateurs précédents.
      questions: []
    - id: a13
      titre: 8. Présenter le résultat – 2 points
      contenu:
          - type: paragraphe
            texte: Nous disposons maintenant d'une synthèse numérique.
          - type: paragraphe
            texte: Nous voulons permettre à un responsable de comparer rapidement les rendements moyens des différentes cultures.
          - type: paragraphe
            texte: Pourquoi passer à un graphique ? Une représentation visuelle permet de repérer plus rapidement les écarts entre catégories.
          - type: paragraphe
            texte: À partir de votre table dynamique, créez un graphique adapté à cette question.
          - type: paragraphe
            texte: "Il doit comporter :"
          - type: liste
            elements:
                - un type de graphique pertinent ;
                - un titre explicite ;
                - les noms des cultures ;
                - l'unité t MS/ha.
      questions: []
    - id: a14
      titre: 9. Interpréter sans décider trop vite – 2 points
      contenu:
          - type: paragraphe
            texte: Le graphique et la table dynamique montrent que le Maïs ensilage possède le rendement moyen le plus élevé dans ce jeu de données.
          - type: paragraphe
            texte: "Dans la feuille Bilan, répondez en 3 à 5 lignes :"
          - type: paragraphe
            texte: Peut-on conclure que le Maïs ensilage est forcément la culture la plus intéressante pour cette exploitation ? Justifiez.
      questions: []
    - id: a15
      titre: 10. Avant de rendre
      contenu:
          - type: paragraphe
            texte: "Vérifiez que votre fichier comporte :"
          - type: liste
            elements:
                - la feuille Donnees ;
                - la feuille Analyse avec les trois indicateurs ;
                - une alerte coût calculée automatiquement ;
                - un classement Priorité ;
                - les trois indicateurs de synthèse ;
                - une table dynamique ;
                - un graphique ;
                - vos réponses dans la feuille Bilan.
          - type: paragraphe
            texte: "Enregistrez sous :"
          - type: paragraphe
            texte: BTS2_ACSAGRI_EVAL1_NOM_Prenom.ods
          - type: paragraphe
            texte: Déposez ensuite le fichier dans l'espace indiqué par le professeur.
      questions: []
    - id: a16
      titre: Après cette évaluation
      contenu:
          - type: paragraphe
            texte: Nous allons changer de type de problème.
          - type: paragraphe
            texte: Jusqu'ici, toutes nos données tenaient dans un même tableur.
          - type: paragraphe
            texte: Nous allons maintenant nous demander comment organiser des informations lorsqu'elles deviennent plus nombreuses, qu'elles concernent plusieurs types d'objets et qu'elles doivent être reliées entre elles.
          - type: paragraphe
            texte: Nous commencerons donc la prochaine fois à travailler sur les bases de données relationnelles.
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
ressources:
    - type: paragraphe
      texte: Réalise les manipulations dans le logiciel demandé. Conserve tes fichiers sur ton espace habituel. Le site enregistre seulement tes réponses écrites, tes résultats, tes formules et tes démarches ; aucun fichier n’est téléversé.
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://chlorofil.fr/diplomes/secondaire/btsa/acse/acs-agri-2025
