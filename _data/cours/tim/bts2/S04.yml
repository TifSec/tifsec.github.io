titre: 'Séance 4 : Modéliser les données de l’élevage'
themes:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
problematique: Comment concevoir l’organisation des données d’un élevage avant de créer le classeur ?
competences_bo:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
objectifs:
    connaissances:
        - 'Modéliser : lister les sujets (jument, étalon, saillie, poulain, soin) qui deviendront des feuilles, leurs informations (les colonnes) et les liens entre eux.'
        - 'Règles : chaque information dépend de l’identifiant de sa feuille ; on ne tape pas à la main ce qui se calcule (l’âge se calcule par formule).'
    competences:
        - Construire un schéma simple des données.
        - Choisir les colonnes et les identifiants.
pourquoi:
    - En S03, tu as lu un classeur déjà organisé.
    - Tu conçois maintenant celui de l’élevage du Moulin, avec ses soins vétérinaires.
activites:
    -   id: a01
        titre: Les sujets et leurs informations
        consigne: Tu vas lister les sujets (futures feuilles) et leurs informations à partir du cahier des charges (document 1). On attend les colonnes de trois feuilles.
        contenu:
            -   type: paragraphe
                texte: 'Document 1 — L’éleveur veut : la liste de ses juments et étalons utilisés, chaque saillie (date, résultat d’échographie), les poulains nés, et les soins (vermifuges, vaccins, traitements) de chaque jument avec les délais d’attente.'
            -   type: etapes
                elements:
                    - Lis le cahier des charges (document 1).
                    - Liste les sujets (une feuille par sujet) et leurs informations (les colonnes).
                    - Pourquoi partir du cahier des charges ? Le classeur doit répondre aux questions de l’éleveur.
        questions:
            -   id: q01
                type: tableau
                enonce: Complète pour trois feuilles.
                colonnes:
                    - Feuille
                    - Colonnes (identifiant marqué par *)
                lignes:
                    -   - Jument
                        - ''
                    -   - Étalon
                        - ''
                    -   - Soin
                        - ''
                aide: Pour chaque feuille, commence par l’identifiant (id_…), puis les informations qui la décrivent sans dépendre d’autre chose.
    -   id: a02
        titre: Les liens
        transition: Les feuilles sont prêtes. Relie-les.
        consigne: Tu vas décrire les liens entre les feuilles de ton modèle. On attend les liens et la place des colonnes qui renvoient à une autre feuille.
        contenu:
            -   type: etapes
                elements:
                    - 'Dessine le schéma : les feuilles reliées, avec le sens du lien (1 pour plusieurs).'
                    - Place les colonnes qui renvoient (id_jument, id_etalon…).
                    - Pourquoi côté « plusieurs » ? Chaque saillie connaît sa jument ; une jument ne peut pas lister toutes ses saillies dans une seule cellule.
        questions:
            -   id: q01
                type: texte
                enonce: Décris les liens de ton modèle et la place des colonnes qui renvoient à une autre feuille.
                aide: Pour chaque lien 1 pour plusieurs, l’identifiant de la feuille « 1 » est recopié dans une colonne de la feuille « plusieurs ». Décris-les un par un.
    -   id: a03
        titre: Les pièges
        transition: Le modèle est dessiné. Vérifie-le.
        consigne: Tu vas repérer, parmi trois colonnes proposées (document 2), celles à éviter. On attend les colonnes et la raison.
        contenu:
            -   type: liste
                elements:
                    - 'Jument : âge.'
                    - 'Jument : nombre de poulains.'
                    - 'Jument : date de naissance.'
            -   type: etapes
                elements:
                    - Lis les trois propositions de colonnes (document 2).
                    - Dis lesquelles sont à éviter.
                    - Pourquoi éviter ? Un âge tapé à la main est faux l’année suivante ; un nombre de poulains tapé à la main contredit la feuille Poulains.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 2, quelles colonnes faut-il éviter, et pourquoi ?
                aide: Dans le document 2, cherche les informations qui changent avec le temps ou qui se calculent par une formule à partir d’autres données.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un étalon peut être utilisé en insémination (paillettes).
        questions:
            -   id: q01
                type: texte
                enonce: Faut-il une nouvelle feuille ?
                aide: L’insémination est une autre façon de faire une saillie. Faut-il une feuille de plus, ou une colonne dans une feuille existante ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Le modèle est prêt. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment concevoir l’organisation des données d’un élevage avant de créer le classeur ?'
                aide: 'Dis les étapes : cahier des charges, feuilles et colonnes, identifiants et liens, pièges évités.'
retenir:
    - Feuilles, colonnes, identifiants ; liens 1 pour plusieurs.
    - 'Ne pas taper ce qui se calcule : on le calcule par formule.'
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
