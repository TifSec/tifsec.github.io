titre: Croiser plusieurs critères pour définir une priorité
theme: TIM — Croiser plusieurs critères pour définir une priorité
problematique: Croiser plusieurs critères pour définir une priorité
pourquoi: "Lors de la séance précédente, le tableur surveillait séparément deux indicateurs :"
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances: []
    competences: []
activites:
    - id: a01
      titre: Pour commencer
      contenu:
          - type: paragraphe
            texte: "Durée prévue : environ 1 heure"
      questions: []
    - id: a02
      titre: Notions et compétences travaillées
      contenu:
          - type: liste
            elements:
                - fonctions logiques ET et OU ;
                - combinaison de plusieurs conditions ;
                - classement automatique selon plusieurs critères ;
                - fonction SI imbriquée ;
                - formatage conditionnel ;
                - lecture et interprétation d'un résultat automatisé.
      questions: []
    - id: a03
      titre: Pourquoi allons-nous travailler cela ?
      contenu:
          - type: paragraphe
            texte: "Lors de la séance précédente, le tableur surveillait séparément deux indicateurs :"
          - type: liste
            elements:
                - le coût des intrants par hectare ;
                - le temps de travail par hectare.
          - type: paragraphe
            texte: Mais dans une situation professionnelle, une décision repose rarement sur un seul critère.
          - type: paragraphe
            texte: "Une parcelle peut par exemple :"
          - type: liste
            elements:
                - coûter cher mais demander peu de travail ;
                - demander beaucoup de travail mais coûter peu ;
                - dépasser les deux objectifs en même temps.
          - type: paragraphe
            texte: Nous allons donc apprendre à croiser plusieurs informations pour faire apparaître différents niveaux de priorité.
      questions: []
    - id: a04
      titre: À quoi cela va-t-il vous servir ?
      contenu:
          - type: paragraphe
            texte: "Cette logique permet de construire des outils capables de :"
          - type: liste
            elements:
                - faire ressortir les situations cumulant plusieurs difficultés ;
                - hiérarchiser des éléments à examiner ;
                - éviter de parcourir manuellement toutes les lignes d'un tableau ;
                - préparer un tableau de bord d'aide à la décision ;
                - rendre immédiatement visibles les situations nécessitant une attention particulière.
      questions: []
    - id: a05
      titre: 1. Reprendre le travail de la séance précédente
      contenu:
          - type: paragraphe
            texte: "Ouvrez :"
          - type: paragraphe
            texte: BTS2_ACSAGRI_S03_NOM_Prenom.ods
          - type: paragraphe
            texte: "Enregistrez immédiatement une copie sous :"
          - type: paragraphe
            texte: BTS2_ACSAGRI_S04_NOM_Prenom.ods
          - type: paragraphe
            texte: "Vérifiez dans la feuille Analyse que vous possédez bien :"
          - type: liste
            elements:
                - un indicateur Coût intrants (€/ha) ;
                - un indicateur Temps de travail (h/ha) ;
                - une colonne Alerte coût ;
                - une colonne Alerte travail.
          - type: paragraphe
            texte: "Vérifiez également dans Parametres :"
          - type: liste
            elements:
                - "Coût maximum : 400 €/ha ;"
                - "Temps de travail maximum : 9 h/ha."
      questions: []
    - id: a06
      titre: 2. Pourquoi passer de deux alertes à une priorité ?
      contenu:
          - type: paragraphe
            texte: Nous avons actuellement deux informations séparées.
          - type: paragraphe
            texte: "Exemple :"
          - type: tableau
            colonnes:
                - Parcelle
                - Alerte coût
                - Alerte travail
            lignes:
                - - Exemple A
                  - OK
                  - OK
                - - Exemple B
                  - À surveiller
                  - OK
                - - Exemple C
                  - OK
                  - À surveiller
                - - Exemple D
                  - À surveiller
                  - À surveiller
          - type: paragraphe
            texte: "Nous souhaitons maintenant obtenir une seule information :"
          - type: liste
            elements:
                - Prioritaire si les deux objectifs sont dépassés ;
                - À surveiller si un seul objectif est dépassé ;
                - OK si aucun objectif n'est dépassé.
      questions: []
    - id: a07
      titre: 3. Comprendre ET
      contenu:
          - type: paragraphe
            texte: "Commençons par la situation la plus importante :"
          - type: paragraphe
            texte: Quand une parcelle doit-elle être classée Prioritaire ?
          - type: paragraphe
            texte: "Notre règle est :"
          - type: paragraphe
            texte: Le coût dépasse 400 €/ha ET le temps de travail dépasse 9 h/ha.
          - type: paragraphe
            texte: Dans Calc, la fonction ET permet de vérifier que plusieurs conditions sont vraies en même temps.
          - type: paragraphe
            texte: "Sa structure générale est :"
          - type: paragraphe
            texte: =ET(condition1;condition2)
          - type: paragraphe
            texte: "Complétez mentalement :"
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Coût > 400
                - Travail > 9
                - Les deux sont-ils vrais ?
            lignes:
                - - Non
                  - Non
                  - ""
                - - Oui
                  - Non
                  - ""
                - - Non
                  - Oui
                  - ""
                - - Oui
                  - Oui
                  - ""
    - id: a08
      titre: 4. Comprendre OU
      contenu:
          - type: paragraphe
            texte: Passons maintenant au niveau À surveiller.
          - type: paragraphe
            texte: Nous voulons utiliser ce niveau lorsque au moins un des deux objectifs est dépassé.
          - type: paragraphe
            texte: La fonction OU est vraie lorsqu'au moins une condition est vraie.
          - type: paragraphe
            texte: "Sa structure est :"
          - type: paragraphe
            texte: =OU(condition1;condition2)
          - type: paragraphe
            texte: "Complétez mentalement :"
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Coût > 400
                - Travail > 9
                - Au moins un est-il vrai ?
            lignes:
                - - Non
                  - Non
                  - ""
                - - Oui
                  - Non
                  - ""
                - - Non
                  - Oui
                  - ""
                - - Oui
                  - Oui
                  - ""
    - id: a09
      titre: 5. Pourquoi commencer par ET avant OU ?
      contenu:
          - type: paragraphe
            texte: Notre classement possède trois niveaux.
          - type: paragraphe
            texte: "Nous devons commencer par rechercher le cas le plus précis :"
          - type: paragraphe
            texte: les deux objectifs sont dépassés → Prioritaire.
          - type: paragraphe
            texte: Seulement si ce premier test est faux, nous regarderons si au moins un objectif est dépassé.
          - type: paragraphe
            texte: "La logique devient donc :"
          - type: etapes
            elements:
                - SI les deux objectifs sont dépassés → Prioritaire ;
                - SINON, SI au moins un objectif est dépassé → À surveiller ;
                - SINON → OK.
      questions: []
    - id: a10
      titre: 6. Construire la colonne Priorité
      contenu:
          - type: paragraphe
            texte: "Dans la feuille Analyse, ajoutez une colonne :"
          - type: paragraphe
            texte: Priorité
          - type: paragraphe
            texte: Essayez maintenant de traduire la règle précédente avec SI, ET et OU.
          - type: titre
            texte: Indice 1
          - type: paragraphe
            texte: "Commencez uniquement par le premier cas : coût supérieur au paramètre ET travail supérieur au paramètre."
          - type: titre
            texte: Indice 2
          - type: paragraphe
            texte: La structure commence par =SI(ET(condition1;condition2);"Prioritaire";...).
          - type: titre
            texte: Indice 3
          - type: paragraphe
            texte: "Une structure possible est :"
          - type: paragraphe
            texte: =SI(ET(I2>$Parametres.$B$2;J2>$Parametres.$B$3);"Prioritaire";SI(OU(I2>$Parametres.$B$2;J2>$Parametres.$B$3);"À surveiller";"OK"))
      questions: []
    - id: a11
      titre: 7. Vérifier que notre classement est cohérent
      contenu:
          - type: paragraphe
            texte: Filtrez ou observez la colonne Priorité.
      questions:
          - id: q01
            type: texte
            enonce: "Q1 : Quelles parcelles sont classées Prioritaire ?"
          - id: q02
            type: texte
            enonce: "Q2 : Quelles parcelles sont classées À surveiller ?"
          - id: q03
            type: texte
            enonce: "Q3 : Pourquoi P04 n'est-elle pas classée Prioritaire ?"
            suite:
                - type: titre
                  texte: Indice 1
                - type: paragraphe
                  texte: Comparez séparément son coût/ha et son temps de travail/ha aux deux objectifs.
                - type: titre
                  texte: Indice 2
                - type: paragraphe
                  texte: Combien de conditions doivent être vraies pour que ET renvoie VRAI ?
                - type: titre
                  texte: Indice 3
                - type: paragraphe
                  texte: Son coût dépasse 400 €/ha, mais son temps de travail reste légèrement inférieur à 9 h/ha. Une seule condition est donc vraie.
    - id: a12
      titre: 8. Pourquoi passer maintenant à la mise en forme ?
      contenu:
          - type: paragraphe
            texte: Notre classement fonctionne, mais il faut encore lire chaque cellule pour repérer les priorités.
          - type: paragraphe
            texte: Un tableau de bord doit permettre de voir rapidement les informations importantes.
          - type: paragraphe
            texte: Nous allons donc conserver exactement les mêmes données, mais améliorer leur lecture visuelle.
      questions: []
    - id: a13
      titre: 9. Mettre en évidence automatiquement les priorités
      contenu:
          - type: paragraphe
            texte: Sélectionnez les cellules de la colonne Priorité.
          - type: paragraphe
            texte: "Utilisez :"
          - type: paragraphe
            texte: Format → Conditionnel → Condition
          - type: paragraphe
            texte: "Créez trois mises en forme permettant de distinguer facilement :"
          - type: liste
            elements:
                - Prioritaire ;
                - À surveiller ;
                - OK.
          - type: paragraphe
            texte: Les couleurs ou styles choisis doivent rester faciles à lire.
      questions:
          - id: q01
            type: texte
            enonce: "Q4 : Pourquoi utiliser un formatage conditionnel plutôt que colorier les cellules manuellement ?"
    - id: a14
      titre: 10. Tester notre classement
      contenu:
          - type: paragraphe
            texte: Un outil automatisé doit être testé.
          - type: paragraphe
            texte: "Dans Parametres, remplacez temporairement :"
          - type: paragraphe
            texte: "Coût intrants maximum : 400 → 700 €/ha"
          - type: paragraphe
            texte: Observez la colonne Priorité.
          - type: paragraphe
            texte: Remettez ensuite la valeur à 400 €/ha.
      questions:
          - id: q01
            type: texte
            enonce: "Q5 : Pourquoi certaines parcelles changent-elles automatiquement de niveau de priorité ?"
    - id: a15
      titre: 11. Une priorité automatique est-elle une décision ?
      contenu:
          - type: paragraphe
            texte: Notre outil classe maintenant automatiquement certaines parcelles comme Prioritaires.
      questions:
          - id: q01
            type: texte
            enonce: "Q6 : Peut-on en conclure qu'il faut automatiquement réduire les intrants ou le temps de travail sur P02, P06 et P10 ? Expliquez."
            suite:
                - type: titre
                  texte: Indice 1
                - type: paragraphe
                  texte: Que connaît réellement le tableur sur ces parcelles ?
                - type: titre
                  texte: Indice 2
                - type: paragraphe
                  texte: Le tableur connaît les valeurs et les seuils, mais connaît-il les raisons du coût ou du temps de travail ?
                - type: titre
                  texte: Indice 3
                - type: paragraphe
                  texte: Le classement indique uniquement que les deux objectifs internes sont dépassés. Il faut encore comprendre pourquoi avant de proposer une action.
    - id: a16
      titre: 12. Faire le lien avec les séances précédentes
      contenu:
          - type: paragraphe
            texte: "Depuis la séance 2, notre outil s'est construit progressivement :"
          - type: paragraphe
            texte: "Séance 2 : données → vérification → indicateurs"
          - type: paragraphe
            texte: "Séance 3 : indicateurs → règles simples → alertes"
          - type: paragraphe
            texte: "Séance 4 : plusieurs règles → priorité → affichage automatique"
          - type: paragraphe
            texte: Nous avons donc commencé à construire un véritable outil d'aide à la décision.
      questions: []
    - id: a17
      titre: 13. Bilan de la séance
      contenu:
          - type: paragraphe
            texte: "Dans la feuille Bilan, complétez :"
          - type: liste
            elements:
                - La fonction ET est vraie lorsque ................................................................................................................
                - La fonction OU est vraie lorsque ................................................................................................................
                - Une fonction SI imbriquée permet de ................................................................................................................
                - Le formatage conditionnel permet de ................................................................................................................
                - Un niveau de priorité automatique sert à ................................................................................................................
          - type: paragraphe
            texte: "Dernière question :"
          - type: paragraphe
            texte: Expliquez en deux ou trois phrases pourquoi nous avons testé ET avant OU dans notre formule.
      questions: []
    - id: a18
      titre: 14. Avant de rendre
      contenu:
          - type: paragraphe
            texte: "Vérifiez que votre fichier possède :"
          - type: liste
            elements:
                - les paramètres 400 €/ha et 9 h/ha ;
                - les colonnes Alerte coût et Alerte travail ;
                - une colonne Priorité calculée automatiquement ;
                - les trois niveaux Prioritaire, À surveiller et OK ;
                - un formatage conditionnel fonctionnel ;
                - vos réponses dans la feuille Bilan.
          - type: paragraphe
            texte: "Vérifiez que le coût maximum est bien revenu à :"
          - type: paragraphe
            texte: 400 €/ha
          - type: paragraphe
            texte: "Enregistrez :"
          - type: paragraphe
            texte: BTS2_ACSAGRI_S04_NOM_Prenom.ods
          - type: paragraphe
            texte: Déposez ensuite le fichier dans l'espace indiqué par le professeur.
      questions: []
    - id: a19
      titre: À retenir
      contenu:
          - type: liste
            elements:
                - ET est vrai lorsque toutes les conditions sont vraies.
                - OU est vrai lorsqu'au moins une condition est vraie.
                - Lorsque plusieurs niveaux existent, l'ordre des tests est important.
                - Une formule peut transformer plusieurs indicateurs en un niveau de priorité.
                - Le formatage conditionnel rend automatiquement les résultats plus faciles à repérer.
                - Une priorité automatique indique quoi examiner en premier ; elle ne décide pas de l'action à entreprendre.
      questions: []
    - id: a20
      titre: Pour la prochaine séance
      contenu:
          - type: paragraphe
            texte: Notre outil sait maintenant repérer et classer automatiquement les parcelles.
          - type: paragraphe
            texte: Mais nous travaillons encore parcelle par parcelle.
          - type: paragraphe
            texte: "Lors de la prochaine séance, nous allons apprendre à répondre automatiquement à des questions comme :"
      questions:
          - id: q01
            type: texte
            enonce: combien de parcelles sont prioritaires ?
          - id: q02
            type: texte
            enonce: quelle est la surface totale consacrée au maïs ?
          - id: q03
            type: texte
            enonce: quel est le rendement moyen d'une culture donnée ?
            suite:
                - type: paragraphe
                  texte: Nous découvrirons pour cela les fonctions NB.SI, SOMME.SI et MOYENNE.SI.
    - id: a21
      titre: Sources et ressources
      contenu:
          - type: liste
            elements:
                - Chlorofil – BTSA ACS'AGRI – référentiel et documents d'accompagnement.
                - Inspection de l'enseignement agricole – Exemples d'utilisation des TIM dans des situations favorisant l'acquisition de capacités.
          - type: lien
            titre: BTSA ACS'AGRI – référentiel et documents d'accompagnement
            url: https://chlorofil.fr/diplomes/secondaire/btsa/acse/acs-agri-2025
          - type: lien
            titre: Exemples d'utilisation des TIM dans des situations favorisant l'acquisition de capacités
            url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
          - type: paragraphe
            texte: Les données et les objectifs utilisés dans cette séance sont fictifs et servent uniquement à l'apprentissage.
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
ressources:
    - type: paragraphe
      texte: Réalise les manipulations dans le logiciel demandé. Conserve tes fichiers sur ton espace habituel. Le site enregistre seulement tes réponses écrites, tes résultats, tes formules et tes démarches ; aucun fichier n’est téléversé.
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://chlorofil.fr/diplomes/secondaire/btsa/acse/acs-agri-2025
