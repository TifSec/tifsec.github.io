titre: 'Séance 3 : Analyser un classeur de données relié'
themes:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
problematique: Comment organiser les données d’un élevage en plusieurs feuilles reliées d’un classeur ?
competences_bo:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
objectifs:
    connaissances:
        - 'Un classeur relié : une feuille par sujet (juments, étalons, saillies…), une colonne par information, un identifiant unique par ligne (id_jument).'
        - 'Une feuille renvoie à une autre par l’identifiant : la feuille Saillies contient id_jument, pas le nom. On évite ainsi de taper 30 fois le nom d’une jument.'
    competences:
        - Repérer les feuilles, les colonnes et les identifiants.
        - Lire les liens entre les feuilles.
pourquoi:
    - Un tableau unique atteint ses limites avec des données liées (juments, saillies, poulains).
    - Avant de construire ton classeur, tu en analyses un déjà organisé.
activites:
    -   id: a01
        titre: Les limites du tableau unique
        consigne: Tu vas repérer dans l’extrait du tableau unique de l’élevage (document 1) les problèmes de répétition. On attend les problèmes et leur conséquence.
        contenu:
            -   type: tableau
                titre: Document 1 — Extrait du tableau unique de l’élevage (fictif)
                colonnes:
                    - Jument
                    - UELN
                    - Étalon
                    - Date saillie
                    - Résultat
                lignes:
                    -   - Belle de Mai
                        - 250001X…01
                        - Quatar
                        - 02/04/2026
                        - pleine
                    -   - Bele de Mai
                        - 250001X…01
                        - Quatar
                        - 20/04/2025
                        - vide
                    -   - Belle de Mai
                        - 250001X…01
                        - Ugo
                        - 15/05/2024
                        - pleine
            -   type: etapes
                elements:
                    - Lis l’extrait du tableau unique de l’élevage (document 1).
                    - Repère les répétitions et les risques.
                    - Pourquoi la répétition (redondance) pose problème ? Si on corrige un nom à un endroit, il reste faux ailleurs.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, quels problèmes pose ce tableau ?
                aide: 'Regarde le document 1 : combien de fois le nom et l’UELN d’une même jument sont-ils tapés ? Que se passe-t-il en cas de faute de frappe ?'
    -   id: a02
        titre: Lire l’organisation du classeur
        transition: Le tableau unique montre ses limites. Regarde un classeur organisé.
        consigne: Tu vas lire l’organisation du classeur elevage_demo.ods. On attend l’identifiant et les colonnes qui renvoient à une autre feuille, pour trois feuilles.
        contenu:
            -   type: fichier
                titre: classeur de démonstration de l’élevage (LibreOffice Calc)
                url: /assets/fichiers/tim/bts2/elevage_demo.ods
            -   type: etapes
                elements:
                    - Ouvre le classeur elevage_demo.ods (à télécharger ci-dessus) dans LibreOffice Calc.
                    - 'Regarde les onglets en bas : une feuille par sujet. Observe la ligne de titres de chaque feuille.'
                    - 'Dans la feuille Saillies, la colonne id_jument contient un numéro : retrouve ce numéro dans la feuille Juments.'
                    - Remplis le tableau.
                    - Pourquoi des identifiants ? Le nom de la jument n’est écrit qu’une seule fois, dans la feuille Juments.
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le classeur, complète.
                colonnes:
                    - Feuille
                    - Identifiant / colonnes qui renvoient à une autre feuille
                lignes:
                    -   - Juments
                        - ''
                    -   - Saillies
                        - ''
                    -   - Poulains
                        - ''
                aide: 'L’identifiant est la première colonne de la feuille (id_…). Les colonnes qui renvoient sont les autres id_… : elles désignent une ligne d’une autre feuille.'
        ressources:
            -   type: lien
                titre: LibreOffice Calc — aide en ligne
                url: https://help.libreoffice.org/latest/fr/text/scalc/main0000.html
    -   id: a03
        titre: Combien de lignes pour une jument ?
        transition: Tu connais les feuilles. Comment sont-elles liées ?
        consigne: Tu vas analyser le lien entre la feuille Juments et la feuille Saillies. On attend le sens du lien et la feuille où se trouve la colonne id_jument.
        contenu:
            -   type: etapes
                elements:
                    - 'Pour chaque lien, demande-toi : combien de lignes de l’une pour une ligne de l’autre ?'
                    - Écris le sens du lien (1 pour plusieurs).
                    - Pourquoi le sens du lien ? Il dit dans quelle feuille placer la colonne qui renvoie à l’autre.
        questions:
            -   id: q01
                type: texte
                enonce: Une jument peut-elle avoir plusieurs saillies (plusieurs lignes dans Saillies) ? Une saillie concerne-t-elle plusieurs juments ? Conclus sur le sens du lien.
                aide: 'Pense à une saison de reproduction : une jument peut revenir plusieurs fois. Et une saillie, concerne combien de juments ? Déduis le sens du lien (1 pour plusieurs).'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une saillie peut donner deux poulains (rare, gémellité).
        questions:
            -   id: q01
                type: texte
                enonce: L’organisation du classeur le permet-elle ?
                aide: 'Deux poulains pour une seule saillie : regarde la colonne id_saillie de la feuille Poulains. Deux lignes peuvent-elles avoir le même numéro ?'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais lire un classeur relié. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment organiser les données d’un élevage en plusieurs feuilles reliées d’un classeur ?'
                aide: 'Dis comment le classeur est découpé : feuilles par sujet, colonnes, identifiants, colonnes qui renvoient à une autre feuille, sens des liens.'
retenir:
    - Feuille, colonne, identifiant, colonne qui renvoie à une autre feuille.
    - 'Lien 1 pour plusieurs : l’identifiant est recopié côté « plusieurs » (id_jument dans Saillies).'
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
