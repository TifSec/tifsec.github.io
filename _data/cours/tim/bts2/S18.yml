titre: 'Séance 18 : Un tableau de bord pour ajuster la conduite d’élevage'
themes:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
problematique: Quels indicateurs suivre pour piloter la conduite de l’élevage au fil de la saison ?
competences_bo:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
objectifs:
    connaissances:
        - Un tableau de bord de pilotage suit quelques indicateurs dans le temps, avec des seuils d’alerte et une décision associée à chaque seuil.
        - 'Sources : base (reproduction, soins), tableur (coûts), relevés (pâturage).'
    competences:
        - Choisir des indicateurs de pilotage et des seuils.
        - Construire un tableau de bord mis à jour.
pourquoi:
    - 'Tu as tous les outils : base, requêtes, scénarios, OAD.'
    - L’éleveur veut un outil simple à consulter chaque mois.
activites:
    -   id: a01
        titre: Indicateurs et seuils
        consigne: Tu vas choisir des indicateurs de pilotage de l’élevage avec leur seuil et la décision associée. On attend trois indicateurs complets.
        contenu:
            -   type: etapes
                elements:
                    - Choisis 5 indicateurs (reproduction, santé, alimentation, pâturage, économie).
                    - 'Pour chacun : seuil d’alerte et décision.'
            -   type: paragraphe
                texte: Pourquoi une décision par seuil ? Un tableau de bord sans décision n’est qu’un affichage.
        questions:
            -   id: q01
                type: tableau
                enonce: Complète pour trois indicateurs.
                colonnes:
                    - Indicateur
                    - Seuil → décision
                lignes:
                    -   - ''
                        - ''
                    -   - ''
                        - ''
                    -   - ''
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: Construire
        transition: Les indicateurs sont choisis. Construis l’outil.
        consigne: Tu vas construire le tableau de bord de pilotage avec couleurs de seuil sur une page. On attend sa description.
        contenu:
            -   type: etapes
                elements:
                    - Feuille Données (mise à jour mensuelle, collée depuis les requêtes).
                    - 'Feuille Tableau de bord : valeurs, flèche d’évolution, couleur selon le seuil (mise en forme conditionnelle), mini-graphiques.'
                    - Tout sur une page.
            -   type: paragraphe
                texte: Pourquoi des couleurs ? L’éleveur voit en dix secondes ce qui demande une action.
        questions:
            -   id: q01
                type: texte
                enonce: Décris ton tableau de bord (zones, couleurs, graphiques).
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a03
        titre: La mise à jour
        transition: Le tableau de bord existe. Comment le faire vivre ?
        consigne: Tu vas rédiger et tester la procédure de mise à jour mensuelle du tableau de bord. On attend la procédure.
        contenu:
            -   type: etapes
                elements:
                    - Rédige la procédure de mise à jour mensuelle (5 étapes).
                    - Teste-la avec les données du mois suivant (fournies).
            -   type: paragraphe
                texte: Pourquoi une procédure ? Un outil non mis à jour est abandonné.
        questions:
            -   id: q01
                type: texte
                enonce: Écris ta procédure de mise à jour.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un indicateur peut être « vert » mais en dégradation.
        questions:
            -   id: q01
                type: texte
                enonce: Comment le montrer ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton outil de pilotage est prêt. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quels indicateurs suivre pour piloter la conduite de l’élevage au fil de la saison ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Indicateur → seuil → décision.
    - Procédure de mise à jour.
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
