titre: 'Séance 10 : Un document imprimable pour le vétérinaire'
themes:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
problematique: Comment produire un document clair à partir du classeur ?
competences_bo:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
objectifs:
    connaissances:
        - On trie, puis Données > Sous-totaux regroupe les lignes par jument et ajoute un total par groupe.
        - La mise en page (plage d’impression, en-tête, pied de page) prépare l’export PDF.
    competences:
        - Trier et regrouper avec les sous-totaux.
        - Mettre en page et exporter en PDF.
pourquoi:
    - Le vétérinaire passe la semaine prochaine.
    - Il veut l’historique des traitements de l’année, par jument.
activites:
    -   id: a01
        titre: Les données à imprimer
        consigne: Tu vas préparer une feuille qui rassemble les soins de l’année par jument. On attend le nombre de lignes et l’ordre de tri.
        contenu:
            -   type: fichier
                titre: registre papier des traitements d’Iris
                url: /assets/fichiers/tim/bts2/registre_papier_iris.odt
            -   type: fichier
                titre: classeur complet de l’élevage (LibreOffice Calc)
                url: /assets/fichiers/tim/bts2/elevage_complet.ods
            -   type: etapes
                elements:
                    - Copie la feuille Soins (clic droit sur l’onglet > Déplacer ou copier) et nomme-la « Vétérinaire » ; ajoute le nom de la jument (RECHERCHEV), garde les soins de 2026.
                    - Pourquoi une copie ? On met en page sans abîmer la feuille de saisie.
        questions:
            -   id: q01
                type: texte
                enonce: Combien de lignes de soins contient ta feuille ?
                aide: Compte les lignes de soins de 2026 (barre d’état ou =NB(colonne date)).
            -   id: q02
                type: qcm
                enonce: Dans quel ordre trier ?
                choix:
                    -   id: a
                        texte: Par jument, puis par date.
                    -   id: b
                        texte: Par produit seulement.
                    -   id: c
                        texte: Au hasard.
                aide: Le vétérinaire lit le dossier jument par jument, et pour chacune dans l’ordre du temps.
    -   id: a02
        titre: La mise en page
        transition: Les données sont prêtes. Mets-les en page.
        consigne: Tu vas regrouper les soins par jument et exporter la feuille en PDF. On attend la description de la mise en page.
        contenu:
            -   type: etapes
                elements:
                    - 'Données > Trier : par nom, puis par date. Puis Données > Sous-totaux : regrouper par nom, fonction Nombre sur la colonne date.'
                    - 'Format > Zones d’impression > Définir ; Format > Style de page : en-tête (titre, date d’édition), pied de page (numéro de page) ; ligne de titres répétée.'
                    - Fichier > Exporter au format PDF.
                    - 'Pourquoi regrouper ? Chaque jument a son bloc : le vétérinaire lit comme un carnet.'
        questions:
            -   id: q01
                type: texte
                enonce: Décris la mise en page de ton document.
                aide: 'Décris ton document : l’en-tête, le regroupement par jument, le tableau des soins, les totaux, la pagination.'
    -   id: a03
        titre: Vérifier
        transition: Le document est prêt. Est-il juste ?
        consigne: Tu vas comparer ton document avec le registre papier d’une jument. On attend la différence trouvée et ton action.
        contenu:
            -   type: etapes
                elements:
                    - Compare ton document avec le registre papier fourni pour une jument.
                    - Signale toute différence.
                    - Pourquoi vérifier ? Le document sert de preuve sanitaire.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle différence as-tu trouvée (ou confirme qu’il n’y en a pas) et que fais-tu ?
                aide: 'Compare ton document avec le registre papier fourni : un soin manque-t-il ? Que faut-il faire, et avec qui vérifier ?'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le document pourrait afficher le nombre de traitements (et seulement de traitements) par jument.
        questions:
            -   id: q01
                type: texte
                enonce: Comment ?
                aide: Les sous-totaux comptent tous les soins. Quelle formule compte seulement les traitements d’une jument (deux critères) ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Le vétérinaire a son document. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment produire un document clair à partir du classeur ?'
                aide: 'Dis les étapes : données triées, sous-totaux par jument, mise en page, export PDF, vérification.'
retenir:
    - Tri → sous-totaux par jument → mise en page → PDF.
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
