titre: 'Séance 10 : Un état imprimable pour le vétérinaire'
themes:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
problematique: Comment produire un document clair à partir de la base ?
competences_bo:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
objectifs:
    connaissances:
        - 'Un état (rapport) met en page le résultat d’une requête : regroupements, tris, totaux.'
        - On l’exporte en PDF pour le transmettre.
    competences:
        - Créer un état à partir d’une requête.
        - Regrouper et trier dans un état.
pourquoi:
    - Le vétérinaire passe la semaine prochaine.
    - Il veut l’historique des traitements de l’année, par jument.
activites:
    -   id: a01
        titre: La requête source
        consigne: Tu vas préparer la requête qui sélectionne les soins de l’année par jument. On attend le nombre de lignes et l’ordre de tri.
        contenu:
            -   type: etapes
                elements:
                    - 'Requête : Jument + Soin ; champs nom, date, type, produit, délai d’attente ; année en cours ; tri par nom puis date.'
            -   type: paragraphe
                texte: Pourquoi une requête d’abord ? L’état affiche ce que la requête sélectionne.
        questions:
            -   id: q01
                type: texte
                enonce: Combien de lignes renvoie ta requête ?
                aide: Une phrase complète qui reprend les mots de la question.
            -   id: q02
                type: qcm
                enonce: Dans quel ordre trier ?
                choix:
                    -   id: a
                        texte: Par jument, puis par date.
                    -   id: b
                        texte: Par produit seulement.
                    -   id: c
                        texte: Au hasard.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a02
        titre: L’état
        transition: Les données sont prêtes. Mets-les en page.
        consigne: Tu vas créer l’état des traitements regroupé par jument et l’exporter en PDF. On attend la description de la mise en page.
        contenu:
            -   type: etapes
                elements:
                    - 'Rapports > Assistant : source = ta requête ; regroupement par nom de jument.'
                    - Ajoute un titre, la date d’édition, les numéros de page.
                    - Exporte en PDF.
            -   type: paragraphe
                texte: 'Pourquoi regrouper ? Chaque jument a son bloc : le vétérinaire lit comme un carnet.'
        questions:
            -   id: q01
                type: texte
                enonce: Décris la mise en page de ton état.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a03
        titre: Vérifier
        transition: L’état est édité. Est-il juste ?
        consigne: Tu vas comparer l’état avec le registre papier d’une jument. On attend la différence trouvée et ton action.
        contenu:
            -   type: etapes
                elements:
                    - Compare l’état avec le registre papier fourni pour une jument.
                    - Signale toute différence.
            -   type: paragraphe
                texte: Pourquoi vérifier ? Le document sert de preuve sanitaire.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle différence as-tu trouvée (ou confirme qu’il n’y en a pas) et que fais-tu ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: L’état pourrait afficher le nombre de traitements par jument.
        questions:
            -   id: q01
                type: texte
                enonce: Comment ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Le vétérinaire a son document. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment produire un document clair à partir de la base ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Requête → état (regroupement, tri, total) → PDF.
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
