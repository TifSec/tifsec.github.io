titre: 'Séance 16 : À qui appartiennent les données de l’élevage ?'
themes:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
problematique: Quelles règles encadrent les données d’une exploitation et des personnes ?
competences_bo:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
objectifs:
    connaissances:
        - 'RGPD : données personnelles (clients, salariés, propriétaires) — finalité, minimisation, sécurité, droits.'
        - 'Données de l’exploitation (non personnelles) : contrats, règlement européen sur les données (Data Act) qui renforce l’accès de l’utilisateur aux données de ses objets connectés ; chartes de l’agriculture (ex. Data-Agri).'
    competences:
        - Distinguer données personnelles et données d’exploitation.
        - Lire une clause de contrat sur les données.
pourquoi:
    - En S15, les données du détecteur partent chez le fabricant.
    - Qui peut les utiliser, et que dit la loi ?
activites:
    -   id: a01
        titre: Personnelle ou non ?
        consigne: Tu vas classer quatre données de l’élevage en données personnelles ou données d’exploitation. On attend un classement par donnée.
        contenu:
            -   type: lien
                titre: CNIL — Le RGPD et les données personnelles
                url: https://www.cnil.fr/fr/reglement-europeen-protection-donnees
            -   type: etapes
                elements:
                    - Classe chaque donnée (document 1).
            -   type: paragraphe
                texte: Pourquoi classer ? Les règles ne sont pas les mêmes.
        questions:
            -   id: q01
                type: tableau
                enonce: Classe chaque donnée.
                colonnes:
                    - Donnée
                    - Personnelle / exploitation
                lignes:
                    -   - Téléphone d’un propriétaire de pension
                        - ''
                    -   - Consommation d’eau de l’écurie
                        - ''
                    -   - Planning horaire d’un salarié
                        - ''
                    -   - Taux de gestation de l’élevage
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: Le fichier clients
        transition: Tu sais classer. Applique le RGPD au fichier clients.
        consigne: Tu vas appliquer le RGPD à la demande du gérant de garder sans limite les données des anciens clients. On attend ta réponse et deux principes.
        contenu:
            -   type: etapes
                elements:
                    - Le gérant veut garder les propriétaires partis « au cas où », sans limite.
                    - Applique le RGPD.
            -   type: paragraphe
                texte: Pourquoi une durée ? Garder des données sans raison est interdit.
        questions:
            -   id: q01
                type: texte
                enonce: Que réponds-tu au gérant ? Cite deux principes du RGPD.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a03
        titre: La clause du contrat
        transition: Les données personnelles sont protégées. Et celles de l’exploitation ?
        consigne: Tu vas analyser une clause de contrat sur les données d’un objet connecté (document 2). On attend les points défavorables et tes demandes.
        contenu:
            -   type: citation
                texte: 'Document 2 — Clause (fictive) : « L’utilisateur cède gratuitement et sans limite de durée au fabricant l’ensemble des données collectées par l’appareil. Le fabricant peut les exploiter et les céder à des tiers. Aucun export n’est prévu. »'
            -   type: etapes
                elements:
                    - Lis la clause (document 2).
                    - Repère ce qui est défavorable à l’éleveur et propose une modification.
            -   type: paragraphe
                texte: Pourquoi lire les clauses ? Les données d’un élevage ont une valeur (statistiques, revente).
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 2, qu’est-ce qui est défavorable, et que demander ?
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le Data Act s’applique progressivement depuis 2025.
        questions:
            -   id: q01
                type: texte
                enonce: Quel droit nouveau donne-t-il à l’utilisateur d’un objet connecté ?
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu connais les règles des données. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quelles règles encadrent les données d’une exploitation et des personnes ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'RGPD : personnes.'
    - 'Données d’exploitation : contrats, Data Act, chartes.'
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
