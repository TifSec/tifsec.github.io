titre: 'Séance 19 : Évaluation : proposer un ajustement argumenté'
themes:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
problematique: Saurai-je proposer un ajustement de conduite d’élevage appuyé sur des données ?
competences_bo:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
objectifs:
    connaissances:
        - 'On réutilise : requêtes, tableau croisé, scénarios, OAD, tableau de bord, regard critique.'
    competences:
        - Mener une analyse et argumenter un ajustement.
pourquoi:
    - 'Évaluation : dossier de l’élevage des Monts (fichiers fournis).'
    - 'Problème : baisse de marge et de fertilité sur deux ans.'
activites:
    -   id: a01
        titre: Diagnostiquer
        consigne: Tu vas diagnostiquer le problème de l’élevage des Monts avec trois indicateurs chiffrés. On attend les indicateurs et leur sens.
        contenu:
            -   type: etapes
                elements:
                    - 'Exploite les fichiers fournis : 3 indicateurs chiffrés qui décrivent le problème.'
            -   type: paragraphe
                texte: Pourquoi 3 indicateurs ? Un seul peut tromper.
        questions:
            -   id: q01
                type: texte
                enonce: Écris tes 3 indicateurs chiffrés et ce qu’ils montrent.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a02
        titre: Simuler
        transition: Le problème est chiffré. Quelles options ?
        consigne: Tu vas proposer deux ajustements et simuler leur effet sur la marge. On attend les ajustements et leurs effets chiffrés.
        contenu:
            -   type: etapes
                elements:
                    - Propose deux ajustements ; simule leur effet sur la marge (scénarios).
            -   type: paragraphe
                texte: Pourquoi simuler ? On compare les options avant d’engager l’argent de l’éleveur.
        questions:
            -   id: q01
                type: texte
                enonce: Décris tes deux ajustements et leur effet simulé.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a03
        titre: Recommander
        transition: Les options sont chiffrées. Tranche.
        consigne: Tu vas rédiger ta recommandation d’ajustement avec un indicateur de suivi et une limite. On attend une recommandation complète.
        contenu:
            -   type: etapes
                elements:
                    - Choisis un ajustement ; justifie ; indique l’indicateur de suivi et une limite de ton analyse.
            -   type: paragraphe
                texte: Pourquoi une limite ? L’éleveur doit savoir ce que les données ne disent pas.
        questions:
            -   id: q01
                type: texte
                enonce: Rédige ta recommandation.
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: L’éleveur n’a pas de trésorerie cette année.
        questions:
            -   id: q01
                type: texte
                enonce: Ta recommandation change-t-elle ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: L’évaluation est terminée. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : saurais-tu proposer un ajustement de conduite d’élevage appuyé sur des données ? Fais ton bilan.'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Diagnostic → options simulées → recommandation → suivi.
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
