titre: 'Séance 9 : Un formulaire de saisie pour l’équipe'
themes:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
problematique: Comment rendre la saisie des soins simple et sûre pour les salariés ?
competences_bo:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
objectifs:
    connaissances:
        - Un formulaire présente les champs d’une table de façon conviviale ; une liste déroulante affiche le nom et stocke l’id.
        - Un sous-formulaire affiche les enregistrements liés (les soins d’une jument).
    competences:
        - Créer un formulaire avec liste déroulante.
        - Créer un sous-formulaire.
pourquoi:
    - Les salariés ne doivent pas toucher aux tables directement.
    - Tu crées un formulaire de saisie des soins.
activites:
    -   id: a01
        titre: Le formulaire principal
        consigne: Tu vas créer le formulaire principal de la table Jument. On attend la description du formulaire.
        contenu:
            -   type: etapes
                elements:
                    - 'Formulaires > Assistant : table Jument, tous les champs.'
                    - 'Mode Ébauche : réorganise, ajoute un titre.'
            -   type: paragraphe
                texte: Pourquoi un formulaire ? Les salariés voient une fiche claire, pas une grille de données.
        questions:
            -   id: q01
                type: texte
                enonce: Décris ton formulaire (titre, champs affichés, ordre).
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
        ressources:
            -   type: lien
                titre: LibreOffice Base — aide en ligne
                url: https://help.libreoffice.org/latest/fr/text/sdatabase/main.html
    -   id: a02
        titre: Le sous-formulaire des soins
        transition: La fiche jument existe. Ajoute ses soins.
        consigne: Tu vas ajouter le sous-formulaire des soins lié à la jument affichée. On attend son comportement et l’intérêt de la liste.
        contenu:
            -   type: etapes
                elements:
                    - Ajoute un sous-formulaire basé sur Soin, lié par id_jument.
                    - 'Dans le sous-formulaire, le champ type est une liste : vermifuge, vaccin, traitement, autre.'
            -   type: paragraphe
                texte: Pourquoi un sous-formulaire ? On voit et on saisit les soins de la jument affichée.
        questions:
            -   id: q01
                type: texte
                enonce: Quand tu passes à la jument suivante, que fait le sous-formulaire ?
                aide: Une phrase complète qui reprend les mots de la question.
            -   id: q02
                type: qcm
                enonce: Pourquoi une liste pour le type de soin ?
                choix:
                    -   id: a
                        texte: Pour des valeurs homogènes, faciles à compter.
                    -   id: b
                        texte: Pour décorer.
                    -   id: c
                        texte: Pour cacher le champ.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a03
        titre: Test par un utilisateur
        transition: Le formulaire marche pour toi. Et pour un autre ?
        consigne: Tu vas faire tester ton formulaire par un camarade et le corriger. On attend la difficulté et ta correction.
        contenu:
            -   type: etapes
                elements:
                    - Un camarade saisit 3 soins sans aide.
                    - Note ses difficultés et corrige le formulaire.
            -   type: paragraphe
                texte: Pourquoi tester avec un autre ? Le concepteur ne voit plus les pièges.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle difficulté ton testeur a-t-il rencontrée, et quelle correction as-tu faite ?
                aide: Action → résultat attendu → résultat observé ; une seule chose à la fois.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le délai d’attente doit être rempli pour un traitement.
        questions:
            -   id: q01
                type: texte
                enonce: Comment le rendre obligatoire seulement pour « traitement » ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Le formulaire est prêt pour l’équipe. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment rendre la saisie des soins simple et sûre pour les salariés ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Formulaire + sous-formulaire lié.
    - Listes ; test utilisateur.
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
