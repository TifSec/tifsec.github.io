titre: 'Séance 9 : Une saisie simple et sûre pour l’équipe'
themes:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
problematique: Comment rendre la saisie des soins simple et sûre pour les salariés ?
competences_bo:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
objectifs:
    connaissances:
        - Données > Formulaire affiche une ligne comme une fiche (un champ par colonne) ; les listes de validité imposent des valeurs ; une note d’aide (Validité > Aide à la saisie) guide le salarié.
        - Le filtre automatique affiche les soins d’une seule jument.
    competences:
        - Préparer une feuille de saisie avec formulaire, listes et aides.
        - Filtrer les soins d’une jument.
pourquoi:
    - Les salariés ne doivent pas modifier les formules ni les autres feuilles.
    - Tu prépares la saisie des soins.
activites:
    -   id: a01
        titre: La fiche de saisie
        consigne: Tu vas préparer la saisie des soins sous forme de fiche. On attend la description de ta fiche.
        contenu:
            -   type: fichier
                titre: classeur complet de l’élevage (LibreOffice Calc)
                url: /assets/fichiers/tim/bts2/elevage_complet.ods
            -   type: etapes
                elements:
                    - 'Feuille Soins : clique dans le tableau, puis Données > Formulaire : chaque soin s’affiche comme une fiche ; « Nouveau » ajoute une ligne.'
                    - Ajoute une colonne « nom » (RECHERCHEV sur id_jument) pour que la personne vérifie la jument choisie ; mets un titre clair au-dessus de chaque colonne.
                    - Pourquoi une fiche ? Les salariés voient un soin à la fois, pas une grande grille.
        questions:
            -   id: q01
                type: texte
                enonce: Décris ta fiche de saisie (titres des champs, ordre, aide à la vérification).
                aide: 'Décris ta fiche : les champs affichés, leur ordre de saisie, et ce qui permet de vérifier qu’on a choisi la bonne jument.'
        ressources:
            -   type: lien
                titre: LibreOffice Calc — aide en ligne
                url: https://help.libreoffice.org/latest/fr/text/scalc/main0000.html
    -   id: a02
        titre: Les listes et les soins d’une jument
        transition: La fiche existe. Rends-la plus sûre.
        consigne: Tu vas ajouter des listes de choix et filtrer les soins d’une jument. On attend le comportement du filtre et l’intérêt de la liste.
        contenu:
            -   type: etapes
                elements:
                    - 'Colonne type : Données > Validité > Liste : vermifuge ; vaccin ; traitement ; autre. Colonne id_jument : Plage de cellules = $Juments.$A$2:$A$26.'
                    - 'Validité > onglet Aide à la saisie : écris une consigne courte pour chaque colonne.'
                    - 'Données > Filtre automatique : choisis une jument dans la colonne nom, puis une autre.'
                    - Pourquoi filtrer ? On voit et on contrôle les soins de la jument choisie.
        questions:
            -   id: q01
                type: texte
                enonce: Quand tu choisis une autre jument dans le filtre, que devient la liste des soins ?
                aide: 'Choisis une autre jument dans le filtre automatique de la colonne nom : quelles lignes restent affichées ?'
            -   id: q02
                type: qcm
                enonce: Pourquoi une liste pour le type de soin ?
                choix:
                    -   id: a
                        texte: Pour des valeurs homogènes, faciles à compter.
                    -   id: b
                        texte: Pour décorer.
                    -   id: c
                        texte: Pour cacher le champ.
                aide: Si chacun tape le type de soin à sa façon, que donne un comptage par type ?
    -   id: a03
        titre: Test par un utilisateur
        transition: Le formulaire marche pour toi. Et pour un autre ?
        consigne: Tu vas faire tester ta feuille de saisie par un camarade et la corriger. On attend la difficulté et ta correction.
        contenu:
            -   type: etapes
                elements:
                    - Un camarade saisit 3 soins sans aide, avec Données > Formulaire.
                    - Note ses difficultés et corrige ta feuille.
                    - Pourquoi tester avec un autre ? Le concepteur ne voit plus les pièges.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle difficulté ton testeur a-t-il rencontrée, et quelle correction as-tu faite ?
                aide: Écris ce qui a bloqué ton testeur (titre de colonne peu clair, format de date, liste…) et la modification que tu as faite.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le délai d’attente doit être rempli pour un traitement.
        questions:
            -   id: q01
                type: texte
                enonce: Comment le rendre obligatoire seulement pour « traitement » ?
                aide: Le délai d’attente ne concerne que les traitements. Quelle formule peut signaler un oubli (SI, ET), et sinon quelle consigne donner ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Le formulaire est prêt pour l’équipe. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment rendre la saisie des soins simple et sûre pour les salariés ?'
                aide: Dis comment le formulaire, les listes, les aides à la saisie et le filtre rendent la saisie simple et sûre.
retenir:
    - Données > Formulaire ; listes et aides de validité.
    - Filtre automatique ; test utilisateur.
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
