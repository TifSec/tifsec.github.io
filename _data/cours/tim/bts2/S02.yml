titre: Peut-on faire confiance aux données ?
theme: TIM — Peut-on faire confiance aux données ?
problematique: Peut-on faire confiance aux données ?
pourquoi: "Dans une exploitation agricole, de nombreuses données peuvent être enregistrées : surfaces, productions, coûts, temps de travail, quantités d'intrants..."
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances: []
    competences: []
activites:
    - id: a01
      titre: Pour commencer
      contenu:
          - type: paragraphe
            texte: "Durée prévue : environ 1 heure"
      questions: []
    - id: a02
      titre: Notions et compétences travaillées
      contenu:
          - type: liste
            elements:
                - qualité et fiabilité d'une donnée ;
                - donnée manquante, donnée suspecte et donnée incohérente ;
                - standardisation des données ;
                - construction d'un indicateur ;
                - formules simples dans un tableur ;
                - comparaison de parcelles de tailles différentes.
      questions: []
    - id: a03
      titre: Pourquoi allons-nous travailler cela ?
      contenu:
          - type: paragraphe
            texte: "Dans une exploitation agricole, de nombreuses données peuvent être enregistrées : surfaces, productions, coûts, temps de travail, quantités d'intrants..."
          - type: paragraphe
            texte: Mais un ordinateur ne sait pas automatiquement si une valeur est correcte.
          - type: paragraphe
            texte: Si une donnée est fausse, une formule parfaitement correcte peut produire un résultat faux.
      questions: []
    - id: a04
      titre: À quoi cela va-t-il vous servir ?
      contenu:
          - type: paragraphe
            texte: "Dans votre futur métier, vous pourrez recevoir des données provenant :"
          - type: liste
            elements:
                - d'un logiciel de gestion ;
                - d'un salarié ;
                - d'un capteur ;
                - d'un conseiller ;
                - d'un fichier transmis par un partenaire ;
                - ou de vos propres relevés.
          - type: paragraphe
            texte: Avant de prendre une décision à partir de ces données, vous devrez savoir repérer les valeurs douteuses et construire des indicateurs permettant de comparer correctement les situations.
      questions: []
    - id: a05
      titre: 1. Créer votre espace de travail
      contenu:
          - type: paragraphe
            texte: Lors de la séance précédente, nous avons vérifié vos premières compétences avec Writer et Calc.
          - type: paragraphe
            texte: "Nous allons maintenant utiliser Calc pour une vraie situation professionnelle : analyser des données de parcelles."
          - type: paragraphe
            texte: "Ouvrez LibreOffice Calc et créez un nouveau classeur nommé :"
          - type: paragraphe
            texte: BTS2_ACSAGRI_S02_NOM_Prenom.ods
          - type: paragraphe
            texte: "Créez trois feuilles :"
          - type: liste
            elements:
                - Donnees
                - Analyse
                - Bilan
      questions: []
    - id: a06
      titre: 2. Une exploitation vous transmet ses données
      contenu:
          - type: paragraphe
            texte: Un exploitant souhaite comparer plusieurs parcelles fourragères.
          - type: paragraphe
            texte: "Il vous transmet le tableau suivant :"
      questions:
