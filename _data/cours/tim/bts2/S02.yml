titre: 'Séance 2 : Traçabilité : les données obligatoires d’un élevage équin'
themes:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
problematique: Quelles données un éleveur doit-il obligatoirement enregistrer, et comment les organiser ?
competences_bo:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
objectifs:
    connaissances:
        - 'Obligations : identification et déclaration de naissance (SIRE), déclaration de détenteur, registre d’élevage, traitements médicamenteux (statut « exclu ou non de la consommation humaine »).'
        - Ces données servent la sécurité sanitaire et doivent être conservées.
    competences:
        - Identifier les données obligatoires.
        - Concevoir un registre numérique conforme.
pourquoi:
    - En S01, tu as relié décisions et données.
    - 'Certaines données ne sont pas un choix : la loi les impose.'
activites:
    -   id: a01
        titre: Les obligations
        consigne: Tu vas relever dans un extrait adapté de l’IFCE (document 1) les obligations de traçabilité d’un éleveur. On attend quatre obligations.
        contenu:
            -   type: citation
                texte: 'Document 1 — Extrait adapté de l’IFCE : « Tout détenteur d’équidés se déclare auprès de l’IFCE. Les naissances sont déclarées et les poulains identifiés. Le détenteur tient un registre d’élevage où figurent les mouvements et les traitements, et conserve les ordonnances vétérinaires. Le statut de l’équidé vis-à-vis de l’abattage figure dans son document d’identification. »'
            -   type: lien
                titre: IFCE — Équipédia (fiches techniques sur le cheval)
                url: https://equipedia.ifce.fr/
            -   type: etapes
                elements:
                    - Lis l’extrait adapté de l’IFCE (document 1).
                    - Liste les données obligatoires.
            -   type: paragraphe
                texte: Pourquoi ces obligations ? En cas d’épidémie ou de résidu médicamenteux, on retrouve vite les animaux concernés.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, cite quatre obligations de traçabilité d’un éleveur.
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
    -   id: a02
        titre: Concevoir le registre numérique
        transition: Tu connais les obligations. Organise les données.
        consigne: Tu vas concevoir les colonnes et les contrôles d’un registre numérique des traitements. On attend le type et le contrôle de trois colonnes.
        contenu:
            -   type: etapes
                elements:
                    - Liste les colonnes d’un registre des traitements.
                    - 'Pour chacune : type et contrôle de saisie.'
            -   type: paragraphe
                texte: Pourquoi des contrôles ? Un registre faux n’a aucune valeur lors d’un contrôle.
        questions:
            -   id: q01
                type: tableau
                enonce: Complète trois colonnes du registre des traitements.
                colonnes:
                    - Colonne
                    - Type / contrôle
                lignes:
                    -   - UELN du cheval
                        - ''
                    -   - Date du traitement
                        - ''
                    -   - Délai d’attente (jours)
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a03
        titre: Papier ou numérique ?
        transition: Le registre est conçu. Faut-il abandonner le papier ?
        consigne: Tu vas comparer un registre papier et un registre numérique. On attend avantages et risques de chacun.
        contenu:
            -   type: etapes
                elements:
                    - 'Compare registre papier et registre numérique : 2 avantages et 1 risque pour chacun.'
            -   type: paragraphe
                texte: Pourquoi comparer ? Le numérique facilite la recherche mais demande sauvegarde et sécurité.
        questions:
            -   id: q01
                type: texte
                enonce: Compare le registre papier et le registre numérique.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un poulain doit être identifié dans des délais précis.
        questions:
            -   id: q01
                type: texte
                enonce: Où trouver ces délais à jour ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: La traçabilité est organisée. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quelles données un éleveur doit-il obligatoirement enregistrer, et comment les organiser ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Traçabilité : identification, détenteur, registre, traitements.'
    - 'Registre numérique : types, contrôles, sauvegarde.'
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
