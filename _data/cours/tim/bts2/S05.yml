titre: 'Séance 5 : Créer les feuilles et choisir les formats de cellules'
themes:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
problematique: Comment créer des feuilles de données fiables dans un tableur ?
competences_bo:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
objectifs:
    connaissances:
        - Chaque colonne a un format de cellule (nombre, texte, date) et peut avoir une règle de saisie (Données > Validité).
        - L’identifiant est un numéro unique, qui ne change jamais.
    competences:
        - Créer des feuilles avec des formats et des règles de validité.
        - Saisir des lignes de test.
pourquoi:
    - En S04, tu as conçu le modèle.
    - Tu le crées maintenant dans LibreOffice Calc.
activites:
    -   id: a01
        titre: La feuille Juments
        consigne: Tu vas créer la feuille Juments dans LibreOffice Calc avec ses formats et une règle sur l’UELN. On attend le format de trois colonnes et la raison de la règle.
        contenu:
            -   type: etapes
                elements:
                    - Nouveau classeur elevage_moulin.ods ; renomme la première feuille « Juments » (clic droit sur l’onglet).
                    - 'Ligne 1, les titres : id_jument, ueln, nom, date_naissance, race. Mets-les en gras ; Affichage > Figer les cellules > Figer la première ligne.'
                    - 'Formats (Format > Cellules) : id_jument en nombre sans décimale ; ueln en texte (@) ; date_naissance en date JJ/MM/AAAA.'
                    - 'Colonne ueln : Données > Validité, longueur du texte égale à 15, décoche « Autoriser les cellules vides » ; onglet Message d’erreur : action « Stop ».'
                    - Pourquoi un id ? Deux juments peuvent porter le même nom ; l’id est unique.
        questions:
            -   id: q01
                type: tableau
                enonce: Indique le format de cellule de chaque colonne.
                colonnes:
                    - Colonne
                    - Format
                lignes:
                    -   - id_jument
                        - ''
                    -   - date_naissance
                        - ''
                    -   - ueln
                        - ''
                aide: Un identifiant est un nombre sans décimale ; une date a son propre format ; l’UELN contient des lettres et des chiffres.
            -   id: q02
                type: qcm
                enonce: Pourquoi interdire une ligne sans UELN ?
                choix:
                    -   id: a
                        texte: Un équidé ne peut pas être enregistré sans identification.
                    -   id: b
                        texte: Pour aller plus vite.
                    -   id: c
                        texte: Ce n’est pas utile.
                aide: Que dit la réglementation (S02) sur un équidé sans identification ?
        ressources:
            -   type: lien
                titre: LibreOffice Calc — aide en ligne
                url: https://help.libreoffice.org/latest/fr/text/scalc/main0000.html
    -   id: a02
        titre: Les autres feuilles
        transition: La première feuille est faite. Crée les autres.
        consigne: Tu vas créer les feuilles Etalons, Saillies, Poulains et Soins. On attend la structure de la feuille Saillies.
        contenu:
            -   type: etapes
                elements:
                    - Crée Etalons, Saillies (id_saillie, id_jument, id_etalon, date_saillie, resultat), Poulains, Soins.
                    - Les colonnes qui renvoient à une autre feuille (id_jument, id_etalon) sont au format nombre, comme l’identifiant de la feuille d’origine.
                    - 'Pourquoi le même format ? Sinon la recherche entre feuilles ne trouve rien : un « 3 » saisi en texte n’est pas le nombre 3.'
        questions:
            -   id: q01
                type: texte
                enonce: Écris la structure de la feuille Saillies (colonnes et formats).
                aide: 'Écris chaque colonne de Saillies avec son format : l’identifiant, les deux colonnes qui renvoient aux juments et aux étalons, la date, le résultat.'
    -   id: a03
        titre: Saisir des lignes de test
        transition: Les feuilles existent. Teste-les.
        consigne: Tu vas saisir des lignes de test (document 1) et tester la règle de l’UELN. On attend la réaction de Calc.
        contenu:
            -   type: tableau
                titre: Document 1 — Saillies 2026 (fictives)
                colonnes:
                    - Jument
                    - Étalon
                    - Date
                    - Résultat
                lignes:
                    -   - Belle de Mai
                        - Quatar
                        - 02/04/2026
                        - pleine
                    -   - Iris
                        - Ugo
                        - 10/04/2026
                        - vide
                    -   - Opale
                        - Quatar
                        - 25/04/2026
                        - pleine
                    -   - Iris
                        - Quatar
                        - 05/05/2026
                        - pleine
            -   type: paragraphe
                texte: Données fictives créées pour l’exercice (ordres de grandeur réalistes pour un élevage équin).
            -   type: etapes
                elements:
                    - Saisis 3 juments, 2 étalons, 4 saillies (données fictives du document 1).
                    - 'Essaie de saisir un UELN de 10 caractères, puis d’effacer un UELN : que se passe-t-il ?'
                    - Pourquoi des lignes de test ? On vérifie que les règles fonctionnent avant de saisir les vraies données.
        questions:
            -   id: q01
                type: texte
                enonce: Que se passe-t-il quand tu saisis un UELN qui n’a pas 15 caractères ?
                aide: 'Tape un UELN trop court dans la colonne ueln et valide : lis le message de Calc.'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La colonne « resultat » ne doit accepter que pleine / vide / avortée.
        questions:
            -   id: q01
                type: texte
                enonce: Comment l’imposer dans Calc ?
                aide: Dans Données > Validité, quel critère propose un choix parmi quelques valeurs au lieu d’une saisie libre ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Les feuilles sont créées. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment créer des feuilles de données fiables dans un tableur ?'
                aide: Dis comment choisir les formats, l’identifiant, les règles de validité et les valeurs permises.
retenir:
    - Formats de cellules, identifiant unique, règles de validité.
    - Lignes de test pour vérifier les règles.
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
