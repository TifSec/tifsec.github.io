titre: 'Séance 14 : Analyser trois saisons de reproduction'
themes:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
problematique: Comment faire parler un historique de reproduction pour ajuster la conduite ?
competences_bo:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
objectifs:
    connaissances:
        - Exporter une requête vers le tableur ; tableau croisé dynamique par étalon et par saison ; filtres de page.
        - Lire une évolution et formuler une hypothèse explicative.
    competences:
        - Croiser deux variables dans un tableau croisé.
        - Formuler une hypothèse à partir de données.
pourquoi:
    - La base contient 3 saisons de saillies (S07-S08).
    - L’éleveur se demande pourquoi la saison 2025 a été mauvaise.
activites:
    -   id: a01
        titre: Exporter et croiser
        consigne: Tu vas croiser les saillies par étalon et par saison dans un tableau croisé dynamique. On attend l’étalon et la saison au plus faible taux.
        contenu:
            -   type: fichier
                titre: base complète de l’élevage
                url: /assets/fichiers/tim/bts2/elevage_complet.odb
            -   type: etapes
                elements:
                    - Exporte la requête saillies (jument, étalon, saison, résultat, âge de la jument) vers Calc.
                    - 'Table dynamique : saison en colonne, étalon en ligne, nombre de saillies et nombre de « pleine ».'
                    - Pourquoi croiser ? On voit si le problème vient d’un étalon ou d’une saison.
        questions:
            -   id: q01
                type: texte
                enonce: Quel étalon et quelle saison ont le plus faible taux de gestation ?
                aide: Dans ta table dynamique étalon × saison, calcule pleine ÷ saillies pour chaque case et cherche la plus faible.
    -   id: a02
        titre: Chercher une explication
        transition: Le problème est localisé. Pourquoi ?
        consigne: Tu vas comparer l’âge moyen des juments par saison pour expliquer la mauvaise saison. On attend une hypothèse appuyée sur les chiffres.
        contenu:
            -   type: etapes
                elements:
                    - Ajoute l’âge moyen des juments par saison (MOYENNE dans la table).
                    - Compare.
                    - Pourquoi l’âge ? La fertilité baisse avec l’âge des juments.
        questions:
            -   id: q01
                type: texte
                enonce: L’âge moyen des juments explique-t-il la saison 2025 ? Justifie avec les chiffres.
                aide: Ajoute la moyenne d’âge des juments par saison et compare 2025 aux autres années, chiffres à l’appui.
    -   id: a03
        titre: Ajuster la conduite
        transition: Tu as une hypothèse. Que faire ?
        consigne: Tu vas proposer une règle d’ajustement de la conduite de reproduction et son indicateur de suivi. On attend la règle et l’indicateur.
        contenu:
            -   type: etapes
                elements:
                    - Propose un ajustement de conduite (C4.3) et l’indicateur pour vérifier son effet.
                    - Écris-le comme une règle de décision.
                    - Pourquoi une règle ? Elle rend la décision reproductible chaque saison.
        questions:
            -   id: q01
                type: texte
                enonce: Rédige ta règle d’ajustement et l’indicateur de suivi.
                aide: Ta règle dit quand une jument n’est plus mise à la reproduction (âge, saisons vides), et quel indicateur suivre ensuite.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Corrélation n’est pas causalité.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle autre cause pourrait expliquer 2025 ?
                aide: Un lien avec l’âge ne prouve pas la cause. Quels autres facteurs ont pu jouer cette saison-là ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: L’historique a parlé. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment faire parler un historique de reproduction pour ajuster la conduite ?'
                aide: 'Dis les étapes : exporter, croiser, chercher une explication, ajuster la conduite.'
retenir:
    - 'Table dynamique : 2 variables croisées.'
    - Hypothèse → règle → indicateur.
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
