titre: 'Séance 1 : Piloter un élevage équin avec des données : les enjeux de l’année'
themes:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
problematique: Quelles données et quels outils numériques aident à ajuster la conduite d’un élevage ?
competences_bo:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
objectifs:
    connaissances:
        - 'La capacité C4.3 : ajuster, dans un contexte de transitions, la conduite d’un système d’élevage.'
        - 'Outils de l’année : base de données relationnelle, tableur avancé (scénarios), outils d’aide à la décision (OAD), objets connectés, regard critique sur l’IA et le droit des données.'
    competences:
        - Relier des décisions d’élevage aux données nécessaires.
        - Situer ses acquis de BTSA 1.
pourquoi:
    - En BTSA 1, tu as évalué la performance d’une structure (C4.1).
    - 'En BTSA 2, tu passes à l’action : ajuster la conduite d’un élevage équin à partir de données.'
activites:
    -   id: a01
        titre: Décisions et données
        consigne: Tu vas associer à trois décisions d’un éleveur équin (document 1) les données nécessaires pour décider. On attend les données de chaque décision.
        contenu:
            -   type: liste
                elements:
                    - Garder ou réformer une jument.
                    - Choisir l’étalon de l’an prochain.
                    - Ajuster la ration des poulinières.
            -   type: etapes
                elements:
                    - Lis les décisions d’un éleveur (document 1).
                    - Pour chacune, cite les données nécessaires.
                    - Pourquoi partir des décisions ? On ne collecte que les données utiles (et c’est aussi une exigence du RGPD pour les données personnelles).
        questions:
            -   id: q01
                type: tableau
                enonce: Cite les données nécessaires.
                colonnes:
                    - Décision
                    - Données nécessaires
                lignes:
                    -   - Garder ou réformer une jument
                        - ''
                    -   - Choisir l’étalon de l’an prochain
                        - ''
                    -   - Ajuster la ration des poulinières
                        - ''
                aide: 'Pour chaque décision, demande-toi ce que l’éleveur doit savoir : le passé de la jument, les résultats des étalons, les besoins des poulinières.'
    -   id: a02
        titre: Où sont ces données ?
        transition: Tu sais quelles données il faut. Où les trouver ?
        consigne: Tu vas localiser, parmi les sources de l’élevage (document 2), trois données utiles aux décisions. On attend trois données avec leur source.
        contenu:
            -   type: liste
                elements:
                    - 'Base SIRE (IFCE) : identification, naissances, propriétaires.'
                    - Registre d’élevage et carnet sanitaire (obligatoires).
                    - Carnet de monte, échographies (vétérinaire).
                    - Fichiers de l’éleveur (tableur), pesées, factures.
            -   type: etapes
                elements:
                    - Lis la liste des sources (document 2).
                    - Associe chaque donnée de la mission 1 à une source.
                    - Pourquoi la source ? Une donnée obligatoire (registre) est fiable ; une donnée notée sur un carnet personnel, moins.
        questions:
            -   id: q01
                type: texte
                enonce: Pour trois données de la mission 1, indique où elles se trouvent.
                aide: 'Pour trois données de la mission 1, cherche où elles sont écrites : base officielle de l’IFCE, carnet de l’étalonnier, registre, fiche de ration…'
    -   id: a03
        titre: Mes acquis
        transition: Tu connais les données et leurs sources. Et tes outils ?
        consigne: Tu vas faire le point sur les outils numériques de BTSA 1 avant la nouvelle année. On attend un outil maîtrisé, un à consolider et une action.
        contenu:
            -   type: etapes
                elements:
                    - Relis les outils de BTSA 1.
                    - Choisis celui que tu maîtrises le mieux et celui à consolider.
                    - Pourquoi ce bilan ? La base de données et les scénarios s’appuient sur le tableur avancé.
        questions:
            -   id: q01
                type: texte
                enonce: Quel outil de BTSA 1 maîtrises-tu, lequel dois-tu consolider, et comment ?
                aide: 'Reprends ton positionnement de BTSA 1 : tableur, base de données, présentation. Un outil sûr, un à consolider, et une action concrète.'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Les transitions (climat, prix, bien-être animal) changent la conduite d’élevage.
        questions:
            -   id: q01
                type: texte
                enonce: Cite une transition qui touche l’élevage équin et une donnée pour la suivre.
                aide: 'Climat, prix, bien-être animal : choisis une transition et une donnée mesurable qui permet de la suivre dans l’élevage.'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Les enjeux de l’année sont posés. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quelles données et quels outils numériques aident à ajuster la conduite d’un élevage ?'
                aide: Relie les décisions de la mission 1 aux données, à leurs sources et aux outils numériques qui les traitent.
retenir:
    - Partir de la décision → données → source → outil.
    - 'C4.3 : ajuster la conduite d’élevage.'
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
