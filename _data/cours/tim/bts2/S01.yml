titre: Bienvenue en TIM – Faire le point pour mieux progresser
theme: TIM — Bienvenue en TIM – Faire le point pour mieux progresser
problematique: Bienvenue en TIM – Faire le point pour mieux progresser
pourquoi: Cette année, vous allez utiliser différents outils numériques pour traiter des données, produire des documents et analyser des situations professionnelles.
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances: []
    competences: []
activites:
    - id: a01
      titre: Notions et compétences travaillées
      contenu:
          - type: liste
            elements:
                - organisation des fichiers et dossiers ;
                - création et mise en forme d'un document professionnel ;
                - export dans un format adapté ;
                - premières manipulations dans un tableur ;
                - calculs automatiques simples ;
                - autonomie face à un outil numérique.
      questions: []
    - id: a02
      titre: Pourquoi allons-nous travailler cela ?
      contenu:
          - type: paragraphe
            texte: Cette année, vous allez utiliser différents outils numériques pour traiter des données, produire des documents et analyser des situations professionnelles.
          - type: paragraphe
            texte: Avant de commencer, il faut donc savoir ce que vous maîtrisez déjà et ce que nous devons retravailler ensemble.
      questions: []
    - id: a03
      titre: À quoi cela va-t-il vous servir ?
      contenu:
          - type: paragraphe
            texte: "Les compétences observées aujourd'hui seront réutilisées toute l'année :"
          - type: liste
            elements:
                - retrouver rapidement un document ;
                - présenter clairement une information ;
                - transmettre un fichier dans le bon format ;
                - effectuer des calculs automatiquement ;
                - transformer progressivement des données agricoles en informations utiles pour prendre une décision.
      questions: []
    - id: a04
      titre: 1. Comprendre le rôle des TIM
      contenu:
          - type: paragraphe
            texte: En BTSA ACS'AGRI, les Technologies Informatiques et Multimédia ne servent pas simplement à « savoir utiliser un ordinateur ».
          - type: paragraphe
            texte: "Elles permettent notamment de :"
          - type: liste
            elements:
                - collecter et organiser des données professionnelles ;
                - traiter et analyser des informations ;
                - utiliser efficacement un tableur ;
                - produire des documents professionnels ;
                - présenter les résultats sous forme de tableaux ou graphiques ;
                - rechercher et vérifier une information ;
                - utiliser des outils numériques pour aider à comprendre une situation et prendre une décision.
          - type: paragraphe
            texte: Le but n'est donc pas de devenir informaticien. Le but est de savoir choisir et utiliser correctement un outil numérique lorsque vous en avez besoin dans votre activité professionnelle.
      questions: []
    - id: a05
      titre: 2. Faisons connaissance
      contenu:
          - type: paragraphe
            texte: Avant de travailler ensemble, il est utile de connaître un peu votre parcours et votre rapport au numérique.
          - type: paragraphe
            texte: "Présentez-vous rapidement en indiquant :"
          - type: liste
            elements:
                - votre prénom ;
                - le type d'exploitation ou de structure que vous connaissez le mieux ;
                - votre projet professionnel actuel, même s'il n'est pas encore totalement défini ;
                - un logiciel ou un outil numérique que vous utilisez régulièrement ;
                - une chose que vous aimeriez savoir faire avec un ordinateur mais que vous ne maîtrisez pas encore.
      questions: []
    - id: a06
      titre: 3. Comment fonctionneront les cours ?
      contenu:
          - type: paragraphe
            texte: Les séances de TIM seront principalement basées sur la pratique.
          - type: liste
            elements:
                - vous travaillerez le plus souvent directement sur ordinateur ;
                - vous créerez votre document de travail dès le début de la séance ;
                - ce document pourra servir de cours, de brouillon, d'espace de test et de compte rendu ;
                - vous avez le droit d'essayer, de vous tromper et de recommencer ;
                - l'objectif est de comprendre ce que vous faites, pas seulement de reproduire une procédure ;
                - les situations seront autant que possible liées au monde professionnel agricole ;
                - une production sera généralement rendue en fin de séance.
          - type: paragraphe
            texte: Votre travail sera observé à travers votre implication, votre progression, votre autonomie et la qualité de vos productions.
      questions: []
    - id: a07
      titre: "4. Première compétence : organiser correctement son travail"
      contenu:
          - type: paragraphe
            texte: Avant de créer un document, il faut savoir où il sera enregistré.
          - type: paragraphe
            texte: Pourquoi commencer par cela ? Parce qu'un excellent travail qui devient introuvable est pratiquement inutilisable.
          - type: paragraphe
            texte: "Dans votre espace personnel, créez un dossier :"
          - type: paragraphe
            texte: TIM_BTS2_ACSAGRI
          - type: paragraphe
            texte: "Dans ce dossier, créez un sous-dossier :"
          - type: paragraphe
            texte: S01
          - type: paragraphe
            texte: Les fichiers de cette séance devront être enregistrés dans ce dossier.
      questions: []
    - id: a08
      titre: "5. Diagnostic 1 : produire un document simple"
      contenu:
          - type: paragraphe
            texte: "Nous venons d'organiser l'espace de travail. Nous passons maintenant au contenu : êtes-vous capable de créer un document propre et structuré ?"
          - type: paragraphe
            texte: Cette activité permet de vérifier les compétences de base qui seront nécessaires lorsque vous devrez produire un compte rendu, une synthèse ou présenter une analyse.
          - type: paragraphe
            texte: "Ouvrez LibreOffice Writer et créez :"
          - type: paragraphe
            texte: BTS2_S01_NOM_Prenom.odt
          - type: paragraphe
            texte: "Dans ce document :"
          - type: etapes
            elements:
                - ajoutez le titre Mon profil numérique ;
                - écrivez quelques lignes pour présenter votre parcours et votre projet professionnel ;
                - ajoutez une liste à puces avec au moins trois logiciels ou services numériques que vous connaissez ;
                - ajoutez le sous-titre Mes compétences numériques ;
                - créez puis complétez le tableau suivant.
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Compétence
                - À l'aise
                - Je me débrouille
                - À apprendre
            lignes:
                - - Organiser mes fichiers et dossiers
                  - ""
                  - ""
                  - ""
                - - Utiliser un traitement de texte
                  - ""
                  - ""
                  - ""
                - - Utiliser un tableur
                  - ""
                  - ""
                  - ""
                - - Créer des formules de calcul
                  - ""
                  - ""
                  - ""
                - - Créer un graphique
                  - ""
                  - ""
                  - ""
                - - Rechercher une information fiable
                  - ""
                  - ""
                  - ""
                - - Partager ou transmettre un document
                  - ""
                  - ""
                  - ""
            suite:
                - type: paragraphe
                  texte: Placez simplement un X dans la colonne correspondant à votre niveau actuel.
    - id: a09
      titre: 6. Pourquoi passer maintenant à la mise en forme ?
      contenu:
          - type: paragraphe
            texte: Vous avez créé et organisé de l'information. Nous allons maintenant vérifier si vous savez la rendre lisible pour quelqu'un d'autre.
          - type: paragraphe
            texte: Dans le monde professionnel, un document correct mais difficile à lire transmet mal l'information.
          - type: paragraphe
            texte: Sans modèle fourni, améliorez votre document pour qu'il soit sobre et professionnel.
          - type: paragraphe
            texte: "Vous pouvez notamment utiliser :"
          - type: liste
            elements:
                - les styles de titres ;
                - le gras ou l'italique lorsque cela apporte quelque chose ;
                - les alignements ;
                - des couleurs avec modération ;
                - une mise en forme du tableau.
      questions: []
    - id: a10
      titre: 7. Pourquoi changer de format ?
      contenu:
          - type: paragraphe
            texte: Votre fichier ODT est pratique pour continuer à modifier le document. Mais ce n'est pas toujours le meilleur format pour le transmettre.
          - type: paragraphe
            texte: Nous allons donc créer une version PDF afin de conserver la présentation lorsque le document est envoyé ou ouvert sur une autre machine.
          - type: paragraphe
            texte: Exportez votre document en PDF.
          - type: paragraphe
            texte: "Vous devez obtenir :"
          - type: liste
            elements:
                - "BTS2_S01_NOM_Prenom.odt : version modifiable ;"
                - "BTS2_S01_NOM_Prenom.pdf : version destinée à être consultée ou transmise."
      questions: []
    - id: a11
      titre: "8. Diagnostic 2 : passer du document aux données"
      contenu:
          - type: paragraphe
            texte: Jusqu'ici, nous avons surtout travaillé sur la présentation de l'information.
          - type: paragraphe
            texte: "Nous allons maintenant passer à une autre compétence importante en TIM : faire calculer et traiter des données par l'ordinateur."
          - type: paragraphe
            texte: Pourquoi changer d'outil ? Writer est adapté à la rédaction d'un document. Pour effectuer automatiquement des calculs sur un ensemble de valeurs, un tableur est beaucoup plus adapté.
          - type: paragraphe
            texte: "Ouvrez LibreOffice Calc et créez :"
          - type: paragraphe
            texte: BTS2_S01_Diagnostic_NOM_Prenom.ods
          - type: paragraphe
            texte: "Reproduisez le tableau suivant :"
          - type: tableau
            colonnes:
                - Parcelle
                - Surface (ha)
                - Production (t)
            lignes:
                - - Parcelle A
                  - 4,2
                  - 28,5
                - - Parcelle B
                  - 6,8
                  - 41,3
                - - Parcelle C
                  - 3,5
                  - 25,1
                - - Parcelle D
                  - 7,1
                  - 44,8
          - type: paragraphe
            texte: "Essayez ensuite, sans consigne supplémentaire, de :"
      questions:
          - id: q01
            type: texte
            enonce: calculer automatiquement la surface totale ;
            aide: Effectue cette manipulation dans Calc ou Excel, puis indique ici la formule, le résultat ou la démarche utilisée.
            suite: []
          - id: q02
            type: texte
            enonce: calculer automatiquement la production totale ;
            aide: Effectue cette manipulation dans Calc ou Excel, puis indique ici la formule, le résultat ou la démarche utilisée.
            suite: []
          - id: q03
            type: texte
            enonce: calculer la production moyenne ;
            aide: Effectue cette manipulation dans Calc ou Excel, puis indique ici la formule, le résultat ou la démarche utilisée.
            suite: []
          - id: q04
            type: texte
            enonce: ajouter une colonne permettant de calculer la production par hectare ;
            aide: Effectue cette manipulation dans Calc ou Excel, puis indique ici la formule, le résultat ou la démarche utilisée.
            suite:
                - type: paragraphe
                  texte: mettre le tableau en forme pour qu'il soit facilement lisible.
                - type: paragraphe
                  texte: Si vous terminez rapidement, créez un graphique représentant la production des quatre parcelles.
    - id: a12
      titre: 9. Faire le lien entre les activités
      contenu:
          - type: paragraphe
            texte: Au début de la séance, vous avez organisé vos fichiers. Ensuite, vous avez structuré et présenté des informations dans Writer. Enfin, vous avez utilisé Calc pour commencer à traiter automatiquement des données.
          - type: paragraphe
            texte: "Ces étapes sont liées :"
          - type: paragraphe
            texte: organiser → présenter → calculer → interpréter.
          - type: paragraphe
            texte: "Lors des prochaines séances, nous allons progressivement aller plus loin : vérifier la qualité des données, construire des indicateurs puis utiliser ces résultats pour aider à comprendre une situation professionnelle."
      questions: []
    - id: a13
      titre: 10. Avant de terminer
      contenu:
          - type: paragraphe
            texte: Vérifiez que vos fichiers sont enregistrés dans le dossier S01 et que vous êtes capable de les retrouver.
          - type: paragraphe
            texte: "Vous devez normalement avoir :"
          - type: liste
            elements:
                - BTS2_S01_NOM_Prenom.odt
                - BTS2_S01_NOM_Prenom.pdf
                - BTS2_S01_Diagnostic_NOM_Prenom.ods
      questions: []
    - id: a14
      titre: À retenir
      contenu:
          - type: liste
            elements:
                - Un outil numérique doit être choisi en fonction du besoin.
                - Organiser correctement ses fichiers fait partie du travail professionnel.
                - La mise en forme sert à rendre l'information compréhensible.
                - Un tableur permet d'automatiser des calculs et de travailler sur des données.
                - Cette première séance sert surtout à identifier les compétences déjà acquises et celles que nous allons développer.
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
ressources:
    - type: paragraphe
      texte: Réalise les manipulations dans le logiciel demandé. Conserve tes fichiers sur ton espace habituel. Le site enregistre seulement tes réponses écrites, tes résultats, tes formules et tes démarches ; aucun fichier n’est téléversé.
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://chlorofil.fr/diplomes/secondaire/btsa/acse/acs-agri-2025
