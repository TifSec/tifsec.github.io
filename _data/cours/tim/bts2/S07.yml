titre: Présenter un résultat et l'interpréter sans aller trop vite
theme: TIM — Présenter un résultat et l'interpréter sans aller trop vite
problematique: Présenter un résultat et l'interpréter sans aller trop vite
pourquoi: Lors de la séance précédente, nous avons obtenu une table dynamique capable de résumer plusieurs indicateurs pour chaque type de culture.
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances: []
    competences: []
activites:
    - id: a01
      titre: Pour commencer
      contenu:
          - type: paragraphe
            texte: "Durée prévue : environ 1 heure"
      questions: []
    - id: a02
      titre: Notions et compétences travaillées
      contenu:
          - type: liste
            elements:
                - choix d'une représentation graphique adaptée ;
                - construction et lecture d'un graphique ;
                - titre, axes, unités et lisibilité ;
                - comparaison avec une référence extérieure ;
                - écart absolu et écart relatif ;
                - distinction entre constat, interprétation et décision ;
                - utilisation prudente d'une donnée de référence.
      questions: []
    - id: a03
      titre: Pourquoi allons-nous travailler cela ?
      contenu:
          - type: paragraphe
            texte: Lors de la séance précédente, nous avons obtenu une table dynamique capable de résumer plusieurs indicateurs pour chaque type de culture.
          - type: paragraphe
            texte: Cette table contient beaucoup d'informations utiles, mais elle demande encore au lecteur de parcourir plusieurs nombres.
          - type: paragraphe
            texte: Lorsque nous voulons faire ressortir rapidement une comparaison, une représentation graphique peut être plus efficace.
      questions: []
    - id: a04
      titre: À quoi cela va-t-il vous servir ?
      contenu:
          - type: paragraphe
            texte: "Dans un contexte professionnel, vous pourrez avoir besoin de présenter des résultats :"
          - type: liste
            elements:
                - à un exploitant ;
                - à un associé ;
                - à un conseiller ;
                - à une banque ;
                - dans un dossier ou un rapport ;
                - lors d'une présentation orale.
          - type: paragraphe
            texte: Un bon graphique doit permettre au destinataire de comprendre rapidement l'information importante sans déformer les données.
      questions: []
    - id: a05
      titre: 1. Reprendre la synthèse de la séance précédente
      contenu:
          - type: paragraphe
            texte: "Ouvrez :"
          - type: paragraphe
            texte: BTS2_ACSAGRI_S06_NOM_Prenom.ods
          - type: paragraphe
            texte: "Enregistrez immédiatement une copie sous :"
          - type: paragraphe
            texte: BTS2_ACSAGRI_S07_NOM_Prenom.ods
          - type: paragraphe
            texte: "Dans votre feuille Table_dynamique, vérifiez que vous retrouvez approximativement :"
          - type: tableau
            colonnes:
                - Culture
                - Surface (ha)
                - Rendement moyen (t MS/ha)
                - Coût moyen (€/ha)
                - Travail moyen (h/ha)
            lignes:
                - - Prairie permanente
                  - 25,6
                  - ≈ 5,37
                  - ≈ 170,27
                  - ≈ 6,96
                - - Maïs ensilage
                  - 15,3
                  - ≈ 11,51
                  - ≈ 659,73
                  - ≈ 11,71
                - - Prairie temporaire
                  - 12,0
                  - ≈ 6,93
                  - ≈ 285,00
                  - ≈ 7,75
                - - Méteil
                  - 8,5
                  - ≈ 6,60
                  - ≈ 416,41
                  - ≈ 8,94
      questions: []
    - id: a06
      titre: 2. Quel résultat voulons-nous montrer ?
      contenu:
          - type: paragraphe
            texte: Notre table contient quatre indicateurs différents.
          - type: paragraphe
            texte: "Nous allons aujourd'hui répondre à une question précise :"
          - type: paragraphe
            texte: Comment comparer rapidement le rendement moyen des quatre types de cultures ?
          - type: paragraphe
            texte: Nous n'allons donc pas représenter toutes les colonnes en même temps.
      questions:
          - id: q01
            type: texte
            enonce: "Q1 : Pourquoi serait-il difficile de placer sur un même graphique la surface en hectares, le rendement en t MS/ha, le coût en €/ha et le temps en h/ha ?"
    - id: a07
      titre: 3. Pourquoi choisir un diagramme en colonnes ?
      contenu:
          - type: paragraphe
            texte: "Nous voulons comparer une valeur numérique entre quelques catégories :"
          - type: liste
            elements:
                - Prairie permanente ;
                - Maïs ensilage ;
                - Prairie temporaire ;
                - Méteil.
          - type: paragraphe
            texte: Un diagramme en colonnes est bien adapté à cette question, car la hauteur de chaque colonne permet de comparer rapidement les rendements moyens.
      questions:
          - id: q01
            type: texte
            enonce: "Q2 : Pourquoi un graphique en courbes serait-il moins pertinent ici ?"
    - id: a08
      titre: 4. Créer le graphique
      contenu:
          - type: paragraphe
            texte: "À partir de votre table dynamique, sélectionnez :"
          - type: liste
            elements:
                - les noms des cultures ;
                - leurs rendements moyens.
          - type: paragraphe
            texte: "Puis utilisez :"
          - type: paragraphe
            texte: Insertion → Diagramme
          - type: paragraphe
            texte: Choisissez un diagramme en colonnes.
          - type: paragraphe
            texte: "Votre graphique devra comporter :"
          - type: liste
            elements:
                - un titre explicite ;
                - les quatre cultures ;
                - l'unité t MS/ha ;
                - un axe vertical commençant à 0 ;
                - une présentation simple et lisible.
          - type: paragraphe
            texte: "Titre proposé :"
          - type: paragraphe
            texte: Rendement moyen par type de culture
          - type: paragraphe
            texte: "Ressource : LibreOffice – Insertion de diagrammes."
          - type: lien
            titre: LibreOffice – Insertion de diagrammes
            url: https://help.libreoffice.org/latest/fr/text/shared/guide/chart_insert.html
      questions: []
    - id: a09
      titre: 5. Pourquoi passer du graphique à une référence extérieure ?
      contenu:
          - type: paragraphe
            texte: Le graphique permet de comparer les quatre cultures entre elles dans notre exploitation fictive.
          - type: paragraphe
            texte: Mais il ne nous dit pas si le rendement du maïs est élevé ou faible par rapport à une valeur extérieure.
          - type: paragraphe
            texte: Pour donner un autre point de comparaison, nous allons utiliser une donnée publique issue d'Agreste.
      questions: []
    - id: a10
      titre: 6. Comprendre la référence Agreste
      contenu:
          - type: paragraphe
            texte: "La Statistique agricole annuelle 2024 publiée par Agreste indique pour le maïs fourrage et ensilage (plante entière) un rendement national de :"
          - type: paragraphe
            texte: 135 centaines de kg/ha
          - type: paragraphe
            texte: "Convertissons cette unité :"
          - type: paragraphe
            texte: 135 × 100 kg = 13 500 kg/ha = 13,5 t/ha.
          - type: paragraphe
            texte: "Nous utiliserons donc :"
          - type: paragraphe
            texte: "Référence nationale Agreste 2024 : 13,5 t/ha"
          - type: paragraphe
            texte: "Source : Agreste – Statistique agricole annuelle 2024, chiffres définitifs."
          - type: lien
            titre: Agreste – Statistique agricole annuelle 2024, chiffres définitifs
            url: https://www.agreste.agriculture.gouv.fr/agreste-web/download/publication/publie/Chd2516/cd2025-16_SAA2024-R.Definitifs.pdf
      questions: []
    - id: a11
      titre: 7. Comparer notre résultat à la référence
      contenu:
          - type: paragraphe
            texte: "Dans la feuille Synthese, créez le tableau suivant :"
          - type: tableau
            colonnes:
                - Indicateur
                - Valeur
            lignes:
                - - Rendement moyen du maïs de l'exploitation fictive
                  - 11,51 t MS/ha
                - - Référence nationale Agreste 2024
                  - 13,5 t/ha
                - - Écart
                  - À calculer
                - - Écart relatif
                  - À calculer
          - type: paragraphe
            texte: Nous allons d'abord calculer l'écart absolu.
          - type: paragraphe
            texte: "Il répond à la question :"
          - type: paragraphe
            texte: « Combien de t/ha séparent les deux valeurs ? »
          - type: paragraphe
            texte: "Calculez :"
          - type: paragraphe
            texte: rendement de l'exploitation − référence.
          - type: titre
            texte: Indice 1
          - type: paragraphe
            texte: Utilisez 11,51 et 13,5.
          - type: titre
            texte: Indice 2
          - type: paragraphe
            texte: Calculez 11,51 - 13,5.
          - type: titre
            texte: Indice 3
          - type: paragraphe
            texte: Vous devez obtenir environ -1,99 t/ha.
      questions: []
    - id: a12
      titre: 8. Pourquoi calculer aussi un pourcentage ?
      contenu:
          - type: paragraphe
            texte: Dire qu'il manque 1,99 t/ha donne une différence absolue.
          - type: paragraphe
            texte: Mais un écart de 1,99 n'a pas le même poids si la référence vaut 5 ou si elle vaut 100.
          - type: paragraphe
            texte: Nous allons donc exprimer cette différence par rapport à la référence.
          - type: paragraphe
            texte: "Utilisez :"
          - type: paragraphe
            texte: (valeur exploitation - référence) / référence
          - type: paragraphe
            texte: Puis affichez le résultat en pourcentage.
          - type: titre
            texte: Indice 1
          - type: paragraphe
            texte: "Vous avez déjà calculé l'écart : environ -1,99."
          - type: titre
            texte: Indice 2
          - type: paragraphe
            texte: Divisez cet écart par la référence 13,5.
          - type: titre
            texte: Indice 3
          - type: paragraphe
            texte: Vous devez obtenir environ -0,147, soit -14,7 %.
      questions: []
    - id: a13
      titre: 9. Constater n'est pas encore expliquer
      contenu:
          - type: paragraphe
            texte: "Nous pouvons maintenant écrire un constat :"
          - type: paragraphe
            texte: Le rendement moyen du maïs de notre exploitation fictive est environ 1,99 t/ha, soit 14,7 %, inférieur à la référence nationale Agreste 2024.
      questions:
          - id: q01
            type: texte
            enonce: "Q3 : Cette phrase dit-elle pourquoi le rendement est inférieur ?"
          - id: q02
            type: texte
            enonce: "Q4 : Quelles informations supplémentaires pourraient être nécessaires avant d'expliquer cet écart ?"
            suite:
                - type: titre
                  texte: Indice 1
                - type: paragraphe
                  texte: Pensez aux conditions dans lesquelles les cultures ont été produites.
                - type: titre
                  texte: Indice 2
                - type: paragraphe
                  texte: Climat, sol, eau, variété, pratiques culturales...
                - type: titre
                  texte: Indice 3
                - type: paragraphe
                  texte: On pourrait notamment rechercher la météo de l'année, le type de sol, la variété semée, la disponibilité en eau, les dates d'intervention, la fertilisation ou les objectifs de l'exploitation.
    - id: a14
      titre: 10. Référence ne signifie pas objectif
      contenu:
          - type: paragraphe
            texte: Une autre erreur serait de considérer automatiquement 13,5 t/ha comme un objectif que toutes les exploitations devraient atteindre.
      questions:
          - id: q01
            type: texte
            enonce: "Q5 : Pourquoi une moyenne nationale ne constitue-t-elle pas automatiquement un objectif pour une exploitation particulière ?"
    - id: a15
      titre: 11. Trois niveaux à ne pas confondre
      contenu:
          - type: paragraphe
            texte: "Pour analyser correctement une donnée, distinguons trois étapes :"
          - type: tableau
            colonnes:
                - Étape
                - Question
                - Exemple
            lignes:
                - - Constat
                  - Qu'est-ce que les données montrent ?
                  - 11,51 t/ha est inférieur à 13,5 t/ha.
                - - Interprétation
                  - Pourquoi pourrait-on observer ce résultat ?
                  - Il faudrait étudier le climat, le sol, les pratiques...
                - - Décision
                  - Que faut-il éventuellement faire ?
                  - Impossible à déterminer avec ces seules informations.
      questions: []
    - id: a16
      titre: 12. Rédiger une courte analyse professionnelle
      contenu:
          - type: paragraphe
            texte: Dans la feuille Synthese, rédigez un texte de 4 à 6 lignes destiné à l'exploitant.
          - type: paragraphe
            texte: "Votre texte doit contenir :"
          - type: liste
            elements:
                - le rendement moyen du maïs ;
                - la référence Agreste ;
                - l'écart en t/ha ou en pourcentage ;
                - une formulation prudente de ce que l'on peut conclure ;
                - au moins une information supplémentaire à rechercher.
          - type: titre
            texte: Indice 1
          - type: paragraphe
            texte: Commencez par le constat chiffré, puis expliquez ce que cette comparaison ne permet pas encore de savoir.
          - type: titre
            texte: Indice 2
          - type: paragraphe
            texte: "Structure possible : résultat → comparaison → prudence → information à rechercher."
          - type: titre
            texte: Indice 3
          - type: paragraphe
            texte: "Vous pouvez commencer par : « Le rendement moyen des parcelles de maïs est d'environ 11,51 t MS/ha, contre 13,5 t/ha pour la référence nationale Agreste 2024... »"
      questions: []
    - id: a17
      titre: 13. Vérifier le graphique comme un destinataire
      contenu:
          - type: paragraphe
            texte: Avant de rendre votre travail, regardez votre graphique comme si vous ne connaissiez pas le fichier.
          - type: paragraphe
            texte: "Demandez-vous :"
      questions:
          - id: q01
            type: texte
            enonce: Est-ce que je comprends immédiatement ce qui est comparé ?
          - id: q02
            type: texte
            enonce: L'unité est-elle visible ?
          - id: q03
            type: texte
            enonce: Le titre explique-t-il réellement le graphique ?
          - id: q04
            type: texte
            enonce: Les catégories sont-elles lisibles ?
          - id: q05
            type: texte
            enonce: Ai-je ajouté quelque chose qui complique la lecture sans apporter d'information ?
    - id: a18
      titre: 14. Faire le lien avec les séances précédentes
      contenu:
          - type: paragraphe
            texte: "Notre démarche complète devient :"
          - type: paragraphe
            texte: "S02 : vérifier les données"
          - type: paragraphe
            texte: "S03 : créer des alertes"
          - type: paragraphe
            texte: "S04 : croiser plusieurs critères"
          - type: paragraphe
            texte: "S05 : produire des indicateurs de synthèse"
          - type: paragraphe
            texte: "S06 : regrouper automatiquement les données"
          - type: paragraphe
            texte: "S07 : représenter, comparer et interpréter prudemment"
          - type: paragraphe
            texte: Le tableur est progressivement devenu un outil d'aide à l'analyse, et pas seulement une calculatrice.
      questions: []
    - id: a19
      titre: 15. Bilan de la séance
      contenu:
          - type: paragraphe
            texte: "Dans la feuille Bilan, complétez :"
          - type: liste
            elements:
                - Un graphique sert à ................................................................................................................
                - Le choix du type de graphique dépend de ................................................................................................................
                - Une référence permet de ................................................................................................................
                - Un écart absolu indique ................................................................................................................
                - Un écart relatif indique ................................................................................................................
                - Un constat est ................................................................................................................
                - Une interprétation est ................................................................................................................
          - type: paragraphe
            texte: "Dernière question :"
          - type: paragraphe
            texte: Pourquoi une comparaison statistique ne permet-elle pas automatiquement de prendre une décision ?
      questions: []
    - id: a20
      titre: 16. Avant de rendre
      contenu:
          - type: paragraphe
            texte: "Vérifiez que votre fichier comporte :"
          - type: liste
            elements:
                - votre table dynamique ;
                - un graphique du rendement moyen par culture ;
                - un titre explicite ;
                - l'unité t MS/ha ;
                - "la référence Agreste 2024 : 13,5 t/ha ;"
                - "l'écart absolu : environ -1,99 t/ha ;"
                - "l'écart relatif : environ -14,7 % ;"
                - votre courte analyse professionnelle ;
                - vos réponses dans la feuille Bilan.
          - type: paragraphe
            texte: "Enregistrez :"
          - type: paragraphe
            texte: BTS2_ACSAGRI_S07_NOM_Prenom.ods
          - type: paragraphe
            texte: Déposez le fichier dans l'espace indiqué par le professeur.
      questions: []
    - id: a21
      titre: À retenir
      contenu:
          - type: liste
            elements:
                - Un graphique doit répondre à une question précise.
                - Le type de graphique dépend des données que l'on veut représenter et du message à transmettre.
                - Un graphique facilite la lecture mais ne remplace pas les valeurs numériques.
                - Une référence permet de situer un résultat ; elle n'est pas automatiquement un objectif.
                - Un écart absolu exprime une différence dans l'unité d'origine.
                - Un écart relatif exprime cette différence par rapport à une valeur de référence.
                - Un constat décrit ce que montrent les données.
                - Interpréter nécessite du contexte supplémentaire.
                - Un outil numérique aide à analyser une situation, mais ne remplace pas le raisonnement professionnel.
      questions: []
    - id: a22
      titre: Pour la prochaine séance
      contenu:
          - type: paragraphe
            texte: Nous avons maintenant construit un outil capable de traiter, synthétiser et représenter des données.
          - type: paragraphe
            texte: Mais toutes nos informations sont encore stockées dans un tableur.
          - type: paragraphe
            texte: "Lors de la prochaine séance, nous allons nous demander :"
          - type: paragraphe
            texte: Que se passe-t-il lorsque les données deviennent beaucoup plus nombreuses et qu'elles décrivent plusieurs types d'objets liés entre eux ?
          - type: paragraphe
            texte: Nous commencerons à découvrir le principe d'une base de données relationnelle.
      questions: []
    - id: a23
      titre: Sources et ressources
      contenu:
          - type: liste
            elements:
                - Chlorofil – BTSA ACS'AGRI – référentiel et documents d'accompagnement.
                - Inspection de l'enseignement agricole – Exemples d'utilisation des TIM dans des situations favorisant l'acquisition de capacités.
                - LibreOffice – Insertion de diagrammes.
                - Agreste – Statistique agricole annuelle 2024 – chiffres définitifs.
          - type: lien
            titre: BTSA ACS'AGRI – référentiel et documents d'accompagnement
            url: https://chlorofil.fr/diplomes/secondaire/btsa/acse/acs-agri-2025
          - type: lien
            titre: Exemples d'utilisation des TIM dans des situations favorisant l'acquisition de capacités
            url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
          - type: lien
            titre: Insertion de diagrammes
            url: https://help.libreoffice.org/latest/fr/text/shared/guide/chart_insert.html
          - type: lien
            titre: Statistique agricole annuelle 2024 – chiffres définitifs
            url: https://www.agreste.agriculture.gouv.fr/agreste-web/download/publication/publie/Chd2516/cd2025-16_SAA2024-R.Definitifs.pdf
          - type: paragraphe
            texte: Les données de l'exploitation sont fictives et adaptées à des fins pédagogiques. La référence nationale de 13,5 t/ha pour le maïs fourrage et ensilage est issue de la Statistique agricole annuelle 2024 d'Agreste.
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
ressources:
    - type: paragraphe
      texte: Réalise les manipulations dans le logiciel demandé. Conserve tes fichiers sur ton espace habituel. Le site enregistre seulement tes réponses écrites, tes résultats, tes formules et tes démarches ; aucun fichier n’est téléversé.
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://chlorofil.fr/diplomes/secondaire/btsa/acse/acs-agri-2025
