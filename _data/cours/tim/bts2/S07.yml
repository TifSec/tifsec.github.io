titre: 'Séance 7 : Interroger le classeur : quelles juments surveiller ?'
themes:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
problematique: Comment extraire d’un classeur les informations utiles à une décision ?
competences_bo:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
objectifs:
    connaissances:
        - Le filtre standard (Données > Plus de filtres > Filtre standard) ne garde que les lignes qui respectent des critères ; le tri les range.
        - Une formule calcule une nouvelle colonne (terme = date_saillie + 340) ; une cellule « paramètre » rend le critère réutilisable.
    competences:
        - Filtrer et trier sur plusieurs critères.
        - Ajouter une colonne calculée et une cellule paramètre.
pourquoi:
    - 'Le classeur contient maintenant le fichier elevage_complet.ods (à télécharger ci-dessous) : 25 juments, 3 saisons.'
    - 'L’éleveur demande : quelles juments pleines doivent pouliner avant le 1er avril ?'
activites:
    -   id: a01
        titre: Un filtre simple
        consigne: Tu vas filtrer la feuille Juments pour garder les juments Selle Français. On attend le nombre de juments et le critère utilisé.
        contenu:
            -   type: fichier
                titre: 'classeur complet de l’élevage : 25 juments, 3 saisons (LibreOffice Calc)'
                url: /assets/fichiers/tim/bts2/elevage_complet.ods
            -   type: etapes
                elements:
                    - 'Feuille Juments : clique dans le tableau, puis Données > Plus de filtres > Filtre standard.'
                    - 'Critère : race = Selle Français. Trie ensuite par nom (Données > Trier).'
                    - Lis le nombre de lignes affichées dans la barre d’état en bas (« x sur 25 enregistrements trouvés »), ou vérifie avec =NB.SI(E2:E26;"Selle Français").
                    - Pourquoi un critère ? On ne garde que les lignes utiles.
        questions:
            -   id: q01
                type: nombre
                enonce: Combien de juments Selle Français le filtre garde-t-il ?
                unite: juments
                aide: Applique le filtre sur la race et lis le nombre de lignes trouvées dans la barre d’état, en bas de la fenêtre.
            -   id: q02
                type: texte
                enonce: Écris le critère de ton filtre et la formule NB.SI qui donne le même nombre.
                aide: 'Le critère : nom de colonne, condition, valeur. La formule : =NB.SI(plage des races;"valeur cherchée").'
    -   id: a02
        titre: Croiser deux feuilles
        transition: Une feuille, c’est simple. Croise maintenant deux feuilles.
        consigne: Tu vas calculer dans la feuille Saillies la date de terme des juments pleines. On attend les juments à surveiller avant le 1er avril.
        contenu:
            -   type: etapes
                elements:
                    - 'Feuille Saillies : colonne F « nom » : =RECHERCHEV(B2;$Juments.$A$2:$C$26;3;0) ; recopie vers le bas.'
                    - 'Colonne G « terme » : =D2+340, au format date ; recopie vers le bas.'
                    - 'Filtre standard : resultat = pleine ET terme < 01/04/2027 ET date_saillie ≥ 01/01/2026. Trie par terme.'
                    - 'Pourquoi + 340 ? La gestation d’une jument dure environ 11 mois (≈ 340 jours) : on prévoit la surveillance.'
        questions:
            -   id: q01
                type: texte
                enonce: Quelles juments ont un terme prévu avant le 01/04/2027 ?
                aide: Ta feuille Saillies affiche le nom (RECHERCHEV) et le terme (date + 340). Filtre les pleines de 2026 dont le terme est avant le 01/04/2027. Recopie les noms et les dates.
    -   id: a03
        titre: Une cellule paramètre
        transition: Le filtre marche pour une date. Rends-le réutilisable.
        consigne: Tu vas remplacer la date fixe par une cellule paramètre. On attend la formule et ce qui se passe quand tu changes la date.
        contenu:
            -   type: etapes
                elements:
                    - En J1, écris « date limite » ; en J2, une date (01/04/2027).
                    - 'Colonne H « à surveiller » : =SI(ET(E2="pleine";G2<$J$2);"oui";"") ; recopie vers le bas, puis filtre sur « oui ».'
                    - 'Change la date de J2 (01/03/2027) : observe la colonne H.'
                    - 'Pourquoi un paramètre ? Le même classeur sert toute la saison : on change une seule cellule.'
        questions:
            -   id: q01
                type: texte
                enonce: Écris ta formule avec la cellule paramètre et ce qui se passe quand tu changes la date.
                aide: 'La formule compare le terme à la cellule $J$2 (référence absolue). Change la date de J2 : que deviennent les « oui » ?'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La surveillance commence souvent quelques semaines avant le terme.
        questions:
            -   id: q01
                type: texte
                enonce: Quel filtre ou quelle formule prépare la mise en place de la caméra de poulinage ?
                aide: La caméra sert juste avant le poulinage. Quelles juments, et dans quel délai avant le terme ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Le classeur répond aux questions de l’éleveur. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment extraire d’un classeur les informations utiles à une décision ?'
                aide: Dis ce que permettent les filtres, le tri, RECHERCHEV, les colonnes calculées et la cellule paramètre.
retenir:
    - Filtre standard (plusieurs critères) + tri.
    - Colonne calculée ; cellule paramètre en référence absolue ($J$2).
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
