titre: 'Séance 17 : L’intelligence artificielle en élevage : regard critique'
themes:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
problematique: Quand une IA peut-elle aider l’éleveur, et quelles en sont les limites ?
competences_bo:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
objectifs:
    connaissances:
        - 'Deux familles : IA qui analyse (images, capteurs : détection de boiterie, de comportement) ; IA générative (texte : réponses, rédaction).'
        - 'Limites : erreurs plausibles, données d’entraînement, absence de responsabilité, confidentialité ; on vérifie toujours avec une source fiable.'
    competences:
        - Distinguer types d’usages de l’IA.
        - Évaluer une réponse d’IA.
pourquoi:
    - Des applications promettent de détecter une boiterie par vidéo ; des chatbots répondent aux questions d’élevage.
    - Tu évalues ces usages.
activites:
    -   id: a01
        titre: Les usages
        consigne: Tu vas classer trois usages de l’IA en élevage équin (document 1). On attend un avis justifié pour chacun.
        contenu:
            -   type: liste
                elements:
                    - Rédiger un brouillon d’annonce de vente de poulain.
                    - Demander une dose d’anti-inflammatoire pour une jument.
                    - Repérer des irrégularités d’allure sur vidéo, avant l’avis vétérinaire.
            -   type: etapes
                elements:
                    - 'Classe les usages (document 1) : utile avec précautions / à éviter.'
            -   type: paragraphe
                texte: Pourquoi classer ? Le risque dépend de l’usage, pas de l’outil.
        questions:
            -   id: q01
                type: tableau
                enonce: Classe chaque usage.
                colonnes:
                    - Usage
                    - Avis
                lignes:
                    -   - Rédiger un brouillon d’annonce de vente de poulain
                        - ''
                    -   - Demander une dose d’anti-inflammatoire pour une jument
                        - ''
                    -   - Repérer des irrégularités d’allure sur vidéo, avant l’avis vétérinaire
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: Évaluer une réponse
        transition: Tu as classé les usages. Teste une réponse.
        consigne: Tu vas vérifier la réponse d’une IA sur la gestation de la jument (document 2) avec une source fiable. On attend l’erreur et la valeur juste.
        contenu:
            -   type: citation
                texte: 'Document 2 — Réponse d’IA (exemple construit) : « La gestation de la jument dure 9 mois, il faut donc surveiller vos juments à partir du 8e mois. »'
            -   type: lien
                titre: IFCE — Équipédia (fiches techniques sur le cheval)
                url: https://equipedia.ifce.fr/
            -   type: etapes
                elements:
                    - Lis la réponse d’une IA générative (document 2, exemple construit).
                    - Vérifie sur Équipédia ; repère l’erreur.
            -   type: paragraphe
                texte: Pourquoi vérifier ? Une IA générative produit des phrases plausibles, pas des faits vérifiés.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 2 et ta vérification, quelle erreur l’IA a-t-elle faite ?
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
    -   id: a03
        titre: Une charte d’usage
        transition: L’IA peut se tromper. Comment l’utiliser à l’exploitation ?
        consigne: Tu vas rédiger une charte de quatre règles d’usage de l’IA pour une exploitation. On attend les quatre règles.
        contenu:
            -   type: etapes
                elements:
                    - Rédige 4 règles d’usage de l’IA pour une exploitation.
            -   type: paragraphe
                texte: 'Pourquoi une charte ? Les salariés utilisent déjà ces outils : autant fixer les règles.'
        questions:
            -   id: q01
                type: texte
                enonce: Écris tes 4 règles.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une IA d’analyse vidéo a été entraînée sur des chevaux de course.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi peut-elle se tromper sur des poneys ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as un regard critique sur l’IA. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quand une IA peut-elle aider l’éleveur, et quelles en sont les limites ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - IA d’analyse / IA générative.
    - Vérifier ; confidentialité ; décision humaine.
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
