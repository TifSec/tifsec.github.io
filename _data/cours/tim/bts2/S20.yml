titre: 'Séance 20 : Présenter l’ajustement à l’éleveur'
themes:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
problematique: Comment convaincre un éleveur d’ajuster sa conduite, données à l’appui ?
competences_bo:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
objectifs:
    connaissances:
        - 'Une présentation de conseil : le constat (chiffres), les options, la recommandation, le plan de suivi ; 10 minutes, puis questions.'
        - 'Écouter les objections : contraintes de l’éleveur (temps, argent, attachement aux animaux).'
    competences:
        - Présenter une recommandation.
        - Répondre à des objections.
pourquoi:
    - Ta recommandation (S19) est prête.
    - Tu la présentes à l’éleveur (joué par un camarade ou le professeur).
activites:
    -   id: a01
        titre: Le support
        consigne: Tu vas préparer les cinq diapositives de ta présentation à l’éleveur. On attend les cinq titres-phrases.
        contenu:
            -   type: etapes
                elements:
                    - '5 diapositives : constat, options, recommandation, suivi, questions.'
                    - Titres-phrases ; un graphique clé.
            -   type: paragraphe
                texte: Pourquoi un graphique clé ? Il rend le constat indiscutable.
        questions:
            -   id: q01
                type: texte
                enonce: Écris tes 5 titres-phrases.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a02
        titre: Anticiper les objections
        transition: Le support est prêt. Prépare-toi aux questions.
        consigne: Tu vas anticiper deux objections de l’éleveur et préparer tes réponses. On attend les objections et les réponses.
        contenu:
            -   type: etapes
                elements:
                    - Liste 2 objections probables de l’éleveur.
                    - Prépare une réponse chiffrée et respectueuse.
            -   type: paragraphe
                texte: Pourquoi respectueuse ? L’éleveur connaît ses animaux ; tu apportes des données, pas des ordres.
        questions:
            -   id: q01
                type: texte
                enonce: Écris tes 2 objections et tes réponses.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a03
        titre: Présenter
        transition: Tu es prêt. Présente.
        consigne: Tu vas présenter ta recommandation et répondre aux questions de l’éleveur. On attend la question la plus difficile et ta réponse.
        contenu:
            -   type: etapes
                elements:
                    - Présente 10 minutes, puis 5 minutes de questions.
                    - Note la question la plus difficile et ta réponse.
            -   type: paragraphe
                texte: Pourquoi noter ? Pour progresser avant les épreuves de l’examen.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle question a été la plus difficile, et comment as-tu répondu ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un graphique peut être compris de travers par un non-spécialiste.
        questions:
            -   id: q01
                type: texte
                enonce: Comment le vérifier avant ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ta recommandation est présentée. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment convaincre un éleveur d’ajuster sa conduite, données à l’appui ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Constat → options → recommandation → suivi.
    - 'Objections : écouter, chiffrer, respecter.'
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
