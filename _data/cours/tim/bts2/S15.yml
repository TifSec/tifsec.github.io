titre: 'Séance 15 : Capteurs et objets connectés en élevage équin'
themes:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
problematique: Les objets connectés améliorent-ils vraiment la conduite d’un élevage ?
competences_bo:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
objectifs:
    connaissances:
        - 'Exemples : détecteur de poulinage (sangle, capteur vulvaire), caméra, thermomètre de stockage du foin, compteur d’eau, balance connectée.'
        - 'Évaluer : utilité, fiabilité (fausses alertes), coût, données produites et qui les possède.'
    competences:
        - Analyser une chaîne de données d’un capteur.
        - Évaluer un objet connecté.
pourquoi:
    - En S07, tu as listé les juments à surveiller.
    - Des capteurs promettent d’alerter l’éleveur au moment du poulinage.
activites:
    -   id: a01
        titre: La chaîne de données
        consigne: Tu vas décrire la chaîne de données d’un détecteur de poulinage (document 1). On attend chaque maillon.
        contenu:
            -   type: paragraphe
                texte: 'Document 1 — Détecteur de poulinage (exemple) : une sangle mesure la position couchée et la sudation ; elle envoie les données par radio à un boîtier dans l’écurie, qui appelle l’éleveur par le réseau mobile quand le seuil est dépassé.'
            -   type: etapes
                elements:
                    - Lis la description du détecteur (document 1).
                    - 'Remets la chaîne dans l’ordre : capteur → transmission → traitement → alerte.'
            -   type: paragraphe
                texte: Pourquoi la chaîne ? Chaque maillon peut tomber en panne.
        questions:
            -   id: q01
                type: tableau
                enonce: Décris chaque maillon.
                colonnes:
                    - Maillon
                    - Dans ce système
                lignes:
                    -   - Capteur
                        - ''
                    -   - Transmission
                        - ''
                    -   - Alerte
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: Fiabilité et fausses alertes
        transition: La chaîne est comprise. Est-elle fiable ?
        consigne: Tu vas calculer le taux de fausses alertes du détecteur sur une saison (document 2). On attend le taux et la conduite à tenir en cas d’oubli.
        contenu:
            -   type: tableau
                titre: Document 2 — Relevé d’une saison (fictif)
                colonnes:
                    - Saison
                    - Alertes
                    - Poulinages réels détectés
                    - Poulinages manqués
                lignes:
                    -   - '2026'
                        - '20'
                        - '12'
                        - '1'
            -   type: etapes
                elements:
                    - Lis le relevé d’une saison (document 2).
                    - Calcule le taux de fausses alertes.
            -   type: paragraphe
                texte: Pourquoi les fausses alertes ? Trop d’alertes inutiles, et l’éleveur ne se lève plus.
        questions:
            -   id: q01
                type: nombre
                enonce: D’après le document 2, quel est le pourcentage de fausses alertes ?
                unite: '%'
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: texte
                enonce: Un poulinage n’a pas été détecté. Quelle conséquence possible, et que faire ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a03
        titre: Décider l’achat
        transition: Tu connais les limites. Faut-il acheter ?
        consigne: Tu vas rendre un avis argumenté sur l’achat d’un détecteur de poulinage pour un élevage de 15 juments. On attend un avis sur les cinq critères.
        contenu:
            -   type: etapes
                elements:
                    - 'Construis une grille : utilité, fiabilité, coût, données, alternative.'
                    - Rends un avis argumenté.
            -   type: paragraphe
                texte: Pourquoi une grille ? Elle évite d’acheter sur une publicité.
        questions:
            -   id: q01
                type: texte
                enonce: Rends ton avis sur l’achat du détecteur pour un élevage de 15 juments.
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Les données du détecteur sont stockées chez le fabricant.
        questions:
            -   id: q01
                type: texte
                enonce: Qu’est-ce que l’éleveur doit vérifier dans le contrat ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais évaluer un objet connecté. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : les objets connectés améliorent-ils vraiment la conduite d’un élevage ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Chaîne de données ; fausses alertes.
    - 'Grille : utilité, fiabilité, coût, données.'
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
