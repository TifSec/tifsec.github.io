titre: 'Séance 11 : Évaluation : une base pour le suivi sanitaire'
themes:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
problematique: Saurai-je concevoir et exploiter seul une petite base de données d’élevage ?
competences_bo:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
objectifs:
    connaissances:
        - 'On réutilise : modélisation, tables, relations, requêtes, formulaire, état.'
    competences:
        - Concevoir et exploiter une base en autonomie.
pourquoi:
    - De S03 à S10, tu as construit la base de reproduction.
    - 'Évaluation : une base pour le suivi des vaccinations d’un centre équestre (cas nouveau).'
activites:
    -   id: a01
        titre: Modéliser
        consigne: Tu vas proposer seul le modèle de données du suivi des vaccinations (document 1). On attend tables, clés et relations.
        contenu:
            -   type: fichier
                titre: jeu d’essai des vaccinations à saisir
                url: /assets/fichiers/tim/bts2/vaccins_jeu_essai.ods
            -   type: paragraphe
                texte: Document 1 — Le centre veut enregistrer pour chaque équidé les injections de vaccins (grippe, tétanos, rhinopneumonie), la date, le vétérinaire, et savoir quels rappels sont à faire.
            -   type: etapes
                elements:
                    - Lis le besoin (document 1).
                    - Propose les tables, clés et relations.
                    - Pourquoi modéliser d’abord ? Une erreur de modèle coûte cher ensuite.
        questions:
            -   id: q01
                type: texte
                enonce: Écris ton modèle (tables, clés, relations).
                aide: 'Trois tables : les équidés, les vaccins (avec leur délai de rappel), les injections qui relient les deux. Indique les clés.'
    -   id: a02
        titre: Construire et interroger
        transition: Le modèle est prêt. Construis et interroge.
        consigne: Tu vas construire la base et écrire la requête des rappels de vaccins à faire. On attend le SQL et le nombre de rappels.
        contenu:
            -   type: etapes
                elements:
                    - Crée les tables et relations ; saisis le jeu d’essai fourni.
                    - 'Requête : prochaine date = date + rappel_jours ; critère : avant la fin du mois.'
                    - Pourquoi cette requête ? C’est la question principale du centre.
        questions:
            -   id: q01
                type: texte
                enonce: Écris le SQL (grandes lignes) de la requête des rappels à faire.
                aide: Relie Injection à Equide et Vaccin, calcule date + délai de rappel, et garde les dates avant la fin du mois.
            -   id: q02
                type: nombre
                enonce: Combien de rappels sont à faire avant la fin du mois (jeu d’essai fourni) ?
                unite: rappels
                aide: Exécute ta requête des rappels sur le jeu d’essai fourni et compte les lignes.
    -   id: a03
        titre: Justifier
        transition: La base répond. Justifie ton choix.
        consigne: Tu vas justifier auprès du gérant le choix d’une base de données. On attend une justification argumentée.
        contenu:
            -   type: etapes
                elements:
                    - 'Rédige 3 lignes pour le gérant : pourquoi une base plutôt qu’un tableur ici ?'
                    - Pourquoi justifier ? Le choix d’outil fait partie de la compétence.
        questions:
            -   id: q01
                type: texte
                enonce: Rédige ta justification.
                aide: 'Pourquoi une base plutôt qu’un tableur ici : plusieurs injections par équidé, redondance, requêtes, contrôles.'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Ajoute un état « carnet de vaccination » par équidé.
        questions:
            -   id: q01
                type: texte
                enonce: Quel regroupement ?
                aide: Un carnet de vaccination se lit cheval par cheval, vaccin par vaccin dans le temps. Quel regroupement et quel tri ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: L’évaluation est terminée. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : saurais-tu concevoir et exploiter seul une petite base de données d’élevage ? Fais ton bilan.'
                aide: 'Fais ton bilan sur les quatre étapes : modèle, construction, requête, justification.'
retenir:
    - Modèle → tables → relations → requêtes → justification.
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
