titre: 'Séance 11 : Évaluation : un classeur pour le suivi sanitaire'
themes:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
problematique: Saurai-je concevoir et exploiter seul un classeur de données d’élevage ?
competences_bo:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
objectifs:
    connaissances:
        - 'On réutilise : modélisation, feuilles reliées, formats et validité, RECHERCHEV, filtres, NB.SI.ENS, mise en page.'
    competences:
        - Concevoir et exploiter un classeur relié en autonomie.
pourquoi:
    - De S03 à S10, tu as construit le classeur de reproduction.
    - 'Évaluation : un classeur pour le suivi des vaccinations d’un centre équestre (cas nouveau).'
activites:
    -   id: a01
        titre: Modéliser
        consigne: Tu vas proposer seul l’organisation du suivi des vaccinations (document 1). On attend les feuilles, les identifiants et les liens.
        contenu:
            -   type: fichier
                titre: jeu d’essai des vaccinations (LibreOffice Calc)
                url: /assets/fichiers/tim/bts2/vaccins_jeu_essai.ods
            -   type: paragraphe
                texte: Document 1 — Le centre veut enregistrer pour chaque équidé les injections de vaccins (grippe, tétanos, rhinopneumonie), la date, le vétérinaire, et savoir quels rappels sont à faire.
            -   type: etapes
                elements:
                    - Lis le besoin (document 1).
                    - Propose les feuilles, leurs colonnes, les identifiants et les liens.
                    - Pourquoi modéliser d’abord ? Une erreur d’organisation coûte cher ensuite.
        questions:
            -   id: q01
                type: texte
                enonce: Écris ton modèle (feuilles, identifiants, liens).
                aide: 'Trois feuilles : les équidés, les vaccins (avec leur délai de rappel), les injections qui relient les deux. Indique les identifiants et les colonnes qui renvoient.'
    -   id: a02
        titre: Construire et interroger
        transition: Le modèle est prêt. Construis et interroge.
        consigne: Tu vas compléter le classeur et calculer les rappels de vaccins à faire. On attend la formule et le nombre de rappels.
        contenu:
            -   type: etapes
                elements:
                    - 'Ouvre le jeu d’essai : vérifie les feuilles et ajoute les règles de validité (liste des vaccins, UELN existant).'
                    - 'Feuille Injections : colonne rappel_jours =RECHERCHEV(B2;$Vaccins.$A$2:$B$4;2;0) ; colonne prochain_rappel = date + rappel_jours (format date).'
                    - Compte les rappels à faire avant le 31/12/2026 (filtre ou NB.SI).
                    - Pourquoi ce calcul ? C’est la question principale du centre.
        questions:
            -   id: q01
                type: texte
                enonce: Écris les formules (grandes lignes) qui calculent la date du prochain rappel et comptent les rappels à faire.
                aide: RECHERCHEV va chercher le délai de rappel du vaccin ; on l’ajoute à la date d’injection ; NB.SI compte les dates avant le 31/12/2026.
            -   id: q02
                type: nombre
                enonce: Combien de rappels sont à faire avant le 31/12/2026 (jeu d’essai fourni) ?
                unite: rappels
                aide: Applique ta formule à toutes les injections du jeu d’essai, puis compte les prochains rappels avant le 31/12/2026.
    -   id: a03
        titre: Justifier
        transition: Le classeur répond. Justifie ton choix.
        consigne: Tu vas justifier auprès du gérant l’organisation en feuilles reliées. On attend une justification argumentée.
        contenu:
            -   type: etapes
                elements:
                    - 'Rédige 3 lignes pour le gérant : pourquoi plusieurs feuilles reliées plutôt qu’un seul tableau ici ?'
                    - Pourquoi justifier ? Le choix de l’organisation fait partie de la compétence.
        questions:
            -   id: q01
                type: texte
                enonce: Rédige ta justification.
                aide: 'Pourquoi des feuilles reliées plutôt qu’un seul tableau : plusieurs injections par équidé, répétitions, calcul automatique des rappels, contrôles.'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Ajoute un document imprimable « carnet de vaccination » par équidé.
        questions:
            -   id: q01
                type: texte
                enonce: Quel regroupement ?
                aide: Un carnet de vaccination se lit cheval par cheval, vaccin par vaccin dans le temps. Quel tri et quels sous-totaux ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: L’évaluation est terminée. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : saurais-tu concevoir et exploiter seul un classeur de données d’élevage ? Fais ton bilan.'
                aide: 'Fais ton bilan sur les quatre étapes : modèle, construction, calcul des rappels, justification.'
retenir:
    - Modèle → feuilles reliées → contrôles → formules → justification.
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
