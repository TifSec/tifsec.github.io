titre: Synthétiser automatiquement tout un tableau
theme: TIM — Synthétiser automatiquement tout un tableau
problematique: Synthétiser automatiquement tout un tableau
pourquoi: "Lors de la séance précédente, nous avons réussi à calculer :"
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances: []
    competences: []
activites:
    - id: a01
      titre: Pour commencer
      contenu:
          - type: paragraphe
            texte: "Durée prévue : environ 1 heure"
      questions: []
    - id: a02
      titre: Notions et compétences travaillées
      contenu:
          - type: liste
            elements:
                - table dynamique ;
                - regroupement de données par catégorie ;
                - somme et moyenne dans une synthèse ;
                - champ de ligne et champ de données ;
                - actualisation d'une synthèse ;
                - lecture et interprétation d'indicateurs regroupés.
      questions: []
    - id: a03
      titre: Pourquoi allons-nous travailler cela ?
      contenu:
          - type: paragraphe
            texte: "Lors de la séance précédente, nous avons réussi à calculer :"
          - type: liste
            elements:
                - le nombre de parcelles prioritaires ;
                - la surface totale en maïs ensilage ;
                - le rendement moyen du maïs ensilage.
          - type: paragraphe
            texte: Pour cela, nous avons écrit des formules avec NB.SI, SOMME.SI et MOYENNE.SI.
          - type: paragraphe
            texte: Cette méthode fonctionne très bien lorsque nous savons exactement quelle question nous voulons poser.
          - type: paragraphe
            texte: Mais si nous voulons maintenant comparer toutes les cultures, il faudrait recommencer les calculs pour Prairie permanente, Prairie temporaire, Méteil, Maïs ensilage...
          - type: paragraphe
            texte: "Il existe un outil capable de réaliser automatiquement ce regroupement : la table dynamique."
      questions: []
    - id: a04
      titre: À quoi cela va-t-il vous servir ?
      contenu:
          - type: paragraphe
            texte: Une table dynamique permet de transformer rapidement un grand tableau détaillé en une vue plus simple.
          - type: paragraphe
            texte: "Elle peut servir par exemple à :"
          - type: liste
            elements:
                - regrouper des parcelles par culture ;
                - comparer des surfaces ;
                - calculer des valeurs moyennes ;
                - résumer des coûts ou des temps de travail ;
                - modifier rapidement le point de vue utilisé pour analyser les données.
      questions: []
    - id: a05
      titre: 1. Reprendre notre outil d'analyse
      contenu:
          - type: paragraphe
            texte: "Ouvrez :"
          - type: paragraphe
            texte: BTS2_ACSAGRI_S05_NOM_Prenom.ods
          - type: paragraphe
            texte: "Enregistrez immédiatement une copie sous :"
          - type: paragraphe
            texte: BTS2_ACSAGRI_S06_NOM_Prenom.ods
          - type: paragraphe
            texte: "Dans la feuille Analyse, vérifiez que vous disposez au minimum des colonnes suivantes :"
          - type: liste
            elements:
                - Parcelle ;
                - Culture ;
                - Surface (ha) ;
                - Rendement (t MS/ha) ;
                - Coût intrants (€/ha) ;
                - Temps de travail (h/ha).
      questions: []
    - id: a06
      titre: 2. Comprendre ce que nous voulons obtenir
      contenu:
          - type: paragraphe
            texte: Avant d'utiliser l'outil, définissons le résultat attendu.
          - type: paragraphe
            texte: "Nous voulons obtenir une ligne par culture et afficher pour chacune :"
          - type: liste
            elements:
                - la surface totale ;
                - le rendement moyen ;
                - le coût moyen des intrants par hectare ;
                - le temps de travail moyen par hectare.
      questions:
          - id: q01
            type: texte
            enonce: "Q1 : Pourquoi voulons-nous une somme pour la surface, mais une moyenne pour le rendement ?"
    - id: a07
      titre: 3. Pourquoi passer maintenant à une table dynamique ?
      contenu:
          - type: paragraphe
            texte: "Avec les fonctions de la séance précédente, nous aurions pu créer :"
          - type: liste
            elements:
                - une SOMME.SI pour le maïs ;
                - une SOMME.SI pour le méteil ;
                - une SOMME.SI pour les prairies permanentes ;
                - une SOMME.SI pour les prairies temporaires ;
                - puis recommencer avec les moyennes.
          - type: paragraphe
            texte: Le résultat serait correct, mais nous écririons beaucoup de formules très proches.
          - type: paragraphe
            texte: La table dynamique va effectuer ces regroupements automatiquement à partir du tableau détaillé.
      questions: []
    - id: a08
      titre: 4. Créer la table dynamique
      contenu:
          - type: paragraphe
            texte: "Dans la feuille Analyse :"
          - type: etapes
            elements:
                - sélectionnez tout le tableau, titres compris ;
                - ouvrez Données → Table dynamique → Insérer ou éditer ;
                - choisissez Sélection active ;
                - validez.
          - type: paragraphe
            texte: LibreOffice affiche maintenant les noms des colonnes sous forme de champs que vous pouvez déplacer.
          - type: paragraphe
            texte: "Ressource : LibreOffice – Création de tables dynamiques."
          - type: lien
            titre: LibreOffice – Création de tables dynamiques
            url: https://help.libreoffice.org/latest/fr/text/scalc/guide/datapilot_createtable.html
      questions: []
    - id: a09
      titre: 5. Dire au tableur comment regrouper les données
      contenu:
          - type: paragraphe
            texte: Nous voulons obtenir une ligne par type de culture.
          - type: paragraphe
            texte: Faites glisser le champ Culture dans la zone Champs de ligne.
      questions:
          - id: q01
            type: texte
            enonce: "Q2 : Pourquoi Culture doit-elle être placée dans les champs de ligne ?"
            suite:
                - type: titre
                  texte: Indice 1
                - type: paragraphe
                  texte: Demandez-vous ce que vous voulez voir apparaître une fois par ligne dans la synthèse.
                - type: titre
                  texte: Indice 2
                - type: paragraphe
                  texte: Nous voulons comparer les différents types de cultures.
                - type: titre
                  texte: Indice 3
                - type: paragraphe
                  texte: "Culture est donc notre critère de regroupement : une ligne sera créée pour chaque culture différente."
    - id: a10
      titre: 6. Ajouter la surface totale
      contenu:
          - type: paragraphe
            texte: Nous voulons maintenant connaître la surface totale correspondant à chaque culture.
          - type: paragraphe
            texte: Faites glisser Surface (ha) dans la zone Champs de données.
          - type: paragraphe
            texte: Vérifiez que le calcul utilisé est bien Somme.
          - type: paragraphe
            texte: Si nécessaire, double-cliquez sur le champ pour modifier le type de calcul.
      questions:
          - id: q01
            type: texte
            enonce: "Q3 : Retrouvez-vous les 15,3 ha de maïs ensilage calculés avec SOMME.SI lors de la séance précédente ?"
    - id: a11
      titre: 7. Ajouter un rendement moyen
      contenu:
          - type: paragraphe
            texte: Nous allons maintenant ajouter le champ Rendement (t MS/ha) dans les Champs de données.
          - type: paragraphe
            texte: Cette fois, nous ne voulons pas additionner les rendements.
          - type: paragraphe
            texte: Choisissez le calcul Moyenne.
          - type: titre
            texte: Indice 1
          - type: paragraphe
            texte: Si LibreOffice affiche « Somme de Rendement », demandez-vous si additionner 11,70 + 11,04 + 11,78 représente vraiment un rendement.
          - type: titre
            texte: Indice 2
          - type: paragraphe
            texte: Double-cliquez sur le champ placé dans la zone de données pour choisir une autre opération.
          - type: titre
            texte: Indice 3
          - type: paragraphe
            texte: Choisissez Moyenne.
      questions: []
    - id: a12
      titre: 8. Pourquoi ajouter maintenant le coût et le temps de travail ?
      contenu:
          - type: paragraphe
            texte: Nous savons maintenant comparer les cultures selon leur surface et leur rendement.
          - type: paragraphe
            texte: Mais depuis le début de notre analyse, nous savons qu'une performance ne se résume pas à la quantité produite.
          - type: paragraphe
            texte: "Nous allons donc ajouter deux autres dimensions :"
          - type: liste
            elements:
                - le coût des intrants par hectare ;
                - le temps de travail par hectare.
          - type: paragraphe
            texte: Nous passons donc d'une comparaison principalement productive à une lecture plus large de la situation.
      questions: []
    - id: a13
      titre: 9. Compléter la table dynamique
      contenu:
          - type: paragraphe
            texte: "Ajoutez dans les Champs de données :"
          - type: liste
            elements:
                - Coût intrants (€/ha) avec le calcul Moyenne ;
                - Temps de travail (h/ha) avec le calcul Moyenne.
          - type: paragraphe
            texte: "Placez la table dynamique dans une nouvelle feuille nommée :"
          - type: paragraphe
            texte: Table_dynamique
          - type: paragraphe
            texte: "Votre table doit donner des résultats proches des valeurs suivantes :"
          - type: tableau
            colonnes:
                - Culture
                - Surface totale (ha)
                - Rendement moyen (t MS/ha)
                - Coût moyen (€/ha)
                - Travail moyen (h/ha)
            lignes:
                - - Prairie permanente
                  - 25,6
                  - ≈ 5,37
                  - ≈ 170,27
                  - ≈ 6,96
                - - Maïs ensilage
                  - 15,3
                  - ≈ 11,51
                  - ≈ 659,73
                  - ≈ 11,71
                - - Prairie temporaire
                  - 12,0
                  - ≈ 6,93
                  - ≈ 285,00
                  - ≈ 7,75
                - - Méteil
                  - 8,5
                  - ≈ 6,60
                  - ≈ 416,41
                  - ≈ 8,94
      questions: []
    - id: a14
      titre: 10. Lire la table plutôt que simplement la construire
      contenu:
          - type: paragraphe
            texte: La table dynamique est maintenant créée.
          - type: paragraphe
            texte: Mais construire un tableau n'a d'intérêt que si nous savons l'interpréter.
          - type: paragraphe
            texte: Répondez dans la feuille Bilan.
      questions:
          - id: q01
            type: texte
            enonce: "Q4 : Quelle culture occupe la plus grande surface totale ?"
          - id: q02
            type: texte
            enonce: "Q5 : Quelle culture présente le rendement moyen le plus élevé dans notre jeu de données ?"
          - id: q03
            type: texte
            enonce: "Q6 : Cette même culture présente-t-elle également les coûts et le temps de travail moyens les plus élevés ?"
          - id: q04
            type: texte
            enonce: "Q7 : Peut-on en conclure que le maïs ensilage est une mauvaise culture pour cette exploitation ? Justifiez."
            suite:
                - type: titre
                  texte: Indice 1
                - type: paragraphe
                  texte: La table montre des valeurs, mais explique-t-elle pourquoi elles sont différentes ?
                - type: titre
                  texte: Indice 2
                - type: paragraphe
                  texte: Le maïs présente aussi le rendement moyen le plus élevé. Il faut donc regarder plusieurs indicateurs ensemble.
                - type: titre
                  texte: Indice 3
                - type: paragraphe
                  texte: On peut constater que le maïs mobilise davantage de coûts et de travail dans ce jeu de données, mais il faut connaître le contexte, les objectifs et les résultats économiques avant de juger la pertinence de cette culture.
    - id: a15
      titre: 11. Modifier le point de vue
      contenu:
          - type: paragraphe
            texte: L'intérêt d'une table dynamique est qu'elle peut être réorganisée sans modifier les données originales.
          - type: paragraphe
            texte: "Pour tester cela, modifiez temporairement votre table :"
          - type: etapes
            elements:
                - retirez Culture des champs de ligne ;
                - placez Priorité à la place ;
                - observez le résultat ;
                - remettez ensuite Culture comme champ de ligne.
      questions:
          - id: q01
            type: texte
            enonce: "Q8 : Qu'avons-nous changé : les données originales ou seulement la manière de les regrouper ?"
    - id: a16
      titre: 12. Tester l'actualisation
      contenu:
          - type: paragraphe
            texte: Une table dynamique est liée à ses données sources, mais elle ne se met pas toujours à jour immédiatement lorsque celles-ci changent.
          - type: paragraphe
            texte: "Dans la feuille Analyse, modifiez temporairement la surface de P01 :"
          - type: paragraphe
            texte: 7,8 ha → 10 ha
          - type: paragraphe
            texte: "Retournez dans votre table dynamique puis utilisez :"
          - type: paragraphe
            texte: Données → Table dynamique → Actualiser
          - type: paragraphe
            texte: Observez la surface totale des prairies permanentes.
          - type: paragraphe
            texte: Remettez ensuite P01 à 7,8 ha et actualisez à nouveau.
      questions:
          - id: q01
            type: texte
            enonce: "Q9 : Pourquoi faut-il connaître la commande Actualiser ?"
    - id: a17
      titre: 13. Faire le lien avec la séance précédente
      contenu:
          - type: paragraphe
            texte: "En S05, nous avions :"
          - type: paragraphe
            texte: une question précise → une fonction conditionnelle → un résultat.
          - type: paragraphe
            texte: "Exemple :"
          - type: paragraphe
            texte: Maïs ensilage → SOMME.SI → 15,3 ha.
          - type: paragraphe
            texte: "Aujourd'hui :"
          - type: paragraphe
            texte: un tableau complet → un critère de regroupement → plusieurs indicateurs pour toutes les catégories.
          - type: paragraphe
            texte: "Les deux méthodes sont utiles :"
          - type: liste
            elements:
                - les fonctions sont pratiques pour construire des indicateurs précis à des endroits choisis ;
                - la table dynamique est pratique pour explorer, regrouper et comparer rapidement un ensemble de données.
      questions: []
    - id: a18
      titre: 14. Bilan de la séance
      contenu:
          - type: paragraphe
            texte: "Dans la feuille Bilan, complétez :"
          - type: liste
            elements:
                - Une table dynamique sert à ................................................................................................................
                - Un champ de ligne sert à ................................................................................................................
                - Un champ de données sert à ................................................................................................................
                - Choisir entre Somme et Moyenne dépend de ................................................................................................................
                - Actualiser une table dynamique permet de ................................................................................................................
          - type: paragraphe
            texte: "Dernière question :"
          - type: paragraphe
            texte: Pourquoi le logiciel ne peut-il pas décider seul s'il faut utiliser une somme ou une moyenne ?
      questions: []
    - id: a19
      titre: 15. Avant de rendre
      contenu:
          - type: paragraphe
            texte: "Vérifiez que votre fichier contient :"
          - type: liste
            elements:
                - la feuille Analyse intacte ;
                - une feuille Table_dynamique ;
                - une ligne par type de culture ;
                - la somme des surfaces ;
                - la moyenne des rendements ;
                - la moyenne des coûts par hectare ;
                - la moyenne des temps de travail par hectare ;
                - vos réponses dans la feuille Bilan.
          - type: paragraphe
            texte: "Vérifiez également que :"
          - type: liste
            elements:
                - P01 est revenue à 7,8 ha ;
                - la table dynamique a été actualisée ;
                - la surface des prairies permanentes est revenue à environ 25,6 ha.
          - type: paragraphe
            texte: "Enregistrez :"
          - type: paragraphe
            texte: BTS2_ACSAGRI_S06_NOM_Prenom.ods
          - type: paragraphe
            texte: Déposez ensuite le fichier dans l'espace indiqué par le professeur.
      questions: []
    - id: a20
      titre: À retenir
      contenu:
          - type: liste
            elements:
                - Une table dynamique permet de regrouper et synthétiser rapidement des données.
                - Le champ de ligne définit les catégories à comparer.
                - Les champs de données définissent les indicateurs à calculer.
                - Le choix entre somme, moyenne ou autre calcul dépend de la question posée.
                - La table dynamique ne modifie pas les données sources.
                - Après une modification des données sources, il peut être nécessaire d'actualiser la table.
                - Une synthèse automatique facilite l'analyse, mais elle ne remplace pas l'interprétation professionnelle.
      questions: []
    - id: a21
      titre: Pour la prochaine séance
      contenu:
          - type: paragraphe
            texte: "Notre tableau de bord sait maintenant :"
          - type: liste
            elements:
                - vérifier les données ;
                - calculer des indicateurs ;
                - déclencher des alertes ;
                - classer des priorités ;
                - produire des synthèses par culture.
          - type: paragraphe
            texte: "Lors de la prochaine séance, nous allons travailler sur une nouvelle question :"
          - type: paragraphe
            texte: Comment présenter et interpréter cette synthèse pour qu'elle soit réellement utile à quelqu'un qui doit prendre une décision ?
          - type: paragraphe
            texte: Nous travaillerons notamment sur la représentation graphique et sur la différence entre constater un résultat et l'interpréter.
      questions: []
    - id: a22
      titre: Sources et ressources
      contenu:
          - type: liste
            elements:
                - Chlorofil – BTSA ACS'AGRI – référentiel et documents d'accompagnement.
                - LibreOffice – Tables dynamiques dans Calc.
                - LibreOffice – Création d'une table dynamique.
          - type: lien
            titre: BTSA ACS'AGRI – référentiel et documents d'accompagnement
            url: https://chlorofil.fr/diplomes/secondaire/btsa/acse/acs-agri-2025
          - type: lien
            titre: Tables dynamiques dans Calc
            url: https://help.libreoffice.org/latest/fr/text/scalc/01/12090000.html
          - type: lien
            titre: Création d'une table dynamique
            url: https://help.libreoffice.org/latest/fr/text/scalc/guide/datapilot_createtable.html
          - type: paragraphe
            texte: Les données utilisées dans cette séance sont fictives et adaptées à des fins pédagogiques.
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
ressources:
    - type: paragraphe
      texte: Réalise les manipulations dans le logiciel demandé. Conserve tes fichiers sur ton espace habituel. Le site enregistre seulement tes réponses écrites, tes résultats, tes formules et tes démarches ; aucun fichier n’est téléversé.
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://chlorofil.fr/diplomes/secondaire/btsa/acse/acs-agri-2025
