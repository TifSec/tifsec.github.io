titre: 'Séance 6 : Relier les tables sans incohérence'
themes:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
problematique: Comment la base empêche-t-elle d’enregistrer des données incohérentes ?
competences_bo:
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
objectifs:
    connaissances:
        - Une relation relie la clé étrangère à la clé primaire.
        - L’intégrité référentielle interdit une saillie pour une jument inexistante, ou la suppression d’une jument qui a des saillies (sauf cascade).
    competences:
        - Créer des relations avec intégrité référentielle.
        - Tester les règles de mise à jour et de suppression.
pourquoi:
    - En S05, les tables existent mais ne sont pas liées.
    - Rien n’empêche encore une saillie pour une jument qui n’existe pas.
activites:
    -   id: a01
        titre: Créer les relations
        consigne: Tu vas créer les relations entre les tables de l’élevage avec l’intégrité référentielle. On attend la liste des relations.
        contenu:
            -   type: etapes
                elements:
                    - 'Outils > Relations : ajoute les tables.'
                    - Glisse id_jument (Jument) sur id_jument (Saillie) ; idem pour les autres liens.
                    - 'Options : mise à jour en cascade, suppression : aucune action.'
                    - Pourquoi « aucune action » à la suppression ? On ne veut pas effacer par erreur tout l’historique d’une jument.
        questions:
            -   id: q01
                type: texte
                enonce: Liste les relations créées.
                aide: Ouvre Outils > Relations et liste chaque lien tracé entre deux tables.
    -   id: a02
        titre: Tester l’intégrité
        transition: Les relations sont créées. Teste-les.
        consigne: Tu vas tester l’intégrité référentielle avec deux saisies interdites. On attend la réaction de la base.
        contenu:
            -   type: etapes
                elements:
                    - Saisis une saillie avec id_jument = 99 (inexistant).
                    - Essaie de supprimer Belle de Mai (qui a des saillies).
                    - Pourquoi ces tests ? Ce sont les deux erreurs les plus fréquentes.
        questions:
            -   id: q01
                type: tableau
                enonce: Que fait la base ?
                colonnes:
                    - Test
                    - Réaction
                lignes:
                    -   - Saillie pour la jument 99
                        - ''
                    -   - Supprimer Belle de Mai
                        - ''
                aide: 'Essaie les deux manipulations. Pour chacune, lis le message : la jument 99 existe-t-elle ? Belle de Mai a-t-elle des saillies ?'
    -   id: a03
        titre: Et dans un tableur ?
        transition: La base se protège. Le tableur le faisait-il ?
        consigne: Tu vas expliquer pourquoi la base est plus fiable que le tableur pour l’historique de reproduction. On attend une explication argumentée.
        contenu:
            -   type: etapes
                elements:
                    - Compare avec le tableur du document 1 de S03.
                    - Pourquoi comparer ? Pour justifier le choix de l’outil devant un employeur.
        questions:
            -   id: q01
                type: texte
                enonce: Explique pourquoi la base est plus fiable que le tableur pour l’historique de reproduction.
                aide: 'Pense à une jument tapée dans 15 lignes de tableur, puis dans une base : combien de fois est-elle saisie, et qui contrôle les liens ?'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une jument vendue quitte l’élevage.
        questions:
            -   id: q01
                type: texte
                enonce: Comment la garder dans l’historique sans la compter dans l’effectif ?
                aide: Une jument vendue a un passé dans l’élevage. Si on la supprime, que perd-on ? Quelle information ajouter à la table à la place ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Les données sont cohérentes. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment la base empêche-t-elle d’enregistrer des données incohérentes ?'
                aide: Dis comment les relations et l’intégrité référentielle bloquent les incohérences.
retenir:
    - Intégrité référentielle.
    - Pas de saillie orpheline, pas de suppression d’historique.
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
