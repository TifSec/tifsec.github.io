titre: 'Séance 10 : La liste du matériel de pansage dans un tableur'
themes:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
problematique: Comment ranger une liste dans un tableur ?
competences_bo:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
objectifs:
    connaissances:
        - 'Un tableur (Calc) est fait de cases appelées cellules : A1, B2…'
        - La lettre est la colonne, le chiffre la ligne.
    competences:
        - Se repérer dans les cellules.
        - Saisir une liste.
pourquoi:
    - Avec Writer, tu écris. Avec Calc, tu ranges et tu comptes.
    - Aujourd’hui, tu fais la liste du matériel de pansage.
activites:
    -   id: a01
        titre: Les cellules
        consigne: Tu vas lire les cellules d’un tableau de matériel de pansage (document 1). On attend le contenu d’une cellule et l’adresse d’une autre.
        contenu:
            -   type: tableau
                titre: Document 1 — Matériel de pansage (fictif)
                colonnes:
                    - ''
                    - A
                    - B
                lignes:
                    -   - '1'
                        - Matériel
                        - Nombre
                    -   - '2'
                        - Étrille
                        - '6'
                    -   - '3'
                        - Brosse dure
                        - '5'
                    -   - '4'
                        - Cure-pied
                        - '8'
            -   type: etapes
                elements:
                    - Regarde le tableau (document 1).
                    - La lettre = colonne ; le chiffre = ligne.
                    - Réponds.
            -   type: paragraphe
                texte: Pourquoi un nom de cellule ? On peut dire exactement où est une valeur.
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 1, que contient la cellule A3 ?
                choix:
                    -   id: a
                        texte: Brosse dure
                    -   id: b
                        texte: Étrille
                    -   id: c
                        texte: '4'
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: qcm
                enonce: Dans quelle cellule est le nombre d’étrilles ?
                choix:
                    -   id: a
                        texte: B2
                    -   id: b
                        texte: A2
                    -   id: c
                        texte: B1
                aide: Élimine d’abord les réponses impossibles.
    -   id: a02
        titre: Saisir la liste
        transition: Tu sais lire les cellules. Saisis la liste.
        consigne: Tu vas saisir la liste du matériel de pansage dans Calc et ajouter deux lignes. On attend le contenu de deux cellules.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Calc ; enregistre materiel.ods dans TIM > Calc.
                    - Recopie le document 1 en commençant en A1.
                    - 'Ajoute : Brosse douce, 5 ; Éponge, 4.'
            -   type: paragraphe
                texte: Pourquoi commencer en A1 ? Le tableau est bien placé et facile à lire.
        questions:
            -   id: q01
                type: texte
                enonce: Écris ce que contiennent A5 et B5.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a03
        titre: Rendre lisible
        transition: La liste est saisie. Rends-la lisible.
        consigne: Tu vas rendre la liste lisible (gras, largeur, bordures). On attend comment tu as élargi la colonne et la touche pour valider.
        contenu:
            -   type: etapes
                elements:
                    - Mets la ligne 1 en gras.
                    - Élargis la colonne A (double-clic sur le trait entre A et B).
                    - Ajoute des bordures.
            -   type: paragraphe
                texte: Pourquoi élargir ? Les mots coupés sont difficiles à lire.
        questions:
            -   id: q01
                type: texte
                enonce: Comment as-tu élargi la colonne A ?
                aide: Une phrase complète qui reprend les mots de la question.
            -   id: q02
                type: qcm
                enonce: Quelle touche valide une cellule et descend ?
                choix:
                    -   id: a
                        texte: Entrée
                    -   id: b
                        texte: Échap
                    -   id: c
                        texte: Espace
                aide: Élimine d’abord les réponses impossibles.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Calc peut trier une liste.
        questions:
            -   id: q01
                type: texte
                enonce: Trie la liste de A à Z. Quel menu ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ta liste est dans Calc. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment ranger une liste dans un tableur ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Cellule = colonne (lettre) + ligne (chiffre).
    - Titres en ligne 1.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
