titre: 'Séance 22 : Lire facilement à l’écran'
themes:
    - 2.2.3 — Situer le numérique dans son environnement social, économique et culturel
problematique: Comment rendre un texte facile à lire pour tout le monde ?
competences_bo:
    - 2.2.3 — Situer le numérique dans son environnement social, économique et culturel
objectifs:
    connaissances:
        - 'Accessibilité : un texte lisible par tous (malvoyants, dyslexiques, daltoniens).'
        - Bonne taille, bon contraste (foncé sur clair), police simple, peu de couleurs.
    competences:
        - Repérer un texte peu lisible.
        - Régler l’affichage pour mieux lire.
pourquoi:
    - 'Certaines personnes ont du mal à lire : vue, dyslexie, couleurs.'
    - Aujourd’hui, tu apprends à rendre un texte lisible pour tous.
activites:
    -   id: a01
        titre: Lisible ou pas ?
        consigne: Tu vas choisir le texte le plus lisible parmi trois exemples. On attend ton choix et le problème du rouge sur vert.
        contenu:
            -   type: etapes
                elements:
                    - Lis les trois exemples.
                    - Lequel se lit le mieux ?
                    - Réponds.
            -   type: paragraphe
                texte: Pourquoi le contraste ? Un texte clair sur fond clair disparaît.
        questions:
            -   id: q01
                type: qcm
                enonce: Quel texte est le plus lisible ?
                choix:
                    -   id: a
                        texte: Noir sur fond blanc, taille 14
                    -   id: b
                        texte: Jaune clair sur fond blanc, taille 9
                    -   id: c
                        texte: Rouge sur fond vert, taille 12
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: texte
                enonce: Pourquoi le rouge sur vert pose-t-il problème ?
                aide: Pense à « car ».
    -   id: a02
        titre: Zoomer
        transition: Tu sais ce qui est lisible. Règle ton écran.
        consigne: Tu vas agrandir puis rétablir une page web avec le clavier. On attend les deux raccourcis.
        contenu:
            -   type: etapes
                elements:
                    - Dans le navigateur, appuie sur Ctrl et + pour agrandir.
                    - Ctrl et 0 pour revenir.
                    - Essaie sur Équipédia.
            -   type: paragraphe
                texte: Pourquoi le zoom ? Chacun peut lire à la bonne taille.
        questions:
            -   id: q01
                type: qcm
                enonce: Quel raccourci agrandit la page ?
                choix:
                    -   id: a
                        texte: Ctrl et +
                    -   id: b
                        texte: Ctrl et S
                    -   id: c
                        texte: Alt et F4
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: qcm
                enonce: Quel raccourci revient à la taille normale ?
                choix:
                    -   id: a
                        texte: Ctrl et 0
                    -   id: b
                        texte: Ctrl et Z
                    -   id: c
                        texte: Échap
                aide: Relis l’exemple expliqué.
    -   id: a03
        titre: Corriger une affiche
        transition: Tu sais régler ton écran. Corrige maintenant un document.
        consigne: Tu vas corriger l’affiche illisible fournie pour qu’elle soit lisible par tous. On attend ce que tu as changé.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre le fichier fourni affiche_illisible.odt.
                    - 'Corrige : texte noir, fond blanc, police simple, taille ≥ 14.'
                    - Enregistre.
            -   type: paragraphe
                texte: Pourquoi corriger ? Une affiche que personne ne lit ne sert à rien.
        questions:
            -   id: q01
                type: texte
                enonce: Qu’as-tu changé pour rendre l’affiche lisible ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le navigateur peut lire le texte à voix haute.
        questions:
            -   id: q01
                type: texte
                enonce: À qui cela sert-il ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton texte est lisible par tous. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment rendre un texte facile à lire pour tout le monde ?'
                aide: Reprends les mots du problème.
retenir:
    - Foncé sur clair, taille ≥ 14, police simple.
    - Ctrl + / Ctrl 0.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
