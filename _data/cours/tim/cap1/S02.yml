titre: 'Séance 2 : Ranger et retrouver ses fichiers'
themes:
    - 2.2.1 — Utiliser un environnement numérique de travail
problematique: Comment ranger ses fichiers pour les retrouver facilement ?
competences_bo:
    - 2.2.1 — Utiliser un environnement numérique de travail
objectifs:
    connaissances:
        - Un dossier contient des fichiers ; on range par thème.
        - Un bon nom de fichier dit ce qu’il contient.
    competences:
        - Créer un dossier.
        - Donner un nom clair à un fichier.
pourquoi:
    - En S01, tu as découvert le site.
    - Aujourd’hui, tu prépares ton espace pour toute l’année.
activites:
    -   id: a01
        titre: Un bon nom
        consigne: Tu vas choisir le meilleur nom pour la fiche d’un poney parmi trois propositions. On attend le bon nom et le sens de « .odt ».
        contenu:
            -   type: etapes
                elements:
                    - Lis les trois noms de fichiers.
                    - Lequel dit ce qu’il contient ?
                    - Réponds.
            -   type: paragraphe
                texte: Pourquoi un bon nom ? Tu retrouves le fichier sans l’ouvrir.
        questions:
            -   id: q01
                type: qcm
                enonce: Quel nom est le meilleur pour la fiche du poney Caramel ?
                choix:
                    -   id: a
                        texte: fiche_caramel.odt
                    -   id: b
                        texte: doc1.odt
                    -   id: c
                        texte: aaaa.odt
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: qcm
                enonce: Que veut dire « .odt » à la fin d’un nom ?
                choix:
                    -   id: a
                        texte: C’est un texte (Writer).
                    -   id: b
                        texte: C’est une photo.
                    -   id: c
                        texte: Rien.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a02
        titre: Créer mes dossiers
        transition: Tu sais choisir un nom. Crée tes dossiers.
        consigne: Tu vas créer ton dossier TIM et deux sous-dossiers dans ton espace. On attend les noms des dossiers créés.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre l’explorateur de fichiers.
                    - Va dans ton espace (Documents).
                    - 'Clic droit > Nouveau > Dossier : « TIM ».'
                    - Dans TIM, crée « Writer » et « Calc ».
            -   type: paragraphe
                texte: 'Pourquoi deux dossiers ? Un pour les textes, un pour les calculs : c’est rangé.'
        questions:
            -   id: q01
                type: texte
                enonce: Écris les noms des dossiers que tu as créés.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a03
        titre: Retrouver un fichier
        transition: Tes dossiers sont prêts. Retrouve un fichier perdu.
        consigne: Tu vas retrouver le fichier poney_caramel avec la recherche et le copier dans ton dossier Writer. On attend où il était et où tu l’as mis.
        contenu:
            -   type: etapes
                elements:
                    - Un fichier « poney_caramel » est caché dans un dossier commun.
                    - Utilise la loupe (recherche) de l’explorateur.
                    - Copie-le dans ton dossier Writer.
            -   type: paragraphe
                texte: Pourquoi la recherche ? Elle trouve un fichier même si on ne sait plus où il est.
        questions:
            -   id: q01
                type: texte
                enonce: Où était le fichier, et où l’as-tu copié ?
                aide: 'Méthode : 1) repère le verbe de la question (cite, explique, décris…) ; 2) cherche la réponse dans la mission ; 3) écris une phrase complète qui reprend les mots de la question.'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Tu as deux fichiers « fiche » et « fiche (1) ».
        questions:
            -   id: q01
                type: texte
                enonce: Comment éviter ça ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tes fichiers sont rangés. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment ranger ses fichiers pour les retrouver facilement ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Un dossier par thème.
    - Un nom clair ; la loupe pour chercher.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
