titre: Ranger et retrouver ses fichiers
theme: TIM — Ranger et retrouver ses fichiers
problematique: Ranger et retrouver ses fichiers
pourquoi: Dans votre document de travail, répondez aux questions suivantes.
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances: []
    competences: []
activites:
    - id: a01
      titre: Pour commencer
      contenu:
          - type: paragraphe
            texte: Un ordinateur peut contenir des milliers de fichiers. Aujourd'hui, nous allons apprendre à les ranger pour pouvoir les retrouver facilement.
      questions: []
    - id: a02
      titre: 1. Préparer le document de la séance
      contenu:
          - type: paragraphe
            texte: "Ouvrez votre dossier :"
          - type: code
            texte: MG1_INFORMATIQUE
          - type: paragraphe
            texte: "Créez à l'intérieur un nouveau dossier nommé :"
          - type: code
            texte: SEANCE_02
          - type: paragraphe
            texte: "Ouvrez LibreOffice Writer puis enregistrez immédiatement votre document dans ce dossier sous le nom :"
          - type: code
            texte: CAPA1_S02_nom_prenom.odt
          - type: paragraphe
            texte: "Écrivez ensuite le titre :"
          - type: paragraphe
            texte: Séance 2 — Ranger et retrouver ses fichiers
      questions: []
    - id: a03
      titre: 2. Fichier ou dossier ?
      contenu:
          - type: paragraphe
            texte: Un dossier sert à ranger et organiser des éléments.
          - type: paragraphe
            texte: "Un fichier contient généralement un travail : texte, image, photographie, vidéo, tableau, PDF..."
          - type: paragraphe
            texte: "Dans votre document, recopiez puis complétez :"
          - type: liste
            elements:
                - Un dossier sert à...
                - Un fichier sert à...
                - Le fichier que je suis en train de modifier s'appelle...
                - Il est enregistré dans le dossier...
      questions: []
    - id: a04
      titre: "3. Mission : préparer votre espace professionnel"
      contenu:
          - type: paragraphe
            texte: Imaginez que vous allez utiliser votre ordinateur pendant toute votre formation et vos périodes de stage.
          - type: paragraphe
            texte: "Dans votre espace personnel, créez un dossier nommé :"
          - type: code
            texte: CAPA1
          - type: paragraphe
            texte: "À l'intérieur, créez les trois dossiers suivants :"
          - type: code
            texte: 01_COURS 02_STAGES 03_DOCUMENTS
          - type: paragraphe
            texte: "Dans le dossier 02_STAGES, créez ensuite :"
          - type: code
            texte: ENTREPRISE PHOTOS DOCUMENTS_STAGE
      questions: []
    - id: a05
      titre: 4. Pourquoi ranger ?
      contenu:
          - type: paragraphe
            texte: Dans votre document de travail, répondez aux questions suivantes.
      questions:
          - id: q01
            type: texte
            enonce: Pourquoi est-il utile de créer plusieurs dossiers ?
            suite: []
          - id: q02
            type: texte
            enonce: Pourquoi les noms comme document1, nouveau document ou truc ne sont-ils pas de bons noms de fichiers ?
            suite: []
          - id: q03
            type: texte
            enonce: Proposez un bon nom pour un compte-rendu de stage réalisé en octobre 2026.
            suite: []
    - id: a06
      titre: 5. Petite manipulation
      contenu:
          - type: paragraphe
            texte: Dans le dossier DOCUMENTS_STAGE, créez un nouveau document Writer.
          - type: paragraphe
            texte: "Enregistrez-le sous le nom :"
          - type: code
            texte: fiche_stage.odt
          - type: paragraphe
            texte: "Écrivez simplement :"
          - type: liste
            elements:
                - "Nom de la structure de stage :"
                - "Commune :"
                - "Activité principale :"
                - "Métier que je souhaite découvrir :"
                - "Une chose que j'aimerais apprendre pendant mon stage :"
          - type: paragraphe
            texte: Si vous ne connaissez pas encore votre lieu de stage, vous pouvez écrire À compléter.
          - type: paragraphe
            texte: Enregistrez puis fermez le fichier.
          - type: paragraphe
            texte: Essayez ensuite de le retrouver et de l'ouvrir à nouveau en passant par vos dossiers.
      questions: []
    - id: a07
      titre: 6. Votre arborescence
      contenu:
          - type: paragraphe
            texte: "Dans votre document de séance, reproduisez l'organisation des dossiers que vous venez de créer :"
          - type: code
            texte: CAPA1 ├── 01_COURS ├── 02_STAGES │ ├── ENTREPRISE │ ├── PHOTOS │ └── DOCUMENTS_STAGE └── 03_DOCUMENTS
          - type: paragraphe
            texte: Pour faire une barre verticale, utilisez le caractère pipe (|) avec la combinaison de touches Alt Gr + 6.
          - type: paragraphe
            texte: Entourez ou mettez en gras le dossier dans lequel se trouve fiche_stage.odt.
      questions: []
    - id: a08
      titre: 7. À retenir
      contenu:
          - type: liste
            elements:
                - Je donne un nom clair à mes fichiers.
                - Je range mes fichiers dans des dossiers adaptés.
                - Je vérifie où j'enregistre mon travail.
                - J'utilise Ctrl + S régulièrement.
                - Je dois être capable de retrouver un fichier après l'avoir fermé.
      questions: []
    - id: a09
      titre: 8. Rendu
      contenu:
          - type: paragraphe
            texte: "Enregistrez une dernière fois votre document :"
          - type: code
            texte: CAPA1_S02_nom_prenom.odt
          - type: paragraphe
            texte: Rendez-le selon la méthode indiquée par le professeur.
          - type: paragraphe
            texte: Le fichier doit être rendu même s'il est incomplet.
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
ressources:
    - type: paragraphe
      texte: Réalise les manipulations dans le logiciel demandé. Conserve tes fichiers sur ton espace habituel. Le site enregistre seulement tes réponses écrites, tes résultats, tes formules et tes démarches ; aucun fichier n’est téléversé.
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://chlorofil.fr/diplomes/secondaire/capa
