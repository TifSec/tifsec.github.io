titre: 'Séance 18 : Remplir un formulaire en ligne sans erreur'
themes:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
problematique: Comment remplir un formulaire en ligne correctement ?
competences_bo:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
objectifs:
    connaissances:
        - Un formulaire a des champs ; l’astérisque (*) indique un champ obligatoire.
        - 'On vérifie avant d’envoyer : une erreur peut bloquer une inscription.'
    competences:
        - Remplir les champs d’un formulaire.
        - Vérifier avant d’envoyer.
pourquoi:
    - Pour un concours, une inscription ou un stage, on remplit souvent un formulaire en ligne.
    - Aujourd’hui, tu t’entraînes sur un formulaire fictif.
activites:
    -   id: a01
        titre: Lire le formulaire
        consigne: Tu vas repérer les champs obligatoires du formulaire d’inscription à un concours (document 1). On attend la liste de ces champs.
        contenu:
            -   type: liste
                elements:
                    - Nom *
                    - Prénom *
                    - Date de naissance * (JJ/MM/AAAA)
                    - Téléphone
                    - Nom du poney *
                    - Commentaire
            -   type: etapes
                elements:
                    - Lis le formulaire d’inscription à un concours (document 1).
                    - Repère les champs obligatoires (*).
                    - Réponds.
                    - Pourquoi l’astérisque ? Sans ces champs, l’inscription est refusée.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, quels sont les champs obligatoires ?
                aide: Dans le document 1, les champs obligatoires ont un petit signe à côté du nom. Lequel ? Recopie ces champs.
    -   id: a02
        titre: Le bon format
        transition: Tu connais les champs. Attention au format.
        consigne: Tu vas corriger une date mal écrite et dire ce qui se passe si un champ obligatoire est vide. On attend la date corrigée et la réponse.
        contenu:
            -   type: etapes
                elements:
                    - Lis les réponses de Sam.
                    - Repère celle qui a un mauvais format.
                    - Corrige.
                    - Pourquoi le format ? Le site refuse une date écrite « 3 mars ».
        questions:
            -   id: q01
                type: texte
                enonce: Sam a écrit sa date de naissance « 3 mars 2010 ». Corrige au bon format.
                aide: 'Le formulaire veut le format jour/mois/année avec des chiffres : deux chiffres pour le jour, deux pour le mois, quatre pour l’année.'
            -   id: q02
                type: qcm
                enonce: Que se passe-t-il si un champ * est vide ?
                choix:
                    -   id: a
                        texte: Le formulaire n’est pas envoyé.
                    -   id: b
                        texte: Rien.
                    -   id: c
                        texte: Le site s’efface.
                aide: Que fait le site si un champ obligatoire est vide quand tu cliques sur « Envoyer » ?
    -   id: a03
        titre: Remplir et vérifier
        transition: Tu connais les pièges. Remplis le formulaire.
        consigne: Tu vas remplir un formulaire fictif avec des informations inventées et le vérifier. On attend ce que tu as vérifié.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre le formulaire fictif (lien du professeur).
                    - Remplis-le avec des informations inventées.
                    - Relis tout avant de cliquer sur « Envoyer ».
                    - Pourquoi relire ? Une faute dans le nom du poney, et il n’est pas inscrit.
        questions:
            -   id: q01
                type: texte
                enonce: Qu’as-tu vérifié avant d’envoyer ?
                aide: 'Écris ce que tu as relu avant d’envoyer : les champs obligatoires, les dates, le téléphone, l’orthographe.'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un formulaire demande ton numéro de carte bancaire pour un jeu gratuit.
        questions:
            -   id: q01
                type: texte
                enonce: Que fais-tu ?
                aide: Un formulaire inconnu demande ton mot de passe ou ta carte bancaire. Que fais-tu ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais remplir un formulaire. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment remplir un formulaire en ligne correctement ?'
                aide: 'Dis les étapes : remplir les champs obligatoires, respecter les formats, relire, se méfier.'
retenir:
    - '* = obligatoire ; date JJ/MM/AAAA.'
    - Relire avant d’envoyer.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
