titre: 'Séance 19 : Une rumeur circule : je vérifie avant de partager'
themes:
    - 2.2.3 — Situer le numérique dans son environnement social, économique et culturel
problematique: Comment vérifier une information avant de la partager ?
competences_bo:
    - 2.2.3 — Situer le numérique dans son environnement social, économique et culturel
objectifs:
    connaissances:
        - Une rumeur est une information non vérifiée qui circule vite.
        - 'On vérifie : qui l’a écrite ? quand ? une source officielle le dit-elle ?'
    competences:
        - Repérer une rumeur.
        - Vérifier sur une source officielle.
pourquoi:
    - Un message circule sur les groupes des cavaliers.
    - Est-il vrai ? Tu enquêtes avant de partager.
activites:
    -   id: a01
        titre: Le message
        consigne: Tu vas chercher l’auteur, la date et la source d’un message qui circule (document 1, inventé). On attend trois réponses.
        contenu:
            -   type: citation
                texte: Document 1 — « ATTENTION !!! Les granulés de la marque X tuent les chevaux. Partagez à tout le monde !!! »
            -   type: paragraphe
                texte: Message inventé.
            -   type: etapes
                elements:
                    - Lis le message (document 1, inventé).
                    - Cherche qui l’a écrit, la date, la source.
                    - Réponds.
                    - Pourquoi ces trois questions ? Sans auteur, date ni source, on ne peut pas croire le message.
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, réponds.
                colonnes:
                    - Question
                    - Réponse
                lignes:
                    -   - Qui l’a écrit ?
                        - ''
                    -   - Quand ?
                        - ''
                    -   - Quelle source ?
                        - ''
                aide: Dans le document 1, cherche un nom d’auteur, une date et une source. Que trouves-tu ?
    -   id: a02
        titre: Vérifier
        transition: Le message n’a ni auteur ni source. Vérifie.
        consigne: Tu vas vérifier le message avec une source officielle (document 2). On attend si le message est vrai et pourquoi.
        contenu:
            -   type: paragraphe
                texte: Document 2 — Les rappels de produits dangereux sont publiés sur le site officiel Rappel Conso. Aucun rappel ne concerne ces granulés.
            -   type: etapes
                elements:
                    - Une vraie alerte sur un aliment serait publiée par l’État ou l’IFCE.
                    - Lis le document 2.
                    - Conclus.
                    - Pourquoi une source officielle ? Elle vérifie avant de publier.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 2, le message est-il vrai ? Justifie.
                aide: 'Lis le document 2 : parle-t-il d’une alerte sur ces granulés ? Compare avec le message.'
    -   id: a03
        titre: Partager ou pas ?
        transition: Tu as vérifié. Il faut décider.
        consigne: Tu vas décider si tu partages le message et dire ce que tu fais à la place. On attend une décision et une action.
        contenu:
            -   type: etapes
                elements:
                    - 'Décide : partages-tu ?'
                    - Que fais-tu à la place ?
                    - Pourquoi ne pas partager ? Une fausse alerte fait peur pour rien et nuit à une entreprise.
        questions:
            -   id: q01
                type: texte
                enonce: Partages-tu le message ? Que fais-tu à la place ?
                aide: Un faux message peut faire peur pour rien. Que fais-tu au lieu de le partager ?
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une rumeur peut aussi viser une personne.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi est-ce grave ?
                aide: Une rumeur sur une personne peut faire du mal. Comment s’appelle une attaque répétée en ligne ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais vérifier avant de partager. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment vérifier une information avant de la partager ?'
                aide: Dis les trois questions à se poser, puis où vérifier.
retenir:
    - Qui ? Quand ? Quelle source ?
    - Vérifier avant de partager.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
