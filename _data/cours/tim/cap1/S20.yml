titre: 'Séance 20 : Ai-je le droit de photographier les chevaux et les clients ?'
themes:
    - 2.2.3 — Situer le numérique dans son environnement social, économique et culturel
problematique: Quand a-t-on le droit de prendre et publier une photo ?
competences_bo:
    - 2.2.3 — Situer le numérique dans son environnement social, économique et culturel
objectifs:
    connaissances:
        - 'Droit à l’image : pour publier la photo d’une personne reconnaissable, il faut son accord (celui des parents pour un enfant).'
        - 'Droit d’auteur : une photo trouvée sur internet appartient à son auteur.'
    competences:
        - Appliquer le droit à l’image.
        - Savoir qu’une photo d’internet n’est pas libre.
pourquoi:
    - En S17, tu as vu les risques des réseaux sociaux.
    - 'À l’écurie, tu prends des photos : as-tu le droit de les publier ?'
activites:
    -   id: a01
        titre: Les personnes
        consigne: Tu vas dire si trois photos de l’écurie peuvent être publiées sans accord. On attend « oui » ou « non » pour chacune.
        contenu:
            -   type: etapes
                elements:
                    - Lis les photos.
                    - Y a-t-il une personne reconnaissable ?
                    - Réponds.
            -   type: paragraphe
                texte: Pourquoi l’accord ? Chacun décide de son image.
        questions:
            -   id: q01
                type: tableau
                enonce: Peut-on publier sans accord ? « oui » ou « non ».
                colonnes:
                    - Photo
                    - Sans accord ?
                lignes:
                    -   - Un cheval seul au pré
                        - ''
                    -   - Une cliente reconnaissable
                        - ''
                    -   - Un enfant sur un poney
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: Le cheval d’un client
        transition: Les personnes ont des droits. Et les chevaux des clients ?
        consigne: Tu vas lire la règle de l’écurie du Moulin sur les photos des chevaux de clients (document 1). On attend ce que fait l’écurie.
        contenu:
            -   type: paragraphe
                texte: 'Document 1 — Règle de l’écurie du Moulin : avant de publier la photo d’un cheval en pension, on demande l’accord de son propriétaire.'
            -   type: etapes
                elements:
                    - Le cheval appartient à un client.
                    - Lis la règle du document 1.
                    - Réponds.
            -   type: paragraphe
                texte: Pourquoi demander au propriétaire ? Par politesse et pour la relation avec le client, l’écurie demande avant de publier.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, que fait l’écurie avant de publier la photo du cheval d’un client ?
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
    -   id: a03
        titre: Une photo d’internet
        transition: Tu connais l’accord des personnes. Et les photos des autres ?
        consigne: Tu vas dire si on peut utiliser une photo trouvée sur internet et où trouver des photos autorisées. On attend deux réponses.
        contenu:
            -   type: etapes
                elements:
                    - Tu trouves une belle photo de cheval sur internet.
                    - Peux-tu la mettre sur l’affiche du club ?
                    - Réponds.
            -   type: paragraphe
                texte: Pourquoi non ? Le photographe est propriétaire de sa photo.
        questions:
            -   id: q01
                type: qcm
                enonce: Peux-tu utiliser n’importe quelle photo trouvée sur internet ?
                choix:
                    -   id: a
                        texte: Non, elle appartient à son auteur.
                    -   id: b
                        texte: Oui, elle est sur internet.
                    -   id: c
                        texte: Oui, si je la recadre.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Où trouver des photos qu’on a le droit d’utiliser ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Les parents d’un enfant refusent la photo.
        questions:
            -   id: q01
                type: texte
                enonce: Que fait le club ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu connais les règles des photos. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quand a-t-on le droit de prendre et publier une photo ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Accord avant de publier une personne.
    - Une photo d’internet appartient à son auteur.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
