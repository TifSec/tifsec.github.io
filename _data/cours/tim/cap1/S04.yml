titre: 'Séance 4 : Numériser un document en PDF'
themes:
    - 2.2.1 — Utiliser un environnement numérique de travail
problematique: Comment transformer un papier en fichier PDF propre ?
competences_bo:
    - 2.2.1 — Utiliser un environnement numérique de travail
objectifs:
    connaissances:
        - Numériser, c’est transformer un papier en fichier (scanner ou téléphone).
        - Le PDF s’ouvre partout et garde la mise en page.
    competences:
        - Numériser avec un téléphone ou un scanner.
        - Enregistrer et nommer un PDF.
pourquoi:
    - En stage, on te demande d’envoyer la copie d’un papier (attestation, carnet).
    - Aujourd’hui, tu numérises un carnet de vaccination fictif.
activites:
    -   id: a01
        titre: Pourquoi numériser ?
        consigne: Tu vas choisir comment transmettre le carnet de vaccination d’un cheval sans donner l’original. On attend la solution et un avantage du PDF.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis la situation : le vétérinaire demande le carnet de vaccination d’un cheval.'
                    - Le papier ne doit pas quitter l’écurie.
                    - Choisis la solution.
            -   type: paragraphe
                texte: Pourquoi un PDF ? Il s’envoie par mail et s’ouvre sur tout appareil.
        questions:
            -   id: q01
                type: qcm
                enonce: Comment envoyer le carnet sans le donner ?
                choix:
                    -   id: a
                        texte: Le numériser en PDF et l’envoyer.
                    -   id: b
                        texte: Le recopier à la main.
                    -   id: c
                        texte: Le lire au téléphone.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Cite un avantage du PDF.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a02
        titre: Numériser
        transition: Tu sais pourquoi numériser. Fais-le.
        consigne: Tu vas numériser le carnet de vaccination fictif en PDF avec un téléphone ou le scanner. On attend l’outil utilisé et si le texte est lisible.
        contenu:
            -   type: etapes
                elements:
                    - Prends le carnet fictif fourni.
                    - Avec l’application de numérisation (ou le scanner), cadre la page à plat, bien éclairée.
                    - Enregistre en PDF.
            -   type: paragraphe
                texte: Pourquoi à plat et éclairé ? Sinon le texte est flou ou penché, illisible.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle application ou quel appareil as-tu utilisé ? Le texte est-il lisible ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a03
        titre: Nommer et ranger
        transition: Le PDF existe. Range-le bien.
        consigne: Tu vas nommer, ranger et vérifier ton PDF. On attend son nom, son dossier et quoi faire s’il est flou.
        contenu:
            -   type: etapes
                elements:
                    - 'Renomme le fichier : vaccins_tango.pdf.'
                    - Range-le dans TIM.
                    - Ouvre-le pour vérifier.
            -   type: paragraphe
                texte: Pourquoi vérifier ? Si une page manque, le vétérinaire ne peut rien faire.
        questions:
            -   id: q01
                type: texte
                enonce: Écris le nom de ton PDF et où il est rangé.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
            -   id: q02
                type: qcm
                enonce: Le PDF est flou. Que fais-tu ?
                choix:
                    -   id: a
                        texte: Je recommence avec plus de lumière.
                    -   id: b
                        texte: Je l’envoie quand même.
                    -   id: c
                        texte: Je le supprime sans rien faire.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un document a 3 pages.
        questions:
            -   id: q01
                type: texte
                enonce: Comment faire un seul PDF de 3 pages ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton document est numérisé. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment transformer un papier en fichier PDF propre ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Numériser à plat, bien éclairé.
    - 'PDF : nommer, ranger, vérifier.'
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
