titre: 'Séance 16 : Écrire un courriel à son maître de stage'
themes:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
problematique: Comment écrire un courriel poli et clair ?
competences_bo:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
objectifs:
    connaissances:
        - 'Un courriel professionnel a : un objet, « Bonjour Madame / Monsieur », un message court, une formule de politesse, une signature.'
        - Le trombone ajoute une pièce jointe.
    competences:
        - Écrire un courriel professionnel.
        - Joindre un fichier.
pourquoi:
    - En stage, tu dois parfois prévenir ton maître de stage (retard, absence, document).
    - Aujourd’hui, tu écris ton premier courriel professionnel.
activites:
    -   id: a01
        titre: Poli ou pas ?
        consigne: Tu vas comparer deux courriels envoyés à un maître de stage (document 1). On attend le bon courriel et deux erreurs de l’autre.
        contenu:
            -   type: liste
                elements:
                    - 'Courriel A — Objet : (vide). « slt jvien pas demain ».'
                    - 'Courriel B — Objet : Absence du 12 novembre. « Bonjour Madame, je serai absent demain, mardi 12 novembre, pour un rendez-vous médical. Je vous prie de m’excuser. Cordialement, Léo Martin, CAPa 1. »'
            -   type: etapes
                elements:
                    - Lis les deux courriels (document 1).
                    - Repère ce qui ne va pas dans le premier.
                    - Choisis le bon.
            -   type: paragraphe
                texte: Pourquoi être poli ? Ton maître de stage est ton futur employeur possible.
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 1, quel courriel faut-il envoyer ?
                choix:
                    -   id: a
                        texte: Le B
                    -   id: b
                        texte: Le A
                    -   id: c
                        texte: Aucun
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Cite deux erreurs du courriel A.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a02
        titre: Écrire le mien
        transition: Tu sais ce qui est poli. Écris le tien.
        consigne: Tu vas écrire le courriel qui envoie ta fiche de pansage à ton maître de stage. On attend un courriel complet.
        contenu:
            -   type: etapes
                elements:
                    - 'Situation : tu envoies ta fiche de pansage (S09) à ton maître de stage.'
                    - 'Écris : objet, « Bonjour… », 2 phrases, « Cordialement », ta signature.'
            -   type: paragraphe
                texte: Pourquoi un objet ? Il dit tout de suite de quoi parle le courriel.
        questions:
            -   id: q01
                type: texte
                enonce: Écris ton courriel complet.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a03
        titre: La pièce jointe
        transition: Le message est écrit. Ajoute le fichier.
        consigne: Tu vas joindre ta fiche en PDF et envoyer le courriel à toi-même pour tester. On attend le bouton utilisé et le nom de la pièce jointe.
        contenu:
            -   type: etapes
                elements:
                    - Dans la messagerie de l’établissement, clique sur le trombone.
                    - Choisis fiche_pansage.pdf.
                    - Envoie le courriel à toi-même pour tester.
            -   type: paragraphe
                texte: Pourquoi tester sur soi ? On vérifie que la pièce jointe arrive bien.
        questions:
            -   id: q01
                type: qcm
                enonce: Quel bouton ajoute une pièce jointe ?
                choix:
                    -   id: a
                        texte: Le trombone
                    -   id: b
                        texte: La poubelle
                    -   id: c
                        texte: L’étoile
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: As-tu reçu le courriel avec la pièce jointe ? Quel est son nom ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Tu as oublié la pièce jointe.
        questions:
            -   id: q01
                type: texte
                enonce: Que fais-tu ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton courriel est envoyé. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment écrire un courriel poli et clair ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Courriel : objet, bonjour, message, cordialement, signature.'
    - Trombone = pièce jointe.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
