titre: 'Séance 29 : Mon bilan de l’année'
themes:
    - 2.2.1 — Utiliser un environnement numérique de travail
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
    - 2.2.3 — Situer le numérique dans son environnement social, économique et culturel
problematique: Qu’ai-je appris en TIM cette année ?
competences_bo:
    - 2.2.1 — Utiliser un environnement numérique de travail
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
    - 2.2.3 — Situer le numérique dans son environnement social, économique et culturel
objectifs:
    connaissances:
        - 'Cette année : ranger, protéger, Writer, Calc, Impress, internet, droits.'
    competences:
        - Faire le bilan de ce que je sais faire.
pourquoi:
    - Depuis S01, tu as beaucoup appris.
    - Aujourd’hui, tu fais le point avant la CAPa 2.
activites:
    -   id: a01
        titre: Je sais faire
        consigne: Tu vas écrire une chose précise que tu sais faire avec Writer, Calc et Impress. On attend une compétence par logiciel.
        contenu:
            -   type: etapes
                elements:
                    - Pour chaque logiciel, écris une chose que tu sais faire.
                    - Sois précis.
            -   type: paragraphe
                texte: Pourquoi précis ? « Calc » ne dit rien ; « faire une SOMME » dit ce que tu sais.
        questions:
            -   id: q01
                type: tableau
                enonce: Écris une chose que tu sais faire.
                colonnes:
                    - Logiciel
                    - Je sais…
                lignes:
                    -   - Writer
                        - ''
                    -   - Calc
                        - ''
                    -   - Impress
                        - ''
                aide: Ligne × colonne.
    -   id: a02
        titre: Ma meilleure réalisation
        transition: Tu sais ce que tu sais faire. Choisis ton meilleur travail.
        consigne: Tu vas choisir ton meilleur travail de TIM de l’année et expliquer pourquoi. On attend le travail et la raison.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre ton dossier TIM.
                    - Choisis ton meilleur travail.
                    - Explique pourquoi.
            -   type: paragraphe
                texte: Pourquoi choisir ? Tu peux le montrer en stage.
        questions:
            -   id: q01
                type: texte
                enonce: Quel est ton meilleur travail et pourquoi ?
                aide: Pense à « car ».
    -   id: a03
        titre: Pour la CAPa 2
        transition: Tu as fait le point. Prépare l’an prochain.
        consigne: Tu vas te fixer un objectif de TIM pour la CAPa 2. On attend un objectif et comment l’atteindre.
        contenu:
            -   type: etapes
                elements:
                    - Choisis une chose à améliorer.
                    - Écris comment.
            -   type: paragraphe
                texte: Pourquoi un objectif ? Tu progresses plus vite.
        questions:
            -   id: q01
                type: texte
                enonce: Que veux-tu améliorer en CAPa 2, et comment ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Pix permet de tester ses compétences.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle compétence veux-tu tester ?
                aide: Attendu ou observé ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton bilan est fait. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : qu’as-tu appris en TIM cette année ?'
                aide: Reprends les mots du problème.
retenir:
    - Writer, Calc, Impress, internet, droits.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
