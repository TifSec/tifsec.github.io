titre: 'Séance 11 : Combien de granulés par jour pour l’écurie ?'
themes:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
problematique: Comment faire calculer le tableur ?
competences_bo:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
objectifs:
    connaissances:
        - Une formule commence par = .
        - =SOMME(B2:B5) additionne ; =MOYENNE(B2:B5) fait la moyenne.
    competences:
        - Écrire une formule SOMME.
        - Écrire une formule MOYENNE.
pourquoi:
    - En S10, tu as saisi une liste.
    - Aujourd’hui, Calc calcule les granulés distribués chaque jour.
activites:
    -   id: a01
        titre: Saisir les rations
        consigne: Tu vas saisir dans Calc les rations de granulés de quatre chevaux (document 1). On attend la bonne façon de taper 2 kg et le contenu d’une cellule.
        contenu:
            -   type: tableau
                titre: Document 1 — Granulés par jour (fictif)
                colonnes:
                    - ''
                    - A
                    - B
                lignes:
                    -   - '1'
                        - Cheval
                        - Granulés par jour (kg)
                    -   - '2'
                        - Tango
                        - '2'
                    -   - '3'
                        - Nuage
                        - '1,5'
                    -   - '4'
                        - Caramel
                        - '1'
                    -   - '5'
                        - Belle
                        - '2,5'
            -   type: etapes
                elements:
                    - Ouvre Calc ; enregistre granules.ods.
                    - Recopie le document 1.
                    - 'Vérifie : un nombre par cellule, sans « kg ».'
                    - Pourquoi sans « kg » ? Calc ne sait pas calculer avec du texte.
        questions:
            -   id: q01
                type: qcm
                enonce: Comment taper 2 kg dans la cellule ?
                choix:
                    -   id: a
                        texte: '2'
                    -   id: b
                        texte: 2 kg
                    -   id: c
                        texte: deux
                aide: Dans une cellule, on tape seulement le nombre, sans l’unité.
            -   id: q02
                type: texte
                enonce: Écris le contenu de B3.
                aide: Clique sur B3 et recopie ce qui est écrit, avec la virgule.
    -   id: a02
        titre: La somme
        transition: Les rations sont saisies. Fais calculer le total.
        consigne: Tu vas calculer le total de granulés distribués par jour avec SOMME. On attend le total et le signe qui commence une formule.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : 3, 5 et 2 dans B2, B3, B4.'
                    - On clique en B5 et on tape =SOMME(B2:B4) puis Entrée.
                    - Calc affiche 10 (3 + 5 + 2).
                    - 'À toi : clique en B6.'
                    - Tape =SOMME(B2:B5) puis Entrée.
                    - Écris « Total » en A6.
                    - Pourquoi SOMME ? Calc additionne sans erreur.
        questions:
            -   id: q01
                type: nombre
                enonce: Quel total affiche B6 ?
                unite: kg
                aide: 'Clique sur B6 et lis le nombre affiché. Écris l’unité : kg.'
            -   id: q02
                type: qcm
                enonce: Par quoi commence toujours une formule ?
                choix:
                    -   id: a
                        texte: '='
                    -   id: b
                        texte: +
                    -   id: c
                        texte: SOMME
                aide: 'Regarde le début de toutes tes formules : quel signe est toujours en premier ?'
    -   id: a03
        titre: La moyenne
        transition: Tu as le total. Calcule la moyenne.
        consigne: Tu vas calculer la moyenne des rations avec MOYENNE, puis changer une valeur. On attend la moyenne et ce qui se passe.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : 3, 5 et 2 dans B2, B3, B4.'
                    - =MOYENNE(B2:B4) → 10 ÷ 3 ≈ 3,33.
                    - 'Si on change 2 en 5, Calc recalcule tout seul : la somme devient 13.'
                    - 'À toi : en B7, tape =MOYENNE(B2:B5).'
                    - Écris « Moyenne » en A7.
                    - 'Change la ration de Caramel à 2 : regarde B6 et B7.'
                    - Pourquoi tester ? Tu vois que Calc recalcule tout seul.
        questions:
            -   id: q01
                type: nombre
                enonce: Quelle moyenne affiche B7 (avant de changer Caramel) ?
                unite: kg
                aide: Clique sur B7 et lis le nombre, avant de changer la ration de Caramel.
            -   id: q02
                type: texte
                enonce: Que se passe-t-il quand tu changes la ration de Caramel ?
                aide: Change la ration de Caramel, puis regarde B6 et B7. Que se passe-t-il ?
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Il faut les granulés pour 7 jours.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle formule écris-tu en B8 ?
                aide: Une semaine, c’est 7 jours. Multiplie le total par jour (B6) par 7.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Calc calcule pour toi. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment faire calculer le tableur ?'
                aide: Dis par quel signe commence une formule, et quelles fonctions donnent le total et la moyenne.
retenir:
    - = au début ; =SOMME(…) ; =MOYENNE(…).
    - Nombres sans unité dans les cellules.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
