titre: 'Séance 13 : Un graphique pour voir la consommation'
themes:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
problematique: Comment faire un graphique avec le tableur ?
competences_bo:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
objectifs:
    connaissances:
        - Un graphique en colonnes compare des quantités.
        - Un bon graphique a un titre et des axes avec unités.
    competences:
        - Créer un graphique en colonnes.
        - Ajouter un titre.
pourquoi:
    - En S11, tu as calculé les granulés.
    - Un graphique montre d’un coup d’œil quel cheval mange le plus.
activites:
    -   id: a01
        titre: Créer le graphique
        consigne: Tu vas créer un graphique en colonnes avec les rations de granulés de S11. On attend le cheval qui mange le plus et le moins.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre granules.ods (S11).
                    - Sélectionne A1:B5.
                    - Insertion > Diagramme > Colonne > Terminer.
            -   type: paragraphe
                texte: Pourquoi sélectionner d’abord ? Calc doit savoir quelles données dessiner.
        questions:
            -   id: q01
                type: qcm
                enonce: Quel cheval a la colonne la plus haute ?
                choix:
                    -   id: a
                        texte: Belle
                    -   id: b
                        texte: Caramel
                    -   id: c
                        texte: Nuage
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: qcm
                enonce: Quel cheval a la colonne la plus basse ?
                choix:
                    -   id: a
                        texte: Caramel
                    -   id: b
                        texte: Tango
                    -   id: c
                        texte: Belle
                aide: Élimine d’abord les réponses impossibles.
    -   id: a02
        titre: Titre et axes
        transition: Le graphique existe. Complète-le.
        consigne: Tu vas ajouter un titre et l’unité de l’axe vertical à ton graphique. On attend les deux textes.
        contenu:
            -   type: etapes
                elements:
                    - Double-clic sur le graphique.
                    - 'Insertion > Titres : titre « Granulés par jour », axe Y « kg ».'
                    - Clic en dehors pour terminer.
            -   type: paragraphe
                texte: Pourquoi « kg » ? Sans unité, on ne sait pas ce que veulent dire les nombres.
        questions:
            -   id: q01
                type: texte
                enonce: Écris le titre et le nom de l’axe vertical.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a03
        titre: Lire le graphique
        transition: Le graphique est complet. Que dit-il ?
        consigne: Tu vas écrire une phrase qui compare deux chevaux d’après ton graphique. On attend une comparaison chiffrée.
        contenu:
            -   type: etapes
                elements:
                    - Regarde ton graphique.
                    - Compare Tango et Belle.
                    - Écris une phrase.
            -   type: paragraphe
                texte: Pourquoi une phrase ? Un graphique sert à dire quelque chose.
        questions:
            -   id: q01
                type: texte
                enonce: Écris une phrase qui compare Tango et Belle d’après le graphique.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: On peut changer la couleur des colonnes.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi garder une seule couleur ici ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton graphique est fait. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment faire un graphique avec le tableur ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Sélectionner → Insertion > Diagramme.
    - Titre et unité.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
