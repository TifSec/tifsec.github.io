titre: 'Séance 5 : QR code, puce, Bluetooth : à quoi ça sert à l’écurie ?'
themes:
    - 2.2.1 — Utiliser un environnement numérique de travail
problematique: À quoi servent les technologies sans fil et les codes dans une écurie ?
competences_bo:
    - 2.2.1 — Utiliser un environnement numérique de travail
objectifs:
    connaissances:
        - Un QR code ouvre une information avec un téléphone.
        - La puce (transpondeur) identifie un cheval ; un lecteur la lit sans contact.
        - Le Bluetooth relie des appareils proches (balance, enceinte).
    competences:
        - Associer une technologie à son usage.
        - Lire un QR code.
pourquoi:
    - En S04, tu as utilisé ton téléphone pour numériser.
    - 'Dans une écurie, d’autres technologies existent : lesquelles, et à quoi servent-elles ?'
activites:
    -   id: a01
        titre: Associer
        consigne: Tu vas associer trois technologies (puce, QR code, Bluetooth) à leur usage à l’écurie. On attend un usage par technologie.
        contenu:
            -   type: liste
                elements:
                    - 'Usages : identifier le cheval ; ouvrir la fiche du cheval sur le téléphone ; relier une balance au téléphone.'
            -   type: etapes
                elements:
                    - Lis les trois technologies.
                    - Lis les trois usages.
                    - Associe.
                    - Pourquoi les connaître ? Tu les rencontreras en stage.
        questions:
            -   id: q01
                type: tableau
                enonce: Associe chaque technologie à son usage.
                colonnes:
                    - Technologie
                    - Usage
                lignes:
                    -   - Puce (transpondeur)
                        - ''
                    -   - QR code sur un box
                        - ''
                    -   - Bluetooth
                        - ''
                aide: La puce est dans le cheval. Le QR code est collé sur le box. Le Bluetooth relie deux appareils sans fil. Que fait chacun ?
    -   id: a02
        titre: Lire un QR code
        transition: Tu sais à quoi servent ces technologies. Essaie le QR code.
        consigne: Tu vas lire le QR code affiché par le professeur avec un téléphone. On attend la page ouverte et une information lue.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre l’appareil photo du téléphone.
                    - Vise le QR code affiché par le professeur.
                    - Ouvre le lien et lis la page.
                    - Pourquoi un QR code ? Pas besoin de taper une longue adresse.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle page s’est ouverte, et que dit-elle ?
                aide: Écris le titre de la page qui s’est ouverte et une information que tu as lue.
    -   id: a03
        titre: La puce du cheval
        transition: Le QR code s’ouvre avec un téléphone. La puce, avec un lecteur.
        consigne: Tu vas lire un extrait d’Équipédia sur la puce d’identification du cheval (document 1). On attend où elle est posée et à quoi elle sert.
        contenu:
            -   type: citation
                texte: 'Document 1 — Extrait adapté d’Équipédia : « Le transpondeur est posé dans l’encolure, côté gauche. Il porte un numéro unique, lu avec un lecteur, qui permet de vérifier que l’équidé correspond à son document d’identification. »'
            -   type: lien
                titre: IFCE — Équipédia (fiches techniques sur le cheval)
                url: https://equipedia.ifce.fr/
            -   type: etapes
                elements:
                    - Lis le document 1 sur l’identification.
                    - Réponds aux questions.
                    - Pourquoi une puce ? Elle prouve que le cheval correspond à ses papiers.
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 1, où est posée la puce ?
                choix:
                    -   id: a
                        texte: Dans l’encolure, côté gauche.
                    -   id: b
                        texte: Dans le sabot.
                    -   id: c
                        texte: Sur le licol.
                aide: Dans le document 1, cherche la phrase qui dit où on pose la puce.
            -   id: q02
                type: texte
                enonce: D’après le document 1, à quoi sert la puce lors d’un contrôle ?
                aide: Dans le document 1, cherche ce qu’on vérifie quand on lit la puce avec le lecteur.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un QR code peut aussi mener vers un site piégé.
        questions:
            -   id: q01
                type: texte
                enonce: Que vérifies-tu avant d’ouvrir le lien ?
                aide: Avant d’ouvrir un lien, le téléphone affiche son adresse. Que regardes-tu ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu connais ces technologies. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : à quoi servent les technologies sans fil et les codes dans une écurie ?'
                aide: 'Dis à quoi sert chaque technologie : la puce, le QR code, le Bluetooth.'
retenir:
    - Puce = identité du cheval.
    - QR code = lien ; Bluetooth = appareils proches.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
