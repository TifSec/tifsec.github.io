titre: 'Séance 7 : Le planning des soins de la semaine'
themes:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
problematique: Comment faire un tableau dans un traitement de texte ?
competences_bo:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
objectifs:
    connaissances:
        - Un tableau a des lignes et des colonnes.
        - On lit une case en croisant une ligne et une colonne.
    competences:
        - Insérer un tableau.
        - Remplir et mettre en forme un tableau.
pourquoi:
    - En S06, tu as écrit la fiche de Tango.
    - Aujourd’hui, tu fais le planning des soins de la semaine.
activites:
    -   id: a01
        titre: Lire un tableau
        consigne: Tu vas lire le planning des soins de deux chevaux (document 1). On attend deux soins trouvés dans le tableau.
        contenu:
            -   type: tableau
                titre: Document 1 — Planning des soins (fictif)
                colonnes:
                    - Jour
                    - Tango
                    - Nuage
                lignes:
                    -   - Lundi
                        - Pansage
                        - Pansage
                    -   - Mercredi
                        - Parage
                        - Douche des jambes
                    -   - Vendredi
                        - Pansage
                        - Graisser les sabots
            -   type: etapes
                elements:
                    - Lis le planning (document 1).
                    - Croise la ligne du jour et la colonne du cheval.
                    - Réponds.
            -   type: paragraphe
                texte: Pourquoi croiser ? Chaque case donne un soin pour un jour et un cheval.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, quel soin fait-on à Tango le mercredi ?
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
            -   id: q02
                type: texte
                enonce: D’après le document 1, quel jour graisse-t-on les sabots de Nuage ?
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
    -   id: a02
        titre: Créer le tableau
        transition: Tu sais lire un tableau. Fais le tien.
        consigne: Tu vas créer dans Writer le tableau du planning des soins. On attend ses dimensions et la touche pour changer de case.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Writer ; enregistre planning_soins.odt dans TIM > Writer.
                    - 'Tableau > Insérer un tableau : 3 colonnes, 4 lignes.'
                    - Recopie le document 1.
            -   type: paragraphe
                texte: Pourquoi 4 lignes ? Une ligne de titres et une par jour.
        questions:
            -   id: q01
                type: texte
                enonce: Combien de colonnes et de lignes as-tu mis ?
                aide: Une phrase complète qui reprend les mots de la question.
            -   id: q02
                type: qcm
                enonce: Comment passer à la case suivante ?
                choix:
                    -   id: a
                        texte: Touche Tab
                    -   id: b
                        texte: Touche Échap
                    -   id: c
                        texte: Touche Suppr
                aide: Élimine d’abord les réponses impossibles.
    -   id: a03
        titre: Mettre en forme
        transition: Le tableau est rempli. Rends-le lisible.
        consigne: Tu vas mettre en forme le planning et ajouter une ligne pour le dimanche. On attend comment tu as ajouté la ligne.
        contenu:
            -   type: etapes
                elements:
                    - Mets la première ligne en gras.
                    - Colore la première ligne en gris clair.
                    - 'Ajoute une ligne « Dimanche : repos ».'
            -   type: paragraphe
                texte: Pourquoi un fond clair ? Le texte noir reste lisible.
        questions:
            -   id: q01
                type: texte
                enonce: Comment as-tu ajouté une ligne au tableau ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: On peut imprimer le planning pour la sellerie.
        questions:
            -   id: q01
                type: texte
                enonce: Quel format choisir pour qu’il s’imprime bien partout ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton planning est prêt. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment faire un tableau dans un traitement de texte ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Tableau : lignes et colonnes ; Tab pour avancer.'
    - Ligne de titres en gras.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
