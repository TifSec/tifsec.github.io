titre: 'Séance 3 : Se connecter et protéger son mot de passe'
themes:
    - 2.2.1 — Utiliser un environnement numérique de travail
    - 2.2.3 — Situer le numérique dans son environnement social, économique et culturel
problematique: Comment se connecter et protéger son compte ?
competences_bo:
    - 2.2.1 — Utiliser un environnement numérique de travail
    - 2.2.3 — Situer le numérique dans son environnement social, économique et culturel
objectifs:
    connaissances:
        - Un identifiant dit qui tu es ; le mot de passe le prouve.
        - On se déconnecte toujours sur un ordinateur partagé.
    competences:
        - Se connecter et se déconnecter.
        - Reconnaître un mot de passe solide.
pourquoi:
    - En S02, tu as rangé tes fichiers.
    - 'Ils sont protégés par ton compte : il faut bien le protéger.'
activites:
    -   id: a01
        titre: Identifiant et mot de passe
        consigne: Tu vas apprendre la différence entre identifiant et mot de passe. On attend qui peut connaître ton mot de passe et la bonne réaction.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : identifiant « lea.martin », mot de passe secret.'
                    - Qui peut connaître l’identifiant ? le mot de passe ?
                    - Réponds.
            -   type: paragraphe
                texte: Pourquoi deux éléments ? L’identifiant peut être connu ; le mot de passe, jamais.
        questions:
            -   id: q01
                type: qcm
                enonce: Qui peut connaître ton mot de passe ?
                choix:
                    -   id: a
                        texte: Personne, à part moi.
                    -   id: b
                        texte: Mes amis.
                    -   id: c
                        texte: Toute la classe.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: qcm
                enonce: Un ami te demande ton mot de passe. Que fais-tu ?
                choix:
                    -   id: a
                        texte: Je refuse.
                    -   id: b
                        texte: Je lui donne.
                    -   id: c
                        texte: Je l’écris au tableau.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a02
        titre: Solide ou faible ?
        transition: Tu sais ce qui est secret. Est-il solide ?
        consigne: Tu vas dire si trois mots de passe sont solides ou faibles, avec la règle donnée. On attend une réponse par mot de passe.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis la règle : long, mélangé, pas un prénom ni une date.'
                    - Regarde chaque mot de passe.
                    - Écris « solide » ou « faible ».
            -   type: paragraphe
                texte: Pourquoi « long » ? Un mot de passe court se devine vite.
        questions:
            -   id: q01
                type: tableau
                enonce: Écris « solide » ou « faible ».
                colonnes:
                    - Mot de passe
                    - Solide ou faible ?
                lignes:
                    -   - caramel
                        - ''
                    -   - '1234'
                        - ''
                    -   - Mon-Poney-Mange-3-Pommes!
                        - ''
                aide: 'Méthode : remplis une case à la fois. Pour chaque ligne, lis le début de la ligne, puis le titre de la colonne : la case est à leur croisement. Utilise les mots exacts des documents.'
    -   id: a03
        titre: Se déconnecter
        transition: Ton mot de passe est solide. Quitte bien ton poste.
        consigne: Tu vas verrouiller l’ordinateur avec le raccourci Windows + L. On attend le raccourci et pourquoi se déconnecter.
        contenu:
            -   type: etapes
                elements:
                    - Sur un ordinateur partagé (écurie, CDI), on se déconnecte toujours.
                    - 'Raccourci pour verrouiller : touche Windows + L.'
                    - Essaie-le, puis reconnecte-toi.
            -   type: paragraphe
                texte: Pourquoi se déconnecter ? Sinon, le suivant utilise ton compte.
        questions:
            -   id: q01
                type: qcm
                enonce: Quel raccourci verrouille l’ordinateur ?
                choix:
                    -   id: a
                        texte: Windows + L
                    -   id: b
                        texte: Ctrl + C
                    -   id: c
                        texte: Alt + F4
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Pourquoi faut-il se déconnecter sur l’ordinateur de l’écurie ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Fabrique un mot de passe avec une phrase (pas ton vrai !).
        questions:
            -   id: q01
                type: texte
                enonce: 'Exemple : « Mon cheval Tango a 9 ans ! » → ?'
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton compte est protégé. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment se connecter et protéger son compte ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Mot de passe : secret, long, mélangé.'
    - Windows + L pour verrouiller.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
