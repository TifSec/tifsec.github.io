titre: 'Séance 24 : Mon diaporama de stage (Impress n° 1)'
themes:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
problematique: Comment faire un diaporama simple pour présenter son stage ?
competences_bo:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
objectifs:
    connaissances:
        - Impress (ou PowerPoint) sert à faire des diapositives.
        - Une diapositive = un titre + une photo + quelques mots.
    competences:
        - Créer des diapositives.
        - Insérer une photo.
pourquoi:
    - En S23, tes photos sont prêtes.
    - Aujourd’hui, tu fais 4 diapositives sur ton stage.
activites:
    -   id: a01
        titre: Le plan
        consigne: Tu vas écrire le titre des quatre diapositives de ta présentation de stage. On attend les quatre titres.
        contenu:
            -   type: etapes
                elements:
                    - Écris un titre pour chaque diapositive.
                    - '1 : mon lieu de stage ; 2 : les chevaux ; 3 : mon travail ; 4 : ce que j’ai aimé.'
            -   type: paragraphe
                texte: Pourquoi un plan ? Tu sais quoi mettre sur chaque diapositive.
        questions:
            -   id: q01
                type: tableau
                enonce: Écris le titre de tes 4 diapositives.
                colonnes:
                    - Diapositive
                    - Titre
                lignes:
                    -   - '1'
                        - ''
                    -   - '2'
                        - ''
                    -   - '3'
                        - ''
                    -   - '4'
                        - ''
                aide: Ligne × colonne.
    -   id: a02
        titre: Créer
        transition: Le plan est prêt. Crée les diapositives.
        consigne: Tu vas créer dans Impress les quatre diapositives de ton plan. On attend l’extension du fichier et le nombre de diapositives.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Impress ; enregistre stage.odp dans TIM.
                    - 'Diapositive 1 : titre et ton nom.'
                    - Diapositive > Nouvelle diapositive pour les 3 autres.
                    - Tape les titres.
            -   type: paragraphe
                texte: Pourquoi enregistrer au début ? Rien n’est perdu.
        questions:
            -   id: q01
                type: qcm
                enonce: Quelle extension a un fichier Impress ?
                choix:
                    -   id: a
                        texte: .odp
                    -   id: b
                        texte: .odt
                    -   id: c
                        texte: .ods
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: texte
                enonce: Combien de diapositives as-tu créées ?
                aide: Repère le verbe de la question.
    -   id: a03
        titre: Photos et mots
        transition: Les diapositives existent. Remplis-les.
        consigne: Tu vas ajouter une photo et des mots-clés sur chaque diapositive, puis lancer le diaporama. On attend une diapositive décrite et la touche de lancement.
        contenu:
            -   type: etapes
                elements:
                    - 'Sur chaque diapositive : Insertion > Image (photo de S23).'
                    - Ajoute 2 ou 3 mots-clés.
                    - Lance avec F5.
            -   type: paragraphe
                texte: Pourquoi peu de mots ? C’est toi qui parles, l’écran montre.
        questions:
            -   id: q01
                type: texte
                enonce: 'Décris ta diapositive « mon travail » : photo et mots-clés.'
                aide: Combien d’éléments sont demandés ?
            -   id: q02
                type: qcm
                enonce: Quelle touche lance le diaporama ?
                choix:
                    -   id: a
                        texte: F5
                    -   id: b
                        texte: Échap
                    -   id: c
                        texte: Entrée
                aide: Relis l’exemple expliqué.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: On peut changer l’ordre des diapositives.
        questions:
            -   id: q01
                type: texte
                enonce: Comment ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton diaporama est commencé. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment faire un diaporama simple pour présenter son stage ?'
                aide: Reprends les mots du problème.
retenir:
    - 'Diapositive : titre + photo + mots-clés.'
    - F5 lance.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
