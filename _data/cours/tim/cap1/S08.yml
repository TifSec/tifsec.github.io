titre: 'Séance 8 : Une affiche des règles de sécurité à l’écurie'
themes:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
problematique: Comment faire une affiche claire avec du texte et une image ?
competences_bo:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
objectifs:
    connaissances:
        - 'Une affiche se lit de loin : titre très gros, peu de texte, une image.'
        - L’en-tête et le pied de page se répètent en haut et en bas.
    competences:
        - Insérer une image.
        - Utiliser l’en-tête et le pied de page.
pourquoi:
    - En S07, tu as fait un tableau.
    - Le gérant veut une affiche des règles de sécurité pour l’écurie.
activites:
    -   id: a01
        titre: Les règles
        consigne: Tu vas choisir dans le document 1 les quatre règles de sécurité les plus importantes pour l’affiche. On attend quatre règles courtes.
        contenu:
            -   type: liste
                elements:
                    - Porter des chaussures fermées.
                    - Ne pas passer derrière un cheval sans lui parler.
                    - Interdiction de fumer (paille, foin).
                    - Ranger fourches et brouettes.
                    - Attacher le cheval avec un nœud de sécurité.
                    - Ne pas courir dans l’écurie.
            -   type: etapes
                elements:
                    - Lis les règles de sécurité (document 1).
                    - Choisis les 4 plus importantes.
                    - Écris-les en phrases courtes.
            -   type: paragraphe
                texte: Pourquoi 4 ? Sur une affiche, trop de texte n’est pas lu.
        questions:
            -   id: q01
                type: texte
                enonce: Écris les 4 règles choisies, en phrases courtes.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a02
        titre: Faire l’affiche
        transition: Tu as les règles. Fais l’affiche.
        consigne: Tu vas créer l’affiche avec le titre, la liste des règles et une image. On attend les tailles utilisées et le menu de l’image.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Writer ; enregistre affiche_securite.odt.
                    - 'Titre « Sécurité à l’écurie » : taille 36, gras, centré.'
                    - Tape les 4 règles en liste à puces, taille 20.
                    - Insère une image libre fournie (Insertion > Image).
            -   type: paragraphe
                texte: Pourquoi une liste à puces ? Chaque règle se voit d’un coup d’œil.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle taille as-tu mise pour le titre et pour les règles ?
                aide: Une phrase complète qui reprend les mots de la question.
            -   id: q02
                type: qcm
                enonce: Quel menu insère une image ?
                choix:
                    -   id: a
                        texte: Insertion > Image
                    -   id: b
                        texte: Fichier > Enregistrer
                    -   id: c
                        texte: Format > Gras
                aide: Élimine d’abord les réponses impossibles.
    -   id: a03
        titre: En-tête et pied de page
        transition: L’affiche est presque finie. Ajoute le nom de l’écurie.
        consigne: Tu vas ajouter un en-tête et un pied de page à l’affiche, puis l’exporter en PDF. On attend ce que tu as écrit dedans.
        contenu:
            -   type: etapes
                elements:
                    - 'Insertion > En-tête et pied de page > En-tête : écris le nom de l’écurie.'
                    - 'Pied de page : « Merci de respecter ces règles ».'
                    - Exporte en PDF.
            -   type: paragraphe
                texte: Pourquoi un en-tête ? Le nom de l’écurie apparaît en haut, comme sur un vrai document.
        questions:
            -   id: q01
                type: texte
                enonce: Qu’as-tu écrit dans l’en-tête et dans le pied de page ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: L’affiche sera vue de loin.
        questions:
            -   id: q01
                type: texte
                enonce: 'Teste : recule de 2 mètres. Lis-tu les règles ?'
                aide: 'Méthode : 1) écris ce que tu fais (l’action) ; 2) écris ce qui doit se passer (résultat attendu) ; 3) compare avec ce qui se passe vraiment (résultat observé). Ne change qu’une seule chose à la fois.'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton affiche est prête. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment faire une affiche claire avec du texte et une image ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Affiche : gros titre, liste courte, image.'
    - En-tête / pied de page.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
