titre: Faire connaissance et prendre ses repères
theme: TIM — Faire connaissance et prendre ses repères
problematique: Faire connaissance et prendre ses repères
pourquoi: Les objectifs et le lien avec les situations concrètes sont présentés au début du cours ci-dessous.
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances: []
    competences: []
activites:
    - id: a01
      titre: Pour commencer
      contenu:
          - type: paragraphe
            texte: Cette première séance permet de découvrir le fonctionnement du cours d'informatique, de prendre ses repères sur l'ordinateur et de faire quelques premières manipulations.
      questions: []
    - id: a02
      titre: 1. Bienvenue en informatique
      contenu:
          - type: paragraphe
            texte: Cette année, nous allons apprendre à utiliser l'ordinateur et les outils numériques dans des situations utiles pour votre formation, vos stages, votre futur métier et votre vie quotidienne.
          - type: paragraphe
            texte: Vous allez surtout pratiquer. Vous aurez le droit d'essayer, de vous tromper, de recommencer et de demander de l'aide.
          - type: paragraphe
            texte: Le but n'est pas de tout savoir immédiatement, mais de devenir progressivement plus autonome.
      questions: []
    - id: a03
      titre: 2. Notre fonctionnement
      contenu:
          - type: liste
            elements:
                - Au début de chaque séance, vous créez ou ouvrez votre document de travail.
                - Ce document sert de cours, de brouillon, de zone d'essai et de feuille de réponses.
                - Vous l'enregistrez régulièrement pendant la séance.
                - Vous rendez votre fichier à la fin du cours, même s'il n'est pas terminé.
                - Vous pouvez demander de l'aide, mais vous devez d'abord essayer.
      questions: []
    - id: a04
      titre: 3. Créer votre espace de travail
      contenu:
          - type: paragraphe
            texte: Aller dans le dossier "Documents"
          - type: paragraphe
            texte: 'Créer un nouveau dossier nommé : "Nom_prénom" (avec votre nom et votre prénom)'
          - type: paragraphe
            texte: "Entrer dans ce dossier puis créez un dossier nommé :"
          - type: code
            texte: MG1_INFORMATIQUE
          - type: paragraphe
            texte: "Dans ce dossier, créez un nouveau dossier :"
          - type: code
            texte: SEANCE_01
          - type: paragraphe
            texte: Ouvrez ensuite LibreOffice Writer et créez un nouveau document.
          - type: paragraphe
            texte: "Enregistrez-le immédiatement dans le dossier SEANCE_01 avec le nom :"
          - type: code
            texte: CAPA1_S01_nom_prenom.odt
      questions: []
    - id: a05
      titre: 4. Faisons connaissance
      contenu:
          - type: paragraphe
            texte: "Dans votre document, écrivez le titre :"
          - type: paragraphe
            texte: Ma fiche de présentation
          - type: paragraphe
            texte: Puis répondez tranquillement aux questions suivantes avec quelques mots ou quelques phrases.
      questions:
          - id: q01
            type: texte
            enonce: Quel est votre prénom ?
            suite: []
          - id: q02
            type: texte
            enonce: Pourquoi avez-vous choisi cette formation ?
            suite: []
          - id: q03
            type: texte
            enonce: Quel métier ou domaine professionnel vous intéresse aujourd'hui ?
            suite: []
          - id: q04
            type: texte
            enonce: Avez-vous déjà effectué un stage ou travaillé dans ce domaine ?
            suite: []
          - id: q05
            type: texte
            enonce: Utilisez-vous souvent un ordinateur ?
            suite: []
          - id: q06
            type: texte
            enonce: Qu'est-ce que vous savez déjà faire sur un ordinateur ?
            suite: []
          - id: q07
            type: texte
            enonce: Qu'est-ce qui vous semble difficile avec un ordinateur ?
            suite: []
          - id: q08
            type: texte
            enonce: Qu'aimeriez-vous apprendre cette année ?
            suite:
                - type: paragraphe
                  texte: Il n'y a pas de mauvaise réponse. Cette fiche sert simplement au professeur à mieux vous connaître et à adapter les prochaines séances.
    - id: a06
      titre: 5. Première petite mission
      contenu:
          - type: paragraphe
            texte: Améliorez maintenant légèrement votre document.
          - type: liste
            elements:
                - Agrandissez le titre.
                - Mettez le titre en gras.
                - Choisissez une présentation claire pour vos réponses.
                - Mettez au moins un mot important en gras.
          - type: paragraphe
            texte: "Pendant votre travail, pensez à utiliser régulièrement :"
          - type: liste
            elements:
                - Ctrl + S pour enregistrer ;
                - Ctrl + Z pour annuler la dernière action en cas d'erreur.
      questions: []
    - id: a07
      titre: 6. Avant de terminer
      contenu:
          - type: paragraphe
            texte: "Vérifiez que votre fichier porte bien le nom :"
          - type: code
            texte: CAPA1_S01_nom_prenom.odt
          - type: paragraphe
            texte: Enregistrez une dernière fois votre travail puis rendez votre fichier selon la méthode indiquée par le professeur.
          - type: paragraphe
            texte: Le fichier doit être rendu même s'il n'est pas terminé.
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
ressources:
    - type: paragraphe
      texte: Réalise les manipulations dans le logiciel demandé. Conserve tes fichiers sur ton espace habituel. Le site enregistre seulement tes réponses écrites, tes résultats, tes formules et tes démarches ; aucun fichier n’est téléversé.
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://chlorofil.fr/diplomes/secondaire/capa
