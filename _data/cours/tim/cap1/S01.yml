titre: 'Séance 1 : Faire connaissance et prendre ses repères'
themes:
    - 2.2.1 — Utiliser un environnement numérique de travail
problematique: Comment fonctionne le cours de TIM, et comment travailler sur le site ?
competences_bo:
    - 2.2.1 — Utiliser un environnement numérique de travail
objectifs:
    connaissances:
        - Le TIM apprend à utiliser l’ordinateur, internet et les logiciels utiles au métier de palefrenier-soigneur.
        - 'Chaque séance du site : « Ta mission », les étapes, puis les questions.'
    competences:
        - Se repérer dans une séance du site.
        - Demander de l’aide avec le coup de pouce.
pourquoi:
    - 'Tu commences le CAPa : au travail, tu utiliseras un téléphone, une tablette ou un ordinateur.'
    - Aujourd’hui, tu découvres le cours et le site.
activites:
    -   id: a01
        titre: Lire une séance
        consigne: Tu vas découvrir comment est faite une séance du site, en regardant celle-ci. On attend deux réponses sur où lire ta mission et les étapes.
        contenu:
            -   type: etapes
                elements:
                    - Regarde le titre en haut.
                    - Lis l’encadré « Ta mission ».
                    - Repère les étapes numérotées.
            -   type: paragraphe
                texte: Pourquoi toujours pareil ? Tu sais où chercher, tu travailles plus vite.
        questions:
            -   id: q01
                type: qcm
                enonce: Que lis-tu en premier dans une mission ?
                choix:
                    -   id: a
                        texte: « Ta mission »
                    -   id: b
                        texte: La dernière question
                    -   id: c
                        texte: Le défi
                aide: 'Méthode : 1) lis toutes les réponses avant de choisir ; 2) élimine celles qui sont impossibles ; 3) vérifie ton choix avec le document ou l’exemple expliqué de la mission.'
            -   id: q02
                type: qcm
                enonce: Où sont les étapes à suivre ?
                choix:
                    -   id: a
                        texte: Dans « Comment procéder »
                    -   id: b
                        texte: Dans le titre
                    -   id: c
                        texte: Il n’y en a pas
                aide: Élimine d’abord les réponses impossibles.
    -   id: a02
        titre: Le coup de pouce
        transition: Tu sais lire une séance. Voici l’aide.
        consigne: Tu vas découvrir le bouton d’aide prévu sous chaque question du site. On attend la bonne réaction quand tu bloques et le barème.
        contenu:
            -   type: etapes
                elements:
                    - Repère le bouton « Un coup de pouce » sous une question.
                    - Ouvre-le.
                    - 'Lis : il ne fait pas perdre de points.'
            -   type: paragraphe
                texte: Pourquoi un coup de pouce ? Il t’aide à trouver seul, sans donner la réponse.
        questions:
            -   id: q01
                type: qcm
                enonce: Tu bloques. Que fais-tu ?
                choix:
                    -   id: a
                        texte: J’ouvre « Un coup de pouce ».
                    -   id: b
                        texte: Je ferme la page.
                    -   id: c
                        texte: J’attends la fin du cours.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: nombre
                enonce: Sur combien de points est notée une séance ?
                unite: points
                aide: 'Méthode : 1) écris l’opération avec les nombres de l’énoncé ; 2) calcule (calculatrice autorisée) ; 3) vérifie que le résultat est vraisemblable et que l’unité est la bonne.'
    -   id: a03
        titre: Le numérique dans mon métier
        transition: Tu sais travailler sur le site. Et au travail ?
        consigne: Tu vas écrire une situation de l’écurie où on utilise un téléphone ou un ordinateur. On attend la situation et à quoi sert l’outil.
        contenu:
            -   type: etapes
                elements:
                    - Pense à ton stage ou à une écurie.
                    - Trouve un moment où on utilise un téléphone ou un ordinateur.
                    - Écris-le en une phrase.
            -   type: paragraphe
                texte: Pourquoi y penser ? Tu vois à quoi va servir le TIM.
        questions:
            -   id: q01
                type: texte
                enonce: Écris une situation de l’écurie où on utilise un téléphone ou un ordinateur, et pour quoi faire.
                aide: 'Méthode : 1) relis la question et compte combien d’éléments sont demandés ; 2) cherche-les dans les documents ou dans « Ce que je retiens » ; 3) écris-les en phrase, un par un.'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Les vétérinaires reçoivent souvent des photos par message.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi une photo aide-t-elle le vétérinaire ?
                aide: 'Méthode : 1) écris ton idée en une phrase ; 2) ajoute la raison avec « car » ou « parce que » ; 3) appuie-toi sur un fait vu dans la séance ou un document. Exemple de début : « … car … ».'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as découvert le cours. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment fonctionne le cours de TIM, et comment travailler sur le site ?'
                aide: 'Méthode : 1) recopie le début de la question du problème ; 2) réponds avec les mots de « Ce que je retiens » ; 3) ajoute un exemple vu aujourd’hui. Trois ou quatre phrases suffisent.'
retenir:
    - « Ta mission » → étapes → questions.
    - Le coup de pouce ne fait pas perdre de points.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
