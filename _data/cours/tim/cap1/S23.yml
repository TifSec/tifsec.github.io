titre: 'Séance 23 : Préparer ses photos de stage'
themes:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
problematique: Comment préparer ses photos pour une présentation ?
competences_bo:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
objectifs:
    connaissances:
        - 'Recadrer : couper ce qui ne sert pas.'
        - 'Alléger : réduire la taille pour un fichier moins lourd.'
    competences:
        - Recadrer une photo.
        - Réduire la taille d’une photo.
pourquoi:
    - Tu vas présenter ton lieu de stage (S24 à S26).
    - D’abord, tu prépares tes photos.
activites:
    -   id: a01
        titre: Choisir
        consigne: Tu vas choisir quatre photos de ton stage pour ta présentation. On attend la liste des photos et ce qu’elles montrent.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre tes photos de stage (ou celles fournies).
                    - 'Garde 4 photos : l’écurie, un cheval, un box, une activité.'
                    - 'Vérifie : pas de personne reconnaissable sans accord.'
            -   type: paragraphe
                texte: Pourquoi 4 ? Ton diaporama aura 4 diapositives.
        questions:
            -   id: q01
                type: texte
                enonce: Écris tes 4 photos choisies et ce qu’elles montrent.
                aide: Combien d’éléments sont demandés ?
    -   id: a02
        titre: Recadrer
        transition: Les photos sont choisies. Améliore-les.
        consigne: Tu vas recadrer une photo de stage et enregistrer une copie. On attend ce que tu as coupé et pourquoi faire une copie.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre une photo avec l’application Photos (ou GIMP).
                    - Clique sur Recadrer.
                    - Garde le sujet au centre ; enregistre une copie.
            -   type: paragraphe
                texte: Pourquoi une copie ? On garde l’original si on rate.
        questions:
            -   id: q01
                type: texte
                enonce: Qu’as-tu coupé sur ta photo ?
                aide: Repère le verbe de la question.
            -   id: q02
                type: qcm
                enonce: Pourquoi enregistrer une copie ?
                choix:
                    -   id: a
                        texte: Pour garder l’original.
                    -   id: b
                        texte: Pour aller plus vite.
                    -   id: c
                        texte: Pour rien.
                aide: Relis l’exemple expliqué.
    -   id: a03
        titre: Alléger
        transition: La photo est bien cadrée. Rends-la légère.
        consigne: Tu vas réduire la taille d’une photo et comparer son poids avant et après. On attend les deux poids.
        contenu:
            -   type: etapes
                elements:
                    - 'Redimensionne la photo : 1 200 pixels de large.'
                    - Regarde le poids avant et après (clic droit > Propriétés).
                    - 'Renomme : stage_box.jpg.'
            -   type: paragraphe
                texte: Pourquoi alléger ? Le diaporama s’ouvre plus vite.
        questions:
            -   id: q01
                type: texte
                enonce: Écris le poids avant et après.
                aide: Combien d’éléments sont demandés ?
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Ton maître de stage est sur une photo.
        questions:
            -   id: q01
                type: texte
                enonce: Que fais-tu avant de la montrer ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tes photos sont prêtes. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment préparer ses photos pour une présentation ?'
                aide: Reprends les mots du problème.
retenir:
    - Choisir, recadrer, alléger, renommer.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
