titre: 'Séance 27 : Repérer les prés d’une écurie sur Géoportail'
themes:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
problematique: Comment utiliser une carte en ligne pour repérer et mesurer des prés ?
competences_bo:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
objectifs:
    connaissances:
        - Géoportail (IGN) affiche des cartes et des photos aériennes.
        - On peut y mesurer une distance ou une surface.
    competences:
        - Chercher un lieu sur Géoportail.
        - Mesurer une surface.
pourquoi:
    - L’écurie de ton stage a des prés.
    - Sur une carte en ligne, tu peux les voir d’en haut et les mesurer.
activites:
    -   id: a01
        titre: Trouver le lieu
        consigne: Tu vas chercher la commune de la MFR sur Géoportail et afficher la photo aérienne. On attend la commune et ce que tu vois.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Géoportail (lien ci-dessous).
                    - Tape le nom de la commune de la MFR.
                    - Choisis la photo aérienne.
            -   type: paragraphe
                texte: Pourquoi la photo aérienne ? On voit les prés, les bâtiments, les chemins.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle commune as-tu cherchée ? Que vois-tu sur la photo aérienne ?
                aide: Repère le verbe de la question.
        ressources:
            -   type: lien
                titre: Géoportail — cartes et photos aériennes de l’IGN
                url: https://www.geoportail.gouv.fr/
    -   id: a02
        titre: Mesurer un pré
        transition: Tu vois les prés. Mesure-en un.
        consigne: Tu vas mesurer la surface d’un pré avec l’outil de Géoportail. On attend la surface avec son unité.
        contenu:
            -   type: etapes
                elements:
                    - Outils > Mesurer une surface.
                    - Clique sur les coins d’un pré, double-clique pour finir.
                    - Lis la surface.
            -   type: paragraphe
                texte: Pourquoi mesurer ? On sait combien de chevaux le pré peut nourrir.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle surface as-tu mesurée, avec son unité ?
                aide: Action → résultat attendu → résultat observé ; une seule chose à la fois.
    -   id: a03
        titre: Combien de chevaux ?
        transition: Tu as la surface. Combien de chevaux ?
        consigne: Tu vas calculer combien de chevaux un pré peut accueillir avec la règle du document 1. On attend deux calculs.
        contenu:
            -   type: paragraphe
                texte: 'Document 1 — Ordre de grandeur : environ 1 hectare de prairie par cheval (variable selon l’herbe, la saison et le complément de foin).'
            -   type: etapes
                elements:
                    - 'Règle de base (document 1) : environ 1 hectare par cheval à l’herbe.'
                    - Utilise ta mesure.
                    - Calcule.
            -   type: paragraphe
                texte: Pourquoi cette règle ? Trop de chevaux sur un pré l’abîment.
        questions:
            -   id: q01
                type: nombre
                enonce: 'Un pré de 3 hectares : combien de chevaux environ, avec la règle du document 1 ?'
                unite: chevaux
                aide: N’oublie pas l’unité.
            -   id: q02
                type: texte
                enonce: Combien de chevaux pour ton pré mesuré ?
                aide: Action → résultat attendu → résultat observé ; une seule chose à la fois.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Géoportail mesure aussi les distances.
        questions:
            -   id: q01
                type: texte
                enonce: Mesure la longueur d’un chemin de balade.
                aide: Attendu ou observé ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais utiliser une carte en ligne. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment utiliser une carte en ligne pour repérer et mesurer des prés ?'
                aide: Reprends les mots du problème.
retenir:
    - 'Géoportail : photo aérienne, mesurer.'
    - 1 ha par cheval environ.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
