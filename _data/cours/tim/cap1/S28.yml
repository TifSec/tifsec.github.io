titre: 'Séance 28 : Caméra de poulinage, abreuvoir automatique : utiles ou gadgets ?'
themes:
    - 2.2.3 — Situer le numérique dans son environnement social, économique et culturel
problematique: Les objets connectés de l’écurie sont-ils utiles, et que deviennent-ils en fin de vie ?
competences_bo:
    - 2.2.3 — Situer le numérique dans son environnement social, économique et culturel
objectifs:
    connaissances:
        - Un objet connecté mesure et envoie une information (caméra, capteur de température, abreuvoir).
        - Il consomme de l’énergie, et en fin de vie il se recycle (point de collecte).
    competences:
        - Dire à quoi sert un objet connecté.
        - Savoir où va un appareil usagé.
pourquoi:
    - Dans certaines écuries, il y a des caméras et des capteurs.
    - Sont-ils utiles ? Et que deviennent-ils quand ils sont cassés ?
activites:
    -   id: a01
        titre: À quoi ça sert ?
        consigne: Tu vas dire à quoi servent trois objets qu’on trouve dans certaines écuries. On attend une utilité par objet.
        contenu:
            -   type: etapes
                elements:
                    - Lis les trois objets.
                    - Écris à quoi sert chacun.
                    - Réponds.
            -   type: paragraphe
                texte: Pourquoi les connaître ? Tu en verras peut-être en stage.
        questions:
            -   id: q01
                type: tableau
                enonce: À quoi sert chaque objet ?
                colonnes:
                    - Objet
                    - Utilité
                lignes:
                    -   - Caméra de poulinage
                        - ''
                    -   - Capteur de température du box
                        - ''
                    -   - Abreuvoir automatique
                        - ''
                aide: Ligne × colonne.
    -   id: a02
        titre: Utile ou gadget ?
        transition: Tu connais leur utilité. Sont-ils toujours utiles ?
        consigne: Tu vas donner un avantage et un inconvénient d’un objet connecté de l’écurie. On attend les deux.
        contenu:
            -   type: etapes
                elements:
                    - Choisis un des objets.
                    - Écris un avantage et un inconvénient.
            -   type: paragraphe
                texte: Pourquoi un inconvénient ? Un objet peut tomber en panne ou coûter cher.
        questions:
            -   id: q01
                type: texte
                enonce: Pour l’objet choisi, écris un avantage et un inconvénient.
                aide: Combien d’éléments sont demandés ?
    -   id: a03
        titre: En fin de vie
        transition: Les objets servent. Mais un jour ils cassent.
        consigne: Tu vas dire où mettre la caméra de poulinage quand elle est cassée et ne peut plus être réparée. On attend le bon lieu de dépôt.
        contenu:
            -   type: etapes
                elements:
                    - La caméra est cassée.
                    - Où la mettre ?
                    - Réponds.
            -   type: paragraphe
                texte: Pourquoi pas la poubelle ? Elle contient des produits polluants et des métaux qu’on récupère.
        questions:
            -   id: q01
                type: qcm
                enonce: Où va la caméra cassée ?
                choix:
                    -   id: a
                        texte: En point de collecte (déchetterie, magasin).
                    -   id: b
                        texte: Dans la poubelle normale.
                    -   id: c
                        texte: Dans le fumier.
                aide: Relis l’exemple expliqué.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: On peut aussi réparer un appareil.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi réparer plutôt que racheter ?
                aide: Pense à « car ».
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu connais les objets connectés. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : les objets connectés de l’écurie sont-ils utiles, et que deviennent-ils en fin de vie ?'
                aide: Reprends les mots du problème.
retenir:
    - 'Objet connecté : mesure et envoie.'
    - 'Fin de vie : réparer ou point de collecte.'
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
