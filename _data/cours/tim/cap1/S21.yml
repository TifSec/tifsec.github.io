titre: 'Séance 21 : Mon identité numérique et la CNIL'
themes:
    - 2.2.3 — Situer le numérique dans son environnement social, économique et culturel
problematique: Que sont mes données personnelles, et qui les protège ?
competences_bo:
    - 2.2.3 — Situer le numérique dans son environnement social, économique et culturel
objectifs:
    connaissances:
        - 'Une donnée personnelle permet de reconnaître quelqu’un : nom, téléphone, photo, adresse.'
        - La CNIL protège les données personnelles en France ; on peut demander à une entreprise de les corriger ou les effacer.
    competences:
        - Reconnaître une donnée personnelle.
        - Connaître un droit et la CNIL.
pourquoi:
    - En S20, tu as vu le droit à l’image.
    - Tes données personnelles sont aussi protégées.
activites:
    -   id: a01
        titre: Personnelle ou pas ?
        consigne: Tu vas dire si quatre informations sont des données personnelles. On attend « oui » ou « non » pour chacune.
        contenu:
            -   type: etapes
                elements:
                    - Lis la liste.
                    - Une information qui permet de te reconnaître est personnelle.
                    - Réponds.
            -   type: paragraphe
                texte: Pourquoi les protéger ? Avec elles, on peut te contacter, te trouver ou se faire passer pour toi.
        questions:
            -   id: q01
                type: tableau
                enonce: Écris « oui » si c’est une donnée personnelle.
                colonnes:
                    - Information
                    - Personnelle ?
                lignes:
                    -   - Mon numéro de téléphone
                        - ''
                    -   - La couleur des boxes
                        - ''
                    -   - Ma photo
                        - ''
                    -   - Mon adresse
                        - ''
                aide: Ligne × colonne.
    -   id: a02
        titre: Mes droits
        transition: Tu reconnais tes données. Que peux-tu demander ?
        consigne: Tu vas associer deux situations au bon droit (document 1). On attend un droit par situation.
        contenu:
            -   type: tableau
                titre: Document 1 — Trois droits
                colonnes:
                    - Droit
                    - Ce qu’il permet
                lignes:
                    -   - Rectification
                        - Corriger une donnée fausse
                    -   - Effacement
                        - Faire supprimer ses données
                    -   - Accès
                        - Savoir ce qu’on a sur moi
            -   type: etapes
                elements:
                    - Lis le document 1.
                    - Associe chaque situation à un droit.
                    - Réponds.
            -   type: paragraphe
                texte: Pourquoi des droits ? Tu peux contrôler ce que les entreprises savent de toi.
        questions:
            -   id: q01
                type: tableau
                enonce: Quel droit utiliser ?
                colonnes:
                    - Situation
                    - Droit
                lignes:
                    -   - Le club a mon ancien numéro
                        - ''
                    -   - Je quitte le club et je veux qu’il efface mes données
                        - ''
                aide: Ligne × colonne.
    -   id: a03
        titre: La CNIL
        transition: Tu connais tes droits. Qui les fait respecter ?
        consigne: Tu vas trouver sur le site de la CNIL un conseil pour protéger tes données. On attend un conseil.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre le site de la CNIL (lien ci-dessous).
                    - Trouve un conseil pour protéger ses données.
                    - Écris-le.
            -   type: paragraphe
                texte: Pourquoi la CNIL ? C’est l’organisme officiel qui protège les données en France.
        questions:
            -   id: q01
                type: texte
                enonce: Écris un conseil trouvé sur le site de la CNIL.
                aide: Combien d’éléments sont demandés ?
        ressources:
            -   type: lien
                titre: CNIL — Les bons réflexes pour protéger ses données (Éducnum)
                url: https://www.cnil.fr/fr/education
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un site demande ton numéro de téléphone pour lire un article.
        questions:
            -   id: q01
                type: texte
                enonce: Est-ce normal ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu connais tes données et tes droits. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : que sont tes données personnelles, et qui les protège ?'
                aide: Reprends les mots du problème.
retenir:
    - Donnée personnelle = qui permet de te reconnaître.
    - 'Droits : accès, rectification, effacement ; CNIL.'
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
