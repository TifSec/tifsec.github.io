titre: 'Séance 15 : Trouver une fiche fiable sur les soins du cheval'
themes:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
problematique: Comment trouver une information fiable sur internet ?
competences_bo:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
objectifs:
    connaissances:
        - On tape des mots-clés dans un moteur de recherche.
        - Un site fiable dit qui l’écrit et quand ; Équipédia (IFCE) est une source officielle.
    competences:
        - Chercher avec des mots-clés.
        - Choisir un site fiable.
pourquoi:
    - En stage, tu te poses des questions sur les soins.
    - Aujourd’hui, tu cherches une information fiable sur internet.
activites:
    -   id: a01
        titre: Les mots-clés
        consigne: Tu vas transformer une question sur une plaie de cheval en mots-clés. On attend les mots-clés à taper.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis la question : « Comment soigner une petite plaie chez le cheval ? »'
                    - Garde seulement les mots importants.
                    - Écris les mots-clés.
            -   type: paragraphe
                texte: Pourquoi des mots-clés ? Le moteur comprend mieux 3 mots précis qu’une longue phrase.
        questions:
            -   id: q01
                type: texte
                enonce: Écris les mots-clés à taper.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a02
        titre: Choisir le site
        transition: Tu as tes mots-clés. Choisis le bon résultat.
        consigne: Tu vas choisir, parmi trois résultats, le site le plus fiable sur les plaies du cheval. On attend ton choix et pourquoi pas le forum.
        contenu:
            -   type: etapes
                elements:
                    - Lis les trois résultats.
                    - Regarde qui publie.
                    - Choisis le plus fiable.
            -   type: paragraphe
                texte: Pourquoi qui publie ? Un institut vérifie ; un forum, pas toujours.
        questions:
            -   id: q01
                type: qcm
                enonce: Quel site choisis-tu ?
                choix:
                    -   id: a
                        texte: equipedia.ifce.fr — fiche sur les plaies
                    -   id: b
                        texte: forum-chevaux.net — « moi je mets du dentifrice »
                    -   id: c
                        texte: vente-pommades.com — publicité
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Pourquoi ne pas faire confiance au forum ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a03
        titre: Lire la fiche
        transition: Tu as choisi le bon site. Lis la fiche.
        consigne: Tu vas lire sur Équipédia la fiche sur les plaies et noter un conseil. On attend un conseil et un cas où appeler le vétérinaire.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Équipédia (lien ci-dessous).
                    - Cherche la fiche sur les plaies.
                    - Note un conseil et quand appeler le vétérinaire.
            -   type: paragraphe
                texte: 'Pourquoi noter « quand appeler » ? Certaines plaies sont graves : il ne faut pas attendre.'
        questions:
            -   id: q01
                type: texte
                enonce: Écris un conseil trouvé et un cas où il faut appeler le vétérinaire.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
        ressources:
            -   type: lien
                titre: IFCE — Équipédia (fiches techniques sur le cheval)
                url: https://equipedia.ifce.fr/
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Les guillemets cherchent une expression exacte.
        questions:
            -   id: q01
                type: texte
                enonce: Que tapes-tu pour chercher exactement « coup de chaleur » ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais chercher une information fiable. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment trouver une information fiable sur internet ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Mots-clés.
    - 'Site fiable : on sait qui publie (IFCE).'
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
