titre: 'Séance 17 : Ce que je publie sur les réseaux sociaux'
themes:
    - 2.2.3 — Situer le numérique dans son environnement social, économique et culturel
problematique: Que puis-je publier sur les réseaux sociaux sans me mettre en danger ?
competences_bo:
    - 2.2.3 — Situer le numérique dans son environnement social, économique et culturel
objectifs:
    connaissances:
        - Ce qu’on publie peut être vu, copié et rester longtemps.
        - On règle son compte en privé et on respecte les autres (nétiquette).
    competences:
        - Repérer une publication risquée.
        - Régler la confidentialité.
pourquoi:
    - Tu utilises peut-être des réseaux sociaux.
    - Un futur employeur peut voir ce que tu publies.
activites:
    -   id: a01
        titre: Risqué ou pas ?
        consigne: Tu vas dire si trois publications sur un réseau social sont risquées. On attend une réponse par publication.
        contenu:
            -   type: etapes
                elements:
                    - Lis les trois publications.
                    - 'Pour chacune : y a-t-il un danger ?'
                    - Réponds.
            -   type: paragraphe
                texte: Pourquoi un danger ? Une adresse ou une moquerie peut te causer des ennuis.
        questions:
            -   id: q01
                type: tableau
                enonce: Écris « risqué » ou « sans risque ».
                colonnes:
                    - Publication
                    - Risqué ?
                lignes:
                    -   - Photo de mon poney au pré
                        - ''
                    -   - « Je suis seul à la maison ce week-end, 3 rue des Lilas »
                        - ''
                    -   - Moquerie sur un camarade tombé de cheval
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: Compte privé
        transition: Tu repères les risques. Règle ton compte.
        consigne: Tu vas choisir les bons réglages de confidentialité d’un compte (document 1). On attend deux réglages.
        contenu:
            -   type: liste
                elements:
                    - Compte public / privé.
                    - 'Partager ma position : oui / non.'
                    - 'Qui peut m’identifier sur une photo : tout le monde / mes amis.'
            -   type: etapes
                elements:
                    - Lis les réglages proposés (document 1).
                    - Choisis les bons réglages.
                    - Réponds.
            -   type: paragraphe
                texte: Pourquoi « privé » ? Seuls les gens que tu acceptes voient tes publications.
        questions:
            -   id: q01
                type: qcm
                enonce: Quel réglage protège le plus ?
                choix:
                    -   id: a
                        texte: Compte privé
                    -   id: b
                        texte: Compte public
                    -   id: c
                        texte: Aucun réglage
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: qcm
                enonce: Faut-il partager sa localisation en direct ?
                choix:
                    -   id: a
                        texte: Non
                    -   id: b
                        texte: Oui, toujours
                    -   id: c
                        texte: Seulement la nuit
                aide: Élimine d’abord les réponses impossibles.
    -   id: a03
        titre: Respecter les autres
        transition: Ton compte est protégé. Et les autres ?
        consigne: Tu vas dire quoi faire si quelqu’un publie ta photo sans ton accord. On attend deux actions.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis la situation : un camarade publie une photo de toi sans demander.'
                    - Que peux-tu faire ?
                    - Écris.
            -   type: paragraphe
                texte: Pourquoi demander ? Chacun décide de ce qu’on montre de lui.
        questions:
            -   id: q01
                type: texte
                enonce: Un camarade publie une photo de toi sans accord. Que fais-tu ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Écris une règle de nétiquette pour la classe.
        questions:
            -   id: q01
                type: texte
                enonce: Commence par « Je… ».
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais publier sans danger. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : que peux-tu publier sur les réseaux sociaux sans te mettre en danger ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Pas d’infos perso, pas de moquerie.
    - Compte privé ; accord avant de publier quelqu’un.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
