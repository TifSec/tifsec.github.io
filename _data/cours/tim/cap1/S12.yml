titre: 'Séance 12 : Le planning de paillage du mois'
themes:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
problematique: Comment le tableur peut-il remplir des dates tout seul ?
competences_bo:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
objectifs:
    connaissances:
        - 'La poignée (petit carré en bas à droite) recopie et continue une suite : dates, jours, nombres.'
        - Une date + 7 donne la date une semaine plus tard.
    competences:
        - Recopier une suite de dates.
        - Calculer une date.
pourquoi:
    - En S11, tu as fait des calculs.
    - 'Le gérant veut le planning de paillage du mois : qui paille, quel jour ?'
activites:
    -   id: a01
        titre: La poignée
        consigne: Tu vas utiliser la poignée de Calc pour remplir une semaine de dates. On attend la date en A8 et le résultat avec « lundi ».
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Calc ; enregistre paillage.ods.
                    - En A2, tape 02/11/2026.
                    - Tire la poignée jusqu’en A8.
            -   type: paragraphe
                texte: Pourquoi la poignée ? Calc continue la suite des dates tout seul.
        questions:
            -   id: q01
                type: texte
                enonce: Qu’affiche A8 ?
                aide: Une phrase complète qui reprend les mots de la question.
            -   id: q02
                type: qcm
                enonce: Tu tapes « lundi » et tu tires. Qu’obtiens-tu ?
                choix:
                    -   id: a
                        texte: lundi, mardi, mercredi…
                    -   id: b
                        texte: lundi, lundi…
                    -   id: c
                        texte: Une erreur
                aide: Élimine d’abord les réponses impossibles.
    -   id: a02
        titre: Le planning
        transition: Les dates sont prêtes. Ajoute qui paille.
        consigne: Tu vas compléter le planning de paillage avec un prénom par jour. On attend qui paille le 5 novembre.
        contenu:
            -   type: etapes
                elements:
                    - 'En B1 : « Qui paille ? ».'
                    - Écris un prénom par jour (3 prénoms qui tournent).
                    - Mets la ligne 1 en gras.
            -   type: paragraphe
                texte: Pourquoi un planning ? Chacun sait quand c’est son tour.
        questions:
            -   id: q01
                type: texte
                enonce: Qui paille le 05/11/2026 dans ton planning ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a03
        titre: Une semaine plus tard
        transition: Le planning est fait. Prévois la semaine suivante.
        consigne: Tu vas calculer la date de la semaine suivante avec =A2+7. On attend la date en C2 et la formule de C3.
        contenu:
            -   type: etapes
                elements:
                    - 'En C1 : « Même tâche la semaine d’après ».'
                    - En C2, tape =A2+7.
                    - Tire la poignée jusqu’en C8.
            -   type: paragraphe
                texte: Pourquoi +7 ? Une semaine = 7 jours.
        questions:
            -   id: q01
                type: texte
                enonce: Qu’affiche C2 ?
                aide: Une phrase complète qui reprend les mots de la question.
            -   id: q02
                type: texte
                enonce: Écris la formule de C3.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le paillage se fait tous les 2 jours.
        questions:
            -   id: q01
                type: texte
                enonce: Comment faire la suite 02/11, 04/11, 06/11 ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton planning est prêt. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment le tableur peut-il remplir des dates tout seul ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Poignée : continue une suite.'
    - Date + 7 = 1 semaine plus tard.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
