titre: 'Séance 6 : La fiche d’un cheval'
themes:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
problematique: Comment écrire une fiche claire dans un traitement de texte ?
competences_bo:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
objectifs:
    connaissances:
        - Writer (ou Word) sert à écrire des textes.
        - Gras, taille, centrage rendent le texte plus clair.
    competences:
        - Taper un texte simple.
        - Mettre en gras, agrandir, centrer.
pourquoi:
    - En séquence 1, tu as préparé ton espace.
    - Aujourd’hui, tu écris la fiche d’un cheval de l’écurie.
activites:
    -   id: a01
        titre: Taper la fiche
        consigne: Tu vas taper dans Writer la fiche du cheval Tango à partir du document 1. On attend le raccourci pour enregistrer et la ligne « Robe ».
        contenu:
            -   type: liste
                elements:
                    - 'Nom : Tango'
                    - 'Âge : 9 ans'
                    - 'Robe : alezan'
                    - 'Caractère : calme, aime les caresses'
                    - 'Soin particulier : graisser les sabots'
            -   type: paragraphe
                texte: Données fictives créées pour l’exercice.
            -   type: etapes
                elements:
                    - Ouvre Writer.
                    - 'Enregistre tout de suite : TIM > Writer, nom fiche_tango.odt.'
                    - Tape les informations du document 1, une par ligne.
            -   type: paragraphe
                texte: Pourquoi enregistrer tout de suite ? Si l’ordinateur s’éteint, rien n’est perdu.
        questions:
            -   id: q01
                type: qcm
                enonce: Quel raccourci enregistre ?
                choix:
                    -   id: a
                        texte: Ctrl + S
                    -   id: b
                        texte: Ctrl + P
                    -   id: c
                        texte: Ctrl + Z
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Écris la ligne « Robe » de ta fiche.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a02
        titre: Mettre en forme
        transition: Le texte est tapé. Rends-le clair.
        consigne: Tu vas mettre en forme la fiche de Tango (titre, gras, centrage). On attend le bouton de trois actions.
        contenu:
            -   type: etapes
                elements:
                    - 'Ajoute un titre en haut : « Fiche de Tango ».'
                    - 'Sélectionne le titre : gras, taille 20, centré.'
                    - Mets les mots « Nom », « Âge »… en gras.
            -   type: paragraphe
                texte: Pourquoi le gras ? On voit tout de suite les mots importants.
        questions:
            -   id: q01
                type: tableau
                enonce: Quel bouton pour chaque action ?
                colonnes:
                    - Action
                    - Bouton
                lignes:
                    -   - Gras
                        - ''
                    -   - Centrer
                        - ''
                    -   - Annuler
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a03
        titre: Vérifier
        transition: La fiche est en forme. Relis-la.
        consigne: Tu vas relire ta fiche et corriger les fautes avec le correcteur. On attend le mot corrigé.
        contenu:
            -   type: etapes
                elements:
                    - 'Relis : les mots soulignés en rouge sont peut-être faux.'
                    - 'Clic droit sur un mot souligné : choisis la bonne orthographe.'
                    - Enregistre.
            -   type: paragraphe
                texte: Pourquoi relire ? Une fiche avec des fautes fait moins sérieux.
        questions:
            -   id: q01
                type: texte
                enonce: Quel mot as-tu corrigé ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: On peut ajouter une photo.
        questions:
            -   id: q01
                type: texte
                enonce: Quel menu pour insérer une image ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ta fiche est prête. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment écrire une fiche claire dans un traitement de texte ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Ctrl + S ; gras ; centrer ; Ctrl + Z.
    - Relire avec le correcteur.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
