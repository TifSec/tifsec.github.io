titre: 'Séance 9 : Bilan : une fiche de pansage pas à pas'
themes:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
problematique: Saurai-je faire seul une fiche propre avec Writer ?
competences_bo:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
objectifs:
    connaissances:
        - 'On réutilise : titre, liste numérotée, tableau, image, PDF.'
        - Une fiche pas à pas suit l’ordre des gestes.
    competences:
        - Réaliser seul une fiche Writer complète.
pourquoi:
    - De S06 à S08, tu as appris les bases de Writer.
    - 'Bilan : tu fais la fiche du pansage pour les nouveaux stagiaires.'
activites:
    -   id: a01
        titre: L’ordre des gestes
        consigne: Tu vas remettre dans l’ordre les étapes du pansage (document 1). On attend un numéro par étape.
        contenu:
            -   type: liste
                elements:
                    - Brosse douce
                    - Étrille
                    - Curer les pieds
                    - Bouchonner / brosse dure
            -   type: paragraphe
                texte: Ordre courant ; chaque écurie peut l’adapter.
            -   type: etapes
                elements:
                    - Lis les étapes du pansage (document 1), dans le désordre.
                    - Remets-les dans l’ordre.
                    - Numérote.
            -   type: paragraphe
                texte: Pourquoi l’ordre ? Un stagiaire doit suivre la fiche sans se tromper.
        questions:
            -   id: q01
                type: tableau
                enonce: Remets le pansage dans l’ordre (1 à 4).
                colonnes:
                    - Étape
                    - Ordre
                lignes:
                    -   - Brosse douce
                        - ''
                    -   - Étrille
                        - ''
                    -   - Curer les pieds
                        - ''
                    -   - Bouchonner / brosse dure
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: Faire la fiche
        transition: L’ordre est trouvé. Fais la fiche seul.
        consigne: Tu vas faire seul la fiche de pansage dans Writer (titre, liste numérotée, image). On attend ta liste numérotée.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Writer ; enregistre fiche_pansage.odt.
                    - Titre en gras et centré.
                    - Liste numérotée des 4 étapes avec une phrase chacune.
                    - Une image et sa légende.
            -   type: paragraphe
                texte: Pourquoi une liste numérotée ? Le numéro dit l’ordre.
        questions:
            -   id: q01
                type: texte
                enonce: Recopie ta liste numérotée.
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a03
        titre: Vérifier et exporter
        transition: La fiche est faite. Vérifie-la.
        consigne: Tu vas vérifier ta fiche puis l’exporter en PDF. On attend ce que tu as vérifié et le nom du fichier.
        contenu:
            -   type: etapes
                elements:
                    - Relis avec le correcteur.
                    - Exporte en PDF.
                    - Ouvre le PDF pour vérifier.
            -   type: paragraphe
                texte: Pourquoi le PDF ? La fiche sera affichée et imprimée.
        questions:
            -   id: q01
                type: texte
                enonce: Qu’as-tu vérifié avant d’exporter, et quel est le nom du PDF ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un stagiaire ne sait pas ce qu’est une étrille.
        questions:
            -   id: q01
                type: texte
                enonce: Comment l’aider sur la fiche ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ta fiche est terminée. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : saurais-tu faire seul une fiche propre avec Writer ? Dis ce qui était facile et ce qui était difficile.'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Fiche : titre, liste numérotée, image, PDF.'
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
