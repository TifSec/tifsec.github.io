titre: 'Séance 14 : Bilan Calc : le foin de la semaine'
themes:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
problematique: Saurai-je utiliser seul le tableur pour un calcul de l’écurie ?
competences_bo:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
objectifs:
    connaissances:
        - 'On réutilise : saisie, SOMME, MOYENNE, graphique, titre.'
    competences:
        - Réaliser seul un petit tableau de calcul.
pourquoi:
    - De S10 à S13, tu as appris les bases de Calc.
    - 'Bilan : le foin de la semaine pour 4 chevaux.'
activites:
    -   id: a01
        titre: Saisir
        consigne: Tu vas saisir seul les rations de foin de quatre chevaux (document 1). On attend le contenu de deux cellules.
        contenu:
            -   type: tableau
                titre: Document 1 — Foin par jour (fictif)
                colonnes:
                    - ''
                    - A
                    - B
                lignes:
                    -   - '1'
                        - Cheval
                        - Foin par jour (kg)
                    -   - '2'
                        - Tango
                        - '9'
                    -   - '3'
                        - Nuage
                        - '6'
                    -   - '4'
                        - Caramel
                        - '4'
                    -   - '5'
                        - Belle
                        - '8'
            -   type: etapes
                elements:
                    - Ouvre Calc ; enregistre bilan_foin.ods.
                    - Recopie le document 1.
                    - Pourquoi bien saisir ? Une erreur de saisie fausse tous les calculs.
        questions:
            -   id: q01
                type: texte
                enonce: Écris le contenu de A3 et B3.
                aide: Clique sur A3 puis sur B3 et recopie ce qui est écrit.
    -   id: a02
        titre: Calculer
        transition: Les données sont saisies. Calcule.
        consigne: Tu vas calculer seul le total, la moyenne et le foin de la semaine. On attend trois résultats.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : 2 kg en B2.'
                    - =B2*7 → 14 kg pour la semaine.
                    - 'SOMME additionne, MOYENNE fait la moyenne : =SOMME(B2:B5), =MOYENNE(B2:B5).'
                    - 'À toi : en B6 : total avec SOMME.'
                    - 'En B7 : moyenne avec MOYENNE.'
                    - 'En C2 : =B2*7, tire jusqu’en C5.'
                    - Pourquoi ×7 ? Pour avoir la semaine.
        questions:
            -   id: q01
                type: nombre
                enonce: Quel est le total par jour (B6) ?
                unite: kg
                aide: 'Clique sur B6 : c’est la SOMME des rations. Lis le nombre et écris kg.'
            -   id: q02
                type: nombre
                enonce: Combien de foin pour Tango sur la semaine (C2) ?
                unite: kg
                aide: C2 = la ration de Tango × 7 jours. Lis le résultat.
            -   id: q03
                type: nombre
                enonce: Quelle est la moyenne par jour (B7) ?
                unite: kg
                aide: 'Clique sur B7 : c’est la MOYENNE. Lis le nombre.'
    -   id: a03
        titre: Le graphique
        transition: Les calculs sont faits. Montre-les.
        consigne: Tu vas faire seul le graphique des rations de foin. On attend le titre et le cheval qui mange le plus.
        contenu:
            -   type: image
                url: /assets/images/graphiques/tim-cap1-s14-foin.svg
                alternative: 'Exemple du graphique attendu : foin par jour de 4 chevaux.'
                legende: 'Exemple du graphique attendu : foin par jour de 4 chevaux.'
            -   type: titre
                texte: Comment faire ce graphique
            -   type: etapes
                elements:
                    - Saisis les noms dans une colonne et les valeurs dans la colonne voisine, avec une ligne de titres.
                    - Sélectionne le tableau (titres compris), puis Insertion > Diagramme > Colonne.
                    - Ajoute un titre et le nom des axes avec l’unité (Insertion > Titres), puis clique en dehors du graphique.
            -   type: titre
                texte: Comment le lire
            -   type: liste
                elements:
                    - 'Lis le titre : il dit ce qui est représenté.'
                    - Chaque barre correspond à un élément (axe horizontal) ; sa hauteur se lit sur l’axe vertical, avec son unité.
                    - 'Vérifie que l’axe vertical commence à 0 : sinon les écarts paraissent plus grands qu’en réalité.'
            -   type: titre
                texte: Comment le comprendre
            -   type: liste
                elements:
                    - Le graphique montre d’un coup d’œil qui mange le plus et le moins.
            -   type: etapes
                elements:
                    - Fais un graphique en colonnes avec A1:B5.
                    - Ajoute un titre et l’unité.
                    - Enregistre.
                    - Pourquoi un graphique ? Pour montrer au gérant qui mange le plus.
        questions:
            -   id: q01
                type: texte
                enonce: Écris le titre de ton graphique et le cheval qui mange le plus.
                aide: Recopie le titre du graphique, puis cherche la colonne la plus haute.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une botte pèse 20 kg.
        questions:
            -   id: q01
                type: texte
                enonce: Combien de bottes pour la semaine pour les 4 chevaux ?
                aide: Fais le total de la semaine (total par jour × 7), puis divise par le poids d’une botte. Arrondis au-dessus.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton bilan Calc est fait. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : saurais-tu utiliser seul le tableur pour un calcul de l’écurie ? Dis ce qui était facile et difficile.'
                aide: Dis ce que tu sais faire seul (saisir, formules, graphique) et ce qui était difficile.
retenir:
    - Saisir, SOMME, MOYENNE, ×7, graphique.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
