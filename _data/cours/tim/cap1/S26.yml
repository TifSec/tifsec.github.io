titre: 'Séance 26 : Présenter son stage à l’oral'
themes:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
problematique: Comment présenter son stage à l’oral ?
competences_bo:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
objectifs:
    connaissances:
        - 'À l’oral : regarder le public, parler fort et lentement, ne pas lire l’écran.'
        - 3 minutes environ.
    competences:
        - Présenter son diaporama.
        - Écouter et conseiller un camarade.
pourquoi:
    - Ton diaporama est prêt.
    - Aujourd’hui, tu le présentes au groupe.
activites:
    -   id: a01
        titre: Préparer
        consigne: Tu vas préparer une phrase à dire pour chaque diapositive. On attend ta phrase pour la diapositive « mon travail ».
        contenu:
            -   type: etapes
                elements:
                    - Pour chaque diapositive, prépare une phrase à dire.
                    - Entraîne-toi à voix basse.
            -   type: paragraphe
                texte: Pourquoi une phrase ? Tu sais quoi dire, tu as moins peur.
        questions:
            -   id: q01
                type: texte
                enonce: Écris la phrase que tu diras pour ta diapositive « mon travail ».
                aide: Combien d’éléments sont demandés ?
    -   id: a02
        titre: Écouter un camarade
        transition: Tu es prêt. Écoute d’abord un camarade.
        consigne: Tu vas écouter un camarade avec la grille d’oral et lui donner un conseil. On attend un point réussi et un conseil.
        contenu:
            -   type: tableau
                titre: Grille d’oral
                colonnes:
                    - Critère
                    - Oui / à améliorer
                lignes:
                    -   - Regarde le public
                        - ''
                    -   - Parle fort
                        - ''
                    -   - Ne lit pas l’écran
                        - ''
                    -   - 3 minutes environ
                        - ''
            -   type: etapes
                elements:
                    - Pendant qu’un camarade présente, regarde la grille.
                    - Coche ce qui est réussi.
                    - Donne un conseil gentil.
            -   type: paragraphe
                texte: Pourquoi un conseil ? On progresse ensemble.
        questions:
            -   id: q01
                type: texte
                enonce: Écris un point réussi et un conseil pour ton camarade.
                aide: Combien d’éléments sont demandés ?
    -   id: a03
        titre: Mon bilan
        transition: Tu as présenté. Fais ton bilan.
        consigne: Tu vas faire le bilan de ta présentation avec la grille. On attend un point réussi et un point à améliorer.
        contenu:
            -   type: etapes
                elements:
                    - Après ton passage, lis la grille de ton camarade.
                    - Écris ce que tu as réussi.
                    - Écris ce que tu veux améliorer.
            -   type: paragraphe
                texte: Pourquoi un bilan ? En CAPa 2, tu feras un oral plus long.
        questions:
            -   id: q01
                type: texte
                enonce: Qu’as-tu réussi, et que veux-tu améliorer ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: On te pose une question difficile.
        questions:
            -   id: q01
                type: texte
                enonce: Que réponds-tu si tu ne sais pas ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as présenté ton stage. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment présenter son stage à l’oral ?'
                aide: Reprends les mots du problème.
retenir:
    - Regarder, parler fort, ne pas lire.
    - 3 minutes.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
