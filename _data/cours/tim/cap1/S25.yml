titre: 'Séance 25 : Les règles d’un bon diaporama'
themes:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
problematique: Qu’est-ce qui rend un diaporama agréable à regarder ?
competences_bo:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
objectifs:
    connaissances:
        - 'Un bon diaporama : même présentation sur toutes les diapositives (thème), texte gros, couleurs lisibles.'
        - Pas trop d’effets.
    competences:
        - Appliquer un thème.
        - Vérifier la lisibilité.
pourquoi:
    - En S24, tu as fait ton diaporama.
    - Aujourd’hui, tu l’améliores.
activites:
    -   id: a01
        titre: Bon ou mauvais ?
        consigne: Tu vas comparer deux diaporamas (document 1) pour trouver les règles d’un bon diaporama. On attend le meilleur et deux défauts de l’autre.
        contenu:
            -   type: liste
                elements:
                    - 'Diaporama A : chaque diapositive a une couleur différente, texte taille 12, des effets qui tournent.'
                    - 'Diaporama B : même thème clair partout, texte taille 28, une photo par diapositive.'
            -   type: etapes
                elements:
                    - Lis les deux descriptions (document 1).
                    - Choisis le meilleur diaporama.
                    - Explique.
            -   type: paragraphe
                texte: Pourquoi des règles ? Le public doit lire facilement.
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 1, quel diaporama est le meilleur ?
                choix:
                    -   id: a
                        texte: Le B
                    -   id: b
                        texte: Le A
                    -   id: c
                        texte: Les deux
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: texte
                enonce: Cite deux défauts du diaporama A.
                aide: Combien d’éléments sont demandés ?
    -   id: a02
        titre: Le thème
        transition: Tu connais les règles. Applique-les.
        consigne: Tu vas appliquer un même thème sobre à toutes tes diapositives. On attend le thème choisi et pourquoi.
        contenu:
            -   type: etapes
                elements:
                    - Dans Impress, ouvre le volet Masques ou Thèmes.
                    - Choisis un thème sobre, fond clair.
                    - Applique-le à toutes les diapositives.
            -   type: paragraphe
                texte: Pourquoi un seul thème ? Le diaporama est cohérent.
        questions:
            -   id: q01
                type: texte
                enonce: Quel thème as-tu choisi, et pourquoi ?
                aide: Pense à « car ».
    -   id: a03
        titre: Vérifier
        transition: Le thème est appliqué. Teste la lisibilité.
        consigne: Tu vas tester la lisibilité de ton diaporama à 2 mètres et corriger. On attend ce que tu as changé.
        contenu:
            -   type: etapes
                elements:
                    - Lance le diaporama (F5).
                    - 'Recule de 2 mètres : lis-tu tout ?'
                    - Agrandis le texte si besoin (au moins 24).
            -   type: paragraphe
                texte: Pourquoi reculer ? Le public est loin de l’écran.
        questions:
            -   id: q01
                type: texte
                enonce: Qu’as-tu changé après le test des 2 mètres ?
                aide: Action → résultat attendu → résultat observé ; une seule chose à la fois.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une transition simple suffit.
        questions:
            -   id: q01
                type: texte
                enonce: Laquelle choisirais-tu ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton diaporama est agréable. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : qu’est-ce qui rend un diaporama agréable à regarder ?'
                aide: Reprends les mots du problème.
retenir:
    - Un thème, texte ≥ 24, peu d’effets.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
