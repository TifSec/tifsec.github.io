titre: 'Séance 19 : Un faux courriel au nom de la fédération'
themes:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
    - EG4, objectif 3-2 — Situer les TIC dans l’environnement social et culturel
problematique: Comment repérer une tentative d’hameçonnage ou un logiciel malveillant, et réagir ?
competences_bo:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
    - EG4, objectif 3-2 — Situer les TIC dans l’environnement social et culturel
objectifs:
    connaissances:
        - L’hameçonnage imite un organisme connu pour voler des identifiants ou de l’argent.
        - Un logiciel malveillant (virus, rançongiciel) arrive souvent par une pièce jointe ou un lien piégé.
    competences:
        - Repérer les indices d’un message frauduleux.
        - Adopter les bons réflexes.
pourquoi:
    - En S18, tu as vu ce que les sites savent de toi.
    - 'Les escrocs utilisent ces informations : un faux courriel « FFE » circule chez les cavaliers.'
activites:
    -   id: a01
        titre: Les indices
        consigne: Tu vas chercher les indices de fraude dans un faux courriel au nom de la fédération (document 1, inventé). On attend trois indices.
        contenu:
            -   type: citation
                texte: 'Document 1 — De : ffe-securite@outlook-mail.co. Objet : Votre licence 2027 expire !! « Cher cavalier, votre licence sera bloquée sous 48 h. Réglez 2,99 € de frais sur https://ffe-licence.paiement-secure.co ou ouvrez le formulaire joint (licence.zip). »'
            -   type: paragraphe
                texte: Message inventé.
            -   type: etapes
                elements:
                    - Lis le message (document 1, inventé).
                    - Cherche au moins trois indices de fraude.
                    - Classe-les.
            -   type: paragraphe
                texte: 'Pourquoi plusieurs indices ? Les escrocs soignent parfois leurs messages : on croise les indices.'
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, cite trois indices de fraude.
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
    -   id: a02
        titre: La pièce jointe piégée
        transition: Le lien est piégé. La pièce jointe aussi.
        consigne: Tu vas comprendre le danger d’une pièce jointe piégée avec le document 2. On attend ce que fait un rançongiciel et la meilleure protection.
        contenu:
            -   type: paragraphe
                texte: Document 2 — Un rançongiciel est un logiciel malveillant qui chiffre les fichiers d’un ordinateur et du réseau, puis demande une rançon. Il arrive souvent par une pièce jointe ouverte par erreur. Payer ne garantit pas de récupérer les fichiers.
            -   type: etapes
                elements:
                    - Lis le document 2 sur les rançongiciels.
                    - Réponds aux questions.
                    - Fais le lien avec la pièce jointe du document 1.
            -   type: paragraphe
                texte: 'Pourquoi une écurie est-elle concernée ? Ses fichiers clients, factures et registres sanitaires sont précieux : un rançongiciel peut les bloquer.'
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 2, que fait un rançongiciel ?
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
            -   id: q02
                type: qcm
                enonce: Quelle protection limite le plus les dégâts d’un rançongiciel ?
                choix:
                    -   id: a
                        texte: Une sauvegarde récente, déconnectée.
                    -   id: b
                        texte: Payer la rançon.
                    -   id: c
                        texte: Éteindre l’écran.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a03
        titre: Réagir
        transition: Tu sais repérer les pièges. Et s’il est trop tard ?
        consigne: Tu vas indiquer la bonne réaction dans trois situations d’hameçonnage. On attend une réaction par situation.
        contenu:
            -   type: etapes
                elements:
                    - Lis les trois situations.
                    - Pour chacune, écris la bonne réaction.
                    - Réponds.
            -   type: paragraphe
                texte: Pourquoi réagir vite ? Changer un mot de passe ou isoler un ordinateur tout de suite limite les dégâts.
        questions:
            -   id: q01
                type: tableau
                enonce: Écris la bonne réaction.
                colonnes:
                    - Situation
                    - Réaction
                lignes:
                    -   - Tu reçois ce message
                        - ''
                    -   - Tu as tapé ton mot de passe sur le faux site
                        - ''
                    -   - Tu as ouvert le .zip et des fichiers deviennent illisibles
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le site cybermalveillance.gouv.fr aide les victimes.
        questions:
            -   id: q01
                type: texte
                enonce: Cite un service qu’il propose.
                aide: Une idée réaliste + « Cela permet de… ».
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais déjouer l’hameçonnage. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment repérer une tentative d’hameçonnage ou un logiciel malveillant, et réagir ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Hameçonnage : expéditeur, urgence, faux domaine, pièce jointe.'
    - 'Réagir : signaler, changer le mot de passe, isoler, sauvegarder.'
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
