titre: 'Séance 25 : Restitution de stage à l’oral'
themes:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
problematique: Comment présenter son stage à l’oral de façon claire et convaincante ?
competences_bo:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
objectifs:
    connaissances:
        - 'Un oral réussi : introduction (qui, quoi), développement suivant le plan, conclusion (ce que j’ai appris) ; 5 minutes.'
        - On regarde le public, on parle lentement, on s’appuie sur les notes.
    competences:
        - Présenter un diaporama en temps limité.
        - Évaluer un oral avec une grille.
pourquoi:
    - En S23 et S24, tu as préparé ton diaporama.
    - Aujourd’hui, restitution de stage devant ton groupe.
activites:
    -   id: a01
        titre: Se préparer
        consigne: Tu vas préparer l’introduction et la conclusion de ta restitution de stage. On attend tes deux phrases.
        contenu:
            -   type: etapes
                elements:
                    - Relis tes notes.
                    - Prépare ta phrase d’introduction et ta phrase de conclusion.
                    - Vérifie que le diaporama s’ouvre en plein écran.
            -   type: paragraphe
                texte: Pourquoi l’introduction et la conclusion ? Ce sont les moments que le public retient le mieux.
        questions:
            -   id: q01
                type: texte
                enonce: Écris ta phrase d’introduction et ta phrase de conclusion.
                aide: Combien d’éléments sont demandés ?
    -   id: a02
        titre: Observer un camarade
        transition: Tu es prêt. Pendant les passages, tu es aussi jury.
        consigne: Tu vas observer la restitution d’un camarade avec la grille (document 1) et lui poser une question. On attend ton observation et ta question.
        contenu:
            -   type: tableau
                titre: Document 1 — Grille d’observation
                colonnes:
                    - Critère
                    - Oui / à améliorer
                lignes:
                    -   - Regarde le public
                        - ''
                    -   - Parle fort et lentement
                        - ''
                    -   - Suit son plan
                        - ''
                    -   - Ne lit pas l’écran
                        - ''
                    -   - Respecte 5 min
                        - ''
            -   type: etapes
                elements:
                    - Pendant le passage d’un camarade, remplis la grille (document 1).
                    - Chronomètre.
                    - Prépare une question à lui poser.
            -   type: paragraphe
                texte: 'Pourquoi poser une question ? En stage et en entretien, il faut savoir répondre : on s’entraîne ensemble.'
        questions:
            -   id: q01
                type: texte
                enonce: 'Pour le camarade observé : durée, un point fort, un point à améliorer, ta question.'
                aide: Action → résultat attendu → résultat observé ; une seule chose à la fois.
    -   id: a03
        titre: Mon bilan d’oral
        transition: Les passages sont faits. Fais ton bilan.
        consigne: Tu vas faire le bilan de ta restitution à partir des grilles de tes observateurs. On attend ta durée, un point fort et un point à travailler.
        contenu:
            -   type: etapes
                elements:
                    - Après ton passage, lis les grilles de tes observateurs.
                    - Note ta durée.
                    - Choisis un point à travailler pour la 1re.
            -   type: paragraphe
                texte: 'Pourquoi un point pour la 1re ? Tu présenteras encore ton stage l’an prochain : tu sais déjà sur quoi progresser.'
        questions:
            -   id: q01
                type: texte
                enonce: Écris ta durée, un point fort relevé par les observateurs et un point à travailler.
                aide: Combien d’éléments sont demandés ?
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le jury te pose une question à laquelle tu ne sais pas répondre.
        questions:
            -   id: q01
                type: texte
                enonce: Que fais-tu ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ta restitution est faite. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment présenter son stage à l’oral de façon claire et convaincante ?'
                aide: Reprends les mots du problème.
retenir:
    - 'Oral : introduction, plan, conclusion, 5 min.'
    - Regarder, parler lentement, ne pas lire.
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
