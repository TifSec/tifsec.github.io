titre: 'Séance 9 : Envoyer un courriel à son maître de stage'
themes:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
problematique: Comment rédiger et envoyer un courriel professionnel avec une pièce jointe ?
competences_bo:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
objectifs:
    connaissances:
        - Un courriel professionnel a un objet précis, une formule d’appel, un message court, une formule de politesse et une signature.
        - 'À : destinataire principal ; Cc : copie visible ; Cci : copie cachée.'
    competences:
        - Rédiger un courriel professionnel.
        - Utiliser À, Cc, Cci et les pièces jointes.
pourquoi:
    - En S06, tu as écrit ta lettre de demande de stage.
    - Tu l’envoies maintenant par courriel au maître de stage, avec le professeur en copie.
activites:
    -   id: a01
        titre: Les bons destinataires
        consigne: Tu vas choisir le bon champ (À, Cc, Cci) pour chaque destinataire de ton courriel de stage. On attend un champ par destinataire et le cas de la copie cachée.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis la situation : tu écris au maître de stage, le professeur principal doit être informé.'
                    - Lis la définition de À, Cc et Cci.
                    - Range chaque personne.
                    - Pourquoi Cc ? Le professeur est informé, mais ce n’est pas à lui de répondre.
        questions:
            -   id: q01
                type: tableau
                enonce: Dans quel champ mets-tu chaque destinataire ?
                colonnes:
                    - Destinataire
                    - Champ
                lignes:
                    -   - Le maître de stage
                        - ''
                    -   - Le professeur principal
                        - ''
                aide: '« À » : la personne à qui tu écris. « Cc » : la personne qui doit être au courant.'
            -   id: q02
                type: qcm
                enonce: Tu envoies une invitation à 30 propriétaires qui ne se connaissent pas. Quel champ ?
                choix:
                    -   id: a
                        texte: Cci, pour ne pas montrer leurs adresses.
                    -   id: b
                        texte: À.
                    -   id: c
                        texte: Cc.
                aide: 'Les 30 propriétaires ne se connaissent pas : faut-il montrer leurs adresses aux autres ?'
    -   id: a02
        titre: Rédiger le courriel
        transition: Les destinataires sont choisis. Rédige le message.
        consigne: Tu vas rédiger le courriel qui accompagne ta lettre de demande de stage. On attend l’objet, le message et la signature.
        contenu:
            -   type: etapes
                elements:
                    - 'Objet : « Demande de stage — prénom nom — 2de pro ».'
                    - Formule d’appel, 3 lignes de message, formule de politesse.
                    - 'Signature : prénom, nom, classe, établissement, téléphone.'
                    - 'Pourquoi un message court ? La lettre est en pièce jointe : le courriel l’annonce, il ne la répète pas.'
        questions:
            -   id: q01
                type: texte
                enonce: Recopie ton courriel complet (objet, message, signature).
                aide: Objet précis ; formule de politesse ; deux ou trois phrases qui annoncent la lettre et le CV ; remerciement ; signature complète.
    -   id: a03
        titre: Joindre et vérifier
        transition: Le message est prêt. Ajoute la lettre et vérifie.
        consigne: Tu vas joindre ta lettre en PDF, contrôler son poids et vérifier le courriel avant de l’envoyer à toi-même. On attend le fichier joint, son poids et ta vérification.
        contenu:
            -   type: etapes
                elements:
                    - Joins ta lettre en PDF (trombone).
                    - Vérifie le poids de la pièce jointe.
                    - Relis tout avant d’envoyer (à toi-même pour l’exercice).
                    - 'Pourquoi relire avant d’envoyer ? Un courriel envoyé ne se rattrape pas : faute, oubli de pièce jointe, mauvais destinataire.'
        questions:
            -   id: q01
                type: texte
                enonce: Quel fichier as-tu joint, quel est son poids, et quelle vérification as-tu faite avant d’envoyer ?
                aide: Écris le nom de ta pièce jointe, regarde son poids dans le courriel, puis dis ce que tu as vérifié avant de cliquer sur Envoyer.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: L’adresse mail compte aussi.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi éviter une adresse comme « kevdu15@… » pour un stage ?
                aide: 'Imagine le maître de stage qui lit cette adresse : quelle image donne-t-elle ?'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton courriel professionnel est envoyé. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment rédiger et envoyer un courriel professionnel avec une pièce jointe ?'
                aide: Dis les champs À, Cc, Cci, ce que contient le message, et les vérifications avant l’envoi.
retenir:
    - À / Cc / Cci.
    - Objet, appel, message court, politesse, signature ; PDF joint.
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
