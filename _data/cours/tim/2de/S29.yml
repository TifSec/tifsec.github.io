titre: 'Séance 29 : Une synthèse d’une page avec un graphique'
themes:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
problematique: Comment rédiger une synthèse courte qui associe texte et graphique ?
competences_bo:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
objectifs:
    connaissances:
        - 'Une synthèse d’une page : titre, introduction (question), résultat illustré, conclusion, source.'
        - Le graphique Calc collé dans Writer reste lié aux données (collage spécial ou lien OLE).
    competences:
        - Insérer un graphique Calc dans Writer.
        - Rédiger une synthèse structurée.
pourquoi:
    - En S28, tu as fait un graphique des naissances par race.
    - Le directeur demande une note d’une page pour la plaquette de la MFR.
activites:
    -   id: a01
        titre: Le plan de la synthèse
        consigne: Tu vas écrire l’introduction de ta synthèse sur les naissances d’équidés, en suivant le modèle (document 1). On attend une introduction sous forme de question.
        contenu:
            -   type: liste
                elements:
                    - Titre.
                    - 'Introduction : la question posée.'
                    - 'Résultat : graphique et deux phrases chiffrées.'
                    - 'Conclusion : ce qu’on en retient pour la filière.'
                    - Source.
            -   type: etapes
                elements:
                    - Lis le modèle de synthèse (document 1).
                    - Repère les cinq parties.
                    - Écris ton introduction.
            -   type: paragraphe
                texte: Pourquoi une question en introduction ? Le lecteur sait tout de suite ce que la note va lui apprendre.
        questions:
            -   id: q01
                type: texte
                enonce: Écris l’introduction de ta synthèse (sous forme de question).
                aide: Combien d’éléments sont demandés ?
    -   id: a02
        titre: Insérer le graphique
        transition: L’introduction est écrite. Ajoute le résultat.
        consigne: Tu vas insérer ton graphique Calc dans la synthèse Writer et le légender. On attend la méthode de redimensionnement et ta légende.
        contenu:
            -   type: etapes
                elements:
                    - Dans Calc, sélectionne le graphique de S28 et copie-le (Ctrl + C).
                    - Dans Writer (2de_TIM_synthese.odt), colle-le (Ctrl + V).
                    - Redimensionne-le en gardant les proportions (Maj) ; ajoute une légende.
            -   type: paragraphe
                texte: Pourquoi garder les proportions ? Un graphique écrasé déforme les barres et trompe le lecteur (S17).
        questions:
            -   id: q01
                type: qcm
                enonce: Comment redimensionner une image sans la déformer ?
                choix:
                    -   id: a
                        texte: En tirant un coin avec la touche Maj.
                    -   id: b
                        texte: En tirant un côté.
                    -   id: c
                        texte: En changeant la police.
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: texte
                enonce: Écris la légende de ton graphique.
                aide: « = » + fonction + plage.
    -   id: a03
        titre: Conclure et vérifier
        transition: Le graphique est en place. Termine la synthèse.
        consigne: Tu vas rédiger les résultats chiffrés et la conclusion de ta synthèse, puis l’exporter en PDF. On attend tes deux phrases et ta conclusion.
        contenu:
            -   type: etapes
                elements:
                    - Écris deux phrases de résultat avec des chiffres.
                    - Écris une conclusion d’une phrase.
                    - 'Vérifie : une page, source, orthographe ; exporte en PDF.'
            -   type: paragraphe
                texte: Pourquoi une seule page ? Le directeur doit tout lire en une minute.
        questions:
            -   id: q01
                type: texte
                enonce: Recopie tes deux phrases de résultat et ta conclusion.
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un lien entre le graphique et Calc permet une mise à jour.
        questions:
            -   id: q01
                type: texte
                enonce: Quel avantage si les données changent l’an prochain ?
                aide: Combien d’éléments sont demandés ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ta synthèse est prête. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment rédiger une synthèse courte qui associe texte et graphique ?'
                aide: Reprends les mots du problème.
retenir:
    - 'Synthèse : question, résultat illustré, conclusion, source.'
    - Graphique collé sans déformation, légendé.
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
