titre: 'Séance 26 : Où trouver des chiffres fiables sur la filière cheval ?'
themes:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
    - EG4, objectif 3-2 — Situer les TIC dans l’environnement social et culturel
problematique: Où trouver des données fiables sur la filière cheval, et a-t-on le droit de les utiliser ?
competences_bo:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
    - EG4, objectif 3-2 — Situer les TIC dans l’environnement social et culturel
objectifs:
    connaissances:
        - 'Les données ouvertes (open data) sont publiées par des organismes publics : IFCE (Observatoire économique et social du cheval), Agreste, data.gouv.fr.'
        - La Licence Ouverte (Etalab) autorise la réutilisation en citant la source.
    competences:
        - Identifier une source de données fiable.
        - Lire une licence de données et citer la source.
pourquoi:
    - Depuis S10, tu as travaillé avec des données fictives.
    - Pour la fin d’année, tu utiliseras de vraies données de la filière.
activites:
    -   id: a01
        titre: Les producteurs de données
        consigne: Tu vas associer trois besoins de chiffres à la bonne source publique (document 1). On attend une source par besoin.
        contenu:
            -   type: liste
                elements:
                    - 'IFCE — Observatoire économique et social du cheval : effectifs, naissances, filière, emploi.'
                    - 'Agreste (ministère de l’Agriculture) : statistiques agricoles, surfaces, exploitations.'
                    - 'data.gouv.fr : plateforme qui rassemble les données publiques de l’État.'
            -   type: lien
                titre: IFCE — Équipédia (fiches techniques sur le cheval)
                url: https://equipedia.ifce.fr/
            -   type: lien
                titre: Agreste — statistiques agricoles du ministère
                url: https://agreste.agriculture.gouv.fr/
            -   type: lien
                titre: data.gouv.fr — plateforme des données publiques
                url: https://www.data.gouv.fr/
            -   type: etapes
                elements:
                    - Lis la présentation des trois sources (document 1).
                    - Associe chaque besoin à la bonne source.
                    - Réponds.
            -   type: paragraphe
                texte: Pourquoi une source publique ? Les chiffres sont collectés selon une méthode connue et mis à jour.
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, quelle source consulter ?
                colonnes:
                    - Besoin
                    - Source
                lignes:
                    -   - Nombre de naissances d’équidés par race
                        - ''
                    -   - Surfaces en prairie par département
                        - ''
                    -   - Un catalogue de données publiques de tous les ministères
                        - ''
                aide: Ligne × colonne.
    -   id: a02
        titre: Trouver un jeu de données
        transition: Tu connais les sources. Trouve un vrai jeu de données.
        consigne: Tu vas trouver sur data.gouv.fr un jeu de données sur les équidés et remplir sa fiche. On attend le titre, le producteur, la date et le format.
        contenu:
            -   type: etapes
                elements:
                    - Sur data.gouv.fr, cherche « équidés » ou « chevaux ».
                    - Ouvre un jeu de données de l’IFCE.
                    - 'Note : titre, producteur, date de mise à jour, format, licence.'
            -   type: paragraphe
                texte: Pourquoi noter la date ? Des chiffres de 2012 ne décrivent pas la filière d’aujourd’hui.
        questions:
            -   id: q01
                type: tableau
                enonce: Complète la fiche du jeu de données trouvé.
                colonnes:
                    - Information
                    - Valeur
                lignes:
                    -   - Titre
                        - ''
                    -   - Producteur
                        - ''
                    -   - Date de mise à jour
                        - ''
                    -   - Format
                        - ''
                aide: Ligne × colonne.
    -   id: a03
        titre: La licence
        transition: Tu as un jeu de données. As-tu le droit de l’utiliser ?
        consigne: Tu vas lire la licence du jeu de données (document 2) et écrire la mention de source. On attend ce que tu peux faire et la mention.
        contenu:
            -   type: paragraphe
                texte: 'Document 2 — Licence Ouverte (Etalab) : on peut reproduire, copier, adapter, modifier, diffuser et exploiter les données, y compris commercialement, à condition de mentionner la source et la date de dernière mise à jour.'
            -   type: etapes
                elements:
                    - Lis la licence du jeu de données (souvent Licence Ouverte / Etalab).
                    - Lis le résumé (document 2).
                    - Écris la mention de source à utiliser.
            -   type: paragraphe
                texte: Pourquoi citer ? C’est la condition de la licence, et le lecteur peut vérifier.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 2, que peux-tu faire avec ces données, et quelle mention de source écris-tu ?
                aide: « D’après le document… ».
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Les données ouvertes sont gratuites.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi l’État les publie-t-il ?
                aide: Pense à « car ».
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais où trouver des chiffres fiables. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : où trouver des données fiables sur la filière cheval, et a-t-on le droit de les utiliser ?'
                aide: Reprends les mots du problème.
retenir:
    - 'Sources : IFCE, Agreste, data.gouv.fr.'
    - 'Licence Ouverte : citer source et date.'
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
