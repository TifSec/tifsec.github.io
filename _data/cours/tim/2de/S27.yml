titre: 'Séance 27 : Ouvrir un fichier CSV dans Calc'
themes:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
problematique: Comment importer correctement un fichier de données ouvertes dans un tableur ?
competences_bo:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
objectifs:
    connaissances:
        - Un fichier CSV est un texte où les valeurs sont séparées par un caractère (virgule, point-virgule).
        - À l’import, on choisit le séparateur et l’encodage (UTF-8), puis on enregistre au format .ods.
    competences:
        - Importer un CSV avec les bons paramètres.
        - Vérifier et nettoyer les données importées.
pourquoi:
    - En S26, tu as trouvé un jeu de données au format CSV.
    - Aujourd’hui, tu l’ouvres dans Calc sans abîmer les données.
activites:
    -   id: a01
        titre: Lire un CSV
        consigne: Tu vas lire le fichier equides.csv dans un éditeur de texte pour trouver son séparateur (extrait ci-dessous). On attend le séparateur et le contenu de la première ligne.
        contenu:
            -   type: code
                texte: 'region;annee;race;naissances

                    Auvergne-Rhône-Alpes;2024;Selle Français;…

                    …'
            -   type: etapes
                elements:
                    - Ouvre le fichier fourni equides.csv avec un éditeur de texte (pas Calc).
                    - Observe la première ligne et le caractère qui sépare les valeurs.
                    - Réponds.
            -   type: paragraphe
                texte: Pourquoi regarder le texte brut ? On voit le vrai séparateur avant d’importer.
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le fichier, quel est le séparateur ?
                choix:
                    -   id: a
                        texte: Le point-virgule ;
                    -   id: b
                        texte: La virgule ,
                    -   id: c
                        texte: L’espace
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: texte
                enonce: Que contient la première ligne du fichier ?
                aide: Repère le verbe de la question.
    -   id: a02
        titre: Importer
        transition: Tu connais le séparateur. Importe le fichier.
        consigne: Tu vas importer equides.csv dans Calc avec les bons paramètres. On attend tes paramètres, le nombre de lignes et la solution à un problème d’accents.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre equides.csv avec Calc.
                    - 'Dans la fenêtre d’import : jeu de caractères UTF-8, séparateur point-virgule.'
                    - 'Vérifie l’aperçu : une valeur par colonne, accents corrects.'
                    - Clique sur OK.
            -   type: paragraphe
                texte: Pourquoi UTF-8 ? Sinon les accents deviennent des signes bizarres (« RhÃ´ne »).
        questions:
            -   id: q01
                type: texte
                enonce: Quels paramètres as-tu choisis à l’import, et combien de lignes de données compte le fichier ?
                aide: Ton idée répond-elle au besoin ?
            -   id: q02
                type: qcm
                enonce: Les accents s’affichent « Ã© ». Que faut-il changer ?
                choix:
                    -   id: a
                        texte: Le jeu de caractères (choisir UTF-8).
                    -   id: b
                        texte: Le séparateur.
                    -   id: c
                        texte: La police.
                aide: Relis l’exemple expliqué.
    -   id: a03
        titre: Vérifier et enregistrer
        transition: Les données sont importées. Vérifie-les et garde ton travail.
        consigne: Tu vas vérifier les données importées et enregistrer le fichier au format .ods. On attend la raison du choix .ods et ta vérification des nombres.
        contenu:
            -   type: etapes
                elements:
                    - Vérifie que les nombres sont alignés à droite (sinon ce sont des textes).
                    - Fige la première ligne, élargis les colonnes.
                    - 'Fichier > Enregistrer sous : format .ods, nom 2de_TIM_equides.ods.'
            -   type: paragraphe
                texte: Pourquoi .ods ? Le CSV ne garde ni mises en forme, ni formules, ni graphiques.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi enregistrer en .ods plutôt qu’en .csv après ton travail ?
                aide: Pense à « car ».
            -   id: q02
                type: texte
                enonce: Comment vérifies-tu que les naissances sont bien des nombres ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un CSV peut utiliser la virgule comme séparateur et le point pour les décimales.
        questions:
            -   id: q01
                type: texte
                enonce: Quel problème cela pose-t-il en français ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton fichier est importé proprement. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment importer correctement un fichier de données ouvertes dans un tableur ?'
                aide: Reprends les mots du problème.
retenir:
    - 'CSV : séparateur ; import UTF-8.'
    - Vérifier, puis enregistrer en .ods.
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
