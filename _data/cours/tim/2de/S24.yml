titre: 'Séance 24 : Un diaporama lisible'
themes:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
problematique: Quelles règles rendent un diaporama lisible pour tout le public ?
competences_bo:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
objectifs:
    connaissances:
        - 'Lisibilité : contraste fort (texte foncé sur fond clair ou l’inverse), police sans empattement ≥ 24, peu de couleurs.'
        - Les notes de l’orateur contiennent ce qu’on dit, pas ce qu’on montre.
    competences:
        - Appliquer un masque lisible.
        - Utiliser les notes de l’orateur.
pourquoi:
    - En S23, ton diaporama a un plan et des images.
    - Il doit être lisible du fond de la salle, et tu dois savoir quoi dire.
activites:
    -   id: a01
        titre: Contraste et taille
        consigne: Tu vas choisir la combinaison de couleurs la plus lisible pour un diaporama (document 1). On attend ton choix et le problème du rouge sur vert.
        contenu:
            -   type: liste
                elements:
                    - 'A : texte gris très foncé sur fond crème.'
                    - 'B : texte jaune sur fond blanc.'
                    - 'C : texte rouge sur fond vert.'
            -   type: etapes
                elements:
                    - Lis les trois combinaisons de couleurs (document 1).
                    - Choisis la plus lisible.
                    - Explique.
            -   type: paragraphe
                texte: 'Pourquoi le contraste ? Un vidéoprojecteur affaiblit les couleurs : un texte jaune sur blanc disparaît.'
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 1, quelle combinaison est la plus lisible ?
                choix:
                    -   id: a
                        texte: Texte gris très foncé sur fond crème.
                    -   id: b
                        texte: Texte jaune sur fond blanc.
                    -   id: c
                        texte: Texte rouge sur fond vert.
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: texte
                enonce: Pourquoi la combinaison rouge sur vert pose-t-elle un problème particulier ?
                aide: Pense à « car ».
    -   id: a02
        titre: Le masque
        transition: Tu sais ce qui est lisible. Applique-le partout.
        consigne: Tu vas régler le masque de ton diaporama de stage pour qu’il soit lisible. On attend la description de tes réglages.
        contenu:
            -   type: etapes
                elements:
                    - Affichage > Masque des diapositives.
                    - Police sans empattement, titres 40, texte 28 ; fond clair uni ; texte foncé.
                    - Ajoute ton nom en pied de page.
                    - Ferme le masque et vérifie toutes les diapositives.
            -   type: paragraphe
                texte: Pourquoi le masque ? Un seul réglage harmonise toutes les diapositives.
        questions:
            -   id: q01
                type: texte
                enonce: Décris les réglages de ton masque.
                aide: Combien d’éléments sont demandés ?
    -   id: a03
        titre: Les notes de l’orateur
        transition: Le diaporama est lisible. Prépare ce que tu diras.
        consigne: Tu vas écrire les notes de l’orateur de ton diaporama. On attend tes notes pour une diapositive.
        contenu:
            -   type: etapes
                elements:
                    - Affichage > Notes.
                    - Pour chaque diapositive, écris 2 ou 3 phrases que tu diras.
                    - Imprime ou exporte les notes (Fichier > Exporter en PDF > Notes).
            -   type: paragraphe
                texte: 'Pourquoi des notes ? Elles évitent de lire l’écran : l’écran montre, toi tu expliques.'
        questions:
            -   id: q01
                type: texte
                enonce: Recopie tes notes pour la diapositive « Mes activités ».
                aide: Repère le verbe de la question.
            -   id: q02
                type: qcm
                enonce: Qui voit les notes de l’orateur pendant la présentation ?
                choix:
                    -   id: a
                        texte: Seulement l’orateur (mode présentateur ou papier).
                    -   id: b
                        texte: Tout le public.
                    -   id: c
                        texte: Personne.
                aide: Relis l’exemple expliqué.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Les animations peuvent faire apparaître les mots-clés un par un.
        questions:
            -   id: q01
                type: texte
                enonce: Quand est-ce utile, quand est-ce gênant ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton diaporama est lisible. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quelles règles rendent un diaporama lisible pour tout le public ?'
                aide: Reprends les mots du problème.
retenir:
    - Contraste, police ≥ 24, masque.
    - Notes de l’orateur.
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
