titre: 'Séance 22 : Préparer ses photos de stage'
themes:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
problematique: Comment préparer des photos de stage pour une présentation ?
competences_bo:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
objectifs:
    connaissances:
        - 'Préparer une photo : choisir, recadrer, alléger (redimensionner), renommer.'
        - Demander l’accord du maître de stage et des personnes visibles.
    competences:
        - Recadrer et redimensionner une photo.
        - Organiser et nommer ses photos.
pourquoi:
    - Tu vas présenter ton lieu de stage en diaporama (S23 à S25).
    - 'D’abord, il faut des photos utilisables : bien cadrées, légères, autorisées.'
activites:
    -   id: a01
        titre: Choisir les photos
        consigne: Tu vas choisir 6 photos de ton stage et vérifier si elles sont nettes et autorisées. On attend la liste commentée.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre le dossier de photos de stage (les tiennes ou celles fournies).
                    - 'Garde 6 photos maximum : installations, chevaux, une activité.'
                    - 'Vérifie pour chacune : nette ? personne reconnaissable ? autorisée ?'
            -   type: paragraphe
                texte: Pourquoi 6 ? Une présentation de 5 minutes n’a pas besoin de plus.
        questions:
            -   id: q01
                type: texte
                enonce: Liste tes 6 photos choisies avec ce qu’elles montrent, et indique si une personne est reconnaissable.
                aide: Repère le verbe de la question.
    -   id: a02
        titre: Recadrer et alléger
        transition: Les photos sont choisies. Prépare-les.
        consigne: Tu vas recadrer et redimensionner une photo de stage, puis comparer les poids. On attend les poids et la nouvelle définition.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre une photo dans un logiciel d’image (GIMP ou Photos).
                    - Recadre sur le sujet.
                    - Redimensionne à 1 600 pixels de large ; exporte en JPG qualité 85.
                    - Compare les poids.
            -   type: paragraphe
                texte: Pourquoi alléger ? Six photos de 6 Mo rendent le diaporama lourd et lent à ouvrir.
        questions:
            -   id: q01
                type: texte
                enonce: Écris le poids de la photo avant et après, et sa nouvelle définition.
                aide: Combien d’éléments sont demandés ?
            -   id: q02
                type: qcm
                enonce: Que réduit le redimensionnement ?
                choix:
                    -   id: a
                        texte: Le nombre de pixels, donc le poids.
                    -   id: b
                        texte: Les couleurs.
                    -   id: c
                        texte: Rien.
                aide: Relis l’exemple expliqué.
    -   id: a03
        titre: Renommer et ranger
        transition: Les photos sont prêtes. Range-les pour les retrouver.
        consigne: Tu vas renommer et ranger tes photos de stage. On attend deux noms de fichiers et le chemin du dossier.
        contenu:
            -   type: etapes
                elements:
                    - 'Renomme chaque photo : stage_ecurie_box.jpg, stage_ecurie_paddock.jpg…'
                    - Range-les dans TIM > Stage > Photos.
                    - Prépare la demande d’accord pour les photos avec des personnes.
            -   type: paragraphe
                texte: Pourquoi renommer ? Dans Impress, tu trouveras « stage_ecurie_box » plus vite que « IMG_2045 ».
        questions:
            -   id: q01
                type: texte
                enonce: Écris deux noms de fichiers que tu as donnés et le chemin du dossier.
                aide: Combien d’éléments sont demandés ?
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Les photos de téléphone contiennent souvent la localisation (EXIF).
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi l’effacer avant de publier ?
                aide: Pense à « car ».
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tes photos sont prêtes. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment préparer des photos de stage pour une présentation ?'
                aide: Reprends les mots du problème.
retenir:
    - Choisir, recadrer, redimensionner, renommer.
    - Accord des personnes et du maître de stage.
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
