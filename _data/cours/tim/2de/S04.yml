titre: Créer un document professionnel clair et lisible
theme: TIM — Créer un document professionnel clair et lisible
problematique: Créer un document professionnel clair et lisible
pourquoi: Un document peut contenir toutes les bonnes informations et pourtant être difficile à utiliser.
application: Une fiche doit être affichée afin que les salariés et les stagiaires puissent retrouver rapidement les informations concernant un cheval.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Un document numérique est destiné à transmettre une information à un lecteur.
        - Les informations doivent être organisées et hiérarchisées.
        - La mise en forme doit faciliter la lecture et non la compliquer.
        - Une image doit être pertinente et correctement intégrée au document.
        - Un document doit être pensé pour être compréhensible et accessible au plus grand nombre.
    competences: []
activites:
    - id: a03
      titre: 1. Créer le document de la séance
      contenu:
          - type: paragraphe
            texte: Créez votre document de travail et enregistrez-le dans TIM/Travaux.
          - type: paragraphe
            texte: "Nom du fichier :"
          - type: paragraphe
            texte: 2nde_S04_NOM_Prenom
      questions: []
    - id: a04
      titre: 2. À quoi sert la mise en forme ?
      contenu:
          - type: paragraphe
            texte: Un document peut contenir toutes les bonnes informations et pourtant être difficile à utiliser.
          - type: paragraphe
            texte: "Dans votre document, répondez à cette question :"
          - type: paragraphe
            texte: Qu'est-ce qui peut rendre un document difficile ou désagréable à lire ?
          - type: paragraphe
            texte: Notez au moins trois idées.
      questions: []
    - id: a05
      titre: 3. Organiser l'information
      contenu:
          - type: paragraphe
            texte: Un document clair utilise différents niveaux d'information.
          - type: liste
            elements:
                - "Titre : indique le sujet principal du document."
                - "Sous-titre : permet de séparer les différentes parties."
                - "Texte : apporte les informations détaillées."
          - type: paragraphe
            texte: La taille, la position, le gras ou la couleur peuvent permettre de différencier ces éléments.
          - type: paragraphe
            texte: "Attention : utiliser beaucoup de couleurs, de polices ou d'effets ne rend pas forcément un document plus clair."
      questions: []
    - id: a06
      titre: 4. Quelques règles simples
      contenu:
          - type: liste
            elements:
                - Utiliser une police facile à lire.
                - Éviter de multiplier les polices différentes.
                - Créer une hiérarchie visible entre titre, sous-titres et texte.
                - Utiliser les couleurs avec modération.
                - Vérifier que le texte reste facilement lisible sur le fond.
                - Aligner correctement les éléments.
                - Ne pas déformer les images.
                - Éviter de remplir inutilement toute la page.
      questions: []
    - id: a07
      titre: 5. Situation professionnelle
      contenu:
          - type: paragraphe
            texte: Vous travaillez dans une structure équestre.
          - type: paragraphe
            texte: Une fiche doit être affichée afin que les salariés et les stagiaires puissent retrouver rapidement les informations concernant un cheval.
          - type: paragraphe
            texte: "Voici les informations disponibles :"
          - type: liste
            elements:
                - "Nom : Volcan"
                - "Âge : 9 ans"
                - "Race : Selle Français"
                - "Sexe : hongre"
                - "Robe : alezan"
                - "Activité : CSO"
                - "Granulés le matin : 2 litres"
                - "Granulés le soir : 2 litres"
                - "Foin : à volonté"
                - "Dernière vaccination : 14 mars 2026"
                - "Dernier passage du maréchal : 28 août 2026"
      questions: []
    - id: a08
      titre: "6. Mission : créer la fiche de Volcan"
      contenu:
          - type: paragraphe
            texte: Transformez votre document actuel en une fiche professionnelle permettant de retrouver facilement les informations concernant Volcan.
          - type: paragraphe
            texte: "Votre document doit comporter :"
          - type: liste
            elements:
                - un titre clairement identifiable ;
                - plusieurs parties organisées avec des sous-titres ;
                - une image fournie par le professeur ;
                - toutes les informations utiles ;
                - une mise en page claire et cohérente.
          - type: lien
            titre: une image fournie par le professeur ;
            url: https://tifsec.github.io/mfr/2nd/images/image_cheval.png
          - type: paragraphe
            texte: Vous êtes libre de choisir l'organisation de votre fiche.
          - type: paragraphe
            texte: Votre objectif n'est pas de faire le document le plus décoré possible mais celui dans lequel l'information est la plus facile à trouver.
      questions: []
    - id: a09
      titre: 7. Tester son document
      contenu:
          - type: paragraphe
            texte: Échangez votre place avec un autre élève sans lui expliquer votre document.
          - type: paragraphe
            texte: "Il doit trouver le plus rapidement possible :"
      questions:
          - id: q01
            type: texte
            enonce: Quel âge a Volcan ?
            suite: []
          - id: q02
            type: texte
            enonce: Quelle est son activité ?
            suite: []
          - id: q03
            type: texte
            enonce: Combien reçoit-il de granulés le matin ?
            suite: []
          - id: q04
            type: texte
            enonce: Quand a-t-il été vacciné pour la dernière fois ?
            suite: []
          - id: q05
            type: texte
            enonce: Quand le maréchal est-il passé ?
            suite:
                - type: paragraphe
                  texte: "Le lecteur indique ensuite :"
                - type: liste
                  elements:
                      - une chose qu'il trouve claire ;
                      - une information qu'il a eu du mal à trouver ;
                      - une amélioration qu'il proposerait.
    - id: a10
      titre: 8. Améliorer son travail
      contenu:
          - type: paragraphe
            texte: Reprenez votre place et observez les remarques de votre camarade.
          - type: paragraphe
            texte: Vous n'êtes pas obligé d'accepter toutes ses propositions.
          - type: paragraphe
            texte: Choisissez au moins une amélioration qui vous semble pertinente et modifiez votre document.
          - type: paragraphe
            texte: "En bas de votre document, écrivez :"
          - type: paragraphe
            texte: "Modification réalisée : ..."
          - type: paragraphe
            texte: Pourquoi ? ...
      questions: []
    - id: a11
      titre: 9. Penser au lecteur
      contenu:
          - type: paragraphe
            texte: Un document n'est pas créé uniquement pour celui qui l'a réalisé.
          - type: paragraphe
            texte: Il doit pouvoir être utilisé par d'autres personnes.
          - type: paragraphe
            texte: Certaines personnes peuvent par exemple rencontrer des difficultés pour lire de petits caractères, distinguer certaines couleurs ou comprendre une organisation trop complexe.
          - type: paragraphe
            texte: Créer un document accessible consiste donc aussi à penser aux personnes qui vont l'utiliser.
      questions: []
    - id: a12
      titre: À retenir
      contenu:
          - type: paragraphe
            texte: "Pour créer un document efficace :"
          - type: paragraphe
            texte: je sélectionne → j'organise → je mets en forme → je teste → j'améliore.
          - type: paragraphe
            texte: "Un document réussi n'est pas forcément celui qui contient le plus d'effets graphiques : c'est celui qui permet au lecteur de comprendre rapidement l'information."
      questions: []
    - id: a13
      titre: Travail à rendre
      contenu:
          - type: paragraphe
            texte: "Votre document doit contenir :"
          - type: liste
            elements:
                - la fiche complète de Volcan ;
                - une organisation claire des informations ;
                - l'image fournie ;
                - la modification réalisée après le test ;
                - une courte explication de cette modification.
          - type: paragraphe
            texte: "Nom du fichier à rendre : 2nde_S04_NOM_Prenom"
          - type: paragraphe
            texte: Le document doit être rendu même s'il est imparfait ou incomplet.
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
ressources:
    - type: paragraphe
      texte: Réalise les manipulations dans le logiciel demandé. Conserve tes fichiers sur ton espace habituel. Le site enregistre seulement tes réponses écrites, tes résultats, tes formules et tes démarches ; aucun fichier n’est téléversé.
introduction:
    - type: titre
      texte: "Compétence visée : Créer un contenu numérique compréhensible, structuré et adapté à son destinataire"
    - type: paragraphe
      texte: Objectifs d’apprentissage
    - type: liste
      elements:
          - Un document numérique est destiné à transmettre une information à un lecteur.
          - Les informations doivent être organisées et hiérarchisées.
          - La mise en forme doit faciliter la lecture et non la compliquer.
          - Une image doit être pertinente et correctement intégrée au document.
          - Un document doit être pensé pour être compréhensible et accessible au plus grand nombre.
    - type: paragraphe
      texte: "Ce que les élèves vont savoir faire :"
    - type: liste
      elements:
          - Créer un titre et des sous-titres.
          - Hiérarchiser des informations.
          - Modifier la mise en forme d'un texte.
          - Insérer une image.
          - Organiser une page pour faciliter la recherche d'informations.
          - Tester puis améliorer un document à partir de l'avis d'un autre utilisateur.
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://chlorofil.fr/diplomes/secondaire/bac-pro/2nde-pro
