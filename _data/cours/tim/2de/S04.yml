titre: 'Séance 4 : Un document professionnel clair et lisible'
themes:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
problematique: Quelles règles rendent un document professionnel facile à lire ?
competences_bo:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
objectifs:
    connaissances:
        - 'Règles de lisibilité : police sobre, taille 11-12, titres hiérarchisés, paragraphes courts, alignement cohérent.'
        - Les styles appliquent la même mise en forme à tous les titres.
    competences:
        - Appliquer des règles de lisibilité.
        - Utiliser les styles de titres.
pourquoi:
    - 'En stage, tu devras rédiger des documents : notes, fiches, comptes rendus.'
    - Aujourd’hui, tu transformes une note mal présentée en document professionnel.
activites:
    -   id: a01
        titre: Repérer ce qui gêne
        consigne: Tu vas repérer trois problèmes de présentation dans la note du gérant sur la sellerie (document 1). On attend trois problèmes précis.
        contenu:
            -   type: paragraphe
                texte: 'Document 1 — Note « RÈGLES DE LA SELLERIE » : écrite en police Comic, tout en majuscules, en 6 couleurs, sans titre ni paragraphe : un seul bloc de 20 lignes.'
            -   type: etapes
                elements:
                    - Lis la description de la note du gérant (document 1).
                    - Repère ce qui gêne la lecture.
                    - Cite trois problèmes.
            -   type: paragraphe
                texte: Pourquoi repérer d’abord ? On corrige mieux quand on sait précisément ce qui ne va pas.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, cite trois problèmes de présentation.
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
    -   id: a02
        titre: Mettre en forme avec les styles
        transition: Tu sais ce qui gêne. Corrige avec les styles.
        consigne: Tu vas remettre en forme la note de la sellerie avec les styles et des paragraphes courts. On attend la méthode pour changer tous les titres et les titres de niveau 2.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre le fichier fourni note_sellerie.odt ; enregistre-le dans TIM > Writer sous 2de_TIM_note-sellerie.odt.
                    - Sélectionne tout et applique « Corps de texte » ; police sobre taille 11.
                    - Applique « Titre 1 » au titre et « Titre 2 » aux trois parties (Rangement, Entretien, Sécurité).
                    - Coupe le bloc en paragraphes courts.
            -   type: paragraphe
                texte: Pourquoi les styles ? Si le gérant veut changer la couleur des titres, un seul réglage suffit.
        questions:
            -   id: q01
                type: qcm
                enonce: Tu veux que tous les titres de parties soient en vert. Que modifies-tu ?
                choix:
                    -   id: a
                        texte: Le style Titre 2.
                    -   id: b
                        texte: Chaque titre un par un.
                    -   id: c
                        texte: La police du corps de texte.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Écris les trois titres de niveau 2 de ta note.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a03
        titre: Liste à puces et vérification
        transition: La structure est claire. Finalise la note.
        consigne: Tu vas transformer les consignes de sécurité en liste à puces, vérifier la présentation et exporter en PDF. On attend ta liste.
        contenu:
            -   type: etapes
                elements:
                    - Transforme les consignes de sécurité en liste à puces.
                    - 'Vérifie : une seule police, deux couleurs maximum, pas de majuscules partout.'
                    - Exporte en PDF pour l’afficher.
            -   type: paragraphe
                texte: Pourquoi une liste à puces ? Chaque consigne se repère d’un coup d’œil.
        questions:
            -   id: q01
                type: texte
                enonce: Recopie ta liste des consignes de sécurité.
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le correcteur souligne les fautes en rouge.
        questions:
            -   id: q01
                type: texte
                enonce: Comment lancer la vérification de toute la note d’un coup ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ta note est professionnelle. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quelles règles rendent un document professionnel facile à lire ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Lisibilité : police sobre, titres, paragraphes courts, listes.'
    - Styles pour une présentation homogène.
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
