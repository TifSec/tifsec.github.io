titre: 'Séance 1 : Faire connaissance : mon positionnement en TIM'
themes:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
problematique: Quelles compétences numériques ai-je déjà, et comment le cours de TIM va-t-il fonctionner ?
competences_bo:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
objectifs:
    connaissances:
        - Le TIM de 2de professionnelle (module EG4, objectif 3) travaille les outils bureautiques, la communication et la place du numérique dans la société.
        - 'Chaque séance du site se fait en missions : « Ta mission », les étapes, puis les questions.'
    competences:
        - Se positionner sur ses compétences numériques.
        - Se repérer dans une séance du site.
pourquoi:
    - 'Tu arrives en 2de professionnelle, filière cheval : tes camarades viennent de collèges différents.'
    - Ce positionnement permet de savoir ce que chacun sait déjà faire.
activites:
    -   id: a01
        titre: Se repérer sur le site
        consigne: Tu vas découvrir comment est construite une séance du site, à partir de celle-ci. On attend où lire ta mission et le barème d’une séance.
        contenu:
            -   type: etapes
                elements:
                    - Repère en haut de la page le problème du jour.
                    - Lis l’encadré « Ta mission » de cette mission.
                    - Repère les étapes et le bouton « Un coup de pouce » sous les questions.
            -   type: paragraphe
                texte: 'Pourquoi un même déroulé partout ? Tu gagnes du temps : à chaque séance, tu sais où lire et où répondre.'
        questions:
            -   id: q01
                type: qcm
                enonce: Où lis-tu ce qu’on attend de toi dans une mission ?
                choix:
                    -   id: a
                        texte: Dans l’encadré « Ta mission ».
                    -   id: b
                        texte: Dans le titre de la page.
                    -   id: c
                        texte: Dans le défi.
                aide: 'Méthode : 1) lis toutes les réponses avant de choisir ; 2) élimine celles qui sont impossibles ; 3) vérifie ton choix avec le document ou l’exemple expliqué de la mission.'
            -   id: q02
                type: nombre
                enonce: Sur combien de points chaque séance est-elle notée ?
                unite: points
                aide: 'Méthode : 1) écris l’opération avec les nombres de l’énoncé ; 2) calcule (calculatrice autorisée) ; 3) vérifie que le résultat est vraisemblable et que l’unité est la bonne.'
    -   id: a02
        titre: Mon positionnement
        transition: Tu sais travailler sur le site. Fais maintenant le point sur ce que tu sais faire.
        consigne: Tu vas indiquer ton niveau sur quatre compétences numériques utiles en 2de. On attend un niveau honnête pour chacune.
        contenu:
            -   type: etapes
                elements:
                    - Lis chaque compétence du tableau.
                    - 'Indique ton niveau : « je sais faire », « avec aide », « jamais fait ».'
                    - 'Sois honnête : ce n’est pas noté sur le niveau, mais sur la réponse complète.'
            -   type: paragraphe
                texte: Pourquoi être honnête ? Le professeur adapte les aides à ton vrai niveau.
        questions:
            -   id: q01
                type: tableau
                enonce: Indique ton niveau pour chaque compétence.
                colonnes:
                    - Compétence
                    - Mon niveau
                lignes:
                    -   - Ranger des fichiers dans des dossiers
                        - ''
                    -   - Écrire une lettre dans un traitement de texte
                        - ''
                    -   - Faire une somme dans un tableur
                        - ''
                    -   - Créer un diaporama
                        - ''
                aide: 'Méthode : remplis une case à la fois. Pour chaque ligne, lis le début de la ligne, puis le titre de la colonne : la case est à leur croisement. Utilise les mots exacts des documents.'
    -   id: a03
        titre: Un petit test pratique
        transition: Tu as donné ton avis. Vérifions avec un exercice.
        consigne: Tu vas faire un petit exercice de calcul sur des achats de sellerie (document 1). On attend le total et la formule de tableur.
        contenu:
            -   type: tableau
                titre: Document 1 — Achats pour la sellerie (fictifs)
                colonnes:
                    - Achat
                    - Prix (€)
                lignes:
                    -   - Licol
                        - '45'
                    -   - Brosse douce
                        - '30'
                    -   - Cure-pied
                        - '12,50'
            -   type: etapes
                elements:
                    - Lis le tableau des dépenses (document 1).
                    - Calcule le total de tête ou avec la calculatrice.
                    - Réponds aux questions.
            -   type: paragraphe
                texte: 'Pourquoi un test pratique ? Il complète ton avis par une preuve : ce que tu sais vraiment faire.'
        questions:
            -   id: q01
                type: nombre
                enonce: D’après le document 1, combien coûtent au total les trois achats ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: qcm
                enonce: Pour faire ce calcul dans Calc, quelle formule écrire si les prix sont en B2, B3, B4 ?
                choix:
                    -   id: a
                        texte: =SOMME(B2:B4)
                    -   id: b
                        texte: SOMME B2 B4
                    -   id: c
                        texte: =B2:B4
                aide: Élimine d’abord les réponses impossibles.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le TIM sert aussi en stage.
        questions:
            -   id: q01
                type: texte
                enonce: Cite une tâche de ton stage où l’ordinateur ou le téléphone est utile.
                aide: 'Méthode : 1) relis la question et compte combien d’éléments sont demandés ; 2) cherche-les dans les documents ou dans « Ce que je retiens » ; 3) écris-les en phrase, un par un.'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton positionnement est fait. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quelles compétences numériques as-tu déjà, et comment fonctionne le cours de TIM ?'
                aide: 'Méthode : 1) recopie le début de la question du problème ; 2) réponds avec les mots de « Ce que je retiens » ; 3) ajoute un exemple vu aujourd’hui. Trois ou quatre phrases suffisent.'
retenir:
    - 'Une séance : « Ta mission », étapes, questions, coup de pouce.'
    - 'Positionnement : point de départ de l’année.'
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
