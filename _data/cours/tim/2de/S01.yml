titre: Faire connaissance et découvrir le fonctionnement du cours
theme: TIM — Faire connaissance et découvrir le fonctionnement du cours
problematique: Faire connaissance et découvrir le fonctionnement du cours
pourquoi: "Objectif de cette séance : En TIM, l'ordinateur est avant tout un outil permettant de chercher, réfléchir, tester, créer et communiquer."
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - En TIM, l'ordinateur est avant tout un outil permettant de chercher, réfléchir, tester, créer et communiquer.
        - Un fichier doit être enregistré à un emplacement connu et avec un nom permettant de l'identifier facilement.
        - "Il est normal de ne pas tout savoir faire : essayer, se tromper puis améliorer sa solution fait partie de l'apprentissage."
        - Chaque séance donnera lieu à la création d'un document de travail qui servira à la fois de cours, de brouillon, d'espace de test et de compte rendu.
    competences: []
activites:
    - id: a03
      titre: 1. Créer le document de la séance
      contenu:
          - type: paragraphe
            texte: Ouvrez votre traitement de texte et créez immédiatement un nouveau document.
          - type: paragraphe
            texte: "Enregistrez-le sous le nom :"
          - type: paragraphe
            texte: 2nde_S01_NOM_Prenom
          - type: paragraphe
            texte: Ce document sera utilisé pendant toute la séance. Vous devez donc l'enregistrer régulièrement.
      questions: []
    - id: a04
      titre: 2. Faisons connaissance
      contenu:
          - type: paragraphe
            texte: Avant de commencer réellement le travail informatique, nous allons prendre quelques minutes pour faire connaissance.
          - type: paragraphe
            texte: "Nous allons notamment discuter de :"
          - type: liste
            elements:
                - votre parcours ;
                - ce qui vous a amené à choisir cette formation ;
                - votre expérience avec les chevaux et le milieu hippique ;
                - vos stages ;
                - ce que vous aimeriez faire plus tard ;
                - ce que vous attendez de cette année.
      questions: []
    - id: a05
      titre: 3. Comment allons-nous travailler en TIM ?
      contenu:
          - type: paragraphe
            texte: Nous travaillerons très régulièrement sur ordinateur et nous chercherons à réaliser le plus possible des activités concrètes en lien avec votre formation.
          - type: paragraphe
            texte: Vous aurez le droit de chercher, de tester et de vous tromper.
          - type: paragraphe
            texte: "Une erreur n'est pas forcément un échec : elle peut permettre de comprendre pourquoi une solution ne fonctionne pas et comment l'améliorer."
          - type: paragraphe
            texte: "Avant de demander directement la solution au professeur :"
          - type: etapes
            elements:
                - Je lis attentivement la consigne.
                - Je réfléchis à ce que je pourrais essayer.
                - Je teste une solution.
                - J'observe le résultat.
                - Je demande de l'aide si je reste bloqué.
      questions: []
    - id: a06
      titre: 4. Mon parcours
      contenu:
          - type: paragraphe
            texte: Dans votre document, créez le titre Mon parcours, puis répondez aux questions suivantes avec des phrases courtes.
      questions:
          - id: q01
            type: texte
            enonce: Pourquoi as-tu choisi cette formation ?
            suite: []
          - id: q02
            type: texte
            enonce: Quelle expérience as-tu déjà avec les chevaux ?
            suite: []
          - id: q03
            type: texte
            enonce: As-tu déjà une structure de stage ? Si oui, quel type de structure ?
            suite: []
          - id: q04
            type: texte
            enonce: Qu'est-ce qui t'intéresse le plus dans le milieu hippique ?
            suite: []
          - id: q05
            type: texte
            enonce: Quel métier aimerais-tu exercer plus tard ?
            suite: []
          - id: q06
            type: texte
            enonce: Qu'aimerais-tu apprendre cette année ?
            suite: []
    - id: a07
      titre: 5. Moi et l'informatique
      contenu:
          - type: paragraphe
            texte: "Pour chacune des tâches suivantes, indiquez :"
          - type: liste
            elements:
                - "Vert : je sais le faire seul ;"
                - "Orange : je pense savoir le faire mais j'hésite parfois ;"
                - "Rouge : je ne sais pas encore le faire."
          - type: paragraphe
            texte: Vous pouvez utiliser des mots, des symboles ou des couleurs dans votre document.
          - type: liste
            elements:
                - Créer un dossier.
                - Créer un document.
                - Enregistrer un fichier.
                - Retrouver un fichier enregistré.
                - Télécharger un fichier.
                - Envoyer une pièce jointe.
                - Utiliser Word ou LibreOffice Writer.
                - Utiliser Excel ou LibreOffice Calc.
                - Créer un diaporama.
                - Insérer une image dans un document.
                - Faire une capture d'écran.
                - Rechercher une information sur Internet.
      questions: []
    - id: a08
      titre: 6. Première mission informatique
      contenu:
          - type: paragraphe
            texte: "Dans votre espace personnel, créez un dossier nommé :"
          - type: paragraphe
            texte: nom_prenom
          - type: paragraphe
            texte: "À l'intérieur de ce dossier, créez un sous-dossier nommé :"
          - type: paragraphe
            texte: TIM
          - type: paragraphe
            texte: "À l'intérieur, créez les quatre dossiers suivants :"
          - type: liste
            elements:
                - Cours
                - Travaux
                - Documents
                - Images
          - type: paragraphe
            texte: Déplacez ensuite le document de cette séance dans le dossier Travaux.
      questions: []
    - id: a09
      titre: À retenir
      contenu:
          - type: paragraphe
            texte: En TIM, nous chercherons avant tout à devenir autonomes avec les outils numériques.
          - type: paragraphe
            texte: "Pour apprendre, nous allons régulièrement suivre cette démarche :"
          - type: paragraphe
            texte: Réfléchir → essayer → observer → corriger → améliorer.
      questions: []
    - id: a10
      titre: Travail à rendre
      contenu:
          - type: paragraphe
            texte: Enregistrez une dernière fois votre document et vérifiez son emplacement.
          - type: paragraphe
            texte: "Nom du fichier à rendre : 2nde_S01_NOM_Prenom"
          - type: paragraphe
            texte: Le document doit être rendu même s'il n'est pas terminé.
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
ressources:
    - type: paragraphe
      texte: Réalise les manipulations dans le logiciel demandé. Conserve tes fichiers sur ton espace habituel. Le site enregistre seulement tes réponses écrites, tes résultats, tes formules et tes démarches ; aucun fichier n’est téléversé.
introduction:
    - type: titre
      texte: "Compétence visée : Prendre en main son environnement numérique et commencer à travailler de manière autonome"
    - type: paragraphe
      texte: Objectifs d’apprentissage
    - type: liste
      elements:
          - En TIM, l'ordinateur est avant tout un outil permettant de chercher, réfléchir, tester, créer et communiquer.
          - Un fichier doit être enregistré à un emplacement connu et avec un nom permettant de l'identifier facilement.
          - "Il est normal de ne pas tout savoir faire : essayer, se tromper puis améliorer sa solution fait partie de l'apprentissage."
          - Chaque séance donnera lieu à la création d'un document de travail qui servira à la fois de cours, de brouillon, d'espace de test et de compte rendu.
    - type: paragraphe
      texte: "Ce que les élèves vont savoir faire :"
    - type: liste
      elements:
          - Créer un document avec un traitement de texte.
          - Enregistrer un fichier dans un dossier précis.
          - Donner un nom correct à un fichier.
          - Présenter simplement leur parcours, leurs projets et leurs compétences numériques actuelles.
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://chlorofil.fr/diplomes/secondaire/bac-pro/2nde-pro
