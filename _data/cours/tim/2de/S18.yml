titre: 'Séance 18 : Que sait un site sur moi quand je me connecte ?'
themes:
    - EG4, objectif 3-2 — Situer les TIC dans l’environnement social et culturel
problematique: Quelles informations un site recueille-t-il quand je le visite, et comment limiter ce suivi ?
competences_bo:
    - EG4, objectif 3-2 — Situer les TIC dans l’environnement social et culturel
objectifs:
    connaissances:
        - En se connectant, l’ordinateur transmet son adresse IP, son navigateur, la langue, la page d’origine.
        - Traceurs et cookies tiers permettent de suivre un internaute d’un site à l’autre ; le RGPD impose le consentement.
    competences:
        - Identifier les données transmises automatiquement.
        - Régler les cookies d’un site.
pourquoi:
    - En S08, tu as vu l’historique et les cookies.
    - Mais que sait un site dès la première seconde ?
activites:
    -   id: a01
        titre: Les informations transmises
        consigne: Tu vas associer les informations transmises à un site (document 1) à ce qu’elles révèlent de toi. On attend trois associations.
        contenu:
            -   type: liste
                elements:
                    - Adresse IP de la connexion.
                    - Type et version du navigateur, système d’exploitation.
                    - Langue préférée.
                    - Page d’origine (le site où l’on a cliqué sur le lien).
                    - Date et heure.
            -   type: etapes
                elements:
                    - 'Lis le document 1 : ce qu’un serveur reçoit à chaque visite.'
                    - Associe chaque information à ce qu’elle révèle.
                    - Réponds.
                    - Pourquoi ces informations ? Elles servent à afficher la page correctement, mais aussi à profiler l’internaute.
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, que révèle chaque information ?
                colonnes:
                    - Information transmise
                    - Ce qu’elle révèle
                lignes:
                    -   - Adresse IP
                        - ''
                    -   - Page d’origine (référent)
                        - ''
                    -   - Langue du navigateur
                        - ''
                aide: 'Pour chaque information du document 1 : que peut deviner le site sur toi (où tu es, d’où tu viens, ta langue) ?'
    -   id: a02
        titre: Le bandeau de cookies
        transition: Ces informations partent toujours. Les cookies, eux, se règlent.
        consigne: Tu vas lire le bandeau de cookies d’un site et refuser les cookies publicitaires. On attend le nombre de partenaires et les catégories refusées.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre un site d’annonces équestres (ou l’exemple fourni).
                    - Lis le bandeau de cookies.
                    - Clique sur « Paramétrer » et refuse les cookies publicitaires.
                    - Pourquoi paramétrer ? « Tout accepter » autorise souvent des dizaines de partenaires publicitaires.
        questions:
            -   id: q01
                type: texte
                enonce: Combien de partenaires le site annonce-t-il, et quelles catégories as-tu refusées ?
                aide: 'Ouvre le détail du bandeau de cookies : le nombre de partenaires est écrit. Note les catégories que tu as décochées.'
            -   id: q02
                type: qcm
                enonce: Le RGPD permet-il à un site d’imposer les cookies publicitaires ?
                choix:
                    -   id: a
                        texte: Non, il faut le consentement libre de l’internaute.
                    -   id: b
                        texte: Oui, toujours.
                    -   id: c
                        texte: Seulement aux mineurs.
                aide: Le RGPD dit que tu dois pouvoir choisir. Peut-on t’imposer la publicité ciblée ?
    -   id: a03
        titre: Mes réglages
        transition: Tu as réglé un site. Règle maintenant ton navigateur.
        consigne: Tu vas activer le blocage des traceurs dans les paramètres de ton navigateur. On attend le chemin et le réglage choisi.
        contenu:
            -   type: etapes
                elements:
                    - Dans les paramètres du navigateur, cherche « Confidentialité ».
                    - Active le blocage des traceurs et cookies tiers.
                    - Note le chemin des réglages.
                    - Pourquoi le navigateur ? Il bloque le suivi sur tous les sites d’un coup.
        questions:
            -   id: q01
                type: texte
                enonce: Écris le chemin des réglages de confidentialité et le réglage choisi.
                aide: 'Ouvre les paramètres de ton navigateur, puis la partie vie privée : recopie le chemin des menus et le réglage choisi.'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un VPN masque l’adresse IP au site visité.
        questions:
            -   id: q01
                type: texte
                enonce: Qui voit alors ta connexion à sa place ?
                aide: Avec un VPN, ta connexion passe par un autre serveur avant d’aller sur le site. À qui appartient ce serveur ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais ce que les sites savent de toi. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quelles informations un site recueille-t-il quand tu le visites, et comment limiter ce suivi ?'
                aide: Dis ce que le site reçoit sans rien demander, ce que font les cookies, et les réglages qui limitent le suivi.
retenir:
    - 'Transmis à chaque visite : IP, navigateur, langue, origine.'
    - 'Cookies : consentement ; bloquer les traceurs.'
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
