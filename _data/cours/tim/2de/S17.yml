titre: 'Séance 17 : Ce graphique dit-il la vérité ?'
themes:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
    - EG4, objectif 3-2 — Situer les TIC dans l’environnement social et culturel
problematique: Comment repérer un graphique trompeur ?
competences_bo:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
    - EG4, objectif 3-2 — Situer les TIC dans l’environnement social et culturel
objectifs:
    connaissances:
        - 'Un graphique peut tromper : axe qui ne commence pas à zéro, échelle irrégulière, effet 3D, absence de source.'
        - 'Lire un graphique de façon critique : titre, axes, unités, source, échelle.'
    competences:
        - Repérer les procédés trompeurs.
        - Corriger un graphique.
pourquoi:
    - En S15 et S16, tu as construit des graphiques honnêtes.
    - Mais dans la presse ou la publicité, certains graphiques exagèrent.
activites:
    -   id: a01
        titre: L’axe tronqué
        consigne: Tu vas analyser un graphique publicitaire sur deux aliments pour chevaux (document 1, inventé). On attend la vraie différence et ce qui trompe.
        contenu:
            -   type: paragraphe
                texte: 'Document 1 — Publicité pour l’aliment A : « Digestibilité : aliment A 88 %, aliment B 86 %. » Le graphique en barres a un axe vertical qui va de 85 % à 89 % : la barre A paraît trois fois plus haute que la barre B. Aucune source n’est indiquée.'
            -   type: paragraphe
                texte: Exemple inventé.
            -   type: etapes
                elements:
                    - Lis la description du graphique publicitaire (document 1).
                    - Calcule la vraie différence en pourcentage.
                    - Compare avec l’impression donnée.
            -   type: paragraphe
                texte: 'Pourquoi tronquer l’axe ? Une petite différence paraît énorme : c’est un argument de vente.'
        questions:
            -   id: q01
                type: nombre
                enonce: D’après le document 1, de combien de pourcentage l’aliment A est-il plus digestible que le B (en points) ?
                unite: points
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: texte
                enonce: Pourquoi le graphique donne-t-il l’impression d’une énorme différence ?
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a02
        titre: La grille critique
        transition: Tu as repéré un piège. Utilise une méthode complète.
        consigne: Tu vas appliquer la grille de lecture critique (document 2) au graphique publicitaire. On attend trois réponses de la grille.
        contenu:
            -   type: liste
                elements:
                    - Titre clair ?
                    - Axes nommés avec unités ?
                    - L’axe des valeurs commence-t-il à 0 ?
                    - Échelle régulière ?
                    - Source indiquée ?
                    - Qui a fait le graphique, et dans quel but ?
            -   type: etapes
                elements:
                    - Lis la grille (document 2).
                    - Applique-la au graphique du document 1.
                    - Remplis.
            -   type: paragraphe
                texte: Pourquoi une grille ? On n’oublie aucun piège.
        questions:
            -   id: q01
                type: tableau
                enonce: Applique la grille au graphique du document 1.
                colonnes:
                    - Question
                    - Réponse
                lignes:
                    -   - L’axe commence-t-il à 0 ?
                        - ''
                    -   - La source est-elle indiquée ?
                        - ''
                    -   - Qui a intérêt à ce graphique ?
                        - ''
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a03
        titre: Corriger
        transition: Le graphique est trompeur. Fais la version honnête.
        consigne: Tu vas refaire dans Calc le graphique des deux aliments avec un axe qui commence à 0. On attend la description du graphique corrigé et le constat.
        contenu:
            -   type: etapes
                elements:
                    - Dans Calc, saisis les deux valeurs (88 et 86).
                    - Fais un diagramme en barres avec l’axe de 0 à 100 %.
                    - Compare avec la publicité.
            -   type: paragraphe
                texte: 'Pourquoi refaire le graphique ? Tu montres la réalité : une différence minime.'
        questions:
            -   id: q01
                type: texte
                enonce: Décris ton graphique corrigé et la différence que l’on voit maintenant.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un graphique en 3D incliné déforme les secteurs.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais repérer un graphique trompeur. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment repérer un graphique trompeur ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Pièges : axe tronqué, échelle, 3D, pas de source.'
    - Grille de lecture critique.
sources:
