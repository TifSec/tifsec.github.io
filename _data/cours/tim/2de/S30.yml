titre: 'Séance 30 : Mon bilan de 2de en TIM'
themes:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
    - EG4, objectif 3-2 — Situer les TIC dans l’environnement social et culturel
problematique: Qu’ai-je appris en TIM cette année, et que dois-je travailler pour la 1re ?
competences_bo:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
    - EG4, objectif 3-2 — Situer les TIC dans l’environnement social et culturel
objectifs:
    connaissances:
        - 'Le TIM de 2de : bureautique (Writer, Calc, Impress), communication, citoyenneté numérique.'
        - En 1re, le TIM servira un projet de données (MG1, C1.2).
    competences:
        - Se positionner en fin d’année.
        - Fixer un objectif pour la 1re.
pourquoi:
    - En S01, tu as fait ton positionnement d’entrée.
    - Aujourd’hui, tu compares et tu prépares la 1re.
activites:
    -   id: a01
        titre: Mon positionnement de fin d’année
        consigne: Tu vas comparer ton niveau de début et de fin d’année sur quatre compétences. On attend les deux niveaux pour chacune.
        contenu:
            -   type: etapes
                elements:
                    - Reprends les compétences de S01.
                    - Indique ton niveau aujourd’hui.
                    - Compare avec ton niveau de début d’année.
            -   type: paragraphe
                texte: Pourquoi comparer ? Tu mesures tes progrès réels.
        questions:
            -   id: q01
                type: tableau
                enonce: Indique ton niveau en début et en fin d’année.
                colonnes:
                    - Compétence
                    - Début → fin
                lignes:
                    -   - Ranger des fichiers
                        - ''
                    -   - Écrire une lettre professionnelle
                        - ''
                    -   - Faire des calculs dans un tableur
                        - ''
                    -   - Créer un diaporama
                        - ''
                aide: Ligne × colonne.
    -   id: a02
        titre: Mes réalisations
        transition: Tu as mesuré tes progrès. Regarde tes réalisations.
        consigne: Tu vas choisir tes deux meilleures réalisations de TIM et dire quelle compétence chacune montre. On attend deux réalisations expliquées.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre ton dossier TIM.
                    - Choisis tes deux réalisations les plus réussies.
                    - Explique ce qu’elles montrent.
            -   type: paragraphe
                texte: Pourquoi choisir ? Tes meilleures réalisations peuvent servir en entretien ou dans ton dossier de stage.
        questions:
            -   id: q01
                type: texte
                enonce: Quelles sont tes deux meilleures réalisations de l’année, et quelle compétence montre chacune ?
                aide: Repère le verbe de la question.
    -   id: a03
        titre: Objectif 1re
        transition: Tu connais tes points forts. Prépare la 1re.
        consigne: Tu vas te fixer un objectif de TIM pour la 1re en lisant ce qui t’attend (document). On attend un objectif et un moyen de l’atteindre.
        contenu:
            -   type: liste
                elements:
                    - 'En 1re : un projet de données sur la filière cheval.'
                    - 'Tableur : SI, tableaux croisés, graphiques avancés.'
                    - Rédaction d’un rapport et présentation orale.
            -   type: lien
                titre: Pix — tester et développer ses compétences numériques
                url: https://pix.fr/
            -   type: etapes
                elements:
                    - Lis ce qui t’attend en 1re (projet de données de la filière).
                    - Choisis la compétence à renforcer.
                    - Écris ton objectif.
            -   type: paragraphe
                texte: 'Pourquoi un objectif ? En 1re, tu mèneras un projet en autonomie : mieux vaut savoir où tu dois progresser.'
        questions:
            -   id: q01
                type: texte
                enonce: Écris ton objectif de TIM pour la 1re et comment tu vas l’atteindre.
                aide: Combien d’éléments sont demandés ?
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Pix propose des parcours d’entraînement.
        questions:
            -   id: q01
                type: texte
                enonce: Quel domaine Pix travaillerais-tu cet été ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton bilan est fait. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : qu’as-tu appris en TIM cette année, et que dois-tu travailler pour la 1re ?'
                aide: Reprends les mots du problème.
retenir:
    - 'Bilan : Writer, Calc, Impress, communication, citoyenneté numérique.'
    - Objectif pour la 1re.
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
