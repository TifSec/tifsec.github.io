titre: 'Séance 8 : Que dit une adresse internet ?'
themes:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
    - EG4, objectif 3-2 — Situer les TIC dans l’environnement social et culturel
problematique: Comment lire une adresse internet et maîtriser ce que le navigateur garde de ma navigation ?
competences_bo:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
    - EG4, objectif 3-2 — Situer les TIC dans l’environnement social et culturel
objectifs:
    connaissances:
        - 'Une URL se lit : protocole (https), nom de domaine (ifce.fr), chemin (/page).'
        - Le navigateur garde l’historique, les cookies et les mots de passe ; la navigation privée ne les garde pas après fermeture, mais ne rend pas anonyme.
    competences:
        - Décomposer une URL.
        - Gérer favoris, historique et cookies.
pourquoi:
    - En S03, tu as protégé ton poste.
    - 'Sur internet, l’adresse d’une page donne beaucoup d’indices : à qui appartient le site, s’il est sécurisé.'
activites:
    -   id: a01
        titre: Décomposer une adresse
        consigne: Tu vas décomposer l’adresse d’une page d’Équipédia (document 1) en protocole, domaine et chemin. On attend les trois parties.
        contenu:
            -   type: code
                texte: https://equipedia.ifce.fr/sante-et-bien-etre-animal
            -   type: etapes
                elements:
                    - Lis l’adresse du document 1.
                    - Repère le protocole, le nom de domaine et le chemin.
                    - Remplis le tableau.
            -   type: paragraphe
                texte: Pourquoi le nom de domaine ? C’est lui qui dit à qui appartient le site.
        questions:
            -   id: q01
                type: tableau
                enonce: Décompose l’adresse du document 1.
                colonnes:
                    - Partie
                    - Valeur
                lignes:
                    -   - Protocole
                        - ''
                    -   - Nom de domaine
                        - ''
                    -   - Chemin
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: Favoris et historique
        transition: Tu sais lire une adresse. Garde ou efface tes traces.
        consigne: Tu vas utiliser les favoris et l’historique du navigateur, puis effacer l’historique récent. On attend le raccourci des favoris et pourquoi effacer sur un poste partagé.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Équipédia et ajoute la page en favori (étoile ou Ctrl + D).
                    - Ouvre l’historique (Ctrl + H) et retrouve une page de la séance.
                    - Supprime l’historique de la dernière heure.
            -   type: paragraphe
                texte: Pourquoi supprimer l’historique ? Sur un poste partagé, les suivants verraient tes visites.
        questions:
            -   id: q01
                type: qcm
                enonce: Quel raccourci ajoute la page aux favoris ?
                choix:
                    -   id: a
                        texte: Ctrl + D
                    -   id: b
                        texte: Ctrl + H
                    -   id: c
                        texte: Ctrl + P
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Sur l’ordinateur de l’écurie, pourquoi effacer ton historique après usage ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a03
        titre: Cookies et navigation privée
        transition: L’historique est maîtrisé. Reste les cookies.
        consigne: Tu vas découvrir le rôle des cookies (document 2) et ce que fait vraiment la navigation privée. On attend le rôle d’un cookie publicitaire et la limite de la navigation privée.
        contenu:
            -   type: paragraphe
                texte: Document 2 — Un cookie est un petit fichier déposé par un site. Certains sont utiles (garder un panier, rester connecté). D’autres, publicitaires, suivent la navigation d’un site à l’autre pour cibler des publicités. Le site doit demander ton accord pour ces derniers.
            -   type: etapes
                elements:
                    - Lis le document 2 sur les cookies.
                    - Ouvre une fenêtre de navigation privée (Ctrl + Maj + N ou P).
                    - Réponds.
            -   type: paragraphe
                texte: Pourquoi « privée » ne veut pas dire « anonyme » ? Le site, la box et l’établissement voient toujours la connexion.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 2, à quoi sert un cookie publicitaire ?
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
            -   id: q02
                type: qcm
                enonce: En navigation privée, l’établissement peut-il savoir quels sites tu visites ?
                choix:
                    -   id: a
                        texte: 'Oui : seul l’ordinateur n’enregistre rien.'
                    -   id: b
                        texte: Non, c’est anonyme.
                    -   id: c
                        texte: Seulement le dimanche.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un site affiche un cadenas devant l’adresse.
        questions:
            -   id: q01
                type: texte
                enonce: Que garantit-il, et que ne garantit-il pas ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais lire une adresse et gérer ta navigation. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment lire une adresse internet et maîtriser ce que le navigateur garde ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'URL : protocole, domaine, chemin.'
    - Historique, cookies, navigation privée (pas anonyme).
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
