titre: 'Séance 15 : Quel graphique pour les races de l’écurie ?'
themes:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
problematique: Comment choisir un graphique adapté à des données qualitatives ?
competences_bo:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
objectifs:
    connaissances:
        - Une variable qualitative a des modalités (race, robe) ; on la représente par un diagramme en barres ou en secteurs.
        - Les secteurs montrent des parts d’un tout ; les barres comparent des effectifs.
    competences:
        - Calculer des effectifs avec NB.SI.
        - Créer un diagramme en barres et en secteurs.
pourquoi:
    - En S14, tu as calculé des parts en pourcentage.
    - 'Le club veut présenter son cheptel : combien de chevaux de chaque race ?'
activites:
    -   id: a01
        titre: Compter par race
        consigne: Tu vas compter le nombre d’équidés de chaque race du cheptel avec la fonction NB.SI. On attend le nombre de Selle Français et une formule.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre le fichier fourni cheptel.ods (20 équidés).
                    - En F2, écris =NB.SI(B2:B21;"Selle Français").
                    - Fais de même pour les autres races.
            -   type: paragraphe
                texte: Pourquoi NB.SI ? Compter à la main 20 lignes est long et on se trompe ; NB.SI compte selon un critère.
        questions:
            -   id: q01
                type: nombre
                enonce: Combien de Selle Français compte le cheptel ?
                unite: chevaux
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: texte
                enonce: Écris la formule qui compte les Shetland.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a02
        titre: Barres ou secteurs ?
        transition: Tu as les effectifs. Représente-les.
        consigne: Tu vas créer un diagramme en barres et un en secteurs avec les effectifs par race, puis choisir le plus adapté à deux messages. On attend un graphique par message.
        contenu:
            -   type: etapes
                elements:
                    - Sélectionne le tableau des effectifs.
                    - Insère un diagramme en barres, puis un diagramme en secteurs.
                    - Ajoute titres et étiquettes de données.
            -   type: paragraphe
                texte: Pourquoi deux graphiques ? Tu compares ce que chacun montre le mieux.
        questions:
            -   id: q01
                type: tableau
                enonce: Quel graphique choisir pour chaque message ?
                colonnes:
                    - Message
                    - Graphique
                lignes:
                    -   - « Les Selle Français sont les plus nombreux »
                        - ''
                    -   - « Les poneys représentent un tiers du cheptel »
                        - ''
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a03
        titre: Un graphique complet
        transition: Le bon graphique est choisi. Rends-le complet.
        consigne: Tu vas compléter ton graphique (titre, étiquettes, source) et l’accompagner d’une phrase de commentaire. On attend une phrase avec un chiffre précis.
        contenu:
            -   type: etapes
                elements:
                    - 'Vérifie : titre, légende ou étiquettes, source.'
                    - 'Ajoute la source sous le graphique : « Source : registre du club, 2026 (fictif) ».'
                    - Copie le graphique dans un document Writer avec une phrase de commentaire.
            -   type: paragraphe
                texte: Pourquoi une source ? Le lecteur sait d’où viennent les chiffres et peut les vérifier.
        questions:
            -   id: q01
                type: texte
                enonce: Écris la phrase de commentaire qui accompagne ton graphique.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un diagramme en secteurs avec 12 races devient illisible.
        questions:
            -   id: q01
                type: texte
                enonce: Que proposes-tu ?
                aide: Une idée réaliste + « Cela permet de… ».
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton graphique présente le cheptel. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment choisir un graphique adapté à des données qualitatives ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Qualitative : barres (comparer) ou secteurs (parts).'
    - NB.SI ; titre, étiquettes, source.
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
