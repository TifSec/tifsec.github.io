titre: 'Séance 5 : La fiche d’identité d’un cheval dans un tableau'
themes:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
problematique: Comment présenter les informations d’identification d’un cheval dans un tableau clair ?
competences_bo:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
objectifs:
    connaissances:
        - 'L’identification d’un équidé comprend : nom, race, sexe, robe, date de naissance, numéro SIRE et numéro de transpondeur (puce).'
        - Un tableau Writer à deux colonnes (rubrique / valeur) présente une fiche lisible.
    competences:
        - Insérer et mettre en forme un tableau dans Writer.
        - Connaître les rubriques de l’identification d’un équidé.
pourquoi:
    - En S04, tu as mis en forme une note.
    - 'À l’écurie, chaque cheval a une fiche d’identité : on la retrouve dans son livret.'
activites:
    -   id: a01
        titre: Les informations d’identification
        consigne: Tu vas relever dans un extrait d’Équipédia (document 1) les informations qui identifient un équidé. On attend quatre informations.
        contenu:
            -   type: citation
                texte: 'Document 1 — Extrait adapté d’Équipédia : « Tout équidé doit être identifié : il reçoit un numéro unique (UELN / SIRE), un transpondeur électronique est posé et un signalement est relevé. Ces informations figurent dans son document d’identification. »'
            -   type: lien
                titre: IFCE — Équipédia (fiches techniques sur le cheval)
                url: https://equipedia.ifce.fr/
            -   type: etapes
                elements:
                    - Lis l’extrait d’Équipédia sur l’identification (document 1).
                    - Repère les informations obligatoires.
                    - Réponds.
            -   type: paragraphe
                texte: 'Pourquoi identifier ? Chaque équidé doit être enregistré : c’est une obligation légale, pour la traçabilité sanitaire.'
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, cite quatre informations qui identifient un équidé.
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
    -   id: a02
        titre: Construire la fiche
        transition: Tu connais les rubriques. Construis la fiche.
        consigne: Tu vas construire dans Writer la fiche d’identité de Belle de Mai dans un tableau à deux colonnes (données fictives du document 2). On attend trois lignes de ta fiche.
        contenu:
            -   type: paragraphe
                texte: 'Document 2 — Données fictives : Belle de Mai, Selle Français, jument, baie, née le 12/04/2016, SIRE 250001X12345678, transpondeur 250259800000000.'
            -   type: paragraphe
                texte: Données fictives créées pour l’exercice.
            -   type: etapes
                elements:
                    - Ouvre Writer ; enregistre sous 2de_TIM_fiche-cheval.odt.
                    - 'Titre 1 : « Fiche d’identité ».'
                    - 'Insère un tableau de 2 colonnes et 7 lignes : Nom, Race, Sexe, Robe, Date de naissance, N° SIRE, Transpondeur.'
                    - Remplis avec les données fictives du document 2.
            -   type: paragraphe
                texte: 'Pourquoi deux colonnes ? À gauche la question, à droite la réponse : on lit chaque ligne comme une phrase.'
        questions:
            -   id: q01
                type: tableau
                enonce: Recopie trois lignes de ta fiche.
                colonnes:
                    - Rubrique
                    - Valeur
                lignes:
                    -   - Nom
                        - ''
                    -   - Robe
                        - ''
                    -   - N° SIRE
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a03
        titre: Mettre en forme le tableau
        transition: La fiche est remplie. Rends-la agréable à lire.
        consigne: Tu vas mettre en forme le tableau de la fiche et ajouter une photo légendée. On attend deux mises en forme expliquées et le choix d’une couleur de fond.
        contenu:
            -   type: etapes
                elements:
                    - Mets la première colonne en gras sur fond gris clair.
                    - Ajuste la largeur de la première colonne.
                    - Insère une photo de cheval libre de droits à côté (ou au-dessus) avec une légende.
                    - Exporte en PDF.
            -   type: paragraphe
                texte: Pourquoi un fond clair et pas foncé ? Le texte noir reste lisible, à l’écran comme à l’impression.
        questions:
            -   id: q01
                type: texte
                enonce: Décris deux mises en forme de ton tableau et leur utilité.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
            -   id: q02
                type: qcm
                enonce: Quelle couleur de fond garde le texte noir lisible ?
                choix:
                    -   id: a
                        texte: Gris clair
                    -   id: b
                        texte: Bleu marine
                    -   id: c
                        texte: Noir
                aide: Élimine d’abord les réponses impossibles.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le numéro de transpondeur se lit avec un lecteur.
        questions:
            -   id: q01
                type: texte
                enonce: À quoi sert-il lors d’un contrôle ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ta fiche est prête. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment présenter les informations d’identification d’un cheval dans un tableau clair ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Identification : nom, SIRE/UELN, transpondeur, signalement.'
    - 'Tableau Writer : rubrique / valeur.'
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
