titre: 'Séance 28 : Combien d’équidés dans notre région ?'
themes:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
problematique: Comment extraire et représenter une information d’un grand fichier de données ?
competences_bo:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
objectifs:
    connaissances:
        - Filtrer garde les lignes utiles ; trier les classe ; SOMME.SI additionne selon un critère.
        - Un graphique sourcé résume le résultat.
    competences:
        - Filtrer et trier un grand tableau.
        - Calculer un total selon un critère et le représenter.
pourquoi:
    - En S27, tu as importé equides.csv.
    - 'Question du jour : quelles races naissent le plus dans notre région ?'
activites:
    -   id: a01
        titre: Filtrer la région
        consigne: Tu vas filtrer le fichier des naissances d’équidés pour ne garder que notre région et l’année la plus récente. On attend le nombre de lignes et l’année.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre 2de_TIM_equides.ods.
                    - Données > AutoFiltre ; dans « region », garde Auvergne-Rhône-Alpes.
                    - Dans « annee », garde la plus récente.
                    - Lis le nombre de lignes affichées.
            -   type: paragraphe
                texte: 'Pourquoi filtrer ? Le fichier couvre toute la France et plusieurs années : on ne garde que ce qui répond à la question.'
        questions:
            -   id: q01
                type: texte
                enonce: Combien de lignes restent après les deux filtres, et quelle année as-tu gardée ?
                aide: Repère le verbe de la question.
    -   id: a02
        titre: Trier et totaliser
        transition: Les lignes utiles sont isolées. Classe-les.
        consigne: Tu vas trier les naissances de la région et calculer leur total avec SOMME.SI. On attend les trois premières races et le total.
        contenu:
            -   type: etapes
                elements:
                    - Trie les lignes filtrées par naissances, ordre décroissant.
                    - Note les trois races les plus représentées.
                    - Sur une autre feuille, calcule le total régional avec =SOMME.SI(A:A;"Auvergne-Rhône-Alpes";D:D) (adapter aux colonnes).
            -   type: paragraphe
                texte: Pourquoi SOMME.SI ? Il additionne seulement les lignes qui respectent un critère, sans avoir à filtrer.
        questions:
            -   id: q01
                type: texte
                enonce: Écris les trois races les plus représentées et le total des naissances de la région.
                aide: Combien d’éléments sont demandés ?
    -   id: a03
        titre: Le graphique sourcé
        transition: Tu as les chiffres. Montre-les.
        consigne: Tu vas faire un graphique sourcé des 5 races les plus nées dans la région et le commenter. On attend le titre, la source et un commentaire chiffré.
        contenu:
            -   type: etapes
                elements:
                    - Fais un diagramme en barres des 5 races les plus représentées.
                    - Titre, axe avec unité (nombre de naissances), étiquettes.
                    - 'Ajoute la source : « Source : IFCE, data.gouv.fr, [année] ».'
            -   type: paragraphe
                texte: Pourquoi les 5 premières ? Avec 40 races, le graphique serait illisible.
        questions:
            -   id: q01
                type: texte
                enonce: Écris le titre et la source de ton graphique, et une phrase qui le commente.
                aide: « = » + fonction + plage.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le tableau croisé dynamique résume un fichier en quelques clics.
        questions:
            -   id: q01
                type: texte
                enonce: Quel serait son intérêt ici ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as extrait une vraie information. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment extraire et représenter une information d’un grand fichier de données ?'
                aide: Reprends les mots du problème.
retenir:
    - Filtrer, trier, SOMME.SI.
    - 'Graphique : titre, unité, source, commentaire.'
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
