titre: 'Séance 20 : Mon e-réputation de futur professionnel du cheval'
themes:
    - EG4, objectif 3-2 — Situer les TIC dans l’environnement social et culturel
problematique: Comment gérer son identité numérique quand on veut travailler dans la filière cheval ?
competences_bo:
    - EG4, objectif 3-2 — Situer les TIC dans l’environnement social et culturel
objectifs:
    connaissances:
        - 'L’identité numérique : ce qu’on publie, ce que les autres publient sur nous, ce que les moteurs de recherche affichent.'
        - Un employeur ou un client peut chercher ton nom avant de t’embaucher ou de te confier son cheval.
    competences:
        - Analyser une identité numérique.
        - Régler la confidentialité d’un compte.
pourquoi:
    - En S19, tu as protégé tes comptes contre les escrocs.
    - Mais ce que tu publies toi-même peut aussi te nuire… ou t’aider.
activites:
    -   id: a01
        titre: Le profil d’un candidat
        consigne: Tu vas comparer ce qu’un employeur trouve en ligne sur deux candidats à un poste en écurie (document 1). On attend le candidat préféré et deux raisons.
        contenu:
            -   type: liste
                elements:
                    - 'Enzo : photo publique où il monte sans casque un cheval en sueur ; commentaire insultant envers un juge de concours.'
                    - 'Jade : vidéo d’un pansage soigné ; résultats de concours sur la page de son club ; profil privé pour le reste.'
            -   type: etapes
                elements:
                    - Lis ce qu’un employeur trouve sur deux candidats (document 1).
                    - Repère ce qui peut nuire et ce qui peut aider.
                    - Choisis.
            -   type: paragraphe
                texte: Pourquoi un employeur cherche ? Il veut savoir à qui il confie ses chevaux, ses clients et son image.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, quel candidat l’écurie va-t-elle préférer ? Donne deux raisons.
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
    -   id: a02
        titre: Régler mes comptes
        transition: Tu sais ce qui nuit. Règle tes comptes.
        consigne: Tu vas repérer trois réglages de confidentialité sur un réseau social. On attend chaque réglage et son effet.
        contenu:
            -   type: etapes
                elements:
                    - Choisis un réseau social que tu utilises (ou le modèle fourni).
                    - 'Repère les réglages : compte privé, qui peut voir mes publications, identification sur les photos.'
                    - Note trois réglages utiles.
            -   type: paragraphe
                texte: Pourquoi régler ? Par défaut, beaucoup de comptes sont publics.
        questions:
            -   id: q01
                type: tableau
                enonce: Écris trois réglages de confidentialité et leur effet.
                colonnes:
                    - Réglage
                    - Effet
                lignes:
                    -   - ''
                        - ''
                    -   - ''
                        - ''
                    -   - ''
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a03
        titre: Une identité professionnelle positive
        transition: Tes comptes sont protégés. Peux-tu aussi te mettre en valeur ?
        consigne: Tu vas proposer deux actions pour construire une identité numérique professionnelle positive. On attend deux actions concrètes.
        contenu:
            -   type: etapes
                elements:
                    - Imagine une présence en ligne utile pour ton métier.
                    - Propose deux actions concrètes.
                    - Explique ce qu’elles montrent à un employeur.
            -   type: paragraphe
                texte: Pourquoi « positive » ? Internet peut aussi prouver ton sérieux et tes compétences.
        questions:
            -   id: q01
                type: texte
                enonce: Propose deux actions pour construire une identité numérique professionnelle positive.
                aide: Une idée réaliste + « Cela permet de… ».
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le droit au déréférencement existe.
        questions:
            -   id: q01
                type: texte
                enonce: À quoi sert-il ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais gérer ton e-réputation. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment gérer son identité numérique quand on veut travailler dans la filière cheval ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Identité numérique : ce que je publie, ce que d’autres publient, ce que montre un moteur.'
    - Réglages + présence positive.
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
