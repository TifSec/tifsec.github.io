titre: 'Séance 23 : Présenter son lieu de stage (Impress n° 1)'
themes:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
problematique: Comment organiser un diaporama pour présenter son lieu de stage ?
competences_bo:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
objectifs:
    connaissances:
        - 'Un diaporama suit un plan : une idée par diapositive, un titre explicite.'
        - Le mode Plan d’Impress permet d’écrire d’abord les titres, puis de remplir.
    competences:
        - Construire le plan d’une présentation.
        - Créer des diapositives à partir d’un plan.
pourquoi:
    - En S22, tes photos sont prêtes.
    - 'Tu présentes ta structure de stage à la classe : qui, quoi, où, tes activités.'
activites:
    -   id: a01
        titre: Le plan
        consigne: Tu vas écrire le plan de ta présentation de stage en 6 diapositives aux titres explicites. On attend les 6 titres.
        contenu:
            -   type: etapes
                elements:
                    - Liste ce que la classe doit savoir de ta structure.
                    - Organise en 6 diapositives maximum.
                    - Écris un titre explicite pour chacune.
            -   type: paragraphe
                texte: Pourquoi des titres explicites ? « L’écurie » dit peu ; « 25 chevaux en pension, 3 salariés » dit l’essentiel.
        questions:
            -   id: q01
                type: tableau
                enonce: Écris les titres de tes 6 diapositives.
                colonnes:
                    - Diapositive
                    - Titre
                lignes:
                    -   - '1'
                        - ''
                    -   - '2'
                        - ''
                    -   - '3'
                        - ''
                    -   - '4'
                        - ''
                    -   - '5'
                        - ''
                    -   - '6'
                        - ''
                aide: Ligne × colonne.
    -   id: a02
        titre: Le mode Plan d’Impress
        transition: Le plan est prêt. Construis la structure dans Impress.
        consigne: Tu vas créer la structure de ton diaporama en mode Plan d’Impress. On attend le rôle de la touche Entrée et le contenu de la première diapositive.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Impress ; enregistre dans TIM > Stage sous 2de_TIM_stage.odp.
                    - 'Affichage > Plan : tape tes 6 titres (Entrée crée une diapositive).'
                    - Repasse en mode Normal et vérifie.
            -   type: paragraphe
                texte: Pourquoi le mode Plan ? On construit la structure sans se laisser distraire par la mise en forme.
        questions:
            -   id: q01
                type: qcm
                enonce: En mode Plan, que crée la touche Entrée après un titre ?
                choix:
                    -   id: a
                        texte: Une nouvelle diapositive.
                    -   id: b
                        texte: Un paragraphe dans la même diapositive.
                    -   id: c
                        texte: Rien.
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: texte
                enonce: Combien de diapositives compte ton fichier, et que contient la première ?
                aide: Repère le verbe de la question.
    -   id: a03
        titre: Remplir avec les photos
        transition: La structure existe. Remplis-la.
        consigne: Tu vas remplir tes diapositives avec des mots-clés, tes photos et une vue aérienne de la structure. On attend la description de la diapositive des installations.
        contenu:
            -   type: etapes
                elements:
                    - 'Sur chaque diapositive : 3 mots-clés au plus.'
                    - Insère une photo préparée en S22 par diapositive utile.
                    - Ajoute une carte ou un plan de la structure (Géoportail, capture).
            -   type: paragraphe
                texte: Pourquoi une carte ? Le public situe tout de suite la structure (ville, pâtures, bâtiments).
        questions:
            -   id: q01
                type: texte
                enonce: 'Décris la diapositive des installations : mots-clés, image.'
                aide: Combien d’éléments sont demandés ?
        ressources:
            -   type: lien
                titre: Géoportail — cartes et photos aériennes de l’IGN
                url: https://www.geoportail.gouv.fr/
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Géoportail permet de mesurer une surface.
        questions:
            -   id: q01
                type: texte
                enonce: Mesure la surface d’une pâture de ta structure.
                aide: 'Méthode : 1) écris ce que tu fais (l’action) ; 2) écris ce qui doit se passer (résultat attendu) ; 3) compare avec ce qui se passe vraiment (résultat observé). Ne change qu’une seule chose à la fois.'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton diaporama est construit. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment organiser un diaporama pour présenter son lieu de stage ?'
                aide: Reprends les mots du problème.
retenir:
    - 'Plan d’abord : un titre explicite par diapositive.'
    - Mode Plan ; mots-clés ; images.
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
