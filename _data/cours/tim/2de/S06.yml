titre: 'Séance 6 : Demander un stage par courrier'
themes:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
problematique: Comment rédiger et mettre en page une lettre de demande de stage ?
competences_bo:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
objectifs:
    connaissances:
        - 'Une lettre professionnelle suit des normes : expéditeur, destinataire, lieu et date, objet, formule d’appel, corps, formule de politesse, signature.'
        - On aligne avec des retraits ou des tabulations, jamais avec des espaces.
    competences:
        - Mettre en page une lettre professionnelle.
        - Rédiger un corps de lettre clair.
pourquoi:
    - En S05, tu as utilisé un tableau.
    - 'Pour ton prochain stage, tu écris à une écurie : la présentation compte autant que le contenu.'
activites:
    -   id: a01
        titre: Les parties d’une lettre
        consigne: Tu vas repérer les parties de la lettre de demande de stage de Clara (document 1) et trouver celle qui manque. On attend la partie manquante et son utilité.
        contenu:
            -   type: code
                texte: "Clara M., 3 rue des Prés, 15000 Aurillac\n                        Écurie des Volcans, 15100 Saint-Flour\n                        Aurillac, le 5 novembre 2026\nMadame, Monsieur,\n  Élève en 2de professionnelle…\nJe vous prie d’agréer, Madame, Monsieur, mes salutations distinguées.\n                                                   Clara M."
            -   type: etapes
                elements:
                    - Lis la lettre de Clara (document 1).
                    - Repère les huit parties.
                    - Trouve celle qui manque.
            -   type: paragraphe
                texte: Pourquoi l’objet ? Le lecteur sait en une ligne pourquoi on lui écrit.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, quelle partie manque dans la lettre de Clara ? Pourquoi est-elle utile ?
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
    -   id: a02
        titre: Rédiger le corps
        transition: Tu connais la structure. Rédige le contenu.
        consigne: Tu vas rédiger le corps de ta lettre de demande de stage en trois paragraphes. On attend ton deuxième paragraphe.
        contenu:
            -   type: etapes
                elements:
                    - 'Paragraphe 1 : qui tu es et ce que tu demandes (dates du stage).'
                    - 'Paragraphe 2 : pourquoi cette écurie et ce que tu sais déjà faire.'
                    - 'Paragraphe 3 : proposition de rencontre.'
            -   type: paragraphe
                texte: 'Pourquoi trois paragraphes ? Chacun a un rôle : se présenter, convaincre, proposer.'
        questions:
            -   id: q01
                type: texte
                enonce: Écris ton deuxième paragraphe (pourquoi cette écurie, ce que tu sais faire).
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a03
        titre: Mettre en page dans Writer
        transition: Ton texte est rédigé. Mets-le en page.
        consigne: Tu vas mettre en page ta lettre dans Writer (retrait du destinataire, texte justifié), la vérifier et l’exporter en PDF. On attend la méthode d’alignement et tes corrections.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Writer ; enregistre dans TIM > Stage sous 2de_TIM_lettre-stage.odt.
                    - Tape la lettre complète.
                    - Décale le bloc destinataire avec un retrait gauche de 9 cm (Format > Paragraphe).
                    - Justifie le corps ; vérifie l’orthographe (F7) ; exporte en PDF.
            -   type: paragraphe
                texte: Pourquoi un retrait et pas des espaces ? Avec des espaces, l’alignement change selon la police et l’ordinateur.
        questions:
            -   id: q01
                type: qcm
                enonce: Quelle méthode aligne proprement le destinataire à droite ?
                choix:
                    -   id: a
                        texte: Un retrait gauche de paragraphe.
                    -   id: b
                        texte: Plusieurs espaces.
                    -   id: c
                        texte: La touche Entrée.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Combien de fautes la vérification (F7) a-t-elle trouvées, et lesquelles as-tu corrigées ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Ta lettre partira en pièce jointe d’un courriel.
        questions:
            -   id: q01
                type: texte
                enonce: Sous quel format et quel nom l’envoies-tu ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ta lettre est prête. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment rédiger et mettre en page une lettre de demande de stage ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Lettre : expéditeur, destinataire, lieu-date, objet, appel, corps, politesse, signature.'
    - Retrait, pas d’espaces ; relecture ; PDF.
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
