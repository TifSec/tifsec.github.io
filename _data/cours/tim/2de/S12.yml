titre: 'Séance 12 : Le calendrier des vermifuges'
themes:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
problematique: Comment le tableur peut-il remplir automatiquement des dates et des listes ?
competences_bo:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
objectifs:
    connaissances:
        - 'La recopie incrémentée prolonge une suite : dates, jours, numéros.'
        - 'Une date est un nombre pour le tableur : on peut ajouter des jours (=B2+90).'
    competences:
        - Recopier une série de dates.
        - Calculer une date à partir d’une autre.
pourquoi:
    - En S11, tu as recopié des formules.
    - 'Le vétérinaire conseille de faire une coproscopie (analyse de crottin) et de vermifuger selon le résultat, environ tous les 3 mois : il faut un calendrier.'
activites:
    -   id: a01
        titre: La recopie incrémentée
        consigne: Tu vas découvrir la recopie incrémentée de dates et de jours dans Calc. On attend la date affichée en A5 et le résultat avec « lundi ».
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Calc ; enregistre sous 2de_TIM_vermifuges.ods.
                    - En A2, tape 06/01/2027 ; tire la poignée vers le bas jusqu’à A8.
                    - Observe ; puis en B2 tape « lundi » et tire.
            -   type: paragraphe
                texte: Pourquoi le tableur continue-t-il ? Il reconnaît une suite (dates, jours) et la prolonge.
        questions:
            -   id: q01
                type: texte
                enonce: Qu’affiche A5 après la recopie ?
                aide: Une phrase complète qui reprend les mots de la question.
            -   id: q02
                type: qcm
                enonce: Que donne la recopie de « lundi » sur 3 cellules ?
                choix:
                    -   id: a
                        texte: lundi, mardi, mercredi
                    -   id: b
                        texte: lundi, lundi, lundi
                    -   id: c
                        texte: Une erreur
                aide: Élimine d’abord les réponses impossibles.
    -   id: a02
        titre: Une date + 90 jours
        transition: Tu sais prolonger une série. Calcule maintenant des échéances.
        consigne: Tu vas calculer la date de la prochaine analyse de chaque cheval (+90 jours) à partir du document 1. On attend la date d’Iris et une formule.
        contenu:
            -   type: tableau
                titre: Document 1 — Dernières analyses (fictives)
                colonnes:
                    - Cheval
                    - Dernière coproscopie
                lignes:
                    -   - Tango
                        - 15/01/2027
                    -   - Iris
                        - 07/03/2027
                    -   - Nuage
                        - 20/02/2027
            -   type: etapes
                elements:
                    - 'Efface la feuille. Ligne 1 : Cheval, Dernière coproscopie, Prochaine.'
                    - Recopie les données du document 1.
                    - 'En C2 : =B2+90 ; recopie.'
                    - Mets la colonne C au format date (JJ/MM/AAAA).
            -   type: paragraphe
                texte: 'Pourquoi +90 ? Pour le tableur, une date est un nombre de jours : ajouter 90, c’est avancer de 90 jours.'
        questions:
            -   id: q01
                type: texte
                enonce: Quelle est la prochaine date pour Iris ?
                aide: Une phrase complète qui reprend les mots de la question.
            -   id: q02
                type: texte
                enonce: Écris la formule de C3.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a03
        titre: Une liste de choix
        transition: Les dates sont prêtes. Facilite la saisie des résultats.
        consigne: Tu vas créer une liste de choix pour la colonne des résultats d’analyse. On attend l’intérêt d’une liste de choix.
        contenu:
            -   type: etapes
                elements:
                    - Ajoute la colonne D « Résultat ».
                    - 'Sélectionne D2:D4 ; Données > Validité > Autoriser : Liste : « faible ; moyen ; fort ».'
                    - Choisis un résultat pour chaque cheval.
            -   type: paragraphe
                texte: 'Pourquoi une liste ? Tout le monde écrit pareil (pas « Fort », « fort », « FORT ») : on peut ensuite trier et compter.'
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi une liste de choix évite-t-elle des erreurs de saisie ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La fonction AUJOURDHUI() donne la date du jour.
        questions:
            -   id: q01
                type: texte
                enonce: Écris une formule qui calcule le nombre de jours avant la prochaine analyse de Tango.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton calendrier se calcule tout seul. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment le tableur peut-il remplir automatiquement des dates et des listes ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Recopie incrémentée (dates, jours, nombres).
    - Date + 90 = 90 jours plus tard ; Données > Validité.
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
