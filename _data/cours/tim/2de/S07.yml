titre: 'Séance 7 : Une fiche de soins qui a toujours la même présentation'
themes:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
problematique: Comment reproduire la même mise en forme sur plusieurs documents sans tout refaire ?
competences_bo:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
objectifs:
    connaissances:
        - Un modèle (.ott) garde la mise en page, les styles et les textes fixes ; on crée chaque nouveau document à partir de lui.
        - Le pinceau de mise en forme copie la présentation d’un texte sur un autre.
    competences:
        - Utiliser le pinceau de mise en forme.
        - Créer et utiliser un modèle.
pourquoi:
    - En S04 à S06, tu as mis en forme des documents un par un.
    - 'À l’écurie, la fiche de soins est remplie chaque semaine : elle doit toujours avoir la même présentation.'
activites:
    -   id: a01
        titre: Le pinceau
        consigne: Tu vas copier la mise en forme du jour « Lundi » sur les autres jours de la fiche de soins avec le pinceau. On attend le nom de l’outil et le résultat.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre le fichier fourni soins_semaine.odt.
                    - Le titre « Lundi » est bien mis en forme, pas les autres jours.
                    - Clique dans « Lundi », puis double-clique sur le pinceau (Cloner) et clique sur les autres jours.
            -   type: paragraphe
                texte: 'Pourquoi double-cliquer ? Le pinceau reste actif : on peut l’appliquer plusieurs fois.'
        questions:
            -   id: q01
                type: qcm
                enonce: Quel outil copie la mise en forme d’un texte vers un autre ?
                choix:
                    -   id: a
                        texte: Le pinceau (Cloner la mise en forme).
                    -   id: b
                        texte: Copier-coller.
                    -   id: c
                        texte: Le correcteur.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Combien de jours as-tu mis en forme avec le pinceau, en combien de clics environ ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a02
        titre: Créer un modèle
        transition: La fiche est homogène. Fais-en un modèle réutilisable.
        consigne: Tu vas transformer la fiche de soins en modèle réutilisable chaque semaine. On attend la différence entre document et modèle, et l’extension d’un modèle.
        contenu:
            -   type: etapes
                elements:
                    - Vide les cases de soins de la fiche (garde les titres et le tableau).
                    - 'Fichier > Modèles > Enregistrer comme modèle : « Fiche de soins écurie ».'
                    - Ferme le fichier.
            -   type: paragraphe
                texte: Pourquoi un modèle ? On ne risque plus d’écraser la fiche de la semaine précédente.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle est la différence entre enregistrer un document et enregistrer un modèle ?
                aide: Une phrase complète qui reprend les mots de la question.
            -   id: q02
                type: qcm
                enonce: Quelle extension a un modèle Writer ?
                choix:
                    -   id: a
                        texte: .ott
                    -   id: b
                        texte: .odt
                    -   id: c
                        texte: .pdf
                aide: Élimine d’abord les réponses impossibles.
    -   id: a03
        titre: Utiliser le modèle
        transition: Le modèle est prêt. Utilise-le pour une nouvelle semaine.
        consigne: Tu vas créer la fiche de la semaine 45 à partir de ton modèle et la remplir avec le document 1. On attend les soins du mercredi et le nom du fichier.
        contenu:
            -   type: tableau
                titre: Document 1 — Soins de la semaine 45 (fictifs)
                colonnes:
                    - Jour
                    - Soins
                lignes:
                    -   - Lundi
                        - Pansage complet
                    -   - Mercredi
                        - Parage de Tango ; vermifuge d’Iris
                    -   - Vendredi
                        - Soin des sabots
            -   type: etapes
                elements:
                    - 'Fichier > Nouveau > Modèles : choisis « Fiche de soins écurie ».'
                    - Remplis la semaine avec les soins du document 1.
                    - Enregistre sous 2de_TIM_soins_S45.odt dans TIM > Writer.
            -   type: paragraphe
                texte: 'Pourquoi un nouveau nom chaque semaine ? On garde l’historique des soins : c’est une trace utile en cas de problème sanitaire.'
        questions:
            -   id: q01
                type: texte
                enonce: Quels soins as-tu notés le mercredi, et sous quel nom as-tu enregistré la fiche ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un modèle peut contenir un champ date.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi est-ce pratique sur la fiche de soins ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ta fiche a toujours la même présentation. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment reproduire la même mise en forme sur plusieurs documents sans tout refaire ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Pinceau : copier une mise en forme.'
    - 'Modèle (.ott) : base réutilisable.'
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
