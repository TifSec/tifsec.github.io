titre: Protéger ses données et son environnement numérique
theme: TIM — Protéger ses données et son environnement numérique
problematique: Protéger ses données et son environnement numérique
pourquoi: "Objectif de cette séance : Un message reçu sur Internet n'est pas forcément fiable."
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Un message reçu sur Internet n'est pas forcément fiable.
        - Le phishing cherche à obtenir des informations ou provoquer une action en se faisant passer pour un interlocuteur légitime.
        - Un mot de passe doit être suffisamment robuste et ne doit jamais être partagé.
        - Les fichiers téléchargés et les liens peuvent présenter un risque.
        - La sauvegarde permet de limiter les conséquences de la perte ou de la destruction de données.
    competences: []
activites:
    - id: a03
      titre: 1. Créer le document de la séance
      contenu:
          - type: paragraphe
            texte: Créez votre document de travail et enregistrez-le dans TIM/Travaux.
          - type: paragraphe
            texte: "Nom du fichier :"
          - type: paragraphe
            texte: 2nde_S03_NOM_Prenom
          - type: paragraphe
            texte: "Ajoutez le titre :"
          - type: paragraphe
            texte: "Séance 3 : Protéger ses données et son environnement numérique"
      questions: []
    - id: a04
      titre: 2. Situation de départ
      contenu:
          - type: paragraphe
            texte: "La responsable d'une structure équestre reçoit le message suivant :"
          - type: citation
            texte: "URGENT : votre compte professionnel sera supprimé dans 24 heures. Nous avons détecté un problème avec votre compte. Cliquez immédiatement sur le lien suivant pour conserver votre accès. ecurie-securite-login.xyz"
          - type: paragraphe
            texte: "Dans votre document, répondez sans rechercher la solution :"
      questions:
          - id: q01
            type: texte
            enonce: Que feriez-vous en recevant ce message ?
            suite: []
          - id: q02
            type: texte
            enonce: Vous semble-t-il fiable ? Pourquoi ?
            suite: []
          - id: q03
            type: texte
            enonce: Quels éléments vous paraissent éventuellement suspects ?
            suite: []
    - id: a05
      titre: 3. Le phishing
      contenu:
          - type: paragraphe
            texte: Le phishing, ou hameçonnage, consiste à se faire passer pour une personne ou une organisation connue afin d'obtenir une information ou de provoquer une action.
          - type: paragraphe
            texte: "Par exemple :"
          - type: liste
            elements:
                - récupérer un mot de passe ;
                - obtenir des coordonnées bancaires ;
                - faire télécharger un fichier ;
                - faire ouvrir un lien dangereux.
          - type: paragraphe
            texte: "Quelques éléments doivent attirer votre attention :"
          - type: liste
            elements:
                - une demande très urgente ;
                - un expéditeur inhabituel ;
                - une adresse étrange ;
                - un lien différent du site habituel ;
                - une pièce jointe inattendue ;
                - une demande de mot de passe ou d'informations personnelles.
          - type: paragraphe
            texte: Reprenez maintenant votre réponse de départ et indiquez ce que vous modifieriez après avoir lu ces informations.
      questions: []
    - id: a06
      titre: 4. Protéger ses comptes
      contenu:
          - type: paragraphe
            texte: Un mot de passe protège l'accès à un compte.
          - type: paragraphe
            texte: "Il doit notamment être :"
          - type: liste
            elements:
                - suffisamment long ;
                - difficile à deviner ;
                - différent d'un compte important à un autre ;
                - gardé secret.
          - type: paragraphe
            texte: N'utilisez jamais votre véritable mot de passe dans un exercice scolaire.
          - type: paragraphe
            texte: La double authentification ajoute une deuxième vérification lors de la connexion et permet d'améliorer la sécurité du compte.
      questions: []
    - id: a07
      titre: "5. Mission : que feriez-vous ?"
      contenu:
          - type: paragraphe
            texte: "Pour chaque situation, indiquez dans votre document :"
          - type: paragraphe
            texte: Je le fais / Je ne le fais pas / Je vérifie d'abord
          - type: paragraphe
            texte: Puis justifiez votre réponse en une phrase.
          - type: titre
            texte: Situation 1
          - type: paragraphe
            texte: Vous recevez un message d'une personne inconnue avec le fichier photos_concours.exe.
          - type: titre
            texte: Situation 2
          - type: paragraphe
            texte: Un camarade vous demande votre mot de passe afin de déposer votre travail à votre place.
          - type: titre
            texte: Situation 3
          - type: paragraphe
            texte: Le système de l'ordinateur indique qu'une mise à jour officielle est disponible.
          - type: titre
            texte: Situation 4
          - type: paragraphe
            texte: "Une fenêtre apparaît soudainement et annonce : 17 VIRUS DÉTECTÉS ! CLIQUEZ ICI IMMÉDIATEMENT !"
          - type: titre
            texte: Situation 5
          - type: paragraphe
            texte: Vous quittez un ordinateur partagé pendant 20 minutes en laissant votre session ouverte.
          - type: titre
            texte: Situation 6
          - type: paragraphe
            texte: Un ami vous envoie soudainement un lien inhabituel sans aucun message d'explication.
      questions: []
    - id: a08
      titre: 6. Et si l'ordinateur tombe en panne ?
      contenu:
          - type: paragraphe
            texte: "Les données peuvent être perdues à cause :"
          - type: liste
            elements:
                - d'une panne ;
                - d'une suppression accidentelle ;
                - d'un vol ;
                - d'un logiciel malveillant ;
                - d'une mauvaise manipulation.
          - type: paragraphe
            texte: Dans votre document, proposez au moins deux solutions permettant d'éviter de perdre définitivement un document important.
      questions: []
    - id: a09
      titre: 7. Ma fiche réflexe
      contenu:
          - type: paragraphe
            texte: "Terminez votre document par le titre :"
          - type: paragraphe
            texte: Mes 5 règles de sécurité numérique
          - type: paragraphe
            texte: Rédigez vous-même cinq règles que vous souhaitez retenir de cette séance.
      questions: []
    - id: a10
      titre: À retenir
      contenu:
          - type: paragraphe
            texte: Sur Internet, il faut éviter d'agir trop rapidement.
          - type: paragraphe
            texte: "Avant de cliquer, télécharger ou transmettre une information :"
          - type: paragraphe
            texte: j'observe → je vérifie → puis j'agis.
      questions: []
    - id: a11
      titre: Travail à rendre
      contenu:
          - type: paragraphe
            texte: "Votre document doit contenir :"
          - type: liste
            elements:
                - votre réponse initiale ;
                - votre réponse corrigée après le cours ;
                - l'analyse des six situations ;
                - vos solutions pour protéger les données ;
                - vos cinq règles de sécurité.
          - type: paragraphe
            texte: "Nom du fichier à rendre : 2nde_S03_NOM_Prenom"
          - type: paragraphe
            texte: Le document doit être rendu même s'il n'est pas terminé.
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
ressources:
    - type: paragraphe
      texte: Réalise les manipulations dans le logiciel demandé. Conserve tes fichiers sur ton espace habituel. Le site enregistre seulement tes réponses écrites, tes résultats, tes formules et tes démarches ; aucun fichier n’est téléversé.
introduction:
    - type: titre
      texte: "Compétence visée : Identifier les principaux risques numériques et adopter des comportements responsables"
    - type: paragraphe
      texte: Objectifs d’apprentissage
    - type: liste
      elements:
          - Un message reçu sur Internet n'est pas forcément fiable.
          - Le phishing cherche à obtenir des informations ou provoquer une action en se faisant passer pour un interlocuteur légitime.
          - Un mot de passe doit être suffisamment robuste et ne doit jamais être partagé.
          - Les fichiers téléchargés et les liens peuvent présenter un risque.
          - La sauvegarde permet de limiter les conséquences de la perte ou de la destruction de données.
    - type: paragraphe
      texte: "Ce que les élèves vont savoir faire :"
    - type: liste
      elements:
          - Repérer plusieurs indices permettant d'identifier un message suspect.
          - Adopter les bons réflexes face à un lien ou une pièce jointe.
          - Expliquer les principes permettant de protéger un compte.
          - Proposer une réaction adaptée à une situation numérique.
