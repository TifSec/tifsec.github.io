titre: 'Séance 3 : Protéger ses données et son poste de travail'
themes:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
    - EG4, objectif 3-2 — Situer les TIC dans l’environnement social et culturel
problematique: Comment protéger ses comptes et ses fichiers au centre comme en stage ?
competences_bo:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
    - EG4, objectif 3-2 — Situer les TIC dans l’environnement social et culturel
objectifs:
    connaissances:
        - Un mot de passe solide est long, unique, gardé secret ; la double authentification ajoute un code.
        - On verrouille sa session quand on quitte le poste (Windows + L) et on fait des sauvegardes.
    competences:
        - Évaluer et construire un mot de passe solide.
        - Appliquer les bons réflexes sur un poste partagé.
pourquoi:
    - En S02, tu as rangé tes fichiers.
    - 'En stage, tu utiliseras peut-être l’ordinateur de l’écurie : comment ne pas exposer tes données ni celles des clients ?'
activites:
    -   id: a01
        titre: Un mot de passe solide
        consigne: Tu vas évaluer trois mots de passe avec les critères du document 1. On attend « solide » ou « faible » pour chacun.
        contenu:
            -   type: liste
                elements:
                    - Au moins 12 caractères.
                    - Majuscules, minuscules, chiffres, symboles.
                    - Pas de mot du dictionnaire seul, ni de date de naissance.
                    - Un mot de passe différent par compte.
            -   type: etapes
                elements:
                    - Lis les critères (document 1).
                    - Évalue chaque mot de passe.
                    - Réponds.
            -   type: paragraphe
                texte: Pourquoi ces critères ? Les logiciels de piratage testent d’abord les mots courts, les prénoms, les dates.
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, ces mots de passe sont-ils solides ou faibles ?
                colonnes:
                    - Mot de passe
                    - Solide ou faible ?
                lignes:
                    -   - ecurie2026
                        - ''
                    -   - Mon-Ch3val-Aime-Les-Pommes!
                        - ''
                    -   - azerty
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: Le poste partagé de l’écurie
        transition: Tu sais créer un mot de passe. Encore faut-il bien l’utiliser.
        consigne: Tu vas repérer les trois imprudences de Lucas sur l’ordinateur de l’écurie (document 2) et proposer un bon réflexe pour chacune. On attend trois corrections.
        contenu:
            -   type: paragraphe
                texte: 'Document 2 — Lucas, stagiaire, consulte sa messagerie sur l’ordinateur de l’accueil. Il laisse la session ouverte pour aller nourrir les chevaux. Son mot de passe est sur un post-it collé à l’écran. Le navigateur lui a proposé de retenir son mot de passe : il a accepté.'
            -   type: etapes
                elements:
                    - Lis la situation (document 2).
                    - Repère les trois imprudences.
                    - Propose une correction pour chacune.
            -   type: paragraphe
                texte: 'Pourquoi ce poste est-il à risque ? Plusieurs personnes l’utilisent : clients, employés, stagiaires.'
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 2, corrige les imprudences de Lucas.
                colonnes:
                    - Imprudence
                    - Bon réflexe
                lignes:
                    -   - Session restée ouverte
                        - ''
                    -   - Mot de passe sur un post-it
                        - ''
                    -   - Navigateur qui retient son mot de passe
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a03
        titre: La sauvegarde
        transition: Le poste est sécurisé. Il reste à protéger les données en cas de panne.
        consigne: Tu vas appliquer la règle de sauvegarde 3-2-1 au registre des soins de l’écurie. On attend une organisation qui respecte les trois chiffres.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis la règle 3-2-1 : 3 copies, 2 supports différents, 1 hors du lieu.'
                    - Applique-la au registre des soins de l’écurie.
                    - Réponds.
            -   type: paragraphe
                texte: 'Pourquoi sauvegarder ? Un ordinateur peut tomber en panne, être volé ou attaqué : sans copie, tout est perdu.'
        questions:
            -   id: q01
                type: texte
                enonce: Propose une organisation de sauvegarde du registre des soins qui respecte la règle 3-2-1.
                aide: Une idée réaliste + « Cela permet de… ».
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La double authentification envoie un code sur le téléphone.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi protège-t-elle même si le mot de passe est volé ?
                aide: 'Méthode : 1) écris ton idée en une phrase ; 2) ajoute la raison avec « car » ou « parce que » ; 3) appuie-toi sur un fait vu dans la séance ou un document. Exemple de début : « … car … ».'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais protéger tes données. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment protéger ses comptes et ses fichiers au centre comme en stage ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Mot de passe solide, unique, secret.
    - Verrouiller (Windows + L) ; sauvegarde 3-2-1.
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
