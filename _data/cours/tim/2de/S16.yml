titre: 'Séance 16 : Suivre la croissance d’un poulain'
themes:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
problematique: Comment représenter et lire l’évolution d’une grandeur dans le temps ?
competences_bo:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
objectifs:
    connaissances:
        - Une variable quantitative continue qui évolue dans le temps (poids, taille) se représente par une courbe.
        - L’axe horizontal porte le temps, l’axe vertical la grandeur, avec unités.
    competences:
        - Créer un graphique en ligne (courbe) avec deux séries.
        - Lire une évolution et la comparer à une référence.
pourquoi:
    - En S15, tu as représenté des effectifs (races).
    - À l’élevage, on pèse les poulains chaque mois pour vérifier leur croissance.
activites:
    -   id: a01
        titre: Saisir et calculer
        consigne: Tu vas saisir les pesées de la pouliche Capucine (document 1) et calculer ses gains de poids mensuels. On attend un gain et le mois où il est le plus faible.
        contenu:
            -   type: tableau
                titre: Document 1 — Pesées d’une pouliche (fictives, ordre de grandeur cheval de selle)
                colonnes:
                    - Âge (mois)
                    - '1'
                    - '2'
                    - '3'
                    - '4'
                    - '5'
                    - '6'
                lignes:
                    -   - Capucine (kg)
                        - '100'
                        - '138'
                        - '170'
                        - '198'
                        - '228'
                        - '245'
                    -   - Référence (kg)
                        - '100'
                        - '140'
                        - '175'
                        - '205'
                        - '235'
                        - '260'
            -   type: etapes
                elements:
                    - Ouvre Calc ; enregistre sous 2de_TIM_croissance.ods.
                    - Saisis le document 1.
                    - En ligne 4, calcule le gain de poids de chaque mois (=C2-B2…).
            -   type: paragraphe
                texte: Pourquoi le gain mensuel ? Une croissance qui ralentit se voit mieux sur les gains que sur les poids.
        questions:
            -   id: q01
                type: nombre
                enonce: D’après le document 1, combien Capucine a-t-elle pris entre le mois 3 et le mois 4 ?
                unite: kg
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: qcm
                enonce: Entre quels mois le gain est-il le plus faible ?
                choix:
                    -   id: a
                        texte: Entre 5 et 6 mois
                    -   id: b
                        texte: Entre 1 et 2 mois
                    -   id: c
                        texte: Entre 3 et 4 mois
                aide: Élimine d’abord les réponses impossibles.
    -   id: a02
        titre: La courbe
        transition: Les données sont prêtes. Montre l’évolution.
        consigne: Tu vas tracer dans Calc la courbe de croissance de Capucine et la courbe de référence. On attend le titre, les axes et pourquoi pas de secteurs.
        contenu:
            -   type: etapes
                elements:
                    - Sélectionne les lignes Âge, Capucine et Référence.
                    - Insertion > Diagramme > Ligne (points et lignes).
                    - Titre, axes avec unités, légende.
                    - Copie le graphique dans Writer.
            -   type: paragraphe
                texte: Pourquoi deux courbes ? La référence sert de repère pour juger la croissance.
        questions:
            -   id: q01
                type: texte
                enonce: Écris le titre de ton graphique et les noms des deux axes avec leurs unités.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
            -   id: q02
                type: qcm
                enonce: Pourquoi ne pas utiliser un diagramme en secteurs ici ?
                choix:
                    -   id: a
                        texte: Les secteurs montrent des parts, pas une évolution.
                    -   id: b
                        texte: Il est trop coloré.
                    -   id: c
                        texte: Calc ne le permet pas.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a03
        titre: Interpréter
        transition: La courbe est tracée. Que dit-elle ?
        consigne: Tu vas rédiger une conclusion pour l’éleveur à partir des deux courbes. On attend l’évolution de l’écart, un chiffre et un conseil.
        contenu:
            -   type: etapes
                elements:
                    - Compare les deux courbes mois par mois.
                    - Repère quand l’écart se creuse.
                    - Rédige une conclusion pour l’éleveur.
            -   type: paragraphe
                texte: Pourquoi une conclusion écrite ? L’éleveur a besoin d’une information claire pour agir.
        questions:
            -   id: q01
                type: texte
                enonce: 'Rédige une conclusion pour l’éleveur : l’écart avec la référence évolue-t-il ? Que conseilles-tu ?'
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le tableur peut ajouter une courbe de tendance.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle prévision donne-t-elle pour 8 mois ?
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais suivre une évolution. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment représenter et lire l’évolution d’une grandeur dans le temps ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Évolution dans le temps → courbe.
    - Comparer à une référence ; conclure.
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
