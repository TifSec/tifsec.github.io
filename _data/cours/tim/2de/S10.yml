titre: 'Séance 10 : L’inventaire de la sellerie dans un tableur'
themes:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
problematique: Comment saisir et présenter des données dans un tableur pour qu’elles soient exploitables ?
competences_bo:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
objectifs:
    connaissances:
        - Une feuille de calcul est faite de cellules (A1, B2…) ; une ligne d’en-tête nomme chaque colonne.
        - Les formats affichent les nombres avec leur unité (€, kg) sans changer leur valeur.
    competences:
        - Saisir un tableau de données propre.
        - Appliquer des formats de nombre.
pourquoi:
    - En séquence 2, tu as travaillé avec Writer.
    - 'Pour les nombres, on utilise un tableur : l’inventaire de la sellerie en est le premier exemple.'
activites:
    -   id: a01
        titre: Un tableau exploitable
        consigne: Tu vas comparer deux saisies de l’inventaire de la sellerie (document 1) pour comprendre ce qui empêche de calculer. On attend l’erreur de Hugo et sa conséquence.
        contenu:
            -   type: tableau
                titre: Document 1 — Deux saisies de l’inventaire
                colonnes:
                    - Hugo — Article
                    - Hugo — Prix
                    - Lina — Article
                    - Lina — Prix (€)
                lignes:
                    -   - Licol
                        - 45 euros
                        - Licol
                        - '45'
                    -   - Seau
                        - 8 €
                        - Seau
                        - '8'
                    -   - Granulés
                        - 2kg
                        - Brosse
                        - '12,5'
            -   type: etapes
                elements:
                    - Lis les deux saisies (document 1).
                    - Repère ce qui empêche de calculer dans la saisie de Hugo.
                    - Réponds.
            -   type: paragraphe
                texte: Pourquoi « exploitable » ? Si on tape « 45 euros » en texte, le tableur ne peut pas additionner.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, pourquoi le tableur ne peut-il pas faire la somme dans la saisie de Hugo ?
                aide: 'Méthode : 1) clique dans la cellule du résultat ; 2) tape « = » puis le nom de la fonction (SOMME, MOYENNE…) ; 3) écris la plage entre parenthèses, par exemple (B2:B10) ; 4) appuie sur Entrée et vérifie que le résultat est vraisemblable.'
    -   id: a02
        titre: Saisir l’inventaire
        transition: Tu sais ce qu’est une saisie propre. Fais la tienne.
        consigne: Tu vas saisir l’inventaire de la sellerie (document 2) dans Calc, nombres seuls, avec une ligne d’en-tête figée. On attend la bonne saisie d’un prix et le contenu d’une ligne.
        contenu:
            -   type: tableau
                titre: Document 2 — Inventaire (données fictives)
                colonnes:
                    - Article
                    - Quantité
                    - Prix unitaire (€)
                    - Poids (kg)
                lignes:
                    -   - Licol
                        - '6'
                        - '45'
                        - '0,4'
                    -   - Seau
                        - '4'
                        - '8'
                        - '0,6'
                    -   - Brosse douce
                        - '5'
                        - '12,5'
                        - '0,2'
                    -   - Tapis
                        - '8'
                        - '39,9'
                        - '0,8'
                    -   - Filet
                        - '6'
                        - '64'
                        - '0,7'
                    -   - Granulés (sac)
                        - '10'
                        - '16,8'
                        - '25'
            -   type: etapes
                elements:
                    - Ouvre Calc ; enregistre dans TIM > Calc sous 2de_TIM_inventaire.ods.
                    - 'Ligne 1 : Article, Quantité, Prix unitaire, Poids (kg).'
                    - Saisis les 6 articles du document 2, nombres seuls.
                    - Mets la ligne 1 en gras et fige-la (Affichage > Figer la première ligne).
            -   type: paragraphe
                texte: Pourquoi figer la ligne ? En descendant dans un long tableau, on voit toujours le nom des colonnes.
        questions:
            -   id: q01
                type: qcm
                enonce: Comment taper le prix de 12,50 € dans la cellule ?
                choix:
                    -   id: a
                        texte: '12,5'
                    -   id: b
                        texte: 12,50 €
                    -   id: c
                        texte: douze euros cinquante
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Écris le contenu des cellules A3, B3 et C3 de ta feuille.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a03
        titre: Les formats
        transition: Les données sont saisies. Affiche les unités sans casser les calculs.
        consigne: Tu vas appliquer les formats € et kg aux colonnes de l’inventaire. On attend l’affichage et la valeur réelle d’une cellule.
        contenu:
            -   type: etapes
                elements:
                    - 'Sélectionne la colonne des prix : format monétaire (€, 2 décimales).'
                    - 'Sélectionne la colonne des poids : Format > Cellules > Nombre > Format personnalisé : 0,0" kg".'
                    - Vérifie que les valeurs n’ont pas changé (regarde la barre de formule).
            -   type: paragraphe
                texte: 'Pourquoi un format plutôt que taper l’unité ? L’affichage montre l’unité, mais la cellule garde un nombre : le calcul reste possible.'
        questions:
            -   id: q01
                type: texte
                enonce: Que montre la cellule du prix du tapis, et que contient la barre de formule ?
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Calc peut colorer une ligne sur deux.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi est-ce utile dans un long inventaire ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton inventaire est propre. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment saisir et présenter des données dans un tableur pour qu’elles soient exploitables ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Nombres seuls dans les cellules ; unité par le format.
    - Ligne d’en-tête figée.
sources:
