titre: 'Séance 21 : Photos de concours : qui a le droit de les publier ?'
themes:
    - EG4, objectif 3-2 — Situer les TIC dans l’environnement social et culturel
problematique: Quelles règles respecter pour publier des photos de personnes ou des œuvres d’autrui ?
competences_bo:
    - EG4, objectif 3-2 — Situer les TIC dans l’environnement social et culturel
objectifs:
    connaissances:
        - 'Droit à l’image : une personne reconnaissable doit donner son accord (les parents pour un mineur).'
        - 'Droit d’auteur : le photographe est propriétaire de sa photo ; une licence peut autoriser certains usages.'
    competences:
        - Appliquer le droit à l’image et le droit d’auteur.
        - Rédiger une demande d’autorisation.
pourquoi:
    - En S20, tu as vu ton e-réputation.
    - 'Le club veut publier les photos de son concours : il doit respecter les droits de chacun.'
activites:
    -   id: a01
        titre: Qui doit donner son accord ?
        consigne: Tu vas dire, pour trois photos d’un concours (document 1), qui doit donner son accord avant publication. On attend une réponse par photo.
        contenu:
            -   type: liste
                elements:
                    - 'Photo 1 : une cavalière de 12 ans en gros plan, prise par le moniteur du club.'
                    - 'Photo 2 : vue du paddock prise par un photographe professionnel venu couvrir le concours.'
                    - 'Photo 3 : les obstacles avant l’épreuve, prise par le club, personne sur la photo.'
            -   type: etapes
                elements:
                    - Lis les trois photos (document 1).
                    - Pour chacune, repère les personnes reconnaissables et l’auteur.
                    - Écris qui doit donner son accord.
                    - Pourquoi deux droits ? La personne photographiée et le photographe ont chacun des droits.
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, qui doit donner son accord ?
                colonnes:
                    - Photo
                    - Accord de…
                lignes:
                    -   - Photo 1
                        - ''
                    -   - Photo 2
                        - ''
                    -   - Photo 3
                        - ''
                aide: 'Pour chaque photo du document 1 : y a-t-il une personne reconnaissable (et est-elle mineure) ? qui a pris la photo ?'
    -   id: a02
        titre: La demande d’autorisation
        transition: Tu sais qui doit accepter. Rédige la demande.
        consigne: Tu vas rédiger l’autorisation de publication de la photo de la jeune cavalière avec les éléments du document 2. On attend une autorisation complète.
        contenu:
            -   type: liste
                elements:
                    - Identité de la personne (et des parents pour un mineur).
                    - Photo(s) concernée(s).
                    - Supports de publication.
                    - Durée.
                    - Date et signature.
                    - Possibilité de retirer son accord.
            -   type: etapes
                elements:
                    - Lis les éléments d’une autorisation (document 2).
                    - Rédige l’autorisation de publication pour la photo 1.
                    - Vérifie qu’il ne manque rien.
                    - Pourquoi par écrit ? En cas de désaccord, l’écrit prouve ce qui a été autorisé.
        questions:
            -   id: q01
                type: texte
                enonce: Rédige l’autorisation de publication de la photo 1.
                aide: L’autorisation doit dire qui (l’enfant et ses parents), quelle photo, sur quels supports, pour combien de temps, et porter une signature.
    -   id: a03
        titre: Une photo trouvée en ligne
        transition: Les photos du club sont réglées. Et une photo trouvée sur internet ?
        consigne: Tu vas lire la licence d’une photo de Wikimedia Commons et écrire le crédit à afficher. On attend les conditions et le crédit.
        contenu:
            -   type: etapes
                elements:
                    - Le club veut illustrer un article avec une photo de Wikimedia Commons sous licence CC BY-SA.
                    - Lis la licence.
                    - Écris le crédit et les conditions.
                    - Pourquoi SA ? Si on modifie la photo, on doit la partager sous la même licence.
        questions:
            -   id: q01
                type: texte
                enonce: Quelles conditions la licence CC BY-SA impose-t-elle, et quel crédit écrire ?
                aide: 'BY = citer l’auteur ; SA = partager à l’identique. Écris le crédit : auteur, titre ou source, licence.'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un cavalier découvre sa photo publiée sans accord.
        questions:
            -   id: q01
                type: texte
                enonce: Que peut-il demander ?
                aide: Une personne photographiée sans accord peut agir. Que demande-t-elle d’abord, et à qui s’adresser ensuite ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu connais les règles. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quelles règles respecter pour publier des photos de personnes ou des œuvres d’autrui ?'
                aide: Dis qui doit donner son accord (personne, parents, photographe) et comment utiliser une photo trouvée en ligne.
retenir:
    - 'Droit à l’image : accord écrit.'
    - 'Droit d’auteur : licence, crédit.'
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
