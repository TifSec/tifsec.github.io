titre: 'Séance 2 : Organiser ses fichiers de cours et de stage'
themes:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
problematique: Comment organiser et nommer ses fichiers pour les retrouver toute l’année ?
competences_bo:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
objectifs:
    connaissances:
        - 'On range ses fichiers dans une arborescence logique : matière, période, type.'
        - 'Un bon nom de fichier dit ce qu’il contient : classe_matière_sujet_date.'
    competences:
        - Créer une arborescence.
        - Nommer et déplacer des fichiers.
pourquoi:
    - En S01, tu as fait ton positionnement.
    - 'Cette année, tu vas produire beaucoup de fichiers au centre et en stage : il faut s’organiser dès maintenant.'
activites:
    -   id: a01
        titre: Une bonne arborescence
        consigne: Tu vas comparer les rangements de Tom et de Jade (document 1) pour trouver le plus efficace. On attend ton choix justifié.
        contenu:
            -   type: fichier
                titre: fiche du poney à retrouver et ranger
                url: /assets/fichiers/tim/2de/fiche_poney.odt
            -   type: code
                texte: "Rangement de Tom :\nBureau\n  doc1.odt  doc2.odt  photo.jpg  truc final.odt  truc final2.odt\n\nRangement de Jade :\nDocuments\n  TIM\n    Stage\n      2de_TIM_compte-rendu-stage_2026-11.odt\n    Calc\n      2de_TIM_budget-cheval.ods"
            -   type: etapes
                elements:
                    - Lis les deux rangements (document 1).
                    - Cherche le compte rendu de stage de novembre dans chacun.
                    - Compare.
                    - Pourquoi comparer ? On voit vite qu’un rangement logique fait gagner du temps.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, quel rangement est le plus efficace ? Justifie.
                aide: 'Compare Tom et Jade : chez qui retrouverais-tu le plus vite la fiche d’un poney en mars ? Pourquoi (dossiers, noms) ?'
    -   id: a02
        titre: Créer mon arborescence
        transition: Tu sais ce qu’est un bon rangement. Crée le tien.
        consigne: Tu vas créer ton arborescence de TIM dans ton espace personnel. On attend le chemin d’un dossier et le choix d’un bon nom de fichier.
        contenu:
            -   type: etapes
                elements:
                    - Dans ton espace personnel, crée « TIM ».
                    - Dedans, crée « Writer », « Calc », « Impress », « Stage ».
                    - Écris le chemin d’un des dossiers.
                    - Pourquoi par logiciel et par stage ? Ce sont les grandes parties de l’année.
        questions:
            -   id: q01
                type: texte
                enonce: Écris le chemin complet de ton dossier « Stage ».
                aide: 'Ouvre ton dossier « Stage » : la barre d’adresse de l’explorateur montre tout le chemin depuis « Documents ».'
            -   id: q02
                type: qcm
                enonce: Quel est le meilleur nom pour la lettre de demande de stage ?
                choix:
                    -   id: a
                        texte: 2de_TIM_lettre-stage_2026-10.odt
                    -   id: b
                        texte: lettre.odt
                    -   id: c
                        texte: nouveau document (3).odt
                aide: Un bon nom dit la classe, la matière, le contenu et la date, sans espace ni accent.
    -   id: a03
        titre: Trouver un fichier perdu
        transition: Tes dossiers sont prêts. Range un fichier égaré.
        consigne: Tu vas retrouver un fichier égaré avec la recherche, puis le ranger dans ton dossier Writer. On attend son emplacement d’origine et sa destination.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre l’explorateur et utilise la recherche (en haut à droite).
                    - Cherche le fichier fourni « fiche_poney » .
                    - Déplace-le dans ton dossier Writer.
                    - 'Pourquoi savoir chercher ? Même bien rangé, on perd parfois un fichier : la recherche le retrouve.'
        questions:
            -   id: q01
                type: texte
                enonce: Où se trouvait le fichier fiche_poney, et où l’as-tu déplacé ?
                aide: Utilise la loupe de l’explorateur avec le mot « poney ». Note le dossier où il était, puis celui où tu l’as rangé.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une clé USB peut se perdre ou tomber en panne.
        questions:
            -   id: q01
                type: texte
                enonce: Propose une solution pour ne pas perdre ton rapport de stage.
                aide: Si l’ordinateur tombe en panne, le fichier disparaît. Où peut-on en garder une deuxième copie ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tes fichiers sont organisés. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment organiser et nommer ses fichiers pour les retrouver toute l’année ?'
                aide: Dis comment tu ranges (dossiers par matière, sous-dossiers), comment tu nommes, et comment tu retrouves un fichier perdu.
retenir:
    - Arborescence logique ; noms classe_matière_sujet_date.
    - Recherche et sauvegarde.
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
