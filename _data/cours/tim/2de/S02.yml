titre: Organiser ses fichiers et ses dossiers
theme: TIM — Organiser ses fichiers et ses dossiers
problematique: Organiser ses fichiers et ses dossiers
pourquoi: "Objectif de cette séance : Un fichier contient des informations enregistrées sur un support numérique."
application: Vous travaillez dans une écurie. L'ordinateur utilisé par l'équipe contient plusieurs années de documents.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Un fichier contient des informations enregistrées sur un support numérique.
        - Un dossier permet de ranger et organiser des fichiers.
        - Des dossiers placés les uns dans les autres forment une arborescence.
        - L'extension située à la fin du nom d'un fichier permet généralement d'identifier son type.
        - Un nom de fichier clair permet de retrouver plus facilement une information.
    competences: []
activites:
    - id: a03
      titre: 1. Créer le document de la séance
      contenu:
          - type: paragraphe
            texte: Créez un nouveau document avec votre traitement de texte.
          - type: paragraphe
            texte: "Enregistrez-le immédiatement dans votre dossier TIM/Travaux sous le nom :"
          - type: paragraphe
            texte: 2nde_S02_NOM_Prenom
          - type: paragraphe
            texte: "Ajoutez le titre :"
          - type: paragraphe
            texte: "Séance 2 : Organiser ses fichiers et ses dossiers"
      questions: []
    - id: a04
      titre: 2. Situation de départ
      contenu:
          - type: paragraphe
            texte: Vous travaillez dans une écurie. L'ordinateur utilisé par l'équipe contient plusieurs années de documents.
          - type: paragraphe
            texte: "Tout a été enregistré au même endroit :"
          - type: liste
            elements:
                - photos des chevaux ;
                - factures ;
                - documents vétérinaires ;
                - rations ;
                - plannings ;
                - résultats de concours ;
                - documents administratifs.
          - type: paragraphe
            texte: "Certains fichiers portent des noms comme :"
          - type: liste
            elements:
                - document.odt
                - vaccins.pdf
                - vaccins2.pdf
                - nouveau_document_3.odt
                - IMG_4587.jpg
                - final_v2_definitif.pdf
          - type: paragraphe
            texte: "Dans votre document : expliquez quels problèmes cette organisation pourrait provoquer."
      questions: []
    - id: a05
      titre: 3. Fichier, dossier et arborescence
      contenu:
          - type: paragraphe
            texte: Complétez votre document avec les définitions suivantes.
          - type: paragraphe
            texte: "Fichier : ensemble d'informations enregistrées sous un même nom."
          - type: paragraphe
            texte: "Dossier : emplacement permettant de ranger des fichiers ou d'autres dossiers."
          - type: paragraphe
            texte: "Arborescence : organisation hiérarchique composée de dossiers et de sous-dossiers."
      questions: []
    - id: a06
      titre: 4. Reconnaître les principaux fichiers
      contenu:
          - type: paragraphe
            texte: L'extension correspond généralement aux lettres placées après le dernier point dans le nom du fichier.
          - type: tableau
            colonnes:
                - Extension
                - Type de fichier
            lignes:
                - - .odt / .docx
                  - Document texte
                - - .ods / .xlsx
                  - Tableur
                - - .odp / .pptx
                  - Présentation
                - - .pdf
                  - Document destiné notamment à être consulté ou diffusé
                - - .jpg / .jpeg
                  - Image
                - - .png
                  - Image
          - type: paragraphe
            texte: "Dans votre document, indiquez le type correspondant aux fichiers suivants :"
          - type: etapes
            elements:
                - planning.odt
                - Apache.jpg
                - ration.ods
                - vaccination.pdf
                - presentation_structure.pptx
      questions: []
    - id: a07
      titre: "5. Mission : remettre de l'ordre dans l'écurie"
      contenu:
          - type: paragraphe
            texte: Le professeur vous fournit un dossier contenant plusieurs fichiers mélangés ICI.
          - type: lien
            titre: ICI
            url: https://tifsec.github.io/mfr/2nd/contenu/a_ranger_proprement.zip
          - type: paragraphe
            texte: Votre mission consiste à les organiser afin qu'un salarié de l'écurie puisse retrouver rapidement une information.
          - type: paragraphe
            texte: "Vous pouvez par exemple créer une organisation de ce type :"
          - type: code
            texte: Ecurie ├── Chevaux │ ├── Apache │ │ ├── Alimentation │ │ ├── Photos │ │ └── Sante │ └── Bella │ ├── Alimentation │ ├── Photos │ └── Sante ├── Factures └── Planning
          - type: paragraphe
            texte: "Attention : cette organisation n'est qu'une proposition. Vous pouvez en imaginer une autre si elle vous semble plus efficace."
      questions: []
    - id: a08
      titre: 6. Montrer son travail
      contenu:
          - type: paragraphe
            texte: "Lorsque votre organisation est terminée :"
          - type: etapes
            elements:
                - affichez votre arborescence à l'écran ;
                - faites une capture d'écran ;
                - insérez la capture dans votre document ;
                - écrivez quelques lignes pour expliquer votre choix.
      questions: []
    - id: a09
      titre: 7. Bien nommer un fichier
      contenu:
          - type: paragraphe
            texte: Un bon nom de fichier doit permettre de comprendre son contenu sans avoir besoin de l'ouvrir.
          - type: paragraphe
            texte: "Exemple :"
          - type: paragraphe
            texte: "Mauvais : document2.pdf"
          - type: paragraphe
            texte: "Plus utile : 2026_Vaccinations_Apache.pdf"
          - type: paragraphe
            texte: "Proposez un meilleur nom pour :"
          - type: etapes
            elements:
                - photo1.jpg
                - vaccin.pdf
                - rationfinale2.ods
      questions: []
    - id: a10
      titre: 8. Enregistrer, copier et déplacer
      contenu:
          - type: paragraphe
            texte: "Enregistrer : sauvegarder les modifications dans le fichier actuel."
          - type: paragraphe
            texte: "Enregistrer sous : enregistrer le document sous un nouveau nom ou à un nouvel emplacement."
          - type: paragraphe
            texte: "Copier : créer une deuxième version d'un fichier."
          - type: paragraphe
            texte: "Déplacer : changer l'emplacement d'un fichier sans créer de copie."
      questions: []
    - id: a11
      titre: À retenir
      contenu:
          - type: paragraphe
            texte: Un fichier que l'on ne sait pas retrouver est presque aussi inutile qu'un fichier qui n'existe pas.
          - type: paragraphe
            texte: "Une bonne organisation numérique repose sur :"
          - type: paragraphe
            texte: des dossiers logiques + des noms de fichiers compréhensibles.
      questions: []
    - id: a12
      titre: Travail à rendre
      contenu:
          - type: paragraphe
            texte: "Votre document doit contenir :"
          - type: liste
            elements:
                - votre réflexion sur la situation de départ ;
                - les réponses sur les extensions ;
                - la capture d'écran de votre organisation ;
                - l'explication de votre choix ;
                - les nouveaux noms de fichiers proposés.
          - type: paragraphe
            texte: "Nom du fichier à rendre : 2nde_S02_NOM_Prenom"
          - type: paragraphe
            texte: Le document doit être rendu même s'il n'est pas terminé.
      questions: []
    - id: a13
      titre: Bilan de la séance
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Qu’as-tu réalisé pendant cette séance ? Explique ce que tu sais maintenant faire et ce qui reste à travailler.
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
ressources:
    - type: paragraphe
      texte: Réalise les manipulations dans le logiciel demandé. Conserve tes fichiers sur ton espace habituel. Le site enregistre seulement tes réponses écrites, tes résultats, tes formules et tes démarches ; aucun fichier n’est téléversé.
introduction:
    - type: titre
      texte: "Compétence visée : Organiser ses données et évoluer de manière autonome dans un environnement numérique"
    - type: paragraphe
      texte: Objectifs d’apprentissage
    - type: liste
      elements:
          - Un fichier contient des informations enregistrées sur un support numérique.
          - Un dossier permet de ranger et organiser des fichiers.
          - Des dossiers placés les uns dans les autres forment une arborescence.
          - L'extension située à la fin du nom d'un fichier permet généralement d'identifier son type.
          - Un nom de fichier clair permet de retrouver plus facilement une information.
    - type: paragraphe
      texte: "Ce que les élèves vont savoir faire :"
    - type: liste
      elements:
          - Créer des dossiers et des sous-dossiers.
          - Déplacer et renommer des fichiers.
          - Identifier quelques formats de fichiers courants.
          - Construire une organisation logique adaptée à une situation professionnelle.
          - Faire une capture d'écran et l'insérer dans leur document.
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://chlorofil.fr/diplomes/secondaire/bac-pro/2nde-pro
