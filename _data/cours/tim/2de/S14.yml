titre: 'Séance 14 : Bilan : combien coûte un cheval par mois ?'
themes:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
problematique: Comment construire un budget mensuel fiable pour un cheval avec un tableur ?
competences_bo:
    - EG4, objectif 3-1 — Utiliser de manière pertinente les outils bureautiques et les outils de communication
objectifs:
    connaissances:
        - Un budget liste les postes de dépenses, leurs quantités et leurs prix, puis calcule les totaux.
        - 'On réutilise : formats, formules, SOMME, références absolues.'
    competences:
        - Construire un budget complet.
        - Analyser la part de chaque poste.
pourquoi:
    - De S10 à S13, tu as appris les bases de Calc.
    - 'Bilan : un client te demande combien lui coûtera son cheval en pension chaque mois.'
activites:
    -   id: a01
        titre: Les postes de dépenses
        consigne: Tu vas ramener au mois chaque dépense d’un cheval en pension, à partir du document 1. On attend le coût mensuel de trois postes.
        contenu:
            -   type: liste
                elements:
                    - 'Pension en box avec foin : 380 € par mois.'
                    - 'Parage : 50 € tous les 2 mois.'
                    - 'Vermifuge : 18 €, 4 fois par an.'
                    - 'Complément minéral : 1 seau de 20 € par mois.'
                    - 'Assurance : 120 € par an.'
            -   type: paragraphe
                texte: Données fictives créées pour l’exercice.
            -   type: etapes
                elements:
                    - Lis les informations du document 1.
                    - 'Range les dépenses en postes : pension, alimentation complémentaire, soins, équipement.'
                    - Ramène chaque dépense au mois.
            -   type: paragraphe
                texte: Pourquoi ramener au mois ? Un parage toutes les 8 semaines ne se compte pas comme une pension mensuelle.
        questions:
            -   id: q01
                type: tableau
                enonce: Calcule le coût mensuel de chaque poste.
                colonnes:
                    - Poste
                    - Coût par mois (€)
                lignes:
                    -   - Pension
                        - ''
                    -   - Maréchal (parage tous les 2 mois à 50 €)
                        - ''
                    -   - Vermifuge (4 par an à 18 €)
                        - ''
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a02
        titre: Construire le budget
        transition: Tu sais calculer chaque poste. Construis le budget complet.
        consigne: Tu vas construire dans Calc le budget mensuel du cheval avec une formule unique et un total. On attend le total mensuel et une formule.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Calc ; enregistre sous 2de_TIM_budget-cheval.ods.
                    - 'Colonnes : Poste, Montant, Fréquence par an, Coût mensuel.'
                    - 'Coût mensuel : =B2*C2/12 ; recopie.'
                    - Total en bas avec SOMME, format €.
            -   type: paragraphe
                texte: Pourquoi « par an / 12 » ? Une seule formule fonctionne pour toutes les fréquences.
        questions:
            -   id: q01
                type: nombre
                enonce: Quel est le coût mensuel total du cheval ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: texte
                enonce: Écris la formule du coût mensuel de l’assurance (montant en B6, fréquence en C6).
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a03
        titre: La part de chaque poste
        transition: Le budget est complet. Où va l’argent ?
        consigne: Tu vas calculer la part de chaque poste du budget en pourcentage et conseiller le client. On attend la part de la pension et un conseil justifié.
        contenu:
            -   type: etapes
                elements:
                    - 'En E2 : =D2/$D$8 ; format pourcentage ; recopie.'
                    - Repère le poste le plus important.
                    - Conseille le client.
            -   type: paragraphe
                texte: Pourquoi un pourcentage ? On voit tout de suite où va l’argent.
        questions:
            -   id: q01
                type: nombre
                enonce: Quelle part du budget représente la pension (arrondie à l’unité) ?
                unite: '%'
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: texte
                enonce: Quel conseil donnes-tu au client pour réduire son budget ? Justifie avec les pourcentages.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Les prix changent selon les régions.
        questions:
            -   id: q01
                type: texte
                enonce: Comment comparer ton budget avec des données réelles ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Le budget est prêt. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment construire un budget mensuel fiable pour un cheval avec un tableur ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Budget : postes, fréquence, coût mensuel = montant × fréquence / 12.'
    - Parts en % avec référence absolue.
sources:
    -   type: lien
        titre: ChloroFil — Seconde professionnelle, document d’accompagnement du module EG4
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/2nde-pro/2nde-pro-da-EG4.pdf
