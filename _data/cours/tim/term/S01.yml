titre: Des données brutes à une décision professionnelle
theme: TIM — Des données brutes à une décision professionnelle
problematique: Des données brutes à une décision professionnelle
pourquoi: "Objectif de cette séance : organiser correctement des données dans un tableur ;"
application: "Le responsable constate que le stock de foin diminue rapidement. Il vous demande :"
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances: []
    competences:
        - organiser correctement des données dans un tableur ;
        - repérer des données inutilisables ou incohérentes ;
        - calculer quelques indicateurs ;
        - interpréter les résultats ;
        - proposer une décision professionnelle argumentée.
activites:
    - id: a02
      titre: À quoi cela va-t-il servir ?
      contenu:
          - type: paragraphe
            texte: "Dans une entreprise hippique, cela peut servir à :"
          - type: liste
            elements:
                - surveiller les consommations ;
                - repérer une valeur inhabituelle ;
                - prévoir les besoins ;
                - comparer plusieurs périodes ;
                - justifier une décision avec des chiffres.
      questions: []
    - id: a04
      titre: 1. Votre situation professionnelle
      contenu:
          - type: paragraphe
            texte: Vous travaillez dans une écurie accueillant 20 chevaux.
          - type: paragraphe
            texte: "Le responsable constate que le stock de foin diminue rapidement. Il vous demande :"
          - type: paragraphe
            texte: « Notre consommation de foin est-elle régulière et combien devons-nous prévoir pour les prochains jours ? »
          - type: paragraphe
            texte: "Pour répondre, vous disposez du relevé suivant :"
          - type: tableau
            colonnes:
                - Jour
                - Nombre de chevaux
                - Foin distribué
            lignes:
                - - Lundi
                  - "20"
                  - 180 kg
                - - Mardi
                  - "20"
                  - 176 kg
                - - Mercredi
                  - "20"
                  - 185 kg
                - - Jeudi
                  - "18"
                  - 164 kg
                - - Vendredi
                  - "18"
                  - 170 kg
                - - Samedi
                  - "20"
                  - 205 kg
                - - Dimanche
                  - "20"
                  - 182 kg
      questions: []
    - id: a05
      titre: 2. Créer votre fichier de travail
      contenu:
          - type: paragraphe
            texte: Pourquoi ? Avant d'analyser des données, il faut pouvoir les stocker de manière structurée et les retrouver facilement.
          - type: etapes
            elements:
                - Ouvrez LibreOffice Calc.
                - Enregistrez immédiatement votre fichier sous le nom Term_TIM_S01_NOM_Prenom.ods.
                - Reproduisez le tableau fourni.
          - type: paragraphe
            texte: VIGILANCE
          - type: paragraphe
            texte: "Dans la colonne « Foin distribué », saisissez uniquement les nombres : 180, 176, etc. Ne saisissez pas « 180 kg »."
      questions: []
    - id: a06
      titre: 3. Une donnée est-elle directement une information ?
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Avant de calculer, vous devez comprendre ce que les nombres représentent et vérifier s'ils permettent réellement de répondre à la question.
      questions:
          - id: q01
            type: texte
            enonce: Quel est le jour où la quantité totale de foin distribuée est la plus élevée ?
            suite: []
          - id: q02
            type: texte
            enonce: Quel est le jour où elle est la plus faible ?
            suite: []
          - id: q03
            type: texte
            enonce: Peut-on conclure que les chevaux ont moins mangé jeudi que lundi ? Justifiez.
            suite:
                - type: paragraphe
                  texte: AIDE SI BESOIN
                - type: paragraphe
                  texte: Comparer deux quantités totales n'est pertinent que si elles concernent des situations comparables.
                - type: paragraphe
                  texte: "Nous changeons maintenant de méthode. Les quantités totales ne permettent pas de comparer correctement les jours où le nombre de chevaux change. Nous allons donc créer un nouvel indicateur : la quantité de foin par cheval."
    - id: a07
      titre: 4. Créer un indicateur utile
      contenu:
          - type: paragraphe
            texte: Pourquoi ? Un indicateur transforme plusieurs données en une information plus facile à comparer.
          - type: paragraphe
            texte: Ajoutez une quatrième colonne nommée Foin par cheval (kg).
      questions:
          - id: q01
            type: texte
            enonce: Dans la première ligne de données, calculez la quantité de foin par cheval avec une formule.
            aide: Effectue cette manipulation dans Calc ou Excel, puis indique ici la formule, le résultat ou la démarche utilisée.
            suite: []
          - id: q02
            type: texte
            enonce: Recopiez la formule jusqu'au dimanche.
            aide: Effectue cette manipulation dans Calc ou Excel, puis indique ici la formule, le résultat ou la démarche utilisée.
            suite:
                - type: paragraphe
                  texte: Affichez les résultats avec 2 décimales maximum.
                - type: paragraphe
                  texte: ATTENDU
                - type: paragraphe
                  texte: Vous devez obtenir une valeur exprimant le nombre de kilogrammes de foin distribués par cheval et par jour.
                - type: paragraphe
                  texte: AIDE SI BESOIN
                - type: paragraphe
                  texte: Quantité par cheval = quantité totale distribuée ÷ nombre de chevaux.
    - id: a08
      titre: 5. Résumer une semaine avec quelques nombres
      contenu:
          - type: paragraphe
            texte: Pourquoi ? Maintenant que les journées sont comparables, nous pouvons résumer la semaine sans devoir relire toutes les lignes du tableau.
          - type: paragraphe
            texte: "Sous votre tableau, calculez :"
          - type: etapes
            elements:
                - la consommation moyenne par cheval sur la semaine ;
                - la valeur minimale ;
                - la valeur maximale.
          - type: paragraphe
            texte: AIDE SI BESOIN
          - type: paragraphe
            texte: Les fonctions utiles sont MOYENNE, MIN et MAX.
          - type: paragraphe
            texte: À quoi servent ces trois valeurs ?
      questions: []
    - id: a09
      titre: 6. Prendre une décision
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Le tableur n'est pas utilisé uniquement pour faire des calculs. Les résultats doivent servir à répondre à la question professionnelle de départ.
          - type: paragraphe
            texte: Lundi prochain, l'écurie accueillera de nouveau 20 chevaux.
          - type: paragraphe
            texte: À partir de votre consommation moyenne, estimez la quantité de foin à prévoir pour une journée.
          - type: paragraphe
            texte: Estimez la quantité nécessaire pour 7 jours.
      questions:
          - id: q01
            type: texte
            enonce: Le responsable dispose de 900 kg de foin. Ce stock semble-t-il suffisant pour une semaine ?
            suite: []
          - id: q02
            type: texte
            enonce: Rédigez une recommandation courte au responsable.
            suite:
                - type: paragraphe
                  texte: VIGILANCE
                - type: paragraphe
                  texte: Une estimation n'est pas une certitude. Les besoins réels peuvent varier selon les chevaux, leur activité, leur ration, la qualité du fourrage ou les conditions de conduite.
    - id: a10
      titre: 7. Ce qu'il faut retenir
      contenu:
          - type: paragraphe
            texte: Donnée brute → organisation → calcul → indicateur → interprétation → décision.
          - type: paragraphe
            texte: Un chiffre n'a de sens que s'il est replacé dans son contexte.
          - type: paragraphe
            texte: Un bon indicateur permet de comparer des situations et d'aider à prendre une décision.
      questions: []
    - id: a11
      titre: 8. Fin de séance
      contenu:
          - type: paragraphe
            texte: "Vérifiez que votre fichier contient :"
          - type: liste
            elements:
                - le tableau correctement structuré ;
                - la colonne « Foin par cheval » calculée avec une formule ;
                - la moyenne, le minimum et le maximum ;
                - votre estimation pour les 7 prochains jours ;
                - votre recommandation finale.
          - type: paragraphe
            texte: "Enregistrez une dernière fois votre fichier sous :"
          - type: paragraphe
            texte: Term_TIM_S01_NOM_Prenom.ods
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
ressources:
    - type: paragraphe
      texte: Réalise les manipulations dans le logiciel demandé. Conserve tes fichiers sur ton espace habituel. Le site enregistre seulement tes réponses écrites, tes résultats, tes formules et tes démarches ; aucun fichier n’est téléversé.
introduction:
    - type: titre
      texte: Ce que vous allez apprendre
    - type: paragraphe
      texte: "Une entreprise produit chaque jour de nombreuses données : quantité de foin distribuée, nombre de chevaux, dépenses, heures de travail, fréquentation, consommation d'eau..."
    - type: paragraphe
      texte: Aujourd'hui, vous allez apprendre à transformer ces données brutes en informations utiles pour prendre une décision.
    - type: titre
      texte: Ce que vous allez apprendre à faire
    - type: liste
      elements:
          - organiser correctement des données dans un tableur ;
          - repérer des données inutilisables ou incohérentes ;
          - calculer quelques indicateurs ;
          - interpréter les résultats ;
          - proposer une décision professionnelle argumentée.
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://chlorofil.fr/diplomes/secondaire/bac-pro/1re-tle/tronc-commun
