titre: Créer un bilan automatique des dépenses d'une écurie
theme: TIM — Créer un bilan automatique des dépenses d'une écurie
problematique: Créer un bilan automatique des dépenses d'une écurie
pourquoi: "Objectif de cette séance : utiliser la fonction SOMME.SI ;"
application: Lors de la séance précédente, vous avez créé un registre des dépenses de septembre pour une écurie.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances: []
    competences:
        - utiliser la fonction SOMME.SI ;
        - utiliser la fonction NB.SI ;
        - utiliser la fonction SOUS.TOTAL ;
        - construire un bilan automatique des dépenses ;
        - interpréter des résultats pour conseiller un responsable.
activites:
    - id: a02
      titre: À quoi cela va-t-il servir ?
      contenu:
          - type: paragraphe
            texte: "Dans une entreprise hippique, ces calculs permettent de :"
          - type: liste
            elements:
                - connaître les dépenses totales par catégorie ;
                - compter les achats réalisés ;
                - mettre automatiquement à jour des résultats ;
                - comparer plusieurs postes de dépenses ;
                - préparer un budget ou un tableau de bord.
      questions: []
    - id: a04
      titre: "1. Situation professionnelle : préparer le bilan mensuel"
      contenu:
          - type: paragraphe
            texte: Lors de la séance précédente, vous avez créé un registre des dépenses de septembre pour une écurie.
          - type: paragraphe
            texte: Vous avez appris à trier les achats et à filtrer les différentes catégories.
          - type: paragraphe
            texte: Mais le responsable souhaite désormais obtenir un bilan complet sans devoir refaire les calculs manuellement.
          - type: paragraphe
            texte: "Votre mission : construire un tableau qui calcule automatiquement le total et le nombre d'achats de chaque catégorie."
          - type: paragraphe
            texte: "Le responsable vous pose une question :"
          - type: paragraphe
            texte: « Si j'ajoute une nouvelle facture dans mon tableau, faudra-t-il recommencer tous les calculs ? »
      questions: []
    - id: a05
      titre: 2. Retrouver et préparer le fichier
      contenu:
          - type: paragraphe
            texte: Pourquoi ? Nous allons reprendre un tableau déjà connu pour nous concentrer sur les nouvelles méthodes de calcul, plutôt que sur la saisie de données.
          - type: paragraphe
            texte: Ouvrez votre fichier Term_TIM_S03_NOM_Prenom.ods.
          - type: paragraphe
            texte: Enregistrez une nouvelle copie sous Term_TIM_S04_NOM_Prenom.ods avec Fichier > Enregistrer sous.
          - type: paragraphe
            texte: Retirez tous les filtres actifs pour faire réapparaître les 12 achats.
      questions:
          - id: q01
            type: texte
            enonce: Vérifiez que votre tableau comporte les six colonnes et que tous les montants sont calculés.
            suite:
                - type: titre
                  texte: Je n'ai pas mon fichier précédent — Données de secours
                - type: paragraphe
                  texte: Créez un nouveau fichier Calc, reproduisez ce tableau et calculez les montants avec la formule =D2*E2, recopiée jusqu'à F13.
                - type: tableau
                  colonnes:
                      - Date
                      - Catégorie
                      - Désignation
                      - Quantité
                      - Prix unitaire
                  lignes:
                      - - 02/09/2026
                        - Alimentation
                        - Granulés
                        - "20"
                        - "18"
                      - - 03/09/2026
                        - Litière
                        - Copeaux
                        - "30"
                        - "12"
                      - - 04/09/2026
                        - Entretien
                        - Fourche
                        - "3"
                        - "25"
                      - - 05/09/2026
                        - Foin
                        - Bottes de foin
                        - "40"
                        - "8"
                      - - 08/09/2026
                        - Entretien
                        - Balai
                        - "4"
                        - "14"
                      - - 10/09/2026
                        - Alimentation
                        - Complément minéral
                        - "10"
                        - "32"
                      - - 12/09/2026
                        - Litière
                        - Paille
                        - "25"
                        - "9"
                      - - 15/09/2026
                        - Entretien
                        - Réparation abreuvoir
                        - "1"
                        - "185"
                      - - 17/09/2026
                        - Foin
                        - Bottes de foin
                        - "50"
                        - "8"
                      - - 20/09/2026
                        - Entretien
                        - Produit désinfectant
                        - "6"
                        - "22"
                      - - 23/09/2026
                        - Alimentation
                        - Granulés
                        - "25"
                        - "18"
                      - - 25/09/2026
                        - Litière
                        - Copeaux
                        - "35"
                        - "12"
    - id: a06
      titre: 3. Calculer automatiquement les dépenses d'alimentation
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? En séance 3, nous devions filtrer les achats puis additionner leurs montants. Nous allons maintenant demander au tableur de faire directement ce travail.
          - type: paragraphe
            texte: "Pour cela, nous découvrons une nouvelle fonction : SOMME.SI."
          - type: paragraphe
            texte: "Elle signifie : « Additionne les montants uniquement si la condition est respectée. »"
          - type: titre
            texte: 3.1. Créer une zone de bilan
          - type: paragraphe
            texte: En H1, écrivez Catégorie.
          - type: paragraphe
            texte: En I1, écrivez Total (€).
          - type: paragraphe
            texte: En H2, écrivez Alimentation.
      questions:
          - id: q01
            type: texte
            enonce: En I2, saisissez la formule =SOMME.SI(B2:B13;H2;F2:F13).
            aide: Effectue cette manipulation dans Calc ou Excel, puis indique ici la formule, le résultat ou la démarche utilisée.
            suite:
                - type: paragraphe
                  texte: AIDE SI BESOIN — Niveau 1
                - type: paragraphe
                  texte: La fonction a besoin de savoir où chercher, quoi chercher et quels montants additionner.
                - type: paragraphe
                  texte: AIDE SI BESOIN — Niveau 2
                - type: paragraphe
                  texte: Les catégories sont en colonne B. Les montants sont en colonne F. Le critère est écrit en H2.
                - type: paragraphe
                  texte: AIDE SI BESOIN — Niveau 3
                - type: paragraphe
                  texte: Cliquez sur I2, saisissez =SOMME.SI(B2:B13;H2;F2:F13), puis validez avec Entrée.
                - type: titre
                  texte: 3.2. Comprendre ce que fait la formule
                - type: paragraphe
                  texte: Avant de continuer, vérifions que nous comprenons le résultat.
          - id: q02
            type: texte
            enonce: Pourquoi la fonction n'ajoute-t-elle pas les dépenses de foin ou d'entretien ?
            suite: []
          - id: q03
            type: texte
            enonce: Si nous remplaçons Alimentation par Entretien dans H2, que devrait-il se passer ?
            suite: []
          - id: q04
            type: texte
            enonce: Quel avantage présente cette méthode par rapport à une addition écrite manuellement ?
            suite: []
    - id: a07
      titre: 4. Construire le bilan des quatre catégories
      contenu:
          - type: paragraphe
            texte: Pourquoi passons-nous à cet exercice ? Nous savons calculer le total d'une catégorie. Le responsable a maintenant besoin de comparer toutes les catégories.
          - type: paragraphe
            texte: Nous allons réutiliser la même méthode, sans apprendre une nouvelle fonction.
          - type: paragraphe
            texte: En H3, H4 et H5, écrivez respectivement Litière, Entretien et Foin.
          - type: paragraphe
            texte: En I3, saisissez =SOMME.SI($B$2:$B$13;H3;$F$2:$F$13).
      questions:
          - id: q01
            type: texte
            enonce: Modifiez également la formule de I2 pour utiliser $B$2:$B$13 et $F$2:$F$13.
            aide: Effectue cette manipulation dans Calc ou Excel, puis indique ici la formule, le résultat ou la démarche utilisée.
            suite: []
          - id: q02
            type: texte
            enonce: Recopiez la formule de I3 jusqu'en I5 avec la poignée de recopie.
            aide: Effectue cette manipulation dans Calc ou Excel, puis indique ici la formule, le résultat ou la démarche utilisée.
            suite: []
          - id: q03
            type: texte
            enonce: En H6, écrivez Total général, puis calculez ce total en I6 avec =SOMME(I2:I5).
            aide: Effectue cette manipulation dans Calc ou Excel, puis indique ici la formule, le résultat ou la démarche utilisée.
            suite:
                - type: paragraphe
                  texte: ATTENDU — Bilan des dépenses
                - type: tableau
                  colonnes:
                      - Catégorie
                      - Total (€)
                  lignes:
                      - - Alimentation
                        - 1 130
                      - - Litière
                        - 1 005
                      - - Entretien
                        - "448"
                      - - Foin
                        - "720"
                      - - Total général
                        - 3 303
          - id: q04
            type: texte
            enonce: Quelle catégorie représente la dépense totale la plus importante ?
            suite: []
          - id: q05
            type: texte
            enonce: Pourquoi est-il utile de comparer les totaux par catégorie plutôt que les achats individuellement ?
            suite: []
    - id: a08
      titre: 5. Compter automatiquement les achats
      contenu:
          - type: paragraphe
            texte: Pourquoi apprendre une nouvelle fonction ? Nous connaissons maintenant le montant dépensé dans chaque catégorie. Mais nous ne savons pas encore combien d'achats ont été réalisés.
          - type: paragraphe
            texte: Pour répondre à cette question, nous découvrons NB.SI.
          - type: paragraphe
            texte: "Cette fonction signifie : « Compte les cellules qui respectent une condition. »"
          - type: paragraphe
            texte: En J1, écrivez Nombre d'achats.
          - type: paragraphe
            texte: En J2, saisissez =NB.SI($B$2:$B$13;H2).
      questions:
          - id: q01
            type: texte
            enonce: Recopiez cette formule jusqu'en J5.
            aide: Effectue cette manipulation dans Calc ou Excel, puis indique ici la formule, le résultat ou la démarche utilisée.
            suite: []
          - id: q02
            type: texte
            enonce: En J6, calculez le nombre total d'achats avec =SOMME(J2:J5).
            aide: Effectue cette manipulation dans Calc ou Excel, puis indique ici la formule, le résultat ou la démarche utilisée.
            suite:
                - type: titre
                  texte: 5.1. Interpréter le bilan
          - id: q03
            type: texte
            enonce: Quelle catégorie contient le plus grand nombre d'achats ?
            suite: []
          - id: q04
            type: texte
            enonce: Est-ce également la catégorie qui coûte le plus cher ?
            suite: []
          - id: q05
            type: texte
            enonce: Pourquoi ces deux indicateurs peuvent-ils être intéressants pour le responsable ?
            suite: []
    - id: a09
      titre: 6. Calculer uniquement les lignes visibles
      contenu:
          - type: paragraphe
            texte: Pourquoi découvrir encore une fonction ? Lors de la séance 3, vous avez utilisé des filtres. Mais la fonction SOMME classique peut continuer à compter des lignes masquées.
          - type: paragraphe
            texte: Pour calculer un total qui suit le filtre actif, nous allons utiliser SOUS.TOTAL.
      questions:
          - id: q01
            type: texte
            enonce: Vérifiez que les 12 achats sont visibles et que le filtre automatique est activé sur A1:F13.
            suite:
                - type: paragraphe
                  texte: En H8, écrivez Total affiché.
                - type: paragraphe
                  texte: En I8, saisissez =SOUS.TOTAL(9;F2:F13).
                - type: paragraphe
                  texte: Filtrez la colonne Catégorie pour conserver uniquement Foin.
                - type: paragraphe
                  texte: Remplacez le filtre Foin par Entretien.
                - type: paragraphe
                  texte: Retirez tous les filtres pour retrouver le total général.
                - type: paragraphe
                  texte: AIDE SI BESOIN — Niveau 1
                - type: paragraphe
                  texte: SOUS.TOTAL permet de calculer une somme adaptée aux lignes affichées après filtrage.
                - type: paragraphe
                  texte: AIDE SI BESOIN — Niveau 2
                - type: paragraphe
                  texte: Dans la fonction, le nombre 9 signifie « calculer une somme ».
                - type: paragraphe
                  texte: AIDE SI BESOIN — Niveau 3
                - type: paragraphe
                  texte: Saisissez =SOUS.TOTAL(9;F2:F13) dans I8, puis filtrez la colonne B par catégorie.
                - type: paragraphe
                  texte: VIGILANCE
                - type: paragraphe
                  texte: SOMME.SI suit un critère défini dans la formule. SOUS.TOTAL suit les lignes affichées par le filtre. Ce ne sont donc pas deux outils interchangeables.
    - id: a10
      titre: "7. Mission finale : interpréter le bilan"
      contenu:
          - type: paragraphe
            texte: Pourquoi terminons-nous ainsi ? Un responsable n'a pas seulement besoin de calculs. Il doit comprendre ses dépenses pour prendre des décisions adaptées.
          - type: paragraphe
            texte: "Le responsable vous demande : « Quelle catégorie représente notre plus grande dépense ? Quel poste contient le plus d'achats ? Que me conseillez-vous pour améliorer le suivi de nos dépenses ? »"
      questions:
          - id: q01
            type: texte
            enonce: Identifiez la catégorie dont le montant total est le plus important.
            suite: []
          - id: q02
            type: texte
            enonce: Identifiez celle qui contient le plus d'achats.
            suite: []
          - id: q03
            type: texte
            enonce: Expliquez pourquoi ces deux réponses sont différentes.
            suite: []
          - id: q04
            type: texte
            enonce: Proposez une action concrète permettant au responsable de mieux suivre ses dépenses.
            suite:
                - type: paragraphe
                  texte: Rédigez votre conclusion dans une zone libre de votre fichier Calc, par exemple à partir de H11.
    - id: a11
      titre: 8. À retenir
      contenu:
          - type: paragraphe
            texte: SOMME.SI additionne les montants qui respectent une condition.
          - type: paragraphe
            texte: NB.SI compte les cellules qui respectent une condition.
          - type: paragraphe
            texte: SOUS.TOTAL permet notamment d'additionner les lignes visibles après un filtrage.
          - type: paragraphe
            texte: Ces fonctions permettent de construire des indicateurs utiles à la gestion d'une entreprise.
          - type: paragraphe
            texte: Une donnée bien organisée peut devenir une information automatiquement actualisée.
      questions: []
    - id: a12
      titre: 9. Fin de séance — Travail à rendre
      contenu:
          - type: paragraphe
            texte: "Vérifiez que votre fichier contient :"
          - type: liste
            elements:
                - les 12 achats de septembre ;
                - les montants calculés avec des formules ;
                - un bilan comprenant les quatre catégories ;
                - le total et le nombre d'achats de chaque catégorie ;
                - une formule SOUS.TOTAL fonctionnelle ;
                - votre conclusion professionnelle.
          - type: paragraphe
            texte: "Retirez tous les filtres actifs, puis enregistrez votre fichier sous :"
          - type: paragraphe
            texte: Term_TIM_S04_NOM_Prenom.ods
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
ressources:
    - type: paragraphe
      texte: Réalise les manipulations dans le logiciel demandé. Conserve tes fichiers sur ton espace habituel. Le site enregistre seulement tes réponses écrites, tes résultats, tes formules et tes démarches ; aucun fichier n’est téléversé.
introduction:
    - type: titre
      texte: Ce que vous allez apprendre
    - type: paragraphe
      texte: Aujourd'hui, nous allons apprendre à réaliser des calculs conditionnels dans un tableur.
    - type: paragraphe
      texte: Un calcul conditionnel est un calcul réalisé uniquement sur les données qui respectent une condition précise.
    - type: paragraphe
      texte: Par exemple, nous pouvons demander à Calc d'additionner uniquement les dépenses d'alimentation, sans additionner les autres dépenses.
    - type: titre
      texte: Ce que vous allez apprendre à faire
    - type: liste
      elements:
          - utiliser la fonction SOMME.SI ;
          - utiliser la fonction NB.SI ;
          - utiliser la fonction SOUS.TOTAL ;
          - construire un bilan automatique des dépenses ;
          - interpréter des résultats pour conseiller un responsable.
