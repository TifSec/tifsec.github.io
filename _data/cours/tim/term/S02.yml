titre: Peut-on faire confiance aux données d'une écurie ?
theme: TIM — Peut-on faire confiance aux données d'une écurie ?
problematique: Peut-on faire confiance aux données d'une écurie ?
pourquoi: "Objectif de cette séance : repérer des valeurs inhabituelles dans un tableau ;"
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances: []
    competences:
        - repérer des valeurs inhabituelles dans un tableau ;
        - reconnaître une donnée manquante, un doublon et une erreur de format ;
        - vérifier une donnée avant de la modifier ;
        - corriger les erreurs avec LibreOffice Calc ;
        - comparer des résultats avant et après nettoyage.
activites:
    - id: a02
      titre: À quoi cela va-t-il servir ?
      contenu:
          - type: paragraphe
            texte: "Dans une entreprise hippique, des données incorrectes peuvent entraîner :"
          - type: liste
            elements:
                - une commande de foin trop importante ou insuffisante ;
                - un mauvais suivi des dépenses ;
                - des erreurs dans les stocks ;
                - des décisions reposant sur des informations trompeuses.
      questions: []
    - id: a04
      titre: "1. Mission professionnelle : un stock de foin inquiétant"
      contenu:
          - type: paragraphe
            texte: Vous travaillez dans une écurie accueillant habituellement 20 chevaux.
          - type: paragraphe
            texte: Le responsable vous transmet un tableau de suivi des quantités de foin distribuées pendant une semaine.
          - type: paragraphe
            texte: Il souhaite connaître la consommation totale pour préparer sa prochaine commande.
          - type: paragraphe
            texte: "Votre mission : vérifier si les données sont fiables, corriger les erreurs justifiées, puis calculer la quantité réelle de foin distribuée."
      questions: []
    - id: a05
      titre: 2. Créer le fichier de travail
      contenu:
          - type: paragraphe
            texte: Pourquoi ? Pour étudier les erreurs, il nous faut d'abord un tableau de données à analyser.
          - type: etapes
            elements:
                - Ouvrez LibreOffice Calc.
                - Enregistrez le fichier sous le nom Term_TIM_S02_NOM_Prenom.ods.
                - En A1, écrivez Jour.
                - En B1, écrivez Nombre de chevaux.
                - En C1, écrivez Foin distribué (kg).
                - Recopiez exactement les données ci-dessous, même si certaines vous semblent étranges.
          - type: tableau
            colonnes:
                - Jour
                - Nombre de chevaux
                - Foin distribué (kg)
            lignes:
                - - Lundi
                  - "20"
                  - "180"
                - - Mardi
                  - "20"
                  - 176 kg
                - - Mercredi
                  - "20"
                  - "185"
                - - Jeudi
                  - "18"
                  - "164"
                - - Vendredi
                  - "18"
                  - Cellule vide
                - - Samedi
                  - "20"
                  - "2050"
                - - Dimanche
                  - "20"
                  - "182"
                - - Mardi
                  - "20"
                  - "176"
          - type: paragraphe
            texte: Pour le vendredi, laissez réellement la cellule vide.
      questions: []
    - id: a06
      titre: "3. Enquête : quelles données semblent incorrectes ?"
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Avant de corriger un tableau, il faut apprendre à identifier les différentes anomalies.
          - type: paragraphe
            texte: Nous ne cherchons pas encore à réparer le tableau. Nous cherchons à comprendre les problèmes.
      questions:
          - id: q01
            type: texte
            enonce: Observez les données. Quelles lignes vous semblent problématiques ?
            suite: []
          - id: q02
            type: texte
            enonce: Pourquoi la quantité du samedi paraît-elle inhabituelle ?
            suite: []
          - id: q03
            type: texte
            enonce: Quel problème pose la cellule du vendredi ?
            suite: []
          - id: q04
            type: texte
            enonce: Quel problème pourrait poser l'écriture « 176 kg » dans un calcul ?
            suite: []
          - id: q05
            type: texte
            enonce: Pourquoi faut-il vérifier la dernière ligne ?
            suite:
                - type: paragraphe
                  texte: AIDE SI BESOIN — Niveau 1
                - type: paragraphe
                  texte: Comparez les valeurs, cherchez les cases vides et vérifiez si un jour apparaît plusieurs fois.
                - type: paragraphe
                  texte: AIDE SI BESOIN — Niveau 2
                - type: paragraphe
                  texte: Un problème peut concerner la valeur elle-même, son écriture ou sa présence dans le tableau.
                - type: paragraphe
                  texte: AIDE SI BESOIN — Niveau 3
                - type: paragraphe
                  texte: Examinez précisément les deux mardis, le vendredi, le samedi et la manière d'écrire la quantité du premier mardi.
    - id: a07
      titre: 4. Nettoyer les données sans inventer
      contenu:
          - type: paragraphe
            texte: Pourquoi changeons-nous d'activité ? Vous avez repéré des anomalies. Il faut maintenant vérifier les informations avant de les corriger.
          - type: paragraphe
            texte: Une valeur inhabituelle n'est pas forcément fausse. Un professionnel doit rechercher une source fiable avant toute modification.
          - type: paragraphe
            texte: "Le responsable retrouve son carnet de distribution original :"
          - type: tableau
            colonnes:
                - Information vérifiée
                - Relevé original
            lignes:
                - - Quantité de vendredi
                  - 170 kg
                - - Quantité de samedi
                  - 205 kg
                - - Premier mardi
                  - 176 kg
                - - Deuxième mardi
                  - Copie accidentelle du premier
          - type: paragraphe
            texte: Renommez l'onglet actuel Donnees_brutes.
          - type: paragraphe
            texte: Faites un clic droit sur cet onglet, choisissez Déplacer ou copier la feuille, cochez Copier, puis validez.
          - type: paragraphe
            texte: Renommez la nouvelle feuille Donnees_nettoyees.
          - type: paragraphe
            texte: Sur la feuille nettoyée, remplacez 176 kg par 176.
      questions:
          - id: q01
            type: texte
            enonce: Complétez la quantité du vendredi en utilisant le carnet original.
            suite:
                - type: paragraphe
                  texte: Corrigez la quantité du samedi.
                - type: paragraphe
                  texte: Supprimez la ligne correspondant au mardi ajouté une deuxième fois.
                - type: paragraphe
                  texte: Enregistrez votre travail avec Ctrl + S.
                - type: paragraphe
                  texte: ATTENDU
                - type: paragraphe
                  texte: "Votre fichier contient deux feuilles :"
                - type: liste
                  elements:
                      - "Donnees_brutes : les données initiales, avec leurs erreurs ;"
                      - "Donnees_nettoyees : sept journées et des valeurs vérifiées, exploitables dans Calc."
                - type: paragraphe
                  texte: VIGILANCE
                - type: paragraphe
                  texte: Ne corrigez jamais une donnée uniquement parce qu'elle vous semble étrange. Cherchez d'abord une preuve ou une source fiable.
    - id: a08
      titre: 5. Mesurer les conséquences d'un mauvais tableau
      contenu:
          - type: paragraphe
            texte: Pourquoi ce nouvel exercice ? Jusqu'à présent, vous avez nettoyé les données. Nous allons maintenant vérifier si ce nettoyage change réellement les résultats.
          - type: titre
            texte: 5.1. Calculer le total des données brutes
          - type: paragraphe
            texte: Retournez sur la feuille Donnees_brutes.
          - type: paragraphe
            texte: En A11, écrivez Total brut.
      questions:
          - id: q01
            type: texte
            enonce: En C11, saisissez la formule =SOMME(C2:C9).
            aide: Effectue cette manipulation dans Calc ou Excel, puis indique ici la formule, le résultat ou la démarche utilisée.
            suite:
                - type: paragraphe
                  texte: Notez ce résultat dans une cellule libre ou sur votre espace de réponse.
                - type: titre
                  texte: 5.2. Calculer le total des données nettoyées
                - type: paragraphe
                  texte: Nous utilisons maintenant la feuille corrigée pour refaire exactement le même calcul.
                - type: etapes
                  elements:
                      - Ouvrez la feuille Donnees_nettoyees.
                      - En A10, écrivez Total vérifié.
                      - En C10, saisissez =SOMME(C2:C8).
                      - En A11, écrivez Écart constaté.
                      - En C11, saisissez =Donnees_brutes.C11-C10.
                - type: paragraphe
                  texte: AIDE SI BESOIN — Niveau 1
                - type: paragraphe
                  texte: La fonction SOMME additionne les valeurs numériques d'une plage de cellules.
                - type: paragraphe
                  texte: AIDE SI BESOIN — Niveau 2
                - type: paragraphe
                  texte: Une plage comme C2:C8 contient toutes les cellules de C2 à C8.
                - type: paragraphe
                  texte: AIDE SI BESOIN — Niveau 3
                - type: paragraphe
                  texte: Pour calculer une différence entre deux feuilles, cliquez sur la première valeur pendant la saisie de la formule, tapez le signe moins, puis cliquez sur la seconde valeur.
                - type: titre
                  texte: 5.3. Comprendre les résultats
                - type: paragraphe
                  texte: Nous avons maintenant deux résultats différents pour une même semaine. Il faut comprendre ce que cela signifie.
          - id: q02
            type: texte
            enonce: "Quel total est le plus fiable : celui du premier tableau ou celui du tableau nettoyé ? Pourquoi ?"
            suite: []
          - id: q03
            type: texte
            enonce: Que risquerait le responsable en commandant du foin à partir du premier résultat ?
            suite: []
          - id: q04
            type: texte
            enonce: Le tableur a-t-il commis une erreur en calculant le premier total ?
            suite:
                - type: paragraphe
                  texte: Un calcul exact ne garantit pas une information fiable.
                - type: paragraphe
                  texte: Il faut vérifier la qualité des données avant d'interpréter les résultats.
    - id: a09
      titre: 6. Rédiger une recommandation professionnelle
      contenu:
          - type: paragraphe
            texte: Pourquoi terminons-nous ainsi ? Le but du TIM n'est pas seulement de manipuler un logiciel. Il faut savoir communiquer une information fiable et utile à son responsable.
          - type: paragraphe
            texte: "Le responsable vous demande :"
          - type: paragraphe
            texte: « Quelle quantité de foin avons-nous réellement distribuée cette semaine, et pourquoi avez-vous modifié mon tableau ? »
          - type: paragraphe
            texte: Rédigez un court message de 3 à 5 phrases dans une cellule de votre feuille nettoyée, ou dans l'espace de réponse prévu sur le site.
          - type: paragraphe
            texte: "Vous devez préciser :"
          - type: liste
            elements:
                - la quantité totale vérifiée ;
                - au moins deux erreurs découvertes ;
                - pourquoi le nouveau tableau est plus fiable ;
                - une précaution à prendre pour les prochains relevés.
      questions: []
    - id: a10
      titre: 7. À retenir
      contenu:
          - type: paragraphe
            texte: Nettoyer des données signifie les contrôler, vérifier les anomalies et corriger les erreurs confirmées avant de les utiliser.
          - type: paragraphe
            texte: "Les problèmes les plus fréquents sont :"
          - type: liste
            elements:
                - les valeurs manquantes ;
                - les doublons ;
                - les erreurs de saisie ;
                - les formats incompatibles.
          - type: paragraphe
            texte: Données fiables → calculs exploitables → décisions mieux justifiées.
      questions: []
    - id: a11
      titre: 8. Fin de séance — Travail à rendre
      contenu:
          - type: paragraphe
            texte: "Avant de terminer, vérifiez que votre fichier contient :"
          - type: liste
            elements:
                - une feuille Donnees_brutes conservée intacte ;
                - une feuille Donnees_nettoyees avec les sept jours corrects ;
                - le total brut et le total vérifié ;
                - l'écart entre les deux résultats ;
                - votre recommandation professionnelle.
          - type: paragraphe
            texte: "Enregistrez votre fichier :"
          - type: paragraphe
            texte: Term_TIM_S02_NOM_Prenom.ods
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
ressources:
    - type: paragraphe
      texte: Réalise les manipulations dans le logiciel demandé. Conserve tes fichiers sur ton espace habituel. Le site enregistre seulement tes réponses écrites, tes résultats, tes formules et tes démarches ; aucun fichier n’est téléversé.
introduction:
    - type: titre
      texte: Ce que vous allez apprendre
    - type: paragraphe
      texte: Aujourd'hui, nous allons travailler sur la qualité des données.
    - type: paragraphe
      texte: Une donnée peut être absente, mal écrite, enregistrée deux fois ou simplement fausse.
    - type: paragraphe
      texte: Nettoyer des données consiste à identifier ces problèmes, à vérifier les informations et à préparer un tableau fiable pour pouvoir l'utiliser.
    - type: titre
      texte: Ce que vous allez apprendre à faire
    - type: liste
      elements:
          - repérer des valeurs inhabituelles dans un tableau ;
          - reconnaître une donnée manquante, un doublon et une erreur de format ;
          - vérifier une donnée avant de la modifier ;
          - corriger les erreurs avec LibreOffice Calc ;
          - comparer des résultats avant et après nettoyage.
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://chlorofil.fr/diplomes/secondaire/bac-pro/1re-tle/tronc-commun
