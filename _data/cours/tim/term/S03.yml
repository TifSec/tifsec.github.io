titre: Retrouver les informations utiles dans les dépenses d'une écurie
theme: TIM — Retrouver les informations utiles dans les dépenses d'une écurie
problematique: Retrouver les informations utiles dans les dépenses d'une écurie
pourquoi: "Objectif de cette séance : créer un registre d'achats structuré ;"
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances: []
    competences:
        - créer un registre d'achats structuré ;
        - trier les dépenses par montant ;
        - filtrer les achats par catégorie ;
        - combiner plusieurs critères ;
        - extraire les informations nécessaires à une décision.
activites:
    - id: a02
      titre: À quoi cela va-t-il servir ?
      contenu:
          - type: paragraphe
            texte: "Dans une entreprise hippique, cela permet notamment de :"
          - type: liste
            elements:
                - identifier rapidement les dépenses les plus importantes ;
                - retrouver les achats liés à une activité ;
                - comparer plusieurs catégories de dépenses ;
                - préparer un bilan ou un budget ;
                - justifier une décision à partir de données précises.
      questions: []
    - id: a04
      titre: "1. Mission professionnelle : où passe l'argent de l'écurie ?"
      contenu:
          - type: paragraphe
            texte: Vous travaillez dans une écurie de 20 chevaux.
          - type: paragraphe
            texte: Le responsable souhaite mieux comprendre les dépenses réalisées pendant le mois de septembre.
          - type: paragraphe
            texte: Il vous transmet un registre regroupant les achats de l'entreprise.
          - type: paragraphe
            texte: "Votre mission : identifier les dépenses les plus importantes, retrouver celles concernant l'entretien et préparer une recommandation au responsable."
          - type: paragraphe
            texte: "Avant de commencer, réfléchissez à la question suivante :"
      questions:
          - id: q01
            type: texte
            enonce: Si une entreprise possède plusieurs centaines de factures, pourquoi serait-il difficile de retrouver une dépense en les lisant une par une ?
            suite: []
    - id: a05
      titre: 2. Construire le registre des dépenses
      contenu:
          - type: paragraphe
            texte: Pourquoi cet exercice ? Pour rechercher efficacement des informations, elles doivent être correctement organisées dans un tableau.
          - type: paragraphe
            texte: Comme lors des séances précédentes, nous commençons par créer un fichier professionnel.
          - type: etapes
            elements:
                - Ouvrez LibreOffice Calc.
                - Enregistrez immédiatement votre fichier sous le nom Term_TIM_S03_NOM_Prenom.ods.
                - Renommez la première feuille Depenses.
                - "Créez les colonnes suivantes : Date, Catégorie, Désignation, Quantité, Prix unitaire (€), Montant total (€)."
                - Recopiez les données du tableau ci-dessous dans les cinq premières colonnes.
          - type: tableau
            colonnes:
                - Date
                - Catégorie
                - Désignation
                - Quantité
                - Prix unitaire (€)
            lignes:
                - - 02/09/2026
                  - Alimentation
                  - Granulés
                  - "20"
                  - "18"
                - - 03/09/2026
                  - Litière
                  - Copeaux
                  - "30"
                  - "12"
                - - 04/09/2026
                  - Entretien
                  - Fourche
                  - "3"
                  - "25"
                - - 05/09/2026
                  - Foin
                  - Bottes de foin
                  - "40"
                  - "8"
                - - 08/09/2026
                  - Entretien
                  - Balai
                  - "4"
                  - "14"
                - - 10/09/2026
                  - Alimentation
                  - Complément minéral
                  - "10"
                  - "32"
                - - 12/09/2026
                  - Litière
                  - Paille
                  - "25"
                  - "9"
                - - 15/09/2026
                  - Entretien
                  - Réparation abreuvoir
                  - "1"
                  - "185"
                - - 17/09/2026
                  - Foin
                  - Bottes de foin
                  - "50"
                  - "8"
                - - 20/09/2026
                  - Entretien
                  - Produit désinfectant
                  - "6"
                  - "22"
                - - 23/09/2026
                  - Alimentation
                  - Granulés
                  - "25"
                  - "18"
                - - 25/09/2026
                  - Litière
                  - Copeaux
                  - "35"
                  - "12"
          - type: titre
            texte: 2.1. Calculer les montants des achats
          - type: paragraphe
            texte: Pourquoi ? Le prix unitaire ne correspond pas toujours à la dépense réelle. Il faut tenir compte de la quantité achetée.
      questions:
          - id: q01
            type: texte
            enonce: Dans la cellule F2, écrivez la formule permettant de calculer le montant total du premier achat.
            aide: Effectue cette manipulation dans Calc ou Excel, puis indique ici la formule, le résultat ou la démarche utilisée.
            suite: []
          - id: q02
            type: texte
            enonce: Recopiez cette formule jusqu'à la dernière ligne.
            aide: Effectue cette manipulation dans Calc ou Excel, puis indique ici la formule, le résultat ou la démarche utilisée.
            suite:
                - type: paragraphe
                  texte: Affichez les montants au format monétaire, en euros.
                - type: paragraphe
                  texte: Élargissez les colonnes si certains textes ou montants ne sont pas entièrement visibles.
                - type: paragraphe
                  texte: ATTENDU
                - type: paragraphe
                  texte: Votre tableau contient 12 achats, six colonnes et une formule calculant automatiquement chaque montant.
    - id: a06
      titre: "3. Trier les dépenses : lesquelles coûtent le plus cher ?"
      contenu:
          - type: paragraphe
            texte: Le responsable vous demande maintenant d'identifier les achats les plus coûteux.
          - type: paragraphe
            texte: Pourquoi changeons-nous de méthode ? Les dépenses sont actuellement rangées dans l'ordre des dates. Cet ordre ne permet pas de voir immédiatement les montants les plus importants.
          - type: paragraphe
            texte: Nous allons donc utiliser un tri décroissant, qui classe les valeurs de la plus grande à la plus petite.
          - type: paragraphe
            texte: Cliquez sur une cellule du tableau, puis sélectionnez la plage A1:F13.
          - type: paragraphe
            texte: Ouvrez le menu Données > Trier.
          - type: paragraphe
            texte: Choisissez la colonne Montant total (€).
          - type: paragraphe
            texte: Choisissez l'ordre décroissant, puis validez.
      questions:
          - id: q01
            type: texte
            enonce: Vérifiez que chaque montant est toujours associé au bon achat.
            suite:
                - type: paragraphe
                  texte: Répondez aux questions suivantes dans votre fichier, sous votre tableau, en laissant au moins une ligne vide.
          - id: q02
            type: texte
            enonce: Quel est l'achat le plus coûteux ? Indiquez sa désignation et son montant.
            suite: []
          - id: q03
            type: texte
            enonce: Quels sont les trois achats les plus coûteux ?
            suite: []
          - id: q04
            type: texte
            enonce: Pourquoi un tri décroissant est-il plus adapté qu'un tri alphabétique pour cette question ?
            suite:
                - type: paragraphe
                  texte: AIDE SI BESOIN — Niveau 1
                - type: paragraphe
                  texte: Le tri décroissant place les valeurs les plus grandes en premier.
                - type: paragraphe
                  texte: AIDE SI BESOIN — Niveau 2
                - type: paragraphe
                  texte: Sélectionnez tout le tableau, puis choisissez le montant comme critère de tri.
                - type: paragraphe
                  texte: AIDE SI BESOIN — Niveau 3
                - type: paragraphe
                  texte: Sélectionnez A1:F13, ouvrez Données > Trier, choisissez Montant total (€), puis Décroissant.
    - id: a07
      titre: "4. Filtrer : retrouver seulement les dépenses d'entretien"
      contenu:
          - type: paragraphe
            texte: Le responsable doit maintenant préparer un bilan des achats et interventions concernant l'entretien des installations.
          - type: paragraphe
            texte: Pourquoi changeons-nous d'outil ? Le tri classe toutes les dépenses, mais nous avons maintenant besoin de voir uniquement celles d'une catégorie.
          - type: paragraphe
            texte: "Nous allons utiliser un filtre : les lignes qui ne correspondent pas à notre recherche seront temporairement masquées, sans être supprimées."
          - type: paragraphe
            texte: Sélectionnez à nouveau la plage A1:F13.
          - type: paragraphe
            texte: Ouvrez Données > AutoFiltre.
          - type: paragraphe
            texte: Cliquez sur la flèche située dans l'en-tête Catégorie.
          - type: paragraphe
            texte: Conservez uniquement la catégorie Entretien, puis validez.
      questions:
          - id: q01
            type: texte
            enonce: Observez le tableau. Les autres achats ont-ils été supprimés ?
            suite:
                - type: paragraphe
                  texte: "Répondez maintenant aux questions suivantes :"
          - id: q02
            type: texte
            enonce: Combien de dépenses concernent l'entretien ?
            suite: []
          - id: q03
            type: texte
            enonce: Quelle est la dépense d'entretien la plus importante ?
            suite: []
          - id: q04
            type: texte
            enonce: Pourquoi serait-il dangereux de supprimer définitivement les autres lignes pour ne conserver que l'entretien ?
            suite:
                - type: titre
                  texte: 4.1. Retrouver toutes les données
                - type: paragraphe
                  texte: Ouvrez à nouveau le filtre de la colonne Catégorie.
                - type: paragraphe
                  texte: Réactivez l'affichage de toutes les catégories.
          - id: q05
            type: texte
            enonce: Vérifiez qu'aucune ligne n'a été perdue.
            suite:
                - type: paragraphe
                  texte: Le tri change l'ordre d'affichage des données.
                - type: paragraphe
                  texte: Le filtre sélectionne temporairement les données affichées selon un critère.
                - type: paragraphe
                  texte: Les deux outils sont complémentaires, mais ne répondent pas au même besoin.
    - id: a08
      titre: 5. Rechercher avec plusieurs critères
      contenu:
          - type: paragraphe
            texte: Le responsable souhaite maintenant connaître les dépenses d'alimentation dont le montant dépasse 300 €.
          - type: paragraphe
            texte: Pourquoi cet exercice ? Dans une entreprise, une recherche porte rarement sur un seul critère. Il faut parfois sélectionner à la fois une catégorie et un montant.
          - type: paragraphe
            texte: Nous allons donc combiner deux filtres pour obtenir uniquement les achats qui respectent les deux conditions.
          - type: paragraphe
            texte: Dans le filtre de la colonne Catégorie, sélectionnez uniquement Alimentation.
          - type: paragraphe
            texte: Dans le filtre de la colonne Montant total (€), sélectionnez uniquement les montants strictement supérieurs à 300 €.
      questions:
          - id: q01
            type: texte
            enonce: Combien d'achats correspondent aux deux conditions ?
            suite: []
          - id: q02
            type: texte
            enonce: Quel est le montant le plus élevé parmi ces achats ?
            suite: []
          - id: q03
            type: texte
            enonce: Si le responsable demande maintenant les achats de foin, quelle modification faut-il faire ?
            suite:
                - type: paragraphe
                  texte: AIDE SI BESOIN — Niveau 1
                - type: paragraphe
                  texte: "Les deux critères doivent être respectés en même temps : la bonne catégorie ET le bon montant."
                - type: paragraphe
                  texte: AIDE SI BESOIN — Niveau 2
                - type: paragraphe
                  texte: Commencez par filtrer Alimentation, puis examinez les montants restants.
                - type: paragraphe
                  texte: AIDE SI BESOIN — Niveau 3
                - type: paragraphe
                  texte: "Dans Catégorie, conservez Alimentation. Dans Montant total, sélectionnez les valeurs supérieures à 300 : 320, 360 et 450."
                - type: paragraphe
                  texte: VIGILANCE
                - type: paragraphe
                  texte: Plusieurs filtres peuvent rester actifs simultanément. Avant une nouvelle recherche, vérifiez toujours quels critères sont encore appliqués.
    - id: a09
      titre: "6. Mission finale : conseiller le responsable"
      contenu:
          - type: paragraphe
            texte: Pourquoi cette dernière activité ? Maintenant que vous savez retrouver et classer les données, il faut utiliser ces informations pour répondre à une question professionnelle.
          - type: paragraphe
            texte: "Le responsable de l'écurie vous demande :"
          - type: paragraphe
            texte: « Je souhaite surveiller nos dépenses. Quelles sont les trois dépenses individuelles les plus importantes du mois, et combien avons-nous dépensé pour l'entretien ? »
          - type: titre
            texte: 6.1. Rechercher les informations
          - type: paragraphe
            texte: Retirez les filtres actifs afin de retrouver les 12 achats.
          - type: paragraphe
            texte: Retrouvez les trois dépenses individuelles les plus importantes.
          - type: paragraphe
            texte: Filtrez les achats pour afficher uniquement les dépenses d'entretien.
      questions:
          - id: q01
            type: texte
            enonce: Calculez le total de ces quatre dépenses dans une cellule située hors du tableau, par exemple H2.
            aide: Effectue cette manipulation dans Calc ou Excel, puis indique ici la formule, le résultat ou la démarche utilisée.
            suite:
                - type: titre
                  texte: 6.2. Rédiger une recommandation
                - type: paragraphe
                  texte: Dans une zone libre de votre fichier, rédigez un court message professionnel de 3 à 5 phrases.
                - type: paragraphe
                  texte: "Votre message doit indiquer :"
                - type: liste
                  elements:
                      - les trois achats les plus coûteux ;
                      - le total des dépenses d'entretien ;
                      - une proposition de vérification ou de suivi des dépenses ;
                      - l'intérêt du tri ou du filtrage pour cette analyse.
    - id: a10
      titre: 7. À retenir
      contenu:
          - type: paragraphe
            texte: Trier permet de ranger les données dans un ordre précis.
          - type: paragraphe
            texte: Filtrer permet de n'afficher que les données correspondant à un ou plusieurs critères.
          - type: paragraphe
            texte: Ces outils permettent de retrouver rapidement les informations utiles dans un tableau contenant de nombreux enregistrements.
          - type: paragraphe
            texte: Une recherche pertinente commence toujours par une question précise.
      questions: []
    - id: a11
      titre: 8. Fin de séance — Travail à rendre
      contenu:
          - type: paragraphe
            texte: "Votre fichier doit contenir :"
          - type: liste
            elements:
                - le tableau de 12 achats correctement structuré ;
                - les montants calculés avec des formules ;
                - les réponses aux questions ;
                - le total des dépenses d'entretien ;
                - votre recommandation professionnelle.
          - type: paragraphe
            texte: Avant de terminer, retirez les filtres actifs et vérifiez que tous les achats sont visibles.
          - type: paragraphe
            texte: "Enregistrez votre fichier sous :"
          - type: paragraphe
            texte: Term_TIM_S03_NOM_Prenom.ods
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
ressources:
    - type: paragraphe
      texte: Réalise les manipulations dans le logiciel demandé. Conserve tes fichiers sur ton espace habituel. Le site enregistre seulement tes réponses écrites, tes résultats, tes formules et tes démarches ; aucun fichier n’est téléversé.
introduction:
    - type: titre
      texte: Ce que vous allez apprendre
    - type: paragraphe
      texte: Aujourd'hui, nous allons apprendre à trier et filtrer des données dans un tableur.
    - type: paragraphe
      texte: "Trier consiste à ranger des informations dans un ordre précis : du plus petit au plus grand, du plus récent au plus ancien, ou par ordre alphabétique."
    - type: paragraphe
      texte: Filtrer consiste à afficher uniquement les lignes correspondant à un ou plusieurs critères, sans supprimer les autres données.
    - type: titre
      texte: Ce que vous allez apprendre à faire
    - type: liste
      elements:
          - créer un registre d'achats structuré ;
          - trier les dépenses par montant ;
          - filtrer les achats par catégorie ;
          - combiner plusieurs critères ;
          - extraire les informations nécessaires à une décision.
