titre: 'Séance 14 : Évaluer la dimension sociale : le temps de travail'
themes:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
problematique: Comment mesurer et objectiver la charge de travail dans une structure équine ?
competences_bo:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
objectifs:
    connaissances:
        - Le travail d’astreinte (soins quotidiens) se mesure en heures par jour et par cheval.
        - Un tableau de relevé et un tableau croisé dynamique résument le temps par tâche.
    competences:
        - Organiser un relevé de temps.
        - Résumer avec un tableau croisé dynamique.
pourquoi:
    - En S13, l’environnement ; en S06, l’économie.
    - 'La dimension sociale compte aussi : les salariés et l’exploitant sont-ils surchargés ?'
activites:
    -   id: a01
        titre: Le relevé
        consigne: Tu vas examiner le relevé d’une semaine de travail (temps_travail.ods). On attend le nombre de lignes et les tâches.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre le fichier fourni temps_travail.ods (une semaine de relevés).
                    - 'Colonnes : date, personne, tâche, minutes.'
                    - Vérifie le format.
            -   type: paragraphe
                texte: Pourquoi un relevé ? Le ressenti « on n’arrête pas » ne suffit pas pour décider d’embaucher.
        questions:
            -   id: q01
                type: texte
                enonce: Combien de lignes compte le relevé, et quelles tâches sont listées ?
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a02
        titre: Résumer
        transition: Le relevé est prêt. Résume-le.
        consigne: Tu vas résumer le temps par tâche avec une table dynamique et calculer les minutes par cheval et par jour. On attend la tâche principale et l’indicateur.
        contenu:
            -   type: etapes
                elements:
                    - 'Table dynamique : tâche en ligne, somme des minutes en données.'
                    - Convertis en heures ; calcule les minutes par cheval et par jour (40 chevaux, 7 jours).
            -   type: paragraphe
                texte: Pourquoi par cheval et par jour ? C’est l’indicateur qu’on compare entre structures.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle tâche prend le plus de temps, et combien d’heures par semaine ?
                aide: Une phrase complète qui reprend les mots de la question.
            -   id: q02
                type: nombre
                enonce: Le total est de 98 h par semaine. Combien de minutes par cheval et par jour ?
                unite: min
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a03
        titre: Améliorer
        transition: Tu sais où passe le temps. Comment en gagner ?
        consigne: Tu vas proposer une amélioration de la tâche la plus longue et estimer le temps gagné. On attend l’amélioration et l’estimation.
        contenu:
            -   type: etapes
                elements:
                    - Propose une organisation ou un équipement qui réduit la tâche la plus longue.
                    - Estime le temps gagné.
            -   type: paragraphe
                texte: Pourquoi estimer ? Pour comparer le gain au coût de l’équipement.
        questions:
            -   id: q01
                type: texte
                enonce: Propose une amélioration de la tâche la plus longue et estime le temps gagné par semaine.
                aide: Une idée réaliste + « Cela permet de… ».
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le temps gagné a une valeur.
        questions:
            -   id: q01
                type: texte
                enonce: Combien vaut 8 h par semaine sur un an à 15 €/h chargé ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as objectivé la charge de travail. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment mesurer et objectiver la charge de travail dans une structure équine ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Astreinte : min/cheval/jour.'
    - Table dynamique par tâche.
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
