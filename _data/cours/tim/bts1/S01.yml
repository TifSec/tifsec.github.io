titre: 'Séance 1 : Positionnement : mes compétences numériques pour piloter une exploitation'
themes:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
problematique: Quelles compétences numériques un responsable d’exploitation doit-il maîtriser, et où en suis-je ?
competences_bo:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
objectifs:
    connaissances:
        - Le BTSA ACS’AGRI forme à analyser, conduire et décider dans une entreprise agricole ; le numérique sert la capacité C4 (évaluer la performance, ajuster la conduite).
        - 'Outils : tableur avancé, gestion de données, outils d’aide à la décision, communication professionnelle.'
    competences:
        - Se positionner sur des compétences numériques professionnelles.
        - Relier les outils numériques aux décisions de l’exploitant.
pourquoi:
    - Tu arrives en BTSA ACS’AGRI avec des parcours variés (Bac Pro CGEH, Bac général, STAV…).
    - Le TIM t’apprend à utiliser le numérique pour évaluer et piloter une exploitation, ici une structure équine (pension, élevage).
activites:
    -   id: a01
        titre: Les outils et les décisions
        consigne: Tu vas associer trois décisions d’un exploitant de structure équine (document 1) à l’outil numérique le plus adapté. On attend un outil par décision.
        contenu:
            -   type: liste
                elements:
                    - Fixer le prix de la pension l’an prochain.
                    - Suivre les vaccinations de 40 chevaux.
                    - Présenter le projet d’agrandissement à la banque.
            -   type: etapes
                elements:
                    - Lis les décisions d’un exploitant (document 1).
                    - Associe à chacune l’outil numérique le plus adapté.
            -   type: paragraphe
                texte: Pourquoi associer ? Un outil n’a de valeur que s’il éclaire une décision.
        questions:
            -   id: q01
                type: tableau
                enonce: Associe l’outil à la décision.
                colonnes:
                    - Décision
                    - Outil
                lignes:
                    -   - Fixer le prix de la pension l’an prochain
                        - ''
                    -   - Suivre les vaccinations de 40 chevaux
                        - ''
                    -   - Présenter le projet d’agrandissement à la banque
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: Mon positionnement
        transition: Tu vois à quoi servent les outils. Où en es-tu ?
        consigne: Tu vas évaluer ton niveau sur quatre compétences numériques utiles en BTSA. On attend un niveau pour chacune.
        contenu:
            -   type: etapes
                elements:
                    - 'Évalue ton niveau : 1 (débutant) à 4 (expert).'
                    - 'Sois honnête : cela sert à adapter les aides.'
            -   type: paragraphe
                texte: Pourquoi se positionner ? Le parcours est différencié selon les niveaux.
        questions:
            -   id: q01
                type: tableau
                enonce: Indique ton niveau (1 à 4).
                colonnes:
                    - Compétence
                    - Niveau
                lignes:
                    -   - Formules et références absolues
                        - ''
                    -   - Fonctions logiques (SI, ET, OU)
                        - ''
                    -   - Tableau croisé dynamique
                        - ''
                    -   - Document long (styles, sommaire)
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a03
        titre: Un test court
        transition: Ton avis est donné. Vérifions par un test.
        consigne: Tu vas répondre à deux questions de tableur (référence absolue, fonction SI) sur une situation d’exploitation. On attend une formule et un résultat.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis la situation : coût du foin = quantité × prix ; le prix est en E1 pour toutes les lignes.'
                    - Réponds.
            -   type: paragraphe
                texte: Pourquoi ce test ? Les références absolues sont la base de tous les modèles de coûts.
        questions:
            -   id: q01
                type: texte
                enonce: Écris la formule de C2 (quantité en B2, prix unique en E1) qui pourra être recopiée vers le bas.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
            -   id: q02
                type: qcm
                enonce: Que renvoie =SI(B2>365;"retard";"ok") si B2 vaut 400 ?
                choix:
                    -   id: a
                        texte: retard
                    -   id: b
                        texte: ok
                    -   id: c
                        texte: Une erreur
                aide: Élimine d’abord les réponses impossibles.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Les outils d’aide à la décision (OAD) se multiplient en agriculture.
        questions:
            -   id: q01
                type: texte
                enonce: Cite un OAD que tu connais (élevage ou culture).
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton positionnement est fait. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quelles compétences numériques un responsable d’exploitation doit-il maîtriser, et où en es-tu ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Le numérique éclaire les décisions (C4).
    - 'Positionnement : base du parcours.'
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
