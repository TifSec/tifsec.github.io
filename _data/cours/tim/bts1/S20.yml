titre: 'Séance 20 : Travailler à plusieurs sur les mêmes fichiers'
themes:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
problematique: Comment collaborer sur des fichiers sans perdre ni écraser le travail des autres ?
competences_bo:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
objectifs:
    connaissances:
        - 'Espace partagé (ENT, Nextcloud) : droits de lecture / écriture, historique des versions.'
        - 'Règles : nommage commun, un responsable par fichier, commentaires plutôt que modifications, suivi des modifications.'
    competences:
        - Organiser un espace partagé.
        - Utiliser le suivi des modifications.
pourquoi:
    - Les dossiers de BTSA se font souvent en groupe, comme le travail avec un conseiller.
    - Aujourd’hui, vous co-rédigez un rapport à trois.
activites:
    -   id: a01
        titre: Les règles du groupe
        consigne: Tu vas rédiger avec ton groupe quatre règles de travail sur des fichiers partagés. On attend les règles et le problème que chacune évite.
        contenu:
            -   type: etapes
                elements:
                    - Rédigez ensemble 4 règles de travail partagé.
                    - 'Chaque règle : une action + le problème qu’elle évite.'
            -   type: paragraphe
                texte: Pourquoi des règles ? Deux personnes qui enregistrent le même fichier en même temps peuvent s’écraser.
        questions:
            -   id: q01
                type: texte
                enonce: Écris les 4 règles de ton groupe.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a02
        titre: Le suivi des modifications
        transition: Les règles sont posées. Utilise les outils de relecture.
        consigne: Tu vas proposer une modification avec le suivi des modifications et la faire accepter ou refuser. On attend la modification et la décision.
        contenu:
            -   type: etapes
                elements:
                    - 'Dans Writer : Édition > Suivi des modifications > Enregistrer.'
                    - Modifie la partie d’un camarade ; ajoute un commentaire.
                    - Le camarade accepte ou refuse.
            -   type: paragraphe
                texte: Pourquoi le suivi ? L’auteur garde la main sur son texte.
        questions:
            -   id: q01
                type: texte
                enonce: Décris une modification que tu as proposée et la décision de ton camarade.
                aide: Une idée réaliste + « Cela permet de… ».
    -   id: a03
        titre: Les droits et les versions
        transition: La relecture fonctionne. Protège le travail.
        consigne: Tu vas régler les droits de l’espace partagé et restaurer une version précédente. On attend les droits et la méthode.
        contenu:
            -   type: etapes
                elements:
                    - 'Dans l’espace partagé, règle : lecture seule pour le professeur-conseiller, écriture pour le groupe.'
                    - Restaure une version précédente d’un fichier.
            -   type: paragraphe
                texte: Pourquoi les versions ? On peut revenir en arrière après une erreur.
        questions:
            -   id: q01
                type: texte
                enonce: Quels droits as-tu donnés, et comment as-tu restauré une version ?
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un fichier partagé contient des données personnelles de clients.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle précaution ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais collaborer sur des fichiers. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment collaborer sur des fichiers sans perdre ni écraser le travail des autres ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Règles, suivi des modifications, droits, versions.
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
