titre: 'Séance 7 : Le coût alimentaire par cheval et par jour'
themes:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
problematique: Combien coûte l’alimentation d’un cheval par jour, et comment la comparer ?
competences_bo:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
objectifs:
    connaissances:
        - Coût alimentaire = quantités × prix ; ramené à cheval·jour.
        - Les références absolues ($) appellent les prix de la feuille Paramètres.
    competences:
        - Construire un calcul avec références absolues.
        - Comparer à une référence.
pourquoi:
    - En S06, l’alimentation est la plus grosse charge opérationnelle.
    - 'Le gérant veut un indicateur précis : coût alimentaire par cheval et par jour.'
activites:
    -   id: a01
        titre: Les formules
        consigne: Tu vas écrire la formule du coût alimentaire de chaque cheval avec des références absolues vers les prix. On attend un coût calculé et une formule recopiée.
        contenu:
            -   type: etapes
                elements:
                    - 'Feuille Données : colonnes Foin (kg), Granulés (kg) par cheval et par mois.'
                    - 'Feuille Paramètres : prix foin 0,18 €/kg (B2), granulés 0,55 €/kg (B3).'
                    - 'Colonne Coût : =E2*Paramètres.$B$2+F2*Paramètres.$B$3.'
            -   type: paragraphe
                texte: Pourquoi $ ? La formule recopiée garde les mêmes prix.
        questions:
            -   id: q01
                type: nombre
                enonce: Un cheval mange 270 kg de foin et 60 kg de granulés dans le mois. Quel est son coût alimentaire mensuel ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: texte
                enonce: Écris la formule de la ligne 5.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a02
        titre: Par cheval et par jour
        transition: Tu as le coût mensuel. Ramène-le à l’unité de comparaison.
        consigne: Tu vas ramener le coût alimentaire à un indicateur par cheval et par jour. On attend le coût par jour et une explication d’écart.
        contenu:
            -   type: etapes
                elements:
                    - Divise par le nombre de jours (colonne Jours).
                    - Calcule la moyenne de l’écurie.
                    - Repère le cheval le plus coûteux.
            -   type: paragraphe
                texte: Pourquoi par jour ? Les mois n’ont pas tous la même durée, et c’est l’unité des références.
        questions:
            -   id: q01
                type: nombre
                enonce: Pour le cheval de la mission 1 (30 jours), quel est le coût par jour ?
                unite: €/jour
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: texte
                enonce: Pourquoi un cheval peut-il coûter bien plus que la moyenne ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a03
        titre: Comparer et décider
        transition: Tu as l’indicateur. Est-il bon ?
        consigne: Tu vas comparer le coût alimentaire de la pension à une référence et proposer une action. On attend l’écart chiffré et une action.
        contenu:
            -   type: etapes
                elements:
                    - Une référence de groupe (fictive) indique 2,40 €/cheval/jour pour une pension comparable.
                    - Compare et propose une action.
            -   type: paragraphe
                texte: Pourquoi comparer ? Un indicateur seul ne dit pas si c’est bien ou mal.
        questions:
            -   id: q01
                type: texte
                enonce: La pension est à 2,85 € par cheval et par jour en moyenne. Compare à la référence et propose une action chiffrée.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un changement de 0,02 €/kg sur le foin.
        questions:
            -   id: q01
                type: texte
                enonce: Quel effet sur le coût annuel pour 40 chevaux à 9 kg/jour ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as un indicateur de coût alimentaire. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : combien coûte l’alimentation d’un cheval par jour, et comment la comparer ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Coût = Σ quantités × prix ($).
    - Indicateur par cheval·jour ; comparer.
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
