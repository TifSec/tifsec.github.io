titre: 'Séance 18 : Intégrer données et graphiques au rapport'
themes:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
problematique: Comment intégrer proprement tableaux et graphiques du tableur dans un rapport ?
competences_bo:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
objectifs:
    connaissances:
        - Coller un graphique en objet lié ou en image ; un tableau en collage spécial.
        - Légendes numérotées, liste des figures, renvois automatiques (Insertion > Renvoi).
    competences:
        - Insérer et légender des objets.
        - Créer une liste des figures et des renvois.
pourquoi:
    - En S17, le rapport est structuré.
    - Il doit intégrer tes graphiques et tableaux sans les déformer.
activites:
    -   id: a01
        titre: Lier ou figer ?
        consigne: Tu vas choisir entre objet lié et image selon deux situations (document 1). On attend un choix par situation.
        contenu:
            -   type: liste
                elements:
                    - 'Objet lié : se met à jour quand le classeur change ; le fichier source doit suivre.'
                    - 'Image : figée, légère, indépendante.'
            -   type: etapes
                elements:
                    - Lis les deux options (document 1).
                    - Choisis selon la situation.
                    - Pourquoi choisir ? Un objet lié se met à jour, mais dépend du fichier source.
        questions:
            -   id: q01
                type: tableau
                enonce: Lié ou image ?
                colonnes:
                    - Situation
                    - Choix
                lignes:
                    -   - Rapport encore en cours, données qui changent
                        - ''
                    -   - Rapport final envoyé au conseiller
                        - ''
                aide: Un objet lié suit les changements du tableur. Le rapport final doit-il encore changer ?
    -   id: a02
        titre: Légendes et liste des figures
        transition: Tu sais quoi coller. Légende et répertorie.
        consigne: Tu vas légender trois figures de ton rapport de diagnostic et insérer la liste des figures. On attend tes trois légendes.
        contenu:
            -   type: etapes
                elements:
                    - Insère 3 figures légendées (clic droit > Insérer une légende).
                    - Insertion > Table des matières et index > Table des illustrations.
                    - Pourquoi une liste des figures ? Le lecteur retrouve un graphique sans feuilleter.
        questions:
            -   id: q01
                type: texte
                enonce: Écris tes 3 légendes.
                aide: 'Chaque légende : « Figure n — », ce qu’elle montre, et la source.'
    -   id: a03
        titre: Les renvois
        transition: Les figures sont légendées. Relie-les au texte.
        consigne: Tu vas insérer des renvois automatiques vers tes figures et tester leur mise à jour. On attend ce qui se passe.
        contenu:
            -   type: etapes
                elements:
                    - Dans le texte, Insertion > Renvoi > Figure 2 (numéro).
                    - 'Déplace une figure : le numéro se met à jour.'
                    - Pourquoi un renvoi automatique ? Si on ajoute une figure, tous les numéros restent justes.
        questions:
            -   id: q01
                type: texte
                enonce: Que se passe-t-il quand tu insères une nouvelle figure avant la figure 2 ?
                aide: 'Insère une figure avant la figure 2, puis mets les champs à jour : regarde le numéro et le renvoi dans le texte.'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le poids du rapport augmente avec les images.
        questions:
            -   id: q01
                type: texte
                enonce: Comment l’alléger à l’export PDF ?
                aide: Dans la fenêtre d’export PDF, cherche les options de compression et de résolution des images.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton rapport intègre données et graphiques. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment intégrer proprement tableaux et graphiques du tableur dans un rapport ?'
                aide: Dis quand lier, quand coller en image, et comment légendes, liste des figures et renvois se mettent à jour.
retenir:
    - Lié / image.
    - Légendes, liste des figures, renvois.
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
