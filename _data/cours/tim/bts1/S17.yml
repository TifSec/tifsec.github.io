titre: 'Séance 17 : Le rapport d’analyse : document long structuré'
themes:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
problematique: Comment structurer un rapport d’analyse professionnel ?
competences_bo:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
objectifs:
    connaissances:
        - 'Document long : styles hiérarchisés, numérotation des titres, table des matières, en-têtes et pieds de page, sections (orientation paysage pour un tableau).'
        - 'Plan d’un rapport d’analyse : contexte, méthode, résultats, diagnostic, préconisations, annexes.'
    competences:
        - Utiliser les automatismes du document long.
        - Construire un plan de rapport.
pourquoi:
    - Les diagnostics de S15-S16 doivent être restitués par écrit.
    - Le rapport sera aussi la base de tes dossiers d’examen.
activites:
    -   id: a01
        titre: Le plan
        consigne: Tu vas construire le plan du rapport de diagnostic de l’exploitation. On attend tes titres de niveau 1 et 2.
        contenu:
            -   type: etapes
                elements:
                    - Construis le plan du rapport de diagnostic (titres 1 et 2).
                    - 'Vérifie : chaque partie répond à une question.'
            -   type: paragraphe
                texte: Pourquoi un plan par questions ? Le lecteur trouve la réponse qu’il cherche.
        questions:
            -   id: q01
                type: texte
                enonce: Écris ton plan (titres de niveau 1 et 2).
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a02
        titre: Les automatismes
        transition: Le plan est prêt. Mets en place les automatismes.
        consigne: Tu vas mettre en place les automatismes du rapport (numérotation, sommaire, en-tête, page paysage). On attend ta méthode pour la page paysage.
        contenu:
            -   type: etapes
                elements:
                    - Applique les styles ; Outils > Numérotation des chapitres.
                    - Insère la table des matières ; en-tête (titre), pied de page (page X sur Y).
                    - Insère une section ou une page en orientation paysage pour le tableau des indicateurs.
            -   type: paragraphe
                texte: Pourquoi une page paysage ? Un grand tableau reste lisible sans réduire la police.
        questions:
            -   id: q01
                type: texte
                enonce: Comment as-tu obtenu une seule page en paysage au milieu du document ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a03
        titre: Rédiger une partie
        transition: La structure est en place. Rédige.
        consigne: Tu vas rédiger la partie « Résultats environnementaux » du rapport. On attend cette partie.
        contenu:
            -   type: etapes
                elements:
                    - 'Rédige la partie « Résultats environnementaux » : indicateurs, graphique légendé, phrase de renvoi.'
            -   type: paragraphe
                texte: Pourquoi un renvoi ? Le texte et la figure se répondent.
        questions:
            -   id: q01
                type: texte
                enonce: Recopie ta partie « Résultats environnementaux ».
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un modèle (.ott) peut contenir toute la structure.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi en créer un pour la promotion ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton rapport est structuré. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment structurer un rapport d’analyse professionnel ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Plan : contexte, méthode, résultats, diagnostic, préconisations.'
    - Styles, numérotation, sommaire, sections.
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
