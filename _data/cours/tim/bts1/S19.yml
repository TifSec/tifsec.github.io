titre: 'Séance 19 : Présenter un diagnostic à un décideur'
themes:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
problematique: Comment construire une présentation qui aide un exploitant à décider ?
competences_bo:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
objectifs:
    connaissances:
        - 'Une présentation de décision : message principal d’abord, preuves (3 indicateurs), options, recommandation.'
        - Charte graphique sobre ; un message par diapositive ; titres-phrases.
    competences:
        - Construire une présentation orientée décision.
        - Rédiger des titres-phrases.
pourquoi:
    - Le rapport (S17-S18) est complet.
    - L’exploitant veut 10 minutes de présentation avant de décider.
activites:
    -   id: a01
        titre: Les titres-phrases
        consigne: Tu vas transformer deux titres neutres en titres-phrases qui portent un message (document 1). On attend deux titres-phrases.
        contenu:
            -   type: liste
                elements:
                    - Chargement
                    - Marge par cheval
            -   type: etapes
                elements:
                    - Transforme des titres neutres en titres-phrases (document 1).
                    - Pourquoi un titre-phrase ? Le décideur lit le message même sans écouter.
        questions:
            -   id: q01
                type: tableau
                enonce: Réécris en titre-phrase.
                colonnes:
                    - Titre neutre
                    - Titre-phrase
                lignes:
                    -   - Chargement
                        - ''
                    -   - Marge par cheval
                        - ''
                aide: Un titre-phrase dit ce qu’il faut retenir, avec le chiffre de ton diagnostic et une comparaison.
    -   id: a02
        titre: Le scénario de présentation
        transition: Les titres portent le message. Construis le scénario.
        consigne: Tu vas construire le scénario de six diapositives orienté décision. On attend les six titres.
        contenu:
            -   type: etapes
                elements:
                    - 'Construis 6 diapositives : message principal, 3 preuves, 2 options comparées, recommandation.'
                    - Applique une charte sobre (masque).
                    - Pourquoi les options ? Le décideur choisit ; tu éclaires.
        questions:
            -   id: q01
                type: texte
                enonce: Écris le titre de chacune de tes 6 diapositives.
                aide: 'Ton scénario : le message principal d’abord, puis les preuves, les options et ta recommandation. Un titre-phrase par diapositive.'
    -   id: a03
        titre: Répétition
        transition: La présentation est prête. Entraîne-toi.
        consigne: Tu vas répéter ta présentation devant un binôme qui joue l’exploitant. On attend sa question et ta réponse chiffrée.
        contenu:
            -   type: etapes
                elements:
                    - Présente en 10 minutes à un binôme qui joue l’exploitant.
                    - Il pose une question difficile.
                    - Pourquoi une question difficile ? En situation réelle, l’exploitant teste ta solidité.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle question t’a-t-on posée, et quelle réponse chiffrée as-tu donnée ?
                aide: 'Recopie la question de la répétition et ta réponse : quel chiffre de ton diagnostic as-tu utilisé ?'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le mode présentateur affiche notes et minuteur.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi l’utiliser ?
                aide: Le mode présentateur te montre les notes et un minuteur, mais pas au public. Qu’est-ce que ça t’évite ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ta présentation aide à décider. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment construire une présentation qui aide un exploitant à décider ?'
                aide: 'Dis comment tu organises la présentation pour un décideur : message, titres-phrases, preuves, options.'
retenir:
    - Titres-phrases ; message → preuves → options → recommandation.
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
