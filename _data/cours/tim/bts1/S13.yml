titre: 'Séance 13 : Évaluer la performance environnementale : chargement et intrants'
themes:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
problematique: Comment mesurer la durabilité d’un système d’élevage équin avec des indicateurs chiffrés ?
competences_bo:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
objectifs:
    connaissances:
        - La performance globale combine économie, social et environnement.
        - 'Indicateurs environnementaux simples : chargement (UGB/ha de surface fourragère), autonomie fourragère (% de fourrage produit sur place), achats d’intrants.'
    competences:
        - Calculer des indicateurs environnementaux.
        - Les interpréter.
pourquoi:
    - Jusqu’ici, tu as évalué l’économie de l’atelier.
    - 'C4.1 demande d’évaluer la performance globale : l’environnement en fait partie.'
activites:
    -   id: a01
        titre: Le chargement
        consigne: Tu vas calculer le chargement de l’élevage (document 1) et le comparer à un repère. On attend le chargement et une interprétation.
        contenu:
            -   type: liste
                elements:
                    - 40 chevaux adultes (≈ 40 UGB).
                    - 'Surface fourragère (SFP) : 25 ha.'
                    - 'Foin produit sur place : 60 t ; foin acheté : 90 t.'
                    - 'Concentrés achetés : 30 t.'
            -   type: paragraphe
                texte: Données fictives créées pour l’exercice (ordres de grandeur réalistes pour une structure équine).
            -   type: etapes
                elements:
                    - Lis les données de l’élevage (document 1).
                    - Un cheval adulte ≈ 1 UGB (ordre de grandeur).
                    - Calcule le chargement.
            -   type: paragraphe
                texte: Pourquoi le chargement ? Trop d’animaux par hectare abîme les prairies et oblige à acheter du fourrage.
        questions:
            -   id: q01
                type: nombre
                enonce: D’après le document 1, quel est le chargement en UGB par hectare de SFP ?
                unite: UGB/ha
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: texte
                enonce: 'Ce chargement est-il élevé pour des prairies de moyenne montagne (repère : 1 à 1,2 UGB/ha) ? Justifie.'
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a02
        titre: L’autonomie fourragère
        transition: Le chargement est élevé. L’élevage est-il autonome ?
        consigne: Tu vas calculer l’autonomie fourragère de l’élevage dans le tableur. On attend le pourcentage et la formule.
        contenu:
            -   type: etapes
                elements:
                    - Autonomie = foin produit / foin total consommé.
                    - Calcule dans le tableur ; format pourcentage.
            -   type: paragraphe
                texte: Pourquoi l’autonomie ? Moins on achète, moins on dépend des prix et des transports.
        questions:
            -   id: q01
                type: nombre
                enonce: Quelle est l’autonomie fourragère ?
                unite: '%'
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: texte
                enonce: Écris la formule utilisée dans le tableur (produit en B2, acheté en B3).
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a03
        titre: Proposer un ajustement
        transition: Tu as deux indicateurs. Que faire ?
        consigne: Tu vas proposer un ajustement de la conduite de l’élevage et chiffrer son effet sur un indicateur. On attend l’ajustement et son effet.
        contenu:
            -   type: etapes
                elements:
                    - Relis les deux indicateurs.
                    - Propose un ajustement de conduite (C4.3) et son effet chiffré attendu.
            -   type: paragraphe
                texte: Pourquoi chiffrer ? On vérifiera l’an prochain si l’ajustement a marché.
        questions:
            -   id: q01
                type: texte
                enonce: Propose un ajustement et chiffre son effet sur un indicateur.
                aide: Une idée réaliste + « Cela permet de… ».
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Les références d’UGB varient selon le type d’équidé.
        questions:
            -   id: q01
                type: texte
                enonce: Où trouver des références officielles ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as évalué la performance environnementale. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment mesurer la durabilité d’un système d’élevage équin avec des indicateurs chiffrés ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Chargement = UGB / ha SFP.
    - Autonomie fourragère = produit / consommé.
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
