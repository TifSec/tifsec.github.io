titre: 'Séance 3 : Ne jamais perdre les données de l’entreprise'
themes:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
problematique: Comment protéger les données d’une exploitation contre la perte et les attaques ?
competences_bo:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
objectifs:
    connaissances:
        - 'Sauvegarde 3-2-1 : 3 copies, 2 supports différents, 1 hors site ; tester la restauration.'
        - 'Sécurité : mises à jour, mots de passe uniques et gestionnaire, double authentification, droits limités.'
    competences:
        - Concevoir un plan de sauvegarde.
        - Rédiger des règles de sécurité.
pourquoi:
    - En S02, la pension n’avait aucune sauvegarde.
    - Un rançongiciel ou une panne peut faire disparaître factures, registre d’élevage et suivi sanitaire.
activites:
    -   id: a01
        titre: Le scénario catastrophe
        consigne: Tu vas analyser un scénario d’attaque par rançongiciel dans la pension (document 1). On attend trois conséquences pour l’entreprise.
        contenu:
            -   type: paragraphe
                texte: 'Document 1 — Lundi matin, l’ordinateur de l’accueil affiche un message : tous les fichiers sont chiffrés, une rançon est demandée. Il n’y a aucune copie. Les factures du trimestre, le registre d’élevage et le suivi sanitaire étaient sur ce poste.'
            -   type: paragraphe
                texte: Scénario inventé.
            -   type: etapes
                elements:
                    - Lis le scénario (document 1).
                    - Liste ce qui est perdu.
                    - Évalue les conséquences.
            -   type: paragraphe
                texte: Pourquoi un scénario ? On mesure ce qu’on risque avant de dépenser pour se protéger.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, cite trois conséquences pour l’entreprise.
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
    -   id: a02
        titre: Le plan de sauvegarde
        transition: Les conséquences sont graves. Prévois la parade.
        consigne: Tu vas concevoir le plan de sauvegarde 3-2-1 de la pension. On attend les supports, la fréquence et le test de restauration.
        contenu:
            -   type: etapes
                elements:
                    - Applique la règle 3-2-1 à la pension.
                    - 'Précise : quoi, où, quand, qui, et le test de restauration.'
            -   type: paragraphe
                texte: Pourquoi tester ? Une sauvegarde qu’on n’a jamais restaurée peut être inutilisable.
        questions:
            -   id: q01
                type: tableau
                enonce: Complète le plan de sauvegarde.
                colonnes:
                    - Élément
                    - Choix
                lignes:
                    -   - Copie 2 (support)
                        - ''
                    -   - Copie 3 (hors site)
                        - ''
                    -   - Fréquence
                        - ''
                    -   - Test de restauration
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a03
        titre: Les règles de sécurité
        transition: Les données sont sauvegardées. Il faut aussi éviter l’attaque.
        consigne: Tu vas rédiger trois règles de sécurité numérique pour les salariés de la pension. On attend trois règles justifiées.
        contenu:
            -   type: etapes
                elements:
                    - Rédige 3 règles pour les salariés.
                    - 'Chaque règle : une action + sa raison.'
            -   type: paragraphe
                texte: Pourquoi des règles écrites ? Tout le personnel applique les mêmes gestes.
        questions:
            -   id: q01
                type: texte
                enonce: Rédige 3 règles de sécurité numérique pour les salariés, avec leur raison.
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le site cybermalveillance.gouv.fr propose un diagnostic.
        questions:
            -   id: q01
                type: texte
                enonce: Quel autre service peut aider une petite entreprise ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Les données sont protégées. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment protéger les données d’une exploitation contre la perte et les attaques ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 3-2-1 + test de restauration.
    - Mises à jour, mots de passe, 2FA, règles écrites.
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
