titre: 'Séance 12 : Évaluation : un outil de suivi pour l’atelier pension'
themes:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
problematique: Saurai-je construire en autonomie un outil fiable d’évaluation d’un atelier ?
competences_bo:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
objectifs:
    connaissances:
        - 'On réutilise : structure Données/Paramètres/Résultats, références absolues, RECHERCHEV, SI, validation, graphique.'
    competences:
        - Construire et justifier un outil de suivi.
pourquoi:
    - De S05 à S11, tu as construit les briques d’un outil de suivi.
    - 'Évaluation : tu les assembles sur un cas nouveau (atelier pré, 25 chevaux).'
activites:
    -   id: a01
        titre: Structurer
        consigne: Tu vas structurer en autonomie le classeur d’évaluation de l’atelier pré (eval_pre.ods). On attend la structure et la règle de validité.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre le fichier fourni eval_pre.ods.
                    - Crée les feuilles Paramètres et Résultats ; ajoute une liste de validité sur la colonne Formule.
            -   type: paragraphe
                texte: Pourquoi commencer par la structure ? Tout le reste en dépend.
        questions:
            -   id: q01
                type: texte
                enonce: Décris la structure de ton classeur et la règle de validité ajoutée.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a02
        titre: Calculer
        transition: Le classeur est structuré. Calcule.
        consigne: Tu vas calculer la marge de l’atelier pré avec RECHERCHEV, références absolues et une alerte SI. On attend la marge par cheval et la formule d’alerte.
        contenu:
            -   type: etapes
                elements:
                    - Tarif avec RECHERCHEV ; produit total ; coût alimentaire avec $ ; marge totale et par cheval.
                    - 'Alerte SI : marge par cheval < 80 € → « À REVOIR ».'
            -   type: paragraphe
                texte: Pourquoi l’alerte ? Elle signale tout de suite un tarif à revoir.
        questions:
            -   id: q01
                type: nombre
                enonce: Quelle est la marge brute mensuelle par cheval de l’atelier pré ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: texte
                enonce: Écris la formule de l’alerte.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a03
        titre: Justifier
        transition: Les calculs sont faits. Que recommandes-tu ?
        consigne: Tu vas faire un graphique et rédiger une recommandation chiffrée au gérant. On attend une recommandation appuyée sur deux chiffres.
        contenu:
            -   type: etapes
                elements:
                    - Fais un graphique des marges par formule.
                    - Rédige une recommandation de 3 lignes au gérant.
            -   type: paragraphe
                texte: Pourquoi une recommandation ? L’outil sert la décision.
        questions:
            -   id: q01
                type: texte
                enonce: Rédige ta recommandation au gérant, appuyée sur deux chiffres.
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Ajoute un scénario « foin +15 % ».
        questions:
            -   id: q01
                type: texte
                enonce: Quel effet sur la marge par cheval ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: L’évaluation est terminée. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : saurais-tu construire en autonomie un outil fiable d’évaluation d’un atelier ? Fais ton bilan.'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Outil de suivi : structure, fonctions, alerte, graphique, recommandation.'
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
