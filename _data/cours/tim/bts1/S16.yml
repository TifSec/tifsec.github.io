titre: 'Séance 16 : Évaluation : diagnostic de performance d’une écurie'
themes:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
problematique: Saurai-je produire un diagnostic chiffré de la performance globale d’une structure ?
competences_bo:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
    - C4.3 — Ajuster, dans un contexte de transitions, la conduite d’un système d’élevage
objectifs:
    connaissances:
        - 'On réutilise : marge, coût alimentaire, chargement, autonomie, astreinte, radar.'
    competences:
        - Produire un diagnostic chiffré en autonomie.
pourquoi:
    - Évaluation de la séquence performance globale.
    - 'Cas : une écurie d’élevage de 20 juments et leurs poulains (fichier fourni).'
activites:
    -   id: a01
        titre: Les indicateurs économiques
        consigne: Tu vas calculer la marge brute de l’élevage par jument (eval_elevage.ods). On attend le résultat.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre eval_elevage.ods.
                    - Calcule la marge brute de l’atelier et la marge par jument.
            -   type: paragraphe
                texte: Pourquoi par jument ? C’est l’unité de production de l’élevage.
        questions:
            -   id: q01
                type: nombre
                enonce: Quelle est la marge brute par jument ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a02
        titre: Les indicateurs environnementaux et sociaux
        transition: L’économie est évaluée. Passe aux autres dimensions.
        consigne: Tu vas calculer le chargement et l’autonomie fourragère de l’élevage. On attend les deux indicateurs.
        contenu:
            -   type: etapes
                elements:
                    - Calcule le chargement et l’autonomie fourragère.
                    - Calcule l’astreinte en minutes par UGB et par jour.
            -   type: paragraphe
                texte: Pourquoi les trois dimensions ? Un élevage rentable mais épuisant ou surchargé n’est pas durable.
        questions:
            -   id: q01
                type: nombre
                enonce: Quel est le chargement (UGB/ha) ?
                unite: UGB/ha
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: nombre
                enonce: Quelle est l’autonomie fourragère ?
                unite: '%'
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a03
        titre: Le diagnostic
        transition: Tous les indicateurs sont calculés. Conclus.
        consigne: Tu vas rédiger le diagnostic de performance globale de l’élevage avec un ajustement prioritaire. On attend un diagnostic chiffré et un ajustement.
        contenu:
            -   type: etapes
                elements:
                    - Radar des indicateurs notés ; conclusion de 5 lignes avec un ajustement prioritaire.
            -   type: paragraphe
                texte: Pourquoi un ajustement prioritaire ? On ne change pas tout à la fois.
        questions:
            -   id: q01
                type: texte
                enonce: Rédige ton diagnostic et ton ajustement prioritaire.
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Compare cet élevage à la pension de S13-S15.
        questions:
            -   id: q01
                type: texte
                enonce: Laquelle est la plus durable ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: L’évaluation est terminée. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : saurais-tu produire un diagnostic chiffré de la performance globale d’une structure ? Fais ton bilan.'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Diagnostic : économie, environnement, social ; ajustement prioritaire.'
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
