titre: 'Séance 15 : Un tableau de bord multicritère de la performance globale'
themes:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
problematique: Comment rassembler indicateurs économiques, sociaux et environnementaux pour évaluer globalement l’exploitation ?
competences_bo:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
objectifs:
    connaissances:
        - Un tableau de bord multicritère présente quelques indicateurs par dimension, comparés à des références.
        - Un graphique radar (toile) montre les forces et faiblesses sur une même figure, après normalisation.
    competences:
        - Normaliser des indicateurs.
        - Construire un radar et un tableau de bord.
pourquoi:
    - De S06 à S14, tu as calculé des indicateurs séparés.
    - Le conseiller veut une vue d’ensemble.
activites:
    -   id: a01
        titre: Choisir et normaliser
        consigne: Tu vas noter de 0 à 10 trois indicateurs de l’exploitation par rapport à leur référence. On attend une note justifiée pour chacun.
        contenu:
            -   type: etapes
                elements:
                    - 'Reprends 5 indicateurs : marge/cheval, coût alimentaire/jour, chargement, autonomie, min/cheval/jour.'
                    - Note chacun de 0 à 10 par rapport à la référence (10 = très bon).
                    - Pourquoi normaliser ? On ne peut pas comparer des € et des UGB/ha sur un même axe.
        questions:
            -   id: q01
                type: tableau
                enonce: Note chaque indicateur de 0 à 10 (justifie brièvement).
                colonnes:
                    - Indicateur
                    - Note / justification
                lignes:
                    -   - Chargement 1,6 UGB/ha
                        - ''
                    -   - Autonomie 40 %
                        - ''
                    -   - Astreinte 21 min/cheval/jour
                        - ''
                aide: 'Pour chaque indicateur, compare-le à son repère : 10 = excellent, 5 = moyen, 0 = très mauvais. Justifie en une phrase.'
    -   id: a02
        titre: Le radar
        transition: Les notes sont prêtes. Dessine-les.
        consigne: Tu vas construire le graphique radar des cinq indicateurs notés. On attend la dimension la plus forte et la plus faible.
        contenu:
            -   type: image
                url: /assets/images/graphiques/tim-bts1-s15-radar.svg
                alternative: 'Exemple de radar : cinq indicateurs notés sur 10.'
                legende: 'Exemple de radar : cinq indicateurs notés sur 10.'
            -   type: titre
                texte: Comment faire ce graphique
            -   type: etapes
                elements:
                    - Saisis les indicateurs et leurs notes sur 10 (après normalisation).
                    - Insertion > Diagramme > Toile (filet) ; échelle de 0 à 10.
                    - Ajoute un titre et la source des indicateurs.
            -   type: titre
                texte: Comment le lire
            -   type: liste
                elements:
                    - Chaque branche est un indicateur ; plus le point est loin du centre, meilleure est la note.
            -   type: titre
                texte: Comment le comprendre
            -   type: liste
                elements:
                    - Une forme régulière et large = exploitation équilibrée et performante.
                    - Un « creux » montre la dimension à améliorer en priorité.
            -   type: etapes
                elements:
                    - Saisis les 5 notes.
                    - Insertion > Diagramme > Toile (filet) ; échelle 0 à 10.
                    - Titre, source.
                    - Pourquoi un radar ? Les points faibles se voient comme des « creux ».
        questions:
            -   id: q01
                type: texte
                enonce: Quelles sont la dimension la plus forte et la plus faible d’après ton radar ?
                aide: Sur ton radar, cherche la pointe la plus éloignée du centre et la plus proche.
    -   id: a03
        titre: Le tableau de bord
        transition: Le radar est prêt. Assemble le tableau de bord.
        consigne: Tu vas assembler le tableau de bord de la performance globale sur une page avec une conclusion. On attend ta conclusion.
        contenu:
            -   type: etapes
                elements:
                    - 'Sur une page : indicateurs bruts, notes, radar, 3 lignes de conclusion.'
                    - Exporte en PDF.
                    - Pourquoi une page ? Le conseiller et l’exploitant décident ensemble autour d’une seule feuille.
        questions:
            -   id: q01
                type: texte
                enonce: Recopie ta conclusion de 3 lignes.
                aide: 'Trois lignes : le diagnostic global, la priorité d’action, l’indicateur à suivre.'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La notation 0-10 est subjective.
        questions:
            -   id: q01
                type: texte
                enonce: Comment la rendre plus objective ?
                aide: Deux personnes ne mettraient pas la même note. Comment fixer les notes avant de regarder l’exploitation ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as évalué la performance globale. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment rassembler indicateurs économiques, sociaux et environnementaux pour évaluer globalement l’exploitation ?'
                aide: Dis les indicateurs par dimension, comment tu les as notés sur 10 et ce que montre le radar.
retenir:
    - Normaliser (barème) ; radar ; une page.
    - Diagnostic → priorité → suivi.
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
