titre: 'Séance 2 : Le système d’information d’une pension équine'
themes:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
problematique: Comment circulent les informations dans une exploitation, et où sont les risques ?
competences_bo:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
objectifs:
    connaissances:
        - 'Un système d’information (SI) : les données, les personnes, les outils, les procédures qui produisent l’information utile aux décisions.'
        - 'Cartographier le SI : quelles données, qui les saisit, où elles sont stockées, qui les utilise.'
    competences:
        - Cartographier un système d’information.
        - Repérer ses points faibles.
pourquoi:
    - En S01, tu as relié outils et décisions.
    - 'Une pension de 40 chevaux produit chaque jour des données : soins, factures, alimentation, planning.'
activites:
    -   id: a01
        titre: Les flux de données
        consigne: Tu vas décrire les flux de trois données de la pension du Moulin (document 1). On attend, pour chaque donnée, qui la saisit, où elle est stockée et qui l’utilise.
        contenu:
            -   type: paragraphe
                texte: Document 1 — Pension du Moulin, 40 chevaux, 3 salariés. Les soins sont notés sur un cahier dans la sellerie, puis recopiés le vendredi dans un tableur. Les factures sont faites par la secrétaire sur un logiciel. La consommation de foin est notée sur un tableau blanc, effacé chaque semaine. Les fichiers sont sur l’ordinateur de l’accueil, sans sauvegarde.
            -   type: paragraphe
                texte: Données fictives créées pour l’exercice (ordres de grandeur réalistes pour une structure équine).
            -   type: etapes
                elements:
                    - Lis la description de la pension (document 1).
                    - 'Pour chaque donnée : qui la saisit, où, qui l’utilise.'
            -   type: paragraphe
                texte: Pourquoi les flux ? Une donnée saisie deux fois à deux endroits finit par être fausse quelque part.
        questions:
            -   id: q01
                type: tableau
                enonce: Complète pour trois données.
                colonnes:
                    - Donnée
                    - Saisie par / stockée où / utilisée par
                lignes:
                    -   - Soins vétérinaires
                        - ''
                    -   - Factures de pension
                        - ''
                    -   - Consommation de foin
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: Les points faibles
        transition: Tu connais les flux. Où sont les fragilités ?
        consigne: Tu vas repérer trois points faibles du système d’information de la pension et leur risque. On attend trois points expliqués.
        contenu:
            -   type: etapes
                elements:
                    - Relis tes flux.
                    - Repère trois points faibles du SI.
                    - Pour chacun, le risque.
            -   type: paragraphe
                texte: Pourquoi les risques ? Un SI fragile peut faire perdre des factures ou la trace d’un traitement vétérinaire.
        questions:
            -   id: q01
                type: texte
                enonce: Cite trois points faibles du SI de la pension et le risque de chacun.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a03
        titre: Une amélioration
        transition: Les risques sont repérés. Que proposer ?
        consigne: Tu vas proposer une amélioration réaliste du système d’information de la pension. On attend l’amélioration et son intérêt.
        contenu:
            -   type: etapes
                elements:
                    - Choisis un point faible.
                    - Propose une amélioration réaliste (coût, temps, personnel).
            -   type: paragraphe
                texte: Pourquoi « réaliste » ? Les salariés n’ont pas le temps pour un système compliqué.
        questions:
            -   id: q01
                type: texte
                enonce: Propose une amélioration réaliste pour un point faible, avec son intérêt pour la gestion.
                aide: Une idée réaliste + « Cela permet de… ».
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La consommation de foin n’est pas exploitée.
        questions:
            -   id: q01
                type: texte
                enonce: Quel indicateur de performance pourrait-on en tirer ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as analysé un SI. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment circulent les informations dans une exploitation, et où sont les risques ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'SI : données, personnes, outils, procédures.'
    - 'Points faibles : double saisie, perte, sauvegarde.'
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
