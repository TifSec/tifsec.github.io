titre: 'Séance 6 : Calculer la marge d’un atelier pension'
themes:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
problematique: L’atelier pension dégage-t-il une marge suffisante ?
competences_bo:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
objectifs:
    connaissances:
        - 'Produit de l’atelier : pensions facturées. Charges opérationnelles : alimentation, litière, soins refacturés ou non.'
        - Marge brute = produit − charges opérationnelles ; on la ramène par cheval et par mois pour comparer.
    competences:
        - Construire un calcul de marge.
        - Calculer un indicateur par unité.
pourquoi:
    - En S05, le classeur est restructuré.
    - Le gérant veut savoir si son prix de pension couvre bien ses charges.
activites:
    -   id: a01
        titre: Produit et charges
        consigne: Tu vas calculer le produit et les charges opérationnelles mensuels de l’atelier pension (document 1). On attend les deux montants.
        contenu:
            -   type: liste
                elements:
                    - 40 chevaux en pension box à 380 € par mois.
                    - 'Foin : 5 200 € ; concentrés : 2 400 € ; litière (copeaux, paille) : 1 000 € ; petit matériel et soins non refacturés : 800 € (par mois).'
            -   type: paragraphe
                texte: Données fictives créées pour l’exercice (ordres de grandeur réalistes pour une structure équine).
            -   type: etapes
                elements:
                    - Lis les données mensuelles (document 1).
                    - Calcule le produit et les charges opérationnelles.
            -   type: paragraphe
                texte: Pourquoi séparer ? Pour voir quelle charge pèse le plus.
        questions:
            -   id: q01
                type: nombre
                enonce: D’après le document 1, quel est le produit mensuel de l’atelier ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: nombre
                enonce: Quel est le total des charges opérationnelles ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a02
        titre: La marge dans le tableur
        transition: Tu as le produit et les charges. Calcule la marge.
        consigne: Tu vas calculer dans le tableur la marge brute de l’atelier et la marge par cheval. On attend les deux résultats.
        contenu:
            -   type: etapes
                elements:
                    - 'Dans Résultats : produit, charges, marge brute = produit − charges.'
                    - Marge par cheval = marge / nombre de chevaux (en Paramètres).
                    - Format monétaire.
            -   type: paragraphe
                texte: Pourquoi par cheval ? On compare avec d’autres structures et avec le temps de travail.
        questions:
            -   id: q01
                type: nombre
                enonce: Quelle est la marge brute mensuelle ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: nombre
                enonce: Quelle est la marge brute par cheval et par mois ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a03
        titre: Interpréter
        transition: La marge est calculée. Est-elle suffisante ?
        consigne: Tu vas interpréter la marge après main-d’œuvre et proposer un levier d’amélioration. On attend le reste et une interprétation.
        contenu:
            -   type: etapes
                elements:
                    - La main-d’œuvre (non comptée ici) coûte environ 4 500 € par mois.
                    - Que reste-t-il ? Est-ce suffisant ?
            -   type: paragraphe
                texte: Pourquoi la main-d’œuvre ? Dans une pension, c’est souvent la charge principale.
        questions:
            -   id: q01
                type: nombre
                enonce: Que reste-t-il après la main-d’œuvre ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: texte
                enonce: Ce résultat est-il satisfaisant ? Justifie et propose un levier.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le gérant veut 300 € de marge brute par cheval.
        questions:
            -   id: q01
                type: texte
                enonce: Quel prix de pension faudrait-il (charges inchangées) ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as évalué la marge de l’atelier. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : l’atelier pension dégage-t-il une marge suffisante ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Marge brute = produit − charges opérationnelles.
    - Ramener par cheval et par mois.
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
