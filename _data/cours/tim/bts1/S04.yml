titre: 'Séance 4 : Organiser sa veille sur la filière équine'
themes:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
problematique: Comment se tenir informé efficacement des évolutions de la filière ?
competences_bo:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
objectifs:
    connaissances:
        - 'La veille : surveiller des sources fiables (IFCE, chambres d’agriculture, presse professionnelle, réglementation).'
        - 'Outils : flux RSS, alertes, lettres d’information ; on trie et on archive.'
    competences:
        - Sélectionner des sources fiables.
        - Mettre en place un outil de veille.
pourquoi:
    - 'Un exploitant doit connaître les changements : réglementation sanitaire, prix des aliments, aides.'
    - Aujourd’hui, tu organises ta veille.
activites:
    -   id: a01
        titre: Les sources
        consigne: Tu vas classer trois sources d’information sur la filière (document 1) en fiables ou à vérifier. On attend une réponse par source.
        contenu:
            -   type: liste
                elements:
                    - IFCE — Observatoire économique et social du cheval.
                    - Groupe de discussion « Les vrais cavaliers ».
                    - Chambre d’agriculture régionale.
            -   type: lien
                titre: IFCE — Observatoire économique et social du cheval
                url: https://www.ifce.fr/ifce/connaissances/statistiques-et-donnees/
            -   type: etapes
                elements:
                    - Lis les sources proposées (document 1).
                    - 'Classe-les : fiable ou à vérifier.'
                    - Justifie une source fiable.
            -   type: paragraphe
                texte: Pourquoi trier ? Une veille sur des sources douteuses diffuse des erreurs.
        questions:
            -   id: q01
                type: tableau
                enonce: Classe chaque source.
                colonnes:
                    - Source
                    - Fiable / à vérifier
                lignes:
                    -   - IFCE — Observatoire économique et social du cheval
                        - ''
                    -   - Groupe de discussion « Les vrais cavaliers »
                        - ''
                    -   - Chambre d’agriculture régionale
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: L’outil de veille
        transition: Tu connais les sources fiables. Automatise leur suivi.
        consigne: Tu vas mettre en place un outil de veille avec trois sources fiables de la filière. On attend l’outil, les sources et une information reçue.
        contenu:
            -   type: etapes
                elements:
                    - 'Choisis un outil : lecteur de flux RSS (Feedly, Inoreader, Thunderbird) ou alertes.'
                    - Abonne-toi à 3 sources fiables.
                    - Note les 3 dernières informations reçues.
            -   type: paragraphe
                texte: Pourquoi un outil ? Les informations viennent à toi, au lieu de visiter dix sites.
        questions:
            -   id: q01
                type: texte
                enonce: Quel outil as-tu choisi, quelles sources, et quelle information récente as-tu reçue ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a03
        titre: Exploiter la veille
        transition: La veille fonctionne. À quoi sert une information ?
        consigne: Tu vas rédiger une fiche de veille à partir d’une information reçue. On attend l’information sourcée et sa conséquence pour une exploitation.
        contenu:
            -   type: etapes
                elements:
                    - Choisis une information de ta veille.
                    - 'Rédige une fiche de 3 lignes : quoi, source et date, conséquence pour une exploitation équine.'
            -   type: paragraphe
                texte: Pourquoi la conséquence ? Une veille sert à agir, pas seulement à lire.
        questions:
            -   id: q01
                type: texte
                enonce: Rédige ta fiche de veille.
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La veille réglementaire est obligatoire pour certaines activités.
        questions:
            -   id: q01
                type: texte
                enonce: Où suivre l’évolution des textes officiels ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ta veille est organisée. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment se tenir informé efficacement des évolutions de la filière ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Veille : sources fiables, RSS ou alertes, fiches.'
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
