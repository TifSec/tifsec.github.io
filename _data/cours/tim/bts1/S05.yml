titre: 'Séance 5 : Organiser les données technico-économiques d’un atelier pension'
themes:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
problematique: Comment structurer un tableau de données pour évaluer un atelier ?
competences_bo:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
objectifs:
    connaissances:
        - 'Un tableau de données exploitable : une ligne par enregistrement, une colonne par variable, un type par colonne, pas de cellules fusionnées.'
        - Séparer données brutes, paramètres et résultats (trois zones ou trois feuilles).
    competences:
        - Structurer un classeur en zones.
        - Rédiger un dictionnaire de données.
pourquoi:
    - Pour évaluer la performance (C4.1), il faut des données fiables et bien rangées.
    - Tu restructures le classeur de suivi de la pension.
activites:
    -   id: a01
        titre: Diagnostic du classeur
        consigne: Tu vas diagnostiquer le classeur de suivi actuel de la pension (document 1). On attend trois défauts qui empêchent les calculs.
        contenu:
            -   type: paragraphe
                texte: 'Document 1 — Classeur actuel : une feuille par mois ; les titres sont fusionnés sur trois lignes ; les montants sont saisis « 380 € » ; les totaux sont insérés au milieu des données ; certaines lignes mélangent deux chevaux.'
            -   type: etapes
                elements:
                    - Lis la description du classeur actuel (document 1).
                    - Repère ce qui empêche les calculs.
                    - Pourquoi un diagnostic ? Un tableau « joli » peut être inexploitable.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, cite trois défauts qui empêchent d’exploiter ce classeur.
                aide: 'Regarde le classeur du document 1 avec l’œil du tableur : peut-il trier, filtrer, additionner chaque colonne ?'
    -   id: a02
        titre: Restructurer
        transition: Les défauts sont identifiés. Restructure.
        consigne: Tu vas restructurer le classeur de la pension en trois feuilles (Données, Paramètres, Résultats). On attend tes en-têtes et l’emplacement d’un prix.
        contenu:
            -   type: fichier
                titre: classeur de suivi de la pension, à restructurer
                url: /assets/fichiers/tim/bts1/pension_brut.ods
            -   type: etapes
                elements:
                    - Ouvre le fichier pension_brut.ods (à télécharger ci-dessus).
                    - 'Crée trois feuilles : Données (une ligne = un cheval et un mois), Paramètres (prix, taux), Résultats.'
                    - Recopie les données dans le nouveau format.
                    - Pourquoi trois zones ? On modifie un prix une seule fois, sans toucher aux données.
        questions:
            -   id: q01
                type: texte
                enonce: Écris les en-têtes de colonnes de ta feuille Données.
                aide: Une ligne = un cheval pour un mois. Chaque colonne = une seule information, avec son unité dans l’en-tête.
            -   id: q02
                type: qcm
                enonce: Où mets-tu le prix du kg de foin ?
                choix:
                    -   id: a
                        texte: Dans la feuille Paramètres.
                    -   id: b
                        texte: Dans chaque ligne de Données.
                    -   id: c
                        texte: Dans le titre.
                aide: Un prix qui sert à toutes les lignes ne se tape pas dans chaque ligne. Dans quelle feuille vont les valeurs communes ?
    -   id: a03
        titre: Le dictionnaire de données
        transition: Le classeur est restructuré. Documente-le.
        consigne: Tu vas rédiger le dictionnaire de données du classeur. On attend la description de trois colonnes.
        contenu:
            -   type: etapes
                elements:
                    - Ajoute une feuille Dictionnaire.
                    - 'Pour chaque colonne : définition, type, unité, valeurs possibles.'
                    - Pourquoi un dictionnaire ? Un associé ou un conseiller comprend le fichier sans toi.
        questions:
            -   id: q01
                type: tableau
                enonce: Complète pour trois colonnes.
                colonnes:
                    - Colonne
                    - Définition / type / unité / valeurs
                lignes:
                    -   - Formule
                        - ''
                    -   - Jours
                        - ''
                    -   - Foin
                        - ''
                aide: 'Pour chaque colonne : ce qu’elle contient en clair, son type (texte, entier, décimal), son unité, les valeurs permises.'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Les paramètres peuvent être nommés (Plage > Définir le nom).
        questions:
            -   id: q01
                type: texte
                enonce: Quel intérêt dans une formule ?
                aide: 'Compare =E2*Paramètres.$B$2 et une formule avec un nom : laquelle comprend-on à la relecture ?'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton classeur est exploitable. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment structurer un tableau de données pour évaluer un atelier ?'
                aide: Dis les règles de structure (lignes, colonnes, types) et le rôle des feuilles Données, Paramètres et du dictionnaire.
retenir:
    - Données / Paramètres / Résultats.
    - Pas de fusion ni d’unité dans les cellules ; dictionnaire.
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
