titre: 'Séance 11 : Un graphique combiné pour suivre produit et charges'
themes:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
problematique: Comment montrer sur un même graphique l’évolution du produit, des charges et de la marge ?
competences_bo:
    - C4.1 — Évaluer la performance globale d’un système biotechnique
objectifs:
    connaissances:
        - Un graphique combiné associe colonnes (montants) et courbe (indicateur), parfois avec un axe secondaire.
        - 'On choisit le graphique selon le message : évolution, comparaison, part.'
    competences:
        - Construire un graphique combiné.
        - Rédiger un commentaire chiffré.
pourquoi:
    - En S06, tu as calculé la marge d’un mois.
    - 'Le gérant veut voir l’année entière : saisonnalité, mois difficiles.'
activites:
    -   id: a01
        titre: Les données de l’année
        consigne: Tu vas calculer la marge de chaque mois de l’année dans pension_annee.ods et repérer le mois le plus faible. On attend le mois et l’explication.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre le fichier fourni pension_annee.ods (12 mois).
                    - Calcule la marge de chaque mois (produit − charges).
                    - Repère le mois le plus faible.
            -   type: paragraphe
                texte: 'Pourquoi l’année ? Un seul mois peut cacher une saison difficile (hiver : plus de foin).'
        questions:
            -   id: q01
                type: texte
                enonce: Quel mois a la marge la plus faible, et pourquoi d’après les données ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a02
        titre: Le graphique combiné
        transition: Tu as les marges. Montre-les.
        consigne: Tu vas construire le graphique combiné produit, charges et marge sur 12 mois. On attend la description du graphique.
        contenu:
            -   type: etapes
                elements:
                    - Sélectionne Mois, Produit, Charges, Marge.
                    - 'Insertion > Diagramme > Colonne et ligne : Produit et Charges en colonnes, Marge en ligne.'
                    - Titre, axes en €, légende, source.
            -   type: paragraphe
                texte: Pourquoi combiné ? On voit à la fois les montants et le résultat.
        questions:
            -   id: q01
                type: texte
                enonce: 'Décris ton graphique : séries en colonnes, série en ligne, titre.'
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
            -   id: q02
                type: qcm
                enonce: Quel type pour montrer l’évolution de la marge sur 12 mois ?
                choix:
                    -   id: a
                        texte: Une ligne
                    -   id: b
                        texte: Des secteurs
                    -   id: c
                        texte: Un nuage
                aide: Élimine d’abord les réponses impossibles.
    -   id: a03
        titre: Le commentaire
        transition: Le graphique est prêt. Que doit en retenir le gérant ?
        consigne: Tu vas rédiger un commentaire de trois phrases sous ton graphique. On attend une tendance, un chiffre et une action.
        contenu:
            -   type: etapes
                elements:
                    - 'Rédige 3 phrases : tendance, mois critique chiffré, piste d’action.'
            -   type: paragraphe
                texte: Pourquoi 3 phrases ? Le graphique montre ; le commentaire fait décider.
        questions:
            -   id: q01
                type: texte
                enonce: Rédige le commentaire de ton graphique.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un axe secondaire sert quand les échelles diffèrent.
        questions:
            -   id: q01
                type: texte
                enonce: Dans quel cas l’utiliserais-tu ici ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais montrer les résultats de l’année. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment montrer sur un même graphique l’évolution du produit, des charges et de la marge ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Combiné : colonnes (montants) + ligne (indicateur).'
    - 'Commentaire : tendance, chiffre, action.'
sources:
    -   type: lien
        titre: ChloroFil — BTSA ACS’AGRI, document d’accompagnement TIM (décembre 2024)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/btsa/acsagri-2025/btsa-acsagri-da-tim.pdf
