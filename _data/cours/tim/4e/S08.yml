titre: 'Séance 8 : Ai-je le droit de publier cette photo de cheval ?'
themes:
    - Objectif 4 — Adopter une attitude responsable dans une société démocratique
problematique: Quand a-t-on le droit de publier une photo trouvée ou prise par quelqu’un d’autre ?
competences_bo:
    - Objectif 4 — Adopter une attitude responsable dans une société démocratique
objectifs:
    connaissances:
        - 'Droit à l’image : on ne publie pas la photo d’une personne sans son accord (et celui des parents pour un mineur).'
        - 'Droit d’auteur : une photo appartient à son auteur ; certaines licences (Creative Commons) autorisent l’utilisation sous conditions.'
    competences:
        - Appliquer le droit à l’image.
        - Lire une licence Creative Commons simple.
pourquoi:
    - En S07, tu as vu que les publications restent.
    - 'Le club veut publier des photos du concours : en a-t-il le droit ?'
activites:
    -   id: a01
        titre: Le droit à l’image
        consigne: Tu vas appliquer le droit à l’image à trois photos d’un concours. On attend « oui » ou « non » pour chacune.
        contenu:
            -   type: etapes
                elements:
                    - Lis la règle du droit à l’image.
                    - Pour chaque photo, repère s’il y a une personne reconnaissable.
                    - Dis si on peut la publier sans autorisation.
            -   type: paragraphe
                texte: 'Pourquoi cette règle ? Chacun décide de ce que les autres voient de lui : c’est sa vie privée.'
        questions:
            -   id: q01
                type: tableau
                enonce: Peut-on publier ces photos du concours sans autorisation ? Écris « oui » ou « non ».
                colonnes:
                    - Photo
                    - Sans autorisation ?
                lignes:
                    -   - Un cavalier mineur, de face, sur son poney
                        - ''
                    -   - Le paddock vide au lever du soleil
                        - ''
                    -   - Une cavalière adulte reconnaissable
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: Le droit d’auteur
        transition: Les personnes ont des droits. Les auteurs aussi.
        consigne: Tu vas découvrir le droit d’auteur et les licences Creative Commons (document 1). On attend deux réponses sur l’utilisation d’images.
        contenu:
            -   type: tableau
                titre: Document 1 — Les sigles Creative Commons
                colonnes:
                    - Sigle
                    - Ce qu’il veut dire
                lignes:
                    -   - BY
                        - Citer l’auteur
                    -   - NC
                        - Pas d’utilisation commerciale
                    -   - SA
                        - Partager dans les mêmes conditions
                    -   - ND
                        - Ne pas modifier
            -   type: etapes
                elements:
                    - 'Lis le document 1 : les sigles Creative Commons.'
                    - Pour chaque image, lis sa licence.
                    - Vérifie si l’utilisation prévue est permise.
            -   type: paragraphe
                texte: 'Pourquoi une licence ? Elle dit ce que l’auteur autorise : sans licence, on ne peut rien réutiliser.'
        questions:
            -   id: q01
                type: qcm
                enonce: Une photo de cheval trouvée sur un site, sans licence, peut-elle être mise sur la page du club ?
                choix:
                    -   id: a
                        texte: Non, il faut l’autorisation de l’auteur.
                    -   id: b
                        texte: Oui, elle est sur internet.
                    -   id: c
                        texte: Oui, si on la recadre.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: qcm
                enonce: D’après le document 1, que demande la licence CC BY ?
                choix:
                    -   id: a
                        texte: Citer le nom de l’auteur.
                    -   id: b
                        texte: Payer l’auteur.
                    -   id: c
                        texte: Rien du tout.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a03
        titre: Citer l’auteur
        transition: Tu connais les licences. Apprends à citer l’auteur.
        consigne: Tu vas écrire la citation d’une photo libre de droits, en suivant le modèle. On attend une citation complète.
        contenu:
            -   type: paragraphe
                texte: 'Modèle : « Photo : auteur, « titre », site, licence. »'
            -   type: etapes
                elements:
                    - Lis le modèle de citation.
                    - 'Repère : auteur, titre, site, licence.'
                    - Écris la citation demandée dans le même ordre.
            -   type: paragraphe
                texte: Pourquoi citer ? C’est respecter le travail de l’auteur et permettre de retrouver l’image.
        questions:
            -   id: q01
                type: texte
                enonce: 'Écris la citation de cette photo : auteur Jean Martin, titre « Poney au galop », site Wikimedia Commons, licence CC BY.'
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le club veut quand même publier la photo du cavalier mineur.
        questions:
            -   id: q01
                type: texte
                enonce: Que doit-il faire avant ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu connais tes droits et ceux des autres. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quand a-t-on le droit de publier une photo trouvée ou prise par quelqu’un d’autre ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Droit à l’image : accord de la personne (et des parents pour un mineur).'
    - 'Droit d’auteur : licence ou accord de l’auteur ; citer l’auteur.'
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
