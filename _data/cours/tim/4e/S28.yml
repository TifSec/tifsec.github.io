titre: 'Séance 28 : Bilan : mon parcours d’obstacles'
themes:
    - Objectif 5 — Découvrir l’analyse et le codage
problematique: Mon jeu de parcours d’obstacles fonctionne-t-il comme prévu ?
competences_bo:
    - Objectif 5 — Découvrir l’analyse et le codage
objectifs:
    connaissances:
        - Un programme se valide en le testant avec une liste de vérifications.
        - Expliquer son programme, c’est montrer qu’on l’a compris.
    competences:
        - Tester son jeu avec une liste de vérifications.
        - Expliquer un bloc de son programme.
pourquoi:
    - De S24 à S27, tu as construit ton jeu.
    - Aujourd’hui, tu le termines, tu le testes et tu l’expliques.
activites:
    -   id: a01
        titre: Tester avec la liste
        consigne: Tu vas tester ton parcours d’obstacles avec une liste de quatre vérifications. On attend « oui » ou « non » pour chacune.
        contenu:
            -   type: paragraphe
                texte: Document 1 — La liste de vérifications est dans le tableau de la question.
            -   type: etapes
                elements:
                    - Lis la liste de vérifications (document 1).
                    - Teste chaque point sur ton jeu.
                    - Note oui ou non.
            -   type: paragraphe
                texte: Pourquoi une liste ? On n’oublie aucun cas, comme le contrôle d’un véhicule avant départ.
        questions:
            -   id: q01
                type: tableau
                enonce: Teste ton jeu et écris « oui » ou « non ».
                colonnes:
                    - Vérification
                    - Fonctionne ?
                lignes:
                    -   - Le cavalier repart au départ au drapeau vert
                        - ''
                    -   - Les pénalités repartent de 0
                        - ''
                    -   - La faute ajoute 4 points
                        - ''
                    -   - Le temps s’affiche à l’arrivée
                        - ''
                aide: 'Méthode : 1) écris ce que tu fais (l’action) ; 2) écris ce qui doit se passer (résultat attendu) ; 3) compare avec ce qui se passe vraiment (résultat observé). Ne change qu’une seule chose à la fois.'
    -   id: a02
        titre: Corriger ce qui manque
        transition: Tu sais ce qui marche. Corrige le reste.
        consigne: Tu vas corriger un point de ta liste (ou améliorer ton jeu) puis retester. On attend ta correction et le résultat du test.
        contenu:
            -   type: etapes
                elements:
                    - Reprends une vérification « non » (ou ajoute une amélioration si tout est « oui »).
                    - Corrige ou améliore.
                    - Reteste.
            -   type: paragraphe
                texte: Pourquoi retester ? Une correction peut créer un autre bogue.
        questions:
            -   id: q01
                type: texte
                enonce: Décris ta correction (ou ton amélioration) et le résultat du nouveau test.
                aide: Action → résultat attendu → résultat observé ; une seule chose à la fois.
    -   id: a03
        titre: Expliquer mon programme
        transition: Ton jeu fonctionne. Montre que tu le comprends.
        consigne: Tu vas expliquer par écrit le bloc de la faute de ton jeu, avec les mots condition, boucle et variable. On attend une explication qui utilise les trois mots.
        contenu:
            -   type: etapes
                elements:
                    - Choisis le bloc « si touche la barre » de ton jeu.
                    - Explique ce qu’il fait, quand, et pourquoi il est dans une boucle.
                    - 'Utilise les mots : condition, boucle, variable.'
            -   type: paragraphe
                texte: Pourquoi expliquer ? À l’oral du DNB comme en stage, on doit expliquer ce qu’on a fait.
        questions:
            -   id: q01
                type: texte
                enonce: Explique le bloc « si touche la barre » de ton jeu en utilisant les mots condition, boucle et variable.
                aide: Bloc par bloc.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Ajoute un niveau 2 plus difficile.
        questions:
            -   id: q01
                type: texte
                enonce: Qu’as-tu changé ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton jeu est terminé. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : ton jeu de parcours d’obstacles fonctionne-t-il comme prévu ?'
                aide: Reprends les mots du problème.
retenir:
    - 'Valider un programme : liste de vérifications, corriger, retester.'
    - 'Vocabulaire : condition, boucle, variable.'
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
