titre: 'Séance 7 : Quelles traces je laisse sur internet ?'
themes:
    - Objectif 4 — Adopter une attitude responsable dans une société démocratique
problematique: Quelles traces laissons-nous sur internet, et comment les limiter ?
competences_bo:
    - Objectif 4 — Adopter une attitude responsable dans une société démocratique
objectifs:
    connaissances:
        - 'La trace numérique : tout ce qu’on laisse en ligne, volontairement (publications) ou sans le savoir (cookies, localisation).'
        - Ce qui est publié peut être copié et rester longtemps.
    competences:
        - Distinguer traces volontaires et involontaires.
        - Proposer des réglages pour limiter ses traces.
pourquoi:
    - En S06, tu as protégé ton compte.
    - Mais même protégé, tu laisses des traces partout. Lesquelles ?
activites:
    -   id: a01
        titre: Volontaire ou involontaire ?
        consigne: Tu vas classer trois traces numériques en volontaires ou involontaires, avec l’exemple expliqué. On attend le bon type pour chacune.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis l’exemple : une photo que je publie = trace volontaire.'
                    - 'Pour chaque trace du tableau, demande-toi : l’ai-je laissée exprès ?'
                    - Écris « volontaire » ou « involontaire ».
            -   type: paragraphe
                texte: Pourquoi distinguer ? On contrôle ce qu’on publie, mais on oublie souvent les traces involontaires.
        questions:
            -   id: q01
                type: tableau
                enonce: Pour chaque trace, écris « volontaire » ou « involontaire ».
                colonnes:
                    - Trace
                    - Type
                lignes:
                    -   - Une vidéo de mon poney que je publie
                        - ''
                    -   - Les cookies d’un site que je visite
                        - ''
                    -   - La localisation enregistrée dans une photo
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: Une publication dure longtemps
        transition: Tu sais repérer les traces. Voyons combien de temps elles restent.
        consigne: Tu vas analyser la situation de Max, qui a supprimé un commentaire. On attend une réponse justifiée avec « car ».
        contenu:
            -   type: etapes
                elements:
                    - Lis la situation de Max.
                    - Imagine qui peut voir ce commentaire dans deux ans.
                    - Explique avec « car ».
            -   type: paragraphe
                texte: Pourquoi « longtemps » ? Un message supprimé peut avoir été copié, capturé ou partagé avant.
        questions:
            -   id: q01
                type: texte
                enonce: Max a écrit un commentaire moqueur sur un cavalier, puis l’a supprimé. Le commentaire a-t-il forcément disparu ? Explique avec « car ».
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a03
        titre: Mes réglages
        transition: Tu sais que les traces durent. Agis pour les limiter.
        consigne: Tu vas proposer trois gestes concrets pour limiter tes traces en ligne. On attend chaque geste et la trace qu’il évite.
        contenu:
            -   type: etapes
                elements:
                    - Pense à ton téléphone et aux sites que tu utilises.
                    - Choisis trois gestes concrets pour limiter tes traces.
                    - Pour chacun, écris la trace qu’il évite.
            -   type: paragraphe
                texte: Pourquoi tes réglages ? Quelques gestes simples réduisent beaucoup ce que les autres savent de toi.
        questions:
            -   id: q01
                type: tableau
                enonce: Propose trois gestes pour limiter tes traces, et la trace évitée.
                colonnes:
                    - Geste
                    - Trace évitée
                lignes:
                    -   - ''
                        - ''
                    -   - ''
                        - ''
                    -   - ''
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Tape ton prénom et ton nom dans un moteur de recherche (chez toi, avec un adulte si tu veux).
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi est-il utile de le faire de temps en temps ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu connais tes traces. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quelles traces laissons-nous sur internet, et comment les limiter ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Traces volontaires (ce que je publie) et involontaires (cookies, localisation).
    - Une publication peut rester longtemps.
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
