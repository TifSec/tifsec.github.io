titre: 'Séance 16 : Combien de foin pour la semaine ?'
themes:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
problematique: Comment faire calculer le tableur à ma place ?
competences_bo:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
objectifs:
    connaissances:
        - 'Une formule commence par « = » : =B2*7 multiplie la valeur de B2 par 7.'
        - 'SOMME additionne une plage : =SOMME(C2:C5) ; MOYENNE calcule la moyenne.'
    competences:
        - Écrire une formule simple.
        - Utiliser SOMME et MOYENNE.
pourquoi:
    - En S15, tu as saisi des données. Un tableur sert surtout à calculer.
    - Aujourd’hui, tu calcules le foin de la semaine pour quatre poneys.
activites:
    -   id: a01
        titre: Une première formule
        consigne: Tu vas écrire ta première formule dans Calc pour calculer le foin de la semaine de quatre poneys (document 1). On attend un résultat et une formule recopiée.
        contenu:
            -   type: tableau
                titre: Document 1 — Rations de foin (données fictives)
                colonnes:
                    - ''
                    - A
                    - B
                    - C
                lignes:
                    -   - '1'
                        - Poney
                        - Foin par jour (kg)
                        - Foin par semaine (kg)
                    -   - '2'
                        - Éclair
                        - '6'
                        - ''
                    -   - '3'
                        - Noisette
                        - '5'
                        - ''
                    -   - '4'
                        - Pompon
                        - '4'
                        - ''
                    -   - '5'
                        - Caramel
                        - '7'
                        - ''
            -   type: etapes
                elements:
                    - 'Lis l’exemple : en A2 « Tango », en B2 le foin par jour : 9.'
                    - 'En C2, on tape =B2*7 puis Entrée : Calc multiplie le contenu de B2 par 7.'
                    - 'Calc affiche 63 : Tango mange 63 kg de foin par semaine.'
                    - 'On recopie la formule vers le bas avec le petit carré en bas à droite de C2 : en C3, Calc écrit tout seul =B3*7.'
                    - 'À toi : ouvre Calc et enregistre sous 4e_S16_tonprenom.ods.'
                    - Recopie le document 1.
                    - En C2, écris =B2*7 puis Entrée.
                    - Recopie la formule jusqu’en C5 (petit carré en bas à droite).
                    - Pourquoi une formule ? Si la ration change, le résultat se recalcule tout seul.
        questions:
            -   id: q01
                type: nombre
                enonce: Quelle valeur Calc affiche-t-il en C2 pour Éclair ?
                unite: kg
                aide: La formule en C2 multiplie la ration du jour par 7. Lis la ration d’Éclair dans le document 1 et vérifie de tête.
            -   id: q02
                type: texte
                enonce: Écris la formule de la cellule C3 après la recopie.
                aide: 'Regarde la formule de C2 : en la recopiant d’une ligne vers le bas, le numéro de ligne augmente de 1.'
    -   id: a02
        titre: Le total et la moyenne
        transition: Chaque poney a son calcul. Calcule maintenant pour toute l’écurie.
        consigne: Tu vas calculer le total et la moyenne du foin avec les fonctions SOMME et MOYENNE. On attend deux résultats avec leur unité.
        contenu:
            -   type: citation
                texte: 'Réflexe DNB M5 : j’écris toujours l’unité de mes résultats (kg, €, km…).'
            -   type: etapes
                elements:
                    - 'Lis l’exemple : trois nombres en B2, B3, B4 : 2, 4, 6.'
                    - '=SOMME(B2:B4) additionne de B2 à B4 : 2 + 4 + 6 = 12.'
                    - '=MOYENNE(B2:B4) divise ce total par le nombre de cellules : 12 ÷ 3 = 4.'
                    - 'Les deux-points « : » veulent dire « de … à … ».'
                    - 'À toi : lis le réflexe M5.'
                    - En C6, écris =SOMME(C2:C5).
                    - En B7, écris =MOYENNE(B2:B5).
                    - Ajoute un titre dans la colonne A pour chaque ligne.
                    - Pourquoi SOMME ? Additionner cellule par cellule est long et source d’erreurs.
        questions:
            -   id: q01
                type: nombre
                enonce: Quel total de foin par semaine Calc affiche-t-il en C6 ?
                unite: kg
                aide: Clique sur C6 et lis le résultat de la SOMME, avec son unité (réflexe M5).
            -   id: q02
                type: nombre
                enonce: Quelle est la moyenne de foin par jour (B7) ?
                unite: kg
                aide: Clique sur B7 et lis la moyenne affichée, avec son unité.
    -   id: a03
        titre: Et si la ration change ?
        transition: Les calculs sont faits. Teste leur avantage.
        consigne: Tu vas modifier une ration et observer ce que fait le tableur. On attend l’observation et son explication.
        contenu:
            -   type: etapes
                elements:
                    - 'Change la ration de Caramel : 8 au lieu de 7.'
                    - Observe C5 et C6.
                    - Explique ce qui s’est passé.
                    - 'Pourquoi tester ? Tu vois l’avantage du tableur : tout se met à jour sans rien retaper.'
        questions:
            -   id: q01
                type: texte
                enonce: Que se passe-t-il quand tu changes la ration de Caramel ? Explique avec « car ».
                aide: Change la ration et regarde quelles cellules se recalculent. Pourquoi ces cellules suivent-elles ? Commence par « car ».
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une botte de foin pèse 20 kg.
        questions:
            -   id: q01
                type: texte
                enonce: Écris une formule qui calcule le nombre de bottes nécessaires pour la semaine.
                aide: 'Une botte pèse 20 kg : divise le total de la semaine par 20, puis arrondis au nombre de bottes entier supérieur.'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Le tableur calcule pour toi. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment faire calculer le tableur à ma place ?'
                aide: Explique comment on écrit une formule, comment on la recopie, et cite les fonctions utilisées aujourd’hui.
retenir:
    - Une formule commence par « = » ; on la recopie avec la poignée.
    - '=SOMME(plage), =MOYENNE(plage). Réflexe M5 : l’unité.'
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
