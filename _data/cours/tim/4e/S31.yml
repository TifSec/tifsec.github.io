titre: 'Séance 31 : L’affiche de la journée portes ouvertes'
themes:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
problematique: Comment réutiliser ce que j’ai appris pour créer une affiche réussie ?
competences_bo:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
objectifs:
    connaissances:
        - 'Une affiche se lit de loin : un titre très visible, une image, les informations essentielles.'
        - 'On réutilise : mise en forme (S03), images (S19, S20), droits (S08), format PDF (S05).'
    competences:
        - Concevoir une affiche lisible.
        - Vérifier son travail avec une grille.
pourquoi:
    - En S03, tu as écrit une invitation.
    - Aujourd’hui, tu crées l’affiche de la journée portes ouvertes en réutilisant tout ce que tu as appris.
activites:
    -   id: a01
        titre: Le cahier des charges
        consigne: Tu vas lire le cahier des charges de l’affiche (document 1) et préparer un croquis. On attend la liste des éléments obligatoires.
        contenu:
            -   type: liste
                elements:
                    - Format A4 portrait.
                    - Titre visible de loin.
                    - Date, horaires, lieu.
                    - Une photo libre de droits (ou prise par toi, sans personne reconnaissable).
                    - Un contact.
                    - Export en PDF.
            -   type: etapes
                elements:
                    - Lis le cahier des charges de l’affiche (document 1).
                    - Repère les éléments obligatoires.
                    - Fais un croquis rapide sur papier.
            -   type: paragraphe
                texte: Pourquoi un croquis ? On organise la place avant de passer à l’ordinateur.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, cite les éléments obligatoires de l’affiche.
                aide: « D’après le document… ».
    -   id: a02
        titre: Créer l’affiche
        transition: Ton croquis est prêt. Passe à l’ordinateur.
        consigne: Tu vas créer l’affiche dans Writer ou Impress puis l’exporter en PDF. On attend la description de ton affiche.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Writer ou Impress, format A4 portrait.
                    - Place le titre en très gros, la photo, puis les informations.
                    - Enregistre sous 4e_S31_tonprenom, puis exporte en PDF.
            -   type: paragraphe
                texte: Pourquoi exporter en PDF ? Le secrétariat l’imprimera sans risque de mise en page cassée.
        questions:
            -   id: q01
                type: texte
                enonce: 'Décris ton affiche : taille du titre, photo choisie (avec sa source), place des informations.'
                aide: Combien d’éléments sont demandés ?
    -   id: a03
        titre: Vérifier avec la grille
        transition: L’affiche est faite. Vérifie-la comme un lecteur.
        consigne: Tu vas vérifier ton affiche de loin, avec le cahier des charges, et la corriger. On attend ce que tu lis et ce que tu as corrigé.
        contenu:
            -   type: etapes
                elements:
                    - Affiche ton PDF en plein écran et recule de deux mètres.
                    - Vérifie chaque élément du cahier des charges.
                    - Corrige si besoin.
            -   type: paragraphe
                texte: 'Pourquoi reculer ? Une affiche se lit de loin : si on ne lit pas le titre à deux mètres, il faut l’agrandir.'
        questions:
            -   id: q01
                type: texte
                enonce: À deux mètres, qu’arrives-tu à lire ? Qu’as-tu corrigé ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Ajoute un QR code vers le site de la MFR.
        questions:
            -   id: q01
                type: texte
                enonce: À quoi sert-il sur une affiche ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton affiche est prête. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment réutiliser ce que tu as appris pour créer une affiche réussie ?'
                aide: Reprends les mots du problème.
retenir:
    - 'Affiche : titre visible, image, infos essentielles.'
    - 'Réutiliser : mise en forme, images, droits, PDF.'
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
