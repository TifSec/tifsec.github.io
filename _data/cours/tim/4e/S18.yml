titre: 'Séance 18 : Un graphique pour comparer les rations'
themes:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
problematique: Comment choisir et construire un graphique qui fait comprendre des données ?
competences_bo:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
objectifs:
    connaissances:
        - Un diagramme en barres compare des quantités ; un graphique en courbe montre une évolution dans le temps ; un secteur montre des parts d’un tout.
        - Un graphique a un titre, des axes nommés et des unités.
    competences:
        - Choisir le type de graphique adapté.
        - Créer un graphique dans Calc et le compléter.
pourquoi:
    - En S16, tu as calculé le foin de quatre poneys.
    - 'Un tableau de nombres est difficile à lire d’un coup d’œil : un graphique aide.'
activites:
    -   id: a01
        titre: Quel graphique ?
        consigne: Tu vas choisir le graphique adapté à trois besoins de l’écurie, avec le document 1. On attend un type de graphique pour chaque besoin.
        contenu:
            -   type: tableau
                titre: Document 1 — Trois graphiques
                colonnes:
                    - Graphique
                    - Il sert à…
                lignes:
                    -   - Barres (colonnes)
                        - Comparer des quantités
                    -   - Courbe
                        - Montrer une évolution dans le temps
                    -   - Secteurs
                        - Montrer les parts d’un total
            -   type: etapes
                elements:
                    - 'Lis le document 1 : trois types de graphiques.'
                    - 'Pour chaque besoin, demande-toi : je compare, je suis une évolution, ou je montre des parts ?'
                    - Choisis le type.
            -   type: paragraphe
                texte: Pourquoi choisir ? Un mauvais type de graphique peut cacher l’information ou la déformer.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Choisis le type de graphique pour chaque besoin : barres, courbe ou secteurs.'
                colonnes:
                    - Besoin
                    - Graphique
                lignes:
                    -   - Comparer le foin des quatre poneys
                        - ''
                    -   - Suivre le poids d’un poulain mois après mois
                        - ''
                    -   - Montrer la part de chaque dépense de l’écurie
                        - ''
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a02
        titre: Créer le graphique
        transition: Tu sais quel graphique choisir. Crée-le dans Calc.
        consigne: Tu vas créer dans Calc le diagramme en colonnes du foin par jour des quatre poneys. On attend le poney qui mange le plus, le titre et l’axe de ton graphique.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre ton fichier de S16 (ou recopie poneys et foin par jour).
                    - Sélectionne A1:B5.
                    - Insertion > Diagramme > Colonne.
                    - Ajoute le titre « Foin par jour » et nomme l’axe vertical « kg ».
            -   type: paragraphe
                texte: Pourquoi un titre et des unités ? Sans eux, le lecteur ne sait pas ce que représentent les barres.
        questions:
            -   id: q01
                type: qcm
                enonce: Dans ton graphique, quel poney a la barre la plus haute ?
                choix:
                    -   id: a
                        texte: Caramel (7 kg)
                    -   id: b
                        texte: Éclair (6 kg)
                    -   id: c
                        texte: Pompon (4 kg)
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Écris le titre de ton graphique et le nom de l’axe vertical.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a03
        titre: Lire et critiquer
        transition: Ton graphique est prêt. Apprends à repérer un graphique trompeur.
        consigne: Tu vas analyser un graphique trompeur sur les rations (document 2). On attend ce qui trompe le lecteur, justifié avec « car ».
        contenu:
            -   type: citation
                texte: 'Réflexe DNB M4 : je justifie avec « car » et un fait précis tiré du document.'
            -   type: paragraphe
                texte: 'Document 2 — Un graphique compare Éclair (6 kg) et Caramel (7 kg). L’axe vertical va de 5 kg à 7 kg : la barre de Caramel paraît deux fois plus haute que celle d’Éclair.'
            -   type: etapes
                elements:
                    - Regarde le graphique décrit dans le document 2.
                    - Lis l’échelle de l’axe vertical.
                    - Dis ce qui est trompeur.
            -   type: paragraphe
                texte: 'Pourquoi critiquer ? Un axe qui ne commence pas à zéro exagère les différences : il faut savoir le repérer.'
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 2, pourquoi ce graphique est-il trompeur ? Justifie avec « car ».
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Calc peut ajouter les valeurs au-dessus des barres.
        questions:
            -   id: q01
                type: texte
                enonce: Comment fait-on ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais construire un graphique. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment choisir et construire un graphique qui fait comprendre des données ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Barres : comparer ; courbe : évolution ; secteurs : parts.'
    - Titre, axes nommés, unités ; méfiance si l’axe ne part pas de 0.
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
