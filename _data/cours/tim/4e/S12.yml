titre: 'Séance 12 : Trouver vite la bonne réponse avec un moteur de recherche'
themes:
    - Objectif 3 — Répondre à un besoin d’information, analyser sa qualité et communiquer
problematique: Comment utiliser un moteur de recherche pour trouver vite une information précise ?
competences_bo:
    - Objectif 3 — Répondre à un besoin d’information, analyser sa qualité et communiquer
objectifs:
    connaissances:
        - Les mots-clés, les guillemets et le signe « - » rendent une recherche plus précise.
        - On lit l’adresse et la description d’un résultat avant de cliquer.
    competences:
        - Utiliser des mots-clés et des guillemets.
        - Choisir un résultat selon son adresse.
pourquoi:
    - En S11, tu as préparé tes questions et tes mots-clés.
    - Aujourd’hui, tu cherches les réponses.
activites:
    -   id: a01
        titre: Les outils de recherche
        consigne: Tu vas utiliser les outils de recherche du document 1 pour deux besoins précis. On attend la recherche à taper pour chacun.
        contenu:
            -   type: tableau
                titre: Document 1 — Outils de recherche
                colonnes:
                    - Outil
                    - Exemple
                    - Effet
                lignes:
                    -   - Guillemets
                        - '"selle français"'
                        - Expression exacte
                    -   - Signe -
                        - jaguar -voiture
                        - Enlève un mot
                    -   - Mots-clés
                        - taille shetland
                        - Résultats plus précis
            -   type: etapes
                elements:
                    - Lis le tableau des outils de recherche.
                    - Pour chaque besoin, choisis l’outil.
                    - Écris la recherche à taper.
            -   type: paragraphe
                texte: 'Pourquoi ces outils ? Ils enlèvent les résultats inutiles : tu gagnes du temps.'
        questions:
            -   id: q01
                type: tableau
                enonce: Écris ce qu’il faut taper pour chaque besoin.
                colonnes:
                    - Besoin
                    - Recherche à taper
                lignes:
                    -   - L’expression exacte « cheval de trait »
                        - ''
                    -   - Le Camargue, mais pas le riz de Camargue
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: Choisir un résultat
        transition: Tu sais taper une recherche précise. Choisis maintenant le bon résultat.
        consigne: Tu vas choisir, parmi trois résultats de recherche, le plus sérieux pour connaître la taille d’un poney. On attend ton choix et une raison.
        contenu:
            -   type: etapes
                elements:
                    - Lis les trois résultats ci-dessous.
                    - 'Regarde l’adresse : qui publie ?'
                    - Choisis le plus sérieux.
            -   type: paragraphe
                texte: 'Pourquoi lire l’adresse ? Elle dit qui publie : un institut, un club, un forum ou un vendeur.'
        questions:
            -   id: q01
                type: qcm
                enonce: Pour connaître la taille d’un poney Shetland, quel résultat choisis-tu ?
                choix:
                    -   id: a
                        texte: equipedia.ifce.fr — fiche de race
                    -   id: b
                        texte: forum-chevaux-fun.net — « je crois que c’est petit »
                    -   id: c
                        texte: vente-poneys-pas-cher.com — annonce
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Pourquoi n’as-tu pas choisi l’annonce de vente ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a03
        titre: Chercher pour ma race
        transition: Tu sais choisir. À toi de chercher pour ta race.
        consigne: Tu vas chercher sur internet une réponse à une de tes questions de S11. On attend la réponse et l’adresse du site.
        contenu:
            -   type: etapes
                elements:
                    - Tape tes mots-clés de S11 dans un moteur de recherche.
                    - Ouvre un résultat sérieux.
                    - Note une réponse et l’adresse du site.
            -   type: paragraphe
                texte: Pourquoi noter l’adresse ? Tu pourras citer ta source, et retrouver la page plus tard.
        questions:
            -   id: q01
                type: texte
                enonce: Écris une réponse trouvée sur ta race et l’adresse du site où tu l’as trouvée.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
        ressources:
            -   type: lien
                titre: IFCE — Équipédia (fiches techniques sur le cheval)
                url: https://equipedia.ifce.fr/
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Les moteurs de recherche n’affichent pas tous les mêmes résultats.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi peut-on comparer deux moteurs (Qwant, DuckDuckGo…) ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais chercher. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment utiliser un moteur de recherche pour trouver vite une information précise ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Mots-clés, guillemets, « - ».
    - Lire l’adresse avant de cliquer ; noter la source.
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
