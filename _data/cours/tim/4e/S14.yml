titre: 'Séance 14 : Présenter une race et citer ses sources'
themes:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
    - Objectif 4 — Adopter une attitude responsable dans une société démocratique
problematique: Comment présenter une race de chevaux dans un document, en citant ses sources ?
competences_bo:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
objectifs:
    connaissances:
        - Un document de présentation reprend la structure de la carte mentale.
        - 'On cite chaque source : auteur, titre, site, date (réflexe M7).'
    competences:
        - Rédiger une fiche avec styles et image.
        - Écrire une liste de sources.
pourquoi:
    - Depuis S11, tu as préparé, cherché et vérifié des informations sur ta race.
    - Aujourd’hui, tu rédiges ta fiche dans Writer.
activites:
    -   id: a01
        titre: Rédiger la fiche
        consigne: Tu vas rédiger dans Writer la fiche de ta race, avec les styles de titres et les parties de ta carte mentale. On attend ta partie « Utilisations ».
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Writer et enregistre sous 4e_S14_tonprenom.odt.
                    - 'Titre 1 : le nom de la race ; Titre 2 : une partie par branche de ta carte mentale.'
                    - Sous chaque partie, écris deux phrases avec tes propres mots.
            -   type: paragraphe
                texte: Pourquoi tes propres mots ? Recopier un site, c’est du plagiat ; reformuler montre que tu as compris.
        questions:
            -   id: q01
                type: texte
                enonce: Recopie la partie « Utilisations » de ta fiche.
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a02
        titre: Image légendée
        transition: Ton texte est écrit. Illustre-le.
        consigne: Tu vas illustrer ta fiche avec une image libre de droits et sa légende. On attend la légende, l’auteur et la licence de l’image.
        contenu:
            -   type: etapes
                elements:
                    - Insère une image libre de droits de ta race (banque d’images du professeur ou Wikimedia Commons).
                    - Ajoute une légende.
                    - Note l’auteur et la licence de l’image.
            -   type: paragraphe
                texte: Pourquoi noter la licence ? Tu devras la citer dans tes sources.
        questions:
            -   id: q01
                type: texte
                enonce: Écris la légende de ton image, son auteur et sa licence.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a03
        titre: Mes sources
        transition: Ta fiche est illustrée. Termine par les sources.
        consigne: Tu vas écrire la liste des sources de ta fiche, avec le réflexe M7. On attend une source complète.
        contenu:
            -   type: citation
                texte: 'Réflexe DNB M7 : je cite ma source : auteur, titre, site, date.'
            -   type: etapes
                elements:
                    - Lis le réflexe M7.
                    - Ajoute une partie « Sources » en Titre 2.
                    - 'Écris chaque source : auteur, titre, site, date.'
            -   type: paragraphe
                texte: Pourquoi une liste de sources ? Le lecteur peut vérifier, et tu respectes le travail des auteurs.
        questions:
            -   id: q01
                type: texte
                enonce: Écris une source de ta fiche, correctement citée.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Writer peut ajouter des notes de bas de page.
        questions:
            -   id: q01
                type: texte
                enonce: Insère une note qui cite la source d’une phrase. Quel menu ?
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ta fiche est terminée. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment présenter une race de chevaux dans un document, en citant ses sources ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Reformuler avec ses mots ; image libre de droits légendée.
    - 'Réflexe M7 : auteur, titre, site, date.'
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
