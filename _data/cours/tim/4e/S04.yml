titre: 'Séance 4 : Un document clair : la fiche d’un cheval'
themes:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
problematique: Comment organiser un document pour qu’il soit clair et agréable à lire ?
competences_bo:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
objectifs:
    connaissances:
        - Un document clair a un titre, des sous-titres, des paragraphes courts et une image avec sa légende.
        - Les styles (Titre 1, Titre 2) donnent la même présentation à tous les titres.
    competences:
        - Utiliser les styles de titres.
        - Insérer une image et sa légende.
pourquoi:
    - En S03, tu as mis en forme une invitation à la main.
    - 'Aujourd’hui, tu présentes un cheval de l’écurie pédagogique avec une méthode plus rapide : les styles.'
activites:
    -   id: a01
        titre: Titre, sous-titre, paragraphe
        consigne: Tu vas repérer la structure de la fiche brute de Princesse, une jument de l’écurie (ci-dessous). On attend le rôle de chaque ligne.
        contenu:
            -   type: citation
                texte: Princesse, jument de l’écurie / Son identité / Jument Selle Français, 12 ans, robe alezane. / Son caractère / Elle est calme et aime le travail à pied.
            -   type: paragraphe
                texte: Données fictives créées pour l’exercice.
            -   type: etapes
                elements:
                    - Lis la fiche brute ci-dessous.
                    - Repère le titre général, les sous-titres et les paragraphes.
                    - Range-les dans le tableau.
                    - Pourquoi repérer la structure ? Avant de mettre en forme, il faut savoir quel texte est un titre et lequel est un paragraphe.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Dans la fiche brute de Princesse, que sont ces lignes : titre, sous-titre ou paragraphe ?'
                colonnes:
                    - Ligne
                    - Rôle
                lignes:
                    -   - Princesse, jument de l’écurie
                        - ''
                    -   - Son caractère
                        - ''
                    -   - Elle est calme et aime le travail à pied.
                        - ''
                aide: Le titre est la première ligne, qui présente tout ; un sous-titre annonce une partie ; un paragraphe est une phrase complète d’explication.
    -   id: a02
        titre: Les styles
        transition: Tu connais la structure. Mets-la en forme avec les styles.
        consigne: Tu vas recopier la fiche de Princesse dans Writer et appliquer les styles de titres. On attend le bon style d’un sous-titre et l’intérêt des styles.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Writer et enregistre sous 4e_S04_tonprenom.odt.
                    - Recopie la fiche, une idée par ligne.
                    - Applique le style « Titre 1 » au titre, « Titre 2 » aux sous-titres.
                    - Laisse les paragraphes en « Corps de texte ».
                    - Pourquoi des styles ? Un seul clic donne la même présentation à tous les titres, et Writer pourra faire un sommaire automatique.
        questions:
            -   id: q01
                type: qcm
                enonce: Quel style donnes-tu au sous-titre « Son caractère » ?
                choix:
                    -   id: a
                        texte: Titre 2
                    -   id: b
                        texte: Titre 1
                    -   id: c
                        texte: Corps de texte
                aide: « Son caractère » annonce une partie de la fiche, sous le grand titre. Quel style correspond à une sous-partie ?
            -   id: q02
                type: texte
                enonce: Pourquoi utiliser un style plutôt que grossir le texte à la main ?
                aide: 'Imagine une fiche avec dix sous-titres à changer de taille : avec un style, combien de clics faut-il ?'
    -   id: a03
        titre: Image et légende
        transition: Les titres sont prêts. Ajoute une image.
        consigne: Tu vas ajouter à ta fiche une image de cheval avec sa légende. On attend ta légende et son rôle.
        contenu:
            -   type: etapes
                elements:
                    - Insère une image de cheval fournie par le professeur (Insertion > Image).
                    - Clic droit sur l’image > Insérer une légende.
                    - 'Écris : « Princesse au pré ».'
                    - Enregistre.
                    - 'Pourquoi une légende ? Elle dit ce que montre l’image : sans elle, le lecteur doit deviner.'
        questions:
            -   id: q01
                type: texte
                enonce: Quelle légende as-tu écrite sous l’image de Princesse, et à quoi sert une légende ?
                aide: 'Recopie ta légende, puis pense à quelqu’un qui regarde la photo sans connaître Princesse : que lui apprend la légende ?'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Writer peut créer une table des matières à partir des styles.
        questions:
            -   id: q01
                type: texte
                enonce: Insère une table des matières dans ta fiche. Qu’affiche-t-elle ?
                aide: 'Insère la table et regarde quelles lignes apparaissent : celles qui ont quel style ?'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ta fiche est claire. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment organiser un document pour qu’il soit clair et agréable à lire ?'
                aide: 'Cite ce qui rend la fiche claire : titres avec des styles, paragraphes courts, image avec légende.'
retenir:
    - 'Styles : Titre 1 pour le titre, Titre 2 pour les sous-titres.'
    - Une image a toujours une légende.
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
