titre: 'Séance 1 : Comment va-t-on travailler en TIM cette année ?'
themes:
    - Objectif 1 — S’approprier et utiliser un environnement informatique de travail
problematique: Comment fonctionne le cours de TIM, et comment utiliser le site pour y travailler ?
competences_bo:
    - Objectif 1 — S’approprier et utiliser un environnement informatique de travail
objectifs:
    connaissances:
        - Le TIM (technologies de l’informatique et du multimédia) apprend à se servir de l’ordinateur, d’internet et des logiciels de bureau.
        - 'Sur le site, chaque séance est faite de missions : on lit « Ta mission », on suit les étapes, puis on répond.'
    competences:
        - Se repérer dans une séance du site.
        - Retrouver une aide quand on bloque.
pourquoi:
    - 'Tu arrives en 4e à la MFR : le TIM t’accompagnera toute l’année, au centre comme en stage.'
    - Aujourd’hui, tu découvres le cours et le site, pour être autonome dès la prochaine séance.
activites:
    -   id: a01
        titre: Découvrir une séance
        consigne: Tu vas découvrir comment est construite une séance du site, à partir de celle-ci. On attend que tu saches où lire ta mission et où trouver la marche à suivre.
        contenu:
            -   type: etapes
                elements:
                    - 'Regarde le haut de la page : le titre et le problème du jour.'
                    - Lis l’encadré « Ta mission » de cette mission.
                    - Repère les étapes « Comment procéder » et l’encadré « Pourquoi ».
                    - Repère les questions en dessous.
            -   type: paragraphe
                texte: Pourquoi toujours le même ordre ? Quand chaque séance est construite pareil, tu sais où chercher et tu travailles plus vite.
        questions:
            -   id: q01
                type: qcm
                enonce: Dans une mission du site, que lis-tu en premier ?
                choix:
                    -   id: a
                        texte: L’encadré « Ta mission ».
                    -   id: b
                        texte: La dernière question.
                    -   id: c
                        texte: Le défi.
                aide: 'Méthode : 1) lis toutes les réponses avant de choisir ; 2) élimine celles qui sont impossibles ; 3) vérifie ton choix avec le document ou l’exemple expliqué de la mission.'
            -   id: q02
                type: qcm
                enonce: Où trouves-tu la marche à suivre d’une mission ?
                choix:
                    -   id: a
                        texte: Dans « Comment procéder ».
                    -   id: b
                        texte: Dans le titre de la page.
                    -   id: c
                        texte: Nulle part.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a02
        titre: Quand je bloque
        transition: Tu sais lire une séance. Voyons comment te faire aider.
        consigne: Tu vas découvrir l’aide prévue sur le site quand tu bloques sur une question. On attend la bonne réaction face à une difficulté et le barème d’une séance.
        contenu:
            -   type: etapes
                elements:
                    - Repère, sous chaque question, le bouton « Un coup de pouce ».
                    - Ouvre-le sur la question ci-dessous.
                    - 'Lis la règle : utiliser le coup de pouce ne fait jamais perdre de points.'
            -   type: paragraphe
                texte: 'Pourquoi un coup de pouce ? Il te donne une méthode, pas la réponse : tu apprends à te débrouiller seul, petit à petit.'
        questions:
            -   id: q01
                type: qcm
                enonce: Tu bloques sur une question du site. Que fais-tu en premier ?
                choix:
                    -   id: a
                        texte: J’ouvre « Un coup de pouce ».
                    -   id: b
                        texte: Je ferme la page.
                    -   id: c
                        texte: Je recopie la réponse du voisin.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: nombre
                enonce: Sur combien de points chaque séance du site est-elle notée ?
                unite: points
                aide: 'Méthode : 1) écris l’opération avec les nombres de l’énoncé ; 2) calcule (calculatrice autorisée) ; 3) vérifie que le résultat est vraisemblable et que l’unité est la bonne.'
    -   id: a03
        titre: Mes objectifs en TIM
        transition: Tu sais travailler sur le site. Pense maintenant à ce que tu veux apprendre.
        consigne: Tu vas choisir, dans la liste de ce qu’on apprendra en TIM, ce qui sera le plus utile pour ton futur métier. On attend un choix et une raison.
        contenu:
            -   type: liste
                elements:
                    - Ranger et protéger ses fichiers.
                    - Écrire des documents propres (Writer).
                    - Calculer avec un tableur (Calc).
                    - Présenter avec un diaporama (Impress).
                    - Chercher des informations fiables.
                    - Programmer un petit jeu.
            -   type: etapes
                elements:
                    - Lis la liste de ce qu’on apprendra en TIM cette année.
                    - Choisis ce qui te semble le plus utile pour ton futur métier.
                    - Explique ton choix en une phrase.
            -   type: paragraphe
                texte: Pourquoi un objectif ? Savoir à quoi sert ce qu’on apprend aide à rester motivé, surtout entre deux périodes de stage.
        questions:
            -   id: q01
                type: texte
                enonce: Parmi ce qu’on apprendra en TIM (liste ci-dessus), qu’est-ce qui sera le plus utile dans ton futur métier ? Explique avec « car ».
                aide: 'Méthode : 1) écris ton idée en une phrase ; 2) ajoute la raison avec « car » ou « parce que » ; 3) appuie-toi sur un fait vu dans la séance ou un document. Exemple de début : « … car … ».'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Les métiers du cheval utilisent beaucoup le numérique.
        questions:
            -   id: q01
                type: texte
                enonce: Cite un métier de la filière cheval qui utilise un ordinateur ou une tablette, et pour quoi faire.
                aide: 'Méthode : 1) relis la question et compte combien d’éléments sont demandés ; 2) cherche-les dans les documents ou dans « Ce que je retiens » ; 3) écris-les en phrase, un par un.'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as découvert le cours et le site. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment fonctionne le cours de TIM, et comment utiliser le site pour y travailler ?'
                aide: 'Méthode : 1) recopie le début de la question du problème ; 2) réponds avec les mots de « Ce que je retiens » ; 3) ajoute un exemple vu aujourd’hui. Trois ou quatre phrases suffisent.'
retenir:
    - 'Une séance = des missions : « Ta mission », « Comment procéder », « Pourquoi », questions.'
    - Le coup de pouce aide sans faire perdre de points.
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
