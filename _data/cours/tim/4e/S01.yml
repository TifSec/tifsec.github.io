titre: Découvrons le fonctionnement du TIM
theme: TIM — Découvrons le fonctionnement du TIM
problematique: Découvrons le fonctionnement du TIM
pourquoi: "Objectif de cette séance : Comprendre ce qu'est le TIM."
application: découvrir le fonctionnement des séances de TIM et faire un premier point sur vos compétences numériques.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Comprendre ce qu'est le TIM.
        - Comprendre comment seront organisées les séances.
        - Comprendre pourquoi il est important d'enregistrer régulièrement son travail.
        - Comprendre l'intérêt d'un nom de fichier précis.
        - Comprendre que l'erreur et les essais font partie de l'apprentissage.
    competences:
        - Créer un document avec LibreOffice Writer.
        - Enregistrer un document à un emplacement choisi.
        - Respecter une règle de nommage.
        - Mettre en forme simplement du texte.
        - Fermer puis retrouver un fichier enregistré.
        - Faire le point sur vos propres compétences numériques.
activites:
    - id: a01
      titre: Pour commencer
      contenu:
          - type: paragraphe
            texte: "Classe : 4e / 3e MFR"
          - type: paragraphe
            texte: "Durée : 50 minutes"
          - type: paragraphe
            texte: "Organisation : travail individuel"
          - type: paragraphe
            texte: "Logiciel : LibreOffice Writer"
          - type: paragraphe
            texte: "Mission : découvrir le fonctionnement des séances de TIM et faire un premier point sur vos compétences numériques."
      questions: []
    - id: a04
      titre: Production attendue
      contenu:
          - type: paragraphe
            texte: "À la fin de la séance, vous devrez rendre un document nommé :"
          - type: paragraphe
            texte: 4e3e_S01_nom_prenom.odt
          - type: paragraphe
            texte: "Ce document devra contenir :"
          - type: liste
            elements:
                - votre nom et votre prénom ;
                - votre classe ;
                - une courte présentation ;
                - vos réponses aux différentes questions ;
                - les manipulations demandées pendant la séance.
          - type: paragraphe
            texte: "Important : le fichier doit être rendu à la fin de la séance, même si vous n'avez pas terminé toutes les activités."
      questions: []
    - id: a05
      titre: 1. Bienvenue en TIM – 5 minutes
      contenu:
          - type: paragraphe
            texte: TIM signifie Technologies de l'Informatique et du Multimédia.
          - type: paragraphe
            texte: Cette année, vous allez principalement apprendre en utilisant directement les outils numériques.
          - type: paragraphe
            texte: "Vous pourrez notamment travailler sur :"
          - type: liste
            elements:
                - les fichiers et les dossiers ;
                - le traitement de texte ;
                - les tableaux et les graphiques ;
                - la recherche d'informations ;
                - la fiabilité des sources ;
                - les données personnelles ;
                - la cybersécurité ;
                - l'intelligence artificielle ;
                - la programmation ;
                - différents projets numériques.
          - type: paragraphe
            texte: Le cours sera principalement basé sur la pratique.
          - type: paragraphe
            texte: "Vous allez donc régulièrement :"
          - type: liste
            elements:
                - essayer ;
                - chercher ;
                - vous tromper ;
                - corriger ;
                - améliorer votre travail.
      questions: []
    - id: a06
      titre: 2. Comment allons-nous travailler ? – 5 minutes
      contenu:
          - type: paragraphe
            texte: Quelques règles seront utilisées pendant toute l'année.
          - type: liste
            elements:
                - Je lis la consigne avant de demander de l'aide.
                - J'essaie de trouver une solution.
                - Je peux demander un indice si je suis bloqué.
                - Je peux me tromper puis corriger.
                - J'enregistre régulièrement mon travail.
                - Je respecte les fichiers et le matériel.
                - Je rends le travail demandé à la fin de la séance.
          - type: paragraphe
            texte: Lorsque des aides sont disponibles, utilisez-les progressivement.
          - type: paragraphe
            texte: Commencez toujours par l'indice 1. N'ouvrez l'indice suivant que si vous êtes encore bloqué.
      questions: []
    - id: a07
      titre: 3. Créons notre premier document – 5 minutes
      contenu:
          - type: paragraphe
            texte: Ouvrez LibreOffice Writer.
          - type: paragraphe
            texte: Créez un nouveau document.
          - type: paragraphe
            texte: "Écrivez :"
          - type: liste
            elements:
                - votre nom ;
                - votre prénom ;
                - "votre classe : 4e ou 3e ;"
                - "le titre : Séance 1 – Découverte du TIM."
          - type: paragraphe
            texte: "Enregistrez immédiatement votre document sous le nom :"
          - type: paragraphe
            texte: 4e3e_S01_nom_prenom.odt
          - type: paragraphe
            texte: "Exemple :"
          - type: paragraphe
            texte: 4e3e_S01_martin_lucas.odt
          - type: titre
            texte: AIDE SI BESOIN – Je ne sais pas enregistrer mon fichier
          - type: paragraphe
            texte: "Indice 1/3 : cherchez le menu qui permet de gérer les fichiers."
          - type: paragraphe
            texte: "Indice 2/3 : ouvrez le menu Fichier."
          - type: paragraphe
            texte: "Indice 3/3 : utilisez Fichier → Enregistrer sous, choisissez l'emplacement demandé puis saisissez le nom du fichier."
      questions: []
    - id: a08
      titre: 4. Faisons connaissance – 10 minutes
      contenu:
          - type: paragraphe
            texte: "Ajoutez le sous-titre :"
          - type: paragraphe
            texte: Quelques informations sur moi
          - type: paragraphe
            texte: Puis répondez aux questions suivantes.
      questions:
          - id: q01
            type: texte
            enonce: "Question 1 : qu'aimez-vous faire en dehors de l'école ?"
          - id: q02
            type: texte
            enonce: "Question 2 : utilisez-vous un ordinateur en dehors de l'école ? Si oui, pour quelles activités ?"
          - id: q03
            type: texte
            enonce: "Question 3 : quel logiciel, site ou service numérique utilisez-vous le plus souvent ?"
          - id: q04
            type: texte
            enonce: "Question 4 : y a-t-il quelque chose que vous aimeriez apprendre à faire avec un ordinateur cette année ?"
          - id: q05
            type: texte
            enonce: "Question 5 : avez-vous déjà utilisé un logiciel pour programmer ?"
    - id: a09
      titre: 5. Petit défi Writer – 10 minutes
      contenu:
          - type: paragraphe
            texte: Nous allons maintenant voir ce que vous savez déjà faire.
          - type: paragraphe
            texte: "Sans demander immédiatement au professeur, réalisez les manipulations suivantes :"
          - type: etapes
            elements:
                - Mettez le titre de la séance en gras.
                - Augmentez sa taille.
                - Centrez-le.
                - Mettez votre nom et votre prénom en italique.
                - Ajoutez la date du jour.
                - Créez une liste à puces comportant trois activités que vous aimez.
          - type: titre
            texte: AIDE SI BESOIN – Mettre un texte en forme
          - type: paragraphe
            texte: "Indice 1/3 : commencez par sélectionner le texte à modifier."
          - type: paragraphe
            texte: "Indice 2/3 : observez la barre d'outils située au-dessus de votre document."
          - type: paragraphe
            texte: "Indice 3/3 : utilisez les boutons de gras, italique, alignement et taille de police. Pour la liste, recherchez l'icône de liste à puces."
      questions: []
    - id: a10
      titre: 6. Fermer et retrouver son fichier – 5 minutes
      contenu:
          - type: paragraphe
            texte: "Enregistrez votre document avec :"
          - type: paragraphe
            texte: Ctrl + S
          - type: paragraphe
            texte: "Puis :"
          - type: etapes
            elements:
                - fermez LibreOffice Writer ;
                - retrouvez le fichier 4e3e_S01_nom_prenom.odt ;
                - ouvrez-le ;
                - "ajoutez à la fin du document : J'ai réussi à retrouver mon fichier."
                - enregistrez de nouveau.
          - type: titre
            texte: AIDE SI BESOIN – Je ne retrouve plus mon fichier
          - type: paragraphe
            texte: "Indice 1/3 : essayez de vous rappeler où vous l'avez enregistré."
          - type: paragraphe
            texte: "Indice 2/3 : ouvrez l'explorateur de fichiers et retournez dans ce dossier."
          - type: paragraphe
            texte: "Indice 3/3 : recherchez le nom commençant par 4e3e_S01."
      questions: []
    - id: a11
      titre: 7. Où en suis-je ? – 5 minutes
      contenu:
          - type: paragraphe
            texte: "Pour chaque compétence, choisissez :"
          - type: paragraphe
            texte: Oui / Un peu / Pas encore
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Je pense savoir...
                - Mon avis
            lignes:
                - - Créer et enregistrer un document
                  - ""
                - - Retrouver un fichier enregistré
                  - ""
                - - Créer et organiser des dossiers
                  - ""
                - - Mettre en forme un texte
                  - ""
                - - Faire une recherche efficace sur Internet
                  - ""
                - - Vérifier si une information est fiable
                  - ""
                - - Utiliser LibreOffice Calc
                  - ""
                - - Créer un graphique
                  - ""
                - - Créer une présentation
                  - ""
                - - Programmer
                  - ""
                - - Utiliser une intelligence artificielle efficacement
                  - ""
    - id: a12
      titre: 8. Dernière vérification et rendu – 5 minutes
      contenu:
          - type: paragraphe
            texte: "Avant de rendre votre fichier, vérifiez :"
          - type: liste
            elements:
                - Mon nom et mon prénom sont présents.
                - Ma classe est indiquée.
                - J'ai répondu aux questions.
                - J'ai réalisé le défi Writer.
                - J'ai réussi à retrouver mon fichier.
                - Mon fichier possède le bon nom.
                - J'ai enregistré mes dernières modifications.
          - type: paragraphe
            texte: "Déposez ensuite :"
          - type: paragraphe
            texte: 4e3e_S01_nom_prenom.odt
          - type: paragraphe
            texte: dans l'espace indiqué par le professeur.
          - type: paragraphe
            texte: Le travail doit être rendu même s'il n'est pas totalement terminé.
      questions: []
    - id: a13
      titre: À retenir
      contenu:
          - type: liste
            elements:
                - En TIM, nous allons principalement apprendre en pratiquant.
                - J'ai le droit d'essayer, de me tromper et de corriger.
                - Avant de demander de l'aide, je lis la consigne et j'essaie de chercher.
                - J'enregistre régulièrement mon travail.
                - Un fichier doit avoir un nom permettant de l'identifier facilement.
                - Je dois savoir où mon fichier est enregistré pour pouvoir le retrouver.
                - À la fin d'une séance, je rends le travail demandé, même s'il est incomplet.
      questions: []
    - id: a14
      titre: Référentiel
      contenu:
          - type: paragraphe
            texte: Cette séance permet notamment de commencer à travailler l'utilisation d'un environnement informatique et la gestion de documents numériques.
          - type: paragraphe
            texte: "Source : ChloroFil – Classes de 4e et 3e de l'enseignement agricole ."
          - type: lien
            titre: ChloroFil – Classes de 4e et 3e de l'enseignement agricole
            url: https://chlorofil.fr/diplomes/secondaire/4e-3e
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
ressources:
    - type: paragraphe
      texte: Réalise les manipulations dans le logiciel demandé. Conserve tes fichiers sur ton espace habituel. Le site enregistre seulement tes réponses écrites, tes résultats, tes formules et tes démarches ; aucun fichier n’est téléversé.
introduction:
    - type: titre
      texte: Ce que vous allez apprendre
    - type: liste
      elements:
          - Comprendre ce qu'est le TIM.
          - Comprendre comment seront organisées les séances.
          - Comprendre pourquoi il est important d'enregistrer régulièrement son travail.
          - Comprendre l'intérêt d'un nom de fichier précis.
          - Comprendre que l'erreur et les essais font partie de l'apprentissage.
    - type: titre
      texte: Ce que vous allez apprendre à faire
    - type: liste
      elements:
          - Créer un document avec LibreOffice Writer.
          - Enregistrer un document à un emplacement choisi.
          - Respecter une règle de nommage.
          - Mettre en forme simplement du texte.
          - Fermer puis retrouver un fichier enregistré.
          - Faire le point sur vos propres compétences numériques.
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://chlorofil.fr/diplomes/secondaire/4e-3e
