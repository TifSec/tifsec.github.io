titre: 'Séance 21 : Un diaporama pour présenter l’écurie'
themes:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
problematique: Comment construire un diaporama clair pour présenter un sujet à l’oral ?
competences_bo:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
objectifs:
    connaissances:
        - 'Un diaporama (Impress, PowerPoint) accompagne l’oral : peu de texte, des images, une idée par diapositive.'
        - Un masque ou un thème donne la même présentation à toutes les diapositives.
    competences:
        - Créer des diapositives avec titre, texte court et image.
        - Appliquer un thème.
pourquoi:
    - En S20, tu as préparé des photos. Elles vont servir à présenter l’écurie pédagogique aux nouveaux élèves.
    - Aujourd’hui, tu découvres Impress.
activites:
    -   id: a01
        titre: Une bonne diapositive
        consigne: Tu vas comparer deux diapositives sur l’écurie (document 1) pour trouver les règles d’une bonne diapositive. On attend ton choix et deux règles.
        contenu:
            -   type: paragraphe
                texte: 'Document 1 — Diapositive A : titre « L’écurie » et douze lignes de texte en petit. Diapositive B : titre « Nos 8 poneys », trois mots-clés et une photo.'
            -   type: etapes
                elements:
                    - Lis les deux diapositives décrites dans le document 1.
                    - Compare la quantité de texte et la présence d’image.
                    - Choisis la meilleure.
            -   type: paragraphe
                texte: 'Pourquoi peu de texte ? Le public écoute l’orateur : s’il doit lire un pavé, il n’écoute plus.'
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 1, quelle diapositive est la meilleure ?
                choix:
                    -   id: a
                        texte: 'La B : un titre, trois mots-clés, une photo.'
                    -   id: b
                        texte: 'La A : douze lignes de texte.'
                    -   id: c
                        texte: Les deux se valent.
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: texte
                enonce: Donne deux règles d’une bonne diapositive.
                aide: Combien d’éléments sont demandés ?
    -   id: a02
        titre: Créer le diaporama
        transition: Tu connais les règles. Crée ton diaporama.
        consigne: Tu vas créer dans Impress un diaporama de trois diapositives sur l’écurie pédagogique. On attend le contenu d’une diapositive et l’extension du fichier.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Impress et enregistre sous 4e_S21_tonprenom.odp.
                    - Choisis un thème sobre.
                    - 'Crée 3 diapositives : titre, « Nos poneys », « Une journée à l’écurie ».'
                    - Sur chaque diapositive, un titre et trois mots-clés maximum.
            -   type: paragraphe
                texte: 'Pourquoi un thème ? Toutes les diapositives ont les mêmes couleurs et polices : le diaporama est cohérent.'
        questions:
            -   id: q01
                type: texte
                enonce: Écris le titre et les mots-clés de ta diapositive « Une journée à l’écurie ».
                aide: Combien d’éléments sont demandés ?
            -   id: q02
                type: qcm
                enonce: Quelle extension a un fichier Impress ?
                choix:
                    -   id: a
                        texte: .odp
                    -   id: b
                        texte: .odt
                    -   id: c
                        texte: .ods
                aide: Relis l’exemple expliqué.
    -   id: a03
        titre: Ajouter les images
        transition: Les textes sont prêts. Illustre-les.
        consigne: Tu vas insérer ta photo retouchée dans le diaporama et vérifier la lisibilité. On attend la description de ta diapositive.
        contenu:
            -   type: etapes
                elements:
                    - Insère la photo retouchée en S20 sur la diapositive « Nos poneys ».
                    - Place-la sans cacher le texte.
                    - 'Vérifie la lisibilité : taille du texte au moins 24.'
            -   type: paragraphe
                texte: Pourquoi 24 au minimum ? Au fond de la salle, un texte plus petit ne se lit pas.
        questions:
            -   id: q01
                type: texte
                enonce: 'Décris ta diapositive « Nos poneys » : où est l’image, où est le texte, quelle taille de police ?'
                aide: Combien d’éléments sont demandés ?
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Impress a un mode « Présentateur ».
        questions:
            -   id: q01
                type: texte
                enonce: Qu’affiche-t-il à l’orateur que le public ne voit pas ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton diaporama est commencé. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment construire un diaporama clair pour présenter un sujet à l’oral ?'
                aide: Reprends les mots du problème.
retenir:
    - Une idée par diapositive, mots-clés, image.
    - Thème commun ; police ≥ 24.
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
