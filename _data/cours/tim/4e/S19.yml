titre: 'Séance 19 : Pourquoi ma photo de poney est-elle si lourde ?'
themes:
    - Objectif 1 — S’approprier et utiliser un environnement informatique de travail
problematique: De quoi dépend le poids d’une image numérique, et comment l’alléger ?
competences_bo:
    - Objectif 1 — S’approprier et utiliser un environnement informatique de travail
objectifs:
    connaissances:
        - Une image numérique est faite de pixels ; sa définition est le nombre de pixels (largeur × hauteur).
        - Plus il y a de pixels, plus le fichier est lourd ; le format JPG compresse l’image.
    competences:
        - Lire la définition et le poids d’une image.
        - Redimensionner une image.
pourquoi:
    - En S05, une photo était trop lourde pour être envoyée.
    - Aujourd’hui, tu comprends pourquoi et tu apprends à l’alléger.
activites:
    -   id: a01
        titre: Les pixels
        consigne: Tu vas découvrir les pixels d’une photo et calculer la définition d’une image de téléphone (document 1). On attend le nombre de pixels avec son unité.
        contenu:
            -   type: citation
                texte: 'Réflexe DNB M5 : j’écris toujours l’unité de mes résultats.'
            -   type: paragraphe
                texte: Document 1 — Une photo de téléphone mesure souvent 4 000 pixels de large et 3 000 pixels de haut. Sa définition est 4 000 × 3 000 pixels.
            -   type: etapes
                elements:
                    - Ouvre une photo fournie et zoome très fort.
                    - 'Observe les petits carrés de couleur : ce sont les pixels.'
                    - Lis le document 1.
            -   type: paragraphe
                texte: 'Pourquoi zoomer ? On voit que l’image n’est pas continue : c’est une grille de points, chacun d’une seule couleur.'
        questions:
            -   id: q01
                type: nombre
                enonce: D’après le document 1, combien de pixels compte une image de 4 000 × 3 000 ?
                unite: millions de pixels
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: qcm
                enonce: Qu’est-ce qu’un pixel ?
                choix:
                    -   id: a
                        texte: Un petit carré d’une seule couleur.
                    -   id: b
                        texte: Un fichier.
                    -   id: c
                        texte: Un appareil photo.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a02
        titre: Définition et poids
        transition: Tu sais ce qu’est un pixel. Voyons le lien avec le poids du fichier.
        consigne: Tu vas comparer deux versions d’une même photo de poney (document 2). On attend le lien entre la définition et le poids, appuyé sur les chiffres.
        contenu:
            -   type: tableau
                titre: Document 2 — Deux versions de la même photo
                colonnes:
                    - Image
                    - Définition
                    - Poids (JPG)
                lignes:
                    -   - Photo originale
                        - 4 000 × 3 000
                        - 4,8 Mo
                    -   - Photo réduite
                        - 1 000 × 750
                        - 0,3 Mo
            -   type: etapes
                elements:
                    - Lis le tableau du document 2.
                    - Compare la définition et le poids des deux images.
                    - Conclus sur le lien entre les deux.
            -   type: paragraphe
                texte: 'Pourquoi ce lien ? Chaque pixel doit être enregistré : moins de pixels, c’est moins de données.'
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 2, que se passe-t-il quand on divise la largeur et la hauteur par 4 ? Justifie avec les chiffres.
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
    -   id: a03
        titre: Redimensionner
        transition: Tu as compris le lien. Allège une vraie photo.
        consigne: Tu vas redimensionner une photo de poney à 1 200 pixels de large et l’exporter en JPG. On attend son poids avant et après.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre la photo dans un logiciel d’image (GIMP, Photos, ou en ligne).
                    - 'Image > Échelle (ou Redimensionner) : 1 200 pixels de large.'
                    - Exporte en JPG sous le nom eclair_web.jpg.
                    - Compare le poids avec l’original.
            -   type: paragraphe
                texte: Pourquoi 1 200 pixels ? C’est bien assez pour un écran ou un site, et le fichier devient léger.
        questions:
            -   id: q01
                type: texte
                enonce: Écris le poids de la photo avant et après le redimensionnement.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le format PNG ne perd pas de qualité, le JPG si.
        questions:
            -   id: q01
                type: texte
                enonce: Pour une photo du concours, lequel choisir et pourquoi ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ta photo est allégée. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : de quoi dépend le poids d’une image numérique, et comment l’alléger ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Image = pixels ; définition = largeur × hauteur.
    - Moins de pixels et format JPG = fichier plus léger.
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
