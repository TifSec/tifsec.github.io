titre: 'Séance 29 : Que devient mon vieux téléphone ?'
themes:
    - Objectif 6 — Appréhender les évolutions des technologies de l’informatique et du multimédia
problematique: Quel est l’impact d’un appareil numérique sur l’environnement, et comment le réduire ?
competences_bo:
    - Objectif 6 — Appréhender les évolutions des technologies de l’informatique et du multimédia
objectifs:
    connaissances:
        - La plus grande part de l’impact d’un téléphone vient de sa fabrication (métaux, énergie).
        - Garder plus longtemps, réparer, donner et recycler réduisent cet impact.
    competences:
        - Lire un graphique sur le cycle de vie.
        - Proposer des gestes responsables.
pourquoi:
    - Tu utilises des appareils numériques tous les jours.
    - Mais d’où viennent-ils, et que deviennent-ils ?
activites:
    -   id: a01
        titre: Le cycle de vie
        consigne: Tu vas lire la répartition de l’impact d’un téléphone sur son cycle de vie (document 1). On attend un pourcentage et une conclusion.
        contenu:
            -   type: citation
                texte: 'Réflexe DNB M2 : je commence par « D’après le document… ».'
            -   type: tableau
                titre: Document 1 — Impact d’un smartphone sur le climat (ordres de grandeur, d’après l’ADEME)
                colonnes:
                    - Étape
                    - Part de l’impact (ordre de grandeur)
                lignes:
                    -   - Fabrication
                        - 80 %
                    -   - Transport
                        - 5 %
                    -   - Utilisation
                        - 14 %
                    -   - Fin de vie
                        - 1 %
            -   type: etapes
                elements:
                    - 'Lis le document 1 : la répartition de l’impact d’un téléphone.'
                    - Repère l’étape la plus importante.
                    - Réponds avec « D’après le document » (M2).
            -   type: paragraphe
                texte: Pourquoi la fabrication ? Il faut extraire des métaux rares et beaucoup d’énergie pour fabriquer un téléphone.
        questions:
            -   id: q01
                type: nombre
                enonce: D’après le document 1, quel pourcentage de l’impact vient de la fabrication ?
                unite: '%'
                aide: N’oublie pas l’unité.
            -   id: q02
                type: texte
                enonce: D’après le document 1, quelle conclusion en tires-tu pour réduire l’impact de ton téléphone ?
                aide: « D’après le document… ».
    -   id: a02
        titre: Que faire de mon vieil appareil ?
        transition: La fabrication pèse le plus. Que faire de ses appareils ?
        consigne: Tu vas choisir la meilleure solution pour un téléphone qui marche encore, puis pour un téléphone cassé. On attend deux choix justifiés.
        contenu:
            -   type: etapes
                elements:
                    - 'Lis les possibilités : réparer, donner, revendre, recycler, jeter à la poubelle.'
                    - Classe-les de la meilleure à la pire pour l’environnement.
                    - Justifie ton premier choix.
            -   type: paragraphe
                texte: Pourquoi réparer d’abord ? Un appareil réparé évite la fabrication d’un neuf.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle est la meilleure solution pour un téléphone qui marche encore mais que tu ne veux plus ? Justifie avec « car ».
                aide: Pense à « car ».
            -   id: q02
                type: qcm
                enonce: 'Un téléphone cassé et irréparable : où va-t-il ?'
                choix:
                    -   id: a
                        texte: En point de collecte pour être recyclé.
                    -   id: b
                        texte: Dans la poubelle ordinaire.
                    -   id: c
                        texte: Au fond d’un tiroir.
                aide: Relis l’exemple expliqué.
    -   id: a03
        titre: Les gestes du quotidien
        transition: Tu sais quoi faire de tes appareils. Et au quotidien ?
        consigne: Tu vas proposer deux gestes pour réduire l’impact de ton usage du numérique. On attend deux gestes et ce qu’ils économisent.
        contenu:
            -   type: etapes
                elements:
                    - Pense à ton usage du numérique.
                    - Propose deux gestes simples.
                    - Pour chacun, dis ce qu’il économise.
            -   type: paragraphe
                texte: Pourquoi des gestes simples ? Ils comptent quand des millions de personnes les font.
        questions:
            -   id: q01
                type: texte
                enonce: Propose deux gestes pour réduire l’impact de ton usage du numérique, et ce qu’ils économisent.
                aide: Une idée réaliste + « Cela permet de… ».
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Les exploitations équestres utilisent aussi du numérique (caméras de poulinage, ordinateurs).
        questions:
            -   id: q01
                type: texte
                enonce: Propose une règle pour que l’écurie réduise son impact numérique.
                aide: Une idée réaliste + « Cela permet de… ».
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu connais l’impact du numérique. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quel est l’impact d’un appareil numérique sur l’environnement, et comment le réduire ?'
                aide: Reprends les mots du problème.
retenir:
    - L’impact vient surtout de la fabrication.
    - Garder, réparer, donner, recycler.
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
