titre: 'Séance 27 : Mon jeu ne marche pas : chercher le bogue'
themes:
    - Objectif 5 — Découvrir l’analyse et le codage
problematique: Comment trouver et corriger une erreur dans un programme ?
competences_bo:
    - Objectif 5 — Découvrir l’analyse et le codage
objectifs:
    connaissances:
        - Un bogue est une erreur dans un programme ; déboguer, c’est la trouver et la corriger.
        - On teste une seule chose à la fois et on compare ce qui se passe avec ce qu’on attendait.
    competences:
        - Décrire un dysfonctionnement.
        - Corriger un programme et vérifier la correction.
pourquoi:
    - En S26, ton jeu est presque fini.
    - 'Mais les programmes ont souvent des bogues : aujourd’hui, tu apprends à les chasser.'
activites:
    -   id: a01
        titre: Attendu ou obtenu ?
        consigne: Tu vas comparer ce que Jade attendait de son jeu et ce qu’elle obtient (document 1). On attend l’attendu et l’obtenu.
        contenu:
            -   type: code
                texte: "quand le drapeau vert est cliqué\n    aller à x : -200 y : 0\n    répéter indéfiniment\n        si touche le lutin barre ? alors\n            ajouter 4 à pénalités"
            -   type: paragraphe
                texte: 'Document 1 — Jade observe : à la deuxième partie, les pénalités commencent à 12 au lieu de 0.'
            -   type: etapes
                elements:
                    - Lis le programme de Jade et ce qu’elle observe (document 1).
                    - Écris ce qui était attendu, puis ce qui est obtenu.
                    - Repère la différence.
            -   type: paragraphe
                texte: Pourquoi comparer ? Un bogue, c’est l’écart entre ce qu’on voulait et ce qui se passe.
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, complète le tableau.
                colonnes:
                    - ''
                    - Description
                lignes:
                    -   - Attendu
                        - ''
                    -   - Obtenu
                        - ''
                aide: Ligne × colonne.
    -   id: a02
        titre: Trouver la cause
        transition: Tu as décrit le bogue. Trouves-en la cause.
        consigne: Tu vas chercher dans le programme de Jade le bloc qui manque. On attend le bloc et sa place.
        contenu:
            -   type: etapes
                elements:
                    - Relis le programme de Jade bloc par bloc.
                    - Cherche le bloc qui remet les pénalités à zéro.
                    - Écris le bloc manquant et où le placer.
            -   type: paragraphe
                texte: Pourquoi bloc par bloc ? Le bogue est souvent un bloc oublié ou mal placé.
        questions:
            -   id: q01
                type: texte
                enonce: Quel bloc manque dans le programme de Jade, et où faut-il le placer ?
                aide: Bloc par bloc.
    -   id: a03
        titre: Un deuxième bogue
        transition: Le bogue de Jade est corrigé. Entraîne-toi sur un autre.
        consigne: Tu vas trouver et corriger le bogue du saut de Tom (document 2). On attend ce qui se passe et la correction.
        contenu:
            -   type: code
                texte: "quand la touche espace est pressée\n    ajouter 60 à y\n    attendre 0.5 secondes\n    ajouter -40 à y"
            -   type: paragraphe
                texte: Document 2 — Le saut programmé par Tom.
            -   type: etapes
                elements:
                    - 'Lis le document 2 : le saut de Tom.'
                    - 'Teste mentalement : où finit le cavalier après un saut ?'
                    - Propose la correction.
            -   type: paragraphe
                texte: Pourquoi tester mentalement ? On suit le programme comme l’ordinateur et on voit l’erreur.
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 2, que se passe-t-il après chaque saut de Tom ?
                choix:
                    -   id: a
                        texte: Le cavalier finit 20 plus haut à chaque saut.
                    -   id: b
                        texte: Il revient au sol.
                    -   id: c
                        texte: Il ne saute pas.
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: texte
                enonce: Corrige le programme de Tom.
                aide: Bloc par bloc.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Teste ton propre jeu en demandant à un camarade d’y jouer.
        questions:
            -   id: q01
                type: texte
                enonce: Note un bogue qu’il a trouvé et ta correction.
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais déboguer. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment trouver et corriger une erreur dans un programme ?'
                aide: Reprends les mots du problème.
retenir:
    - Bogue = écart entre attendu et obtenu.
    - Relire bloc par bloc ; une correction à la fois ; retester.
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
