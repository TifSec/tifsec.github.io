titre: 'Séance 25 : Sauter l’obstacle : les conditions dans Scratch'
themes:
    - Objectif 5 — Découvrir l’analyse et le codage
problematique: Comment faire réagir un programme quand deux lutins se touchent ?
competences_bo:
    - Objectif 5 — Découvrir l’analyse et le codage
objectifs:
    connaissances:
        - Un capteur Scratch (« touche le lutin… ? ») renvoie vrai ou faux.
        - « si… alors » exécute des blocs seulement quand la condition est vraie ; « répéter indéfiniment » teste en permanence.
    competences:
        - Programmer une condition de contact.
        - Utiliser une boucle infinie.
pourquoi:
    - En S24, ton cavalier se déplace.
    - 'Il faut maintenant un obstacle : s’il le touche, il y a faute.'
activites:
    -   id: a01
        titre: Ajouter l’obstacle
        consigne: Tu vas ajouter un lutin obstacle à ton projet Scratch et observer ce qui se passe au contact. On attend l’observation et son explication.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre ton projet de S24.
                    - Ajoute un lutin « barre » (dessine un rectangle).
                    - Place-le au milieu de la scène.
                    - 'Teste : le cavalier traverse-t-il la barre ?'
            -   type: paragraphe
                texte: Pourquoi le cavalier traverse ? Le programme ne sait rien de la barre tant qu’on ne lui dit pas quoi faire.
        questions:
            -   id: q01
                type: qcm
                enonce: Avant d’ajouter une condition, que se passe-t-il quand le cavalier passe sur la barre ?
                choix:
                    -   id: a
                        texte: 'Rien : il la traverse.'
                    -   id: b
                        texte: Il s’arrête.
                    -   id: c
                        texte: La barre tombe.
                aide: Relis l’exemple expliqué.
            -   id: q02
                type: texte
                enonce: Pourquoi le programme ne réagit-il pas ?
                aide: 'Bloc par bloc : quand ? quelle condition ? quelle action ?'
    -   id: a02
        titre: La faute
        transition: La barre est là. Programme la réaction au contact.
        consigne: Tu vas programmer une faute quand le cavalier touche la barre, avec une condition dans une boucle. On attend la réaction du cavalier et le rôle de la boucle.
        contenu:
            -   type: etapes
                elements:
                    - Dans le lutin cavalier, sous le drapeau vert, ajoute « répéter indéfiniment ».
                    - Dedans, mets « si touche le lutin barre ? alors ».
                    - 'Dedans, mets « dire Faute ! pendant 1 seconde » et « aller à x : -200 y : 0 ».'
                    - Teste.
            -   type: paragraphe
                texte: Pourquoi « répéter indéfiniment » ? Le test doit être fait en permanence, pas une seule fois au démarrage.
        questions:
            -   id: q01
                type: texte
                enonce: Que fait le cavalier quand il touche la barre ?
                aide: Repère le verbe de la question.
            -   id: q02
                type: qcm
                enonce: Si tu enlèves « répéter indéfiniment », que se passe-t-il ?
                choix:
                    -   id: a
                        texte: 'Le contact n’est testé qu’une fois, au début : plus de faute.'
                    -   id: b
                        texte: Rien ne change.
                    -   id: c
                        texte: Le jeu plante.
                aide: Relis l’exemple expliqué.
    -   id: a03
        titre: Le saut
        transition: La faute fonctionne. Donne au cavalier le moyen de sauter.
        consigne: Tu vas programmer un saut avec la touche espace pour franchir la barre. On attend les blocs du saut et la hauteur choisie.
        contenu:
            -   type: etapes
                elements:
                    - 'Ajoute : « quand la touche espace est pressée » → monter de 60 (y), attendre 0,5 s, redescendre de 60.'
                    - 'Teste : peux-tu passer la barre en sautant ?'
                    - Ajuste la hauteur si besoin.
            -   type: paragraphe
                texte: Pourquoi attendre ? Sans pause, le cavalier monte et redescend trop vite pour passer.
        questions:
            -   id: q01
                type: texte
                enonce: Écris les trois blocs de ton saut et la hauteur qui marche.
                aide: 'Bloc par bloc : quand ? quelle condition ? quelle action ?'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Ajoute une deuxième barre plus haute.
        questions:
            -   id: q01
                type: texte
                enonce: Que faut-il changer pour pouvoir la passer ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton jeu réagit aux contacts. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment faire réagir un programme quand deux lutins se touchent ?'
                aide: Reprends les mots du problème.
retenir:
    - '« touche le lutin… ? » : vrai ou faux.'
    - 'Tester en permanence : répéter indéfiniment + si.'
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
