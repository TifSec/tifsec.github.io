titre: 'Séance 11 : Que dois-je savoir sur une race de chevaux ?'
themes:
    - Objectif 3 — Répondre à un besoin d’information, analyser sa qualité et communiquer
problematique: Comment préparer une recherche d’informations avant de chercher sur internet ?
competences_bo:
    - Objectif 3 — Répondre à un besoin d’information, analyser sa qualité et communiquer
objectifs:
    connaissances:
        - 'Avant de chercher, on définit son besoin : ce qu’on veut savoir, sous forme de questions.'
        - Une carte mentale range les idées autour d’un sujet.
    competences:
        - Formuler ses questions de recherche.
        - Organiser ses idées en carte mentale.
pourquoi:
    - En séquence 2, tu as appris à vérifier une information.
    - 'Tu vas présenter une race de chevaux : avant de chercher, il faut savoir quoi chercher.'
activites:
    -   id: a01
        titre: Mes questions
        consigne: Tu vas choisir une race de chevaux et écrire les questions auxquelles ta recherche devra répondre. On attend la race et trois questions.
        contenu:
            -   type: etapes
                elements:
                    - Choisis une race (Selle Français, Camargue, Shetland, Frison…).
                    - Écris ce que tu veux savoir sous forme de questions.
                    - Garde les questions utiles pour présenter la race.
            -   type: paragraphe
                texte: 'Pourquoi des questions ? Elles évitent de se perdre sur internet : on cherche des réponses précises.'
        questions:
            -   id: q01
                type: texte
                enonce: Écris la race choisie et trois questions que tu te poses à son sujet.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a02
        titre: La carte mentale
        transition: Tes questions sont prêtes. Range-les.
        consigne: Tu vas organiser tes questions dans une carte mentale à quatre branches. On attend ce que tu chercheras dans trois branches.
        contenu:
            -   type: etapes
                elements:
                    - Écris la race au centre.
                    - 'Autour, mets une branche par thème : origine, taille et robe, caractère, utilisations.'
                    - Range tes questions dans les branches.
            -   type: paragraphe
                texte: Pourquoi une carte mentale ? Elle montre d’un coup d’œil ce qu’il reste à chercher.
        questions:
            -   id: q01
                type: tableau
                enonce: Complète les branches de ta carte mentale.
                colonnes:
                    - Branche
                    - Ce que je vais chercher
                lignes:
                    -   - Origine
                        - ''
                    -   - Taille et robe
                        - ''
                    -   - Utilisations
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a03
        titre: Les mots-clés
        transition: Ta carte est prête. Prépare tes mots-clés.
        consigne: Tu vas transformer une question en mots-clés pour un moteur de recherche. On attend les mots-clés à taper.
        contenu:
            -   type: etapes
                elements:
                    - Pour une question, garde seulement les mots importants.
                    - Enlève les petits mots (le, de, est-ce que…).
                    - Écris les mots-clés à taper.
            -   type: paragraphe
                texte: Pourquoi des mots-clés ? Un moteur de recherche comprend mieux trois mots précis qu’une longue phrase.
        questions:
            -   id: q01
                type: texte
                enonce: Transforme la question « Quelle est la taille d’un poney Shetland ? » en mots-clés.
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Les moteurs de recherche proposent la recherche avancée.
        questions:
            -   id: q01
                type: texte
                enonce: Que permettent les guillemets autour de « selle français » ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ta recherche est préparée. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment préparer une recherche d’informations avant de chercher sur internet ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Avant de chercher : mes questions, ma carte mentale, mes mots-clés.'
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
