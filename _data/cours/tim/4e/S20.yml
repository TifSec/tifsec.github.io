titre: 'Séance 20 : Recadrer et améliorer une photo pour le site du club'
themes:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
problematique: Comment retoucher une photo pour qu’elle mette en valeur le sujet ?
competences_bo:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
objectifs:
    connaissances:
        - Recadrer, c’est couper les bords inutiles pour centrer le sujet.
        - On peut corriger la luminosité et le contraste sans changer ce que montre la photo.
    competences:
        - Recadrer une photo.
        - Corriger la luminosité sans tromper.
pourquoi:
    - En S19, tu as allégé une photo.
    - 'Le club veut une belle photo de la jument Princesse pour son site : elle est trop loin et un peu sombre.'
activites:
    -   id: a01
        titre: Où recadrer ?
        consigne: Tu vas décider comment recadrer la photo de Princesse décrite dans le document 1. On attend ce que tu enlèves et pourquoi.
        contenu:
            -   type: paragraphe
                texte: 'Document 1 — Photo : la jument Princesse est au centre mais petite. À gauche, une poubelle ; en haut, un grand ciel blanc ; à droite, la barrière du pré.'
            -   type: etapes
                elements:
                    - Regarde la description de la photo (document 1).
                    - Repère ce qui est utile (le sujet) et ce qui gêne.
                    - Décide ce que tu enlèves.
            -   type: paragraphe
                texte: Pourquoi recadrer ? Le regard va tout de suite au sujet quand les éléments inutiles disparaissent.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, que vas-tu enlever en recadrant, et pourquoi ?
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
    -   id: a02
        titre: Recadrer et éclaircir
        transition: Tu sais quoi enlever. Passe à la retouche.
        consigne: Tu vas recadrer et éclaircir la photo de Princesse, puis l’exporter pour le site. On attend les outils utilisés et l’effet sur le poids.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre la photo fournie dans le logiciel d’image.
                    - 'Utilise l’outil Recadrer : garde la jument et un peu de pré.'
                    - 'Couleurs > Luminosité-Contraste : éclaircis légèrement.'
                    - Exporte sous princesse_site.jpg.
            -   type: paragraphe
                texte: Pourquoi « légèrement » ? Trop de retouche donne une image artificielle.
        questions:
            -   id: q01
                type: texte
                enonce: Écris les deux outils utilisés et le réglage choisi pour la luminosité.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
            -   id: q02
                type: qcm
                enonce: Après recadrage, la photo est-elle plus lourde ou plus légère ?
                choix:
                    -   id: a
                        texte: 'Plus légère : il y a moins de pixels.'
                    -   id: b
                        texte: Plus lourde.
                    -   id: c
                        texte: Pareil.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a03
        titre: Retoucher sans tromper
        transition: Ta photo est prête. Où est la limite de la retouche ?
        consigne: Tu vas juger trois retouches de photos de chevaux (document 2). On attend la retouche malhonnête et la raison.
        contenu:
            -   type: liste
                elements:
                    - Éclaircir une photo prise par temps gris.
                    - Recadrer pour centrer le cheval.
                    - Effacer une cicatrice sur la jambe d’un cheval mis en vente.
            -   type: etapes
                elements:
                    - Lis les deux retouches du document 2.
                    - 'Pour chacune, demande-toi : la photo dit-elle encore la vérité ?'
                    - Réponds.
            -   type: paragraphe
                texte: Pourquoi cette limite ? Une photo d’annonce qui cache un défaut du cheval trompe l’acheteur.
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 2, quelle retouche est malhonnête ?
                choix:
                    -   id: a
                        texte: Effacer une cicatrice sur la jambe d’un cheval à vendre.
                    -   id: b
                        texte: Éclaircir une photo sombre.
                    -   id: c
                        texte: Recadrer pour centrer le cheval.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Explique pourquoi cette retouche est malhonnête.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le cadrage suit souvent la « règle des tiers ».
        questions:
            -   id: q01
                type: texte
                enonce: Où place-t-on le sujet avec cette règle ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ta photo met la jument en valeur. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment retoucher une photo pour qu’elle mette en valeur le sujet ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Recadrer pour centrer le sujet ; corriger la luminosité légèrement.
    - Une retouche ne doit pas tromper.
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
