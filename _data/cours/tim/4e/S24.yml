titre: 'Séance 24 : Faire avancer un cavalier dans Scratch'
themes:
    - Objectif 5 — Découvrir l’analyse et le codage
problematique: Comment programmer les déplacements d’un personnage avec des blocs ?
competences_bo:
    - Objectif 5 — Découvrir l’analyse et le codage
objectifs:
    connaissances:
        - Scratch se programme avec des blocs qui s’emboîtent ; un programme démarre par un événement (« quand le drapeau vert est cliqué »).
        - Un lutin se déplace sur une scène repérée par x (horizontal) et y (vertical).
    competences:
        - Créer un lutin et le déplacer.
        - Utiliser un événement et des touches.
pourquoi:
    - En S23, tu as écrit des algorithmes sur papier.
    - 'Aujourd’hui, tu les traduis en blocs : un cavalier qui avance sur un parcours.'
activites:
    -   id: a01
        titre: Découvrir Scratch
        consigne: Tu vas découvrir l’éditeur Scratch et écrire un premier programme de deux blocs. On attend le bloc de départ et ce que fait le lutin.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre l’éditeur Scratch (lien ci-dessous), sans créer de compte.
                    - 'Repère : la scène, les lutins, les catégories de blocs.'
                    - Glisse « quand le drapeau vert est cliqué » puis « avancer de 10 pas ».
                    - Clique sur le drapeau vert.
                    - Pourquoi un événement ? Le programme doit savoir quand démarrer.
        questions:
            -   id: q01
                type: qcm
                enonce: Quel bloc fait démarrer ton programme ?
                choix:
                    -   id: a
                        texte: « quand le drapeau vert est cliqué »
                    -   id: b
                        texte: « avancer de 10 pas »
                    -   id: c
                        texte: « dire Bonjour »
                aide: Cherche le bloc jaune en forme de chapeau qui contient le drapeau vert.
            -   id: q02
                type: texte
                enonce: Que fait le lutin quand tu cliques sur le drapeau vert ?
                aide: 'Clique sur le drapeau et regarde le lutin : dans quelle direction bouge-t-il, et de combien ?'
        ressources:
            -   type: lien
                titre: Scratch — programmer en ligne (sans créer de compte)
                url: https://scratch.mit.edu/projects/editor/
    -   id: a02
        titre: Le cavalier au clavier
        transition: Tu sais lancer un programme. Pilote maintenant le cavalier au clavier.
        consigne: Tu vas programmer le déplacement du cavalier avec les quatre flèches du clavier. On attend le bloc de chaque flèche.
        contenu:
            -   type: etapes
                elements:
                    - Choisis ou dessine un lutin cavalier (ou cheval).
                    - Ajoute « quand la touche flèche droite est pressée » + « ajouter 10 à x ».
                    - Fais de même pour les flèches gauche, haut et bas (x ou y).
                    - Teste chaque flèche.
                    - 'Pourquoi x et y ? x change la position de gauche à droite, y de bas en haut : c’est un repère comme en maths.'
        questions:
            -   id: q01
                type: tableau
                enonce: Complète le bloc à utiliser pour chaque flèche.
                colonnes:
                    - Flèche
                    - Bloc
                lignes:
                    -   - Droite
                        - ajouter 10 à x
                    -   - Gauche
                        - ''
                    -   - Haut
                        - ''
                    -   - Bas
                        - ''
                aide: x change quand on va à gauche ou à droite, y quand on monte ou descend. Pour aller dans l’autre sens, on ajoute un nombre négatif.
    -   id: a03
        titre: Le point de départ
        transition: Le cavalier bouge. Il doit repartir du même endroit à chaque partie.
        consigne: Tu vas placer le cavalier à un point de départ fixe à chaque partie. On attend la position de départ et le rôle du bloc.
        contenu:
            -   type: etapes
                elements:
                    - 'Ajoute sous le drapeau vert : « aller à x : -200 y : 0 ».'
                    - 'Clique sur le drapeau : le cavalier revient au départ.'
                    - Enregistre ton projet sur l’ordinateur (Fichier > Sauvegarder sur ton ordinateur).
                    - Pourquoi un point de départ ? À chaque partie, le jeu doit recommencer au même endroit.
        questions:
            -   id: q01
                type: texte
                enonce: Où se trouve le cavalier au départ (x et y), et à quoi sert ce bloc ?
                aide: 'Lis les valeurs du bloc « aller à x : … y : … » sous le drapeau vert. Que se passe-t-il à chaque nouvelle partie ?'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le cavalier regarde toujours à droite.
        questions:
            -   id: q01
                type: texte
                enonce: Comment le faire se tourner vers la gauche quand il va à gauche ?
                aide: Cherche dans la catégorie Mouvement le bloc qui oriente le lutin, et la direction qui correspond à la gauche.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton cavalier se déplace. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment programmer les déplacements d’un personnage avec des blocs ?'
                aide: Explique ce qui déclenche le mouvement (un événement) et ce que changent les blocs (x et y), puis le rôle du point de départ.
retenir:
    - Un programme commence par un événement.
    - 'x : gauche-droite ; y : bas-haut.'
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
