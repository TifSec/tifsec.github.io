titre: 'Séance 26 : Le score et le chrono : les variables'
themes:
    - Objectif 5 — Découvrir l’analyse et le codage
problematique: Comment un programme peut-il mémoriser et faire évoluer un nombre ?
competences_bo:
    - Objectif 5 — Découvrir l’analyse et le codage
objectifs:
    connaissances:
        - Une variable est une boîte qui porte un nom et contient une valeur qui peut changer.
        - On l’initialise au départ (mettre à 0), puis on la modifie (ajouter 1).
    competences:
        - Créer et initialiser une variable.
        - Faire évoluer une variable.
pourquoi:
    - En S25, ton cavalier saute et fait des fautes.
    - Comme en concours, il faut compter les points de pénalité et le temps.
activites:
    -   id: a01
        titre: Une variable « pénalités »
        consigne: Tu vas créer une variable qui compte les pénalités, comme en concours de saut (4 points par faute). On attend sa valeur après 3 fautes et le rôle de l’initialisation.
        contenu:
            -   type: etapes
                elements:
                    - 'Catégorie Variables > Créer une variable : « pénalités ».'
                    - Sous le drapeau vert, ajoute « mettre pénalités à 0 ».
                    - Dans le « si touche la barre », ajoute « ajouter 4 à pénalités ».
                    - 'Teste : la valeur s’affiche sur la scène.'
            -   type: paragraphe
                texte: Pourquoi mettre à 0 au départ ? Sinon, la partie suivante commence avec les pénalités de la précédente.
        questions:
            -   id: q01
                type: nombre
                enonce: Le cavalier touche la barre 3 fois. Combien vaut « pénalités » ?
                unite: points
                aide: N’oublie pas l’unité.
            -   id: q02
                type: texte
                enonce: Pourquoi faut-il « mettre pénalités à 0 » sous le drapeau vert ?
                aide: Pense à « car ».
    -   id: a02
        titre: Le chrono
        transition: Les pénalités se comptent. Mesure maintenant le temps.
        consigne: Tu vas ajouter un chronomètre et une ligne d’arrivée à ton parcours. On attend ton temps et tes pénalités, avec les unités.
        contenu:
            -   type: citation
                texte: 'Réflexe DNB M5 : j’écris l’unité : secondes (s), points.'
            -   type: etapes
                elements:
                    - Sous le drapeau vert, ajoute « réinitialiser le chronomètre ».
                    - Ajoute une ligne d’arrivée (lutin) à droite.
                    - 'Quand le cavalier la touche : « dire (regrouper « Temps : » et chronomètre) » puis « stop tout ».'
                    - Fais un parcours.
            -   type: paragraphe
                texte: Pourquoi un chronomètre ? Au concours, on départage les cavaliers sans faute au temps.
        questions:
            -   id: q01
                type: texte
                enonce: Quel temps as-tu fait, avec combien de pénalités ?
                aide: Repère le verbe de la question.
    -   id: a03
        titre: Lire un programme
        transition: Ton jeu compte et chronomètre. Vérifie que tu sais lire une variable.
        consigne: Tu vas suivre la valeur d’une variable dans un court programme (ci-dessous), bloc par bloc. On attend la valeur finale.
        contenu:
            -   type: citation
                texte: 'Réflexe DNB M9 : je lis un programme bloc par bloc, dans l’ordre.'
            -   type: code
                texte: 'mettre score à 0

                    ajouter 10 à score

                    ajouter -3 à score'
            -   type: etapes
                elements:
                    - Lis le programme ci-dessous, bloc par bloc.
                    - Suis la valeur de la variable « score » à chaque étape.
                    - Réponds.
            -   type: paragraphe
                texte: Pourquoi suivre la variable ? C’est ainsi qu’on comprend un programme sans l’exécuter.
        questions:
            -   id: q01
                type: nombre
                enonce: Quelle est la valeur de score à la fin de ce programme ?
                aide: N’oublie pas l’unité.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: On veut un bonus si le parcours est fini en moins de 10 s.
        questions:
            -   id: q01
                type: texte
                enonce: Quel bloc ajouter à l’arrivée ?
                aide: Bloc par bloc.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton jeu a un score et un chrono. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment un programme peut-il mémoriser et faire évoluer un nombre ?'
                aide: Reprends les mots du problème.
retenir:
    - 'Variable : nom + valeur qui change.'
    - Initialiser (mettre à 0), puis modifier (ajouter).
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
