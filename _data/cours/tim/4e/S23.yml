titre: 'Séance 23 : La routine du matin à l’écurie : un algorithme'
themes:
    - Objectif 5 — Découvrir l’analyse et le codage
problematique: Comment décrire une suite d’actions précise qu’un autre peut suivre sans se tromper ?
competences_bo:
    - Objectif 5 — Découvrir l’analyse et le codage
objectifs:
    connaissances:
        - Un algorithme est une suite d’instructions précises, dans un ordre donné, pour résoudre un problème.
        - Une condition (si… alors… sinon) choisit entre deux actions ; une boucle répète des actions.
    competences:
        - Écrire un algorithme simple.
        - Repérer une condition et une boucle.
pourquoi:
    - Cette séquence te fait programmer un jeu. Avant l’ordinateur, on apprend à penser comme lui.
    - 'Exemple : la routine du matin à l’écurie.'
activites:
    -   id: a01
        titre: Remettre dans l’ordre
        consigne: Tu vas remettre dans l’ordre les actions de la routine du matin à l’écurie (document 1). On attend un numéro pour chaque action.
        contenu:
            -   type: liste
                elements:
                    - Distribuer le foin
                    - Entrer dans l’écurie
                    - Vérifier l’abreuvoir
                    - Noter les soins dans le cahier
                    - Saluer et observer chaque poney
            -   type: etapes
                elements:
                    - Lis les actions de la routine (document 1), dans le désordre.
                    - Demande-toi ce qui doit être fait avant quoi.
                    - Numérote-les de 1 à 5.
            -   type: paragraphe
                texte: 'Pourquoi l’ordre compte ? Un ordinateur exécute exactement dans l’ordre : une erreur d’ordre donne un résultat faux.'
        questions:
            -   id: q01
                type: tableau
                enonce: Remets la routine du matin dans l’ordre (1 à 5).
                colonnes:
                    - Action
                    - Ordre
                lignes:
                    -   - Distribuer le foin
                        - ''
                    -   - Entrer dans l’écurie
                        - ''
                    -   - Vérifier l’abreuvoir
                        - ''
                    -   - Noter les soins dans le cahier
                        - ''
                    -   - Saluer et observer chaque poney
                        - ''
                aide: Ligne × colonne.
    -   id: a02
        titre: La condition
        transition: L’ordre est fixé. Certaines actions dépendent de la situation.
        consigne: Tu vas appliquer l’algorithme de l’abreuvoir (ci-dessous) à deux situations. On attend l’action du palefrenier dans chaque cas.
        contenu:
            -   type: code
                texte: "si l’abreuvoir est vide alors\n    remplir l’abreuvoir\nsinon\n    passer au box suivant"
            -   type: etapes
                elements:
                    - Lis l’algorithme de l’abreuvoir.
                    - Repère le « si » et le « sinon ».
                    - Applique-le à chaque cas.
            -   type: paragraphe
                texte: 'Pourquoi une condition ? L’action dépend de la situation : on ne remplit pas un abreuvoir déjà plein.'
        questions:
            -   id: q01
                type: tableau
                enonce: D’après l’algorithme, que fait le palefrenier ?
                colonnes:
                    - Situation
                    - Action
                lignes:
                    -   - L’abreuvoir est vide
                        - ''
                    -   - L’abreuvoir est plein
                        - ''
                aide: Ligne × colonne.
    -   id: a03
        titre: La boucle
        transition: Tu sais lire une condition. Découvre la répétition.
        consigne: Tu vas lire un algorithme avec une boucle « répéter » pour les 8 boxes de l’écurie. On attend le nombre de rations distribuées et l’intérêt de la boucle.
        contenu:
            -   type: code
                texte: "répéter 8 fois\n    donner 2 rations de foin\n    passer au box suivant"
            -   type: etapes
                elements:
                    - 'Il y a 8 boxes : on répète les mêmes actions 8 fois.'
                    - Lis l’algorithme avec « répéter ».
                    - Compte combien de fois chaque action est faite.
            -   type: paragraphe
                texte: 'Pourquoi une boucle ? Écrire 8 fois la même chose est long : « répéter 8 fois » est plus court et plus sûr.'
        questions:
            -   id: q01
                type: nombre
                enonce: Combien de rations de foin le palefrenier distribue-t-il avec cet algorithme ?
                unite: rations
                aide: N’oublie pas l’unité.
            -   id: q02
                type: texte
                enonce: Pourquoi utiliser « répéter 8 fois » plutôt qu’écrire 8 fois les actions ?
                aide: Pense à « car ».
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Écris un algorithme qui ne donne une carotte qu’aux poneys qui ont bien travaillé, pour les 8 boxes.
        questions:
            -   id: q01
                type: texte
                enonce: Utilise « répéter » et « si ».
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as écrit des algorithmes. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment décrire une suite d’actions précise qu’un autre peut suivre sans se tromper ?'
                aide: Reprends les mots du problème.
retenir:
    - Algorithme = instructions précises dans l’ordre.
    - 'Condition : si… alors… sinon ; boucle : répéter.'
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
