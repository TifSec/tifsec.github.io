titre: 'Séance 6 : Comment protéger mon compte et mon mot de passe ?'
themes:
    - Objectif 4 — Adopter une attitude responsable dans une société démocratique
problematique: Comment créer un mot de passe solide et protéger ses comptes ?
competences_bo:
    - Objectif 4 — Adopter une attitude responsable dans une société démocratique
objectifs:
    connaissances:
        - Un mot de passe solide est long, difficile à deviner, et différent pour chaque compte.
        - Personne n’a à connaître ton mot de passe, même un ami.
    competences:
        - Reconnaître un mot de passe faible.
        - Construire un mot de passe solide avec la méthode des phrases.
pourquoi:
    - En séquence 1, tu as travaillé sur tes fichiers. Ils sont protégés par ton compte.
    - Aujourd’hui, tu apprends à bien protéger ce compte.
activites:
    -   id: a01
        titre: Faible ou solide ?
        consigne: Tu vas juger la solidité de trois mots de passe, avec l’exemple expliqué. On attend « solide » ou « faible » pour chacun.
        contenu:
            -   type: citation
                texte: 'Réflexe DNB M1 : je repère le verbe de la consigne (cite, explique, écris…) avant de répondre.'
            -   type: etapes
                elements:
                    - 'Lis le réflexe M1 : repère le verbe de la consigne.'
                    - 'Lis l’exemple : « eclair2012 » est faible (un nom de poney et une date).'
                    - Pour chaque mot de passe, regarde sa longueur et s’il se devine.
            -   type: paragraphe
                texte: Pourquoi « devinable » est-il dangereux ? Les pirates essaient d’abord les noms d’animaux, les prénoms et les dates.
        questions:
            -   id: q01
                type: tableau
                enonce: Pour chaque mot de passe, écris « solide » ou « faible ».
                colonnes:
                    - Mot de passe
                    - Solide ou faible ?
                lignes:
                    -   - princesse
                        - ''
                    -   - '123456'
                        - ''
                    -   - Mon-Poney-Saute-3-Barres!
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: La méthode des phrases
        transition: Tu sais reconnaître un mot de passe faible. Fabrique un mot de passe solide.
        consigne: Tu vas fabriquer un mot de passe solide à partir d’une phrase inventée. On attend la phrase et le mot de passe obtenu, jamais ton vrai mot de passe.
        contenu:
            -   type: etapes
                elements:
                    - Invente une phrase que tu retiendras (pas un vrai mot de passe !).
                    - Garde la première lettre de chaque mot, les chiffres et la ponctuation.
                    - 'Vérifie : au moins 12 caractères.'
            -   type: paragraphe
                texte: Pourquoi une phrase ? Elle est facile à retenir pour toi et très difficile à deviner pour les autres.
        questions:
            -   id: q01
                type: texte
                enonce: Écris une phrase inventée et le mot de passe obtenu avec la méthode (jamais ton vrai mot de passe).
                aide: Une idée réaliste + « Cela permet de… ».
    -   id: a03
        titre: Les bons réflexes
        transition: Ton mot de passe est solide. Garde-le pour toi.
        consigne: Tu vas analyser la situation de Noa, qui prête son mot de passe. On attend une explication du danger, rédigée avec le réflexe M3.
        contenu:
            -   type: citation
                texte: 'Réflexe DNB M3 : je réponds par une phrase qui reprend les mots de la question.'
            -   type: etapes
                elements:
                    - Lis la situation de Noa.
                    - Repère ce qui est dangereux.
                    - Réponds par une phrase qui reprend la question (réflexe M3).
            -   type: paragraphe
                texte: Pourquoi des réflexes ? Un bon mot de passe ne sert à rien s’il est prêté ou écrit sur un post-it.
        questions:
            -   id: q01
                type: texte
                enonce: Noa prête son mot de passe à un ami « juste pour une minute ». Explique pourquoi c’est dangereux.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Certains sites proposent la double authentification.
        questions:
            -   id: q01
                type: texte
                enonce: Explique ce qu’elle ajoute à un mot de passe.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais protéger ton compte. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment créer un mot de passe solide et protéger ses comptes ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Mot de passe : long, non devinable, un par compte, jamais prêté.'
    - Méthode des phrases.
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
