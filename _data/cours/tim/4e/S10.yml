titre: 'Séance 10 : Bilan : mes règles du numérique'
themes:
    - Objectif 4 — Adopter une attitude responsable dans une société démocratique
problematique: Quelles règles adopter pour utiliser le numérique sans danger ?
competences_bo:
    - Objectif 4 — Adopter une attitude responsable dans une société démocratique
objectifs:
    connaissances:
        - Protéger ses comptes, limiter ses traces, respecter les droits des autres, vérifier les informations.
    competences:
        - Réutiliser les règles de la séquence 2.
        - Relire ses réponses (réflexe M8).
pourquoi:
    - Depuis S06, tu as vu les mots de passe, les traces, le droit à l’image et les fausses informations.
    - Aujourd’hui, tu rassembles tout dans une charte de classe.
activites:
    -   id: a01
        titre: Une situation, une règle
        consigne: Tu vas associer trois situations de la vie numérique à la bonne règle, vue entre S06 et S09. On attend une règle par situation.
        contenu:
            -   type: etapes
                elements:
                    - Lis chaque situation.
                    - Retrouve la séance où on en a parlé (S06 à S09).
                    - Écris la règle à appliquer.
            -   type: paragraphe
                texte: Pourquoi revenir sur les séances ? Une règle comprise sur un exemple se retient mieux.
        questions:
            -   id: q01
                type: tableau
                enonce: Pour chaque situation, écris la règle à appliquer.
                colonnes:
                    - Situation
                    - Règle
                lignes:
                    -   - Un ami veut ton mot de passe
                        - ''
                    -   - Tu veux publier la photo d’un camarade
                        - ''
                    -   - Un message dit « Partagez vite ! »
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: Notre charte
        transition: Tu as retrouvé les règles. Écris-les pour toute la classe.
        consigne: Tu vas proposer deux règles pour la charte numérique de la classe. On attend deux règles, chacune avec sa raison.
        contenu:
            -   type: etapes
                elements:
                    - Propose deux règles pour la charte de la classe.
                    - Écris-les en commençant par un verbe (« Je… »).
                    - Ajoute à chaque règle sa raison.
            -   type: paragraphe
                texte: Pourquoi une charte ? Écrire les règles ensemble les rend plus faciles à respecter.
        questions:
            -   id: q01
                type: texte
                enonce: Écris deux règles pour la charte numérique de la classe, chacune avec sa raison.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a03
        titre: Je relis (M8)
        transition: Ta charte est écrite. Relis-toi.
        consigne: Tu vas relire tes réponses avec le réflexe M8 et en corriger une. On attend la description de ta correction.
        contenu:
            -   type: citation
                texte: 'Réflexe DNB M8 : je relis : ai-je répondu à la question ? ai-je donné la raison ?'
            -   type: etapes
                elements:
                    - Lis le réflexe M8.
                    - Relis tes réponses des missions 1 et 2.
                    - Corrige une réponse incomplète.
            -   type: paragraphe
                texte: 'Pourquoi relire ? On oublie souvent un mot ou une raison : la relecture rattrape ces erreurs.'
        questions:
            -   id: q01
                type: texte
                enonce: En relisant tes réponses, qu’as-tu corrigé ou complété ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un jeu en ligne demande ton adresse et ton numéro de téléphone pour « gagner un cadeau ».
        questions:
            -   id: q01
                type: texte
                enonce: Que fais-tu ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ta charte est prête. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quelles règles adopter pour utiliser le numérique sans danger ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Protéger ses comptes ; limiter ses traces ; respecter l’image et l’auteur ; vérifier avant de partager.
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
