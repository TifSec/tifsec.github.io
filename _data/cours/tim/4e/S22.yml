titre: 'Séance 22 : Présenter l’écurie à l’oral'
themes:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
problematique: Comment présenter un diaporama à l’oral de façon claire et vivante ?
competences_bo:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
objectifs:
    connaissances:
        - À l’oral, on regarde le public, on parle lentement, on ne lit pas l’écran.
        - Une transition simple suffit ; les animations trop nombreuses distraient.
    competences:
        - Finaliser un diaporama (transitions, ordre).
        - Présenter à l’oral en suivant une grille.
pourquoi:
    - En S21, tu as créé le diaporama de l’écurie.
    - Aujourd’hui, tu le termines et tu le présentes à un camarade.
activites:
    -   id: a01
        titre: Finaliser
        consigne: Tu vas terminer ton diaporama de l’écurie (conclusion, transitions) et le lancer. On attend ta phrase-clé, la transition et la touche de lancement.
        contenu:
            -   type: etapes
                elements:
                    - Ajoute une diapositive « Conclusion » avec une phrase-clé.
                    - Applique la même transition simple à toutes les diapositives.
                    - Lance le diaporama (F5) et vérifie l’ordre.
            -   type: paragraphe
                texte: Pourquoi la même transition ? Des effets différents à chaque diapositive fatiguent et distraient le public.
        questions:
            -   id: q01
                type: texte
                enonce: Écris la phrase-clé de ta conclusion et la transition choisie.
                aide: Combien d’éléments sont demandés ?
            -   id: q02
                type: qcm
                enonce: Quelle touche lance le diaporama depuis le début ?
                choix:
                    -   id: a
                        texte: F5
                    -   id: b
                        texte: Échap
                    -   id: c
                        texte: Ctrl + S
                aide: Relis l’exemple expliqué.
    -   id: a02
        titre: Préparer l’oral
        transition: Ton diaporama est prêt. Prépare ce que tu vas dire.
        consigne: Tu vas préparer ce que tu diras pour chaque diapositive, en suivant la grille d’oral (document 1). On attend ta phrase pour une diapositive.
        contenu:
            -   type: tableau
                titre: Document 1 — Grille d’oral
                colonnes:
                    - Critère
                    - Oui / Non
                lignes:
                    -   - Je regarde le public
                        - ''
                    -   - Je parle fort et lentement
                        - ''
                    -   - Je ne lis pas l’écran
                        - ''
                    -   - Je respecte 2 minutes
                        - ''
            -   type: etapes
                elements:
                    - Lis la grille d’oral (document 1).
                    - Pour chaque diapositive, prépare une phrase à dire (pas à lire).
                    - Entraîne-toi une fois à voix basse, en moins de 2 minutes.
            -   type: paragraphe
                texte: Pourquoi préparer ? Savoir quoi dire évite de lire l’écran et rassure.
        questions:
            -   id: q01
                type: texte
                enonce: Écris la phrase que tu diras pour ta diapositive « Nos poneys ».
                aide: Combien d’éléments sont demandés ?
    -   id: a03
        titre: Présenter et s’évaluer
        transition: Tu sais quoi dire. Présente.
        consigne: Tu vas présenter ton diaporama à un camarade qui remplit la grille d’oral. On attend un critère réussi et un critère à améliorer.
        contenu:
            -   type: etapes
                elements:
                    - Présente ton diaporama à un camarade.
                    - Il remplit la grille du document 1.
                    - Lis sa grille et choisis un point à améliorer.
            -   type: paragraphe
                texte: 'Pourquoi l’avis d’un camarade ? On ne se voit pas parler : un regard extérieur aide à progresser.'
        questions:
            -   id: q01
                type: texte
                enonce: Quel critère de la grille as-tu réussi, et lequel dois-tu améliorer ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: On peut exporter un diaporama en PDF.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi l’envoyer en PDF au directeur ?
                aide: Pense à « car ».
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as présenté l’écurie. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment présenter un diaporama à l’oral de façon claire et vivante ?'
                aide: Reprends les mots du problème.
retenir:
    - 'Oral : regarder, parler lentement, ne pas lire.'
    - Transitions simples ; F5 pour lancer.
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
