titre: 'Séance 13 : Ce site est-il fiable ?'
themes:
    - Objectif 3 — Répondre à un besoin d’information, analyser sa qualité et communiquer
problematique: Comment savoir si un site internet est une source fiable ?
competences_bo:
    - Objectif 3 — Répondre à un besoin d’information, analyser sa qualité et communiquer
objectifs:
    connaissances:
        - Un site fiable dit qui l’écrit, quand, et dans quel but ; il ne cherche pas seulement à vendre.
        - Justifier, c’est donner un fait précis après « car » (réflexe M4).
    competences:
        - Évaluer un site avec une grille.
        - Justifier avec « car » et un fait.
pourquoi:
    - En S12, tu as choisi des résultats sérieux.
    - Aujourd’hui, tu apprends à juger un site entier avec une grille.
activites:
    -   id: a01
        titre: La grille de fiabilité
        consigne: Tu vas évaluer le site A sur l’alimentation du cheval avec une grille de fiabilité (document 1). On attend la grille remplie.
        contenu:
            -   type: tableau
                titre: Document 1 — Deux sites sur l’alimentation du cheval (présentation simplifiée)
                colonnes:
                    - ''
                    - Site A
                    - Site B
                lignes:
                    -   - Qui publie
                        - IFCE, institut public
                        - Pseudo « CavalierFou »
                    -   - Date
                        - Mise à jour 2025
                        - Aucune
                    -   - But
                        - Informer
                        - Vendre des compléments alimentaires
            -   type: etapes
                elements:
                    - 'Lis la grille : auteur, date, but, sources.'
                    - Lis la présentation des deux sites (document 1).
                    - Remplis la grille pour le site A.
                    - Pourquoi une grille ? Elle oblige à regarder tous les indices, pas seulement l’apparence du site.
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, remplis la grille pour le site A.
                colonnes:
                    - Critère
                    - Site A
                lignes:
                    -   - Auteur connu ?
                        - ''
                    -   - Date ?
                        - ''
                    -   - But du site
                        - ''
                aide: Dans le document 1, cherche pour le site A qui l’a écrit, quand il a été mis à jour, et s’il veut informer ou vendre.
    -   id: a02
        titre: Justifier avec « car »
        transition: Tu sais remplir la grille. Compare les deux sites.
        consigne: Tu vas comparer les deux sites du document 1 et justifier lequel est le plus fiable (réflexe M4). On attend un choix justifié par un fait.
        contenu:
            -   type: citation
                texte: 'Réflexe DNB M4 : je justifie avec « car » et un fait précis tiré du document.'
            -   type: etapes
                elements:
                    - Lis le réflexe M4.
                    - Compare les sites A et B.
                    - Écris ta conclusion avec « car » et un fait du document 1.
                    - 'Pourquoi « car » ? Sans raison, une réponse ne prouve rien : au DNB comme au travail, on justifie.'
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, quel site est le plus fiable ? Justifie avec « car » et un fait précis.
                aide: Compare les deux sites avec la grille, puis justifie avec « car » et un fait précis du document 1 (auteur ou date).
    -   id: a03
        titre: Le site de ma race
        transition: Tu sais juger deux sites. Juge le tien.
        consigne: Tu vas appliquer la grille de fiabilité au site trouvé pour ta race en S12. On attend une conclusion justifiée par deux critères.
        contenu:
            -   type: etapes
                elements:
                    - Reprends le site que tu as utilisé en S12.
                    - 'Applique la grille : auteur, date, but.'
                    - 'Conclus : est-il fiable ?'
                    - Pourquoi revenir à ta recherche ? Appliquer la grille sur un vrai site, c’est vérifier que la méthode marche.
        questions:
            -   id: q01
                type: texte
                enonce: Le site utilisé pour ta race en S12 est-il fiable ? Justifie avec la grille.
                aide: 'Applique la grille au site que tu as utilisé en S12 : auteur, date, but. Conclus.'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Wikipédia est écrite par des bénévoles.
        questions:
            -   id: q01
                type: texte
                enonce: Comment savoir si une information de Wikipédia est sérieuse ?
                aide: 'En bas d’un article Wikipédia, il y a une liste numérotée : qu’est-ce qu’elle contient ?'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais juger un site. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment savoir si un site internet est une source fiable ?'
                aide: 'Cite les critères de la grille (auteur, date, but, sources) et la méthode : comparer et justifier.'
retenir:
    - 'Fiabilité : auteur, date, but, sources.'
    - 'Réflexe M4 : « car » + un fait précis.'
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
