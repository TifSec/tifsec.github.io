titre: 'Séance 9 : Vrai ou faux : cette info sur les chevaux est-elle fiable ?'
themes:
    - Objectif 3 — Répondre à un besoin d’information, analyser sa qualité et communiquer
problematique: Comment vérifier qu’une information trouvée en ligne est fiable ?
competences_bo:
    - Objectif 3 — Répondre à un besoin d’information, analyser sa qualité et communiquer
objectifs:
    connaissances:
        - Une information fiable a un auteur connu, une date, et se retrouve dans d’autres sources sérieuses.
        - Les messages qui cherchent à faire peur ou à faire partager vite sont souvent faux.
    competences:
        - Appliquer trois questions de vérification.
        - Comparer une rumeur et une source sérieuse.
pourquoi:
    - En S08, tu as vu les règles de publication.
    - Mais les informations qu’on reçoit sont-elles vraies ? Aujourd’hui, tu enquêtes.
activites:
    -   id: a01
        titre: Les trois questions
        consigne: Tu vas appliquer les trois questions de vérification à un message viral sur les chevaux (document 1, inventé). On attend une réponse par question.
        contenu:
            -   type: citation
                texte: 'Réflexe DNB M2 : je commence ma réponse par « D’après le document… ».'
            -   type: citation
                texte: Document 1 — « URGENT !!! Un nouveau virus tue les chevaux en 24 h. Les vétérinaires le cachent. Partagez à tous vos contacts ! »
            -   type: paragraphe
                texte: Message inventé pour l’exercice.
            -   type: etapes
                elements:
                    - Lis le message viral (document 1, inventé).
                    - 'Pose les trois questions : qui l’a écrit ? quand ? quelle source cite-t-il ?'
                    - Repère les mots qui cherchent à faire peur.
            -   type: paragraphe
                texte: Pourquoi ces trois questions ? Une information sans auteur, sans date et sans source ne peut pas être vérifiée.
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, réponds aux trois questions de vérification.
                colonnes:
                    - Question
                    - Réponse
                lignes:
                    -   - Qui l’a écrit ?
                        - ''
                    -   - Quand ?
                        - ''
                    -   - Quelle source ?
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: Comparer avec une source sérieuse
        transition: Le message n’a ni auteur, ni date, ni source. Compare-le à une vraie source.
        consigne: Tu vas comparer le message viral à un extrait d’une source sérieuse sur la santé des chevaux (document 2). On attend la source la plus fiable, justifiée par deux indices.
        contenu:
            -   type: citation
                texte: 'Document 2 — « Maladies infectieuses : en cas de fièvre ou de toux chez un cheval, isolez-le et appelez votre vétérinaire. Le réseau d’épidémiosurveillance (RESPE) publie les alertes officielles. » — IFCE, mise à jour 2025 (extrait adapté).'
            -   type: lien
                titre: IFCE — Équipédia (fiches techniques sur le cheval)
                url: https://equipedia.ifce.fr/
            -   type: etapes
                elements:
                    - 'Lis le document 2 : un extrait du type de ce que publie l’IFCE.'
                    - Compare avec le message du document 1.
                    - Dis quelle source est la plus fiable et pourquoi.
            -   type: paragraphe
                texte: 'Pourquoi l’IFCE ? C’est l’institut public du cheval : ses fiches sont écrites par des spécialistes, datées et vérifiées.'
        questions:
            -   id: q01
                type: texte
                enonce: D’après les documents 1 et 2, quelle source est la plus fiable ? Justifie avec deux indices.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a03
        titre: Je partage ou pas ?
        transition: Tu as comparé les sources. Il faut décider.
        consigne: Tu vas décider si tu partages le message viral, en t’appuyant sur ton enquête. On attend une décision expliquée.
        contenu:
            -   type: etapes
                elements:
                    - Relis tes réponses des missions 1 et 2.
                    - Décide si tu partages le message viral.
                    - Explique ce que tu fais à la place.
            -   type: paragraphe
                texte: Pourquoi ne pas partager ? Partager une fausse alerte fait peur pour rien et empêche de voir les vraies alertes.
        questions:
            -   id: q01
                type: texte
                enonce: Partages-tu le message du document 1 ? Explique ce que tu fais à la place.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une photo choquante circule avec une fausse légende.
        questions:
            -   id: q01
                type: texte
                enonce: Comment vérifier d’où vient une photo ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as mené ton enquête. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment vérifier qu’une information trouvée en ligne est fiable ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Vérifier : auteur, date, source ; comparer avec une source sérieuse (IFCE).'
    - Ne pas partager une information non vérifiée.
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
