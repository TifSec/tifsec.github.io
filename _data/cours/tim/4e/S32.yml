titre: 'Séance 32 : Mon bilan de TIM en 4e'
themes:
    - Objectif 1 — S’approprier et utiliser un environnement informatique de travail
    - Objectif 2 — Créer, produire, traiter et exploiter des données
    - Objectif 3 — Répondre à un besoin d’information, analyser sa qualité et communiquer
    - Objectif 4 — Adopter une attitude responsable dans une société démocratique
    - Objectif 5 — Découvrir l’analyse et le codage
    - Objectif 6 — Appréhender les évolutions des technologies de l’informatique et du multimédia
problematique: Qu’ai-je appris en TIM cette année, et que dois-je encore travailler pour la 3e ?
competences_bo:
    - Objectif 1 — S’approprier et utiliser un environnement informatique de travail
    - Objectif 2 — Créer, produire, traiter et exploiter des données
objectifs:
    connaissances:
        - 'Les six objectifs du TIM : utiliser l’ordinateur, produire des documents, chercher l’information, être responsable, programmer, comprendre l’impact du numérique.'
    competences:
        - Faire le bilan de ses compétences.
        - Se fixer un objectif pour la 3e.
pourquoi:
    - De S01 à S31, tu as fait beaucoup de choses.
    - Aujourd’hui, tu fais ton bilan, avant la 3e et le DNB.
activites:
    -   id: a01
        titre: Ce que je sais faire
        consigne: Tu vas faire la liste de ce que tu sais faire avec Writer, Calc, Impress et Scratch. On attend une compétence précise par logiciel.
        contenu:
            -   type: etapes
                elements:
                    - Relis la liste des séquences de l’année.
                    - Pour chaque logiciel, écris une chose que tu sais faire.
                    - Sois précis.
            -   type: paragraphe
                texte: Pourquoi préciser ? « Je sais faire Calc » ne veut rien dire ; « je sais écrire une formule SOMME » oui.
        questions:
            -   id: q01
                type: tableau
                enonce: Écris une chose précise que tu sais faire avec chaque logiciel.
                colonnes:
                    - Logiciel
                    - Je sais…
                lignes:
                    -   - Writer
                        - ''
                    -   - Calc
                        - ''
                    -   - Impress
                        - ''
                    -   - Scratch
                        - ''
                aide: Ligne × colonne.
    -   id: a02
        titre: Mes réflexes DNB
        transition: Tu connais tes savoir-faire. Et tes réflexes ?
        consigne: Tu vas choisir, parmi les réflexes DNB de l’année, celui que tu maîtrises et celui à travailler. On attend deux réflexes.
        contenu:
            -   type: liste
                elements:
                    - 'M1 : repérer le verbe.'
                    - 'M2 : « D’après le document… ».'
                    - 'M3 : reprendre les mots de la question.'
                    - 'M4 : justifier avec « car ».'
                    - 'M5 : écrire l’unité.'
                    - 'M6 : croiser ligne et colonne.'
                    - 'M7 : citer sa source.'
                    - 'M8 : se relire.'
                    - 'M9 : lire un programme bloc par bloc.'
            -   type: etapes
                elements:
                    - Relis les réflexes M1 à M9 rencontrés cette année.
                    - Choisis celui que tu maîtrises et celui à travailler.
                    - Réponds.
            -   type: paragraphe
                texte: Pourquoi les réflexes ? En 3e, ils te feront gagner des points au DNB dans toutes les matières.
        questions:
            -   id: q01
                type: texte
                enonce: Quel réflexe DNB maîtrises-tu le mieux, et lequel dois-tu travailler en 3e ?
                aide: Repère le verbe de la question.
    -   id: a03
        titre: Mon objectif pour la 3e
        transition: Tu as fait le point. Regarde vers la 3e.
        consigne: Tu vas te fixer un objectif de TIM pour la 3e, en pensant à ton futur métier et à tes stages. On attend un objectif précis et sa raison.
        contenu:
            -   type: etapes
                elements:
                    - Pense à ton futur métier et à tes stages.
                    - Choisis un objectif de TIM pour la 3e.
                    - Explique avec « car ».
            -   type: paragraphe
                texte: Pourquoi un objectif ? On progresse mieux avec un but clair.
        questions:
            -   id: q01
                type: texte
                enonce: Écris ton objectif de TIM pour la 3e et pourquoi.
                aide: Pense à « car ».
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Pix certifie les compétences numériques en 3e.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle compétence Pix veux-tu améliorer ?
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton bilan est fait. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : qu’as-tu appris en TIM cette année, et que dois-tu encore travailler pour la 3e ?'
                aide: Reprends les mots du problème.
retenir:
    - 'Writer, Calc, Impress, Scratch : je sais faire des choses précises.'
    - Un objectif pour la 3e.
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
