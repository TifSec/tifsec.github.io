titre: 'Séance 15 : À quoi sert un tableur dans une écurie ?'
themes:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
problematique: Comment un tableur aide-t-il à organiser les informations d’une écurie ?
competences_bo:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
objectifs:
    connaissances:
        - 'Un tableur (Calc, Excel) range des données dans des cellules repérées par une colonne (lettre) et une ligne (numéro) : A1, B3…'
        - On lit un tableau en croisant une ligne et une colonne (réflexe M6).
    competences:
        - Se repérer dans une feuille de calcul.
        - Saisir des données dans des cellules.
pourquoi:
    - En séquence 3, tu as écrit des documents. Pour les nombres, on utilise un tableur.
    - Aujourd’hui, tu découvres Calc avec l’inventaire de la sellerie.
activites:
    -   id: a01
        titre: Lire un tableau
        consigne: Tu vas lire l’inventaire de la sellerie dans une feuille de calcul (document 1), avec le réflexe M6. On attend une quantité et l’adresse d’une cellule.
        contenu:
            -   type: citation
                texte: 'Réflexe DNB M6 : je lis un tableau en croisant une ligne et une colonne.'
            -   type: tableau
                titre: Document 1 — Inventaire de la sellerie (feuille Calc)
                colonnes:
                    - ''
                    - A
                    - B
                lignes:
                    -   - '1'
                        - Matériel
                        - Quantité
                    -   - '2'
                        - Selle
                        - '6'
                    -   - '3'
                        - Filet
                        - '8'
                    -   - '4'
                        - Tapis
                        - '10'
            -   type: paragraphe
                texte: Données fictives créées pour l’exercice.
            -   type: etapes
                elements:
                    - Lis le réflexe M6.
                    - Lis l’inventaire de la sellerie (document 1).
                    - Pour chaque question, croise la ligne et la colonne.
            -   type: paragraphe
                texte: Pourquoi croiser ? Chaque valeur est à l’intersection d’une ligne (l’objet) et d’une colonne (l’information).
        questions:
            -   id: q01
                type: nombre
                enonce: D’après le document 1, combien de filets y a-t-il dans la sellerie ?
                unite: filets
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: qcm
                enonce: D’après le document 1, dans quelle cellule se trouve le nombre de selles ?
                choix:
                    -   id: a
                        texte: B2
                    -   id: b
                        texte: A2
                    -   id: c
                        texte: B1
                aide: Élimine d’abord les réponses impossibles.
    -   id: a02
        titre: Saisir l’inventaire
        transition: Tu sais lire un tableau. Crée le tien.
        consigne: Tu vas saisir l’inventaire de la sellerie dans Calc et y ajouter une ligne. On attend le contenu de deux cellules.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Calc et enregistre sous 4e_S15_tonprenom.ods.
                    - Recopie le document 1 à partir de la cellule A1.
                    - 'Ajoute en ligne 5 : Licol, 12.'
            -   type: paragraphe
                texte: Pourquoi commencer en A1 ? Un tableau bien placé est plus facile à relire et à calculer.
        questions:
            -   id: q01
                type: texte
                enonce: Écris le contenu des cellules A5 et B5 de ta feuille.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
            -   id: q02
                type: qcm
                enonce: Comment passe-t-on à la cellule du dessous après avoir tapé une valeur ?
                choix:
                    -   id: a
                        texte: Avec la touche Entrée.
                    -   id: b
                        texte: Avec la touche Échap.
                    -   id: c
                        texte: En fermant Calc.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a03
        titre: Mettre en forme
        transition: Les données sont saisies. Rends le tableau lisible.
        consigne: Tu vas rendre ton inventaire lisible (gras, bordures, largeur de colonne). On attend deux mises en forme expliquées.
        contenu:
            -   type: etapes
                elements:
                    - Mets la ligne 1 en gras.
                    - Ajoute des bordures au tableau (bouton Bordures).
                    - Élargis la colonne A pour lire les noms en entier.
            -   type: paragraphe
                texte: Pourquoi mettre en forme ? Un tableau lisible évite les erreurs de lecture.
        questions:
            -   id: q01
                type: texte
                enonce: Décris deux mises en forme que tu as faites et à quoi elles servent.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Calc peut trier une liste.
        questions:
            -   id: q01
                type: texte
                enonce: Trie l’inventaire par ordre alphabétique. Quel menu ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu as découvert le tableur. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment un tableur aide-t-il à organiser les informations d’une écurie ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Une cellule = colonne (lettre) + ligne (numéro).
    - 'Réflexe M6 : croiser ligne et colonne.'
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
