titre: 'Séance 3 : Une invitation pour la journée portes ouvertes'
themes:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
problematique: Comment écrire une invitation claire avec un traitement de texte ?
competences_bo:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
objectifs:
    connaissances:
        - 'Une invitation donne les informations utiles : quoi, quand, où, pour qui, comment répondre.'
        - Writer (ou Word) permet d’écrire, de mettre en forme et d’enregistrer un texte.
    competences:
        - Saisir et mettre en forme un texte simple.
        - Enregistrer un document au bon endroit.
pourquoi:
    - En S02, tu as créé tes dossiers.
    - 'La MFR organise une journée portes ouvertes : tu prépares l’invitation pour les familles.'
activites:
    -   id: a01
        titre: Les informations indispensables
        consigne: Tu vas relever, dans la note du directeur ci-dessous, les informations indispensables de l’invitation. On attend quoi, quand et où.
        contenu:
            -   type: citation
                texte: 'Note du directeur : « Nous organisons notre journée portes ouvertes le samedi 14 mars, de 9 h à 16 h, à la MFR (salle polyvalente). Les familles pourront visiter l’écurie pédagogique. Réponse souhaitée par téléphone au 04 00 00 00 00. »'
            -   type: paragraphe
                texte: Données fictives créées pour l’exercice.
            -   type: etapes
                elements:
                    - Lis la note du directeur ci-dessous.
                    - 'Repère : quoi, quand, où, pour qui, comment répondre.'
                    - Range ces informations dans le tableau.
                    - 'Pourquoi trier d’abord ? Une invitation qui oublie l’heure ou le lieu ne sert à rien : on vérifie avant d’écrire.'
        questions:
            -   id: q01
                type: tableau
                enonce: D’après la note du directeur, complète les informations de l’invitation.
                colonnes:
                    - Information
                    - Réponse
                lignes:
                    -   - Quoi ?
                        - ''
                    -   - Quand ?
                        - ''
                    -   - Où ?
                        - ''
                aide: 'Relis la note du directeur et souligne : l’événement, la date avec les heures, et le lieu précis.'
    -   id: a02
        titre: Écrire dans Writer
        transition: Tu as les informations. Écris l’invitation.
        consigne: Tu vas écrire l’invitation dans Writer et l’enregistrer dans ton dossier de TIM. On attend le bon raccourci et le nom de ton fichier.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Writer (ou Word).
                    - Enregistre tout de suite dans TIM > Séquence 1 sous le nom 4e_S03_tonprenom.odt.
                    - Tape le titre « Journée portes ouvertes », puis les informations, une par ligne.
                    - Enregistre (Ctrl + S).
                    - Pourquoi enregistrer dès le début ? Si l’ordinateur s’éteint, ton travail est déjà sauvegardé.
        questions:
            -   id: q01
                type: qcm
                enonce: Quel raccourci clavier enregistre ton document Writer ?
                choix:
                    -   id: a
                        texte: Ctrl + S
                    -   id: b
                        texte: Ctrl + P
                    -   id: c
                        texte: Ctrl + Z
                aide: C’est la touche Ctrl avec la première lettre de « Sauvegarder ».
            -   id: q02
                type: texte
                enonce: Écris le nom complet de ton fichier d’invitation et le dossier où tu l’as enregistré.
                aide: Écris le nom de ton fichier en entier, avec son extension, puis le chemin du dossier où tu l’as enregistré.
    -   id: a03
        titre: Mettre en forme
        transition: Le texte est écrit. Rends-le lisible.
        consigne: Tu vas mettre en forme ton invitation (titre, date, centrage) avec les boutons de Writer. On attend le bouton ou le raccourci de trois actions.
        contenu:
            -   type: etapes
                elements:
                    - 'Sélectionne le titre : agrandis-le et mets-le en gras.'
                    - Centre le titre.
                    - Mets la date et l’heure en gras.
                    - Enregistre.
                    - 'Pourquoi mettre en forme ? Le lecteur doit voir l’essentiel en un coup d’œil : le titre et la date.'
        questions:
            -   id: q01
                type: tableau
                enonce: Associe chaque action à son bouton ou raccourci dans Writer.
                colonnes:
                    - Action
                    - Bouton ou raccourci
                lignes:
                    -   - Mettre en gras
                        - ''
                    -   - Centrer
                        - ''
                    -   - Annuler une erreur
                        - ''
                aide: 'Rappelle-toi les boutons de la barre d’outils : la lettre du gras, l’icône des lignes centrées, et le raccourci qui revient en arrière.'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une invitation peut contenir une image.
        questions:
            -   id: q01
                type: texte
                enonce: Ajoute une image de cheval libre de droits à ton invitation. Quel menu as-tu utilisé ?
                aide: Rappelle-toi le menu du haut où tu as trouvé « Image ».
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton invitation est prête. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment écrire une invitation claire avec un traitement de texte ?'
                aide: Cite les informations indispensables d’une invitation, puis ce que tu as fait dans Writer pour qu’elle soit lisible.
retenir:
    - 'Une invitation : quoi, quand, où, pour qui, comment répondre.'
    - 'Writer : enregistrer tout de suite, gras, centrer, Ctrl + Z.'
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
