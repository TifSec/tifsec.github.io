titre: Quel format choisir pour transmettre un document ?
theme: TIM — Quel format choisir pour transmettre un document ?
problematique: Quel format choisir pour transmettre un document ?
pourquoi: "Objectif de cette séance : Comprendre qu'un même contenu peut être enregistré sous différents formats."
application: choisir le format de fichier le plus adapté selon l'utilisation d'un document.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Comprendre qu'un même contenu peut être enregistré sous différents formats.
        - Différencier un fichier de travail d'un fichier destiné principalement à être consulté.
        - Comprendre que le format doit être choisi selon l'utilisation prévue.
        - Comprendre que changer uniquement l'extension d'un fichier ne transforme pas réellement son format.
        - Comprendre qu'un document transmis doit être vérifié avant son envoi.
    competences:
        - Identifier un format grâce à son extension.
        - Choisir entre ODT et PDF selon une situation.
        - Justifier le choix d'un format.
        - Créer un document destiné à une autre personne.
        - Exporter correctement un document Writer au format PDF.
        - Vérifier un fichier avant de le transmettre.
activites:
    - id: a01
      titre: Pour commencer
      contenu:
          - type: paragraphe
            texte: "Classe : 4e / 3e MFR"
          - type: paragraphe
            texte: "Durée : 50 minutes"
          - type: paragraphe
            texte: "Organisation : travail individuel"
          - type: paragraphe
            texte: "Logiciel : LibreOffice Writer"
          - type: paragraphe
            texte: "Mission : choisir le format de fichier le plus adapté selon l'utilisation d'un document."
      questions: []
    - id: a04
      titre: Production attendue
      contenu:
          - type: paragraphe
            texte: Vous allez créer une courte fiche de présentation destinée à être consultée par une autre personne.
          - type: paragraphe
            texte: "À la fin de la séance, votre dossier devra contenir :"
          - type: liste
            elements:
                - "4e3e_S05_nom_prenom.odt : votre fichier de travail ;"
                - "4e3e_S05_nom_prenom.pdf : votre version destinée à être transmise."
          - type: paragraphe
            texte: "Cette fois, le fichier à rendre sera :"
          - type: paragraphe
            texte: 4e3e_S05_nom_prenom.pdf
      questions: []
    - id: a05
      titre: 1. ODT ou PDF ? – 5 minutes
      contenu:
          - type: paragraphe
            texte: "Lors des séances précédentes, vous avez déjà rencontré deux formats :"
          - type: liste
            elements:
                - .odt ;
                - .pdf.
      questions:
          - id: q01
            type: texte
            enonce: "Question 1 : complétez le tableau."
          - id: q02
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Format
                - Extension
                - Utilisation principale
            lignes:
                - - Document Writer
                  - ""
                  - ""
                - - Document PDF
                  - ""
                  - ""
            suite:
                - type: titre
                  texte: AIDE SI BESOIN – Retrouver les deux formats
                - type: paragraphe
                  texte: "Indice 1/3 : repensez aux fichiers créés lors des séances précédentes."
                - type: paragraphe
                  texte: "Indice 2/3 : le fichier Writer possède l'extension .odt."
                - type: paragraphe
                  texte: "Indice 3/3 : ODT = document de travail facilement modifiable dans Writer ; PDF = version particulièrement adaptée à la consultation et à la transmission."
    - id: a06
      titre: 2. Choisir selon la situation – 7 minutes
      contenu:
          - type: paragraphe
            texte: Pour chaque situation, indiquez le format qui vous semble le plus adapté.
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Situation
                - ODT ou PDF ?
                - Pourquoi ?
            lignes:
                - - Vous souhaitez continuer votre rapport demain.
                  - ""
                  - ""
                - - Vous envoyez un document terminé à votre maître de stage pour qu'il le consulte.
                  - ""
                  - ""
                - - Vous transmettez un document à un camarade pour qu'il poursuive sa rédaction dans Writer.
                  - ""
                  - ""
                - - Vous déposez une version définitive destinée uniquement à être lue.
                  - ""
                  - ""
    - id: a07
      titre: 3. Peut-on convertir un fichier en changeant son nom ? – 5 minutes
      contenu:
          - type: paragraphe
            texte: "Un élève possède ce fichier :"
          - type: paragraphe
            texte: rapport_stage.odt
          - type: paragraphe
            texte: "Il le renomme ensuite :"
          - type: paragraphe
            texte: rapport_stage.pdf
      questions:
          - id: q01
            type: texte
            enonce: "Question 2 : le document est-il réellement devenu un fichier PDF ? Expliquez."
            suite:
                - type: titre
                  texte: AIDE SI BESOIN – Réfléchir à l'extension
                - type: paragraphe
                  texte: "Indice 1/3 : vous avez uniquement changé le nom."
                - type: paragraphe
                  texte: "Indice 2/3 : le contenu interne du fichier n'a pas été transformé."
                - type: paragraphe
                  texte: "Indice 3/3 : changer .odt en .pdf dans le nom ne convertit pas réellement le fichier."
    - id: a08
      titre: 4. Créer le fichier de travail – 5 minutes
      contenu:
          - type: paragraphe
            texte: "Créez le dossier :"
          - type: paragraphe
            texte: TIM > 4e3e > Travaux > S05
          - type: paragraphe
            texte: Ouvrez ensuite LibreOffice Writer.
          - type: paragraphe
            texte: "Enregistrez immédiatement le document sous le nom :"
          - type: paragraphe
            texte: 4e3e_S05_nom_prenom.odt
          - type: titre
            texte: AIDE SI BESOIN – Retrouver le bon dossier
          - type: paragraphe
            texte: "Indice 1/3 : commencez par retrouver TIM."
          - type: paragraphe
            texte: "Indice 2/3 : ouvrez TIM → 4e3e → Travaux."
          - type: paragraphe
            texte: "Indice 3/3 : créez S05 puis enregistrez votre document à l'intérieur."
      questions: []
    - id: a09
      titre: 5. Créer une fiche destinée à quelqu'un d'autre – 10 minutes
      contenu:
          - type: paragraphe
            texte: Imaginez que vous devez transmettre une courte fiche de présentation à un responsable professionnel.
          - type: paragraphe
            texte: "Votre document devra comporter :"
          - type: liste
            elements:
                - "un titre : Ma fiche de présentation ;"
                - votre prénom ;
                - votre classe ;
                - une partie Mes centres d'intérêt ;
                - une partie Ce que j'aimerais découvrir pendant un stage ;
                - une partie Une qualité que je peux apporter.
          - type: paragraphe
            texte: Présentez vos centres d'intérêt sous forme de liste à puces.
          - type: paragraphe
            texte: Pour les autres parties, rédigez une ou deux phrases.
          - type: paragraphe
            texte: "VIGILANCE : vous n'êtes pas obligé d'inscrire une information personnelle que vous ne souhaitez pas partager. Vous pouvez utiliser une information fictive pour cette activité."
      questions: []
    - id: a10
      titre: 6. Penser au destinataire – 5 minutes
      contenu:
          - type: paragraphe
            texte: Votre document n'est pas destiné uniquement à vous.
          - type: paragraphe
            texte: Relisez-le comme si vous le découvriez pour la première fois.
      questions:
          - id: q01
            type: texte
            enonce: "Question 3 : vérifiez :"
            suite:
                - type: liste
                  elements:
                      - Je comprends immédiatement le sujet du document.
                      - Les différentes parties sont faciles à repérer.
                      - Les phrases sont compréhensibles.
                      - La présentation est régulière.
                      - Il n'y a pas d'information inutile.
                - type: paragraphe
                  texte: Corrigez votre document si nécessaire.
    - id: a11
      titre: 7. Quel fichier allons-nous transmettre ? – 3 minutes
      contenu:
          - type: paragraphe
            texte: Votre document est terminé.
      questions:
          - id: q01
            type: texte
            enonce: "Question 4 : si le responsable doit uniquement consulter votre fiche, allez-vous transmettre :"
            suite:
                - type: liste
                  elements:
                      - le fichier ODT ;
                      - le fichier PDF ?
                - type: paragraphe
                  texte: Justifiez votre choix.
    - id: a12
      titre: 8. Créer la version PDF – 5 minutes
      contenu:
          - type: etapes
            elements:
                - Enregistrez d'abord votre document avec Ctrl + S.
                - Utilisez la fonction d'export au format PDF.
                - Enregistrez le PDF dans le dossier S05.
                - Nommez-le 4e3e_S05_nom_prenom.pdf.
                - Ouvrez le PDF obtenu.
          - type: paragraphe
            texte: "Votre dossier doit maintenant contenir :"
          - type: liste
            elements:
                - 4e3e_S05_nom_prenom.odt ;
                - 4e3e_S05_nom_prenom.pdf.
      questions: []
    - id: a13
      titre: 9. Avant de transmettre – 3 minutes
      contenu:
          - type: paragraphe
            texte: Avant d'envoyer ou de déposer un fichier, il faut le vérifier.
          - type: paragraphe
            texte: "Cochez les vérifications effectuées :"
          - type: liste
            elements:
                - Le fichier s'ouvre correctement.
                - Son nom est correct.
                - Le document est terminé.
                - Le bon fichier a été choisi.
                - Les informations présentes peuvent être transmises.
      questions: []
    - id: a14
      titre: 10. Rendre son travail – 2 minutes
      contenu:
          - type: paragraphe
            texte: Cette fois, vous devez rendre la version destinée à être consultée.
          - type: paragraphe
            texte: "Déposez :"
          - type: paragraphe
            texte: 4e3e_S05_nom_prenom.pdf
          - type: paragraphe
            texte: dans l'espace indiqué par le professeur.
          - type: paragraphe
            texte: "Conservez également dans votre dossier personnel :"
          - type: paragraphe
            texte: 4e3e_S05_nom_prenom.odt
          - type: paragraphe
            texte: Le travail doit être rendu même s'il n'est pas totalement terminé.
      questions: []
    - id: a15
      titre: Pour aller plus loin
      contenu:
          - type: paragraphe
            texte: Si vous avez terminé, ouvrez la fenêtre Enregistrer sous de Writer sans valider de modification.
          - type: paragraphe
            texte: Observez les différents formats proposés.
      questions:
          - id: q01
            type: texte
            enonce: "Question 5 : trouvez deux autres extensions possibles pour un document texte."
          - id: q02
            type: texte
            enonce: "Question 6 : pourquoi existe-t-il plusieurs formats de documents texte ?"
      facultatif: true
    - id: a16
      titre: À retenir
      contenu:
          - type: liste
            elements:
                - Un même contenu peut exister dans plusieurs formats.
                - Le choix du format dépend de ce que l'on souhaite faire du document.
                - Un fichier ODT est adapté à la poursuite du travail dans Writer.
                - Un fichier PDF est notamment adapté à la consultation et à la transmission d'une version finalisée.
                - Changer uniquement l'extension dans le nom ne convertit pas réellement un fichier.
                - Un document doit être conçu en tenant compte de son destinataire.
                - Avant de transmettre un fichier, je vérifie son contenu, son nom, son format et sa version.
      questions: []
    - id: a17
      titre: Référentiel
      contenu:
          - type: paragraphe
            texte: Cette séance participe notamment au travail sur l'utilisation d'un environnement informatique, la création de documents numériques et le choix d'un format adapté à une situation de communication.
          - type: paragraphe
            texte: "Source : ChloroFil – Classes de 4e et 3e de l'enseignement agricole ."
          - type: lien
            titre: ChloroFil – Classes de 4e et 3e de l'enseignement agricole
            url: https://chlorofil.fr/diplomes/secondaire/4e-3e
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
ressources:
