titre: 'Séance 5 : Quel format choisir pour envoyer un document ?'
themes:
    - Objectif 1 — S’approprier et utiliser un environnement informatique de travail
problematique: Quel format de fichier choisir pour qu’un document s’ouvre bien chez la personne qui le reçoit ?
competences_bo:
    - Objectif 1 — S’approprier et utiliser un environnement informatique de travail
objectifs:
    connaissances:
        - Un fichier de travail (.odt) se modifie ; un PDF se lit partout et garde sa mise en page.
        - Une image en .jpg est légère ; un fichier trop lourd est difficile à envoyer.
    competences:
        - Exporter un document en PDF.
        - Choisir un format selon l’usage.
pourquoi:
    - En S04, tu as créé la fiche de Princesse.
    - 'Le propriétaire de la jument veut la recevoir par courriel : il n’a pas Writer. Quel format envoyer ?'
activites:
    -   id: a01
        titre: Fichier de travail ou fichier à lire ?
        consigne: Tu vas choisir le bon format (.odt ou .pdf) pour trois situations, avec le document 1. On attend un format par situation.
        contenu:
            -   type: tableau
                titre: Document 1 — Deux formats
                colonnes:
                    - Format
                    - Avantage
                    - Limite
                lignes:
                    -   - .odt
                        - Se modifie facilement
                        - Peut s’afficher autrement sans Writer
                    -   - .pdf
                        - S’ouvre partout, garde la mise en page
                        - Difficile à modifier
            -   type: etapes
                elements:
                    - Lis le tableau des formats.
                    - 'Pour chaque situation, demande-toi : la personne doit-elle modifier ou seulement lire ?'
                    - Choisis le format.
            -   type: paragraphe
                texte: Pourquoi deux sortes de fichiers ? On garde le fichier de travail pour modifier, et on envoie un PDF pour être sûr qu’il s’affiche bien.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Pour chaque situation, choisis le format : .odt ou .pdf.'
                colonnes:
                    - Situation
                    - Format
                lignes:
                    -   - Envoyer la fiche au propriétaire pour qu’il la lise
                        - ''
                    -   - Continuer à modifier la fiche la semaine prochaine
                        - ''
                    -   - Imprimer l’affiche au secrétariat
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: Exporter en PDF
        transition: Tu sais quel format choisir. Crée ton PDF.
        consigne: Tu vas exporter ta fiche de Princesse au format PDF et vérifier le résultat. On attend le menu utilisé et le nom du fichier.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre ta fiche de S04.
                    - Clique sur Fichier > Exporter au format PDF.
                    - Enregistre le PDF dans le même dossier.
                    - Ouvre le PDF pour vérifier.
            -   type: paragraphe
                texte: 'Pourquoi vérifier ? Il arrive qu’une image se déplace : on contrôle avant d’envoyer.'
        questions:
            -   id: q01
                type: texte
                enonce: Écris le menu utilisé pour créer le PDF, et le nom du fichier obtenu.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a03
        titre: Le poids des fichiers
        transition: Ton PDF est prêt. Est-il facile à envoyer ?
        consigne: Tu vas comparer la taille de tes fichiers et la limite d’une messagerie (document 2). On attend une réponse sur l’envoi d’une vidéo et une solution.
        contenu:
            -   type: paragraphe
                texte: Document 2 — Beaucoup de messageries limitent la taille des pièces jointes à 25 Mo environ. Une photo pèse quelques Mo, une vidéo plusieurs dizaines de Mo.
            -   type: etapes
                elements:
                    - Ouvre les propriétés de ton fichier .odt, puis de ton PDF (clic droit > Propriétés).
                    - Note leur taille en Ko.
                    - Lis le document 2 sur la limite des courriels.
            -   type: paragraphe
                texte: Pourquoi la taille compte ? Une messagerie refuse souvent les pièces jointes trop lourdes.
        questions:
            -   id: q01
                type: qcm
                enonce: D’après le document 2, peut-on envoyer par courriel une vidéo de 80 Mo ?
                choix:
                    -   id: a
                        texte: Non, elle dépasse la limite de 25 Mo.
                    -   id: b
                        texte: Oui, sans problème.
                    -   id: c
                        texte: Seulement le soir.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Propose une solution pour envoyer quand même cette vidéo au propriétaire.
                aide: 'Méthode : 1) relis le besoin ou le problème ; 2) propose une idée possible avec le matériel ou les données de la séance ; 3) dis en quoi elle répond au besoin (« Cela permet de… »).'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une photo de 6 Mo doit être mise sur le site de la MFR.
        questions:
            -   id: q01
                type: texte
                enonce: Comment la rendre plus légère sans trop perdre en qualité ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais choisir un format. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quel format choisir pour qu’un document s’ouvre bien chez la personne qui le reçoit ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Fichier de travail (.odt) pour modifier ; PDF pour envoyer et imprimer.
    - Vérifier la taille avant d’envoyer (limite des messageries).
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
