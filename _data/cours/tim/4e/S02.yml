titre: 'Séance 2 : Comment ranger ses fichiers pour ne plus les perdre ?'
themes:
    - Objectif 1 — S’approprier et utiliser un environnement informatique de travail
problematique: Comment organiser ses fichiers et ses dossiers pour les retrouver facilement ?
competences_bo:
    - Objectif 1 — S’approprier et utiliser un environnement informatique de travail
objectifs:
    connaissances:
        - 'Un dossier range des fichiers et d’autres dossiers : c’est l’arborescence.'
        - 'L’extension (après le point) indique le type de fichier : .odt (texte), .ods (tableur), .jpg (image).'
    competences:
        - Créer des dossiers et nommer ses fichiers clairement.
        - Reconnaître le type d’un fichier par son extension.
pourquoi:
    - En S01, tu as découvert le site. Pour travailler sur l’ordinateur, il faut d’abord savoir ranger.
    - Aujourd’hui, tu crées tes dossiers de TIM pour toute l’année.
activites:
    -   id: a01
        titre: Lire une arborescence
        consigne: Tu vas apprendre à lire une arborescence de dossiers, à partir du rangement de Léa (ci-dessus). On attend le chemin complet d’un fichier.
        contenu:
            -   type: code
                texte: "Documents\n└── TIM\n    ├── Séquence 1\n    │   └── 4e_S03_lea.odt\n    └── Photos\n        └── poney_eclair.jpg"
            -   type: etapes
                elements:
                    - Regarde l’arborescence de Léa ci-dessus.
                    - Pars du dossier « Documents » et descends jusqu’au fichier de la photo.
                    - Écris chaque dossier séparé par « > ».
                    - Pourquoi un chemin ? Il dit exactement où se trouve un fichier, comme l’adresse d’une maison.
        questions:
            -   id: q01
                type: texte
                enonce: Écris le chemin complet de la photo poney_eclair.jpg dans l’arborescence de Léa.
                aide: Suis l’arborescence de Léa depuis « Documents » jusqu’à la photo, dossier après dossier, et sépare chaque niveau par « > ».
            -   id: q02
                type: qcm
                enonce: Dans l’arborescence de Léa, que contient le dossier « TIM » ?
                choix:
                    -   id: a
                        texte: 'Deux dossiers : Séquence 1 et Photos.'
                    -   id: b
                        texte: Une seule photo.
                    -   id: c
                        texte: Rien.
                aide: Regarde ce qui est accroché juste sous « TIM » dans l’arborescence de Léa.
    -   id: a02
        titre: Créer mes dossiers
        transition: Tu sais lire un rangement. Crée maintenant le tien.
        consigne: Tu vas créer tes propres dossiers de TIM dans ton espace personnel, sur le modèle de Léa. On attend la liste des dossiers créés et leur emplacement.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre l’explorateur de fichiers et va dans ton espace personnel.
                    - Crée un dossier « TIM ».
                    - Dedans, crée « Séquence 1 » et « Photos ».
                    - Vérifie l’orthographe des noms.
                    - Pourquoi des noms clairs ? Dans trois mois, tu dois retrouver tes fichiers sans tout ouvrir.
        questions:
            -   id: q01
                type: texte
                enonce: Écris les noms des dossiers que tu as créés et où ils se trouvent.
                aide: Écris le nom de chaque dossier créé et dans quel autre dossier il se trouve.
    -   id: a03
        titre: L’extension dit le type
        transition: Tes dossiers sont prêts. Apprends à reconnaître ce que tu y ranges.
        consigne: Tu vas reconnaître le type de quatre fichiers d’une écurie grâce à leur extension et au document 1. On attend le type de chaque fichier.
        contenu:
            -   type: tableau
                titre: Document 1 — Quelques extensions
                colonnes:
                    - Extension
                    - Type
                    - Logiciel
                lignes:
                    -   - .odt
                        - texte
                        - Writer
                    -   - .ods
                        - tableur
                        - Calc
                    -   - .jpg / .png
                        - image
                        - visionneuse
                    -   - .pdf
                        - PDF
                        - lecteur PDF
            -   type: etapes
                elements:
                    - Lis le tableau des extensions.
                    - Pour chaque fichier, repère les lettres après le dernier point.
                    - Écris le type du fichier.
                    - Pourquoi l’extension ? L’ordinateur s’en sert pour savoir avec quel logiciel ouvrir le fichier.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Écris le type de chaque fichier de l’écurie : texte, tableur, image ou PDF.'
                colonnes:
                    - Fichier
                    - Type
                lignes:
                    -   - planning_soins.odt
                        - ''
                    -   - stock_foin.ods
                        - ''
                    -   - photo_eclair.jpg
                        - ''
                    -   - facture_marechal.pdf
                        - ''
                aide: Regarde les lettres après le point (.odt, .ods, .jpg, .pdf) et cherche-les dans le document 1.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un fichier s’appelle « doc1.odt ».
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi est-ce un mauvais nom ? Propose un meilleur nom.
                aide: Dans six mois, saurais-tu ce que contient ce fichier juste en lisant son nom ? Propose un nom sur le modèle classe_séance_prénom_sujet.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tes fichiers sont rangés. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment organiser ses fichiers pour les retrouver facilement ?'
                aide: 'Cite les deux habitudes vues aujourd’hui : des dossiers bien rangés et des noms de fichiers clairs.'
retenir:
    - 'Arborescence : dossiers et sous-dossiers ; chemin : Documents > TIM > …'
    - 'Extension : .odt texte, .ods tableur, .jpg image, .pdf PDF.'
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
