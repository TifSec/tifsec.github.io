titre: 'Séance 30 : Une frise de l’histoire du numérique'
themes:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
    - Objectif 6 — Appréhender les évolutions des technologies de l’informatique et du multimédia
problematique: Comment le numérique a-t-il changé en quelques décennies, et comment le montrer sur une frise ?
competences_bo:
    - Objectif 2 — Créer, produire, traiter et exploiter des données
objectifs:
    connaissances:
        - Une frise chronologique place des événements sur une ligne du temps, à intervalles réguliers.
        - 'Le numérique a beaucoup évolué : ordinateur personnel, internet, smartphone.'
    competences:
        - Construire une frise avec un logiciel.
        - Placer des dates à la bonne échelle.
pourquoi:
    - En S29, tu as vu la vie d’un appareil.
    - 'Aujourd’hui, tu remontes le temps : comment est-on arrivé au smartphone ?'
activites:
    -   id: a01
        titre: Lire les dates
        consigne: Tu vas lire et ranger les dates de l’histoire du numérique (document 1). On attend un écart en années et l’événement le plus ancien.
        contenu:
            -   type: tableau
                titre: Document 1 — Quelques dates du numérique
                colonnes:
                    - Date
                    - Événement
                lignes:
                    -   - '1977'
                        - Premiers micro-ordinateurs grand public
                    -   - '1991'
                        - Premier site web
                    -   - '1998'
                        - Création de Google
                    -   - '2007'
                        - Premier iPhone
                    -   - '2016'
                        - Les ventes de tablettes dépassent celles des ordinateurs dans plusieurs pays
            -   type: etapes
                elements:
                    - Lis les événements du document 1.
                    - Range-les du plus ancien au plus récent.
                    - Calcule un écart entre deux dates.
            -   type: paragraphe
                texte: Pourquoi ranger ? Une frise suit toujours l’ordre du temps, de gauche à droite.
        questions:
            -   id: q01
                type: nombre
                enonce: D’après le document 1, combien d’années séparent le premier site web et le premier iPhone ?
                unite: ans
                aide: N’oublie pas l’unité.
            -   id: q02
                type: qcm
                enonce: D’après le document 1, quel événement est le plus ancien ?
                choix:
                    -   id: a
                        texte: Le premier micro-ordinateur grand public
                    -   id: b
                        texte: Le premier site web
                    -   id: c
                        texte: Le premier iPhone
                aide: Relis l’exemple expliqué.
    -   id: a02
        titre: Construire la frise
        transition: Les dates sont rangées. Place-les sur une frise.
        consigne: Tu vas construire une frise de l’histoire du numérique, à intervalles réguliers, avec les dates du document 1. On attend ton échelle et la place d’une date.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Impress (ou Writer) et trace une ligne horizontale.
                    - Place des repères tous les 10 ans, de 1970 à 2030.
                    - Place chaque événement du document 1 avec une flèche et un court texte.
                    - Enregistre sous 4e_S30_tonprenom.
            -   type: paragraphe
                texte: Pourquoi une échelle régulière ? Des intervalles égaux montrent tout de suite que tout s’accélère après 1990.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle échelle as-tu choisie (combien de centimètres pour 10 ans) ? Où as-tu placé 2007 ?
                aide: Repère le verbe de la question.
    -   id: a03
        titre: Ajouter ma date
        transition: Ta frise est construite. Ajoute ton histoire.
        consigne: Tu vas ajouter ton année de naissance sur la frise et voir quels outils existaient déjà. On attend une réponse appuyée sur ta frise.
        contenu:
            -   type: etapes
                elements:
                    - Ajoute sur la frise ton année de naissance.
                    - Regarde quels outils existaient déjà.
                    - Réponds.
            -   type: paragraphe
                texte: 'Pourquoi ta date ? La frise devient personnelle : tu vois que le smartphone est plus jeune que toi, ou presque.'
        questions:
            -   id: q01
                type: texte
                enonce: D’après ta frise, quels outils existaient déjà à ta naissance ?
                aide: Repère le verbe de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Cherche la date d’un outil numérique utilisé à l’écurie (puce électronique d’identification des chevaux, logiciel de gestion…).
        questions:
            -   id: q01
                type: texte
                enonce: Ajoute-le à ta frise avec sa source.
                aide: Repère le verbe de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ta frise est terminée. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment le numérique a-t-il changé en quelques décennies, et comment le montrer sur une frise ?'
                aide: Reprends les mots du problème.
retenir:
    - 'Frise : ordre du temps, intervalles réguliers.'
    - Le numérique a évolué très vite depuis 1990.
sources:
    -   type: lien
        titre: ChloroFil — Document d’accompagnement TIM, 4e et 3e de l’enseignement agricole (juin 2016)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/4e3e/da/4e3e-da-TIMJuin2016.pdf
