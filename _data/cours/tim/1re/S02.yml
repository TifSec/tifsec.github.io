titre: 'Séance 2 : Comprendre ce que racontent les données'
themes:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
problematique: Comment décrire un fichier de données avant de l’exploiter ?
competences_bo:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
objectifs:
    connaissances:
        - 'Un fichier de données : des lignes (individus : ici des communes) et des colonnes (variables).'
        - Une variable est quantitative (un nombre) ou qualitative (une catégorie).
    competences:
        - Identifier individus et variables.
        - Distinguer variable quantitative et qualitative.
pourquoi:
    - En S01, tu as vu l’extrait du fichier des communes.
    - Avant de calculer, il faut comprendre de quoi il est fait.
activites:
    -   id: a01
        titre: Individus et variables
        consigne: Tu vas identifier les individus et les variables du fichier des communes (document 1). On attend ce que représente une ligne et le nombre de variables.
        contenu:
            -   type: tableau
                titre: Extrait du fichier du projet (communes du département, données fictives)
                colonnes:
                    - Commune
                    - Population
                    - Centres équestres
                    - Prairies (ha)
                    - Distance à la ville (km)
                lignes:
                    -   - Aurillac
                        - 25 000
                        - '3'
                        - 1 200
                        - '0'
                    -   - Saint-Flour
                        - 6 500
                        - '2'
                        - 2 800
                        - '70'
                    -   - Mauriac
                        - 3 600
                        - '1'
                        - 3 100
                        - '50'
                    -   - Arpajon-sur-Cère
                        - 6 200
                        - '0'
                        - 1 900
                        - '5'
                    -   - Riom-ès-Montagnes
                        - 2 500
                        - '1'
                        - 4 200
                        - '75'
                    -   - Ytrac
                        - 4 600
                        - '0'
                        - 2 300
                        - '8'
            -   type: etapes
                elements:
                    - Relis le document 1.
                    - Une ligne = un individu ; une colonne = une variable.
                    - Réponds.
            -   type: paragraphe
                texte: Pourquoi ce vocabulaire ? Il sert en maths (statistiques) comme en TIM.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, que représente une ligne ? Combien y a-t-il de variables ?
                aide: 'Bloc par bloc : quand ? quelle condition ? quelle action ?'
    -   id: a02
        titre: Quantitative ou qualitative ?
        transition: Tu connais lignes et colonnes. De quel type sont les variables ?
        consigne: Tu vas classer quatre variables du projet en quantitatives ou qualitatives. On attend le type de chacune.
        contenu:
            -   type: etapes
                elements:
                    - Lis la définition dans le cours.
                    - Classe chaque variable.
            -   type: paragraphe
                texte: Pourquoi classer ? On ne fait pas de moyenne sur un nom de commune.
        questions:
            -   id: q01
                type: tableau
                enonce: Classe chaque variable.
                colonnes:
                    - Variable
                    - Type
                lignes:
                    -   - Population
                        - ''
                    -   - Commune
                        - ''
                    -   - Prairies (ha)
                        - ''
                    -   - Label de qualité du centre (oui/non)
                        - ''
                aide: 'Bloc par bloc : quand ? quelle condition ? quelle action ?'
    -   id: a03
        titre: Un premier calcul
        transition: Tu sais décrire le fichier. Fais un premier résumé.
        consigne: Tu vas calculer la population moyenne et le total des prairies des six communes. On attend les deux résultats.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre le fichier fourni communes_projet.ods.
                    - Calcule la moyenne de la population avec MOYENNE.
                    - Calcule le total des prairies avec SOMME.
            -   type: paragraphe
                texte: Pourquoi ces deux calculs ? Ils résument le département en deux chiffres.
        questions:
            -   id: q01
                type: nombre
                enonce: Quelle est la population moyenne des 6 communes de l’extrait ?
                unite: habitants
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: nombre
                enonce: Quel est le total des prairies des 6 communes ?
                unite: ha
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La moyenne de population est tirée vers le haut par Aurillac.
        questions:
            -   id: q01
                type: texte
                enonce: Quel indicateur serait plus représentatif ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais décrire un fichier. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment décrire un fichier de données avant de l’exploiter ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Ligne = individu ; colonne = variable.
    - Quantitative / qualitative.
sources:
    -   type: lien
        titre: ChloroFil — Bac Pro, tronc commun rénové, document d’accompagnement du module MG1
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/bacpro/bacpro-tc-da-MG1.pdf
