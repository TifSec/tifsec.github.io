titre: Comprendre ce que racontent les données
theme: TIM — Comprendre ce que racontent les données
problematique: Comprendre ce que racontent les données
pourquoi: Avec seulement huit chevaux, il est encore possible d'observer le tableau et de réaliser certains calculs manuellement.
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Une donnée est une valeur brute que l'on observe, mesure ou enregistre.
        - Une information est obtenue lorsque l'on donne du sens à une ou plusieurs données.
        - Une donnée doit être accompagnée de son contexte pour être correctement comprise.
        - Un tableau permet d'organiser plusieurs données pour pouvoir les comparer et les analyser.
        - "Les données peuvent être de différentes natures : texte, nombre, date, catégorie, etc."
        - Un tableur comme Calc permet de traiter rapidement une grande quantité de données.
    competences: []
activites:
    - id: a03
      titre: 1. Créez votre document de travail
      contenu:
          - type: paragraphe
            texte: Ouvrez LibreOffice Calc et créez un nouveau classeur.
          - type: paragraphe
            texte: "Enregistrez immédiatement votre fichier dans votre dossier MG1_INFORMATIQUE sous le nom :"
          - type: paragraphe
            texte: BACPRO1_S02_nom_prenom.ods
          - type: paragraphe
            texte: Pensez ensuite à enregistrer régulièrement avec Ctrl + S.
          - type: paragraphe
            texte: "Ce classeur sera votre document de travail pendant toute la séance : vous pourrez y écrire, essayer, vous tromper, modifier et recommencer."
      questions: []
    - id: a04
      titre: 2. Une structure équestre produit-elle des données ?
      contenu:
          - type: paragraphe
            texte: Une structure équestre produit et utilise chaque jour de nombreuses données.
          - type: paragraphe
            texte: "Par exemple :"
          - type: liste
            elements:
                - le nom des chevaux ;
                - leur âge ;
                - leur poids estimé ;
                - la quantité de fourrage distribuée ;
                - leur activité ;
                - les dates de soins ou d'interventions ;
                - le nombre de cavaliers ;
                - les stocks disponibles ;
                - les dépenses et recettes de la structure.
          - type: paragraphe
            texte: Tous ces éléments peuvent devenir des données lorsqu'ils sont enregistrés.
          - type: paragraphe
            texte: L'IFCE (Institut Français du Cheval et de l'Équitation) rappelle par exemple que connaître le poids vif d'un cheval (son poids sur pied, animal vivant) est utile pour établir une ration, suivre sa croissance ou son état et adapter certains traitements.
          - type: paragraphe
            texte: Les données ont donc une utilité concrète dans le fonctionnement d'une entreprise.
          - type: paragraphe
            texte: "Sources professionnelles :"
          - type: liste
            elements:
                - "IFCE – équipédia : Estimation du poids."
                - "IFCE – équipédia : Les besoins alimentaires du cheval."
                - Chlorofil – Document d'accompagnement du module MG1 du Bac professionnel.
          - type: lien
            titre: "IFCE – équipédia : Estimation du poids."
            url: https://equipedia.ifce.fr/elevage-et-entretien/alimentation/nutrition-et-ration/estimation-du-poids
          - type: lien
            titre: "IFCE – équipédia : Les besoins alimentaires du cheval."
            url: https://equipedia.ifce.fr/elevage-et-entretien/alimentation/nutrition-et-ration/les-besoins-alimentaires-du-cheval
          - type: lien
            titre: Chlorofil – Document d'accompagnement du module MG1 du Bac professionnel.
            url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/bacpro/bacpro-tc-da-MG1.pdf
          - type: paragraphe
            texte: Les chevaux et les relevés utilisés dans cette activité sont fictifs. Les valeurs ont été adaptées pédagogiquement à partir de références professionnelles afin de proposer une situation réaliste. Elles ne constituent pas des recommandations individuelles d'alimentation.
      questions: []
    - id: a05
      titre: 3. Une donnée sans contexte est-elle vraiment utile ?
      contenu:
          - type: paragraphe
            texte: "Observez la donnée suivante :"
          - type: paragraphe
            texte: "520"
          - type: paragraphe
            texte: Que signifie ce nombre ?
      questions:
          - id: q01
            type: texte
            enonce: 520 € ?
          - id: q02
            type: texte
            enonce: 520 kg ?
          - id: q03
            type: texte
            enonce: 520 chevaux ?
          - id: q04
            type: texte
            enonce: 520 heures ?
          - id: q05
            type: texte
            enonce: 520 litres ?
            suite:
                - type: paragraphe
                  texte: Sans contexte, il est impossible de savoir ce que cette valeur représente réellement.
                - type: paragraphe
                  texte: "Si nous écrivons maintenant :"
                - type: paragraphe
                  texte: "Volcan – poids estimé : 520 kg"
                - type: paragraphe
                  texte: la donnée devient compréhensible.
                - type: paragraphe
                  texte: "Nous connaissons :"
                - type: liste
                  elements:
                      - "ce qui est mesuré : le poids ;"
                      - "l'animal concerné : Volcan ;"
                      - "la valeur : 520 ;"
                      - "l'unité : kg."
    - id: a06
      titre: 4. Donnée ou information ?
      contenu:
          - type: paragraphe
            texte: "Retenez cette différence importante :"
          - type: liste
            elements:
                - "Donnée : valeur brute observée, mesurée ou enregistrée."
                - "Information : résultat obtenu lorsque l'on interprète une ou plusieurs données dans un contexte."
          - type: paragraphe
            texte: "Exemple :"
          - type: paragraphe
            texte: "Donnée : 15"
          - type: paragraphe
            texte: "Donnée avec son contexte : Java a 15 ans."
          - type: paragraphe
            texte: "Si nous comparons maintenant cette donnée avec l'âge de tous les autres chevaux :"
          - type: paragraphe
            texte: "Information : Java est le cheval le plus âgé du groupe."
          - type: paragraphe
            texte: "Pour produire cette information, il a fallu réaliser un traitement : comparer plusieurs données."
      questions: []
    - id: a07
      titre: "5. Première mission : créez le tableau de données"
      contenu:
          - type: paragraphe
            texte: "Renommez la première feuille de votre classeur :"
          - type: paragraphe
            texte: DONNEES
          - type: paragraphe
            texte: "Reproduisez le tableau suivant :"
          - type: tableau
            colonnes:
                - Cheval
                - Âge (ans)
                - Poids estimé (kg)
                - Travail par semaine (h)
                - Foin distribué (kg/jour)
            lignes:
                - - Volcan
                  - "12"
                  - "520"
                  - "5"
                  - 9,2
                - - Oslo
                  - "8"
                  - "480"
                  - "3"
                  - 8,5
                - - Java
                  - "15"
                  - "540"
                  - "2"
                  - 9,5
                - - Nestor
                  - "7"
                  - "505"
                  - "6"
                  - "9"
                - - Praline
                  - "10"
                  - "455"
                  - "4"
                  - "8"
                - - Quartz
                  - "6"
                  - "510"
                  - "5"
                  - "9"
                - - Rivage
                  - "13"
                  - "565"
                  - "3"
                  - "10"
                - - Salsa
                  - "9"
                  - "470"
                  - "6"
                  - 8,3
          - type: paragraphe
            texte: Les quantités de foin ont été adaptées pour être cohérentes avec les ordres de grandeur présentés par l'IFCE.
          - type: paragraphe
            texte: L'IFCE indique notamment que la quantité de fourrage dépend du poids vif, de l'activité, de l'état corporel et des caractéristiques du fourrage.
          - type: paragraphe
            texte: Un exemple donné par l'IFCE montre qu'un cheval de 500 kg consommant l'équivalent de 1,5 % de son poids vif en matière sèche représente environ 9 kg brut de foin avec un foin à 85 % de matière sèche.
          - type: paragraphe
            texte: Les valeurs du tableau sont des données pédagogiques fictives et simplifiées. Elles ne doivent pas être utilisées pour établir la ration réelle d'un cheval.
      questions: []
    - id: a08
      titre: 6. Rendez le tableau facile à lire
      contenu:
          - type: paragraphe
            texte: Avant de commencer l'analyse, améliorez la présentation du tableau.
          - type: paragraphe
            texte: "Vous devez essayer de :"
          - type: liste
            elements:
                - mettre les titres des colonnes en évidence ;
                - adapter la largeur des colonnes ;
                - aligner correctement les données ;
                - afficher correctement les nombres décimaux ;
                - rendre le tableau facile à lire.
          - type: paragraphe
            texte: Vous êtes libre de choisir la présentation.
          - type: paragraphe
            texte: Le but n'est pas de faire le tableau le plus décoré possible mais le plus lisible possible.
      questions: []
    - id: a09
      titre: 7. Que peut-on apprendre grâce aux données ?
      contenu:
          - type: paragraphe
            texte: "Ajoutez une nouvelle feuille et nommez-la :"
          - type: paragraphe
            texte: ANALYSE
          - type: paragraphe
            texte: Recopiez les questions suivantes puis répondez-y.
      questions:
          - id: q01
            type: texte
            enonce: Combien de chevaux sont présents dans le tableau ?
            suite: []
          - id: q02
            type: texte
            enonce: Quel est le cheval le plus âgé ?
            suite: []
          - id: q03
            type: texte
            enonce: Quel est le cheval le plus jeune ?
            suite: []
          - id: q04
            type: texte
            enonce: Quel cheval possède le poids estimé le plus élevé ?
            suite: []
          - id: q05
            type: texte
            enonce: Quel cheval possède le poids estimé le plus faible ?
            suite: []
          - id: q06
            type: texte
            enonce: Quel ou quels chevaux travaillent le plus d'heures par semaine ?
            suite: []
          - id: q07
            type: texte
            enonce: Quel cheval reçoit la plus grande quantité de foin chaque jour ?
            suite: []
          - id: q08
            type: texte
            enonce: Quel cheval reçoit la plus petite quantité de foin chaque jour ?
            suite:
                - type: paragraphe
                  texte: Pour l'instant, utilisez la méthode de votre choix.
                - type: paragraphe
                  texte: "Vous pouvez :"
                - type: liste
                  elements:
                      - observer le tableau ;
                      - comparer les valeurs ;
                      - faire un calcul ;
                      - utiliser une fonction de Calc si vous en connaissez déjà ;
                      - chercher une méthode par vous-même.
                - type: paragraphe
                  texte: Vous n'avez pas besoin de connaître toutes les fonctions de Calc pour réussir.
    - id: a10
      titre: 8. Une question un peu plus difficile
      contenu:
          - type: paragraphe
            texte: "Répondez maintenant aux questions suivantes :"
      questions:
          - id: q01
            type: texte
            enonce: Quelle quantité totale de foin est distribuée chaque jour aux huit chevaux ?
            suite: []
          - id: q02
            type: texte
            enonce: Quelle quantité cela représente-t-il sur 30 jours si les quantités restent identiques ?
            suite: []
          - id: q03
            type: texte
            enonce: Quel est l'âge moyen des huit chevaux ?
            suite: []
          - id: q04
            type: texte
            enonce: Quel est leur poids estimé moyen ?
            suite:
                - type: paragraphe
                  texte: Vous pouvez réaliser les calculs comme vous le souhaitez.
                - type: paragraphe
                  texte: Si vous connaissez déjà certaines fonctions de Calc, vous pouvez les utiliser.
                - type: paragraphe
                  texte: Sinon, cherchez une méthode permettant d'obtenir le résultat.
    - id: a11
      titre: 9. À quoi sert réellement le tableur ?
      contenu:
          - type: paragraphe
            texte: Avec seulement huit chevaux, il est encore possible d'observer le tableau et de réaliser certains calculs manuellement.
          - type: paragraphe
            texte: "Imaginez maintenant un fichier comportant :"
          - type: liste
            elements:
                - 80 chevaux ;
                - 500 clients ;
                - 365 jours de relevés ;
                - plusieurs milliers de lignes de données.
          - type: paragraphe
            texte: Effectuer tous les calculs manuellement deviendrait beaucoup plus difficile.
          - type: paragraphe
            texte: C'est l'un des rôles d'un tableur.
          - type: paragraphe
            texte: "Un tableur permet notamment de :"
          - type: liste
            elements:
                - stocker des données ;
                - les organiser ;
                - effectuer automatiquement des calculs ;
                - trier et filtrer les données ;
                - rechercher certaines valeurs ;
                - créer des graphiques ;
                - comparer des résultats ;
                - aider à prendre une décision.
      questions: []
    - id: a12
      titre: 10. Toutes les données se ressemblent-elles ?
      contenu:
          - type: paragraphe
            texte: Observez les différentes colonnes du tableau.
          - type: paragraphe
            texte: Elles ne contiennent pas toutes le même type de données.
          - type: tableau
            colonnes:
                - Exemple
                - Ce que représente la donnée
                - Type
            lignes:
                - - Volcan
                  - Nom du cheval
                  - Texte
                - - "12"
                  - Âge
                  - Nombre entier
                - - "520"
                  - Poids estimé
                  - Nombre
                - - 9,2
                  - Quantité de foin
                  - Nombre décimal
                - - 01/09/2026
                  - Date d'un relevé
                  - Date
                - - Actif / Repos / Soins
                  - État ou situation
                  - Catégorie
          - type: paragraphe
            texte: Le type d'une donnée est important car il détermine les traitements que l'ordinateur pourra effectuer.
          - type: paragraphe
            texte: "Par exemple :"
          - type: liste
            elements:
                - on peut calculer la moyenne des poids ;
                - on peut classer des dates dans l'ordre chronologique ;
                - on peut compter le nombre de chevaux appartenant à une catégorie ;
                - mais calculer la moyenne des noms des chevaux n'aurait aucun sens.
      questions: []
    - id: a13
      titre: 11. Données, traitement, information
      contenu:
          - type: paragraphe
            texte: "Le travail réalisé aujourd'hui peut être résumé par trois étapes :"
          - type: paragraphe
            texte: DONNÉES → TRAITEMENT → INFORMATION
          - type: paragraphe
            texte: "Exemple 1 :"
          - type: liste
            elements:
                - "Données : les âges des huit chevaux."
                - "Traitement : comparer les âges."
                - "Information : Java est le cheval le plus âgé."
          - type: paragraphe
            texte: "Exemple 2 :"
          - type: liste
            elements:
                - "Données : les quantités de foin distribuées aux huit chevaux."
                - "Traitement : additionner les valeurs."
                - "Information : 71,5 kg de foin sont distribués chaque jour."
          - type: paragraphe
            texte: "Exemple 3 :"
          - type: liste
            elements:
                - "Données : les poids estimés des huit chevaux."
                - "Traitement : calculer leur moyenne."
                - "Information : le poids estimé moyen du groupe est d'environ 505,6 kg."
      questions: []
    - id: a14
      titre: 12. Peut-on toujours interpréter une donnée sans précaution ?
      contenu:
          - type: paragraphe
            texte: Nous avons calculé que les huit chevaux reçoivent ensemble 71,5 kg de foin par jour.
          - type: paragraphe
            texte: Peut-on conclure uniquement grâce à ce nombre que leur alimentation est parfaitement adaptée ?
          - type: paragraphe
            texte: Justifiez votre réponse dans la feuille ANALYSE.
          - type: paragraphe
            texte: "Pour vous aider, relisez les informations données par l'IFCE : la quantité de fourrage dépend notamment du poids, de l'activité, de l'état corporel et des caractéristiques du fourrage."
      questions: []
    - id: a15
      titre: 13. Votre conclusion
      contenu:
          - type: paragraphe
            texte: "Dans la feuille ANALYSE, ajoutez le titre :"
          - type: paragraphe
            texte: Ce que j'ai compris aujourd'hui
          - type: paragraphe
            texte: "Complétez avec vos propres mots :"
          - type: etapes
            elements:
                - Une donnée est...
                - Une information est...
                - Un traitement de données sert à...
                - Le contexte d'une donnée est important parce que...
                - Un tableur peut être utile dans une entreprise parce que...
          - type: paragraphe
            texte: Il n'est pas nécessaire de recopier exactement le cours.
          - type: paragraphe
            texte: Expliquez ce que vous avez compris avec vos propres mots.
      questions: []
    - id: a16
      titre: À retenir
      contenu:
          - type: liste
            elements:
                - Une donnée est une valeur brute observée, mesurée ou enregistrée.
                - Une donnée doit être accompagnée de son contexte pour pouvoir être correctement interprétée.
                - Une information est obtenue après avoir traité et interprété une ou plusieurs données.
                - Les données peuvent être du texte, des nombres, des dates ou des catégories.
                - Un tableur permet d'organiser et de traiter rapidement de nombreuses données.
                - "Un résultat numérique ne suffit pas toujours pour prendre une décision : il faut l'interpréter dans son contexte."
                - Des données professionnelles doivent provenir de sources fiables ou être clairement identifiées comme des données simulées.
      questions: []
    - id: a17
      titre: Travail à rendre
      contenu:
          - type: paragraphe
            texte: "À la fin de la séance, déposez le fichier :"
          - type: paragraphe
            texte: BACPRO1_S02_nom_prenom.ods
          - type: paragraphe
            texte: "Votre fichier doit contenir au minimum :"
          - type: liste
            elements:
                - une feuille DONNEES avec le tableau correctement reproduit et présenté ;
                - une feuille ANALYSE avec vos réponses ;
                - les quatre calculs demandés ;
                - votre réponse à la question sur l'interprétation des données ;
                - votre conclusion personnelle.
          - type: paragraphe
            texte: Le fichier doit être rendu même si tout n'est pas terminé.
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
ressources:
    - type: paragraphe
      texte: Réalise les manipulations dans le logiciel demandé. Conserve tes fichiers sur ton espace habituel. Le site enregistre seulement tes réponses écrites, tes résultats, tes formules et tes démarches ; aucun fichier n’est téléversé.
introduction:
    - type: titre
      texte: "Compétence visée : Étudier un phénomène à l'aide de données"
    - type: paragraphe
      texte: Objectifs d’apprentissage
    - type: liste
      elements:
          - Une donnée est une valeur brute que l'on observe, mesure ou enregistre.
          - Une information est obtenue lorsque l'on donne du sens à une ou plusieurs données.
          - Une donnée doit être accompagnée de son contexte pour être correctement comprise.
          - Un tableau permet d'organiser plusieurs données pour pouvoir les comparer et les analyser.
          - "Les données peuvent être de différentes natures : texte, nombre, date, catégorie, etc."
          - Un tableur comme Calc permet de traiter rapidement une grande quantité de données.
    - type: liste
      elements:
          - Créer et enregistrer correctement un classeur Calc.
          - Identifier les différentes données présentes dans un tableau.
          - Retrouver une information à partir de plusieurs données.
          - Effectuer quelques calculs simples dans un tableur.
          - Utiliser des données pour répondre à une question professionnelle.
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://chlorofil.fr/diplomes/secondaire/bac-pro/1re-tle/tronc-commun
