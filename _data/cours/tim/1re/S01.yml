titre: Bien démarrer en MG1 Informatique
theme: TIM — Bien démarrer en MG1 Informatique
problematique: Bien démarrer en MG1 Informatique
pourquoi: "Imaginez un ordinateur contenant plusieurs centaines de fichiers portant les noms suivants :"
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Le fonctionnement des cours d'informatique cette année.
        - La manière dont vous allez travailler et rendre vos fichiers.
        - Les principales compétences qui seront travaillées au cours de l'année.
        - L'importance de l'autonomie, de l'essai et du droit à l'erreur.
    competences: []
activites:
    - id: a03
      titre: 1. Bienvenue en MG1 Informatique
      contenu:
          - type: paragraphe
            texte: Cette année, les cours d'informatique ne consisteront pas seulement à apprendre où se trouvent les boutons d'un logiciel.
          - type: paragraphe
            texte: Vous allez surtout apprendre à utiliser l'ordinateur pour résoudre des problèmes, organiser des informations, traiter des données et présenter des résultats.
          - type: paragraphe
            texte: "Au cours de l'année, nous utiliserons notamment :"
          - type: liste
            elements:
                - LibreOffice Calc pour organiser et traiter des données ;
                - différents outils numériques pour rechercher et exploiter des informations ;
                - des fichiers provenant de situations professionnelles ;
                - des tableaux et des graphiques ;
                - des outils permettant de communiquer ou de présenter des résultats.
          - type: paragraphe
            texte: La plupart du temps, vous apprendrez en faisant.
      questions: []
    - id: a04
      titre: 2. Comment allons-nous travailler ?
      contenu:
          - type: paragraphe
            texte: En informatique, il est normal de ne pas savoir immédiatement comment réaliser quelque chose.
          - type: paragraphe
            texte: "Vous aurez le droit :"
          - type: liste
            elements:
                - d'essayer ;
                - de vous tromper ;
                - d'annuler une action ;
                - de recommencer ;
                - de chercher une solution ;
                - de demander de l'aide ;
                - d'aider un camarade sans faire le travail à sa place.
          - type: paragraphe
            texte: Une erreur n'est donc pas un problème.
          - type: paragraphe
            texte: Ce qui est important, c'est de chercher à comprendre comment la corriger.
      questions: []
    - id: a05
      titre: 3. Le document de travail
      contenu:
          - type: paragraphe
            texte: Dans la plupart des séances, vous travaillerez dans un fichier qui sera créé dès le début du cours.
          - type: paragraphe
            texte: "Ce fichier pourra servir :"
          - type: liste
            elements:
                - de brouillon ;
                - d'espace pour essayer ;
                - pour répondre aux questions ;
                - pour réaliser les exercices ;
                - pour conserver certaines explications ;
                - pour montrer votre progression pendant la séance.
          - type: paragraphe
            texte: À la fin du cours, le fichier demandé devra être rendu.
          - type: paragraphe
            texte: Un fichier incomplet mais contenant votre travail vaut mieux qu'un fichier qui n'est pas rendu.
      questions: []
    - id: a06
      titre: "4. Avant de commencer : faisons connaissance"
      contenu:
          - type: paragraphe
            texte: Avant de travailler ensemble pendant l'année, prenons quelques minutes pour nous présenter.
          - type: paragraphe
            texte: "À votre tour, indiquez simplement :"
          - type: liste
            elements:
                - votre prénom ;
                - votre formation ou votre projet professionnel ;
                - ce que vous aimeriez faire plus tard, si vous le savez déjà ;
                - "votre niveau avec un ordinateur : débutant, moyen ou à l'aise ;"
                - une chose que vous savez déjà faire sur ordinateur ;
                - une chose que vous aimeriez apprendre à faire.
          - type: paragraphe
            texte: Il n'y a pas de bonne ou de mauvaise réponse.
          - type: paragraphe
            texte: Cette présentation sert simplement à mieux connaître le groupe et à adapter les activités de l'année.
      questions: []
    - id: a07
      titre: "5. Première mission : préparer son espace de travail"
      contenu:
          - type: paragraphe
            texte: Nous allons maintenant commencer à travailler sur les ordinateurs.
          - type: paragraphe
            texte: "Dans votre espace personnel, créez un dossier nommé :"
          - type: paragraphe
            texte: nom_prenom
          - type: paragraphe
            texte: "Puis à l'intérieur de ce dossier, créez un sous-dossier nommé :"
          - type: paragraphe
            texte: TIM
          - type: paragraphe
            texte: "À l'intérieur de ce dossier, créez un nouveau dossier :"
          - type: paragraphe
            texte: SEANCE_01
          - type: paragraphe
            texte: "Vous devez obtenir l'organisation suivante :"
          - type: code
            texte: TIM └── SEANCE_01
          - type: paragraphe
            texte: Nous utiliserons cette organisation pendant l'année afin de retrouver facilement les fichiers.
      questions: []
    - id: a08
      titre: 6. Pourquoi bien ranger ses fichiers ?
      contenu:
          - type: paragraphe
            texte: "Imaginez un ordinateur contenant plusieurs centaines de fichiers portant les noms suivants :"
          - type: liste
            elements:
                - document1.odt
                - nouveau.odt
                - copie.odt
                - truc.odt
                - final.odt
                - final2.odt
                - final_vraiment.odt
          - type: paragraphe
            texte: Quelques semaines plus tard, retrouver le bon document devient très difficile.
          - type: paragraphe
            texte: "Un fichier doit donc avoir un nom permettant de savoir rapidement :"
          - type: liste
            elements:
                - à qui il appartient ;
                - à quel cours il correspond ;
                - ce qu'il contient.
      questions: []
    - id: a09
      titre: 7. Votre premier fichier
      contenu:
          - type: paragraphe
            texte: Ouvrez maintenant LibreOffice Writer.
          - type: paragraphe
            texte: Créez un nouveau document puis enregistrez-le immédiatement dans le dossier SEANCE_01.
          - type: paragraphe
            texte: "Le fichier doit être nommé :"
          - type: paragraphe
            texte: BACPRO1_S01_nom_prenom.odt
          - type: paragraphe
            texte: Remplacez évidemment nom et prenom par vos informations.
          - type: paragraphe
            texte: "Exemple :"
          - type: paragraphe
            texte: BACPRO1_S01_dupont_lea.odt
      questions: []
    - id: a10
      titre: 8. Petite vérification
      contenu:
          - type: paragraphe
            texte: Fermez maintenant votre document.
          - type: paragraphe
            texte: Retrouvez-le dans votre dossier puis ouvrez-le à nouveau.
          - type: paragraphe
            texte: "Si vous avez réussi, vous venez déjà de réaliser plusieurs opérations importantes :"
          - type: liste
            elements:
                - créer une arborescence de dossiers ;
                - enregistrer un fichier à un endroit précis ;
                - respecter une convention de nommage ;
                - retrouver un document enregistré.
      questions: []
    - id: a11
      titre: "9. Mission : créez votre fiche de présentation"
      contenu:
          - type: paragraphe
            texte: Dans votre document Writer, créez maintenant une petite fiche permettant de vous présenter.
          - type: paragraphe
            texte: "Votre fiche doit comporter au minimum :"
          - type: liste
            elements:
                - un titre ;
                - votre prénom ;
                - votre projet professionnel ou le métier qui vous intéresse ;
                - votre expérience avec les ordinateurs ;
                - les logiciels ou outils numériques que vous connaissez déjà ;
                - une chose que vous aimez faire ;
                - une chose que vous aimeriez apprendre en informatique cette année.
          - type: paragraphe
            texte: Vous pouvez ajouter d'autres informations si vous le souhaitez.
          - type: paragraphe
            texte: Ne mettez aucune information personnelle que vous ne souhaitez pas partager.
      questions: []
    - id: a12
      titre: 10. Première manipulation de mise en forme
      contenu:
          - type: paragraphe
            texte: Votre document doit maintenant être organisé afin qu'il soit agréable à lire.
          - type: paragraphe
            texte: "Essayez de réaliser les opérations suivantes :"
          - type: liste
            elements:
                - agrandir le titre ;
                - mettre le titre en gras ;
                - créer au moins deux sous-titres ;
                - utiliser une liste à puces ;
                - mettre au moins une information importante en gras ;
                - modifier l'alignement d'un élément ;
          - type: paragraphe
            texte: Vous pouvez tester différentes possibilités.
          - type: paragraphe
            texte: "Si le résultat ne vous plaît pas, utilisez :"
          - type: paragraphe
            texte: Ctrl + Z
          - type: paragraphe
            texte: Ce raccourci permet d'annuler la dernière action.
      questions: []
    - id: a13
      titre: "11. Petit défi : peut-on apprendre sans tutoriel ?"
      contenu:
          - type: paragraphe
            texte: Ajoutez maintenant une ligne horizontale ou une bordure permettant de séparer deux parties de votre document.
          - type: paragraphe
            texte: Cette fois, aucune procédure détaillée n'est donnée.
          - type: paragraphe
            texte: "Vous pouvez :"
          - type: liste
            elements:
                - chercher dans les menus ;
                - tester différentes commandes ;
                - observer les icônes ;
                - demander un indice ;
                - échanger avec un camarade.
          - type: paragraphe
            texte: L'objectif n'est pas d'aller vite.
          - type: paragraphe
            texte: L'objectif est de chercher comment réaliser quelque chose que vous ne savez pas encore faire.
      questions: []
    - id: a14
      titre: 12. Petite enquête pour préparer l'année
      contenu:
          - type: paragraphe
            texte: "À la fin de votre document, ajoutez le titre :"
          - type: paragraphe
            texte: Mon niveau en informatique
          - type: paragraphe
            texte: "Puis recopiez les éléments suivants et indiquez pour chacun :"
          - type: paragraphe
            texte: Je sais faire / Je pense savoir faire / Je ne sais pas encore faire
          - type: liste
            elements:
                - Créer un dossier.
                - Retrouver un fichier sur un ordinateur.
                - Renommer un fichier.
                - Utiliser une clé USB.
                - Créer un document Writer ou Word.
                - Créer un tableau.
                - Utiliser Calc ou Excel.
                - Faire un calcul dans Calc ou Excel.
                - Créer un graphique.
                - Envoyer un fichier en pièce jointe.
                - Trouver une information fiable sur Internet.
                - Utiliser un espace de stockage en ligne.
          - type: paragraphe
            texte: Ces réponses ne sont pas une évaluation.
          - type: paragraphe
            texte: Elles serviront à savoir ce que le groupe maîtrise déjà et ce qu'il faudra davantage travailler cette année.
      questions: []
    - id: a15
      titre: 13. Avant de rendre votre travail
      contenu:
          - type: paragraphe
            texte: "Vérifiez les points suivants :"
          - type: liste
            elements:
                - Mon fichier est enregistré dans le bon dossier.
                - Le nom du fichier respecte la consigne.
                - Ma fiche comporte un titre.
                - Les informations sont organisées.
                - J'ai essayé plusieurs outils de mise en forme.
                - J'ai répondu à la petite enquête.
                - J'ai enregistré une dernière fois avec Ctrl + S.
      questions: []
    - id: a16
      titre: À retenir
      contenu:
          - type: liste
            elements:
                - Un fichier bien nommé est beaucoup plus facile à retrouver.
                - Les dossiers permettent d'organiser son travail.
                - Il est conseillé d'enregistrer son document dès le début d'une activité.
                - Ctrl + S permet d'enregistrer rapidement.
                - Ctrl + Z permet d'annuler la dernière action.
                - En informatique, essayer et se tromper font partie de l'apprentissage.
      questions: []
    - id: a17
      titre: Travail à rendre
      contenu:
          - type: paragraphe
            texte: "À la fin de la séance, déposez le fichier :"
          - type: paragraphe
            texte: BACPRO1_S01_nom_prenom.odt
          - type: paragraphe
            texte: Le fichier doit être rendu même s'il n'est pas terminé.
      questions: []
    - id: a18
      titre: Bilan de la séance
      contenu: []
      questions:
          - id: q01
            type: texte
            enonce: Qu’as-tu réalisé pendant cette séance ? Explique ce que tu sais maintenant faire et ce qui reste à travailler.
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
ressources:
    - type: paragraphe
      texte: Réalise les manipulations dans le logiciel demandé. Conserve tes fichiers sur ton espace habituel. Le site enregistre seulement tes réponses écrites, tes résultats, tes formules et tes démarches ; aucun fichier n’est téléversé.
introduction:
    - type: titre
      texte: "Compétence visée : Prendre en main son environnement numérique et présenter son profil"
    - type: paragraphe
      texte: Objectifs d’apprentissage
    - type: liste
      elements:
          - Le fonctionnement des cours d'informatique cette année.
          - La manière dont vous allez travailler et rendre vos fichiers.
          - Les principales compétences qui seront travaillées au cours de l'année.
          - L'importance de l'autonomie, de l'essai et du droit à l'erreur.
    - type: liste
      elements:
          - Créer un dossier de travail correctement organisé.
          - Créer et enregistrer un document avec un nom précis.
          - Retrouver un fichier enregistré.
          - Modifier simplement la présentation d'un document.
          - Présenter quelques informations de manière claire et organisée.
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://chlorofil.fr/diplomes/secondaire/bac-pro/1re-tle/tronc-commun
