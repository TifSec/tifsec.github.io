titre: 'Séance 1 : Le projet de l’année : où implanter une pension pour chevaux ?'
themes:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
problematique: Comment des données peuvent-elles aider à choisir où créer une pension pour chevaux ?
competences_bo:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
objectifs:
    connaissances:
        - 'La capacité C1.2 du module MG1 : étudier un phénomène professionnel à l’aide de données, notamment en nombre.'
        - 'Une démarche de projet de données : question → collecte → traitement → représentation → décision.'
    competences:
        - Formuler une question de projet.
        - Identifier les données utiles.
pourquoi:
    - En 2de, tu as utilisé un tableur et des données ouvertes.
    - 'Cette année, tu mènes un vrai projet : choisir la commune où un porteur de projet pourrait ouvrir une pension pour chevaux.'
activites:
    -   id: a01
        titre: La démarche
        consigne: Tu vas remettre dans l’ordre les cinq étapes d’un projet de données (document 1). On attend un numéro par étape.
        contenu:
            -   type: liste
                elements:
                    - Poser la question
                    - Collecter les données
                    - Traiter
                    - Représenter
                    - Décider et argumenter
            -   type: etapes
                elements:
                    - Lis les cinq étapes de la démarche (document 1).
                    - Remets-les dans l’ordre.
                    - Repère l’étape où on utilise le tableur.
            -   type: paragraphe
                texte: 'Pourquoi une démarche ? On ne choisit pas une commune « au feeling » : chaque décision s’appuie sur des chiffres.'
        questions:
            -   id: q01
                type: tableau
                enonce: Remets les étapes dans l’ordre (1 à 5).
                colonnes:
                    - Étape
                    - Ordre
                lignes:
                    -   - Représenter (graphique, carte)
                        - ''
                    -   - Poser la question
                        - ''
                    -   - Décider et argumenter
                        - ''
                    -   - Collecter les données
                        - ''
                    -   - Traiter (calculs, tris)
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: Les critères d’une bonne implantation
        transition: Tu connais la démarche. Définis tes critères.
        consigne: Tu vas proposer trois critères chiffrés pour choisir où implanter une pension pour chevaux. On attend chaque critère et le sens recherché.
        contenu:
            -   type: etapes
                elements:
                    - 'Imagine que tu ouvres une pension : de quoi as-tu besoin ?'
                    - Écris trois critères mesurables par un chiffre.
                    - Pour chacun, dis si on cherche une valeur forte ou faible.
            -   type: paragraphe
                texte: Pourquoi « mesurable » ? Un critère comme « joli village » ne se compare pas ; « hectares de prairie » si.
        questions:
            -   id: q01
                type: tableau
                enonce: Écris trois critères mesurables.
                colonnes:
                    - Critère
                    - On cherche une valeur…
                lignes:
                    -   - ''
                        - ''
                    -   - ''
                        - ''
                    -   - ''
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a03
        titre: Lire le fichier du projet
        transition: Tes critères sont choisis. Regarde les données.
        consigne: Tu vas lire l’extrait du fichier des communes (document 2) et repérer une commune intéressante. On attend une lecture et un choix justifié par deux colonnes.
        contenu:
            -   type: tableau
                titre: Extrait du fichier du projet (communes du département, données fictives)
                colonnes:
                    - Commune
                    - Population
                    - Centres équestres
                    - Prairies (ha)
                    - Distance à la ville (km)
                lignes:
                    -   - Aurillac
                        - 25 000
                        - '3'
                        - 1 200
                        - '0'
                    -   - Saint-Flour
                        - 6 500
                        - '2'
                        - 2 800
                        - '70'
                    -   - Mauriac
                        - 3 600
                        - '1'
                        - 3 100
                        - '50'
                    -   - Arpajon-sur-Cère
                        - 6 200
                        - '0'
                        - 1 900
                        - '5'
                    -   - Riom-ès-Montagnes
                        - 2 500
                        - '1'
                        - 4 200
                        - '75'
                    -   - Ytrac
                        - 4 600
                        - '0'
                        - 2 300
                        - '8'
            -   type: paragraphe
                texte: Données fictives créées pour l’exercice (inspirées des ordres de grandeur publiés en données ouvertes).
            -   type: etapes
                elements:
                    - Lis l’extrait du fichier (document 2).
                    - Réponds aux questions.
                    - Repère une première commune intéressante.
            -   type: paragraphe
                texte: Pourquoi un premier regard ? On repère des tendances avant de calculer.
        questions:
            -   id: q01
                type: nombre
                enonce: D’après le document 2, combien d’hectares de prairies compte Riom-ès-Montagnes ?
                unite: ha
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: texte
                enonce: D’après le document 2, quelle commune semble intéressante à première vue ? Justifie avec deux colonnes.
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Il manque une donnée importante dans le fichier.
        questions:
            -   id: q01
                type: texte
                enonce: Laquelle ajouterais-tu ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Le projet est lancé. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment des données peuvent-elles aider à choisir où créer une pension pour chevaux ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Projet de données : question → collecte → traitement → représentation → décision.'
    - Critères mesurables.
sources:
