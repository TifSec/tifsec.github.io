titre: 'Séance 3 : Peut-on faire confiance à toutes les données ?'
themes:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
problematique: Comment repérer des données erronées ou incomplètes ?
competences_bo:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
objectifs:
    connaissances:
        - 'Erreurs fréquentes : doublons, cases vides, fautes de frappe, unités mélangées, valeurs impossibles.'
        - 'Une donnée a une source et une date : sans elles, elle est douteuse.'
    competences:
        - Repérer des erreurs dans un fichier.
        - Vérifier la source et la date des données.
pourquoi:
    - En S02, tu as calculé des moyennes.
    - Mais si le fichier contient des erreurs, les calculs sont faux.
activites:
    -   id: a01
        titre: Trouver les erreurs
        consigne: Tu vas trouver les quatre erreurs dans un extrait abîmé du fichier des communes (document 1). On attend la description de chaque erreur.
        contenu:
            -   type: tableau
                titre: Document 1 — Extrait abîmé (fictif)
                colonnes:
                    - Commune
                    - Population
                    - Centres
                    - Prairies
                lignes:
                    -   - Mauriac
                        - 3 600
                        - '1'
                        - 3 100 ha
                    -   - Mauriac
                        - 3 600
                        - '1'
                        - 3 100 ha
                    -   - Ytrac
                        - 4 600
                        - '0'
                        - ''
                    -   - Saint-Flour
                        - 6 500
                        - '-2'
                        - 2 800 ha
                    -   - Riom
                        - 2 500
                        - '1'
                        - 42 km²
            -   type: etapes
                elements:
                    - Lis l’extrait abîmé (document 1).
                    - Cherche les quatre erreurs.
                    - Classe-les.
            -   type: paragraphe
                texte: Pourquoi chercher ? Une seule erreur de saisie (2 800 tapé 28 000) fausse toute la décision.
        questions:
            -   id: q01
                type: tableau
                enonce: D’après le document 1, décris les quatre erreurs.
                colonnes:
                    - Ligne
                    - Erreur
                lignes:
                    -   - Mauriac (2 fois)
                        - ''
                    -   - Ytrac
                        - ''
                    -   - Saint-Flour
                        - ''
                    -   - Riom
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: Les conséquences
        transition: Tu as trouvé les erreurs. Que provoquent-elles ?
        consigne: Tu vas expliquer les conséquences de deux erreurs sur le calcul des prairies. On attend deux explications.
        contenu:
            -   type: etapes
                elements:
                    - Imagine qu’on calcule le total des prairies avec le document 1 sans corriger.
                    - Explique ce qui se passe.
            -   type: paragraphe
                texte: Pourquoi les conséquences ? Elles montrent pourquoi on nettoie avant de calculer.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle conséquence a le doublon de Mauriac sur le total des prairies ?
                aide: Une phrase complète qui reprend les mots de la question.
            -   id: q02
                type: texte
                enonce: Pourquoi « 42 km² » pose-t-il problème dans une colonne en hectares ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a03
        titre: Source et date
        transition: Les erreurs coûtent cher. Peut-on au moins faire confiance à la source ?
        consigne: Tu vas comparer deux jeux de données sur les prairies (document 2) pour choisir le plus fiable. On attend un choix justifié par deux indices.
        contenu:
            -   type: liste
                elements:
                    - 'Jeu A — « Surfaces en prairie par commune » — producteur : Agreste — mise à jour : 2025 — licence ouverte.'
                    - 'Jeu B — « prairies_v2_final.xls » — producteur : inconnu — mise à jour : 2009.'
            -   type: etapes
                elements:
                    - Lis les deux fiches de jeux de données (document 2).
                    - Choisis la plus fiable.
                    - Justifie.
            -   type: paragraphe
                texte: 'Pourquoi la date ? Les communes changent : des données de 2009 ne décrivent plus le territoire.'
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 2, quel jeu de données choisis-tu ? Justifie avec deux indices.
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une commune affiche 0 habitant.
        questions:
            -   id: q01
                type: texte
                enonce: Est-ce forcément une erreur ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais repérer des données douteuses. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment repérer des données erronées ou incomplètes ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Erreurs : doublon, vide, impossible, unité.'
    - Source et date.
sources:
    -   type: lien
        titre: ChloroFil — Bac Pro, tronc commun rénové, document d’accompagnement du module MG1
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/bacpro/bacpro-tc-da-MG1.pdf
