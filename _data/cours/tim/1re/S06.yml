titre: 'Séance 6 : Nettoyer les données avant de calculer'
themes:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
problematique: Comment nettoyer un fichier de données pour qu’il soit fiable ?
competences_bo:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
objectifs:
    connaissances:
        - 'Nettoyer : supprimer les doublons, compléter ou signaler les vides, harmoniser les écritures et les unités.'
        - On garde une copie du fichier brut et on note chaque correction.
    competences:
        - Supprimer des doublons.
        - Harmoniser des valeurs avec rechercher-remplacer.
pourquoi:
    - En S03, tu as repéré des erreurs. En S05, tu as importé le fichier.
    - Aujourd’hui, tu le nettoies.
activites:
    -   id: a01
        titre: Une copie et un journal
        consigne: Tu vas créer une copie brute du fichier des communes et un journal des corrections. On attend l’intérêt de la copie brute.
        contenu:
            -   type: fichier
                titre: fichier des communes (si tu n’as plus ton fichier de S05)
                url: /assets/fichiers/tim/1re/communes.csv
            -   type: etapes
                elements:
                    - Duplique la feuille « Données » en « Brut ».
                    - 'Crée une feuille « Journal » : date, correction, nombre de lignes concernées.'
                    - Pourquoi un journal ? On peut prouver et refaire ce qu’on a modifié.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi garder une copie brute du fichier ?
                aide: Si tu te trompes en nettoyant, comment retrouves-tu le fichier de départ ?
    -   id: a02
        titre: Les doublons
        transition: Le fichier brut est protégé. Supprime les doublons.
        consigne: Tu vas supprimer les doublons du fichier des communes et noter la correction dans le journal. On attend le nombre de doublons et ta ligne de journal.
        contenu:
            -   type: etapes
                elements:
                    - Trie par nom de commune.
                    - 'Données > Plus de filtres > Filtre standard > Options : sans doublons (copie vers une nouvelle feuille).'
                    - Compte les lignes avant et après.
                    - Pourquoi trier d’abord ? Les doublons se retrouvent côte à côte.
        questions:
            -   id: q01
                type: nombre
                enonce: Combien de doublons as-tu supprimés ?
                unite: lignes
                aide: 'L’outil de suppression des doublons affiche un message avec le nombre de lignes enlevées : lis-le.'
            -   id: q02
                type: texte
                enonce: 'Note cette correction dans ton journal : recopie la ligne.'
                aide: 'Une ligne de journal dit : quand, quelle correction, combien de lignes.'
    -   id: a03
        titre: Harmoniser
        transition: Plus de doublons. Reste les écritures différentes.
        consigne: Tu vas harmoniser la colonne « Label » avec rechercher-remplacer. On attend le nombre de remplacements, la raison et la bonne option.
        contenu:
            -   type: etapes
                elements:
                    - Dans la colonne « Label », on trouve « oui », « Oui », « OUI », « o ».
                    - 'Édition > Rechercher et remplacer : remplace par « oui ».'
                    - Vérifie avec un filtre.
                    - 'Pourquoi harmoniser ? Pour le tableur, « Oui » et « oui » sont deux valeurs différentes : le comptage serait faux.'
        questions:
            -   id: q01
                type: texte
                enonce: Combien de remplacements as-tu faits, et pourquoi était-ce nécessaire ?
                aide: 'Lis le nombre de remplacements affiché par Rechercher et remplacer. Pense à NB.SI : compte-t-il « Oui » et « oui » ensemble ?'
            -   id: q02
                type: qcm
                enonce: Quelle option cocher pour ne pas remplacer « o » dans « Mauriac » ?
                choix:
                    -   id: a
                        texte: Cellules entières uniquement
                    -   id: b
                        texte: Respecter la casse
                    -   id: c
                        texte: Aucune
                aide: Tu veux remplacer uniquement les cellules qui contiennent « o » tout seul, pas les lettres dans un mot.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une commune n’a pas de surface de prairie renseignée.
        questions:
            -   id: q01
                type: texte
                enonce: La mets-tu à 0 ?
                aide: 0 ha voudrait dire « pas de prairie ». Est-ce vrai, ou est-ce que l’on ne sait pas ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton fichier est propre. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment nettoyer un fichier de données pour qu’il soit fiable ?'
                aide: 'Dis les étapes : copie et journal, doublons, harmonisation, valeurs manquantes.'
retenir:
    - Copie brute + journal.
    - Doublons, harmonisation, vides signalés.
sources:
    -   type: lien
        titre: ChloroFil — Bac Pro, tronc commun rénové, document d’accompagnement du module MG1
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/bacpro/bacpro-tc-da-MG1.pdf
