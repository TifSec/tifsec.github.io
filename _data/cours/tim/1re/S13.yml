titre: 'Séance 13 : Le dossier du projet'
themes:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
problematique: Comment présenter tout le projet dans un document long et clair ?
competences_bo:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
objectifs:
    connaissances:
        - 'Un dossier : page de garde, sommaire, introduction (question), méthode (données, traitements), résultats (graphiques légendés), conclusion, sources.'
        - Styles de titres, table des matières automatique, légendes numérotées.
    competences:
        - Structurer un document long.
        - Insérer graphiques et légendes, sommaire automatique.
pourquoi:
    - Le projet est terminé (S12).
    - Le dossier écrit garde la trace de toute la démarche.
activites:
    -   id: a01
        titre: Le plan
        consigne: Tu vas adapter le plan type (document 1) à ton projet et écrire tes titres de niveau 1. On attend ton plan.
        contenu:
            -   type: liste
                elements:
                    - Page de garde.
                    - Sommaire.
                    - '1. Introduction : la question.'
                    - 2. Les données (sources, nettoyage).
                    - 3. Les traitements (calculs, score).
                    - 4. Les résultats (graphiques, carte, tableau de bord).
                    - 5. Conclusion et limites.
                    - Sources.
            -   type: etapes
                elements:
                    - Lis le plan type (document 1).
                    - Adapte-le à ton projet.
                    - Écris tes titres de niveau 1.
            -   type: paragraphe
                texte: Pourquoi suivre la démarche ? Le lecteur comprend comment tu es arrivé à ta recommandation.
        questions:
            -   id: q01
                type: texte
                enonce: Écris les titres de niveau 1 de ton dossier.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a02
        titre: Rédiger avec les styles
        transition: Le plan est prêt. Rédige.
        consigne: Tu vas rédiger la partie « Les données » de ton dossier avec les styles. On attend cette partie.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Writer ; enregistre dossier_projet.odt.
                    - Applique Titre 1 et Titre 2.
                    - Rédige la partie « Les données » (sources, nettoyage fait en S06).
            -   type: paragraphe
                texte: Pourquoi raconter le nettoyage ? Il prouve que tes chiffres sont fiables.
        questions:
            -   id: q01
                type: texte
                enonce: Recopie ta partie « Les données ».
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a03
        titre: Graphiques, légendes et sommaire
        transition: Le texte est rédigé. Ajoute les illustrations.
        consigne: Tu vas insérer tes graphiques légendés et la table des matières, puis exporter en PDF. On attend une légende et la phrase qui y renvoie.
        contenu:
            -   type: etapes
                elements:
                    - Colle tes graphiques ; ajoute une légende numérotée (clic droit > Insérer une légende).
                    - Insère la table des matières.
                    - Exporte en PDF.
            -   type: paragraphe
                texte: Pourquoi numéroter ? Dans le texte, on écrit « voir figure 2 ».
        questions:
            -   id: q01
                type: texte
                enonce: Écris la légende d’une de tes figures et la phrase du texte qui y renvoie.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un document long a souvent des annexes.
        questions:
            -   id: q01
                type: texte
                enonce: Que mettrais-tu en annexe ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton dossier est prêt. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment présenter tout le projet dans un document long et clair ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Dossier : démarche complète.'
    - Styles, légendes, sommaire, PDF.
sources:
    -   type: lien
        titre: ChloroFil — Bac Pro, tronc commun rénové, document d’accompagnement du module MG1
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/bacpro/bacpro-tc-da-MG1.pdf
