titre: 'Séance 5 : Le dictionnaire de données et l’import d’un fichier CSV'
themes:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
problematique: Comment documenter et importer correctement un fichier de données ?
competences_bo:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
objectifs:
    connaissances:
        - 'Un dictionnaire de données décrit chaque colonne : nom, signification, type, unité.'
        - Un CSV s’importe en choisissant le séparateur et l’encodage UTF-8, puis on enregistre en .ods.
    competences:
        - Rédiger un dictionnaire de données.
        - Importer un CSV sans erreur.
pourquoi:
    - En S04, tu as trouvé des données ouvertes.
    - Avant de les traiter, il faut les importer proprement et savoir ce que veut dire chaque colonne.
activites:
    -   id: a01
        titre: Importer
        consigne: Tu vas importer le fichier communes.csv dans Calc avec les bons paramètres. On attend les paramètres, le nombre de communes et la raison de l’enregistrement en .ods.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre le fichier fourni communes.csv avec Calc.
                    - 'Choisis : jeu de caractères UTF-8, séparateur point-virgule.'
                    - Vérifie l’aperçu puis OK ; enregistre en communes.ods.
            -   type: paragraphe
                texte: Pourquoi UTF-8 ? Sinon « Riom-ès-Montagnes » devient « Riom-Ã¨s-Montagnes ».
        questions:
            -   id: q01
                type: texte
                enonce: Quels paramètres as-tu choisis, et combien de communes compte le fichier ?
                aide: Une idée réaliste + « Cela permet de… ».
            -   id: q02
                type: qcm
                enonce: Pourquoi enregistrer ensuite en .ods ?
                choix:
                    -   id: a
                        texte: Pour garder formules et mises en forme.
                    -   id: b
                        texte: Pour que le fichier soit plus lourd.
                    -   id: c
                        texte: Ce n’est pas utile.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a02
        titre: Le dictionnaire
        transition: Les données sont importées. Que veut dire chaque colonne ?
        consigne: Tu vas rédiger le dictionnaire de données des colonnes du fichier importé. On attend signification, type et unité de trois colonnes.
        contenu:
            -   type: etapes
                elements:
                    - Crée une feuille « Dictionnaire ».
                    - 'Pour chaque colonne : nom, signification, type, unité.'
                    - Remplis au moins 4 colonnes.
            -   type: paragraphe
                texte: Pourquoi un dictionnaire ? Un camarade (ou toi dans 3 mois) comprend le fichier sans deviner.
        questions:
            -   id: q01
                type: tableau
                enonce: Complète le dictionnaire.
                colonnes:
                    - Colonne
                    - Signification / type / unité
                lignes:
                    -   - pop
                        - ''
                    -   - ce
                        - ''
                    -   - prairie_ha
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a03
        titre: Vérifier les types
        transition: Le dictionnaire est fait. Les types sont-ils bons dans Calc ?
        consigne: Tu vas repérer une colonne de nombres mal reconnue et la corriger. On attend la colonne et ta correction.
        contenu:
            -   type: etapes
                elements:
                    - 'Regarde l’alignement : les nombres sont à droite, les textes à gauche.'
                    - Trouve une colonne de nombres reconnue comme texte.
                    - Corrige (Données > Texte en colonnes, ou rechercher-remplacer l’espace).
            -   type: paragraphe
                texte: Pourquoi l’alignement ? Un nombre reconnu comme texte ne se calcule pas.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle colonne posait problème, et comment l’as-tu corrigée ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un fichier JSON est un autre format d’échange.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi le CSV est-il plus simple pour le tableur ?
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton fichier est importé et documenté. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment documenter et importer correctement un fichier de données ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Import : UTF-8, séparateur ; .ods.'
    - 'Dictionnaire : nom, sens, type, unité.'
sources:
    -   type: lien
        titre: ChloroFil — Bac Pro, tronc commun rénové, document d’accompagnement du module MG1
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/bacpro/bacpro-tc-da-MG1.pdf
