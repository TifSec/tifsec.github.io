titre: 'Séance 4 : Où trouver des données ouvertes sur notre département ?'
themes:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
problematique: Où trouver des données fiables et réutilisables pour le projet, et que dit la loi ?
competences_bo:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
objectifs:
    connaissances:
        - 'Données ouvertes (open data) : publiques, gratuites, réutilisables sous licence (Licence Ouverte).'
        - 'Métadonnées : producteur, date, format, licence, description des colonnes ; le RGPD interdit d’exploiter des données personnelles sans base légale.'
    competences:
        - Chercher un jeu de données ouvert.
        - Lire les métadonnées et la licence.
pourquoi:
    - En S03, tu as vu qu’une source et une date sont indispensables.
    - Aujourd’hui, tu cherches de vraies données pour le projet.
activites:
    -   id: a01
        titre: Les plateformes
        consigne: Tu vas chercher sur data.gouv.fr ou Agreste un jeu de données utile au projet de pension. On attend son titre et son producteur.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre data.gouv.fr et Agreste (liens ci-dessous).
                    - Cherche « prairies » ou « population communes ».
                    - Note un jeu de données trouvé.
            -   type: paragraphe
                texte: Pourquoi ces plateformes ? Elles publient des données officielles, avec une licence claire.
        questions:
            -   id: q01
                type: texte
                enonce: Écris le titre et le producteur d’un jeu de données utile au projet.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
        ressources:
            -   type: lien
                titre: data.gouv.fr — plateforme des données publiques
                url: https://www.data.gouv.fr/
            -   type: lien
                titre: Agreste — statistiques agricoles du ministère
                url: https://agreste.agriculture.gouv.fr/
    -   id: a02
        titre: Les métadonnées
        transition: Tu as un jeu de données. Lis sa fiche.
        consigne: Tu vas relever les métadonnées de ton jeu de données (date, format, licence). On attend les trois valeurs.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre la fiche du jeu trouvé.
                    - Relève les métadonnées.
                    - Remplis le tableau.
            -   type: paragraphe
                texte: Pourquoi les métadonnées ? Elles disent si la donnée est récente, réutilisable, et ce que veut dire chaque colonne.
        questions:
            -   id: q01
                type: tableau
                enonce: Complète la fiche de ton jeu de données.
                colonnes:
                    - Métadonnée
                    - Valeur
                lignes:
                    -   - Date de mise à jour
                        - ''
                    -   - Format
                        - ''
                    -   - Licence
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a03
        titre: Données personnelles ?
        transition: Le jeu est réutilisable. Contient-il des données personnelles ?
        consigne: Tu vas dire lequel de deux fichiers (document 1) peut être utilisé dans le projet, en appliquant le RGPD. On attend un choix justifié.
        contenu:
            -   type: liste
                elements:
                    - 'Fichier A : nombre d’équidés déclarés par commune (données agrégées, open data).'
                    - 'Fichier B : liste des propriétaires de chevaux avec nom, adresse, téléphone, trouvée sur un forum.'
            -   type: etapes
                elements:
                    - Lis les deux fichiers proposés (document 1).
                    - Lequel peut-on utiliser dans le projet ?
                    - Justifie avec le RGPD.
            -   type: paragraphe
                texte: Pourquoi le RGPD ? Un fichier avec les noms et téléphones des propriétaires de chevaux concerne des personnes.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, quel fichier peut-on utiliser ? Justifie.
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: La Licence Ouverte demande de citer la source.
        questions:
            -   id: q01
                type: texte
                enonce: Écris la mention de source de ton jeu de données.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais où trouver des données. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : où trouver des données fiables et réutilisables pour le projet, et que dit la loi ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Open data : data.gouv.fr, Agreste, INSEE, IFCE.'
    - Métadonnées ; licence ; RGPD.
sources:
    -   type: lien
        titre: ChloroFil — Bac Pro, tronc commun rénové, document d’accompagnement du module MG1
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/bacpro/bacpro-tc-da-MG1.pdf
