titre: 'Séance 14 : Restitution : où implanter la pension ?'
themes:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
problematique: Ma recommandation est-elle convaincante et bien justifiée par les données ?
competences_bo:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
objectifs:
    connaissances:
        - 'Un oral argumenté : question, méthode, résultats chiffrés, recommandation, limites.'
        - On répond aux questions en s’appuyant sur les données.
    competences:
        - Présenter une recommandation argumentée.
        - Évaluer sa démarche.
pourquoi:
    - 'Le projet est fini : tableau de bord (S12) et dossier (S13).'
    - Aujourd’hui, tu présentes ta recommandation comme devant le porteur de projet.
activites:
    -   id: a01
        titre: Préparer l’argumentaire
        consigne: Tu vas préparer trois arguments chiffrés pour ta commune et une réponse à une objection. On attend les arguments et la réponse.
        contenu:
            -   type: etapes
                elements:
                    - Écris 3 arguments chiffrés pour ta commune.
                    - 'Prépare une réponse à l’objection : « Et le prix du terrain ? »'
                    - Pourquoi une objection ? Un vrai client pose toujours des questions.
        questions:
            -   id: q01
                type: texte
                enonce: Écris tes 3 arguments chiffrés et ta réponse à l’objection.
                aide: Écris 3 arguments avec un chiffre chacun pour ta commune, puis l’objection la plus probable et ta réponse honnête.
    -   id: a02
        titre: Présenter
        transition: Tes arguments sont prêts. Présente.
        consigne: Tu vas présenter ta recommandation en 4 minutes et répondre à une question. On attend la question et ta réponse.
        contenu:
            -   type: etapes
                elements:
                    - Présente en 4 minutes avec ton tableau de bord.
                    - Un camarade joue le porteur de projet et pose une question.
                    - Pourquoi 4 minutes ? Le porteur veut l’essentiel.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle question t’a-t-on posée, et qu’as-tu répondu ?
                aide: 'Recopie la question du public et ta réponse : s’appuyait-elle sur une donnée de ton étude ?'
    -   id: a03
        titre: Bilan de la démarche
        transition: Tu as présenté. Fais le bilan.
        consigne: Tu vas faire le bilan de ta démarche de projet de données. On attend une étape réussie et une à améliorer, justifiées.
        contenu:
            -   type: etapes
                elements:
                    - Relis les étapes de S01.
                    - Dis celle que tu as le mieux réussie et celle à améliorer.
                    - Pourquoi un bilan ? En terminale, tu mèneras un projet plus autonome.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle étape de la démarche as-tu le mieux réussie, laquelle dois-tu améliorer, et pourquoi ?
                aide: 'Reprends les 5 étapes (question, collecte, traitement, représentation, décision) : laquelle est la plus solide, laquelle la plus faible ?'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Les données changent chaque année.
        questions:
            -   id: q01
                type: texte
                enonce: Que faudrait-il refaire pour actualiser l’étude ?
                aide: Si les chiffres changent l’an prochain, quelles étapes de ton travail faut-il refaire avec le nouveau fichier ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Le projet est terminé. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : ta recommandation est-elle convaincante et bien justifiée par les données ?'
                aide: Dis ta recommandation, les chiffres qui la justifient, la méthode et ses limites.
retenir:
    - 'Oral argumenté : question, méthode, résultats, recommandation, limites.'
sources:
    -   type: lien
        titre: ChloroFil — Bac Pro, tronc commun rénové, document d’accompagnement du module MG1
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/bacpro/bacpro-tc-da-MG1.pdf
