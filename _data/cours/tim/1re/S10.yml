titre: 'Séance 10 : Le bon graphique pour convaincre'
themes:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
problematique: Quel graphique choisir pour appuyer une décision, sans tromper ?
competences_bo:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
objectifs:
    connaissances:
        - 'Comparer des catégories : barres ; parts d’un tout : secteurs ; deux variables quantitatives : nuage de points ; évolution : courbe.'
        - 'Un graphique honnête : axe à 0 pour les barres, titre, unités, source.'
    competences:
        - Choisir et construire un graphique adapté.
        - Critiquer un graphique.
pourquoi:
    - En S09, tu as résumé les données par territoire.
    - Pour convaincre le porteur de projet, il faut un graphique clair et honnête.
activites:
    -   id: a01
        titre: Quel graphique ?
        consigne: Tu vas choisir le graphique adapté à trois messages du projet. On attend un graphique par message.
        contenu:
            -   type: etapes
                elements:
                    - Lis les trois messages.
                    - Choisis le graphique adapté.
            -   type: paragraphe
                texte: Pourquoi choisir ? Le même chiffre mal représenté peut tromper.
        questions:
            -   id: q01
                type: tableau
                enonce: Quel graphique pour chaque message ?
                colonnes:
                    - Message
                    - Graphique
                lignes:
                    -   - Comparer les prairies par communauté
                        - ''
                    -   - Lien entre population et nombre de centres
                        - ''
                    -   - Évolution du nombre d’équidés de 2015 à 2024
                        - ''
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a02
        titre: Le nuage de points
        transition: Tu sais choisir. Construis le graphique du lien population-centres.
        consigne: Tu vas construire un nuage de points population / nombre de centres et l’interpréter. On attend la tendance et le titre avec la source.
        contenu:
            -   type: etapes
                elements:
                    - Sélectionne les colonnes Population et Centres.
                    - Insertion > Diagramme > XY (dispersion).
                    - Titre, axes avec unités, source.
            -   type: paragraphe
                texte: Pourquoi un nuage ? Il montre si deux variables évoluent ensemble (lien avec les maths).
        questions:
            -   id: q01
                type: texte
                enonce: 'Que montre ton nuage : les communes plus peuplées ont-elles plus de centres ?'
                aide: Une phrase complète qui reprend les mots de la question.
            -   id: q02
                type: texte
                enonce: Écris le titre et la source de ton graphique.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a03
        titre: Un graphique trompeur
        transition: Ton graphique est honnête. Tous ne le sont pas.
        consigne: Tu vas analyser un graphique trompeur sur les prairies (document 1). On attend ce qui trompe et la correction.
        contenu:
            -   type: paragraphe
                texte: 'Document 1 — Diagramme en barres « Prairies : Ytrac écrase Arpajon ! ». Ytrac 2 300 ha, Arpajon 1 900 ha. L’axe vertical va de 1 800 à 2 400 ha.'
            -   type: etapes
                elements:
                    - Lis le graphique décrit (document 1).
                    - Repère ce qui trompe.
                    - Propose une correction.
            -   type: paragraphe
                texte: Pourquoi critiquer ? Le porteur doit pouvoir faire confiance à ton dossier.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, qu’est-ce qui trompe le lecteur, et comment corriger ?
                aide: Retrouve la phrase ou la ligne utile du document, puis commence par « D’après le document… ».
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une corrélation n’est pas une cause.
        questions:
            -   id: q01
                type: texte
                enonce: Les centres sont-ils là À CAUSE de la population ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tes graphiques appuient la décision. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quel graphique choisir pour appuyer une décision, sans tromper ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Barres, secteurs, nuage, courbe selon le message.
    - Titre, unités, source, axe à 0.
sources:
    -   type: lien
        titre: ChloroFil — Bac Pro, tronc commun rénové, document d’accompagnement du module MG1
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/bacpro/bacpro-tc-da-MG1.pdf
