titre: 'Séance 11 : Mettre les données sur une carte'
themes:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
problematique: Comment représenter des données sur une carte pour voir où agir ?
competences_bo:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
objectifs:
    connaissances:
        - Une donnée spatialisée a une position (commune, coordonnées).
        - uMap (OpenStreetMap) crée une carte en ligne à partir d’un fichier CSV avec latitude et longitude.
    competences:
        - Importer des points sur une carte.
        - Lire une carte de données.
pourquoi:
    - En S10, tu as fait des graphiques.
    - Pour une implantation, la carte est l’outil le plus parlant.
activites:
    -   id: a01
        titre: Préparer le fichier
        consigne: Tu vas préparer un fichier CSV avec la commune, son score et ses coordonnées pour la carte. On attend les colonnes de ton fichier.
        contenu:
            -   type: etapes
                elements:
                    - Ajoute à ton fichier les colonnes lat et lon (fournies).
                    - 'Garde : commune, score, lat, lon.'
                    - Exporte en CSV (UTF-8, virgule).
            -   type: paragraphe
                texte: Pourquoi lat et lon ? La carte place chaque commune grâce à ses coordonnées.
        questions:
            -   id: q01
                type: texte
                enonce: Quelles colonnes contient ton CSV d’export ?
                aide: Une phrase complète qui reprend les mots de la question.
            -   id: q02
                type: qcm
                enonce: Que veut dire « lat » ?
                choix:
                    -   id: a
                        texte: Latitude
                    -   id: b
                        texte: Latéral
                    -   id: c
                        texte: Longueur
                aide: Élimine d’abord les réponses impossibles.
    -   id: a02
        titre: Créer la carte
        transition: Le fichier est prêt. Place les communes sur la carte.
        consigne: Tu vas créer une carte uMap des communes colorées selon leur score. On attend la description de ta carte.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre uMap (lien ci-dessous) ; crée une carte (sans compte, lien d’édition à garder).
                    - Importer des données > ton CSV.
                    - Colore les marqueurs selon le score.
            -   type: paragraphe
                texte: Pourquoi colorer ? On voit d’un coup d’œil où sont les communes favorables.
        questions:
            -   id: q01
                type: texte
                enonce: 'Décris ta carte : où se trouvent les communes au meilleur score ?'
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
        ressources:
            -   type: lien
                titre: uMap — créer une carte en ligne (OpenStreetMap)
                url: https://umap.openstreetmap.fr/fr/
    -   id: a03
        titre: Ce que montre la carte
        transition: La carte est faite. Qu’apporte-t-elle ?
        consigne: Tu vas dire ce que la carte apporte de plus que le tableau pour choisir l’implantation. On attend une information et son lien avec la décision.
        contenu:
            -   type: etapes
                elements:
                    - Regarde la carte avec la photo aérienne (Géoportail) à côté.
                    - Repère une information que le tableau ne montrait pas.
                    - Écris.
            -   type: paragraphe
                texte: Pourquoi la carte apporte-t-elle plus ? On voit les distances, les regroupements, les routes.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle information la carte montre-t-elle que le tableau ne montrait pas ?
                aide: Une phrase complète qui reprend les mots de la question.
        ressources:
            -   type: lien
                titre: Géoportail — cartes et photos aériennes de l’IGN
                url: https://www.geoportail.gouv.fr/
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: uMap peut afficher une zone de 20 km autour d’une ville.
        questions:
            -   id: q01
                type: texte
                enonce: À quoi sert-elle pour une pension ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tes données sont sur une carte. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment représenter des données sur une carte pour voir où agir ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Données spatialisées : lat, lon.'
    - 'uMap : import CSV, couleurs.'
sources:
    -   type: lien
        titre: ChloroFil — Bac Pro, tronc commun rénové, document d’accompagnement du module MG1
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/bacpro/bacpro-tc-da-MG1.pdf
