titre: 'Séance 9 : Résumer un grand tableau en un clic'
themes:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
problematique: Comment résumer un fichier de données par catégorie avec un tableau croisé dynamique ?
competences_bo:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
objectifs:
    connaissances:
        - Un tableau croisé dynamique (Données > Table dynamique) regroupe les lignes par catégorie et calcule des totaux, moyennes, effectifs.
        - On choisit les champs de lignes, de colonnes et de données.
    competences:
        - Créer un tableau croisé dynamique.
        - Interpréter un résumé par catégorie.
pourquoi:
    - Le fichier compte 37 communes réparties en 4 communautés de communes.
    - Le porteur veut un résumé par territoire.
activites:
    -   id: a01
        titre: Créer la table
        consigne: Tu vas créer un tableau croisé dynamique qui additionne les prairies par communauté de communes. On attend la communauté qui en a le plus et la valeur.
        contenu:
            -   type: etapes
                elements:
                    - Clique dans le tableau ; Données > Table dynamique > Créer.
                    - 'Champ de ligne : Communauté ; champ de données : Somme de prairies.'
                    - 'OK : une nouvelle feuille s’affiche.'
            -   type: paragraphe
                texte: Pourquoi une table dynamique ? Elle remplace des dizaines de SOMME.SI.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle communauté de communes a le plus de prairies, et combien ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a02
        titre: Ajouter des indicateurs
        transition: La table résume les prairies. Ajoute d’autres indicateurs.
        consigne: Tu vas ajouter des indicateurs à la table dynamique et calculer les prairies par centre. On attend deux valeurs et un territoire justifié.
        contenu:
            -   type: etapes
                elements:
                    - 'Ajoute en champ de données : Somme des centres, Nombre de communes.'
                    - 'Calcule à côté : prairies par centre (= prairies / centres).'
            -   type: paragraphe
                texte: Pourquoi « prairies par centre » ? Plus il y a de prairies par concurrent, plus il reste de place.
        questions:
            -   id: q01
                type: tableau
                enonce: Complète pour deux communautés.
                colonnes:
                    - Communauté
                    - Prairies par centre (ha)
                lignes:
                    -   - Pays de Mauriac
                        - ''
                    -   - Aurillac agglomération
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
            -   id: q02
                type: texte
                enonce: Quelle communauté semble la plus favorable ? Justifie.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a03
        titre: Mettre à jour
        transition: Les données peuvent changer. La table suit-elle ?
        consigne: Tu vas modifier une donnée puis actualiser la table dynamique. On attend la bonne manipulation.
        contenu:
            -   type: etapes
                elements:
                    - Corrige une valeur dans les données (une commune gagne un centre).
                    - Clic droit sur la table > Actualiser.
                    - Observe.
            -   type: paragraphe
                texte: Pourquoi actualiser ? La table ne se recalcule pas toute seule comme une formule.
        questions:
            -   id: q01
                type: qcm
                enonce: Après une modification des données, que faut-il faire ?
                choix:
                    -   id: a
                        texte: Actualiser la table dynamique.
                    -   id: b
                        texte: Rien.
                    -   id: c
                        texte: La supprimer.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: On peut ajouter un champ de colonne (ex. Label oui/non).
        questions:
            -   id: q01
                type: texte
                enonce: Que montre alors la table ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais résumer un grand tableau. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment résumer un fichier de données par catégorie avec un tableau croisé dynamique ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Table dynamique : lignes, données, actualiser.'
    - 'Indicateur dérivé : prairies par centre.'
sources:
    -   type: lien
        titre: ChloroFil — Bac Pro, tronc commun rénové, document d’accompagnement du module MG1
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/bacpro/bacpro-tc-da-MG1.pdf
