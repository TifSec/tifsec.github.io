titre: 'Séance 12 : Construire un tableau de bord pour décider'
themes:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
problematique: Comment rassembler l’essentiel sur une seule page pour décider ?
competences_bo:
    - MG1, C1.2 — Étudier un phénomène social ou professionnel à l’aide de données, notamment en nombre
objectifs:
    connaissances:
        - 'Un tableau de bord : quelques indicateurs clés, un ou deux graphiques, une conclusion, sur une page.'
        - Chaque indicateur a une valeur, une unité et une source.
    competences:
        - Choisir des indicateurs clés.
        - Mettre en page un tableau de bord.
pourquoi:
    - De S07 à S11, tu as calculé, représenté et cartographié.
    - 'Le porteur n’a pas le temps de tout lire : il lui faut une page.'
activites:
    -   id: a01
        titre: Les indicateurs clés
        consigne: Tu vas choisir quatre indicateurs clés pour la commune que tu recommandes. On attend chaque indicateur avec sa valeur et son unité.
        contenu:
            -   type: etapes
                elements:
                    - Choisis 4 indicateurs pour la commune que tu recommandes.
                    - 'Pour chacun : valeur, unité, source.'
            -   type: paragraphe
                texte: Pourquoi 4 ? Au-delà, le lecteur se perd.
        questions:
            -   id: q01
                type: tableau
                enonce: Écris tes 4 indicateurs.
                colonnes:
                    - Indicateur
                    - Valeur et unité
                lignes:
                    -   - ''
                        - ''
                    -   - ''
                        - ''
                    -   - ''
                        - ''
                    -   - ''
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: La mise en page
        transition: Tu as tes indicateurs. Organise la page.
        consigne: Tu vas mettre en page le tableau de bord sur une feuille A4. On attend la description de ta mise en page.
        contenu:
            -   type: etapes
                elements:
                    - Nouvelle feuille « Tableau de bord ».
                    - 'En haut : titre et commune recommandée.'
                    - Les 4 indicateurs en grandes cases ; un graphique ; la carte (capture) ; les sources en bas.
                    - 'Aperçu : tout tient sur une page A4 paysage.'
            -   type: paragraphe
                texte: Pourquoi une page ? Le décideur lit tout en une minute.
        questions:
            -   id: q01
                type: texte
                enonce: Décris la mise en page de ton tableau de bord (zones et ordre).
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a03
        titre: La conclusion
        transition: La page est organisée. Conclus.
        consigne: Tu vas écrire la conclusion de ton tableau de bord avec une recommandation chiffrée et une limite. On attend les deux.
        contenu:
            -   type: etapes
                elements:
                    - 'Écris une conclusion de 2 phrases : recommandation + justification chiffrée.'
                    - Ajoute une limite (ce que les données ne disent pas).
            -   type: paragraphe
                texte: Pourquoi une limite ? Une décision honnête dit aussi ce qu’on ne sait pas.
        questions:
            -   id: q01
                type: texte
                enonce: Recopie ta conclusion et la limite.
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Exporte ton tableau de bord en PDF.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton tableau de bord est prêt. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment rassembler l’essentiel sur une seule page pour décider ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Tableau de bord : 4 indicateurs, graphique, carte, conclusion, sources.'
    - Une page.
sources:
    -   type: lien
        titre: ChloroFil — Bac Pro, tronc commun rénové, document d’accompagnement du module MG1
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/bacpro/bacpro-tc-da-MG1.pdf
