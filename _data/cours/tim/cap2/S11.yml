titre: 'Séance 11 : Un compte rendu de stage bien organisé'
themes:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
problematique: Comment organiser un texte long avec des titres ?
competences_bo:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
objectifs:
    connaissances:
        - Les styles « Titre 1 » et « Titre 2 » organisent un texte en parties.
        - Writer peut faire une table des matières à partir des titres.
    competences:
        - Appliquer des styles de titres.
        - Insérer une table des matières.
pourquoi:
    - Tu dois rendre un compte rendu de stage de plusieurs pages.
    - Les titres aident le lecteur à s’y retrouver.
activites:
    -   id: a01
        titre: Le plan
        consigne: Tu vas choisir le style de trois lignes du plan du compte rendu (document 1). On attend Titre 1 ou Titre 2.
        contenu:
            -   type: code
                texte: "1. Mon lieu de stage\n   1.1 Les installations\n   1.2 Les chevaux\n2. Mes activités\n   2.1 Une journée type"
            -   type: etapes
                elements:
                    - Lis le plan (document 1).
                    - Les grandes parties = Titre 1 ; les sous-parties = Titre 2.
                    - Réponds.
                    - Pourquoi deux niveaux ? Une grande partie contient des petites.
        questions:
            -   id: q01
                type: tableau
                enonce: Quel style pour chaque ligne ?
                colonnes:
                    - Ligne
                    - Style
                lignes:
                    -   - Mon lieu de stage
                        - ''
                    -   - Les chevaux
                        - ''
                    -   - Mes activités
                        - ''
                aide: Les lignes 1. et 2. sont des grandes parties ; les lignes 1.1, 1.2 sont des sous-parties. Quel style pour chacune ?
    -   id: a02
        titre: Appliquer les styles
        transition: Tu connais le plan. Applique les styles.
        consigne: Tu vas appliquer les styles de titres au compte rendu fourni. On attend le nombre de titres et où choisir un style.
        contenu:
            -   type: fichier
                titre: compte rendu de stage à organiser
                url: /assets/fichiers/tim/cap2/compte_rendu.odt
            -   type: etapes
                elements:
                    - Ouvre le fichier compte_rendu.odt (à télécharger ci-dessus) ; enregistre une copie.
                    - Applique Titre 1 et Titre 2 (liste des styles en haut à gauche).
                    - Vérifie dans le Navigateur (F5).
                    - Pourquoi les styles ? Tous les titres ont la même présentation, et Writer les reconnaît.
        questions:
            -   id: q01
                type: texte
                enonce: Combien de titres de niveau 1 et de niveau 2 as-tu ?
                aide: Ouvre le Navigateur (F5) et compte les grands titres puis les sous-titres.
            -   id: q02
                type: qcm
                enonce: Où choisit-on un style ?
                choix:
                    -   id: a
                        texte: Dans la liste des styles (barre d’outils).
                    -   id: b
                        texte: Dans Fichier > Imprimer.
                    -   id: c
                        texte: Dans le correcteur.
                aide: Le style se choisit dans une liste en haut à gauche de la barre d’outils.
    -   id: a03
        titre: La table des matières
        transition: Les titres sont prêts. Writer peut faire le sommaire.
        consigne: Tu vas insérer une table des matières automatique dans ton compte rendu. On attend ce qu’elle contient.
        contenu:
            -   type: etapes
                elements:
                    - Place-toi au début.
                    - Insertion > Table des matières et index > Table des matières > OK.
                    - Vérifie les numéros de page.
                    - Pourquoi une table des matières ? Le lecteur va directement à la partie qu’il veut.
        questions:
            -   id: q01
                type: texte
                enonce: Que contient ta table des matières ?
                aide: 'Regarde ta table des matières : qu’y a-t-il sur chaque ligne ?'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Tu ajoutes une partie.
        questions:
            -   id: q01
                type: texte
                enonce: Comment mettre à jour la table ?
                aide: 'Clic droit sur la table : cherche la commande qui la met à jour.'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton compte rendu est organisé. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment organiser un texte long avec des titres ?'
                aide: 'Dis comment tu as organisé ton compte rendu : styles de titres, Navigateur, table des matières.'
retenir:
    - Titre 1 = partie, Titre 2 = sous-partie.
    - Table des matières automatique.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
