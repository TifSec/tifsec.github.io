titre: 'Séance 16 : Filmer et monter une démonstration de pansage'
themes:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
    - 2.2.3 — Situer le numérique dans son environnement social, économique et culturel
problematique: Comment faire une courte vidéo de démonstration ?
competences_bo:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
    - 2.2.3 — Situer le numérique dans son environnement social, économique et culturel
objectifs:
    connaissances:
        - 'Une vidéo courte (1 minute) : plans courts, téléphone stable, bonne lumière.'
        - On demande l’accord des personnes filmées ; on monte avec un logiciel simple.
    competences:
        - Filmer des plans courts.
        - Monter une vidéo simple.
pourquoi:
    - En S15, tu as fait un diaporama.
    - Une vidéo montre encore mieux les gestes.
activites:
    -   id: a01
        titre: Préparer
        consigne: Tu vas préparer les quatre plans de ta vidéo de pansage et vérifier l’accord des personnes filmées. On attend les plans et ce qu’il faut avant de filmer.
        contenu:
            -   type: etapes
                elements:
                    - Liste 4 plans de 10 à 15 secondes.
                    - Qui sera filmé ? As-tu son accord ?
                    - Pourquoi des plans courts ? Le spectateur reste attentif.
        questions:
            -   id: q01
                type: tableau
                enonce: Écris tes 4 plans.
                colonnes:
                    - Plan
                    - On voit…
                lignes:
                    -   - '1'
                        - ''
                    -   - '2'
                        - ''
                    -   - '3'
                        - ''
                    -   - '4'
                        - ''
                aide: 'Écris un plan par étape du pansage : quel outil, quel geste.'
            -   id: q02
                type: qcm
                enonce: Un camarade est filmé. Que faut-il ?
                choix:
                    -   id: a
                        texte: Son accord.
                    -   id: b
                        texte: Rien.
                    -   id: c
                        texte: Un mot de passe.
                aide: Une personne est filmée. De quoi a-t-on besoin avant ?
    -   id: a02
        titre: Filmer
        transition: Les plans sont prêts. Filme.
        consigne: Tu vas filmer les plans de ta démonstration de pansage. On attend le nombre de plans et la durée du plus long.
        contenu:
            -   type: etapes
                elements:
                    - Téléphone à l’horizontale, tenu à deux mains.
                    - Filme chaque plan, bien éclairé.
                    - Ne filme pas le visage sans accord.
                    - Pourquoi à l’horizontale ? La vidéo remplit l’écran de l’ordinateur.
        questions:
            -   id: q01
                type: texte
                enonce: Combien de plans as-tu filmés, et combien de temps dure le plus long ?
                aide: Compte tes plans et regarde la durée du plus long, en secondes.
    -   id: a03
        titre: Monter
        transition: Les plans sont filmés. Assemble-les.
        consigne: Tu vas monter ta vidéo (ordre, coupes, titre) et l’exporter. On attend la durée et le titre.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre le logiciel de montage (Clipchamp, OpenShot…).
                    - Place les plans dans l’ordre ; coupe ce qui ne sert pas.
                    - Ajoute un titre ; exporte en MP4.
                    - Pourquoi couper ? Les débuts et fins de plans sont souvent flous.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle est la durée de ta vidéo finale, et quel titre as-tu mis ?
                aide: Regarde la durée de la vidéo exportée et recopie ton titre.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Ajoute des sous-titres.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi est-ce utile ?
                aide: Pense à quelqu’un qui regarde sans le son, ou qui entend mal.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ta vidéo est prête. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment faire une courte vidéo de démonstration ?'
                aide: 'Dis les étapes : préparer les plans, demander l’accord, filmer, monter, exporter.'
retenir:
    - Plans courts ; téléphone horizontal ; accord.
    - Monter, titrer, exporter MP4.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
