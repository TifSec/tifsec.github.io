titre: Organiser le suivi de maréchalerie d’une écurie
theme: TIM — Organiser des données avec un tableur
problematique: Quels chevaux proposer en priorité pour le prochain passage du maréchal-ferrant ?
pourquoi: Un tableau bien construit aide à repérer les prochaines échéances et se met à jour quand une date change.
application: Préparer un planning à partir des informations de suivi d’une écurie.
lien_precedent: En séance 2, tu utilisais Calc pour suivre le stock de foin. Tu vas maintenant calculer des dates, trier et filtrer un planning.
prerequis:
    - Saisir des informations dans des cellules.
    - Commencer une formule par = et enregistrer son fichier.
objectifs:
    connaissances:
        - Un tableur peut calculer une date à partir d’une autre date.
    competences:
        - Créer et enregistrer un tableau exploitable.
        - Recopier des formules, trier et filtrer les données.
        - Expliquer un choix à partir des résultats.
notions:
    - titre: Deux lieux de travail
      texte: Le vrai tableau est à créer dans Calc ou Excel, dans ton fichier .ods ou .xlsx. Ici, écris les formules utilisées, ta démarche et quelques résultats. Le site sauvegarde ces réponses ; il ne sauvegarde pas ton fichier de tableur.
    - titre: Une date peut se calculer
      texte: Une semaine compte 7 jours. Ajouter un nombre de jours à une cellule contenant une date donne une nouvelle date. Si un nombre s’affiche à la place d’une date, applique le format Date.
    - titre: Un exercice, pas une prescription
      texte: Toutes les dates et les règles de ce planning sont fictives. Pour cet exercice, nous utiliserons une fenêtre de 4 à 6 semaines. Le suivi réel se décide avec les professionnels, selon le cheval et son activité.
activites:
    - id: a01
      titre: Créer et enregistrer le fichier
      pourquoi: Retrouver ton travail à la prochaine séance.
      demarche:
          - Ouvre Calc ou Excel et crée un classeur.
          - Dans CAPA2_TIM/02_Travaux/S03, enregistre-le sous CAPA2_S03_NOM_Prenom.ods (ou .xlsx dans Excel).
          - Enregistre régulièrement pendant la séance.
      contenu:
          - type: paragraphe
            texte: Garde le tableur ouvert à côté du site. Tu ne dois pas refaire ici tout le tableau.
      questions:
          - id: q01
            type: texte
            enonce: Quel est le nom de ton fichier et dans quel dossier l’as-tu enregistré ?
      ressources: []
    - id: a02
      titre: Construire le tableau de suivi
      pourquoi: Calculer une fois, puis recopier la formule pour les autres chevaux.
      demarche:
          - "Dans A1:F1, saisis les titres : Cheval ; Dernière intervention ; Type ; Début à 4 semaines ; Fin à 6 semaines ; Situation au 25/09/2026."
          - Recopie les six lignes du dossier dans A2:C7. Vérifie que les dates sont reconnues comme des dates.
          - Dans D2, calcule la date 4 semaines après B2. Recopie jusqu’à D7.
          - Dans E2, calcule la date 6 semaines après B2. Recopie jusqu’à E7. Enregistre.
      contenu:
          - type: tableau
            titre: Dossier fictif de l’écurie
            colonnes:
                - Cheval
                - Dernière intervention
                - Type
            lignes:
                - - Apache
                  - 20/08/2026
                  - Parage
                - - Baya
                  - 28/08/2026
                  - Ferrure
                - - Calypso
                  - 03/09/2026
                  - Ferrure
                - - Django
                  - 14/08/2026
                  - Ferrure
                - - Étoile
                  - 31/08/2026
                  - Parage
                - - Flash
                  - 07/09/2026
                  - Ferrure
          - type: paragraphe
            texte: "Pour commencer : dans D2, =B2+28 ajoute 28 jours à la date de B2. La poignée en bas à droite de la cellule permet de recopier la formule. Vérifie que B2 devient B3 sur la ligne suivante."
      questions:
          - id: q01
            type: texte
            enonce: Quelle formule as-tu saisie en E2 pour calculer la fin à 6 semaines ?
          - id: q02
            type: texte
            enonce: Après recopie, quelle formule lis-tu dans E4 ? Clique sur E4 et regarde la barre de formule.
          - id: q03
            type: tableau
            enonce: Avant de modifier les dates, recopie ces quatre résultats de ton fichier.
            colonnes:
                - Cheval
                - Début à 4 semaines
                - Fin à 6 semaines
            lignes:
                - - Apache
                  - ""
                  - ""
                - - Django
                  - ""
                  - ""
      ressources:
          - type: paragraphe
            texte: Dans l’aide LibreOffice, repère comment calculer avec une date et choisir le format d’affichage. Le principe d’ajout de jours fonctionne aussi dans Excel.
          - type: lien
            titre: LibreOffice — calculs avec les dates
            url: https://help.libreoffice.org/latest/fr/text/scalc/guide/calc_date.html
    - id: a03
      titre: Repérer les interventions à organiser
      pourquoi: Distinguer ce qui est à prévoir de ce qui devient prioritaire.
      demarche:
          - Pour tout l’exercice, place-toi au 25/09/2026, même si nous sommes un autre jour.
          - Complète F2:F7 avec les règles du dossier.
          - Tu peux écrire les situations à la main. L’automatisation est un défi facultatif.
      contenu:
          - type: liste
            elements:
                - "Avant le début à 4 semaines : À venir."
                - "Du début à 4 semaines jusqu’à la veille de la fin à 6 semaines : À organiser maintenant."
                - "Le jour de la fin à 6 semaines ou après : Prioritaire."
      questions:
          - id: q01
            type: tableau
            enonce: Quelle situation as-tu attribuée à ces chevaux au 25/09/2026 ?
            colonnes:
                - Cheval
                - Situation
            lignes:
                - - Apache
                  - ""
                - - Calypso
                  - ""
                - - Django
                  - ""
      ressources:
          - type: paragraphe
            texte: Dans la page IFCE, cherche le passage consacré à la maréchalerie. Repère pourquoi la fréquence doit être adaptée au cheval. Utilise ensuite uniquement les règles fictives du dossier pour les calculs.
          - type: lien
            titre: IFCE — soins courants
            url: https://equipedia.ifce.fr/sante-et-bien-etre-animal/soin-prevention-et-medication/soin/soins-courants
    - id: a04
      titre: Trier, filtrer et proposer un planning
      pourquoi: Lire les priorités sans perdre les informations d’un cheval.
      demarche:
          - "Sélectionne tout le tableau A1:F7 : les informations d’un cheval doivent rester sur la même ligne."
          - Trie sur Fin à 6 semaines, de la date la plus ancienne à la plus récente.
          - Active un filtre et affiche À organiser maintenant et Prioritaire. Si ton logiciel ne permet pas les deux à la fois, consulte les deux situations successivement.
          - Le maréchal peut prendre trois chevaux le 30/09/2026. Propose un ordre en tenant compte des échéances. Puis réaffiche toutes les lignes.
      contenu:
          - type: paragraphe
            texte: Trier range les lignes ; filtrer en masque certaines temporairement. Aucune ligne ne doit être supprimée.
      questions:
          - id: q01
            type: texte
            enonce: Quel cheval apparaît en premier après le tri ? Explique aussi comment tu as évité de mélanger ses informations avec celles d’un autre cheval.
          - id: q02
            type: texte
            enonce: Quels trois chevaux proposes-tu pour le 30/09 ? Justifie l’ordre avec les dates de ton tableau.
      ressources: []
    - id: a05
      titre: Corriger une donnée et observer
      pourquoi: Comprendre l’intérêt des formules lorsqu’une information change.
      demarche:
          - "Réaffiche toutes les lignes et retrouve Apache par son nom : après le tri, il n’est plus forcément ligne 2."
          - Sa dernière intervention a en réalité eu lieu le 10/09/2026. Modifie uniquement sa date en colonne B.
          - Observe D et E. Mets sa situation à jour, puis revois ton planning. Enregistre le fichier.
      contenu: []
      questions:
          - id: q01
            type: tableau
            enonce: Quels sont maintenant les résultats pour Apache ?
            colonnes:
                - Cheval
                - Début à 4 semaines
                - Fin à 6 semaines
                - Situation au 25/09
            lignes:
                - - Apache
                  - ""
                  - ""
                  - ""
          - id: q02
            type: texte
            enonce: Qu’est-ce qui s’est recalculé tout seul ? Qu’as-tu dû modifier à la main ?
          - id: q03
            type: texte
            enonce: Pourquoi faut-il vérifier les informations du tableau avant de transmettre le planning ? Donne un exemple à partir d’Apache.
      ressources: []
    - id: a06
      titre: "Défi : automatiser la situation"
      pourquoi: Éviter de ressaisir une situation à chaque mise à jour.
      demarche:
          - Ajoute une cellule contenant la date de référence 25/09/2026.
          - Cherche comment utiliser SI pour comparer cette date aux deux échéances.
          - Teste la formule sur Django, puis Apache. Fais expliquer un résultat à un camarade.
      contenu:
          - type: paragraphe
            texte: "Défi facultatif : il ne conditionne ni la fin de la séance ni la note. Garde ta version fonctionnelle avant d’essayer."
      questions: []
      ressources: []
      facultatif: true
bilan: "Une formule relie les données : quand la date de départ change, les échéances se recalculent. Un tri organise les lignes ; un filtre aide à lire les priorités. Vérifie ton fichier enregistré et tes réponses sur le site avant d’indiquer que tu as terminé."
reperes_officiels:
    - type: paragraphe
      texte: "Repères CAP agricole : mobiliser des outils numériques et organiser des informations dans une situation professionnelle. La page ministérielle permet de retrouver les référentiels de la formation."
    - type: lien
      titre: Chlorofil — référentiels du CAP agricole
      url: https://chlorofil.fr/diplomes/secondaire/capa
