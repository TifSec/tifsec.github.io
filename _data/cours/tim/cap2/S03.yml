titre: 'Séance 3 : Organiser le suivi du maréchal-ferrant'
themes:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
problematique: Comment le tableur peut-il calculer la date du prochain passage du maréchal ?
competences_bo:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
objectifs:
    connaissances:
        - Une date + un nombre de jours = une nouvelle date.
        - Les pieds se parent ou se ferrent environ toutes les 6 à 8 semaines.
    competences:
        - Calculer une date avec une formule.
        - Trier par date.
pourquoi:
    - En S02, tu as calculé un stock.
    - 'Le maréchal passe régulièrement : il faut savoir quand le rappeler pour chaque cheval.'
activites:
    -   id: a01
        titre: Combien de jours ?
        consigne: Tu vas convertir en jours le délai entre deux passages du maréchal. On attend le nombre de jours et la raison de ces passages.
        contenu:
            -   type: etapes
                elements:
                    - Le maréchal revient toutes les 7 semaines.
                    - Calcule le nombre de jours.
            -   type: paragraphe
                texte: Pourquoi en jours ? Calc ajoute des jours à une date.
        questions:
            -   id: q01
                type: nombre
                enonce: Combien de jours font 7 semaines ?
                unite: jours
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: qcm
                enonce: Pourquoi le maréchal passe-t-il régulièrement ?
                choix:
                    -   id: a
                        texte: La corne pousse et doit être parée.
                    -   id: b
                        texte: Pour discuter.
                    -   id: c
                        texte: Les fers changent de couleur.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a02
        titre: La prochaine date
        transition: Tu connais le délai. Calcule les dates.
        consigne: Tu vas calculer dans Calc la date du prochain passage du maréchal pour chaque cheval (document 1). On attend la date de Tango et une formule.
        contenu:
            -   type: tableau
                titre: Document 1 — Derniers passages (fictifs)
                colonnes:
                    - ''
                    - A
                    - B
                lignes:
                    -   - '1'
                        - Cheval
                        - Dernier passage
                    -   - '2'
                        - Tango
                        - 03/10/2026
                    -   - '3'
                        - Iris
                        - 17/09/2026
                    -   - '4'
                        - Nuage
                        - 10/10/2026
                    -   - '5'
                        - Belle
                        - 24/09/2026
            -   type: etapes
                elements:
                    - Ouvre Calc ; enregistre marechal.ods.
                    - Recopie le document 1.
                    - 'En C2 : =B2+49 ; tire jusqu’en C5.'
            -   type: paragraphe
                texte: Pourquoi une formule ? Si une date change, la prochaine se recalcule.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle est la prochaine date pour Tango ?
                aide: Une phrase complète qui reprend les mots de la question.
            -   id: q02
                type: texte
                enonce: Écris la formule de C4.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a03
        titre: Trier pour appeler
        transition: Les dates sont calculées. Qui est le plus urgent ?
        consigne: Tu vas trier les chevaux par date de prochain passage pour savoir qui appeler en premier. On attend le cheval et sa date.
        contenu:
            -   type: etapes
                elements:
                    - Sélectionne A1:C5.
                    - 'Données > Trier : par la colonne C, ordre croissant.'
                    - Lis le premier cheval.
            -   type: paragraphe
                texte: Pourquoi trier ? Le premier de la liste est le plus urgent.
        questions:
            -   id: q01
                type: texte
                enonce: Quel cheval doit voir le maréchal en premier, et à quelle date ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un cheval a besoin d’un passage toutes les 6 semaines.
        questions:
            -   id: q01
                type: texte
                enonce: Comment adapter sa formule ?
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Le suivi du maréchal est prêt. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment le tableur peut-il calculer la date du prochain passage du maréchal ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Date + 49 = 7 semaines plus tard.
    - Trier par date = le plus urgent en premier.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
