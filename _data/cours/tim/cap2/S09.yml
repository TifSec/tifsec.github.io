titre: 'Séance 9 : Le budget alimentation du mois'
themes:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
problematique: Combien coûte l’alimentation de l’écurie chaque mois ?
competences_bo:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
objectifs:
    connaissances:
        - Coût = quantité × prix.
        - On recopie la formule et on fait le total avec SOMME ; format monétaire.
    competences:
        - Calculer des coûts.
        - Faire un budget avec un total.
pourquoi:
    - Le gérant veut connaître le coût des aliments du mois.
    - Tu fais le budget dans Calc.
activites:
    -   id: a01
        titre: Les coûts
        consigne: Tu vas calculer le coût de chaque aliment du mois (document 1). On attend le coût des granulés et une formule.
        contenu:
            -   type: tableau
                titre: Document 1 — Achats du mois (fictifs)
                colonnes:
                    - ''
                    - A
                    - B
                    - C
                lignes:
                    -   - '1'
                        - Aliment
                        - Quantité
                        - Prix unitaire (€)
                    -   - '2'
                        - Granulés (sac)
                        - '10'
                        - '17'
                    -   - '3'
                        - Foin (botte)
                        - '6'
                        - '45'
                    -   - '4'
                        - Seau minéral
                        - '3'
                        - '20'
            -   type: etapes
                elements:
                    - Ouvre Calc ; enregistre budget_alim.ods.
                    - Recopie le document 1.
                    - 'En D2 : =B2*C2 ; tire jusqu’en D4.'
            -   type: paragraphe
                texte: Pourquoi quantité × prix ? 10 sacs à 17 € coûtent 10 × 17.
        questions:
            -   id: q01
                type: nombre
                enonce: Quel est le coût des granulés (D2) ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: texte
                enonce: Écris la formule de D3.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a02
        titre: Le total
        transition: Chaque coût est calculé. Fais le total.
        consigne: Tu vas calculer le total du budget alimentation et l’afficher en euros. On attend le total et son affichage.
        contenu:
            -   type: etapes
                elements:
                    - 'En D5 : =SOMME(D2:D4).'
                    - Format monétaire sur la colonne D.
                    - Écris « Total » en A5.
            -   type: paragraphe
                texte: Pourquoi le format € ? Le gérant lit tout de suite des euros.
        questions:
            -   id: q01
                type: nombre
                enonce: Quel est le total du mois ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: qcm
                enonce: Comment s’affiche 170 avec le format monétaire ?
                choix:
                    -   id: a
                        texte: 170,00 €
                    -   id: b
                        texte: '170'
                    -   id: c
                        texte: €170
                aide: Élimine d’abord les réponses impossibles.
    -   id: a03
        titre: Et si le foin augmente ?
        transition: Le budget est fait. Les prix changent souvent.
        consigne: Tu vas changer le prix du foin et observer le nouveau total. On attend le total et l’augmentation.
        contenu:
            -   type: etapes
                elements:
                    - 'Le foin passe à 50 € la botte : change C3.'
                    - Regarde le total.
                    - Écris.
            -   type: paragraphe
                texte: Pourquoi tester ? Tu vois que tout se recalcule.
        questions:
            -   id: q01
                type: nombre
                enonce: Quel est le nouveau total ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: texte
                enonce: De combien le budget augmente-t-il ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le budget est pour 5 chevaux.
        questions:
            -   id: q01
                type: texte
                enonce: Combien par cheval ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Le budget est prêt. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : combien coûte l’alimentation de l’écurie chaque mois ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Coût = quantité × prix.
    - SOMME + format €.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
