titre: 'Séance 12 : La fiche technique d’un soin avec photos'
themes:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
problematique: Comment présenter un soin pas à pas avec des photos ?
competences_bo:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
objectifs:
    connaissances:
        - 'Un tableau à 2 colonnes : photo à gauche, explication à droite.'
        - Chaque photo a une légende.
    competences:
        - Insérer des images dans un tableau.
        - Légender une image.
pourquoi:
    - En S11, tu as organisé un texte.
    - Aujourd’hui, tu fais la fiche technique du « graissage des sabots » pour les stagiaires.
activites:
    -   id: a01
        titre: Les étapes
        consigne: Tu vas remettre dans l’ordre les étapes du graissage des sabots (document 1). On attend un numéro par étape.
        contenu:
            -   type: liste
                elements:
                    - Graisser la paroi au pinceau
                    - Curer le pied
                    - Brosser le sabot
                    - Laisser sécher avant de sortir
            -   type: etapes
                elements:
                    - Lis les étapes (document 1), dans le désordre.
                    - Remets-les dans l’ordre.
            -   type: paragraphe
                texte: Pourquoi l’ordre ? Un stagiaire suit la fiche ligne par ligne.
        questions:
            -   id: q01
                type: tableau
                enonce: Remets les étapes dans l’ordre (1 à 4).
                colonnes:
                    - Étape
                    - Ordre
                lignes:
                    -   - Graisser la paroi au pinceau
                        - ''
                    -   - Curer le pied
                        - ''
                    -   - Brosser le sabot
                        - ''
                    -   - Laisser sécher avant de sortir
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: Le tableau photo + texte
        transition: L’ordre est trouvé. Construis la fiche.
        consigne: Tu vas construire la fiche avec un tableau photo + explication pour chaque étape. On attend une phrase d’étape et comment insérer l’image.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Writer ; enregistre fiche_graissage.odt.
                    - Tableau de 2 colonnes, 4 lignes.
                    - 'À gauche : une photo fournie ; à droite : l’étape en une phrase.'
            -   type: paragraphe
                texte: Pourquoi un tableau ? Chaque photo reste à côté de son explication.
        questions:
            -   id: q01
                type: texte
                enonce: Recopie la phrase de l’étape 3.
                aide: Une phrase complète qui reprend les mots de la question.
            -   id: q02
                type: qcm
                enonce: Comment mettre une image dans une case ?
                choix:
                    -   id: a
                        texte: Clic dans la case puis Insertion > Image.
                    -   id: b
                        texte: Copier le texte.
                    -   id: c
                        texte: Impossible.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a03
        titre: Légendes et export
        transition: La fiche est remplie. Termine-la.
        consigne: Tu vas légender les photos de ta fiche de graissage des sabots, puis exporter la fiche en PDF. On attend une de tes légendes.
        contenu:
            -   type: etapes
                elements:
                    - Clic droit sur chaque photo > Insérer une légende.
                    - Titre en haut (Titre 1).
                    - Exporte en PDF.
            -   type: paragraphe
                texte: Pourquoi une légende ? Elle dit ce que montre la photo.
        questions:
            -   id: q01
                type: texte
                enonce: Écris la légende d’une de tes photos.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Ajoute un encadré « Attention ».
        questions:
            -   id: q01
                type: texte
                enonce: Quel conseil de sécurité mettrais-tu ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ta fiche technique est prête. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment présenter un soin pas à pas avec des photos ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Tableau photo | texte.
    - Légende sur chaque photo.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
