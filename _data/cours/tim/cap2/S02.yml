titre: 'Séance 2 : Prévoir le stock de foin de l’écurie'
themes:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
problematique: Combien de jours le stock de foin va-t-il durer ?
competences_bo:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
objectifs:
    connaissances:
        - Le tableur calcule la consommation totale et le nombre de jours de stock.
        - Stock ÷ consommation par jour = nombre de jours.
    competences:
        - Calculer une consommation totale.
        - Calculer une durée de stock.
pourquoi:
    - En S01, tu as revu SOMME.
    - Le gérant veut savoir quand recommander du foin.
activites:
    -   id: a01
        titre: La consommation
        consigne: Tu vas calculer dans Calc la consommation de foin par jour de toute l’écurie (document 1). On attend le total et la formule.
        contenu:
            -   type: tableau
                titre: Document 1 — Foin par jour (fictif)
                colonnes:
                    - ''
                    - A
                    - B
                lignes:
                    -   - '1'
                        - Cheval
                        - Foin (kg/jour)
                    -   - '2'
                        - Tango
                        - '9'
                    -   - '3'
                        - Iris
                        - '8'
                    -   - '4'
                        - Nuage
                        - '6'
                    -   - '5'
                        - Galopin
                        - '10'
                    -   - '6'
                        - Belle
                        - '7'
            -   type: etapes
                elements:
                    - Ouvre Calc ; enregistre stock_foin.ods dans TIM > Calc.
                    - Recopie le document 1.
                    - En B7, calcule la consommation par jour avec SOMME.
            -   type: paragraphe
                texte: Pourquoi le total d’abord ? On a besoin de ce que mange toute l’écurie.
        questions:
            -   id: q01
                type: nombre
                enonce: Quelle est la consommation de l’écurie par jour ?
                unite: kg
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: texte
                enonce: Écris la formule de B7.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a02
        titre: Combien de jours ?
        transition: Tu connais la consommation. Combien de temps dure le stock ?
        consigne: Tu vas calculer avec Calc combien de jours dure un stock de 1 200 kg de foin. On attend le nombre de jours et la formule.
        contenu:
            -   type: etapes
                elements:
                    - 'Le stock est de 1 200 kg : écris-le en B9.'
                    - En B10, tape =B9/B7.
                    - Lis le résultat.
            -   type: paragraphe
                texte: Pourquoi diviser ? On cherche combien de fois 40 kg rentrent dans 1 200 kg.
        questions:
            -   id: q01
                type: nombre
                enonce: Combien de jours le stock va-t-il durer ?
                unite: jours
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: texte
                enonce: Écris la formule de B10.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a03
        titre: Quand commander ?
        transition: Tu sais combien dure le stock. Quand faut-il commander ?
        consigne: Tu vas calculer quand commander le foin pour tenir compte du délai de livraison. On attend le jour de commande et l’effet d’un départ.
        contenu:
            -   type: etapes
                elements:
                    - Le fournisseur livre en 7 jours.
                    - Il faut commander avant qu’il reste moins de 7 jours de stock.
                    - Réponds.
            -   type: paragraphe
                texte: Pourquoi 7 jours d’avance ? Sinon les chevaux manquent de foin avant la livraison.
        questions:
            -   id: q01
                type: nombre
                enonce: Au bout de combien de jours faut-il commander au plus tard ?
                unite: jours
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: texte
                enonce: Que se passe-t-il si Galopin part en pension ailleurs ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Une botte pèse 250 kg.
        questions:
            -   id: q01
                type: texte
                enonce: Combien de bottes faut-il pour 30 jours ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais prévoir le stock. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : combien de jours le stock de foin va-t-il durer ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Stock ÷ consommation/jour = jours.
    - Commander avant la fin, avec le délai.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
