titre: 'Séance 19 : Les démarches en ligne pour un équidé'
themes:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
problematique: Quelles démarches fait-on en ligne pour un cheval ?
competences_bo:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
objectifs:
    connaissances:
        - Les démarches pour les équidés (changement de propriétaire, déclaration de détenteur) se font en ligne sur le site de l’IFCE (SIRE).
        - On ne donne jamais ses identifiants ; on vérifie l’adresse du site officiel.
    competences:
        - Connaître des démarches en ligne.
        - Reconnaître le site officiel.
pourquoi:
    - Quand un cheval est vendu ou arrive dans une écurie, il y a des démarches.
    - Aujourd’hui, tu les découvres par des captures d’écran, sans vrai compte.
activites:
    -   id: a01
        titre: Quelles démarches ?
        consigne: Tu vas associer deux situations aux démarches en ligne décrites par l’IFCE (document 1). On attend une démarche par situation.
        contenu:
            -   type: citation
                texte: 'Document 1 — Extrait adapté de l’IFCE : « Le changement de propriétaire est enregistré auprès du SIRE. Toute personne qui détient un équidé, même pour un autre propriétaire, se déclare comme détenteur. Ces démarches se font en ligne. »'
            -   type: lien
                titre: IFCE — Équipédia (fiches techniques sur le cheval)
                url: https://equipedia.ifce.fr/
            -   type: etapes
                elements:
                    - Lis le document 1.
                    - Associe chaque situation à une démarche.
            -   type: paragraphe
                texte: 'Pourquoi déclarer ? On sait toujours où est un cheval : c’est utile en cas de maladie.'
        questions:
            -   id: q01
                type: tableau
                enonce: Associe la situation à la démarche.
                colonnes:
                    - Situation
                    - Démarche
                lignes:
                    -   - Un cheval est vendu
                        - ''
                    -   - Une écurie accueille des chevaux
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: Lire une capture
        transition: Tu connais les démarches. Regarde un formulaire.
        consigne: Tu vas lire une capture d’écran d’un formulaire de démarche et relever les informations demandées. On attend trois informations.
        contenu:
            -   type: etapes
                elements:
                    - Regarde la capture d’écran fournie (formulaire de démonstration).
                    - Repère les informations demandées.
                    - Réponds.
            -   type: paragraphe
                texte: Pourquoi une capture ? On découvre sans risque de faire une vraie déclaration.
        questions:
            -   id: q01
                type: texte
                enonce: Cite trois informations demandées dans le formulaire.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a03
        titre: Le bon site
        transition: Tu connais le formulaire. Attention au site !
        consigne: Tu vas reconnaître le site officiel de l’IFCE parmi deux adresses. On attend le bon site et le danger de l’autre.
        contenu:
            -   type: etapes
                elements:
                    - Lis les deux adresses.
                    - Choisis le site officiel.
            -   type: paragraphe
                texte: Pourquoi vérifier ? Des faux sites font payer des démarches gratuites.
        questions:
            -   id: q01
                type: qcm
                enonce: Quel est le site officiel de l’IFCE ?
                choix:
                    -   id: a
                        texte: https://www.ifce.fr
                    -   id: b
                        texte: https://ifce-demarches-rapides.com
                    -   id: c
                        texte: Les deux
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Pourquoi ne pas utiliser le deuxième site ?
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Le site demande ton identifiant.
        questions:
            -   id: q01
                type: texte
                enonce: À qui peux-tu le donner ?
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu connais les démarches en ligne. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quelles démarches fait-on en ligne pour un cheval ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Démarches équidés : sur ifce.fr (SIRE).'
    - Vérifier l’adresse ; identifiants secrets.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
