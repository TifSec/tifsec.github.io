titre: 'Séance 5 : Envoyer une photo et un message au vétérinaire'
themes:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
problematique: Comment décrire clairement un problème de santé par courriel, avec une photo ?
competences_bo:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
objectifs:
    connaissances:
        - 'Un message au vétérinaire est précis : quel cheval, quoi, depuis quand, ce qu’on a fait.'
        - Une photo allégée et nette aide le diagnostic ; on met le responsable en copie (Cc).
    competences:
        - Rédiger un message précis.
        - Joindre une photo légère ; utiliser Cc.
pourquoi:
    - En CAPa 1, tu as écrit à ton maître de stage.
    - 'Aujourd’hui, Tango boite : le gérant te demande d’écrire au vétérinaire.'
activites:
    -   id: a01
        titre: Les informations utiles
        consigne: Tu vas garder dans tes observations (document 1) les informations utiles au vétérinaire. On attend quatre informations.
        contenu:
            -   type: liste
                elements:
                    - 'Cheval : Tango, 9 ans.'
                    - Il boite de l’antérieur droit depuis ce matin.
                    - La jambe est chaude et un peu gonflée.
                    - J’ai fait une douche froide 10 minutes.
                    - Il a bien mangé.
                    - Il pleut depuis 3 jours.
            -   type: etapes
                elements:
                    - Lis ce que tu as observé (document 1).
                    - Garde ce qui aide le vétérinaire.
                    - Range.
                    - Pourquoi précis ? Le vétérinaire décide s’il vient tout de suite.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, écris les 4 informations utiles pour le vétérinaire.
                aide: 'Dans le document 1, relève : quel cheval, quel symptôme, depuis quand, et ce qui a déjà été fait.'
    -   id: a02
        titre: Le courriel
        transition: Tu as les informations. Écris le message.
        consigne: Tu vas écrire le courriel au vétérinaire avec le gérant en copie. On attend le courriel complet et qui est en copie.
        contenu:
            -   type: etapes
                elements:
                    - 'À : le vétérinaire ; Cc : le gérant.'
                    - 'Objet : « Tango boite — antérieur droit ».'
                    - Message court avec les 4 informations ; politesse ; signature.
                    - Pourquoi le gérant en Cc ? Il est informé, mais c’est le vétérinaire qui répond.
        questions:
            -   id: q01
                type: texte
                enonce: Écris ton courriel complet.
                aide: 'Écris ton courriel dans l’ordre : objet précis, « Bonjour Docteur », les informations, ta demande, politesse, signature.'
            -   id: q02
                type: qcm
                enonce: Qui mets-tu en Cc ?
                choix:
                    -   id: a
                        texte: Le gérant
                    -   id: b
                        texte: Le vétérinaire
                    -   id: c
                        texte: Personne
                aide: 'Qui doit être au courant sans être le destinataire principal : le gérant, un client, un ami ?'
    -   id: a03
        titre: La photo
        transition: Le message est prêt. Ajoute une photo utile.
        consigne: Tu vas alléger la photo de la jambe et la joindre au courriel. On attend les poids et le nom de la photo.
        contenu:
            -   type: etapes
                elements:
                    - 'Photo fournie : jambe de cheval (4 Mo).'
                    - Réduis-la à 1 200 pixels de large.
                    - Joins-la et envoie le courriel à toi-même.
                    - Pourquoi alléger ? Une photo lourde met du temps à arriver sur le téléphone du vétérinaire.
        questions:
            -   id: q01
                type: texte
                enonce: Écris le poids de la photo avant et après, et son nom.
                aide: Regarde le poids de la photo avant et après l’avoir réduite (clic droit > Propriétés), puis son nom.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: C’est grave et urgent (cheval couché qui se roule).
        questions:
            -   id: q01
                type: texte
                enonce: Courriel ou téléphone ?
                aide: 'Le cheval saigne beaucoup : le vétérinaire lira-t-il le courriel assez vite ?'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Le vétérinaire est prévenu. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment décrire clairement un problème de santé par courriel, avec une photo ?'
                aide: Dis les informations à donner, les parties du courriel et ce qu’on fait de la photo.
retenir:
    - 'Message : quel cheval, quoi, depuis quand, ce qu’on a fait.'
    - Photo allégée ; Cc ; urgence = téléphone.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
