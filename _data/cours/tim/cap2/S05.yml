titre: Communiquer avec un professionnel par courriel
theme: TIM — Communiquer avec un professionnel par courriel
problematique: Communiquer avec un professionnel par courriel
pourquoi: "Objectif de cette séance : Comprendre les règles principales d'un courriel professionnel."
application: Nous retrouvons Mistral, le cheval arrivé dans l'écurie lors de la séance précédente.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Comprendre les règles principales d'un courriel professionnel.
        - Comprendre pourquoi l'objet d'un message est important.
        - Comprendre qu'une pièce jointe doit être choisie en fonction du destinataire et de l'objectif du message.
        - Comprendre qu'il ne faut pas transmettre inutilement des données personnelles.
    competences:
        - Rédiger un courriel professionnel clair et concis.
        - Choisir un objet pertinent.
        - Ajouter et vérifier une pièce jointe.
        - Identifier les informations réellement utiles au destinataire.
        - Créer un brouillon et le relire avant tout envoi.
activites:
    - id: a03
      titre: 1. Préparez votre espace de travail
      contenu:
          - type: paragraphe
            texte: "Dans votre dossier CAPA2_TIM/02_Travaux, créez un nouveau dossier nommé :"
          - type: paragraphe
            texte: S05
          - type: paragraphe
            texte: Vous conserverez dans ce dossier les éventuels documents utilisés pendant la séance.
      questions: []
    - id: a04
      titre: 2. Situation professionnelle
      contenu:
          - type: paragraphe
            texte: Nous retrouvons Mistral, le cheval arrivé dans l'écurie lors de la séance précédente.
          - type: paragraphe
            texte: Son propriétaire souhaite prochainement participer avec lui à différentes activités équestres.
          - type: paragraphe
            texte: Le responsable de l'écurie souhaite donc demander au vétérinaire de vérifier que les informations concernant ses vaccinations sont correctement enregistrées et de lui indiquer si une intervention doit être programmée.
          - type: paragraphe
            texte: Vous devez préparer le courriel qui sera envoyé au vétérinaire.
          - type: paragraphe
            texte: "Attention : pendant cette activité, vous préparez uniquement un brouillon. Aucun message ne doit être envoyé à un véritable professionnel."
      questions: []
    - id: a05
      titre: "3. Avant d'écrire : vérifier l'information"
      contenu:
          - type: paragraphe
            texte: "Consultez la ressource suivante :"
          - type: paragraphe
            texte: "Source professionnelle : IFCE – équipédia, La réglementation vaccinale en France ."
          - type: lien
            titre: La réglementation vaccinale en France
            url: https://equipedia.ifce.fr/sante-et-bien-etre-animal/soin-prevention-et-medication/prevention/reglementation-vaccinale-en-france
          - type: paragraphe
            texte: "À partir de cette page, répondez aux questions suivantes dans votre document de travail ou dans une zone de brouillon :"
      questions:
          - id: q01
            type: texte
            enonce: En France, toutes les vaccinations des chevaux sont-elles obligatoires par l'État ?
            suite: []
          - id: q02
            type: texte
            enonce: Dans quelles situations certaines vaccinations peuvent-elles devenir obligatoires ?
            suite: []
          - id: q03
            type: texte
            enonce: Qui réalise et enregistre les vaccinations dans le document d'identification ?
            suite: []
          - id: q04
            type: texte
            enonce: Quelles informations permettent de conserver une trace de la vaccination dans ce document ?
            suite: []
    - id: a06
      titre: "4. Une information importante : ne pas envoyer trop de données"
      contenu:
          - type: paragraphe
            texte: Lorsque l'on communique avec un professionnel, il ne faut pas nécessairement lui transmettre tout le dossier dont on dispose.
          - type: paragraphe
            texte: "La CNIL rappelle le principe de minimisation des données :"
          - type: paragraphe
            texte: les informations utilisées ou transmises doivent être pertinentes et limitées à ce qui est réellement nécessaire pour l'objectif recherché.
          - type: paragraphe
            texte: "Source : CNIL, Minimisation des données ."
          - type: lien
            titre: Minimisation des données
            url: https://www.cnil.fr/fr/definition/minimisation
          - type: paragraphe
            texte: "Imaginez que la fiche d'accueil complète de Mistral contienne :"
          - type: liste
            elements:
                - le nom du cheval ;
                - son numéro SIRE ;
                - les coordonnées personnelles de sa propriétaire ;
                - son adresse ;
                - un contact d'urgence ;
                - sa date d'arrivée ;
                - des observations internes à l'écurie.
          - type: paragraphe
            texte: Le vétérinaire a-t-il besoin de recevoir automatiquement toutes ces informations pour vérifier la situation vaccinale du cheval ?
      questions: []
    - id: a07
      titre: 5. Quel document joindre ?
      contenu:
          - type: paragraphe
            texte: "Le responsable dispose de deux fichiers :"
          - type: liste
            elements:
                - "Fiche_complete_Mistral.pdf : dossier complet de l'écurie ;"
                - "Vaccinations_Mistral.pdf : copie fictive de la partie du document concernant uniquement les vaccinations."
          - type: paragraphe
            texte: Quel fichier semble le plus adapté à la demande adressée au vétérinaire ? Expliquez pourquoi.
      questions: []
    - id: a08
      titre: 6. Observer la pièce jointe
      contenu:
          - type: paragraphe
            texte: "Ouvrez le fichier :"
          - type: paragraphe
            texte: Vaccinations_Mistral.pdf
          - type: lien
            titre: Vaccinations_Mistral.pdf
            url: https://tifsec.github.io/mfr/capa2/Vaccinations_Mistral.pdf
          - type: paragraphe
            texte: "Vérifiez :"
          - type: liste
            elements:
                - qu'il s'ouvre correctement ;
                - qu'il concerne bien Mistral ;
                - qu'il s'agit bien du document destiné à être joint au courriel.
          - type: paragraphe
            texte: "Ne joignez jamais un fichier uniquement parce que son nom semble correct : ouvrez-le avant."
      questions: []
    - id: a09
      titre: 7. Préparer le courriel
      contenu:
          - type: paragraphe
            texte: Ouvrez votre messagerie habituelle et créez un nouveau brouillon.
          - type: paragraphe
            texte: Ne renseignez pas de véritable adresse de vétérinaire.
          - type: paragraphe
            texte: Si votre messagerie exige un destinataire, utilisez uniquement l'adresse d'exercice donnée par le professeur.
          - type: paragraphe
            texte: "Votre message devra comporter :"
          - type: liste
            elements:
                - un objet ;
                - une formule d'appel ;
                - le contexte de la demande ;
                - les informations permettant d'identifier Mistral ;
                - la demande précise ;
                - l'indication qu'un document est joint ;
                - une formule de politesse ;
                - une signature professionnelle.
      questions: []
    - id: a10
      titre: 8. Choisir un bon objet
      contenu:
          - type: paragraphe
            texte: "Voici plusieurs objets possibles :"
          - type: paragraphe
            texte: Bonjour
      questions:
          - id: q01
            type: texte
            enonce: Question
            suite:
                - type: paragraphe
                  texte: Mistral
                - type: paragraphe
                  texte: Vérification du suivi vaccinal de Mistral
                - type: paragraphe
                  texte: URGENT !!!!!
                - type: paragraphe
                  texte: Quel objet choisiriez-vous ? Expliquez pourquoi.
    - id: a11
      titre: 9. Rédiger le message
      contenu:
          - type: paragraphe
            texte: Rédigez maintenant votre courriel.
          - type: paragraphe
            texte: Votre message doit rester court, précis et professionnel.
          - type: paragraphe
            texte: "Vous pouvez vous aider de cette structure :"
          - type: paragraphe
            texte: saluer le destinataire ;
      questions:
          - id: q01
            type: texte
            enonce: expliquer pourquoi vous écrivez ;
            suite: []
          - id: q02
            type: texte
            enonce: indiquer quel cheval est concerné ;
            suite: []
          - id: q03
            type: texte
            enonce: formuler clairement la demande ;
            aide: Effectue cette manipulation dans Calc ou Excel, puis indique ici la formule, le résultat ou la démarche utilisée.
            suite: []
          - id: q04
            type: texte
            enonce: indiquer qu'un document est joint ;
            suite:
                - type: paragraphe
                  texte: remercier et terminer le message ;
                - type: paragraphe
                  texte: signer.
    - id: a12
      titre: 10. Ajouter la pièce jointe
      contenu:
          - type: paragraphe
            texte: "Joignez le fichier :"
          - type: paragraphe
            texte: Vaccinations_Mistral.pdf
          - type: paragraphe
            texte: Une fois le fichier ajouté, vérifiez qu'il apparaît réellement dans le brouillon.
          - type: paragraphe
            texte: "Erreur très fréquente : écrire « vous trouverez le document en pièce jointe » puis envoyer le message sans avoir joint le fichier."
      questions: []
    - id: a13
      titre: "11. Avant d'envoyer : la règle des 30 secondes"
      contenu:
          - type: paragraphe
            texte: "Avant tout envoi professionnel, prenez quelques secondes pour vérifier :"
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - À vérifier
                - OK ?
            lignes:
                - - Le bon destinataire est sélectionné
                  - ""
                - - L'objet explique clairement le sujet
                  - ""
                - - Le message est compréhensible
                  - ""
                - - La demande est clairement formulée
                  - ""
                - - La pièce jointe est présente
                  - ""
                - - La bonne pièce jointe a été sélectionnée
                  - ""
                - - Aucune donnée inutile n'est transmise
                  - ""
                - - Le message a été relu
                  - ""
            suite:
                - type: paragraphe
                  texte: Effectuez réellement ces vérifications sur votre brouillon.
    - id: a14
      titre: 12. Une erreur à éviter
      contenu:
          - type: paragraphe
            texte: "Un collègue prépare le message suivant :"
          - type: citation
            texte: Salut, je t'envoie les papiers du cheval tu peux regarder si tout est bon ? Merci
          - type: paragraphe
            texte: Il joint le dossier complet de Mistral.
          - type: paragraphe
            texte: Identifiez au moins quatre problèmes dans cette situation.
      questions: []
    - id: a15
      titre: "13. À, Cc et Cci : quelle différence ?"
      contenu:
          - type: paragraphe
            texte: "Dans une messagerie, vous pouvez généralement rencontrer trois zones :"
          - type: liste
            elements:
                - "À : destinataire principal ;"
                - "Cc : copie visible par les autres destinataires ;"
                - "Cci : copie cachée aux autres destinataires."
          - type: paragraphe
            texte: Dans notre situation, un seul vétérinaire doit recevoir la demande.
          - type: paragraphe
            texte: Quelle zone doit être utilisée ?
      questions: []
    - id: a16
      titre: 14. Défi — Un même outil, deux niveaux de qualité
      contenu:
          - type: paragraphe
            texte: Si vous avez terminé, imaginez maintenant que vous devez informer le propriétaire de Mistral que la demande a été transmise au vétérinaire.
          - type: paragraphe
            texte: "Créez un deuxième brouillon :"
          - type: liste
            elements:
                - avec un objet adapté ;
                - un message très court ;
                - sans joindre inutilement le document vaccinal.
      questions: []
    - id: a17
      titre: 15. Rendu du travail
      contenu:
          - type: paragraphe
            texte: Le professeur vérifiera votre brouillon directement sur votre poste ou selon la méthode indiquée en classe.
          - type: paragraphe
            texte: "Votre message doit comporter :"
          - type: liste
            elements:
                - un objet pertinent ;
                - une formulation professionnelle ;
                - une demande précise ;
                - la pièce jointe adaptée ;
                - une signature ;
                - aucune information personnelle inutile.
          - type: paragraphe
            texte: Ne cliquez pas sur Envoyer sauf indication explicite du professeur.
      questions: []
    - id: a18
      titre: À retenir
      contenu:
          - type: liste
            elements:
                - Un courriel professionnel doit être clair, court et précis.
                - L'objet doit permettre d'identifier immédiatement le sujet du message.
                - Une pièce jointe doit être ouverte et vérifiée avant l'envoi.
                - Il ne faut transmettre que les informations nécessaires au destinataire.
                - Un brouillon doit toujours être relu avant d'être envoyé.
                - Une information concernant la santé ou la réglementation doit être vérifiée auprès d'une source professionnelle fiable.
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
ressources:
    - type: paragraphe
      texte: Réalise les manipulations dans le logiciel demandé. Conserve tes fichiers sur ton espace habituel. Le site enregistre seulement tes réponses écrites, tes résultats, tes formules et tes démarches ; aucun fichier n’est téléversé.
introduction:
    - type: titre
      texte: Ce que vous allez apprendre
    - type: liste
      elements:
          - Comprendre les règles principales d'un courriel professionnel.
          - Comprendre pourquoi l'objet d'un message est important.
          - Comprendre qu'une pièce jointe doit être choisie en fonction du destinataire et de l'objectif du message.
          - Comprendre qu'il ne faut pas transmettre inutilement des données personnelles.
    - type: titre
      texte: Ce que vous allez apprendre à faire
    - type: liste
      elements:
          - Rédiger un courriel professionnel clair et concis.
          - Choisir un objet pertinent.
          - Ajouter et vérifier une pièce jointe.
          - Identifier les informations réellement utiles au destinataire.
          - Créer un brouillon et le relire avant tout envoi.
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://chlorofil.fr/diplomes/secondaire/capa
