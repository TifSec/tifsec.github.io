titre: 'Séance 15 : Présenter un soin pas à pas (Impress n° 2)'
themes:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
problematique: Comment montrer un soin étape par étape dans un diaporama ?
competences_bo:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
objectifs:
    connaissances:
        - 'Une diapositive par étape : photo + phrase courte.'
        - Les notes de l’orateur gardent ce qu’on dit.
    competences:
        - Faire un diaporama d’étapes.
        - Utiliser les notes de l’orateur.
pourquoi:
    - En CAPa 1, tu as présenté ton stage.
    - Aujourd’hui, tu montres un soin (graissage des sabots) aux nouveaux élèves.
activites:
    -   id: a01
        titre: Une étape par diapositive
        consigne: Tu vas créer un diaporama avec une diapositive par étape du graissage des sabots. On attend le nombre de diapositives et une phrase.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Impress ; enregistre soin.odp.
                    - 'Diapositive 1 : titre ; puis une diapositive par étape (S12).'
                    - 'Sur chaque diapositive : photo + une phrase.'
            -   type: paragraphe
                texte: Pourquoi une étape par diapositive ? Le public suit pas à pas.
        questions:
            -   id: q01
                type: nombre
                enonce: Combien de diapositives compte ton diaporama (titre compris) ?
                unite: diapositives
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: texte
                enonce: Écris la phrase de ta diapositive « Curer le pied ».
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a02
        titre: Les notes
        transition: Les diapositives sont prêtes. Prépare ce que tu diras.
        consigne: Tu vas écrire les notes de l’orateur sous chaque diapositive. On attend une note et qui la voit.
        contenu:
            -   type: etapes
                elements:
                    - Affichage > Notes.
                    - Sous chaque diapositive, écris ce que tu diras (conseils, sécurité).
            -   type: paragraphe
                texte: Pourquoi des notes ? Tu n’oublies rien et tu ne lis pas l’écran.
        questions:
            -   id: q01
                type: texte
                enonce: Recopie la note d’une diapositive.
                aide: Une phrase complète qui reprend les mots de la question.
            -   id: q02
                type: qcm
                enonce: Qui voit les notes ?
                choix:
                    -   id: a
                        texte: Seulement moi.
                    -   id: b
                        texte: Tout le public.
                    -   id: c
                        texte: Personne.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a03
        titre: Présenter
        transition: Tu sais quoi dire. Présente.
        consigne: Tu vas présenter le soin à un camarade et noter sa remarque. On attend la remarque et ce que tu changes.
        contenu:
            -   type: etapes
                elements:
                    - Présente ton diaporama à un camarade.
                    - Il te dit si les étapes sont claires.
            -   type: paragraphe
                texte: Pourquoi un camarade ? Il voit si tu as oublié quelque chose.
        questions:
            -   id: q01
                type: texte
                enonce: Qu’a dit ton camarade, et que vas-tu changer ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: On peut ajouter une courte vidéo dans Impress.
        questions:
            -   id: q01
                type: texte
                enonce: Quel menu ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton diaporama de soin est prêt. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment montrer un soin étape par étape dans un diaporama ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Une étape = une diapositive.
    - Notes de l’orateur.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
