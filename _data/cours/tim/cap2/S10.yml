titre: 'Séance 10 : Bilan Calc : le registre des soins'
themes:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
problematique: Saurai-je utiliser seul le tableur pour gérer les soins ?
competences_bo:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
objectifs:
    connaissances:
        - 'On réutilise : formules, SOMME, SI, tri, filtre, graphique.'
    competences:
        - Réaliser seul un tableau de suivi.
pourquoi:
    - De S06 à S09, tu as appris de nouvelles fonctions.
    - 'Bilan : le registre des vermifuges.'
activites:
    -   id: a01
        titre: Saisir et calculer
        consigne: Tu vas calculer seul le coût des vermifuges et leur total (document 1). On attend le total et la formule.
        contenu:
            -   type: tableau
                titre: Document 1 — Vermifuges (fictif)
                colonnes:
                    - ''
                    - A
                    - B
                    - C
                    - E
                lignes:
                    -   - '1'
                        - Cheval
                        - Doses
                        - Prix dose (€)
                        - Jours depuis le dernier
                    -   - '2'
                        - Tango
                        - '1'
                        - '18'
                        - '100'
                    -   - '3'
                        - Iris
                        - '1'
                        - '18'
                        - '40'
                    -   - '4'
                        - Nuage
                        - '1'
                        - '18'
                        - '95'
                    -   - '5'
                        - Belle
                        - '1'
                        - '18'
                        - '20'
            -   type: etapes
                elements:
                    - Ouvre Calc ; enregistre bilan_soins.ods.
                    - Recopie le document 1.
                    - 'En D2 : =B2*C2 (coût) ; tire ; total en D6.'
            -   type: paragraphe
                texte: Pourquoi le coût ? Le gérant refacture les soins aux propriétaires.
        questions:
            -   id: q01
                type: nombre
                enonce: Quel est le coût total des vermifuges (D6) ?
                unite: €
                aide: Écris l’opération, calcule, vérifie l’unité.
            -   id: q02
                type: texte
                enonce: Écris la formule de D6.
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a02
        titre: L’alerte
        transition: Les coûts sont calculés. Ajoute l’alerte.
        consigne: Tu vas ajouter seul une alerte SI qui affiche « À FAIRE » quand le dernier vermifuge date de plus de 90 jours. On attend les chevaux concernés.
        contenu:
            -   type: etapes
                elements:
                    - 'En F2 : =SI(E2>90;"À FAIRE";"OK") ; tire jusqu’en F5.'
                    - Lis les résultats.
            -   type: paragraphe
                texte: Pourquoi 90 ? C’est la règle donnée par le vétérinaire de l’écurie (exemple).
        questions:
            -   id: q01
                type: texte
                enonce: Quels chevaux ont « À FAIRE » ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a03
        titre: Trier
        transition: L’alerte marche. Classe par urgence.
        consigne: Tu vas trier le registre pour mettre le cheval le plus en retard en haut. On attend son nom et ses jours.
        contenu:
            -   type: etapes
                elements:
                    - Trie le tableau par la colonne E, ordre décroissant.
                    - Lis le premier.
            -   type: paragraphe
                texte: Pourquoi décroissant ? Le plus en retard est en haut.
        questions:
            -   id: q01
                type: texte
                enonce: Quel cheval est le plus en retard, et de combien de jours ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Ajoute une couleur rouge sur « À FAIRE ».
        questions:
            -   id: q01
                type: texte
                enonce: Quel menu ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton bilan Calc est fait. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : saurais-tu utiliser seul le tableur pour gérer les soins ? Dis ce qui était facile et difficile.'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Formules, SOMME, SI, tri.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
