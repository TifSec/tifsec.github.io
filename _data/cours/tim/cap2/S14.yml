titre: 'Séance 14 : Envoyer un document que tout le monde peut ouvrir'
themes:
    - 2.2.1 — Utiliser un environnement numérique de travail
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
problematique: Quel format choisir pour envoyer un document ?
competences_bo:
    - 2.2.1 — Utiliser un environnement numérique de travail
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
objectifs:
    connaissances:
        - '.odt / .docx : on peut modifier ; PDF : on lit et on imprime partout.'
        - Un fichier trop lourd ne passe pas par courriel (environ 25 Mo maximum).
    competences:
        - Choisir un format.
        - Vérifier le poids d’un fichier.
pourquoi:
    - En S12, tu as fait une fiche avec photos.
    - 'Tu dois l’envoyer : quel format ?'
activites:
    -   id: a01
        titre: Quel format ?
        consigne: Tu vas choisir le bon format (.odt ou PDF) pour trois situations. On attend un format par situation.
        contenu:
            -   type: etapes
                elements:
                    - Lis les situations.
                    - Choisis le format.
            -   type: paragraphe
                texte: Pourquoi deux formats ? Modifier ou seulement lire, ce n’est pas pareil.
        questions:
            -   id: q01
                type: tableau
                enonce: Choisis .odt ou PDF.
                colonnes:
                    - Situation
                    - Format
                lignes:
                    -   - Envoyer la fiche à imprimer
                        - ''
                    -   - Un collègue doit corriger la fiche
                        - ''
                    -   - Mettre la fiche sur le site du club
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: Le poids
        transition: Tu sais quel format choisir. Regarde le poids.
        consigne: Tu vas comparer le poids de ta fiche en .odt et en PDF. On attend les deux poids et si une vidéo de 80 Mo passe.
        contenu:
            -   type: etapes
                elements:
                    - 'Clic droit sur fiche_graissage.odt > Propriétés : note le poids.'
                    - Fais de même pour le PDF.
                    - Compare.
            -   type: paragraphe
                texte: Pourquoi le poids ? Un fichier trop lourd est refusé par la messagerie.
        questions:
            -   id: q01
                type: texte
                enonce: Écris le poids des deux fichiers.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
            -   id: q02
                type: qcm
                enonce: Une vidéo de 80 Mo passe-t-elle par courriel ?
                choix:
                    -   id: a
                        texte: Non, trop lourde.
                    -   id: b
                        texte: Oui.
                    -   id: c
                        texte: Seulement en PDF.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a03
        titre: Trop lourd ?
        transition: Ton fichier est léger. Et s’il ne l’était pas ?
        consigne: Tu vas proposer deux solutions pour envoyer une fiche trop lourde. On attend deux solutions.
        contenu:
            -   type: etapes
                elements:
                    - Ta fiche fait 30 Mo à cause des photos.
                    - Propose deux solutions.
            -   type: paragraphe
                texte: Pourquoi des solutions ? Il faut quand même envoyer le document.
        questions:
            -   id: q01
                type: texte
                enonce: Propose deux solutions pour envoyer un fichier trop lourd.
                aide: 'Méthode : 1) relis le besoin ou le problème ; 2) propose une idée possible avec le matériel ou les données de la séance ; 3) dis en quoi elle répond au besoin (« Cela permet de… »).'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un ami n’a pas Writer.
        questions:
            -   id: q01
                type: texte
                enonce: Peut-il lire un PDF ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais choisir un format. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quel format choisir pour envoyer un document ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'PDF : lire ; .odt : modifier.'
    - 'Poids : ~25 Mo maximum par courriel.'
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
