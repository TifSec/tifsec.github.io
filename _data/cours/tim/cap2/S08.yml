titre: 'Séance 8 : Voir la consommation d’aliments mois par mois'
themes:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
problematique: Quel graphique choisir pour montrer une évolution ?
competences_bo:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
objectifs:
    connaissances:
        - 'Pour une évolution dans le temps : graphique en ligne (courbe).'
        - 'Pour comparer des quantités : graphique en colonnes.'
    competences:
        - Choisir un type de graphique.
        - Faire une courbe avec titre et unités.
pourquoi:
    - En CAPa 1, tu as fait un graphique en colonnes.
    - Aujourd’hui, tu montres comment la consommation change au fil des mois.
activites:
    -   id: a01
        titre: Quel graphique ?
        consigne: Tu vas choisir le bon type de graphique pour deux besoins de l’écurie. On attend un type par besoin.
        contenu:
            -   type: etapes
                elements:
                    - Lis les deux besoins.
                    - Choisis le graphique.
            -   type: paragraphe
                texte: Pourquoi deux types ? Ils ne disent pas la même chose.
        questions:
            -   id: q01
                type: tableau
                enonce: 'Quel graphique : colonnes ou ligne ?'
                colonnes:
                    - Besoin
                    - Graphique
                lignes:
                    -   - Comparer le foin de 4 chevaux
                        - ''
                    -   - Suivre le foin de janvier à juin
                        - ''
                aide: Une formule commence par « = », puis la fonction et la plage (ex. =MOYENNE(B2:B10)).
    -   id: a02
        titre: La courbe
        transition: Tu sais quel graphique choisir. Fais la courbe.
        consigne: Tu vas tracer la courbe du foin consommé de janvier à juin (document 1). On attend le titre, l’unité et le mois le plus fort.
        contenu:
            -   type: tableau
                titre: Document 1 — Foin consommé par mois (fictif)
                colonnes:
                    - Mois
                    - Janv.
                    - Févr.
                    - Mars
                    - Avr.
                    - Mai
                    - Juin
                lignes:
                    -   - Foin (kg)
                        - '1600'
                        - '1500'
                        - '1300'
                        - '900'
                        - '500'
                        - '400'
            -   type: etapes
                elements:
                    - Ouvre Calc ; recopie le document 1 ; enregistre conso_mois.ods.
                    - Sélectionne les deux lignes.
                    - Insertion > Diagramme > Ligne.
                    - Titre « Foin par mois », axe « kg ».
            -   type: paragraphe
                texte: Pourquoi un titre et des unités ? Sinon on ne sait pas ce que montre la courbe.
        questions:
            -   id: q01
                type: texte
                enonce: Écris le titre et l’unité de l’axe vertical.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
            -   id: q02
                type: qcm
                enonce: Quel mois la consommation est-elle la plus forte ?
                choix:
                    -   id: a
                        texte: Janvier
                    -   id: b
                        texte: Mai
                    -   id: c
                        texte: Juin
                aide: Élimine d’abord les réponses impossibles.
    -   id: a03
        titre: Expliquer
        transition: La courbe est faite. Que montre-t-elle ?
        consigne: Tu vas expliquer pourquoi la consommation de foin baisse au printemps et calculer la baisse. On attend une explication et un calcul.
        contenu:
            -   type: etapes
                elements:
                    - Regarde la courbe.
                    - Pourquoi baisse-t-elle au printemps ?
                    - Écris.
            -   type: paragraphe
                texte: Pourquoi expliquer ? Un graphique sert à comprendre et décider.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi la consommation de foin baisse-t-elle au printemps ?
                aide: Une idée + « car » + une raison tirée de la séance.
            -   id: q02
                type: nombre
                enonce: De combien de kg la consommation baisse-t-elle entre janvier et juin ?
                unite: kg
                aide: Écris l’opération, calcule, vérifie l’unité.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Quel mois commander moins de foin ?
        questions:
            -   id: q01
                type: texte
                enonce: Justifie avec la courbe.
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais montrer une évolution. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quel graphique choisir pour montrer une évolution ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Évolution → ligne ; comparaison → colonnes.
    - Titre, unité, explication.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
