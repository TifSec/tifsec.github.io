titre: 'Séance 20 : Forum ou fiche officielle : à qui faire confiance ?'
themes:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
    - 2.2.3 — Situer le numérique dans son environnement social, économique et culturel
problematique: Comment savoir si une information sur le cheval est fiable ?
competences_bo:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
    - 2.2.3 — Situer le numérique dans son environnement social, économique et culturel
objectifs:
    connaissances:
        - 'Une information fiable : on sait qui l’écrit (spécialiste, organisme), quand, et elle est confirmée ailleurs.'
        - Un forum donne des avis, pas toujours vérifiés.
    competences:
        - Comparer deux sources.
        - Justifier un choix de source.
pourquoi:
    - En CAPa 1, tu as cherché une fiche fiable.
    - Aujourd’hui, tu compares un forum et une fiche officielle.
activites:
    -   id: a01
        titre: Deux réponses
        consigne: 'Tu vas comparer deux réponses sur les coliques du cheval : un forum et Équipédia (document 1). On attend qui écrit et le conseil de chacun.'
        contenu:
            -   type: liste
                elements:
                    - 'Forum (pseudo « cheval_fou ») : « Une colique ? Donne-lui du vinaigre et attends demain. »'
                    - 'Équipédia (IFCE) : « En cas de colique, retirer la nourriture, observer et appeler rapidement le vétérinaire. »'
            -   type: lien
                titre: IFCE — Équipédia (fiches techniques sur le cheval)
                url: https://equipedia.ifce.fr/
            -   type: etapes
                elements:
                    - Lis les deux réponses sur les coliques (document 1).
                    - Repère qui écrit et ce qu’il conseille.
            -   type: paragraphe
                texte: Pourquoi comparer ? Une mauvaise information peut mettre un cheval en danger.
        questions:
            -   id: q01
                type: tableau
                enonce: Complète.
                colonnes:
                    - ''
                    - Qui écrit ?
                    - Conseil
                lignes:
                    -   - Forum
                        - ''
                        - ''
                    -   - Équipédia
                        - ''
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: Qui croire ?
        transition: Les deux conseils sont différents. Qui croire ?
        consigne: Tu vas choisir la source fiable sur les coliques et justifier avec « car ». On attend un choix justifié.
        contenu:
            -   type: etapes
                elements:
                    - Choisis la source fiable.
                    - Justifie avec « car ».
            -   type: paragraphe
                texte: Pourquoi « car » ? On donne la raison du choix.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle source crois-tu ? Justifie avec « car ».
                aide: Une idée + « car » + une raison tirée de la séance.
    -   id: a03
        titre: Confirmer
        transition: Tu as choisi. Vérifie avec une autre source.
        consigne: Tu vas confirmer le conseil d’Équipédia avec un autre site sérieux. On attend le site et la comparaison.
        contenu:
            -   type: etapes
                elements:
                    - Cherche « colique cheval » sur un autre site sérieux (vétérinaire, école vétérinaire).
                    - Le conseil est-il le même ?
            -   type: paragraphe
                texte: Pourquoi une deuxième source ? Si deux sources sérieuses disent pareil, c’est solide.
        questions:
            -   id: q01
                type: texte
                enonce: Écris le site trouvé et si le conseil est le même qu’Équipédia.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un forum peut aussi être utile.
        questions:
            -   id: q01
                type: texte
                enonce: Pour quoi ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais à qui faire confiance. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment savoir si une information sur le cheval est fiable ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Fiable : qui, quand, confirmé.'
    - 'Santé : IFCE et vétérinaire.'
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
