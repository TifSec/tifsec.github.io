titre: 'Séance 18 : Organiser une journée portes ouvertes à plusieurs'
themes:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
problematique: Comment travailler à plusieurs sur le même document en ligne ?
competences_bo:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
objectifs:
    connaissances:
        - Un document partagé (ENT, Framapad, Drive) se modifie à plusieurs en même temps.
        - Une carte mentale organise les idées autour d’un thème.
    competences:
        - Faire une carte mentale.
        - Travailler dans un document partagé.
pourquoi:
    - La MFR organise une journée portes ouvertes à l’écurie.
    - Vous préparez l’organisation en groupe.
activites:
    -   id: a01
        titre: La carte mentale
        consigne: Tu vas faire en groupe la carte mentale de la journée portes ouvertes. On attend deux idées par branche.
        contenu:
            -   type: etapes
                elements:
                    - 'Au centre : « Journée portes ouvertes ».'
                    - '4 branches : accueil, visite de l’écurie, démonstration, sécurité.'
                    - Ajoute 2 idées par branche.
            -   type: paragraphe
                texte: Pourquoi une carte mentale ? On voit toutes les idées d’un coup.
        questions:
            -   id: q01
                type: tableau
                enonce: Écris 2 idées par branche.
                colonnes:
                    - Branche
                    - Idées
                lignes:
                    -   - Accueil
                        - ''
                    -   - Démonstration
                        - ''
                    -   - Sécurité
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: Le document partagé
        transition: Les idées sont là. Rédigez ensemble.
        consigne: Tu vas écrire ta partie dans le document partagé du groupe. On attend ta partie et si on peut écrire à plusieurs.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre le document partagé donné par le professeur.
                    - Chacun écrit sa partie (une branche) avec son prénom.
                    - Ne modifie pas la partie des autres.
            -   type: paragraphe
                texte: Pourquoi ne pas modifier les autres ? Chacun est responsable de sa partie.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle partie as-tu écrite, et que contient-elle ?
                aide: Une phrase complète qui reprend les mots de la question.
            -   id: q02
                type: qcm
                enonce: Deux personnes peuvent-elles écrire en même temps ?
                choix:
                    -   id: a
                        texte: Oui, c’est un document partagé.
                    -   id: b
                        texte: Non.
                    -   id: c
                        texte: Seulement le professeur.
                aide: Élimine d’abord les réponses impossibles.
    -   id: a03
        titre: Relire ensemble
        transition: Le document est écrit. Relisez-le.
        consigne: Tu vas relire le document partagé et laisser un commentaire sur la partie d’un camarade. On attend ton commentaire.
        contenu:
            -   type: etapes
                elements:
                    - Lis tout le document.
                    - Laisse un commentaire (pas une modification) sur une partie d’un camarade.
            -   type: paragraphe
                texte: Pourquoi un commentaire ? On propose sans effacer le travail des autres.
        questions:
            -   id: q01
                type: texte
                enonce: Écris le commentaire que tu as laissé.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: L’historique des versions montre qui a écrit quoi.
        questions:
            -   id: q01
                type: texte
                enonce: À quoi sert-il ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: La journée est organisée. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment travailler à plusieurs sur le même document en ligne ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - Carte mentale ; document partagé.
    - Commenter plutôt qu’effacer.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
