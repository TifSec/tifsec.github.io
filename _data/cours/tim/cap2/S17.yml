titre: 'Séance 17 : Une publication pour la page d’un centre équestre'
themes:
    - 2.2.3 — Situer le numérique dans son environnement social, économique et culturel
problematique: Comment écrire une publication professionnelle pour un centre équestre ?
competences_bo:
    - 2.2.3 — Situer le numérique dans son environnement social, économique et culturel
objectifs:
    connaissances:
        - 'Une publication pro : informations utiles (quoi, quand, où), ton poli, photo autorisée.'
        - Elle donne une image de l’entreprise.
    competences:
        - Rédiger une publication professionnelle.
pourquoi:
    - Le centre équestre organise un stage poney pendant les vacances.
    - Tu rédiges la publication pour sa page.
activites:
    -   id: a01
        titre: Les informations
        consigne: Tu vas relever dans la note du gérant (document 1) les informations du stage poney. On attend quoi, quand et pour qui.
        contenu:
            -   type: paragraphe
                texte: 'Document 1 — Note du gérant : « Stage poney pour les 6-12 ans, du 21 au 25 avril, de 9 h à 16 h, au centre équestre du Moulin. Inscription à l’accueil ou au 04 00 00 00 00. »'
            -   type: etapes
                elements:
                    - Lis la note du gérant (document 1).
                    - 'Repère : quoi, quand, où, pour qui, comment s’inscrire.'
            -   type: paragraphe
                texte: Pourquoi ces informations ? Sans elles, personne ne peut venir.
        questions:
            -   id: q01
                type: tableau
                enonce: Complète.
                colonnes:
                    - Question
                    - Réponse
                lignes:
                    -   - Quoi ?
                        - ''
                    -   - Quand ?
                        - ''
                    -   - Pour qui ?
                        - ''
                aide: 'Une case à la fois : la ligne croise la colonne.'
    -   id: a02
        titre: Rédiger
        transition: Tu as les informations. Rédige.
        consigne: Tu vas rédiger la publication du stage poney pour la page du centre. On attend une publication complète.
        contenu:
            -   type: etapes
                elements:
                    - 'Écris la publication : une phrase d’accroche, les informations, comment s’inscrire.'
                    - Pas de langage SMS.
            -   type: paragraphe
                texte: Pourquoi une accroche ? Elle donne envie de lire.
        questions:
            -   id: q01
                type: texte
                enonce: Écris ta publication.
                aide: Compte les éléments demandés, puis cherche-les dans les documents de la mission.
    -   id: a03
        titre: La photo
        transition: Le texte est prêt. Choisis la photo.
        consigne: Tu vas choisir la photo qui accompagne la publication en respectant le droit à l’image. On attend la photo choisie et ce qu’il faut pour des enfants.
        contenu:
            -   type: etapes
                elements:
                    - 'Choisis la photo : poneys au pré, ou enfants reconnaissables ?'
                    - Réponds.
            -   type: paragraphe
                texte: Pourquoi les poneys ? Pas besoin d’autorisation, et ils donnent envie.
        questions:
            -   id: q01
                type: qcm
                enonce: Quelle photo publier sans demander d’autorisation ?
                choix:
                    -   id: a
                        texte: Les poneys au pré.
                    -   id: b
                        texte: Des enfants reconnaissables.
                    -   id: c
                        texte: Un client en gros plan.
                aide: Élimine d’abord les réponses impossibles.
            -   id: q02
                type: texte
                enonce: Que faut-il pour publier une photo d’enfants ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Un commentaire négatif arrive.
        questions:
            -   id: q01
                type: texte
                enonce: Comment répondre ?
                aide: Une phrase complète qui reprend les mots de la question.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ta publication est prête. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment écrire une publication professionnelle pour un centre équestre ?'
                aide: Reprends les mots du problème et de « Ce que je retiens », avec un exemple de la séance.
retenir:
    - 'Publication : quoi, quand, où, pour qui, inscription.'
    - Photo autorisée.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
