titre: 'Séance 4 : Accueillir un nouvel équidé : organiser les informations'
themes:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
    - 2.2.3 — Situer le numérique dans son environnement social, économique et culturel
problematique: Quelles informations faut-il réunir à l’arrivée d’un cheval, et comment les ranger ?
competences_bo:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
    - 2.2.3 — Situer le numérique dans son environnement social, économique et culturel
objectifs:
    connaissances:
        - 'À l’arrivée d’un équidé : identité (nom, SIRE, puce), propriétaire, vaccins, soins, alimentation.'
        - Le propriétaire a des droits sur ses données personnelles.
    competences:
        - Organiser une fiche d’accueil.
        - Séparer informations du cheval et données du propriétaire.
pourquoi:
    - Un nouveau cheval arrive en pension.
    - Tu prépares sa fiche d’accueil.
activites:
    -   id: a01
        titre: Trier les informations
        consigne: Tu vas ranger les informations reçues pour la jument Iris (document 1) en trois catégories. On attend la catégorie de quatre informations.
        contenu:
            -   type: liste
                elements:
                    - Iris, jument, baie, 10 ans.
                    - N° SIRE fictif 250001X00000000.
                    - 'Propriétaire : Mme Ould, 06 00 00 00 00.'
                    - Vaccinée grippe le 12/03/2026.
                    - 'Allergie à la paille : litière copeaux.'
                    - 2 kg de granulés par jour.
            -   type: paragraphe
                texte: Données fictives créées pour l’exercice.
            -   type: etapes
                elements:
                    - Lis les informations reçues (document 1).
                    - 'Range-les : cheval, propriétaire, santé.'
                    - Pourquoi trier ? Chaque personne de l’écurie cherche une information différente.
        questions:
            -   id: q01
                type: tableau
                enonce: Range chaque information.
                colonnes:
                    - Information
                    - Catégorie
                lignes:
                    -   - Vacciné grippe le 12/03/2026
                        - ''
                    -   - Téléphone de Mme Ould
                        - ''
                    -   - Robe baie
                        - ''
                    -   - Allergie à la paille
                        - ''
                aide: 'Pour chaque information, demande-toi : parle-t-elle du cheval, de sa santé, ou de son propriétaire ?'
    -   id: a02
        titre: La fiche d’accueil
        transition: Les informations sont triées. Fais la fiche.
        consigne: Tu vas faire dans Writer la fiche d’accueil d’Iris avec trois parties. On attend ta partie « Santé ».
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Writer ; enregistre accueil_iris.odt.
                    - Titre « Fiche d’accueil — Iris ».
                    - 'Fais un tableau à 2 colonnes avec 3 parties : Cheval, Santé, Propriétaire.'
                    - Pourquoi 3 parties ? On trouve vite ce qu’on cherche.
        questions:
            -   id: q01
                type: texte
                enonce: Recopie la partie « Santé » de ta fiche.
                aide: 'Recopie ta partie « Santé » : vaccins, allergie, et ce que l’écurie change pour le cheval.'
    -   id: a03
        titre: Protéger les données du propriétaire
        transition: La fiche est faite. Attention à ce qu’on affiche.
        consigne: Tu vas repérer quelle information de la fiche ne doit pas être affichée dans la sellerie. On attend l’information, la raison et où la garder.
        contenu:
            -   type: etapes
                elements:
                    - La fiche est affichée dans la sellerie, visible par tous les clients.
                    - Que faut-il enlever ?
                    - Réponds.
                    - Pourquoi enlever ? Le téléphone du propriétaire est une donnée personnelle.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle information ne doit pas être affichée dans la sellerie, et pourquoi ?
                aide: Dans la sellerie, tout le monde passe. Quelle information concerne une personne privée ?
            -   id: q02
                type: qcm
                enonce: Où garder le téléphone du propriétaire ?
                choix:
                    -   id: a
                        texte: Dans le fichier du bureau, accessible aux employés.
                    -   id: b
                        texte: Sur la porte du box.
                    -   id: c
                        texte: Sur la page du club.
                aide: 'Qui a besoin du téléphone : tout le monde, ou seulement les employés ?'
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: L’allergie est importante pour tout le personnel.
        questions:
            -   id: q01
                type: texte
                enonce: Comment la faire voir à tous ?
                aide: Toutes les personnes qui soignent le cheval doivent le savoir. Où mettre l’information pour qu’on la voie avant d’entrer dans le box ?
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Iris est bien accueillie. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : quelles informations faut-il réunir à l’arrivée d’un cheval, et comment les ranger ?'
                aide: Dis les grandes parties de la fiche (identité, santé, alimentation, propriétaire) et la règle pour les données du propriétaire.
retenir:
    - 'Fiche d’accueil : cheval, santé, propriétaire.'
    - Ne pas afficher les données personnelles.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
