titre: "Accueillir un nouvel équidé : vérifier et organiser les informations"
theme: "TIM — Accueillir un nouvel équidé : vérifier et organiser les informations"
problematique: "Accueillir un nouvel équidé : vérifier et organiser les informations"
pourquoi: "Objectif de cette séance : Comprendre pourquoi l'identification et la traçabilité des équidés sont importantes."
application: Le responsable vous demande de préparer son dossier d'arrivée et de vérifier que les informations importantes ont bien été transmises.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances:
        - Comprendre pourquoi l'identification et la traçabilité des équidés sont importantes.
        - Distinguer une obligation réglementaire d'une bonne pratique professionnelle.
        - Identifier une source professionnelle fiable sur Internet.
        - Comprendre l'intérêt d'un document standardisé lors de l'arrivée d'un cheval.
    competences:
        - Rechercher une information dans une source professionnelle.
        - Extraire les informations importantes d'une page Internet.
        - Créer une fiche professionnelle avec LibreOffice Writer.
        - Organiser des informations dans des tableaux.
        - Insérer des liens vers les sources utilisées.
        - Exporter un document professionnel au format PDF.
activites:
    - id: a03
      titre: 1. Créez votre document de travail
      contenu:
          - type: paragraphe
            texte: "Dans votre dossier CAPA2_TIM/02_Travaux, créez un dossier :"
          - type: paragraphe
            texte: S04
          - type: paragraphe
            texte: "Ouvrez ensuite LibreOffice Writer et enregistrez immédiatement votre document sous le nom :"
          - type: paragraphe
            texte: CAPA2_S04_NOM_Prenom.odt
          - type: paragraphe
            texte: Ce document deviendra progressivement une véritable fiche d'accueil d'un équidé.
      questions: []
    - id: a04
      titre: 2. Situation professionnelle
      contenu:
          - type: paragraphe
            texte: Vous travaillez dans une écurie de pension.
          - type: paragraphe
            texte: Un nouveau cheval, Mistral, arrive aujourd'hui pour plusieurs mois.
          - type: paragraphe
            texte: Le responsable vous demande de préparer son dossier d'arrivée et de vérifier que les informations importantes ont bien été transmises.
          - type: paragraphe
            texte: "Mais avant de créer la fiche, vous devez savoir :"
          - type: liste
            elements:
                - quels documents accompagnent normalement un équidé ;
                - comment son identification peut être vérifiée ;
                - quelles informations concernant son arrivée doivent être conservées.
      questions: []
    - id: a05
      titre: "3. Première source : l'identification des équidés"
      contenu:
          - type: paragraphe
            texte: "Consultez la page suivante de l'IFCE – Institut français du cheval et de l'équitation :"
          - type: paragraphe
            texte: "Source professionnelle : IFCE – SIRE, Identification des équidés ."
          - type: lien
            titre: Identification des équidés
            url: https://www.ifce.fr/ifce/sire-demarches/sanitaire-detention/identification-des-equides-ifce/
          - type: paragraphe
            texte: "Recherchez dans cette page les informations permettant de compléter les phrases suivantes dans votre document :"
          - type: paragraphe
            texte: Tout équidé présent en France doit être __________.
          - type: paragraphe
            texte: Il doit être équipé d'un __________ électronique.
          - type: paragraphe
            texte: Il doit posséder un document d'identification appelé également __________ ou __________.
          - type: paragraphe
            texte: Il doit disposer d'un numéro __________ attestant son enregistrement dans le fichier central.
      questions:
          - id: q01
            type: texte
            enonce: Le document d'identification doit-il rester avec le cheval lors de ses déplacements ?
            suite: []
    - id: a06
      titre: 4. Une source, mais laquelle ?
      contenu:
          - type: paragraphe
            texte: "Observez l'adresse du site que vous venez d'utiliser puis répondez dans votre document :"
      questions:
          - id: q01
            type: texte
            enonce: Quel organisme publie cette information ?
            suite: []
          - id: q02
            type: texte
            enonce: S'agit-il d'un forum, d'un réseau social, d'un site commercial ou d'un organisme professionnel officiel ?
            suite: []
          - id: q03
            type: texte
            enonce: Pourquoi cette source est-elle préférable à une réponse trouvée au hasard sur un forum ?
            suite: []
    - id: a07
      titre: "5. Deuxième source : le registre d'élevage"
      contenu:
          - type: paragraphe
            texte: Lorsqu'un cheval arrive ou quitte une structure, son mouvement doit également pouvoir être retrouvé.
          - type: paragraphe
            texte: "Consultez maintenant :"
          - type: paragraphe
            texte: "Source professionnelle : IFCE – SIRE, Registre d'élevage ."
          - type: lien
            titre: Registre d'élevage
            url: https://www.ifce.fr/ifce/sire-demarches/sanitaire-detention/registre-delevage/
          - type: paragraphe
            texte: "À partir de cette page, répondez aux questions suivantes :"
      questions:
          - id: q01
            type: texte
            enonce: À quoi sert notamment le registre d'élevage ?
            suite: []
          - id: q02
            type: texte
            enonce: Est-il réservé aux grandes structures possédant beaucoup de chevaux ?
            suite: []
          - id: q03
            type: texte
            enonce: Quels types d'informations peuvent y être enregistrés ?
            suite: []
          - id: q04
            type: texte
            enonce: Combien de temps le registre doit-il être conservé ?
            suite: []
    - id: a08
      titre: 6. Le dossier de Mistral
      contenu:
          - type: paragraphe
            texte: "Voici les informations transmises lors de son arrivée :"
          - type: tableau
            colonnes:
                - Information
                - Donnée transmise
            lignes:
                - - Nom
                  - Mistral
                - - Sexe
                  - Hongre
                - - Âge
                  - 9 ans
                - - Propriétaire
                  - Claire Martin
                - - Date d'arrivée
                  - 25/09/2026
                - - Départ prévu
                  - 20/12/2026
                - - Document présenté
                  - Photocopie du document d'identification
                - - Numéro SIRE
                  - Présent sur la photocopie
                - - Entrée dans le registre d'élevage
                  - Pas encore réalisée
                - - Contact en cas de problème
                  - Claire Martin – coordonnées transmises à l'écurie
          - type: paragraphe
            texte: Mistral, Claire Martin et les informations du dossier sont fictifs. Les obligations et informations réglementaires utilisées dans l'activité proviennent de l'IFCE.
      questions: []
    - id: a09
      titre: "7. Mission : repérer les problèmes"
      contenu:
          - type: paragraphe
            texte: À partir des deux sources IFCE, trouvez au moins deux éléments du dossier qui doivent attirer l'attention du responsable.
          - type: paragraphe
            texte: Expliquez pourquoi dans votre document.
      questions: []
    - id: a10
      titre: "8. Mission principale : créer la fiche d'accueil de Mistral"
      contenu:
          - type: paragraphe
            texte: Transformez maintenant votre document Writer en une fiche professionnelle utilisable par l'écurie.
          - type: paragraphe
            texte: "Ajoutez un titre :"
          - type: paragraphe
            texte: FICHE D'ACCUEIL D'UN ÉQUIDÉ
          - type: paragraphe
            texte: Ajoutez ensuite plusieurs parties clairement identifiables.
          - type: titre
            texte: A. Identification de l'équidé
          - type: paragraphe
            texte: "Créez un tableau contenant au minimum :"
          - type: liste
            elements:
                - nom ;
                - sexe ;
                - âge ;
                - numéro SIRE ;
                - nom du propriétaire.
          - type: titre
            texte: B. Arrivée dans la structure
          - type: paragraphe
            texte: "Ajoutez :"
          - type: liste
            elements:
                - date d'arrivée ;
                - date de départ prévue ;
                - "type de séjour : pension temporaire."
          - type: titre
            texte: C. Vérifications lors de l'arrivée
          - type: paragraphe
            texte: "Créez un tableau de contrôle ressemblant à celui-ci :"
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Élément à vérifier
                - Oui
                - Non
                - Observation
            lignes:
                - - Document d'identification original présent
                  - ""
                  - ""
                  - ""
                - - Numéro SIRE disponible
                  - ""
                  - ""
                  - ""
                - - Coordonnées du propriétaire disponibles
                  - ""
                  - ""
                  - ""
                - - Contact en cas de problème disponible
                  - ""
                  - ""
                  - ""
                - - Entrée enregistrée dans le registre d'élevage
                  - ""
                  - ""
                  - ""
            suite:
                - type: paragraphe
                  texte: Complétez ce tableau avec les informations disponibles concernant Mistral.
                - type: titre
                  texte: D. Observations
                - type: paragraphe
                  texte: Ajoutez une zone suffisamment grande pour permettre à un salarié de noter des informations utiles lors de l'arrivée.
                - type: paragraphe
                  texte: "Pour cette activité, indiquez :"
                - type: paragraphe
                  texte: Document d'identification original à demander au propriétaire. Entrée de Mistral à enregistrer dans le registre.
    - id: a11
      titre: 9. Ne pas confondre obligation et organisation interne
      contenu:
          - type: paragraphe
            texte: "Dans votre document, ajoutez un petit encadré :"
          - type: paragraphe
            texte: Obligations / bonnes pratiques
          - type: paragraphe
            texte: "Classez les éléments suivants :"
          - type: liste
            elements:
                - équidé identifié ;
                - document d'identification accompagnant le cheval ;
                - enregistrement des mouvements dans le registre ;
                - utilisation d'une fiche d'accueil créée par l'écurie ;
                - mise en page avec le logo de l'écurie.
      questions: []
    - id: a12
      titre: 10. Indiquer ses sources
      contenu:
          - type: paragraphe
            texte: "En bas de votre document, ajoutez :"
          - type: paragraphe
            texte: "Sources consultées :"
          - type: liste
            elements:
                - IFCE – Identification des équidés ;
                - IFCE – Registre d'élevage.
          - type: paragraphe
            texte: Transformez les titres des deux ressources en liens cliquables vers les pages consultées.
          - type: titre
            texte: Besoin d'aide pour créer un lien dans Writer ?
          - type: paragraphe
            texte: Sélectionnez le texte puis utilisez le menu Insertion → Hyperlien.
      questions: []
    - id: a13
      titre: "11. Mission : informer le responsable"
      contenu:
          - type: paragraphe
            texte: Sous votre fiche, rédigez un court message professionnel de 3 à 5 lignes destiné au responsable de l'écurie.
          - type: paragraphe
            texte: "Votre message doit expliquer :"
          - type: liste
            elements:
                - ce qui manque actuellement dans le dossier de Mistral ;
                - ce qui doit être mis à jour dans le registre ;
                - pourquoi il est important de corriger ces éléments.
      questions: []
    - id: a14
      titre: 12. Transformer la fiche en modèle professionnel
      contenu:
          - type: paragraphe
            texte: "Améliorez la présentation de votre document :"
          - type: liste
            elements:
                - titre clairement identifiable ;
                - sous-titres cohérents ;
                - tableaux lisibles ;
                - marges régulières ;
                - police facile à lire ;
                - aucun élément décoratif inutile.
          - type: paragraphe
            texte: Votre objectif est qu'un salarié puisse retrouver une information en quelques secondes.
      questions: []
    - id: a15
      titre: 13. Défi — Créer une fiche réutilisable
      contenu:
          - type: paragraphe
            texte: Si vous avez terminé, créez une deuxième page contenant la même fiche mais sans les informations concernant Mistral.
          - type: paragraphe
            texte: Elle doit pouvoir être imprimée et utilisée lors de l'arrivée de n'importe quel nouvel équidé.
          - type: paragraphe
            texte: "Remplacez les informations par des zones à compléter :"
          - type: liste
            elements:
                - "Nom : ____________________"
                - "N° SIRE : ____________________"
                - "Date d'arrivée : ____________________"
          - type: paragraphe
            texte: Vous venez ainsi de créer un modèle de document professionnel.
      questions: []
    - id: a16
      titre: 14. Exporter le document
      contenu:
          - type: paragraphe
            texte: "Lorsque votre fiche est terminée :"
          - type: paragraphe
            texte: enregistrez votre fichier Writer ;
          - type: paragraphe
            texte: exportez-le au format PDF ;
      questions:
          - id: q01
            type: texte
            enonce: vérifiez le PDF avant de le rendre.
            suite:
                - type: paragraphe
                  texte: "Vous devez obtenir :"
                - type: liste
                  elements:
                      - CAPA2_S04_NOM_Prenom.odt
                      - CAPA2_S04_NOM_Prenom.pdf
    - id: a17
      titre: 15. Rendu du travail
      contenu:
          - type: paragraphe
            texte: "Avant de rendre votre fichier, vérifiez que :"
          - type: liste
            elements:
                - la fiche permet d'identifier clairement Mistral ;
                - les informations d'arrivée sont présentes ;
                - le tableau de vérification est complété ;
                - les deux problèmes du dossier ont été repérés ;
                - vous distinguez obligations et organisation interne ;
                - les sources IFCE apparaissent avec des liens cliquables ;
                - le message destiné au responsable est rédigé ;
                - le document reste lisible et professionnel.
          - type: paragraphe
            texte: "Rendez :"
          - type: paragraphe
            texte: CAPA2_S04_NOM_Prenom.pdf
          - type: paragraphe
            texte: Même si votre travail n'est pas terminé, il doit être rendu.
      questions: []
    - id: a18
      titre: À retenir
      contenu:
          - type: liste
            elements:
                - Une information professionnelle doit provenir d'une source identifiable et fiable.
                - Tout équidé doit être correctement identifié et enregistré.
                - Le document d'identification accompagne le cheval lors de ses déplacements.
                - Les mouvements des équidés doivent pouvoir être retrouvés dans le registre d'élevage.
                - Un document numérique professionnel doit permettre de retrouver rapidement les informations utiles.
                - Une source utilisée dans un travail doit être indiquée et, lorsque cela est possible, reliée à la ressource originale.
      questions: []
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
ressources:
    - type: paragraphe
      texte: Réalise les manipulations dans le logiciel demandé. Conserve tes fichiers sur ton espace habituel. Le site enregistre seulement tes réponses écrites, tes résultats, tes formules et tes démarches ; aucun fichier n’est téléversé.
introduction:
    - type: titre
      texte: Ce que vous allez apprendre
    - type: liste
      elements:
          - Comprendre pourquoi l'identification et la traçabilité des équidés sont importantes.
          - Distinguer une obligation réglementaire d'une bonne pratique professionnelle.
          - Identifier une source professionnelle fiable sur Internet.
          - Comprendre l'intérêt d'un document standardisé lors de l'arrivée d'un cheval.
    - type: titre
      texte: Ce que vous allez apprendre à faire
    - type: liste
      elements:
          - Rechercher une information dans une source professionnelle.
          - Extraire les informations importantes d'une page Internet.
          - Créer une fiche professionnelle avec LibreOffice Writer.
          - Organiser des informations dans des tableaux.
          - Insérer des liens vers les sources utilisées.
          - Exporter un document professionnel au format PDF.
reperes_officiels:
