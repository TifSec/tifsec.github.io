titre: 'Séance 13 : Une lettre type qu’on réutilise'
themes:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
problematique: Comment ne pas retaper la même lettre chaque mois ?
competences_bo:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
objectifs:
    connaissances:
        - Un modèle (.ott) est un document de départ qu’on réutilise.
        - On crée un nouveau document à partir du modèle, sans abîmer le modèle.
    competences:
        - Créer un modèle.
        - Créer un document à partir du modèle.
pourquoi:
    - Chaque mois, l’écurie envoie une lettre de facture de pension aux propriétaires.
    - Un modèle évite de tout retaper.
activites:
    -   id: a01
        titre: Ce qui change, ce qui reste
        consigne: Tu vas repérer ce qui change chaque mois dans la lettre de facture (document 1). On attend deux éléments.
        contenu:
            -   type: citation
                texte: 'Document 1 — « Écurie du Moulin. Madame Ould, veuillez trouver la facture de pension d’Iris pour le mois de novembre : 380 €. Cordialement, le gérant. »'
            -   type: etapes
                elements:
                    - Lis la lettre (document 1).
                    - Repère ce qui change chaque mois.
                    - Réponds.
                    - Pourquoi repérer ? Dans le modèle, on garde ce qui ne change pas.
        questions:
            -   id: q01
                type: texte
                enonce: D’après le document 1, cite deux éléments qui changent chaque mois.
                aide: Dans le document 1, cherche ce qui ne serait pas pareil pour un autre propriétaire ou un autre mois.
    -   id: a02
        titre: Créer le modèle
        transition: Tu sais ce qui change. Crée le modèle.
        consigne: Tu vas créer le modèle de la lettre de pension avec des crochets à remplacer. On attend ta phrase modèle et l’extension.
        contenu:
            -   type: etapes
                elements:
                    - Ouvre Writer ; tape la lettre en mettant [NOM], [CHEVAL], [MOIS], [MONTANT] à la place de ce qui change.
                    - 'Fichier > Modèles > Enregistrer comme modèle : « Lettre pension ».'
                    - Pourquoi des crochets ? On voit tout de suite ce qu’il faut remplacer.
        questions:
            -   id: q01
                type: texte
                enonce: Recopie la phrase de ton modèle avec les crochets.
                aide: Recopie ta phrase avec les mots entre crochets à la place de ce qui change.
            -   id: q02
                type: qcm
                enonce: Quelle extension a un modèle ?
                choix:
                    -   id: a
                        texte: .ott
                    -   id: b
                        texte: .odt
                    -   id: c
                        texte: .pdf
                aide: 'Un modèle Writer n’a pas la même extension qu’un document : regarde le nom du fichier enregistré.'
    -   id: a03
        titre: Utiliser le modèle
        transition: Le modèle est prêt. Utilise-le.
        consigne: Tu vas créer la lettre de Monsieur Ferré à partir du modèle. On attend la lettre complète.
        contenu:
            -   type: etapes
                elements:
                    - Fichier > Nouveau > Modèles > « Lettre pension ».
                    - Remplace les crochets pour Monsieur Ferré, Tango, décembre, 420 €.
                    - Enregistre sous lettre_ferre_decembre.odt.
                    - Pourquoi un nouveau nom ? Le modèle reste intact pour le mois suivant.
        questions:
            -   id: q01
                type: texte
                enonce: Recopie la lettre pour Monsieur Ferré.
                aide: Recopie la lettre faite pour Monsieur Ferré, avec les crochets remplacés par ses informations.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: On peut mettre le logo de l’écurie dans le modèle.
        questions:
            -   id: q01
                type: texte
                enonce: Pourquoi est-ce pratique ?
                aide: 'Le logo est dans le modèle : faut-il le remettre à chaque nouvelle lettre ?'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu ne retapes plus la lettre. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment ne pas retaper la même lettre chaque mois ?'
                aide: Explique le modèle avec des parties à remplacer, et comment on l’utilise chaque mois.
retenir:
    - Modèle .ott ; [CROCHETS] à remplacer.
    - Nouveau document à partir du modèle.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
