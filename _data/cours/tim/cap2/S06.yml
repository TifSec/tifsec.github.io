titre: 'Séance 6 : Retrouver vite un cheval dans le registre'
themes:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
problematique: Comment trier et filtrer un grand tableau ?
competences_bo:
    - 2.2.2 — Utiliser des outils et des logiciels dans des projets
objectifs:
    connaissances:
        - 'Trier : ranger les lignes (A → Z, du plus petit au plus grand).'
        - 'Filtrer : afficher seulement les lignes qui nous intéressent.'
    competences:
        - Trier un tableau.
        - Utiliser le filtre automatique.
pourquoi:
    - Le registre de l’écurie a 30 chevaux.
    - 'Trouver une information à l’œil est long : le tableur peut aider.'
activites:
    -   id: a01
        titre: Trier
        consigne: Tu vas trier le registre des chevaux par nom sans mélanger les lignes. On attend le premier cheval et pourquoi trier tout le tableau.
        contenu:
            -   type: fichier
                titre: registre des 30 chevaux
                url: /assets/fichiers/tim/cap2/registre.ods
            -   type: etapes
                elements:
                    - Ouvre le fichier registre.ods (à télécharger ci-dessus) ; enregistre une copie.
                    - Clique dans le tableau ; Données > Trier par « Nom », croissant.
                    - 'Vérifie : chaque cheval garde ses informations.'
                    - Pourquoi tout le tableau ? Sinon les noms ne correspondent plus aux bonnes informations.
        questions:
            -   id: q01
                type: texte
                enonce: Quel est le premier cheval après le tri par nom ?
                aide: Trie tout le registre par nom, de A à Z, puis lis la première ligne de données.
            -   id: q02
                type: qcm
                enonce: Pourquoi trier tout le tableau et pas une seule colonne ?
                choix:
                    -   id: a
                        texte: Pour garder chaque ligne ensemble.
                    -   id: b
                        texte: C’est plus joli.
                    -   id: c
                        texte: Ça va plus vite.
                aide: Si on trie une seule colonne, les noms restent-ils à côté des bonnes informations ?
    -   id: a02
        titre: Filtrer
        transition: Le registre est trié. Affiche seulement les poneys.
        consigne: Tu vas filtrer le registre pour n’afficher que les poneys. On attend leur nombre et ce que deviennent les autres lignes.
        contenu:
            -   type: etapes
                elements:
                    - Données > Filtre automatique.
                    - Dans « Type », ne garde que « Poney ».
                    - Compte les lignes affichées.
                    - Pourquoi filtrer ? On ne voit que ce qui nous intéresse ; le reste est caché, pas effacé.
        questions:
            -   id: q01
                type: nombre
                enonce: Combien de poneys compte le registre ?
                unite: poneys
                aide: Mets le filtre sur la colonne Type, garde seulement « Poney », puis compte les lignes visibles.
            -   id: q02
                type: qcm
                enonce: Où sont passés les chevaux ?
                choix:
                    -   id: a
                        texte: Ils sont cachés.
                    -   id: b
                        texte: Ils sont supprimés.
                    -   id: c
                        texte: Ils sont dans la corbeille.
                aide: Le filtre a-t-il supprimé les chevaux, ou seulement caché ?
    -   id: a03
        titre: Une demande du moniteur
        transition: Tu sais filtrer. Réponds à une vraie demande.
        consigne: Tu vas combiner deux filtres pour trouver les poneys pour débutants demandés par le moniteur. On attend leurs noms.
        contenu:
            -   type: etapes
                elements:
                    - Le moniteur cherche les poneys de « Débutant ».
                    - Ajoute un filtre sur « Niveau ».
                    - Écris la liste.
                    - Pourquoi deux filtres ? Les deux conditions doivent être vraies.
        questions:
            -   id: q01
                type: texte
                enonce: Écris les noms des poneys pour débutants.
                aide: Garde le filtre « Poney » et ajoute un filtre sur le niveau « débutant ». Recopie les noms.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: Comment enlever tous les filtres ?
        questions:
            -   id: q01
                type: texte
                enonce: Quel menu ?
                aide: Pour tout revoir, cherche dans le menu Données la commande qui enlève ou réinitialise le filtre.
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Tu sais retrouver un cheval. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : comment trier et filtrer un grand tableau ?'
                aide: Dis la différence entre trier et filtrer, et comment combiner deux critères.
retenir:
    - 'Trier : tout le tableau.'
    - 'Filtrer : cacher les lignes inutiles.'
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
