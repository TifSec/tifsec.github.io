titre: 'Séance 1 : Reprendre le TIM en CAPa 2 : où j’en suis'
themes:
    - 2.2.1 — Utiliser un environnement numérique de travail
problematique: Que sais-je déjà faire en TIM, et que vais-je apprendre cette année ?
competences_bo:
    - 2.2.1 — Utiliser un environnement numérique de travail
objectifs:
    connaissances:
        - En CAPa 1, tu as vu Writer, Calc, Impress, internet et tes droits.
        - 'En CAPa 2, tu vas plus loin : trier, faire décider le tableur, faire des documents réutilisables, une vidéo.'
    competences:
        - Faire le point sur ses acquis.
        - Se fixer un objectif.
pourquoi:
    - Tu as déjà un an de TIM.
    - Aujourd’hui, tu vérifies ce que tu sais encore faire.
activites:
    -   id: a01
        titre: Petit test Writer
        consigne: Tu vas répondre à deux questions sur Writer pour voir ce que tu as retenu de la CAPa 1. On attend deux bonnes réponses.
        contenu:
            -   type: etapes
                elements:
                    - Lis chaque question.
                    - Réponds sans chercher.
                    - Pourquoi un test ? On voit ce qu’il faut revoir.
        questions:
            -   id: q01
                type: qcm
                enonce: Quel raccourci enregistre un document ?
                choix:
                    -   id: a
                        texte: Ctrl + S
                    -   id: b
                        texte: Ctrl + C
                    -   id: c
                        texte: Ctrl + V
                aide: C’est Ctrl avec la première lettre de « Sauvegarder ».
            -   id: q02
                type: qcm
                enonce: Quel format envoyer pour qu’un document s’ouvre partout ?
                choix:
                    -   id: a
                        texte: PDF
                    -   id: b
                        texte: .odt
                    -   id: c
                        texte: .exe
                aide: Quel format garde la même page sur tous les ordinateurs et téléphones ?
    -   id: a02
        titre: Petit test Calc
        transition: Tu as revu Writer. Passe à Calc.
        consigne: Tu vas écrire une formule de total et la calculer avec le tableau de foin (document 1). On attend la formule et le résultat.
        contenu:
            -   type: tableau
                titre: Document 1 — Foin par jour (fictif)
                colonnes:
                    - ''
                    - A
                    - B
                lignes:
                    -   - '1'
                        - Cheval
                        - Foin (kg/jour)
                    -   - '2'
                        - Tango
                        - '8'
                    -   - '3'
                        - Nuage
                        - '6'
                    -   - '4'
                        - Belle
                        - '7'
            -   type: etapes
                elements:
                    - Lis le tableau (document 1).
                    - Réponds.
                    - Pourquoi Calc ? Il servira beaucoup cette année.
        questions:
            -   id: q01
                type: texte
                enonce: Quelle formule calcule le total des cellules B2 à B4 ?
                aide: Une formule commence par « = ». La fonction qui additionne s’appelle SOMME, avec la plage entre parenthèses.
            -   id: q02
                type: nombre
                enonce: D’après le document 1, quel est ce total ?
                unite: kg
                aide: Additionne les trois valeurs du document 1 et écris l’unité.
    -   id: a03
        titre: Mon objectif
        transition: Tu as fait le point. Regarde la suite.
        consigne: Tu vas choisir dans le programme de l’année (document 2) ce qui te servira le plus au travail. On attend ton choix expliqué.
        contenu:
            -   type: liste
                elements:
                    - Trier et filtrer un registre de chevaux.
                    - Faire afficher une alerte par le tableur (vaccin à faire).
                    - Faire un modèle de lettre.
                    - Filmer et monter une démonstration de pansage.
                    - Découvrir les démarches en ligne pour un équidé.
                    - Tracer une balade sur une carte.
            -   type: etapes
                elements:
                    - Lis ce qu’on fera cette année (document 2).
                    - Choisis ce qui te servira le plus au travail.
                    - Explique.
                    - Pourquoi un objectif ? Tu sais pourquoi tu travailles.
        questions:
            -   id: q01
                type: texte
                enonce: Choisis dans le document 2 ce qui te servira le plus au travail, et explique pourquoi.
                aide: Lis la liste du document 2, choisis une chose, puis dis à quoi elle te servira à l’écurie.
    -   id: a04
        titre: Pour aller plus loin
        defi: true
        facultatif: true
        contenu:
            -   type: paragraphe
                texte: En CAPa 1, tu as fait une présentation de stage.
        questions:
            -   id: q01
                type: texte
                enonce: Qu’as-tu le mieux réussi à l’oral ?
                aide: 'Repense à ton oral de CAPa 1 : qu’as-tu le mieux réussi (parler fort, ne pas lire, le diaporama) ?'
    -   id: a05
        titre: Conclusion de ton travail
        conclusion: true
        transition: Ton point de départ est fait. Il reste à répondre au problème de départ.
        questions:
            -   id: q01
                type: texte
                enonce: 'Réponds au problème du jour : que sais-tu déjà faire en TIM, et que vas-tu apprendre cette année ?'
                aide: Dis ce que tu sais déjà faire (Writer, Calc, Impress) et ce que tu vas apprendre cette année.
retenir:
    - 'CAPa 1 : bases ; CAPa 2 : aller plus loin.'
    - Un objectif personnel.
sources:
    -   type: lien
        titre: ChloroFil — CAPa, document d’accompagnement du module MG1 (TIC)
        url: https://chlorofil.fr/fileadmin/user_upload/02-diplomes/referentiels/secondaire/capa/capa-da-MG1-012015.pdf
