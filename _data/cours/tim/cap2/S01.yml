titre: Découverte du cours de TIM et prise en main
theme: TIM — Découverte du cours de TIM et prise en main
problematique: Découverte du cours de TIM et prise en main
pourquoi: Les objectifs et le lien avec les situations concrètes sont présentés au début du cours ci-dessous.
application: Utilise les situations et les documents de la séance pour mettre les notions en pratique.
lien_precedent: Reprends les méthodes des séances précédentes si elles te sont utiles ; les rappels du cours t’accompagnent.
objectifs:
    connaissances: []
    competences: []
activites:
    - id: a02
      titre: 1. Présentation du cours de TIM
      contenu:
          - type: paragraphe
            texte: Cette année, le cours de TIM sera principalement basé sur la pratique.
          - type: paragraphe
            texte: "Vous utiliserez les outils numériques pour réaliser des activités proches de situations que vous pouvez rencontrer dans votre vie quotidienne ou professionnelle : organiser des documents, suivre des informations concernant des chevaux, réaliser des tableaux, préparer des plannings, rechercher des informations, envoyer des documents ou encore communiquer avec une entreprise."
          - type: paragraphe
            texte: Pendant les séances, vous aurez régulièrement des missions à réaliser.
          - type: paragraphe
            texte: "Le principe est simple :"
          - type: liste
            elements:
                - vous essayez ;
                - vous avez le droit de vous tromper ;
                - vous cherchez une solution ;
                - vous demandez de l'aide lorsque vous en avez besoin ;
                - vous améliorez progressivement votre travail.
          - type: paragraphe
            texte: Le but n'est pas de tout savoir immédiatement, mais de devenir progressivement plus autonome avec un ordinateur.
      questions: []
    - id: a03
      titre: 2. Faisons connaissance
      contenu:
          - type: paragraphe
            texte: Avant de commencer, nous allons prendre quelques minutes pour discuter de votre expérience et de votre projet.
          - type: paragraphe
            texte: "Réfléchissez notamment aux questions suivantes :"
      questions:
          - id: q01
            type: texte
            enonce: Qui êtes-vous ?
          - id: q02
            type: texte
            enonce: D'où venez-vous ?
          - id: q03
            type: texte
            enonce: Pourquoi avez-vous choisi la MFR de Saint-Flour ?
          - id: q04
            type: texte
            enonce: Où avez-vous réalisé votre dernier stage ?
          - id: q05
            type: texte
            enonce: Dans quel type de structure avez-vous travaillé ?
          - id: q06
            type: texte
            enonce: Quelles étaient vos principales activités ?
          - id: q07
            type: texte
            enonce: Qu'aimez-vous particulièrement dans le travail avec les chevaux ?
          - id: q08
            type: texte
            enonce: Qu'est-ce qui vous semble le plus difficile ?
          - id: q09
            type: texte
            enonce: Que souhaitez-vous faire après votre CAP ?
          - id: q10
            type: texte
            enonce: Quels outils numériques avez-vous vus ou utilisés pendant vos stages ?
    - id: a04
      titre: 3. Comment allons-nous travailler ?
      contenu:
          - type: paragraphe
            texte: Au début de la plupart des séances, vous créerez un document de travail.
          - type: paragraphe
            texte: "Ce document pourra servir :"
          - type: liste
            elements:
                - de cahier ;
                - de brouillon ;
                - pour répondre aux questions ;
                - pour faire des essais ;
                - pour conserver une trace de vos manipulations.
          - type: paragraphe
            texte: Ce document sera généralement rendu à la fin du cours.
          - type: paragraphe
            texte: Il n'a pas besoin d'être parfait pour être rendu. Un travail incomplet permet également de voir ce que vous avez essayé et les difficultés que vous avez rencontrées.
      questions: []
    - id: a05
      titre: "4. Mission : préparer votre espace de travail"
      contenu:
          - type: paragraphe
            texte: Nous allons commencer par organiser votre espace personnel afin de pouvoir retrouver facilement votre travail pendant toute l'année.
          - type: titre
            texte: Consigne
          - type: paragraphe
            texte: "Dans votre espace personnel, créez un dossier nommé :"
          - type: paragraphe
            texte: nom_prenom
          - type: paragraphe
            texte: "À l'intérieur de ce dossier, créez un sous-dossier nommé :"
          - type: paragraphe
            texte: CAPA2_TIM
          - type: paragraphe
            texte: "À l'intérieur de ce dossier, créez les trois dossiers suivants :"
          - type: liste
            elements:
                - 01_Cours
                - 02_Travaux
                - 03_Documents
          - type: paragraphe
            texte: "Dans le dossier 02_Travaux, créez ensuite un dossier nommé :"
          - type: paragraphe
            texte: S01
          - type: paragraphe
            texte: Vous utiliserez ce dossier pour enregistrer votre travail d'aujourd'hui.
      questions: []
    - id: a06
      titre: "5. Mission : présenter votre expérience avec les chevaux"
      contenu:
          - type: paragraphe
            texte: Ouvrez LibreOffice Writer et créez un nouveau document.
          - type: paragraphe
            texte: "Enregistrez immédiatement votre document dans le dossier S01 sous le nom :"
          - type: paragraphe
            texte: CAPA2_S01_NOM_Prenom
          - type: paragraphe
            texte: Votre document va vous permettre de vous présenter tout en réalisant quelques premières manipulations.
          - type: titre
            texte: Partie 1 — Moi et les chevaux
          - type: paragraphe
            texte: "Ajoutez le titre :"
          - type: paragraphe
            texte: Mon expérience dans le monde du cheval
          - type: paragraphe
            texte: "Puis rédigez quelques phrases pour présenter :"
          - type: liste
            elements:
                - votre expérience avec les chevaux ;
                - ce que vous aimez particulièrement faire ;
                - une activité avec laquelle vous êtes maintenant à l'aise ;
                - une activité que vous trouvez encore difficile.
          - type: titre
            texte: Partie 2 — Mon dernier stage
          - type: paragraphe
            texte: Ajoutez un sous-titre puis présentez votre dernier stage.
          - type: paragraphe
            texte: "Indiquez au minimum :"
          - type: liste
            elements:
                - le nom ou le type de structure ;
                - sa localisation ;
                - les principales activités réalisées ;
                - une tâche que vous êtes maintenant capable de réaliser seul.
          - type: titre
            texte: Partie 3 — Mon projet
          - type: paragraphe
            texte: Ajoutez un nouveau sous-titre et expliquez en quelques lignes ce que vous aimeriez faire après votre CAP.
          - type: paragraphe
            texte: "Vous pouvez parler :"
          - type: liste
            elements:
                - de la poursuite de vos études ;
                - d'un métier qui vous intéresse ;
                - d'un projet professionnel ;
                - ou simplement de ce que vous aimeriez découvrir.
      questions: []
    - id: a07
      titre: "6. Mission : améliorer votre document"
      contenu:
          - type: paragraphe
            texte: Votre document contient maintenant des informations. Il faut le rendre plus facile et plus agréable à lire.
          - type: paragraphe
            texte: "Votre document doit comporter :"
          - type: liste
            elements:
                - un titre clairement identifiable ;
                - au moins deux sous-titres ;
                - du texte en gras ;
                - une liste à puces ;
                - un tableau ;
                - une image correctement dimensionnée.
          - type: titre
            texte: Créer le tableau
          - type: paragraphe
            texte: "Ajoutez un tableau contenant les informations suivantes :"
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Information
                - ""
            lignes:
                - - Type de structure
                  - ""
                - - Nombre approximatif de chevaux
                  - ""
                - - Activité principale
                  - ""
                - - Durée du stage
                  - ""
            suite:
                - type: titre
                  texte: Ajouter une image (vous pouvez utiliser les liens ci-dessous, si vous le souhaitez)
                - type: liste
                  elements:
                      - Cheval 1
                      - Cheval 2
                      - Cheval 3
                      - Centre équestre 1
                      - Centre équestre 2
                - type: lien
                  titre: Cheval 1
                  url: https://tifsec.github.io/mfr/capa2/images/cheval_1.png
                - type: lien
                  titre: Cheval 2
                  url: https://tifsec.github.io/mfr/capa2/images/cheval_2.png
                - type: lien
                  titre: Cheval 3
                  url: https://tifsec.github.io/mfr/capa2/images/cheval_3.png
                - type: lien
                  titre: Centre équestre 1
                  url: https://tifsec.github.io/mfr/capa2/images/centre_equestre_1.png
                - type: lien
                  titre: Centre équestre 2
                  url: https://tifsec.github.io/mfr/capa2/images/centre_equestre_2.png
                - type: paragraphe
                  texte: Ajoutez dans votre document une image représentant un cheval ou une structure équestre.
                - type: paragraphe
                  texte: L'image doit être suffisamment grande pour être visible, mais elle ne doit pas prendre toute la page.
                - type: paragraphe
                  texte: "Attention : votre document doit rester lisible et correctement organisé."
    - id: a08
      titre: "7. Mission : enregistrer et retrouver son travail"
      contenu:
          - type: paragraphe
            texte: "Lorsque votre document est terminé :"
          - type: etapes
            elements:
                - enregistrez-le ;
                - fermez LibreOffice Writer ;
                - retrouvez votre fichier dans votre dossier S01 ;
                - ouvrez à nouveau le document ;
                - modifiez une phrase ;
                - enregistrez à nouveau votre travail.
          - type: paragraphe
            texte: Vous devez être capable de retrouver votre document sans avoir besoin de le recréer.
      questions: []
    - id: a09
      titre: "8. Mission : créer une version PDF"
      contenu:
          - type: paragraphe
            texte: Votre document doit maintenant être transformé en PDF.
          - type: paragraphe
            texte: "Exportez votre travail afin d'obtenir deux fichiers :"
          - type: liste
            elements:
                - CAPA2_S01_NOM_Prenom.odt
                - CAPA2_S01_NOM_Prenom.pdf
          - type: paragraphe
            texte: Les deux fichiers doivent se trouver dans votre dossier S01.
      questions: []
    - id: a10
      titre: 9. Défi — Pour ceux qui ont terminé
      contenu:
          - type: paragraphe
            texte: Si vous avez terminé toutes les missions précédentes, ouvrez LibreOffice Calc.
          - type: paragraphe
            texte: "Reproduisez le tableau suivant :"
      questions:
          - id: q01
            type: tableau
            enonce: Complète le tableau ci-dessous.
            colonnes:
                - Cheval
                - Âge
                - Ration matin
                - Ration soir
                - Ration quotidienne
            lignes:
                - - Volcan
                  - "12"
                  - "2"
                  - "2"
                  - ""
                - - Jazz
                  - "8"
                  - 2,5
                  - 2,5
                  - ""
                - - Nala
                  - "16"
                  - 1,5
                  - "2"
                  - ""
            suite:
                - type: paragraphe
                  texte: Essayez ensuite de trouver comment faire calculer automatiquement la ration quotidienne de chaque cheval.
                - type: paragraphe
                  texte: Essayez avant de demander la solution. Vous avez le droit de tester plusieurs méthodes.
    - id: a11
      titre: 10. Rendu du travail
      contenu:
          - type: paragraphe
            texte: Avant de quitter votre poste, vérifiez que votre fichier porte bien le nom demandé.
          - type: paragraphe
            texte: "Le fichier à rendre est :"
          - type: paragraphe
            texte: CAPA2_S01_NOM_Prenom.pdf
          - type: paragraphe
            texte: "Avant de rendre votre travail, vérifiez également que :"
          - type: liste
            elements:
                - votre document possède un titre ;
                - les différentes parties sont clairement visibles ;
                - votre tableau est complété ;
                - votre image est correctement dimensionnée ;
                - vous avez enregistré votre document original ;
                - vous avez créé la version PDF.
      questions: []
    - id: a12
      titre: 11. Bilan de la séance
      contenu:
          - type: paragraphe
            texte: "Avant de terminer, réfléchissez quelques instants :"
      questions:
          - id: q01
            type: texte
            enonce: Qu'est-ce qui vous a semblé facile aujourd'hui ?
          - id: q02
            type: texte
            enonce: Qu'est-ce qui vous a posé problème ?
          - id: q03
            type: texte
            enonce: Y a-t-il quelque chose que vous aimeriez apprendre à faire avec un ordinateur cette année ?
            suite:
                - type: paragraphe
                  texte: Ce premier travail ne sert pas à vérifier si vous savez déjà tout faire. Il permet surtout de voir ce que vous maîtrisez déjà et ce que nous devrons travailler ensemble cette année.
bilan: Relis tes réponses et vérifie les points demandés dans le bilan du cours. Tu peux revenir sur ton travail tant que le professeur ne l’a pas clôturé.
ressources:
    - type: paragraphe
      texte: Réalise les manipulations dans le logiciel demandé. Conserve tes fichiers sur ton espace habituel. Le site enregistre seulement tes réponses écrites, tes résultats, tes formules et tes démarches ; aucun fichier n’est téléversé.
introduction:
    - type: titre
      texte: Objectifs de la séance
    - type: liste
      elements:
          - Comprendre le fonctionnement du cours de TIM cette année.
          - Faire le point sur son expérience avec les outils numériques.
          - Créer et organiser son espace de travail.
          - Créer, enregistrer et retrouver un document.
          - Utiliser les principales fonctions d'un traitement de texte.
          - Exporter un document au format PDF.
reperes_officiels:
    - type: paragraphe
      texte: Dans cette page du ministère, retrouve le programme ou le référentiel de ta formation. Les objectifs précis étudiés aujourd’hui sont indiqués dans le cours.
    - type: lien
      titre: Consulter les programmes et attendus officiels
      url: https://chlorofil.fr/diplomes/secondaire/capa
