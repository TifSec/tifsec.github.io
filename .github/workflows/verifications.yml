name: Vérifications

# Lance la compilation Jekyll et tous les tests à chaque envoi sur une branche
# de travail et à chaque demande de fusion. Ne publie rien et ne touche pas à Supabase.
# Lancement manuel uniquement tant que les derniers tests périmés ne sont pas corrigés
# (chaque échec envoie un e-mail). Le déclenchement à chaque envoi sera réactivé ensuite.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verifications-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-et-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      # Gemfile.lock a été créé sous Windows (plateforme x64-mingw-ucrt seulement) :
      # on ajoute la plateforme Linux le temps de la vérification, sans modifier le dépôt.
      - name: Jekyll
        run: |
          gem install bundler -v 4.0.22 --no-document || gem install bundler --no-document
          bundle lock --add-platform x86_64-linux
          bundle install --jobs 4

      - name: Compiler le site
        run: bundle exec jekyll build

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dépendances des tests
        working-directory: _checks
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Tests
        run: |
          set +e
          node --experimental-vm-modules --test --test-reporter=tap _checks/*.test.mjs > tests.tap 2>&1
          status=$?
          grep -E '^# (tests|pass|fail)' tests.tap | tee -a "$GITHUB_STEP_SUMMARY"
          # Chaque test en échec devient une annotation lisible dans le résumé de l'exécution.
          # Une annotation par tranche (GitHub limite le nombre d'annotations par étape).
          node -e '
            const lines = require("fs").readFileSync("tests.tap", "utf8").split("\n");
            const out = [];
            lines.forEach((l, i) => { if (/^\s*not ok/.test(l)) {
              const detail = lines.slice(i + 1, i + 25).filter(x => /error:|expected:|actual:|location:/.test(x)).slice(0, 4).map(x => "    " + x.trim()).join("\n");
              out.push(l.trim() + "\n" + detail); } });
            let chunk = "";
            const flush = () => { if (chunk) console.log("::error title=Tests en échec::" + chunk.replace(/%/g, "%25").replace(/\r/g, "").replace(/\n/g, "%0A")); chunk = ""; };
            for (const item of out) { if ((chunk + item).length > 3500) flush(); chunk += item + "\n"; }
            flush();'
          exit $status

      - name: Contrôle de publication (aucun corrigé, secret ni dossier interne dans _site)
        run: node _checks/check-publication.mjs
