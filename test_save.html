<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test sauvegarde élève</title>
</head>
<body>

<h1>Test sauvegarde</h1>

<section id="student-area" hidden>

    <h2 id="welcome"></h2>

    <p>
        Explique comment tu calculerais 25 % de 80.
    </p>

    <textarea
        id="answer"
        rows="6"
        cols="60"
        placeholder="Écris ta réponse ici..."
    ></textarea>

    <p id="save-status">
        Chargement...
    </p>

    <button id="logout-button">
        Se déconnecter
    </button>

</section>

<section id="not-connected" hidden>

    <p>
        Tu dois d'abord te connecter.
    </p>

    <a href="/auth/index.html">
        Aller à la page de connexion
    </a>

</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/student-save.js"></script>

</body>
</html>
