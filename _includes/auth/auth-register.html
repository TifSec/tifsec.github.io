<!-- ========== CRÉATION DE COMPTE ========== -->
<section id="create-account" class="auth-panel">
    <h2>Première connexion</h2>
    <p class="auth-description">
        Crée ton espace personnel.
        Ton travail pourra ensuite être sauvegardé automatiquement.
    </p>
    <!-- ========== IDENTITÉ ========== -->
    <div class="name-grid">
        <div>
            <label for="register-prenom">Prénom</label>
            <input type="text" id="register-prenom" autocomplete="given-name">
        </div>
        <div>
            <label for="register-nom">Nom</label>
            <input type="text" id="register-nom" autocomplete="family-name">
        </div>
    </div>
    <!-- ========== TYPE DE COMPTE ========== -->
    <label for="register-role">Type de compte</label>
    <select id="register-role">
        <option value="student">Élève</option>
    </select>
    <!-- ========== ÉTABLISSEMENT ========== -->
    <div id="register-school-wrapper">
        <label for="register-school">Établissement</label>
        <select id="register-school">
            <option value="">Choisis ton établissement</option>
            {% for school in site.data.classes %}
            <option value="{{ school[0] }}">{{ school[1].nom }}</option>
            {% endfor %}
        </select>
    </div>
    <!-- ========== CLASSE ========== -->
    <div id="register-class-wrapper">
        <label for="register-classe">Classe</label>
        <select id="register-classe" disabled>
            <option value="">Choisis d'abord ton établissement</option>
            {% for school in site.data.classes %}
            {% for classe in school[1].classes %}
            <option value="{{ classe.id }}" data-school="{{ school[0] }}" hidden>
                {{ classe.nom }}
            </option>
            {% endfor %}
            {% endfor %}
        </select>
    </div>
    <!-- ========== IDENTIFIANT ========== -->
    <label for="register-username">Identifiant</label>
    <input type="text" id="register-username" autocomplete="username" placeholder="ex. jean.dupont">
    <p class="field-help">Choisis un identifiant simple que tu pourras retenir.</p>
    <!-- ========== MOT DE PASSE ========== -->
    <label for="register-password">Mot de passe</label>
    <input type="password" id="register-password" autocomplete="new-password" placeholder="8 caractères minimum">
    <button type="button" id="register-button" class="button button-secondary">Créer mon espace</button>
</section>
