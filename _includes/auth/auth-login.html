<!-- ========== FORMULAIRE DE CONNEXION ========== -->
<form id="login" class="auth-panel">
    <h2>Connexion</h2>
    <p class="auth-description">
        Tu as déjà un compte ?
        Connecte-toi pour reprendre ton travail.
    </p>
    <label for="login-username">Identifiant ou adresse e-mail</label>
    <input type="text" id="login-username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="ex. jean.dupont" required>
    <label for="login-password">Mot de passe</label>
    <input type="password" id="login-password" autocomplete="current-password" placeholder="Ton mot de passe" required>
    <button type="submit" id="login-button" class="button button-primary">Se connecter</button>
</form>
