<!-- ========== FORMULAIRE DE CONNEXION ========== -->
<section id="login" class="auth-panel">
    <h2>Connexion</h2>
    <p class="auth-description">
        Tu as déjà un compte ?
        Connecte-toi pour reprendre ton travail.
    </p>
    <label for="login-username">Identifiant</label>
    <input type="text" id="login-username" autocomplete="username" placeholder="ex. jean.dupont">
    <label for="login-password">Mot de passe</label>
    <input type="password" id="login-password" autocomplete="current-password" placeholder="Ton mot de passe">
    <button type="button" id="login-button" class="button button-primary">Se connecter</button>
</section>
