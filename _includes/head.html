<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="{{ page.description | default: site.description | escape }}">

    <title>
        {% if page.title %}
        {{ page.title }} | {{ site.title }}
        {% else %}
        {{ site.title }}
        {% endif %}
    </title>

    <link rel="icon" href="{{ '/favicon.png' | relative_url }}" type="image/png">

    <link rel="stylesheet" href="{{ '/assets/css/variables.css' | relative_url }}">

    <link rel="stylesheet" href="{{ '/assets/css/base.css' | relative_url }}">

    <link rel="stylesheet" href="{{ '/assets/css/body.css' | relative_url }}">

    <link rel="stylesheet" href="{{ '/assets/css/header.css' | relative_url }}">

    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

    <link rel="stylesheet" href="{{ '/assets/css/footer.css' | relative_url }}">
</head>
