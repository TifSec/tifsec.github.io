<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Espace professeur</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        main {
            width: min(100% - 32px, 1000px);
            margin: 0 auto;
            padding: 40px 0;
        }

        .prof-header {
            margin-bottom: 32px;
        }

        .prof-header h1 {
            margin: 0 0 8px;
            font-size: 2rem;
        }

        .prof-header p {
            margin: 0;
            color: #6b7280;
        }

        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .subject-card {
            display: block;
            padding: 24px;
            background: white;
            border-radius: 14px;
            text-decoration: none;
            color: inherit;
            border: 1px solid #e5e7eb;
            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        .subject-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .subject-icon {
            font-size: 2rem;
            margin-bottom: 16px;
        }

        .subject-card h2 {
            margin: 0 0 8px;
            font-size: 1.25rem;
        }

        .subject-card p {
            margin: 0;
            color: #6b7280;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<main>

    <header class="prof-header">
        <h1>Espace professeur</h1>

        <p>
            Choisis la matière que tu souhaites consulter.
        </p>
    </header>

    <section class="subject-grid">

        <a
            href="/prof/maths/"
            class="subject-card">

            <div class="subject-icon">
                ∑
            </div>

            <h2>
                Mathématiques
            </h2>

            <p>
                Accéder aux cours de mathématiques
                et aux parties professeur.
            </p>

        </a>

        <a
            href="/prof/tim/"
            class="subject-card">

            <div class="subject-icon">
                💻
            </div>

            <h2>
                TIM
            </h2>

            <p>
                Accéder aux cours TIM
                et aux parties professeur.
            </p>

        </a>

        <a
            href="/prof/techno/"
            class="subject-card">

            <div class="subject-icon">
                ⚙
            </div>

            <h2>
                Technologie
            </h2>

            <p>
                Accéder aux cours de technologie
                et aux parties professeur.
            </p>

        </a>

    </section>

    <button
        id="logout-button"
        class="logout-button">

        Se déconnecter

    </button>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/eleve.js"></script>

</body>
</html>
