<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programme Mathématiques 2de</title>
    <link rel="stylesheet" href="../../style.css">
    <script src="../../script.js"></script>
</head>
<body data-course-id="mfr-seconde">

        <button class="menu-toggle" onclick="toggleMenu()" aria-label="Ouvrir le menu">☰</button>
    </header>

    <!-- Menu hamburger sur la gauche -->

            <ul>
                <!-- CALENDRIER -->
                <li><a href="#" onclick="showSession('calendar')">Calendrier de cours</a></li>

        <section id="calendar" class="content-section">

            <div id="course-status"></div>

            <table>

                <tbody id="calendar-body"></tbody>
